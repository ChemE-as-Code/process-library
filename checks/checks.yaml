# Engineering-step gates. Schema: `plantcode schema checks`. Run: `plantcode check`.
checks:
  - id: design-basis
    title: Design basis exists
    stage: concept
    kind: files
    files: [process/design-basis.yaml]
  - id: concept-lists
    title: Equipment, line and instrument lists and design decisions exist
    stage: concept
    kind: files
    files: [DESIGN.md, equipment/equipment-list.yaml, piping/line-list.yaml, control/instrument-list.yaml]
  - id: assumptions-marked
    title: Assumed values are marked ASSUMED in the design basis
    stage: concept
    kind: command
    command: grep -q ASSUMED process/design-basis.yaml
  # Process links (blocks, steps, streams -> equipment, lines, instruments, sheets): reported at
  # concept, required at basic. Calculated stream properties must be current at basic.
  - id: process-links-concept
    title: Process links resolve (reported only)
    stage: concept
    kind: process-links
    level: warning
  - id: process-links
    title: Every process link resolves against the lists and sheets
    stage: basic
    kind: process-links
    level: error
  # Mass balances clean and the generated sheets current. Not-evaluable balances (component
  # balances of the air side and waste streams without a composition; the cold-box internals
  # without flows) stay info: see reviews/2026-10-19-process-bfd-pfd.md.
  - id: process-balances
    title: No block or step mass balance error; BFD and PFD current
    stage: concept
    kind: validate
    generated: [bfd, pfd]           # fails until both sheets are declared and built
    fail_on: warning
    rules: [plantcode.process-balance, plantcode.process-schema, plantcode.generated-*]
  - id: process-calculated-current
    title: No stale calculated stream property
    stage: basic
    kind: validate
    fail_on: warning
    rules: [plantcode.process-calculated-stale]
  # ---- ASU-specific gates
  - id: o2-safety-philosophy
    title: "O2 service: materials/cleaning and no-oil decisions recorded"
    stage: concept
    kind: command
    command: grep -q '^## D-.*Oxygen service' DESIGN.md && grep -q '^## D-.*oil' DESIGN.md
  - id: hydrocarbon-protection
    title: "Hydrocarbon accumulation protection: decision, sump analyzer and LOX purge loop"
    stage: concept
    kind: command
    command: "grep -q '^## D-.*Hydrocarbon' DESIGN.md && grep -q 'tag: AIA-3103,' control/instrument-list.yaml && grep -q 'tag: FIC-3111,' control/instrument-list.yaml && grep -q 'tag: AIA-4121,' control/instrument-list.yaml"
  - id: relief-philosophy
    title: Relief, vent and blowdown philosophy recorded
    stage: concept
    kind: command
    command: grep -q '^## D-.*Relief' DESIGN.md && grep -q '^## D-.*Isolation' DESIGN.md
  - id: relief-case-list
    title: "Relief case list: each relief device with its governing case, LP column PSV included"
    stage: concept
    kind: command
    command: "grep -q '^## 4 Relief case list' DESIGN.md && grep -q 'PSV-3114' DESIGN.md"
  - id: o2-safety-review
    title: Oxygen safety review (EIGA Doc 13/33/65 checklist) recorded
    stage: basic
    kind: files
    files: ["reviews/2*o2-safety*.md"]
  - id: hydrocarbon-on-pid
    title: Sump hydrocarbon analyzer and LOX purge drawn on the cold box sheet
    stage: basic
    kind: command
    command: grep -q 'AIA' pid/P-03.xml && grep -q '3111' pid/P-03.xml
  - id: relief-on-pid
    title: Relief devices drawn on the cold box and product sheets
    stage: basic
    kind: command
    command: grep -q 'SafetyValve' pid/P-01.xml && grep -q 'SafetyValve' pid/P-03.xml && grep -q 'SafetyValve' pid/P-04.xml
  - id: pids-valid
    title: Every P&ID and list validates
    stage: basic
    kind: validate
  - id: pids-exist
    title: At least one P&ID sheet
    stage: basic
    kind: files
    files: ["pid/*.xml"]
  - id: design-review
    title: A design review is recorded
    stage: basic
    kind: files
    files: ["reviews/2*.md"]  # dated review records, not the README
