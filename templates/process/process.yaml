# Process Atlas manifest. Copy this folder to processes/<your-id>/ and edit.
# Schema: schemas/process.schema.json (cheme-as-code/process/v1). Every slug used under
# chemistry must exist in chemicals/chemicals.yaml; add new chemicals there in the same change.
schema: cheme-as-code/process/v1
id: my-process                  # = folder name; lowercase slug; never rename once listed
title: Short descriptive process title
summary: >-
  One or two sentences for cards and search results: what goes in, what comes out, at what scale.
# description: |                # optional longer Markdown for the process page
families: [example-family]      # e.g. ammonia, methanol, air-separation
keywords: []
maturity: concept               # concept | screening | basic-engineering | detail-engineering | operating-reference
validation:
  status: unreviewed            # unreviewed | internally-reviewed | peer-reviewed | industry-validated
chemistry:
  inputs:
    - {chemical: water, role: feedstock}
  outputs:
    - {chemical: hydrogen, role: main-product}
  utilities:
    - {chemical: electricity, role: utility}
# basis: {capacity: "1000 t/d product", operating_hours_per_year: 8000}
# lca: {source: auto}           # auto: read lca/ of a plantcode project; none: no LCA
# references:
#   - {title: "Author et al. (2024) Title", doi: 10.xxxx/xxxxx}
# maintainers:
#   - {name: Your Name, orcid: 0000-0000-0000-0000}
# repository: {url: "https://github.com/ChemE-as-Code/process-library", path: processes/my-process, access: private}
