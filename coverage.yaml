# Coverage roadmap of the process library: which products and processes, in which order, with
# which technology variants. Schema: schemas/coverage.schema.json; reading guide and criteria:
# docs/coverage.md. The catalog build writes coverage.json from it (covering processes and how
# many of the top `summary_top` entries are covered, at which tiers).
#
# Rules: production volumes are orders of magnitude only (Mt/a bands), each with its source;
# "n/a" means not yet sourced, never "small". Relevance is a qualitative judgement from the
# sources named. Open sources are citations only: nothing is copied from them. `tier` is the
# planned entry tier: 0 stoichiometric, 1 sourced conceptual data, 2 flowsheet.
# `next: true` marks the next batch: the working plan accepted on 2026-10-25 (process-library#47).
# It is a plan, not a commitment; a change to it is a change to this file.
schema: cheme-as-code/coverage/v1
summary_top: 50

criteria:
  - {id: volume, title: Global production volume (order of magnitude), note: "bands of Mt/a from the cited statistic; n/a until sourced"}
  - {id: relevance, title: GHG and other burdens, note: "high where the product is a large CO2, N2O or energy burden in the cited sources (IPCC 2006 Vol. 3, IEA reports)"}
  - {id: reach, title: Value-chain reach, note: "how many other entries it feeds (feeds:), and whether the Atlas graph needs it to link processes"}
  - {id: sources, title: Open sources, note: "EU BREFs, IPCC guidelines, IEA reports and peer-reviewed designs that make Tier 1 or 2 possible without licensed data"}

sources:
  usgs-mcs-2024: "U.S. Geological Survey (2024) Mineral Commodity Summaries 2024 (world production tables by commodity)"
  iea-ammonia-2021: "IEA (2021) Ammonia Technology Roadmap"
  iea-ghr-2023: "IEA (2023) Global Hydrogen Review 2023"
  iea-petchem-2018: "IEA (2018) The Future of Petrochemicals (primary chemicals production)"
  plasticseurope-2023: "Plastics Europe (2023) Plastics - the fast Facts 2023"
  ipcc-2006-v3: "IPCC (2006) Guidelines for National Greenhouse Gas Inventories, Vol. 3 Industrial Processes and Product Use, ch. 3 Chemical industry and ch. 4 Metal industry; 2019 Refinement"
  bref-lvic-aaf: "European Commission JRC (2007) BREF Large Volume Inorganic Chemicals - Ammonia, Acids and Fertilisers (LVIC-AAF)"
  bref-lvic-s: "European Commission JRC (2007) BREF Large Volume Inorganic Chemicals - Solids and Others (LVIC-S)"
  bref-sic: "European Commission JRC (2007) BREF Speciality Inorganic Chemicals (SIC)"
  bref-lvoc: "European Commission JRC (2017) BREF Large Volume Organic Chemical Industry (LVOC)"
  bref-cak: "European Commission JRC (2014) BREF Production of Chlor-alkali (CAK)"
  bref-pol: "European Commission JRC (2007) BREF Production of Polymers (POL)"
  bref-ref: "European Commission JRC (2015) BREF Refining of Mineral Oil and Gas (REF)"
  bref-clm: "European Commission JRC (2013) BREF Production of Cement, Lime and Magnesium Oxide (CLM)"
  bref-is: "European Commission JRC (2013) BREF Iron and Steel Production (IS)"
  bref-nfm: "European Commission JRC (2017) BREF Non-Ferrous Metals Industries (NFM)"
  bref-lcp: "European Commission JRC (2017) BREF Large Combustion Plants (LCP)"
  bref-cww: "European Commission JRC (2016) BREF Common Waste Water and Waste Gas Treatment in the Chemical Sector (CWW)"
  bref-wi: "European Commission JRC (2019) BREF Waste Incineration (WI)"
  bref-wt: "European Commission JRC (2018) BREF Waste Treatment (WT)"
  idaes-hda: "IDAES process modelling framework, toluene hydrodealkylation (HDA) flowsheet example (open source)"
  euro-chlor: "Euro Chlor, eco-profile and PCR methodology for chlor-alkali products (sector rule, decision 5 of the system model)"
  plasticseurope-eco: "Plastics Europe, Eco-profiles and Environmental Product Declarations methodology (sector rule for steam cracker products)"
  hischier-2005: "Hischier et al. (2005) Int J LCA 10:59, screening estimates for chemicals (Tier 0 defaults, as reported in)"

