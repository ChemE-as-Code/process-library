# Cable tray rules. Schema: `plantcode schema trays`. Skill electrical-cabling.
# Every value ASSUMED (DESIGN.md D-036) until the project's electrical standard replaces it.
rules:
  # ladder trays up to 1200 mm: the 6.6 kV MAC and GOX compressor cables share the PR1 power
  # tray with the LV feeders over the first bays
  widths_mm: [150, 300, 450, 600, 900, 1200]
  depth_mm: 100
  fill_max_power: 0.3          # single-layer power cables with spacing (ASSUMED)
  fill_max_instrument: 0.4
  separation_m: 0.3            # power to instrument tray without a metal divider (EN 50174-2 practice, ASSUMED)
  # tray tiers: plantcode's default, tier_gap_m above each rack's top pipe tier on steel of
  # its own, clear of the large lines that stand above the top tier
  tier_gap_m: 2.0
  # power trays 0.3 of the rack width to one side of the centreline, instrument trays to the
  # other (the 8 m PR1 has room); where the PR2 instrument tray passes under the PR1 power tray
  # at the junction (0.27 m clear) a steel cover plate separates them (accepted, D-036)
  lane_fraction: 0.3
notes: >-
  Trays run on their own tier above the pipes, power to one side of the rack centreline and
  instrument trays to the other (D-036).
