# butadiene-1's own exchange overrides for the Atlas LCI build (ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. The crude C4 stays a reported gap: its only
# Atlas producer makes another grade, and the shared vocabulary has no entry.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:steam": {use: steam-heat, source: "steam counted as heat delivered (kWh, final energy of the source), as hda-1 does"}
  "feed:crude-c4":
    atlas: false
    source: "Naphtha-cracker C4 cut, 39.3 wt% butadiene. ethylene-1's product:CRUDEC4 is an ethane-cracker cut of about 80 mol% butadiene, so per kg it is another grade and would misstate the feed mass; a naphtha cracker or a cut-specific market is the supplier to link once one exists."
