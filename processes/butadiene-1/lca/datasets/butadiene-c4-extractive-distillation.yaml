# Tier 1 form, process-library#313 pattern without a flowsheet. Every amount is the formula of its parameters;
# core's validator re-checks each. Facts and numbers from open sources, in our own form.
# The lumped formulas in generation.formulas follow the parameters: recompute them when one changes.
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: butadiene-c4-extractive-distillation
title: 1,3-Butadiene by extractive distillation of a steam-cracker crude C4 cut
description: Per 1 t of 1,3-butadiene, gate-to-gate, from the crude C4 cut of a naphtha steam cracker. Raffinate-1
  (butenes and butanes) and the purge of C3 and C4 acetylenes to fuel use are co-products. Feed from a typical
  cut and a recovery bound; utilities as Western European averages.
basis: 1000 kg of 1,3-butadiene
boundary: 'gate-to-gate: extractive distillation with a polar solvent, solvent degassing, propyne and finishing
  columns; crude C4, steam and power from outside'
technology: continuous extractive distillation with a polar solvent (NMP in the BASF process, also acetonitrile
  or DMF); the energy data are for C4 separation without the solvent stated; butadiene by dehydrogenation of
  butane or butenes is not modelled
geography:
  description: 'Mixed: Western European energy averages, a US typical cut and US facility emissions; no single
    site.'
classification:
  isic: '2011'
system_boundary:
  included:
  - crude C4 feed
  - electricity and steam
  - co-product raffinate-1
  - co-product acetylenes purge, to fuel use outside the unit
  - butadiene to air from process vents and wastewater
  excluded:
  - 'TODO solvent make-up (NMP or another polar solvent): no open figure read; the licensor calls the losses
    low'
  - TODO cooling water, nitrogen, polymerisation inhibitor (e.g. TBC)
  - 'TODO wastewater volume and its organics: the EPA document gives only the butadiene released from it'
  - 'TODO equipment leaks: EPA 1996, Table 4-5 note, gives 407 Mg/a over 9 US facilities (1989), not per t'
  - 'C5 and heavier hydrocarbons in the feed: not in the typical cut used'
  - 'selective hydrogenation of the acetylenes (an option of some plants): not modelled'
  - storage emissions (pressure storage, negligible per EPA 1996, p. 4-11)
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: RER
year: 2006
valid_until: 2011
time:
  start: 1984
  description: 'Energy: IEA estimate of the Western European average after Schyns 2006; emissions: US facility
    data of 1984; composition: a typical cut in a 1996 document. valid_until is the reference year + 5 (system-model
    section 6), so it has already lapsed.'
modelling:
  principle: attributional
  multifunctionality: 'unallocated in the exchanges: butadiene, raffinate-1 and the acetylenes purge (a fuel
    exported to the site, so a co-product, docs/system-model.md section 2) are listed as products; the build
    allocates by mass (see allocation)'
allocation:
  method: mass
  coproducts:
  - butadiene
  - c4-raffinate
  - c4-purge
  deviation: No sourced prices, so the WBCSD price ratio of butadiene, raffinate-1 and the purge cannot be computed.
    All three leave one physical separation as C3 and C4 hydrocarbons; mass is the preliminary choice. The purge
    goes to fuel use, so it is an exported fuel and a co-product (docs/system-model.md section 2), not an
    unlinked output; energy allocation (LHV) is not used because butadiene and raffinate-1 are not fuels. At
    2.3 % of the product mass it takes 2.3 % of the burdens.
