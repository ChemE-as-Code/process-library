# Tier 1 form, a manifest-only entry without a flowsheet (as process-library#317). Every amount is the
# formula of its parameters; core's validator re-checks each. Written from the LVOC BREF chapter 11
# and IPCC 2006 Vol. 3 section 3.9 (facts in our own form).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: vcm-balanced-oxygen
title: Vinyl chloride monomer by the balanced EDC process (oxygen-based oxychlorination)
description: Per 1 t of VCM, gate-to-gate, EU plants of the LVOC BREF data collection. Direct chlorination
  and oxygen-based oxychlorination of ethylene, thermal EDC cracking, all HCl recycled. Feeds and utilities
  from the BREF, oxygen and residues from stoichiometry, vent CO2 and combustion CH4 from IPCC 2006.
basis: 1000 kg of vinyl chloride monomer
boundary: 'gate-to-gate: direct chlorination, oxychlorination, EDC purification, EDC cracking, VCM purification,
  vent treatment and wastewater pretreatment; ethylene, chlorine, oxygen, steam and power from outside'
technology: 'balanced EDC/VCM unit: direct chlorination (low- or high-temperature) and oxygen-based oxychlorination,
  thermal cracking of EDC in natural-gas-fired furnaces; air-based oxychlorination, unbalanced units and the
  acetylene route are not modelled'
geography:
  description: EU plants of the BREF data collection; no single site.
classification:
  isic: '2011'
system_boundary:
  included:
  - ethylene, chlorine and oxygen; furnace natural gas and its combustion
  - electricity and gross steam
  - residues of EDC purification, coke, spent catalyst, pretreatment sludge, effluent
  - CO2 of the furnaces, the vent treatment and the oxychlorination vent; furnace NOx, CO, CH4
  - fugitive EDC and VCM
  excluded:
  - 'TODO heat recovered from oxychlorination and the incinerators (0.43 to 3.5 GJ/t in the source): not credited
    in the cut-off model, so the gross steam is an upper view'
  - 'TODO on-site incineration of the residues with HCl recovery (many sites, 11.2.2.6): the residues are an
    output to treatment here. The chlorine feed is the source''s net use (our reading), so the recovery would
    move the excess chlorine from the residues to scrubber effluents, not lower the feed'
  - 'TODO emissions of the combined vent treatment (HCl, Cl2, PCDD/F, NOx, EDC, VCM): the source gives concentrations
    only (Table 11.4), no flow'
  - 'TODO sodium hydroxide for washes and scrubbers, ferric chloride, hydrogen for acetylene hydrogenation,
    nitrogen for inerting: named by the source (11.3.3), not quantified'
  - 'TODO pollutants carried by the effluent (EDC, VCM, Cu, PCDD/F, COD after pretreatment, Tables 11.8 and
    11.9): they go with output:wastewater to the shared biological treatment'
  - 'TODO chlorine and HCl losses other than the residues (scrubber effluents, hydrochloric acid sold): all
    excess chlorine is put in the residues'
  - decoking emissions, refrigerant losses, storage emissions
  - cooling water and chilled water
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: included
  non_routine: excluded
location: RER
year: 2013
valid_until: 2018
time:
  start: 2009
  description: 'LVOC BREF data collection: capacities of 2013 and monitoring of one to five years (11.3.2);
    the reference year 2013 is ASSUMED from these. valid_until is the reference year + 5 (system-model section
    6), so it has already lapsed. The IPCC factors rest on the 2003 BREF data.'
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation (all HCl is recycled in a balanced unit; residues, coke
    and sludge are wastes)'
