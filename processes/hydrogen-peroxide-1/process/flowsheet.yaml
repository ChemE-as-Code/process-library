        temperature: {value: 298.15, provenance: assumed, source: D-011}
        flow: {value: 6.25, basis: mass, provenance: assumed, source: "1.0 kg/t H2O2, within the BREF range 0.7-1.6 kg/t (LVOC BREF 2017, Table 12.4 note 2), D-011"}
        composition: {basis: mass_fraction, values: {EAQ: 1.0}, provenance: assumed, source: D-004}
