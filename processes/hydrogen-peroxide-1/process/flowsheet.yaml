# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Hydrogen peroxide by the anthraquinone autoxidation (AO) process, 50 kt/a H2O2 (100 %) as a
# 50 wt% solution (D-001, D-002). Where the values come from:
# - temperatures, pressures and the specifications of every separator are design choices
#   (ASSUMED, DESIGN.md decisions), set inside the ranges of the LVOC BREF 2017
#   (doi:10.2760/77304, chapter 12) where it gives one;
# - the reactor outlets (S05, S11) are calculated by cheme from the conversions of
#   process/reactions.yaml; mixers and pass-through steps by `cheme process propagate --fill`;
# - separator outlets and all duties come from the independent balance scripts/hp_balance.py
#   (D-006), given here as ASSUMED: no property package of cheme covers the working solution or
#   aqueous H2O2, and the extraction is a specified component split.
schema: cheme/process/v1
kind: flowsheet
title: Hydrogen peroxide, anthraquinone autoxidation process (50 kt/a H2O2, 50 wt%)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 6250 kg/h H2O2 (100 %) as 12500 kg/h of 50 wt% solution, 8000 h/a (D-002)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: H2, title: Hydrogen (boundary feed; e.g. from hydrogen-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: MKQ, title: 2-Ethylanthraquinone make-up, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: MKS, title: Working-solution solvent make-up, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AIR, title: Ambient air, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: DEMIN, title: Demineralised water, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: ALU, title: Activated alumina (reversion agent), category: raw_material, ports: [{id: out, direction: out}]}
  - id: STEAMD
    title: LP steam, direct use (adsorber regeneration, ejector)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 350, provenance: assumed, source: "design basis, D-010"}
      supply_temperature: {value: 411.0, provenance: assumed, source: "saturation at 350 kPa(a), D-010"}
    ports: [{id: ads, direction: out}, {id: ej, direction: out}]
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: k201, direction: out, kind: energy}
      - {id: p101, direction: out, kind: energy}
      - {id: c301, direction: out, kind: energy}
      - {id: c501, direction: out, kind: energy}
  - id: LPS
    title: LP steam 350 kPa(a), indirect
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 350, provenance: assumed, source: "design basis, D-010"}
      supply_temperature: {value: 411.0, provenance: assumed, source: "saturation at 350 kPa(a), D-010"}
      min_approach: {value: 10, provenance: assumed, source: D-010}
    ports: [{id: c501, direction: out, kind: energy}]
products:
  - {id: PROD, title: Hydrogen peroxide 50 wt% to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: H2VENT, title: Hydrogenation vent to atmosphere, category: off_gas, ports: [{id: in, direction: in}]}
  - {id: OFFGAS, title: Oxidiser off-gas after adsorption to atmosphere, category: off_gas, ports: [{id: in, direction: in}]}
  - id: WW
    title: Aqueous effluent to biological waste water treatment
    category: wastewater
    ports: [{id: ads, direction: in}, {id: dry, direction: in}]
  - {id: SPENT, title: Spent reversion agent (alumina with organics), category: solid_waste, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-010"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-010"}
      min_approach: {value: 5, provenance: assumed, source: D-010}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: r201, direction: in, kind: energy}
      - {id: e201, direction: in, kind: energy}
      - {id: e202, direction: in, kind: energy}
      - {id: c501, direction: in, kind: energy}
      - {id: e501, direction: in, kind: energy}

blocks:
  - id: HYD
    title: Working-solution hydrogenation
    class: ReactingChemicals
    ports:
      - {id: h2, direction: in}
      - {id: mkq, direction: in}
      - {id: mks, direction: in}
      - {id: rws, direction: in}
      - {id: cond, direction: in}
      - {id: solv, direction: in}
      - {id: org, direction: in}
      - {id: vent, direction: out}
      - {id: hws, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: OXI
    title: Oxidation and off-gas treatment
    class: ReactingChemicals
    ports:
      - {id: hws, direction: in}
      - {id: air, direction: in}
      - {id: steam, direction: in}
      - {id: ows, direction: out}
      - {id: cond, direction: out}
      - {id: solv, direction: out}
      - {id: offgas, direction: out}
      - {id: ww, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: cw3, direction: out, kind: energy}
  - id: EXT
    title: Extraction and crude purification
    class: SeparatingByContact
    ports:
      - {id: ows, direction: in}
      - {id: demin, direction: in}
      - {id: dist, direction: in}
      - {id: crude, direction: out}
      - {id: raf, direction: out}
      - {id: org, direction: out}
      - {id: power, direction: in, kind: energy}
  - id: CON
    title: Concentration (vacuum distillation)
    class: Distilling
    ports:
      - {id: crude, direction: in}
      - {id: prod, direction: out}
      - {id: dist, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: steam, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
  - id: WSR
    title: Working-solution drying and regeneration
    class: SeparatingByPhysicalProcess
    ports:
      - {id: raf, direction: in}
      - {id: steam, direction: in}
      - {id: alu, direction: in}
      - {id: rws, direction: out}
      - {id: ww, direction: out}
      - {id: spent, direction: out}

steps:
  # --- HYD
  - id: T101
    block: HYD
    title: Working-solution tank (make-up and returns)
    class: Mixing
    symbol: TANK_CONE_ROOF_SHAPE
    links: [{target: equipment, ref: T-101}]
    ports:
      - {id: ws, direction: in, delegates: rws}
      - {id: mkq, direction: in, delegates: mkq}
      - {id: mks, direction: in, delegates: mks}
      - {id: cond, direction: in, delegates: cond}
      - {id: solv, direction: in, delegates: solv}
      - {id: org, direction: in, delegates: org}
      - {id: out, direction: out}
  - id: P101
    block: HYD
    title: Working-solution circulation pumps
    # TransportingFluids, not Pumping: cheme 0.8.0 process build fails on Pumping's optional
    # method enum (TypeError in step_method; reported in DESIGN.md D-006).
    class: TransportingFluids
    links: [{target: equipment, ref: P-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  # D-003, D-005: fixed-bed Pd hydrogenator, conversions of process/reactions.yaml; heat of
  # reaction removed by a WS cooler on the recycle (in the R-101 duty).
  - id: R101
    block: HYD
    title: Hydrogenator (fixed-bed Pd catalyst, with WS cooler)
    class: ReactingChemicals
    reactions: [HYD, HPD]
    reactor: conversion
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: ws, direction: in}
      - {id: h2, direction: in, delegates: h2}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: V101
    block: HYD
    title: Hydrogenator gas separator and safety filter
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-101}, {target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out, delegates: vent}
      - {id: liq, direction: out, delegates: hws}
  # --- OXI
  - id: K201
    block: OXI
    title: Process air compressor
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-201}]
    ports:
      - {id: in, direction: in, delegates: air}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E201
    block: OXI
    title: Process air aftercooler
    class: Cooling
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  - id: R201
    block: OXI
    title: Oxidiser (co-current bubble columns, with WS coolers)
    class: ReactingChemicals
    reactions: [OXD]
    reactor: conversion
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: ws, direction: in, delegates: hws}
      - {id: air, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: V201
    block: OXI
    title: Oxidiser gas separator
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-201}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out}
      - {id: liq, direction: out, delegates: ows}
  - id: E202
    block: OXI
    title: Off-gas condenser
    class: Cooling
    links: [{target: equipment, ref: E-202}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw3}
  - id: V202
    block: OXI
    title: Off-gas knock-out drum
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-202}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out}
      - {id: liq, direction: out, delegates: cond}
  - id: A201
    block: OXI
    title: Activated-carbon adsorbers with steam regeneration and decanter
    class: Adsorbing
    links: [{target: equipment, ref: A-201}]
    ports:
      - {id: gas, direction: in}
      - {id: steam, direction: in, delegates: steam}
      - {id: vent, direction: out, delegates: offgas}
      - {id: solv, direction: out, delegates: solv}
      - {id: cond, direction: out, delegates: ww}
  # --- EXT
  - id: M301
    block: EXT
    title: Extraction water make-up (demineralised water and distillate)
    class: Mixing
    links: [{target: equipment, ref: T-301}]
    ports:
      - {id: demin, direction: in, delegates: demin}
      - {id: dist, direction: in, delegates: dist}
      - {id: out, direction: out}
  # D-008: a specified component split, not an equilibrium-stage calculation.
  - id: C301
    block: EXT
    title: Extraction column (sieve trays) and coalescer
    class: SeparatingByContact
    links: [{target: equipment, ref: C-301}]
    ports:
      - {id: ws, direction: in, delegates: ows}
      - {id: water, direction: in}
      - {id: crude, direction: out}
      - {id: raf, direction: out, delegates: raf}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: C302
    block: EXT
    title: Crude purification (solvent wash)
    class: SeparatingByContact
    links: [{target: equipment, ref: C-302}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: crude}
      - {id: org, direction: out, delegates: org}
  # --- CON
  - id: C501
    block: CON
    title: Vacuum concentration column with reboiler and condenser
    class: Distilling
    links: [{target: equipment, ref: C-501}, {target: equipment, ref: E-502}, {target: equipment, ref: E-503}]
    ports:
      - {id: feed, direction: in, delegates: crude}
      - {id: top, direction: out, delegates: dist}
      - {id: bot, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: reb, direction: in, kind: energy, delegates: steam}
      - {id: cond, direction: out, kind: energy, delegates: cw1}
  - id: E501
    block: CON
    title: Product cooler
    class: Cooling
    links: [{target: equipment, ref: E-501}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: prod}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  # --- WSR
  - id: V303
    block: WSR
    title: Working-solution vacuum dryer (ejector)
    class: Drying
    links: [{target: equipment, ref: V-303}]
    ports:
      - {id: in, direction: in, delegates: raf}
      - {id: steam, direction: in, delegates: steam}
      - {id: ws, direction: out}
      - {id: water, direction: out, delegates: ww}
  - id: X401
    block: WSR
    title: Reversion (activated-alumina beds)
    class: Adsorbing
    links: [{target: equipment, ref: A-401}]
    ports:
      - {id: in, direction: in}
      - {id: alu, direction: in, delegates: alu}
      - {id: ws, direction: out, delegates: rws}
      - {id: spent, direction: out, delegates: spent}

streams:
  - id: S01
    title: Hydrogen feed
    from: H2.out
    to: R101.h2
    template: hydrogen
    state:
      design:
        pressure: {value: 500, provenance: assumed, source: "design basis, D-003"}
        temperature: {value: 313.15, provenance: assumed, source: "design basis, D-003"}
        flow: {value: 396.97, basis: mass, provenance: assumed, source: "scripts/hp_balance.py: H2 reacted / (1 - 1 % vent), D-005"}
        composition: {basis: mass_fraction, values: {H2: 1.0}, provenance: assumed, source: "pure H2, design basis D-003"}
  - id: S02
