kind: lci_dataset
id: natural-gas-processing-100-mmscf-d-rich-shale-gas-to-sales-gas-and-c2-ngl
title: Natural gas processing (100 MMscf/d rich shale gas to sales gas and C2+ NGL)
description: Unallocated foreground LCI of Natural gas processing (100 MMscf/d rich shale gas to sales
  gas and C2+ NGL), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: US
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Sweet gas plant: inlet separation, MDEA CO2 removal (acid gas vented), TEG dehydration with
  molecular sieve polishing, GSP-type turbo-expander NGL recovery (90 % C2, 98 % C3), electric-motor residue
  compression; 100 MMscf/d (about 0.8 Mt/a) of Barnett-type rich shale gas'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: cutoff:fugitive-CH4
  title: Fugitive methane of equipment leaks (screening amount, not in the inventory)
  direction: output
  amount: 64.875
  reason: 'no P&ID component count at the concept stage; ASSUMED screening amount of 0.1 % of the methane
    processed (S1: 64 870 kg/h CH4 x 0.001 x 8000 h/a), the upper end of the 0.05-0.1 % suggested by the
    design review (R-03). Below 1 % of the input mass, but methane has a high characterisation factor:
    about 0.020 kg CO2-eq per kg sales gas allocated (GWP100 29.8), roughly twice the direct GHG of the
    inventory (D-017)'
  cas: 74-82-8
  source: 'ASSUMED (D-017); order-of-magnitude bound: Alvarez et al. (2018), Science 361(6398) 186-188,
    whole US oil and gas supply chain methane 13 +- 2 Tg/a = 2.3 % of gross gas production, of which processing
    is a minor segment; to replace with EPA leak protocol factors per component once P&IDs exist'
- key: emission-excluded:leaks
  title: equipment-leaks emissions of the plant
  direction: output
  reason: 'fugitive methane and hydrocarbons from valves, flanges, compressor seals and the TEG/amine
    pumps are not estimated: no P&ID take-off at the concept stage. In gas processing they are a material
    methane source; to be added with the P&IDs and the EPA leak protocol factors (D-014); screening amount
    for the cut-off check in cutoff:fugitive-CH4 (D-017)'
  source: D-014, D-017
- key: emission-excluded:non-routine
  title: non-routine emissions of the plant
  direction: output
  reason: blowdowns, compressor starts, mole sieve bed switching losses, pigging and flaring at upsets
    are not estimated at the concept stage (D-014)
  source: D-014
- key: emission-excluded:tanks
  title: storage-tank emissions of the plant
  direction: output
  reason: 'no hydrocarbon storage: NGL leaves by pipeline and there is no condensate (no C4+ in the feed);
    amine, TEG and produced-water tanks breathe negligible amounts (ASSUMED)'
  source: D-014
- key: emission-excluded:water
  title: effluent emissions of product:PWATER
  direction: output
  reason: the separated water goes to disposal (a waste treatment, mapped as product:PWATER); its dissolved
    hydrocarbons and salts are not in the balance (D-004)
  source: D-014
