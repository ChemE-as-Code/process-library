    NGL are recorded for this concept design. Energy (LHV) is used because both co-products are fuels
    and feedstocks traded on their energy content, the physical relationship between them; mass would
    give nearly the same split since their LHVs differ by 3 % (D-014). To be revisited when open price
    data are sourced.'
