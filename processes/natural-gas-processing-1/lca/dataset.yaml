    by lower heating value (MJ/kg, from the ideal-gas formation enthalpies of process/materials.yaml in
    scripts/balance.py: sales gas 48.43, NGL 47.03). Because the two LHVs differ by 3 %, energy and mass
    allocation give nearly the same split (sales gas about 72 % of the burden).'
