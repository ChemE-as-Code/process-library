# Process Atlas manifest of natural-gas-processing-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: natural-gas-processing-1
title: Natural gas processing (amine CO2 removal, TEG dehydration, turbo-expander NGL recovery)
summary: >-
  A sweet, CO2-bearing rich shale gas (100 MMscf/d) treated to pipeline sales gas and a C2+
  NGL: inlet separation, MDEA CO2 removal, TEG and molecular sieve dehydration, turbo-expander
  NGL recovery and electric residue compression. Concept stage, sourced feed, assumed basis.
description: |
  Raw gas from a shale gathering system (Barnett well 2 composition of Bullin and Krouskop
  2009: 81.2 % CH4, 11.8 % C2H6, 5.2 % C3H8, 0.3 % CO2, 1.5 % N2, no H2S) enters at 6000 kPa(a)
  and 40 degC. Free water is separated; an MDEA unit removes the CO2 to 50 ppmv so that it
  cannot freeze in the cold section and vents the acid gas; a TEG unit dries the gas to the
  pipeline water specification and molecular sieve beds polish it for the cryogenic section.
  A gas-subcooled-process type turbo-expander plant recovers 90 % of the ethane and 98 % of
  the propane as a C2+ NGL; the residue gas is recompressed by the expander-driven booster and
  an electric-motor compressor to 7000 kPa(a). Flash gases and a small residue-gas draw fire
  the TEG reboiler and the regeneration gas heater. No sulfur recovery: the sourced feed has
  no H2S.

  All values are concept estimates from a specified-split balance (recoveries and removal
  depths from open sources or ASSUMED); no property package of ChemE-as-Code is yet
  benchmarked for C2/C3-rich natural gas, aqueous MDEA or TEG, so phase behaviour, the cold-box
  energy balance and compressor duties are ideal-gas estimates. See DESIGN.md.
families: [fuels]
keywords: [natural gas processing, gas plant, sales gas, NGL recovery, turbo-expander, demethaniser, GSP, amine treating, MDEA, CO2 removal, TEG dehydration, molecular sieve, shale gas, Barnett]
facets:
  feedstock_basis: [fossil]
  product_classes: [fuels]
  unit_operations: [absorption, adsorption, cryogenic-distillation, compression]
  region: US
# Honest claim: concept is the lowest level of the manifest; cheme maturity reaches no
# calculated level (specified-split balance, no qualified property package), see
# validation.notes and DESIGN.md D-006, D-012.
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD with closed mass, component and element balances (cheme validate, cheme process
    streams: every block and step within tolerance; the fired heaters as a reactive step with
    complete combustion). The streams come from an independent specified-split balance
    (scripts/balance.py): the feed composition is sourced (Bullin and Krouskop 2009, Table 1),
    the TEG circulation, gas absorption and flash recovery follow EPA Natural Gas STAR, the
    ethane/propane recoveries sit inside the range of a GSP patent; removal depths, loadings,
    efficiencies and the cold separator split are ASSUMED. Energy closure is not evaluable in
    core: no benchmarked property package covers these mixtures. The
    preliminary gate-to-gate LCI closes in mass and C/H/N/O (consumables excepted, no
    composition); every background is a gap; fugitive and non-routine methane is not in the
    inventory (a screening amount of fugitive methane, 0.1 % of the methane processed, is
    recorded for the cut-off check and would roughly triple the direct GHG; D-017). The
    electricity (3.99 MW) is probably under-estimated: an order-of-magnitude cold-box check
    (D-016) leaves a refrigeration deficit that a propane chiller of up to about 1.5 MW electric
    (up to +40 %) would cover; no chiller is in the balance. Not reviewed. Main products and
    feeds are listed under chemistry with their chemicals registry entries (issue #251).
chemistry:
  inputs:
    - {chemical: raw-natural-gas, role: feedstock, note: "feed:RAWGAS: raw natural gas from field gathering, water-saturated, 1.42 kg/kg sales gas (unallocated)"}
    - {chemical: water, role: feedstock, note: "Demineralised make-up water of the amine loop (feed:DMW), 0.64 g per kg sales gas (allocated)"}
  outputs:
    - {chemical: methane, role: main-product, note: "product:SALESGAS, sales gas to the transmission pipeline (7000 kPa(a)), taken as methane like the library's natural-gas consumers; no inventory_key, since the study's energy property is not pure methane's"}
    - {chemical: natural-gas-liquids, role: co-product, inventory_key: "product:NGL", note: "C2+ natural gas liquids (ethane-propane mix) to the NGL pipeline"}
    - {chemical: carbon-dioxide, role: emission, inventory_key: "emission:CO2", note: "Reservoir CO2 vented with the amine acid gas (627 kg/h) and combustion CO2 of the fired heaters (278 kg/h); 9.5 g per kg sales gas (allocated)"}
    - {chemical: methane, role: emission, inventory_key: "emission:CH4", note: "Methane slip of the amine regenerator and TEG still and unburnt methane of the heaters, 3.05 kg/h; fugitive and non-routine methane not yet estimated"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "3.99 MW, of which the residue compressor K-501 3.67 MW (ideal-gas estimate); a possible propane chiller (up to about 1.5 MW, D-016) is not included"}
    - {chemical: steam, role: utility, inventory_key: "feed:STEAM", note: "LP steam 450 kPa(a), 1.08 MW, amine reboiler (ASSUMED steam ratio)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "30/40 C (ASSUMED), 6.85 MW"}
basis:
  capacity: "100 MMscf/d raw gas (dry basis, 60 degF, 14.696 psia) = 96.7 t/h; 68.7 t/h sales gas (83.7 MMscf/d) and 27.3 t/h C2+ NGL (ASSUMED capacity)"
  operating_hours_per_year: 8000
  location: generic US onshore shale gas area (Barnett-type), not chosen
