  - {title: "US EPA AP-42, Section 1.4 Natural Gas Combustion (Tables 1.4-1 and 1.4-2)", url: "https://www.epa.gov/sites/default/files/2020-09/documents/1.4_natural_gas_combustion.pdf"}
  - {title: "US EPA AP-42, Section 5.3 Natural Gas Processing (1995)", url: "https://gaftp.epa.gov/ap42/ch05/s03/final/c05s03_1995.pdf"}
  - {title: "US 11 473 837 B2: Gas subcooled process conversion to recycle split vapor for recovery of ethane and propane (Background: GSP recovery ranges)", url: "https://patents.google.com/patent/US11473837B2/en"}
