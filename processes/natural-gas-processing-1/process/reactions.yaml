# The reactions of natural-gas-processing-1 (DESIGN.md D-011, section 3). Schema `cheme schema
# process-reactions`. The plant is a separation plant: the only reactions are the complete
# combustion of fuel gas in the fired heaters H601 (TEG reboiler firebox and molecular sieve
# regeneration gas heater). Heats of reaction in kJ/kmol per extent as written, from the
# ideal-gas formation enthalpies at 298.15 K in process/materials.yaml (ATcT via `chemicals`),
# water as vapour (lower heating value). CO2 absorption in MDEA is reactive chemistry but is
# represented by a specified split (D-007), not as a reaction.
schema: cheme/reactions/v1
kind: reactions
reactions:
  - id: CH4_COMB
    title: Combustion of methane
    equation: CH4 + 2 O2 => CO2 + 2 H2O
    stoichiometry: {CH4: -1.0, O2: -2.0, CO2: 1.0, H2O: 2.0}
    reversible: false
    conversion: {key: CH4, value: 1.0, provenance: assumed, source: "D-011: complete combustion with 15 % excess air; CO, unburnt hydrocarbons and NOx are estimated outside the balance (lca/lca.yaml)"}
    heat_of_reaction: {value: -802584.0, provenance: calculated, source: "ideal-gas dHf of process/materials.yaml (ATcT): -393474 + 2 x -241822 - -74534"}
  - id: C2H6_COMB
    title: Combustion of ethane
    equation: 2 C2H6 + 7 O2 => 4 CO2 + 6 H2O
    stoichiometry: {C2H6: -1.0, O2: -3.5, CO2: 2.0, H2O: 3.0}
    reversible: false
    conversion: {key: C2H6, value: 1.0, provenance: assumed, source: D-011}
    heat_of_reaction: {value: -1428634.0, provenance: calculated, source: "ideal-gas dHf of process/materials.yaml (ATcT): 2 x -393474 + 3 x -241822 - -83780"}
  - id: C3H8_COMB
    title: Combustion of propane
    equation: C3H8 + 5 O2 => 3 CO2 + 4 H2O
    stoichiometry: {C3H8: -1.0, O2: -5.0, CO2: 3.0, H2O: 4.0}
    reversible: false
    conversion: {key: C3H8, value: 1.0, provenance: assumed, source: D-011}
    heat_of_reaction: {value: -2043320.0, provenance: calculated, source: "ideal-gas dHf of process/materials.yaml (ATcT): 3 x -393474 + 4 x -241822 - -104390"}
