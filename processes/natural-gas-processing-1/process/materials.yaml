# Components and templates of natural-gas-processing-1. Schema cheme/process/v1 (`cheme schema
# process-materials`). molar_mass in kg/kmol, normal_boiling_point in K at 101.325 kPa.
# ideal_gas: formation enthalpy (ATcT), entropy (CRC) and cp/R polynomial (Poling 5th ed.,
# 50-1000 K) as printed by `cheme chemistry thermo` (the `chemicals` package); used by the
# combustion balance of the fired heaters H601 and the heating values of scripts/balance.py
# (D-006, D-011). The feed has no C4+ (Bullin and Krouskop 2009 report C1-C3, CO2 and N2 only,
# D-003). MDEA and TEG are the circulating solvents of the amine and glycol loops (D-007,
# D-008); no property package of cheme covers the amine (an electrolyte) or the
# glycol-water-hydrocarbon system (D-012).
schema: cheme/process/v1
kind: materials
components:
  - id: CH4
    name: Methane
    formula: CH4
    cas: 74-82-8
    molar_mass: 16.042
    normal_boiling_point: 111.66
    ideal_gas: {dHf_298: -74534.0, S_298: 186.3, cp_R: [4.568, -0.008975, 3.631e-05, -3.407e-08, 1.091e-11], temperature_range: [50, 1000], provenance: given, source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R Poling (5th ed.), via cheme chemistry thermo"}
  - id: C2H6
    name: Ethane
    formula: C2H6
    cas: 74-84-0
    molar_mass: 30.069
    normal_boiling_point: 184.57
