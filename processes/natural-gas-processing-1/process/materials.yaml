  - {id: TEG, name: Triethylene glycol, formula: C6H14O4, cas: 112-27-6, molar_mass: 150.174}
templates:
  - {id: gas, title: "Natural gas, residue gas, acid gas, fuel gas, air and flue gas", components: [CH4, C2H6, C3H8, CO2, N2, O2, H2O]}
  - {id: water, title: "Free water, regeneration water and demineralised water", components: [H2O]}
  - {id: amine, title: "Aqueous MDEA (lean and rich)", components: [MDEA, H2O, CO2, CH4, C2H6, C3H8]}
  - {id: teg, title: "Triethylene glycol (lean and rich)", components: [TEG, H2O, CH4, C2H6, C3H8, CO2, N2]}
  - {id: ngl, title: "Natural gas liquids (demethaniser bottoms, C2+)", components: [CH4, C2H6, C3H8, CO2]}
# property_method is a placeholder: the benchmarked packages (air-pr-chemsep, syngas-pr-vapor)
# do not cover C2H6/C3H8 mixtures, aqueous MDEA or TEG (D-012); stream
# properties are not filled.
property_method:
  adapter: thermo
  status: placeholder
