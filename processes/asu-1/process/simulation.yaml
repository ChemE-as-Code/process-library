# DWSIM simulation of the whole plant (`cheme process simulate --check`; schema `cheme schema
# process-simulation`), D-097. Only the evaporative cooler C1102 is left out (`exclude`): it
# exchanges water and heat with the chilled-water loop, which the flowsheet carries as no stream
# (D-067), so its N2 side alone would show neither. Units as in the flowsheet.
schema: cheme/simulation/v1
kind: simulation
simulator: dwsim
property_package: Peng-Robinson (PR)
# D-097: the facts of the thermodynamic-model-selection skill (Carlson's tree): a non-polar,
# non-electrolyte mixture without pseudocomponents up to 31 bara (the GOX discharge). Water is
# polar but only in the warm end, at most 3.4 mol%, and it leaves as near-pure condensate and in
# the TSA (judgment, D-097). Recommended: Peng-Robinson, SRK, LKP and the Boston-Mathias forms.
method_selection:
  facts:
    pressure_value: 31
    pressure_unit: bar(a)
    is_polar: false
    is_electrolyte: false
    has_pseudocomponents: false
# D-066: DWSIM's PR Ar/O2 kij (0.0107) puts alpha(Ar/O2) near pure O2 ~5 % below the reference
interaction_parameters:
  - components: [AR, O2]
    kij: {value: 0.0143, provenance: assumed, source: "D-066: fitted to the Lemmon-Jacobsen Ar/O2 Helmholtz mixture model (REFPROP, CoolProp 8): alpha 1.558 at 1.30 bara, 1.547 at 1.40 bara near pure O2"}
exclude: [C1102]
# D-097: the cold box torn where the air enters the columns (their flowsheet values are the
# first guess), and the subcooler loop at the LP column's waste N2
tear_streams: [S5, S5B, S16]
specs:
  K1101:
    outlet_pressure: {value: 6.02, provenance: assumed, source: "D-079, D-089: the front-end pressure profile with the DN700 main air lines at their bound (S4 5.6 bara stays)"}
    efficiency: {value: 0.82, provenance: assumed, source: "isentropic per stage, centrifugal MAC"}
    drive_efficiency: {value: 0.946, provenance: assumed, source: "D-057: 6.6 kV motor 0.97 x integral gear and bearings 0.975"}
    stages: 3
    outlet_temperature: {value: 40, provenance: assumed, source: "DESIGN.md 3, stream 2; intercoolers E-1101, E-1102, aftercooler E-1103"}
    pressure_drop: {value: 0.05, unit: bar, provenance: assumed, source: "per cooler"}
  C1101:  # DCAC lower section, cooling water (D-067)
    outlet_temperature: {value: 27, provenance: assumed, source: "D-067: cooling water 25 C supply, 2 K approach"}
    pressure_drop: {value: 0.05, unit: bar, provenance: assumed, source: "DESIGN.md 3, streams 2 and 3: 0.1 bar over both sections"}
  C1101U:  # DCAC upper section, chilled water from C-1102 (D-067)
    outlet_temperature: {value: 12, provenance: assumed, source: "DESIGN.md 3, stream 3 (DCAC)"}
    pressure_drop: {value: 0.05, unit: bar, provenance: assumed, source: "DESIGN.md 3, streams 2 and 3: 0.1 bar over both sections"}
  # D-097: the TSA (D-006) as a component separator: the adsorption step takes all H2O and CO2
  # out of the air (S4 dry, CO2 < 0.1 ppm, D-066); N2, O2 and Ar co-adsorption is neglected.
  V2101:
    unit: component_separator
    # stated on the dry air (all N2, O2, Ar; no H2O, CO2), so its H2O and CO2 are exactly zero
    recoveries: {N2: 1.0, O2: 1.0, AR: 1.0, H2O: 0.0, CO2: 0.0}
    recovery_outlet: out
    basis_source: "D-006 (the TSA removes H2O, CO2, N2O and C2H2 before the cold box) and D-066 (S4 dry air, CO2 < 0.1 ppm): removal to specification, taken as complete; co-adsorption of N2, O2 and Ar neglected (ASSUMED)"
    operating_basis: "2-bed TSA, alumina + 13X, adsorption at 5.92 bara and 12 C (S3), ~4 h cycle (ASSUMED, D-006); cycle average"
  F2101:
    unit: valve  # a pressure drop only: the dust F-2101 takes out is not a flowsheet component
    pressure_drop: {value: 0.32, unit: bar, provenance: assumed, source: "D-079, D-089: S3 5.92 -> S4 5.6 bara (adsorber bed ~8, F-2101 ~3 kPa, DN700 lines to E-3101 21 kPa)"}
  M2101: {}  # the regeneration gas takes up what V2101 adsorbs (cycle average)
  E2101:
    outlet_temperature: {value: 200, provenance: assumed, source: "D-006: regeneration with waste N2 heated to 200 C (the heating step; E3 is the cycle average, D-097)"}
    pressure_drop: {value: 0, unit: bar, provenance: assumed, source: "ASSUMED: within the RG-2001 / RG-2002 budget (D-072)"}
  X3101:
    split: {regen: 0.241458, vent: 0}  # ASSUMED (D-066, D-067): 18,486 of 76,560 kg/h to regeneration, none vented
  X3102:
    split: {bst: 0.134121}  # ASSUMED (D-066): 14,870 of 110,870 kg/h boosted (streams 4, 4B)
  K3101:
    outlet_pressure: {value: 8.45, provenance: assumed, source: "D-061: 5.6 -> 8.45 bara, the compander balances on the shaft"}
    efficiency: {value: 0.80, provenance: assumed, source: "compander booster"}
  E3104:
    outlet_temperature: {value: 30, provenance: assumed, source: "D-067: counter-current on cooling water 25 -> 35 C, 5 K approach"}
    pressure_drop: {value: 0, unit: bar, provenance: assumed, source: "DESIGN.md 3, streams 4C and 4D"}
  E3105:
    outlet_temperature: {value: 15, provenance: assumed, source: "D-067: chilled-water trim to the main air temperature"}
    pressure_drop: {value: 0, unit: bar, provenance: assumed, source: "D-067, as E-3104"}
  # D-097: the main heat exchanger as a multi-stream exchanger. The air leaves at the HP column
  # feed and the expander inlet, the products at D-061's 13 C warm end; the waste N2 closes the
  # energy balance (no heat leak in the model, so the refrigeration surplus shows there).
  E3101:
    pairs: {air: hp, bst: exp, gox_c: gox, gan_c: gan, waste_c: waste}
    outlet_temperatures:
      air: {value: -173, provenance: assumed, source: "DESIGN.md 3, stream 5 (air near its dew point, D-066)"}
      bst: {value: -124.7, provenance: assumed, source: "D-061: expander inlet S5B"}
      gox_c: {value: 13, provenance: assumed, source: "D-061: warm end 2 K below the main air S4A"}
      gan_c: {value: 13, provenance: assumed, source: "D-061: warm end 2 K below the main air S4A"}
    pressure_drops:
      air: {value: 0.1, unit: bar, provenance: assumed, source: "DESIGN.md 3, streams 4 and 5 (5.6 -> 5.5 bara)"}
      bst: {value: 0.2, unit: bar, provenance: assumed, source: "D-061: 8.45 -> 8.25 bara"}
      gox_c: {value: 0.25, unit: bar, provenance: assumed, source: "DESIGN.md 3, streams 15 and 7 (1.4 -> 1.15 bara)"}
      gan_c: {value: 0.1, unit: bar, provenance: assumed, source: "DESIGN.md 3, streams 14 and 9 (5.3 -> 5.2 bara)"}
      waste_c: {value: 0.15, unit: bar, provenance: assumed, source: "DESIGN.md 3, streams 16 and 17 (1.3 -> 1.15 bara)"}
  KT3101:
    unit: expander
    outlet_pressure: {value: 1.35, provenance: assumed, source: "D-061: expander 8.25 -> 1.35 bara (DESIGN.md 3, stream 6)"}
    efficiency: {value: 0.85, provenance: assumed, source: "D-061: eta_s 0.85, turbo-expander"}
  # The double column (D-059): C3101's condenser boils C3102's sump (E-3103, condenser-reboiler).
  C3101:
    stages: 40
    feed_stage: 40
    reboiler: false
    condenser: partial
    condenser_pressure: {value: 5.3, provenance: assumed, source: "DESIGN.md assumptions: HP column top 5.4 bara, less the condenser"}
    reboiler_pressure: {value: 5.5, provenance: assumed, source: "DESIGN.md 3, stream 5"}
    vapor_flow: {value: 12510, provenance: given, source: "GAN product, DESIGN.md 3, stream 9"}
    condenser_spec: {flow: {value: 29280, provenance: assumed, source: "D-066: LN reflux to the LP column 0.305 x HP air (GAN O2 rises steeply above ~0.31)"}}
    outlets: {n2: vapor, ln: distillate, crude: bottoms}
    side_draws:
      lin: {stage: 2, phase: liquid, flow: {value: 470, provenance: assumed, source: "LIN product, DESIGN.md 3, stream 11 (D-017)"}}
  C3102:
    stages: 59
    feed_stages: {reflux: 1, crude: 14, lachmann: 16}  # D-066: the stages below the feeds strip argon
    condenser: none
    condenser_pressure: {value: 1.30, provenance: assumed, source: "DESIGN.md assumptions: LP column top 1.3 bara"}
    reboiler_pressure: {value: 1.40, provenance: assumed, source: "ASSUMED: 0.1 bar over the packing"}
    reboiler_spec: {flow: {value: 470, provenance: assumed, source: "LOX product, DESIGN.md 3, stream 10 (D-017)"}}
    outlets: {waste: vapor, lox: bottoms}
    side_draws:
      gox: {stage: 59, phase: vapor, flow: {value: 20860, provenance: given, source: "GOX product, 500 t/d"}}
    heat_integration: {condenser_of: C3101}
  # D-066: the subcooler sized so that C3102 reboils what C3101 condenses (E-3103 balanced)
  E3102:
    outlet_temperatures:
      ln_in: {value: -185.1, provenance: assumed, source: "D-066: E-3103 balance"}
      crude_in: {value: -180.1, provenance: assumed, source: "D-066: E-3103 balance"}
    pairs: {ln_in: ln_out, crude_in: crude_out, waste_in: waste_out}
  K4101:
    outlet_pressure: {value: 31.0, provenance: given, source: "GOX pipeline"}
    efficiency: {value: 0.78, provenance: assumed, source: "oil-free GOX centrifugal"}
    drive_efficiency: {value: 0.946, provenance: assumed, source: "D-057: motor 0.97 x gear 0.975"}
    stages: 5  # D-065 (7): E-4101 has four intercoolers, so five stages with the aftercooler
    outlet_temperature: {value: 40, provenance: assumed, source: "intercooler package E-4101, aftercooler E-4102"}
  K4102:
    outlet_pressure: {value: 9.0, provenance: given, source: "GAN pipeline"}
    efficiency: {value: 0.80, provenance: assumed, source: "single-stage centrifugal"}
    drive_efficiency: {value: 0.92, provenance: assumed, source: "D-057: LV motor 0.94 x gear 0.98"}
    stages: 1
    outlet_temperature: {value: 40, provenance: assumed, source: "aftercooler E-4103"}
