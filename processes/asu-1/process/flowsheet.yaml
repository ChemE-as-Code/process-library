        phase: {value: vapor, vapor_fraction: 1.0, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR', fingerprint: 1c8faf726644c98c}
  - id: S4B
    title: Booster suction
    links: [{target: line, ref: AIR-3005, sheet: P-03}]
    from: X3102.bst
    to: K3101.in
    template: dry
    state:
      design:
        flow: {value: 14870, provenance: assumed, source: "DESIGN.md 3, stream 6 (11,500 Nm3/h): the expander air, boosted first (D-003)"}
        pressure: {value: 5.6, provenance: assumed, source: "= S4 (DESIGN.md 3, stream 4); line list AIR-3005: 5.6 bara, 15 C"}
