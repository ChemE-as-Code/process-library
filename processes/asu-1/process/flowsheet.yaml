# ASU-1 flowsheet, seeded once from DESIGN.md section 3 (main-stream balance). From now on the
# numbers live here; DESIGN.md keeps decisions and prose (`cheme process streams --md`).
# BFD and PFD: `cheme process build` (never edit process/*.xml).
schema: cheme/process/v1
kind: flowsheet
title: ASU-1 (500 t/d GOX)
units:
  {pressure: bar(a), temperature: °C, flow: kg/h, duty: kW, enthalpy: kJ/kmol,
   enthalpy_reference: {state: ideal_gas, temperature: 298.15, pressure: 101.325}}
cases:
  - {id: design, description: "Design case: the D-099 design air (30 C, 80 % RH, 1.013 bara, 85,840 Nm3/h dry; design specification), ~83 % O2 recovery (D-066, ASSUMED)", default: true}
tolerance: {abs: 1.0, rel: 0.005}
# BFD: parallel boundary streams between the same two blocks drawn as one connection (S7 + S9).
bfd: {aggregate: true}

feeds:
  - {id: AIR, title: Ambient air, ports: [{id: out, direction: out}]}
  # Utilities as energy terminals (DESIGN.md section 3 utility table, average operation): the
  # LCA counts them in kWh (lca/lca.yaml).
  - id: POWER
    title: Electric power (6.6 kV grid supply)
    ports:
      - {id: mac, direction: out, kind: energy}
      - {id: aux, direction: out, kind: energy}
      - {id: pur, direction: out, kind: energy}
      - {id: gox, direction: out, kind: energy}
      - {id: gan, direction: out, kind: energy}
products:
  - {id: GOXP, title: GOX to pipeline, ports: [{id: in, direction: in}]}
  - {id: GANP, title: GAN to battery limit, ports: [{id: in, direction: in}]}
  - {id: LOX, title: LOX to storage, ports: [{id: in, direction: in}], links: [{target: equipment, ref: T-4101}]}
  - {id: LIN, title: LIN to storage, ports: [{id: in, direction: in}], links: [{target: equipment, ref: T-4102}]}
  - id: VENT
    title: Vent to atmosphere
    ports: [{id: v1, direction: in}, {id: v2, direction: in}, {id: v3, direction: in}]
  - id: COND
    title: Condensate (MAC cooler drains; DCAC condensate into its circulating water)
    ports: [{id: mac, direction: in}, {id: dcac, direction: in}, {id: dcac_upper, direction: in}]
  - id: CW
    title: Cooling water return (heat rejected)
    ports:
      - {id: mac, direction: in, kind: energy}
      - {id: dcac, direction: in, kind: energy}
      - {id: gox, direction: in, kind: energy}
      - {id: gan, direction: in, kind: energy}
      - {id: bst, direction: in, kind: energy}

blocks:
  - id: MAC
    title: Main air compression and precooling
    class: Compressing
    links: [{target: sheet, ref: P-01}]
    ports:
      - {id: air, direction: in}
      - {id: evap, direction: in}
      - {id: out, direction: out}
      - {id: evap_out, direction: out}
      - {id: cond_mac, direction: out}
      - {id: cond_dcac, direction: out}
      - {id: cond_dcac_upper, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: power_aux, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: cw_dcac, direction: out, kind: energy}
  - id: PUR
    title: Front-end purification (TSA)
    class: Adsorbing
    links: [{target: sheet, ref: P-02}]
    ports:
      - {id: in, direction: in}
      - {id: regen, direction: in}
      - {id: out, direction: out}
      - {id: regen_out, direction: out}
      - {id: power, direction: in, kind: energy}
  - id: CB
    title: Cold box
    class: SeparatingByThermalProcess
    links: [{target: sheet, ref: P-03}]
    ports:
      - {id: air, direction: in}
      - {id: gox, direction: out}
      - {id: gan, direction: out}
      - {id: lox, direction: out}
      - {id: lin, direction: out}
      - {id: regen, direction: out}
      - {id: evap, direction: out}
      - {id: vent, direction: out}
      - {id: cw_bst, direction: out, kind: energy}
  - id: PRD
    title: Product compression
    class: Compressing
    links: [{target: sheet, ref: P-04}]
    ports:
      - {id: gox, direction: in}
      - {id: gan, direction: in}
      - {id: goxp, direction: out}
      - {id: ganp, direction: out}
      - {id: power_gox, direction: in, kind: energy}
      - {id: power_gan, direction: in, kind: energy}
      - {id: cw_gox, direction: out, kind: energy}
      - {id: cw_gan, direction: out, kind: energy}

steps:
  - id: K1101
    block: MAC
    title: Main air compressor
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-1101}]
    ports:
      - {id: in, direction: in, delegates: air}
      - {id: out, direction: out}
      - {id: condensate, direction: out, delegates: cond_mac}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  # The DCAC in its two sections (D-067): the lower one on cooling water, the upper one on the
  # chilled water of C-1102, whose heat leaves with the waste N2 (no cooling water)
  - id: C1101
    block: MAC
    title: Direct contact aftercooler, lower (cooling water) section
    class: Cooling
    links: [{target: equipment, ref: C-1101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: condensate, direction: out, delegates: cond_dcac}
      - {id: power, direction: in, kind: energy, delegates: power_aux}
      - {id: cw, direction: out, kind: energy, delegates: cw_dcac}
  - id: C1101U
    block: MAC
    title: Direct contact aftercooler, upper (chilled water) section
    class: Cooling
    links: [{target: equipment, ref: C-1101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
      - {id: condensate, direction: out, delegates: cond_dcac_upper}
  - id: C1102
    block: MAC
    title: Evaporative cooler
    class: Cooling
    links: [{target: equipment, ref: C-1102}]
    ports: [{id: in, direction: in, delegates: evap}, {id: out, direction: out, delegates: evap_out}]
  # D-097: the TSA cycle as a steady-state pair. V2101 (adsorption) takes the H2O and CO2 out of
  # the air (outlet `removed`); M2101 (regeneration) gives them to the hot regeneration gas.
  - id: V2101
    block: PUR
    title: Adsorbers, adsorption
    class: Adsorbing
    links: [{target: equipment, ref: V-2101A}, {target: equipment, ref: V-2101B}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: out, direction: out}
      - {id: removed, direction: out}
  # D-097: the front-end pressure drop between S3 and S4 (bed ~8, F-2101 ~3 kPa, DN700 lines to
  # E-3101, D-089) on one step, since the component separator V2101 has none
  - id: F2101
    block: PUR
    title: Dust filter and front-end pressure drop to E-3101
    class: Filtering
    links: [{target: equipment, ref: F-2101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
  - id: M2101
    block: PUR
    title: Adsorbers, regeneration (desorbed H2O and CO2 into the regeneration gas)
    class: Mixing
    links: [{target: equipment, ref: V-2101A}, {target: equipment, ref: V-2101B}]
    ports:
      - {id: regen_in, direction: in}
      - {id: desorbed, direction: in}
      - {id: regen_out, direction: out, delegates: regen_out}
  - id: E2101
    block: PUR
    title: Regeneration heater
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-2101}]
    ports:
      - {id: in, direction: in, delegates: regen}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: X3102
    block: CB
    title: Booster air split
    class: SplittingMaterial
    ports:
      - {id: in, direction: in, delegates: air}
      - {id: main, direction: out}
      - {id: bst, direction: out}
  - id: K3101
    block: CB
    title: Air booster (braked by KT-3101)
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-3101}]
    ports: [{id: in, direction: in}, {id: out, direction: out}]
  - id: E3104
    block: CB
    title: Booster aftercooler
    class: Cooling
    links: [{target: equipment, ref: E-3104}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw_bst}
  # D-067: the boosted air is trimmed to 15 C on chilled water from C-1102 before E-3101
  # (equipment tag to be added to the lists and P-03)
  - id: E3105
    block: CB
    title: Booster air trim cooler (chilled water)
    class: Cooling
    links: [{target: equipment, ref: E-3105}, {target: instrument, ref: TICA-3124, sheet: P-03}]
    ports: [{id: in, direction: in}, {id: out, direction: out}]
  - id: E3101
    block: CB
    title: Main heat exchanger
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-3101}]
    ports:
      - {id: air, direction: in}
      - {id: bst, direction: in}
      - {id: gox_c, direction: in}
      - {id: gan_c, direction: in}
      - {id: waste_c, direction: in}
      - {id: hp, direction: out}
      - {id: exp, direction: out}
      - {id: gox, direction: out, delegates: gox}
      - {id: gan, direction: out, delegates: gan}
      - {id: waste, direction: out}
  - id: KT3101
    block: CB
    title: Expander (brakes booster K-3101)
    class: ProcessStep
    links: [{target: equipment, ref: KT-3101}]
    ports: [{id: in, direction: in}, {id: out, direction: out}]
  - id: C3101
    block: CB
    title: HP column
    class: Distilling
    links: [{target: equipment, ref: C-3101}]
    ports:
      - {id: feed, direction: in}
      - {id: n2, direction: out}
      - {id: lin, direction: out, delegates: lin}
      - {id: ln, direction: out}
      - {id: crude, direction: out}
  # D-066: subcooler of the LN reflux and the crude oxygen against the cold waste N2; it closes
  # the balance of the condenser-reboiler E-3103
  - id: E3102
    block: CB
    title: Subcooler
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-3102}]
    ports:
      - {id: ln_in, direction: in}
      - {id: crude_in, direction: in}
      - {id: waste_in, direction: in}
      - {id: ln_out, direction: out}
      - {id: crude_out, direction: out}
      - {id: waste_out, direction: out}
  # D-103: the cold-box heat in-leak through the perlite casing, lumped as one heat input (ASSUMED
  # 50 kW) on the cold waste N2 between E-3102 and E-3101. A model step with no equipment of its
  # own: it charges the leak against the refrigeration where the surplus shows (the E-3101
  # warm end), not against the column internals.
  - id: HL3101
    block: CB
    title: Cold-box heat in-leak (model step, no equipment)
    # ExchangingThermalEnergy (with the surroundings): core's build fails on
    # SupplyingThermalEnergy (its method field), and both translate to a DWSIM heater
    class: ExchangingThermalEnergy
    ports: [{id: in, direction: in}, {id: out, direction: out}]
  - id: C3102
    block: CB
    title: LP column
    class: Distilling
    links: [{target: equipment, ref: C-3102}]
    ports:
      - {id: reflux, direction: in}
      - {id: crude, direction: in}
      - {id: lachmann, direction: in}
      - {id: gox, direction: out}
      - {id: lox, direction: out, delegates: lox}
      - {id: waste, direction: out}
  - id: X3101
    block: CB
    title: Waste nitrogen split
    class: SplittingMaterial
    ports:
      - {id: in, direction: in}
      - {id: regen, direction: out, delegates: regen}
      - {id: evap, direction: out, delegates: evap}
      - {id: vent, direction: out, delegates: vent}
  - id: K4101
    block: PRD
    title: GOX compressor
    class: Compressing
    links: [{target: equipment, ref: K-4101}]
    ports:
      - {id: in, direction: in, delegates: gox}
      - {id: out, direction: out, delegates: goxp}
      - {id: power, direction: in, kind: energy, delegates: power_gox}
      - {id: cw, direction: out, kind: energy, delegates: cw_gox}
  - id: K4102
    block: PRD
    title: GAN compressor
    class: Compressing
    links: [{target: equipment, ref: K-4102}]
    ports:
      - {id: in, direction: in, delegates: gan}
      - {id: out, direction: out, delegates: ganp}
      - {id: power, direction: in, kind: energy, delegates: power_gan}
      - {id: cw, direction: out, kind: energy, delegates: cw_gan}

streams:
  # -- DESIGN.md section 3, streams 1-12c (values ASSUMED there unless a requirement) ----------
  - id: S1
    title: Air feed
    links: [{target: line, ref: AIR-1001, sheet: P-01}, {target: instrument, ref: FIC-1101, sheet: P-01}]
    from: AIR.out
    to: K1101.in
    template: air
    state:
      design:
        flow: {value: 113335, provenance: given, source: "D-099, the owner's design specification: the design air rate 85,840 Nm3/h dry (design basis; D-066), i.e. 110,870 kg/h of CO2-free dry air (85,810 Nm3/h, S4), with the CO2 (71 kg/h) and the water (2,394 kg/h) of the composition below (D-097); the O2 recovery behind the rate stays ASSUMED (D-066)"}
        pressure: {value: 1.01, provenance: assumed, source: "DESIGN.md 3, stream 1"}
        temperature: {value: 30, provenance: given, source: "DESIGN.md 3 basis: 30 C ambient"}
        composition: {basis: mole_fraction, values: {N2: 0.7545933, O2: 0.2024348, AR: 0.0090261, H2O: 0.03354, CO2: 0.0004059}, provenance: given, source: "D-099, the owner's design specification of the design air (computed in D-097): dry air N2 78.084, O2 20.9476, Ar 0.934 mol% (U.S. Standard Atmosphere 1976 / ISO 2533 sea-level composition; Ne, He, Kr, Xe, H2, CH4, 27 ppm together, left out) with CO2 420 ppm (design basis), renormalised; water at the design air 30 C, 80 % RH, 1.013 bara (D-099, D-058): 0.8 x 4.247 kPa (IAPWS-95 saturation pressure at 30 C) / 101.3 kPa = 3.354 mol%. The design basis traces (hydrocarbons 5 ppm as CH4, C2H2 50 ppb, N2O 0.33 ppm) are no flowsheet components"}
  - id: S2
    title: Compressed air
    links: [{target: line, ref: AIR-1002, sheet: P-01}]
    from: K1101.out
    to: C1101.in
    template: air
    state:
      design:
        pressure: {value: 6.02, provenance: assumed, source: "ASSUMED (D-079, D-089): S4 5.6 bara + 32 kPa from S3 to S4 + 10 kPa over the DCAC"}
        temperature: {value: 40, provenance: assumed, source: "DESIGN.md 3, stream 2"}
        composition: {basis: mole_fraction, values: {N2: 0.772031, O2: 0.207113, AR: 0.00923468, H2O: 0.0112061, CO2: 0.00041526}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
        flow: {value: 111723.0, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
  - id: S3L
    title: Air between the DCAC sections
    from: C1101.out
    to: C1101U.in
    template: air
    state:
      design:
        temperature: {value: 27, provenance: assumed, source: "ASSUMED (D-067): DCAC lower section on cooling water (25 C supply), 2 K approach"}
        composition: {basis: mole_fraction, values: {N2: 0.776611, O2: 0.208341, AR: 0.00928946, H2O: 0.00534059, CO2: 0.000417716}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
        flow: {value: 111311.0, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
        pressure: {value: 5.97, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
  - id: S3
    title: Precooled air
    links: [{target: line, ref: AIR-1004, sheet: P-01}]
    from: C1101U.out
    to: V2101.in
    template: air
    state:
      design:
        flow: {value: 111080, provenance: assumed, source: "ASSUMED (D-066, D-089): S4 110,870 kg/h + the 210 kg/h H2O and CO2 the adsorbers remove"}
        pressure: {value: 5.92, provenance: assumed, source: "ASSUMED (D-079, D-089): S4 5.6 bara + 32 kPa to E-3101 (DN700 lines at their bound 21.1 kPa, D-080 (1); adsorber bed ~8 and F-2101 ~3 kPa in adsorption)"}
        temperature: {value: 12, provenance: assumed, source: "DESIGN.md 3, stream 3"}
        composition: {basis: mole_fraction, values: {N2: 0.779175, O2: 0.209029, AR: 0.00932014, H2O: 0.00205596, CO2: 0.000419091}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
  - id: S1C
    title: MAC cooler condensate (E-1102, E-1103 drains)
    links: [{target: line, ref: CD-1001, sheet: P-01}, {target: line, ref: CD-1002, sheet: P-01}]
    from: K1101.condensate
    to: COND.mac
    template: air
    state:
      design:
        temperature: {value: 40.0526, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
        pressure: {value: 1.81237, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
        flow: {value: 1612.48, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
        composition: {basis: mole_fraction, values: {N2: 6.61725e-07, O2: 3.22572e-06, AR: 1.37966e-07, H2O: 0.999995, CO2: 8.55884e-07}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
  - id: S3C
    title: DCAC condensate (into the circulating water)
    links: [{target: line, ref: CWR-1001, sheet: P-01}, {target: instrument, ref: LIC-1106, sheet: P-01}]
    from: C1101.condensate
    to: COND.dcac
    template: air
    state:
      design:
        temperature: {value: 27.0, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
        pressure: {value: 5.97, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
        flow: {value: 411.49, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
        composition: {basis: mole_fraction, values: {N2: 5.47941e-07, O2: 3.25685e-06, AR: 1.37462e-07, H2O: 0.999995, CO2: 1.2518e-06}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
  - id: S3CU
    title: DCAC upper-section condensate (into the chilled water)
    links: [{target: line, ref: CHWR-1001, sheet: P-01}]
    from: C1101U.condensate
    to: COND.dcac_upper
    template: air
    state:
      design:
        temperature: {value: 12.0, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
        pressure: {value: 5.92, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
        flow: {value: 228.318, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
        composition: {basis: mole_fraction, values: {N2: 2.86321e-07, O2: 2.19031e-06, AR: 9.08305e-08, H2O: 0.999996, CO2: 1.36176e-06}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
  # D-097: the dry air at the adsorber outlet (V2101 adsorption step), before F-2101
  - id: S4F
    title: Dry air from the adsorbers
    links: [{target: line, ref: AIR-2001, sheet: P-02}]
    from: V2101.out
    to: F2101.in
    template: air
    state:
      design:
        temperature: {value: 12.0, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
        pressure: {value: 5.92, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
        flow: {value: 110870.0, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
        composition: {basis: mole_fraction, values: {N2: 0.781109, O2: 0.209548, AR: 0.00934326, H2O: 0.0, CO2: 0.0}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: d9f2e2d623ca0d23, origin: simulated}
        calculated:
          molar_mass: {value: 28.96, unit: kg/kmol, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR', fingerprint: b7ceb53078d1048a, origin: correlation}
          density: {value: 7.26119, unit: kg/m3, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR', fingerprint: b7ceb53078d1048a, origin: correlation}
          enthalpy: {value: -430.357, unit: kJ/kmol, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR', fingerprint: b7ceb53078d1048a, origin: correlation}
          exergy: {value: 4482.81, unit: kJ/kmol, provenance: calculated, source: 'cheme process props: chemical (Szargut 1988, model II) + physical, dead state 298.15 K, 101.325 kPa', fingerprint: b7ceb53078d1048a, origin: correlation}
        phase: {value: vapor, vapor_fraction: 1.0, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR', fingerprint: b7ceb53078d1048a}
  - id: S4
    title: Dry air to cold box
    links:
      - {target: line, ref: AIR-2001, sheet: P-02}
      - {target: line, ref: AIR-2002, sheet: P-02}
      - {target: instrument, ref: AIA-2102, sheet: P-02}
    from: F2101.out
    to: X3102.in
    template: dry
