        composition: {basis: mole_fraction, values: {N2: 0.7811, O2: 0.2096, AR: 0.0093}, provenance: calculated, source: 'cheme process propagate: pass-through E3104 from S4C', fingerprint: 673ca178f1f346c0}
        calculated:
          molar_mass: {value: 28.9597, unit: kg/kmol, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR', fingerprint: cfeceaad94f333bf}
          density: {value: 9.74838, unit: kg/m3, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR', fingerprint: cfeceaad94f333bf}
          enthalpy: {value: 79.8358, unit: kJ/kmol, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR', fingerprint: cfeceaad94f333bf}
          exergy: {value: 5354.15, unit: kJ/kmol, provenance: calculated, source: 'cheme process props: chemical (Szargut 1988, model II) + physical, dead state 298.15 K, 101.325 kPa', fingerprint: cfeceaad94f333bf}
        phase: {value: vapor, vapor_fraction: 1.0, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR', fingerprint: cfeceaad94f333bf}
  - id: S4E
    title: Boosted air to E-3101
    from: E3105.out
