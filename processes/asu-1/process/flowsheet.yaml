        phase: {value: vapor, vapor_fraction: 1.0, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR', fingerprint: 1c8faf726644c98c}
  - id: S4C
    title: Booster discharge
    links: [{target: line, ref: AIR-3002, sheet: P-03}]
    from: K3101.out
    to: E3104.in
    template: dry
    state:
      design:
        flow: {value: 14870, provenance: assumed, source: "= S4B"}
        pressure: {value: 8.45, provenance: assumed, source: "ASSUMED (D-061): = process/simulation.yaml K3101, 5.6 -> 8.45 bara (compander balance)"}
        composition: {basis: mole_fraction, values: {N2: 0.7811, O2: 0.2096, AR: 0.0093}, provenance: calculated, source: 'cheme process propagate: pass-through K3101 from S4B', fingerprint: 147036c4c80282f9}
        temperature: {value: 59.9327, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 498835a1af3f23d6}
  - id: S4D
    title: Boosted air to the trim cooler
    from: E3104.out
    to: E3105.in
    template: dry
    state:
      design:
        flow: {value: 14870, provenance: assumed, source: "= S4B"}
        pressure: {value: 8.45, provenance: assumed, source: "ASSUMED (D-052, D-061): no pressure drop in E-3104; E-3101 takes it to 8.25 bara at the expander inlet (S5B)"}
