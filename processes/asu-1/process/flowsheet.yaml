# ASU-1 flowsheet, seeded once from DESIGN.md section 3 (main-stream balance). From now on the
# numbers live here; DESIGN.md keeps decisions and prose (`cheme process streams --md`).
# BFD and PFD: `cheme process build` (never edit process/*.xml).
schema: cheme/process/v1
kind: flowsheet
title: ASU-1 (500 t/d GOX)
units:
  {pressure: bar(a), temperature: °C, flow: kg/h, duty: kW, enthalpy: kJ/kmol,
   enthalpy_reference: {state: ideal_gas, temperature: 298.15, pressure: 101.325}}
cases:
  - {id: design, description: "Design case: 30 C ambient, 94 % O2 recovery (ASSUMED)", default: true}
tolerance: {abs: 1.0, rel: 0.005}
# BFD: parallel boundary streams between the same two blocks drawn as one connection (S7 + S9).
bfd: {aggregate: true}

feeds:
  - {id: AIR, title: Ambient air, ports: [{id: out, direction: out}]}
  # Utilities as energy terminals (DESIGN.md section 3 utility table, average operation): the
  # LCA counts them in kWh (lca/lca.yaml).
  - id: POWER
    title: Electric power (6.6 kV grid supply)
    ports:
      - {id: mac, direction: out, kind: energy}
      - {id: aux, direction: out, kind: energy}
      - {id: pur, direction: out, kind: energy}
      - {id: gox, direction: out, kind: energy}
      - {id: gan, direction: out, kind: energy}
products:
  - {id: GOXP, title: GOX to pipeline, ports: [{id: in, direction: in}]}
  - {id: GANP, title: GAN to battery limit, ports: [{id: in, direction: in}]}
  - {id: LOX, title: LOX to storage, ports: [{id: in, direction: in}], links: [{target: equipment, ref: T-4101}]}
  - {id: LIN, title: LIN to storage, ports: [{id: in, direction: in}], links: [{target: equipment, ref: T-4102}]}
  - id: VENT
    title: Vent to atmosphere
    ports: [{id: v1, direction: in}, {id: v2, direction: in}, {id: v3, direction: in}]
  - id: COND
    title: Condensate (MAC cooler drains; DCAC condensate into its circulating water)
    ports: [{id: mac, direction: in}, {id: dcac, direction: in}]
  - id: CW
    title: Cooling water return (heat rejected)
    ports:
      - {id: mac, direction: in, kind: energy}
      - {id: dcac, direction: in, kind: energy}
      - {id: gox, direction: in, kind: energy}
      - {id: gan, direction: in, kind: energy}
      - {id: bst, direction: in, kind: energy}

blocks:
  - id: MAC
    title: Main air compression and precooling
    class: Compressing
    links: [{target: sheet, ref: P-01}]
    ports:
      - {id: air, direction: in}
      - {id: evap, direction: in}
      - {id: out, direction: out}
      - {id: evap_out, direction: out}
      - {id: cond_mac, direction: out}
      - {id: cond_dcac, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: power_aux, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: cw_dcac, direction: out, kind: energy}
  - id: PUR
    title: Front-end purification (TSA)
    class: Adsorbing
    links: [{target: sheet, ref: P-02}]
    ports:
      - {id: in, direction: in}
      - {id: regen, direction: in}
      - {id: out, direction: out}
      - {id: regen_out, direction: out}
      - {id: power, direction: in, kind: energy}
  - id: CB
    title: Cold box
    class: SeparatingByThermalProcess
    links: [{target: sheet, ref: P-03}]
    ports:
      - {id: air, direction: in}
      - {id: gox, direction: out}
      - {id: gan, direction: out}
      - {id: lox, direction: out}
      - {id: lin, direction: out}
      - {id: regen, direction: out}
      - {id: evap, direction: out}
      - {id: vent, direction: out}
      - {id: cw_bst, direction: out, kind: energy}
  - id: PRD
    title: Product compression
    class: Compressing
    links: [{target: sheet, ref: P-04}]
    ports:
      - {id: gox, direction: in}
      - {id: gan, direction: in}
      - {id: goxp, direction: out}
      - {id: ganp, direction: out}
      - {id: power_gox, direction: in, kind: energy}
      - {id: power_gan, direction: in, kind: energy}
      - {id: cw_gox, direction: out, kind: energy}
      - {id: cw_gan, direction: out, kind: energy}

steps:
  - id: K1101
    block: MAC
    title: Main air compressor
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-1101}]
    ports:
      - {id: in, direction: in, delegates: air}
      - {id: out, direction: out}
      - {id: condensate, direction: out, delegates: cond_mac}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: C1101
    block: MAC
    title: Direct contact aftercooler
    class: Cooling
    links: [{target: equipment, ref: C-1101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
      - {id: condensate, direction: out, delegates: cond_dcac}
      - {id: power, direction: in, kind: energy, delegates: power_aux}
      - {id: cw, direction: out, kind: energy, delegates: cw_dcac}
  - id: C1102
    block: MAC
    title: Evaporative cooler
    class: Cooling
    links: [{target: equipment, ref: C-1102}]
    ports: [{id: in, direction: in, delegates: evap}, {id: out, direction: out, delegates: evap_out}]
  - id: V2101
    block: PUR
    title: Adsorbers
    class: Adsorbing
    links: [{target: equipment, ref: V-2101A}, {target: equipment, ref: V-2101B}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: regen_in, direction: in}
      - {id: out, direction: out, delegates: out}
      - {id: regen_out, direction: out, delegates: regen_out}
  - id: E2101
    block: PUR
    title: Regeneration heater
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-2101}]
    ports:
      - {id: in, direction: in, delegates: regen}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: X3102
    block: CB
    title: Booster air split
    class: SplittingMaterial
    ports:
      - {id: in, direction: in, delegates: air}
      - {id: main, direction: out}
      - {id: bst, direction: out}
  - id: K3101
    block: CB
    title: Air booster (braked by KT-3101)
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-3101}]
    ports: [{id: in, direction: in}, {id: out, direction: out}]
  - id: E3104
    block: CB
    title: Booster aftercooler
    class: Cooling
    links: [{target: equipment, ref: E-3104}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw_bst}
  # D-067: the boosted air is trimmed to 15 C on chilled water from C-1102 before E-3101
  # (equipment tag to be added to the lists and P-03)
  - id: E3105
    block: CB
    title: Booster air trim cooler (chilled water)
    class: Cooling
    ports: [{id: in, direction: in}, {id: out, direction: out}]
  - id: E3101
    block: CB
    title: Main heat exchanger
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-3101}]
    ports:
      - {id: air, direction: in}
      - {id: bst, direction: in}
      - {id: gox_c, direction: in}
      - {id: gan_c, direction: in}
      - {id: waste_c, direction: in}
      - {id: hp, direction: out}
      - {id: exp, direction: out}
      - {id: gox, direction: out, delegates: gox}
      - {id: gan, direction: out, delegates: gan}
      - {id: waste, direction: out}
  - id: KT3101
    block: CB
    title: Expander (brakes booster K-3101)
    class: ProcessStep
    links: [{target: equipment, ref: KT-3101}]
    ports: [{id: in, direction: in}, {id: out, direction: out}]
  - id: C3101
    block: CB
    title: HP column
    class: Distilling
    links: [{target: equipment, ref: C-3101}]
    ports:
      - {id: feed, direction: in}
      - {id: n2, direction: out}
      - {id: lin, direction: out, delegates: lin}
      - {id: ln, direction: out}
      - {id: crude, direction: out}
  # D-066: subcooler of the LN reflux and the crude oxygen against the cold waste N2; it closes
  # the balance of the condenser-reboiler E-3103
  - id: E3102
    block: CB
    title: Subcooler
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-3102}]
    ports:
      - {id: ln_in, direction: in}
      - {id: crude_in, direction: in}
      - {id: waste_in, direction: in}
      - {id: ln_out, direction: out}
      - {id: crude_out, direction: out}
      - {id: waste_out, direction: out}
  - id: C3102
    block: CB
    title: LP column
    class: Distilling
    links: [{target: equipment, ref: C-3102}]
    ports:
      - {id: reflux, direction: in}
      - {id: crude, direction: in}
      - {id: lachmann, direction: in}
      - {id: gox, direction: out}
      - {id: lox, direction: out, delegates: lox}
      - {id: waste, direction: out}
  - id: X3101
    block: CB
    title: Waste nitrogen split
    class: SplittingMaterial
    ports:
      - {id: in, direction: in}
      - {id: regen, direction: out, delegates: regen}
      - {id: evap, direction: out, delegates: evap}
      - {id: vent, direction: out, delegates: vent}
  - id: K4101
    block: PRD
    title: GOX compressor
    class: Compressing
    links: [{target: equipment, ref: K-4101}]
    ports:
      - {id: in, direction: in, delegates: gox}
      - {id: out, direction: out, delegates: goxp}
      - {id: power, direction: in, kind: energy, delegates: power_gox}
      - {id: cw, direction: out, kind: energy, delegates: cw_gox}
  - id: K4102
    block: PRD
    title: GAN compressor
    class: Compressing
    links: [{target: equipment, ref: K-4102}]
    ports:
      - {id: in, direction: in, delegates: gan}
      - {id: out, direction: out, delegates: ganp}
      - {id: power, direction: in, kind: energy, delegates: power_gan}
      - {id: cw, direction: out, kind: energy, delegates: cw_gan}

streams:
  # -- DESIGN.md section 3, streams 1-12c (values ASSUMED there unless a requirement) ----------
  - id: S1
    title: Air feed
    links: [{target: line, ref: AIR-1001, sheet: P-01}, {target: instrument, ref: FIC-1101, sheet: P-01}]
    from: AIR.out
    to: K1101.in
    template: air
    state:
      design:
        flow: {value: 113329, provenance: assumed, source: "D-066: D-058's air scaled by 1.1306 for S4 110,870 kg/h: dry air 110,937 kg/h (85,840 Nm3/h) + 2,391 kg/h water at 80 % RH, 30 C"}
        pressure: {value: 1.01, provenance: assumed, source: "DESIGN.md 3, stream 1"}
        temperature: {value: 30, provenance: given, source: "DESIGN.md 3 basis: 30 C ambient"}
        composition: {basis: mole_fraction, values: {N2: 0.754591, O2: 0.20251, AR: 0.009011, H2O: 0.0335, CO2: 0.000388}, provenance: assumed, source: "D-058: design basis 80 % RH at 30 C, 1.013 bara: p_H2O 3.40 kPa = 3.35 mol%; dry air as D-027 (N2 78.075, O2 20.953, Ar 0.932, CO2 0.040 %)"}
  - id: S2
    title: Compressed air
    links: [{target: line, ref: AIR-1002, sheet: P-01}]
    from: K1101.out
    to: C1101.in
    template: air
    state:
      design:
        pressure: {value: 5.8, provenance: assumed, source: "DESIGN.md 3, stream 2"}
        temperature: {value: 40, provenance: assumed, source: "DESIGN.md 3, stream 2"}
        composition: {basis: mole_fraction, values: {N2: 0.77168, O2: 0.207096, AR: 0.00921506, H2O: 0.0116125, CO2: 0.000396769}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 498835a1af3f23d6}
        flow: {value: 111748.0, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 498835a1af3f23d6}
  - id: S3
    title: Precooled air
    links: [{target: line, ref: AIR-1004, sheet: P-01}]
    from: C1101.out
    to: V2101.in
    template: air
    state:
      design:
        flow: {value: 111085, provenance: assumed, source: "ASSUMED (D-066): S4 110,870 kg/h + the 215 kg/h H2O and CO2 the adsorbers remove"}
        pressure: {value: 5.7, provenance: assumed, source: "DESIGN.md 3, stream 3"}
        temperature: {value: 12, provenance: assumed, source: "DESIGN.md 3, stream 3"}
        composition: {basis: mole_fraction, values: {N2: 0.779082, O2: 0.209083, AR: 0.00930346, H2O: 0.0021309, CO2: 0.000400563}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 498835a1af3f23d6}
  - id: S1C
    title: MAC cooler condensate (E-1102, E-1103 drains)
    links: [{target: line, ref: CD-1001, sheet: P-01}, {target: line, ref: CD-1002, sheet: P-01}]
    from: K1101.condensate
    to: COND.mac
    template: air
    state:
      design:
        temperature: {value: 40.0509, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 498835a1af3f23d6}
        pressure: {value: 1.79003, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 498835a1af3f23d6}
        flow: {value: 1580.8, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 498835a1af3f23d6}
        composition: {basis: mole_fraction, values: {N2: 6.45813e-07, O2: 3.14944e-06, AR: 1.34428e-07, H2O: 0.999995, CO2: 7.98778e-07}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 498835a1af3f23d6}
  - id: S3C
    title: DCAC condensate (into the circulating water)
    links: [{target: line, ref: CWR-1001, sheet: P-01}, {target: instrument, ref: LIC-1106, sheet: P-01}]
    from: C1101.condensate
    to: COND.dcac
    template: air
    state:
      design:
        temperature: {value: 12.0, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 498835a1af3f23d6}
        pressure: {value: 5.7, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 498835a1af3f23d6}
        flow: {value: 663.302, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 498835a1af3f23d6}
        composition: {basis: mole_fraction, values: {N2: 2.75765e-07, O2: 2.11049e-06, AR: 8.73407e-08, H2O: 0.999996, CO2: 1.25477e-06}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 498835a1af3f23d6}
  - id: S4
    title: Dry air to cold box
    links:
      - {target: line, ref: AIR-2001, sheet: P-02}
      - {target: line, ref: AIR-2002, sheet: P-02}
      - {target: instrument, ref: AIA-2102, sheet: P-02}
    from: V2101.out
    to: X3102.in
    template: dry
    state:
      design:
        flow: {value: 110870, provenance: assumed, source: "ASSUMED (D-066): HP column air S5 96,000 + expander air S4B 14,870 kg/h (85,930 Nm3/h dry; D-027 had 98,060)"}
        pressure: {value: 5.6, provenance: assumed, source: "DESIGN.md 3, stream 4"}
        temperature: {value: 15, provenance: assumed, source: "DESIGN.md 3, stream 4"}
        composition: {basis: mole_fraction, values: {N2: 0.7811, O2: 0.2096, AR: 0.0093}, provenance: assumed, source: "ASSUMED (D-027): stream 3 with H2O and CO2 removed by the adsorbers (V-2101A/B), renormalised"}
        calculated:
          molar_mass: {value: 28.9597, unit: kg/kmol, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR', fingerprint: 1c8faf726644c98c}
          density: {value: 6.79418, unit: kg/m3, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR', fingerprint: 1c8faf726644c98c}
          enthalpy: {value: -339.305, unit: kJ/kmol, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR', fingerprint: 1c8faf726644c98c}
          exergy: {value: 4341.93, unit: kJ/kmol, provenance: calculated, source: 'cheme process props: chemical (Szargut 1988, model II) + physical, dead state 298.15 K, 101.325 kPa', fingerprint: 1c8faf726644c98c}
        phase: {value: vapor, vapor_fraction: 1.0, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR', fingerprint: 1c8faf726644c98c}
  # -- booster air (D-052): S4 splits at the AIR-3005 branch of AIR-2002; the booster K-3101
  # (braked by KT-3101) and its aftercooler E-3104 sit between the split and E-3101.
  - id: S4A
    title: Main air to E-3101
    from: X3102.main
    to: E3101.air
    template: dry
    state:
      design:
        flow: {value: 96000, provenance: assumed, source: "ASSUMED (D-066): = HP column feed S5 (E3101 only cools it)"}
        composition: {basis: mole_fraction, values: {N2: 0.7811, O2: 0.2096, AR: 0.0093}, provenance: calculated, source: 'cheme process propagate: splitter X3102 from S4', fingerprint: add2d9439a612427}
