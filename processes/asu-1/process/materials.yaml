# Components of ASU-1. Schema cheme/process/v1. property_method is written by
# `cheme process props --fill` (method, validated range, package versions); do not edit it.
schema: cheme/process/v1
kind: materials
components:
  - {id: N2, name: Nitrogen, formula: N2, cas: 7727-37-9, chebi: "CHEBI:17997", molar_mass: 28.014, normal_boiling_point: 77.36}
  - {id: O2, name: Oxygen, formula: O2, cas: 7782-44-7, chebi: "CHEBI:15379", molar_mass: 31.998, normal_boiling_point: 90.19}
  - {id: AR, name: Argon, formula: Ar, cas: 7440-37-1, chebi: "CHEBI:49475", molar_mass: 39.948, normal_boiling_point: 87.30}
  - {id: H2O, name: Water, formula: H2O, cas: 7732-18-5, chebi: "CHEBI:15377", molar_mass: 18.015, normal_boiling_point: 373.12}
  - {id: CO2, name: Carbon dioxide, formula: CO2, cas: 124-38-9, chebi: "CHEBI:16526", molar_mass: 44.009}
templates:
  - {id: air, title: Air (wet), components: [N2, O2, AR, H2O, CO2]}
  - {id: dry, title: Dry air and its products, components: [N2, O2, AR]}
property_method:
  adapter: thermo
  status: configured
  package: air-pr-chemsep
  phase_models:
    vle: phi-phi, Peng-Robinson for both phases
    vapor_density: Peng-Robinson
    liquid_density: COSTALD (chemicals COSTALD_mixture)
    enthalpy: Peng-Robinson departure + ideal-gas heat capacities; ideal gas 298.15 K, 101.325 kPa = 0
  eos: Peng-Robinson (thermo PRMIX)
  binary_interaction: ChemSep PR kij (thermo IPDB 'ChemSep PR')
  application_range:
    temperature:
    - 77.0
    - 315.0
    pressure:
    - 100.0
    - 3200.0
    vle_pressure:
    - 100.0
    - 600.0
    phases:
    - vapor
    - liquid
    - two-phase
    components:
    - 7440-37-1
    - 7727-37-9
    - 7782-44-7
  versions:
    thermo: 0.6.1
    chemicals: 1.5.2
  benchmark:
    test: tests/test_process_props.py
    reference: NIST WebBook reference equations of state (Span 2000 N2, Schmidt-Wagner 1985 O2, Lemmon
      2000 air and N2/O2/Ar mixture), values in tests/data/process_props_references.yaml
    tolerances:
      air_density_rel: 0.005
      gas_density_rel: 0.01
      saturation_temperature_abs_K: 0.3
      liquid_density_rel: 0.015
      two_phase_temperature_abs_K: 0.3
      vapor_fraction_abs: 0.03
