# Operating sequences of the ASU (D-094). Schema: `cheme schema sequences`.
# PROPOSED operating intent at basic engineering, not approved for implementation; the review
# status comes from reviews/. Trips are named by their id in control/cause-effect.yaml and never
# repeated here; start permissives are listed separately from them. Durations, hold points and
# vendor start-up steps are open until the suppliers' procedures (each marked unresolved).
schema: cheme/sequences/v1
sequences:
  - id: SEQ-MAC-START
    title: Start the main air compressor and the precooling
    mode: startup
    section: MAC
    cases: [design]
    equipment: [K-1101, C-1101, C-1102, P-1101A, P-1102A]
    permissives:
      - {tag: K-1101, state: "vendor start permissives healthy (lube oil, VIA-1104, seal air)"}
      - {tag: LIC-1106, state: "below LAH"}
      - {tag: UV-1102, state: open}
      - {loop: FIC-1101, state: in manual}
      - {unresolved: cooling water and the 9.0 MW motor's start conditions (D-070) from the utilities and the MAC vendor}
    interlocks: [I-03]
    steps:
      - id: S1
        title: Start the MAC on blow-off
        actions:
          - {tag: K-1101, action: start, by: operator}
        complete: {tag: K-1101, state: at speed, delay: {value: 60, unit: s}}
        timeout: {value: 10, unit: min}
        on_timeout: abort
        operator: The anti-surge UIC-1102 holds UV-1102 open; the air goes to S-1101.
      - id: S2
        title: Water to the DCAC
        actions:
          - {loop: FIC-1108, action: auto}
          - {loop: LIC-1106, action: auto}
          - {loop: LIC-1107, action: auto}
          - {loop: LIC-1114, action: auto}
        complete:
          all:
            - {loop: LIC-1106, state: in auto}
            - {loop: LIC-1114, state: "at set point"}
        operator: Chilled water from C-1102 comes only once waste N2 flows (cold box running); until then the upper section runs warm and TIC-1105 stays in manual.
      - id: S3
        title: Load the MAC
        actions:
          - {loop: FIC-1101, action: auto, by: operator}
          - {loop: PIC-1103, action: auto}
        complete: {loop: UIC-1102, state: "UV-1102 closed (out of surge)"}
        next: end
    abort:
      condition: {any: [{tag: K-1101, state: tripped}, {tag: LSHH-1106, state: tripped}]}
      actions:
        - {tag: K-1101, action: stop}
      then: SEQ-SHUTDOWN
    reset: {latching: true, manual: true,
            condition: {text: the MAC vendor's trip reset after the cause has cleared},
            restart: {sequence: SEQ-MAC-START, state: "permissives met"}}
    unresolved:
      - the MAC vendor's start-up sequence (inlet guide vanes, blow-off ramp, motor start)
      - LSHH-1106 trips the MAC (instrument list) but is not yet an interlock of control/cause-effect.yaml

  - id: SEQ-TSA
    title: TSA switching cycle (KS-2101)
    mode: normal
    section: PUR
    cases: [design]
    equipment: [V-2101A, V-2101B, E-2101]
    permissives:
      - {loop: FIC-2105, state: "flow established"}
    steps:
      - id: S1
        title: Adsorb on one bed, depressurise the other
        actions:
          - {text: "KS-2101 switches XV-2101..2104 so one bed adsorbs and opens XV-2112 of the other to depressurise it"}
        complete: {tag: KS-2101, state: depressurised}
      - id: S2
        title: Heat
        actions:
          - {loop: TIC-2104, action: auto}
          - {loop: FIC-2105, action: auto}
        complete: {tag: TI-2114A, state: "heat pulse arrived (~110 C, ASSUMED)"}
        operator: TI-2114A for bed A, TI-2114B for bed B.
      - id: S3
        title: Cool
        actions:
          - {loop: TIC-2104, action: manual}
          - {text: KS-2101 opens the heater bypass XV-2109 and switches E-2101 off}
        complete: {text: the cooling time of the adsorber supplier}
      - id: S4
        title: Repressurise
        actions:
          - {text: KS-2101 opens XV-2111 of the regenerated bed}
        complete: {tag: KS-2101, state: pressures equal}
      - id: S5
        title: Switch the beds
        entry:
          all:
            - {tag: AIA-2102, state: "CO2 below 1 ppm"}
            - {tag: AIA-2103, state: "dew point below -70 C"}
        actions:
          - {text: KS-2101 puts the regenerated bed on line and takes the other off}
        complete: {tag: KS-2101, state: switched}
        next: S1
    abort:
      condition: {any: [{tag: AIA-2102, state: "CO2 high-high"}, {tag: TSHH-2116, state: tripped}, {tag: TSHH-2107, state: tripped}]}
      actions:
        - {text: "CO2 high-high forces a bed switch, or trips the MAC (D-010); a heater trip holds the cycle in its heating step"}
    reset: {latching: true, manual: true}
    unresolved:
      - the step times of the 4 h cycle (adsorber supplier; ASSUMED 4 h adsorption, D-006)
      - the AIA-2102 high-high and the heater trips are not yet interlocks of control/cause-effect.yaml

  - id: SEQ-CB-START
    title: Cool down and start the cold box, then the products
    mode: startup
    section: CB
    cases: [design]
    equipment: [E-3101, C-3101, C-3102, K-3101, KT-3101, K-4101, K-4102]
    permissives:
      - {sequence: SEQ-MAC-START, state: complete}
      - {sequence: SEQ-TSA, state: running}
      - {tag: AIA-2102, state: "CO2 below 1 ppm"}
      - {tag: PDSLL-3115, state: "seal gas established (before the lube oil, D-012)"}
      - {loop: PIC-3113, state: in auto}
      - {unresolved: the cold box supplier's cool-down rates and hold points}
    interlocks: [I-04]
    steps:
      - id: S1
        title: Air into the cold box
        actions:
          - {loop: PIC-3110, action: auto}
          - {loop: PIC-4101, action: auto}
        complete: {loop: PIC-3110, state: in auto}
        operator: With K-4101 stopped, PIC-4101 holds the LP column pressure on PV-4101B (vent, D-019).
      - id: S2
        title: Start the compander
        actions:
          - {tag: K-3101, action: start, by: operator}
          - {loop: UIC-3120, action: auto}
          - {loop: SIC-3108, action: auto}
          - {loop: TIC-3109, action: auto}
        complete: {loop: SIC-3108, state: "at set point"}
        timeout: {value: 30, unit: min}
        on_timeout: abort
        operator: E-3105 shell-side drain checked dry before the boosted air is admitted (D-077).
      - id: S3
        title: Cool down
        actions:
          - {loop: TICA-3124, action: auto}
          - {loop: TIC-1105, action: auto}
        complete: {all: [{tag: LIC-3101, state: level appears}, {tag: LICA-3102, state: "above LAL (E-3103 submerged)"}]}
        operator: The cool-down takes days; the rates are the supplier's. TIC-1105 goes to auto once C-1102 gives chilled water.
      - id: S4
        title: Columns in operation
        actions:
          - {loop: LIC-3101, action: auto}
          - {loop: FIC-3106, action: auto}
          - {loop: FIC-3111, action: auto}
        complete: {loop: FIC-3111, state: "above its low alarm (hydrocarbon purge flowing)"}
        operator: The LOX purge must flow before liquid accumulates in the sump (D-010).
      - id: S5
        title: Product purities
        actions:
          - {loop: FIC-3106, action: setpoint,
             setpoint: {value: 29280, unit: kg/h, provenance: calculated, origin: simulated,
                        source: "S18 (D-066)", cases: [design], stream: S18, property: flow}}
        complete:
          all:
            - {tag: AI-3104, state: "GOX at least 99.5 % O2"}
            - {tag: AIA-3105, state: "GAN below 10 ppm O2 (XV-3105 closed)"}
            - {tag: AIA-3103, state: below the action limit}
        timeout: {value: 48, unit: h}
        on_timeout: abort
      - id: S6
        title: Start the product compressors
        actions:
          - {tag: K-4101, action: start, by: operator}
          - {loop: UIC-4103, action: auto}
          - {tag: K-4102, action: start, by: operator}
          - {loop: UIC-4131, action: auto}
          - {loop: FIC-3107, action: auto}
          - {loop: FIC-4105, action: auto}
        complete: {all: [{loop: PIC-4101, state: "PV-4101B closed (K-4101 takes the GOX)"}, {loop: FIC-3107, state: at set point}]}
        operator: "The GOX block valves open only after their bypasses have equalised the pressure (HV-4129, HV-4130; EIGA Doc 13, D-024)."
        next: end
    abort:
      condition: {any: [{tag: K-3101, state: tripped}, {tag: SSHH-3108, state: tripped}, {tag: AIA-3103, state: above the action limit}]}
      actions:
        - {text: "a compander trip: I-04 closes TV-3124; continue with SEQ-COMPANDER-TRIP"}
      then: SEQ-COMPANDER-TRIP
    reset: {latching: true, manual: true,
            condition: {text: the cause found and cleared},
            restart: {sequence: SEQ-COMPANDER-TRIP, state: complete}}
    unresolved:
      - the cold box supplier's cool-down procedure and the expander's start-up curve
      - the hydrocarbon action limits of AIA-3103 (EIGA Doc 65, ASSUMED) and what they trip

  - id: SEQ-COMPANDER-TRIP
    title: Compander trip and restart
    mode: abnormal
    section: CB
    equipment: [K-3101, KT-3101, E-3105]
    permissives:
      - {tag: K-3101, state: tripped}
    interlocks: [I-04]
    steps:
      - id: S1
        title: Refrigeration lost
        entry: {interlock: I-04, state: tripped}
        actions:
          - {loop: TICA-3124, action: manual}
          - {text: turn the liquid production down; the products stay on line while the column holds (operator judgement)}
        complete: {tag: K-3101, state: stopped}
        operator: "The cold box warms slowly; a long stop means a liquid hold-up or a shutdown (SEQ-SHUTDOWN). Judge from LICA-3102 and the purities."
      - id: S2
        title: Check before the restart
        actions:
          - {text: "drain E-3105 at its shell-side low point; water found means bypassing the booster flow until it is repaired (D-077)"}
        complete: {all: [{tag: E-3105, state: shell side checked dry}, {tag: PDSLL-3115, state: seal gas established}]}
        operator: The TSA dries only the air before the booster, so this check is what protects E-3101 (D-077).
      - id: S3
        title: Restart
        entry: {interlock: I-04, state: reset}
        actions:
          - {tag: K-3101, action: start, by: operator}
          - {loop: SIC-3108, action: auto}
          - {loop: TICA-3124, action: auto}
        complete: {loop: SIC-3108, state: at set point}
        timeout: {value: 30, unit: min}
        on_timeout: abort
        next: end
    abort:
      actions:
        - {sequence: SEQ-SHUTDOWN, action: run}
      then: SEQ-SHUTDOWN
    reset: {latching: true, manual: true, condition: {interlock: I-04, state: reset},
            restart: {all: [{tag: E-3105, state: shell side checked dry}, {tag: PDSLL-3115, state: seal gas established}]}}

  - id: SEQ-BACKUP-GOX
    title: GOX backup from the LOX tank
    mode: abnormal
    section: PRD
    equipment: [T-4101, P-4101A, P-4101B, E-4105A, E-4105B]
    permissives:
      - {tag: LIA-4107, state: "above LAL (backup reserve)"}
      - {tag: P-4101A, state: "cold (cool-down return HV-4138 open, D-014)"}
    interlocks: [I-01]
    steps:
      - id: S1
        title: Start the standby pump
        entry: {tag: PIC-4111, state: "header pressure low", delay: {value: 5, unit: s}}
        actions:
          - {tag: P-4101A, action: start, by: automatic}
          - {loop: PIC-4111, action: auto}
        complete: {tag: TSLL-4113, state: "vaporizer outlet above the low trip"}
        timeout: {value: 5, unit: min}
        on_timeout: abort
      - id: S2
        title: Supply
        actions:
          - {text: the backup holds the GOX header until the ASU returns or the tank reaches its low-low level}
        complete: {sequence: SEQ-CB-START, state: complete}
        next: end
    abort:
      condition: {any: [{interlock: I-01, state: tripped}, {tag: TSLL-4113, state: tripped}]}
      actions:
        - {tag: P-4101A, action: stop}
    reset: {latching: true, manual: true}
    unresolved:
      - TSLL-4113 stops the pumps (instrument list) but is not yet an interlock of control/cause-effect.yaml
      - the backup start pressure (client and pipeline) and which pump is standby

  - id: SEQ-BACKUP-GAN
    title: GAN backup from the LIN tank
    mode: abnormal
    section: PRD
    equipment: [T-4102, P-4102A, P-4102B, E-4106A, E-4106B]
    permissives:
      - {tag: LIA-4108, state: "above LAL"}
      - {tag: P-4102A, state: "cold (cool-down return HV-4139 open, D-014)"}
    interlocks: [I-02]
    steps:
      - id: S1
        title: Start the standby pump
        entry: {tag: PIC-4112, state: "header pressure low", delay: {value: 5, unit: s}}
        actions:
          - {tag: P-4102A, action: start, by: automatic}
          - {loop: PIC-4112, action: auto}
        complete: {tag: TSLL-4114, state: "vaporizer outlet above the low trip"}
        timeout: {value: 5, unit: min}
        on_timeout: abort
      - id: S2
        title: Supply
        actions:
          - {text: the backup holds the GAN header until the ASU returns or the tank reaches its low-low level}
        complete: {sequence: SEQ-CB-START, state: complete}
        next: end
    abort:
      condition: {any: [{interlock: I-02, state: tripped}, {tag: TSLL-4114, state: tripped}]}
      actions:
        - {tag: P-4102A, action: stop}
    reset: {latching: true, manual: true}
    unresolved:
      - TSLL-4114 stops the pumps (instrument list) but is not yet an interlock of control/cause-effect.yaml

  - id: SEQ-SHUTDOWN
    title: Normal shutdown
    mode: shutdown
    equipment: [K-4101, K-4102, K-3101, K-1101]
    interlocks: [I-01, I-02, I-03, I-04]
    steps:
      - id: S1
        title: Take the customers to the backup
        actions:
          - {text: "tell the customers; the backup takes over on low header pressure (SEQ-BACKUP-GOX, SEQ-BACKUP-GAN)"}
        complete: {text: the customers confirm}
        operator: Coordinate with the customers; the backup lasts 2 days at 25 % GOX and 50 % GAN (D-014).
      - id: S2
        title: Stop the product compressors
        actions:
          - {tag: K-4101, action: stop}
          - {tag: K-4102, action: stop}
        complete: {loop: PIC-4101, state: "PV-4101B venting the GOX (LP column pressure held)"}
        operator: The GOX blowdown of K-4101 is the vendor's stop sequence (XV-4116, D-013).
      - id: S3
        title: Stop the compander
        actions:
          - {tag: K-3101, action: stop}
        complete: {tag: K-3101, state: stopped}
      - id: S4
        title: Stop the MAC
        actions:
          - {loop: FIC-1101, action: manual}
          - {tag: K-1101, action: stop}
        complete: {tag: K-1101, state: stopped}
        operator: The cold box keeps its liquid for a warm restart; a derime is a separate procedure (D-010 (6)).
        next: end
    abort:
      notes: A trip during the shutdown is handled by the C&E; the sequence holds where it is.
    reset: {latching: false, manual: true}
    unresolved:
      - how long the cold box may stand before it must be drained (supplier)
