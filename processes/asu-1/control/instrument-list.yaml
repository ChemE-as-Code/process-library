# Instrument list. Schema: `cheme schema instruments`.
# Key loops at stage concept; tags per DESIGN.md D-007 (ISA 5.1 letters + <section><nnn>).
instruments:
  # ---- P-01
  - {tag: PDIA-1101, service: F-1101 inlet filter differential pressure, sheet: P-01, notes: "High alarm starts pulse cleaning."}
  - {tag: FIC-1101, service: MAC air flow, sheet: P-01, notes: "Acts on K-1101 inlet guide vanes; set from GOX demand."}
  - {tag: UIC-1102, service: MAC anti-surge control, sheet: P-01, notes: "Vendor package; acts on blow-off valve UV-1102 to S-1101."}
  - {tag: PIC-1103, service: MAC discharge pressure, sheet: P-01, notes: "Override on IGV / blow-off."}
  - {tag: VIA-1104, service: K-1101 vibration and bearing monitoring, sheet: P-01, notes: "Trip on high-high (machine protection)."}
  - {tag: TIC-1105, service: DCAC air outlet temperature, sheet: P-01, notes: "Adjusts chilled water flow; high alarm protects TSA capacity."}
  - {tag: LIC-1106, service: DCAC sump level, sheet: P-01, notes: "Level control via LV-1106; high alarm (D-005)."}
  - {tag: LSHH-1106, service: DCAC sump level high-high trip, sheet: P-01, notes: "Trips the MAC only (no XV on AIR-1004: the MAC trip stops the air flow and the check valve on AIR-1002 holds; D-005). Independent of LIC-1106 (SIF, SIL to be set in HAZOP)."}
  - {tag: LIC-1107, service: Evaporative cooler sump level, sheet: P-01, notes: "Make-up water."}
  - {tag: LIC-1114, service: DCAC chimney tray level (upper-section chilled water draw-off), sheet: P-01, notes: "Acts on LV-1114 (fail closed) on CHWR-1001 to the C-1102 top: keeps a water seal on the chimney tray so no 5.7 bara air blows through to the atmospheric C-1102 (D-069). The independent low-low protection is LSLL-1115 (D-076)."}
  - {tag: LSLL-1115, service: DCAC chimney tray level low-low trip, sheet: P-01, notes: "Own tapping I4 on the C-1101 chimney tray, independent of LIC-1114: closes XV-1115 (tight-shut, fail closed) on CHWR-1001 so no 5.7 bara air blows through to the atmospheric C-1102 when the tray seal is lost (C&E I-03, D-076). SIL from the screening / HAZOP."}
  - {tag: FIC-1108,service: Cooling water flow to DCAC, sheet: P-01, notes: "Acts on FV-1108."}
  - {tag: TIA-1110, service: K-1101 stage discharge and intercooler outlet temperatures, sheet: P-01, notes: "Multipoint in the MAC vendor package: stage 1/2/3 discharge and E-1101/E-1102 air outlets, TAH each (CW failure, fouling), 120 C stage / 45 C cooler outlet ASSUMED."}
  - {tag: TIA-1111, service: E-1103 aftercooler air outlet temperature (AIR-1002), sheet: P-01, notes: "TAH 50 C ASSUMED (CW failure; protects DCAC and TSA)."}
  # ---- P-02
  - {tag: KS-2101, service: TSA adsorber switching sequence, sheet: P-02, notes: "Sequence controller: switching valves XV-2101..2104A/B, repressurization XV-2111A/B, depressurization XV-2112A/B, heater bypass XV-2109 (cooling step)."}
  - {tag: AIA-2102, service: "CO2 and N2O at adsorber outlet (NDIR, two channels)", sheet: P-02, notes: "CO2 alarm 1 ppm, N2O alarm 0.1 ppm (ASSUMED); high-high CO2 forces bed switch / MAC trip (D-010). C2H2 is not measured continuously here: it is held by the sieve well beyond CO2 breakthrough (EIGA Doc 65), so CO2 is the leading breakthrough indicator; C2H2/THC are measured in the LP sump liquid (AIA-3103) and LOX tank (AIA-4121)."}
  - {tag: AIA-2103, service: H2O dew point at adsorber outlet, sheet: P-02, notes: "Alarm -70 C dew point (ASSUMED)."}
  - {tag: TIC-2104, service: Regeneration heater outlet temperature, sheet: P-02, notes: "Thyristor control of E-2101, 200 C."}
  - {tag: FIC-2105, service: Regeneration gas flow, sheet: P-02, notes: "Low flow trips E-2101. FV-2105 DN600 (line size, D-072): 1.5 kPa allowed at the normal 18,486 kg/h (ASSUMED allocation of the regeneration path, sizing script section 11); the valve supplier sizes the trim."}
  - {tag: PDI-2115A, service: V-2101A bed differential pressure, sheet: P-02, notes: "Bed fouling / dusting and flow distribution check (S4 review)."}
  - {tag: PDI-2115B, service: V-2101B bed differential pressure, sheet: P-02, notes: "As PDI-2115A."}
  - {tag: TSHH-2116, service: regeneration gas heater outlet high-high temperature, sheet: P-02, notes: "On RG-2002 downstream of E-2101: trips the heater (independent of TIC-2104 and of the shell TSHH-2107); protects the sieve and the bed internals (S4 review)."}
  - {tag: PDIA-2106, service: F-2101 dust filter differential pressure, sheet: P-02, notes: ""}
  - {tag: TSHH-2107, service: E-2101 element over-temperature trip, sheet: P-02, notes: "Independent of TIC-2104."}
  - {tag: TI-2113A, service: V-2101A dry air outlet temperature, sheet: P-02, notes: "Heat-pulse breakthrough / hot bed on-line alarm via KS-2101 (TAH 45 C ASSUMED)."}
  - {tag: TI-2113B, service: V-2101B dry air outlet temperature, sheet: P-02, notes: "As TI-2113A."}
  - {tag: TI-2114A, service: V-2101A regeneration gas outlet temperature, sheet: P-02, notes: "Heat pulse arrival ends heating step (KS-2101), ~110 C ASSUMED."}
  - {tag: TI-2114B, service: V-2101B regeneration gas outlet temperature, sheet: P-02, notes: "As TI-2114A."}
  # ---- P-03
  - {tag: LIC-3101, service: HP column sump level, sheet: P-03, notes: "Acts on rich liquid JT valve LV-3101."}
  - {tag: LICA-3102, service: LP column sump level (condenser submergence), sheet: P-03, notes: "Low alarm: E-3103 must stay submerged (D-010)."}
  - {tag: AIA-3103, service: "Hydrocarbons (THC, C2H2) in LP sump LOX", sheet: P-03, notes: "Sampled from LOX-3001 at the sump outlet. Analyzer house; alarm and action limits per EIGA Doc 65 (ASSUMED). Hydrocarbon protection."}
  - {tag: AI-3104, service: O2 purity of GOX product, sheet: P-04, notes: "Paramagnetic, 99.5 % min (99.71 % simulated, D-066). Moved to P-04: measured on GOX-4001 at the K-4101 suction (warm product header)."}
  - {tag: AIA-3105, service: O2 trace in GAN product, sheet: P-04, notes: "Alarm 10 ppm; opens XV-3105 (GAN divert to VNT-4004) and closes XV-4120. Moved to P-04: measured on GAN-4001 at the K-4102 suction, where the divert-to-vent valve is."}
  - {tag: AIA-3122, service: O2 in cold box casing breather exhaust, sheet: P-03, notes: "Alarm high 23 % O2 (ASSUMED): O2 enrichment of the casing from a cold-box leak (EIGA Doc 65, O2 review F7); low alarm 19.5 % at the breather marks N2 escape for personnel."}
  - {tag: FIC-3106, service: LN reflux flow to LP column, sheet: P-03, notes: "Acts on FV-3106."}
  - {tag: FIC-3107, service: GAN product flow, sheet: P-04, notes: "Moved to P-04: acts on the K-4102 inlet guide vanes."}
  - {tag: SIC-3108, service: Expander KT-3101 speed, sheet: P-03, notes: "Inlet nozzle control; SSHH-3108 overspeed trip closes the quick-closing inlet valve."}
  - {tag: SSHH-3108, service: Expander overspeed trip, sheet: P-03, notes: "Independent speed probes, 2oo3."}
  - {tag: TIC-3109, service: Expander outlet temperature, sheet: P-03, notes: "Low limit avoids liquid at expander outlet."}
  - {tag: PIC-3110, service: LP column top pressure, sheet: P-03, notes: "Waste N2 back-pressure valve at warm end."}
  - {tag: FIC-3111, service: LOX hydrocarbon purge flow from LP sump, sheet: P-03, notes: ">= 0.2 % of O2 product (ASSUMED); low flow alarm. Hydrocarbon protection (D-010)."}
  - {tag: PDI-3112, service: LP column differential pressure, sheet: P-03, notes: "Flooding indication."}
  - {tag: PDSLL-3115, service: Compander KT-3101/K-3101 seal gas minus bearing housing pressure low-low, sheet: P-03, notes: "Permissive: lube oil pump starts only with seal gas established; trip: closes expander inlet XV and stops the compander. Keeps oil out of the Lachmann air to the LP column (D-012)."}
  - {tag: PIC-3113, service: Cold box casing N2 purge pressure, sheet: P-03, notes: "Keeps casing above atmospheric (D-013)."}
  - {tag: PI-3121, service: HP column C-3101 top pressure, sheet: P-03, notes: "With PIC-3110 (LP top) gives the condenser temperature approach; alarm high below PSV-3116 set."}
  - {tag: TICA-3124, service: E-3105 boosted air outlet temperature (trim cooler), sheet: P-03, notes: "TIC with high alarm: set point 15 C, TAH 18.5 C (the minimum acceptable trim, cold box +60.4 kW, D-067); acts on TV-3124 (fail open) on the chilled-water supply CHW-3001. On loss of E-3105 the liquid production is turned down (D-067, D-069)."}
  - {tag: UIC-3120,service: Booster K-3101 anti-surge, sheet: P-03, notes: "Flow at the suction (AIR-3005) and pressure ratio; opens recycle valve UV-3120 (fail open) on AIR-3006. Discharge check valve downstream of the recycle tee (D-003)."}
  # ---- P-04
  - {tag: PIC-4101, service: GOX compressor suction pressure, sheet: P-04, notes: "Split range: output A to the K-4101 inlet guide vane actuator (no separate PV-4101A valve body; label 'IGV (output A)' in D-019) and PV-4101B suction vent to S-4102 on K-4101 trip and start-up; protects LP column pressure (D-019)."}
  - {tag: PIC-4102, service: GOX export pressure, sheet: P-04, notes: "30 barg."}
  - {tag: UIC-4103, service: GOX compressor anti-surge, sheet: P-04, notes: "Recycle via GOX-4003 (UV-4103). Flow input FI-4148 on GOX-4001 at the K-4101 suction (D-024)."}
  - {tag: TSHH-4104, service: GOX compressor stage temperature trip (fire detection), sheet: P-04, notes: "Trips K-4101, closes ESD valves, depressurizes to vent (D-013)."}
  - {tag: FIC-4105, service: GAN export flow, sheet: P-04, notes: ""}
  - {tag: UIC-4131, service: GAN compressor anti-surge, sheet: P-04, notes: "Acts on UV-4131 (fail open) in recycle GAN-4004 from the E-4103 outlet to the K-4102 suction."}
  - {tag: PIC-4106, service: GAN compressor suction pressure, sheet: P-04, notes: ""}
  - {tag: LIA-4107, service: LOX tank level, sheet: P-04, notes: "Low alarm: backup reserve. LALL trips P-4101A/B and closes XV-4136 (pump dry-run protection, D-024)."}
  - {tag: LIA-4108, service: LIN tank level, sheet: P-04, notes: "LALL trips P-4102A/B and closes XV-4137 (D-024)."}
  - {tag: PICA-4109, service: LOX tank pressure, sheet: P-04, notes: "Vent to safe location; PSVs and vacuum breaker backup (D-011)."}
  - {tag: PICA-4110, service: LIN tank pressure, sheet: P-04, notes: ""}
  - {tag: PIC-4111, service: Backup GOX header pressure (start of P-4101A/B), sheet: P-04, notes: "Low header pressure auto-starts LOX backup (D-014)."}
  - {tag: PIC-4112, service: Backup GAN header pressure (start of P-4102A/B), sheet: P-04, notes: "Low header pressure auto-starts LIN backup (D-014)."}
  - {tag: TSLL-4113, service: LOX vaporizer outlet low temperature trip, sheet: P-04, notes: "Stops P-4101A/B, protects CS pipeline."}
  - {tag: TSLL-4114, service: LIN vaporizer outlet low temperature trip, sheet: P-04, notes: "Stops P-4102A/B."}
  - {tag: AI-4115, service: GOX export purity, sheet: P-04, notes: "Custody / quality at BL."}
  - {tag: FQI-4149, service: GOX export flow totaliser at BL, sheet: P-04, notes: "Custody / billing, beside AI-4115 on GOX-4002 (D-024). Element type in detail engineering, O2-clean."}
  - {tag: FI-4148, service: GOX compressor suction flow, sheet: P-04, notes: "On GOX-4001 at the K-4101 suction; input to UIC-4103 anti-surge (D-024). O2-clean."}
  - {tag: AIA-4121, service: "Hydrocarbons (THC, C2H2) in LOX tank liquid", sheet: P-04, notes: "Sample from tank bottom to the analyzer house, periodic; alarm per EIGA Doc 65 (ASSUMED). Tank liquid can concentrate hydrocarbons by boil-off (D-010)."}
