# Instrument list. Schema: `cheme schema instruments`.
# Key loops at stage concept; tags per DESIGN.md D-007 (ISA 5.1 letters + <section><nnn>).
instruments:
  # ---- P-01
  - {tag: PDIA-1101, service: F-1101 inlet filter differential pressure, sheet: P-01, notes: "High alarm starts pulse cleaning."}
  - {tag: FIC-1101, service: MAC air flow, sheet: P-01, notes: "Acts on K-1101 inlet guide vanes; set from GOX demand."}
  - {tag: UIC-1102, service: MAC anti-surge control, sheet: P-01, notes: "Vendor package; acts on blow-off valve UV-1102 to S-1101."}
  - {tag: PIC-1103, service: MAC discharge pressure, sheet: P-01, notes: "Override on IGV / blow-off."}
  - {tag: VIA-1104, service: K-1101 vibration and bearing monitoring, sheet: P-01, notes: "High-high: C&E I-05 (machine protection, MAC vendor's API 670 system; SIL 1 from the screening LOPA, D-111)."}
  - {tag: TIC-1105, service: DCAC air outlet temperature, sheet: P-01, notes: "Adjusts chilled water flow; high alarm protects TSA capacity."}
  - {tag: LIC-1106, service: DCAC sump level, sheet: P-01, notes: "Level control via LV-1106; high alarm (D-005)."}
  - {tag: LSHH-1106, service: DCAC sump level high-high trip, sheet: P-01, notes: "C&E I-06: the MAC trip set, with the DCAC water pumps (no XV on AIR-1004: the MAC trip stops the air flow and the check valve on AIR-1002 holds; D-005). Independent of LIC-1106; SIL 1 from the screening LOPA (D-111)."}
  - {tag: LIC-1107, service: Evaporative cooler sump level, sheet: P-01, notes: "Make-up water."}
  - {tag: PSLL-1116, service: Instrument air header pressure low-low, notes: "On the instrument air header leaving the IA package (utilities, not drawn on the process sheets; the utility P&ID is detail engineering). C&E I-19 stops the plant when the air is lost with power on (D-114)."}
  - {tag: LIC-1114, service: DCAC chimney tray level (upper-section chilled water draw-off), sheet: P-01, notes: "Acts on LV-1114 (fail closed) on CHWR-1001 to the C-1102 top: keeps a water seal on the chimney tray so no 5.92 bara air (D-089) blows through to the atmospheric C-1102 (D-069). The independent low-low protection is LSLL-1115 (D-076). LV-1114 valve requirement (supplier-facing, I-03 SIF basis): fully open it passes at most 2 x the normal 34.4 m3/h, i.e. 69 m3/h of chilled water at the CHWR-1001 conditions; no larger trim for rangeability, or the 144 s process safety time of I-03 shrinks (D-088 (4), D-090). ASSUMED for the SRS."}
  - {tag: LSLL-1115, service: DCAC chimney tray level low-low trip, sheet: P-01, notes: "Own tapping I4 on the C-1101 chimney tray, independent of LIC-1114: closes XV-1115 (tight-shut, fail closed) on CHWR-1001 so no 5.92 bara air (D-089) blows through to the atmospheric C-1102 when the tray seal is lost (C&E I-03, D-076). SIL 1 from the screening LOPA (D-083), for HAZOP / LOPA confirmation. Trip at 13.35 m above the column bottom (tapping I4 at 13.1 m, LIC-1114 set point 13.50 m, seal loss 13.20 m), process safety time 144 s, SIF response at most 15 s (D-088 (4), ASSUMED for the SRS)."}
  - {tag: FIC-1108,service: Cooling water flow to DCAC, sheet: P-01, notes: "Acts on FV-1108."}
  - {tag: TIA-1110, service: K-1101 stage discharge and intercooler outlet temperatures, sheet: P-01, notes: "Multipoint in the MAC vendor package: stage 1/2/3 discharge and E-1101/E-1102 air outlets, TAH each (CW failure, fouling), 120 C stage / 45 C cooler outlet ASSUMED."}
  - {tag: TIA-1111, service: E-1103 aftercooler air outlet temperature (AIR-1002), sheet: P-01, notes: "TAH 50 C ASSUMED (CW failure; protects DCAC and TSA)."}
  # ---- P-02
  - {tag: KS-2101, service: TSA adsorber switching sequence, sheet: P-02, notes: "Sequence controller: switching valves XV-2101..2104A/B, repressurization XV-2111A/B, depressurization XV-2112A/B, heater bypass XV-2109 (cooling step). Fail positions (D-109): XV-2101..2104A/B fail last (double acting, an air reservoir per valve for one stroke, ASSUMED), XV-2111A/B and XV-2112A/B fail closed, XV-2109 fails open; after a power dip KS-2101 holds the step it was in and resumes only on the operator's release, never with a default change-over (H02-A6)."}
  - {tag: AIA-2102, service: "CO2 and N2O at adsorber outlet (NDIR, two channels)", sheet: P-02, notes: "CO2 alarm 1 ppm, N2O alarm 0.1 ppm (ASSUMED); CO2 high-high 2 ppm (ASSUMED) is C&E I-07, the MAC trip set (D-010, D-111; SIL 1, SIL 2 with a second analyser if the intake survey finds hydrocarbon sources). C2H2 is not measured continuously here: it is held by the sieve well beyond CO2 breakthrough (EIGA Doc 65), so CO2 is the leading breakthrough indicator; C2H2/THC are measured in the LP sump liquid (AIA-3103) and LOX tank (AIA-4121)."}
  - {tag: AIA-2103, service: H2O dew point at adsorber outlet, sheet: P-02, notes: "Alarm -70 C dew point (ASSUMED)."}
  - {tag: TIC-2104, service: Regeneration heater outlet temperature, sheet: P-02, notes: "Thyristor control of E-2101, 200 C."}
  - {tag: FIC-2105, service: Regeneration gas flow, sheet: P-02, notes: "Control only; the heater's low-flow protection is FSLL-2117 on the heater side (C&E I-08, H02-A2). FV-2105 DN600 (line size, D-072): 1.5 kPa allowed at the normal 18,486 kg/h (ASSUMED allocation of the regeneration path, sizing script section 11); the valve supplier sizes the trim."}
  - {tag: PDI-2115A, service: V-2101A bed differential pressure, sheet: P-02, notes: "Bed fouling / dusting and flow distribution check (S4 review)."}
  - {tag: PDI-2115B, service: V-2101B bed differential pressure, sheet: P-02, notes: "As PDI-2115A."}
  - {tag: TSHH-2116, service: regeneration gas heater outlet high-high temperature, sheet: P-02, notes: "On RG-2002 downstream of E-2101: C&E I-09 (independent of TIC-2104 and of the shell TSHH-2107); protects the sieve and the bed internals (S4 review)."}
  - {tag: FSLL-2117, service: regeneration heater low-low flow (heater side), sheet: P-02, notes: "Flow switch (or its own transmitter) on RG-2001 between the XV-2109 bypass tee and E-2101, so it sees the heater flow only; independent of FIC-2105, which sits upstream of the bypass (H02-A2). C&E I-08 (D-111). Fitted where RG-2001 drops to about 1 m at the E-2101 inlet, so it is reached from grade for the proof test (D-114; the model has no tap point per line instrument, #66); to the heater protection relay via JB-A2-2."}
  - {tag: PDIA-2106, service: F-2101 dust filter differential pressure, sheet: P-02, notes: "Clean element 3 kPa (design allowable, D-079); high alarm 5 kPa = element change (ASSUMED until the filter supplier's change-out drop, D-080 (1))."}
  - {tag: TSHH-2107, service: E-2101 element over-temperature trip, sheet: P-02, notes: "Independent of TIC-2104. C&E I-10."}
  - {tag: TI-2113A, service: V-2101A dry air outlet temperature, sheet: P-02, notes: "Heat-pulse breakthrough / hot bed on-line alarm via KS-2101 (TAH 45 C ASSUMED)."}
  - {tag: TI-2113B, service: V-2101B dry air outlet temperature, sheet: P-02, notes: "As TI-2113A."}
  - {tag: TI-2114A, service: V-2101A regeneration gas outlet temperature, sheet: P-02, notes: "Heat pulse arrival ends heating step (KS-2101), ~110 C ASSUMED."}
  - {tag: TI-2114B, service: V-2101B regeneration gas outlet temperature, sheet: P-02, notes: "As TI-2114A."}
  # ---- P-03
  - {tag: LIC-3101, service: HP column sump level, sheet: P-03, notes: "Acts on rich liquid JT valve LV-3101."}
  - {tag: LICA-3102, service: LP column sump level (condenser submergence), sheet: P-03, notes: "Low alarm: E-3103 must stay submerged (D-010); set so the operator has at least 10 min at the largest over-draw before the LSLL-3125 low-low acts (C&E I-14; H03-A4, D-111, ASSUMED); high alarm against the bottom packing (H03-S36)."}
  - {tag: LSLL-3125, service: LP column sump level low-low (E-3103 submergence), sheet: P-03, notes: "Own tapping I4 and transmitter on C-3102, independent of LICA-3102 and of the K-4101 guide-vane low select: C&E I-14 stops the air (MAC trip set) and K-4101 before E-3103 is uncovered, so the condenser stops boiling (H03-A4, H04-A23; SIL 2 from the screening LOPA, D-111 / D-114). Trip above the E-3103 top by the cold box supplier's margin; impulse lines to its own stand on CB-1 P20; SIS junction box JB-A3-S1."}
  - {tag: AIA-3103, service: "Hydrocarbons (THC, C2H2) in LP sump LOX", sheet: P-03, notes: "Sampled from LOX-3001 at the sump outlet. Analyzer house; alarm and action limits per EIGA Doc 65 (ASSUMED). Hydrocarbon protection."}
  - {tag: AI-3104, service: O2 purity of GOX product, sheet: P-04, notes: "Paramagnetic, 99.5 % min (99.71 % simulated, D-066). Moved to P-04: measured on GOX-4001 at the K-4101 suction (warm product header)."}
  - {tag: AIA-3105, service: O2 trace in GAN product, sheet: P-04, notes: "Alarm 10 ppm: C&E I-18 opens XV-3105 (GAN divert to VNT-4004) and closes XV-4120. Moved to P-04: measured on GAN-4001 at the K-4102 suction, where the divert-to-vent valve is."}
  - {tag: AIA-3122, service: O2 in cold box casing breather exhaust, sheet: P-03, notes: "Alarm high 23 % O2 (ASSUMED): O2 enrichment of the casing from a cold-box leak (EIGA Doc 65, O2 review F7); low alarm 19.5 % at the breather marks N2 escape for personnel."}
  - {tag: FIC-3106, service: LN reflux flow to LP column, sheet: P-03, notes: "Acts on FV-3106."}
  - {tag: FIC-3107, service: GAN product flow, sheet: P-04, notes: "Moved to P-04: acts on the K-4102 inlet guide vanes; its set point comes from PIC-4105 in cascade (D-096; drawn on P-04, D-101)."}
  - {tag: SIC-3108, service: Expander KT-3101 speed, sheet: P-03, notes: "Inlet nozzle control; the overspeed protection is SSHH-3108 (C&E I-11), independent of this loop."}
  - {tag: SSHH-3108, service: Expander overspeed trip, sheet: P-03, notes: "Independent speed probes, 2oo3: C&E I-11 closes XV-3117 and trips the compander (SIL 2 from the screening LOPA, D-111)."}
  - {tag: TIC-3109, service: Expander outlet temperature, sheet: P-03, notes: "Low limit avoids liquid at expander outlet."}
  - {tag: PIC-3110, service: LP column top pressure, sheet: P-03, notes: "Waste N2 back-pressure valve at warm end."}
  - {tag: FIC-3111, service: LOX hydrocarbon purge flow from LP sump, sheet: P-03, notes: ">= 0.2 % of O2 product (ASSUMED); low flow alarm. Hydrocarbon protection (D-010)."}
  - {tag: PDI-3112, service: LP column differential pressure, sheet: P-03, notes: "Flooding indication."}
  - {tag: PDSLL-3115, service: Compander KT-3101/K-3101 seal gas minus bearing housing pressure low-low, sheet: P-03, notes: "Permissive: lube oil pump starts only with seal gas established; low-low: C&E I-12 closes XV-3117 and stops the compander (SIL 2, D-111). Keeps oil out of the Lachmann air to the LP column (D-012)."}
  - {tag: PIC-3113, service: Cold box casing N2 purge pressure, sheet: P-03, notes: "Keeps casing above atmospheric (D-013)."}
  - {tag: PI-3121, service: HP column C-3101 top pressure, sheet: P-03, notes: "With PIC-3110 (LP top) gives the condenser temperature approach; alarm high below PSV-3116 set."}
  - {tag: TICA-3124, service: E-3105 boosted air outlet temperature (trim cooler), sheet: P-03, notes: "TIC with high alarm: set point 15 C, TAH 18.5 C (the minimum acceptable trim, cold box +60.4 kW, D-067); acts on TV-3124 (fail open) on the chilled-water supply CHW-3001. On loss of E-3105 the liquid production is turned down (D-067, D-069)."}
  - {tag: UIC-3120,service: Booster K-3101 anti-surge, sheet: P-03, notes: "Flow at the suction (AIR-3005) and pressure ratio; opens recycle valve UV-3120 (fail open) on AIR-3006. Discharge check valve downstream of the recycle tee (D-003)."}
  # ---- P-04
  - {tag: PIC-4101, service: GOX compressor suction pressure (vent), sheet: P-04, notes: "Acts on PV-4101B, the suction vent to S-4102, with its set point above the normal suction pressure: it vents the GOX while K-4101 is not running and at start-up (D-019), and at turndown, when the customer takes less than the cold box makes and PIC-4102 closes the guide vanes (D-096; whether that is acceptable is H04-A26). Its transmitter PT-4101 taps GOX-4001 upstream of the suction ESD XV-4117 (S1), so it still sees the column side when XV-4117 is shut. No longer split range: the guide vanes are PIC-4102's, limited by FIC-4148 and PIC-4150 (D-096). The signal to PV-4101B is not drawn. The LP column pressure is PIC-3110's (D-095)."}
  - {tag: PSHH-4152, service: GOX discharge pressure high-high (own transmitter), sheet: P-04, notes: "Own transmitter PT-4152 on GOX-4002 beside PT-4102, so a PT-4102 fault cannot defeat both the pressure control and the trip (H04-A29): C&E I-17 trips K-4101 (SIL 1, D-111). A PT-4102 / PT-4152 deviation alarm in the DCS. PT-4152 is remote-mounted on a stand on valve platform VP-5 (deck 8.35 m) with a short impulse line from its tap on the PR1 edge, so it is reached for the proof test (D-114; tap positions with #66); SIS junction box JB-A4-S1."}
  - {tag: PIC-4102, service: GOX export pressure, sheet: P-04, notes: "30 barg. The high-high protection is PSHH-4152 on its own transmitter (C&E I-17). Holds the pipeline pressure on the K-4101 inlet guide vanes, through the low select UY-4151 with the limits FIC-4148 (maximum draw) and PIC-4150 (suction low limit) (D-096; drawn on P-04, D-101)."}
  - {tag: UIC-4103, service: GOX compressor anti-surge, sheet: P-04, notes: "Recycle via GOX-4003 (UV-4103). Flow input FIC-4148 (its transmitter FT-4148) on GOX-4001 at the K-4101 suction (D-024)."}
  - {tag: TSHH-4104, service: GOX compressor stage temperature trip (fire detection), sheet: P-04, notes: "C&E I-13: trips K-4101, closes XV-4117 / XV-4118, opens the blowdown XV-4116 (D-013; SIL 1, D-111)."}
  - {tag: PIC-4105, service: GAN export pressure, sheet: P-04, notes: "Holds the GAN export pressure (9 bara, S9B) as the master of FIC-3107 (cascade: its output is FIC-3107's set point, D-096; the cascade signal is drawn on P-04, D-101). PV-4105 on GAN-4002 stays as an actuated valve, normally fully open; PIC-4105 no longer acts on it, so its drawn signal from PIC-4105 was removed (D-101). The operator sets it from the DCS (D-105, noted on P-04): fully open in normal operation, a back-pressure on the K-4102 discharge only while the GAN header is pressurised at start-up (to confirm, or remove the valve: H04-A31). Was FIC-4105 / FV-4105 (D-095)."}
  - {tag: UIC-4131, service: GAN compressor anti-surge, sheet: P-04, notes: "Acts on UV-4131 (fail open) in recycle GAN-4004 from the E-4103 outlet to the K-4102 suction."}
  - {tag: PIC-4106, service: GAN compressor suction pressure, sheet: P-04, notes: ""}
  - {tag: LIA-4107, service: LOX tank level, sheet: P-04, notes: "Low alarm: backup reserve. LALL trips P-4101A/B and closes XV-4136 (pump dry-run protection, D-024)."}
  - {tag: LIA-4108, service: LIN tank level, sheet: P-04, notes: "LALL trips P-4102A/B and closes XV-4137 (D-024)."}
  - {tag: PICA-4109, service: LOX tank pressure, sheet: P-04, notes: "Vent to safe location; PSVs and vacuum breaker backup (D-011)."}
  - {tag: PICA-4110, service: LIN tank pressure, sheet: P-04, notes: ""}
  - {tag: PIC-4111, service: Backup GOX header pressure (start of P-4101A/B), sheet: P-04, notes: "Low header pressure auto-starts LOX backup (D-014)."}
  - {tag: PIC-4112, service: Backup GAN header pressure (start of P-4102A/B), sheet: P-04, notes: "Low header pressure auto-starts LIN backup (D-014)."}
  - {tag: TSLL-4113, service: LOX vaporizer outlet low temperature trip, sheet: P-04, notes: "C&E I-15: stops P-4101A/B and closes PV-4111, protects the CS pipeline (SIL 1, D-111)."}
  - {tag: TSLL-4114, service: LIN vaporizer outlet low temperature trip, sheet: P-04, notes: "C&E I-16: stops P-4102A/B and closes PV-4112 (SIL 1, D-111)."}
  - {tag: AI-4115, service: GOX export purity, sheet: P-04, notes: "Custody / quality at BL."}
  - {tag: FQI-4149, service: GOX export flow totaliser at BL, sheet: P-04, notes: "Custody / billing, beside AI-4115 on GOX-4002 (D-024). Element type in detail engineering, O2-clean."}
  - {tag: FIC-4148, service: GOX product flow (GOX draw), sheet: P-04, notes: "On GOX-4001 at the K-4101 suction: the maximum GOX draw, a limit in the low select UY-4151 on the K-4101 inlet guide vanes with PIC-4102 (master) and PIC-4150 (D-096); also the flow input to UIC-4103 anti-surge (D-024). Was FI-4148. O2-clean."}
  - {tag: PIC-4150, service: GOX suction pressure low limit, sheet: P-04, notes: "Own transmitter PT-4150 on GOX-4001 at the K-4101 suction, between XV-4117 and the machine (S3); its signal goes to the low select UY-4151 (D-101). It throttles the guide vanes through the low select with PIC-4102 and FIC-4148 when the suction pressure falls (a GOX over-draw, HAZOP H04-S75). It sits in the same control system as the loops it limits, so it is not an independent layer (H04-A23 remains) (D-096)."}
  - {tag: UY-4151, service: K-4101 guide-vane low select, sheet: P-04, notes: "DCS function block (computing relay, '<'): passes the lowest of PIC-4102 (pipeline pressure master), FIC-4148 (maximum draw) and PIC-4150 (suction low limit) to the K-4101 inlet guide vanes (D-096, drawn D-101). No transmitter of its own. Anti-windup (external reset feedback to the unselected loops) and bumpless transfer: control engineer, detail. Not a protection layer (H04-A23)."}
  - {tag: AIA-4121, service: "Hydrocarbons (THC, C2H2) in LOX tank liquid", sheet: P-04, notes: "Sample from tank bottom to the analyzer house, periodic; alarm per EIGA Doc 65 (ASSUMED). Tank liquid can concentrate hydrocarbons by boil-off (D-010)."}
