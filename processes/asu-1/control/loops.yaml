  - id: PIC-4111
    title: Backup GOX header pressure
    purpose: Hold the export header from the LOX backup when the ASU does not supply (D-014).
    section: PRD
    variable: pressure
    measurement: [{tag: PIC-4111}]
    controller: PIC-4111
    action: reverse
    final_elements:
      - {tag: PV-4111, kind: valve, fail: closed}
    targets:
      - {kind: setpoint, unresolved: the backup start pressure below the 30 barg export (client and pipeline) (#103)}
    modes: [manual, auto]
    normal_mode: auto
    rationale: The low header pressure also starts the standby pump (SEQ-BACKUP-GOX). PV-4111 is closed while the pumps stand (tight shut-off class V ASSUMED, D-024).
    notes: "PV-4111 fails closed (D-109): no cold gas into the carbon steel pipeline. The backup therefore needs instrument air as much as power; which supply keeps it up is H04-A14 (owner and customer)."
  - id: PIC-4112
