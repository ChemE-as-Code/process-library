# Control loop register of the ASU: the regulatory loops (D-094). Schema: `cheme schema loops`.
# PROPOSED control intent at basic engineering, not approved for implementation; the review
# status comes from reviews/. Trips are in control/cause-effect.yaml (named by id here), the
# instruments in control/instrument-list.yaml. Loop id = the controller tag on the P&ID.
# Conventions (core docs/framework/control.md): action direct = the output rises with the
# measurement; fail = the position on loss of signal or instrument air; a value left out is not
# known yet (cheme.control-incomplete), never a default. Set points that are a design-case value
# name their stream, and cheme validate keeps the two in step.
schema: cheme/loops/v1
loops:
  # ---- MAC: main air compression and precooling (P-01) --------------------------------------
  - id: FIC-1101
    title: MAC air flow
    purpose: Set the air to the plant from the GOX demand (D-001); the main throughput handle.
    section: MAC
    cases: [design]
    variable: flow
    measurement: [{tag: FIC-1101}]
    controller: FIC-1101
    action: reverse
    final_elements:
      - {tag: K-1101, kind: drive, fail: closed}   # the K-1101 inlet guide vanes to their minimum stop (D-109; vendor actuator)
    targets:
      - {kind: setpoint, value: 111720, unit: kg/h, provenance: calculated, origin: simulated,
         source: "S2 (cheme process simulate, D-066 / D-089)", cases: [design], stream: S2, property: flow}
    modes: [manual, auto]
    normal_mode: auto
    links:
      - {type: override, loop: PIC-1103, select: low,
         notes: "both move the IGV; the lower output wins, so discharge pressure limits the flow (ASSUMED selector)"}
    rationale: The air flow is the master of the whole plant; the columns follow it. The GOX demand sets it (operator set point at basic engineering; a GOX-header cascade is for detail engineering).
    operator: "Sets the target load between 70 and 100 % of the design air flow; a ramp generator moves the set point at no more than 0.5 % of the design flow per minute (D-110, ASSUMED). The air flow is not slaved to PIC-4102: pipeline transients are taken by the pipeline pack and the backup (D-110)."
    unresolved:
      - the K-1101 guide-vane actuator and its minimum stop, which the closed fail position of D-109 assumes (MAC vendor) (#58)
  - id: PIC-1103
    title: MAC discharge pressure (override)
    purpose: Keep the MAC discharge within its limit while the flow controller loads the machine.
    section: MAC
    cases: [design]
    variable: pressure
    measurement: [{tag: PIC-1103}]
    controller: PIC-1103
    action: reverse
    final_elements:
      - {tag: K-1101, kind: drive, fail: closed}
    targets:
      - {kind: high, unresolved: "the override limit, above the normal discharge pressure (S2 6.02 bara at the DN700 bound, D-079 / D-089) by the MAC vendor's margin (#58)"}
    modes: [manual, auto]
    normal_mode: auto
    links:
      - {type: override, loop: FIC-1101, select: low}
    rationale: An override, not a second set point; it acts only when the discharge pressure reaches its limit, which must lie above the normal operating pressure.
    unresolved:
      - the override limit and margin (MAC vendor) (#58)
  - id: UIC-1102
    title: MAC anti-surge
    purpose: Keep K-1101 out of surge at start-up, turndown and trips by blowing off to S-1101.
    section: MAC
    variable: other
    measurement: [{tag: UIC-1102}]
    controller: UIC-1102
    final_elements:
      - {tag: UV-1102, kind: valve, fail: open}
    targets:
      - {kind: setpoint, unresolved: the surge control line of the MAC vendor package (#58)}
    modes: [manual, auto]
    normal_mode: auto
    rationale: Vendor package (instrument list); the blow-off is the only flow path while the plant takes no air. UV-1102 fails open (D-109, as H01-A6 proposes).
    unresolved:
      - controller action (MAC vendor) (#58)
  - id: TIC-1105
    title: DCAC air outlet temperature
    purpose: Cool the air to the TSA design temperature; the TSA capacity depends on it (D-005, D-006).
    section: MAC
    cases: [design]
    variable: temperature
    measurement: [{tag: TIC-1105}]
    controller: TIC-1105
    action: direct
    final_elements:
      - {tag: TV-1105, kind: valve, fail: closed}
    targets:
      - {kind: setpoint, value: 12, unit: °C, provenance: assumed, source: "S3 precooled air (D-005, D-067)",
         cases: [design], stream: S3, property: temperature}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: TIC-1105, condition: TAH, response: "Check the chilled water (C-1102, P-1102A/B) and the waste N2 to C-1102; a warm TSA inlet shortens the adsorption step: tell the TSA operator (KS-2101)."}
    rationale: "More chilled water through TV-1105 lowers the air temperature, so the controller is direct acting. TV-1105 fails closed (D-109): once the MAC unloads there is no air to cool, and an open water valve against the closed LV-1106 would flood the DCAC."
    unresolved:
      - the TAH value (#103)
  - id: LIC-1106
    title: DCAC sump level
    purpose: Hold the water level in the DCAC sump; a high level would carry water to the TSA (D-005).
    section: MAC
    variable: level
    measurement: [{tag: LIC-1106}]
    controller: LIC-1106
    action: direct
    final_elements:
      - {tag: LV-1106, kind: valve, fail: closed}
    targets:
      - {kind: setpoint, unresolved: the C-1101 sump level range of the column supplier (#103)}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: LIC-1106, condition: LAH, response: "Check LV-1106 and the circulating water pumps P-1101A/B; the high-high level LSHH-1106 trips the MAC."}
    interlocks: [I-06]
    rationale: The trip LSHH-1106 (I-06) has its own tapping and is independent of this loop (instrument list).
  - id: LIC-1107
    title: Evaporative cooler sump level (make-up)
    purpose: Make up the water the evaporative cooler C-1102 loses to the waste N2 and blowdown.
    section: MAC
    variable: level
    measurement: [{tag: LIC-1107}]
    controller: LIC-1107
    action: reverse
    final_elements:
      - {tag: LV-1107, kind: valve, fail: closed}
    targets:
      - {kind: setpoint, unresolved: the C-1102 sump level range of its supplier (#103)}
    modes: [manual, auto]
    normal_mode: auto
    rationale: "LV-1107 is the make-up only (~0.6 t/h at 703 kW, D-069 (2)); a rising level closes it. It fails closed (D-109): failed open it floods C-1102 towards the WN-1001 inlet (H01-A13), while the sump holds hours of make-up."
  - id: FIC-1108
    title: Cooling water to the DCAC lower section
    section: MAC
    variable: flow
    measurement: [{tag: FIC-1108}]
    controller: FIC-1108
    action: reverse
    final_elements:
      - {tag: FV-1108, kind: valve, fail: closed}
    targets:
      - {kind: setpoint, unresolved: the circulating water flow of the C-1101 lower section (column supplier) (#103)}
    modes: [manual, auto]
    normal_mode: auto
    rationale: FV-1108 fails closed with TV-1105 and LV-1106 (D-109), so the DCAC cannot flood on air loss.
  - id: LIC-1114
    title: DCAC chimney tray level (water seal)
    purpose: Keep a water seal on the chimney tray so no 5.92 bara air blows through to the atmospheric C-1102 (D-069, D-076).
    section: MAC
    cases: [design]
    variable: level
    measurement: [{tag: LIC-1114}]
    controller: LIC-1114
    action: direct
    final_elements:
      - {tag: LV-1114, kind: valve, fail: closed}
    targets:
      - {kind: setpoint, value: 13.5, unit: m, provenance: assumed, source: "above the column bottom; D-088 (4), SRS basis ASSUMED"}
    modes: [manual, auto]
    normal_mode: auto
    interlocks: [I-03]
    rationale: LV-1114 fails closed, so a lost signal keeps the seal. The low-low protection is I-03 on its own tapping (LSLL-1115 / XV-1115), independent of this loop; LV-1114's trim is limited to 2 x the normal flow so I-03's process safety time holds (instrument list, D-090).
    operator: A falling level with LV-1114 closed means a downcomer or chilled-water problem; I-03 acts at 13.35 m.
  # ---- PUR: front-end purification (P-02) ------------------------------------------------------
  - id: TIC-2104
    title: Regeneration heater outlet temperature
    purpose: Heat the regeneration gas to 200 C for the TSA heating step (D-006).
    section: PUR
    cases: [design]
    variable: temperature
    measurement: [{tag: TIC-2104}]
    controller: TIC-2104
    action: reverse
    final_elements:
      - {tag: E-2101, kind: heater, actuator: electric, fail: "off"}   # thyristor control
    targets:
      - {kind: setpoint, value: 200, unit: °C, provenance: assumed, source: D-006,
         cases: [design], stream: S12H, property: temperature}
    modes: [manual, auto]
    normal_mode: auto
    interlocks: [I-08, I-09, I-10]
    rationale: TSHH-2116 (gas outlet, I-09), TSHH-2107 (element, I-10) and the heater-side low flow FSLL-2117 (I-08) are independent of this loop and trip the heater.
  - id: FIC-2105
    title: Regeneration gas flow
    purpose: Hold the waste N2 flow through the heater and the regenerating bed.
    section: PUR
    cases: [design]
    variable: flow
    measurement: [{tag: FIC-2105}]
    controller: FIC-2105
    action: reverse
    final_elements:
      - {tag: FV-2105, kind: valve, fail: open}
    targets:
      - {kind: setpoint, value: 18486, unit: kg/h, provenance: assumed, source: "D-027, D-072",
         cases: [design], stream: S12A, property: flow}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: FIC-2105, condition: FAL, response: "Switch the heater off if it is still on; check FV-2105 and the waste N2 split, then let KS-2101 resume the heating step."}
    rationale: FV-2105 fails open (D-109) so the gas keeps flowing through E-2101 while its trips de-energise it; the TSA switching valves fail last and the step valves closed (KS-2101 in the instrument list, D-109). The heater's low-flow trip is I-08 on its own flow switch FSLL-2117 on the heater side, not this transmitter, which sits upstream of the XV-2109 bypass (H02-A2).
  # ---- CB: cold box (P-03) -----------------------------------------------------------------
  - id: LIC-3101
    title: HP column sump level
    purpose: Pass the rich liquid to the LP column at the rate it collects.
    section: CB
    variable: level
    measurement: [{tag: LIC-3101}]
    controller: LIC-3101
    action: direct
    final_elements:
      - {tag: LV-3101, kind: valve, fail: closed}    # the rich liquid JT valve
    targets:
      - {kind: setpoint, unresolved: the C-3101 sump level range of the cold box supplier (#103)}
    modes: [manual, auto]
    normal_mode: auto
    rationale: LV-3101 fails closed (D-109), so the HP sump keeps its liquid for the restart and no HP vapour blows through to the LP column.
  - id: LICA-3102
    title: LP column sump level (condenser submergence)
    purpose: Keep E-3103 fully submerged, no dry boiling (D-010 (3)).
    section: CB
    variable: level
    measurement: [{tag: LICA-3102}]
    controller: LICA-3102
    targets:
      - {kind: low, unresolved: the E-3103 submergence level of the cold box supplier (#103)}
    modes: [manual, auto]
    alarms:
      - {tag: LICA-3102, condition: LAL, response: "E-3103 must stay submerged: raise the liquid make (expander load, SIC-3108) or cut the GOX draw (FIC-1101 / the K-4101 load) or the LOX withdrawal above the FIC-3111 purge minimum; never stop the purge. Set so the operator has at least 10 min at the largest over-draw before LSLL-3125 trips (I-14; H03-A4, ASSUMED)."}
      - {tag: LICA-3102, condition: LAH, response: "Liquid towards the bottom packing (H03-S36): restore the LOX draw (FIC-3111, the route to T-4101 or the drain vaporizer) or reduce the liquid make."}
    interlocks: [I-14]
    rationale: The sump level follows the column's liquid balance; which valve it acts on is the cold box supplier's (D-010). The independent low-low is LSLL-3125 on its own tapping (I-14, D-111).
    unresolved:
      - the manipulated variable (LOX withdrawal or refrigeration) and the controller action (cold box supplier) (#58)
  - id: FIC-3106
    title: LN reflux to the LP column
    section: CB
    cases: [design]
    variable: flow
    measurement: [{tag: FIC-3106}]
    controller: FIC-3106
    action: reverse
    final_elements:
      - {tag: FV-3106, kind: valve, fail: closed}
    targets:
      - {kind: setpoint, value: 29280, unit: kg/h, provenance: calculated, origin: simulated,
         source: "S18 (cheme process simulate, D-066)", cases: [design], stream: S18, property: flow}
    modes: [manual, auto]
    normal_mode: auto
    rationale: The LN reflux sets the LP column's top purity (GAN and waste); it is the main purity handle with the air flow.
    operator: Adjusts the set point on the GAN and waste purities (AIA-3105, AI-3104). FV-3106 fails closed with LV-3101 (D-109).
  - id: SIC-3108
    title: Expander speed
    purpose: Hold the compander speed; the expander produces the refrigeration (D-003).
    section: CB
    variable: speed
    measurement: [{tag: SIC-3108}]
    controller: SIC-3108
    action: reverse
    final_elements:
      - {tag: KT-3101, kind: other, fail: closed}    # the expander inlet nozzles (vendor), with XV-3117 fail closed (D-109)
    targets:
      - {kind: setpoint, unresolved: the compander speed of its vendor (#58)}
    modes: [manual, auto]
    normal_mode: auto
    interlocks: [I-11, I-12]
    rationale: The overspeed trip SSHH-3108 (2oo3, I-11) closes XV-3117 and is independent of this loop; the seal-gas trip is I-12.
    unresolved:
      - the nozzle actuator, which the closed fail position of D-109 assumes (compander vendor) (#58)
  - id: TIC-3109
    title: Expander outlet temperature (low limit)
    purpose: Keep the Lachmann air above its dew point, so no liquid forms at the expander outlet.
    section: CB
    cases: [design]
    variable: temperature
    measurement: [{tag: TIC-3109}]
    controller: TIC-3109
    targets:
      - {kind: low, unresolved: "the minimum exhaust superheat above the dew point at 1.35 bara (S6 -178 C in the design case; compander supplier, H03-A18) (#58)"}
    modes: [manual, auto]
    normal_mode: auto
    rationale: A low limit, not a set point. What it acts on is open (H03-A18); the design names no final element.
    unresolved:
      - what TIC-3109 acts on and its action (compander supplier, H03-A18) (#58)
  - id: UIC-3120
    title: Booster anti-surge
    purpose: Keep the booster K-3101 out of surge at start-up and turndown (D-003).
    section: CB
    variable: other
    measurement: [{tag: UIC-3120}]
    controller: UIC-3120
    final_elements:
      - {tag: UV-3120, kind: valve, fail: open}
    targets:
      - {kind: setpoint, unresolved: the surge control line of the compander vendor (#58)}
    modes: [manual, auto]
    normal_mode: auto
    rationale: Recycle AIR-3006 from the E-3104 outlet back to AIR-3005 (cooled gas, so the recycle does not heat the suction); the compander has no other flow path while XV-3117 is closed (D-003).
    unresolved:
      - controller action (compander vendor) (#58)
  - id: PIC-3110
    title: LP column top pressure (waste N2 split range)
    purpose: Hold the LP column pressure; the waste N2 goes to the evaporative cooler first, the surplus to the vent (D-067, D-071).
    section: CB
    cases: [design]
    variable: pressure
    measurement: [{tag: PIC-3110}]
    controller: PIC-3110
    action: direct
    final_elements:
      - {tag: PV-3110A, kind: valve, fail: open, range: [0, 50]}     # WN-1001 to C-1102
      - {tag: PV-3110B, kind: valve, fail: open, range: [50, 100]}   # WN-3003 surplus to the vent S-3101
    targets:
      - {kind: setpoint, value: 1.3, unit: bar(a), provenance: assumed, source: "D-001 LP top, D-071",
         cases: [design], stream: S16, property: pressure}
    modes: [manual, auto]
    normal_mode: auto
    rationale: The LP column pressure master (D-095); the GOX draw follows PIC-4102's pipeline pressure, limited by FIC-4148 and PIC-4150, and PIC-4101 only vents the GOX K-4101 does not take (D-096). Higher pressure opens the waste path, so direct acting. Both valves fail open (D-109), so air loss never blocks the LP column in; PSV-3114 protects it if both are shut while the expander and the JT valves keep feeding it (D-011).
    unresolved:
      - the split point between PV-3110A and PV-3110B (ASSUMED 50 %) (#103)
  - id: FIC-3111
    title: LOX purge from the LP sump (hydrocarbon protection)
    purpose: Withdraw the LOX product continuously; it is the hydrocarbon purge of the sump (D-010 (2)).
    section: CB
    cases: [design]
    variable: flow
    measurement: [{tag: FIC-3111}]
    controller: FIC-3111
    action: reverse
    final_elements:
      - {tag: FV-3111, kind: valve, fail: closed}
    targets:
      - {kind: setpoint, value: 470, unit: kg/h, provenance: assumed, source: "D-010, D-017",
         cases: [design], stream: S10, property: flow}
      - {kind: low, value: 43, unit: kg/h, provenance: assumed, source: "0.2 % of the O2 product, ~30 Nm3/h (EIGA Doc 65, D-010)"}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: FIC-3111, condition: FAL, response: "Restore the purge at once (FV-3111, the route to T-4101, or the drain vaporizer V-3101 when the tank is unavailable); check AIA-3103. Never run the column without the purge."}
    rationale: A safety-relevant regulatory loop, but not a safeguard; the protection layers are the TSA, the analyzers and the submergence (D-010).
    operator: Keeps the purge on even when the LOX tank is full (drain vaporizer).
    notes: "FV-3111 fails closed (D-109): open draws more LOX than the column makes and can uncover E-3103 within the hour (H03-S33); closed stops the purge, which FAL and AIA-3103 catch over hours, and on air loss the MAC is unloaded so no new hydrocarbon enters. The independent LP sump low-low is I-14 (D-111)."
  - id: PIC-3113
    title: Cold box casing purge pressure
    purpose: Keep the casing above atmospheric with dry N2, no moist air ingress (D-013).
    section: CB
    variable: pressure
    measurement: [{tag: PIC-3113}]
    controller: PIC-3113
    action: reverse
    final_elements:
      - {tag: PV-3113, kind: valve, fail: open}
    targets:
      - {kind: setpoint, unresolved: the casing overpressure of the cold box supplier (a few mbar) (#103)}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: AIA-3122, condition: AAH, response: "O2 above 23 % (ASSUMED, instrument list) at the breather: a cold-box leak enriches the casing; find it, keep the purge on (EIGA Doc 65, D-010)."}
    rationale: PV-3113 fails open (D-109), so the casing stays purged; the breather relieves it.
  - id: TICA-3124
    title: E-3105 boosted air outlet temperature (trim cooler)
    purpose: Hold the boosted air at 15 C into E-3101; the cold box's refrigeration balance depends on it (D-067).
    section: CB
    cases: [design]
    variable: temperature
    measurement: [{tag: TICA-3124}]
    controller: TICA-3124
    action: direct
    final_elements:
      - {tag: TV-3124, kind: valve, fail: open}
    targets:
      - {kind: setpoint, value: 15, unit: °C, provenance: assumed, source: D-067,
         cases: [design], stream: S4E, property: temperature}
      - {kind: high, value: 18.5, unit: °C, provenance: assumed, source: "the minimum acceptable trim, cold box +60.4 kW (D-067)"}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: TICA-3124, condition: TAH, response: "Above 18.5 C the cold box loses its margin: check the chilled water (P-1102A/B, C-1102). Turning the liquid production down (D-067, D-069) has no loop yet: LIN-3001 has no flow control (H03-A7) and the LOX product is the hydrocarbon purge."}
    interlocks: [I-04]
    rationale: TV-3124 fails open, so a lost signal keeps the trim; I-04 closes it on a compander trip (D-077).
  # ---- PRD: product compression, storage and backup (P-04) ----------------------------------
  - id: PIC-4102
    title: GOX export pressure (master of the K-4101 guide vanes)
    purpose: Hold the pipeline at its 30 barg; the GOX draw follows the customer's off-take (D-096).
    section: PRD
    cases: [design]
    variable: pressure
    measurement: [{tag: PIC-4102}]
    controller: PIC-4102
    action: reverse
    final_elements:
      - {tag: K-4101, kind: drive, fail: closed}      # the K-4101 inlet guide vanes to their minimum stop, through the low select (D-109)
    targets:
      - {kind: setpoint, value: 31, unit: bar(a), provenance: given, source: "30 barg export (D-002, specification)",
         cases: [design], stream: S8, property: pressure}
    modes: [manual, auto]
    normal_mode: auto
    links:
      - {type: override, loop: FIC-4148, select: low}
      - {type: override, loop: PIC-4150, select: low}
    rationale: "Pressure master, flow as limit (D-096): a rising pipeline pressure closes the guide vanes (reverse). Its output passes the low select UY-4151 with the maximum draw (FIC-4148) and the suction low limit (PIC-4150), so the draw stays below the make (the FIC-4148 limit follows the air flow, D-110). The low select and its three inputs are drawn on P-04 (D-101). The high-high trip is PSHH-4152 on its own transmitter (I-17, H04-A29), not PT-4102."
    operator: When a limit holds the guide vanes, the pipeline pressure falls below its set point; the backup supply then starts on low header pressure (SEQ-BACKUP-GOX).
    interlocks: [I-17]
    unresolved:
      - the K-4101 guide-vane actuator and its minimum stop, which the closed fail position of D-109 assumes (K-4101 vendor) (#58)
      - "anti-windup of the three-way low select (external reset feedback, so the unselected loops track and act at once) and bumpless transfer to auto (control engineer, detail) (#65)"
  - id: FIC-4148
    title: GOX maximum draw (limit)
    purpose: Limit the GOX draw to the design GOX make (a fixed value), as a limit in the guide-vane low select (D-096).
    section: PRD
    cases: [design]
    variable: flow
    measurement: [{tag: FIC-4148}]
    controller: FIC-4148
    action: reverse
    final_elements:
      - {tag: K-4101, kind: drive, fail: closed}      # through the low select
    targets:
      - {kind: high, value: 20860, unit: kg/h, provenance: given, source: "500 t/d GOX (specification); the maximum draw at the design air flow",
         cases: [design], stream: S7, property: flow}
    modes: [manual, auto]
    normal_mode: auto
    links:
      - {type: override, loop: PIC-4102, select: low}
      - {type: override, loop: PIC-4150, select: low}
    rationale: "A limit, not a set point: it acts only when the customer's draw would exceed the GOX make. The limit follows the make (D-110, revised D-114): 0.1867 kg GOX per kg of air (S7 / S2) times the air flow, less the LOX drawn above its design 470 kg/h (FIC-3111), capped at the design 20,860 kg/h. The air flow is the lower of FT-1101 and the MAC vendor's own flow measurement (UIC-1102's), with a deviation alarm between them, and the lower of that and its value through a 15 min lag (ASSUMED, of the order of the column's response; the column supplier confirms), so neither a transmitter reading high nor a ramp lets the limit run ahead of the make. A make falling at constant air flow (TSA switchover dip, purity upset) is not tracked: the PT-4101 low alarm and I-14 cover it. Its transmitter FT-4148 is also the anti-surge input of UIC-4103."
    operator: The limit tracks the air flow by itself; a limit holding the guide vanes means the customer wants more than the plant makes at this load, so raise the air flow (FIC-1101) or let the backup cover it.
    interlocks: [I-14]
    notes: "Not a protection layer (D-096). The independent limit on the GOX draw is the LP sump itself: LSLL-3125 on its own tapping stops the air and K-4101 (I-14, SIL 2, D-111 / D-114), independent of UY-4151, FT-4148 and PT-4150 (H04-A23, H03-A4)."
  - id: PIC-4150
    title: GOX suction pressure low limit
    purpose: "Throttle the guide vanes when the suction pressure falls: the sign that K-4101 draws more GOX than the column makes (H04-S75; D-096)."
    section: PRD
    variable: pressure
    measurement: [{tag: PIC-4150}]
    controller: PIC-4150
    action: direct
    final_elements:
      - {tag: K-4101, kind: drive, fail: closed}      # through the low select
    targets:
      - {kind: low, unresolved: "below the normal suction pressure of 1.15 bara (S7, D-002) by a margin the K-4101 vendor and the column supplier set (#103)"}
    modes: [manual, auto]
    normal_mode: auto
    links:
      - {type: override, loop: PIC-4102, select: low}
      - {type: override, loop: FIC-4148, select: low}
    rationale: "Its own transmitter PT-4150 on the machine side of XV-4117 (S3), apart from PIC-4101's; its signal goes to the low select UY-4151, drawn on P-04 (D-101). A falling suction pressure lowers its output, and the low select passes it, so the vanes close (direct)."
    operator: "It acts late: while PIC-3110 still has its waste valves open, an over-draw shows first in the LP sump level (LICA-3102) and the GOX purity (AI-3104). Watch those. The limit is in the same control system as the loops it limits and is not credited as a protection layer (H04-A23 remains)."
  - id: PIC-4101
    title: GOX suction vent
    purpose: Vent the GOX through PV-4101B when K-4101 does not take it (trip, start-up), so the LP column is not blocked in (D-019).
    section: PRD
    variable: pressure
    measurement: [{tag: PIC-4101}]
    controller: PIC-4101
    action: direct
    final_elements:
      - {tag: PV-4101B, kind: valve, fail: open}
    targets:
      - {kind: setpoint, unresolved: "inside the band from the normal suction pressure at the design draw (about 1.15 bara, S7) up to the suction pressure the LP column gives at zero draw (PIC-3110), so it vents at turndown and on a trip; far below the LP column relief case (D-011). See D-096 Open; the load range is D-110 (#59)"}
    modes: [manual, auto]
    normal_mode: auto
    rationale: "One job only since D-096: the guide vanes are PIC-4102's, limited by FIC-4148 and PIC-4150. Its transmitter PT-4101 taps upstream of the suction ESD XV-4117 (S1), so it sees the column side when XV-4117 is shut (start-up, trip). The LP column pressure is PIC-3110's (D-095). When the customer takes less GOX, PIC-4102 closes the guide vanes, the suction pressure rises and PIC-4101 vents the excess; its set point therefore lies above the suction pressure that PIC-3110's LP column pressure gives in normal operation."
    alarms:
      - {tag: PIC-4101, condition: PAL, response: "Suction pressure low on PT-4101, a transmitter apart from the guide-vane low select (PT-4150, FT-4148): K-4101 draws more than the column makes. Reduce the K-4101 load and watch LICA-3102; at the low-low LSLL-3125 stops the air and K-4101 (I-14) (H04-A23)."}
      - {tag: PIC-4101, condition: "PV-4101B open > 30 min", response: "The customer takes less than the plant makes: turn the air flow down (FIC-1101) so the vent stays for transients (D-110)."}
    operator: Venting GOX in normal operation means the customer takes less than the plant makes; turn the air flow down (FIC-1101).
    notes: "PV-4101B fails open (D-109): the GOX the unloaded K-4101 no longer takes goes to VNT-4003 and the LP column is not blocked in (D-019); PV-3110A/B also fail open."
  - id: UIC-4103
    title: GOX compressor anti-surge
    section: PRD
    variable: other
    measurement: [{tag: FIC-4148, role: "suction flow (its transmitter FT-4148)"}, {tag: UIC-4103}]
    controller: UIC-4103
    final_elements:
      - {tag: UV-4103, kind: valve, fail: open}
    targets:
      - {kind: setpoint, unresolved: the surge control line of the K-4101 vendor (#58)}
    modes: [manual, auto]
    normal_mode: auto
    unresolved:
      - controller action (K-4101 vendor) (#58)
      - "FT-4148 sits upstream of the vent and recycle tees, so it does not see the recycle flow through the machine; the anti-surge needs the machine's own suction flow (D-024; K-4101 vendor) (#58)"
  - id: FIC-3107
    title: GAN product flow
    purpose: Take the GAN product from the HP column top at the rate the customer needs (D-004).
    section: PRD
    cases: [design]
    variable: flow
    measurement: [{tag: FIC-3107}]
    controller: FIC-3107
    action: reverse
    final_elements:
      - {tag: K-4102, kind: drive, fail: closed}      # the K-4102 inlet guide vanes to their minimum stop (D-109)
    targets:
      - {kind: setpoint, value: 12510, unit: kg/h, provenance: given, source: "10,000 Nm3/h GAN (specification, D-004)",
         cases: [design], stream: S9, property: flow}
      - {kind: high, value: 12510, unit: kg/h, provenance: given, source: "the design GAN draw from the HP column top (D-004); clamp on the cascade set point",
         cases: [design], stream: S9, property: flow}
    modes: [manual, auto, cascade]
    normal_mode: cascade
    links:
      - {type: cascade, loop: PIC-4105}
    rationale: "The GAN flow on the guide vanes, its set point from PIC-4105 (the export pressure) in cascade (D-096). In auto it holds the design flow. The clamp on the cascade set point follows the make (D-110, revised D-114): 0.1120 kg GAN per kg of air (S9 / S2) times the validated, lagged air flow of FIC-4148, capped at the design 12,510 kg/h."
    unresolved:
      - the K-4102 guide-vane actuator and its minimum stop, which the closed fail position of D-109 assumes (K-4102 vendor) (#58)
      - how PIC-4106 (suction pressure) limits the guide vanes beside FIC-3107 (override or limit; K-4102 vendor) (#58)
  - id: PIC-4106
    title: GAN compressor suction pressure
    section: PRD
    variable: pressure
    measurement: [{tag: PIC-4106}]
    controller: PIC-4106
    targets:
      - {kind: low, unresolved: "the suction low limit, below the normal 5.2 bara (S9, D-004) by a margin that protects the HP column top (#58)"}
    modes: [manual, auto]
    alarms:
      - {tag: PIC-4106, condition: PAL, response: "K-4102 draws the HP column down (H04-S27, S84, S85): put FIC-3107 to auto at a lower set point and check PIC-4105 and the GAN header for a leak (H04-A22)."}
    notes: "PT-4106 is apart from PT-4105 and FT-3107, so its low alarm is the operator layer on a GAN over-draw. The screening LOPA (D-111 row 14) finds no SIF needed for the K-4102 guide vanes: the consequence is a column upset (asset 3), and the FIC-3107 clamp that follows the air flow (D-110) and this alarm bring it below the target."
    unresolved:
      - "what it acts on (the K-4102 guide vanes as a low limit beside FIC-3107; see FIC-3107) and its action (#58)"
  - id: UIC-4131
    title: GAN compressor anti-surge
    section: PRD
