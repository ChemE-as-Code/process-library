  - id: PIC-4105
    title: GAN export pressure (master of FIC-3107)
    purpose: Hold the GAN delivered to the customer at its export pressure; the GAN flow follows the off-take (D-096).
    section: PRD
    cases: [design]
    variable: pressure
    measurement: [{tag: PIC-4105}]
    controller: PIC-4105
    action: reverse
    targets:
      - {kind: setpoint, value: 9, unit: bar(a), provenance: given, source: "GAN at the battery limit (specification, D-004)",
         cases: [design], stream: S9B, property: pressure}
    modes: [manual, auto]
    normal_mode: auto
    rationale: "Cascade master (D-096): its output is FIC-3107's set point, so a rising export pressure lowers the GAN flow (reverse). The cascade signal is drawn on P-04, and the signal once drawn from PIC-4105 to PV-4105 was removed (D-101). PV-4105 stays an actuated valve, normally fully open, which the operator sets from the DCS (D-105, noted on P-04); the tap side no longer sets the action. PV-4105 fails open, its normal position (D-109)."
    unresolved:
      - "PV-4105: confirm the start-up back-pressure role or remove the valve, its open indication and line-up check, a retag to HV-4105 (D-105; HAZOP action H04-A31) (#65)"
      - "anti-windup when FIC-3107's set point is clamped at the maximum draw, and the initialisation of the cascade at start-up (bumpless; control engineer, detail) (#65)"
  - id: PICA-4109
    title: LOX tank pressure
    purpose: Vent the boil-off of T-4101 to a safe location (D-011, D-019).
    section: PRD
    variable: pressure
    measurement: [{tag: PICA-4109}]
    controller: PICA-4109
    action: direct
    final_elements:
      - {tag: PV-4109, kind: valve, fail: open}
    targets:
      - {kind: setpoint, unresolved: "below the T-4101 design pressure (0.5 barg, equipment list) and the PSV-4123 set pressure by the tank supplier's margin; the 0.5 barg of D-019 is the vent's pressure level, not a set point (#103)"}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: PICA-4109, condition: PAH, response: "Check PV-4109 and the boil-off; PSV-4123 and the vacuum breaker PSV-4142 are the backup (D-011)."}
    rationale: PV-4109 fails open (D-109), so the boil-off leaves by the vent valve instead of lifting PSV-4123; the vacuum breaker PSV-4142 stays.
  - id: PICA-4110
