# Cause and effect list: interlocks and trips. Schema: `cheme schema interlocks`.
# On a sheet, refer to an interlock ("see C&E I-01") instead of spelling out what it trips.
interlocks:
  # the low-low levels of the product tanks: pump dry-run protection and the NPSH basis of the
  # backup pumps (D-024, D-055 (5))
  - id: I-01
    title: LOX tank low-low level
    cause: {tag: LIA-4107, condition: LALL}
    effects:
      - {tag: P-4101A, action: trip}
      - {tag: P-4101B, action: trip}
      - {tag: XV-4136, action: close}
    sheet: P-04
    sil: null
    notes: "D-024, D-055 (5): set so the liquid above T-4101/N4 holds NPSHr of P-4101A/B (supplier) - 0.34 m (NPSHa at the outlet level, datasheets) + margin (ASSUMED until the supplier's NPSHr); SIL from the screening"
  - id: I-02
    title: LIN tank low-low level
    cause: {tag: LIA-4108, condition: LALL}
    effects:
      - {tag: P-4102A, action: trip}
      - {tag: P-4102B, action: trip}
      - {tag: XV-4137, action: close}
    sheet: P-04
    sil: null
    notes: "D-024, D-055 (5): set so the liquid above T-4102/N4 holds NPSHr of P-4102A/B (supplier) - 0.31 m (NPSHa at the outlet level, datasheets) + margin (ASSUMED until the supplier's NPSHr); SIL from the screening"
  # the DCAC chimney tray water seal against air blow-by into the atmospheric C-1102 (D-076)
  - id: I-03
    title: DCAC chimney tray level low-low (air blow-by to C-1102)
    cause: {tag: LSLL-1115, condition: LSLL}
    effects:
      - {tag: XV-1115, action: close}
    sheet: P-01
    sil: 1  # screening LOPA, D-083: ASSUMED initiating and tolerable frequencies; for HAZOP / LOPA confirmation
    notes: "D-076: LSLL-1115 on its own tapping closes the tight-shut XV-1115 (fail closed) on CHWR-1001 before the seal on the chimney tray is lost; independent of LIC-1114 / LV-1114. The chilled water then overflows through the tray downcomer to the lower section (C-1101 datasheet). D-083: C-1102 relief case covered by the open vent WN-1002 (~26 kPa(g) against 1 barg at the 95.1 t/h blow-by bound of S3 5.92 bara, D-089 / D-090; was ~25 kPa(g), 94.5 t/h); screening LOPA (CCPS 2001 generic values) gives RRF >= 10: SIL 1, 1oo1 LSLL-1115 / 1oo1 XV-1115, proof test yearly (ASSUMED). D-088 (4), SRS basis (ASSUMED, for HAZOP / LOPA / SRS confirmation; C-1101 datasheet chimney_tray_sif_basis): trip at 13.35 m (LIC-1114 set point 13.50 m, seal loss 13.20 m); with LV-1114 failed open (at most 2 x the normal 34.4 m3/h, D-090) the process safety time is 144 s (72 s with the inflow also lost); SIF response time at most 15 s, XV-1115 closing in 5 .. 10 s"
  # E-3105 at standstill: no pumped chilled water against a depressurised booster air side (D-077)
  - id: I-04
    title: Compander trip - chilled water to E-3105 shut
    cause: {tag: K-3101, condition: "trip (compander machine protection, D-012)"}
    effects:
      - {tag: TV-3124, action: close}
    sheet: P-03
    sil: null
    notes: "D-077: with the booster stopped AIR-3002 depressurises while the water side stays at the return riser's static head (~2.9 bara); closing TV-3124 takes the P-1102 head (~7 bar) off a tube leak. TV-3124 is a control valve, not tight shut: the restart permissive is the E-3105 shell-side drain checked dry (operating procedure). Not a SIF"
  # ---- D-111: the trips the instrument list named and the independent limits (#56, #61).
  # SIL from the screening LOPA of D-111 (CCPS 2001 generic values, ASSUMED frequencies and
  # targets), for the HAZOP team's LOPA / SIL session to confirm. All latch and reset by hand.
  # The MAC trip set (I-05 .. I-07): the MAC unloads and blows off, the DCAC water pumps stop
  # (H01-A3, H01-A4), so the DCAC cannot flood behind the AIR-1002 non-return valve.
  - id: I-05
    title: MAC vibration / bearing high-high (machine protection)
    cause: {tag: VIA-1104, condition: HH}
    effects:
      - {tag: K-1101, action: trip}
      - {tag: UV-1102, action: open}
      - {tag: P-1101A, action: trip}
      - {tag: P-1101B, action: trip}
      - {tag: P-1102A, action: trip}
      - {tag: P-1102B, action: trip}
    sheet: P-01
    sil: 1
    latching: true
    reset: manual
    bypass: "none in operation; the MAC vendor's start-up inhibit of the transient vibration, timed"
    notes: "D-111 LOPA row 1: destructive vibration from surge, erosion or a water slug (H01-S4, S6, S41), asset 4. The voting and the bearing / axial channels are the MAC vendor's machinery protection system (API 670), which carries the SIL (#58). H01-A3, H01-A4."
  - id: I-06
    title: DCAC sump level high-high (water carry-over to the TSA)
    cause: {tag: LSHH-1106, condition: LSHH}
    effects:
      - {tag: K-1101, action: trip}
      - {tag: UV-1102, action: open}
      - {tag: P-1101A, action: trip}
      - {tag: P-1101B, action: trip}
      - {tag: P-1102A, action: trip}
      - {tag: P-1102B, action: trip}
    sheet: P-01
    sil: 1
    latching: true
    reset: manual
    notes: "D-111 LOPA row 2: LV-1106 stuck closed or LIC-1106 failed (H01-S13, S14), water into AIR-1004 and the adsorbers, asset 4; LSHH-1106 on its own tapping, independent of LIC-1106 (D-005). H01-A3, H01-A4."
  - id: I-07
    title: TSA outlet CO2 high-high (breakthrough to the cold box)
    cause: {tag: AIA-2102, condition: "CO2 HH"}
    effects:
      - {tag: K-1101, action: trip}
      - {tag: UV-1102, action: open}
      - {tag: P-1101A, action: trip}
      - {tag: P-1101B, action: trip}
      - {tag: P-1102A, action: trip}
      - {tag: P-1102B, action: trip}
    sheet: P-02
    sil: 1
    delay: {value: 30, unit: s}
    latching: true
    reset: manual
    bypass: "maintenance or calibration of AIA-2102 only with an hourly laboratory CO2 check of the TSA outlet and a permit (ASSUMED)"
    notes: "D-111 LOPA row 3: CO2, N2O and then hydrocarbons into the cold box toward a main condenser explosion (H02-S3, S10, S27), people 5. Trip set point CO2 HH 2 ppm (ASSUMED; alarm 1 ppm); stopping the air ends the breakthrough at once, an early bed switch (D-010) stays a KS-2101 operator action on the alarm. SIL 1 holds only with the conditional modifiers of D-111 / D-114 row 3 (intake hydrocarbons, H01-A1; ignition given an accumulation) and one control-system credit (AIA-3103 with the operator), the LOX purge not credited; if the intake survey finds hydrocarbon sources the target is SIL 2 with a second, independent CO2 analyser (1oo2, H02-A1). H02-A1."
  - id: I-08
    title: Regeneration heater low-low flow (heater side)
    cause: {tag: FSLL-2117, condition: FSLL}
    effects:
      - {tag: E-2101, action: trip}
    sheet: P-02
    sil: a
    latching: true
    reset: manual
    bypass: "inhibited while E-2101 is off (KS-2101 cooling and stand-by steps)"
    notes: "D-111 LOPA row 4: E-2101 energised with little or no gas (H02-S13, S15, S20), asset 3. FSLL-2117 on RG-2001 between the XV-2109 bypass tee and E-2101, so it sees the heater flow only and is independent of FIC-2105 (H02-A2). I-08, I-09 and I-10 run in the heater's protection relay, apart from the DCS and from TIC-2104's thyristor control (JB-A2-2, D-114); TSHH-2107 (I-10) is credited once as the further layer for the low-flow causes, not the other way round (D-114 rows 4, 6)."
  - id: I-09
    title: Regeneration gas outlet temperature high-high
    cause: {tag: TSHH-2116, condition: TSHH}
    effects:
      - {tag: E-2101, action: trip}
    sheet: P-02
    sil: a
    latching: true
    reset: manual
    notes: "D-111 LOPA row 5: TIC-2104 or the thyristor failed high (H02-S17), regeneration gas above the 250 C of V-2101A/B, asset 3; independent of TIC-2104 and of TSHH-2107. Trip at 230 C (ASSUMED)."
  - id: I-10
    title: Regeneration heater element over-temperature
    cause: {tag: TSHH-2107, condition: TSHH}
    effects:
      - {tag: E-2101, action: trip}
    sheet: P-02
    sil: a
    latching: true
    reset: manual
    notes: "D-111 LOPA row 6: element sheaths overheating at low flow or full power (H02-S13, S15, S17, S20), asset 3; the heater supplier's element limit."
  # the compander: overspeed and the seal gas (H03-A2); I-04 follows on the compander trip
  - id: I-11
    title: Expander overspeed (2oo3)
    cause: {tag: SSHH-3108, condition: SSHH}
    logic: {vote: {k: 2, of: [{tag: SSHH-3108, state: "probe A HH"}, {tag: SSHH-3108, state: "probe B HH"}, {tag: SSHH-3108, state: "probe C HH"}]}}
    effects:
      - {tag: XV-3117, action: close}
      - {tag: K-3101, action: trip}
    sheet: P-03
    sil: 2
    latching: true
    reset: manual
    notes: "D-111 LOPA row 7: brake load lost or the nozzles failed open (H03-S16), wheel burst, people 4. Independent speed probes 2oo3, the quick-closing XV-3117 (fail closed, D-109) closing within the run-up time the compander vendor confirms (H03-A2, #58). Architecture (ASSUMED, for the SRS): 2oo3 probes in the vendor's overspeed monitor, XV-3117 on its own SIS solenoid (1oo1), the compander motor/brake trip as the second final element; proof test yearly; SIS junction box JB-A3-S1. I-04 acts on the compander trip."
  - id: I-12
    title: Compander seal gas low-low (oil into the Lachmann air)
    cause: {tag: PDSLL-3115, condition: PDSLL}
    effects:
      - {tag: XV-3117, action: close}
      - {tag: K-3101, action: trip}
    sheet: P-03
    sil: 2
    delay: {value: 5, unit: s}
    latching: true
    reset: manual
    notes: "D-111 LOPA row 8: seal gas lost while the lube oil runs (H03-S18), oil into the LP column sump with E-3103, people 5. The lube oil pump keeps running for the run-down (bearings) and stops on the compander vendor's logic; the start permissive (seal gas before the oil pump) stays in SEQ-COMPANDER-TRIP (D-012). The 1e-2 /yr initiating frequency rests on a redundant seal-gas supply (dry N2 from the GAN header with an automatic backup from the LIN backup header or a bottle rack, ASSUMED, to specify to the compander vendor, #58); a single supply is 0.1 /yr and puts I-12 at the SIL 2 / 3 boundary (D-114 row 8). The oil that still migrates during the run-down after the trip is the vendor's to state (#58). Architecture (ASSUMED): 1oo1 SIL 2 capable PDT, XV-3117's SIS solenoid and the compander trip; JB-A3-S1. H03-A2."
  # K-4101: every trip isolates and blows the machine down (D-013); PIC-4101 then vents the GOX
  - id: I-13
    title: K-4101 stage temperature high-high (oxygen fire)
    cause: {tag: TSHH-4104, condition: TSHH}
    effects:
      - {tag: K-4101, action: trip}
      - {tag: XV-4117, action: close}
      - {tag: XV-4118, action: close}
      - {tag: XV-4116, action: open}
    sheet: P-04
    sil: 1
    latching: true
    reset: manual
    notes: "D-111 LOPA row 9, restated in D-114: the trip does not prevent the ignition; it prevents the escalation, an oxygen fire fed by the export header and the LP column through the machine (casing burn-through, a jet fire at the fire wall, loss of the K-4101 house and the PR1 rack beside it), asset 5 (the fire wall FW-4101 takes the people credit, H04-A24); the trip isolates the machine and blows it down so the fire burns only its own inventory. Detection and closing within the time the K-4101 vendor states for a burn-through (#58). The suction vent is PIC-4101's (PV-4101B) once XV-4117 closes, not a trip effect. H04-A01, H04-A02."
  # the independent limit on the GOX draw (H04-A23, H03-A4): the LP sump itself, not the selector
  - id: I-14
    title: LP column sump level low-low (E-3103 submergence)
    cause: {tag: LSLL-3125, condition: LSLL}
    effects:
      - {tag: K-1101, action: trip}
      - {tag: UV-1102, action: open}
      - {tag: P-1101A, action: trip}
      - {tag: P-1101B, action: trip}
      - {tag: P-1102A, action: trip}
      - {tag: P-1102B, action: trip}
      - {tag: K-4101, action: trip}
      - {tag: XV-4117, action: close}
      - {tag: XV-4118, action: close}
      - {tag: XV-4116, action: open}
    sheet: P-03
    sil: 2
    latching: true
    reset: manual
    bypass: "start-up only, until the sump level is above the trip during the cool-down (SEQ-CB-START), timed, with a permit; never with K-4101 running"
    notes: "D-111 LOPA row 10, revised in D-114: an over-draw of GOX or LOX, or a refrigeration deficit, boils the sump down and uncovers E-3103 (H03-S33, S34, H04-S75, S80), people 5. The trip stops the air (the MAC trip set) and K-4101: with no air the HP column sends no vapour to E-3103, so the condenser stops boiling whatever still drains the sump (a failed-open FV-3111, the GOX vent PV-4101B, a refrigeration deficit) and nothing concentrates in it; the hazard is the boiling, not the low level as such. FV-3111 is not an effect: the purge stays as D-010 asks, and a valve that may be the initiator is never the final element (control-review6 #1, #3; hazop-review6 #1, #2). LSLL-3125 on its own tapping I4 and impulse lines (stand on CB-1 P20) and transmitter, its own SIS junction box JB-A3-S1, independent of LICA-3102, of the guide-vane low select UY-4151, FT-4148 and PT-4150. Architecture (ASSUMED, for the SRS): 1oo1 SIL 2 capable transmitter, the MAC and K-4101 motor breakers as final elements, proof test 6-monthly; 1oo2 transmitters with H03-A4 if the SRS's PFD needs it. Trip above the top of E-3103 by the supplier's margin (#103)."
  # instrument air lost with power on (D-114): no fail position stops a running machine, so the
  # plant stops on its own before the fail positions leave K-4101 running isolated on recycle
  # and the DCAC water pumps against closed valves (control-review6 #2, H01-S45)
  - id: I-19
    title: Instrument air header pressure low-low (plant stop)
    cause: {tag: PSLL-1116, condition: PSLL}
    effects:
      - {tag: K-1101, action: trip}
      - {tag: UV-1102, action: open}
      - {tag: P-1101A, action: trip}
      - {tag: P-1101B, action: trip}
      - {tag: P-1102A, action: trip}
      - {tag: P-1102B, action: trip}
      - {tag: K-3101, action: trip}
      - {tag: K-4101, action: trip}
      - {tag: K-4102, action: trip}
    sil: 1
    delay: {value: 10, unit: s}
    latching: true
    reset: manual
    notes: "D-114 LOPA row 15: instrument air lost with power on (a compressor or dryer trip, a header break), every valve goes to its D-109 position while the drives run: K-4101 isolated on its recycle with XV-4117 / XV-4118 shut (heating, an oxygen fire risk), the DCAC pumps dead-headed (H01-S45), K-4102 on recycle. Set above the pressure at which the actuators start to move (ASSUMED, IA package), on its own transmitter on the instrument air header (utilities). The XV-3117 and ESD valves need no effect: they reach their fail positions with the air."
  # the backup: no cold gas into the carbon steel pipelines (D-014)
  - id: I-15
    title: LOX vaporizer outlet temperature low-low
    cause: {tag: TSLL-4113, condition: TSLL}
    effects:
      - {tag: P-4101A, action: trip}
      - {tag: P-4101B, action: trip}
      - {tag: PV-4111, action: close}
    sheet: P-04
    sil: 1
    latching: true
    reset: manual
    notes: "D-111 LOPA row 11: vaporizer iced or overdrawn (H04-S48, S49), cold GOX into the carbon steel pipeline, brittle fracture, people 4. Trip above the pipeline's minimum design temperature by a margin (pipeline owner). H04-A01, H04-A02."
  - id: I-16
    title: LIN vaporizer outlet temperature low-low
    cause: {tag: TSLL-4114, condition: TSLL}
    effects:
      - {tag: P-4102A, action: trip}
      - {tag: P-4102B, action: trip}
      - {tag: PV-4112, action: close}
    sheet: P-04
    sil: 1
    latching: true
    reset: manual
    notes: "D-111 LOPA row 11 (as I-15): cold GAN into the carbon steel pipeline and the casing purge (H04-S70), people 4. H04-A01, H04-A02."
  - id: I-17
    title: GOX discharge pressure high-high (own transmitter)
    cause: {tag: PSHH-4152, condition: PSHH}
    effects:
      - {tag: K-4101, action: trip}
      - {tag: XV-4117, action: close}
      - {tag: XV-4118, action: close}
      - {tag: XV-4116, action: open}
    sheet: P-04
    sil: 1
    latching: true
    reset: manual
    notes: "D-111 LOPA row 12: PT-4102 reading low, or the low select UY-4151 frozen high, while the customer takes less (H04-S82, S87), header overpressure, people 4. PSHH-4152 on its own transmitter on GOX-4002, so a PT-4102 fault does not defeat both the control and the trip (H04-A29); PSV-4122 stays the last layer. Trip below the PSV-4122 set pressure, above the 31 bara export by the K-4101 vendor's margin. A PT-4102 / PSHH-4152 deviation alarm (H04-A29) is a DCS alarm. H04-A01."
  - id: I-18
    title: O2 in the GAN product high (divert off-spec GAN)
    cause: {tag: AIA-3105, condition: "O2 AH, 10 ppm"}
    effects:
      - {tag: XV-3105, action: open}
      - {tag: XV-4120, action: close}
    sheet: P-04
    sil: a
    latching: false
    reset: automatic
    notes: "D-024: off-spec GAN never reaches the customer; a quality function, screened without a SIL requirement (D-111 LOPA row 13). XV-3105 closes again on specification (SEQ-CB-START). H04-A01."
