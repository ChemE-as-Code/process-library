# Cause and effect list: interlocks and trips. Schema: `cheme schema interlocks`.
# On a sheet, refer to an interlock ("see C&E I-01") instead of spelling out what it trips.
interlocks:
  # the low-low levels of the product tanks: pump dry-run protection and the NPSH basis of the
  # backup pumps (D-024, D-055 (5))
  - id: I-01
    title: LOX tank low-low level
    cause: {tag: LIA-4107, condition: LALL}
    effects:
      - {tag: P-4101A, action: trip}
      - {tag: P-4101B, action: trip}
      - {tag: XV-4136, action: close}
    sheet: P-04
    sil: null
    notes: "D-024, D-055 (5): set so the liquid above T-4101/N4 holds NPSHr of P-4101A/B (supplier) - 0.34 m (NPSHa at the outlet level, datasheets) + margin (ASSUMED until the supplier's NPSHr); SIL from the screening"
  - id: I-02
    title: LIN tank low-low level
    cause: {tag: LIA-4108, condition: LALL}
    effects:
      - {tag: P-4102A, action: trip}
      - {tag: P-4102B, action: trip}
      - {tag: XV-4137, action: close}
    sheet: P-04
    sil: null
    notes: "D-024, D-055 (5): set so the liquid above T-4102/N4 holds NPSHr of P-4102A/B (supplier) - 0.31 m (NPSHa at the outlet level, datasheets) + margin (ASSUMED until the supplier's NPSHr); SIL from the screening"
