# HAZOP study H-04: a DRAFT until the team has accepted every entry and a
# human review record covers it (cheme safety hazop check). Schema: cheme schema
# hazop-study; workflow: safety/README.md and the skill hazop-study.
schema: cheme/hazop-study/v1
kind: hazop-study
id: H-04
title: Products, storage and backup supply
scope: >-
  Sheet P-04 (pid/P-04.xml) as drawn: the GOX compressor K-4101 with its intercoolers E-4101,
  aftercooler E-4102, recycle GOX-4003, vent VNT-4002 / S-4101, inlet vent VNT-4003 / S-4102 and
  relief PSV-4122 to the GOX export GOX-4002; the GAN compressor K-4102 with E-4103, recycle
  GAN-4004 and vents VNT-4004 / VNT-4007 to the GAN export GAN-4002; the LOX tank T-4101 and
  LIN tank T-4102 with their reliefs and vacuum breakers (PSV-4123, PSV-4142, PSV-4124,
  PSV-4143), tanker fill lines LOX-4004 / LIN-4004 (TSV-4144, TSV-4145), the backup pumps
  P-4101A/B and P-4102A/B (interlocks I-01, I-02), the ambient-air vaporizers E-4105A/B and
  E-4106A/B with PSV-4125..PSV-4128 and the backup lines GOX-4004 / GAN-4003 into the export
  headers; the thermal reliefs TSV-4140 / TSV-4141 on the liquid rundown. Off-page connections:
  GOX-4001 and GAN-4001 from E-3101, LOX-3001 from C-3102 and LIN-3001 from C-3101 on P-03
  (H-03); the GAN header supplies the cold box casing purge UN-3001 on P-03 (H-03). Battery
  limits: GOX-4002 and GAN-4002 to the customer, CW-4001 / CW-4002 and their returns, the
  tanker connections (the tanker itself is not studied). Not covered: the compressor packages'
  internals (supplier), the customer's pipeline and the road tanker.
modes:
  - {id: normal, title: Normal operation, description: "GOX and GAN compressed to export, LOX/LIN make to storage, backup on standby."}
  - {id: startup, title: Start-up, description: "Compressors started on recycle and vent, cold box cooldown, first product, tanks cooled down."}
  - {id: shutdown, title: Shutdown and trip, description: "Compressor trip, cold box trip with the export switched to backup."}
  - {id: backup, title: Backup supply, description: "Cold box down; LOX/LIN pumped from the tanks and vaporized into the export headers."}
  - {id: tanker-fill, title: Tanker unloading, description: "Filling T-4101 / T-4102 from a road tanker."}
  - {id: warmup, title: Warm-up and derime, description: "Of the cold box, with the product lines warm and the backup supplying."}
  - {id: maintenance, title: Maintenance, description: "Isolation, purging, pump change-over, vaporizer defrost, work on oxygen equipment."}
  - {id: power-fail, title: Power failure, description: "Total or partial loss of power, and of instrument air where it follows."}
