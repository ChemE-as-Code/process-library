actions:
  - {id: H04-A01, text: "Enter the trips drawn on P-04 into control/cause-effect.yaml with cause, effects and fail-safe positions: TSHH-4104 (K-4101 trip, XV-4117 / XV-4118 close, XV-4116 open), the actions of every other K-4101 trip, PIC-4102 high-high, TSLL-4113 / TSLL-4114 (pumps stop, PV-4111 / PV-4112 close), AIA-3105 (XV-3105 open, XV-4120 close) and the dP permissive of XV-4118 / XV-4119 with its measurement. One update of control/cause-effect.yaml and one LOPA / SIL session answer H01-A3, H01-A8, H02-A1, H02-A2, H03-A2, H03-A3, H04-A01, H04-A02 and H04-A13; this action names the functions of this sheet.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H04-A02, text: "SIL screening / LOPA for I-01 and I-02 (sil null), TSLL-4113 / TSLL-4114 (cold gas into the carbon steel pipelines) and TSHH-4104, with the initiating frequencies and tolerable targets agreed by the team. One update of control/cause-effect.yaml and one LOPA / SIL session answer H01-A3, H01-A8, H02-A1, H02-A2, H03-A2, H03-A3, H04-A01, H04-A02 and H04-A13; this action names the functions of this sheet.", owner: process safety engineer, status: proposed, by: agent}
  - {id: H04-A03, text: "Add high level alarms and an independent high-high level on T-4101 / T-4102; consider an actuated fill isolation on LOX-4004 / LIN-4004 closed by the high-high, and a defined response for the rundowns LOX-3001 / LIN-3001 (the LOX purge must keep flowing, D-010: to the drain vaporizer).", owner: process engineer, status: proposed, by: agent}
  - {id: H04-A04, text: "Write the tanker unloading procedure: product identity and analysis certificate checked (sample before unloading), product-specific non-interchangeable couplings, attended transfer watching LIA-4107 / LIA-4108, hose inspection and cool-down, stop before pressurising gas blows through, top or bottom fill against stratification, oxygen cleanliness and no ignition sources at the LOX bay.", owner: operations, status: proposed, by: agent}
  - {id: H04-A05, text: "Close the D-024 open item: confirm the PV-4111 / PV-4112 tight shut-off, the consequence of backflow through PSV-4125 / PSV-4126 into the tanks, the PSV-4127 / PSV-4128 set pressures against the pump shut-off and the customers' pipeline design pressures; decide whether an oxygen-compatible non-return or an actuated tight-shut valve is needed on GOX-4004 / GAN-4003.", owner: process engineer, status: proposed, by: agent}
  - {id: H04-A06, text: "Confirm the K-4102 maximum discharge pressure (HP column at its relief set pressure, surge line, maximum speed) against the 11 barg design of E-4103 and GAN-4002; add a relief device on the K-4102 discharge if it can be exceeded.", owner: process engineer, status: proposed, by: agent}
  - {id: H04-A07, text: "Define the AIA-4121 sampling frequency (and a sample after each LOX tanker fill), the THC / C2H2 action limits per EIGA Doc 65 and the response (dilution, draining through the drain vaporizer); consider a continuous analyser.", owner: process engineer, status: proposed, by: agent}
  - {id: H04-A08, text: "Make the readiness of the cold standby pumps visible: temperature on the P-4101A/B and P-4102A/B casings or flow indication on LOX-4003 / LIN-4003, an auto-start permissive and a failed-start alarm.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H04-A09, text: "Confirm a thermal relief path for LOX-4001 / LIN-4001 between XV-4136 / XV-4137 and the pump suction block valves and for an isolated pump in every valve line-up (D-011); add TSVs where none exists and write the pump isolation procedure (drain and warm through the casing vent before closing both valves, D-013).", owner: process engineer, status: proposed, by: agent}
  - {id: H04-A10, text: "Route the outlets of TSV-4140, TSV-4141, TSV-4144 and TSV-4145 ('to atm.') to locations where oxygen or nitrogen cannot reach the driver, operator or a walkway (elevated, safe location), and record them in the relief case list.", owner: piping engineer, status: proposed, by: agent}
  - {id: H04-A11, text: "Confirm with the vaporizer supplier the E-4105A/B and E-4106A/B duty for a continuous 2-day backup at -5 C minimum ambient with A/B defrost switching; write the switching procedure and consider a low outlet temperature alarm ahead of the TSLL trips.", owner: process engineer, status: proposed, by: agent}
  - {id: H04-A12, text: "Add outlet temperature indication with high alarm on E-4102 (GOX-4002) and E-4103 (GAN-4002), and consider a high-high trip of K-4101 on the aftercooler outlet.", owner: process engineer, status: proposed, by: agent}
  - {id: H04-A13, text: "Obtain from the K-4101 / K-4102 suppliers their machine protection (vibration, axial position, surge detection, buffer and seal gas pressure, suction strainer) and enter its trips in control/cause-effect.yaml. One update of control/cause-effect.yaml and one LOPA / SIL session answer H01-A3, H01-A8, H02-A1, H02-A2, H03-A2, H03-A3, H04-A01, H04-A02 and H04-A13; this action names the functions of this sheet.", owner: mechanical engineer, status: proposed, by: agent}
  - {id: H04-A14, text: "Decide the power supply of the backup system (emergency power for P-4101A/B, P-4102A/B and their controls) against the customer's continuity requirement, and confirm the fail positions of PV-4101B, PV-4109 .. PV-4112, UV-4103, XV-4116 .. XV-4118 and XV-3105, which the files do not state. One plant-wide fail-position list (P-01 .. P-04) answers H01-A6, H02-A6, H03-A1 and H04-A14; this action names the valves of this sheet.", owner: electrical and instrument engineer, status: proposed, by: agent}
  - {id: H04-A15, text: "Consider leak detection for GOX-4002 (flow balance FI-4148 against FQI-4149, pressure decay) and the remote isolation it triggers.", owner: process engineer, status: proposed, by: agent}
  - {id: H04-A16, text: "Analyse the O2 content of the GAN actually exported, including the backup GAN from T-4102 (GAN-4003 joins downstream of AIA-3105): an analyser at the GAN battery limit or on T-4102.", owner: process engineer, status: proposed, by: agent}
  - {id: H04-A17, text: "Give AI-3104 / AI-4115 a low purity alarm and agree the off-spec response with the customer.", owner: process engineer, status: proposed, by: agent}
  - {id: H04-A18, text: "Write the maintenance and entry procedures for oxygen and nitrogen equipment (tanks, pumps, vaporizers, BL stations): isolation, purge to air, atmosphere test, personal O2 monitors, and cleaning verification before an oxygen system goes back into service (D-009). One site procedure for positive isolation and entry into equipment that can hold N2 answers H01-A15, H02-A10, H03-A15 and H04-A18; this action names the equipment of this sheet.", owner: operations, status: proposed, by: agent}
  - {id: H04-A19, text: "Define spill containment and surfaces under the LOX / LIN tanks, pumps and fill bays (non-combustible under all LOX equipment, not only the fill coupling), and fixed oxygen-enrichment / oxygen-deficiency detection at the pumps and tanker bays.", owner: process engineer, status: proposed, by: agent}
  - {id: H04-A20, text: "Confirm that the PSV-3114 relief case covers a K-4101 trip with PV-4101B failing to open (the relief case review is H03-A20); limit the opening rate of PV-4111 on the backup auto-start (EIGA Doc 13) so the riser and tie-in are not pressurised fast.", owner: process engineer, status: proposed, by: agent}
  - {id: H04-A22, text: "Give the K-4102 suction (PIC-4106) a low pressure alarm and a limit on the guide vane opening independent of FIC-3107 / FIC-4105, or credit the LIC-3101 level alarms that H03-A8 proposes, once they exist.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H04-A21, text: "Consider detection of GOX in the E-4101 / E-4102 cooling water return (gas detector or vent pot on CWR-4001) for a tube leak.", owner: process engineer, status: proposed, by: agent}
