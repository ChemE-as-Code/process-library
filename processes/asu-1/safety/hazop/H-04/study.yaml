                - {category: asset, severity: "5", likelihood: D, basis: "Loss of K-4101, months down (matrix 5).", evidence: [D-002], status: proposed, by: agent, band: {value: very-high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 383056181dc74e6a}}
              residual:
                - {category: people, severity: "4", likelihood: B, basis: "Enclosure and TSHH-4104 trip with ESD and blowdown; no independent surge detection trip is in the files (supplier machine protection, H04-A13).", evidence: [TSHH-4104, D-002, D-013], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 076c6f9af2105fd3}}
                - {category: asset, severity: "5", likelihood: C, basis: "TSHH-4104 acts after ignition; nothing on the sheet stops surge independently of UIC-4103.", evidence: [TSHH-4104], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 20579213de92d430}}
      - id: H04-N2-HT
        guide_word: more
        parameter: temperature
        scenarios:
          - id: H04-S06
            cause: "Loss or reduction of cooling water CW-4001 to E-4102 (CW pump trip, valve closed, fouling); the E-4101 package water likewise."
            consequence: "GOX leaves E-4102 at the last-stage discharge temperature (above 100 C) into GOX-4002 and the customer pipeline: less margin against ignition of seats, gaskets and soft goods in oxygen; design temperature of the export line possibly exceeded."
            refs: [CW-4001, CWR-4001, E-4102, E-4101, GOX-4002]
            modes: [normal]
            safeguards: [H04-SG03]
            actions: [H04-A12]
            status: proposed
            by: agent
            notes: "No temperature measurement is drawn at the E-4102 outlet or on GOX-4002. TSHH-4104 is a stage temperature: it is credited for the intercooler water loss only, not for the aftercooler."
            risk:
              initial:
                - {category: people, severity: "4", likelihood: D, basis: "Oxygen fire at a valve downstream of the aftercooler (matrix 4); a cooling water upset is a utility failure (D).", evidence: [D-009, E-4102], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: ec9d2511eb81b833}}
                - {category: asset, severity: "4", likelihood: D, basis: "Fire damage to the discharge line and BL station, weeks down (matrix 4).", evidence: [E-4102], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: d6c65b3d1b5e620d}}
              residual:
                - {category: people, severity: "4", likelihood: C, basis: "TSHH-4104 trips K-4101 when the intercooler water is lost too (common supply); with the aftercooler alone nothing on the sheet detects it.", evidence: [TSHH-4104], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 1ee7bcb18b7a060b}}
