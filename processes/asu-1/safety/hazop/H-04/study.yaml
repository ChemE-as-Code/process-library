risk_matrix: safety/risk-matrix.yaml
assessment_basis: >-
  IEC 61882 guide words applied to the parameters of each node's design intent, in every mode
  that applies. Each scenario (one cause, one consequence) is rated per category of
  safety/risk-matrix.yaml (people, environment, asset incl. production loss): initial with no
  safeguard credited (likelihood of the cause), residual with only the safeguards named in the
  scenario that exist in the files (an alarm with operator response, a control loop, an
  interlock of control/cause-effect.yaml, a relief device, a check valve, a recorded mechanical
  design feature). Ratings are proposed by an agent at basic engineering from the files and
  DESIGN.md, with basis and evidence, for the team to accept or change; no frequency is
  calculated and no LOPA credit is taken here. The matrix itself is a proposal (ASSUMED).
team: []            # not named yet: the owner names the facilitator, scribe and members
notes: >-
  Team not named: the owner names the facilitator, scribe and members (process, operations,
  instrument and control, mechanical, safety, and the GOX / GAN compressor and vaporizer
  suppliers as needed). No session has been held: every node, scenario, safeguard, rating and
  action in this file is a proposal by an agent (status proposed, by agent).
nodes:
  # ---------------------------------------------------------------- GOX train
  - id: H04-N1
    title: GOX-4001 suction header to K-4101, suction vent PV-4101B / S-4102
    design_intent: >-
      Carry the GOX product (14,600 Nm3/h, 99.71 % O2, 1.15 bara, 13 C, ~19 m/s in DN500 SS)
      from E-3101 (P-03) through the suction ESD valve XV-4117 to K-4101. PIC-4101 holds the
      suction (and so the LP column) pressure: output A on the K-4101 inlet guide vanes, output B
      opens PV-4101B to vent through S-4102 / VNT-4003 (elevated, safe location) on a K-4101
      trip and at start-up (D-019). AI-3104 (purity) and FI-4148 (anti-surge flow input) measure
      on this line. Oxygen service, cleaned to D-009.
    members: [GOX-4001, XV-4117, PIC-4101, PV-4101B, S-4102, VNT-4003, AI-3104, FI-4148, K-4101]
    modes: [normal, startup, shutdown, power-fail, maintenance]
    status: proposed
    by: agent
    deviations:
      - id: H04-N1-HP
        guide_word: more
        parameter: pressure
        scenarios:
          - id: H04-S01
            cause: "K-4101 trips (or XV-4117 closes) and PV-4101B fails to open (PIC-4101 output B, positioner or actuator failure)."
            consequence: "The GOX make backs up into the LP column C-3102 (P-03): its pressure rises towards the 3.5 barg design; the column upsets and, without relief, the LP column could be overpressured inside the cold box."
            refs: [K-4101, XV-4117, PV-4101B, PIC-4101, GOX-4001]
            modes: [normal, shutdown, power-fail]
            safeguards: [H04-SG29]
            actions: [H04-A20, H04-A14]
            status: proposed
            by: agent
            notes: "Cause on this sheet, consequence in H-03 (C-3102 and PSV-3114 on P-03, relief case of PSV-3114 per DESIGN.md section 4: waste N2 outlet blocked). The K-4101 trip with PV-4101B stuck closed is to be confirmed as a PSV-3114 case."
            risk:
              initial:
                - {category: people, severity: "4", likelihood: D, basis: "Overpressure of the LP column in the cold box (matrix 4: equipment rupture); a K-4101 trip with one control valve failing to open is a single loop failure (D).", evidence: [D-011, D-019, K-4101, PV-4101B], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: ec9d2511eb81b833}}
                - {category: asset, severity: "4", likelihood: D, basis: "Damage to the LP column or cold box internals, weeks down (matrix 4).", evidence: [D-011, D-019], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: d6c65b3d1b5e620d}}
              residual:
                - {category: people, severity: "4", likelihood: B, basis: "PSV-3114 on C-3102 credited as one relief device; its relief case still to confirm for this cause (H04-A20).", evidence: [PSV-3114, D-011], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 076c6f9af2105fd3}}
                - {category: asset, severity: "3", likelihood: C, basis: "With PSV-3114 the column relieves; a column upset and restart of days (matrix 3).", evidence: [PSV-3114], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 9ceafc0344eb4915}}
      - id: H04-N1-LP
        guide_word: less
        parameter: pressure
        scenarios:
          - id: H04-S02
            cause: "PIC-4101 fails high on its output A: the K-4101 guide vanes open and the machine draws more than the cold box makes."
            consequence: "GOX-4001 and the LP column pressure fall: column hydraulics upset, GOX purity falls, and K-4101 runs towards surge at the low suction pressure."
            refs: [PIC-4101, K-4101, GOX-4001]
            modes: [normal, startup]
            safeguards: [H04-SG06]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: D, basis: "Product off-spec and a cold box upset of days with the backup partly covering (matrix 3); single loop failure (D).", evidence: [D-019, PIC-4101], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 154eb1a2350e4252}}
              residual:
                - {category: asset, severity: "3", likelihood: C, basis: "UIC-4103 recycles before surge and limits the draw-down; the purity loss itself is not prevented.", evidence: [UIC-4103, UV-4103], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 9ceafc0344eb4915}}
      - id: H04-N1-HF
        guide_word: more
        parameter: flow
        notes: "More flow to the vent: PV-4101B opening in normal operation."
        scenarios:
          - id: H04-S03
            cause: "PV-4101B fails open in normal operation (PIC-4101 output B fault)."
            consequence: "Up to the full GOX make vents through S-4102 / VNT-4003: an oxygen-enriched plume at the vent area V1; K-4101 suction pressure falls (surge, see H04-S02) and the export drops."
            refs: [PV-4101B, PIC-4101, S-4102, VNT-4003]
            modes: [normal]
            safeguards: [H04-SG28, H04-SG06]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "3", likelihood: D, basis: "Oxygen-enriched clothing fire risk for a person near the vent outlet (matrix 3); single loop failure (D).", evidence: [D-019, D-025, VNT-4003], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 4d13f9682edc5284}}
                - {category: asset, severity: "2", likelihood: D, basis: "Lost GOX export for hours, backup starts on PIC-4111 (matrix 2).", evidence: [D-014], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 5975c38759944df0}}
              residual:
                - {category: people, severity: "3", likelihood: B, basis: "The vent discharges elevated at a safe location in the fenced vent area V1 (D-019, D-025, zone Z-O2-V1): exposure needs a person at the outlet height.", evidence: [D-019, D-025, D-031], status: proposed, by: agent, band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 497803bd7408e5b6}}
                - {category: asset, severity: "2", likelihood: C, basis: "UIC-4103 protects K-4101; the backup covers part of the GOX.", evidence: [UIC-4103, PIC-4111], status: proposed, by: agent, band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 5d4b96d05607d5a4}}
      - id: H04-N1-CO
        guide_word: as-well-as
        parameter: composition
        scenarios:
          - id: H04-S04
            cause: "Particles or hydrocarbon contamination left in GOX-4001 or XV-4117 after construction or maintenance (cleaning to D-009 not achieved or not verified)."
            consequence: "Particle impact or contaminant ignition at the K-4101 inlet guide vanes or first impeller: oxygen fire, burn-through of the casing, GOX jet fire in the compressor enclosure."
            refs: [GOX-4001, XV-4117, K-4101]
            modes: [startup, maintenance]
            safeguards: [H04-SG03, H04-SG26, H04-SG27]
            actions: [H04-A13, H04-A18]
            status: proposed
            by: agent
            notes: "No suction strainer is drawn on GOX-4001; whether the K-4101 package has one is a supplier question (H04-A13)."
            risk:
              initial:
                - {category: people, severity: "4", likelihood: C, basis: "Oxygen fire at the machine with an operator nearby (matrix 4); contamination after maintenance is credible once in the plant life (C).", evidence: [D-002, D-009, K-4101], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 1ee7bcb18b7a060b}}
                - {category: asset, severity: "5", likelihood: C, basis: "Loss of the GOX compressor, months down (matrix 5).", evidence: [D-002], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 20579213de92d430}}
              residual:
                - {category: people, severity: "4", likelihood: B, basis: "Fire-safe enclosure keeps people away during operation, TSHH-4104 trips, isolates and blows the machine down; the ignition itself is not prevented.", evidence: [TSHH-4104, D-002, D-013], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 076c6f9af2105fd3}}
                - {category: asset, severity: "5", likelihood: B, basis: "TSHH-4104 limits the fire duration but a GOX compressor fire usually destroys the stage; oxygen-compatible materials (D-002, D-009) reduce the ignition probability.", evidence: [TSHH-4104, D-009], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 6dd05b6d428d45d5}}
      - id: H04-N1-LT
        guide_word: less
        parameter: temperature
        notes: "Cold GOX from E-3101 (warm-end temperature low) has its cause on P-03 (H-03). GOX-4001 is SS, so cold gas does not embrittle the line; the effect on K-4101 is a supplier question. No cause on this sheet."
  - id: H04-N2
    title: K-4101 GOX compressor with E-4101 intercoolers, E-4102 aftercooler and recycle GOX-4003
    design_intent: >-
      Compress 14,600 Nm3/h GOX from 1.15 to 31 bara in five oil-free stages (2.5 MW motor, dry
      gas seals with N2 buffer, fire-safe enclosure, Monel / copper alloy in the high-velocity
      zones), intercooled in the E-4101 package (GOX-4005) and aftercooled in E-4102 to 40 C with
      cooling water CW-4001 / CWR-4001 (25 / 35 C, ~4 barg); design 34 barg / 150 C. UIC-4103
      (FI-4148 and pressure ratio) keeps the machine out of surge through UV-4103 and the recycle
      GOX-4003 from the E-4102 outlet to the suction. TSHH-4104 detects a fire (stage
      temperature) and trips K-4101, the ESD valves and the blowdown.
    members: [K-4101, E-4101, E-4102, GOX-4005, GOX-4003, UV-4103, UIC-4103, TSHH-4104, CW-4001, CWR-4001]
    modes: [normal, startup, shutdown, power-fail, maintenance]
    status: proposed
    by: agent
    deviations:
      - id: H04-N2-LF
        guide_word: less
        parameter: flow
        scenarios:
          - id: H04-S05
            cause: "UIC-4103 or UV-4103 fails (valve stuck closed, FI-4148 reading high) while the customer reduces off-take or at turndown."
            consequence: "K-4101 surges: flow reversal and rubbing of impellers or labyrinths in oxygen, metal ignition, oxygen fire and destruction of the machine."
            refs: [UIC-4103, UV-4103, FI-4148, K-4101, GOX-4003]
            modes: [normal, startup, shutdown]
            safeguards: [H04-SG03, H04-SG27]
            actions: [H04-A13]
            status: proposed
