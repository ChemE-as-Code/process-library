  - id: H04-N8
    title: LOX backup pumps P-4101A/B with suction LOX-4001, discharge LOX-4002 and cool-down return LOX-4003
    design_intent: >-
      On low GOX header pressure (PIC-4111) start the standby P-4101A or B (5.2 t/h, 33.0 bara
      rated, cold standby, O2 service, no oil in wetted parts) from T-4101 through the fail-closed
      outlet XV-4136 and LOX-4001 (DN80, <= 1 m/s), discharging through the check valves into
      LOX-4002 (PN63) to the vaporizers. A continuous small flow through HV-4138 and LOX-4003
      keeps the pumps cold and takes the minimum flow; PSV-4125 relieves the discharge header into
      LOX-4003. I-01 (LIA-4107 LALL) trips the pumps and closes XV-4136.
