                - {category: asset, severity: "5", likelihood: C, basis: "Loss of the compressor and enclosure, months down (matrix 5).", evidence: [D-002], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 20579213de92d430}}
              residual:
                - {category: people, severity: "4", likelihood: B, basis: "Fire-safe enclosure (no one inside in operation), TSHH-4104 trip with XV-4117 / XV-4118 closing and XV-4116 blowing the machine down removes the oxygen.", evidence: [TSHH-4104, XV-4116, XV-4117, XV-4118, D-013], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 076c6f9af2105fd3}}
