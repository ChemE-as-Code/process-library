# HAZOP study H-03: a DRAFT until the team has accepted every entry and a
# human review record covers it (cheme safety hazop check). Schema: cheme schema
# hazop-study; workflow: safety/README.md and the skill hazop-study.
schema: cheme/hazop-study/v1
kind: hazop-study
id: H-03
title: Cold box
scope: >-
  Sheet P-03 (pid/P-03.xml) as drawn: the cold box CB-1 with the main heat exchanger E-3101, the
  subcooler E-3102, the HP column C-3101, the LP column C-3102 and the main condenser-reboiler
  E-3103 (LOX sump), the expander-braked booster K-3101 with E-3104 and the chilled-water trim
  cooler E-3105 (CHW-3001 / CHWR-3001, interlock I-04), the expansion turbine KT-3101, the cold
  liquid drain vaporizer V-3101 and its vent VNT-3001, the casing purge UN-3001 and breathing
  valve PSV-3123, and the reliefs PSV-3114, PSV-3116, PSV-3119. Off-page connections:
  AIR-2002 dry air from F-2101 and AIR-3005 to K-3101 (from P-02, H-02); RG-2001 regeneration
  gas to E-2101 (P-02, H-02); WN-3002 / WN-1001 waste N2 to C-1102 on P-01 (H-01) and WN-3003
  to silencer S-3101; GOX-4001 and GAN-4001 to the product compressors, LOX-3001 and LIN-3001
  to the storage tanks on P-04 (H-04); UN-3001 casing purge from the GAN header on P-04 (H-04).
  Battery limits: CW-3001 / CWR-3001 to E-3104. Not covered: the compander's machine
  protection internals (supplier), the cold box structure and perlite (supplier), the GOX
  and GAN compressors (H-04).
modes:
  - {id: normal, title: Normal operation, description: "Design case, GOX 500 t/d, LOX/LIN make to storage."}
  - {id: startup, title: Start-up and cooldown, description: "Cooldown of the cold box with the expander, liquid accumulation, column stabilisation, first product."}
  - {id: shutdown, title: Shutdown and trip, description: "Planned stop, MAC or expander trip, a cold standstill with liquid held, liquid drain to V-3101."}
  - {id: warmup, title: Warm-up and derime, description: "Warm-up of the cold box with dry warm gas to remove ice, CO2 and hydrocarbons; liquid drained first."}
  - {id: regen-switch, title: TSA switching, description: "Waste N2 drawn as regeneration gas, and the air flow and purity swing at a bed switch-over."}
  - {id: maintenance, title: Maintenance, description: "Isolation, purging, work at or inside the cold box casing, perlite removal."}
  - {id: power-fail, title: Power failure, description: "Total or partial loss of power, and of instrument air where it follows; the cold box held cold."}
