  # ---------------------------------------------------------------- N12 sequences
  - id: H03-N12
    title: Cold box start-up, warm-up and standstill sequences
    design_intent: >-
      Cool the cold box down with the expander and accumulate liquid at rates the brazed aluminium
      exchangers and the columns tolerate; for a warm-up and derime, drain the liquid first (LOX
      through HV-3118 to V-3101) and then warm with dry gas; hold the cold box safely during a
      standstill or a power failure (D-010 (6), D-013).
    members: [E-3101, E-3102, E-3103, C-3101, C-3102, KT-3101, HV-3118]
    modes: [startup, shutdown, warmup, power-fail]
    status: proposed
    by: agent
    notes: "The warm-up gas route into the cold box is not drawn on P-03 (action H03-A16). H01-N7 asks for the highest WN-1001 temperature in warm-up against the 60 C design of the C-1102 PP packing; the files do not state it, so H03-A16 includes it."
    deviations:
      - id: H03-N12-EARLY
        guide_word: early
        parameter: cooldown
        description: Cool-down too fast.
        scenarios:
          - id: H03-S48
            cause: "Expander brought to full refrigeration too early or cold liquid admitted to warm equipment at start-up."
            consequence: "Temperature differences beyond the brazed aluminium limits in E-3101, E-3102 and E-3103: cracked cores, leaks."
            refs: [KT-3101, E-3101, E-3102, E-3103]
            modes: [startup]
            safeguards: []
            actions: [H03-A17, H03-A10]
            status: proposed
            by: agent
            risk:
