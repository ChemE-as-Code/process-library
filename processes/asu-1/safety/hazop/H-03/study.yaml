  - {id: H03-SG9, title: "Seal gas permissive and trip PDSLL-3115 (oil pump only with seal gas; trip closes the expander inlet)", kind: other, refs: [PDSLL-3115, XV-3117], status: proposed, by: agent, notes: "Permissive and trip recorded in the instrument list and D-012; not in control/cause-effect.yaml, so not kind interlock until it is (action H03-A2)."}
  - {id: H03-SG10, title: "Expander outlet low temperature limit TIC-3109", kind: control, refs: [TIC-3109], status: proposed, by: agent}
  - {id: H03-SG12, title: "PI-3121 HP column top pressure high alarm (below the PSV-3116 set)", kind: alarm, refs: [PI-3121], status: proposed, by: agent}
  - {id: H03-SG13, title: "PSV-3116 on C-3101 (VNT-3003)", kind: relief, refs: [PSV-3116], status: proposed, by: agent}
  - {id: H03-SG15, title: "LP column pressure control PIC-3110 (PV-3110A / PV-3110B split range)", kind: control, refs: [PIC-3110, PV-3110A, PV-3110B], status: proposed, by: agent}
  - {id: H03-SG16, title: "PSV-3114 on C-3102 (VNT-3002), discharge outside the cold box", kind: relief, refs: [PSV-3114], status: proposed, by: agent}
  - {id: H03-SG17, title: "LICA-3102 LP sump level low alarm (condenser submergence)", kind: alarm, refs: [LICA-3102], status: proposed, by: agent}
  - {id: H03-SG18, title: "AIA-3103 hydrocarbon (THC, C2H2) alarm on the sump LOX", kind: alarm, refs: [AIA-3103], status: proposed, by: agent, notes: "Action limits per EIGA Doc 65 ASSUMED (D-010)."}
  - {id: H03-SG19, title: "Continuous LOX purge FIC-3111 / FV-3111 with low-flow alarm", kind: alarm, refs: [FIC-3111, FV-3111], status: proposed, by: agent}
  - {id: H03-SG20, title: "Bath-type condenser E-3103 kept fully submerged (D-010)", kind: mechanical, refs: [E-3103], status: proposed, by: agent}
