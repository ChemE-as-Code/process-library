  - {id: H03-SG26, title: "Vents elevated at a safe location with their zones (VNT-3001, VNT-3004, S-3101; D-011, D-031)", kind: mechanical, refs: [VNT-3001, VNT-3004, S-3101], status: proposed, by: agent}
actions:
  - {id: H03-A1, text: "Define and record the fail positions of LV-3101, FV-3106, FV-3111, PV-3110A, PV-3110B, PV-3113 and XV-3117 (UV-3120 and TV-3124 are fail open) and check the cold box's behaviour on instrument-air and power failure against them. One plant-wide fail-position list (P-01 .. P-04) answers H01-A6, H02-A6, H03-A1 and H04-A14; this action names the valves of this sheet.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H03-A2, text: "Enter the compander machine trips (SSHH-3108 overspeed, PDSLL-3115 seal gas, surge / vibration) with their effects (XV-3117, compander stop, I-04) in control/cause-effect.yaml; confirm with the supplier the trip response against the overspeed run-up on loss of brake load and set the SIL by LOPA. One update of control/cause-effect.yaml and one LOPA / SIL session answer H01-A3, H01-A8, H02-A1, H02-A2, H03-A2, H03-A3, H04-A01, H04-A02 and H04-A13; this action names the functions of this sheet.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H03-A3, text: "LOPA for the main condenser hydrocarbon protection: decide whether AIA-3103 high-high (EIGA Doc 65 limits) and the LP sump level need SIFs (D-010 says alarm/trip, the C&E has none), and write the operator response to each AIA-3103 limit (raise purge, drain, shut down); add analyser diagnostics or periodic lab checks. One update of control/cause-effect.yaml and one LOPA / SIL session answer H01-A3, H01-A8, H02-A1, H02-A2, H03-A2, H03-A3, H04-A01, H04-A02 and H04-A13; this action names the functions of this sheet.", owner: process safety engineer, status: proposed, by: agent}
  - {id: H03-A4, text: "Set the LICA-3102 low alarm so the operator has time to act before E-3103 is uncovered, add a high alarm, and consider an independent low-low level on the LP sump (with A3).", owner: process engineer, status: proposed, by: agent}
  - {id: H03-A5, text: "Make the minimum LOX purge available when T-4101 cannot take LOX: a measured, restricted continuous purge route to V-3101 (or another destination) and a procedure, so the 0.2 % minimum is kept. With H04-A03 (the T-4101 high-level response, which must keep the purge flowing).", owner: process engineer, status: proposed, by: agent}
  - {id: H03-A6, text: "Specify V-3101: vaporisation means and capacity, level and outlet temperature indication, the VNT-3001 size and material for the maximum drain rate (restriction orifice on LOX-3002), protection against a blocked vent, and how residue is kept from accumulating (no boil-to-dryness, periodic warm-up and analysis).", owner: process engineer, status: proposed, by: agent}
  - {id: H03-A7, text: "LIN-3001 has no flow control or isolation on P-03: add a flow control loop and isolation, and correct the TSV-4141 relief case, which names a P-03 outlet valve that is not drawn. With H04-A09 / H04-A10 for the TSV-4141 relief path.", owner: process engineer, status: proposed, by: agent}
  - {id: H03-A8, text: "Give LIC-3101 high and low level alarms (HP column sump), independent of the control output where the team requires it. These alarms also answer H04-A22 (HP column draw-down by K-4102).", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H03-A9, text: "Add a high alarm to PDI-3112 (LP column flooding) and consider differential pressure on the E-3101 air passages to detect CO2 / H2O plugging.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H03-A10, text: "Add warm-end temperature indication with low alarms on the E-3101 outlets (GOX-4001, GAN-4001, WN-3002) and the warm and cold end temperature differences, to control exchanger balance and cool-down / warm-up rates.", owner: process engineer, status: proposed, by: agent}
  - {id: H03-A11, text: "E-3104 at standstill: extend the D-077 restart check to E-3104 (shell-side low-point drain checked dry) or isolate its cooling water on a compander trip.", owner: process engineer, status: proposed, by: agent}
  - {id: H03-A12, text: "Confirm that I-04 is still effective on power and instrument-air failure (TV-3124 fails open): accept the riser's static head with the restart check, or use a tight-shut fail-closed valve.", owner: process engineer, status: proposed, by: agent}
  - {id: H03-A13, text: "Add a booster discharge or E-3104 outlet high temperature alarm (cooling water failure with the recycle open).", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H03-A14, text: "With the cold box supplier, check the casing relief for an internal cryogenic leak into the perlite (not only the purge failure of PSV-3123), and add casing cold-spot inspection to the operating rounds.", owner: cold box supplier, status: proposed, by: agent}
  - {id: H03-A15, text: "Write the casing entry and perlite removal procedure: warm-up, positive isolation of UN-3001, air purge, O2 measurement at entry, standby person, engulfment precautions; consider fixed O2 monitoring at the casing base. One site procedure for positive isolation and entry into equipment that can hold N2 answers H01-A15, H02-A10, H03-A15 and H04-A18; this action names the equipment of this sheet.", owner: operations, status: proposed, by: agent}
  - {id: H03-A16, text: "Write the warm-up / derime and standstill procedure: drain all LOX through HV-3118 before warming, never boil the sump to dryness, a time limit for a cold standstill without purge; draw or describe the warm-up gas route. Include the warm-up gas temperature limit at C-1102 (60 C design, PP packing; question of H01-N7).", owner: operations, status: proposed, by: agent}
  - {id: H03-A17, text: "Obtain the supplier's cool-down and temperature-difference limits for E-3101, E-3102 and E-3103 and write them into the start-up procedure.", owner: cold box supplier, status: proposed, by: agent}
  - {id: H03-A18, text: "Confirm what TIC-3109 acts on and the expander's minimum exhaust superheat and liquid tolerance with the supplier.", owner: compander supplier, status: proposed, by: agent}
  - {id: H03-A19, text: "Add an LP column high pressure alarm independent of PIC-3110. The regeneration-gas flow alarm that shows a wrong PV-3110A / PV-3110B position (H03-S31) is H02-A14 (FIC-2105 low flow) and is not raised again here.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H03-A20, text: "Relief case review: confirm PSV-3114 for HP gas blow-through on LV-3101 failed open, and PSV-3116 / PSV-3114 for a long cold standstill (heat-in); tag and draw the cold box TSVs (RL, LN) the relief list leaves to detail engineering. Also PSV-3114 for a K-4101 trip with PV-4101B failing to open (cause on P-04, H04-A20).", owner: process engineer, status: proposed, by: agent}
  - {id: H03-A23, text: "Add a non-condensables (Ne / He) vent on the N2 side of E-3103 / GAN-3002.", owner: process engineer, status: proposed, by: agent}
