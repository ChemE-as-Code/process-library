  # ---------------------------------------------------------------- N12 sequences
  - id: H03-N12
    title: Cold box start-up, warm-up and standstill sequences
    design_intent: >-
      Cool the cold box down with the expander and accumulate liquid at rates the brazed aluminium
      exchangers and the columns tolerate; for a warm-up and derime, drain the liquid first (LOX
      through HV-3118 to V-3101) and then warm with dry gas; hold the cold box safely during a
      standstill or a power failure (D-010 (6), D-013).
    members: [E-3101, E-3102, E-3103, C-3101, C-3102, KT-3101, HV-3118]
    modes: [startup, shutdown, warmup, power-fail]
    status: proposed
    by: agent
    notes: "The warm-up gas route into the cold box is not drawn on P-03 (action H03-A16). H01-N7 asks for the highest WN-1001 temperature in warm-up against the 60 C design of the C-1102 PP packing; the files do not state it, so H03-A16 includes it."
    deviations:
      - id: H03-N12-EARLY
        guide_word: early
        parameter: cooldown
        description: Cool-down too fast.
        scenarios:
          - id: H03-S48
            cause: "Expander brought to full refrigeration too early or cold liquid admitted to warm equipment at start-up."
            consequence: "Temperature differences beyond the brazed aluminium limits in E-3101, E-3102 and E-3103: cracked cores, leaks."
            refs: [KT-3101, E-3101, E-3102, E-3103]
            modes: [startup]
            safeguards: []
            actions: [H03-A17, H03-A10]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "4", likelihood: C, basis: "Exchanger replacement, weeks down (matrix 4).", evidence: [E-3101, E-3103], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 544760766051af8c}}
              residual:
                - {category: asset, severity: "4", likelihood: C, basis: "No cool-down limits or temperature-difference monitoring in the files: nothing credited.", evidence: [E-3101], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 544760766051af8c}}
      - id: H03-N12-BEFORE
        guide_word: before
        parameter: warm-up
        description: Warm-up started before the liquid is drained.
        scenarios:
          - id: H03-S49
            cause: "Warm-up started with LOX still in the LP sump (drain through HV-3118 incomplete or skipped)."
            consequence: "The remaining LOX boils off in place: hydrocarbons and N2O concentrate and deposit on E-3103, explosion during the warm-up."
            refs: [HV-3118, E-3103, C-3102]
            modes: [warmup]
            safeguards: []
            actions: [H03-A16]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "5", likelihood: C, basis: "Main condenser explosion (matrix 5); an omitted step in an infrequent task (C).", evidence: [D-010], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: b6ef4d2263633cd5}}
                - {category: asset, severity: "5", likelihood: C, basis: "Loss of the cold box.", evidence: [D-010], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 20579213de92d430}}
              residual:
                - {category: people, severity: "5", likelihood: C, basis: "D-010 (6) calls for a derime / warm-up procedure but none is written: nothing credited.", evidence: [D-010], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: b6ef4d2263633cd5}}
                - {category: asset, severity: "5", likelihood: C, basis: "As people.", evidence: [D-010], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 20579213de92d430}}
      - id: H03-N12-PF
        guide_word: other-than
        parameter: utilities
        description: Power failure and long cold standstill.
        scenarios:
          - id: H03-S50
            cause: "Total power failure: all flows stop and the cold box stands with its liquid for many hours. The P-03 valves go to their fail positions (D-109): LV-3101, FV-3106 and FV-3111 closed (the liquid stays, the purge stops), PV-3110A/B and PV-3113 open, XV-3117 closed."
            consequence: "The sump LOX slowly boils off without purge: hydrocarbons concentrate toward their solubility limit, E-3103 is uncovered as the level falls; on restart with the analysers out, a main condenser explosion."
            refs: [E-3103, LICA-3102, AIA-3103, FV-3111]
            modes: [power-fail, shutdown]
            safeguards: [H03-SG17, H03-SG18]
            actions: [H03-A1, H03-A16]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "5", likelihood: C, basis: "Main condenser explosion (matrix 5); a power failure (D) long enough to concentrate (C).", evidence: [D-010], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: b6ef4d2263633cd5}}
                - {category: asset, severity: "5", likelihood: C, basis: "Loss of the cold box.", evidence: [D-010], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 20579213de92d430}}
              residual:
                - {category: people, severity: "5", likelihood: B, basis: "LICA-3102 and AIA-3103 alarms once power returns (before restart) credited; no standstill procedure (time limit, drain).", evidence: [LICA-3102, AIA-3103], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: feea7693498b1f1a}}
                - {category: asset, severity: "5", likelihood: B, basis: "As people.", evidence: [LICA-3102, AIA-3103], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 6dd05b6d428d45d5}}
