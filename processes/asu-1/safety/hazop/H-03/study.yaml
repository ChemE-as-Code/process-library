        notes: "New for D-103 (HAZOP revision D-102): the simulation now carries the heat in-leak as the model step HL3101 on the cold waste N2 (no equipment, no P&ID object). On the governing cold-box balance (D-067, D-104) the expander KT-3101 at its D-061 flow covers a total leak of about 75 kW (1.5 x the estimate) before the waste N2 warm end reaches 13 C; the whole-plant simulation shows about 130 kW, but about 49 kW of that is refrigeration only its column model has (D-104). A leak inside the 75 kW only lowers the margin and has no consequence of its own; with E-3105 out of service the cold box closes at only about 12 kW, already short of the 50 kW basis (D-104)."
        scenarios:
          - id: H03-S53
