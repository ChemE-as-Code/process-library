            notes: "An operability scenario: the heat leak is a supplier estimate (D-103) and its rise is slow, seen first as the waste N2 warm end warming towards 13 C and the liquid levels falling. Nothing is credited: no alarm exists that would see it (the WN-3002 high / deviation alarm and the warm-end delta-T trend are proposed in H03-A10, revised by D-106; the low alarms there would not detect a rising leak) and the cold-spot rounds are proposed (H03-A14). Likelihood raised from C to D by D-106: the governing margin is 1.5 x the ASSUMED estimate, not 2.6 x (D-104)."
