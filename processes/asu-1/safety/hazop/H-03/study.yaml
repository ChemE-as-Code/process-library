risk_matrix: safety/risk-matrix.yaml
assessment_basis: >-
  IEC 61882 guide words applied to the parameters of each node's design intent, in every mode
  that applies. Each scenario (one cause, one consequence) is rated per category of
  safety/risk-matrix.yaml (people, environment, asset incl. production loss): initial with no
  safeguard credited (likelihood of the cause), residual with only the safeguards named in the
  scenario that exist in the files (an alarm with operator response, a control loop, an
  interlock of control/cause-effect.yaml, a relief device, a check valve, a recorded mechanical
  design feature). Ratings are proposed by an agent at basic engineering from the files and
  DESIGN.md, with basis and evidence, for the team to accept or change; no frequency is
  calculated and no LOPA credit is taken here. The matrix itself is a proposal (ASSUMED).
team: []            # not named yet: the owner names the facilitator, scribe and members
notes: >-
  Team not named: the owner names the facilitator, scribe and members (process, operations,
  instrument and control, mechanical, safety, and the MAC / cold box / TSA suppliers as
  needed). No session has been held: every node, scenario, safeguard, rating and action in
  this file is a proposal by an agent (status proposed, by agent).
nodes:
  # ---------------------------------------------------------------- N1 booster
  - id: H03-N1
    title: Booster K-3101 with its anti-surge recycle and discharge to E-3104
    design_intent: >-
      Compress 11,500 Nm3/h dry air from AIR-3005 (5.6 bara, 15 C) to 8.45 bara (59.9 C) on the
      expander's power (191.6 kW, D-061), keep the booster out of surge by recycling cooled air
      from the E-3104 outlet through AIR-3006 / UV-3120 (UIC-3120, fail open), and send the air
      through E-3104 and E-3105 into AIR-3002; PSV-3119 and the check valve on AIR-3002
      downstream of the recycle tee protect the discharge (D-003).
    members: [K-3101, AIR-3005, AIR-3006, UIC-3120, UV-3120, AIR-3002, PSV-3119, {sheet: P-03, object: CV_AIR3002}]
    modes: [normal, startup, shutdown, regen-switch, power-fail]
    status: proposed
    by: agent
    notes: >-
      AIR-3005 comes from AIR-2002 (P-02, H-02): a suction pressure or flow dip at a TSA
      switch-over is a cause in H-02; its effect on the compander (brake load lost) is S16.
    deviations:
      - id: H03-N1-LF
        guide_word: less
        parameter: flow
        scenarios:
          - id: H03-S1
            cause: "UIC-3120 fault or UV-3120 sticking closed while the booster runs at low flow (start-up, turndown)."
            consequence: "K-3101 surges: thrust and bearing damage of the compander, trip, refrigeration lost until repaired."
            refs: [UIC-3120, UV-3120, K-3101]
            modes: [startup, normal]
            safeguards: []
            actions: [H03-A2]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: D, basis: "Compander repair 0.1-1 MEUR and days with reduced liquid make (matrix 3); a single control loop failure (D).", evidence: [UIC-3120, UV-3120, D-003], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 154eb1a2350e4252}}
              residual:
                - {category: asset, severity: "3", likelihood: D, basis: "The anti-surge loop is the failed element; the compander's surge and vibration protection is in the supplier package and not in the files, so nothing is credited.", evidence: [D-003, D-023], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 154eb1a2350e4252}}
          - id: H03-S2
            cause: "UV-3120 fails open (fail-open valve on loss of instrument air or signal) and recycles most of the booster flow."
            consequence: "Less boost and less expander inlet pressure: refrigeration and liquid production fall; LOX/LIN make lost for the duration."
            refs: [UV-3120, AIR-3006, KT-3101]
            modes: [normal]
            safeguards: []
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "2", likelihood: D, basis: "Production loss of up to a day, backup covers GOX (matrix 2); single valve failure (D).", evidence: [UV-3120, D-003, D-067], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 5975c38759944df0}}
              residual:
                - {category: asset, severity: "2", likelihood: D, basis: "No safeguard needed for a production loss; medium, ALARP statement by the team.", evidence: [D-067], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 5975c38759944df0}}
      - id: H03-N1-HP
        guide_word: more
        parameter: pressure
        scenarios:
          - id: H03-S3
            cause: "XV-3117 closes (SSHH-3108 or PDSLL-3115 trip, or spurious) while K-3101 runs down, or the booster discharge is otherwise blocked."
            consequence: "AIR-3002, E-3104 and E-3105 blocked in at the booster shut-off pressure: overpressure of the cooler shells and the line, rupture with flying parts."
            refs: [XV-3117, K-3101, E-3104, E-3105, AIR-3002]
            modes: [normal, shutdown]
            safeguards: [H03-SG1, H03-SG2]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "3", likelihood: C, basis: "Shut-off head above the 11 barg design is possible but not established (supplier curve); an injury near the warm compander skid (matrix 3).", evidence: [PSV-3119, D-003], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 735c5dd00688eefe}}
                - {category: asset, severity: "3", likelihood: C, basis: "Cooler or line damage 0.1-1 MEUR.", evidence: [E-3104, E-3105], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 9ceafc0344eb4915}}
              residual:
                - {category: people, severity: "3", likelihood: A, basis: "PSV-3119 (governing case: XV-3117 closed, section 4) and the anti-surge recycle UIC-3120 credited.", evidence: [PSV-3119, UIC-3120], status: proposed, by: agent, band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: f0394507c3d5bf49}}
                - {category: asset, severity: "3", likelihood: A, basis: "As people.", evidence: [PSV-3119], status: proposed, by: agent, band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 029d875319f0a595}}
      - id: H03-N1-RF
        guide_word: reverse
        parameter: flow
        scenarios:
          - id: H03-S4
            cause: "Compander trip: the air in E-3101 and AIR-3003 (~8.25 bara) flows back through AIR-3002 to the stopped booster."
            consequence: "Reverse rotation of the compander on its oil bearings; bearing damage and loss of the boosted air inventory."
            refs: [K-3101, AIR-3002, E-3101]
            modes: [shutdown, power-fail]
            safeguards: [H03-SG3]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "2", likelihood: D, basis: "Bearing damage 10-100 kEUR; every compander trip (D).", evidence: [D-003], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 5975c38759944df0}}
              residual:
                - {category: asset, severity: "2", likelihood: B, basis: "Swing check valve on AIR-3002 downstream of the recycle tee credited (D-003).", evidence: [D-003, AIR-3002], status: proposed, by: agent, band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: a148c713397132d0}}
      - id: H03-N1-HT
        guide_word: more
        parameter: temperature
        scenarios:
          - id: H03-S5
            cause: "Cooling water to E-3104 lost (CW-3001 at the battery limit) while UV-3120 recycles: the recycle is no longer cooled and the suction heats up."
            consequence: "Booster discharge above its 120 C design temperature: impeller and seal damage of the compander."
            refs: [CW-3001, E-3104, UV-3120, K-3101]
            modes: [startup, normal]
            safeguards: [H03-SG4]
            actions: [H03-A13]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: D, basis: "Compander damage 0.1-1 MEUR; a utility upset coinciding with recycle (D).", evidence: [D-003, CW-3001], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 154eb1a2350e4252}}
              residual:
                - {category: asset, severity: "3", likelihood: C, basis: "Only TICA-3124 high alarm downstream of E-3105 sees the rise (late); no booster discharge temperature alarm on the sheet.", evidence: [TICA-3124], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 9ceafc0344eb4915}}
  # ---------------------------------------------------------------- N2 coolers
  - id: H03-N2
    title: Booster aftercooler E-3104 and chilled-water trim cooler E-3105
    design_intent: >-
      Cool the boosted air (8.45 bara) from 59.9 C to 30 C in E-3104 on cooling water (CW-3001 /
      CWR-3001, 10.9 m3/h, 25 -> 35 C) and to 15 C in E-3105 on chilled water from C-1102
      (CHW-3001 via TV-3124, 5.4 m3/h, 10 -> 20 C; return CHWR-3001 with HV-3126 locked open);
      TICA-3124 set point 15 C, high alarm 18.5 C; I-04 closes TV-3124 on a compander trip; the
      water side is kept below the air pressure (D-067, D-069, D-077).
    members: [E-3104, CW-3001, CWR-3001, E-3105, CHW-3001, CHWR-3001, TV-3124, TICA-3124, HV-3126, HV-3127, HV-3128, HV-3129]
    modes: [normal, startup, shutdown, maintenance, power-fail]
    status: proposed
    by: agent
    notes: >-
      CHW-3001 / CHWR-3001 are studied here; the chilled-water pumps P-1102A/B and C-1102 are in
      H-01. CW supply failure is a battery-limit cause.
    deviations:
      - id: H03-N2-NCW
        guide_word: "no"
        parameter: flow
        description: No cooling water to E-3104.
        scenarios:
          - id: H03-S6
            cause: "Cooling water to E-3104 lost or throttled (CW-3001 at the battery limit, CW supply trip)."
            consequence: "Booster air at ~60 C reaches E-3105, which cannot trim it to 15 C: warm air into the E-3101 warm end (65 C max design), shifted temperature profile and thermal stress in the brazed aluminium core, refrigeration deficit."
            refs: [CW-3001, E-3104, E-3105, E-3101]
            modes: [normal]
            safeguards: [H03-SG4]
            actions: [H03-A10]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: D, basis: "Days of reduced liquid make and possible E-3101 stress damage (matrix 3); utility upset (D).", evidence: [D-067, E-3101], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 154eb1a2350e4252}}
              residual:
                - {category: asset, severity: "3", likelihood: C, basis: "TICA-3124 high alarm (18.5 C) with the operator turning down liquid production (D-069) credited.", evidence: [TICA-3124, D-069], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 9ceafc0344eb4915}}
      - id: H03-N2-NCHW
        guide_word: "no"
        parameter: flow
        description: No chilled water to E-3105.
        scenarios:
          - id: H03-S7
            cause: "TV-3124 closes on a TICA-3124 fault, or the chilled water supply stops (P-1102A/B trip, H-01)."
            consequence: "Boosted air enters E-3101 at 30 C instead of 15 C: +60 kW into the cold box, LOX/LIN make reduced (D-067)."
            refs: [TV-3124, TICA-3124, CHW-3001]
            modes: [normal]
            safeguards: [H03-SG4]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "2", likelihood: D, basis: "Liquid production loss, GOX unaffected (matrix 2).", evidence: [D-067, D-069], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 5975c38759944df0}}
              residual:
                - {category: asset, severity: "2", likelihood: C, basis: "TICA-3124 high alarm credited where the cause is the supply, not the TICA itself.", evidence: [TICA-3124], status: proposed, by: agent, band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 5d4b96d05607d5a4}}
      - id: H03-N2-MCHW
        guide_word: more
        parameter: flow
        description: More chilled water (TV-3124 fails open).
        notes: "No hazard: the chilled water is at 10 C, so the air cannot freeze in E-3105; the air leaves slightly colder than 15 C. No scenario."
      - id: H03-N2-AW
        guide_word: as-well-as
        parameter: composition
        description: Water in the boosted air (tube leak).
        scenarios:
          - id: H03-S8
            cause: "E-3105 tube leak while the compander or the MAC is stopped and AIR-3002 depressurised; the water side keeps the riser's static head (~2.9 bara) and the P-1102 head."
            consequence: "Chilled water collects in the E-3105 shell and is carried into the E-3101 booster passages at restart: ice, blocked passages, core damage of the main heat exchanger."
            refs: [E-3105, AIR-3002, E-3101]
            modes: [shutdown, startup]
            safeguards: [H03-SG5, H03-SG6]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "4", likelihood: C, basis: "E-3101 core repair 1-10 MEUR, weeks down (matrix 4); tube leak at a standstill (C).", evidence: [D-077, E-3101], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 544760766051af8c}}
              residual:
                - {category: asset, severity: "4", likelihood: B, basis: "I-04 (closes TV-3124, not tight shut, not a SIF) and the restart permissive (shell-side drain HV-3127 checked dry, D-077) credited as one layer together.", evidence: [I-04, HV-3127, D-077], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: d508cded1fd37f0d}}
          - id: H03-S9
            cause: "E-3104 tube leak while the booster is stopped: cooling water at ~4 barg is above the depressurised air side."
            consequence: "Cooling water enters AIR-3002 and is carried into E-3101 at restart: ice, blocked passages, core damage."
            refs: [E-3104, CW-3001, AIR-3002, E-3101]
            modes: [shutdown, startup]
            safeguards: []
            actions: [H03-A11]
            status: proposed
            by: agent
            risk:
