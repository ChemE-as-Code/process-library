            consequence: "Refrigeration deficit: the cold box cannot hold its liquid inventory at the design make; the LOX and LIN make falls and the GOX / GAN output must be cut until more expander flow or less liquid production restores the balance; with a large void, cold spots and ice on the casing (as H03-S43)."
