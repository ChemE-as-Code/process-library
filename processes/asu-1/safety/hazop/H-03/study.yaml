                - {category: asset, severity: "2", likelihood: A, basis: "HV-3126 locked open, closed only with the water side drained (D-077) credited.", evidence: [HV-3126, D-077], status: proposed, by: agent, band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 025945a27a93f0d2}}
