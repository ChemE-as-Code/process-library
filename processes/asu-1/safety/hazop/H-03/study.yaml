                - {category: asset, severity: "4", likelihood: C, basis: "As S8, with CW pressure always present.", evidence: [D-077, E-3104], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 544760766051af8c}}
              residual:
                - {category: asset, severity: "4", likelihood: C, basis: "D-077's restart check and I-04 cover E-3105 only; no drain check or CW isolation is recorded for E-3104.", evidence: [D-077, I-04], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 544760766051af8c}}
          - id: H03-S10
            cause: "E-3105 tube leak in operation: the air (8.45 bara) is above the water side, kept low by TV-3124 upstream."
            consequence: "Air enters the chilled-water return CHWR-3001 and is released at the C-1102 top (H-01): gas in the return, minor loss of boosted air."
            refs: [E-3105, CHWR-3001]
            modes: [normal]
            safeguards: [H03-SG7]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "1", likelihood: C, basis: "Negligible: the air vents at C-1102.", evidence: [D-069], status: proposed, by: agent, band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: eee1d93b0f8b4f11}}
              residual:
                - {category: asset, severity: "1", likelihood: C, basis: "HV-3126 locked open keeps the return open to C-1102; no further safeguard needed.", evidence: [HV-3126, D-077], status: proposed, by: agent, band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: eee1d93b0f8b4f11}}
      - id: H03-N2-HP
        guide_word: more
        parameter: pressure
        description: Water side of E-3105 blocked in.
        scenarios:
          - id: H03-S11
            cause: "HV-3126 closed with TV-3124 closed while the water side is full (maintenance step done out of order), and warm air heats the trapped water."
            consequence: "Thermal expansion of trapped water: tube, head or gasket failure of E-3105, water release."
            refs: [HV-3126, TV-3124, E-3105]
