                - {category: asset, severity: "3", likelihood: D, basis: "Single valve failure (D); MAC surge damage and days with a shortfall (3).", evidence: [XV-2102A, D-005], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 154eb1a2350e4252}}
              residual:
