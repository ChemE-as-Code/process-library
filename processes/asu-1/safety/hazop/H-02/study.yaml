      globe valve XV-2112A/B; then pass the regeneration gas (waste N2, O2-deficient, wet with the
      desorbed water and CO2, up to 200 C) through XV-2104A/B and RG-2003 DN700 and the silencer
      S-2101 (1 kPa, 18,696 kg/h) to atmosphere at a safe location (zone Z-N2-VENTS, D-011).
      XV-2104A/B and XV-2112A/B stay closed on the bed on line.
