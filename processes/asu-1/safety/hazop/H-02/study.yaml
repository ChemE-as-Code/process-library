safeguards:
  - {id: H02-SG1, title: "AIA-2102 CO2 / N2O high alarm at the TSA outlet (1 ppm / 0.1 ppm, ASSUMED); the operator shortens the cycle, switches beds or trips the MAC (D-010)", kind: alarm, refs: [AIA-2102], status: proposed, by: agent, notes: "The high-high forced switch / MAC trip of D-010 is in the instrument list only, not in control/cause-effect.yaml: credited as an alarm with operator response (H02-A1)."}
  - {id: H02-SG2, title: "AIA-2103 dew point high alarm at the TSA outlet (-70 C, ASSUMED)", kind: alarm, refs: [AIA-2103], status: proposed, by: agent}
  - {id: H02-SG3, title: "TI-2113A/B dry air outlet high temperature alarm (45 C, ASSUMED) via KS-2101: hot bed on line", kind: alarm, refs: [TI-2113A, TI-2113B], status: proposed, by: agent}
  - {id: H02-SG4, title: "Heating step ended by the heat pulse at TI-2114A/B (KS-2101), not by time alone", kind: control, refs: [TI-2114A, TI-2114B, KS-2101], status: proposed, by: agent, notes: "Instrument list: the heat-pulse arrival ends the heating step. Whether KS-2101 holds the change-over until the pulse has arrived is the supplier's logic (H02-A7)."}
  - {id: H02-SG6, title: "TSHH-2116 regeneration gas outlet high-high temperature trips E-2101 (independent of TIC-2104)", kind: other, refs: [TSHH-2116, E-2101], status: proposed, by: agent, notes: "Trip in the instrument list (S4 review), not in control/cause-effect.yaml: kind other until it is declared there (H02-A2)."}
  - {id: H02-SG7, title: "TSHH-2107 E-2101 element over-temperature trip (independent of TIC-2104)", kind: other, refs: [TSHH-2107, E-2101], status: proposed, by: agent, notes: "Instrument list and equipment list; not in control/cause-effect.yaml (H02-A2)."}
  - {id: H02-SG8, title: "FIC-2105 regeneration gas flow control with low-flow trip of E-2101", kind: control, refs: [FIC-2105, FV-2105, E-2101], status: proposed, by: agent, notes: "The low-flow trip is in the instrument list, not in the C&E, and uses the control transmitter (H02-A2)."}
  - {id: H02-SG10, title: "PSV-2108A / PSV-2108B on the adsorber tops (fire; blocked outlet during repressurization)", kind: relief, refs: [PSV-2108A, PSV-2108B], status: proposed, by: agent}
  - {id: H02-SG11, title: "Depressurization and repressurization through DN100 globe valves XV-2112A/B and XV-2111A/B (slow, about 15 min, D-022)", kind: mechanical, refs: [XV-2112A, XV-2112B, XV-2111A, XV-2111B], status: proposed, by: agent, notes: "Limits the rate only while the sequence uses these valves; no credit when the large valve is opened instead."}
  - {id: H02-SG12, title: "PDIA-2106 F-2101 high differential pressure alarm (5 kPa, ASSUMED): element change", kind: alarm, refs: [PDIA-2106], status: proposed, by: agent}
  - {id: H02-SG13, title: "RG-2003 / S-2101 discharge to atmosphere at a safe location, O2-deficient zone Z-N2-VENTS declared (D-011, D-031)", kind: mechanical, refs: [S-2101, RG-2003], status: proposed, by: agent}
  - {id: H02-SG14, title: "UIC-1102 MAC anti-surge control, blow-off UV-1102 to S-1101 (P-01)", kind: control, refs: [UIC-1102], status: proposed, by: agent}
  - {id: H02-SG15, title: "PSV-1109 on AIR-1004 (P-01): MAC at surge with AIR-1004 blocked", kind: relief, refs: [PSV-1109], status: proposed, by: agent}
  - {id: H02-SG16, title: "V-2101A/B designed for 8 barg, above the MAC maximum discharge (about 6.5 bara)", kind: mechanical, refs: [V-2101A, V-2101B], status: proposed, by: agent}
  - {id: H02-SG17, title: "AIA-3103 hydrocarbons (THC, C2H2) in the LP sump LOX, alarm and action limits per EIGA Doc 65 (P-03)", kind: alarm, refs: [AIA-3103], status: proposed, by: agent, notes: "Downstream, independent of the TSA instruments; studied in H-03 with the LOX purge FIC-3111 (D-010)."}
  - {id: H02-SG18, title: "PSV-3114 on the LP column C-3102 (P-03): waste N2 outlet blocked", kind: relief, refs: [PSV-3114], status: proposed, by: agent, notes: "Protects the LP column against reverse air through RG-2001 only; not E-2101 or the RG lines, so no residual credit in H02-S19 / H02-S29."}
actions:
  - {id: H02-A1, text: "Declare the AIA-2102 CO2 high-high action of D-010 (forced bed switch / MAC trip) as an interlock in control/cause-effect.yaml and set its SIL by LOPA against the main condenser explosion scenarios (H02-S3, H02-S10, H02-S27); consider a second, independent CO2 measurement (or bed-outlet sampling with automatic validation), since the single analyzer is the only TSA breakthrough detection. One update of control/cause-effect.yaml and one LOPA / SIL session answer H01-A3, H01-A8, H02-A1, H02-A2, H03-A2, H03-A3, H04-A01, H04-A02 and H04-A13; this action names the functions of this sheet.", owner: process safety engineer, status: proposed, by: agent}
  - {id: H02-A2, text: "Declare the E-2101 trips (TSHH-2107 element, TSHH-2116 outlet, FIC-2105 low flow) in control/cause-effect.yaml with a SIL screening; give the low-flow trip its own transmitter or a heater-side flow switch, because FIC-2105 is upstream of the XV-2109 bypass and is also the control transmitter. One update of control/cause-effect.yaml and one LOPA / SIL session answer H01-A3, H01-A8, H02-A1, H02-A2, H03-A2, H03-A3, H04-A01, H04-A02 and H04-A13; this action names the functions of this sheet.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H02-A3, text: "Draw and list the E-2101 shell relief that DESIGN.md section 4 asks for (it is not on P-02 nor in piping/special-items.yaml), and size it for the reverse-air case of a pressurized bed (about 5.8 bara against the 3.5 barg design) unless that case is excluded by H02-A4; alternatively raise the E-2101 and RG line design pressure to the air side's.", owner: process engineer, status: proposed, by: agent}
  - {id: H02-A4, text: "Specify switching permissives in KS-2101 with valve position feedback: XV-2103/XV-2104 open only on a depressurized bed, XV-2101/XV-2102 open only after pressure equalisation, make-before-break at change-over, and a discrepancy alarm that stops the sequence; decide with LOPA whether the high-to-low-pressure protection of the regeneration side must be a SIF independent of KS-2101.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H02-A5, text: "Add a pressure transmitter with alarm on each adsorber (none is drawn on P-02) for the depressurization and repressurization end-of-step permissives of H02-A4.", owner: process engineer, status: proposed, by: agent}
  - {id: H02-A6, text: "Set and record the fail positions on loss of power or instrument air of XV-2101..XV-2104A/B, XV-2111A/B, XV-2112A/B, XV-2109 and FV-2105, chosen so that no step can connect the air side to the regeneration side, vent the bed on line or isolate both beds; specify the KS-2101 restart logic after a power dip (resume or hold in a safe step, never a default change-over). One plant-wide fail-position list (P-01 .. P-04) answers H01-A6, H02-A6, H03-A1 and H04-A14; this action names the valves of this sheet.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H02-A7, text: "Ask the TSA supplier for the sequence logic and confirm: change-over only after the heat pulse at TI-2114A/B and a completed cooling step; a second regeneration-complete criterion (heater energy or time at temperature); the initial regeneration of a new or wet bed; the heating-rate limit for a water-loaded bed.", owner: process engineer (with the TSA supplier), status: proposed, by: agent}
  - {id: H02-A8, text: "Give PDI-2115A/B high and low alarms (bed fouling or dusting; a sudden fall for channelling or a support failure).", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H02-A9, text: "F-2101: confirm with the filter supplier the element collapse rating (forward and reverse, a MAC trip reverses the flow), add a low-differential alarm or a downstream check for element failure, and decide whether a duplex filter or isolation valves are needed so that elements can be changed without a plant stop.", owner: process engineer, status: proposed, by: agent}
  - {id: H02-A10, text: "Provide positive isolation points (spectacle blinds or spool pieces) on AIR-1004, AIR-2001, RG-2002 and RG-2003 at each adsorber and at F-2101, and a lock-out of the KS-2101 outputs; write the vessel entry procedure (air purge, O2 measurement, permit, standby and rescue) and the adsorbent handling procedure. Also define a regeneration gas source for warm-up and start-up when the cold box makes no waste N2 (H02-S34). One site procedure for positive isolation and entry into equipment that can hold N2 answers H01-A15, H02-A10, H03-A15 and H04-A18; this action names the equipment of this sheet.", owner: operations / process engineer, status: proposed, by: agent}
  - {id: H02-A11, text: "Confirm the S-2101 outlet height and the dispersion of the waste N2 against the TSA valve platforms, ladders and the Z-SIEVE laydown (D-084), with signage and personal O2 monitors for work in zone Z-N2-VENTS.", owner: safety engineer, status: proposed, by: agent}
  - {id: H02-A12, text: "Specify personnel protection (insulation or guards) on RG-2002, E-2101, the bed tops and RG-2003 where they can reach 200 C within reach of platforms and grade.", owner: piping engineer, status: proposed, by: agent}
  - {id: H02-A13, text: "Confirm with the adsorbent supplier the breakthrough margin of C2H2, N2O, C2H4 and C3 hydrocarbons relative to CO2 at the design and the off-design (warm, wet) feed, so that the AIA-2102 alarm leads every hazardous breakthrough (EIGA Doc 65), and the action limits. DCAC carry-over into AIR-1004 is H-01's (H01-S13 .. H01-S15, H01-A3 / H01-A7).", owner: process engineer (with the TSA supplier), status: proposed, by: agent}
  - {id: H02-A14, text: "Give FIC-2105 low and high flow alarms and a minimum-flow permissive before E-2101 is energised. It is also the regeneration-gas flow alarm H03-A19 refers to (a wrong PV-3110A / PV-3110B position, H03-S31).", owner: instrument and control engineer, status: proposed, by: agent}
