                - {category: asset, severity: "2", likelihood: D, basis: "Single valve or sequence failure (D); plant trip and silencer repair, restart within a day on the backup (2).", evidence: [S-2101, D-072], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 5975c38759944df0}}
              residual:
                - {category: asset, severity: "2", likelihood: D, basis: "No safeguard independent of KS-2101 on P-02.", evidence: [KS-2101], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 5975c38759944df0}}
