                - {category: asset, severity: "5", likelihood: D, basis: "Loss of the cold box (5).", evidence: [D-010], status: proposed, by: agent, band: {value: very-high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 383056181dc74e6a}}
