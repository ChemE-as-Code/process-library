  - id: H02-N9
    title: Switching sequence KS-2101 (depressurize, heat, cool, repressurize, change-over)
    design_intent: >-
      For each bed: adsorption about 4 h; then depressurize through XV-2112A/B, heat (XV-2103 and
      XV-2104 open, E-2101 on, XV-2109 closed) until the heat pulse at TI-2114A/B, cool (E-2101
      off, XV-2109 open), repressurize through XV-2111A/B (about 15 min), then change over by
      opening XV-2101/XV-2102 of the fresh bed before closing those of the spent bed. At no time
      is a bed under air pressure connected to the regeneration side, and the air path is never
      closed.
    members: [KS-2101, XV-2101A, XV-2101B, XV-2102A, XV-2102B, XV-2103A, XV-2103B, XV-2104A, XV-2104B, XV-2109, XV-2111A, XV-2111B, XV-2112A, XV-2112B]
    modes: [regen-switch, normal, startup, power-fail]
    status: proposed
    by: agent
    notes: >-
      KS-2101 is basic process control; no switching-valve position feedback, bed pressure
      transmitter or switching permissive is shown on P-02 or in the C&E. The sequence logic
      beyond the P&ID is the TSA supplier's (scope).
