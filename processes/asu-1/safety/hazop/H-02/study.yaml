      and the dew point (AIA-2103, alarm -70 C) of the product.
    members: [AIR-2001, XV-2102A, XV-2102B, AIA-2102, AIA-2103, TI-2113A, TI-2113B]
    modes: [normal, startup, regen-switch, power-fail]
    status: proposed
    by: agent
    deviations:
      - id: H02-N3-NF
        guide_word: "no"
        parameter: flow
        scenarios:
          - id: H02-S8
            cause: "XV-2102A/B of the bed on line closes spuriously (actuator or KS-2101 output)."
            consequence: "As H02-S1: the MAC runs toward surge against a blocked outlet and the cold box loses its air; plant trip, customer on the backup."
            refs: [XV-2102A, XV-2102B, KS-2101]
            modes: [normal, regen-switch]
            safeguards: [H02-SG14, H02-SG15, H02-SG16]
            actions: [H02-A6]
            status: proposed
            by: agent
            risk:
