risk_matrix: safety/risk-matrix.yaml
assessment_basis: >-
  IEC 61882 guide words applied to the parameters of each node's design intent, in every mode
  that applies. Each scenario (one cause, one consequence) is rated per category of
  safety/risk-matrix.yaml (people, environment, asset incl. production loss): initial with no
  safeguard credited (likelihood of the cause), residual with only the safeguards named in the
  scenario that exist in the files (an alarm with operator response, a control loop, an
  interlock of control/cause-effect.yaml, a relief device, a check valve, a recorded mechanical
  design feature). Ratings are proposed by an agent at basic engineering from the files and
  DESIGN.md, with basis and evidence, for the team to accept or change; no frequency is
  calculated and no LOPA credit is taken here. The matrix itself is a proposal (ASSUMED).
team: []            # not named yet: the owner names the facilitator, scribe and members
notes: >-
  Team not named: the owner names the facilitator, scribe and members (process, operations,
  instrument and control, mechanical, safety, and the MAC / cold box / TSA suppliers as
  needed). No session has been held: every node, scenario, safeguard, rating and action in
  this file is a proposal by an agent (status proposed, by agent).
nodes:
  # ------------------------------------------------------------------------------------------
  - id: H02-N1
    title: Feed air inlet AIR-1004 with the inlet valves XV-2101A/B and the repressurization valves XV-2111A/B
    design_intent: >-
      Take the precooled, water-saturated air S3 from C-1101 (111,080 kg/h, 5.92 bara, 12 C,
      D-089) through AIR-1004 DN700 to the bottom of the bed on line through its inlet valve
      XV-2101A or XV-2101B (open on the adsorbing bed, closed on the other), and repressurize
      the regenerated bed slowly (about 15 min) through the DN100 globe valve XV-2111A or
      XV-2111B that bypasses its inlet valve (D-022).
    members:
      - {tag: AIR-1004, sheet: P-02}
      - XV-2101A
      - XV-2101B
      - XV-2111A
      - XV-2111B
      - KS-2101
    modes: [normal, startup, shutdown, regen-switch, power-fail]
    status: proposed
    by: agent
    notes: >-
      Off-page: AIR-1004 comes from C-1101 on P-01 (study H-01). Causes there (MAC trip, DCAC
      carry-over or flooding, chilled-water loss with hot air, oil from the MAC) are H-01's;
      their consequences in the TSA are noted under the deviations below.
    deviations:
      - id: H02-N1-NF
        guide_word: "no"
        parameter: flow
        scenarios:
          - id: H02-S1
            cause: "XV-2101A/B of the adsorbing bed closes spuriously (actuator or KS-2101 output fault) while the other bed is not on line."
            consequence: "The air path is blocked: the MAC runs against a closed valve toward surge, and the cold box loses its feed air, so the columns lose pressure and refrigeration and GOX supply stops; plant trip, customer on the LOX backup."
            refs: [XV-2101A, XV-2101B, KS-2101]
            modes: [normal, regen-switch]
            safeguards: [H02-SG14, H02-SG15]
            actions: [H02-A6]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: D, basis: "Single valve or sequence output failure (matrix D); MAC driven into surge with stage damage possible and days with a supply shortfall (matrix 3).", evidence: [XV-2101A, KS-2101, D-005], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 154eb1a2350e4252}}
              residual:
                - {category: asset, severity: "2", likelihood: D, basis: "UIC-1102 anti-surge (blow-off to S-1101) and PSV-1109 on P-01 keep the MAC and the DCAC safe; what remains is a plant trip and a restart within a day on the backup (matrix 2).", evidence: [UIC-1102, PSV-1109, D-014], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 5975c38759944df0}}
      - id: H02-N1-MF
        guide_word: more
        parameter: flow
        description: "More flow into the bed being repressurized."
        scenarios:
          - id: H02-S2
            cause: "XV-2101A/B (DN700) is opened on a depressurized bed instead of the DN100 repressurization valve XV-2111A/B (step skipped in KS-2101, or the sequence run in manual)."
            consequence: "Fast repressurization: a high upflow velocity lifts and attrits the sieve, damages the bed screens and sends dust to F-2101; the air flow to the bed on line and to the cold box dips (HP column pressure dip, MAC pushed toward surge)."
            refs: [XV-2101A, XV-2101B, XV-2111A, XV-2111B, KS-2101]
            modes: [regen-switch, startup]
            actions: [H02-A4, H02-A5]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: D, basis: "Sequence or operator error in a routine step (D); sieve damage and an adsorbent top-up or change-out, 0.1 to 1 MEUR with days down (3).", evidence: [D-022, KS-2101], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 154eb1a2350e4252}}
              residual:
                - {category: asset, severity: "3", likelihood: D, basis: "No safeguard independent of KS-2101: the slow DN100 bypass helps only when the sequence uses it, and no bed pressure is measured on P-02 to block the large valve.", evidence: [D-022, XV-2111A], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 154eb1a2350e4252}}
      - id: H02-N1-RF
        guide_word: reverse
        parameter: flow
        notes: >-
          Reverse flow from the cold box through the beds toward C-1101 on a MAC trip has its
          cause on P-01 (H-01); the check valve on AIR-1002 (P-01, D-005) stops it there (H01-S11, action H01-A21). No
          cause on P-02 alone; a bed vented while on line is H02-S33.
      - id: H02-N1-AW
        guide_word: as-well-as
        parameter: composition
        description: "Liquid water or oil with the feed air."
        notes: >-
          Causes on P-01 (H-01): DCAC flooding or demister failure carries free water into
          AIR-1004 (LSHH-1106, D-005); MAC oil carry-over (D-012). Consequence here: the alumina
          layer saturates, the water front reaches the 13X and the bed loses its CO2 capacity, so
          CO2 and hydrocarbons break through early (the chain of H02-S5). AIR-1004 has no water
          knock-out or drain on P-02. H-01 rates the carry-over at its cause (H01-S13 .. H01-S15,
          actions H01-A3, H01-A4, H01-A7); no separate knock-out is proposed here.
      - id: H02-N1-HT
        guide_word: more
        parameter: temperature
        notes: >-
          Cause on P-01 (H-01): chilled-water or DCAC failure raises the air temperature (TIC-1105,
          TIA-1111; H01-S9, H01-S17, H01-S26, H01-S27). Consequence here: higher water load and lower sieve capacity, early
          breakthrough. The TSA has no inlet temperature measurement on P-02.
  # ------------------------------------------------------------------------------------------
  - id: H02-N2
    title: Adsorber V-2101A/B in adsorption (upflow)
    design_intent: >-
      Remove water (outlet dew point below -70 C, AIA-2103), CO2 (outlet below 0.1 ppm, alarm
      1 ppm at AIA-2102), N2O, C2H2 and most heavier hydrocarbons from 111,080 kg/h of air at
      12 C and about 5.83 bara for an adsorption step of about 4 h (water load 165 kg/h, CO2
      67.7 kg/h; alumina under 13X), at no more than 8 kPa bed pressure drop. Vessels designed
      for 8 barg and 250 C, minimum design temperature 0 C; PSV-2108A/B on the bed tops for the
      fire and blocked-in cases.
    members: [V-2101A, V-2101B, PDI-2115A, PDI-2115B, PSV-2108A, PSV-2108B]
    modes: [normal, startup, regen-switch]
    status: proposed
    by: agent
    deviations:
      - id: H02-N2-PO
        guide_word: part-of
        parameter: composition
        description: "Adsorption incomplete: H2O, CO2, N2O or hydrocarbons pass the bed on line."
        scenarios:
          - id: H02-S3
            cause: "The adsorbent has lost capacity over time (hydrothermal ageing, fouling, attrition) so the CO2 front reaches the bed outlet within the fixed step time."
            consequence: "CO2 and N2O, then C2H2 and other hydrocarbons, enter the cold box and accumulate in the LP column sump at the main condenser E-3103: solid deposits in the boiling passages, dry boiling and a hydrocarbon explosion of the condenser and cold box (EIGA Doc 65)."
            refs: [V-2101A, V-2101B, AIA-2102]
            modes: [normal]
            safeguards: [H02-SG1, H02-SG17]
            actions: [H02-A1, H02-A13]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "5", likelihood: C, basis: "Capacity loss of the sieve could happen once in the plant life (C); a main condenser explosion with several fatalities (matrix 5).", evidence: [D-006, D-010], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: b6ef4d2263633cd5}}
                - {category: asset, severity: "5", likelihood: C, basis: "Loss of the cold box, months down (5).", evidence: [D-010], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 20579213de92d430}}
              residual:
                - {category: people, severity: "5", likelihood: A, basis: "A slow loss of capacity shows first as a CO2 rise at AIA-2102 (alarm 1 ppm, operator shortens the cycle) and the LP sump LOX is analysed by AIA-3103 (P-03) with action limits; both have to fail for the outcome.", evidence: [AIA-2102, AIA-3103, D-010], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 61d9d3ab4bf99bc9}}
                - {category: asset, severity: "5", likelihood: A, basis: "As for people.", evidence: [AIA-2102, AIA-3103], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: a617a5430a81f857}}
          - id: H02-S4
            cause: "Flow bypasses part of the bed: bed support grid or screen failure, an uneven bed surface after a pressure shock (H02-S2, H02-S32), adsorbent migration."
            consequence: "Air channels past the sieve: water and CO2 break through early and freeze in the E-3101 passages (rising pressure drop, warm-up and derime of the cold box)."
            refs: [V-2101A, V-2101B, PDI-2115A, PDI-2115B]
            modes: [normal]
            safeguards: [H02-SG1, H02-SG2]
            actions: [H02-A8]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: C, basis: "Internals failure once in the plant life (C); cold box derime and a supply shortfall of days (3).", evidence: [V-2101A, D-006], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 9ceafc0344eb4915}}
              residual:
                - {category: asset, severity: "3", likelihood: B, basis: "AIA-2102 CO2 and AIA-2103 dew point alarms let the operator switch beds before the cold box is loaded; PDI-2115A/B are indications without alarm and are not credited.", evidence: [AIA-2102, AIA-2103], status: proposed, by: agent, band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 96d32a0543b3b03e}}
          - id: H02-S5
            cause: "A new or not fully activated bed (first fill, after change-out, or after a long shutdown open to humid air) is put on line without a complete initial regeneration."
            consequence: "Water and CO2 break through during the cold box cool-down and freeze in E-3101; the cool-down has to be repeated after a derime."
            refs: [V-2101A, V-2101B, E-2101]
            modes: [startup, maintenance]
            safeguards: [H02-SG1, H02-SG2]
            actions: [H02-A7]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: C, basis: "Start-up error once in the plant life (C); derime and days of delay (3).", evidence: [D-006], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 9ceafc0344eb4915}}
              residual:
                - {category: asset, severity: "3", likelihood: B, basis: "AIA-2102 and AIA-2103 alarms stop the cool-down before much is deposited.", evidence: [AIA-2102, AIA-2103], status: proposed, by: agent, band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 96d32a0543b3b03e}}
      - id: H02-N2-HP
        guide_word: more
        parameter: pressure
        notes: >-
          Blocked in on the air side the bed reaches at most the MAC discharge (about 6.5 bara,
          DESIGN.md section 4), below the 8 barg design: no overpressure from the process side.
          Air onto the regeneration side is H02-S25 / H02-S38.
        scenarios:
          - id: H02-S6
            cause: "External fire at the adsorbers while a bed is blocked in by its switching valves."
            consequence: "Gas expansion and a weakened shell: rupture of the adsorber."
            refs: [V-2101A, V-2101B, PSV-2108A, PSV-2108B]
            modes: [normal, maintenance, shutdown]
            safeguards: [H02-SG10]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "4", likelihood: B, basis: "Little flammable inventory in area A2 (air and waste N2 only, E-2101 electrical): a fire is unlikely (B); a vessel rupture kills one person nearby (4).", evidence: [D-011, V-2101A], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 076c6f9af2105fd3}}
              residual:
                - {category: people, severity: "4", likelihood: A, basis: "PSV-2108A/B sized for the fire case on each bed top.", evidence: [PSV-2108A, PSV-2108B, D-011], status: proposed, by: agent, band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 2aae4706e67ac517}}
      - id: H02-N2-HDP
        guide_word: more
        parameter: differential pressure
        scenarios:
          - id: H02-S7
            cause: "Sieve dusting, fines or fouling raise the bed pressure drop above the 8 kPa allowance."
            consequence: "The MAC discharge rises by the difference (about 6.7 kW per kPa) or the air flow falls; the bed internals carry a higher load and may collapse."
            refs: [V-2101A, V-2101B, PDI-2115A, PDI-2115B]
            modes: [normal]
            actions: [H02-A8]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "2", likelihood: C, basis: "Gradual fouling once in the plant life (C); energy and a planned adsorbent replacement (2).", evidence: [D-079, D-089], status: proposed, by: agent, band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 5d4b96d05607d5a4}}
              residual:
                - {category: asset, severity: "2", likelihood: C, basis: "PDI-2115A/B indicate only (no alarm); nothing is credited.", evidence: [PDI-2115A, PDI-2115B], status: proposed, by: agent, band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 5d4b96d05607d5a4}}
      - id: H02-N2-LT
        guide_word: less
        parameter: temperature
        notes: >-
          The adsorbers have a minimum design temperature of 0 C (equipment list). Cold
          regeneration gas from an E-3101 warm-end upset has its cause on P-03 (H-03); P-02 has no
          temperature measurement on RG-2001. Question for the team: is a waste N2 temperature
          below 0 C credible at the WN-3002 tee, and is a low-temperature alarm on RG-2001 needed?
          Handed to H-03, where the cause lies: H03-S13 (exchanger imbalance, cold waste N2 at the
          warm end), with H03-A10 (warm-end low-temperature alarms on WN-3002).
  # ------------------------------------------------------------------------------------------
  - id: H02-N3
    title: Adsorber outlet header AIR-2001 with the outlet valves XV-2102A/B and the analyzers AIA-2102, AIA-2103
    design_intent: >-
      Collect the dry air (110,870 kg/h, about 5.71 bara, 12 to 15 C, TI-2113A/B high alarm
      45 C) from the bed on line through its outlet valve XV-2102A/B (closed on the bed in
