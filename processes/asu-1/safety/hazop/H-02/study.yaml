            consequence: "Dry air flows back from AIR-2001 into the regenerating bed and out through RG-2003 and S-2101 to atmosphere: the cold box loses most of its air (trip), the vent and silencer take a flow far above their 18.7 t/h rating (noise, silencer damage)."
            refs: [XV-2102A, XV-2102B, RG-2003, S-2101]
            modes: [regen-switch]
            actions: [H02-A4]
            status: proposed
            by: agent
            risk:
