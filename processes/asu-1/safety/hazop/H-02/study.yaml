schema: cheme/hazop-study/v1
kind: hazop-study
id: H-02
title: Front-end purification (TSA)
scope: >-
  Sheet P-02 (pid/P-02.xml) as drawn: the molecular sieve adsorbers V-2101A/B with their
  switching valves, the adsorber outlet header AIR-2001 with the CO2 / H2O analyzers and the
  reliefs PSV-2108A/B, the dust filter F-2101 and the dry air line AIR-2002 to the cold box;
  the regeneration gas path: RG-2001 from E-3101, the electric heater E-2101 with its bypass
  XV-2109, RG-2002 to the bed in regeneration, and RG-2003 to atmosphere through silencer
  S-2101. Off-page connections: AIR-1004 precooled air from C-1101 on P-01 (H-01); AIR-2002 to
  E-3101 and its branch AIR-3005 to K-3101 on P-03 (H-03); RG-2001 waste N2 from E-3101 on
  P-03 (H-03). Battery limits: the RG-2003 vent to atmosphere, power to E-2101. Not covered:
  the adsorbent's own data (supplier), the switching sequence logic beyond what the P&ID and
  the C&E show (to be asked of the TSA supplier), the power system.
modes:
  - {id: normal, title: Normal operation, description: "One bed adsorbing, the other regenerating (heating or cooling step)."}
  - {id: startup, title: Start-up, description: "First pressurization, first regeneration of a new or wet bed, cold box cooldown downstream."}
  - {id: shutdown, title: Shutdown and trip, description: "MAC trip, plant trip, a bed left under pressure."}
  - {id: warmup, title: Warm-up and derime, description: "Dry air supply and hot gas for the warm-up and derime of the cold box."}
  - {id: regen-switch, title: TSA regeneration and switching, description: "Depressurization, heating, cooling, repressurization and switch-over of the beds."}
  - {id: maintenance, title: Maintenance, description: "Isolation, adsorbent change-out, vessel entry."}
  - {id: power-fail, title: Power failure, description: "Total or partial loss of power, and of instrument air where it follows."}
