    status: proposed
    by: agent
    deviations:
      - id: H01-N3-D1
        guide_word: more
        parameter: pressure
        description: "MAC discharge pressure above normal."
        notes: "A blocked AIR-1004 downstream (adsorber switching valves on P-02) is studied in H-02 at its cause; its scenarios are H02-S1, H02-S8 and H02-S31; its relief case is PSV-1109 (section 4: MAC at surge / max. IGV with AIR-1004 blocked, ~6.5 bara against the 8 barg design), so C-1101 cannot be overpressured by the MAC alone."
        scenarios:
          - id: H01-S8
            cause: "FIC-1101 flow transmitter fails low: the inlet guide vanes go to full opening."
            consequence: "Air flow and power above the rating: motor overload trip, high gas load on the DCAC packing and mist eliminator with water carry-over towards the adsorbers."
            refs: [FIC-1101, K-1101, C-1101]
            modes: [normal]
            safeguards: [H01-SG-PIC1103, H01-SG-MIST]
            actions: []
            status: proposed
            by: agent
            risk:
