risk_matrix: safety/risk-matrix.yaml
assessment_basis: >-
  IEC 61882 guide words applied to the parameters of each node's design intent, in every mode
  that applies. Each scenario (one cause, one consequence) is rated per category of
  safety/risk-matrix.yaml (people, environment, asset incl. production loss): initial with no
  safeguard credited (likelihood of the cause), residual with only the safeguards named in the
  scenario that exist in the files (an alarm with operator response, a control loop, an
  interlock of control/cause-effect.yaml, a relief device, a check valve, a recorded mechanical
  design feature). Ratings are proposed by an agent at basic engineering from the files and
  DESIGN.md, with basis and evidence, for the team to accept or change; no frequency is
  calculated and no LOPA credit is taken here. The matrix itself is a proposal (ASSUMED).
  Credit convention for the residual likelihood (one matrix letter is one order of
  magnitude; a proposal for the team, not a LOPA): a relief device whose listed case covers the
  cause, or a passive feature that removes the path (an open vent without valve, an elevated
  vent outside its zone), up to two orders; an alarm with operator response, a control loop, a
  check valve, an administrative lock, a trip that is drawn but not in the C&E (kind other), or
  an interlock whose SIL is not confirmed, one order each; nothing for a safeguard that shares
  a transmitter, valve or logic with the cause or that the cause defeats, nor for a relief
  device whose listed case does not cover the cause.
team: []            # not named yet: the owner names the facilitator, scribe and members
notes: >-
  Team not named: the owner names the facilitator, scribe and members (process, operations,
  instrument and control, mechanical, safety, and the MAC / cold box / TSA suppliers as
  needed). No session has been held: every node, scenario, safeguard, rating and action in
  this file is a proposal by an agent (status proposed, by agent).
nodes:
  # ---------------------------------------------------------------- N1 air intake
  - id: H01-N1
    title: MAC inlet filter F-1101 and suction duct AIR-1001
    design_intent: "Draw ~113,300 kg/h of ambient air (85,840 Nm3/h dry, 30 C, 80 % RH design; -5 C minimum ambient) through the self-cleaning filter F-1101 (rated 90,000 Nm3/h, 0.1 barg design) and AIR-1001 (DN1400, ~17.6 m/s) to the K-1101 first stage, clean of dust and with the hydrocarbon, CO2 and N2O content of the design basis (THC 5 ppm as CH4, C2H2 50 ppb, CO2 420 ppm, N2O 0.33 ppm, ASSUMED)."
    members: [F-1101, AIR-1001, PDIA-1101, K-1101]
    modes: [normal, startup, shutdown, maintenance]
    status: proposed
    by: agent
    notes: "Oxygen content of the intake air is not a deviation of this node: the O2-rich vents are grouped in vent area V1 downwind (D-019, D-025); a re-entrainment would raise the O2 content of the air by a fraction of a percent only."
    deviations:
      - id: H01-N1-D1
        guide_word: more
        parameter: differential pressure
        description: "Filter differential pressure above the cleaning range (filter blocked)."
        scenarios:
          - id: H01-S1
            cause: "F-1101 cartridges blocked by coastal fog, salt or hoar frost at -5 C ambient faster than the pulse cleaning clears them."
            consequence: "Cartridge collapse or bypass; dust and cartridge debris drawn into the K-1101 first stage (impeller erosion and imbalance), and a suction pressure drop that cuts the air flow."
            refs: [F-1101, PDIA-1101, K-1101]
            modes: [normal, startup]
            safeguards: [H01-SG-PDIA1101, H01-SG-VIA1104]
            actions: [H01-A2]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: D, basis: "Impeller damage of one stage, 0.1-1 MEUR and days down (matrix 3); filter blockage in fog or frost expected a few times in plant life (D).", evidence: [F-1101, D-025], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 154eb1a2350e4252}}
              residual:
                - {category: asset, severity: "3", likelihood: B, basis: "PDIA-1101 high alarm starts the pulse cleaning and alerts the operator; VIA-1104 trips the machine on vibration before a stage fails.", evidence: [PDIA-1101, VIA-1104], status: proposed, by: agent, band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 96d32a0543b3b03e}}
      - id: H01-N1-D2
        guide_word: as-well-as
        parameter: composition
        description: "Air with hydrocarbons, CO2 or N2O above the design basis."
        scenarios:
          - id: H01-S2
            cause: "Hydrocarbon plume at the intake (a flare, a leak or a fire at a neighbouring plant, traffic or a vehicle idling at the filter house) above the design basis of 5 ppm THC / 50 ppb C2H2."
            consequence: "Hydrocarbons not held by the adsorbers reach the cold box and concentrate in the boiling LOX of the LP sump around the condenser-reboiler E-3103: hydrocarbon deposit and ignition in oxygen, main condenser explosion and cold box destruction."
            refs: [F-1101, AIR-1001, E-3103]
            modes: [normal, startup]
            safeguards: [H01-SG-INTAKE, H01-SG-TSA, H01-SG-FIC3111, H01-SG-AIA3103]
            actions: [H01-A1]
            status: proposed
            by: agent
            notes: "The cold-box side of the hazard (purge, submergence, analyser action limits per EIGA Doc 65) is studied in H-03; this scenario covers the intake as its cause."
            risk:
              initial:
                - {category: people, severity: "5", likelihood: C, basis: "Main condenser explosion, several fatalities possible (matrix 5); an intake plume above the design basis could occur once in plant life at an industrial coastal site (C).", evidence: [D-010, E-3103], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: b6ef4d2263633cd5}}
                - {category: asset, severity: "5", likelihood: C, basis: "Cold box destroyed, over 10 MEUR and months down (matrix 5).", evidence: [D-010], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 20579213de92d430}}
              residual:
                - {category: people, severity: "5", likelihood: A, basis: "Intake upwind and away from hydrocarbon sources, the molecular sieve holds C2H2 and most C3+, the continuous LOX purge FIC-3111 (low-flow alarm) and the sump analyser AIA-3103 alarm: several independent failures needed.", evidence: [D-006, D-010, D-025, FIC-3111, AIA-3103], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 61d9d3ab4bf99bc9}}
                - {category: asset, severity: "5", likelihood: A, basis: "As for people.", evidence: [D-010, AIA-3103], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: a617a5430a81f857}}
          - id: H01-S3
            cause: "CO2 or N2O plume at the intake (combustion exhaust, a fire nearby) well above the 420 ppm / 0.33 ppm of the design basis."
            consequence: "Early CO2 / N2O breakthrough of the on-line adsorber before its switch-over: solid CO2 plugs the cold end of E-3101 and N2O accumulates in the LOX; warm-up and derime of the cold box."
            refs: [F-1101, AIA-2102]
            modes: [normal]
            safeguards: [H01-SG-AIA2102]
            actions: [H01-A1]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: C, basis: "Cold-box derime of days with a supply shortfall (matrix 3); a plume once in plant life (C).", evidence: [D-006, D-010], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 9ceafc0344eb4915}}
              residual:
                - {category: asset, severity: "3", likelihood: B, basis: "AIA-2102 CO2 / N2O alarm at the adsorber outlet lets the operator switch the beds or reduce load before solids reach the cold box.", evidence: [AIA-2102], status: proposed, by: agent, band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 96d32a0543b3b03e}}
  # ---------------------------------------------------------------- N2 MAC and intercoolers
  - id: H01-N2
    title: Main air compressor K-1101 with intercoolers E-1101 / E-1102 (AIR-1005, AIR-1006)
    design_intent: "Compress the air in three stages from 1.0 to 6.02 bara (pressure ratio ~1.84 per stage) at 85,840 Nm3/h dry air (70 % turndown by the inlet guide vanes under FIC-1101), with interstage cooling to ~40 C in E-1101 (AIR-1005, ~1.86 bara) and E-1102 (AIR-1006, ~3.34 bara) on cooling water (25 C supply, ~4 barg), oil-free air path, kept out of surge by UIC-1102."
    members: [K-1101, E-1101, E-1102, AIR-1005, AIR-1006, FIC-1101, UIC-1102, PIC-1103, VIA-1104, TIA-1110, CW-1002, CWR-1002, CW-1004, CWR-1003]
    modes: [normal, startup, shutdown, regen-switch, power-fail]
    status: proposed
    by: agent
    notes: "The machine protection (lube oil, seals, bearings, motor) is the supplier's and outside the scope; the scenarios take its effect on the process only. The TSA switch-over (P-02, H-02) is a flow swing for the MAC; its causes are studied in H-02."
    deviations:
      - id: H01-N2-D1
        guide_word: less
        parameter: flow
        description: "Flow below the surge line of a stage."
        scenarios:
          - id: H01-S4
            cause: "UIC-1102 fails or UV-1102 sticks closed while the demand falls (turndown, TSA repressurization on P-02)."
            consequence: "K-1101 surges: flow reversal through the stages, thrust bearing and impeller damage, MAC down for weeks."
            refs: [UIC-1102, UV-1102, K-1101]
            modes: [normal, regen-switch, shutdown]
            safeguards: [H01-SG-PIC1103, H01-SG-VIA1104]
            actions: [H01-A6]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "4", likelihood: D, basis: "Repeated surge damages the integrally geared machine, 1-10 MEUR and weeks down (matrix 4); anti-surge loop failure on demand a few times in plant life (D).", evidence: [K-1101, UIC-1102], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: d6c65b3d1b5e620d}}
              residual:
                - {category: asset, severity: "3", likelihood: C, basis: "PIC-1103 overrides IGV / blow-off on rising pressure and VIA-1104 trips the machine on vibration, so damage is limited to a stage repair (matrix 3).", evidence: [PIC-1103, VIA-1104], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 9ceafc0344eb4915}}
      - id: H01-N2-D2
        guide_word: more
        parameter: temperature
        description: "Stage inlet / discharge temperature above design."
        scenarios:
          - id: H01-S5
            cause: "Loss or reduction of cooling water to E-1101 / E-1102 (CW-1002 / CW-1004 at the battery limit, fouling of the tube side)."
            consequence: "Second and third stage inlets well above 40 C: discharge temperatures towards the 180 C design, motor overload, seal and impeller damage; hotter, wetter air to the DCAC."
            refs: [E-1101, E-1102, CW-1002, CW-1004, TIA-1110]
            modes: [normal]
            safeguards: [H01-SG-TIA1110, H01-SG-VIA1104]
            actions: []
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: C, basis: "Stage damage 0.1-1 MEUR (matrix 3); CW system failure or heavy fouling once in plant life (C).", evidence: [E-1101, E-1102], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 9ceafc0344eb4915}}
              residual:
                - {category: asset, severity: "3", likelihood: B, basis: "TIA-1110 TAH on every stage discharge and intercooler outlet (120 / 45 C) gives the operator time to unload; VIA-1104 trip.", evidence: [TIA-1110, VIA-1104], status: proposed, by: agent, band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 96d32a0543b3b03e}}
      - id: H01-N2-D3
        guide_word: as-well-as
        parameter: composition
        description: "Water or oil in the compressed air."
        scenarios:
          - id: H01-S6
            cause: "Tube leak in E-1101 or E-1102: the cooling water (~5 bara) is above the air side (1.8 / 3.3 bara)."
            consequence: "Water sprayed into the air ahead of stage 2 or 3 (E-1101 has no separator): impeller erosion and imbalance; more water to the DCAC."
            refs: [E-1101, E-1102, K-1101]
            modes: [normal]
            safeguards: [H01-SG-SEP1102, H01-SG-VIA1104]
            actions: [H01-A22]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: C, basis: "Impeller damage, 0.1-1 MEUR (matrix 3); a tube leak once in plant life (C).", evidence: [E-1101, E-1102, D-064], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 9ceafc0344eb4915}}
              residual:
                - {category: asset, severity: "3", likelihood: B, basis: "E-1102 integral separator catches water ahead of stage 3; VIA-1104 alarm and trip on imbalance. No leak detection on E-1101.", evidence: [D-064, VIA-1104], status: proposed, by: agent, band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 96d32a0543b3b03e}}
          - id: H01-S7
            cause: "Lube oil carried into the air path of K-1101 (worn labyrinth or buffer seal, oil-tank vent drawn back into the intake)."
            consequence: "Oil mist with the air to the DCAC and the adsorbers: adsorbent fouled and replaced, and heavy hydrocarbons that pass towards the cold box add to the LP-sump hydrocarbon load."
            refs: [K-1101, C-1101]
            modes: [normal, startup]
            safeguards: [H01-SG-D012, H01-SG-TSA, H01-SG-AIA3103]
            actions: [H01-A23]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: C, basis: "Adsorbent charge replaced, 0.1-1 MEUR and days of shortfall (matrix 3); seal wear once in plant life (C).", evidence: [D-012], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 9ceafc0344eb4915}}
                - {category: people, severity: "5", likelihood: B, basis: "Oil reaching the LOX sump is an ignition source in oxygen (matrix 5); needs the seal failure and passage through the DCAC and the sieve (B).", evidence: [D-010, D-012], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: feea7693498b1f1a}}
              residual:
                - {category: asset, severity: "3", likelihood: C, basis: "No oil-in-air detection on P-01: the oil-free air path design (D-012) prevents the cause but nothing detects it; adsorbent damage still likely when it happens.", evidence: [D-012], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 9ceafc0344eb4915}}
                - {category: people, severity: "5", likelihood: A, basis: "Oil-free air path with demister (D-012), the alumina layer of the sieve holds heavy hydrocarbons, AIA-3103 alarm in the sump LOX.", evidence: [D-012, D-006, AIA-3103], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 61d9d3ab4bf99bc9}}
  # ---------------------------------------------------------------- N3 MAC discharge
  - id: H01-N3
    title: MAC discharge - aftercooler E-1103, AIR-1002 with the check valve, blow-off AIR-1003 / UV-1102 / S-1101
    design_intent: "Cool the 6.02 bara third-stage discharge to 40 C in E-1103 (CW-1005 / CWR-1004) and deliver it through AIR-1002 (DN600) and the non-return valve to the DCAC C-1101 (8 barg design); blow off surplus air through UV-1102 and the silencer S-1101 for anti-surge and start-up; prevent back-flow from the DCAC and the adsorbers into the MAC on a trip."
    members: [E-1103, AIR-1002, AIR-1003, UV-1102, S-1101, TIA-1111, PIC-1103, {sheet: P-01, object: CV_AIR1002}, CW-1005, CWR-1004, PSV-1109]
