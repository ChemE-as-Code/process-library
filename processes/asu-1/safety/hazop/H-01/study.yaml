safeguards:
  - {id: H01-SG-PDIA1101, title: "PDIA-1101 high differential pressure alarm on F-1101 (starts the pulse cleaning)", kind: alarm, refs: [PDIA-1101], status: proposed, by: agent}
  - {id: H01-SG-INTAKE, title: "Air intake at the upwind corner, away from hydrocarbon sources and the vent area V1", kind: mechanical, refs: [F-1101], status: proposed, by: agent, notes: "D-010 (5), D-025; layout feature."}
  - {id: H01-SG-TSA, title: "Molecular sieve adsorbers remove H2O, CO2, N2O, C2H2 and most C3+ before the cold box", kind: mechanical, refs: [V-2101A, V-2101B], status: proposed, by: agent, notes: "D-006, D-010 (1); studied in H-02."}
  - {id: H01-SG-FIC3111, title: "Continuous LOX purge of the LP sump FIC-3111 with low-flow alarm", kind: alarm, refs: [FIC-3111], status: proposed, by: agent, notes: "D-010 (2); H-03."}
  - {id: H01-SG-AIA3103, title: "AIA-3103 hydrocarbon (THC, C2H2) alarm in the LP sump LOX", kind: alarm, refs: [AIA-3103], status: proposed, by: agent, notes: "D-010 (4); action limits per EIGA Doc 65 (ASSUMED)."}
  - {id: H01-SG-AIA2102, title: "AIA-2102 CO2 / N2O alarm at the adsorber outlet", kind: alarm, refs: [AIA-2102], status: proposed, by: agent, notes: "Its high-high bed switch / MAC trip is not in control/cause-effect.yaml: credited as an alarm only."}
  - {id: H01-SG-AIA2103, title: "AIA-2103 H2O dew point alarm at the adsorber outlet", kind: alarm, refs: [AIA-2103], status: proposed, by: agent}
  - {id: H01-SG-VIA1104, title: "VIA-1104 vibration and bearing alarm (MAC machine protection; its trip is not credited)", kind: alarm, refs: [VIA-1104], status: proposed, by: agent, notes: "Trip on high-high in the supplier's machine protection, not in the C&E."}
  - {id: H01-SG-UIC1102, title: "UIC-1102 anti-surge control on the blow-off UV-1102", kind: control, refs: [UIC-1102, UV-1102], status: proposed, by: agent}
  - {id: H01-SG-PIC1103, title: "PIC-1103 discharge pressure override on IGV and blow-off", kind: control, refs: [PIC-1103], status: proposed, by: agent}
  - {id: H01-SG-TIA1110, title: "TIA-1110 high temperature alarms on the stage discharges and intercooler outlets", kind: alarm, refs: [TIA-1110], status: proposed, by: agent}
  - {id: H01-SG-TIA1111, title: "TIA-1111 high temperature alarm (50 C) after E-1103", kind: alarm, refs: [TIA-1111], status: proposed, by: agent}
  - {id: H01-SG-TIC1105, title: "TIC-1105 DCAC air outlet temperature high alarm", kind: alarm, refs: [TIC-1105], status: proposed, by: agent}
  - {id: H01-SG-PSV1109, title: "PSV-1109 on AIR-1004 at C-1101 (blocked outlet, fire)", kind: relief, refs: [PSV-1109], status: proposed, by: agent}
  - {id: H01-SG-LIC1106, title: "LIC-1106 DCAC sump high level alarm", kind: alarm, refs: [LIC-1106], status: proposed, by: agent}
  - {id: H01-SG-MIST, title: "DCAC mist eliminator at the C-1101 top", kind: mechanical, refs: [C-1101], status: proposed, by: agent, notes: "D-005; drawn as a mesh pad on P-01."}
  - {id: H01-SG-P1101B, title: "P-1101B auto-start standby", kind: control, refs: [P-1101B], status: proposed, by: agent, notes: "Equipment list (ASSUMED); the start signal is not drawn."}
  - {id: H01-SG-P1102B, title: "P-1102B auto-start standby", kind: control, refs: [P-1102B], status: proposed, by: agent, notes: "Equipment list (ASSUMED); the start signal is not drawn."}
  - {id: H01-SG-I03, title: "I-03: LSLL-1115 closes XV-1115 (tight shut, fail closed)", kind: interlock, interlock: I-03, refs: [LSLL-1115, XV-1115], status: proposed, by: agent, notes: "SIL 1 from the D-083 screening LOPA (ASSUMED), for LOPA confirmation (H01-A8)."}
  - {id: H01-SG-WN1002, title: "Open vent WN-1002 without valve, blind or flame arrester: the C-1102 relief path", kind: mechanical, refs: [WN-1002], status: proposed, by: agent, notes: "D-083 (2): ~26 kPa(g) at the 95.1 t/h blow-by bound against 1 barg (D-090)."}
  - {id: H01-SG-VENTELEV, title: "WN-1002 discharges elevated, with its O2-deficient zone Z-N2-WN1002", kind: mechanical, refs: [WN-1002], status: proposed, by: agent, notes: "D-011, D-071 (4), D-083."}
  - {id: H01-SG-DOWNCOMER, title: "Chimney tray overflow downcomer to the lower section", kind: mechanical, refs: [C-1101], status: proposed, by: agent, notes: "D-076 (2), C-1101 datasheet; the packing supplier designs it."}
  - {id: H01-SG-D012, title: "MAC oil system with demister and oil-free air path", kind: mechanical, refs: [K-1101], status: proposed, by: agent, notes: "D-012."}
