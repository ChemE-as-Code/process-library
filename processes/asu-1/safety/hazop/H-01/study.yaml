            modes: [normal]
            safeguards: [H01-SG-TIA1111, H01-SG-TIC1105, H01-SG-AIA2102, H01-SG-AIA2103]
            actions: []
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: C, basis: "Cold box derime with supply shortfall of days (matrix 3); CW failure once in plant life (C).", evidence: [D-005, D-006], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 9ceafc0344eb4915}}
              residual:
                - {category: asset, severity: "3", likelihood: B, basis: "TIA-1111 TAH 50 C, TIC-1105 high alarm and the AIA-2102 / AIA-2103 breakthrough alarms give independent warnings before solids reach the cold box.", evidence: [TIA-1111, TIC-1105, AIA-2102, AIA-2103], status: proposed, by: agent, band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 96d32a0543b3b03e}}
      - id: H01-N3-D3
        guide_word: as-well-as
        parameter: composition
        description: "Air in the cooling water of E-1103."
        scenarios:
          - id: H01-S10
            cause: "Tube leak in E-1103: the air side (6.02 bara) is above the cooling water (~5 bara)."
            consequence: "Air into CWR-1004 and the CW return: gas pockets, CW pump gas binding and pressure on the CW return beyond the battery limit."
            refs: [E-1103, CWR-1004]
            modes: [normal]
            safeguards: []
            actions: [H01-A22]
            status: proposed
            by: agent
