  - {id: H01-SG-TICA3124, title: "TICA-3124 booster air temperature high alarm after E-3105", kind: alarm, refs: [TICA-3124], status: proposed, by: agent}
  - {id: H01-SG-PIC3110, title: "LP column pressure control PIC-3110 (P-03): split range PV-3110A to C-1102, PV-3110B to S-3101", kind: control, refs: [PIC-3110, PV-3110A, PV-3110B], status: proposed, by: agent, notes: "Studied in H-03 (H03-SG15); credited here only where its own failure is not the cause."}
actions:
  - {id: H01-A1, text: "Carry out the air-intake survey the design basis requires (hydrocarbons, C2H2, CO2, N2O sources around F-1101, prevailing wind) and decide on a continuous intake hydrocarbon / CO2 analyser with alarm at F-1101 and an operating response to an intake plume (with H-03).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A2, text: "Confirm with the filter supplier the F-1101 cartridge collapse rating and its behaviour in coastal fog, salt and hoar frost at -5 C; consider anti-icing (inlet heating) if the rating is not met.", owner: mechanical engineer, status: proposed, by: agent}
  - {id: H01-A3, text: "Declare the LSHH-1106 MAC trip as an interlock in control/cause-effect.yaml and set its SIL by LOPA (the instrument list leaves it to the HAZOP); consider adding to it the stop of P-1101A/B and P-1102A/B and the closing of FV-1108. One update of control/cause-effect.yaml and one LOPA / SIL session answer H01-A3, H01-A8, H02-A1, H02-A2, H03-A2, H03-A3, H04-A01, H04-A02 and H04-A13; this action names the functions of this sheet.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H01-A4, text: "Stop P-1101A/B and P-1102A/B (or close FV-1108 / TV-1105) on a MAC trip, and add a restart permissive on the DCAC sump and chimney-tray levels.", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A5, text: "Protect the DCAC sump against loss of seal: add a low level alarm to LIC-1106 and consider an independent LSLL with a tight-shut valve on CWR-1001 (as I-03 does for the chimney tray); add the air blow-by into the CW return to the relief case list.", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A6, text: "State the fail positions of UV-1102, FV-1108, LV-1106, TV-1105 and LV-1107 on P-01 and in the instrument list (proposed: UV-1102 open, LV-1106 closed) and check each against H01-S12, S13, S16, S17 and S27. One plant-wide fail-position list (P-01 .. P-04) answers H01-A6, H02-A6, H03-A1 and H04-A14; this action names the valves of this sheet.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H01-A7, text: "Add a differential pressure indication with high alarm across the C-1101 packed sections to detect flooding.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H01-A8, text: "Confirm the I-03 SIL by LOPA with the owner's risk criteria: the BPCS initiating frequency, the credit for the open vent WN-1002, the tolerable frequencies of D-083; then write the SRS (trip 13.35 m, 144 s process safety time, response <= 15 s, yearly proof test) and make the LV-1114 trim limit (<= 2 x 34.4 m3/h) a valve-supplier requirement. One update of control/cause-effect.yaml and one LOPA / SIL session answer H01-A3, H01-A8, H02-A1, H02-A2, H03-A2, H03-A3, H04-A01, H04-A02 and H04-A13; this action names the functions of this sheet.", owner: process safety engineer, status: proposed, by: agent}
  - {id: H01-A9, text: "Close the C-1102 blow-by relief case: proposal to accept WN-1002 as the open relief path (D-083) with I-03 limiting the duration; get the C-1102 supplier's confirmation of the top internals at ~153 t/h; make 'no blind, cover or valve on WN-1002' a maintenance rule with a bird / weather screen that cannot block it; H-03 to rate the WN-1001 back-pressure on the LP column. The open vent is not the whole relief case: with WN-1002 blocked C-1102 also depends on PIC-3110 (H01-S43), which H01-A25 answers.", owner: process safety engineer, status: proposed, by: agent}
  - {id: H01-A10, text: "Write the start-up sequence for the precooling: chimney-tray seal established before the MAC loads C-1101; I-03 reset only above the trip level, no bypass while C-1101 is under pressure.", owner: operations, status: proposed, by: agent}
  - {id: H01-A11, text: "Add a C-1102 sump low level alarm and a low-low trip of P-1102A/B, independent of LIC-1107; check the hold-up time of the C-1102 sump against the loss of the 34 m3/h return.", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A12, text: "Add a high level alarm to LIC-1114 and have the packing supplier confirm the overflow downcomer capacity with an allowance for fouling and debris.", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A13, text: "Add a C-1102 high level alarm and an overflow below the WN-1001 inlet nozzle; reduce LV-1107 / CW-1003 to the make-up duty (D-069 open item) so a failed-open valve passes less.", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A14, text: "Define the C-1102 water treatment and blowdown (not drawn on P-01) and a Legionella risk assessment for the open evaporative loop per the local regulation.", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A15, text: "Provide positive isolation of WN-1001 at C-1102 (spectacle blind or removable spool) and a confined-space entry procedure for C-1102 and C-1101 with air purge and O2 measurement. One site procedure for positive isolation and entry into equipment that can hold N2 answers H01-A15, H02-A10, H03-A15 and H04-A18; this action names the equipment of this sheet.", owner: operations, status: proposed, by: agent}
  - {id: H01-A16, text: "Restrict access to the C-1102 top platform during operation (zone Z-N2-WN1002) with signage and personal O2 monitors; consider a fixed O2 detector on the platform.", owner: process safety engineer, status: proposed, by: agent}
  - {id: H01-A17, text: "Provide minimum-flow protection for P-1101A/B and P-1102A/B (minimum-flow line or low-flow trip), or confirm FV-1108 / TV-1105 have a mechanical minimum stop.", owner: mechanical engineer, status: proposed, by: agent}
  - {id: H01-A18, text: "Add discharge block valves to P-1101A/B and P-1102A/B for positive isolation in maintenance.", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A19, text: "Define the winterization of the water lines and pumps on P-01 (low-point drains or tracing) for the -5 C minimum ambient.", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A20, text: "Show the E-1102 / E-1103 separator high level alarms (MAC package, D-065) on P-01 and in the instrument list, and consider a trap bypass for trap maintenance.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H01-A21, text: "Confirm with the MAC supplier that a trip opens UV-1102 to depressurise the discharge, the type of the AIR-1002 non-return valve (damped, fast closing) and the reverse-rotation protection.", owner: mechanical engineer, status: proposed, by: agent}
  - {id: H01-A22, text: "Intercooler tube leaks: specify leak detection for E-1101 / E-1102 (water into air) with the MAC supplier, and tag and draw the CW-side relief for E-1103 (PSV on CW headers, section 4) or confirm the CW return design pressure.", owner: mechanical engineer, status: proposed, by: agent}
  - {id: H01-A23, text: "Have the MAC supplier guarantee the oil-free air path (seal buffer, oil vent location away from F-1101) and define periodic oil-in-air checks after AIR-1002.", owner: mechanical engineer, status: proposed, by: agent}
  - {id: H01-A24, text: "Check that the cooling water to the DCAC cannot carry oil from other users (oil coolers on the shared CW system) and define CW quality monitoring for hydrocarbons.", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A25, text: "Protect C-1102 against the LP column top pressure independently of WN-1002 and PIC-3110: a relief device on C-1102 or WN-1001 set below the 1 barg design, a second open vent, or a C-1102 / WN-1001 high-pressure alarm and trip that closes PV-3110A; add the case (WN-1002 blocked, PIC-3110 failed, H01-S43) to the relief case list in DESIGN.md section 4, with H03-A20.", owner: process safety engineer, status: proposed, by: agent}
