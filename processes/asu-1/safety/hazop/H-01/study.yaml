# HAZOP study H-01: a DRAFT until the team has accepted every entry and a
# human review record covers it (cheme safety hazop check). Schema: cheme schema
# hazop-study; workflow: safety/README.md and the skill hazop-study.
schema: cheme/hazop-study/v1
kind: hazop-study
id: H-01
title: Main air compressor and precooling
scope: >-
  Sheet P-01 (pid/P-01.xml) as drawn: the MAC inlet filter F-1101 and suction duct AIR-1001,
  the main air compressor K-1101 with its intercoolers E-1101, E-1102, aftercooler E-1103, the
  interstage lines AIR-1005/AIR-1006, the anti-surge blow-off AIR-1003 to silencer S-1101 and
  the condensate drains CD-1001/CD-1002; the direct contact aftercooler C-1101 with the cooling
  water pumps P-1101A/B (CW-1001, CWR-1001) and the chilled-water loop: the evaporative cooler
  C-1102, the chilled water pumps P-1102A/B, CHW-1001 and CHWR-1001 (the chimney-tray return
  through LV-1114 and XV-1115, interlock I-03), the make-up CW-1003 and the waste N2 vent
  WN-1002 to atmosphere; the relief PSV-1109 on AIR-1004. Battery limits: cooling water
  supply and return CW-1002/1004/1005 and CWR-1002/1003/1004 (BL, the CW system is not
  studied), the drains to the clean drain hub. Off-page connections: AIR-1004 precooled air
  continues on P-02 to V-2101A/B (H-02); WN-1001 waste N2 comes from WN-3002 on P-03 (H-03);
  CHW-3001 / CHWR-3001 branch to and return from E-3105 on P-03 (studied in H-03 from their
  tee on P-01). Not covered: the MAC package internals beyond the P&ID (lube oil, seal and
  machine protection are the supplier's), the CW and power systems, the area classification
  and noise (separate studies).
modes:
  - {id: normal, title: Normal operation, description: "Design case (D-066 flows), GOX 500 t/d."}
  - {id: startup, title: Start-up, description: "MAC start against the blow-off, loading, precooling in service, cold box cooldown downstream."}
  - {id: shutdown, title: Shutdown and trip, description: "Planned unloading and stop, MAC trip, plant trip."}
  - {id: warmup, title: Warm-up and derime, description: "Air supply to the warm-up and derime of the cold box."}
  - {id: regen-switch, title: TSA switching, description: "Adsorber repressurization and switch-over on P-02, seen by the MAC as a flow and pressure swing."}
  - {id: maintenance, title: Maintenance, description: "Isolation, draining, a pump changed over to its spare, entry to the columns."}
  - {id: power-fail, title: Power failure, description: "Total or partial loss of power, and of instrument air where it follows."}
