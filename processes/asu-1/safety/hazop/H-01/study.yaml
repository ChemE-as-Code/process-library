                - {category: asset, severity: "3", likelihood: D, basis: "MAC trip and possible adsorbent wetting, days of shortfall (matrix 3); a single loop failure (D).", evidence: [FIC-1101, D-090], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 154eb1a2350e4252}}
              residual:
                - {category: asset, severity: "2", likelihood: C, basis: "PIC-1103 override limits the discharge, the DCAC mist eliminator holds droplets; outcome a MAC trip of up to a day on backup (matrix 2).", evidence: [PIC-1103, D-005], status: proposed, by: agent, band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: asu-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 5d4b96d05607d5a4}}
      - id: H01-N3-D2
        guide_word: more
        parameter: temperature
        description: "Air to C-1101 above 40 C."
        scenarios:
          - id: H01-S9
            cause: "Loss or fouling of cooling water to the aftercooler E-1103 (CW-1005)."
            consequence: "Air at up to ~110 C into C-1101: the lower section is overloaded, the air leaves the DCAC above 12 C and wetter, the adsorbers overload with water and CO2 / H2O break through to the cold box (plugging of E-3101, derime)."
