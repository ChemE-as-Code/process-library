# Process Atlas manifest of ASU-1. Schema: schemas/process.schema.json (cheme-as-code/process/v1).
# plant.yaml stays the engineering manifest; sheets, layout and LCA results are derived from the
# ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: asu-1
title: Cryogenic air separation unit (500 t/d GOX)
summary: >-
  Double-column cryogenic air separation without argon column, producing 500 t/d gaseous oxygen
  at 30 barg and 10,000 Nm3/h pipeline nitrogen, with LOX/LIN backup storage.
description: |
  ASU-1 separates atmospheric air in a double-column cold box. The main air compressor and a
  direct-contact aftercooler feed a temperature-swing adsorption front end that removes water,
  CO2 and hydrocarbons. A booster-braked expander provides refrigeration, with Lachmann air to
  the low-pressure column. Products are GOX >= 99.5 mol% O2, compressed to 30 barg for a
  pipeline, and GAN <= 10 ppm O2 at 8 barg. LOX and LIN tanks with cryogenic pumps and
  ambient-air vaporizers back up both pipelines. There is no argon column; argon leaves with
  the waste nitrogen.

  All flows, pressures and duties are concept estimates (about +/-30 %); see the design basis
  and DESIGN.md in the engineering files for every assumption.
families: [air-separation, industrial-gases, cryogenic-separation]
keywords: [ASU, GOX, GAN, LOX, LIN, double column, cold box, TSA, oxygen, nitrogen, cryogenic]
facets:
  feedstock_basis: [atmospheric, electricity]
  product_classes: [industrial-gases]
  unit_operations: [compression, adsorption, cryogenic-distillation, heat-exchange, expansion]
  region: generic
# D-097, D-099: what the calculation evidence supports. The owner fixed the design air (30 C,
# 1.013 bara, 80 % RH, 420 ppm CO2, standard dry air) and the design air rate as the design
# specification (D-099), so the S1 air feed is given with a source and cheme maturity reaches
# balanced, which supports screening. basic-engineering needs the engineering level, which
# needs predictive: coverage (C1102), the TSA model basis (V2101), the plant energy closure and
# the property regime (unsupported in core today) all block it.
maturity: screening
validation:
  status: unreviewed
  notes: >-
    The deliverables of basic engineering exist (P&IDs, lists, datasheets, layout, estimate, LCA,
    HAZOP draft) and the engineering gates of stage basic pass (ChemE-as-Code checks). The
    calculation evidence reaches balanced, which supports screening (cheme maturity,
    checks/maturity.json): the air feed is the owner's design specification (D-099), the
    balances close, and the whole plant but the evaporative cooler is simulated in DWSIM.
    Predictive is not reached: the evaporative cooler is not simulated, the TSA is a specified
    component split, and the plant energy closure and property regime are unsupported (D-097).
    Design reviews are recorded in reviews/; no independent engineering review has been made.
chemistry:
  inputs:
    - {chemical: air, role: feedstock, inventory_key: "feed:AIR", note: "85,810 Nm3/h dry CO2-free air, 85,840 Nm3/h with the CO2 (D-066), at 30 C, 1.013 bara and 80 % RH (D-058); the owner's design specification (D-099)"}
  outputs:
    - {chemical: oxygen, role: main-product, inventory_key: "product:GOXP", note: "GOX >= 99.5 mol% O2 at 30 barg"}
    - {chemical: nitrogen, role: co-product, inventory_key: "product:GANP", note: "GAN <= 10 ppm O2 at 8 barg"}
    - {chemical: oxygen, role: co-product, inventory_key: "product:LOX", note: "LOX to backup storage"}
    - {chemical: nitrogen, role: co-product, inventory_key: "product:LIN", note: "LIN to backup storage"}
    - {chemical: argon, role: emission, inventory_key: "emission:AR", note: "Not recovered: leaves with the waste nitrogen vent"}
    - {chemical: nitrogen, role: emission, inventory_key: "emission:N2", note: "Waste nitrogen vent after TSA regeneration and evaporative cooling"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "6.6 kV; MAC, GOX and GAN compressors, electric regeneration heater"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "25/35 C, heat rejected"}
basis:
  capacity: "500 t/d GOX (14,600 Nm3/h) and 10,000 Nm3/h GAN; LOX and LIN 600 kg/h each"
  operating_hours_per_year: 8400
  location: Assumed coastal industrial site
lca:
  source: auto
  notes: Screening-level cradle-to-gate carbon footprint; the characterisation factors are placeholders.
maintainers:
  - {name: Artur Schweidtmann}
repository:
  url: https://github.com/ChemE-as-Code/process-library
  path: processes/asu-1
  access: private
publication:
  status: public
