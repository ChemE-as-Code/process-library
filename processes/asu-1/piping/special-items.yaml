     notes: "MAC anti-surge blow-off silencer (UV-1102), outside the MAC house east wall, outlet elevated. Air: no zone. ASSUMED 1.6 m x 6 m."}
  - {tag: S-2101, type: Silencer, line: RG-2003, sheet: P-02,
     notes: "TSA regeneration gas / depressurization vent silencer at the adsorbers (waste N2: O2-deficient zone Z-N2-VENTS)."}
