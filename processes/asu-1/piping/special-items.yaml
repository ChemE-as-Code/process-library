     notes: "Waste N2 start-up / C-1102 bypass vent silencer (PV-3110B), DN900, rated for up to 58 t/h intermittent (D-067, D-071 (3)); in the vent area V1, outlet elevated (O2-deficient zone Z-N2-V1, D-011, D-071 (4)). ASSUMED 2.0 m x 8 m (the supplier sizes it for the larger flow)."}
  - {tag: S-4101, type: Silencer, line: VNT-4002, sheet: P-04,
     notes: "GOX compressor blowdown silencer (XV-4116), in the vent area V1 (O2-enriched zone, D-013, D-019). ASSUMED 1.0 m x 5 m."}
