# Special piping items. Schema: `cheme schema piping_items`.
# Relief devices and silencers drawn on the P&IDs, with their governing case from DESIGN.md
# section 4 (relief case list, ASSUMED cases, sizing in detail engineering). The silencers are
# placed in the 3D layout (layout/equipment-placement.yaml) so their vent lines are routed to
# where they discharge (D-025, D-029); relief valves sit on their line at the item they protect.
piping_items:
