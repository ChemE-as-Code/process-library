# Operators of the valves and transmitters that stay out of reach from a floor (D-040). The
# criteria (ASSUMED, the owner's standard and the valve and instrument suppliers confirm them):
# a chain wheel only on a handwheel valve in infrequent use (isolation for maintenance or a
# spare-pump changeover, never control or emergency duty) with the handwheel at most 6 m above
# a floor; an extension spindle (gear operator and spindle to a pedestal at a floor, at most
# 6 m) on a lever valve in infrequent use; an actuated valve (control or on/off, operated from
# the DCS / SIS) whose local air set, override and positioner are brought to a pedestal at a
# floor within 6 m counts as remote_operator; a transmitter is mounted on a stand at a floor on
# impulse lines up to 6 m (capillary seals up to 10 m where the impulse run is longer). Valves
# used at every tanker load or in normal operation are within reach (moved on their routes).
