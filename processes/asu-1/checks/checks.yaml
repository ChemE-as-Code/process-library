# Engineering-step gates. Schema: `cheme schema checks`. Run: `cheme check`.
checks:
  - id: design-basis
    title: Design basis exists
    stage: concept
    kind: files
    files: [process/design-basis.yaml]
  - id: concept-lists
    title: Equipment, line and instrument lists and design decisions exist
    stage: concept
    kind: files
    files: [DESIGN.md, equipment/equipment-list.yaml, piping/line-list.yaml, control/instrument-list.yaml]
  - id: assumptions-marked
    title: Assumed values are marked ASSUMED in the design basis
    stage: concept
    kind: command
    command: grep -q ASSUMED process/design-basis.yaml
  # Process links (blocks, steps, streams -> equipment, lines, instruments, sheets): reported at
  # concept, required at basic. Calculated stream properties must be current at basic.
  - id: process-links-concept
    title: Process links resolve (reported only)
    stage: concept
    kind: process-links
    level: warning
  - id: process-links
    title: Every process link resolves against the lists and sheets
    stage: basic
    kind: process-links
    level: error
  # Mass balances clean and the generated sheets current. Not-evaluable balances (component
  # balances of the air side and waste streams without a composition; the cold-box internals
  # without flows) stay info: see reviews/2026-10-19-process-bfd-pfd.md.
  - id: process-balances
    title: No block or step mass balance error; BFD and PFD current
    stage: concept
    kind: validate
    generated: [bfd, pfd]           # fails until both sheets are declared and built
    fail_on: warning
    rules: [cheme.process-balance, cheme.process-schema, cheme.generated-*]
  - id: process-calculated-current
    title: No stale calculated stream property
    stage: basic
    kind: validate
    fail_on: warning
    rules: [cheme.process-calculated-stale]
  # The 3D layout (layout/, skills layout-yaml, pipe-routing, structures-access,
  # area-classification, review). A kind: layout-model gate checks the layout files and the
  # generated layout/plant-model.yaml against each item of require (`cheme schema checks`).
  - id: layout-plot-plan
    title: Plot plan - site, areas, roads, racks, every item placed, separations declared
    stage: concept
    kind: layout-model
    require: [site, areas, roads, racks, placed, separations]
  - id: layout-3d
    title: 3D model current, nozzles resolved, elevated items mounted, process lines routed or skipped, no clashes, zones declared, plan and sections reviewed
    stage: basic
    kind: layout-model
    require: [model-current, nozzles, mounted, routed, clashes, zones, drawings]
    min_dn: 25                      # smaller lines are field-run at basic engineering
    # utilities are routed at detail engineering (gate layout-detail)
    exclude_fluids: [Cooling water, Cooling water return, Chilled water, Instrument air,
                     Plant air, Utility nitrogen, Steam, Condensate]
    sections: 2                     # the layout review cites the plot plan and two sections
  # The lifting study (cheme layout lifting, skill structures-access): every heavy item
  # (5 t or more, ASSUMED) has its crane, a clear lane and a laydown; with crane load charts in
  # layout/crane-chart.yaml, a chart that carries each lift. The study is written and current.
  - id: lifting-study
    title: Lifting study - every heavy item has a crane, a clear lane and a laydown
    stage: basic
    kind: layout-model
    require: [model-current, lifting, lifting-current]
  # The material take-off of the 3D model and the equipment estimate from the published
  # correlations (estimate/, skill mto-estimate): both rewritten after the last change of the
  # model, the lists or the datasheets (D-043). The ASU's bulk rates are still the example
  # (D-035): add rates and estimate-current once a cost engineer prices the plant, and
  # equipment-covered once every item has a size or a quotation.
  - id: mto
    title: Material take-off and equipment estimate current
    stage: basic
    kind: mto
    require: [mto-current, equipment-current]
  # The LCA of the operation (lca/): every flow mapped, the outputs current with the flowsheet.
  # The factors are still the example: add factors once the project's replace them.
  - id: lca
    title: LCA mapped and current with the flowsheet
    stage: basic
    kind: lca
    require: [mapped, lca-current]
  # ASU: the engineering rules on the routes that the layout reviews found violated (vent
  # outlets in zones over walking levels, pipes through walls and fire walls outside their
  # openings, lines off their rack tier, escape and equipment spacing; D-033; landing widths of
  # stacked stairs and ways off a roof inside a vent zone, review5#6, #7, D-039; pipes at
  # ladders and risers through ring platform walkways, review6#1..#5, D-044)
  - id: layout-rules
    title: "Vent outlets clear of walking levels, wall penetrations declared, lines on their tiers, escape, landings and spacing kept"
    stage: basic
    kind: validate
    fail_on: warning
    rules: [cheme.layout-vent-outlet, cheme.layout-wall-penetration, cheme.layout-tier,
            cheme.layout-escape-*, cheme.layout-spacing, cheme.layout-zone-crossing,
            cheme.layout-landing-width, cheme.layout-egress-zone, cheme.layout-zone-source,
            cheme.layout-ladder-clearance, cheme.layout-walkway-riser]
  - id: layout-review
    title: A current, independent layout review is recorded
    stage: basic
    kind: review
    topic: layout
    require_kind: [human, agent]
  - id: layout-detail
    title: Every line routed, including utilities and small bore, no clashes
    stage: detail
    kind: layout-model
    require: [model-current, nozzles, mounted, routed, clashes]
    min_dn: 0
  # ---- ASU-specific gates
  - id: o2-safety-philosophy
    title: "O2 service: materials/cleaning and no-oil decisions recorded"
    stage: concept
    kind: command
    command: grep -q '^## D-.*Oxygen service' DESIGN.md && grep -q '^## D-.*oil' DESIGN.md
  - id: hydrocarbon-protection
    title: "Hydrocarbon accumulation protection: decision, sump analyzer and LOX purge loop"
    stage: concept
    kind: command
    command: "grep -q '^## D-.*Hydrocarbon' DESIGN.md && grep -q 'tag: AIA-3103,' control/instrument-list.yaml && grep -q 'tag: FIC-3111,' control/instrument-list.yaml && grep -q 'tag: AIA-4121,' control/instrument-list.yaml"
  - id: relief-philosophy
    title: Relief, vent and blowdown philosophy recorded
    stage: concept
    kind: command
    command: grep -q '^## D-.*Relief' DESIGN.md && grep -q '^## D-.*Isolation' DESIGN.md
  - id: relief-case-list
    title: "Relief case list: each relief device with its governing case, LP column PSV included"
    stage: concept
    kind: command
    command: "grep -q '^## 4 Relief case list' DESIGN.md && grep -q 'PSV-3114' DESIGN.md"
  - id: o2-safety-review
    title: Oxygen safety review (EIGA Doc 13/33/65 checklist) recorded
    stage: basic
    kind: files
    files: ["reviews/2*o2-safety*.md"]
  - id: hydrocarbon-on-pid
    title: Sump hydrocarbon analyzer and LOX purge drawn on the cold box sheet
    stage: basic
    kind: command
    command: grep -q 'AIA' pid/P-03.xml && grep -q '3111' pid/P-03.xml
  - id: relief-on-pid
    title: Relief devices drawn on the cold box and product sheets
    stage: basic
    kind: command
    command: grep -q 'SafetyValve' pid/P-01.xml && grep -q 'SafetyValve' pid/P-03.xml && grep -q 'SafetyValve' pid/P-04.xml
  - id: pids-valid
    title: Every P&ID and list validates
    stage: basic
    kind: validate
  - id: pids-exist
    title: At least one P&ID sheet
    stage: basic
    kind: files
    files: ["pid/*.xml"]
  - id: design-review
    title: A design review is recorded
    stage: basic
    kind: files
    files: ["reviews/2*.md"]  # dated review records, not the README
  - id: process-concept
    title: Materials and flowsheet exist (the BFD is generated by cheme process build)
    stage: concept
    kind: files
    files: [process/materials.yaml, process/flowsheet.yaml]
  - id: process-basic
    title: PFD generated for the design case, process rules clean, no stale calculated values
    stage: basic
    kind: validate
    generated: [pfd]                # fails until plant.yaml declares a kind: pfd sheet, built
    fail_on: info
    rules: [cheme.process-refine-pending, cheme.process-balance*,
            cheme.process-component-balance*, cheme.process-calculated-stale,
            cheme.generated-*]
  - id: drawing-clean
    title: No line through a label, crossing, overlapping or misplaced label left unaccepted
    stage: basic
    kind: validate
    fail_on: warning
    rules: [cheme.line-through-label, cheme.line-crossing, cheme.label-overlap,
            cheme.label-far-from-owner]
    accept:
      - id: "pid/P-03.xml#line-crossing:Line_GOX3001_S1_P1+Line_LOX3001_S1_P1"
        reason: "GOX leaves C-3102 at N6 above the LOX sump draw N7 (vapour over liquid, D-023) and must reach the cold end of E-3101 at the bottom, while LOX runs left to its connector beside E-3101; the only gap round the LOX end is blocked by the VNT-3004 and UN-3001 connectors and a route over the top cuts the AIA-3103 and KT-3101 instruments"
      - id: "pid/P-03.xml#line-crossing:Line_AIR3005_S1_P1+Inst_UIC3120"
        reason: "UIC-3120 measures on AIR-3005 below the AIR-3006 tee and acts on UV-3120 on AIR-3006, which sits in the pocket closed by AIR-2002, AIR-3005, AIR-3006 and AIR-3002; every signal path from the measuring point to the actuator crosses one pipe"
      - id: "pid/P-01.xml#line-crossing:Line_CHW1001_S6_P3+Line_CHWR1001_S1_P2"
        reason: "CHWR-1001 leaves the C-1101 chimney tray on the right, inside the pocket closed by C-1101, CHW-1001 (to the upper section), P-1102A/B and C-1102, and must reach the C-1102 top; above it the TIC-1105 measuring line and AIR-1004 close the pocket too, so every path out crosses one line (D-069)"
      - id: "pid/P-03.xml#line-crossing:Line_LN3001_S1_P1+Inst_LIC3101"
        reason: "LIC-3101 measures the C-3101 sump level inside the pocket bounded by C-3101, LN-3001, RL-3001 and E-3102 and acts on LV-3101 on RL-3001 above E-3102; any signal path out of the pocket crosses one pipe, and moving the tapping would no longer show a sump level"
      - id: "pid/P-04.xml#line-crossing:Line_GOX4003_S1_P2+Inst_UIC4103_ML"
        reason: "GOX-4001 and the GOX-4003 anti-surge recycle form a closed pipe loop around K-4101; UIC-4103 measures at K-4101 nozzle I2 inside the loop and drives UV-4103 on the recycle outside it, so its measuring line must cross the loop once (it does exactly once); the space inside the loop is taken by E-4101 and the E-4102 CW/CWR connectors"
  # Cables and trays (electrical/, skill electrical-cabling): every motor and instrument has a
  # cable routed in trays, no tray over its fill, power and instrument trays apart.
  - id: electrical
    title: A cable to every motor and instrument, routed in trays, fill and separation kept
    stage: detail
    kind: layout-model
    require: [model-current, cables, trays]
  # Ventilation (layout/hvac.yaml, skill hvac-ducts): every clad building ventilated, ducts
  # routed inside it within their velocity limits, units and louvres large enough.
  - id: hvac
    title: Clad buildings ventilated, ducts routed within their velocity limits
    stage: detail
    kind: layout-model
    require: [model-current, hvac]
  - id: datasheets
    title: A datasheet for every equipment-list item
    stage: detail
    kind: datasheets               # equipment/datasheets/<TAG>.yaml, see its README
  # Prefer on-sheet over grep for what a P&ID must show: it finds printed tags in the model.
  # - id: relief-on-pid
  #   title: Relief devices drawn and connected
  #   stage: basic
  #   kind: on-sheet
  #   sheets: [P-01]            # or sheet: P-01; omitted: any sheet
  #   tags: [PSV-101]           # equipment, instrument (PICSA-101), valve or line tags
  #   classes: [SafetyValve]    # at least min_count (1) of each class
  #   connected: true           # piped, on a segment, with a measuring/signal line

# Findings accepted for every gate and for `cheme validate`, which then reports them as info
# with the reason (an entry that names no finding is reported as cheme.accept-unused).
# Only warnings and infos can be accepted; an error stays an error (cheme.accept-error).
accept:
  - id: "equipment/equipment-list.yaml#layout-not-placed:E-3103"
    reason: "E-3103 is the bath condenser-reboiler inside the C-3102 sump, an internal of the stacked double column with no placement of its own; its GAN-3002 / LN-3002 connections are internal and skipped in piping/routing.yaml (DESIGN.md D-028)"
  - id: "layout/plant-model.yaml#layout-tray-separation:PT-PR1-5+IT-PR2-1"
    reason: "the PR2 instrument tray passes 0.27 m under the PR1 power tray at right angles where PR2 joins PR1 (trays 10.5 / 11.0 m); a steel cover plate on the instrument tray over the crossing separates them (D-036)"
  - id: "layout/plant-model.yaml#layout-access-enclosed:CB-1/E20"
    reason: "E20 is the support deck of the subcooler E-3102 inside the perlite-filled casing, steel only: nobody walks on it in operation (it is no access level, no way down is declared from it); its valves LV-3101 / FV-3106 are worked through hatch H1 from P20 outside (D-038 (1), (3))"
  - id: "layout/plant-model.yaml#layout-tray-zone:PT-M-P-4101?+Z-O2-SEALS"
    reason: "the LOX pump motor cables must reach the motors inside the pumps' own seal zone (secondary grade, cold standby pumps with N2-buffered seals, D-012): last 3 m of tray in stainless steel, halogen-free armoured cable with a non-combustible outer sheath, metal glands, no PVC or grease in the zone (D-036, D-038 (4))"
  - id: "layout/plant-model.yaml#layout-tray-span:PT-MCC-1"
    reason: "6.6 m run inside B2 from the MCC / switchgear to the room exit: hung from the B2 roof steel on drop rods at 1.5 m (the building's cable support detail, ASSUMED); B2 roof steel is not modelled (D-036, D-039 (7), review5#8)"
  - id: "layout/plant-model.yaml#layout-tray-span:PT-SWG-1"
    reason: "8.5 m run inside B2 from the MCC / switchgear to the room exit: hung from the B2 roof steel on drop rods at 1.5 m (the building's cable support detail, ASSUMED); B2 roof steel is not modelled (D-036, D-039 (7), review5#8)"
  - id: "layout/plant-model.yaml#layout-tray-span:PT-M-P-1101A"
    reason: "6.9 m motor / heater branch tray off the rack: 2 cable-ladder posts at grade at no more than 3 m spacing (ASSUMED, the electrical standard detail); the posts are not modelled (D-036, D-039 (7), review5#8)"
  - id: "layout/plant-model.yaml#layout-tray-span:PT-M-P-1101B"
    reason: "6.6 m motor / heater branch tray off the rack: 2 cable-ladder posts at grade at no more than 3 m spacing (ASSUMED, the electrical standard detail); the posts are not modelled (D-036, D-039 (7), review5#8)"
  - id: "layout/plant-model.yaml#layout-tray-span:PT-M-P-1102A"
    reason: "6.6 m motor / heater branch tray off the rack: 2 cable-ladder posts at grade at no more than 3 m spacing (ASSUMED, the electrical standard detail); the posts are not modelled (D-036, D-039 (7), review5#8)"
  - id: "layout/plant-model.yaml#layout-tray-span:PT-M-P-1102B"
    reason: "6.1 m motor / heater branch tray off the rack: 2 cable-ladder posts at grade at no more than 3 m spacing (ASSUMED, the electrical standard detail); the posts are not modelled (D-036, D-039 (7), review5#8)"
  - id: "layout/plant-model.yaml#layout-tray-span:PT-M-P-4101A"
    reason: "19.8 m motor / heater branch tray off the rack: 6 cable-ladder posts at grade at no more than 3 m spacing (ASSUMED, the electrical standard detail); the posts are not modelled (D-036, D-039 (7), review5#8)"
  - id: "layout/plant-model.yaml#layout-tray-span:PT-M-P-4101B"
    reason: "13.85 m motor / heater branch tray off the rack: 4 cable-ladder posts at grade at no more than 3 m spacing (ASSUMED, the electrical standard detail); the posts are not modelled (D-036, D-039 (7), review5#8)"
  - id: "layout/plant-model.yaml#layout-tray-span:PT-M-P-4102B"
    reason: "9.7 m motor / heater branch tray off the rack (at 11.5 m from x 142.3 since the PR2 bents moved, D-051 (3)): 3 cable-ladder posts at grade at no more than 3 m spacing (ASSUMED, the electrical standard detail); the posts are not modelled (D-036, D-039 (7), review5#8)"
  - id: "layout/plant-model.yaml#layout-tray-span:PT-E-2101"
    reason: "6.6 m motor / heater branch tray off the rack: 2 cable-ladder posts at grade at no more than 3 m spacing (ASSUMED, the electrical standard detail); the posts are not modelled (D-036, D-039 (7), review5#8)"
  - id: "layout/plant-model.yaml#layout-tray-span:IT-JB-A1-1"
    reason: "13.75 m instrument branch tray from the rack to its junction box: 4 cable-ladder posts at grade at no more than 3 m spacing (ASSUMED, the electrical standard detail); the posts are not modelled (D-036, D-039 (7), review5#8)"
  - id: "layout/plant-model.yaml#layout-tray-span:IT-JB-A2-1"
    reason: "30.8 m instrument branch tray from the rack to its junction box: 10 cable-ladder posts at grade at no more than 3 m spacing (ASSUMED, the electrical standard detail); the posts are not modelled (D-036, D-039 (7), review5#8)"
  - id: "layout/plant-model.yaml#layout-tray-span:IT-JB-A2-2"
    reason: "6.1 m instrument branch tray from the rack to its junction box: 2 cable-ladder posts at grade at no more than 3 m spacing (ASSUMED, the electrical standard detail); the posts are not modelled (D-036, D-039 (7), review5#8)"
  - id: "layout/plant-model.yaml#layout-tray-span:IT-JB-A3-1"
    reason: "16.0 m instrument branch tray from the rack to its junction box: 5 cable-ladder posts at grade at no more than 3 m spacing (ASSUMED, the electrical standard detail); the posts are not modelled (D-036, D-039 (7), review5#8)"
  - id: "layout/plant-model.yaml#layout-tray-span:IT-JB-A4-1"
    reason: "8.1 m instrument branch tray from the rack to its junction box: 2 cable-ladder posts at grade at no more than 3 m spacing (ASSUMED, the electrical standard detail); the posts are not modelled (D-036, D-039 (7), review5#8)"
  - id: "layout/plant-model.yaml#layout-tray-span:IT-JB-A5-1"
    reason: "7.7 m instrument branch tray from the rack to its junction box: 2 cable-ladder posts at grade at no more than 3 m spacing (ASSUMED, the electrical standard detail); the posts are not modelled (D-036, D-039 (7), review5#8)"
  - id: "layout/plant-model.yaml#layout-tray-span:PT-K-4102-M"
    reason: "6.2 m motor branch tray from the PR1 south edge to the drop north of K-4102 (D-041): 2 cable-ladder posts at no more than 3 m spacing (ASSUMED, the electrical standard detail); the posts are not modelled (D-036, D-039 (7))"
  # pipe runs inside the perlite-filled cold box casing CB-1: supported from the columns'
  # and the casing's internal steel, which the cold box vendor designs with the internals;
  # no support steel of the plant stands in the casing (D-026, D-049)
  - id: "layout/plant-model.yaml#layout-support-missing:P-03/Line_AIR3002_S4"
    reason: "10.5 m level run of the booster discharge at 9 m inside the cold box casing (y 37 .. 44.4): supported from the casing's internal steel by the cold box vendor (D-049)"
  - id: "layout/plant-model.yaml#layout-support-missing:P-03/Line_GAN3001_S1"
    reason: "8.4 m of cold box internal piping inside the casing: supported from the column and casing internal steel by the cold box vendor (D-039 (9), D-049)"
  - id: "layout/plant-model.yaml#layout-support-missing:P-03/Line_LN3001_S1"
    reason: "8.0 m of cold box internal piping inside the casing: supported from the column and casing internal steel by the cold box vendor (D-049)"
  - id: "layout/plant-model.yaml#layout-support-missing:P-03/Line_LN3001_S3"
    reason: "11.4 m of cold box internal piping inside the casing: supported from the column and casing internal steel by the cold box vendor (D-049)"
  - id: "layout/plant-model.yaml#layout-support-missing:P-03/Line_RL3001_S1"
    reason: "8.2 m of cold box internal piping inside the casing: supported from the column and casing internal steel by the cold box vendor (D-039 (9), D-049)"
  - id: "layout/plant-model.yaml#layout-support-missing:P-03/Line_RL3001_S2"
    reason: "10.8 m of cold box internal piping inside the casing (to the hatch H1): supported from the column and casing internal steel by the cold box vendor (D-038 (3), D-049)"
  - id: "layout/plant-model.yaml#layout-support-missing:P-03/Line_WN3001_S2"
    reason: "17.3 m of waste N2 piping at 3.9 m inside the casing: supported from the casing's internal steel by the cold box vendor (D-049)"
  - id: "layout/plant-model.yaml#layout-support-missing:P-03/Line_WN3002_S1"
    reason: "20.0 m waste N2 run at 5.5 m, inside the casing up to its north sleeve and 7.6 m outside to its tee (within the 12.8 m span of DN 900): the inside part supported from the casing's internal steel by the cold box vendor (D-049)"
  # pump suctions at 0.5 m: on concrete sleepers at grade, below the 0.3 m top of steel from
  # which the build proposes posts (D-049)
  - id: "layout/plant-model.yaml#layout-support-missing:P-04/Line_LOX4001_S1"
    reason: "4.8 m LOX pump suction from T-4101 at 0.5 m: one concrete sleeper at grade mid-run (ASSUMED, the piping support standard); sleepers are not modelled (D-049)"
  - id: "layout/plant-model.yaml#layout-support-missing:P-04/Line_LIN4001_S1"
    reason: "5.3 m LIN pump suction from T-4102 at 0.5 m: one concrete sleeper at grade mid-run (ASSUMED, the piping support standard); sleepers are not modelled (D-049)"
