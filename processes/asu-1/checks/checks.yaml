# Engineering-step gates. Schema: `cheme schema checks`. Run: `cheme check`.
checks:
  - id: design-basis
    title: Design basis exists
    stage: concept
    kind: files
    files: [process/design-basis.yaml]
  - id: concept-lists
    title: Equipment, line and instrument lists and design decisions exist
    stage: concept
    kind: files
    files: [DESIGN.md, equipment/equipment-list.yaml, piping/line-list.yaml, control/instrument-list.yaml]
  - id: assumptions-marked
    title: Assumed values are marked ASSUMED in the design basis
    stage: concept
    kind: command
    command: grep -q ASSUMED process/design-basis.yaml
  # Process links (blocks, steps, streams -> equipment, lines, instruments, sheets): reported at
  # concept, required at basic. Calculated stream properties must be current at basic.
  - id: process-links-concept
    title: Process links resolve (reported only)
    stage: concept
    kind: process-links
    level: warning
  - id: process-links
    title: Every process link resolves against the lists and sheets
    stage: basic
    kind: process-links
    level: error
  # Mass balances clean and the generated sheets current. Not-evaluable balances (component
  # balances of the air side and waste streams without a composition; the cold-box internals
  # without flows) stay info: see reviews/2026-10-19-process-bfd-pfd.md.
  - id: process-balances
    title: No block or step mass balance error; BFD and PFD current
    stage: concept
    kind: validate
    generated: [bfd, pfd]           # fails until both sheets are declared and built
    fail_on: warning
    rules: [cheme.process-balance, cheme.process-schema, cheme.generated-*]
  - id: process-calculated-current
    title: No stale calculated stream property
    stage: basic
    kind: validate
    fail_on: warning
    rules: [cheme.process-calculated-stale]
  # The 3D layout (layout/, skills layout-yaml, pipe-routing, structures-access,
  # area-classification, review). A kind: layout-model gate checks the layout files and the
  # generated layout/plant-model.yaml against each item of require (`cheme schema checks`).
  - id: layout-plot-plan
    title: Plot plan - site, areas, roads, racks, every item placed, separations declared
    stage: concept
    kind: layout-model
    require: [site, areas, roads, racks, placed, separations]
  - id: layout-3d
    title: 3D model current, nozzles resolved, elevated items mounted, process lines routed or skipped, no clashes, zones declared, plan and sections reviewed
    stage: basic
    kind: layout-model
    require: [model-current, nozzles, mounted, routed, clashes, zones, drawings]
    min_dn: 25                      # smaller lines are field-run at basic engineering
    # utilities are routed at detail engineering (gate layout-detail)
    exclude_fluids: [Cooling water, Cooling water return, Chilled water, Instrument air,
                     Plant air, Utility nitrogen, Steam, Condensate]
    sections: 2                     # the layout review cites the plot plan and two sections
  # The lifting study (cheme layout lifting, skill structures-access): every heavy item
  # (5 t or more, ASSUMED) has its crane, a clear lane and a laydown; with crane load charts in
  # layout/crane-chart.yaml, a chart that carries each lift. The study is written and current.
  - id: lifting-study
    title: Lifting study - every heavy item has a crane, a clear lane and a laydown
    stage: basic
    kind: layout-model
    require: [model-current, lifting, lifting-current]
  # The material take-off of the 3D model and the equipment estimate from the published
  # correlations (estimate/, skill mto-estimate): both rewritten after the last change of the
  # model, the lists or the datasheets (D-043). The ASU's bulk rates are still the example
  # (D-035): add rates and estimate-current once a cost engineer prices the plant, and
  # equipment-covered once every item has a size or a quotation.
  - id: mto
    title: Material take-off and equipment estimate current
    stage: basic
    kind: mto
    require: [mto-current, equipment-current]
  # The LCA of the operation (lca/): every flow mapped, the outputs current with the flowsheet.
  # The factors are still the example: add factors once the project's replace them.
  - id: lca
    title: LCA mapped and current with the flowsheet
    stage: basic
    kind: lca
    require: [mapped, lca-current]
  # ASU: the engineering rules on the routes that the layout reviews found violated (vent
  # outlets in zones over walking levels, pipes through walls and fire walls outside their
  # openings, lines off their rack tier, escape and equipment spacing; D-033; landing widths of
  # stacked stairs and ways off a roof inside a vent zone, review5#6, #7, D-039; pipes at
  # ladders and risers through ring platform walkways, review6#1..#5, D-044)
  - id: layout-rules
    title: "Vent outlets clear of walking levels, wall penetrations declared, lines on their tiers, escape, landings and spacing kept"
    stage: basic
    kind: validate
    fail_on: warning
    rules: [cheme.layout-vent-outlet, cheme.layout-wall-penetration, cheme.layout-tier,
            cheme.layout-escape-*, cheme.layout-spacing, cheme.layout-zone-crossing,
            cheme.layout-landing-width, cheme.layout-egress-zone, cheme.layout-zone-source,
            cheme.layout-ladder-clearance, cheme.layout-walkway-riser]
  - id: layout-review
    title: A current, independent layout review is recorded
    stage: basic
    kind: review
    topic: layout
    require_kind: [human, agent]
  - id: layout-detail
    title: Every line routed, including utilities and small bore, no clashes
    stage: detail
    kind: layout-model
    require: [model-current, nozzles, mounted, routed, clashes]
    min_dn: 0
  # ---- ASU-specific gates
  - id: o2-safety-philosophy
    title: "O2 service: materials/cleaning and no-oil decisions recorded"
    stage: concept
    kind: command
    command: grep -q '^## D-.*Oxygen service' DESIGN.md && grep -q '^## D-.*oil' DESIGN.md
  - id: hydrocarbon-protection
    title: "Hydrocarbon accumulation protection: decision, sump analyzer and LOX purge loop"
    stage: concept
    kind: command
    command: "grep -q '^## D-.*Hydrocarbon' DESIGN.md && grep -q 'tag: AIA-3103,' control/instrument-list.yaml && grep -q 'tag: FIC-3111,' control/instrument-list.yaml && grep -q 'tag: AIA-4121,' control/instrument-list.yaml"
  - id: relief-philosophy
    title: Relief, vent and blowdown philosophy recorded
    stage: concept
    kind: command
    command: grep -q '^## D-.*Relief' DESIGN.md && grep -q '^## D-.*Isolation' DESIGN.md
  - id: relief-case-list
    title: "Relief case list: each relief device with its governing case, LP column PSV included"
    stage: concept
    kind: command
    command: "grep -q '^## 4 Relief case list' DESIGN.md && grep -q 'PSV-3114' DESIGN.md"
  - id: o2-safety-review
    title: Oxygen safety review (EIGA Doc 13/33/65 checklist) recorded
    stage: basic
    kind: files
    files: ["reviews/2*o2-safety*.md"]
  - id: hydrocarbon-on-pid
    title: Sump hydrocarbon analyzer and LOX purge drawn on the cold box sheet
    stage: basic
    kind: command
    command: grep -q 'AIA' pid/P-03.xml && grep -q '3111' pid/P-03.xml
  - id: relief-on-pid
    title: Relief devices drawn on the cold box and product sheets
    stage: basic
    kind: command
    command: grep -q 'SafetyValve' pid/P-01.xml && grep -q 'SafetyValve' pid/P-03.xml && grep -q 'SafetyValve' pid/P-04.xml
  - id: pids-valid
    title: Every P&ID and list validates
    stage: basic
    kind: validate
  - id: pids-exist
    title: At least one P&ID sheet
    stage: basic
    kind: files
    files: ["pid/*.xml"]
  - id: design-review
    title: A design review is recorded
    stage: basic
    kind: files
    files: ["reviews/2*.md"]  # dated review records, not the README
  # Open items (plant.yaml issues): every action, hold, TQ and design change due before a gate
  # is closed out before it is signed off; without a GitHub token "not evaluated", never passed.
  - id: issues-concept
    title: No open item to close before the concept gate
    stage: concept
    kind: issues
  - id: issues-basic
    title: No open item to close before the basic engineering gate
    stage: basic
    kind: issues
  - id: issues-detail
    title: No open item to close before the detail engineering gate
    stage: detail
    kind: issues
  - id: process-concept
    title: Materials and flowsheet exist (the BFD is generated by cheme process build)
    stage: concept
    kind: files
    files: [process/materials.yaml, process/flowsheet.yaml]
  - id: process-basic
    title: PFD generated for the design case, process rules clean, no stale calculated values
    stage: basic
    kind: validate
    generated: [pfd]                # fails until plant.yaml declares a kind: pfd sheet, built
    fail_on: info
    rules: [cheme.process-refine-pending, cheme.process-balance*,
            cheme.process-component-balance*, cheme.process-calculated-stale,
            cheme.generated-*]
  - id: drawing-clean
    title: No line through a label or valve, along a pipe or slanted, no crossing, overlapping or
      misplaced label, no off-page connector off the sheet's edge left unaccepted
    stage: basic
    kind: validate
    # info: cheme.line-not-orthogonal (a slanted line) is an info finding
    fail_on: info
    rules: [cheme.line-through-label, cheme.line-crossing, cheme.label-overlap,
            cheme.label-far-from-owner, cheme.line-through-valve, cheme.line-on-pipe,
            cheme.line-not-orthogonal, cheme.offpage-not-on-edge]
    accept:
      - id: "pid/P-03.xml#line-crossing:Line_GOX3001_S1_P1+Line_LOX3001_S1_P1"
        reason: "GOX leaves C-3102 at N6 above the LOX sump draw N7 (vapour over liquid, D-023) and must reach the cold end of E-3101 at the bottom, while LOX runs left to its connector beside E-3101; the only gap round the LOX end is blocked by the VNT-3004 and UN-3001 connectors and a route over the top cuts the AIA-3103 and KT-3101 instruments"
      - id: "pid/P-03.xml#line-crossing:Line_AIR3005_S1_P1+Inst_UIC3120"
        reason: "UIC-3120 measures on AIR-3005 below the AIR-3006 tee and acts on UV-3120 on AIR-3006, which sits in the pocket closed by AIR-2002, AIR-3005, AIR-3006 and AIR-3002; every signal path from the measuring point to the actuator crosses one pipe"
      - id: "pid/P-01.xml#line-crossing:Line_CHW1001_S6_P3+Line_CHWR1001_S1_P2"
        reason: "CHWR-1001 leaves the C-1101 chimney tray on the right, inside the pocket closed by C-1101, CHW-1001 (to the upper section), P-1102A/B and C-1102, and must reach the C-1102 top; above it the TIC-1105 measuring line and AIR-1004 close the pocket too, so every path out crosses one line (D-069)"
      - id: "pid/P-01.xml#line-crossing:Line_CHW1001_S6_P2+Inst_LSLL1115_MeasuringLine"
        reason: "LSLL-1115 has its own tapping I4 on the C-1101 chimney tray, independent of LIC-1114 (D-076), and trips XV-1115 on CHWR-1001 beyond CHW-1001, in the only free space left of the CHWR-3001 tee; the space between C-1101 and CHW-1001 is taken by LIC-1114 / LV-1114, so the measuring line crosses CHW-1001 once (and the TIC-1105 measuring line)"
      - id: "pid/P-03.xml#line-crossing:Line_LN3001_S1_P1+Inst_LIC3101"
        reason: "LIC-3101 measures the C-3101 sump level inside the pocket bounded by C-3101, LN-3001, RL-3001 and E-3102 and acts on LV-3101 on RL-3001 above E-3102; any signal path out of the pocket crosses one pipe, and moving the tapping would no longer show a sump level"
      - id: "pid/P-04.xml#line-crossing:Line_GOX4003_S1_P2+Inst_UIC4103_ML"
        reason: "GOX-4001 and the GOX-4003 anti-surge recycle form a closed pipe loop around K-4101; UIC-4103 measures at K-4101 nozzle I2 inside the loop and drives UV-4103 on the recycle outside it, so its measuring line must cross the loop once (it does exactly once); the space inside the loop is taken by E-4101 and the E-4102 CW/CWR connectors"
      - id: "pid/P-04.xml#line-crossing:Line_GOX4001_S3_P1+Sig_FIC4148_UY4151"
        reason: "FIC-4148 sits below GOX-4001 on its S1 tap and the low select UY-4151 above it beside the K-4101 guide vanes (D-101); its signal must cross GOX-4001 once. It crosses at x 70, the only gap between the line label GOX-4001 DN 500 and XV-4117"
      - id: "pid/P-04.xml#line-crossing:Line_GOX4003_S1_P2+Sig_FIC4148_UY4151"
        reason: "the GOX-4003 recycle drops from GOX-4001 at x 65, right of FIC-4148, and the gap left of it is taken by the GOX-4001 DN 500 label; a signal from FIC-4148 to UY-4151 crossing GOX-4001 left of x 65 would run through that label or 2 mm beside the recycle line, so it crosses the recycle riser once (D-101)"
      - id: "pid/P-04.xml#line-crossing:Line_VNT4002_S3_P2+Sig_PIC4102_UY4151"
        reason: "PIC-4102 sits at the GOX-4002 battery limit end, right of the K-4101 vent stack VNT-4002 to S-4101, and UY-4151 beside K-4101; the stack rises from S-4101 to its atmosphere arrow, so any signal from PIC-4102 to the low select crosses it once (above the arrow it would leave the frame) (D-101)"
      - id: "pid/P-04.xml#line-crossing:Line_GOX4004_S4_P2+Line_LOX3001_S1_P1"
        reason: "GOX-4004 and LOX-3001 cross at right angles on P-04: the off-page connector is kept on the sheet edge, which costs this crossing (plant owner decision 2026-11-05, P&ID drawing pass)"
      - id: "pid/P-01.xml#line-crossing:Line_AIR1004_S1_P1+Line_WN1001_S1_P1"
        reason: "AIR-1004 and WN-1001 cross at right angles on P-01: the off-page connector is kept on the sheet edge, which costs this crossing (plant owner decision 2026-11-05, P&ID drawing pass)"
      - id: "pid/P-01.xml#line-crossing:Line_CW1001_S6_P1+Line_CWR1001_S1_P2"
        reason: "CW-1001 and CWR-1001 cross at right angles on P-01: the off-page connector is kept on the sheet edge, which costs this crossing (plant owner decision 2026-11-05, P&ID drawing pass)"
      - id: "pid/P-01.xml#line-crossing:Line_CHW1001_S6_P1+Line_CHW3001_S1_P1"
        reason: "CHW-1001 and CHW-3001 cross at right angles on P-01: the off-page connector is kept on the sheet edge, which costs this crossing (plant owner decision 2026-11-05, P&ID drawing pass)"
      - id: "pid/P-01.xml#line-crossing:Line_CHW1001_S6_P3+Line_CHWR3001_S1_P1"
        reason: "CHW-1001 and CHWR-3001 cross at right angles on P-01: the off-page connector is kept on the sheet edge, which costs this crossing (plant owner decision 2026-11-05, P&ID drawing pass)"
      - id: "pid/P-01.xml#line-crossing:Line_CW1003_S1_P1+Line_WN1001_S1_P1"
        reason: "CW-1003 and WN-1001 cross at right angles on P-01: the off-page connector is kept on the sheet edge, which costs this crossing (plant owner decision 2026-11-05, P&ID drawing pass)"
      - id: "pid/P-02.xml#line-crossing:Line_AIR2001_S1_P2+Line_RG2001_S1_P1"
        reason: "AIR-2001 and RG-2001 cross at right angles on P-02: the off-page connector is kept on the sheet edge, which costs this crossing (plant owner decision 2026-11-05, P&ID drawing pass)"
      - id: "pid/P-02.xml#line-crossing:Line_RG2001_S1_P1+Line_RG2002_S3_P1"
        reason: "RG-2001 and RG-2002 cross at right angles on P-02: the off-page connector is kept on the sheet edge, which costs this crossing (plant owner decision 2026-11-05, P&ID drawing pass)"
      - id: "pid/P-02.xml#line-crossing:Line_AIR1004_S1_P1+Line_RG2003_S3_P1"
        reason: "AIR-1004 and RG-2003 cross at right angles on P-02: the off-page connector is kept on the sheet edge, which costs this crossing (plant owner decision 2026-11-05, P&ID drawing pass)"
      - id: "pid/P-03.xml#line-crossing:Line_WN3002_S2_P1+Inst_PIC3110"
        reason: "WN-3002 and PIC-3110 cross at right angles on P-03: the off-page connector is kept on the sheet edge, which costs this crossing (plant owner decision 2026-11-05, P&ID drawing pass)"
      - id: "pid/P-03.xml#line-crossing:Line_AIR3003_S1_P1+Line_LOX3001_S2_P2"
        reason: "AIR-3003 and LOX-3001 cross at right angles on P-03: the off-page connector is kept on the sheet edge, which costs this crossing (plant owner decision 2026-11-05, P&ID drawing pass)"
      - id: "pid/P-03.xml#line-crossing:Line_LIN3001_S1_P1+Line_WN3002_S1_P1"
        reason: "LIN-3001 and WN-3002 cross at right angles on P-03: the off-page connector is kept on the sheet edge, which costs this crossing (plant owner decision 2026-11-05, P&ID drawing pass)"
      - id: "pid/P-03.xml#line-crossing:Line_LIN3001_S1_P1+Line_WN3001_S1_P1"
        reason: "LIN-3001 and WN-3001 cross at right angles on P-03: the off-page connector is kept on the sheet edge, which costs this crossing (plant owner decision 2026-11-05, P&ID drawing pass)"
      - id: "pid/P-03.xml#line-crossing:Line_LOX3001_S2_P2+Line_WN3002_S1_P1"
        reason: "LOX-3001 and WN-3002 cross at right angles on P-03: the off-page connector is kept on the sheet edge, which costs this crossing (plant owner decision 2026-11-05, P&ID drawing pass)"
      - id: "pid/P-04.xml#line-crossing:Line_GAN4002_S6_P2+Line_GOX4004_S4_P2"
        reason: "GAN-4002 and GOX-4004 cross at right angles on P-04: the off-page connector is kept on the sheet edge, which costs this crossing (plant owner decision 2026-11-05, P&ID drawing pass)"
      - id: "pid/P-04.xml#line-crossing:Line_GOX4004_S4_P2+Line_UN3001_S1_P1"
        reason: "GOX-4004 and UN-3001 cross at right angles on P-04: the off-page connector is kept on the sheet edge, which costs this crossing (plant owner decision 2026-11-05, P&ID drawing pass)"
      - id: "pid/P-04.xml#offpage-not-on-edge:OPC_CW4001"
        reason: "utility stub drawn at its user by convention, beside E-4102 inside the GOX-4001/GOX-4003 loop (core ADR 0049 and REFERENCE drawing-clean: a CW/CWR arrow at an exchanger is accepted by its offpage-not-on-edge id; #421 allows it); the lint's move onto the top edge (`--offset=0,-54`) was tried on core v1.11.0 and takes P-04 from 7 to 14 line crossings and from 0 to 6 line-through-label, 1 label-overlap and 2 line-through-symbol findings (CW-4001 then runs through the E-4102 tag and its own CW text and crosses Sig_PIC4102_UY4151, which runs along the top edge); temporary: the plant owner's decision (2026-11-05) keeps off-page connectors on the edge, so the four stubs are to be routed there by hand, process-library#430"
      - id: "pid/P-04.xml#offpage-not-on-edge:OPC_CWR4001"
        reason: "utility stub drawn at its user by convention, beside E-4102 inside the GOX-4001/GOX-4003 loop (core ADR 0049 and REFERENCE drawing-clean: a CW/CWR arrow at an exchanger is accepted by its offpage-not-on-edge id; #421 allows it); the lint's move onto the top edge (`--offset=0,-54`) was tried on core v1.11.0 and takes P-04 from 7 to 14 line crossings and from 0 to 6 line-through-label, 1 label-overlap and 2 line-through-symbol findings (CWR-4001 then runs through the E-4102 tag and its own CWR text and crosses Sig_PIC4102_UY4151, which runs along the top edge); temporary: the plant owner's decision (2026-11-05) keeps off-page connectors on the edge, so the four stubs are to be routed there by hand, process-library#430"
      - id: "pid/P-04.xml#offpage-not-on-edge:OPC_CW4002"
        reason: "utility stub drawn at its user by convention, beside E-4103 inside the GAN-4001/GAN-4004 loop (core ADR 0049 and REFERENCE drawing-clean: a CW/CWR arrow at an exchanger is accepted by its offpage-not-on-edge id; #421 allows it); the lint's move onto the left edge (`--offset=-110,0`) was tried on core v1.11.0 and takes P-04 from 7 to 14 line crossings and from 0 to 6 line-through-label, 1 label-overlap and 2 line-through-symbol findings (CW-4002 then runs slanted through K-4102 and across GAN-4004, LIN-3001 and the UIC-4131 measuring line, through the LIN-3001 inlet text, and its CW text overlaps CWR's); temporary: the plant owner's decision (2026-11-05) keeps off-page connectors on the edge, so the four stubs are to be routed there by hand, process-library#430"
      - id: "pid/P-04.xml#offpage-not-on-edge:OPC_CWR4002"
        reason: "utility stub drawn at its user by convention, beside E-4103 inside the GAN-4001/GAN-4004 loop (core ADR 0049 and REFERENCE drawing-clean: a CW/CWR arrow at an exchanger is accepted by its offpage-not-on-edge id; #421 allows it); the lint's move onto the left edge (`--offset=-116,0`) was tried on core v1.11.0 and takes P-04 from 7 to 14 line crossings and from 0 to 6 line-through-label, 1 label-overlap and 2 line-through-symbol findings (CWR-4002 then runs slanted through K-4102 and across GAN-4004 and the UIC-4131 measuring line, through the LIN-3001 inlet text, and its CWR text overlaps CW's); temporary: the plant owner's decision (2026-11-05) keeps off-page connectors on the edge, so the four stubs are to be routed there by hand, process-library#430"
  # Cables and trays (electrical/, skill electrical-cabling): every motor and instrument has a
  # cable routed in trays, no tray over its fill, power and instrument trays apart.
  - id: electrical
    title: A cable to every motor and instrument, routed in trays, fill and separation kept
    stage: detail
    kind: layout-model
    require: [model-current, cables, trays]
  # Ventilation (layout/hvac.yaml, skill hvac-ducts): every clad building ventilated, ducts
  # routed inside it within their velocity limits, units and louvres large enough.
  - id: hvac
    title: Clad buildings ventilated, ducts routed within their velocity limits
    stage: detail
    kind: layout-model
    require: [model-current, hvac]
  - id: datasheets
    title: A datasheet for every equipment-list item
    stage: detail
    kind: datasheets               # equipment/datasheets/<TAG>.yaml, see its README
  # Prefer on-sheet over grep for what a P&ID must show: it finds printed tags in the model.
  # - id: relief-on-pid
  #   title: Relief devices drawn and connected
  #   stage: basic
  #   kind: on-sheet
  #   sheets: [P-01]            # or sheet: P-01; omitted: any sheet
  #   tags: [PSV-101]           # equipment, instrument (PICSA-101), valve or line tags
  #   classes: [SafetyValve]    # at least min_count (1) of each class
  #   connected: true           # piped, on a segment, with a measuring/signal line

# Findings accepted for every gate and for `cheme validate`, which then reports them as info
# with the reason (an entry that names no finding is reported as cheme.accept-unused).
# Only warnings and infos can be accepted; an error stays an error (cheme.accept-error).
accept:
  - id: "layout/plant-model.yaml#layout-operability:P-04/XV3105"
    reason: "XV-3105 is the actuated off-spec GAN divert valve (AIA-3105 opens it, D-013), not a manual valve: its lever is a maintenance override only. It sits on VNT-4004 where it leaves GAN-4001 on the PR1 9 m tier (lever 10.1 m); no fixed platform fits there: the proposal's columns stand in WN-1001 / WN-3003 / CHW-3001 and the rack, a floor cantilevered under the 9 m tier lacks the 2.1 m headroom, and the cheme rack schema has no rack walkway. Its solenoid, limit-switch box and air set are brought to a pedestal at grade south of PR1 (tubing and cable, no reach rod), and the lever is reached by a mobile elevating work platform from grade for maintenance (ASSUMED owner practice; D-084). A PR1 top-tier walkway is for the rack designer in detail engineering"
  - id: "layout/plant-model.yaml#layout-tier:P-03/Line_WN1001_S1@PR1"
    reason: "the DN1000 WN-1001 (D-071) leaves the WN-3002 tee east of the WN-3003 riser and must rise west of PR1 bent 17 and of the AIR-2002 and WN-3003 risers, so it runs 3.0 m inside the rack footprint at 5.85 m, under the 7 m tier it rises to; outside the rack every way to that lane crosses WN-3003 or the AIR-2002 riser (D-071 (3))"
  # erection lifts, not maintenance lifts: the items that carry an empty weight for the LCA
  # since D-081 (5) but are shop-built and erected once before the piping (D-034); the
  # construction lifting plan (crane contractor) sets their cranes, pads and lanes, the
  # maintenance study does not. The field-erected tanks need none: their lift_weight is the
  # 0.5 t roof fittings, under the study's 5 t (D-081 (10))
  - id: "layout/plant-model.yaml#layout-lifting:F-1101"
    reason: "erection lift (~10 t filter house, D-081 (5)): set once on its foundation before the MAC house and the ducting; no maintenance lift of the whole house (the cartridges are changed by hand from its walkway). No crane pad is declared for it: the construction lifting plan places the crane (D-034)"
  - id: "layout/plant-model.yaml#layout-lifting:C-1102"
    reason: "erection lift (~36 t empty, D-081 (5)): the column is set on its skirt once before the piping; packing and internals go in and out through the manways, no maintenance lift of the column. No crane pad is declared for it: the construction lifting plan places the crane (D-034)"
