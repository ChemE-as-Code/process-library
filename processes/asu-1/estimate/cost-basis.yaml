# Cost basis of the equipment estimate. Schema: `cheme schema cost_basis`. Skill mto-estimate.
# The equipment costs come from the published correlations cheme-as-code ships (Turton et al., 5th
# ed., Appendix A, base CEPCI 397, 2001); this file gives the index they are escalated to and
# the items' own sizes, factors or exclusions, each with its source (DESIGN.md D-043).
schema: cheme/cost_basis/v1
cost_index:
  value: 797.9
  year: 2023
  month: annual
  source: "Chemical Engineering Plant Cost Index (CEPCI), 2023 annual average 797.9: S. Jenkins, '2023 CEPCI annual average value decreases from previous year', Chemical Engineering, 25 March 2024 (chemengonline.com); the latest annual average the project could cite"
estimate_class: 5
items: []
notes: >-
  Class 5 (AACE 18R-97, concept screening): equipment costs from correlations, the rest of the
  plant from the take-off with the rates of estimate/rates.yaml (still the example, D-035).
