# Zones of the 3D layout. Schema: `cheme schema zones`. Skill area-classification.
# SCREENING ONLY: volumes from sources take cheme-as-code's indicative radius table (every row
# ASSUMED); no dispersion is modelled. An oxygen and inert vent study (EIGA guidance) by a
# competent person replaces or confirms each zone (DESIGN.md D-031). The ASU handles no
# flammables: no hazardous (Ex) zones.
zones:
  # ---- oxygen-enriched: no ignition sources, oil, grease or combustibles (asphalt, wood) inside
  - id: Z-O2-V1
    title: GOX silencer outlets in the vent area V1
    kind: oxygen_enriched
    sources:
      - {item: S-4101, release_grade: primary, substance: oxygen, source_kind: vent}   # K-4101 blowdown on trip
      - {item: S-4102, release_grade: primary, substance: oxygen, source_kind: vent}   # suction vent on trip / start-up
    basis: "D-013, D-019, D-025: intermittent GOX vents; table row vent/primary/oxygen (ASSUMED)"
  - id: Z-O2-VENTS
    title: Oxygen vents and relief outlets at the plant items
    kind: oxygen_enriched
    sources:
      - {item: VNT-4001, release_grade: continuous, substance: oxygen, source_kind: vent}      # LOX tank boil-off vent (PV-4109)
      - {item: VNT-3001, release_grade: primary, substance: oxygen, source_kind: vent}         # drain vaporizer V-3101 vent
      - {item: VNT-4006, release_grade: primary, substance: oxygen, source_kind: vent}         # GOX DBB bleed at the BL
      - {item: VNT-3002, release_grade: secondary, substance: oxygen, source_kind: psv_outlet}  # PSV-3114 tailpipe outlet on the cold box roof, O2-rich (D-011, D-033)
      - {item: GOX-4004, release_grade: secondary, substance: oxygen, source_kind: psv_outlet}  # PSV-4127 tailpipe outlet beside VP-9 (GOX-4004 S6, its only open end; D-055 (2))
    basis: "D-011, D-019, section 4 relief case list; PSV-3114 (outlet VNT-3002) treated as O2-rich as DESIGN.md states; PSV-4127 on the GOX backup vaporizer header (D-055 (2)); table rows (ASSUMED)"
  - id: Z-O2-SEALS
    title: GOX compressor seals and LOX pump seals
    kind: oxygen_enriched
    sources:
      - {item: K-4101, release_grade: secondary, substance: oxygen, source_kind: compressor_seal}
      - {item: P-4101A, release_grade: secondary, substance: oxygen, source_kind: pump_seal}
      - {item: P-4101B, release_grade: secondary, substance: oxygen, source_kind: pump_seal}
    basis: "D-012: dry gas seals with N2 buffer, LOX pumps cold standby; table rows (ASSUMED)"
  # ---- oxygen-deficient (asphyxiation): vents elevated, away from walkways and escape routes
  - id: Z-N2-V1
    title: Waste N2 surplus vent silencer S-3101 in the vent area V1
    kind: oxygen_deficient
    sources:
      - {item: S-3101, release_grade: continuous, substance: waste nitrogen, source_kind: vent}
    basis: "D-011, D-025, D-071 (4): since D-067 no flow in normal operation; the start-up and C-1102 bypass route, intermittently up to all of S12B (58 t/h); the continuous table row kept as the conservative screening grade (ASSUMED); the larger flow in Z-N2-V1B"
  - id: Z-N2-V1B
    title: S-3101 outlet at the full C-1102 bypass flow (58 t/h, intermittent)
    kind: oxygen_deficient
    shape: sphere
    centre: [190.0, 114.0, 8.0]
    radius: 10.0
    basis: "D-071 (4), ASSUMED screening: the 5 m table radius of Z-N2-V1 was set for ~12,500 Nm3/h; the bypass carries ~46,000 Nm3/h (3.7 x). At the same outlet velocity the outlet diameter grows with the square root of the flow and a free jet's reach to a given dilution with its diameter: 5 m x 3.7^0.5 = 9.6, rounded to 10 m. Reaches grade within 6 m of the silencer, inside or 4 m south of the vent area V1: V1 kept fenced, entry with a personal O2 monitor; it also takes in the PR3 north end (x >= 180, the 8.5 m tier step-off of the end ladder 9.0 m from the centre): the same control there, a sign at the PR3 end ladder and no work on PR3 north of y 105 while PV-3110B is open (D-074 (4)); the vent study (D-031) replaces it"
  - id: Z-N2-WN1002
    title: C-1102 top vent WN-1002 at 58,900 kg/h (DN900)
    kind: oxygen_deficient
    shape: sphere
    centre: [55.0, 60.0, 29.328]
    radius: 6.5
    basis: "D-071 (4), ASSUMED screening: the 5 m table radius (Z-N2-VENTS) was set for the D-061 flow, 31,450 kg/h in DN700 at ~20 m/s; now ~58,900 kg/h (5.1 % O2) in DN900 at ~21 m/s: about the same exit velocity, the outlet diameter x 1.29, so a free jet's reach to a given dilution x 1.29: 6.5 m. The outlet rises to 29.3 m (piping/routing.yaml vents rule with radius_m 6.5); the vent study (D-031) replaces it. D-083 blow-by case (relief path, until I-03 trips): up to 153 t/h, 94.5 t/h of it air, ~14.9 mol% O2 at ~56 m/s: the mixture needs a dilution of ~4.3 to reach 19.5 % O2 against ~11 for the design gas, so a free jet of the same outlet reaches it closer to the outlet: the 6.5 m sphere covers the case (ASSUMED screening)"
  - id: Z-N2-VENTS
    title: Nitrogen and waste nitrogen vents and relief outlets at the plant items
    kind: oxygen_deficient
    sources:
      - {item: WN-1002, release_grade: continuous, substance: waste nitrogen, source_kind: vent}  # C-1102 top vent (wet N2)
      - {item: S-2101, release_grade: primary, substance: waste nitrogen, source_kind: vent}     # TSA regeneration gas vent silencer, 6 m up
      - {item: VNT-4004, release_grade: primary, substance: nitrogen, source_kind: vent}         # GAN compressor suction vent
      - {item: VNT-4005, release_grade: continuous, substance: nitrogen, source_kind: vent}      # LIN tank boil-off vent (PV-4110)
      - {item: VNT-4007, release_grade: primary, substance: nitrogen, source_kind: vent}         # GAN DBB bleed at the BL
      - {item: VNT-3003, release_grade: secondary, substance: nitrogen, source_kind: psv_outlet} # PSV-3116 tailpipe outlet on the cold box roof (D-033)
      - {item: GAN-4003, release_grade: secondary, substance: nitrogen, source_kind: psv_outlet} # PSV-4128 tailpipe outlet beside VP-9 (GAN-4003 S6, its only open end; D-055 (2))
    basis: "D-011, section 4; PSV-4128 on the GAN backup vaporizer header (D-055 (2)); table rows (ASSUMED)"
  - id: Z-N2-CASING
    title: Cold box casing breather VNT-3004 (PSV-3123) on the casing roof
    kind: oxygen_deficient
    shape: sphere
    centre: [140, 39, 53.5]
    radius: 5
    basis: "Casing purge N2 breathes out at the breather PSV-3123 on the 53 m casing roof, 0.5 m above it (D-013, O2 review F7, D-032 #3, D-038 (10)); the breather stands at the south-east roof corner, more than 5 m from the roof walkway RF, the relief valve platform RV, the roof landing RF-out, the stair head ST5 and the ladder head LD4 (D-039 (6), review5#6); 5 m as an inert vent (table row vent/primary/inert, ASSUMED); roof access still with a personal O2 monitor (D-031)"
  - id: Z-N2-SEALS
    title: LIN pump seals
    kind: oxygen_deficient
    sources:
      - {item: P-4102A, release_grade: secondary, substance: nitrogen, source_kind: pump_seal}
      - {item: P-4102B, release_grade: secondary, substance: nitrogen, source_kind: pump_seal}
    basis: "cold N2 vapour collects at grade; table row pump_seal/secondary/inert (ASSUMED)"
