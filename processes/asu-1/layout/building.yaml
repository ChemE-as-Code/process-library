# Buildings. Schema: `cheme schema building`. Coordinates m, x east, y north, origin SW site corner.
# All dimensions ASSUMED at basic engineering (vendor data in detail engineering); basis in DESIGN.md D-026, D-030.
buildings:
  - id: B1
    title: "MAC compressor house (K-1101 with intercoolers E-1101/E-1102 and aftercooler E-1103)"
    origin: [36, 22]
    width: 36
    depth: 26
    use: compressor
    levels:
      - {id: L0, title: "Grade floor (compressor on block foundation, coolers beside it; MV cable trench to K-1101 from B2)", elevation: 0, height: 12, kind: floor}
      - {id: RF, title: "Roof (overhead crane runway below, 40 t ASSUMED)", elevation: 12, kind: roof}
    frame:
      grid_x: [0, 6, 12, 18, 24, 30, 36]
      grid_y: [0, 13, 26]
    walls: all
    wall_material: cladding
    # overhead travelling crane for the maintenance lifts (MAC motor ~34 t for the 9 MW motor,
    # gearbox, rotors, cooler bundles; ASSUMED, D-034, D-070); the train itself is set by mobile
    # crane before the roof
    crane: {capacity_t: 40, notes: "Heaviest maintenance lift the 9 MW MAC motor (~34 t ASSUMED, 39.3 t with the lifting study's allowances); D-034, D-070"}
    # offset: from the left end of the side seen from outside (west side: from its north end,
    # south: from the west end, east: from the south end, north: from the east end)
    openings:
      - {id: W1, side: west, offset: 4, width: 4, height: 5, kind: roller_door}        # E-1101 bundle pull (y 42)
      - {id: W2, side: west, offset: 16.3, width: 4.2, height: 4.3, sill: 1.0, kind: opening}  # AIR-1001 suction duct from F-1101 (y 27.5..31.7, D-033 (4))
      - {id: S1, side: south, offset: 8, width: 6, height: 7, kind: roller_door}       # maintenance access, truck under the crane
      - {id: S2, side: south, offset: 28, width: 1.2, height: 2.2, kind: door}         # personnel door / escape
      - {id: E1, side: east, offset: 8.5, width: 2, height: 2, sill: 3.0, kind: opening}    # AIR-1003 to S-1101 (y 30.5..32.5)
      - {id: E3, side: east, offset: 20, width: 1.2, height: 2.2, kind: door}          # personnel door / escape
      # pipe band in the north wall: the six CW / CWR lines from PR1 and the MAC discharge
      # AIR-1002 to C-1101 leave the house at the 3.5 m pipe-way (x 40.2..67.2, z 3.4..4.4;
      # review 2026-10-21-layout#9, D-033 (4))
      - {id: N1, side: north, offset: 4.8, width: 27, height: 1.0, sill: 3.4, kind: opening}
      # ventilation louvres of AHU-1 (layout/hvac.yaml, D-037): outdoor air in at the south end
      # of the east wall, exhaust out of the south wall above the unit, 14 m apart round the
      # corner; both low, under the extract mains
      - {id: LV1, side: east, offset: 0.5, width: 4, height: 2.5, sill: 3.25, kind: louvre}
      - {id: LV2, side: south, offset: 19, width: 5, height: 2.5, sill: 3.25, kind: louvre}
  - id: B2
    title: "Substation and control building: MV switchgear SWG-1, LV MCC-1, control room CR-1 (D-036)"
    origin: [20, 50]
    width: 18
    depth: 10
    use: substation
    levels:
      - {id: L0, title: "Ground floor on a 1.2 m cable cellar (not modelled)", elevation: 0, height: 5, kind: floor}
      - {id: RF, title: "Roof", elevation: 5, kind: roof}
    frame:
      grid_x: [0, 6, 12, 18]
      grid_y: [0, 10]
    walls: all
    wall_material: cladding
    # the south wall facing B1 (2 m away over x 36 .. 38) is a REI 120 masonry fire wall without
    # doors or louvres (site-plan separation B2-B1, D-038 (6)); the doors face north and east,
    # away from the MAC house; the west wall behind the transformer yard is REI 90 (D-038 (7))
    openings:
      - {id: D1, side: north, offset: 11, width: 1.2, height: 2.2, kind: door}          # control room entrance / escape
      - {id: D2, side: north, offset: 14.6, width: 2.4, height: 3.0, kind: roller_door} # switchgear delivery from the central road R2, west of PR1
      - {id: D3, side: east, offset: 6, width: 1.2, height: 2.2, kind: door}            # MCC room escape, towards the plant
      # AHU-2 louvres (layout/hvac.yaml, D-037): intake at the south end of the east wall
      # beside the unit, exhaust at the east end of the north wall, round the corner
      - {id: LV1, side: east, offset: 0.5, width: 2.4, height: 1.5, sill: 3.0, kind: louvre}
      - {id: LV2, side: north, offset: 0.5, width: 2.4, height: 1.5, sill: 3.0, kind: louvre}
notes: >-
  Only the MAC train is housed (noise ~85 dB(A) at 1 m, weather protection, crane for rotor and
  bundle pulls). The GOX compressor K-4101 stays in the open behind its fire wall FW-4101 (layout/structures.yaml)
  so that an O2 fire vents to atmosphere and nobody works in an enclosed room around it (D-012, D-026).
  Two personnel doors on opposite sides (S2, E3) give two ways out. The substation and control
  building B2 stands at the upwind west end of PR1, north of the MAC house and 120 m from the
  nearest O2 vent: the 6.6 kV MAC motor is fed close by (cable cellar and trench into B1), the
  other cables run to the plant on PR1, and no oxygen-enriched or inert zone reaches the occupied
  control room (D-036). B2 is 2 m from B1 behind its REI 120 south wall (declared separation,
  D-038 (6)). Its transformers TR-1 / TR-2 stand in the transformer yard on its west side
  (zones Z-TR1 / Z-TR2 with oil bunds, fire wall FW-TR between them, access from the west road
  R4; D-038 (7)).
