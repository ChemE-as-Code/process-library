  width_m:
    value: 6.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  weight_t:
    value: 45.0
    unit: t
    source: equipment/equipment-list.yaml dimensions
  fluid_power_kw:
    value: 2184
    unit: kW
    source: '`cheme process simulate` (DWSIM 9.0.5, Peng-Robinson; DESIGN.md D-061): K4101 compressor
      power 2,183.8 kW, S7 1.15 bara 13 C -> S8 31 bara, 4 stages at isentropic efficiency 0.78, intercooled
      to 40 C (process/simulation.yaml, ASSUMED). The 5-stage arrangement of this datasheet at the same
      efficiency gives 2,154 kW (scripts/datasheet_sizing.py section 2 (DESIGN.md D-063 (5)), ideal gas with Cp/Cv at each stage
      suction): 1.4 % apart'
    assumed: true
  shaft_power_kw:
    value: 2184
    unit: kW
    source: '`cheme process simulate` (DESIGN.md D-061): K4101 shaft 2,183.8 kW = the compressor power; the
      gear and bearing losses are in the drive efficiency below'
    assumed: true
  isothermal_power_kw:
    value: 1418
    unit: kW
    source: 'scripts/datasheet_sizing.py section 2 (DESIGN.md D-063 (5)): n R T ln(31 / 1.15) for 20,860 kg/h GOX (M 32.03) at the
      13 C suction (was 1,477 kW at 25 C); isothermal efficiency 0.65 on the compressor power'
    assumed: true
  electric_power_kw:
    value: 2308
    unit: kW
    source: 'process/flowsheet.yaml energy stream E4 (calculated, `cheme process simulate`, DESIGN.md
      D-061): 2,308.4 kW = shaft / drive efficiency 0.946. The motor stays rated 2.3 MW (equipment list,
      electrical list)'
    assumed: true
  drive_efficiency:
    value: 0.946
    source: process/simulation.yaml K4101 (ASSUMED, D-057; motor 0.97 x gear 0.975)
    assumed: true
  isentropic_efficiency:
    value: 0.78
    source: process/simulation.yaml K4101 (ASSUMED, oil-free GOX centrifugal, until the supplier's guarantee)
    assumed: true
  max_stage_pressure_ratio:
    value: 2.0
    source: DESIGN.md D-053 (ASSUMED; gives 5 stages, the equipment list says 4-5)
    assumed: true
  intercooler_outlet_temperature_degc:
    value: 40
    unit: degC
    source: process/simulation.yaml K4101 outlet_temperature (ASSUMED, as the aftercooler E-4102 'GOX to
      40 C', CW 25 -> 35 C)
    assumed: true
  heat_capacity_ratio:
    value:
    - 1.3992
    - 1.3982
    - 1.4022
    - 1.4098
    - 1.4245
    source: 'scripts/datasheet_sizing.py section 2 (DESIGN.md D-063 (5)): Cp/Cv of S7 at each stage suction (286.15 K 115 kPa(a);
      313.15 K 222 / 430 / 830 / 1,604 kPa(a)), property adapter (thermo 0.6.1, PR); replaces the single
      1.398 at 298.15 K of D-053'
    assumed: true
  process_streams:
  - stream: S7
    direction: in
    title: GOX product
    source: process/flowsheet.yaml (case design)
  - stream: S8
    direction: out
    title: GOX to pipeline
    source: process/flowsheet.yaml (case design)
  number_of_stages:
    value: 5
    unit: ''
    source: 'DESIGN.md D-053 (2): 5 stages of ratio 1.933 at the 2.0 maximum per stage (ASSUMED), the four
      intercoolers of the E-4101 package (D-055 (6)). process/simulation.yaml models 4 stages (D-057); the
      supplier fixes the staging'
    assumed: true
  stage_pressure_ratio:
    value: 1.933
    unit: ''
    source: 'scripts/datasheet_sizing.py section 2 (DESIGN.md D-063 (5)): (31 / 1.15)^(1/5), no intercooler pressure drop
      (ASSUMED)'
    assumed: true
  discharge_temperature_k:
    value: 400.2
    unit: K
    source: 'scripts/datasheet_sizing.py section 2 (DESIGN.md D-063 (5)): stage 5 discharge (ideal gas, Cp/Cv at the stage suction,
      eta_s 0.78); stages 1 to 4: 362.0 / 396.0 / 396.7 / 397.9 K'
    assumed: true
  intercooler_duties_kw:
    value:
    - 257.6
    - 437.6
    - 437.9
    - 438.5
    unit: kW
    source: 'scripts/datasheet_sizing.py section 2 (DESIGN.md D-063 (5)): m cp (T_stage - 313.15 K) per intercooler, cp from the
      stage suction Cp/Cv; aftercooler E-4102 439.6 kW. The five coolers 2,011 kW against the simulated Q3
      2,086 kW of the 4-stage machine (D-061)'
    assumed: true
sizing_basis: []
notes: 'Oil-free, dry gas seals with N2 buffer, 4-5 stages, 1.15 -> 31 bara, 14,600 Nm3/h, 2.3 MW motor, fire-safe
  enclosure (D-002, D-012). ASSUMED. Powers from the DWSIM simulation (DESIGN.md D-057, D-061): 2,184 kW at the
  compressor, 2,308 kW electric with the 13 C suction. Finding for the simulation: process/simulation.yaml
  has 4 stages, this datasheet and the E-4101 package 5 (four intercoolers); within 1.4 % in power.'
