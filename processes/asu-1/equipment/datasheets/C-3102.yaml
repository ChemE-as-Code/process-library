# Datasheet, first drafted by `cheme datasheets draft` from equipment/equipment-list.yaml, pid/P-03.xml, process/flowsheet.yaml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: C-3102
type: ProcessColumn
service: LP column
operating:
  top_pressure:
    value: 1.3
    unit: bar(a)
    source: process/simulation.yaml C3102 condenser_pressure (ASSUMED; LP column top 1.3 bara)
    assumed: true
  top_temperature:
    value: -192.88
    unit: °C
    source: '`cheme process simulate` (DWSIM, DESIGN.md D-059): C3102 top 80.27 K (S16)'
    assumed: true
  sump_pressure:
    value: 1.4
    unit: bar(a)
    source: process/simulation.yaml C3102 reboiler_pressure (ASSUMED, 0.1 bar over the packing)
    assumed: true
  sump_temperature:
    value: -179.98
    unit: °C
    source: '`cheme process simulate` (DWSIM, DESIGN.md D-059): C3102 bottom 93.17 K (S15)'
    assumed: true
  gox_vapour_flow:
    value: 20860.0
    unit: kg/h
    source: process/flowsheet.yaml stream S15 (given, 500 t/d GOX; drawn as vapour from the sump, D-059)
  lox_flow:
    value: 470.0
    unit: kg/h
    source: process/flowsheet.yaml stream S10 (ASSUMED, D-017)
    assumed: true
  waste_n2_flow:
    value: 63750.0
    unit: kg/h
    source: process/flowsheet.yaml stream S16 (ASSUMED)
    assumed: true
  gox_purity_simulated:
    value: 97.0
    unit: mol% O2
    source: '`cheme process simulate` (DESIGN.md D-059): S15 O2 97.0, Ar 3.0 %, against the 99.5 % of the
      design basis (process/design-basis.yaml): the concept cycle does not reach the specification; the
      cold box vendor''s design must (D-059)'
    assumed: true
design:
  pressure_barg:
    value: 3.5
    unit: barg
    source: equipment/equipment-list.yaml
  temperature_degc:
    value: -196.0
    unit: degC
    source: equipment/equipment-list.yaml
materials:
  main:
    value: Aluminium 5083
    source: equipment/equipment-list.yaml
nozzles:
- name: N1
  dn: 800
  lines:
  - WN-3001
  source: pid/P-03.xml
- name: N2
  dn: 150
  lines:
  - VNT-3002
  source: pid/P-03.xml
  face: side
  orientation_deg: 90
  elevation_m: 24.3
  location_source: layout/equipment-placement.yaml (PSV-3114 inlet north, in the 2.4 m gap to the
    north casing wall; elevation above the column's base on C-3101; D-033 (4), D-055 (8))
- name: N3
  dn: 350
  lines:
  - AIR-3004
  source: pid/P-03.xml
  face: side
  orientation_deg: 270
  elevation_m: 18.8
  location_source: layout/equipment-placement.yaml (Lachmann air from the expander, south; D-033
    (4), D-055 (8))
- name: N4
  dn: 100
  lines:
  - LN-3001
  source: pid/P-03.xml
- name: N5
  dn: 100
  lines:
  - RL-3001
  source: pid/P-03.xml
- name: N6
  dn: 500
  lines:
  - GOX-3001
  source: pid/P-03.xml
  face: side
  orientation_deg: 0
  elevation_m: 6.5
  location_source: layout/equipment-placement.yaml (GOX draw east towards E-3101; D-028, D-055 (8))
- name: N7
  dn: 40
  lines:
  - LOX-3001
  source: pid/P-03.xml
  face: side
  orientation_deg: 90
  elevation_m: 2.4
  location_source: layout/equipment-placement.yaml (LOX draw north towards the rack; D-028, D-055
    (8))
- name: I1
  lines: []
  source: pid/P-03.xml
- name: I3
  lines: []
  source: pid/P-03.xml
type_specific:
  diameter_m:
    value: 4.2
    unit: m
    source: equipment/equipment-list.yaml dimensions
  height_m:
    value: 30.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  weight_t:
    value: 30.0
    unit: t
    source: equipment/equipment-list.yaml dimensions
  volume_m3:
    value: 415.633
    unit: m3
    source: 'equipment/equipment-list.yaml dimensions: pi/4 D^2 x height (overall, including heads and
      skirt: an upper bound)'
    assumed: true
  minimum_stages:
    value: 12.01
    unit: ''
    source: 'scripts/datasheet_sizing.py section 7 (DESIGN.md D-063 (7)): Fenske between the waste N2 top S16 (130 kPa(a), dew
      80.15 K) and the GOX sump S15 at its specification (140 kPa(a), process/simulation.yaml, bubble
      93.25 K), keys Ar/O2, alpha 1.502 (geometric mean, property adapter thermo 0.6.1, PR): the
      argon-oxygen split governs (keys N2/O2 give 8.80); a lower bound only; Fenske, Ind. Eng. Chem. 24
      (1932) 482'
    assumed: true
  theoretical_stages:
    value: 59
    unit: ''
    source: 'process/simulation.yaml C3102 stages 59, solved by `cheme process simulate` (DWSIM, Peng-Robinson,
      DESIGN.md D-059): no condenser, reboiled by E-3103 (3,250 kW); with them GOX reaches 97.0 % O2, not
      99.5 % (D-059: more stages below the crude feed is one of the ranked changes)'
    assumed: true
  feed_stages:
    value: LN reflux S18 on 1, crude S13 on 22, Lachmann air S6 on 24
    unit: ''
    source: process/simulation.yaml C3102 feed_stages (DESIGN.md D-059)
    assumed: true
  gox_draw:
    value: vapour from the sump (stage 59)
    unit: ''
    source: process/simulation.yaml C3102 side draw gox (DESIGN.md D-059)
    assumed: true
  number_of_stages:
    value: supplier
    unit: ''
    reason: 'the packed heights of the sections follow from the cold box supplier''s HETP for the chosen
      structured packing, and the stage count itself from the vendor''s cycle for 99.5 % GOX (D-059);
      enquiry basis: 59 theoretical stages, feeds on 1 / 22 / 24, GOX vapour from the sump'
  packing_height_m:
    value: supplier
    unit: m
    reason: 'cold box supplier: HETP of the chosen structured packing per section times the theoretical
      stages, with distributors; no HETP correlation in cheme-as-code is cleanly sourced'
  flooding_diameter_m:
    value: supplier
    unit: m
    reason: 'cold box supplier''s hydraulic rating at the simulated vapour and liquid loads (no flooding
      correlation in cheme-as-code is cleanly sourced); the 4.2 m of the equipment list is ASSUMED'
  process_streams:
  - stream: S6
    direction: in
    title: Lachmann air
    source: process/flowsheet.yaml (case design)
  - stream: S13
    direction: in
    title: Crude oxygen
    source: process/flowsheet.yaml (case design)
  - stream: S15
    direction: out
    title: Cold GOX
    source: process/flowsheet.yaml (case design)
  - stream: S16
    direction: out
    title: Cold waste nitrogen
    source: process/flowsheet.yaml (case design)
  - stream: S10
    direction: out
    title: LOX to storage
    source: process/flowsheet.yaml (case design)
  - stream: S18
    direction: in
    title: LN reflux to the LP column
    source: process/flowsheet.yaml (case design)
  minimum_reflux_ratio:
    value: not_applicable
    unit: ''
    reason: no condenser of its own; the LP column is refluxed by the LN S18 from C-3101 (24,530 kg/h), and
      with three feeds and three products the one-feed Underwood minimum does not apply
sizing_basis:
- parameter: stages, feeds, temperatures
  value: the DWSIM double-column simulation (Peng-Robinson, DWSIM default interaction parameters)
  reference: DESIGN.md D-059
notes: 'Structured packing, top 1.3 bara. O2 service in the lower section. Stands on C-3101 (stacked double
  column), E-3103 in its sump. ASSUMED. DESIGN.md D-059, D-063: 59 theoretical stages with LN on 1, crude on
  22 and Lachmann air on 24; top -192.9 C, sump -180.0 C. The simulated GOX is 97.0 % O2 against the 99.5 %
  specification (decision open with the client and the cold box vendor, D-059). Packing heights and diameter
  are the cold box supplier''s (markers).'
