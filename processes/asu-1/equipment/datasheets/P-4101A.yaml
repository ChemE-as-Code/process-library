# Datasheet, first drafted by `cheme datasheets draft` from equipment/equipment-list.yaml, pid/P-04.xml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: P-4101A
type: CentrifugalPump
service: LOX backup pump
draft: false
operating:
  fluid:
    value: LOX (O2 99.81 %, Ar 0.19 %; specification 99.5 %), saturated at the tank pressure
    source: process/flowsheet.yaml stream S10 composition (calculated by `cheme process simulate`, DESIGN.md
      D-066); T-4101 storage
  suction_pressure:
    value: 1.5
    unit: bar(a)
    source: DESIGN.md D-042 (ASSUMED suction 1.5 bara)
    assumed: true
  suction_temperature:
    value: -179.2
    unit: °C
    source: 'scripts/datasheet_sizing.py (D-053 (8)): bubble point of S10 at 150 kPa(a), 93.97 K, property
      adapter (thermo 0.6.1, PR)'
    assumed: true
  discharge_pressure:
    value: 32.97
    unit: bar(a)
    source: 'scripts/datasheet_sizing.py (D-060 (5)): 150 kPa(a) + rho g H (281.2 m): the GOX header 31
      bara plus the GOX-4004 line, PV-4111 and vaporizer drops (ASSUMED) and the static head to E-4105A'
    assumed: true
design:
  pressure_barg:
    value: 40.0
    unit: barg
    source: equipment/equipment-list.yaml
  temperature_degc:
    value: -196.0
    unit: degC
    source: equipment/equipment-list.yaml
materials:
  main:
    value: SS / bronze
    source: equipment/equipment-list.yaml
dimensions:
  overall_length:
    value: 1.6
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.length; ASSUMED at basic
      engineering (equipment list header, DESIGN.md D-028): the supplier sets it'
    assumed: true
  overall_width:
    value: 0.9
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.width; ASSUMED at basic
      engineering (equipment list header, DESIGN.md D-028): the supplier sets it'
    assumed: true
  overall_height:
    value: 1.4
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.height; ASSUMED at basic
      engineering (equipment list header, DESIGN.md D-028): the supplier sets it'
    assumed: true
  support:
    type:
      value: base_plate
      source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.support; ASSUMED at basic
        engineering (equipment list header, DESIGN.md D-028): the support type is the list''s choice,
        the supplier sets it'
      assumed: true
  axis_deg:
    value: 270.0
    unit: deg
    source: 'cheme datasheets fill: layout/plant-model.yaml P-4101A rotation_deg (layout/equipment-placement.yaml)'
weights:
  empty:
    value: 2.0
    unit: t
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.weight (empty); ASSUMED
      (equipment list header, DESIGN.md D-034): typical size of the duty, the item''s basis in its list
      note; the supplier gives the weight'
    assumed: true
nozzles:
- name: N1
  dn: 80
  lines:
  - LOX-4001
  source: pid/P-04.xml
- name: N2
  dn: 50
  lines:
  - LOX-4002
  source: pid/P-04.xml
type_specific:
  height_m:
    value: 1.4
    unit: m
    source: equipment/equipment-list.yaml dimensions
  length_m:
    value: 1.6
    unit: m
    source: equipment/equipment-list.yaml dimensions
  width_m:
    value: 0.9
    unit: m
    source: equipment/equipment-list.yaml dimensions
  weight_t:
    value: 2.0
    unit: t
    source: equipment/equipment-list.yaml dimensions
  flow_m3_h:
    value: 4.56
    unit: m3/h
    source: 'calculated: 5.2 t/h / 1141 kg/m3 (NIST Chemistry WebBook, saturated liquid at 1 atm (LOX
      1141, LIN 806 kg/m3)) -- equipment list: 5.2 t/h'
    assumed: true
  differential_head_m:
    value: 281.2
    unit: m
    source: 'scripts/datasheet_sizing.py (D-060 (5)), chemeascode pumps.size_pump: H = (3257.8 - 150)
      kPa / (rho g) 277.75 m + static 3.0 m (T-4101/N4 z 1.0 m to E-4105A/N1 z 4.0 m, layout/plant-model.yaml)
      + suction loss 0.014 m + discharge loss 0.476 m (routed LOX-4001 / LOX-4002, schedule 10S ASSUMED,
      Darcy-Weisbach / Colebrook) = 281.2 m; 3257.8 kPa(a) at the vaporizer inlet = GOX header 3100 kPa(a)
      (S8, 31 bara given) + GOX-4004 routed gas line 7.8 kPa (O2 at -15 C, Yoon-Thodos viscosity) + PV-4111
      100 kPa + vaporizer 50 kPa (both ASSUMED until the valve and vaporizer suppliers'' figures); rho
      1141 kg/m3 (D-042)'
    assumed: true
  npsh_available_m:
    value: 0.34
    unit: m
    source: 'scripts/datasheet_sizing.py (D-053 (8), D-055 (5)): NPSHa = (p_tank - p_vap) / (rho g) +
      static - losses with the liquid saturated at the tank pressure (p_tank = p_vap) and no liquid above
      the tank outlet: static 0.35 m (T-4101/N4 at z 1.00 m, the tank on its 0.5 m plinth, suction N1
      at z 0.65 m, layout/plant-model.yaml) - suction loss 0.014 m (routed LOX-4001 S1, S2 falling to
      the pump, schedule 10S ASSUMED, Darcy-Weisbach / Colebrook, rho 1141 kg/m3 D-042, mu 0.177 mPa s
      thermo correlation ASSUMED; the two ball valves have no K in the table and are not counted). The
      liquid above N4 adds to it; the low-low level of LIA-4107 must hold NPSHr (supplier) - 0.34 m +
      margin of liquid above N4'
    assumed: true
  shaft_power_kw:
    value: 7.97
    unit: kW
    source: 'scripts/datasheet_sizing.py (D-060 (5)): P = m g H / eta = 1.444 kg/s x 9.80665 m/s2 x 281.2
      m / 0.5 (pump efficiency 0.5 ASSUMED, D-042)'
    assumed: true
sizing_basis:
- parameter: rating
  value: 5.2 t/h LOX to 31 bara (the GOX backup at 25 % for 2 d, D-017)
  reference: DESIGN.md D-017 / equipment list
notes: '5.2 t/h, cold standby, O2 service, no oil in wetted parts (D-012). ASSUMED. Head (DESIGN.md D-060
  (5)): to the 31 bara GOX header through LOX-4002, E-4105A, PV-4111 and GOX-4004, 32.97 bara rated discharge;
  the 50 kPa vaporizer and 100 kPa control valve drops are ASSUMED until the suppliers'' figures. NPSH:
  the tank outlet T-4101/N4 stands 0.35 m above the pump suction (the tank on a 0.5 m plinth, the suction
  falling to the pump, DESIGN.md D-055 (5)).'
