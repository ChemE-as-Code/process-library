  length_m:
    value: 1.6
    unit: m
    source: equipment/equipment-list.yaml dimensions
  width_m:
    value: 0.9
    unit: m
    source: equipment/equipment-list.yaml dimensions
  weight_t:
    value: 2.0
    unit: t
    source: equipment/equipment-list.yaml dimensions
  flow_m3_h:
    value: 7.82
    unit: m3/h
    source: 'calculated: 6.3 t/h / 806 kg/m3 (NIST Chemistry WebBook, saturated liquid at 1 atm (LOX 1141,
      LIN 806 kg/m3)) -- equipment list: as P-4102A'
    assumed: true
  differential_head_m:
    value: 127.0
    unit: m
    source: 'scripts/datasheet_sizing.py (D-060 (5)), chemeascode pumps.size_pump: H = (1111.8 - 150)
      kPa / (rho g) 121.68 m + static 3.5 m (T-4102/N4 z 1.0 m to E-4106B/N1 z 4.5 m, layout/plant-model.yaml)
      + suction loss 0.039 m + discharge loss 1.724 m (routed LIN-4001 / LIN-4002, schedule 10S ASSUMED,
      Darcy-Weisbach / Colebrook) = 127.0 m; 1111.8 kPa(a) at the vaporizer inlet = GAN header 900 kPa(a)
      (S9B, 9 bara given) + GAN-4003 routed gas line 61.8 kPa (N2 at -15 C, Yoon-Thodos viscosity) + PV-4112
      100 kPa + vaporizer 50 kPa (both ASSUMED until the valve and vaporizer suppliers'' figures); rho
      806 kg/m3 (D-042)'
    assumed: true
  npsh_available_m:
    value: 0.31
    unit: m
    source: 'scripts/datasheet_sizing.py (D-053 (8), D-055 (5)): NPSHa = (p_tank - p_vap) / (rho g) +
      static - losses with the liquid saturated at the tank pressure (p_tank = p_vap) and no liquid above
      the tank outlet: static 0.35 m (T-4102/N4 at z 1.00 m, the tank on its 0.5 m plinth, suction N1
      at z 0.65 m, layout/plant-model.yaml) - suction loss 0.039 m (routed LIN-4001 S1, S3 falling to
      the pump, schedule 10S ASSUMED, Darcy-Weisbach / Colebrook, rho 806 kg/m3 D-042, mu 0.141 mPa s
      thermo correlation ASSUMED; the two ball valves have no K in the table and are not counted). The
      liquid above N4 adds to it; the low-low level of LIA-4108 must hold NPSHr (supplier) - 0.31 m +
      margin of liquid above N4'
    assumed: true
  shaft_power_kw:
    value: 4.36
    unit: kW
    source: 'scripts/datasheet_sizing.py (D-060 (5)): P = m g H / eta = 1.75 kg/s x 9.80665 m/s2 x 127.0
      m / 0.5 (pump efficiency 0.5 ASSUMED, D-042)'
    assumed: true
sizing_basis:
- parameter: rating
  value: as P-4102A, spare
  reference: DESIGN.md D-017 / equipment list
notes: As P-4102A. ASSUMED.
