# Datasheet, first drafted by `cheme datasheets draft` from equipment/equipment-list.yaml, pid/P-04.xml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: P-4102B
type: CentrifugalPump
service: LIN backup pump (spare)
draft: false
operating:
  fluid:
    value: LIN, saturated at the tank pressure
    source: process/flowsheet.yaml stream S11 composition; T-4102 storage
  suction_pressure:
    value: 1.5
    unit: bar(a)
    source: DESIGN.md D-042 (ASSUMED suction 1.5 bara)
    assumed: true
  suction_temperature:
    value: -192.4
    unit: °C
    source: 'scripts/datasheet_sizing.py (D-053 (8)): bubble point of S11 at 150 kPa(a), 80.77 K, property
      adapter (thermo 0.6.1, PR)'
    assumed: true
  discharge_pressure:
    value: 11.53
    unit: bar(a)
    source: 'scripts/datasheet_sizing.py (D-060 (5)): 150 kPa(a) + rho g H (127.0 m): the GAN header 9
      bara plus the GAN-4003 line, PV-4112 and vaporizer drops (ASSUMED) and the static head to E-4106B'
    assumed: true
design:
  pressure_barg:
    value: 15.0
    unit: barg
    source: equipment/equipment-list.yaml
  temperature_degc:
    value: -196.0
    unit: degC
    source: equipment/equipment-list.yaml
