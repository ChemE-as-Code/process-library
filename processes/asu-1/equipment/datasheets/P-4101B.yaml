    value: LOX (O2 99.5 %), saturated at the tank pressure
    source: process/flowsheet.yaml stream S10 composition; T-4101 storage
  suction_pressure:
    value: 1.5
    unit: bar(a)
    source: DESIGN.md D-042 (ASSUMED suction 1.5 bara)
    assumed: true
  suction_temperature:
    value: -179.2
    unit: °C
    source: 'scripts/datasheet_sizing.py (D-053 (8)): bubble point of S10 at 150 kPa(a), 93.97 K, property
      adapter (thermo 0.6.1, PR)'
    assumed: true
  discharge_pressure:
    value: 32.97
    unit: bar(a)
    source: 'scripts/datasheet_sizing.py (D-060 (5)): 150 kPa(a) + rho g H (281.2 m): the GOX header 31
      bara plus the GOX-4004 line, PV-4111 and vaporizer drops (ASSUMED) and the static head to E-4105B'
    assumed: true
