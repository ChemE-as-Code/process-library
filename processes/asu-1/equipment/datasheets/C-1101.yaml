- name: I4
  lines: []
  source: pid/P-01.xml (LSLL-1115 chimney tray level low-low, own tapping, D-076)
  face: side
  orientation_deg: 15
  elevation_m: 13.1
  location_source: layout/equipment-placement.yaml (beside I3, 15 deg north of east, 0.1 m above the chimney
