type_specific:
  chimney_tray_overflow:
    value: 'overflow downcomer from the chimney tray to the lower section, set above the LIC-1114 / LSLL-1115
      range, rated for the whole upper-section liquid: 38 m3/h (34.4 m3/h chilled water + 0.24 m3/h
      condensate, + 10 %, ASSUMED) with LV-1114 or XV-1115 closed'
    source: 'DESIGN.md D-076 (layout-review11#4 (b)): when LV-1114 fails closed (instrument air) or XV-1115
      trips, the chilled water overflows to the lower section instead of flooding the upper bed (carry-over
      into AIR-1004 and the TSA); the lower section then bleeds it through LV-1106 / CWR-1001 and C-1102 takes
      make-up through LV-1107 (CW-1003). The packing supplier designs the tray, its seal and the downcomer'
    assumed: true
  diameter_m:
    value: 4.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  height_m:
    value: 25.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  volume_m3:
    value: 314.159
    unit: m3
    source: 'equipment/equipment-list.yaml dimensions: pi/4 D^2 x height (overall, including heads and
      skirt: an upper bound)'
    assumed: true
  number_of_stages:
    value: not_applicable
    unit: ''
    reason: a direct contact aftercooler (air cooled and dried by water on packing), not a distillation;
      its packing is sized in transfer units (packing_height_lower_m / _upper_m), not in stages
  duty_kw:
    value: 1350
    unit: kW
    source: 'process/flowsheet.yaml energy stream Q2 and step C1101U (calculated, `cheme process simulate`,
      DWSIM Peng-Robinson, DESIGN.md D-067): lower section 710.2 kW to cooling water (S2 40 C 5.8 bara ->
      S3L 27 C 5.75 bara) + upper section 640.2 kW to the C-1102 chilled water (S3L -> S3 12 C 5.7 bara).
      Cross-check scripts/datasheet_sizing.py section 9 (DESIGN.md D-068 (8)), IAPWS-95 water: 676 + 623 kW'
    assumed: true
  duty_lower_kw:
    value: 710
    unit: kW
    source: 'process/flowsheet.yaml energy stream Q2 (DWSIM, DESIGN.md D-067): 710.2 kW to the 250 m3/h of
      cooling water (P-1101A/B), which warms 2.4 K'
    assumed: true
  duty_upper_kw:
    value: 640
    unit: kW
    source: '`cheme process simulate` step C1101U (DESIGN.md D-067): 640.2 kW to the chilled water, 10 -> 26 C
      (D-067, ASSUMED): 34.4 m3/h (scripts/datasheet_sizing.py section 12 (DESIGN.md D-068 (8)))'
    assumed: true
  gas_load_factor_pa05:
    value: 0.971
    unit: Pa^0.5
    source: 'scripts/datasheet_sizing.py section 9 (DESIGN.md D-068 (8)): F = u rho^0.5 at the bottom, 111,748 kg/h (S2) at 40 C,
      580 kPa(a) (rho 6.466 kg/m3, property adapter, dry gas), D 4.0 m (equipment list): u 0.382 m/s'
    assumed: true
  liquid_load_lower_m3_m2h:
    value: 19.9
    unit: m3/(m2 h)
    source: 'scripts/datasheet_sizing.py section 9 (DESIGN.md D-068 (8)): 250 m3/h CW (P-1101A/B) over 12.57 m2'
    assumed: true
  liquid_load_upper_m3_m2h:
    value: 2.74
    unit: m3/(m2 h)
    source: 'scripts/datasheet_sizing.py section 9 (DESIGN.md D-068 (8)): 34.4 m3/h chilled water (10 -> 26 C, D-067) over 12.57
      m2; low for packing wetting: the supplier confirms the packing and distributor for it, or a
      recirculation of the upper section'
    assumed: true
  packing_height_lower_m:
    value: supplier
    unit: m
    source: 'packing supplier: the CW section''s height follows from the heat and mass transfer
      coefficients of the chosen packing (transfer units). Enquiry basis: 710 kW (40 -> 27 C, 427 kg/h
      condensed, D-067), CW 250 m3/h at 25 C, gas F 0.97 Pa^0.5, liquid load 19.9 m3/(m2 h)'
  packing_height_upper_m:
    value: supplier
    unit: m
    source: 'packing supplier: the chilled water section''s height (transfer units of the chosen packing).
      Enquiry basis: 640 kW, air 27 -> 12 C, chilled water 34.4 m3/h at 10 C from C-1102 returning at ~26 C
      (D-067) from a chimney tray to C-1102 (CHWR-1001, D-069), 237 kg/h condensed into it, liquid load 2.74
      m3/(m2 h)'
  flooding_diameter_m:
    value: supplier
    unit: m
    source: 'packing supplier''s hydraulic rating (no flooding correlation in cheme-as-code is cleanly
      sourced); the 4.0 m of the equipment list (ASSUMED) runs at F 0.97 Pa^0.5 and 19.9 m3/(m2 h)'
  process_streams:
  - stream: S2
    direction: in
    title: Compressed air
    source: process/flowsheet.yaml (case design)
  - stream: S3
    direction: out
    title: Precooled air
    source: process/flowsheet.yaml (case design)
  minimum_stages:
    value: not_applicable
    unit: ''
    reason: Fenske minimum stages apply to a distillation; a direct contact cooler has no key components
  minimum_reflux_ratio:
    value: not_applicable
    unit: ''
    reason: no reflux in a direct contact cooler
  theoretical_stages:
    value: not_applicable
    unit: ''
    reason: a direct contact cooler is sized in transfer units, not theoretical stages
sizing_basis: []
notes: 'Two packed sections (CW lower to 27 C, chilled water upper to 12 C, DESIGN.md D-067), mist
  eliminator, air 40 -> 12 C. ASSUMED. DESIGN.md D-060 (3), D-063, D-068 (8): duties from the DWSIM simulation
  (D-066 air, D-067 sections), hydraulic loads calculated; packing heights and the flooding diameter are the
  packing supplier''s (markers); the stage fields do not apply (not a distillation). The lower section''s 427
  kg/h condensate leaves with the sump water (LV-1106, D-064); a chimney tray under the upper bed collects the
  chilled water with its 237 kg/h condensate and returns it to C-1102 (CHWR-1001, LIC-1114 / LV-1114, D-069).'
