- name: N4
  dn: 150
  lines:
  - CHW-1001
  source: pid/P-01.xml
  face: side
  orientation_deg: 270
  elevation_m: 19.833
  location_source: layout/equipment-placement.yaml (DESIGN.md D-044 (2), south face outside the platform
