# Datasheet, first drafted by `cheme datasheets draft` from equipment/equipment-list.yaml, pid/P-01.xml, process/flowsheet.yaml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: C-1101
type: ProcessColumn
service: Direct contact aftercooler (DCAC)
draft: false
operating:
  inlet_pressure:
    value: 5.8
    unit: bar(a)
    source: 'process/flowsheet.yaml stream S2 (case design), assumed: DESIGN.md 3, stream 2'
    assumed: true
  inlet_temperature:
    value: 40.0
    unit: °C
    source: 'process/flowsheet.yaml stream S2 (case design), assumed: DESIGN.md 3, stream 2'
    assumed: true
  inlet_flow:
    value: 111748.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S2 (case design), calculated by `cheme process simulate`
      (DESIGN.md D-066): wet air after the MAC condensate drains, 1.16 mol% water'
    assumed: true
  intermediate_temperature:
    value: 27.0
    unit: °C
    source: 'process/flowsheet.yaml stream S3L (case design), assumed: DESIGN.md D-067, the lower section
      on cooling water (25 C supply), 2 K approach; the air between the sections'
    assumed: true
  outlet_pressure:
    value: 5.7
    unit: bar(a)
    source: 'process/flowsheet.yaml stream S3 (case design), assumed: DESIGN.md 3, stream 3'
    assumed: true
  outlet_temperature:
    value: 12.0
    unit: °C
    source: 'process/flowsheet.yaml stream S3 (case design), assumed: DESIGN.md 3, stream 3'
    assumed: true
  outlet_flow:
    value: 111085.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S3 (case design), assumed: DESIGN.md D-066, S4 110,870 kg/h + the
      215 kg/h H2O and CO2 the adsorbers remove'
    assumed: true
  condensate_flow:
    value: 426.6
    unit: kg/h
    source: 'process/flowsheet.yaml stream S3C (case design), calculated by `cheme process simulate`
      (DESIGN.md D-067): condensed in the lower section into the cooling water (bled with the DCAC sump
      water by LV-1106; IAPWS-95 gives 380 kg/h, scripts/datasheet_sizing.py section 9 (DESIGN.md D-068 (8)))'
    assumed: true
  condensate_flow_upper:
    value: 236.7
    unit: kg/h
    source: 'process/flowsheet.yaml stream S3CU (case design), calculated by `cheme process simulate`
      (DESIGN.md D-067): condensed in the upper section into the chilled water, returned with it to C-1102
      (IAPWS-95 gives 214 kg/h, scripts/datasheet_sizing.py section 9 (DESIGN.md D-068 (8)))'
    assumed: true
design:
