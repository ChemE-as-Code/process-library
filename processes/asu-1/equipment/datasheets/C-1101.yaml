# Datasheet, first drafted by `cheme datasheets draft` from equipment/equipment-list.yaml, pid/P-01.xml, process/flowsheet.yaml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: C-1101
type: ProcessColumn
service: Direct contact aftercooler (DCAC)
draft: false
operating:
  inlet_pressure:
    value: 5.98
    unit: bar(a)
    source: 'process/flowsheet.yaml stream S2 (case design), assumed: DESIGN.md D-079 (front-end pressure profile,
      was 5.8)'
    assumed: true
  inlet_temperature:
    value: 40.0
    unit: °C
    source: 'process/flowsheet.yaml stream S2 (case design), assumed: DESIGN.md 3, stream 2'
    assumed: true
  inlet_flow:
    value: 111725.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S2 (case design), calculated by `cheme process simulate`
      (DESIGN.md D-079): wet air after the MAC condensate drains, 1.13 mol% water'
    assumed: true
  intermediate_temperature:
    value: 27.0
    unit: °C
    source: 'process/flowsheet.yaml stream S3L (case design), assumed: DESIGN.md D-067, the lower section
      on cooling water (25 C supply), 2 K approach; the air between the sections'
    assumed: true
  outlet_pressure:
    value: 5.88
    unit: bar(a)
    source: 'process/flowsheet.yaml stream S3 (case design), assumed: DESIGN.md D-079 (5 kPa per section, was
      5.7)'
    assumed: true
  outlet_temperature:
    value: 12.0
    unit: °C
    source: 'process/flowsheet.yaml stream S3 (case design), assumed: DESIGN.md 3, stream 3'
    assumed: true
  outlet_flow:
    value: 111081.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S3 (case design), assumed: DESIGN.md D-079, S4 110,870 kg/h + the
      211 kg/h H2O and CO2 the adsorbers remove (143 kg/h H2O at 5.88 bara)'
    assumed: true
  condensate_flow:
    value: 414.1
    unit: kg/h
    source: 'process/flowsheet.yaml stream S3C (case design), calculated by `cheme process simulate`
      (DESIGN.md D-079): condensed in the lower section into the cooling water (bled with the DCAC sump
      water by LV-1106; IAPWS-95 gives 369 kg/h, scripts/datasheet_sizing.py section 9 (DESIGN.md D-080 (2)))'
    assumed: true
  condensate_flow_upper:
    value: 229.8
    unit: kg/h
    source: 'process/flowsheet.yaml stream S3CU (case design), calculated by `cheme process simulate`
      (DESIGN.md D-079): condensed in the upper section into the chilled water, returned with it to C-1102
      (IAPWS-95 gives 208 kg/h, scripts/datasheet_sizing.py section 9 (DESIGN.md D-080 (2)))'
    assumed: true
design:
  pressure_barg:
    value: 8.0
    unit: barg
    source: equipment/equipment-list.yaml
  temperature_degc:
    value: 120.0
    unit: degC
    source: equipment/equipment-list.yaml
materials:
  main:
    value: CS / SS packing
    source: equipment/equipment-list.yaml
