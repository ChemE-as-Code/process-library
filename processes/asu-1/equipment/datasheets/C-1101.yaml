- name: I1
  lines: []
  source: pid/P-01.xml
- name: I2
  lines: []
  source: pid/P-01.xml
- name: I3
  lines: []
  source: pid/P-01.xml (LIC-1114 chimney tray level, D-069)
  face: side
  orientation_deg: 0
  elevation_m: 13.1
  location_source: layout/equipment-placement.yaml (east side, 0.1 m above the chimney tray floor, 1.8
