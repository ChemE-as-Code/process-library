# Datasheet, first drafted by `cheme datasheets draft` from equipment/equipment-list.yaml, pid/P-01.xml, process/flowsheet.yaml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: C-1101
type: ProcessColumn
service: Direct contact aftercooler (DCAC)
draft: false
operating:
  inlet_pressure:
    value: 6.02
    unit: bar(a)
    source: 'process/flowsheet.yaml stream S2 (case design), assumed: DESIGN.md D-089 (front-end pressure
      profile at the DN700 bound; D-079 5.98, before it 5.8)'
    assumed: true
  inlet_temperature:
    value: 40.0
    unit: °C
    source: 'process/flowsheet.yaml stream S2 (case design), assumed: DESIGN.md 3, stream 2'
    assumed: true
  inlet_flow:
    value: 111720.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S2 (case design), calculated by `cheme process simulate` (DESIGN.md
      D-089): wet air after the MAC condensate drains, 1.12 mol% water'
    assumed: true
  intermediate_temperature:
    value: 27.0
    unit: °C
    source: 'process/flowsheet.yaml stream S3L (case design), assumed: DESIGN.md D-067, the lower section
      on cooling water (25 C supply), 2 K approach; the air between the sections'
    assumed: true
  outlet_pressure:
    value: 5.92
    unit: bar(a)
    source: 'process/flowsheet.yaml stream S3 (case design), assumed: DESIGN.md D-089 (5 kPa per section;
      D-079 5.88, before it 5.7)'
    assumed: true
  outlet_temperature:
    value: 12.0
    unit: °C
    source: 'process/flowsheet.yaml stream S3 (case design), assumed: DESIGN.md 3, stream 3'
    assumed: true
  outlet_flow:
    value: 111080.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S3 (case design), assumed: DESIGN.md D-089, S4 110,870 kg/h
      + the 210 kg/h H2O and CO2 the adsorbers remove (142.1 kg/h H2O at 5.92 bara, the simulated stream
      3)'
    assumed: true
  condensate_flow:
    value: 411.5
    unit: kg/h
    source: 'process/flowsheet.yaml stream S3C (case design), calculated by `cheme process simulate` (DESIGN.md
      D-089): condensed in the lower section into the cooling water (bled with the DCAC sump water by
      LV-1106; IAPWS-95 gives 367 kg/h, scripts/datasheet_sizing.py section 9 (DESIGN.md D-090))'
    assumed: true
  condensate_flow_upper:
    value: 228.3
    unit: kg/h
    source: 'process/flowsheet.yaml stream S3CU (case design), calculated by `cheme process simulate`
      (DESIGN.md D-089): condensed in the upper section into the chilled water, returned with it to C-1102
      (IAPWS-95 gives 207 kg/h, scripts/datasheet_sizing.py section 9 (DESIGN.md D-090))'
    assumed: true
design:
  pressure_barg:
    value: 8.0
    unit: barg
    source: equipment/equipment-list.yaml
  temperature_degc:
    value: 120.0
    unit: degC
    source: equipment/equipment-list.yaml
materials:
  main:
    value: CS / SS packing
    source: equipment/equipment-list.yaml
dimensions:
  orientation: vertical
  outside_diameter:
    value: 4.0
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.diameter'
  overall_height:
    value: 25.0
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.height'
  head:
    value: ellipsoidal_2_1
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.head'
  support:
    type:
      value: skirt
      source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.support'
    height:
      value: 4.0
      unit: m
      source: 'cheme datasheets fill: layout/plant-model.yaml parts C-1101/shell, C-1101/skirt: the bottom
        tangent line above the base (the 3D model''s proportions, not a design)'
      assumed: true
  tangent_length:
    value: 20.0
    unit: m
    source: 'cheme datasheets fill: layout/plant-model.yaml part C-1101/shell: the generated shell between
      the heads (the 3D model''s proportions, not a vessel design)'
    assumed: true
weights:
  empty:
    value: 52.0
    unit: t
    source: 'DESIGN.md D-081 (5), equipment list dimensions.weight: shell 18 mm (8 barg, f 125 N/mm2
      CS at 120 C, J 0.85, 3 mm corrosion allowance; Sinnott, C&R Vol. 6, 4th ed., Section 13.5) over the
      20.0 m T-T and 2:1 heads, weight factor 1.15 for a column with manways, tray and packing supports
      (Sinnott Section 13.8, dead weight) = 47 t, skirt 4.0 m x 12 mm = 5 t; packing and chimney tray internals not
      included (packing supplier). ASSUMED: the vessel supplier gives the weight'
    assumed: true
