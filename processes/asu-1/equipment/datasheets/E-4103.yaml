    assumed: true
  overall_u_w_m2k:
    value: 160
    unit: W/(m2 K)
    source: 'ASSUMED design typical, middle of 20-300 W/(m2 K), Sinnott, Coulson & Richardson''s Chemical
      Engineering Vol. 6, 4th ed. (2005), Table 12.1, p. 637: cooler, gases / water (DESIGN.md D-053)'
    assumed: true
  area_m2:
    value: 33.86
    unit: m2
    source: 'scripts/datasheet_sizing.py section 3 (DESIGN.md D-063 (5)): A = Q / (U F LMTD) = 123.8 kW
      / (160 x 0.897 x 25.47 K), no margin'
    assumed: true
sizing_basis: []
notes: GAN to 40 C. ASSUMED.
