# Datasheet, first drafted by `cheme datasheets draft` from equipment/equipment-list.yaml, pid/P-04.xml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: E-4103
type: TubularHeatExchanger
service: GAN compressor aftercooler
draft: false
operating:
  outlet_temperature:
    value: 40
    unit: °C
    source: 'equipment/equipment-list.yaml notes: GAN to 40 C'
    assumed: true
  gan_inlet_pressure:
    value: 9.0
    unit: bar(a)
    source: K-4102 outlet = process/flowsheet.yaml stream S9B (no aftercooler pressure drop, ASSUMED)
    assumed: true
  gan_inlet_temperature:
    value: 75.0
    unit: °C
    source: 'scripts/datasheet_sizing.py section 3 (DESIGN.md D-063 (5)): K-4102 discharge 348.11 K from
      the 13 C suction (ideal gas, Cp/Cv 1.411 at the suction, eta_s 0.80 ASSUMED; discharge_temperature_k
      of equipment/datasheets/K-4102.yaml)'
    assumed: true
  gan_flow:
    value: 12510
    unit: kg/h
    source: process/flowsheet.yaml stream S9B (case design)
  cooling_water_temperatures:
    value: 25 -> 35
    unit: °C
    source: process/design-basis.yaml utilities
  cooling_water_flow:
    value: 10.7
    unit: m3/h
    source: 'scripts/datasheet_sizing.py section 3 (DESIGN.md D-063 (5)): Q / (cp 10 K), IAPWS-95 water
      at 30 C'
    assumed: true
design:
  pressure_barg:
    value: 11.0
    unit: barg
    source: equipment/equipment-list.yaml
  temperature_degc:
    value: 150.0
    unit: degC
    source: equipment/equipment-list.yaml
materials:
  main:
    value: CS shell / SS tubes
    source: equipment/equipment-list.yaml
dimensions:
  orientation: horizontal
  outside_diameter:
    value: 1.0
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.diameter; ASSUMED at basic
      engineering (equipment list header, DESIGN.md D-028): the supplier sets it'
    assumed: true
  overall_length:
    value: 4.0
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.length; ASSUMED at basic
      engineering (equipment list header, DESIGN.md D-028): the supplier sets it'
    assumed: true
  overall_height:
    value: 1.8
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.height (top of the shell on
      its supports); ASSUMED at basic engineering (equipment list header, DESIGN.md D-028): the supplier
      sets it'
    assumed: true
  head:
    value: ellipsoidal_2_1
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.head; ASSUMED at basic
      engineering (equipment list header, DESIGN.md D-028): the head type is the list''s choice, the
      supplier sets it'
    assumed: true
  support:
    type:
      value: saddles
