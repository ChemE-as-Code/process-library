        engineering (equipment list header, DESIGN.md D-028): the support type is the list''s choice,
        the supplier sets it'
      assumed: true
    height:
      value: 0.8
      unit: m
      source: 'cheme datasheets fill: layout/plant-model.yaml part E-4103/shell: underside of the shell
        above the base (the 3D model''s proportions, not a design)'
      assumed: true
  tangent_length:
    value: 3.27
    unit: m
    source: 'cheme datasheets fill: layout/plant-model.yaml part E-4103/shell: the generated shell between
      the heads (the 3D model''s proportions, not a vessel design)'
    assumed: true
  axis_deg:
    value: 0.0
    unit: deg
    source: 'cheme datasheets fill: layout/plant-model.yaml E-4103 rotation_deg (layout/equipment-placement.yaml)'
