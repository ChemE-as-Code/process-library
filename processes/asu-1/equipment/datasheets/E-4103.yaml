  length_m:
    value: 4.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  weight_t:
    value: 4.0
    unit: t
    source: equipment/equipment-list.yaml dimensions
  duty_kw:
    value: 123.8
    unit: kW
    source: 'scripts/datasheet_sizing.py section 3 (DESIGN.md D-063 (5)): Q = m cp (348.11 - 313.15 K),
      12,510 kg/h, cp from the property adapter''s Cp/Cv 1.411 of S9 at the suction (286.15 K, 520 kPa(a));
      the DWSIM simulation gives Q4 123.4 kW (D-061)'
    assumed: true
  lmtd_k:
    value: 25.47
    unit: K
    source: 'scripts/datasheet_sizing.py section 3 (DESIGN.md D-063 (5)): GAN 348.11 -> 313.15 K, CW 298.15
      -> 308.15 K'
    assumed: true
  lmtd_correction_f:
    value: 0.897
    unit: ''
    source: 'scripts/datasheet_sizing.py section 3 (DESIGN.md D-063 (5)): 1-2 shell and tube (ASSUMED),
