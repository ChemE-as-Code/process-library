# Datasheet, first drafted by `cheme datasheets draft` from equipment/equipment-list.yaml, pid/P-03.xml, process/flowsheet.yaml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: C-3101
type: ProcessColumn
service: HP column
operating:
  top_pressure:
    value: 5.3
    unit: bar(a)
    source: process/simulation.yaml C3101 condenser_pressure (ASSUMED; HP column top 5.4 bara less the
      condenser, D-059)
    assumed: true
  top_temperature:
    value: -178.45
    unit: °C
    source: '`cheme process simulate` (DWSIM, DESIGN.md D-066): C3101 top 94.705 K'
    assumed: true
  bottom_pressure:
    value: 5.5
    unit: bar(a)
    source: process/simulation.yaml C3101 reboiler_pressure (ASSUMED, = S5)
    assumed: true
  bottom_temperature:
    value: -173.68
    unit: °C
    source: '`cheme process simulate` (DWSIM, DESIGN.md D-066): C3101 bottom 99.468 K (S13)'
    assumed: true
  gan_vapour_flow:
    value: 12510.0
    unit: kg/h
    source: process/flowsheet.yaml stream S14 (given, GAN product; D-066 O2 0.2 ppm)
  ln_reflux_flow:
    value: 29280.0
    unit: kg/h
    source: 'process/simulation.yaml C3101 condenser_spec (ASSUMED, D-066: 0.305 x the HP air; above about
      0.31 the GAN O2 rises steeply); was 24,530'
    assumed: true
  crude_flow:
    value: 53740.0
    unit: kg/h
    source: process/flowsheet.yaml stream S13 (calculated, D-066; 38.5 % O2); was 45,680
    assumed: true
  lin_side_draw_flow:
    value: 470.0
    unit: kg/h
    source: process/simulation.yaml C3101 side draw lin, stage 2, liquid (ASSUMED, LIN product, D-017)
    assumed: true
  inlet_pressure:
    value: 5.5
    unit: bar(a)
    source: 'process/flowsheet.yaml stream S5 (case design), assumed: DESIGN.md 3, stream 5'
    assumed: true
  inlet_temperature:
    value: -173.0
    unit: °C
    source: 'process/flowsheet.yaml stream S5 (case design), assumed: DESIGN.md 3, stream 5'
    assumed: true
  inlet_flow:
    value: 96000.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S5 (case design), assumed: DESIGN.md D-066, the HP column air
      for GOX 99.5 % with margin (+15 % on the former 83,190 kg/h)'
    assumed: true
design:
  pressure_barg:
    value: 7.0
    unit: barg
    source: equipment/equipment-list.yaml
  temperature_degc:
    value: -196.0
    unit: degC
    source: equipment/equipment-list.yaml
materials:
  main:
    value: Aluminium 5083
    source: equipment/equipment-list.yaml
dimensions:
  orientation: vertical
  outside_diameter:
    value: 4.2
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.diameter; ASSUMED at basic
      engineering (equipment list header, DESIGN.md D-028): the supplier sets it'
    assumed: true
  overall_height:
    value: 20.0
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.height; ASSUMED at basic
      engineering (equipment list header, DESIGN.md D-028): the supplier sets it'
    assumed: true
  head:
    value: ellipsoidal_2_1
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.head'
  support:
    type:
      value: skirt
      source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.support'
    height:
      value: 3.45
      unit: m
      source: 'cheme datasheets fill: layout/plant-model.yaml parts C-3101/shell, C-3101/skirt: the bottom
        tangent line above the base (the 3D model''s proportions, not a design)'
      assumed: true
  tangent_length:
    value: 15.5
    unit: m
    source: 'cheme datasheets fill: layout/plant-model.yaml part C-3101/shell: the generated shell between
      the heads (the 3D model''s proportions, not a vessel design)'
    assumed: true
weights:
  empty:
    value: 25.0
    unit: t
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.weight (empty); ASSUMED
      (equipment list header, DESIGN.md D-034): typical size of the duty, the item''s basis in its list
      note, cross-checked in D-081 (5); the supplier gives the weight'
    assumed: true
nozzles:
- name: N1
  dn: 500
  lines:
  - AIR-3001
  source: pid/P-03.xml
  face: side
  orientation_deg: 0
  elevation_m: 5.8
  location_source: layout/equipment-placement.yaml (towards E-3101 / E-3102, east)
- name: N2
  dn: 250
  lines:
  - GAN-3001
  source: pid/P-03.xml
  face: side
  orientation_deg: 30
  elevation_m: 15.1
  location_source: layout/equipment-placement.yaml (towards the north casing face)
- name: N3
  dn: 300
  lines:
  - GAN-3002
  source: pid/P-03.xml
  face: top
  orientation_deg: 180
  offset_m: 0.315
  elevation_m: 19.988
  location_source: layout/plant-model.yaml (top head into the E-3103 sump, DESIGN.md D-028)
- name: N4
  dn: 150
  lines:
  - LN-3002
  source: pid/P-03.xml
  face: top
  orientation_deg: 0
  offset_m: 0.315
  elevation_m: 19.988
  location_source: layout/plant-model.yaml (top head from the E-3103 sump, DESIGN.md D-028)
- name: N5
  dn: 100
  lines:
  - LN-3001
  source: pid/P-03.xml
  face: side
  orientation_deg: 0
  elevation_m: 15.075
  location_source: layout/plant-model.yaml (the side the P&ID draws it on)
- name: N6
  dn: 100
  lines:
  - RL-3001
  source: pid/P-03.xml
  face: bottom
  elevation_m: 2.4
  location_source: layout/plant-model.yaml (bottom head, on the axis)
- name: N7
  dn: 150
  lines:
  - VNT-3003
  source: pid/P-03.xml
  face: side
  orientation_deg: 90
  elevation_m: 18.8
  location_source: layout/equipment-placement.yaml (PSV-3116 inlet to the side, C-3102 on the top head)
- name: N8
  dn: 50
  lines: []
  source: pid/P-03.xml
  face: side
  orientation_deg: 180
  elevation_m: 11.2
  location_source: layout/plant-model.yaml (the side the P&ID draws it on)
- name: I1
  lines: []
  source: pid/P-03.xml
- name: I2
  lines: []
  source: pid/P-03.xml
type_specific:
  diameter_m:
    value: 4.2
    unit: m
    source: equipment/equipment-list.yaml dimensions
  height_m:
    value: 20.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  weight_t:
    value: 25.0
    unit: t
    source: equipment/equipment-list.yaml dimensions
  volume_m3:
    value: 277.088
    unit: m3
    source: 'equipment/equipment-list.yaml dimensions: pi/4 D^2 x height (overall, including heads and
      skirt: an upper bound)'
    assumed: true
  minimum_stages:
    value: 15.94
    unit: ''
    source: 'scripts/datasheet_sizing.py section 6 (DESIGN.md D-068 (6)): Fenske, keys N2/O2 (Ar a non-key),
      distillate S14 (DWSIM: O2 0.2 ppm, D-066), bottoms S13 (DWSIM: 38.5 % O2), alpha N2/O2 2.564 geometric
      mean of the top dew point (530 kPa(a), 94.71 K) and the bottom bubble point (550 kPa(a), 99.47 K),
      property adapter (thermo 0.6.1, PR); Fenske, Ind. Eng. Chem. 24 (1932) 482'
    assumed: true
  minimum_reflux_ratio:
    value: 1.2
    unit: ''
    source: 'scripts/datasheet_sizing.py section 6 (DESIGN.md D-068 (6)): Underwood, theta 1.4018, feed
      S5 as saturated vapour (q 0, ASSUMED: ''cooled close to its dew point'', DESIGN.md 1); Underwood,
      Chem. Eng. Prog. 44 (1948) 603; inputs as minimum_stages'
    assumed: true
  reflux_ratio:
    value: 1.391
    unit: ''
    source: '`cheme process simulate` (DWSIM, DESIGN.md D-066): C3101 reflux ratio 1.39066, 1.16 x the
      Underwood minimum'
    assumed: true
  vapour_load_change:
    value: 15
    unit: '%'
    source: 'DESIGN.md D-066: the HP column air S5 96,000 against 83,190 kg/h (+15.4 %); at the same capacity
      factor the 4.2 m column becomes about 4.5 m (D x sqrt(1.154), ASSUMED scaling), for the cold box
      supplier''s rating'
    assumed: true
  theoretical_stages:
    value: 40
    unit: ''
    source: 'process/simulation.yaml C3101 stages 40, solved by `cheme process simulate` (DWSIM, Peng-Robinson,
      DESIGN.md D-059): partial condenser (E-3103), no reboiler, the air S5 below the bottom stage (feed
      stage 40), LIN side draw from stage 2'
    assumed: true
  feed_stage:
    value: 40
    unit: ''
    source: process/simulation.yaml C3101 feed_stage (bottom stage, DESIGN.md D-059)
    assumed: true
  lin_draw_stage:
    value: 2
    unit: ''
    source: process/simulation.yaml C3101 side draw lin (DESIGN.md D-059)
    assumed: true
  condenser:
    value: partial (E-3103, the condenser-reboiler in the C-3102 sump)
    source: process/simulation.yaml C3101 condenser partial (DESIGN.md D-066); E-3103 condenses 4,172
      kW
    assumed: true
  number_of_stages:
    value: supplier
    unit: ''
    reason: 'the number of real trays or the packed height follows from the cold box supplier''s tray
      efficiency or HETP for the chosen internals; enquiry basis: 40 theoretical stages, reflux ratio
      1.39, 96,000 kg/h air below the bottom stage, LN 29,280 kg/h, LIN drawn from stage 2'
  packing_height_m:
    value: supplier
    unit: m
    reason: 'cold box supplier: HETP of the chosen structured packing (or trays) times the 40 theoretical
      stages, with distributors; no HETP correlation in cheme-as-code is cleanly sourced'
  flooding_diameter_m:
    value: supplier
    unit: m
    reason: cold box supplier's hydraulic rating at the simulated vapour and liquid loads (no flooding
      correlation in cheme-as-code is cleanly sourced); the 4.2 m of the equipment list is ASSUMED and
      sees 15 % more vapour since D-066 (about 4.5 m at the same capacity factor)
  process_streams:
  - stream: S5
    direction: in
    title: HP column feed
    source: process/flowsheet.yaml (case design)
  - stream: S13
    direction: out
    title: Crude oxygen
    source: process/flowsheet.yaml (case design)
  - stream: S14
    direction: out
    title: Cold HP nitrogen
    source: process/flowsheet.yaml (case design)
  - stream: S11
    direction: out
    title: LIN to storage
    source: process/flowsheet.yaml (case design)
  - stream: S18
    direction: out
    title: LN reflux to the LP column
    source: process/flowsheet.yaml (case design)
sizing_basis:
- parameter: stages, reflux, temperatures
  value: the DWSIM double-column simulation (Peng-Robinson, Ar/O2 kij 0.0143 fitted to the REFPROP mixture
    model)
  reference: DESIGN.md D-066
notes: 'Structured packing or sieve trays, top 5.3 bara. ASSUMED. DESIGN.md D-066, D-068 (6): 40 theoretical
  stages, 96,000 kg/h air (+15 % vapour), reflux ratio 1.39 (1.16 x Rmin 1.20), LN 29,280 kg/h, top -178.45
  C, bottom -173.68 C from the double-column simulation; GAN at 0.2 ppm O2 meets D-004. Real stages, packing
  height and diameter are the cold box supplier''s (markers).'
