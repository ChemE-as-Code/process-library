type_specific:
  height_m:
    value: 5.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  length_m:
    value: 12.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  width_m:
    value: 6.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  fluid_power_kw:
    value: 6747
    unit: kW
    source: '`cheme process simulate` (DWSIM 9.0.5, Peng-Robinson; DESIGN.md D-066, process/simulation-run.json):
      K1101 compressor power 6,747.4 kW for the wet air S1 (113,329 kg/h, 80 % RH), 3 stages at isentropic
      efficiency 0.82, intercooled to 40 C, 0.05 bar per cooler (process/simulation.yaml, ASSUMED).
      Cross-check scripts/datasheet_sizing.py section 1 (DESIGN.md D-068 (2)), ideal gas with Cp/Cv at each
      stage suction: 6,763 kW'
    assumed: true
  shaft_power_kw:
    value: 6747
    unit: kW
    source: '`cheme process simulate` (DESIGN.md D-066): K1101 shaft 6,747.4 kW = the compressor power;
      the gear and bearing losses are in the drive efficiency below'
    assumed: true
  electric_power_kw:
    value: 7133
    unit: kW
    source: 'process/flowsheet.yaml energy stream E1 (calculated, `cheme process simulate`, DESIGN.md
      D-066): 7,132.6 kW = shaft / drive efficiency 0.946'
    assumed: true
  motor_rating_kw:
    value: 9000
    unit: kW
    source: 'DESIGN.md D-066 (ASSUMED, was 8,000): the motor output at the design point 7,133 x 0.97 = 6,919
      kW; pro rata at the 90,000 Nm3/h rating 7,478 kW electric, 7,254 kW output; 110 % of that (API 617
      driver margin) 7,979 kW, which leaves an 8.0 MW motor no margin and a 9.0 MW motor 12.8 %
      (scripts/datasheet_sizing.py section 1 (DESIGN.md D-068 (2))). 6.6 kV; starting method and supply
      in DESIGN.md D-070'
    assumed: true
  drive_efficiency:
    value: 0.946
    source: process/simulation.yaml K1101 (ASSUMED, D-057; 6.6 kV motor 0.97 x integral gear and bearings
      0.975)
    assumed: true
  isentropic_efficiency:
    value: 0.82
    source: process/simulation.yaml K1101 (ASSUMED per stage until the supplier's guarantee, D-057)
    assumed: true
  max_stage_pressure_ratio:
    value: 2.0
    source: DESIGN.md D-053 (ASSUMED; gives the 3 stages of DESIGN.md 1 and the equipment list)
    assumed: true
  intercooler_outlet_temperature_degc:
    value: 40
    unit: degC
    source: process/simulation.yaml K1101 outlet_temperature (ASSUMED, as the aftercooler E-1103 'air to
      40 C', CW 25 -> 35 C)
    assumed: true
  cooler_pressure_drop_bar:
    value: 0.05
    unit: bar
    source: process/simulation.yaml K1101 pressure_drop (ASSUMED, per cooler)
    assumed: true
  heat_capacity_ratio:
    value:
    - 1.3984
    - 1.3991
    - 1.4025
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-068 (2)): Cp/Cv at each stage suction (303.15 K 101 kPa(a);
      313.15 K 179 / 321 kPa(a)): property adapter (thermo 0.6.1, PR) for N2 / O2 / Ar, water vapour mixed
      in on the molar Cp (IAPWS-95 at its partial pressure); replaces the single 1.402 of D-053'
    assumed: true
  process_streams:
  - stream: S1
    direction: in
    title: Air feed
    source: process/flowsheet.yaml (case design)
  - stream: S2
    direction: out
    title: Compressed air
    source: process/flowsheet.yaml (case design)
  - stream: S1C
    direction: out
    title: MAC cooler condensate (E-1102, E-1103 drains)
    source: process/flowsheet.yaml (case design)
  number_of_stages:
    value: 3
    unit: ''
    source: process/simulation.yaml K1101 stages 3 (DESIGN.md 1, the equipment list; max ratio 2.0 per stage,
      D-053)
    assumed: true
  stage_pressure_ratio:
    value: 1.822
    unit: ''
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-068 (2)): equal ratios from 101 kPa(a) to 585 kPa(a) at the last
      stage discharge, 5 kPa lost in each cooler (S2 5.8 bara after E-1103)'
    assumed: true
  discharge_temperature_k:
    value: 384.9
    unit: K
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-068 (2)): stage 3 discharge (ideal gas, Cp/Cv at the stage
      suction, eta_s 0.82); stages 1 / 2: 372.1 / 384.4 K'
    assumed: true
  intercooler_duties_kw:
    value:
    - 1892
    - 2799
    unit: kW
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-068 (2)): E-1101 sensible 1,892 kW; E-1102 sensible 2,286 kW +
      767 kg/h condensed (513 kW, IAPWS-95 latent heat at 40 C); aftercooler E-1103 2,754 kW (2,263 + 491
      kW, 734 kg/h). The three coolers 7,445 kW against the simulated Q1 7,560 kW (DESIGN.md D-066; 1.5 %
      apart: Peng-Robinson water against IAPWS-95)'
    assumed: true
sizing_basis: []
notes: 'Integrally geared, 3 stages, rated about 90,000 Nm3/h dry air (design point 85,840 Nm3/h at 80 % RH,
  DESIGN.md D-066), 1.0 -> 5.8 bara, 9.0 MW 6.6 kV motor (rating, was 8.0 MW), IGV + anti-surge blow-off.
  Train with gearbox and motor on one base 12 x 6 x 5 m. ASSUMED. Powers from the DWSIM simulation
  (DESIGN.md D-057, D-066): 6,747 kW at the compressor, 7,133 kW electric at the drive efficiency 0.946.
  Condensate S1C 1,581 kg/h from the E-1102 and E-1103 moisture separators (CD-1001 / CD-1002, D-064).
  Stage temperatures and cooler duties from scripts/datasheet_sizing.py section 1 (DESIGN.md D-068 (2)). The
  vendor confirms the stage efficiency, the IGV range and the motor (D-066); the motor weight, ~34 t
  ASSUMED, sets the B1 crane (D-070).'
