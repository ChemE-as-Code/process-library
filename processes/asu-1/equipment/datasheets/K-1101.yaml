type_specific:
  height_m:
    value: 5.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  length_m:
    value: 12.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  width_m:
    value: 6.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  fluid_power_kw:
    value: 6868
    unit: kW
    source: '`cheme process simulate` (DWSIM 9.0.5, Peng-Robinson; DESIGN.md D-079, process/simulation-run.json):
      K1101 compressor power 6,867.7 kW for the wet air S1 (113,329 kg/h, 80 % RH) to S2 5.98 bara, 3 stages
      at isentropic efficiency 0.82, intercooled to 40 C, 0.05 bar per cooler (process/simulation.yaml,
      ASSUMED). Cross-check scripts/datasheet_sizing.py section 1 (DESIGN.md D-080 (2)), ideal gas with
      Cp/Cv at each stage suction: 6,884 kW'
    assumed: true
  shaft_power_kw:
    value: 6868
    unit: kW
    source: '`cheme process simulate` (DESIGN.md D-079): K1101 shaft 6,867.7 kW = the compressor power;
      the gear and bearing losses are in the drive efficiency below'
    assumed: true
  electric_power_kw:
    value: 7260
    unit: kW
    source: 'process/flowsheet.yaml energy stream E1 (calculated, `cheme process simulate`, DESIGN.md
      D-079): 7,259.8 kW = shaft / drive efficiency 0.946 (was 7,133 kW at 5.8 bara)'
    assumed: true
  motor_rating_kw:
    value: 9000
    unit: kW
    source: 'DESIGN.md D-066 (ASSUMED, was 8,000), checked again at D-079: the motor output at the design point
      7,260 x 0.97 = 7,042 kW; pro rata at the 90,000 Nm3/h rating 7,611 kW electric, 7,383 kW output; 110 %
      of that (API 617 driver margin) 8,121 kW against 9,000 kW: 10.8 % margin
      (scripts/datasheet_sizing.py section 1 (DESIGN.md D-080 (2))). 6.6 kV; starting method and supply
      in DESIGN.md D-070'
    assumed: true
  drive_efficiency:
    value: 0.946
    source: process/simulation.yaml K1101 (ASSUMED, D-057; 6.6 kV motor 0.97 x integral gear and bearings
      0.975)
    assumed: true
  isentropic_efficiency:
    value: 0.82
    source: process/simulation.yaml K1101 (ASSUMED per stage until the supplier's guarantee, D-057)
    assumed: true
  max_stage_pressure_ratio:
    value: 2.0
    source: DESIGN.md D-053 (ASSUMED; gives the 3 stages of DESIGN.md 1 and the equipment list)
    assumed: true
  intercooler_outlet_temperature_degc:
    value: 40
    unit: degC
    source: process/simulation.yaml K1101 outlet_temperature (ASSUMED, as the aftercooler E-1103 'air to
      40 C', CW 25 -> 35 C)
    assumed: true
  cooler_pressure_drop_bar:
    value: 0.05
    unit: bar
    source: process/simulation.yaml K1101 pressure_drop (ASSUMED, per cooler)
    assumed: true
  heat_capacity_ratio:
    value:
    - 1.3984
    - 1.3992
    - 1.4027
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-080 (2)): Cp/Cv at each stage suction (303.15 K 101 kPa(a);
      313.15 K 180.8 / 327.7 kPa(a)): property adapter (thermo 0.6.1, PR) for N2 / O2 / Ar, water vapour mixed
      in on the molar Cp (IAPWS-95 at its partial pressure); replaces the single 1.402 of D-053'
    assumed: true
  process_streams:
  - stream: S1
    direction: in
    title: Air feed
    source: process/flowsheet.yaml (case design)
  - stream: S2
    direction: out
    title: Compressed air
    source: process/flowsheet.yaml (case design)
  - stream: S1C
    direction: out
    title: MAC cooler condensate (E-1102, E-1103 drains)
    source: process/flowsheet.yaml (case design)
  number_of_stages:
    value: 3
    unit: ''
    source: process/simulation.yaml K1101 stages 3 (DESIGN.md 1, the equipment list; max ratio 2.0 per stage,
      D-053)
    assumed: true
  stage_pressure_ratio:
    value: 1.84
    unit: ''
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-080 (2)): equal ratios from 101 kPa(a) to 603 kPa(a) at the last
      stage discharge, 5 kPa lost in each cooler (S2 5.98 bara after E-1103, D-079)'
    assumed: true
  discharge_temperature_k:
    value: 386.2
    unit: K
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-080 (2)): stage 3 discharge (ideal gas, Cp/Cv at the stage
      suction, eta_s 0.82); stages 1 / 2: 373.3 / 385.7 K'
    assumed: true
  intercooler_duties_kw:
    value:
    - 1932
    - 2863
    unit: kW
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-080 (2)): E-1101 sensible 1,932 kW; E-1102 sensible 2,328 kW +
      801 kg/h condensed (535 kW, IAPWS-95 latent heat at 40 C); aftercooler E-1103 2,789 kW (2,303 + 487
      kW, 728 kg/h). The three coolers 7,584 kW against the simulated Q1 7,698 kW (DESIGN.md D-079; 1.5 %
      apart: Peng-Robinson water against IAPWS-95)'
    assumed: true
sizing_basis: []
notes: 'Integrally geared, 3 stages, rated about 90,000 Nm3/h dry air (design point 85,840 Nm3/h at 80 % RH,
  DESIGN.md D-066), 1.0 -> 5.98 bara (D-079), 9.0 MW 6.6 kV motor (rating, was 8.0 MW), IGV + anti-surge
  blow-off. Train with gearbox and motor on one base 12 x 6 x 5 m. ASSUMED. Powers from the DWSIM simulation
  (DESIGN.md D-057, D-079): 6,868 kW at the compressor, 7,260 kW electric at the drive efficiency 0.946;
  motor check 8,121 kW (110 % at the rating) against 9,000 kW.
  Condensate S1C 1,604 kg/h from the E-1102 and E-1103 moisture separators (CD-1001 / CD-1002, D-064).
  Stage temperatures and cooler duties from scripts/datasheet_sizing.py section 1 (DESIGN.md D-080 (2)). The
  vendor confirms the stage efficiency, the IGV range and the motor (D-066); the motor weight, ~34 t
  ASSUMED, sets the B1 crane (D-070).'
