- name: N4
  dn: 700
  lines:
  - AIR-1006
  source: pid/P-01.xml
  face: side
  orientation_deg: 90
  elevation_m: 3.0
  location_source: layout/equipment-placement.yaml (interstage on the north side, 2 m east of the train
    centre; D-028, D-055 (8))
- name: N5
  dn: 700
  lines:
  - AIR-1006
  source: pid/P-01.xml
  face: side
  orientation_deg: 90
  elevation_m: 3.0
  location_source: layout/equipment-placement.yaml (interstage on the north side, 5 m east of the train
