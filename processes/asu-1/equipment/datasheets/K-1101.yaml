# Datasheet, first drafted by `cheme datasheets draft` from equipment/equipment-list.yaml, pid/P-01.xml, process/flowsheet.yaml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: K-1101
type: CentrifugalCompressor
service: Main air compressor (MAC)
draft: false
operating:
  inlet_pressure:
    value: 1.01
    unit: bar(a)
    source: 'process/flowsheet.yaml stream S1 (case design), assumed: DESIGN.md 3, stream 1'
    assumed: true
  inlet_temperature:
    value: 30.0
    unit: °C
    source: 'process/flowsheet.yaml stream S1 (case design), given: DESIGN.md 3 basis: 30 C ambient'
  inlet_flow:
    value: 113329.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S1 (case design), assumed: D-058''s air scaled by 1.1306 (DESIGN.md
      D-066): 85,840 Nm3/h dry air (110,937 kg/h) + 2,391 kg/h water at 80 % RH, 30 C'
    assumed: true
  rated_flow:
    value: 90000
    unit: Nm3/h
    source: 'DESIGN.md D-066: MAC re-rated to about 90,000 Nm3/h dry air (the design point 85,840 Nm3/h
      at the intake; the former 80,000 Nm3/h rating is exceeded). The vendor''s stage efficiency and IGV
      range confirm it'
    assumed: true
  outlet_pressure:
    value: 6.02
    unit: bar(a)
    source: 'process/flowsheet.yaml stream S2 (case design), assumed: DESIGN.md D-089 (front-end pressure
      profile set from the cold box back: S4 5.6 bara + 32 kPa for the DN700 main air lines at their bound,
      the adsorber bed and F-2101 + 10 kPa for the DCAC; D-079 had 5.98 with 28 kPa, before it 5.8). Enquiry
      basis after E-1103. The HOLD of D-080 (1) / D-088 (1) is lifted by D-089 (DESIGN.md D-090): scripts/datasheet_sizing.py
      section 10 at 6.02 / 5.92 bara gives the routed DN700 lines 16.9 kPa + bed 8 + F-2101 3 = 27.9 kPa
      against the 32 kPa S3 -> S4, margin +4.1 kPa; the bound with every turn and the vessel nozzles counted
      (21.1 kPa at the S4 density) leaves -0.11 kPa (~0.7 kW at the MAC). S2 still rises by any excess
      of the adsorber and F-2101 suppliers'' drops over the ~11 kPa assumed (~6.7 kW electric per kPa)'
    assumed: true
  outlet_temperature:
    value: 40.0
    unit: °C
    source: 'process/flowsheet.yaml stream S2 (case design), assumed: DESIGN.md 3, stream 2'
    assumed: true
  outlet_flow:
    value: 111720.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S2 (case design), calculated by `cheme process simulate` (DESIGN.md
      D-089): S1 less the condensate S1C 1,609 kg/h of the E-1102 / E-1103 drains'
    assumed: true
  condensate_flow:
    value: 1609.5
    unit: kg/h
    source: 'process/flowsheet.yaml stream S1C (case design), calculated by `cheme process simulate` (DESIGN.md
      D-089): E-1102 and E-1103 moisture separator drains, 40 C; the IAPWS-95 split: E-1102 808 kg/h,
      E-1103 726 kg/h (scripts/datasheet_sizing.py section 1 (DESIGN.md D-090))'
    assumed: true
design:
  pressure_barg:
    value: 8.0
    unit: barg
    source: equipment/equipment-list.yaml
  temperature_degc:
    value: 180.0
    unit: degC
    source: equipment/equipment-list.yaml
materials:
  main:
    value: CS / SS impellers
    source: equipment/equipment-list.yaml
dimensions:
  overall_length:
    value: 12.0
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.length'
  overall_width:
    value: 6.0
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.width'
  overall_height:
    value: 5.0
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.height'
  axis_deg:
    value: 0.0
    unit: deg
    source: 'cheme datasheets fill: layout/plant-model.yaml K-1101 rotation_deg (layout/equipment-placement.yaml)'
weights:
  empty:
    value: 89.0
    unit: t
    source: 'DESIGN.md D-081 (5), equipment list dimensions.weight: the train on its base (compressor,
      gearbox, motor), D-034''s ~85 t with the 8 MW motor plus the 4 t the 9 MW motor adds (30 -> 34 t,
      D-070); the heaviest maintenance lift is the motor (lift_weight 34 t). ASSUMED: the compressor
      supplier gives the weight'
    assumed: true
