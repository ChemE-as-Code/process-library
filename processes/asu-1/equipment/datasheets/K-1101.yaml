# Datasheet, first drafted by `cheme datasheets draft` from equipment/equipment-list.yaml, pid/P-01.xml, process/flowsheet.yaml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: K-1101
type: CentrifugalCompressor
service: Main air compressor (MAC)
draft: false
operating:
  inlet_pressure:
    value: 1.01
    unit: bar(a)
    source: 'process/flowsheet.yaml stream S1 (case design), assumed: DESIGN.md 3, stream 1'
    assumed: true
  inlet_temperature:
    value: 30.0
    unit: °C
    source: 'process/flowsheet.yaml stream S1 (case design), given: DESIGN.md 3 basis: 30 C ambient'
  inlet_flow:
    value: 113329.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S1 (case design), assumed: D-058''s air scaled by 1.1306 (DESIGN.md
      D-066): 85,840 Nm3/h dry air (110,937 kg/h) + 2,391 kg/h water at 80 % RH, 30 C'
    assumed: true
  rated_flow:
    value: 90000
    unit: Nm3/h
    source: 'DESIGN.md D-066: MAC re-rated to about 90,000 Nm3/h dry air (the design point 85,840 Nm3/h at the
      intake; the former 80,000 Nm3/h rating is exceeded). The vendor''s stage efficiency and IGV range
      confirm it'
    assumed: true
  outlet_pressure:
    value: 5.8
    unit: bar(a)
    source: 'process/flowsheet.yaml stream S2 (case design), assumed: DESIGN.md 3, stream 2'
    assumed: true
  outlet_temperature:
    value: 40.0
    unit: °C
    source: 'process/flowsheet.yaml stream S2 (case design), assumed: DESIGN.md 3, stream 2'
    assumed: true
  outlet_flow:
    value: 111748.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S2 (case design), calculated by `cheme process simulate`
      (DESIGN.md D-066): S1 less the condensate S1C 1,581 kg/h of the E-1102 / E-1103 drains'
    assumed: true
  condensate_flow:
    value: 1580.8
    unit: kg/h
    source: 'process/flowsheet.yaml stream S1C (case design), calculated by `cheme process simulate`
      (DESIGN.md D-066): E-1102 and E-1103 moisture separator drains, 40 C; the IAPWS-95
      split: E-1102 767 kg/h, E-1103 734 kg/h (scripts/datasheet_sizing.py section 1 (DESIGN.md D-068 (2)))'
    assumed: true
design:
  pressure_barg:
    value: 8.0
    unit: barg
    source: equipment/equipment-list.yaml
  temperature_degc:
    value: 180.0
    unit: degC
    source: equipment/equipment-list.yaml
materials:
  main:
    value: CS / SS impellers
    source: equipment/equipment-list.yaml
