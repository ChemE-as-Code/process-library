# Datasheet, first drafted by `cheme datasheets draft` from equipment/equipment-list.yaml, pid/P-01.xml, process/flowsheet.yaml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: K-1101
type: CentrifugalCompressor
service: Main air compressor (MAC)
draft: false
operating:
  inlet_pressure:
    value: 1.01
    unit: bar(a)
    source: 'process/flowsheet.yaml stream S1 (case design), assumed: DESIGN.md 3, stream 1'
    assumed: true
  inlet_temperature:
    value: 30.0
    unit: °C
    source: 'process/flowsheet.yaml stream S1 (case design), given: DESIGN.md 3 basis: 30 C ambient'
  inlet_flow:
    value: 113329.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S1 (case design), assumed: D-058''s air scaled by 1.1306 (DESIGN.md
      D-066): 85,840 Nm3/h dry air (110,937 kg/h) + 2,391 kg/h water at 80 % RH, 30 C'
    assumed: true
  rated_flow:
    value: 90000
    unit: Nm3/h
    source: 'DESIGN.md D-066: MAC re-rated to about 90,000 Nm3/h dry air (the design point 85,840 Nm3/h at the
      intake; the former 80,000 Nm3/h rating is exceeded). The vendor''s stage efficiency and IGV range
      confirm it'
    assumed: true
  outlet_pressure:
    value: 5.98
    unit: bar(a)
    source: 'process/flowsheet.yaml stream S2 (case design), assumed: DESIGN.md D-079 (front-end pressure
      profile set from the cold box back: S4 5.6 bara + 28 kPa for the DN700 main air lines, the adsorber
      bed and F-2101 + 10 kPa for the DCAC; was 5.8). Enquiry basis after E-1103. HOLD (DESIGN.md D-080 (1),
      D-088 (1)): the routed DN700 lines take 17.1 kPa (bound with every turn and the vessel nozzles 21.1 kPa;
      scripts/datasheet_sizing.py section 10) + bed 8 + F-2101 3 against the 28 kPa S3 -> S4, short by
      0.06 kPa (bound 4.1 kPa); the simulation owner''s answer is pending: S2 about 6.02 bara (+~27 kW
      electric at 6.74 kW/kPa; the 9.0 MW motor holds, 8,121 + 27 kW against 9,000 kW) or the vessel nozzle
      losses inside the bed / F-2101 allowables. S2 also rises by any excess of the adsorber and F-2101
      suppliers'' drops over the ~11 kPa assumed'
    assumed: true
  outlet_temperature:
    value: 40.0
    unit: °C
    source: 'process/flowsheet.yaml stream S2 (case design), assumed: DESIGN.md 3, stream 2'
    assumed: true
  outlet_flow:
    value: 111725.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S2 (case design), calculated by `cheme process simulate`
      (DESIGN.md D-079): S1 less the condensate S1C 1,604 kg/h of the E-1102 / E-1103 drains'
    assumed: true
  condensate_flow:
    value: 1604.4
    unit: kg/h
    source: 'process/flowsheet.yaml stream S1C (case design), calculated by `cheme process simulate`
      (DESIGN.md D-079): E-1102 and E-1103 moisture separator drains, 40 C; the IAPWS-95
      split: E-1102 801 kg/h, E-1103 728 kg/h (scripts/datasheet_sizing.py section 1 (DESIGN.md D-080 (2)))'
    assumed: true
design:
  pressure_barg:
    value: 8.0
    unit: barg
    source: equipment/equipment-list.yaml
  temperature_degc:
    value: 180.0
    unit: degC
    source: equipment/equipment-list.yaml
