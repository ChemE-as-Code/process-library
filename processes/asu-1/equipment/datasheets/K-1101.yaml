type_specific:
  height_m:
    value: 5.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  length_m:
    value: 12.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  width_m:
    value: 6.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  fluid_power_kw:
    value: 6894
    unit: kW
    source: '`cheme process simulate` (DWSIM 9.0.5, Peng-Robinson; DESIGN.md D-089, process/simulation-run.json):
      K1101 compressor power 6,894.0 kW for the wet air S1 (113,329 kg/h, 80 % RH) to S2 6.02 bara, 3
      stages at isentropic efficiency 0.82, intercooled to 40 C, 0.05 bar per cooler (process/simulation.yaml,
      ASSUMED). Cross-check scripts/datasheet_sizing.py section 1 (DESIGN.md D-090), ideal gas with Cp/Cv
      at each stage suction: 6,910 kW'
    assumed: true
  shaft_power_kw:
    value: 6894
    unit: kW
    source: '`cheme process simulate` (DESIGN.md D-089): K1101 shaft 6,894.0 kW = the compressor power
      (+26.3 kW against D-079); the gear and bearing losses are in the drive efficiency below'
    assumed: true
  electric_power_kw:
    value: 7288
    unit: kW
    source: 'process/flowsheet.yaml energy stream E1 (calculated, `cheme process simulate`, DESIGN.md
      D-089): 7,287.6 kW = shaft / drive efficiency 0.946 (+27.8 kW against 7,259.8 kW at 5.98 bara, D-079;
      7,133 kW at 5.8 bara)'
    assumed: true
  motor_rating_kw:
    value: 9000
    unit: kW
    source: 'DESIGN.md D-066 (ASSUMED, was 8,000), checked again at D-089: the motor output at the design
      point 7,288 x 0.97 = 7,069 kW; pro rata at the 90,000 Nm3/h rating 7,640 kW electric, 7,411 kW output;
      110 % of that (API 617 driver margin) 8,152 kW against 9,000 kW: 10.4 % margin (scripts/datasheet_sizing.py
      section 1 (DESIGN.md D-090)). 6.6 kV; starting method and supply in DESIGN.md D-070'
    assumed: true
  drive_efficiency:
    value: 0.946
    source: process/simulation.yaml K1101 (ASSUMED, D-057; 6.6 kV motor 0.97 x integral gear and bearings
      0.975)
    assumed: true
  isentropic_efficiency:
    value: 0.82
    source: process/simulation.yaml K1101 (ASSUMED per stage until the supplier's guarantee, D-057)
    assumed: true
  max_stage_pressure_ratio:
    value: 2.0
    source: DESIGN.md D-053 (ASSUMED; gives the 3 stages of DESIGN.md 1 and the equipment list)
    assumed: true
  intercooler_outlet_temperature_degc:
    value: 40
    unit: degC
    source: process/simulation.yaml K1101 outlet_temperature (ASSUMED, as the aftercooler E-1103 'air
      to 40 C', CW 25 -> 35 C)
    assumed: true
  cooler_pressure_drop_bar:
    value: 0.05
    unit: bar
    source: process/simulation.yaml K1101 pressure_drop (ASSUMED, per cooler)
    assumed: true
  heat_capacity_ratio:
    value:
    - 1.3984
    - 1.3992
    - 1.4027
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-090): Cp/Cv at each stage suction (303.15
      K 101 kPa(a); 313.15 K 181.2 / 329.2 kPa(a)): property adapter (thermo 0.6.1, PR) for N2 / O2 /
      Ar, water vapour mixed in on the molar Cp (IAPWS-95 at its partial pressure); replaces the single
      1.402 of D-053'
    assumed: true
  process_streams:
  - stream: S1
    direction: in
    title: Air feed
    source: process/flowsheet.yaml (case design)
  - stream: S2
    direction: out
    title: Compressed air
    source: process/flowsheet.yaml (case design)
  - stream: S1C
    direction: out
    title: MAC cooler condensate (E-1102, E-1103 drains)
    source: process/flowsheet.yaml (case design)
  number_of_stages:
    value: 3
    unit: ''
    source: process/simulation.yaml K1101 stages 3 (DESIGN.md 1, the equipment list; max ratio 2.0 per
      stage, D-053)
    assumed: true
  stage_pressure_ratio:
    value: 1.844
    unit: ''
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-090): equal ratios from 101 kPa(a) to
      607 kPa(a) at the last stage discharge, 5 kPa lost in each cooler (S2 6.02 bara after E-1103, D-089)'
    assumed: true
  discharge_temperature_k:
    value: 386.5
    unit: K
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-090): stage 3 discharge (ideal gas, Cp/Cv
      at the stage suction, eta_s 0.82); stages 1 / 2: 373.6 / 386.0 K'
    assumed: true
  intercooler_duties_kw:
    value:
    - 1941
    - 2877
    unit: kW
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-090): E-1101 sensible 1,941 kW; E-1102
      sensible 2,337 kW + 808 kg/h condensed (540 kW, IAPWS-95 latent heat at 40 C); aftercooler E-1103
      2,797 kW (2,312 + 486 kW, 726 kg/h). The three coolers 7,614 kW against the simulated Q1 7,728 kW
      (DESIGN.md D-089; 1.5 % apart: Peng-Robinson water against IAPWS-95)'
    assumed: true
sizing_basis: []
notes: 'Integrally geared, 3 stages, rated about 90,000 Nm3/h dry air (design point 85,840 Nm3/h at 80
  % RH, DESIGN.md D-066), 1.0 -> 6.02 bara (D-089), 9.0 MW 6.6 kV motor (rating, was 8.0 MW), IGV + anti-surge
  blow-off. Train with gearbox and motor on one base 12 x 6 x 5 m. ASSUMED. Powers from the DWSIM simulation
  (DESIGN.md D-057, D-089): 6,894 kW at the compressor, 7,288 kW electric at the drive efficiency 0.946;
  motor check 8,152 kW (110 % at the rating) against 9,000 kW. Condensate S1C 1,609 kg/h from the E-1102
  and E-1103 moisture separators (CD-1001 / CD-1002, D-064). Stage temperatures and cooler duties from
  scripts/datasheet_sizing.py section 1 (DESIGN.md D-090). The vendor confirms the stage efficiency, the
  IGV range and the motor (D-066); the motor weight, ~34 t ASSUMED, sets the B1 crane (D-070).'
