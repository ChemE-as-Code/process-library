type_specific:
  diameter_m:
    value: 1.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  height_m:
    value: 1.8
    unit: m
    source: equipment/equipment-list.yaml dimensions
  length_m:
    value: 5.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  weight_t:
    value: 4.0
    unit: t
    source: equipment/equipment-list.yaml dimensions
  duty_kw:
    value: 126.1
    unit: kW
    source: '`cheme process simulate` (DWSIM 9.0.5, Peng-Robinson; DESIGN.md D-067): E3104 126.13 kW,
      S4C 59.93 C -> S4D 30 C at 8.45 bara, 14,870 kg/h; energy stream Q5 to cooling water (was 83.95
      kW to 40 C)'
    assumed: true
  area_m2:
    value: 63.54
    unit: m2
    source: 'scripts/datasheet_sizing.py section 4 (DESIGN.md D-068 (4)): A = Q / (U LMTD) = 126.13 kW
      / (160 x 12.41 K), counter-current (F 1), U 160 W/(m2 K) ASSUMED as design typical (middle of 20-300),
      Sinnott, Coulson & Richardson''s Chemical Engineering Vol. 6, 4th ed. (2005), Table 12.1, p. 637:
      cooler, gases / water; no margin. D-067: about 64 m2 (was 29.7 m2)'
    assumed: true
  arrangement:
    value: counter-current
    source: 'DESIGN.md D-067: a single 1-2 shell crosses (air out 30 C against cooling water out 35 C),
      so the exchanger is counter-current (one tube pass, or 1-2 shells in series, by the supplier)'
    assumed: true
  u_service:
    value: cooler/gases-water
    source: DESIGN.md D-053 (ASSUMED; air at 8 bara against cooling water)
    assumed: true
  utility_inlet_temperature_degc:
    value: 25
    unit: degC
    source: process/design-basis.yaml utilities, cooling water supply 25 C
  utility_outlet_temperature_degc:
    value: 35
    unit: degC
    source: process/design-basis.yaml utilities, cooling water return 35 C
  process_streams:
  - stream: S4C
    direction: in
    title: Booster discharge
    source: process/flowsheet.yaml (case design)
  - stream: S4D
    direction: out
    title: Boosted air to the trim cooler
    source: process/flowsheet.yaml (case design)
  lmtd_k:
    value: 12.41
    unit: K
    source: 'scripts/datasheet_sizing.py section 4 (DESIGN.md D-068 (4)): counter-current LMTD, hot 333.08
      -> 303.15 K (S4C -> S4D), cooling water 298.15 -> 308.15 K (process/design-basis.yaml utilities):
      24.93 K at the hot end, 5 K at the cold end'
    assumed: true
  lmtd_correction_f:
    value: 1.0
    unit: ''
    source: 'DESIGN.md D-067: counter-current, no correction'
    assumed: true
  overall_u_w_m2k:
    value: 160.0
    unit: W/(m2 K)
    source: 'U 160 W/(m2 K) ASSUMED as design typical (middle of 20-300), Sinnott, Coulson & Richardson''s
      Chemical Engineering Vol. 6, 4th ed. (2005), Table 12.1, p. 637: cooler, gases / water (DESIGN.md
      D-053)'
    assumed: true
sizing_basis: []
notes: Cooling water, counter-current (DESIGN.md D-067). Outside cold box. The air side (8.45 bara) stays
  above the cooling water, so a tube leak cannot put water into the dry air (D-067). ASSUMED. Followed
  by the chilled-water trim cooler E-3105 (D-069).
