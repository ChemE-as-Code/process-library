# Datasheet, first drafted by `cheme datasheets draft` from equipment/equipment-list.yaml, pid/P-03.xml, process/flowsheet.yaml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: E-3104
type: TubularHeatExchanger
service: Booster aftercooler
draft: false
operating:
  inlet_pressure:
    value: 8.45
    unit: bar(a)
    source: 'process/flowsheet.yaml stream S4C (case design), assumed: DESIGN.md D-061, the booster discharge
      where the compander balances'
    assumed: true
  inlet_temperature:
    value: 59.9
    unit: °C
    source: 'process/flowsheet.yaml stream S4C (case design), calculated by `cheme process simulate` (DWSIM,
      DESIGN.md D-066): 59.93 C'
    assumed: true
  inlet_flow:
    value: 14870.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S4C (case design), assumed: = S4B'
    assumed: true
  outlet_pressure:
    value: 8.45
    unit: bar(a)
    source: 'process/flowsheet.yaml stream S4D (case design), assumed: ASSUMED (D-052, D-061): no pressure
      drop in E-3104 (0.1 bar would move the expander inlet ~0.45 K colder, D-061); E-3101 takes it to
      8.25 bara at the expander inlet (S5B)'
    assumed: true
  outlet_temperature:
    value: 30.0
    unit: °C
    source: 'process/flowsheet.yaml stream S4D (case design), assumed: DESIGN.md D-067, counter-current
      on cooling water 25 -> 35 C, 5 K approach (was 40 C); the trim cooler E-3105 takes it on to 15 C'
    assumed: true
  outlet_flow:
    value: 14870.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S4D (case design), assumed: = S4B'
    assumed: true
  cooling_water_flow:
    value: 10.9
    unit: m3/h
    source: 'scripts/datasheet_sizing.py section 4 (DESIGN.md D-068 (4)): Q / (cp 10 K), IAPWS-95 water
      at the mean 30 C; D-067: ~10.8 m3/h (was 7.3)'
    assumed: true
design:
  pressure_barg:
    value: 11.0
    unit: barg
    source: equipment/equipment-list.yaml
  temperature_degc:
    value: 120.0
    unit: degC
    source: equipment/equipment-list.yaml
