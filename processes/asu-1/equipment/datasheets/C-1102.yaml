- name: N2
  dn: 900
  lines:
  - WN-1002
  source: pid/P-01.xml
- name: N3
  dn: 150
  lines:
  - CW-1003
  source: pid/P-01.xml
- name: N4
  dn: 150
  lines:
  - CHW-1001
  source: pid/P-01.xml
- name: N5
  dn: 150
  lines:
  - CHWR-1001
  source: pid/P-01.xml (chilled-water return to the top distributor, D-069)
- name: I1
  lines: []
  source: pid/P-01.xml
type_specific:
  diameter_m:
    value: 4.5
    unit: m
    source: equipment/equipment-list.yaml dimensions
  height_m:
    value: 22.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  volume_m3:
    value: 349.895
    unit: m3
    source: 'equipment/equipment-list.yaml dimensions: pi/4 D^2 x height (overall, including heads and
      skirt: an upper bound)'
    assumed: true
  number_of_stages:
    value: not_applicable
    unit: ''
    reason: an evaporative cooler (water cooled by evaporation into dry waste N2 on packing), not a
      distillation; its packing is sized in transfer units (packing_height_m), not in stages
  adiabatic_saturation_temperature_degc:
    value: 2.3
    unit: degC
    source: 'scripts/datasheet_sizing.py section 9 (DESIGN.md D-068 (8)): energy balance of S12B (dry, 13 C, 105 kPa(a), 58,074
      kg/h) saturated with water fed at that temperature (N2 enthalpy property adapter, water IAPWS-95;
      psychrometry, Perry''s 8th ed. Section 12): the lowest water temperature the dry waste N2 can reach
      (independent of the flow; 8.54 C with the former 25 C inlet, D-060 (3))'
    assumed: true
  gas_load_factor_pa05:
    value: 0.906
    unit: Pa^0.5
    source: 'scripts/datasheet_sizing.py section 9 (DESIGN.md D-068 (8)): F = u rho^0.5, 58,074 kg/h at 13 C, 105 kPa(a) (rho
      1.253 kg/m3, property adapter), D 4.5 m (equipment list): u 0.81 m/s (0.49 Pa^0.5 at the former 31,450
      kg/h)'
    assumed: true
  liquid_load_m3_m2h:
    value: 2.49
    unit: m3/(m2 h)
    source: 'scripts/datasheet_sizing.py section 9 (DESIGN.md D-090): 39.6 m3/h chilled water over 15.9 m2;
      low for packing wetting: the supplier confirms the packing and distributor'
    assumed: true
  duty_kw:
    value: 698
    unit: kW
    source: 'scripts/datasheet_sizing.py section 12 (DESIGN.md D-090): the demand, DCAC upper section 634.3 kW
      (`cheme process simulate` C1101U, D-089) + E-3105 63.3 kW (E3105, D-067); D-067 puts the cooler''s
      capability with 58,000 kg/h of dry N2 at about 1,000 kW of 10 C water (a ~30 % margin), to be
      confirmed by the packing supplier'
    assumed: true
  allowable_gas_pressure_drop_kpa:
    value: 3.3
    unit: kPa
    source: 'DESIGN.md D-071 (2), scripts/datasheet_sizing.py section 11: the C-1102 gas inlet at 105 kPa(a)
      (flowsheet S12B, ASSUMED) less the WN-1002 vent to atmosphere (DN900, 0.4 kPa with the exit, routed
      6.9 m) and 101.3 kPa: 3.3 kPa (33 mbar) for the packing, the liquid distributor and the mist
      eliminator at 58,074 kg/h, so that the waste-N2 path keeps the LP column top at 1.30 bara
      (enquiry requirement; the supplier states the drop of the chosen packing)'
    assumed: true
  packing_height_m:
    value: supplier
    unit: m
    source: 'packing supplier: transfer units of the chosen packing. Enquiry basis: 39.6 m3/h of water at ~25 C
      cooled to 10 C (698 kW, up to ~1,000 kW) by 58,074 kg/h dry waste N2 at 13 C, 1.05 bara; the 10 C
      outlet is 7.7 K above the N2''s adiabatic saturation temperature (2.3 C); 2 K approaches (D-067)'
  flooding_diameter_m:
    value: supplier
    unit: m
    source: 'packing supplier''s hydraulic rating (no flooding correlation in cheme-as-code is cleanly
      sourced); the 4.5 m of the equipment list (ASSUMED) runs at F 0.91 Pa^0.5 and 2.5 m3/(m2 h)'
  process_streams:
  - stream: S12B
    direction: in
    title: Waste N2 to evaporative cooler
    source: process/flowsheet.yaml (case design)
  - stream: S12E
    direction: out
    title: Evaporative cooler gas out
    source: process/flowsheet.yaml (case design)
  minimum_stages:
    value: not_applicable
    unit: ''
    reason: Fenske minimum stages apply to a distillation; an evaporative cooler has no key components
  minimum_reflux_ratio:
    value: not_applicable
    unit: ''
    reason: no reflux in an evaporative cooler
  theoretical_stages:
    value: not_applicable
    unit: ''
    reason: an evaporative cooler is sized in transfer units, not theoretical stages
sizing_basis: []
notes: 'Waste N2 58,074 kg/h (~46,000 Nm3/h, DESIGN.md D-067) cools the closed chilled-water loop to ~10 C
  (DCAC upper section and E-3105, returns CHWR-1001 / CHWR-3001), top vent WN-1002 to atmosphere; make-up
  CW-1003 via LV-1107 for the evaporation. ASSUMED. DESIGN.md D-060 (3), D-063, D-068 (8): adiabatic
  saturation limit 2.3 C, duty, evaporation and hydraulic loads calculated; the packing height and flooding
  diameter are the packing supplier''s (markers); the allowable gas pressure drop is set by the waste-N2
  path (D-071); the stage fields do not apply (not a distillation). Relief case (DESIGN.md D-083): air blow-by
  through CHWR-1001 when the DCAC chimney tray loses its seal, bound 95.1 t/h (choked S3 air at 5.92 bara through the
  full DN150 bore, Cd 1; D-090); with the design gas the open top vent WN-1002 (DN900, no valve, the relief
  path) passes 154.1 t/h at 3.0 kPa, the internals at most ~23 kPa (the 3.3 kPa allowable scaled with the flow
  squared): ~26 kPa(g) against the 1 barg design, no relief device needed. Enquiry requirements: the top nozzle,
  distributor and mist eliminator take that flow for the minutes until I-03 trips without mechanical damage
  (supplier confirms); no valve, blind or flame arrester in WN-1002.'
