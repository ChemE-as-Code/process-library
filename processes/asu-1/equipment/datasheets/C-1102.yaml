# Datasheet, first drafted by `cheme datasheets draft` from equipment/equipment-list.yaml, pid/P-01.xml, process/flowsheet.yaml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: C-1102
type: ProcessColumn
service: Evaporative cooler (chilled water)
draft: false
operating:
  inlet_pressure:
    value: 1.05
    unit: bar(a)
    source: 'process/flowsheet.yaml stream S12B (case design), assumed: DESIGN.md 3, stream 12b'
    assumed: true
  inlet_temperature:
    value: 13.0
    unit: °C
    source: 'process/flowsheet.yaml stream S12B (case design), assumed: the E-3101 warm end at 13 C
      (DESIGN.md D-061), outlet of the splitter X3101'
    assumed: true
  inlet_flow:
    value: 58074.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S12B (case design), assumed: DESIGN.md D-067, all waste N2 not used
      for regeneration (S17 76,560 - S12A 18,486 kg/h); was 31,450'
    assumed: true
  outlet_flow:
    value: 58930.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S12E (58,074 kg/h dry, the water uptake not in the flowsheet,
      DESIGN.md D-067) + 856 kg/h water evaporated at the design duty (scripts/datasheet_sizing.py section 12
      (DESIGN.md D-068 (8))): the gas leaves saturated at about 20 C'
    assumed: true
  chilled_water_flow:
    value: 39.9
    unit: m3/h
    source: 'scripts/datasheet_sizing.py section 12 (DESIGN.md D-068 (8)): DCAC upper section 34.4 m3/h (640.2
      kW, 10 -> 26 C, D-067) + E-3105 5.4 m3/h (63.3 kW, 10 -> 20 C)'
    assumed: true
  chilled_water_temperatures:
    value: 25.2 -> 10
    unit: °C
    source: 'DESIGN.md D-005 / D-067 (10 C supply ASSUMED); the return mixed from the DCAC upper section
      (~26 C, D-067) and E-3105 (20 C) (scripts/datasheet_sizing.py section 12 (DESIGN.md D-068 (8)))'
    assumed: true
  water_evaporated:
    value: 856
    unit: kg/h
    source: 'scripts/datasheet_sizing.py section 12 (DESIGN.md D-068 (8)): energy balance, the 703.4 kW duty
      taken up by S12B (58,074 kg/h dry, 13 C, 105 kPa(a)) leaving saturated at 20.3 C (N2 sensible from the
      property adapter, water IAPWS-95); 1,173 kg/h at the ~1,000 kW capability of D-067 (gas out 25.4 C).
      D-067 estimated 1.1-1.5 t/h'
    assumed: true
  make_up_water:
    value: 619
    unit: kg/h
    source: 'scripts/datasheet_sizing.py section 12 (DESIGN.md D-068 (8)): evaporation 856 kg/h less the 237
      kg/h the DCAC upper section condenses into the chilled water (S3CU); 937 kg/h at the 1,000 kW
      capability. Blowdown for the salts the evaporation concentrates comes on top (water treatment,
      detail engineering). From the CW supply via LV-1107 on CW-1003 (P-01), sized for up to 1.5 t/h
      (D-069)'
    assumed: true
design:
  pressure_barg:
    value: 1.0
    unit: barg
    source: equipment/equipment-list.yaml
  temperature_degc:
    value: 60.0
    unit: degC
    source: equipment/equipment-list.yaml
materials:
  main:
    value: CS lined / PP packing
    source: equipment/equipment-list.yaml
nozzles:
- name: N1
  dn: 700
  lines:
  - WN-1001
  source: pid/P-01.xml
- name: N2
  dn: 700
  lines:
  - WN-1002
  source: pid/P-01.xml
- name: N3
  dn: 150
  lines:
  - CW-1003
  source: pid/P-01.xml
- name: N4
  dn: 150
  lines:
  - CHW-1001
  source: pid/P-01.xml
- name: N5
  dn: 150
  lines:
  - CHWR-1001
  source: pid/P-01.xml (chilled-water return to the top distributor, D-069)
- name: I1
  lines: []
  source: pid/P-01.xml
type_specific:
  diameter_m:
    value: 4.5
    unit: m
    source: equipment/equipment-list.yaml dimensions
  height_m:
    value: 22.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  volume_m3:
    value: 349.895
    unit: m3
    source: 'equipment/equipment-list.yaml dimensions: pi/4 D^2 x height (overall, including heads and
      skirt: an upper bound)'
    assumed: true
  number_of_stages:
    value: not_applicable
    unit: ''
    reason: an evaporative cooler (water cooled by evaporation into dry waste N2 on packing), not a
      distillation; its packing is sized in transfer units (packing_height_m), not in stages
  adiabatic_saturation_temperature_degc:
    value: 2.3
    unit: degC
    source: 'scripts/datasheet_sizing.py section 9 (DESIGN.md D-068 (8)): energy balance of S12B (dry, 13 C, 105 kPa(a), 58,074
      kg/h) saturated with water fed at that temperature (N2 enthalpy property adapter, water IAPWS-95;
      psychrometry, Perry''s 8th ed. Section 12): the lowest water temperature the dry waste N2 can reach
      (independent of the flow; 8.54 C with the former 25 C inlet, D-060 (3))'
    assumed: true
  gas_load_factor_pa05:
    value: 0.906
    unit: Pa^0.5
    source: 'scripts/datasheet_sizing.py section 9 (DESIGN.md D-068 (8)): F = u rho^0.5, 58,074 kg/h at 13 C, 105 kPa(a) (rho
      1.253 kg/m3, property adapter), D 4.5 m (equipment list): u 0.81 m/s (0.49 Pa^0.5 at the former 31,450
      kg/h)'
    assumed: true
  liquid_load_m3_m2h:
    value: 2.51
    unit: m3/(m2 h)
    source: 'scripts/datasheet_sizing.py section 9 (DESIGN.md D-068 (8)): 39.9 m3/h chilled water over 15.9 m2;
      low for packing wetting: the supplier confirms the packing and distributor'
    assumed: true
  duty_kw:
    value: 703
    unit: kW
    source: 'scripts/datasheet_sizing.py section 12 (DESIGN.md D-068 (8)): the demand, DCAC upper section 640.2 kW
      (`cheme process simulate` C1101U, D-067) + E-3105 63.3 kW (E3105, D-067); D-067 puts the cooler''s
      capability with 58,000 kg/h of dry N2 at about 1,000 kW of 10 C water (a ~30 % margin), to be
      confirmed by the packing supplier'
    assumed: true
  packing_height_m:
    value: supplier
    unit: m
    source: 'packing supplier: transfer units of the chosen packing. Enquiry basis: 39.9 m3/h of water at ~25 C
      cooled to 10 C (703 kW, up to ~1,000 kW) by 58,074 kg/h dry waste N2 at 13 C, 1.05 bara; the 10 C
      outlet is 7.7 K above the N2''s adiabatic saturation temperature (2.3 C); 2 K approaches (D-067)'
  flooding_diameter_m:
    value: supplier
    unit: m
    source: 'packing supplier''s hydraulic rating (no flooding correlation in cheme-as-code is cleanly
      sourced); the 4.5 m of the equipment list (ASSUMED) runs at F 0.91 Pa^0.5 and 2.5 m3/(m2 h)'
  process_streams:
  - stream: S12B
    direction: in
    title: Waste N2 to evaporative cooler
    source: process/flowsheet.yaml (case design)
  - stream: S12E
    direction: out
    title: Evaporative cooler gas out
    source: process/flowsheet.yaml (case design)
  minimum_stages:
    value: not_applicable
    unit: ''
    reason: Fenske minimum stages apply to a distillation; an evaporative cooler has no key components
  minimum_reflux_ratio:
    value: not_applicable
    unit: ''
    reason: no reflux in an evaporative cooler
  theoretical_stages:
    value: not_applicable
    unit: ''
    reason: an evaporative cooler is sized in transfer units, not theoretical stages
sizing_basis: []
notes: 'Waste N2 58,074 kg/h (~46,000 Nm3/h, DESIGN.md D-067) cools the closed chilled-water loop to ~10 C
  (DCAC upper section and E-3105, returns CHWR-1001 / CHWR-3001), top vent WN-1002 to atmosphere; make-up
  CW-1003 via LV-1107 for the evaporation. ASSUMED. DESIGN.md D-060 (3), D-063, D-068 (8): adiabatic
  saturation limit 2.3 C, duty, evaporation and hydraulic loads calculated; the packing height and flooding
  diameter are the packing supplier''s (markers); the allowable gas pressure drop is set by the waste-N2
  path (D-071); the stage fields do not apply (not a distillation).'
