# Datasheet, first drafted by `cheme datasheets draft` from equipment/equipment-list.yaml, pid/P-01.xml, process/flowsheet.yaml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: C-1102
type: ProcessColumn
service: Evaporative cooler (chilled water)
draft: false
operating:
  inlet_pressure:
    value: 1.05
    unit: bar(a)
    source: 'process/flowsheet.yaml stream S12B (case design), assumed: DESIGN.md 3, stream 12b'
    assumed: true
  inlet_temperature:
    value: 13.0
    unit: °C
    source: 'process/flowsheet.yaml stream S12B (case design), assumed: the E-3101 warm end at 13 C
      (DESIGN.md D-061), outlet of the splitter X3101'
    assumed: true
  inlet_flow:
    value: 31450.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S12B (case design), assumed: DESIGN.md 3, stream 12b'
    assumed: true
  outlet_flow:
    value: 31450.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S12E (case design), assumed: = stream 12b (water uptake not
      stated)'
    assumed: true
design:
  pressure_barg:
    value: 1.0
    unit: barg
    source: equipment/equipment-list.yaml
  temperature_degc:
    value: 60.0
    unit: degC
    source: equipment/equipment-list.yaml
materials:
  main:
    value: CS lined / PP packing
    source: equipment/equipment-list.yaml
nozzles:
- name: N1
  dn: 700
  lines:
  - WN-1001
  source: pid/P-01.xml
- name: N2
  dn: 700
  lines:
  - WN-1002
  source: pid/P-01.xml
- name: N3
  dn: 150
  lines:
  - CW-1003
  source: pid/P-01.xml
- name: N4
  dn: 150
  lines:
  - CHW-1001
  source: pid/P-01.xml
- name: I1
  lines: []
  source: pid/P-01.xml
type_specific:
  diameter_m:
    value: 4.5
    unit: m
    source: equipment/equipment-list.yaml dimensions
  height_m:
    value: 22.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  volume_m3:
    value: 349.895
    unit: m3
    source: 'equipment/equipment-list.yaml dimensions: pi/4 D^2 x height (overall, including heads and
      skirt: an upper bound)'
    assumed: true
  number_of_stages:
    value: not_applicable
    unit: ''
    reason: an evaporative cooler (water cooled by evaporation into dry waste N2 on packing), not a
      distillation; its packing is sized in transfer units (packing_height_m), not in stages
  adiabatic_saturation_temperature_degc:
    value: 2.3
    unit: degC
    source: 'scripts/datasheet_sizing.py section 9 (DESIGN.md D-063 (3)): energy balance of S12B (dry, 13 C, 105 kPa(a), 31,450
      kg/h) saturated with water fed at that temperature (N2 enthalpy property adapter, water IAPWS-95;
      psychrometry, Perry''s 8th ed. Section 12): the lowest water temperature the dry waste N2 can reach
      (8.54 C with the former 25 C inlet, D-060 (3))'
    assumed: true
  gas_load_factor_pa05:
    value: 0.492
    unit: Pa^0.5
    source: 'scripts/datasheet_sizing.py section 9 (DESIGN.md D-063 (3)): F = u rho^0.5, 31,450 kg/h at 13 C, 105 kPa(a) (rho
      1.247 kg/m3, property adapter), D 4.5 m (equipment list): u 0.440 m/s'
    assumed: true
  liquid_load_m3_m2h:
    value: 6.29
    unit: m3/(m2 h)
    source: 'scripts/datasheet_sizing.py section 9 (DESIGN.md D-063 (3)): 100 m3/h water over 15.9 m2'
    assumed: true
  duty_kw:
    value: supplier
    unit: kW
    source: 'with the C-1101 packing supplier: the chilled-water duty is the C-1101 upper section''s, set by
      the intermediate air temperature the supplier chooses (C-1101 total 1,201 kW, D-058); the waste N2
      take-up of water follows from it'
  packing_height_m:
    value: supplier
    unit: m
    source: 'packing supplier: transfer units of the chosen packing. Enquiry basis: water cooled to 10 C by
      31,450 kg/h dry waste N2 at 13 C, 1.05 bara; the 10 C outlet is 7.7 K above the N2''s adiabatic
      saturation temperature (2.3 C)'
  flooding_diameter_m:
    value: supplier
    unit: m
    source: 'packing supplier''s hydraulic rating (no flooding correlation in cheme-as-code is cleanly
      sourced); the 4.5 m of the equipment list (ASSUMED) runs at F 0.49 Pa^0.5 and 6.3 m3/(m2 h)'
  process_streams:
  - stream: S12B
    direction: in
    title: Waste N2 to evaporative cooler
    source: process/flowsheet.yaml (case design)
  - stream: S12E
    direction: out
    title: Evaporative cooler gas out
    source: process/flowsheet.yaml (case design)
  minimum_stages:
    value: not_applicable
    unit: ''
    reason: Fenske minimum stages apply to a distillation; an evaporative cooler has no key components
  minimum_reflux_ratio:
    value: not_applicable
    unit: ''
    reason: no reflux in an evaporative cooler
  theoretical_stages:
    value: not_applicable
    unit: ''
    reason: an evaporative cooler is sized in transfer units, not theoretical stages
sizing_basis: []
notes: 'Waste N2 25,000 Nm3/h cools water to ~10 C, top vent to atmosphere. ASSUMED. DESIGN.md D-060 (3),
  D-063: adiabatic saturation limit 2.3 C (waste N2 at 13 C since D-061) and hydraulic loads calculated;
  duty, packing height and flooding diameter are the packing supplier''s (markers); the stage fields do not
  apply (not a distillation).'
