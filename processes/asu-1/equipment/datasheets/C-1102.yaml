# Datasheet, first drafted by `cheme datasheets draft` from equipment/equipment-list.yaml, pid/P-01.xml, process/flowsheet.yaml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: C-1102
type: ProcessColumn
service: Evaporative cooler (chilled water)
draft: false
operating:
  inlet_pressure:
    value: 1.05
    unit: bar(a)
    source: 'process/flowsheet.yaml stream S12B (case design), assumed: DESIGN.md 3, stream 12b'
    assumed: true
  inlet_temperature:
    value: 13.0
    unit: °C
    source: 'process/flowsheet.yaml stream S12B (case design), assumed: the E-3101 warm end at 13 C
      (DESIGN.md D-061), outlet of the splitter X3101'
    assumed: true
  inlet_flow:
    value: 58074.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S12B (case design), assumed: DESIGN.md D-067, all waste N2 not used
      for regeneration (S17 76,560 - S12A 18,486 kg/h); was 31,450'
    assumed: true
  outlet_flow:
    value: 58924.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S12E (58,074 kg/h dry, the water uptake not in the flowsheet,
      DESIGN.md D-067) + 850 kg/h water evaporated at the design duty (scripts/datasheet_sizing.py section 12
      (DESIGN.md D-090)): the gas leaves saturated at about 20 C'
    assumed: true
  chilled_water_flow:
    value: 39.6
    unit: m3/h
    source: 'scripts/datasheet_sizing.py section 12 (DESIGN.md D-090): DCAC upper section 34.1 m3/h (634.3
      kW, 10 -> 26 C, D-089) + E-3105 5.4 m3/h (63.3 kW, 10 -> 20 C): 39.55 m3/h'
    assumed: true
  chilled_water_temperatures:
    value: 25.2 -> 10
    unit: °C
    source: 'DESIGN.md D-005 / D-067 (10 C supply ASSUMED); the return mixed from the DCAC upper section
      (~26 C, D-067) and E-3105 (20 C) (scripts/datasheet_sizing.py section 12 (DESIGN.md D-068 (8)))'
    assumed: true
  water_evaporated:
    value: 850
    unit: kg/h
    source: 'scripts/datasheet_sizing.py section 12 (DESIGN.md D-090): energy balance, the 697.6 kW duty
      taken up by S12B (58,074 kg/h dry, 13 C, 105 kPa(a)) leaving saturated at 20.2 C (N2 sensible from the
      property adapter, water IAPWS-95); 1,173 kg/h at the ~1,000 kW capability of D-067 (gas out 25.4 C).
      D-067 estimated 1.1-1.5 t/h'
    assumed: true
  make_up_water:
    value: 621
    unit: kg/h
    source: 'scripts/datasheet_sizing.py section 12 (DESIGN.md D-090): evaporation 850 kg/h less the 228
      kg/h the DCAC upper section condenses into the chilled water (S3CU); 945 kg/h at the 1,000 kW
      capability. Blowdown for the salts the evaporation concentrates comes on top (water treatment,
      detail engineering). From the CW supply via LV-1107 on CW-1003 (P-01), sized for up to 1.5 t/h
      (D-069)'
    assumed: true
design:
  pressure_barg:
    value: 1.0
    unit: barg
    source: equipment/equipment-list.yaml
  temperature_degc:
    value: 60.0
    unit: degC
    source: equipment/equipment-list.yaml
materials:
