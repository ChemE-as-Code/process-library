type_specific:
  height_m:
    value: 8.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  length_m:
    value: 4.8
    unit: m
    source: equipment/equipment-list.yaml dimensions
  width_m:
    value: 2.4
    unit: m
    source: equipment/equipment-list.yaml dimensions
  weight_t:
    value: 30.0
    unit: t
    source: equipment/equipment-list.yaml dimensions
  duty_kw:
    value: 5835
    unit: kW
    source: 'scripts/datasheet_sizing.py section 5 (DESIGN.md D-068 (5)): warm side, Q = sum n (h_in -
      h_out): main air S4A 96,000 kg/h 15 C 5.6 bara -> S5 -173 C 5.5 bara 5,234.9 kW + booster air S4E
      14,870 kg/h 15 C 8.45 bara -> S5B -124.7 C 8.25 bara 600.1 kW (DESIGN.md D-066, D-067); enthalpies
      by the property adapter (thermo 0.6.1, PR) at the flowsheet states. The cold side (S14 -> S9 720.7,
      S15 -> S7 1,027.7, S16C -> S17 4,086.3 kW) balances it within 0.3 kW: since D-103 the cold-box heat
      in-leak (50 kW, ASSUMED) is in the model and the waste N2 leaves at the simulated 9.49 C; the
      refrigeration left over in the simulation (~78 kW) shows as its 5.5 K warm-end approach; on the
      governing cold-box balance it is ~25 kW (D-104)'
    assumed: true
  area_m2:
    value: supplier
    unit: m2
    reason: 'brazed aluminium plate-fin supplier: the area of a multi-stream plate-fin exchanger follows
      from its fin geometry and layer arrangement along the composite curves. Enquiry basis (DESIGN.md
      D-066, D-067, D-068 (5), D-103): duty 5,835 kW, both airs in at 15 C and the products out at 13
      C (2 K warm end; the booster air no longer 27 K warmer), the waste N2 in at -176.6 C (after E-3102
      and the lumped heat in-leak) and out at 9.5 C; the supplier confirms the 2 K warm end and the 50
      kW heat leak (D-067, D-103)'
  ua_kw_k:
    value: 1001
    unit: kW/K
    source: 'scripts/datasheet_sizing.py section 5 (DESIGN.md D-068 (5), rerun on the D-103 states): UA
      = sum dQ / LMTD over 600 intervals of the warm and cold composite curves paired from the warm end
      (property adapter enthalpies, thermo PR): warm S4A -> S5 and S4E -> S5B (5,835 kW); cold S14 -> S9
      and S15 -> S7 from saturated vapour at 530 / 140 kPa(a) to 13 C (D-061), S16C -> S17 from -176.64
      to the simulated 9.49 C. Was 1,796 kW/K, an upper bound with the cold side''s 126 kW surplus left
      at the cold end; with the heat leak in the model the curves balance and the surplus refrigeration
      opens the cold end to 6.9 K (722 kW/K with the 40 C booster air, D-063)'
    assumed: true
  minimum_approach_k:
    value: 2.0
    unit: K
    source: 'scripts/datasheet_sizing.py section 5 (DESIGN.md D-068 (5), rerun on the D-103 states), the
      composite curves of ua_kw_k: 2 K at the warm end (both airs 15 C against the 13 C products, D-061,
      D-067); 6.87 K at the cold end; DWSIM E3101 2.00 K (process/simulation-run.json)'
    assumed: true
  process_streams:
  - stream: S4A
    direction: in
    title: Main air to E-3101
    source: process/flowsheet.yaml (case design)
  - stream: S4E
    direction: in
    title: Boosted air to E-3101
    source: process/flowsheet.yaml (case design)
  - stream: S5
    direction: out
    title: HP column feed
    source: process/flowsheet.yaml (case design)
  - stream: S5B
    direction: out
    title: Expander feed
    source: process/flowsheet.yaml (case design)
  - stream: S14
    direction: in
    title: Cold HP nitrogen
    source: process/flowsheet.yaml (case design)
  - stream: S15
    direction: in
    title: Cold GOX
    source: process/flowsheet.yaml (case design)
  - stream: S16C
    direction: in
    title: Waste nitrogen to the main heat exchanger (with the cold-box heat in-leak)
    source: process/flowsheet.yaml (case design); DESIGN.md D-066, D-103 (S16B from E-3102 plus the lumped
      heat in-leak HL3101)
  - stream: S17
    direction: out
    title: Warm waste nitrogen
    source: process/flowsheet.yaml (case design)
  - stream: S7
    direction: out
    title: GOX product
    source: process/flowsheet.yaml (case design)
  - stream: S9
    direction: out
