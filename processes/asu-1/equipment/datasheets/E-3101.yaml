notes: 'Streams: air, booster air, GOX, GAN, waste N2. Max design temperature 65 C. O2 service (D-009).
  Bank of 4 cores ~1.2 x 1.2 x 7.3 m side by side with headers, standing vertical (warm end up). ASSUMED.
  Duty (5,211 kW, warm side) calculated (D-053 (5)); the area is the supplier''s (marker), UA and approach
  from the composite curves (DESIGN.md D-060 (4)). Finding: at the flowsheet''s cold outlets of 25 C the cold
  composite crosses the warm one at the warm end (the main air enters at 15 C), so S7 / S9 / S17 at 25 C
  cannot leave E-3101; 13 C is recommended (D-060 (6)). The UA is to be redone with the cold inlet states of
  the double-column simulation (D-059).'
