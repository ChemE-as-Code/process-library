type_specific:
  height_m:
    value: 8.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  length_m:
    value: 4.8
    unit: m
    source: equipment/equipment-list.yaml dimensions
  width_m:
    value: 2.4
    unit: m
    source: equipment/equipment-list.yaml dimensions
  weight_t:
    value: 30.0
    unit: t
    source: equipment/equipment-list.yaml dimensions
  duty_kw:
    value: 5835
    unit: kW
    source: 'scripts/datasheet_sizing.py section 5 (DESIGN.md D-068 (5)): warm side, Q = sum n (h_in -
      h_out): main air S4A 96,000 kg/h 15 C 5.6 bara -> S5 -173 C 5.5 bara 5,234.9 kW + booster air S4E
      14,870 kg/h 15 C 8.45 bara -> S5B -124.7 C 8.25 bara 600.1 kW (DESIGN.md D-066, D-067); enthalpies
      by the property adapter (thermo 0.6.1, PR) at the flowsheet states. The cold side (S14 -> S9 720.7,
      S15 -> S7 1,027.7, S16B -> S17 4,213.0 kW) can take 126.4 kW more: the margin for the heat leak
      into the exchanger and its warm-end approach (D-067 closes the whole cold box at a 75.2 kW leak)'
    assumed: true
  area_m2:
    value: supplier
    unit: m2
    reason: 'brazed aluminium plate-fin supplier: the area of a multi-stream plate-fin exchanger follows
      from its fin geometry and layer arrangement along the composite curves. Enquiry basis (DESIGN.md
      D-066, D-067, D-068 (5)): duty 5,835 kW, both airs in at 15 C and the products out at 13 C (2 K
      warm end; the booster air no longer 27 K warmer), the waste N2 in at -178.9 C after E-3102; the
      supplier confirms the 2 K warm end and the 50 kW heat leak (D-067)'
  ua_kw_k:
    value: 1796
    unit: kW/K
    source: 'scripts/datasheet_sizing.py section 5 (DESIGN.md D-068 (5)): UA = sum dQ / LMTD over 600
      intervals of the warm and cold composite curves paired from the warm end (property adapter enthalpies,
      thermo PR): warm S4A -> S5 and S4E -> S5B (5,835 kW); cold S14 -> S9 and S15 -> S7 from saturated
      vapour at 530 / 140 kPa(a), S16B -> S17 from -178.87 C; outlets at 13 C (S7, S9, S17, D-061). An
      upper bound: the 2 K warm end runs over the whole warm section and the cold side''s 126 kW surplus
      is left at the cold end (was 722 kW/K with the 40 C booster air, D-063)'
    assumed: true
  minimum_approach_k:
    value: 2.0
    unit: K
    source: 'scripts/datasheet_sizing.py section 5 (DESIGN.md D-068 (5)), the composite curves of ua_kw_k
      (same states): 2 K at the warm end (both airs 15 C against the 13 C products, D-061, D-067); 2.05
      K at the cold end of the warm side'
    assumed: true
  process_streams:
  - stream: S4A
    direction: in
    title: Main air to E-3101
    source: process/flowsheet.yaml (case design)
  - stream: S4E
    direction: in
    title: Boosted air to E-3101
    source: process/flowsheet.yaml (case design)
  - stream: S5
    direction: out
    title: HP column feed
    source: process/flowsheet.yaml (case design)
  - stream: S5B
    direction: out
    title: Expander feed
    source: process/flowsheet.yaml (case design)
  - stream: S14
    direction: in
    title: Cold HP nitrogen
    source: process/flowsheet.yaml (case design)
  - stream: S15
    direction: in
    title: Cold GOX
    source: process/flowsheet.yaml (case design)
  - stream: S16B
    direction: in
    title: Waste nitrogen from the subcooler
    source: process/flowsheet.yaml (case design); DESIGN.md D-066
  - stream: S17
    direction: out
    title: Warm waste nitrogen
    source: process/flowsheet.yaml (case design)
  - stream: S7
    direction: out
    title: GOX product
    source: process/flowsheet.yaml (case design)
  - stream: S9
    direction: out
    title: GAN product
    source: process/flowsheet.yaml (case design)
  lmtd_k:
    value: not_applicable
    unit: K
    reason: a multi-stream plate-fin exchanger with five streams; one LMTD does not describe it, the composite
      curves do (ua_kw_k, minimum_approach_k)
sizing_basis:
- parameter: cold outlet temperatures
  value: 13 C (2 K warm-end approach to the 15 C main air, ASSUMED; in the flowsheet since D-061)
  reference: DESIGN.md D-061
- parameter: cold inlet states
  value: S14 / S15 saturated vapour at 5.3 / 1.4 bara (DWSIM column pressures); S16B from E-3102 at -178.87
    C
  reference: DESIGN.md D-059, D-061, D-066
- parameter: heat leak
  value: the cold side's 126 kW surplus over the warm side (the cold box closes at a 75.2 kW leak against
    50 kW ASSUMED)
  reference: DESIGN.md D-067
notes: 'Streams: air, booster air, GOX, GAN, waste N2. Max design temperature 65 C. O2 service (D-009).
  Bank of 4 cores ~1.2 x 1.2 x 7.3 m side by side with headers, standing vertical (warm end up), kept
  (ASSUMED; +11 % duty and a closer warm end on the same bank: the supplier''s core count decides). Duty
  5,835 kW (warm side), UA and approach from the composite curves on the D-066 / D-067 states (DESIGN.md
  D-068 (5)); the area is the supplier''s (marker). The booster air now enters at 15 C after the trim
  cooler E-3105 (D-067), and the cold box closes at a 75.2 kW heat leak against the ASSUMED 50 kW. If
  E-3105 is lost it closes at only +11.9 kW (turn the liquid production down). The supplier confirms the
  2 K warm end and the heat leak.'
