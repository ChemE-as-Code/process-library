notes: 'Streams: air, booster air, GOX, GAN, waste N2. Max design temperature 65 C. O2 service (D-009).
  Bank of 4 cores ~1.2 x 1.2 x 7.3 m side by side with headers, standing vertical (warm end up). ASSUMED.
  Duty 5,242 kW (warm side), UA and approach from the composite curves on the D-061 states (DESIGN.md
  D-063); the area is the supplier''s (marker). The exchanger closes only with the waste N2 warmed first in
  the subcooler E-3102 (293 kW, 80.3 -> 95.8 K). The cold box as a whole is ~78 kW short of refrigeration at
  940 kg/h liquid (D-061: the booster air enters at 40 C, +105 kW against the section 3 budget); options in
  D-061 (cool S4D towards 15 C, more expander flow, less liquid). The 27 K difference between the booster air
  in and the products out at the warm end is for the supplier to confirm.'
