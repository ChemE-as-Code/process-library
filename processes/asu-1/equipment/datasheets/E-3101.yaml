# Datasheet, first drafted by `cheme datasheets draft` from equipment/equipment-list.yaml, pid/P-03.xml, process/flowsheet.yaml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: E-3101
type: PlateHeatExchanger
service: Main heat exchanger (brazed aluminium plate-fin)
draft: false
operating:
  main_air:
    value: 96000 kg/h, 15 C 5.6 bara (S4A) -> -173 C 5.5 bara (S5)
    unit: ''
    source: process/flowsheet.yaml streams S4A (state calculated by `cheme process simulate`, flow ASSUMED)
      and S5 (ASSUMED), case design; DESIGN.md D-066 (was 83,190 kg/h)
    assumed: true
  booster_air:
    value: 14870 kg/h, 15 C 8.45 bara (S4E) -> -124.7 C 8.25 bara (S5B)
    unit: ''
    source: process/flowsheet.yaml streams S4E (after the trim cooler E-3105, DESIGN.md D-067; was 40
      C) and S5B (ASSUMED, D-061), case design
    assumed: true
  hp_nitrogen:
    value: 12510 kg/h, saturated vapour 5.3 bara -178.43 C (S14) -> 13 C 5.2 bara (S9)
    unit: ''
    source: 'scripts/datasheet_sizing.py section 5 (DESIGN.md D-068 (5)): S14 stored as vapour at its
      simulated pressure (D-065 (7), D-066), dew point 94.72 K by the property adapter; S9 13 C 5.2 bara
      (ASSUMED, D-061)'
    assumed: true
  gox:
    value: 20860 kg/h, saturated vapour 1.4 bara -179.86 C (S15) -> 13 C 1.15 bara (S7)
    unit: ''
    source: 'scripts/datasheet_sizing.py section 5 (DESIGN.md D-068 (5)): S15 stored as vapour at its
      simulated pressure (D-065 (7), D-066), dew point 93.29 K by the property adapter; S7 13 C 1.15 bara
      (ASSUMED, D-061)'
    assumed: true
  waste_n2:
    value: 76560 kg/h, -178.87 C 1.3 bara (S16B, after E-3102) -> 13 C 1.15 bara (S17)
    unit: ''
    source: 'process/flowsheet.yaml stream S16B (calculated by `cheme process simulate`, DESIGN.md D-066:
      the subcooler E-3102 is now simulated, 304 kW, S16 -192.29 C from the C-3102 top); S17 13 C 1.15
      bara (ASSUMED, D-061); was 63,750 kg/h'
