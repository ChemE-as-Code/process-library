    reason: a multi-stream plate-fin exchanger with five streams; one LMTD does not describe it, the composite
      curves do (ua_kw_k, minimum_approach_k)
  rating:
    value: supplier
    unit: ''
    source: 'awaited from the supplier or the named study (D-103); unsupported in cheme-as-code: no thermal-hydraulic rating (tube count and layout, film
      coefficients, fouling, pressure drop, vibration; TEMA): from the supplier''s rating (docs/framework/sizing.md)
      (cheme datasheets fill)'
  mechanical_design:
    value: supplier
    unit: ''
    source: 'awaited from the supplier or the named study (D-103); unsupported in cheme-as-code: no mechanical design to a code (wall thickness, MAWP,
      nozzle loads): from the supplier or a mechanical calculation (docs/framework/sizing.md) (cheme datasheets
      fill)'
  corrosion_allowance_mm:
    value: supplier
    unit: mm
    source: 'awaited from the supplier or the named study (D-103); unsupported in cheme-as-code: no material selection or corrosion allowance: the material
      is the equipment list''s, given; the allowance from a materials/corrosion review (docs/framework/sizing.md)
      (cheme datasheets fill)'
  relief_protection:
    value: supplier
    unit: ''
    source: 'awaited from the supplier or the named study (D-103); unsupported in cheme-as-code: no relief scenarios or device sizing (API 520/521, ISO
      4126): from a relief study (docs/framework/sizing.md) (cheme datasheets fill)'
sizing_basis:
- parameter: cold outlet temperatures
  value: GOX and GAN 13 C (2 K warm-end approach to the 15 C main air, ASSUMED; in the flowsheet since D-061);
    waste N2 9.49 C (simulated, D-103)
  reference: DESIGN.md D-061, D-103
- parameter: cold inlet states
  value: S14 / S15 saturated vapour at 5.3 / 1.4 bara (DWSIM column pressures); S16C at -176.64 C (S16B
    from E-3102 at -178.87 C plus the lumped heat in-leak)
  reference: DESIGN.md D-059, D-061, D-066, D-103
- parameter: heat leak
  value: 50 kW into the whole cold box (ASSUMED, casing conduction estimate x 2.5), in the simulation as
    HL3101. On the governing cold-box balance (D-067, D-104) the cold box closes at a total leak of ~75 kW
    with the waste N2 at 13 C (1.5 x the estimate); with E-3105 lost at ~12 kW, a ~38 kW deficit against
    the 50 kW. The simulation shows ~130 kW (~65 kW with E-3105 lost), because its column model has ~49 kW
    of refrigeration the plant does not (C-3102 top residual, E-3103 mismatch)
  reference: DESIGN.md D-067, D-103, D-104
- parameter: sizing_scope
  value: preliminary
  reference: 'cheme datasheets fill: the values it writes are preliminary process sizing (short-cut methods,
    declared or typical parameters), not a rating or a design to a code; not calculated: rating, mechanical
    code, materials corrosion, relief, dynamics controls (docs/framework/sizing.md)'
notes: 'Streams: air, booster air, GOX, GAN, waste N2. Max design temperature 65 C. O2 service (D-009).
  Bank of 4 cores ~1.2 x 1.2 x 7.3 m side by side with headers, standing vertical (warm end up), kept
  (ASSUMED; +11 % duty and a closer warm end on the same bank: the supplier''s core count decides). Duty
  5,835 kW (warm side), UA and approach from the composite curves on the D-066 / D-067 states (DESIGN.md
  D-068 (5)); the area is the supplier''s (marker). The booster air now enters at 15 C after the trim
  cooler E-3105 (D-067). Since D-103 the ASSUMED 50 kW heat leak is in the simulation and the waste N2
  leaves at 9.5 C. On the governing cold-box balance (D-067, D-104) the cold box closes at a total leak of
  ~75 kW (13 C warm end), and at ~12 kW if E-3105 is lost: against the 50 kW that is a ~38 kW deficit, so
  the liquid production is turned down by ~330 kg/h until E-3105 is back. The simulation shows ~130 kW and
  ~65 kW for the same two cases (~49 kW of column-model refrigeration, D-104); the plant is expected to run
  between the simulated 9.5 C and ~11.9 C waste warm end. The supplier confirms the 2 K warm end and the
  heat leak.'
