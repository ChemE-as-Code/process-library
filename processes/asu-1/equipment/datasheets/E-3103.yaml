# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: E-3103
type: PlateHeatExchanger
service: Main condenser-reboiler (bath type)
operating:
  condensing_side:
    value: C-3101 top nitrogen, 94.71 K (-178.45 C), 5.3 bara
    unit: ''
    source: '`cheme process simulate` (DWSIM 9.0.5, Peng-Robinson; DESIGN.md D-066): C3101 partial
      condenser, top 94.705 K; condenser pressure 5.3 bara (process/simulation.yaml, ASSUMED)'
    assumed: true
  reboiling_side:
    value: C-3102 sump oxygen, 93.27 K (-179.88 C), 1.4 bara
    unit: ''
    source: '`cheme process simulate` (DESIGN.md D-066): C3102 reboiler, bottom 93.267 K; reboiler pressure
      1.4 bara (process/simulation.yaml, ASSUMED). The sump liquid (LOX S10) holds 99.81 % O2 and the GOX
      drawn above it (S15) 99.71 % O2, against the 99.5 % specification'
    assumed: true
design:
  pressure_barg:
    value: 7.0
    unit: barg
    source: equipment/equipment-list.yaml
  temperature_degc:
    value: -196.0
    unit: degC
    source: equipment/equipment-list.yaml
materials:
  main:
    value: Aluminium 3003
    source: equipment/equipment-list.yaml
nozzles:
- name: N1
  dn: 300
  lines:
  - GAN-3002
  source: pid/P-03.xml
- name: N2
  dn: 150
  lines:
  - LN-3002
  source: pid/P-03.xml
type_specific:
  duty_kw:
    value: 4172
    unit: kW
    source: '`cheme process simulate` (DWSIM, DESIGN.md D-066): C3101 condenser 4,171.8 kW, the nitrogen
      condensed for the LN reflux S18 (29,280 kg/h) and the HP column reflux (reflux ratio 1.391); was 3,536
      kW (D-059). D-066 gives 4,170 kW'
    assumed: true
  reboil_duty_kw:
    value: 4166
    unit: kW
    source: '`cheme process simulate` (DESIGN.md D-066): C3102 reboiler 4,166.3 kW; the subcooler E-3102 (304
      kW) closes the balance (C-3101 condenses 4,172 kW). The 43.6 kW "top residual" of the full-reflux model
      of the condenser-less C-3102 is in it: the real column boils about 4,123 kW, leaving 49 kW (1.2 %) of
      condensation to spare (D-066)'
    assumed: true
  lmtd_k:
    value: 1.44
    unit: K
    source: '`cheme process simulate` (DESIGN.md D-066): 94.705 - 93.267 K; both sides condense and boil at
      nearly constant temperature, so the mean difference is the approach (ASSUMED: no superheat or
      subcooling in the bath, no static head in the sump)'
    assumed: true
  ua_kw_k:
    value: 2901
    unit: kW/K
    source: 'Q / dT = 4,172 kW / 1.438 K (on the condensing duty); was 2,296 kW/K (D-059)'
    assumed: true
  area_m2:
    value: supplier
    unit: m2
    reason: 'bath condenser-reboiler supplier (brazed aluminium cores in the LP sump): the area follows from
      its condensing and boiling coefficients at a 1.4 K approach, the bath level and the core geometry; no
      typical coefficient for it in cheme-as-code''s table. Enquiry basis (D-066): 4,172 kW condensing at
      94.7 K, 5.3 bara; 4,123-4,166 kW boiling at 93.3 K, 1.4 bara; UA about 2,900 kW/K'
sizing_basis:
- parameter: duty and temperatures
  value: the DWSIM double-column simulation (40 / 59 theoretical stages, Peng-Robinson, fitted Ar/O2 kij 0.0143)
  reference: DESIGN.md D-066
notes: 'In LP column sump, kept submerged (D-010). N2 side 7 barg, O2 side 3.5 barg. O2 service. Internal
  of C-3102: no dimensions and no placement of its own (D-028). ASSUMED. DESIGN.md D-066, D-068 (5): duty and
  temperatures from the double-column simulation (+18 % on D-059 with the HP column air 96,000 kg/h), the
  area is the supplier''s. The supplier confirms the 1.4 K approach and the column pressures that set it.'
