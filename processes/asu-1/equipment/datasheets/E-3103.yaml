tag: E-3103
type: PlateHeatExchanger
service: Main condenser-reboiler (bath type)
operating:
  condensing_side:
    value: C-3101 top nitrogen, 94.71 K (-178.44 C), 5.3 bara
    unit: ''
    source: '`cheme process simulate` (DWSIM 9.0.5, Peng-Robinson; DESIGN.md D-059): C3101 partial
      condenser, top 94.7111 K; condenser pressure 5.3 bara (process/simulation.yaml, ASSUMED)'
    assumed: true
  reboiling_side:
    value: C-3102 sump oxygen, 93.17 K (-179.98 C), 1.4 bara
    unit: ''
    source: '`cheme process simulate` (DESIGN.md D-059): C3102 reboiler, bottom 93.1742 K; reboiler pressure
      1.4 bara (process/simulation.yaml, ASSUMED). The simulated sump holds 97.0 % O2, not the 99.5 % of the
      specification (D-059)'
    assumed: true
design:
  pressure_barg:
    value: 7.0
    unit: barg
    source: equipment/equipment-list.yaml
  temperature_degc:
    value: -196.0
    unit: degC
    source: equipment/equipment-list.yaml
