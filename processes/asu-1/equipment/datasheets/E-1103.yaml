    the model's DN25 neck and flange, D-081 (7))
  assumed: true
type_specific:
  diameter_m:
    value: 1.4
    unit: m
    source: equipment/equipment-list.yaml dimensions
  height_m:
    value: 2.2
    unit: m
    source: equipment/equipment-list.yaml dimensions
  length_m:
    value: 7.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  weight_t:
    value: 9.0
    unit: t
    source: equipment/equipment-list.yaml dimensions
  duty_kw:
    value: 2797
    unit: kW
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-090): sensible Q = n Cp (386.49 - 313.15
      K) 2,312 kW (wet air 112,521 kg/h, dry-air Cp/Cv from the property adapter at the stage suction,
      water vapour IAPWS-95) + 726 kg/h condensed x 2,406 kJ/kg (IAPWS-95 at 40 C) 486 kW. The three MAC
      coolers 7,614 kW against the simulated Q1 7,728 kW (D-089)'
    assumed: true
  lmtd_k:
    value:
    - 45.74
    - 19.34
    unit: K
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-065 (2), D-090), per zone: (1) desuperheating,
      air 386.49 -> 324.96 K (dew point of 2.24 mol% water, the E-1102 outlet saturated at 40 C, at 602
      kPa(a), IAPWS-95) against CW 301.22 -> 308.15 K, LMTD; (2) condensing, air 324.96 -> 313.15 K along
      the equilibrium cooling curve (gas kept saturated) against CW 298.15 -> 301.22 K, mean temperature
      difference sum dQ / sum (dQ / dT) over 400 intervals. The single gas LMTD (38.32 K) puts the latent
      heat at the hot-end differences and is not used'
    assumed: true
  lmtd_correction_f:
    value:
    - 0.9623
    - 0.9829
    unit: ''
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-065 (2)): per zone on its terminal temperatures,
      1-2 shell and tube (ASSUMED), Bowman, Mueller and Nagle, Trans. ASME 62 (1940) 283'
    assumed: true
  overall_u_w_m2k:
    value: 160
    unit: W/(m2 K)
    source: 'ASSUMED design typical, middle of 20-300 W/(m2 K), Sinnott, Coulson & Richardson''s Chemical
      Engineering Vol. 6, 4th ed. (2005), Table 12.1, p. 637: cooler, gases / water (DESIGN.md D-053)'
    assumed: true
  area_m2:
    value: 557.4
    unit: m2
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-065 (2), D-090): sum of the zones, A =
      Q / (U F dT): desuperheating 1,939.3 kW / (160 x 0.9623 x 45.74 K) = 275.4 m2 + condensing 857.7
      kW (485.5 kW latent) / (160 x 0.9829 x 19.34 K) = 282.0 m2; no margin. The gas-cooler U in the condensing
      zone as well (ASSUMED; condensation raises the film coefficient, the supplier''s condensing-zone
      U may lower the area). 557.5 m2 at the 5.98 bara discharge of D-079, 557.6 m2 at 5.8 bara of D-066,
      493.2 m2 at the D-058 air'
    assumed: true
sizing_basis:
- parameter: zone duties (enquiry basis for the MAC package)
  value: desuperheating 113.3 -> 51.8 C 1,939 kW; condensing 51.8 -> 40 C 858 kW incl. 726 kg/h condensate
  reference: DESIGN.md D-065 (2), D-090
- parameter: air dew point at the cooler inlet
  value: 51.8 C (2.24 mol% water at 6.02 bara, IAPWS-95)
  reference: DESIGN.md D-058, D-065 (2)
notes: 'Air to 40 C. ASSUMED. Condensing aftercooler (DESIGN.md D-058): integral moisture separator in
  the air outlet, drain nozzle N5 to CD-1002 with gate valve HV-1113 and float trap ST-1113 on P-01, part
  of S1C (D-064). Separator type and pressure drop: supplier (MAC package). Enquiry requirements (D-065
  (6)): a high-level alarm on the separator (switch or level transmitter to the DCS, supplier''s connection),
  the float trap with integral strainer and test valve, sized for 726 kg/h at 6.02 bara with margin, no
  trap bypass (an open bypass blows compressed air to the drain).'
