  source: pid/P-01.xml
- name: N5
  dn: 25
  lines:
  - CD-1002
  source: pid/P-01.xml
  face: bottom
  orientation_deg: 0
  offset_m: 3.0
  elevation_m: 0.8
  projection_m: 0.167
  location_source: layout/equipment-placement.yaml (shell bottom at the air-outlet end, DESIGN.md D-064);
