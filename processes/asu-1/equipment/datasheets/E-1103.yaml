  head:
    value: ellipsoidal_2_1
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.head'
  support:
    type:
      value: saddles
      source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.support'
    height:
      value: 0.8
      unit: m
      source: 'cheme datasheets fill: layout/plant-model.yaml part E-1103/shell: underside of the shell
        above the base (the 3D model''s proportions, not a design)'
      assumed: true
  tangent_length:
    value: 5.81
    unit: m
    source: 'cheme datasheets fill: layout/plant-model.yaml part E-1103/shell: the generated shell between
      the heads (the 3D model''s proportions, not a vessel design)'
    assumed: true
  axis_deg:
    value: 0.0
    unit: deg
