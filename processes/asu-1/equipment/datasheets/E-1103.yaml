# Datasheet, first drafted by `cheme datasheets draft` from equipment/equipment-list.yaml, pid/P-01.xml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: E-1103
type: TubularHeatExchanger
service: MAC aftercooler
draft: false
operating:
  outlet_temperature:
    value: 40
    unit: °C
    source: 'equipment/equipment-list.yaml notes: air to 40 C'
    assumed: true
  air_inlet_pressure:
    value: 6.03
    unit: bar(a)
    source: 'K-1101 stage 3 discharge = process/flowsheet.yaml stream S2 (5.98 bara, D-079) + 0.05 bar aftercooler
      drop (process/simulation.yaml K1101, ASSUMED; scripts/datasheet_sizing.py section 1 (DESIGN.md D-080 (2)))'
    assumed: true
  air_inlet_temperature:
    value: 113.1
    unit: °C
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-080 (2)): K-1101 stage 3 discharge 386.21 K (ideal gas, Cp/Cv 1.403
      at the suction, eta_s 0.82, process/simulation.yaml, ASSUMED; discharge_temperature_k of
      equipment/datasheets/K-1101.yaml)'
    assumed: true
  air_flow:
    value: 112528
    unit: kg/h
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-080 (2)): S1 113,329 kg/h less the 801 kg/h condensed in E-1102;
      leaves as S2 (111,725 kg/h in the DWSIM simulation, D-079)'
    assumed: true
  condensate_flow:
    value: 728
    unit: kg/h
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-080 (2)): water above saturation at 40 C and 5.98 bara (IAPWS-95);
      to the moisture separator drain, part of S1C (1,604 kg/h for E-1102 and E-1103 in the DWSIM
      simulation, D-079)'
    assumed: true
  cooling_water_temperatures:
    value: 25 -> 35
    unit: °C
    source: process/design-basis.yaml utilities
  cooling_water_flow:
    value: 241.3
    unit: m3/h
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-080 (2)): Q / (cp 10 K), IAPWS-95 water at 30 C'
    assumed: true
design:
  pressure_barg:
    value: 8.0
    unit: barg
    source: equipment/equipment-list.yaml
  temperature_degc:
    value: 180.0
    unit: degC
    source: equipment/equipment-list.yaml
materials:
  main:
    value: CS shell / SS tubes
    source: equipment/equipment-list.yaml
nozzles:
- name: N1
  dn: 600
  lines:
  - AIR-1002
  source: pid/P-01.xml
  face: top
  orientation_deg: 180
  offset_m: 1.7
  elevation_m: 2.2
  location_source: layout/equipment-placement.yaml (air nozzle on the shell top, 1.8 m from the
    front end; at the ends, where the P&ID draws them, they would block the bundle pull; D-028,
    D-055 (8))
- name: N2
  dn: 600
  lines:
  - AIR-1002
  source: pid/P-01.xml
  face: top
  orientation_deg: 0
  offset_m: 2.7
  elevation_m: 2.2
  location_source: layout/equipment-placement.yaml (air nozzle on the shell top, 6.2 m from the
    front end; D-028, D-055 (8))
- name: N3
  dn: 300
  lines:
  - CW-1005
  source: pid/P-01.xml
- name: N4
  dn: 300
  lines:
  - CWR-1004
  source: pid/P-01.xml
- name: N5
  dn: 25
  lines:
  - CD-1002
  source: pid/P-01.xml
  face: bottom
  orientation_deg: 0
  offset_m: 3.0
  elevation_m: 0.8
  location_source: layout/equipment-placement.yaml (shell bottom at the air-outlet end, DESIGN.md D-064)
type_specific:
  diameter_m:
    value: 1.4
    unit: m
    source: equipment/equipment-list.yaml dimensions
  height_m:
    value: 2.2
    unit: m
    source: equipment/equipment-list.yaml dimensions
  length_m:
    value: 7.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  weight_t:
    value: 9.0
    unit: t
    source: equipment/equipment-list.yaml dimensions
  duty_kw:
    value: 2789
    unit: kW
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-080 (2)): sensible Q = n Cp (386.21 - 313.15 K) 2,303 kW (wet air
      112,528 kg/h, dry-air Cp/Cv from the property adapter at the stage suction, water vapour IAPWS-95)
      + 728 kg/h condensed x 2,406 kJ/kg (IAPWS-95 at 40 C) 487 kW. The three MAC coolers 7,584 kW against
      the simulated Q1 7,698 kW (D-079)'
    assumed: true
  lmtd_k:
    value: [45.6, 19.31]
    unit: K
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-065 (2), D-080 (2)), per zone: (1) desuperheating, air
      386.21 -> 324.92 K (dew point of 2.25 mol% water, the E-1102 outlet saturated at 40 C, at 598 kPa(a),
      IAPWS-95) against CW 301.22 -> 308.15 K, LMTD; (2) condensing, air 324.92 -> 313.15 K along the
      equilibrium cooling curve (gas kept saturated) against CW 298.15 -> 301.22 K, mean temperature
      difference sum dQ / sum (dQ / dT) over 400 intervals. The single gas LMTD (38.23 K) puts the
      latent heat at the hot-end differences and is not used'
    assumed: true
  lmtd_correction_f:
    value: [0.9623, 0.9829]
    unit: ''
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-065 (2)): per zone on its terminal temperatures,
      1-2 shell and tube (ASSUMED), Bowman, Mueller and Nagle, Trans. ASME 62 (1940) 283'
    assumed: true
  overall_u_w_m2k:
    value: 160
    unit: W/(m2 K)
    source: 'ASSUMED design typical, middle of 20-300 W/(m2 K), Sinnott, Coulson & Richardson''s Chemical
      Engineering Vol. 6, 4th ed. (2005), Table 12.1, p. 637: cooler, gases / water (DESIGN.md D-053)'
    assumed: true
  area_m2:
    value: 557.5
    unit: m2
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-065 (2), D-080 (2)): sum of the zones, A = Q / (U F dT):
      desuperheating 1,932 kW / (160 x 0.9623 x 45.6 K) = 275.2 m2 + condensing 857.3 kW (486.5 kW latent)
      / (160 x 0.9829 x 19.31 K) = 282.3 m2; no margin. The gas-cooler U in the condensing zone as well
      (ASSUMED; condensation raises the film coefficient, the supplier''s condensing-zone U may lower the
      area). 557.6 m2 at the 5.8 bara discharge of D-066, 493.2 m2 at the D-058 air'
    assumed: true
sizing_basis:
- parameter: zone duties (enquiry basis for the MAC package)
  value: desuperheating 113.1 -> 51.8 C 1,932 kW; condensing 51.8 -> 40 C 857 kW incl. 728 kg/h condensate
  reference: DESIGN.md D-065 (2), D-080 (2)
- parameter: air dew point at the cooler inlet
  value: 51.8 C (2.25 mol% water at 5.98 bara, IAPWS-95)
  reference: DESIGN.md D-058, D-065 (2)
notes: 'Air to 40 C. ASSUMED. Condensing aftercooler (DESIGN.md D-058): integral moisture separator in the
  air outlet, drain nozzle N5 to CD-1002 with gate valve HV-1113 and float trap ST-1113 on P-01, part of S1C
  (D-064). Separator type and pressure drop: supplier (MAC package). Enquiry requirements (D-065 (6)): a
  high-level alarm on the separator (switch or level transmitter to the DCS, supplier''s connection), the
  float trap with integral strainer and test valve, sized for 728 kg/h at 5.98 bara with margin, no trap
  bypass (an open bypass blows compressed air to the drain).'
