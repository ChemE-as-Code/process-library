  overall_length:
    value: 7.0
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.length'
  overall_height:
    value: 2.2
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.height (top of the shell
