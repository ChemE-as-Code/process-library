# Datasheet, first drafted by `cheme datasheets draft` from equipment/equipment-list.yaml, pid/P-01.xml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: E-1103
type: TubularHeatExchanger
service: MAC aftercooler
draft: false
operating:
  outlet_temperature:
    value: 40
    unit: °C
    source: 'equipment/equipment-list.yaml notes: air to 40 C'
    assumed: true
  air_inlet_pressure:
    value: 6.07
    unit: bar(a)
    source: K-1101 stage 3 discharge = process/flowsheet.yaml stream S2 (6.02 bara, D-089) + 0.05 bar
      aftercooler drop (process/simulation.yaml K1101, ASSUMED; scripts/datasheet_sizing.py section 1
      (DESIGN.md D-090))
    assumed: true
  air_inlet_temperature:
    value: 113.3
    unit: °C
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-090): K-1101 stage 3 discharge 386.49
      K (ideal gas, Cp/Cv 1.403 at the suction, eta_s 0.82, process/simulation.yaml, ASSUMED; discharge_temperature_k
      of equipment/datasheets/K-1101.yaml)'
    assumed: true
  air_flow:
    value: 112521
    unit: kg/h
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-090): S1 113,329 kg/h less the 808 kg/h
      condensed in E-1102; leaves as S2 (111,720 kg/h in the DWSIM simulation, D-089)'
    assumed: true
  condensate_flow:
    value: 726
    unit: kg/h
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-090): water above saturation at 40 C and
      6.02 bara (IAPWS-95); to the moisture separator drain, part of S1C (1,609 kg/h for E-1102 and E-1103
      in the DWSIM simulation, D-089)'
    assumed: true
  cooling_water_temperatures:
    value: 25 -> 35
    unit: °C
    source: process/design-basis.yaml utilities
  cooling_water_flow:
    value: 242.0
    unit: m3/h
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-090): Q / (cp 10 K), IAPWS-95 water at
      30 C'
    assumed: true
design:
  pressure_barg:
    value: 8.0
    unit: barg
    source: equipment/equipment-list.yaml
  temperature_degc:
    value: 180.0
    unit: degC
    source: equipment/equipment-list.yaml
materials:
  main:
    value: CS shell / SS tubes
    source: equipment/equipment-list.yaml
dimensions:
  orientation: horizontal
  outside_diameter:
