notes: '8.25 -> 1.35 bara, inlet -124.7 C, exhaust -178 C, 198 kW refrigeration (D-003, D-061). Overspeed
  trip SSHH-3108. Oil-lubricated bearings: N2 labyrinth seal gas with PDSLL-3115 permissive/trip, oil
  mist eliminator on the oil tank vent outside the cold box (D-012). ASSUMED. DESIGN.md D-061: the compander
  balances with no margin (expander 192.4 kW against booster 191.6 kW on the shaft); the cold box is ~78
  kW short of refrigeration at 940 kg/h liquid (options in D-061: cool S4D towards 15 C, more expander
  flow, ~670 kg/h less liquid). The compander supplier fixes the inlet temperature and the efficiency.'
