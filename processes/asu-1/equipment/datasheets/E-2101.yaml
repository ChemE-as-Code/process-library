# Datasheet, first drafted by `cheme datasheets draft` from equipment/equipment-list.yaml, pid/P-02.xml, process/flowsheet.yaml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: E-2101
type: ElectricHeater
service: Regeneration gas heater
draft: false
operating:
  inlet_pressure:
    value: 1.1
    unit: bar(a)
    source: 'process/flowsheet.yaml stream S12A (case design), assumed: DESIGN.md 3, stream 12a'
    assumed: true
  inlet_flow:
    value: 18486.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S12A (case design), assumed: DESIGN.md D-066 (+13 % with the
      air; was 16,350)'
    assumed: true
  inlet_temperature:
    value: 9.49
    unit: °C
    source: 'process/flowsheet.yaml stream S12A (case design), calculated by `cheme process simulate`:
      the E-3101 warm end S17 with the 50 kW cold-box heat in-leak (DESIGN.md D-103; was the assumed 13
      C of D-061), split at X3101'
  outlet_temperature:
    value: 200.0
    unit: °C
    source: 'process/flowsheet.yaml stream S12H (case design), assumed: DESIGN.md 3, stream 12a (heating)'
    assumed: true
  outlet_flow:
    value: 18486.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S12H (case design), assumed: DESIGN.md D-066'
    assumed: true
design:
  pressure_barg:
    value: 3.5
    unit: barg
    source: equipment/equipment-list.yaml
  temperature_degc:
    value: 260.0
    unit: degC
    source: equipment/equipment-list.yaml
materials:
  main:
    value: SS sheath / CS shell
    source: equipment/equipment-list.yaml
dimensions:
  overall_length:
    value: 3.0
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.length; ASSUMED at basic
      engineering (equipment list header, DESIGN.md D-028): the supplier sets it'
    assumed: true
  overall_width:
    value: 2.0
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.width; ASSUMED at basic
      engineering (equipment list header, DESIGN.md D-028): the supplier sets it'
    assumed: true
  overall_height:
    value: 3.0
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.height; ASSUMED at basic
      engineering (equipment list header, DESIGN.md D-028): the supplier sets it'
    assumed: true
weights:
  empty:
    value: 8.0
    unit: t
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.weight (empty); ASSUMED
      (equipment list header, DESIGN.md D-034): typical size of the duty, the item''s basis in its list
      note; the supplier gives the weight'
    assumed: true
nozzles:
- name: N1
  dn: 600
  lines:
  - RG-2001
  source: pid/P-02.xml
  face: side
  orientation_deg: 180
  elevation_m: 1.0
  location_source: layout/equipment-placement.yaml (gas inlet on the west side 1 m up; the P&ID draws
    it below the heater, at grade; D-055 (8))
- name: N2
  dn: 700
  lines:
  - RG-2002
  source: pid/P-02.xml
- name: I1
  lines: []
  source: pid/P-02.xml
type_specific:
  height_m:
    value: 3.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  length_m:
    value: 3.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  width_m:
    value: 2.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  weight_t:
    value: 8.0
    unit: t
    source: equipment/equipment-list.yaml dimensions
  duty_kw:
    value: 1130
    unit: kW
    source: 'DESIGN.md D-066: 1.13 MW peak (was 1.0 MW, +13 % with the regeneration gas), kept (D-103).
      The gas alone takes 1,006 kW from the simulated 9.5 to 200 C (18,486 kg/h, ideal-gas Cp of thermo,
      scripts/datasheet_sizing.py section 8; DWSIM E2101 1,008 kW; was 987 kW from the assumed 13 C);
      the remaining ~120 kW (11 %) covers the heater and bed heat-up losses (ASSUMED). Cycle average 377
      kW (flowsheet energy stream E3, ASSUMED, kept in D-103)'
    assumed: true
  allowable_gas_pressure_drop_kpa:
    value: 1.0
    unit: kPa
    source: 'DESIGN.md D-072, scripts/datasheet_sizing.py section 11: of the 10.1 kPa between the WN-3002
      tee (111.4 kPa(a)) and the atmosphere, the routed lines RG-2001 DN600 / RG-2002 DN700 / RG-2003
      DN700 take 4.6 kPa, FV-2105 1.5, the adsorber in regeneration 1.5 and S-2101 1.0 kPa: 1.0 kPa (10
      mbar) for the heater gas side, nozzle to nozzle, at 18,486 kg/h heated 9.5 -> 200 C, so that the
      regeneration path keeps the LP column top at 1.30 bara (enquiry requirement; the supplier states
      the drop of the element bundle)'
    assumed: true
  process_streams:
  - stream: S12A
    direction: in
    title: Waste N2 to regeneration
    source: process/flowsheet.yaml (case design)
  - stream: S12H
    direction: out
    title: Hot regeneration gas
    source: process/flowsheet.yaml (case design)
  rating:
    value: supplier
    unit: ''
    source: 'awaited from the supplier or the named study (D-103); unsupported in cheme-as-code: no fired-heater or heater rating (radiant/convection sections,
      tube wall): from the supplier''s rating (docs/framework/sizing.md) (cheme datasheets fill)'
  mechanical_design:
    value: supplier
    unit: ''
    source: 'awaited from the supplier or the named study (D-103); unsupported in cheme-as-code: no mechanical design to a code (wall thickness, MAWP,
      nozzle loads): from the supplier or a mechanical calculation (docs/framework/sizing.md) (cheme datasheets
      fill)'
  corrosion_allowance_mm:
    value: supplier
    unit: mm
    source: 'awaited from the supplier or the named study (D-103); unsupported in cheme-as-code: no material selection or corrosion allowance: the material
      is the equipment list''s, given; the allowance from a materials/corrosion review (docs/framework/sizing.md)
      (cheme datasheets fill)'
  relief_protection:
    value: supplier
    unit: ''
    source: 'awaited from the supplier or the named study (D-103); unsupported in cheme-as-code: no relief scenarios or device sizing (API 520/521, ISO
      4126): from a relief study (docs/framework/sizing.md) (cheme datasheets fill)'
sizing_basis:
- parameter: sizing_scope
  value: preliminary
  reference: 'cheme datasheets fill: the values it writes are preliminary process sizing (short-cut methods,
    declared or typical parameters), not a rating or a design to a code; not calculated: rating, mechanical
    code, materials corrosion, relief, dynamics controls (docs/framework/sizing.md)'
notes: ~1.13 MW peak (DESIGN.md D-066), waste N2 18,486 kg/h (~14,600 Nm3/h) to 200 C, over-temperature
  trip TSHH-2107. Heater with terminal box 3 x 2 x 3 m kept (ASSUMED; element bundle by the supplier).
  690 V feeder from MCC-1 (electrical list, D-070).
