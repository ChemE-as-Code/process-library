      (ASSUMED; condensation raises the film coefficient, the supplier''s condensing-zone U may lower the
      area). 527.5 m2 at the D-058 air (+13 %, D-066)'
    assumed: true
sizing_basis:
- parameter: zone duties (enquiry basis for the MAC package)
  value: desuperheating 111.3 -> 47.2 C 2,054 kW; condensing 47.2 -> 40 C 745 kW incl. 767 kg/h condensate
  reference: DESIGN.md D-065 (2), D-068 (2)
- parameter: air dew point at the cooler inlet
  value: 47.2 C (3.35 mol% water at 3.21 bara, IAPWS-95)
  reference: DESIGN.md D-058, D-065 (2)
notes: 'Cooling water tube side. ASSUMED. Condensing intercooler (DESIGN.md D-058): integral moisture
  separator in the air outlet, drain nozzle N5 to CD-1001 with gate valve HV-1112 and float trap ST-1112 on
  P-01, part of S1C (D-064). Separator type and pressure drop: supplier (MAC package). Enquiry requirements
  (D-065 (6)): a high-level alarm on the separator (switch or level transmitter to the DCS, supplier''s
  connection), the float trap with integral strainer and test valve, sized for 767 kg/h at 3.21 bara with
  margin, no trap bypass (an open bypass blows compressed air to the drain).'
