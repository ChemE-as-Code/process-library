# Datasheet, first drafted by `cheme datasheets draft` from equipment/equipment-list.yaml, pid/P-01.xml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: E-1102
type: TubularHeatExchanger
service: MAC 2nd intercooler
draft: false
operating:
  air_inlet_pressure:
    value: 3.34
    unit: bar(a)
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-090): K-1101 stage 2 discharge, (186.2
      - 5 kPa) x 1.844 = 334.2 kPa(a) (equipment/datasheets/K-1101.yaml, S2 6.02 bara, D-089)'
    assumed: true
  air_inlet_temperature:
    value: 112.8
    unit: °C
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-090): K-1101 stage 2 discharge 385.99
      K (ideal gas, Cp/Cv 1.399 at the suction, eta_s 0.82, process/simulation.yaml, ASSUMED)'
    assumed: true
  air_outlet_temperature:
    value: 40
    unit: °C
    source: process/simulation.yaml K1101 (ASSUMED, the K-1101 intercooler outlet)
    assumed: true
  air_flow:
    value: 113329
    unit: kg/h
    source: process/flowsheet.yaml stream S1 (case design), wet air at 80 % RH (DESIGN.md D-058, D-066)
    assumed: true
  condensate_flow:
    value: 808
    unit: kg/h
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-090): water above saturation at 40 C and
      3.29 bara (IAPWS-95); to the moisture separator drain, part of S1C (1,609 kg/h for E-1102 and E-1103
      in the DWSIM simulation, D-089)'
    assumed: true
  cooling_water_temperatures:
    value: 25 -> 35
    unit: °C
    source: process/design-basis.yaml utilities
  cooling_water_flow:
    value: 248.9
    unit: m3/h
    source: 'scripts/datasheet_sizing.py section 1 (DESIGN.md D-090): Q / (cp 10 K), IAPWS-95 water at
      30 C'
    assumed: true
design:
  pressure_barg:
    value: 8.0
    unit: barg
    source: equipment/equipment-list.yaml
  temperature_degc:
    value: 180.0
    unit: degC
    source: equipment/equipment-list.yaml
materials:
  main:
    value: CS shell / SS tubes
    source: equipment/equipment-list.yaml
dimensions:
  orientation: horizontal
  outside_diameter:
    value: 1.6
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.diameter; ASSUMED at basic
      engineering (equipment list header, DESIGN.md D-028): the supplier sets it'
    assumed: true
  overall_length:
    value: 8.0
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.length; ASSUMED at basic
      engineering (equipment list header, DESIGN.md D-028): the supplier sets it'
    assumed: true
  overall_height:
    value: 2.4
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.height (top of the shell on
      its supports); ASSUMED at basic engineering (equipment list header, DESIGN.md D-028): the supplier
      sets it'
    assumed: true
  head:
    value: ellipsoidal_2_1
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.head; ASSUMED at basic
      engineering (equipment list header, DESIGN.md D-028): the head type is the list''s choice, the
      supplier sets it'
    assumed: true
  support:
    type:
      value: saddles
      source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.support; ASSUMED at basic
        engineering (equipment list header, DESIGN.md D-028): the support type is the list''s choice,
        the supplier sets it'
      assumed: true
    height:
      value: 0.8
      unit: m
      source: 'cheme datasheets fill: layout/plant-model.yaml part E-1102/shell: underside of the shell
