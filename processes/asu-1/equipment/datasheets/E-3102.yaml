type_specific:
  height_m:
    value: 4.5
    unit: m
    source: equipment/equipment-list.yaml dimensions
  length_m:
    value: 3.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  width_m:
    value: 1.5
    unit: m
    source: equipment/equipment-list.yaml dimensions
  weight_t:
    value: 8.0
    unit: t
    source: equipment/equipment-list.yaml dimensions
  duty_kw:
    value: 304.1
    unit: kW
    source: '`cheme process simulate` (DWSIM 9.0.5, Peng-Robinson; DESIGN.md D-066): E3102 304.06 kW,
      balanced (imbalance 0). It closes the condenser-reboiler E-3103 (C-3101 condenses 4,172 kW, C-3102
      reboils 4,166 kW). Cross-check scripts/datasheet_sizing.py section 5 (DESIGN.md D-068 (5)), property
      adapter (thermo PR): hot side 304.2 kW, cold side S16 -> S16B 312.7 kW (2.8 % apart: DWSIM PR against
      thermo PR near the waste N2 dew point)'
    assumed: true
  ln_duty_kw:
    value: 116.6
    unit: kW
    source: 'scripts/datasheet_sizing.py section 5 (DESIGN.md D-068 (5)): S18 29,280 kg/h liquid 94.71
      -> 88.05 K at 530 kPa(a) (subcooled 6.7 K), property adapter'
    assumed: true
  crude_duty_kw:
    value: 187.6
    unit: kW
    source: 'scripts/datasheet_sizing.py section 5 (DESIGN.md D-068 (5)): S13 53,740 kg/h liquid 99.47
      -> 93.05 K at 550 kPa(a) (subcooled 6.4 K), property adapter'
    assumed: true
  ua_kw_k:
    value: 45.1
    unit: kW/K
    source: 'scripts/datasheet_sizing.py section 5 (DESIGN.md D-068 (5)): UA = sum dQ / LMTD over 600
      intervals of the hot (S18 -> S18B + S13 -> S13B) and cold (S16 -> S16B) composite curves, counter-current
      (ASSUMED)'
    assumed: true
  minimum_approach_k:
    value: 5.19
    unit: K
    source: 'scripts/datasheet_sizing.py section 5 (DESIGN.md D-068 (5)): at the warm end (crude in 99.47
      K against waste N2 out 94.28 K); cold end 7.15 K'
    assumed: true
  area_m2:
    value: supplier
    unit: m2
    reason: 'brazed aluminium plate-fin supplier: fin geometry and layer arrangement along the composite
      curves; no typical overall coefficient for cryogenic liquid against low-pressure gas in cheme-as-code''s
      table (cheme datasheets fill --list). Enquiry basis (D-066): 304 kW (LN 117 kW to -185.1 C, crude
      188 kW to -180.1 C), UA about 45 kW/K, minimum approach 5.2 K; the supplier confirms the duty against
      the composite curves (D-067)'
  lmtd_k:
    value: not_applicable
    unit: K
    reason: a three-stream exchanger (LN and crude against waste N2); one LMTD does not describe it, the
      composite curves do (ua_kw_k, minimum_approach_k)
sizing_basis:
- parameter: liquid outlet temperatures
  value: LN -185.1 C, crude -180.1 C (set to balance E-3103, ASSUMED)
  reference: DESIGN.md D-066
- parameter: duty
  value: 304 kW, simulated (DWSIM) with the double column
  reference: DESIGN.md D-066
notes: 'Brazed aluminium, two cores side by side with headers (the DN800 waste N2 headers set the length).
  Max 65 C. ASSUMED. DESIGN.md D-066: in the flowsheet and the simulation (step E3102), 304 kW, LN to
  -185.1 C and crude O2 to -180.1 C against the cold waste N2 (S16 -> S16B); it closes the E-3103 balance.
  The area is the supplier''s. The equipment list names GAN as a second cold stream: not modelled, the
  waste N2 alone takes the duty. Supplier scope (D-104, ASSUMED): a LOX pass (470 kg/h, -179.9 -> -183 C)
  and a LIN pass (470 kg/h, -178.4 -> -181 C), ~0.7 kW each, give the subcooled delivery of S10 / S11
  (D-056); they are not in the model.'
