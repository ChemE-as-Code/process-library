- parameter: duty
  value: the waste N2 warming that closes the E-3101 balance (heat leak neglected, ASSUMED)
  reference: DESIGN.md D-061, D-063
notes: 'Brazed aluminium, two cores side by side with headers (the DN800 waste N2 headers set the length).
  Max 65 C. ASSUMED. DESIGN.md D-063: duty 293 kW from the E-3101 balance on the DWSIM column states
  (D-059, D-061), split between LN (66 kW) and crude (227 kW) at a common outlet of -182.9 C; area the
  supplier''s. Not in the flowsheet or the simulation yet (D-059 open: a tear stream); the subcooling changes
  the LP column flash and boil-up (D-059 levers), so the column result stands without it. The equipment list
  names GAN as a second cold stream: not modelled, the waste N2 alone takes the duty here.'
