# Datasheet, first drafted by `cheme datasheets draft` from equipment/equipment-list.yaml, pid/P-03.xml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: E-3102
type: PlateHeatExchanger
service: Subcooler (rich liquid / LN against waste N2 and GAN)
operating:
  ln_inlet:
    value: 29280 kg/h, -178.45 C, 5.3 bara, saturated liquid
    unit: ''
    source: process/flowsheet.yaml stream S18 (LN reflux, calculated by `cheme process simulate`, DESIGN.md
      D-066, 0.305 x the HP air; was 24,530 kg/h)
    assumed: true
  crude_inlet:
    value: 53740 kg/h, -173.68 C, 5.5 bara, saturated liquid (38.5 % O2)
    unit: ''
    source: process/flowsheet.yaml stream S13 (crude oxygen, calculated by `cheme process simulate`, DESIGN.md
      D-066; was 45,680 kg/h)
    assumed: true
  ln_outlet_temperature:
    value: -185.1
    unit: °C
    source: 'process/flowsheet.yaml stream S18B, process/simulation.yaml E3102 (DESIGN.md D-066: set to
      balance the condenser-reboiler E-3103, ASSUMED)'
    assumed: true
  crude_outlet_temperature:
    value: -180.1
    unit: °C
    source: 'process/flowsheet.yaml stream S13B, process/simulation.yaml E3102 (DESIGN.md D-066: set to
      balance the condenser-reboiler E-3103, ASSUMED)'
    assumed: true
  waste_n2_inlet:
    value: 76560 kg/h, -192.29 C, 1.3 bara, saturated vapour
    unit: ''
    source: process/flowsheet.yaml stream S16 (C-3102 top, temperature calculated by `cheme process simulate`,
      DESIGN.md D-066; was 63,750 kg/h)
    assumed: true
  waste_n2_outlet_temperature:
    value: -178.87
    unit: °C
    source: process/flowsheet.yaml stream S16B (calculated by `cheme process simulate`, DESIGN.md D-066);
      no pressure drop (ASSUMED)
    assumed: true
design:
