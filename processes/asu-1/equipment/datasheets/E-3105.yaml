type_specific:
  diameter_m:
    value: 0.9
    unit: m
    source: equipment/equipment-list.yaml dimensions
  height_m:
    value: 1.7
    unit: m
    source: equipment/equipment-list.yaml dimensions
  length_m:
    value: 5.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  weight_t:
    value: 3.5
    unit: t
    source: equipment/equipment-list.yaml dimensions
  duty_kw:
    value: 63.3
    unit: kW
    source: '`cheme process simulate` (DWSIM 9.0.5, Peng-Robinson; DESIGN.md D-067): E3105 63.27 kW, S4D
      30 C -> S4E 15 C at 8.45 bara, 14,870 kg/h. At the 18.5 C alarm it takes 48.5 kW (property adapter,
      scripts/datasheet_sizing.py section 4 (DESIGN.md D-068 (4)))'
    assumed: true
  area_m2:
    value: 54.82
    unit: m2
    source: 'scripts/datasheet_sizing.py section 4 (DESIGN.md D-068 (4)): A = Q / (U LMTD) = 63.27 kW
      / (160 x 7.213 K), counter-current (F 1), U 160 W/(m2 K) ASSUMED as design typical (middle of 20-300),
      Sinnott, Coulson & Richardson''s Chemical Engineering Vol. 6, 4th ed. (2005), Table 12.1, p. 637:
      cooler, gases / water; no margin. D-067: about 55 m2'
    assumed: true
  arrangement:
    value: counter-current
    source: 'DESIGN.md D-067: the temperatures cross (air out 15 C, water out 20 C), so the exchanger
      is counter-current; D-077: one tube pass, straight tubes with a floating head pulled to the west
      (a U-tube or 1-2 exchanger cannot reach the cross: no F-factor exists at R 1.5, P 0.5), air on the
      shell side from the west end to the east end, water from the east head to the west channel'
    assumed: true
  u_service:
    value: cooler/gases-water
    source: DESIGN.md D-053 (ASSUMED; air at 8 bara against water)
    assumed: true
  utility_inlet_temperature_degc:
    value: 10
    unit: degC
    source: DESIGN.md D-067, chilled water supply 10 C (ASSUMED, D-005)
    assumed: true
  utility_outlet_temperature_degc:
    value: 20
    unit: degC
    source: DESIGN.md D-067, chilled water return 20 C
    assumed: true
  process_streams:
  - stream: S4D
    direction: in
    title: Boosted air to the trim cooler
    source: process/flowsheet.yaml (case design)
  - stream: S4E
    direction: out
    title: Boosted air to E-3101
    source: process/flowsheet.yaml (case design)
  lmtd_k:
    value: 7.213
    unit: K
    source: 'scripts/datasheet_sizing.py section 4 (DESIGN.md D-068 (4)): counter-current LMTD, hot 303.15
      -> 288.15 K (S4D -> S4E), chilled water 283.15 -> 293.15 K: 10 K at the warm end, 5 K at the cold
      end'
    assumed: true
  lmtd_correction_f:
    value: 1.0
    unit: ''
    source: 'DESIGN.md D-067: counter-current, no correction'
    assumed: true
  overall_u_w_m2k:
    value: 160.0
    unit: W/(m2 K)
    source: 'U 160 W/(m2 K) ASSUMED as design typical (middle of 20-300), Sinnott, Coulson & Richardson''s
      Chemical Engineering Vol. 6, 4th ed. (2005), Table 12.1, p. 637: cooler, gases / water (DESIGN.md
      D-053)'
    assumed: true
sizing_basis: []
notes: 'Chilled-water trim of the boosted air, counter-current (DESIGN.md D-067, D-069). Outside the cold
  box, beside E-3104. Dry gas after the TSA: no condensate. Tag ASSUMED in D-067, listed now (D-069).
  If E-3105 is lost the cold box closes at a total heat leak of only ~12 kW (D-067), a ~38 kW deficit
  against the 50 kW ASSUMED leak: turn down the liquid production by ~330 kg/h until it is back (D-104). Dimensions and weight ASSUMED by analogy with E-3104 (64 m2 in a 1.0 x 5 m shell, 4 t).
  Standstill (D-077): TV-3124 is closed on a compander trip (C&E I-04) and the shell-side drain is checked
  dry before the air is readmitted; for maintenance the water side is blinded at the E-3105 flanges with
  the loop drained there (spectacle blinds, supplier) instead of a block valve on CHWR-3001.'
