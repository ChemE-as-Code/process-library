# Datasheet, written by hand on the pattern of E-3104 (DESIGN.md D-067, D-069) from equipment/equipment-list.yaml, pid/P-03.xml, process/flowsheet.yaml.
# Final (`draft: false`): every value says where it comes from (source); assumed: true marks a
# value derived on an assumption, to confirm; a `supplier` or `not_applicable` value gives its
# reason. Schema: `cheme schema datasheet`.
tag: E-3105
type: TubularHeatExchanger
service: Booster air trim cooler (chilled water)
draft: false
operating:
  inlet_pressure:
    value: 8.45
    unit: bar(a)
    source: 'process/flowsheet.yaml stream S4D (case design), assumed: DESIGN.md D-052, D-061, no pressure
      drop in E-3104'
    assumed: true
  inlet_temperature:
    value: 30.0
    unit: °C
    source: 'process/flowsheet.yaml stream S4D (case design), assumed: DESIGN.md D-067, the E-3104 outlet'
    assumed: true
  inlet_flow:
    value: 14870.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S4D (case design), assumed: = S4B'
    assumed: true
  outlet_pressure:
    value: 8.45
    unit: bar(a)
    source: 'process/flowsheet.yaml stream S4E (case design), calculated by `cheme process simulate` (process/simulation.yaml
      E3105: no pressure drop, ASSUMED as E-3104, D-067)'
    assumed: true
  outlet_temperature:
    value: 15.0
    unit: °C
    source: 'process/flowsheet.yaml stream S4E (case design), assumed: DESIGN.md D-067, trimmed to the
      main air temperature; TICA-3124 holds it (set point 15 C, TAH 18.5 C: the minimum acceptable trim,
      at which the cold box closes at +60.4 kW, D-067)'
    assumed: true
  outlet_flow:
    value: 14870.0
    unit: kg/h
    source: process/flowsheet.yaml stream S4E (case design), calculated by `cheme process simulate`
    assumed: true
  chilled_water_temperatures:
    value: 10 -> 20
    unit: °C
    source: 'DESIGN.md D-067: chilled water from C-1102 at 10 C (ASSUMED, D-005), returned at 20 C'
    assumed: true
  chilled_water_flow:
    value: 5.44
    unit: m3/h
    source: 'scripts/datasheet_sizing.py section 4 (DESIGN.md D-068 (4)): Q / (cp 10 K), IAPWS-95 water
      at the mean 15 C; D-067: ~5.4 m3/h'
    assumed: true
  chilled_water_pressure:
    value: 3.5
    unit: bar(a)
    source: 'DESIGN.md D-069: TV-3124 on the supply (CHW-3001) upstream of E-3105 and the return CHWR-3001
      open to the C-1102 top, so the water side stays at about the return line''s static and friction
      head (~1 bara + ~25 m, ASSUMED), below the 8.45 bara air: a tube leak cannot put water into the
      dry air (D-067)'
    assumed: true
design:
  pressure_barg:
    value: 11.0
    unit: barg
    source: equipment/equipment-list.yaml
  temperature_degc:
    value: 120.0
    unit: degC
    source: equipment/equipment-list.yaml
materials:
  main:
    value: CS shell / SS tubes
    source: equipment/equipment-list.yaml
dimensions:
  orientation: horizontal
  outside_diameter:
    value: 0.9
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.diameter; ASSUMED at basic
      engineering (equipment list header, DESIGN.md D-028): the supplier sets it'
    assumed: true
  overall_length:
    value: 5.0
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.length; ASSUMED at basic
      engineering (equipment list header, DESIGN.md D-028): the supplier sets it'
    assumed: true
  overall_height:
    value: 1.7
    unit: m
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.height (top of the shell on
      its supports); ASSUMED at basic engineering (equipment list header, DESIGN.md D-028): the supplier
      sets it'
    assumed: true
  head:
    value: ellipsoidal_2_1
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.head; ASSUMED at basic
      engineering (equipment list header, DESIGN.md D-028): the head type is the list''s choice, the
      supplier sets it'
    assumed: true
  support:
    type:
      value: saddles
      source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.support; ASSUMED at basic
        engineering (equipment list header, DESIGN.md D-028): the support type is the list''s choice,
        the supplier sets it'
      assumed: true
    height:
      value: 0.8
      unit: m
      source: 'cheme datasheets fill: layout/plant-model.yaml part E-3105/shell: underside of the shell
        above the base (the 3D model''s proportions, not a design)'
      assumed: true
  tangent_length:
    value: 4.175
    unit: m
    source: 'cheme datasheets fill: layout/plant-model.yaml part E-3105/shell: the generated shell between
      the heads (the 3D model''s proportions, not a vessel design)'
    assumed: true
  axis_deg:
    value: 0.0
    unit: deg
    source: 'cheme datasheets fill: layout/plant-model.yaml E-3105 rotation_deg (layout/equipment-placement.yaml)'
weights:
  empty:
    value: 3.5
    unit: t
    source: 'cheme datasheets fill: equipment/equipment-list.yaml dimensions.weight (empty); ASSUMED
      (equipment list header, DESIGN.md D-034): typical size of the duty, the item''s basis in its list
      note; the supplier gives the weight'
    assumed: true
