location: RER
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Continuous bulk (mass) polymerisation of styrene initiated by heat: a stirred prepolymeriser
  at 403 K boiling under 65 kPa(a) with a reflux condenser (35 % conversion), three stirred tower reactors
  to 443 K (75 % overall), 7 wt% ethylbenzene in the feed, the solution heated to 513 K on hot oil and
  devolatilised at 4 and 1 kPa(a), the vapours condensed and recycled with a 1.4 % purge, the melt pelletised
  under water; 100 kt/a, concept design'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:fugitive
  title: equipment-leaks emissions of R-101, R-102, T-201, P-201
  direction: output
  reason: 'No P&ID yet: fugitive styrene from flanges, seals and valves is not estimated; the POL BREF''s
    total VOC for GPPS, 85 to 120 g/t (Table 4.10), covers the vents, fugitives and the pelletiser''s
    fumes together (D-007).'
- key: emission-excluded:reactor-vents
  title: storage-tank emissions of R-101, E-102, R-102
  direction: output
  reason: R-101's reflux condenser returns its condensate; its non-condensables (dissolved nitrogen and
    leak air at 65 kPa(a)) go with the vacuum system to the thermal oxidiser (POL BREF BAT 2); their styrene
    is not estimated separately from the vent S18 (D-007).
- key: emission-excluded:storage-breathing
  title: storage-tank emissions of T-101, T-201
  direction: output
  reason: The breathing of the nitrogen-blanketed styrene and recycle tanks, vented to the thermal oxidiser
    (POL BREF BAT 1), is not estimated (D-007).
- key: emission-excluded:pellet-dust
  title: effluent emissions of X-301
  direction: output
  reason: Polystyrene dust from conveying and packing, 2 to 7 g/t in the POL BREF (Table 4.10), and the
    pelletiser's water traces (hydrocarbons 1.5 to 7 g/t after treatment) are not in the balance (D-009).
