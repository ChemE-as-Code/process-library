# Goal and scope of the polystyrene-1 LCI. Schema: `cheme schema lca`. Outputs: `cheme assess
# lca --write` (lca/inventory.csv, gaps.csv, dataset.yaml, manifest.json, results); never edit
# those by hand.
#
# Preliminary gate-to-gate foreground inventory (DESIGN.md D-011): every exchange of the plant
# with its amount per kg of polystyrene pellets, from the balanced flowsheet (design case), plus
# the nitrogen as a consumable at the POL BREF's figure. The backgrounds are left unmapped here
# (`missing:` with the activity each should connect to); the library's LCI build links what
# lca/mappings.yaml and the shared lci/mappings.yaml name: the styrene to styrene-1, the hot
# oil's heat to heat from natural gas, the steam-free utilities by their shared entries, the
# nitrogen to asu-1. A gap is never zero, and no values from licensed databases are used.
schema: cheme/lca/v1
kind: lca
goal: >-
  Preliminary gate-to-gate life cycle inventory of general-purpose polystyrene pellets made by
  continuous bulk polymerisation of styrene (stirred prepolymeriser and tower reactors, two-stage
  vacuum devolatilisation with monomer recycle, underwater pelletising) at the concept stage:
  which raw materials, utilities and wastes the plant exchanges per kg of polystyrene, as the
  foreground for a cradle-to-gate study once the backgrounds are linked (D-011).
functional_unit: {product: PELLETS, amount: 1, unit: kg, source: "1 kg of general-purpose polystyrene pellets (with about 520 ppm residual styrene and ethylbenzene) at the plant gate to the silos, stream S14 (D-002, D-007)"}
# The boundary key stays cradle-to-gate so that the purchased inputs remain open gaps instead of
# being mapped free (the schema's gate-to-gate maps every feed free), as oxalyl-chloride-1 does.
boundary: cradle-to-gate
case: design
year: 2026
location: RER   # EU technology of the POL BREF; generic site, country not chosen
technology: "Continuous bulk (mass) polymerisation of styrene initiated by heat: a stirred prepolymeriser at 403 K boiling under 50 kPa(a) with a reflux condenser (35 % conversion), three stirred tower reactors to 443 K (75 % overall), 7 wt% ethylbenzene in the feed, the solution heated to 513 K on hot oil and devolatilised at 4 and 1 kPa(a), the vapours condensed and recycled with a 1.4 % purge, the melt pelletised under water; 100 kt/a, concept design"
rights: "CC-BY-4.0: the ChemE-as-Code process library's own concept design (LICENSE-DATA)"
# system_model unset (cut-off, the Atlas default). One product: no allocation. The purge is
# burned at the site (a waste treatment under cut-off, below).
flows:
  # raw materials
  - key: feed:SM
    missing: "background: styrene monomer, per kg; in the library's Atlas build lca/mappings.yaml links it to styrene-1 (ethylbenzene dehydrogenation), whose product is this feed (D-003)"
    source: "flowsheet stream S1, 1.006 kg per kg (D-003, D-004)"
  - key: feed:PW
    missing: "not mapped yet (D-011); connect to: process water (softened or demineralised) from the site's water treatment, per kg, for the pelletiser's water loop"
    source: "flowsheet stream S13, 0.596 kg per kg (D-009)"
  # utilities
  - key: feed:POWER
    missing: "background: electricity, medium voltage, market for the site's grid (site not chosen), per kWh; the shared entry `electricity` links it"
    source: "flowsheet energy streams P1 to P5 (agitators, vacuum, melt pump, pelletising and conveying), 660 kW, D-009"
  - key: feed:HOTOIL
    missing: "linked as heat from natural gas (lca/mappings.yaml); connect to: heat from a natural-gas-fired hot-oil heater, per kWh absorbed by the oil (its efficiency and combustion emissions in the background)"
    source: "flowsheet energy stream Q3 (E-101 and the devolatilisers' jackets, scripts/ps_balance.py), D-008"
  - key: product:CW
    missing: "background: heat rejected to a recirculating cooling-water system with cooling tower (processes/utility-cooling-tower), per kWh removed; the shared entry `cooling-water` links it"
    source: "flowsheet energy streams Q1 and Q2 (the reactors, core's conversion duties), Q4 (E-103) and Q5 (the pelletiser's water loop), D-008, D-009"
  # wastes
  - key: product:PURGE
    treatment: {kind: waste, route: "thermal oxidation of the recycle purge (styrene, ethylbenzene) in the site's thermal oxidiser, or its use as fuel (POL BREF section 13.3, BAT 2); under cut-off an energy recovery stays a waste treatment of the producer (D-004)"}
    missing: "not mapped yet (D-011); connect to: thermal oxidation (incineration) of a liquid hydrocarbon waste, per kg; its CO2 (3.3 kg per kg of styrene) leaves with the treatment"
    source: "flowsheet stream S20, 5.9 g per kg (D-004)"
  - key: product:VENT
    treatment: {kind: waste, route: "the vacuum pumps' vent with its styrene and ethylbenzene to the site's thermal oxidiser, with the pelletiser's fumes (POL BREF section 13.3, BAT 2 and 3; D-007)"}
    missing: "not mapped yet (D-011); connect to: thermal oxidation of a VOC-bearing vent gas, per kg of VOC; the BREF's 85 g/t VOC level is the emission after treatment, not modelled here"
    source: "flowsheet stream S18, 86 mg per kg (D-007)"
  - key: product:WW
    missing: "background: wastewater treatment, per kg (1 m3 = 1000 kg); the shared entry `wastewater` links it (processes/utility-wwtp in the Atlas)"
    source: "flowsheet stream S15, 0.596 kg per kg (D-009)"
# What the plant uses and the flowsheet does not carry.
consumables:
  - id: nitrogen
    title: "Nitrogen for blanketing the styrene and recycle tanks and the pellet silos, and the purges"
    unit: kg
    per_year: 2200000
    source: "0.022 kg per kg of polystyrene x 100 000 t/a, the POL BREF's nitrogen for GPPS (Table 13.6, BAT-associated level; Table 4.10: up to 0.050), ASSUMED for this plant (D-011)"
    missing: "linked to processes/asu-1 (lca/mappings.yaml): gaseous nitrogen to the battery limit"
    disposal:
      kind: waste
      route: "with the tank, silo and vacuum vents through the site's thermal oxidiser to air, unchanged (D-011)"
      source: "the blanket and purge nitrogen leaves with the vents (D-011)"
      missing: "not mapped yet (D-011); connect to: the thermal oxidiser's throughput of inert gas, with the vent gas product:VENT"
operation:
  hours_per_year: 8000
  life_years: 25
  source: "design basis operating_hours_per_year 8000 (ASSUMED, D-002); 25 a service life ASSUMED; no construction inventory at this stage (no take-off)"
emission_exclusions:
  - {id: fugitive, method: equipment-leaks, equipment: [R-101, R-102, T-201, P-201], reason: "No P&ID yet: fugitive styrene from flanges, seals and valves is not estimated; the POL BREF's total VOC for GPPS, 85 to 120 g/t (Table 4.10), covers the vents, fugitives and the pelletiser's fumes together (D-007)."}
  - {id: reactor-vents, method: storage-tank, equipment: [R-101, E-102, R-102], reason: "R-101's reflux condenser returns its condensate; its non-condensables (dissolved nitrogen and leak air at 50 kPa(a)) go with the vacuum system to the thermal oxidiser (POL BREF BAT 2); their styrene is not estimated separately from the vent S18 (D-007)."}
  - {id: storage-breathing, method: storage-tank, equipment: [T-101, T-201], reason: "The breathing of the nitrogen-blanketed styrene and recycle tanks, vented to the thermal oxidiser (POL BREF BAT 1), is not estimated (D-007)."}
  - {id: pellet-dust, method: effluent, equipment: [X-301], reason: "Polystyrene dust from conveying and packing, 2 to 7 g/t in the POL BREF (Table 4.10), and the pelletiser's water traces (hydrocarbons 1.5 to 7 g/t after treatment) are not in the balance (D-009)."}
dataset:
  version: 0.1.0
  classification: {isic: "2013"}   # ISIC Rev.4 2013 Manufacture of plastics and synthetic rubber in primary forms
  modelling: {principle: attributional}
  geography: {description: "Generic EU petrochemical site integrated with a styrene plant, not chosen (RER); one design case"}
  system_model: cutoff
  technology_level: current
  review: {type: none}
  data_generator: "ChemE-as-Code agent session (Claude Opus 5.5) for issue #467, unreviewed"
