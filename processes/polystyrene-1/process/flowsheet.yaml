    template: pellets
    state:
      design:
        temperature: {value: 323.15, provenance: assumed, source: "D-009: dried pellets at 50 C to the silos"}
        pressure: {value: 101.325, provenance: assumed, source: D-009}
        flow: {value: 12506.5, provenance: calculated, source: 'cheme process propagate: separator X301 from S12 S13', fingerprint: 39ec377cd4162f37}
        composition: {basis: mole_fraction, values: {STY: 0.000400326, EB: 0.000118122, PS: 0.999482, H2O: 0.0}, provenance: calculated, source: 'cheme process propagate: separator X301 from S12 S13', fingerprint: 39ec377cd4162f37}
  - id: S15
    title: Pelletiser water purge
    from: X301.ww
    to: WW.in
    template: water
    state:
      design:
        temperature: {value: 323.15, provenance: assumed, source: "D-009: the water loop at 50 C"}
        pressure: {value: 101.325, provenance: assumed, source: D-009}
        flow: {value: 7448.31, provenance: calculated, source: 'cheme process propagate: separator X301 from S12 S13', fingerprint: 39ec377cd4162f37}
        composition: {basis: mole_fraction, values: {STY: 0.0, EB: 0.0, PS: 0.0, H2O: 1.0}, provenance: calculated, source: 'cheme process propagate: separator X301 from S12 S13', fingerprint: 39ec377cd4162f37}
  - id: S16
    title: Combined devolatiliser vapours
    from: M201.out
    to: E103.in
    template: polymer
