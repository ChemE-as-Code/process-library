# Components and templates of polystyrene-1. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol (IUPAC 2021
# abridged standard atomic weights applied to the formula), normal_boiling_point in K at
# 101.325 kPa.
#
# Property sources (DESIGN.md source register SRC-5, SRC-1):
# - normal boiling points, densities, liquid heat capacities at 298.15 K and heats of
#   vaporization at the normal boiling point of styrene, ethylbenzene and water: the CRC
#   Handbook tables as packaged in the `chemicals` 1.5.2 package (CRC_organic_data,
#   CRC_standard_data, Hvap_data_CRC), not the printed handbook: single facts with the package
#   named (library ADR 0037). Styrene: Tb 418.45 K, 901.6 kg/m3, Cp(l) 182.0 J/(mol K),
#   dHvap(Tb) 38.70 kJ/mol; ethylbenzene: Tb 409.35 K, 862.6 kg/m3, Cp(l) 183.2 J/(mol K),
#   dHvap(Tb) 35.57 kJ/mol; water: Tb 373.12 K, Cp(l) 75.3 J/(mol K), dHvap(Tb) 40.65 kJ/mol.
# - polystyrene (PS) is written per mole of its repeat unit C8H8 (the registry's polymer rule,
#   docs/registry.md): molar mass 104.152 kg/kmol, the same as the monomer's, so that the
#   polymerisation STY -> PS is one kmol of repeat units per kmol of styrene converted and the
#   element balance closes; the chain's own molar mass (EU POL BREF section 4.2.1.1: 200 000
#   to 300 000 g/mol) does not enter a mass balance. Its density 1045 kg/m3 is the pure
#   polymer's of the POL BREF (section 4.2.1.1). Its liquid_heat_capacity, 182.0 kJ/(kmol K)
#   (1.747 kJ/(kg K)), is ASSUMED equal to the liquid monomer's per repeat unit (D-006): no
#   open measured heat capacity of the polystyrene melt was read; Wikipedia's 1.3 kJ/(kg K)
#   (SRC-6) is the glassy solid's near room temperature, below the glass transition (about
#   373 K), where the melt's is higher. PS is non-volatile: it never leaves with a vapour.
# - liquid heat capacities are taken as constant at their 298.15 K values (core's conversion
#   model uses one value per component, L-2); between 300 and 513 K the liquids' heat capacities
#   rise, so the sensible heats are underestimated by roughly 15 to 25 % (D-006).
# - the devolatilisers' and condenser's heats need vapour data that core's separators do not
#   use: scripts/ps_balance.py takes the ideal-gas heat capacities of styrene and ethylbenzene
#   from the `thermo` 0.6.1 package (Joback's group contribution for styrene, a fit for
#   ethylbenzene) and the heats of vaporization at temperature from the values here with
#   Watson's correlation and the critical temperatures of `chemicals` 1.5.2 (635.0 and
#   617.12 K), D-008.
schema: cheme/process/v1
kind: materials
components:
  - id: STY
    name: Styrene
    formula: C8H8
    cas: 100-42-5
    molar_mass: 104.152
    normal_boiling_point: 418.45
    liquid_molar_volume: 0.11552
    liquid_heat_capacity: 182.0
    heat_of_vaporization: 38700
  - id: EB
    name: Ethylbenzene
    formula: C8H10
    cas: 100-41-4
    molar_mass: 106.168
    normal_boiling_point: 409.35
    liquid_molar_volume: 0.12308
    liquid_heat_capacity: 183.2
    heat_of_vaporization: 35570
  - id: PS
    name: Polystyrene (per repeat unit C8H8)
    formula: C8H8
    cas: 9003-53-6
    molar_mass: 104.152
    liquid_molar_volume: 0.09967
    liquid_heat_capacity: 182.0
  - id: H2O
    name: Water
    formula: H2O
    cas: 7732-18-5
    molar_mass: 18.015
    normal_boiling_point: 373.12
    liquid_molar_volume: 0.01807
    liquid_heat_capacity: 75.3
    heat_of_vaporization: 40650
templates:
  - {id: polymer, title: "Styrene, ethylbenzene and polystyrene (feed, polymer solution, melt, recycle)", components: [STY, EB, PS]}
  - {id: water, title: "Process water (traces of styrene, ethylbenzene and polymer fines not modelled)", components: [H2O, STY, EB, PS]}
  - {id: pellets, title: "Polystyrene pellets with residual monomer", components: [PS, STY, EB, H2O]}
# property_method is a placeholder: no benchmarked package of core covers styrene, ethylbenzene
# or a polymer (`cheme process props --coverage`), so no stream property is calculated (L-3).
property_method:
  adapter: thermo
  status: placeholder
