# Process Atlas manifest of n-bromosuccinimide-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: n-bromosuccinimide-1
title: N-Bromosuccinimide by semi-batch bromination of succinimide in aqueous NaOH (500 t/a)
summary: >-
  A batch plant: bromine (bromine-1) is dosed over 2 h into succinimide in cold caustic soda,
  the N-bromosuccinimide precipitates, is filtered, washed with ice water and vacuum-dried; half
  of the bromine leaves as NaBr in the mother liquor. Concept stage, assumed basis, 334 kg per
  batch every 5.3 h on a dedicated train, preliminary gate-to-gate LCI. The library's first
  batch entry.
description: |
  Succinimide and caustic soda (1.02 mol each per mol of bromine) are dissolved in water (30 mol
  per mol of bromine) and cooled to 278 K. Liquid bromine is dosed into the stirred charge over
  2 h and reacts with the succinimide anion to N-bromosuccinimide and sodium bromide, the caustic
  route US 2 971 960 describes; the NBS precipitates from the cold liquor, which keeps 14.7 g per
  kg of water in solution. The slurry is filtered, the cake is reslurried with 1.5 kg of ice water per kg and
  filtered again, and dried at 333 K under vacuum in an agitated filter-dryer (three units, taking
  the batches in turn). The product is 99.0 wt% NBS with 0.75 wt% NaBr and 0.2 wt% water; the
  yield is 93.2 % on bromine. The mother liquor (15 wt% NaBr), the wash filtrate and the dryer
  condensate go to wastewater treatment: the bromide is not recovered.

  The batch is modelled with cheme-as-code's semi-batch reactor (reactor: semibatch, core ADR
  0050) and batch recipe (process/recipe.yaml, core ADR 0051): the dosing and post-reaction times
  come from the model, the brominator is the bottleneck (cycle 5.3 h, 1495 batches a year on a
  dedicated train), the recipe sizes the brominator (2 m3), and the flowsheet's flows are the
  recipe's year averages. The precipitation and the reslurry wash are cheme's crystallizer with
  the liquor's NaBr, NaOH and succinimide as spectators, the filter-dryer is one vessel over
  filtration, wash, refiltration and drying, its filtration and drying times and its steam from
  cheme's filter and dryer models (core ADRs 0056, 0057). The bromination's kinetics and heat of reaction are ASSUMED (no open
  data): a fast second-order reaction, so the bromine accumulates little (3.75 % at most, at the
  end of the dosing, as the imide's excess runs low) and the cooling-failure temperature stays
  within 1 K of the process temperature; this must be confirmed by reaction calorimetry. See
  DESIGN.md for every assumption.
families: [nitrogen-organics]
keywords: [N-bromosuccinimide, NBS, succinimide, bromine, bromination, semi-batch, batch, dosing, precipitation, filter-dryer, sodium bromide, fine chemicals, brominating agent]
facets:
  feedstock_basis: [mineral, fossil, electricity]
  product_classes: [chemicals]
  unit_operations: [reaction, crystallization, filtration, drying]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, feed ratios, kinetics,
# heat of reaction, filtration and drying are assumed (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept batch PFD with closed mass, component and element balances (cheme validate, cheme
    process streams: 3 blocks and 8 steps within tolerance). Every stream is calculated by cheme
    process propagate: the semi-batch R101 from its ASSUMED rate law, the precipitation CR101 and
    the reslurry wash W101 as crystallizers with spectators from the solubility of NBS (the 25 C
    value in water, no salting-out correction, ASSUMED), the filters as specified splits, the
    dryer D101 to an ASSUMED residual moisture; the dryer's steam is cheme's (cheme process
    crystallizers). scripts/balance.py sizes the feeds for 500 t/a and gives the dissolver's and
    brominator's duties (no property package of core covers the alkaline bromide liquor, and core
    does not solve feeds for a product rate). The recipe takes the filtration (Ruth) and drying
    times from the filter and dryer models with ASSUMED cake data and drying rate; three
    filter-dryers keep the brominator the bottleneck, and the recipe's year-average rate of the
    product agrees with the flowsheet (cheme process recipe, no cheme.recipe-basis finding). Thermal screening (cheme process
    reactor-hazards): dT_ad 19.7 K, accumulation 3.75 %, MTSR 278.9 K against an MTT of 331.9 K
    (the bromine's boiling point); no criticality class without a TD24 from calorimetry. The
    kinetics are assumed: the low accumulation rests on that assumption. Preliminary gate-to-gate
    LCI, the rinses between batches included (per-batch consumable); bromine and caustic soda
    linked to bromine-1 and chlor-alkali-1, the other backgrounds gaps. cheme maturity reaches no level (assumed feeds, kinetics and separations); the claim
    `maturity: concept` is the lowest value of the schema, not an evidenced level. Not reviewed.
    Needs cheme-as-code 1.8.0 (reactor: semibatch, process/recipe.yaml, core#158; crystallizer
    spectators, dryer and recipe units, core#165).
chemistry:
  inputs:
    - {chemical: succinimide, role: feedstock, note: "feed:SUCC: technical succinimide (merchant), 0.603 kg/kg NBS"}
    - {chemical: bromine, role: feedstock, note: "feed:BR2: dry liquid bromine (bromine-1), 0.954 kg/kg NBS; half of it leaves as NaBr"}
    - {chemical: sodium-hydroxide, role: feedstock, note: "feed:NAOH: caustic soda 50 wt% (chlor-alkali-1), 0.487 kg/kg NBS, counted by mass of the solution"}
    - {chemical: water, role: feedstock, inventory_key: "feed:PW", note: "Dissolution water, 2.98 kg/kg NBS"}
    - {chemical: water, role: feedstock, inventory_key: "feed:WASHW", note: "Ice-cold wash water, 1.52 kg/kg NBS"}
  outputs:
    - {chemical: n-bromosuccinimide, role: main-product, inventory_key: "product:NBS", note: "Dried NBS crystals, 99.0 wt% NBS, to packing"}
    - {chemical: wastewater, role: waste, inventory_key: "product:WW", note: "Mother liquor, wash filtrate and dryer condensate, 5.54 kg/kg NBS: 10.9 wt% NaBr, 1.3 wt% dissolved NBS, succinimide and NaOH traces, to treatment"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "0.119 kWh/kg NBS: agitators of the dissolver, brominator and filter-dryers, vacuum pump (ASSUMED)"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "0.390 kWh (1.40 MJ)/kg NBS of LP steam to the filter-dryer's hot-water circuit (cheme's dryer model, the vessel's heat each batch included)"}
    - {chemical: chilled-water, role: utility, inventory_key: "product:BRINE", note: "0.255 kWh/kg NBS removed by brine at 263 K: the caustic's dilution and the imide's deprotonation, cooling the charge, and the heat of bromination (the registry has chilled water, not brine: closest entry)"}
basis:
