# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# N-Bromosuccinimide by the caustic bromination of succinimide (DESIGN.md D-001), a batch plant:
# succinimide is dissolved in water with caustic soda and cooled to 5 C, bromine is dosed into
# the charge over 2 h (a semi-batch, reactor: semibatch), the NBS precipitates, is filtered,
# reslurry-washed with ice water, filtered again and dried at 60 C under vacuum; the mother
# liquor (NaBr) and the wash filtrate go to wastewater treatment.
# The flows are the year averages of the batch recipe (process/recipe.yaml, `cheme process
# recipe`, D-003): a batch of 316 kg of dried NBS every 5 h, 1584 batches and 500 t in 7920 h.
# Where the values come from:
# - feeds, temperatures, pressures, ratios: design basis and D-002..D-009, ASSUMED;
# - R101: cheme's semi-batch model (the rate law of BROM, D-005); CR101 and W101: conversion
#   steps from the solubility of NBS; F101, F102: specified filters; M101, M103: mixers (all
#   calculated by `cheme process propagate --fill`);
# - the dryer's outlets and every duty: the independent balance scripts/balance.py (D-006,
#   ADR 0027 of the library), given here as ASSUMED: no property package of core is qualified
#   for this liquor, and core has no dryer model.
schema: cheme/process/v1
kind: flowsheet
title: N-Bromosuccinimide by semi-batch bromination of succinimide in aqueous NaOH (500 t/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 500 t/a dried NBS (98.6 wt% crystals, 99.0 wt% NBS), year averages of 1584 batches in 7920 h (D-002, D-003)", default: true}
tolerance: {abs: 0.05, rel: 0.002}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: PW, title: Process water (dissolution), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NAOH, title: Caustic soda 50 wt% (chlor-alkali-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: SUCC, title: Succinimide (merchant), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: BR2, title: Liquid bromine (bromine-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: WASHW, title: Ice-cold process water (cake wash), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: m101, direction: out, kind: energy}
      - {id: d101, direction: out, kind: energy}
  - id: LPS
    title: LP steam 350 kPa(a) (to the dryer's hot-water circuit)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 350, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 411.0, provenance: given, source: "saturation at 350 kPa(a), IAPWS-IF97"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: d101, direction: out, kind: energy}
products:
  - {id: NBS, title: N-Bromosuccinimide crystals to packing, category: product, ports: [{id: in, direction: in}]}
  - {id: WW, title: "Mother liquor, wash filtrate and dryer condensate to wastewater treatment", category: wastewater, ports: [{id: in, direction: in}]}
  - id: BRINE
    title: Chilled brine return (263 K)
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 263.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 268.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: m101, direction: in, kind: energy}
      - {id: r101, direction: in, kind: energy}

blocks:
  - id: PREP
    title: Charge preparation
    class: Mixing
    ports:
      - {id: pw, direction: in}
      - {id: naoh, direction: in}
      - {id: succ, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: REACT
    title: Bromination and precipitation
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: br2, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy}
  - id: ISOL
    title: Filtration, washing and drying
    class: SeparatingMechanically
    ports:
      - {id: in, direction: in}
      - {id: wash, direction: in}
      - {id: product, direction: out}
      - {id: ww, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}

steps:
  - id: M101
    block: PREP
    title: Dissolver (succinimide in caustic, cooled to 278 K)
    class: Mixing
    links: [{target: equipment, ref: M-101}]
    ports:
      - {id: pw, direction: in, delegates: pw}
      - {id: naoh, direction: in, delegates: naoh}
      - {id: succ, direction: in, delegates: succ}
      - {id: out, direction: out, delegates: out}
      - {id: q, direction: out, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: R101
    block: REACT
    title: Brominator (bromine dosed into the cold charge)
    class: ReactingChemicals
    reactions: [BROM]
    reactor: semibatch
    batch:
      dosing: [{stream: S5, time: 7200}]
      time: 1800
      heat: isothermal
      provenance: assumed
      source: "bromine dosed over 2 h, 30 min post-reaction at 278 K (D-005)"
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: br2, direction: in, delegates: br2}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: q}
  - id: CR101
    block: REACT
    title: Precipitation hold (NBS crystallises from the cold liquor)
    class: ReactingChemicals
    reactions: [PPT]
    reactor: conversion
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
  - id: F101
    block: ISOL
    title: Filtration (filter-dryer)
    class: Filtering
    solid_separation:
      solid_recovery: 0.998
      cake_liquid: {value: 0.3, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "agitated filter-dryer, cake 0.3 kg liquor per kg NBS (D-007)"
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out}
  - id: W101
    block: ISOL
    title: Reslurry wash with ice water (NBS dissolves to saturation)
    class: Mixing
    reactions: [DISS]
    reactor: conversion
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: cake, direction: in}
      - {id: wash, direction: in, delegates: wash}
      - {id: out, direction: out}
  - id: F102
    block: ISOL
    title: Filtration of the washed cake
    class: Filtering
    solid_separation:
      solid_recovery: 0.998
      cake_liquid: {value: 0.3, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "as F101 (D-007)"
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out}
  - id: D101
    block: ISOL
    title: Vacuum drying at 333 K (filter-dryer)
    class: Drying
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: product, direction: out, delegates: product}
      - {id: vapour, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M103
    block: ISOL
    title: Liquor collection to wastewater
    class: Mixing
    ports:
      - {id: ml, direction: in}
      - {id: wf, direction: in}
      - {id: cond, direction: in}
      - {id: out, direction: out, delegates: ww}

streams:
  - id: S1
    title: Process water
    from: PW.out
    to: M101.pw
    template: liquor
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "design basis"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 188.1099, provenance: assumed, source: "scripts/balance.py: 30 kmol water per kmol Br2 in the charge (D-004)"}
        composition: {basis: mass_fraction, values: {H2O: 1.0}, provenance: given, source: "pure water"}
  - id: S2
    title: Caustic soda 50 wt%
    from: NAOH.out
    to: M101.naoh
    template: liquor
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "design basis"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 30.7186, provenance: assumed, source: "scripts/balance.py: NaOH 1.02 per Br2 (D-004)"}
        composition: {basis: mass_fraction, values: {NAOH: 0.5, H2O: 0.5}, provenance: given, source: "membrane-cell caustic soda 50 wt% (chlor-alkali-1)"}
  - id: S3
    title: Succinimide
    from: SUCC.out
