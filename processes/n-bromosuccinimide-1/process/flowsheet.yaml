        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 38.0512, provenance: assumed, source: "scripts/balance.py: succinimide 1.02 per Br2 (D-004)"}
        composition: {basis: mass_fraction, values: {SUCC: 1.0}, provenance: assumed, source: "technical succinimide, impurities not modelled (D-004)"}
  - id: S4
    title: Charge (alkaline succinimide solution, 278 K)
