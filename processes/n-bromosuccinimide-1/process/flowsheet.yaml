# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# N-Bromosuccinimide by the caustic bromination of succinimide (DESIGN.md D-001), a batch plant:
# succinimide is dissolved in water with caustic soda and cooled to 5 C, bromine is dosed into
# the charge over 2 h (a semi-batch, reactor: semibatch), the NBS precipitates, is filtered,
# reslurry-washed with ice water, filtered again and dried at 60 C under vacuum; the mother
# liquor (NaBr) and the wash filtrate go to wastewater treatment.
# The flows are the year averages of the batch recipe (process/recipe.yaml, `cheme process
# recipe`, D-003): a batch of 334 kg of dried NBS every 5.3 h, 1495 batches and 500 t in 7920 h.
# Where the values come from:
# - feeds, temperatures, pressures, ratios: design basis and D-002..D-009, ASSUMED;
# - R101: cheme's semi-batch model (the rate law of BROM, D-005), to 0.999 conversion of the
#   bromine; CR101 and W101: core's crystallizer with the liquor's other solutes as spectators
#   and the solubility of NBS (core ADR 0056, D-014); F101, F102: specified filters with a Ruth
#   filtration time; D101: core's dryer to a residual moisture (core ADR 0057, D-014); M101,
#   M103: mixers (all calculated by `cheme process propagate --fill`);
# - the dryer's heat Q3: core's dryer model (`cheme process crystallizers`), compared with Q3;
# - the feeds that make 500 t/a, the duties Q1 and Q2 and the temperature of S16: the
#   independent balance scripts/balance.py (D-006, ADR 0027 of the library), given here as
#   ASSUMED: no property package of core is qualified for this liquor, and core does not size
#   feeds to a product rate.
schema: cheme/process/v1
kind: flowsheet
title: N-Bromosuccinimide by semi-batch bromination of succinimide in aqueous NaOH (500 t/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 500 t/a dried NBS (98.6 wt% crystals, 99.0 wt% NBS), year averages of 1495 batches in 7920 h (D-002, D-003)", default: true}
tolerance: {abs: 0.05, rel: 0.002}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: PW, title: Process water (dissolution), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NAOH, title: Caustic soda 50 wt% (chlor-alkali-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: SUCC, title: Succinimide (merchant), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: BR2, title: Liquid bromine (bromine-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: WASHW, title: Ice-cold process water (cake wash), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: m101, direction: out, kind: energy}
      - {id: r101, direction: out, kind: energy}
      - {id: d101, direction: out, kind: energy}
  - id: LPS
    title: LP steam 350 kPa(a) (to the dryer's hot-water circuit)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 350, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 412.0, provenance: given, source: "saturation at 350 kPa(a), IAPWS-IF97"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: d101, direction: out, kind: energy}
products:
  - {id: NBS, title: N-Bromosuccinimide crystals to packing, category: product, ports: [{id: in, direction: in}]}
  - {id: WW, title: "Mother liquor, wash filtrate and dryer condensate to wastewater treatment", category: wastewater, ports: [{id: in, direction: in}]}
  - id: BRINE
    title: Chilled brine return (263 K)
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 263.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 268.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: m101, direction: in, kind: energy}
      - {id: r101, direction: in, kind: energy}

blocks:
  - id: PREP
    title: Charge preparation
    class: Mixing
    ports:
      - {id: pw, direction: in}
      - {id: naoh, direction: in}
      - {id: succ, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: REACT
    title: Bromination and precipitation
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: br2, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: ISOL
    title: Filtration, washing and drying
    class: SeparatingMechanically
    ports:
      - {id: in, direction: in}
      - {id: wash, direction: in}
      - {id: product, direction: out}
      - {id: ww, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}

steps:
  - id: M101
    block: PREP
    title: Dissolver (succinimide in caustic, cooled to 278 K)
    class: Mixing
    links: [{target: equipment, ref: M-101}]
    ports:
      - {id: pw, direction: in, delegates: pw}
      - {id: naoh, direction: in, delegates: naoh}
      - {id: succ, direction: in, delegates: succ}
      - {id: out, direction: out, delegates: out}
      - {id: q, direction: out, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: R101
    block: REACT
    title: Brominator (bromine dosed into the cold charge)
    class: ReactingChemicals
    reactions: [BROM]
    reactor: semibatch
    batch:
      dosing: [{stream: S5, time: 7200}]
      target: {key: BR2, conversion: 0.999}
      heat: isothermal
      provenance: assumed
      source: "bromine dosed over 2 h, 30 min post-reaction at 278 K (D-005)"
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: br2, direction: in, delegates: br2}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: CR101
    block: REACT
    title: Precipitation hold (NBS crystallises from the cold liquor)
    class: Crystallizing
    crystallizer:
      solute: NBS
      solvent: H2O
      crystal: NBS_S
      basis: solubility
      temperature: 278.15
      solubility:
        unit: kg/kg_solvent
        value: 0.0147
        provenance: assumed
        source: "1.47 g per 100 g water at 25 C (PubChem CID 67184, HSDB), taken at 278 K as well: no open value at 0-10 C (D-005, D-014). Entered as `value` because core refuses the single 298.15 K point at 278.15 K (ADR 0025, no extrapolation): a known workaround, the figure is not at the operating conditions (lesson L-8)"
        salting_out:
          coefficients: {NABR: 0.0, NAOH: 0.0, SUCC: 0.0, BR2: 0.0}
          provenance: assumed
          source: "no open salting-out data of NBS in a NaBr/NaOH liquor; no correction taken, the pure-water value in the mother liquor (D-014)"
      spectators: [NABR, NAOH, SUCC, BR2]
      outlets: {slurry: out}
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
  - id: F101
    block: ISOL
    title: Filtration (filter-dryer)
    class: Filtering
    solid_separation:
      solid_recovery: 0.998
      cake_liquid: {value: 0.3, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "agitated filter-dryer, cake 0.3 kg liquor per kg NBS (D-007)"
      filtration:
        specific_cake_resistance: 1.0e+10
        medium_resistance: 1.0e+10
        pressure_difference: 200
        viscosity: 1.6
        filtrate_density: 1130
        provenance: assumed
        source: "ASSUMED (D-014): a free-filtering crystalline cake, a cloth medium, 200 kPa of nitrogen on the cake; the liquor's viscosity and density at 278 K estimated from water's with 15 wt% NaBr; to be replaced by a filtration trial"
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out}
  - id: W101
    block: ISOL
    title: Reslurry wash with ice water (NBS dissolves to saturation)
    class: Crystallizing
    crystallizer:
      solute: NBS
      solvent: H2O
      crystal: NBS_S
      basis: solubility
      temperature: 278.15
      solubility:
        unit: kg/kg_solvent
        value: 0.0147
        provenance: assumed
        source: "as CR101 (PubChem CID 67184, HSDB, 25 C, taken at 278 K; D-005, D-014). Entered as `value` because core refuses the single 298.15 K point at 278.15 K (ADR 0025, no extrapolation): a known workaround, the figure is not at the operating conditions (lesson L-8)"
        salting_out:
          coefficients: {NABR: 0.0, NAOH: 0.0, SUCC: 0.0, BR2: 0.0}
          provenance: assumed
          source: "as CR101: no correction (D-014)"
      spectators: [NABR, NAOH, SUCC, BR2]
      outlets: {slurry: out}
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: cake, direction: in}
      - {id: wash, direction: in, delegates: wash}
      - {id: out, direction: out}
  - id: F102
    block: ISOL
    title: Filtration of the washed cake
    class: Filtering
    solid_separation:
      solid_recovery: 0.998
      cake_liquid: {value: 0.3, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "as F101 (D-007)"
      filtration:
        specific_cake_resistance: 1.0e+10
        medium_resistance: 1.0e+10
        pressure_difference: 200
        viscosity: 1.5
        filtrate_density: 1010
        provenance: assumed
        source: "as F101, the wash filtrate nearly water at 278 K (D-014)"
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out}
  - id: D101
    block: ISOL
    title: Vacuum drying at 333 K (filter-dryer)
    class: Drying
    dryer:
      volatiles: [H2O, BR2]
      residual_moisture: {value: 0.002, basis: mass_fraction, provenance: assumed, source: "0.2 wt% volatiles in the dried product (D-008)"}
      temperature: 333.15
      energy:
        heat_capacity: 1.6
        latent_heat: {H2O: 2358.0, BR2: 187.5}
        vessel_heat_capacity: 1250
        efficiency: 0.7
        port: steam
        provenance: assumed
        source: "wet cake 1.6 kJ/(kg K), 70 % efficiency (D-009); latent heats: water at 333 K (steam tables), bromine 29.96 kJ/mol at its boiling point (CRC Handbook); the filter-dryer's metal, about 2.5 t of steel at 0.5 kJ/(kg K), heated from 278 K each batch, ASSUMED (D-014)"
      drying_rate: {value: 5.0, provenance: assumed, source: "ASSUMED mean rate of a jacketed agitated filter-dryer under vacuum: a wall flux of about 3.3 kW/m2 (U 110 W/(m2 K) at a 30 K approach) over 2358 kJ/kg (D-014)"}
      cake_density: {value: 1400, provenance: assumed, source: "ASSUMED bulk density of the wet cake: NBS crystals 2.098 g/cm3 (PubChem) with 0.3 kg of liquor per kg and some gas in the voids (D-014)"}
      outlets: {product: product, vapour: vapour}
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: product, direction: out, delegates: product}
      - {id: vapour, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M103
    block: ISOL
    title: Liquor collection to wastewater
    class: Mixing
    ports:
      - {id: ml, direction: in}
      - {id: wf, direction: in}
      - {id: cond, direction: in}
      - {id: out, direction: out, delegates: ww}

