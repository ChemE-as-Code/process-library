        composition: {basis: mole_fraction, values: {H2O: 0.93633, NAOH: 0.0318353, SUCC: 0.0318352, BR2: 0.0, NBS: 0.0, NBS_S: 0.0, NABR: 0.0}, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S2 S3', fingerprint: e3a0d35b7348466a}
