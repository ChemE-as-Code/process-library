# Simulation specs of n-bromosuccinimide-1 (`cheme schema process-simulation`). The flowsheet is
# not solved in DWSIM: no property package covers the alkaline bromide liquor, and a semi-batch
# is not coupled to DWSIM (core ADR 0048). Only the heat boundary is declared: the precipitation
# hold CR101 (inside R-101, on its brine jacket) and the reslurry wash W101 are phase changes of
# NBS whose heat is small and not known (no open heat of crystallisation): they have no utility
# energy port (adiabatic, DESIGN.md D-009).
schema: cheme/simulation/v1
kind: simulation
specs:
  CR101: {mode: adiabatic}
  W101: {mode: adiabatic}
