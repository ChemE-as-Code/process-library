# n-bromosuccinimide-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# The preliminary LCI leaves most backgrounds unmapped (DESIGN.md D-012): the build reports each
# as a gap (lci/gaps.json). Linked here: the bromine and the caustic soda to their library
# producers, and the LP steam counted as heat delivered (kWh), as thionyl-chloride-1 does.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:BR2": {dataset: {path: processes/bromine-1/lca/dataset.yaml, product: "product:BR2"}, source: "the Atlas producer bromine-1, dry bromine 99.96 wt-%"}
  "feed:NAOH": {dataset: {path: processes/chlor-alkali-1/lca/dataset.yaml, product: "product:NAOH"}, source: "the Atlas producer chlor-alkali-1, caustic soda 50 wt-%, per kg of solution as this exchange counts it"}
  "feed:LPS": {use: steam-heat, source: "LP steam 350 kPa(a) to the filter-dryer's hot-water circuit (Q3), counted as heat delivered (kWh), D-009"}
