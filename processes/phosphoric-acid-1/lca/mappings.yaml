# phosphoric-acid-1's own exchange overrides for the Atlas LCI build (ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Phosphate rock and the phosphogypsum outputs
# stay reported gaps: the shared vocabulary has no entry for rock or for a phosphogypsum stack, and
# none is guessed here.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:sulfuric-acid": {dataset: {path: processes/sulfuric-acid-1/lca/dataset.yaml, product: "product:ACID"}, source: "the Atlas producer sulfuric-acid-1, 98.5 wt% acid from sulfur burning, counted by mass of the acid as this feed is; many sites integrate both plants"}
  "feed:steam":
    use: steam
    atlas: false
    source: "Steam by mass, pressure not stated by the source (low-pressure steam for vacuum concentration in practice): the shared background entry, not one Atlas producer's pressure level. A site with a sulfuric acid plant uses its exhaust steam (EFMA booklet 4, section 4.1)."
