# Tier 1 form, a manifest-only entry without a flowsheet (pattern of process-library#317). Every
# amount is the formula of its parameters; core's validator re-checks each. Written from the EFMA
# (2000) BAT booklet No. 4, the LVIC-AAF BREF (2007) and IPCC 2006 Vol. 3 (facts in our own form).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: phosphoric-acid-dihydrate
title: Phosphoric acid, merchant grade, by the wet dihydrate process
description: Per 1 t of merchant-grade acid (53.97 wt% P2O5), gate-to-gate, from phosphate rock and sulfuric
  acid by the dihydrate process with concentration, EU conditions of the EFMA (2000) booklet and the LVIC-AAF
  BREF (2007). Feeds and gypsum from the stoichiometry of a model Moroccan rock with the sourced P2O5
  efficiency; utilities from sourced ranges.
basis: 1000 kg of merchant-grade phosphoric acid, 53.97 wt% P2O5 (539.7 kg P2O5)
boundary: 'gate-to-gate: rock grinding, attack and crystallisation, filtration, concentration, fluoride
  scrubbing and fluosilicic acid recovery; gypsum transport to the stack; steam and power from outside'
technology: wet process with sulfuric acid, dihydrate (DH) precipitation at 26 to 32 % P2O5 and 70 to
  80 degC, vacuum flash cooling, belt or tilting-pan vacuum filtration, single-effect forced-circulation
  evaporation to merchant grade; continuous operation
geography:
  description: EU plants of the EFMA and BREF data; rock modelled on the Moroccan (Khouribga) analysis,
    the EU's main supply.
classification:
  isic: '2011'
system_boundary:
  included:
  - phosphate rock and sulfuric acid by stoichiometry, process water
  - electricity and steam
  - phosphogypsum to the stack (gypsum, P2O5 loss, fluoride, gangue) as outputs
  - fluosilicic acid co-product
  - carbonate CO2 and fluoride to air
  - water leaving the process, counted as effluent
  excluded:
  - 'TODO cooling water (100 to 150 m3/t P2O5 in EFMA 4.1): the library counts it as heat rejected, which
    the sources do not give'
  - 'TODO dust from rock handling and grinding (EFMA 8.1.1: 50 mg/Nm3 achievable; BREF Table 5.6 reports
    plant values): no particle size, so no elementary flow chosen'
  - 'TODO releases to water of open-loop plants and stack run-off (BREF Table 5.7: e.g. 1 kg P and 2 kg
    F per t P2O5 at one plant): a closed-loop plant is modelled (EFMA 8.1.2)'
  - 'TODO cadmium, other heavy metals and radionuclides of the rock (BREF Tables 5.3, 5.4, 5.8): they
    split between acid and gypsum by rock and process; not in the model rock'
  - 'TODO phosphogypsum stack: its treatment, land use and long-term leachate; no treatment activity chosen'
  - 'TODO the rock''s other minor constituents (Al, Fe, Mg, Na, organics, SO3), counted as silica. Two known
    effects on the sulfuric acid: the model rock carries 51.6 % CaO against the analysis''s 50.6 % (BREF Table
    5.2), about 2 % more H2SO4 and gypsum; and the rock''s 1.6 % SO3 (about 27 kg SO3 per t of product, the
    sulfate of about 33 kg H2SO4) is not credited against the acid demand, about 2.4 % more. Together the
    H2SO4 is about 4 % high'
  - TODO free sulfate in the product acid and sulfuric acid excess
  - anti-foam and filter aids, storage losses
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: RER
year: 2006
valid_until: 2011
time:
  start: 1996
  description: EFMA booklet (2000, data of the late 1990s) and the BREF data collection (published 2007;
    plant data 1996 to 2006). valid_until is the reference year + 5 (system-model section 6), so it has
    already lapsed.
modelling:
  principle: attributional
  multifunctionality: 'two products: the acid and the fluosilicic acid by-product (1.3 % of the product
    mass); listed unallocated, default mass allocation (see allocation)'
allocation:
  method: mass
  coproducts:
  - phosphoric-acid
  - fluosilicic-acid
  deviation: No sourced prices, so the WBCSD price ratio of the acid and the fluosilicic acid cannot be
    computed; mass is the preliminary choice. The by-product carries about 1.3 % of the burdens by mass;
    economic allocation would give it less.
