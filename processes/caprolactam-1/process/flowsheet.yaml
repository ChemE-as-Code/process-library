# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Caprolactam by the conventional route (DESIGN.md D-001): cyclohexanone oximated with
# hydroxylamine-1's hydroxylammonium sulfate solution, the acid neutralised with ammonia; the
# oxime melt rearranged in oleum (Beckmann); the rearrangement mixture neutralised with ammonia
# in an ammonium sulfate solution; the crude lactam extracted with benzene, back-extracted into
# water, evaporated and distilled under vacuum; the ammonium sulfate crystallised from the
# combined solutions. 100.1 kt/a caprolactam on hydroxylamine-1's whole output (D-002).
# Where the values come from:
# - feeds, temperatures, pressures and the separators' fractions: design choices (design basis,
#   DESIGN.md D-003 to D-010, ASSUMED) set on the sourced conditions where a source gives one
#   (US 4,031,139; US 4,804,754; US 7,339,056 B2; US 6,448,395 B1); the separators' fractions
#   follow from the targets each decision names (the arithmetic is in its `source`);
# - the feed flows S01, S03, S07, S09 and the condensate split X601: design specifications
#   (`specs:`, core ADR 0070) on the targets of D-004, D-006 and D-007, solved with the tears;
# - the reactors R101, R201 and R301 are conversion steps calculated by `cheme process propagate
#   --fill` from process/reactions.yaml, which also writes their duties Q1 to Q3 (core ADR 0059);
# - mixers, the splitter X601 and the component separators (recovery:) by `cheme process
#   propagate --fill`, the three recycles (benzene S14, back-extraction water S19, condensate
#   S32) converged at tear streams (core ADR 0060);
# - every other duty and the adiabatic temperatures of C401 and M601: scripts/energy_balance.py,
#   which closes each non-reacting step's energy balance on the materials' constant heat
#   capacities (D-013); the evaporator economies, the reflux, the dryer and all electric power
#   are ASSUMED (D-009, D-010): no property package of core covers these salt solutions, the
#   lactam in oleum or the lactam/benzene/water system (L-2).
schema: cheme/process/v1
kind: flowsheet
title: Caprolactam from cyclohexanone oxime by Beckmann rearrangement in oleum (100 kt/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 12.52 t/h caprolactam (100.1 kt/a at 8000 h/a) on 36.68 t/h of hydroxylamine-1's hydroxylammonium sulfate solution, 31.0 t/h ammonium sulfate co-product (D-002)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h
tears:
  - stream: S14
    initial: {flow: 44653.8, unit: kg/h, basis: mass_fraction, composition: {BZ: 0.999717, CPL: 0.000283}}
  - stream: S19
    initial: {flow: 32223.0, unit: kg/h, basis: mass_fraction, composition: {H2O: 1.0}}
  - stream: S32
    initial: {flow: 25461.0, unit: kg/h, basis: mass_fraction, composition: {H2O: 1.0}}
convergence: {method: wegstein, max_iterations: 3000, tolerance: {abs: 1.0e-4, rel: 1.0e-7}}
# Design specifications (core ADR 0070), solved with the tears: the feed flows and the condensate
# split follow from the targets of D-004, D-006 and D-007 (DESIGN.md L-4: only the separators'
# recovery fractions remain hand-set).
specs:
  - id: SP-CHN
    vary: {stream: S01, initial: 11224.0, unit: kg/h}
    target: {stream: S05, component: CHN, quantity: fraction, basis: mass, value: 0.006}
    provenance: given
    source: "US 4,031,139 Example: oxime with 0.6 % cyclohexanone (D-004); the cyclohexanone fed above the hydroxylamine by what the melt carries"
  - id: SP-NH3OX
    vary: {stream: S03, initial: 2125.8, unit: kg/h}
    target: {stream: S04, component: NH3, quantity: flow, value: 0.5}
    provenance: assumed
    source: "D-004: ammonia stoichiometric to the hydroxylammonium sulfate and the free acids plus a 0.5 kg/h trace in excess (ASSUMED; pH 4.5 to 5.8, US 4,931,592)"
  - id: SP-OLEUM
    vary: {stream: S07, initial: 15856.0, unit: kg/h}
    target: {stream: S07, quantity: ratio, basis: mass, per: {stream: S05}, value: 1.17}
    provenance: given
    source: "US 4,804,754 Example: 1.17 kg oleum (32 wt% SO3) per kg oxime, read per kg of the melt as fed (D-006)"
  - id: SP-NH3NE
    vary: {stream: S09, initial: 5882.5, unit: kg/h}
    target: {stream: S10, component: NH3, quantity: flow, value: 1.0}
    provenance: assumed
    source: "D-007: ammonia stoichiometric to the acid mixture's H2SO4 and SO3 plus a 0.5 kg/h trace, beside the oximation liquor's 0.5 kg/h (ASSUMED; pH 4 to 5, US 4,804,754)"
  - id: SP-AS40
    vary: {node: X601, port: rec, initial: 0.4938}
    target: {stream: S12, component: AS, quantity: fraction, basis: mass, value: 0.40}
    provenance: given
    source: "US 4,804,754 Example: the lactam separates from a 40 to 43 % ammonium sulfate solution; 40 wt% leaving D301 (D-007)"

feeds:
  - {id: CHNF, title: "Cyclohexanone (boundary feed; no library process)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: HASF, title: "Hydroxylammonium sulfate solution 25.4 wt% (hydroxylamine-1)", category: raw_material, ports: [{id: out, direction: out}]}
  - id: NH3F
    title: "Liquid ammonia (ammonia-1)"
    category: raw_material
    ports: [{id: oxi, direction: out}, {id: neu, direction: out}]
  - {id: OLEF, title: "Oleum 32 wt% SO3 (boundary feed; no library process)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: BZF, title: "Benzene make-up (boundary feed)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PW, title: "Demineralised water make-up (back-extraction)", category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: r201, direction: out, kind: energy}
      - {id: r301, direction: out, kind: energy}
      - {id: c401, direction: out, kind: energy}
      - {id: c501, direction: out, kind: energy}
      - {id: ev601, direction: out, kind: energy}
  - id: LPS
    title: "LP steam 500 kPa(a) (evaporators)"
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 500, provenance: assumed, source: "design basis, D-009"}
      supply_temperature: {value: 425.0, provenance: assumed, source: "saturation at 500 kPa(a), chemicals 1.5.2 IAPWS-95 iapws95_Tsat (SRC-10), D-009"}
      min_approach: {value: 10, provenance: assumed, source: D-009}
    ports: [{id: e501, direction: out, kind: energy}, {id: ev601, direction: out, kind: energy}, {id: dryer, direction: out, kind: energy}]
  - id: MPS
    title: "MP steam 1500 kPa(a) (lactam column reboiler)"
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1500, provenance: assumed, source: "design basis, D-009"}
      supply_temperature: {value: 471.4, provenance: assumed, source: "saturation at 1500 kPa(a), chemicals 1.5.2 IAPWS-95 iapws95_Tsat (SRC-10), D-009"}
      min_approach: {value: 10, provenance: assumed, source: D-009}
    ports: [{id: c501, direction: out, kind: energy}]
products:
  - {id: PROD, title: "Caprolactam to storage", category: product, ports: [{id: in, direction: in}]}
  - {id: ASP, title: "Ammonium sulfate crystals to storage (co-product)", category: by_product, ports: [{id: in, direction: in}]}
  - {id: PURGE, title: "Mother-liquor purge to treatment", category: wastewater, ports: [{id: in, direction: in}]}
  - {id: ORGW, title: "Organic residues to incineration (cyclohexanone, benzene, lactam)", category: solid_waste, ports: [{id: in, direction: in}]}
  - {id: COND, title: "Surplus process condensate to the site's water system", category: wastewater, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-009"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-009"}
      min_approach: {value: 5, provenance: assumed, source: D-009}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: r201, direction: in, kind: energy}
      - {id: r301, direction: in, kind: energy}
      - {id: e501, direction: in, kind: energy}
      - {id: c501, direction: in, kind: energy}
      - {id: ev601, direction: in, kind: energy}
      - {id: d101, direction: in, kind: energy}
      - {id: d301, direction: in, kind: energy}
      - {id: c402, direction: in, kind: energy}
  - id: AMBIENT
    title: Heat leaving with the salt dryer's exhaust air to the ambient
    category: utility
    utility: {kind: other}
    ports: [{id: ev601, direction: in, kind: energy}]

blocks:
  - id: OXI
    title: Oximation
    class: ReactingChemicals
    ports:
      - {id: chn, direction: in}
      - {id: has, direction: in}
      - {id: nh3, direction: in}
      - {id: oxime, direction: out}
      - {id: liquor, direction: out}
      - {id: cw, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: BKR
    title: Beckmann rearrangement in oleum
    class: ReactingChemicals
    ports:
      - {id: oxime, direction: in}
      - {id: oleum, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: NEU
    title: Neutralisation and phase separation
    class: ReactingChemicals
    ports:
      - {id: acid, direction: in}
      - {id: nh3, direction: in}
      - {id: liquor, direction: in}
      - {id: cond, direction: in}
      - {id: crude, direction: out}
      - {id: assol, direction: out}
      - {id: cw, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: EXT
    title: Benzene extraction and back-extraction
    class: Separating
    ports:
      - {id: crude, direction: in}
      - {id: bz, direction: in}
      - {id: water, direction: in}
      - {id: wrec, direction: in}
      - {id: raff, direction: out}
      - {id: aq, direction: out}
      - {id: cw, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: PUR
    title: Lactam evaporation and vacuum distillation
    class: Separating
    ports:
      - {id: aq, direction: in}
      - {id: wrec, direction: out}
      - {id: prod, direction: out}
      - {id: orgw, direction: out}
      - {id: steam1, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: ASC
    title: Ammonium sulfate crystallisation
    class: Separating
    ports:
      - {id: assol, direction: in}
      - {id: raff, direction: in}
      - {id: cryst, direction: out}
      - {id: purge, direction: out}
      - {id: cond, direction: out}
      - {id: exp, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: loss, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}

steps:
  # ---- OXI
  # D-004: counter-current oximation at 363 K (US 4,031,139), ammonia to pH 4.5 to 5.8
  # (US 4,931,592); conversion model.
  - id: R101
    block: OXI
    title: Oximation reactor cascade (counter-current, ammonia to pH 5)
    class: ReactingChemicals
    reactions: [OXIM, NEUTA, NEUTN]
    reactor: conversion
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: chn, direction: in, delegates: chn}
      - {id: has, direction: in, delegates: has}
      - {id: nh3, direction: in, delegates: nh3}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
      - {id: power, direction: in, kind: energy, delegates: power}
  # D-004: the oxime melt separates from the ammonium sulfate liquor; 4.6 wt% water and 0.6 wt%
  # cyclohexanone in the melt (US 4,031,139, Example).
  - id: D101
    block: OXI
    title: Oxime separator
    class: Separating
    recovery:
      outlets:
        oxime: {OXM: 1.0, CHN: 1.0, H2O: 0.022141}
      provenance: assumed
      source: "D-004: the oxime melt carries all the oxime and the excess cyclohexanone and 4.6 wt% water (US 4,031,139 Example): 0.046 / 0.948 x 12847.3 kg/h oxime = 623.39 of 28155.6 kg/h water"
    links: [{target: equipment, ref: D-101}, {target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: oxime, direction: out, delegates: oxime}
      - {id: liquor, direction: out, delegates: liquor}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  # ---- BKR
  # D-006: circulating rearrangement loop at 388 K with its cooler (US 4,804,754: 108 to 118 C,
  # oleum 32 wt% SO3, 1.17 kg per kg oxime); yield 98.9 % (US 7,339,056 B2).
  - id: R201
    block: BKR
    title: Rearrangement loop reactor with circulation cooler
    class: ReactingChemicals
    reactions: [BECK, HYDR, SO3W]
    reactor: conversion
    links: [{target: equipment, ref: R-201}, {target: equipment, ref: E-201}, {target: equipment, ref: P-201}]
    ports:
      - {id: oxime, direction: in, delegates: oxime}
      - {id: oleum, direction: in, delegates: oleum}
      - {id: out, direction: out, delegates: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
      - {id: power, direction: in, kind: energy, delegates: power}
  # ---- NEU
  # D-007: the acid mixture and ammonia into a circulating ammonium sulfate solution, pH 4 to 5
  # (US 4,804,754, which passes in gaseous ammonia; here the liquid is injected, ASSUMED, so
  # that its latent heat lowers the loop's cooling and no vaporiser is needed); conversion
  # model; cooled by cooling water.
  - id: R301
    block: NEU
    title: Neutraliser loop with circulation cooler
    class: ReactingChemicals
    reactions: [NEUT, NEUT3]
    reactor: conversion
    links: [{target: equipment, ref: R-301}, {target: equipment, ref: E-301}]
    ports:
      - {id: acid, direction: in, delegates: acid}
      - {id: nh3, direction: in, delegates: nh3}
      - {id: liquor, direction: in, delegates: liquor}
      - {id: cond, direction: in, delegates: cond}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
      - {id: power, direction: in, kind: energy, delegates: power}
  # D-007: crude lactam with about 30 wt% water (US 4,804,754) separates from the about 40 wt%
  # ammonium sulfate solution (US 4,804,754 Example: 40 to 43 %).
  - id: D301
    block: NEU
    title: Crude lactam separator
    class: Separating
    recovery:
      outlets:
        crude: {CPL: 0.999, CHN: 1.0, H2O: 0.107686, AS: 0.008925}
      provenance: assumed
      source: "D-007: crude lactam with 30 wt% water (US 4,804,754) and 1.5 wt% ammonium sulfate (ASSUMED), 0.1 % of the lactam left in the solution (ASSUMED): 12693.4 kg/h lactam and 203.9 cyclohexanone / 0.685 = 18828.2 kg/h, of which 5648.4 water (of 52452.7) and 282.4 ammonium sulfate (of 31644.4)"
    links: [{target: equipment, ref: D-301}, {target: equipment, ref: E-302}]
    ports:
      - {id: in, direction: in}
      - {id: crude, direction: out, delegates: crude}
      - {id: assol, direction: out, delegates: assol}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  # ---- EXT
  - id: M401
    block: EXT
    title: Benzene solvent tank (make-up and recycle)
    class: Mixing
    symbol: TANK_CONE_ROOF_SHAPE
    links: [{target: equipment, ref: T-401}]
    ports:
      - {id: makeup, direction: in, delegates: bz}
      - {id: rec, direction: in}
      - {id: out, direction: out}
  # D-008: counter-current benzene extraction; extract 22 wt% lactam, 99.6 % of the lactam
  # extracted (US 6,448,395 B1, Comparative Experiment A and Example I: 99.5 and 99.8 %).
  - id: C401
    block: EXT
    title: Benzene extraction column (crude lactam)
    class: Separating
    recovery:
      outlets:
        extract: {CPL: 0.996, CHN: 1.0, BZ: 1.0}
      provenance: assumed
      source: "D-008: 99.6 % of the lactam to the extract, between US 6,448,395 B1's 99.5 and 99.8 % yields; the cyclohexanone with the benzene and no water or salt in the extract (ASSUMED); the raffinate (water, salt, 0.4 % of the lactam) to the crystalliser"
    links: [{target: equipment, ref: C-401}]
    ports:
      - {id: feed, direction: in, delegates: crude}
      - {id: solv, direction: in}
      - {id: extract, direction: out}
      - {id: raff, direction: out, delegates: raff}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M402
    block: EXT
    title: Back-extraction water (make-up and evaporator condensate)
    class: Mixing
    symbol: STATIC_MIXER_SHAPE
    links: [{target: equipment, ref: M-402}]
    ports:
      - {id: makeup, direction: in, delegates: water}
      - {id: rec, direction: in, delegates: wrec}
      - {id: out, direction: out}
  # D-008: back-extraction into water; 28 wt% lactam in the aqueous outlet, 99.9 % of the
  # lactam (US 6,448,395 B1, Comparative Experiment D and Example IV: 99.0 and 99.9 %).
  - id: C402
    block: EXT
    title: Back-extraction column (lactam into water)
    class: Separating
    recovery:
      outlets:
        aq: {CPL: 0.999, CHN: 1.0, BZ: 0.0005, H2O: 1.0}
      provenance: assumed
      source: "D-008: 99.9 % of the lactam to the water (US 6,448,395 B1 Example IV), the rest back to the solvent tank; the cyclohexanone to the water (ASSUMED, so that it leaves the solvent loop through the evaporator's organic phase); 0.05 % of the benzene dissolved in the aqueous lactam (ASSUMED)"
    links: [{target: equipment, ref: C-402}, {target: equipment, ref: E-402}]
    ports:
      - {id: ext, direction: in}
      - {id: water, direction: in}
      - {id: aq, direction: out, delegates: aq}
      - {id: bz, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  # ---- PUR
  # D-009: three-effect evaporation of the aqueous lactam to 99 wt% (ASSUMED); the benzene and
  # cyclohexanone stripped with the first vapours to the organic waste; the condensate reused
  # as back-extraction water.
  - id: E501
    block: PUR
    title: Lactam evaporator (three effects, benzene stripper)
    class: Separating
    recovery:
      outlets:
        cond: {H2O: 0.996044}
        org: {BZ: 1.0, CHN: 1.0}
      provenance: assumed
      source: "D-009: concentrate 1 wt% water (ASSUMED): 0.01 / 0.99 x 12642.6 kg/h lactam = 127.7 of 32283.1 kg/h water left; all the benzene and cyclohexanone to the organic waste (the BREF's benzene stripper, ASSUMED not recovered)"
    links: [{target: equipment, ref: E-501}]
    ports:
      - {id: in, direction: in, delegates: aq}
      - {id: cond, direction: out, delegates: wrec}
      - {id: org, direction: out}
      - {id: conc, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam1}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  # D-009: vacuum distillation; lights (water, some lactam) and a residue to incineration.
  - id: C501
    block: PUR
    title: Lactam vacuum distillation
    class: Separating
    recovery:
      outlets:
        prod: {CPL: 0.99}
        lights: {H2O: 1.0, CPL: 0.003}
      provenance: assumed
      source: "D-009: 99.0 % of the lactam as distilled product, 0.3 % with the water in the lights and 0.7 % in the residue (ASSUMED; no open source gives the column's recoveries)"
    links: [{target: equipment, ref: C-501}]
    ports:
      - {id: in, direction: in}
      - {id: prod, direction: out, delegates: prod}
      - {id: lights, direction: out}
      - {id: res, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam2}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M502
    block: PUR
    title: Organic residue collection
    class: Mixing
    symbol: TANK_CONE_ROOF_SHAPE
    links: [{target: equipment, ref: T-502}]
    ports:
      - {id: org, direction: in}
      - {id: lights, direction: in}
      - {id: res, direction: in}
      - {id: out, direction: out, delegates: orgw}
  # ---- ASC
  - id: M601
    block: ASC
    title: Ammonium sulfate solution tank
    class: Mixing
    symbol: TANK_CONE_ROOF_SHAPE
    links: [{target: equipment, ref: T-601}]
    ports:
      - {id: assol, direction: in, delegates: assol}
      - {id: raff, direction: in, delegates: raff}
      - {id: out, direction: out}
  # D-010: evaporative crystallisation (three effects), centrifuge and dryer; 98 % of the salt
  # as crystals, the impurities in a mother-liquor purge of 35 wt% ammonium sulfate (ASSUMED).
  - id: EV601
    block: ASC
    title: Ammonium sulfate crystalliser, centrifuge and dryer
    class: Separating
    recovery:
      outlets:
        cryst: {AS: 0.98}
        purge: {AS: 0.02, HAS: 1.0, AN: 1.0, CPL: 1.0, CHN: 1.0, NH3: 1.0, H2SO4: 1.0, H2O: 0.01689}
      provenance: assumed
      source: "D-010: 98 % of the ammonium sulfate as dry crystals, the purge 35 wt% ammonium sulfate with every impurity (ASSUMED): 632.9 / 0.35 = 1808.2 kg/h, of which 885.9 of 52452.7 kg/h water; the rest of the water evaporated as condensate"
    links: [{target: equipment, ref: EV-601}]
    ports:
      - {id: in, direction: in}
      - {id: cryst, direction: out, delegates: cryst}
      - {id: purge, direction: out, delegates: purge}
      - {id: cond, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: dryer, direction: in, kind: energy, delegates: steam2}
      - {id: cw, direction: out, kind: energy, delegates: cw}
      - {id: exhaust, direction: out, kind: energy, delegates: loss}
      - {id: power, direction: in, kind: energy, delegates: power}
  # D-007: the condensate dilutes the neutraliser loop to 40 wt% ammonium sulfate; the surplus
  # leaves.
  - id: X601
    block: ASC
    title: Condensate distribution
    class: SplittingMaterial
    ports:
      - {id: in, direction: in}
      - {id: rec, direction: out, delegates: cond}
      - {id: exp, direction: out, delegates: exp}

streams:
  # ---- OXI
  - id: S01
    title: Cyclohexanone
    from: CHNF.out
    to: R101.chn
    template: ketone
    state:
      design:
