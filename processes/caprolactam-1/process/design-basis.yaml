# What the plant must do. Schema: `cheme schema design_basis`.
# Caprolactam by the conventional route (cyclohexanone oxime, Beckmann rearrangement in oleum,
# neutralisation with ammonia), issue ChemE-as-Code/process-library#464. Values marked ASSUMED
# are engineering choices of this concept study, not client or licensor data; every decision and
# source locator is in DESIGN.md.
schema: cheme/design_basis/v1
capacity:
  basis: distilled caprolactam to storage (stream S24)
  caprolactam_t_per_a: 100129          # = 12516.1 kg/h x 8000 h; set by hydroxylamine-1's whole output (D-002)
  operating_hours_per_year: 8000       # ASSUMED (D-002), as hydroxylamine-1
  caprolactam_kg_per_h: 12516.1
  ammonium_sulfate_kg_per_h: 31011.4   # crystals, stream S29
  turndown_percent: 50                 # ASSUMED, not checked
feeds:
  - name: Cyclohexanone (boundary feed)
    source_of_values: "ASSUMED pure (D-003); no library process makes it; 0.5 % above the hydroxylamine, the excess leaving with the oxime melt at 0.6 wt% (US 4,031,139)"
    consumption: "0.897 kg/kg caprolactam (stream S01)"
  - name: Hydroxylammonium sulfate solution 25.4 wt% (hydroxylamine-1)
    source_of_values: "hydroxylamine-1's product S24 as that entry gives it: 25.4 wt% (NH3OH)2SO4, 1.86 wt% (NH4)2SO4, 1.30 wt% H2SO4, 0.26 wt% HNO3 (D-003)"
    consumption: "2.931 kg/kg caprolactam (stream S02)"
  - name: Liquid ammonia (ammonia-1)
    source_of_values: "ASSUMED pressurised liquid at 298 K, 1200 kPa(a) (D-003); stoichiometric to the acids plus 0.5 kg/h each"
    consumption: "0.170 kg/kg to the oximation (S03), 0.470 kg/kg to the neutraliser (S09)"
  - name: Oleum 32 wt% SO3 (boundary feed)
    source_of_values: "US 4,804,754 Example: 32 wt% SO3, 1.17 kg per kg oxime (D-006); no library process makes oleum"
    consumption: "1.267 kg/kg caprolactam (stream S07)"
  - name: Benzene make-up
    source_of_values: "ASSUMED loss of 0.05 % of the circulating benzene with the aqueous lactam (D-008)"
    consumption: "1.8 g/kg caprolactam (stream S13)"
  - name: Demineralised water make-up
    source_of_values: "the water the concentrated lactam takes out of the back-extraction loop (D-009)"
    consumption: "0.010 kg/kg caprolactam (stream S18)"
products:
  - name: Caprolactam (main product)
    purity: "modelled 100 % (the distillation's recoveries are ASSUMED; the commercial specification, the permanganate and UV numbers of US 4,804,754, is not modelled, D-009)"
    delivery: {pressure_kPa_a: 300, temperature_K: 353.15, battery_limit: "molten lactam to storage"}
  - name: Ammonium sulfate crystals (co-product)
    purity: "modelled 100 % (NH4)2SO4, dry; 2.478 kg/kg caprolactam (stream S29)"
  - name: Mother-liquor purge (to treatment), organic residues (to incineration), surplus process condensate (to the site's water system)
utilities:
  - {name: Cooling water, supply_K: 298.15, return_K: 308.15, note: "ASSUMED (D-009)"}
  - {name: LP steam, pressure_kPa_a: 500, saturation_K: 425.0, use: "lactam evaporator, ammonium sulfate crystalliser", note: "ASSUMED level, three effects (D-009, D-010)"}
  - {name: MP steam, pressure_kPa_a: 1500, saturation_K: 471.4, use: "lactam vacuum column reboiler", note: "ASSUMED level (D-009)"}
  - {name: Electric power, use: "agitators, circulation pumps, extraction columns, vacuum system, centrifuges, dryer fans", note: "ASSUMED estimates (D-009, D-010)"}
site:
  location: ASSUMED generic site, not chosen; beside hydroxylamine-1 and an oleum supply
  design_ambient_K: 298.15            # ASSUMED
  atmospheric_pressure_kPa: 101.325   # ASSUMED
assumptions:
  - "Oximation: counter-current at 363 K (US 4,031,139), ammonia to pH 4.5 to 5.8 (US 4,931,592), hydroxylamine converted completely, the melt with 4.6 wt% water and 0.6 wt% cyclohexanone (US 4,031,139 Example) (D-004)."
  - "Rearrangement: oleum 32 wt% SO3 at 1.17 kg per kg melt, 388 K (US 4,804,754 Example); yield 98.9 % (US 7,339,056 B2 Comparative Experiment A, an oxime with 4.7 wt% water); the loss represented as hydrolysis to cyclohexanone, ASSUMED (D-006)."
  - "Neutralisation: ammonia to pH 4 to 5 into the ammonium sulfate solution (US 4,804,754); 353 K ASSUMED; crude lactam 30 wt% water (US 4,804,754), 1.5 wt% salt ASSUMED; solution 40 wt% ammonium sulfate (US 4,804,754 Example: 40 to 43 %) (D-007)."
  - "Extraction: benzene extract 22 wt% lactam, 99.6 % extracted; back-extraction to 28 wt% lactam, 99.9 % (US 6,448,395 B1) (D-008)."
  - "Purification: evaporation to 99 wt%, vacuum distillation with 99.0 % of the lactam as product (ASSUMED); ion exchange and hydrogenation not modelled (D-009)."
  - "Ammonium sulfate: 98 % crystallised, 2 % with the impurities in a purge (ASSUMED); three-effect evaporation (ASSUMED) (D-010)."
  - "All flows are concept estimates from core's conversion steps and component separators; duties of the evaporators and the column and all power are ASSUMED estimates; accuracy not stated, roughly +/-30 %."
