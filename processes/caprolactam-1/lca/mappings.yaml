# caprolactam-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# The preliminary LCI leaves most backgrounds unmapped (DESIGN.md D-012): the build reports each
# as a gap (lci/gaps.json). Linked here: the hydroxylammonium sulfate solution to
# hydroxylamine-1, the ammonia to ammonia-1, and the LP and MP steam counted as heat delivered
# (kWh). Cyclohexanone and oleum stay gaps: no library process exports them; their proxies are
# recorded in lca.yaml and DESIGN.md D-012, not linked (CONTRIBUTING, "Gaps").
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:HASF": {dataset: {path: processes/hydroxylamine-1/lca/dataset.yaml, product: "product:PROD"}, source: "the Atlas producer hydroxylamine-1, hydroxylammonium sulfate solution 25.4 wt% counted by mass of the solution, the same composition as this feed S02 (D-003); kg for kg"}
  "feed:NH3F": {dataset: {path: processes/ammonia-1/lca/dataset.yaml, product: "product:NH3"}, source: "the Atlas producer ammonia-1, liquid ammonia (refrigerated at its battery limit; this feed is pressurised liquid at 298 K, the pumping and warming not counted); kg for kg (D-003)"}
  "feed:BZF":
    atlas: false
    source: "The supplier is not decided: hda-1 is one route, styrene-1's by-product benzene another and btx-1's reformate extraction a third. Link one explicitly once chosen (as cumene-1 and ethylbenzene-1)."
  "feed:LPS": {use: steam-heat, source: "LP steam 500 kPa(a) to the lactam evaporator (Q4) and the ammonium sulfate crystalliser (Q8), counted as heat delivered (kWh), D-009, D-010"}
  "feed:MPS": {use: steam-heat, source: "MP steam 1500 kPa(a) to the lactam column's reboiler (Q6), counted as heat delivered (kWh), D-009"}
