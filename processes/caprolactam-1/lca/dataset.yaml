    stage: the relative price 1 : 0.07 is ASSUMED.'
  deviation: The shares rest on an ASSUMED relative price, not sourced ones. The conservative bound is
    all burdens to the caprolactam (share 1); mass allocation, which the rule would give only below a
    price ratio of 5, would leave the caprolactam 28.8 % of the burdens (12516.1 of 43527.5 kg/h). Sourced
    prices replace the ratio.
