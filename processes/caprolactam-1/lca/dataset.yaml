id: caprolactam-from-cyclohexanone-oxime-by-beckmann-rearrangement-in-oleum-100-kt-a
title: Caprolactam from cyclohexanone oxime by Beckmann rearrangement in oleum (100 kt/a)
description: Unallocated foreground LCI of Caprolactam from cyclohexanone oxime by Beckmann rearrangement
  in oleum (100 kt/a), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Continuous plant: cyclohexanone oximated counter-currently at 363 K with hydroxylammonium
  sulfate solution (hydroxylamine-1) and ammonia to pH 5; the oxime melt (4.6 wt% water) rearranged in
  oleum (32 wt% SO3, 1.17 kg/kg) in a circulating loop at 388 K, yield 98.9 %; the mixture neutralised
  with liquid ammonia injected into a 40 wt% ammonium sulfate solution; the crude lactam extracted with
  benzene, back-extracted into water, evaporated (three effects) and distilled under vacuum; ammonium
  sulfate crystallised from the combined solutions (three effects), centrifuged and dried; 100.1 kt/a
  caprolactam and 248 kt/a ammonium sulfate at 8000 h/a'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
