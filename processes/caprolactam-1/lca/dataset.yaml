    no property package covers these salts and the lactam), so the WBCSD rule applies: the price per kg
    of caprolactam, a polymer intermediate, is well above five times that of a nitrogen fertiliser salt,
    so the rule gives economic allocation. No prices are sourced at the concept stage: the relative price
    1 : 0.07 is ASSUMED.'
