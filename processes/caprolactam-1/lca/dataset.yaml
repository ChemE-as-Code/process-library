allocation:
  method: shares
  coproducts:
  - PROD
  - ASP
  shares:
    PROD: 0.8522
    ASP: 0.1478
  source: 'D-012 (agent proposal, for the LCA practitioner to confirm): the plant makes 2.48 kg of crystalline
    ammonium sulfate, a traded fertiliser (the product of processes/ammonium-sulfate-1), per kg of caprolactam.
    The library hierarchy (docs/system-model.md) has no physical relationship between them (neither is
    a fuel; no exergy, since no property package covers these salts and the lactam), so the WBCSD rule
    applies: the price per kg of caprolactam, a polymer intermediate, is well above five times that of
    a nitrogen fertiliser salt, so the rule gives economic allocation. No prices are sourced at the concept
    stage: the relative price 1 : 0.07 is ASSUMED.'
  deviation: The shares rest on an ASSUMED relative price, not sourced ones. The conservative bound is
    all burdens to the caprolactam (share 1); mass allocation, which the rule would give only below a
    price ratio of 5, would leave the caprolactam 28.8 % of the burdens (12516.6 of 43529.3 kg/h). Sourced
    prices replace the ratio.
