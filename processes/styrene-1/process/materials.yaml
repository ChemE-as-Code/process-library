# Components and templates of the process. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
# Ideal-gas and critical data: `cheme chemistry thermo <names> --fit 298.15,1100` for the
# aromatics and `--fit 298.15,2200` for the light gases, water and the flue gas components (the
# `chemicals` package: ATcT/CRC formation enthalpies, CRC/Yaws/WebBook entropies, heat
# capacities fitted to thermo's TRC ideal-gas correlations, Joback for styrene and stilbene,
# HEOS/IUPAC/CRC critical constants). Molar masses and normal boiling points: `chemicals`
# (MW, Tb). BIPH (biphenyl) is the tar proxy of D-005: a real heavy aromatic that
# DWSIM's database and thermo both know (trans-stilbene, tried first, is not in DWSIM's
# database), standing in for the oligomers and high boilers of the tar; it is not a claim about
# the tar's composition.
schema: cheme/process/v1
kind: materials
