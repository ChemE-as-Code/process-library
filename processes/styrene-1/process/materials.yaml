# property_method is a placeholder until `cheme process props --fill` records the method. No
# property package qualified by core covers aromatics with water and hydrogen (core#315; the
# packaged ones cover air and syngas): the stream values are simulated by DWSIM with
# Peng-Robinson as a recorded substitution (D-012), a cross-check, not validated data.
property_method:
  adapter: thermo
  status: placeholder
