    reversible: false
    conversion: {key: C2H4, value: 1.0, provenance: assumed, source: "D-009: complete combustion"}
    heat_of_reaction: {value: -1323152.0, provenance: calculated, source: "formation enthalpies of process/materials.yaml"}
  - id: CB_BZ
    equation: C6H6 + 7.5 O2 -> 6 CO2 + 3 H2O
    stoichiometry: {BZ: -1.0, O2: -7.5, CO2: 6.0, H2O: 3.0}
    reversible: false
    conversion: {key: BZ, value: 1.0, provenance: assumed, source: "D-009: complete combustion"}
    heat_of_reaction: {value: -3169490.0, provenance: calculated, source: "formation enthalpies of process/materials.yaml"}
  - id: CB_TOL
    equation: C7H8 + 9 O2 -> 7 CO2 + 4 H2O
    stoichiometry: {TOL: -1.0, O2: -9.0, CO2: 7.0, H2O: 4.0}
    reversible: false
    conversion: {key: TOL, value: 1.0, provenance: assumed, source: "D-009: complete combustion"}
    heat_of_reaction: {value: -3772016.0, provenance: calculated, source: "formation enthalpies of process/materials.yaml"}
  - id: CB_EB
    equation: C8H10 + 10.5 O2 -> 8 CO2 + 5 H2O
    stoichiometry: {EB: -1.0, O2: -10.5, CO2: 8.0, H2O: 5.0}
    reversible: false
    conversion: {key: EB, value: 1.0, provenance: assumed, source: "D-009: complete combustion"}
    heat_of_reaction: {value: -4386802.0, provenance: calculated, source: "formation enthalpies of process/materials.yaml"}
  - id: CB_SM
    equation: C8H8 + 10 O2 -> 8 CO2 + 4 H2O
    stoichiometry: {SM: -1.0, O2: -10.0, CO2: 8.0, H2O: 4.0}
    reversible: false
    conversion: {key: SM, value: 1.0, provenance: assumed, source: "D-009: complete combustion"}
