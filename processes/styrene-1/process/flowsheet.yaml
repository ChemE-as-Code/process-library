# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Styrene by adiabatic dehydrogenation of ethylbenzene with superheated steam (D-001). Where the
# values come from:
# - feed compositions, temperatures and pressures, and the specified temperatures and pressures
#   of the units, are design choices (design basis, D-003 to D-010), ASSUMED;
# - the feed flows S1, S3, S36 and S37 come from the independent balance scripts/sm_balance.py
#   (D-006), ASSUMED;
# - every other stream value and duty is calculated: by `cheme process propagate --fill`
#   (mixers, splitters, pass-throughs, the conversion reactors) and by `cheme process simulate
#   --fill` (DWSIM, Peng-Robinson as a recorded substitution, D-012). No property package is
#   qualified by core for aromatics with water and hydrogen (core#315): the simulated values are
#   a second implementation's check of the script, not validated data.
schema: cheme/process/v1
kind: flowsheet
title: Styrene by adiabatic ethylbenzene dehydrogenation (300 kt/a, concept)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 37.5 t/h styrene, steam/EB 1.3 kg/kg, EB conversion 0.40 per bed in two adiabatic beds at 893 K inlet (D-002, D-004, D-005)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: EB, title: Fresh ethylbenzene, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: DSTEAM, title: "Dilution steam (MP 1100 kPa(a), saturated)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NG, title: Natural gas to the steam superheater burners, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AIR, title: Combustion air, category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports: [{id: p201, direction: out, kind: energy}, {id: p302, direction: out, kind: energy}, {id: k101, direction: out, kind: energy}]
  - id: LPS
    title: LP steam 450 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis, D-010"}
      supply_temperature: {value: 420.8, provenance: assumed, source: "saturation at 450 kPa(a), D-010"}
      min_approach: {value: 10, provenance: assumed, source: D-010}
    ports:
      - {id: c301, direction: out, kind: energy}
      - {id: c304, direction: out, kind: energy}
      - {id: c302, direction: out, kind: energy}
      - {id: c303, direction: out, kind: energy}
products:
  - {id: STYRENE, title: Styrene monomer to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: BENZENE, title: Benzene by-product, category: by_product, ports: [{id: in, direction: in}]}
  - {id: TOLUENE, title: Toluene by-product, category: by_product, ports: [{id: in, direction: in}]}
  - {id: TAR, title: Tar (fuel at the site), category: by_product, ports: [{id: in, direction: in}]}
  - {id: PCOND, title: Process condensate to the condensate stripper, category: wastewater, ports: [{id: in, direction: in}]}
  - {id: STACK, title: Steam superheater flue gas to atmosphere, category: emission, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-010"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-010"}
      min_approach: {value: 5, provenance: assumed, source: D-010}
    ports:
      - {id: e103, direction: in, kind: energy}
      - {id: k101, direction: in, kind: energy}
      - {id: c301, direction: in, kind: energy}
      - {id: c304, direction: in, kind: energy}
      - {id: c302, direction: in, kind: energy}
      - {id: c303, direction: in, kind: energy}

blocks:
  - id: RXN
    title: Dehydrogenation (feed vaporisation, steam superheater, two adiabatic beds)
    class: ReactingChemicals
    ports:
      - {id: eb, direction: in}
      - {id: ebrec, direction: in}
      - {id: steam, direction: in}
      - {id: ng, direction: in}
      - {id: air, direction: in}
      - {id: offgas, direction: in}
      - {id: effluent, direction: out}
      - {id: stack, direction: out}
  - id: REC
    title: Effluent condensation, three-phase separation and off-gas compression
    class: SeparatingByPhaseSeparation
    ports:
      - {id: effluent, direction: in}
      - {id: offgas, direction: out}
      - {id: cond, direction: out}
      - {id: crude, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
  - id: FRAC
    title: Fractionation (benzene/toluene, EB recycle, styrene finishing)
    class: Distilling
    ports:
      - {id: crude, direction: in}
      - {id: benzene, direction: out}
      - {id: toluene, direction: out}
      - {id: styrene, direction: out}
      - {id: tar, direction: out}
      - {id: ebrec, direction: out}
      - {id: power1, direction: in, kind: energy}
      - {id: power2, direction: in, kind: energy}
      - {id: steam1, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: steam3, direction: in, kind: energy}
      - {id: steam4, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: cw3, direction: out, kind: energy}
      - {id: cw4, direction: out, kind: energy}

steps:
  # ---- RXN
  - id: M100
    block: RXN
    title: EB feed drum (fresh + recycle)
    class: Mixing
    links: [{target: equipment, ref: V-100}]
    ports:
      - {id: fresh, direction: in, delegates: eb}
      - {id: rec, direction: in, delegates: ebrec}
      - {id: out, direction: out}
  # D-004: 10 % of the dilution steam is primary steam mixed with the EB feed (ASSUMED).
  - id: SPL1
    block: RXN
    title: Dilution steam split (primary / main)
    class: SplittingMaterial
    split: {primary: 0.10}
    ports:
      - {id: in, direction: in, delegates: steam}
      - {id: primary, direction: out}
      - {id: main, direction: out}
  - id: M101
    block: RXN
    title: EB / primary steam mixing
    class: Mixing
    ports:
      - {id: eb, direction: in}
      - {id: steam, direction: in}
      - {id: out, direction: out}
  - id: VL101
    block: RXN
    title: EB feed let-down to reactor pressure
    class: SteeringFlow
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: E101
    block: RXN
    title: Feed / effluent exchanger (EB vaporiser and preheater)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: cold_in, direction: in}
      - {id: cold_out, direction: out}
      - {id: hot_in, direction: in}
      - {id: hot_out, direction: out, delegates: effluent}
  - id: VL102
    block: RXN
    title: Main steam let-down to the superheater
    class: SteeringFlow
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  # D-009: the steam superheater H-101 as two flue-gas/steam coils and its burners.
  - id: H101A
    block: RXN
    title: Steam superheater coil 1 (main steam to 1073 K)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: H-101}]
    ports:
      - {id: cold_in, direction: in}
      - {id: cold_out, direction: out}
      - {id: hot_in, direction: in}
      - {id: hot_out, direction: out, delegates: stack}
  - id: E102
    block: RXN
    title: Interstage reheater (superheated steam / first-bed effluent)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: hot_in, direction: in}
      - {id: hot_out, direction: out}
      - {id: cold_in, direction: in}
      - {id: cold_out, direction: out}
  - id: H101B
    block: RXN
    title: Steam superheater coil 2 (main steam reheat)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: H-101}]
    ports:
      - {id: cold_in, direction: in}
      - {id: cold_out, direction: out}
      - {id: hot_in, direction: in}
      - {id: hot_out, direction: out}
  - id: M102
    block: RXN
    title: Reactor inlet mixing (EB feed + superheated main steam)
    class: Mixing
    ports:
      - {id: eb, direction: in}
      - {id: steam, direction: in}
      - {id: out, direction: out}
  # D-005: adiabatic conversion beds, 0.40 of the inlet EB per bed over four reactions.
  - id: R101
    block: RXN
    title: Dehydrogenation reactor, bed 1 (adiabatic)
    class: ReactingChemicals
    reactions: [DH, TOL, BZ, TAR]
    reactor: conversion
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: R102
    block: RXN
    title: Dehydrogenation reactor, bed 2 (adiabatic)
    class: ReactingChemicals
    reactions: [DH, TOL, BZ, TAR]
    reactor: conversion
    links: [{target: equipment, ref: R-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: M103
    block: RXN
    title: Burner fuel and air (off-gas, natural gas, air)
    class: Mixing
    ports:
      - {id: offgas, direction: in, delegates: offgas}
      - {id: ng, direction: in, delegates: ng}
      - {id: air, direction: in, delegates: air}
      - {id: out, direction: out}
  # D-009: complete combustion, adiabatic firebox (the heat leaves with the flue gas to the coils).
  - id: B101
    block: RXN
    title: Steam superheater firebox (burners)
    class: ReactingChemicals
    reactions: [CB_H2, CB_CH4, CB_C2H4, CB_BZ, CB_TOL, CB_EB, CB_SM]
    reactor: conversion
    links: [{target: equipment, ref: H-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  # ---- REC
  - id: E103
    block: REC
    title: Effluent condenser
    class: Cooling
    links: [{target: equipment, ref: E-103}]
    ports:
      - {id: in, direction: in, delegates: effluent}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: V101
    block: REC
    title: Three-phase separator, vapour / liquid
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: in, direction: in}
      - {id: vap, direction: out}
      - {id: liq, direction: out}
  # D-007: off-gas (vacuum) compressor, one stage in the model; aftercooler and knock-out drum.
  - id: K101
    block: REC
    title: Off-gas compressor (vacuum)
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E104
    block: REC
    title: Off-gas aftercooler
    class: Cooling
    links: [{target: equipment, ref: E-104}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  # D-008: vapour / liquid split specified from the script's immiscible-liquid flash.
  - id: V102
    block: REC
    title: Off-gas knock-out drum
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-102}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out, delegates: offgas}
      - {id: liq, direction: out}
  - id: M104
    block: REC
    title: Separator liquid and compressor condensate
    class: Mixing
    ports:
      - {id: liq, direction: in}
      - {id: cond, direction: in}
      - {id: out, direction: out}
  # D-008: the water / aromatics split is specified from aqueous solubilities, not predicted.
  - id: X101
    block: REC
    title: Decanter (process condensate / crude styrene)
    class: SeparatingByPhaseSeparation
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: in, direction: in}
      - {id: water, direction: out, delegates: cond}
      - {id: organic, direction: out, delegates: crude}
  # ---- FRAC
  - id: P201
    block: FRAC
    title: Crude styrene pump
    class: Pumping
    links: [{target: equipment, ref: P-201}]
    ports:
      - {id: in, direction: in, delegates: crude}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power1}
  - id: C301
    block: FRAC
    title: Benzene / toluene column
    class: Distilling
    links: [{target: equipment, ref: C-301}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: steam1}
      - {id: cond, direction: out, kind: energy, delegates: cw1}
  - id: C304
    block: FRAC
    title: Benzene / toluene splitter
    class: Distilling
    links: [{target: equipment, ref: C-304}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out, delegates: benzene}
      - {id: bot, direction: out, delegates: toluene}
      - {id: reb, direction: in, kind: energy, delegates: steam2}
      - {id: cond, direction: out, kind: energy, delegates: cw2}
  - id: C302
    block: FRAC
    title: EB / styrene splitter (vacuum)
    class: Distilling
    links: [{target: equipment, ref: C-302}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: steam3}
      - {id: cond, direction: out, kind: energy, delegates: cw3}
  - id: P302
    block: FRAC
    title: EB recycle pump
    class: Pumping
    links: [{target: equipment, ref: P-302}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: ebrec}
      - {id: power, direction: in, kind: energy, delegates: power2}
  - id: C303
    block: FRAC
    title: Styrene finishing column (vacuum)
    class: Distilling
    links: [{target: equipment, ref: C-303}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out, delegates: styrene}
      - {id: bot, direction: out, delegates: tar}
      - {id: reb, direction: in, kind: energy, delegates: steam4}
      - {id: cond, direction: out, kind: energy, delegates: cw4}

streams:
  - id: S1
    title: Fresh ethylbenzene
    from: EB.out
    to: M100.fresh
    template: mixture
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: "design basis, D-003"}
        temperature: {value: 303.15, provenance: assumed, source: "design basis, D-003"}
        flow: {value: 40608.32, basis: mass, provenance: assumed, source: "scripts/sm_balance.py: the fresh EB that gives 37.5 t/h styrene (D-002, D-006)"}
        composition: {basis: mole_fraction, values: {EB: 1.0}, provenance: assumed, source: "design basis, D-003"}
  - id: S2
    title: EB feed (fresh + recycle)
    from: M100.out
    to: M101.eb
    template: mixture
    state:
      design:
        temperature: {value: 317.167, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 8d79a7e7780768b9, origin: simulated}
        pressure: {value: 300.0, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 8d79a7e7780768b9, origin: simulated}
        flow: {value: 63663.8, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 8d79a7e7780768b9, origin: simulated}
        composition: {basis: mole_fraction, values: {H2: 0.0, CH4: 0.0, C2H4: 0.0, H2O: 0.0, BZ: 5.68531e-08, TOL: 0.00290005, EB: 0.98985, SM: 0.00724947, BIPH: 4.40854e-57, N2: 0.0, O2: 0.0, CO2: 0.0}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 8d79a7e7780768b9, origin: simulated}
  - id: S3
    title: Dilution steam
    from: DSTEAM.out
    to: SPL1.in
    template: mixture
    state:
      design:
        pressure: {value: 1100, provenance: assumed, source: "design basis, D-003"}
        temperature: {value: 460.2, provenance: assumed, source: "D-003: 3 K above saturation at 1100 kPa(a) (thermo 457.21 K), so that Peng-Robinson does not take the feed as liquid (D-012)"}
        flow: {value: 81965.32, basis: mass, provenance: assumed, source: "scripts/sm_balance.py: 1.3 kg per kg EB to the first bed (D-004, D-006)"}
        composition: {basis: mole_fraction, values: {H2O: 1.0}, provenance: assumed, source: "design basis, D-003"}
  - id: S4
    title: Primary steam
    from: SPL1.primary
    to: M101.steam
    template: mixture
