  - id: S8
    title: Vaporised and preheated EB feed
    from: E101.cold_out
    to: M102.eb
    template: mixture
    state:
      design:
        temperature: {value: 793.15, provenance: assumed, source: "D-004: 520 C (LVOC BREF 5.2.3.1.1, p. 255)"}
        composition: {basis: mole_fraction, values: {H2: 0.0, CH4: 0.0, C2H4: 0.0, H2O: 0.431275, BZ: 3.23338e-08, TOL: 0.00164933, EB: 0.562953, SM: 0.00412296, BIPH: 2.50725e-57, N2: 0.0, O2: 0.0, CO2: 0.0}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 8d79a7e7780768b9, origin: simulated}
