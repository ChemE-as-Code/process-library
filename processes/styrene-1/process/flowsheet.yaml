      design:
        composition: {basis: mole_fraction, values: {H2O: 1.0}, provenance: calculated, source: 'cheme process propagate: splitter SPL1 from S3', fingerprint: 24d3d8d69efae3bb}
        flow: {value: 8196.53, basis: mass, provenance: calculated, source: 'cheme process propagate: splitter SPL1 from S3', fingerprint: de4252fe2ee14650}
        pressure: {value: 1100.0, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 8d79a7e7780768b9, origin: simulated}
        temperature: {value: 460.2, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 8d79a7e7780768b9, origin: simulated}
  - id: S5
    title: Main steam
    from: SPL1.main
    to: VL102.in
    template: mixture
    state:
      design:
        composition: {basis: mole_fraction, values: {H2O: 1.0}, provenance: calculated, source: 'cheme process propagate: splitter SPL1 from S3', fingerprint: 24d3d8d69efae3bb}
        flow: {value: 73768.8, provenance: calculated, source: 'cheme process propagate: splitter SPL1 from S3 S4', fingerprint: 5be3c17c075ee022}
        pressure: {value: 1100.0, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 8d79a7e7780768b9, origin: simulated}
        temperature: {value: 460.2, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 8d79a7e7780768b9, origin: simulated}
  - id: S6
    title: EB with primary steam
    from: M101.out
    to: VL101.in
    template: mixture
    state:
      design:
        temperature: {value: 385.416, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 8d79a7e7780768b9, origin: simulated}
        pressure: {value: 300.0, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 8d79a7e7780768b9, origin: simulated}
        flow: {value: 71860.3, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 8d79a7e7780768b9, origin: simulated}
