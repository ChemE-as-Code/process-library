        pressure: {value: 150, provenance: assumed, source: "D-004: VL-102 outlet"}
        flow: {value: 73768.8, provenance: calculated, source: 'cheme process propagate: pass-through VL102 from S5', fingerprint: 5c4279543032b14e}
        composition: {basis: mole_fraction, values: {H2O: 1.0}, provenance: calculated, source: 'cheme process propagate: pass-through VL102 from S5', fingerprint: 5c4279543032b14e}
        temperature: {value: 445.34, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 8d79a7e7780768b9, origin: simulated}
  - id: S10
    title: Superheated main steam (coil 1)
    from: H101A.cold_out
    to: E102.hot_in
    template: mixture
    state:
