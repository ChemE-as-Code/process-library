# styrene-1's own exchange overrides for the Atlas LCI build (ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:ethylbenzene": {dataset: {path: processes/ethylbenzene-1/lca/dataset.yaml, product: "product:ethylbenzene"}, source: "the Atlas producer ethylbenzene-1 (its flowsheet-derived dataset since the concept PFD of issue #313); the BREF's plants are integrated in the same way"}
  "feed:steam": {use: steam-heat, source: "steam counted as heat delivered (kWh), as hda-1 does"}
  "feed:natural-gas":
    atlas: false
    source: "Pipeline natural gas: the only Atlas producer of the slug methane is hda-1's fuel gas, which is not natural gas (as utility-steam-ng-boiler)."
