cutoff:
- key: cutoff:vacuum-systems-power
  title: Column vacuum systems power
  amount: 500.0
  unit: kWh
  reason: dry vacuum pumps or ejector systems of C-301 to C-304, about 500 kW x 8000 h/a (ASSUMED order
    of magnitude, not sized; the BREF's electricity of 50-170 kWh/t SM includes them, D-010); not in the
    flowsheet's power feed
  source: D-010
- key: cutoff:small-machines-power
  title: Combustion air fan, reflux, product and condensate pumps power
  amount: 500.0
  unit: kWh
  reason: about 500 kW x 8000 h/a together (ASSUMED upper estimate, D-010); not in the flowsheet's power
    feed
  source: D-010
- key: emission-excluded:fugitive-leaks
  title: equipment-leaks emissions of the plant
  direction: output
  reason: 'fugitive VOC from flanges, seals and valves are not estimated here: an equipment-leak estimate
    needs the P&ID component counts, which do not exist at the concept stage; the LVOC BREF reports 3-16
    g/t SM (5.3.1.6, p. 273), about 0.01 g per kg styrene (I-07)'
  source: LVOC BREF 5.3.1.6
- key: emission-excluded:ssh-pm-nmvoc
  title: combustion emissions of H-101
  direction: output
  reason: 'superheater particulates (0.6-1.9 g/t SM) and NMVOC (0.5-2 g/t SM) of one BREF plant are not
    written as exchanges: neither is a single substance with a CAS number, which an elementary flow here
    needs; together about 0.0025 g per kg styrene (D-013)'
  source: LVOC BREF 5.3.1.2.1, p. 270
- key: emission-excluded:storage-tanks
  title: storage-tank emissions of the plant
  direction: output
  reason: EB, styrene, benzene, toluene and tar tanks are outside the battery limit (design basis)
  source: design basis
- key: emission-excluded:vacuum-vents
  title: non-routine emissions of the plant
  direction: output
  reason: the column vacuum systems vent non-condensables with some aromatics to the superheater or a
    shared abatement (LVOC BREF 5.3.1.2.3, pp. 270-271); not quantified at the concept stage (I-07)
  source: LVOC BREF 5.3.1.2.3
