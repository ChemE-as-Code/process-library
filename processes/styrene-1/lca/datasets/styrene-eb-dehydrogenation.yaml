# Tier 1 form, process-library#313 pilot without a flowsheet. Every amount is the formula of its parameters;
# core's validator re-checks each. Written from the LVOC BREF (facts in our own form).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: styrene-eb-dehydrogenation
title: Styrene by adiabatic catalytic dehydrogenation of ethylbenzene
description: Per 1 t of styrene monomer, gate-to-gate, EU plants of the LVOC BREF data collection. Toluene
  and benzene are co-products. Off-gas hydrogen, methane and ethylene burn in the steam superheater.
basis: 1000 kg of styrene monomer
boundary: 'gate-to-gate: reactor section with steam superheater, off-gas recovery, fractionation; ethylbenzene,
  steam and power from outside'
technology: adiabatic dehydrogenation over iron oxide catalyst under vacuum, vacuum distillation; the
  PO/SM route is not modelled
geography:
  description: EU plants of the BREF data collection; no single site.
classification:
  isic: '2011'
system_boundary:
  included:
  - ethylbenzene, make-up fuel, off-gas combustion
  - electricity and gross steam
  - co-products toluene and benzene
  - tar, effluent, catalyst, inhibitor
  - superheater emissions of one plant, fugitive VOC
  excluded:
  - 'TODO heat recovery (210 to 840 kWh/t in the source): not credited'
  - 'TODO spent solvents (1.2 to 6 kg/t), gums (up to 1.5 kg/t), coke: not yet exchanges'
  - TODO organics in the effluent; vacuum-system vents to shared abatement
  - 'hydrogen recovered for sale: the model burns it, as three of the source''s plants do'
  - storage emissions
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: included
  non_routine: excluded
location: RER
year: 2011
valid_until: 2016
time:
  start: 2007
  description: 'BREF data collection: Table 5.9 gives 2011 and a 2007-2011 average for the dehydrogenation
    plants. valid_until is the reference year + 5 (system-model section 6), so it has already lapsed.'
modelling:
  principle: attributional
  multifunctionality: mass allocation between styrene, toluene and benzene (see allocation)
allocation:
  method: mass
  coproducts:
  - styrene
  - toluene
  - benzene
  deviation: No sourced prices, so the WBCSD price ratio of styrene and toluene cannot be computed (benzene,
    0.97 % of the output, is below the 1 % line and does not enter it). Mass is the preliminary choice.
uuid: d0f9fac1-d910-5bbc-b30a-ecd2d44c22ac
version: 0.1.0
methodology_version: 1.0.0
system_model: cutoff
technology_level: current
review: unreviewed
rights: CC-BY-4.0
data_generator: ChemE-as-Code process library
