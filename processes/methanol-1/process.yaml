# Process Atlas manifest of methanol-1. Schema: schemas/process.schema.json (cheme-as-code/process/v1).
# plant.yaml stays the engineering manifest; sheets and results are derived from the
# ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: methanol-1
title: Methanol synthesis loop and purification (2500 t/d Grade AA, natural-gas syngas)
summary: >-
  Low-pressure methanol synthesis loop on Cu/ZnO/Al2O3 with a boiling-water converter, recycle
  and purge, and two-column distillation to Grade AA methanol; make-up synthesis gas from a
  natural-gas reformer outside the boundary. Concept stage, assumed basis.
description: |
  The make-up synthesis gas (an assumed combined-reforming gas, stoichiometric number 2.09) is
  compressed to the loop pressure and joins the recycle gas at the circulator. The converter
  outlet is modelled as chemical equilibrium of CO hydrogenation and water-gas shift (CO2
  hydrogenation is their sum) 10 K above the outlet temperature, with Peng-Robinson fugacity:
  a model basis, not kinetics. The crude methanol is condensed and separated at loop pressure,
  a purge removes the inerts, and the crude is flashed, stabilised in a topping column and
  refined to Grade AA in a refining column.

  All values are concept estimates. The stream values and duties downstream of the make-up gas
  come from a converged DWSIM simulation (Peng-Robinson), cross-checked against an independent
  balance script; the property method is not qualified for this mixture by ChemE-as-Code yet.
  See DESIGN.md of the engineering files (D-014) for every assumption and gated step.
families: [methanol]
keywords: [methanol, synthesis gas, syngas, Cu/ZnO, synthesis loop, boiling-water converter, purge, crude methanol, distillation, Grade AA]
facets:
  feedstock_basis: [fossil]
  product_classes: [chemicals, fuels]
  unit_operations: [compression, reaction, heat-exchange, flash, distillation]
  region: generic
# Honest claim: concept is the lowest level of the manifest; cheme maturity reports level none
# (the make-up gas composition is assumed, not sourced; the DWSIM run is not qualified),
# see validation.notes and DESIGN.md D-014.
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD with closed mass, component and element balances (cheme validate, cheme process
    streams). cheme maturity reaches no level yet: the make-up gas composition and the capacity
    are assumed (no sourced or owner-given feed). The flowsheet is simulated in DWSIM
    (cheme process simulate, Peng-Robinson; converged, run record process/simulation-run.json,
    D-014): equilibrium converter, flashes and shortcut columns; the loop agrees with the
    independent script (scripts/loop_balance.py) within 2.5 %, CO2 solubility in the crude and
    the column duties differ more. The make-up gas sized by the script for 2500 t/d gives
    2490 t/d of product in the simulation (S18 flow is the simulated one, D-014). The property
    package is not qualified for methanol-water-syngas (predictive.property-regime fails), and
    the converter's MP steam level fails the utility check against its feed temperature (D-014).
    Not reviewed.
    Preliminary gate-to-gate LCI in lca/, marked preliminary with its gap in the Atlas build
    (DESIGN.md D-015). Main products and feeds are listed under chemistry with
    their chemicals registry entries (issue #251).
chemistry:
  inputs:
    # No inventory_key: these are components of feed:SYNGAS, not the gas; a slug would link the
    # whole exchange as that component (DESIGN.md D-015).
    - {chemical: hydrogen, role: feedstock, note: "H2 of the make-up synthesis gas feed:SYNGAS (68 mol%, ASSUMED)"}
    - {chemical: carbon-monoxide, role: feedstock, note: "CO of the make-up synthesis gas feed:SYNGAS (21.5 mol%, ASSUMED)"}
    - {chemical: carbon-dioxide, role: feedstock, note: "CO2 of the make-up synthesis gas feed:SYNGAS (7.5 mol%, ASSUMED)"}
    - {chemical: methane, role: feedstock, note: "Unconverted methane of the make-up gas feed:SYNGAS (2.5 mol%, ASSUMED), an inert of the loop, leaves with the purge"}
  outputs:
    - {chemical: methanol, role: main-product, inventory_key: "product:MEOH", note: "Grade AA methanol to storage, 2500 t/d design basis (2490 t/d in the DWSIM run, D-014)"}
    - {chemical: water, role: waste, inventory_key: "product:WW", note: "Refining column bottoms water, 100 ppm(wt) methanol (ASSUMED)"}
    # No inventory_key: product:FUELGAS is a fuel co-product (DESIGN.md D-015), not a carbon dioxide
    # supply; with the slug the build would name it and offer it as one.
    - {chemical: carbon-dioxide, role: emission, note: "CO2 of the flash gas and topping-column off-gas, to the fuel gas header (product:FUELGAS)"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "Make-up compressor and circulator (ASSUMED electric drives)"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "LP steam 450 kPa(a) to the column reboilers"}
    # No inventory_key: the export (product:MPS, 2800 kPa(a) saturated, a concept-stage co-product
    # of DESIGN.md D-015) is not offered as an Atlas steam supply to other processes.
    - {chemical: steam, role: co-product, note: "MP steam 2800 kPa(a) raised in the converter (product:MPS)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "25/35 C (ASSUMED)"}
basis:
  capacity: "2500 t/d Grade AA methanol (ASSUMED)"
  operating_hours_per_year: 8400
  location: generic (not chosen)
references:
  - {title: "Ott, J. et al. (2012) Methanol. Ullmann's Encyclopedia of Industrial Chemistry", doi: 10.1002/14356007.a16_465.pub3}
lca:
  source: auto
maintainers:
  - {name: Artur Schweidtmann}
repository:
  url: https://github.com/ChemE-as-Code/process-library
  path: processes/methanol-1
  access: public
publication:
