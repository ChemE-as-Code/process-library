# Cause and effect list: interlocks and trips. Schema: `cheme schema interlocks`.
# On a sheet, refer to an interlock ("see C&E I-01") instead of spelling out what it trips.
# PROPOSED, not approved for implementation (D-021): the eight trips the first P&IDs draw (I-302 and I-102 added in the review of PR #367). The trip
# setpoints are not set here (they need the design limits and the HAZOP); delays, latching and
# reset are ASSUMED as usual practice for a first issue; sensor voting and the SIL are for the
# HAZOP / LOPA: sil stays empty until then. No trip acts on a control valve of control/loops.yaml:
# every effect is a shutdown valve (XV) or a machine stop. Machine protection of K-101 and K-102
# (vibration, axial position, lube oil, seals) is in the compressor packages (D-017, D-018). Every
# K-101 stop closes its discharge shutdown valve XV-116 (US-116), isolating the loop inventory from
# the K-101 suction side, and the make-up gas shutdown valve XV-110, isolating the suction side from
# the front end (D-022): the trips below that stop K-101 close both directly, and any other stop (a
# package machine trip, a power failure, an operator stop) closes both through the K-101 run status
# YS-117 (I-102). XV-116 opens again only with K-101 running (start-up permissive, SEQ-K101-START),
# and the sequence opens XV-110 only after it, with the suction pressure down to the front end's.
schema: cheme/interlocks/v1
interlocks:
  - id: I-101
    title: V-103 level high-high (liquid to the make-up gas compressor)
    cause: {tag: LZ-109, condition: LAHH}
    effects:
      - {tag: XV-110, action: close}
      - {tag: XV-116, action: close}
      - {tag: K-101, action: stop}
    sheet: P-01
    sil: null
    delay: {value: 2, unit: s}
    latching: true
    reset: manual
    notes: "D-017. Liquid slugs damage the K-101 impellers. Closing XV-110 isolates the front end; the loop then loses its make-up gas and runs down (K-102 keeps circulating). Delay and reset ASSUMED (D-021)."
  - id: I-102
    title: K-101 stopped (any stop other than a C&E trip - package machine trip, power failure, operator stop)
    cause: {tag: YS-117, condition: "K-101 stops (run status from running to not running)"}
    effects:
      - {tag: XV-110, action: close}
      - {tag: XV-116, action: close}
    sheet: P-01
    sil: null
    delay: {value: 0, unit: s}
    latching: true
    reset: manual
    notes: "D-022, rounds 4 to 7 of the review of PR #367. Keeps the basis of PSV-115 true for every way K-101 can stop, not only the C&E trips: XV-116 closed, so the loop leaks back only past CV-103 and XV-116 in series (no open path), and XV-110 closed, so the front end neither keeps feeding the dead-ended suction side nor takes settle-out gas back through SG-101 (no check valve there). YS-117 is the K-101 run status: its own speed pick-up on K-101 (instrument nozzle N4, separate from SIC-113's N3; below the minimum running speed reads as not running) together with the drive package's run contact, either reading stopped (ASSUMED; contact type and minimum speed with the drive and compressor vendors). Fail-safe ASSUMED: both are energised while K-101 runs, so a lost signal or a power failure reads as stopped; US-116 holds XV-110 and XV-116 de-energised to close (F.C.); the trip logic is on the uninterruptible supply (F-POWER). The cause is the stop itself, so the trip can be reset with K-101 standing; after the reset XV-116 stays closed until YS-117 reads running (start-up permissive in US-116), and the start-up sequence SEQ-K101-START opens XV-110 only after XV-116, with K-101 running and the suction pressure PIC-102 at or below the front end's, so the gas flows forward. Because the cause is a change from running to not running, I-102 covers XV-110 and XV-116 only once YS-117 has read running: a stop before that (a failed start, a power failure during the start) does not trip it, which is why the sequence keeps both valves closed until then. The suction-side pressuring procedure, with XV-110 open and K-101 standing (the first pressuring after maintenance, and before a restart whenever a stop has left the suction side below the front-end pressure, which the sequence's PIC-102 permissive refuses), is outside the sequence and outside this trip (PSV-115 case 3, I-15). On P-01 YS-117 is drawn on K-101 (N4) and US-116 acting on XV-116; YS-117 into US-116 and US-116 onto XV-110 are not drawn, because either line would cross process lines (the sheet note says so). No delay, latching and manual reset ASSUMED; stroke times with the valve vendor."
  - id: I-201
    title: Converter outlet temperature high-high (runaway or loss of steam-side cooling)
    cause: {tag: TZ-210, condition: TAHH}
    effects:
      - {tag: XV-110, action: close}
      - {tag: XV-116, action: close}
      - {tag: K-101, action: stop}
    sheet: P-02
    sil: null
    delay: {value: 3, unit: s}
    latching: true
    reset: manual
    notes: "D-018. Cutting the make-up gas removes the reactants; K-102 keeps circulating the loop gas, which carries the heat to E-102 and E-103 while the converter cools. Whether the loop should also be depressured (XV-304) is a question for the HAZOP (D-021)."
  - id: I-202
    title: V-104 steam drum level low-low (loss of converter cooling)
    cause: {tag: LZ-211, condition: LALL}
    effects:
      - {tag: XV-110, action: close}
      - {tag: XV-116, action: close}
      - {tag: K-101, action: stop}
    sheet: P-02
    sil: null
    delay: {value: 5, unit: s}
    latching: true
    reset: manual
    notes: "D-018. Without water on the shell the converter is no longer cooled and the drum and shell overheat; the reaction is stopped as in I-201. The BFW supply (pumps outside the boundary) is not tripped. Delay ASSUMED (D-021)."
  - id: I-301
    title: V-101 level low-low (gas blow-by into the LP flash drum)
    cause: {tag: LZ-306, condition: LALL}
    effects:
      - {tag: XV-306, action: close}
    sheet: P-03
    sil: null
    delay: {value: 2, unit: s}
    latching: true
    reset: manual
    notes: "D-019. Loop gas at 7500 kPa(a) through an open LV-307 into V-102 (10 barg design) is the governing relief case of V-102 (PSV-311); XV-306 is the trip layer before it. Separate tap and valve from LIC-307 / LV-307."
  - id: I-302
    title: V-101 level high-high (liquid carry-over into the recycle circulator)
    cause: {tag: LZ-313, condition: LAHH}
    effects:
      - {tag: K-102, action: stop}
      - {tag: K-101, action: stop}
      - {tag: XV-110, action: close}
      - {tag: XV-116, action: close}
    sheet: P-03
    sil: null
    delay: {value: 2, unit: s}
    latching: true
    reset: manual
    notes: "D-019, review of PR #367. Crude methanol carried with the recycle gas into K-102 damages the circulator. With K-102 stopped the loop has no flow, so the make-up gas is stopped too (K-101, XV-110) and the K-101 discharge is isolated from the loop (XV-116); K-101 against a blocked loop is PSV-111's case (82 barg), not PSV-302's. Own tap, separate from LIC-307 (which drives the fail-closed LV-307). Delay ASSUMED (D-021)."
  - id: I-401
    title: V-201 level low-low (topping column reflux pumps run dry)
    cause: {tag: LZ-411, condition: LALL}
    effects:
      - {tag: P-201A, action: stop}
      - {tag: P-201B, action: stop}
    sheet: P-04
    sil: null
    delay: {value: 5, unit: s}
    latching: true
    reset: manual
    notes: "D-020. Pump protection (machinery), not a process safety function as drafted; the HAZOP decides."
  - id: I-501
    title: V-202 level low-low (refining column reflux and product pumps run dry)
    cause: {tag: LZ-511, condition: LALL}
    effects:
      - {tag: P-203A, action: stop}
      - {tag: P-203B, action: stop}
    sheet: P-05
    sil: null
    delay: {value: 5, unit: s}
    latching: true
    reset: manual
    notes: "D-020. As I-401."
