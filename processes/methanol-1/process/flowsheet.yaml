# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Methanol synthesis loop and purification (D-001). Where the values come from:
# - S1 (make-up gas) and the temperatures and pressures are design choices (design basis, D-003,
#   D-004, D-008), ASSUMED;
# - S2 and S3 flows and compositions: `cheme process propagate --fill` (pass-through);
# - every other flow, composition, the outlet temperatures that are not design choices, and all
#   duties: `cheme process simulate --fill` (DWSIM 9.0.5, Peng-Robinson, process/simulation.yaml,
#   D-013, D-014), calculated. The property package is not qualified for this mixture (D-014);
#   the independent balance scripts/loop_balance.py (D-006) is the cross-check, compared in D-014.
# - kept against the simulation (sim-deviation, D-014): S16 313.15 K (D-008 condenser
#   temperature; the shortcut's 69 K is not a usable condenser temperature) and S18 temperature
#   and pressure (design basis; no product cooler or pump step). S18 flow and composition are
#   the simulated ones: 103734 kg/h = 2490 t/d from the make-up gas sized for 2500 t/d (D-014).
schema: cheme/process/v1
kind: flowsheet
title: Methanol synthesis loop and purification (2500 t/d Grade AA)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: make-up gas of D-004 sized for 2500 t/d Grade AA methanol (2490 t/d simulated, D-014), recycle ratio 4 (D-007)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: SYNGAS, title: Make-up synthesis gas from reforming, category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports: [{id: k101, direction: out, kind: energy}, {id: k102, direction: out, kind: energy}]
  - id: LPS
    title: LP steam 450 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis, D-009"}
      supply_temperature: {value: 420.8, provenance: assumed, source: "saturation at 450 kPa(a), D-009"}
      min_approach: {value: 10, provenance: assumed, source: D-009}
    ports: [{id: c201, direction: out, kind: energy}, {id: c202, direction: out, kind: energy}]
products:
  - {id: MEOH, title: Methanol Grade AA to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: PURGE, title: Loop purge to reformer fuel, category: off_gas, ports: [{id: in, direction: in}]}
  - id: FUELGAS
    title: LP flash gas and topping-column off-gas to fuel gas
    category: off_gas
    ports: [{id: flash, direction: in}, {id: vent, direction: in}]
  - {id: WW, title: Refining column bottoms water, category: wastewater, ports: [{id: in, direction: in}]}
  - id: MPS
    title: MP steam raised in the converter (2800 kPa(a))
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 2800, provenance: assumed, source: "design basis, D-003"}
      supply_temperature: {value: 503.4, provenance: assumed, source: "saturation at 2800 kPa(a), D-003"}
      min_approach: {value: 10, provenance: assumed, source: D-009}
    ports: [{id: r101, direction: in, kind: energy}]
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-009"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-009"}
      min_approach: {value: 5, provenance: assumed, source: D-009}
    ports:
      - {id: e101, direction: in, kind: energy}
      - {id: e103, direction: in, kind: energy}
      - {id: c201, direction: in, kind: energy}
      - {id: c202, direction: in, kind: energy}

blocks:
  - id: CMP
    title: Make-up gas compression
    class: Compressing
    ports:
      - {id: mu, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: SYN
    title: Methanol synthesis loop
    class: ReactingChemicals
    ports:
      - {id: mu, direction: in}
      - {id: purge, direction: out}
      - {id: crude, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: steam, direction: out, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: PUR
    title: Crude methanol purification
    class: Distilling
    ports:
      - {id: crude, direction: in}
      - {id: flashgas, direction: out}
      - {id: vent, direction: out}
      - {id: product, direction: out}
      - {id: water, direction: out}
      - {id: steam1, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}

steps:
  - id: K101
    block: CMP
    title: Make-up gas compressor
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-101}, {target: equipment, ref: V-103}]
    ports:
      - {id: in, direction: in, delegates: mu}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E101
    block: CMP
    title: Make-up gas aftercooler
    class: Cooling
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: M101
    block: SYN
    title: Make-up / recycle junction
    class: Mixing
    ports:
      - {id: mu, direction: in, delegates: mu}
      - {id: rec, direction: in}
      - {id: out, direction: out}
  - id: K102
    block: SYN
    title: Recycle circulator
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E102
    block: SYN
    title: Converter feed/effluent exchanger
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: cold_in, direction: in}
      - {id: cold_out, direction: out}
      - {id: hot_in, direction: in}
      - {id: hot_out, direction: out}
  # D-003, D-005: boiling-water converter; outlet at equilibrium 10 K above its temperature
  # (approach ASSUMED), Peng-Robinson fugacity. MEOH_CO2 is the sum of the two named reactions.
  - id: R101
    block: SYN
    title: Methanol converter (boiling-water, steam raising)
    class: ReactingChemicals
    reactions: [MEOH_CO, WGS]
    reactor: equilibrium
    fugacity: peng_robinson
    approach: 10
    catalyst: CU_ZNO
    links: [{target: equipment, ref: R-101}, {target: equipment, ref: V-104}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: steam, direction: out, kind: energy, delegates: steam}
  - id: E103
    block: SYN
    title: Loop cooler / condenser
    class: Cooling
    links: [{target: equipment, ref: E-103}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: V101
    block: SYN
    title: HP separator
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: in, direction: in}
      - {id: vap, direction: out}
      - {id: liq, direction: out, delegates: crude}
  # D-007: the purge fraction that gives a recycle ratio of 4 (scripts/loop_balance.py).
  - id: SPL
    block: SYN
    title: Purge take-off
    class: SplittingMaterial
    split: {purge: 0.021796921}
    ports:
      - {id: in, direction: in}
      - {id: purge, direction: out, delegates: purge}
      - {id: recycle, direction: out}
  - id: V102
    block: PUR
    title: LP flash drum (let-down)
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-102}]
    ports:
      - {id: in, direction: in, delegates: crude}
      - {id: gas, direction: out, delegates: flashgas}
      - {id: liq, direction: out}
  - id: C201
    block: PUR
    title: Topping column (light ends)
    class: Distilling
    links: [{target: equipment, ref: C-201}, {target: equipment, ref: E-201}, {target: equipment, ref: E-202},
            {target: equipment, ref: V-201}, {target: equipment, ref: P-201A}, {target: equipment, ref: P-201B},
            {target: equipment, ref: P-202A}, {target: equipment, ref: P-202B}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out, delegates: vent}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: steam1}
      - {id: cond, direction: out, kind: energy, delegates: cw1}
  - id: C202
    block: PUR
    title: Refining column
    class: Distilling
    links: [{target: equipment, ref: C-202}, {target: equipment, ref: E-203}, {target: equipment, ref: E-204},
            {target: equipment, ref: V-202}, {target: equipment, ref: P-203A}, {target: equipment, ref: P-203B},
            {target: equipment, ref: P-204A}, {target: equipment, ref: P-204B}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out, delegates: product}
      - {id: bot, direction: out, delegates: water}
      - {id: reb, direction: in, kind: energy, delegates: steam2}
      - {id: cond, direction: out, kind: energy, delegates: cw2}

