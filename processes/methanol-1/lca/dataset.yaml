allocation:
  method: exergy
  coproducts:
  - MEOH
  - MPS
  - FUELGAS
  properties:
    MEOH:
      exergy: 22396.1
      source: 'scripts/allocation_exergy.py: S18, liquid methanol with 0.05 wt% water, chemical exergy
        at the dead state 298.15 K, 101.325 kPa; methanol(l) 718.0 kJ/mol derived from the formation data
        of process/materials.yaml and the element exergies of Szargut, Morris and Steward (1988); physical
        exergy at 313 K / 300 kPa neglected'
    MPS:
      exergy: 1394.0
      source: 'scripts/allocation_exergy.py: exergy added per kWh of heat raised in R-101 (kJ per kWh,
        the exchange''s unit), saturated vapour at 2800 kPa(a) from boiler feed water at 378.15 K (ASSUMED),
        IAPWS-95 (CoolProp). Used for the allocation instead of the Carnot value (1467.8 kJ/kWh, isothermal
        heat at the saturation temperature) that the generated dataset records on the product:MPS exchange:
        this one counts the feed water heating in the duty'
    FUELGAS:
      exergy: 13481.9
      source: 'scripts/allocation_exergy.py: S14 and S16 by flow, as ideal-gas mixtures at 600 and 150
        kPa(a): chemical exergy (Szargut et al. 1988, model II, core''s table), mixing term and pressure
        exergy'
  compare:
  - none
  source: 'D-015: the MP steam raised in the converter and the fuel gas are exported steam and fuel, so
    co-products of the methanol, never credited in the cut-off build (docs/system-model.md section 2).
    The burdens are shared by exergy: methanol 94.8 %, MP steam 3.7 %, fuel gas 1.5 %. The purge is not
    a co-product: it returns to the plant''s own reformer fuel and leaves for no third party (owner''s
    decision, I-09). Alternatives: unallocated (none, computed in the comparison) and exergy with the
    purge as a co-product (methanol 81.8 %, purge 13.7 %, MP steam 3.2 %, fuel gas 1.3 %; printed by scripts/allocation_exergy.py,
    because core''s comparison can only compute the listed co-products).'
  deviation: 'Neither curated physical rule fits: the products do not come from one separation, and LHV
    cannot apply because the steam has no heating value. The WBCSD price ratio does not apply either:
    the steam is counted in kWh, and no sourced prices exist at concept. Exergy is chosen because the
    library allocates exported steam and fuels by energy or exergy, and exergy is the one basis common
    to the three products (DESIGN.md D-015).'
