    raised in the converter and the fuel gas are exported steam and fuel, so co-products of the methanol,
    never credited in the cut-off build (docs/system-model.md section 2). The burdens are shared by exergy:
    methanol 94.9 %, MP steam 3.7 %, fuel gas 1.3 %. The purge is not a co-product: it returns to the
    plant''s own reformer fuel and leaves for no third party (owner''s decision, I-09). Alternatives:
    unallocated (none, computed in the comparison) and exergy with the purge as a co-product (methanol
    81.5 %, purge 14.2 %, MP steam 3.2 %, fuel gas 1.1 %; printed by scripts/allocation_exergy.py, because
    core''s comparison can only compute the listed co-products).'
