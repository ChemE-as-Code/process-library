# Line list. Schema: `cheme schema lines`.
# One line per material stream of the PFD (stream id in the notes), and the lines the P&IDs add
# (D-016): numbers n30 and up are new lines on sheet P-0n.
# DN: first-pass size from velocity (D-011, ASSUMED): gas 15 m/s above 1000 kPa(a), 20 m/s
# below, two-phase 10 m/s, liquid 1.5 m/s, on the Peng-Robinson bulk density of
# scripts/loop_balance.py (PR underestimates liquid density by ~15 %: the liquid lines are
# conservative); inside diameter taken as the DN. The lines the P&IDs add are sized the same way
# on the flows and duties of process/flowsheet.yaml; circulation, relief, drain and utility
# lines are ASSUMED (D-016). Pressure classes come with the pipe specs. The column systems of P-04
# and P-05 (overhead, condensate, reflux, reboiler circulation and LP steam / condensate lines of
# the reboilers) are designed for full vacuum like the equipment they connect (D-022).
lines:
