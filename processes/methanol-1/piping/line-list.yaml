# Line list. Schema: `cheme schema lines`.
# Concept stage: one line per material stream of the PFD (stream id in the notes), no P&ID yet.
# DN: first-pass size from velocity (D-011, ASSUMED): gas 15 m/s above 1000 kPa(a), 20 m/s
# below, two-phase 10 m/s, liquid 1.5 m/s, on the Peng-Robinson bulk density of
# scripts/loop_balance.py (PR underestimates liquid density by ~15 %: the liquid lines are
# conservative); inside diameter taken as the DN. Pressure classes come with the pipe specs.
lines:
  - {number: SG-101, from: B/L, to: K-101, nominal_diameter: DN600, fluid: Synthesis gas, notes: "S1 make-up gas, 2600 kPa(a)"}
