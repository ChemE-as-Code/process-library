  - {number: SG-101, from: B/L, to: V-103, nominal_diameter: DN600, fluid: Synthesis gas, sheet: P-01, notes: "S1 make-up gas, 2600 kPa(a); shutdown valve XV-110 (C&E I-101, I-201, I-202), into the suction knock-out drum V-103 (D-017)"}
  - {number: SG-130, from: V-103, to: K-101, nominal_diameter: DN600, fluid: Synthesis gas, sheet: P-01, notes: "S1 from V-103 to the K-101 suction; the anti-surge recycle SG-131 joins it (D-017)"}
