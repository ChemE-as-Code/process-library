# Special piping items: relief devices. Schema: `cheme schema piping_items`.
# Drawn on the P&IDs (D-016, D-019). Set pressure = design pressure of the protected item
# (equipment list, D-012), ASSUMED until the MAWP is known; relief_case = the case that makes the
# device necessary, named here; the governing case, its load and the orifice come with the relief
# study (basic engineering). The HP equipment (P-01 to P-03) discharges to the HP flare header, the
# columns (P-04, P-05) to the LP flare header, both outside the boundary (D-022), unless it says
# otherwise.
schema: cheme/piping_items/v1
piping_items:
  # ---- P-01
  - {tag: PSV-115, type: SpringLoadedGlobeSafetyValve, line: FL-136, sheet: P-01, set_pressure_barg: 28,
     relief_case: "K-101 suction side (V-103, SG-130, K-101 suction, 28 barg design), four cases: (1) settle-out of the K-101 discharge volume (SG-102, E-101, SG-103 up to XV-116) through the fail-open UV-104 on any K-101 stop, with XV-110 and XV-116 closed (every stop closes both: the C&E trips I-101, I-201, I-202, I-302, and a package machine trip, a power failure or an operator stop through the run status YS-117, C&E I-102); (2) leak-back from the loop (whole loop inventory at about 74.5 barg) past CV-103 and the closed XV-116: only the seat leakage of the two valves in series; (3) the front end against the stopped K-101: with XV-110 closed, the seat leakage of XV-110 at the front end's maximum pressure; with XV-110 open while K-101 stands (the suction-side pressuring procedure, outside SEQ-K101-START, which opens XV-110 only with K-101 running: the first pressuring after maintenance, and before a restart whenever a stop has left the suction side below the front-end pressure - XV-110 seat leakage over a longer stop, seal leakage, a PSV-115 lift only if its blowdown exceeds about 10.7 % of the set (not recorded, ASSUMED open, I-15); or XV-110 failing to close), the front end's flow at its maximum pressure into the dead-ended suction side; a case only if the front end's maximum pressure at the battery limit exceeds 28 barg (I-15); (4) fire on V-103",
     notes: "Set ASSUMED = V-103 design pressure 28 barg (D-012). Choice (D-022 item 1): XV-116 isolates the loop inventory and XV-110 the front end on every K-101 stop (usual practice; I-102 added in round 4, XV-110 added to it in round 5), so PSV-115 is sized for case (1) and the seat leakages of cases (2) and (3), not for the loop's leak-back through an open path nor for the front end's flow. During the valves' stroke CV-103 alone holds the loop back (a few seconds ASSUMED; stroke times with the valve vendor). The open-XV-110 part of case (3) is bounded by the front end's own pressure protection, outside the boundary: if its maximum pressure at the battery limit (relief set or shut-in pressure) exceeds 28 barg, the suction side is designed for it or PSV-115 carries the front end's flow; decided with the front-end interface (I-15). If the settle-out pressure of case (1) exceeds 28 barg, designing the suction side for it (PSV-115 kept for fire) is the alternative; decided with the compressor vendor's settle-out calculation (I-10). HP flare header."}
  - {tag: PSV-111, type: SpringLoadedGlobeSafetyValve, line: FL-132, sheet: P-01, set_pressure_barg: 82,
     relief_case: "K-101 discharge blocked (CV-103 and the loop downstream closed, or K-102 tripped with K-101 running, or XV-116 closed with K-101 running - instrument air failure, a spurious closure, or every start-up, which runs against the closed XV-116 until YS-117 reads running and the discharge pressure is above the loop pressure (SEQ-K101-START) - and the anti-surge recycle UV-104 not open; the start-up permissive asks for UV-104 fully open); settle-out of the loop into the discharge; fire on E-101",
     notes: "Set ASSUMED = K-101 / E-101 design pressure 82 barg (D-012). Upstream of the check valve CV-103, so the loop PSV-302 (89 barg) does not cover the K-101 discharge (D-017). Load open."}
  - {tag: PSV-112, type: SpringLoadedGlobeSafetyValve, line: FL-134, sheet: P-01, set_pressure_barg: 6,
     relief_case: "E-101 cooling water side: tube rupture (make-up gas at up to 82 barg into the CW side, whose 6 barg design is below 10/13 of the gas side); blocked-in CW side with hot gas flowing (thermal expansion)",
     notes: "Set ASSUMED = 6 barg CW-side design pressure (no CW pressure in the design basis; site CW systems usually run at 3-5 barg, ASSUMED). Discharges into FL-132 and the flare header: a tube-rupture relief carries hydrogen and CO (D-017). Whether a bursting disc is needed for the rupture case is for the relief study."}
  # ---- P-02
  - {tag: PSV-208, type: SpringLoadedGlobeSafetyValve, line: MS-236, sheet: P-02, set_pressure_barg: 30,
     relief_case: "V-104 and the R-101 shell: PV-207 or the MP steam header blocked with the converter raising steam; fire",
     notes: "Set ASSUMED = R-101 shell / V-104 design pressure 30 barg (D-003, D-012). Steam to atmosphere at a safe location (D-018). A tube leak in R-101 (synthesis gas at 80 bar into the shell) is a case for the relief study: it would put syngas into the steam system (D-018)."}
  # ---- P-03
  - {tag: PSV-302, type: SpringLoadedGlobeSafetyValve, line: FL-333, sheet: P-03, set_pressure_barg: 89,
     relief_case: "V-101 and the HP loop (K-102 discharge downstream of CV-105, E-102 both sides, R-101 tubes, E-103 process side, V-101): fire; thermal and control-failure cases of the loop (the loop has no isolation valve between K-102 and V-101). K-101 delivering into a blocked loop is not this valve's case: PSV-111 on the K-101 discharge (82 barg) lifts first",
     notes: "Set ASSUMED = loop design pressure 89 barg (D-012). One PSV for the loop as the loop has no block valves (D-019); a block valve added later needs its own case. Load open."}
  - {tag: PSV-311, type: SpringLoadedGlobeSafetyValve, line: FL-335, sheet: P-03, set_pressure_barg: 10,
     relief_case: "V-102: gas blow-by from V-101 (LV-307 failed open with V-101 empty; XV-306 / LZ-306 is the trip layer); fire; FG-114 blocked",
     notes: "Set ASSUMED = V-102 design pressure 10 barg (D-012). The blow-by load through a fully open LV-307 is likely to govern and may lead to a higher V-102 design pressure instead (D-008, D-019). Load open."}
  - {tag: PSV-312, type: SpringLoadedGlobeSafetyValve, line: FL-334, sheet: P-03, set_pressure_barg: 6,
     relief_case: "E-103 cooling water side: tube rupture (loop gas at up to 89 barg into the CW side); blocked-in CW side (thermal expansion)",
     notes: "As PSV-112 (D-019). Set ASSUMED = 6 barg CW-side design pressure."}
  # ---- P-04
  - {tag: PSV-413, type: SpringLoadedGlobeSafetyValve, line: FL-443, sheet: P-04, set_pressure_barg: 5,
     relief_case: "C-201 and V-201: fire; cooling water failure with the reboiler running; PV-404 blocked; gas blow-by from V-101 through V-102 if both let-downs fail open",
     notes: "Set ASSUMED = C-201 design pressure 5 barg (D-012). Protects V-201 too (no isolation valve between them, D-020). LP flare header (D-022). The blow-by case puts HP loop gas into the LP flare header: the back pressure it builds against the low-pressure vents on that header (PV-504 at about 0.1 barg, protected by the check valve CV-532) is for the flare study (I-13). Vacuum (loss of reboiler heat with the condenser running) is met by a full-vacuum design of C-201, E-201, E-202 (both sides), V-201 and their piping, not by a device (D-022). Load open."}
  # ---- P-05
  - {tag: PSV-513, type: SpringLoadedGlobeSafetyValve, line: FL-543, sheet: P-05, set_pressure_barg: 5,
     relief_case: "C-202 and V-202: fire; cooling water failure with the reboiler running (the E-203 duty is the largest of the plant); PV-504 blocked",
     notes: "Set ASSUMED = C-202 design pressure 5 barg (D-012). Protects V-202 too (D-020). LP flare header (D-022). Vacuum is met by a full-vacuum design of C-202, E-203, E-204 (both sides), V-202 and their piping (D-022). The cooling water failure load is large (about 84 MW of vapour): the relief study may prefer a high-integrity steam cut-off; this register claims none. Load open."}
