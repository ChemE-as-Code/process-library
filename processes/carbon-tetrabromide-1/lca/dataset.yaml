year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Batch plant: bromine dosed over 1.7 h into dilute caustic soda at 278 K (sodium hypobromite,
  semi-batch), acetone dosed over 4.5 h into the cold hypobromite with tetrabutylammonium bromide (haloform
  reaction, semi-batch), CBr4 precipitated, filtered, reslurry-washed with water and vacuum-dried at 308
  K in two agitated filter-dryers; 450.91 kg per batch, 696 batches a year on a dedicated train'
