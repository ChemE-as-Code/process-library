# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Carbon tetrabromide by the aqueous haloform route of CN 101 885 665 A (DESIGN.md D-001), a
# batch plant: caustic soda is diluted with water, the phase-transfer catalyst added and the
# charge cooled to 5 C; bromine is dosed into it (a semi-batch, M101) to sodium hypobromite and
# bromide; the cold hypobromite goes to R-101, where acetone is dosed into it (a semi-batch,
# R101); CBr4 precipitates (CR101), is filtered, reslurry-washed with water, filtered again and
# dried at 35 C under vacuum in an agitated filter-dryer; the mother liquor (NaBr, sodium
# acetate, NaOH) and the wash filtrate go to wastewater treatment.
# The flows are the year averages of the batch recipe (process/recipe.yaml, `cheme process
# recipe`, D-003).
# Where the values come from:
# - feeds, temperatures, pressures, ratios: design basis and D-002..D-009, from the patent's
#   examples where it gives them, otherwise ASSUMED;
# - M101 and R101: cheme's semi-batch model (the rate laws of HYPO, DISP and HALO, D-005);
#   CR101 and W101: core's crystallizer with the liquor's other solutes as spectators and the
#   solubility of CBr4 (core ADR 0056, D-007); F101, F102: specified filters with a Ruth
#   filtration time; D101: core's dryer to a residual moisture (core ADR 0057, D-008); M100,
#   M103: mixers (all calculated by `cheme process propagate --fill`);
# - the dryer's heat Q4: core's dryer model (`cheme process crystallizers`), compared with Q4;
# - Q2 and Q3: the heat released in M101's and R101's isothermal models (`cheme process
#   reactors`) plus the doses' cooling, worked out in the stream's source (D-009);
# - Q1 (the caustic's dilution and the charge's cooling) and the agitator powers: ASSUMED hand
#   estimates (D-009); core has no enthalpy model of this liquor, so no balance script is used:
#   the arithmetic is in the source.
schema: cheme/process/v1
kind: flowsheet
title: Carbon tetrabromide by semi-batch haloform bromination of acetone in aqueous hypobromite (325 t/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: dried CBr4 crystals, year averages of the batches in 7920 h on a dedicated train (D-002, D-003)", default: true}
tolerance: {abs: 0.05, rel: 0.002}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: PW, title: Process water (dilution), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NAOH, title: Caustic soda 50 wt% (chlor-alkali-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: TBAB, title: "Tetrabutylammonium bromide (phase-transfer catalyst, merchant)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: BR2, title: Liquid bromine (bromine-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: ACET, title: Acetone (acetone-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: WASHW, title: Process water (cake wash), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: m101, direction: out, kind: energy}
      - {id: r101, direction: out, kind: energy}
      - {id: d101, direction: out, kind: energy}
  - id: LPS
    title: LP steam 350 kPa(a) (to the dryer's hot-water circuit)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 350, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 412.0, provenance: given, source: "saturation at 350 kPa(a), IAPWS-IF97"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: d101, direction: out, kind: energy}
products:
  - {id: CBR4P, title: Carbon tetrabromide crystals to packing, category: product, ports: [{id: in, direction: in}]}
  - {id: WW, title: "Mother liquor, wash filtrate and dryer condensate to wastewater treatment", category: wastewater, ports: [{id: in, direction: in}]}
  - id: BRINE
    title: Chilled brine return (263 K)
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 258.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 263.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: m100, direction: in, kind: energy}
      - {id: m101, direction: in, kind: energy}
      - {id: r101, direction: in, kind: energy}

blocks:
  - id: HYPO
    title: Hypobromite preparation
    class: ReactingChemicals
    ports:
      - {id: pw, direction: in}
      - {id: naoh, direction: in}
      - {id: tbab, direction: in}
      - {id: br2, direction: in}
      - {id: out, direction: out}
      - {id: q1, direction: out, kind: energy}
      - {id: q2, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: REACT
    title: Haloform reaction and precipitation
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: acet, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: ISOL
    title: Filtration, washing and drying
    class: SeparatingMechanically
    ports:
      - {id: in, direction: in}
      - {id: wash, direction: in}
      - {id: product, direction: out}
      - {id: ww, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}

steps:
  - id: M100
    block: HYPO
    title: Caustic diluted, catalyst added, cooled to 278 K (M-101)
    class: Mixing
    links: [{target: equipment, ref: M-101}]
    ports:
      - {id: pw, direction: in, delegates: pw}
      - {id: naoh, direction: in, delegates: naoh}
      - {id: tbab, direction: in, delegates: tbab}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: q1}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M101
    block: HYPO
    title: Hypobromite reactor (bromine dosed into the cold caustic, M-101)
    class: ReactingChemicals
    reactions: [HYPO, DISP]
    reactor: semibatch
    batch:
      dosing: [{stream: S5, time: 5400}]
      target: {key: BR2, conversion: 0.9999}
      heat: isothermal
      provenance: assumed
      source: "bromine dosed over 1.5 h into the caustic at 278 K, then the post-reaction to 0.9999 conversion of the bromine (D-005; the patent keeps 0-5 C and stirs 20 min after the addition)"
    hazard:
      mtt: 331.9
      provenance: given
      source: "the normal boiling point of bromine (CRC Handbook), the lowest of the liquor's components: M-101 runs at atmospheric pressure with a vent to the caustic scrubber (D-011); the hypobromite's own decomposition has no TD24 (never estimated)"
    links: [{target: equipment, ref: M-101}]
    ports:
      - {id: in, direction: in}
      - {id: br2, direction: in, delegates: br2}
      - {id: out, direction: out, delegates: out}
      - {id: q, direction: out, kind: energy, delegates: q2}
  - id: R101
    block: REACT
    title: Haloform reactor (acetone dosed into the cold hypobromite, R-101)
    class: ReactingChemicals
    reactions: [HALO, DISP]
    reactor: semibatch
    batch:
      dosing: [{stream: S7, time: 14400}]
      target: {key: NAOBR, conversion: 0.999}
      heat: isothermal
      provenance: assumed
      source: "acetone dosed over 4 h into the hypobromite at 278 K, then the post-reaction to 0.999 conversion of the hypobromite (D-005; the patent keeps 0-5 C and stirs 3-5 h after the addition)"
    hazard:
      mtt: 329.3
      provenance: given
      source: "the normal boiling point of acetone (NIST WebBook), the dose and the lowest-boiling component of the liquor: R-101 runs at atmospheric pressure under nitrogen with a vent condenser (D-011); conservative, since a few wt% of acetone in the brine boil far higher"
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: acet, direction: in, delegates: acet}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: CR101
    block: REACT
    title: Precipitation hold (CBr4 crystallises from the cold liquor)
    class: Crystallizing
    crystallizer:
      solute: CBR4
      solvent: H2O
      crystal: CBR4_S
      basis: solubility
      temperature: 278.15
      solubility:
        unit: kg/kg_solvent
        value: 0.00024
        provenance: assumed
        source: "0.024 g per 100 mL water at 30 C (Wikipedia, Carbon tetrabromide, infobox, read 2026-11-05), taken per kg of water and at 278 K as well: no value at 0-10 C found (D-007). Entered as `value` because core refuses a single 303.15 K point at 278.15 K (ADR 0025, no extrapolation): a known workaround, the figure is not at the operating conditions (lesson L-4)"
        salting_out:
          coefficients: {NAOH: 0.0, BR2: 0.0, NAOBR: 0.0, NABR: 0.0, NABRO3: 0.0, ACET: 0.0, TBAB: 0.0, NAOAC: 0.0}
          provenance: assumed
          source: "no open salting-out data of CBr4 in a NaBr/NaOH/acetate liquor; no correction taken (a nonelectrolyte is salted out, so the pure-water value overstates the loss; D-007)"
      spectators: [NAOH, BR2, NAOBR, NABR, NABRO3, ACET, TBAB, NAOAC]
      outlets: {slurry: out}
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
  - id: F101
    block: ISOL
    title: Filtration (filter-dryer)
    class: Filtering
    solid_separation:
      solid_recovery: 0.998
      cake_liquid: {value: 0.15, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "agitated filter-dryer, cake 0.15 kg of liquor per kg of dense CBr4 crystals (3.42 g/cm3) (D-007)"
      filtration:
        specific_cake_resistance: 1.0e+10
        medium_resistance: 1.0e+10
        pressure_difference: 200
        viscosity: 1.8
        filtrate_density: 1250
        provenance: assumed
        source: "ASSUMED (D-007): a free-filtering crystalline cake, a cloth medium, 200 kPa of nitrogen on the cake; the liquor at 278 K (about 28 wt% NaBr, NaOH and sodium acetate) estimated from water's; to be replaced by a filtration trial"
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out}
  - id: W101
    block: ISOL
    title: Reslurry wash with process water (CBr4 dissolves to saturation)
    class: Crystallizing
    crystallizer:
      solute: CBR4
      solvent: H2O
      crystal: CBR4_S
      basis: solubility
      temperature: 291.15
      solubility:
        unit: kg/kg_solvent
        value: 0.00024
        provenance: assumed
        source: "as CR101 (Wikipedia, 30 C, taken at 291 K; D-007). Entered as `value` because core refuses the single 303.15 K point at 291.15 K (ADR 0025, no extrapolation): a known workaround (lesson L-4)"
        salting_out:
          coefficients: {NAOH: 0.0, BR2: 0.0, NAOBR: 0.0, NABR: 0.0, NABRO3: 0.0, ACET: 0.0, TBAB: 0.0, NAOAC: 0.0}
          provenance: assumed
          source: "as CR101: no correction (D-007)"
      spectators: [NAOH, BR2, NAOBR, NABR, NABRO3, ACET, TBAB, NAOAC]
      outlets: {slurry: out}
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: cake, direction: in}
      - {id: wash, direction: in, delegates: wash}
      - {id: out, direction: out}
  - id: F102
    block: ISOL
    title: Filtration of the washed cake
    class: Filtering
    solid_separation:
      solid_recovery: 0.998
      cake_liquid: {value: 0.15, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "as F101 (D-007)"
      filtration:
        specific_cake_resistance: 1.0e+10
        medium_resistance: 1.0e+10
        pressure_difference: 200
        viscosity: 1.1
        filtrate_density: 1030
        provenance: assumed
        source: "as F101, the wash filtrate a dilute liquor at 291 K (D-007)"
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out}
  - id: D101
    block: ISOL
    title: Vacuum drying at 308 K (filter-dryer)
    class: Drying
    dryer:
      volatiles: [H2O, ACET, BR2]
      residual_moisture: {value: 0.001, basis: mass_fraction, provenance: assumed, source: "0.1 wt% volatiles in the dried product (D-008)"}
      temperature: 308.15
      energy:
        heat_capacity: 0.9
        latent_heat: {H2O: 2418.0, ACET: 549.0, BR2: 187.5}
        vessel_heat_capacity: 1000
        efficiency: 0.7
        port: steam
        provenance: assumed
        source: "wet cake 0.9 kJ/(kg K) (CBr4 0.44 kJ/(kg K), NIST WebBook, with 0.15 kg of liquor at about 3.9), 70 % efficiency (D-009); latent heats: water at 308 K (steam tables), acetone 31.9 kJ/mol at 300 K (NIST WebBook, read 2026-11-05), bromine 29.96 kJ/mol at its boiling point (CRC Handbook); the filter-dryer's metal, about 2 t of steel at 0.5 kJ/(kg K), heated from 291 K each batch, ASSUMED (D-008)"
      drying_rate: {value: 2.5, provenance: assumed, source: "ASSUMED mean rate of a jacketed agitated filter-dryer under vacuum at a low wall temperature: a wall flux of about 1.7 kW/m2 (U 110 W/(m2 K) at a 15 K approach) over 2418 kJ/kg (D-008)"}
      cake_density: {value: 2000, provenance: assumed, source: "ASSUMED bulk density of the wet cake: CBr4 crystals 3.42 g/cm3 (Wikipedia) with 0.15 kg of liquor per kg and the voids (D-008)"}
      outlets: {product: product, vapour: vapour}
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: product, direction: out, delegates: product}
      - {id: vapour, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M103
    block: ISOL
    title: Liquor collection to wastewater
    class: Mixing
    ports:
      - {id: ml, direction: in}
      - {id: wf, direction: in}
      - {id: cond, direction: in}
      - {id: out, direction: out, delegates: ww}

streams:
