# Simulation specs of carbon-tetrabromide-1 (`cheme schema process-simulation`). The flowsheet is
# not solved in DWSIM: no property package covers the alkaline hypobromite and bromide liquor,
# and a semi-batch is not coupled to DWSIM (core ADR 0050). Only the heat boundary is declared:
# the precipitation hold CR101 (inside R-101, on its brine jacket) and the reslurry wash W101 are
# core crystallizers (DESIGN.md D-007) without an energy: block: CBr4's heat of crystallisation
# is counted in HALO's heat of reaction (to the solid, D-005) and the wash's is small, so they
# have no utility energy port (adiabatic, DESIGN.md D-009).
schema: cheme/simulation/v1
kind: simulation
specs:
  CR101: {mode: adiabatic}
  W101: {mode: adiabatic}
