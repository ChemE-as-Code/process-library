# Process Atlas manifest of carbon-tetrabromide-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: carbon-tetrabromide-1
title: Carbon tetrabromide by semi-batch haloform bromination of acetone in aqueous hypobromite (314 t/a)
summary: >-
  A batch plant: bromine is dosed into cold caustic to hypobromite, then acetone into the
  hypobromite; CBr4 precipitates, is filtered, washed and vacuum-dried, half of the bromine
  leaving as NaBr. Concept stage, 451 kg per batch every 11.4 h on a dedicated train, thermal
  screening of both dosed steps, preliminary gate-to-gate LCI.
description: |
  Caustic soda (2.2 mol NaOH per mol of bromine) is diluted with water (2.5 kg per kg of
  bromine in all), the phase-transfer catalyst tetrabutylammonium bromide added (5 g per kg of
  bromine) and the charge cooled to 278 K. Liquid bromine is dosed into it over 1.7 h and reacts
  to sodium hypobromite and bromide. The cold hypobromite goes to the haloform reactor, where
  acetone (5 % above 1 mol per 4 mol of bromine) is dosed over 4.5 h at 278 K and stirred for
  another 4.1 h: the hypobromite brominates and cleaves it to carbon tetrabromide and sodium
  acetate, C3H6O + 4 NaOBr -> CBr4 + CH3COONa + 3 NaOH, the aqueous route of CN 101 885 665 A.
  CBr4 is nearly insoluble in the cold liquor and precipitates. The slurry is filtered, the
  cake reslurried in about 2 kg of water per kg and filtered again, and dried at 308 K under
  vacuum in agitated filter-dryers (two units, taking the batches in turn), their jackets on hot
  water of 318 K at most, below CBr4's polymorph transition at 320 K; a vacuum condenser on
  cooling water takes the vapour. The product is 99.6 wt% CBr4 with 0.3 wt% dried salts and
  0.1 wt% water; the yield is 98.4 % of the CBr4 the bromine can make and 93.7 % on acetone. The mother liquor (14 wt% NaBr, 5 wt% NaOH, 3 wt%
  sodium acetate, traces of bromate) and the wash go to wastewater treatment: the bromide is not
  recovered.

  The batch is modelled with cheme-as-code's semi-batch reactor (reactor: semibatch, core ADR
  0050) for both dosed steps and its batch recipe (process/recipe.yaml, core ADRs 0051 and
  0052): the dosing and post-reaction times come from the models, the haloform reactor is the
  bottleneck (cycle 11.38 h, 696 batches a year), the recipe sizes the three 4 m3 vessels and
  checks the two reactors' jackets at the mean temperature of the 258/263 K brine (the 4.5 h
  acetone dosing and the 1.7 h bromine dosing are what the jackets remove), and
  the flowsheet's flows are the recipe's year averages. The precipitation and the reslurry wash
  are cheme's crystallizer with the liquor's salts as spectators; the filter-dryer is one vessel
  over filtration, wash, refiltration and drying, its times and steam from cheme's filter and
  dryer models (core ADRs 0056, 0057). No gas forms, so no vent stream. The kinetics are ASSUMED
  (no open data); the heats are Hess's-law estimates (-41 kJ per mol of bromine, -521 kJ per mol
  of acetone). The acetone accumulates to 12.1 % at most and the cooling-failure temperature
  stays at 284.8 K against the 329.3 K boiling point of acetone, while the whole batch's
  adiabatic rise is 68 K; with a 100 times slower reaction the cooling-failure temperature would
  pass that boiling point. See DESIGN.md for every assumption.
families: [chlorinated-organics]
keywords: [carbon tetrabromide, tetrabromomethane, CBr4, haloform reaction, sodium hypobromite, acetone, bromine, semi-batch, batch, dosing, precipitation, filter-dryer, sodium bromide, phase-transfer catalyst, fine chemicals, thermal screening]
facets:
  feedstock_basis: [mineral, fossil, electricity]
  product_classes: [chemicals]
  unit_operations: [reaction, crystallization, filtration, drying]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, feed ratios, kinetics,
# heats of reaction, solubility, filtration and drying are assumed (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept batch PFD with closed mass, component and element balances (cheme validate, cheme
    process streams: 3 blocks and 9 steps within tolerance). Every stream is calculated by cheme
    process propagate: the semi-batches M101 and R101 from their ASSUMED rate laws, the
    precipitation CR101 and the reslurry wash W101 as crystallizers with spectators from the
    solubility of CBr4 (the 30 C value in water, no salting-out correction, ASSUMED), the
    filters as specified splits, the dryer D101 to an ASSUMED residual moisture; the dryer's
    steam is cheme's (cheme process crystallizers), the reactors' duties cheme's heat release
    plus the doses' cooling; no balance script. The recipe takes the dosing and post-reaction
    times from the models and the filtration (Ruth) and drying times from the filter and dryer
    models with ASSUMED cake data and drying rate; the recipe's year-average rate of the product
    agrees with the flowsheet (cheme process recipe, no cheme.recipe-basis finding), and both
    reactors' jackets pass at the peak duty with the brine at its mean temperature (R-101 by
    1.3 %). Thermal screening (cheme process reactor-hazards):
    M101 dT_ad 21.8 K, accumulation 0.38 %, MTSR 282.9 K against an MTT of 331.9 K (bromine);
    R101 dT_ad 68.2 K, accumulation 12.1 %, MTSR 284.8 K against an MTT of 329.3 K (acetone); no
    criticality class without a TD24 from calorimetry. The kinetics are assumed: at a tenth of
    the haloform rate the accumulation is 33 % and the MTSR 299 K, at a hundredth 78 % and
    330.2 K, above the MTT (DESIGN.md D-011). Preliminary gate-to-gate LCI with the rinses and
    the nitrogen per batch (per-batch consumables); bromine, caustic soda, acetone and nitrogen
    linked to bromine-1, chlor-alkali-1, acetone-1 and asu-1, the other backgrounds gaps. cheme
    maturity reaches no level (assumed feeds, kinetics and separations); the claim `maturity:
    concept` is the lowest value of the schema, not an evidenced level. Not reviewed. Needs
    cheme-as-code 1.8.0 (crystallizer spectators, dryer and recipe units, core#165).
