# Equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes per batch from the recipe (D-003) and the semi-batch models; design pressures,
# temperatures and materials are not set yet (basic engineering); materials named are usual
# choices for wet bromine, hypobromite and alkaline bromide liquors, to be confirmed (open
# input). All values ASSUMED.
schema: cheme/equipment/v1
equipment:
  - {tag: M-101, type: StirredTankReactor, service: "Hypobromite reactor: caustic diluted and cooled, bromine dosed to sodium hypobromite at 278 K",
     notes: "2.76 m3 of liquor per batch at the end of the dosing; 4 m3 (R10 preferred size, 69 % full, D 1.62 m) as the recipe sizes it from M101's semi-batch model (core ADR 0052), glass-lined (wet bromine, hypobromite); jacket on brine 258/263 K (checked at the 260.77 K mean), U 300 W/(m2 K): peak duty 37.8 kW while the bromine is dosed against 42.1 kW the jacket removes (the 1.7 h dosing is set by it); agitator 3 kW; bromine dosing over 1.7 h interlocked with the cooling and the agitator; vent to the caustic scrubber (D-003, D-005, D-011)."}
  - {tag: R-101, type: StirredTankReactor, service: "Haloform reactor: acetone dosed into the cold hypobromite, CBr4 precipitating",
     notes: "2.79 m3 of slurry per batch at the end of the dosing; 4 m3 (R10 preferred size, 70 % full, D 1.62 m) as the recipe sizes it from R101's semi-batch model (core ADR 0052), glass-lined; jacket on brine 258/263 K (checked at the 260.77 K mean), U 300 W/(m2 K): peak duty 45.7 kW while the acetone is dosed against 46.3 kW the jacket removes (the 4.5 h dosing is set by it, 1.3 % margin); agitator 3 kW; nitrogen-inerted (acetone); acetone dosing interlocked with the temperature, the cooling and the agitator; vent condenser to the caustic scrubber (D-003, D-005, D-011)."}
  - {tag: F-101, type: Filter, service: "Agitated filter-dryer (two units): filtration, reslurry wash, filtration, vacuum drying at 308 K",
     notes: "Take the batches in turn, 18.85 h per batch each (filtrations by Ruth 2.6 h and 0.55 h, drying 13.66 h at an ASSUMED 1.64 kg/(m2 h) on the 2.93 m2 the cake wets; recipe D-003, D-008); 4 m3 (R10 preferred size, 70 % full with one batch's slurry, D 1.72 m) as the recipe sizes it (core ADR 0057); hot-water jacket from LP steam, the water at 318 K at most (below CBr4's 320 K polymorph transition), 6.4 kW year average (core's dryer model, the vessel's heat included); vacuum pump and condenser on cooling water, 3.9 kW year average (Q5); Hastelloy or glass-lined (alkaline bromide liquor) (D-007, D-008)."}
