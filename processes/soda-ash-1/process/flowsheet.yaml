# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Solvay ammonia-soda process, 1000 t/d light soda ash (D-001, D-002). Where the values come from:
# - every flow and composition is from the independent sequential balance
#   scripts/solvay_balance.py (D-006), given here as ASSUMED: it rests on ASSUMED design
#   parameters (sodium utilisation, NH3/NaCl ratio, cake moisture, losses) and a component
#   basis for the liquors, because core cannot yet speciate NH3-CO2-NaCl-H2O electrolytes
#   (core #364) or model the reciprocal-salt equilibrium of the towers (D-007);
# - the coke flow rests on the lime kiln's specific heat use (cheme process furnace,
#   specific-energy fallback, process/furnaces.yaml, D-004);
# - reactor steps name their reactions (process/reactions.yaml), so cheme checks their balance
#   by elements;
# - duties are from the same script (D-008), ASSUMED; no property package covers these streams.
schema: cheme/process/v1
kind: flowsheet
title: Soda ash by the Solvay ammonia-soda process (1000 t/d light soda ash)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - id: design
    description: "Design case: 1000 t/d light soda ash (99.5 wt% Na2CO3), 8000 h/a (D-002)"
    default: true
    capacity: 1000 t/d light soda ash
    provenance: assumed
    source: "D-002: a normalisation basis for the inventory, not a commercial plant claim"
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: LST, title: Limestone (crushed and screened), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: COKE, title: Coke (kiln fuel), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AIR, title: Kiln combustion air, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: BRINE, title: Purified saturated brine at battery limits, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NH3, title: Ammonia make-up (liquid), category: raw_material, ports: [{id: out, direction: out}]}
  - id: PW
    title: Process water
    category: raw_material
    ports: [{id: slk, direction: out}, {id: wash, direction: out}]
  - id: LPS
    title: LP steam 450 kPa(a), live steam to the distiller
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis, D-008"}
      supply_temperature: {value: 420.8, provenance: assumed, source: "saturation at 450 kPa(a), D-008"}
    ports: [{id: out, direction: out}]
  - id: HPS
    title: HP steam 3000 kPa(a) to the calciner (condensate returned)
    category: utility
    utility:
      kind: steam
      level: HP
      pressure: {value: 3000, provenance: assumed, source: "design basis, D-008"}
      supply_temperature: {value: 507.0, provenance: assumed, source: "saturation at 3000 kPa(a), D-008"}
      min_approach: {value: 20, provenance: assumed, source: D-008}
    ports: [{id: r501, direction: out, kind: energy}]
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: k101, direction: out, kind: energy}
      - {id: k501, direction: out, kind: energy}
      - {id: aux, direction: out, kind: energy}
products:
  - {id: SODA, title: Light soda ash to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: DSW, title: Distiller waste (CaCl2 liquor with suspended solids) to settling ponds, category: wastewater, ports: [{id: in, direction: in}]}
  - {id: VENT, title: Vent gas to atmosphere (unabsorbed kiln CO2 and air nitrogen), category: off_gas, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-008"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-008"}
      min_approach: {value: 5, provenance: assumed, source: D-008}
    ports:
      - {id: k101, direction: in, kind: energy}
      - {id: k501, direction: in, kind: energy}
      - {id: e101, direction: in, kind: energy}
      - {id: a201, direction: in, kind: energy}
      - {id: c301, direction: in, kind: energy}
      - {id: e501, direction: in, kind: energy}

blocks:
  - id: KLN
    title: Lime kiln, kiln gas and slaking
    class: ReactingChemicals
    ports:
      - {id: ls, direction: in}
      - {id: coke, direction: in}
      - {id: air, direction: in}
      - {id: water, direction: in}
      - {id: gas, direction: out}
      - {id: milk, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
  - id: ABS
    title: Brine ammoniation and tower-gas scrubbing
    class: Absorbing
    ports:
      - {id: brine, direction: in}
      - {id: tgas, direction: in}
      - {id: dgas, direction: in}
      - {id: nh3, direction: in}
      - {id: vent, direction: out}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy}
  - id: CRB
    title: Carbonation (bicarbonate precipitation)
    class: ReactingChemicals
    ports:
      - {id: brine, direction: in}
      - {id: kgas, direction: in}
      - {id: cgas, direction: in}
      - {id: gas, direction: out}
      - {id: slurry, direction: out}
      - {id: cw, direction: out, kind: energy}
  - id: FIL
    title: Bicarbonate filtration and washing
    class: Filtering
    ports:
      - {id: in, direction: in}
      - {id: wash, direction: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out}
      - {id: power, direction: in, kind: energy}
  - id: CAL
    title: Calcination and calciner gas recovery
    class: ReactingChemicals
    ports:
      - {id: cake, direction: in}
      - {id: prod, direction: out}
      - {id: cgas, direction: out}
      - {id: cond, direction: out}
      - {id: heat, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
  - id: DST
    title: Ammonia recovery (distillation with milk of lime)
    class: ReactingChemicals
    ports:
      - {id: ml, direction: in}
      - {id: cond, direction: in}
      - {id: milk, direction: in}
      - {id: steam, direction: in}
      - {id: gas, direction: out}
      - {id: waste, direction: out}

steps:
  # D-004: mixed-feed shaft kiln, limestone and coke charged together
  - id: R101
    block: KLN
    title: Lime kiln (mixed-feed shaft)
    class: ReactingChemicals
    reactions: [CALC, COMB]
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: ls, direction: in, delegates: ls}
      - {id: coke, direction: in, delegates: coke}
      - {id: air, direction: in, delegates: air}
      - {id: lime, direction: out}
      - {id: gas, direction: out}
  - id: M101
    block: KLN
    title: Lime slaker
    class: ReactingChemicals
    reactions: [SLAKE]
    links: [{target: equipment, ref: M-101}]
    ports:
      - {id: lime, direction: in}
      - {id: water, direction: in, delegates: water}
      - {id: milk, direction: out, delegates: milk}
  - id: E101
    block: KLN
    title: Kiln gas washer-cooler
    class: Cooling
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: K101
    block: KLN
    title: Kiln gas compressor (with inter- and aftercoolers)
    class: Compressing
    links: [{target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: gas}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  - id: T201
    block: ABS
    title: Tower-gas scrubber (brine wash)
    class: Absorbing
    links: [{target: equipment, ref: T-201}]
    ports:
      - {id: brine, direction: in, delegates: brine}
      - {id: gas, direction: in, delegates: tgas}
      - {id: vent, direction: out, delegates: vent}
      - {id: brine_out, direction: out}
  - id: A201
    block: ABS
    title: Ammonia absorber (with coolers)
    class: Absorbing
    links: [{target: equipment, ref: A-201}]
    ports:
      - {id: brine, direction: in}
      - {id: gas, direction: in, delegates: dgas}
      - {id: nh3, direction: in, delegates: nh3}
      - {id: out, direction: out, delegates: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  # D-006: sodium utilisation 0.73 (CARB conversion of NaCl)
  - id: C301
    block: CRB
    title: Carbonating towers (cooled)
    class: ReactingChemicals
    reactions: [CARB]
    links: [{target: equipment, ref: C-301}]
    ports:
      - {id: brine, direction: in, delegates: brine}
      - {id: kgas, direction: in, delegates: kgas}
      - {id: cgas, direction: in, delegates: cgas}
      - {id: gas, direction: out, delegates: gas}
      - {id: slurry, direction: out, delegates: slurry}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: F401
    block: FIL
    title: Rotary vacuum filter with cake wash
    class: Filtering
    links: [{target: equipment, ref: F-401}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: wash, direction: in, delegates: wash}
      - {id: cake, direction: out, delegates: cake}
      - {id: filtrate, direction: out, delegates: filtrate}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: R501
    block: CAL
    title: Steam-heated rotary calciner
    class: ReactingChemicals
    reactions: [BICARB]
    links: [{target: equipment, ref: R-501}]
    ports:
      - {id: in, direction: in, delegates: cake}
      - {id: prod, direction: out, delegates: prod}
      - {id: gas, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: heat}
  - id: E501
    block: CAL
    title: Calciner gas cooler-condenser
    class: SeparatingByPhaseSeparation
    links: [{target: equipment, ref: E-501}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out}
      - {id: cond, direction: out, delegates: cond}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: K501
    block: CAL
    title: Calciner CO2 compressor (with inter- and aftercoolers)
    class: Compressing
    links: [{target: equipment, ref: K-501}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: cgas}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  # D-006: heater (free ammonia, CO2) and lime still (fixed ammonia) lumped in one step
  - id: D601
    block: DST
    title: Ammonia distiller (heater, prelimer and lime still, live steam)
    class: ReactingChemicals
    reactions: [DIST]
    links: [{target: equipment, ref: D-601}]
    ports:
      - {id: ml, direction: in, delegates: ml}
      - {id: cond, direction: in, delegates: cond}
      - {id: milk, direction: in, delegates: milk}
      - {id: steam, direction: in, delegates: steam}
      - {id: gas, direction: out, delegates: gas}
      - {id: waste, direction: out, delegates: waste}

