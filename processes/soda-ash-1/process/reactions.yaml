# Reactions of the Solvay process (D-001, D-006, D-007). Schema: `cheme schema
# process-reactions`. Overall: CaCO3 + 2 NaCl -> Na2CO3 + CaCl2.
# Conversions are design specifications (a sourced-range conversion model, D-006), not
# kinetics; none is predicted. Heats of reaction at 298 K from standard enthalpies of formation
# (NBS tables of chemical thermodynamic properties, Wagman et al. 1982, J. Phys. Chem. Ref.
# Data 11 Suppl. 2): aqueous species at infinite dilution; values recalled for this concept
# stage and to be checked against the table (D-007), so ASSUMED.
schema: cheme/reactions/v1
kind: reactions
reactions:
  - id: CALC
    title: Limestone calcination (lime kiln)
    equation: CaCO3(s) -> CaO(s) + CO2(g)
    stoichiometry: {CaCO3: -1, CaO: 1, CO2: 1}
    conversion: {key: CaCO3, value: 0.95, provenance: assumed, source: "D-004, process/furnaces.yaml"}
    heat_of_reaction: {value: 178300, provenance: assumed, source: "formation enthalpies CaCO3(s) -1207.6, CaO(s) -635.1, CO2(g) -393.5 kJ/mol (NBS tables, D-007)"}
  - id: COMB
    title: Coke combustion (lime kiln)
    equation: C(s) + O2 -> CO2
    stoichiometry: {C: -1, O2: -1, CO2: 1}
    conversion: {key: C, value: 1.0, provenance: assumed, source: "complete combustion, as cheme process furnace assumes (D-004)"}
    heat_of_reaction: {value: -393500, provenance: assumed, source: "formation enthalpy of CO2(g) (NBS tables, D-007)"}
  - id: SLAKE
    title: Lime slaking
    equation: CaO(s) + H2O(l) -> Ca(OH)2(s)
    stoichiometry: {CaO: -1, H2O: -1, CaOH2: 1}
    conversion: {key: CaO, value: 1.0, provenance: assumed, source: "complete slaking (D-006)"}
    heat_of_reaction: {value: -64300, provenance: assumed, source: "formation enthalpies Ca(OH)2(s) -985.2, CaO(s) -635.1, H2O(l) -285.8 kJ/mol (NBS tables, D-007)"}
  - id: CARB
    title: Carbonation and bicarbonate precipitation (carbonating towers)
    equation: NaCl(aq) + NH3(aq) + CO2(g) + H2O(l) -> NaHCO3(s) + NH4Cl(aq)
    stoichiometry: {NaCl: -1, NH3: -1, CO2: -1, H2O: -1, NaHCO3: 1, NH4Cl: 1}
    phase: mixed
    conversion: {key: NaCl, value: 0.73, provenance: assumed, source: "D-006: sodium utilisation of the towers, ASSUMED inside the range the Solvay literature reports (about 70-75 %), limited by the NaCl-NH4Cl-NaHCO3-NH4HCO3 reciprocal salt equilibrium"}
    heat_of_reaction: {value: -83600, provenance: assumed, source: "formation enthalpies NaHCO3(s) -950.8, NH4Cl(aq) -299.7, NaCl(aq) -407.3, NH3(aq) -80.3, CO2(g) -393.5, H2O(l) -285.8 kJ/mol (NBS tables, D-007)"}
  - id: BICARB
    title: Bicarbonate calcination (steam calciner)
    equation: 2 NaHCO3(s) -> Na2CO3(s) + CO2(g) + H2O(g)
    stoichiometry: {NaHCO3: -2, Na2CO3: 1, CO2: 1, H2O: 1}
    conversion: {key: NaHCO3, value: 1.0, provenance: assumed, source: "complete decomposition to light ash (D-006)"}
    heat_of_reaction: {value: 135600, provenance: assumed, source: "formation enthalpies Na2CO3(s) -1130.7, NaHCO3(s) -950.8, CO2(g) -393.5, H2O(g) -241.8 kJ/mol (NBS tables, D-007)"}
  - id: DIST
    title: Ammonia liberation with milk of lime (distiller)
    equation: Ca(OH)2(s) + 2 NH4Cl(aq) -> CaCl2(aq) + 2 NH3(g) + 2 H2O(l)
    stoichiometry: {CaOH2: -1, NH4Cl: -2, CaCl2: 1, NH3: 2, H2O: 2}
    phase: mixed
    conversion: {key: NH4Cl, value: 1.0, provenance: assumed, source: "D-006: fixed ammonia fully liberated with 5 % excess lime; the residual ammonia of the waste is set separately (1.5 kg/t)"}
    heat_of_reaction: {value: 44100, provenance: assumed, source: "formation enthalpies CaCl2(aq) -877.1, NH3(g) -45.9, H2O(l) -285.8, Ca(OH)2(s) -985.2, NH4Cl(aq) -299.7 kJ/mol (NBS tables, D-007)"}
