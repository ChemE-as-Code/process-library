# Components and templates of maleic-anhydride-1. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol (IUPAC 2021
# conventional atomic weights applied to the formula), normal_boiling_point in K at 101.325 kPa.
#
# Property sources (DESIGN.md source register SRC-6, SRC-7):
# - ideal-gas data (formation enthalpy and entropy at 298.15 K, the heat-capacity polynomial)
#   from `cheme chemistry thermo` on the `chemicals` 1.5.2 / `thermo` packages of core's
#   environment: ATcT, CRC, YAWS and WebBook formation data, Poling's (5th ed.) heat capacities,
#   acrylic acid's fitted to thermo's TRCIG and dibutyl phthalate's to a Joback estimate;
#   single facts with the package and the method named, not open data (library ADR 0037);
# - maleic anhydride: thermo has no ideal-gas heat capacity of it. Its formation enthalpy is
#   chemicals' gas value (-398.3 kJ/mol), which agrees with the NIST WebBook's solid value
#   (-469.6 +/- 0.3 kJ/mol, Parks et al. 1950) plus its enthalpy of sublimation (71.5 +/- 5.0
#   kJ/mol, Winstrom and Kulp 1949); cp_R is our quadratic through the four gas heat capacities
#   the NIST WebBook lists (273.15 K 83.94, 298.15 K 90.04, 500 K 128.54, 800 K 159.65 J/(mol K);
#   within 0.2 J/(mol K) of each), used to 800 K; S_298 is Joshi's (1970) statistical value
#   quoted there (300.75 J/(mol K));
# - normal boiling points from the CRC tables packaged in `chemicals` 1.5.2.
# Liquids are not modelled thermally: the absorber, the stripper and the column are component
# separators (core ADR 0070); their heats are scripts/balance.py's (D-007, D-008).
