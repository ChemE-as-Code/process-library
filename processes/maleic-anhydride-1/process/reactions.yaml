# Reactions of maleic-anhydride-1. Schema: `cheme schema process-reactions`. Heats of reaction
# from the ideal-gas formation enthalpies of materials.yaml at 298.15 K (vapour basis).
#
# R201, the fixed-bed VPO reactor (DESIGN.md D-004): a conversion model, not kinetics. Every
# reaction converts its share of the n-butane at the reactor inlet in parallel (core's
# conversion step), so each reaction's conversion is the overall conversion times its molar
# selectivity: X = 0.81 (SRC-1, US 7 589 217 B2, the pilot's 80 to 82 % target) and the
# selectivities MA 0.695 (SRC-1, Example 3 in air without added CO), acetic acid 0.015 and
# acrylic acid 0.010 (ASSUMED: SRC-2 and SRC-3 name both acids as by-products but give no
# selectivity), the rest to carbon oxides, CO : CO2 = 0.62 : 0.38 on carbon (SRC-5, the CO and
# CO2 selectivities of an industrial VPO catalyst at 673 K, 18.1 and 11.1 %).
#
# R501, the thermal oxidiser (D-009): the absorber's off-gas and the liquid wastes burnt; the
# destruction efficiencies are ASSUMED.
schema: cheme/reactions/v1
kind: reactions
reactions:
  - id: MAF
    title: n-Butane to maleic anhydride
    equation: C4H10 + 3.5 O2 -> C4H2O3 + 4 H2O
    stoichiometry: {NC4: -1.0, O2: -3.5, MA: 1.0, H2O: 4.0}
    phase: vapor
    reversible: false
    conversion: {key: NC4, value: 0.56295, provenance: given, source: "SRC-1 (US 7 589 217 B2): conversion 0.81 (the pilot's target 80 to 82 %) x selectivity 0.695 (Example 3, 20.9 % O2, no CO added, salt 402 C), D-004"}
