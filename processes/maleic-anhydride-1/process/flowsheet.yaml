# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Maleic anhydride by selective oxidation of n-butane in air over a VPO catalyst in a fixed-bed
# multitubular reactor cooled by molten salt, recovered by absorption in dibutyl phthalate
# (DESIGN.md D-001):
# - n-butane is vaporised (E-101) and mixed with compressed humid air (K-102) to 1.8 mol%
#   butane, above its lower flammable limit of 1.4 vol% in air: a flammable feed (M103, D-003,
#   D-011);
# - R-201 converts 81 % of the butane, 69.5 % of it to maleic anhydride (R201, a conversion
#   step, D-004); its heat goes into the circulating salt and from the salt to the steam
#   generator (energy stream Q2 to the HP steam export);
# - the reactor gas is cooled to 423 K in a steam generator (E-202) and enters the absorber
#   A-301, where lean dibutyl phthalate takes up 99.4 % of the anhydride (A301, a component
#   separator, D-007); the off-gas goes to the thermal oxidiser;
# - the rich solvent is stripped under vacuum in T-302 (T302): the crude anhydride as a side
#   draw, water and the light acids to the vacuum system and the oxidiser, the lean solvent
#   from the bottom back to the absorber through the solvent cooler E-305, a small purge burnt
#   and made up with fresh solvent (the tear S17, D-007);
# - the crude is distilled under vacuum in C-401 to the product (C401, D-008);
# - the off-gas, the stripper's and the column's lights and residues and the solvent purge are
#   burnt in the thermal oxidiser F-501 with its waste-heat boiler (R501, D-009).
# Where the values come from:
# - the reactor feed's composition (1.8 mol% butane, 1.7 mol% water), pressure and the
#   conversion and selectivity: SRC-1 (US 7 589 217 B2); the absorber and stripper conditions
#   and splits: SRC-2 (US 4 118 403 A); ASSUMED where marked (DESIGN.md);
# - every flow and composition after the feeds: `cheme process propagate --fill` (pass-through,
#   mixers, the splitter, the conversion steps R201 and R501, the component separators A301,
#   T302 and C401), the feeds solved by the design specifications `rate` and `solvent`, the
#   solvent loop converged at the tear S17 (core ADRs 0060, 0070);
# - the duties of R201 (Q2) and R501 (Q9): core's conversion steps, from the heats of reaction
#   and the ideal-gas data of materials.yaml;
# - the other duties and powers and the mixing temperatures: scripts/balance.py (D-010).
schema: cheme/process/v1
kind: flowsheet
title: Maleic anhydride by n-butane oxidation over VPO in a fixed bed, molten-salt cooling with steam raising, dibutyl phthalate absorption and vacuum distillation (25 kt/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 25 000 t/a maleic anhydride in 8000 h (D-002)", default: true}
tolerance: {abs: 0.05, rel: 0.001}
# The lean solvent loop is torn at S17, the cooled lean solvent into the absorber (D-007).
tears:
  - stream: S17
    initial: {flow: 15000.0, unit: kg/h, basis: mass_fraction, composition: {DBP: 0.997, MA: 0.003}}
convergence: {method: wegstein, max_iterations: 200, tolerance: {abs: 1.0e-5, rel: 1.0e-8}}
specs:
  - id: rate
    vary: {stream: S1, initial: 3350.0, with: {S3: 27.0054}}
    target: {stream: S18, quantity: annual, value: 25000, unit: t, hours: 8000}
    provenance: assumed
    source: "D-002: 25 000 t/a of maleic anhydride in 8000 h, ASSUMED; the humid air follows the butane at 27.0054 kg/kg, 98.2 kmol of humid air per 1.8 kmol of butane (scripts/balance.py, D-003)"
  - id: solvent
    vary: {stream: S15, initial: 20.0}
    target: {stream: S16, component: DBP, quantity: ratio, per: {stream: S7, component: MA}, basis: mass, value: 4.8}
    provenance: given
    source: "SRC-2 (US 4 118 403 A), Example: about 2200 kg of lean dibutyl phthalate per 18 000 m3 of reactor gas with 0.75 mol% MA at about 915 torr and 145 to 155 C, i.e. 2200 kg per 4.68 kmol (459 kg) of MA in the gas, 4.8 kg/kg (our arithmetic at 423 K and 122 kPa, D-007)"

feeds:
  - {id: BUTF, title: n-Butane (no library process), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AIRF, title: Ambient air, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: SOLF, title: Dibutyl phthalate make-up (no library process), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: k102, direction: out, kind: energy}
      - {id: recov, direction: out, kind: energy}
      - {id: c401, direction: out, kind: energy}
      - {id: f501, direction: out, kind: energy}
  - id: LPS
    title: LP steam 450 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis (D-010)"}
      supply_temperature: {value: 421.0, provenance: given, source: "saturation at 450 kPa(a), IAPWS-IF97 (420.8 K)"}
      min_approach: {value: 10, provenance: assumed, source: "D-010"}
    ports:
      - {id: e101, direction: out, kind: energy}
  - id: HPSI
    title: HP steam 4500 kPa(a) from the site header (reboilers)
    category: utility
    utility:
      kind: steam
      level: HP
      pressure: {value: 4500, provenance: assumed, source: "design basis (D-010): the export level, drawn back from the site header"}
      supply_temperature: {value: 531.0, provenance: given, source: "saturation at 4500 kPa(a), IAPWS-IF97 (530.6 K)"}
      min_approach: {value: 10, provenance: assumed, source: "D-010"}
    ports:
      - {id: t302, direction: out, kind: energy}
      - {id: c401, direction: out, kind: energy}
products:
  - {id: MAP, title: Maleic anhydride (molten) to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: STACK, title: Thermal oxidiser flue gas to the stack, category: emission, ports: [{id: in, direction: in}]}
  - id: HPS
    title: HP steam export 4500 kPa(a) (salt and gas-cooler steam generators, waste-heat boiler)
    category: utility
    utility:
      kind: steam
      level: HP
      pressure: {value: 4500, provenance: assumed, source: "design basis (D-010)"}
      supply_temperature: {value: 531.0, provenance: given, source: "saturation at 4500 kPa(a), IAPWS-IF97 (530.6 K)"}
      min_approach: {value: 20, provenance: assumed, source: "D-010"}
    ports:
      - {id: r201, direction: in, kind: energy}
      - {id: e202, direction: in, kind: energy}
      - {id: r501, direction: in, kind: energy}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis (D-010)"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis (D-010)"}
      min_approach: {value: 5, provenance: assumed, source: "D-010"}
    ports:
      - {id: t302, direction: in, kind: energy}
      - {id: e305, direction: in, kind: energy}
      - {id: c401, direction: in, kind: energy}

blocks:
  - id: FEED
    title: Butane vaporisation and air compression
    class: Compressing
    ports:
      - {id: butane, direction: in}
      - {id: air, direction: in}
      - {id: out, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: REACT
    title: Fixed-bed VPO reactor with molten-salt cooling and gas cooler (R-201, E-202)
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q_salt, direction: out, kind: energy}
      - {id: q_gas, direction: out, kind: energy}
  - id: RECOV
    title: Absorption in dibutyl phthalate and vacuum stripping (A-301, T-302)
    class: Absorbing
    ports:
      - {id: gas, direction: in}
      - {id: makeup, direction: in}
      - {id: offgas, direction: out}
      - {id: crude, direction: out}
      - {id: lights, direction: out}
      - {id: purge, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: q_cond, direction: out, kind: energy}
      - {id: q_cool, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: PURIFY
    title: Vacuum distillation of the crude anhydride (C-401)
    class: Distilling
    ports:
      - {id: in, direction: in}
      - {id: product, direction: out}
      - {id: lights, direction: out}
      - {id: residue, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: q, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: OXID
    title: Thermal oxidiser with waste-heat boiler (F-501)
    class: ReactingChemicals
    ports:
      - {id: offgas, direction: in}
      - {id: lights, direction: in}
      - {id: purge, direction: in}
      - {id: c_lights, direction: in}
      - {id: c_residue, direction: in}
      - {id: flue, direction: out}
      - {id: q, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}

steps:
  - id: E101
    block: FEED
    title: Butane vaporiser (LP steam)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in, delegates: butane}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: steam}
  - id: K102
    block: FEED
    title: Process air compressor
    class: Compressing
    links: [{target: equipment, ref: K-102}]
    ports:
      - {id: in, direction: in, delegates: air}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M103
    block: FEED
    title: Butane and air mixer (1.8 mol% butane)
    class: Mixing
    links: [{target: equipment, ref: M-103}]
    ports:
      - {id: butane, direction: in}
      - {id: air, direction: in}
      - {id: out, direction: out, delegates: out}
  - id: R201
    block: REACT
    title: Multitubular fixed-bed reactor, VPO catalyst, molten-salt cooled (salt 675 K)
    class: ReactingChemicals
    reactions: [MAF, COF, CO2F, AAF, ACRF]
    reactor: conversion
    energy_port: q
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: q_salt}
  - id: E202
    block: REACT
    title: Reactor gas cooler (steam generator)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-202}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
      - {id: q, direction: out, kind: energy, delegates: q_gas}
  - id: A301
    block: RECOV
    title: Absorber, lean dibutyl phthalate (component separator)
    class: Absorbing
    links: [{target: equipment, ref: A-301}]
    recovery:
      outlets:
        offgas: {N2: 1.0, O2: 1.0, AR: 1.0, CO: 1.0, CO2: 1.0, NC4: 1.0, H2O: 0.994, MA: 0.006, AA: 0.90, ACR: 0.47, DBP: 0.0001}
      provenance: given
      source: "SRC-2 (US 4 118 403 A), Example: the absorber takes up about 99.4 % of the MA, 0.6 % of the water, 10 % of the acetic acid and 53 % of the acrylic acid; the gases are not absorbed and the solvent's carry-over (0.01 %) is ASSUMED (D-007)"
    ports:
      - {id: gas, direction: in, delegates: gas}
      - {id: lean, direction: in}
      - {id: offgas, direction: out, delegates: offgas}
      - {id: rich, direction: out}
  - id: T302
    block: RECOV
    title: Vacuum stripper with crude side draw (component separator)
    class: SeparatingByThermalProcess
    links: [{target: equipment, ref: T-302}]
    recovery:
      outlets:
        crude: {MA: 0.981, H2O: 0.05, AA: 0.2, ACR: 0.5, DBP: 0.00002}
        lean: {MA: 0.014, DBP: 0.99998}
      provenance: assumed
      source: "D-007: the lean solvent keeps about 0.3 wt% MA (SRC-2's Example) and none of the water and acids; 0.5 % of the MA leaves with the lights after the sponge absorber (SRC-2 recovers 77 % of the MA in the stripper's vapour, the split ASSUMED); the crude's water and acids ASSUMED; the lights (the rest) go to the vacuum system and the oxidiser"
    ports:
      - {id: rich, direction: in}
      - {id: crude, direction: out, delegates: crude}
      - {id: lights, direction: out, delegates: lights}
      - {id: lean, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: q, direction: out, kind: energy, delegates: q_cond}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: SP303
    block: RECOV
    title: Solvent purge
    class: SplittingMaterial
    split: {purge: 0.001}
    links: [{target: equipment, ref: T-302}]
    ports:
      - {id: in, direction: in}
      - {id: purge, direction: out, delegates: purge}
      - {id: out, direction: out}
  - id: M304
    block: RECOV
    title: Solvent make-up
    class: Mixing
    links: [{target: equipment, ref: V-304}]
    ports:
      - {id: lean, direction: in}
      - {id: makeup, direction: in, delegates: makeup}
      - {id: out, direction: out}
  - id: E305
    block: RECOV
    title: Lean solvent cooler
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-305}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: q_cool}
  - id: C401
    block: PURIFY
    title: Vacuum distillation column (component separator)
    class: Distilling
    links: [{target: equipment, ref: C-401}]
    recovery:
      outlets:
        product: {MA: 0.997, H2O: 0.0, AA: 0.005, ACR: 0.03, DBP: 0.0}
        lights: {MA: 0.0015, H2O: 1.0, AA: 0.995, ACR: 0.97, DBP: 0.0}
      provenance: assumed
      source: "D-008: ASSUMED splits for a product of at least 99.5 wt% MA; SRC-2 refines the crude by distillation at about 100 torr and 140 C without stating a purity"
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: product, direction: out, delegates: product}
      - {id: lights, direction: out, delegates: lights}
      - {id: residue, direction: out, delegates: residue}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: q, direction: out, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M501
    block: OXID
    title: Oxidiser feed (off-gas, lights, purge and residue)
    class: Mixing
    links: [{target: equipment, ref: F-501}]
    ports:
      - {id: offgas, direction: in, delegates: offgas}
      - {id: lights, direction: in, delegates: lights}
      - {id: purge, direction: in, delegates: purge}
      - {id: c_lights, direction: in, delegates: c_lights}
      - {id: c_residue, direction: in, delegates: c_residue}
      - {id: out, direction: out}
  - id: R501
    block: OXID
    title: Thermal oxidiser and waste-heat boiler (flue gas to 453 K)
    class: ReactingChemicals
    reactions: [NC4_OX, CO_OX, MA_OX, AA_OX, ACR_OX, DBP_OX]
    reactor: conversion
    energy_port: q
    links: [{target: equipment, ref: F-501}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: flue}
      - {id: q, direction: out, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}

streams:
  - id: S1
    title: n-Butane feed (liquid)
    from: BUTF.out
    to: E101.in
    template: butane
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "battery limit, from pressure storage (D-003)"}
        pressure: {value: 450, provenance: assumed, source: "battery limit (D-003)"}
        phase: {value: liquid, provenance: assumed, source: "liquefied butane from storage (D-003)"}
        composition: {basis: mass_fraction, values: {NC4: 1.0}, provenance: assumed, source: "D-003: n-butane, the feed's isobutane and propane not modelled"}
        flow: {value: 3337.14, provenance: calculated, source: 'cheme process propagate: spec rate (S18 t/a 25000)', fingerprint: 1143fb14000f6f0e}
  - id: S2
    title: n-Butane vapour
    from: E101.out
    to: M103.butane
    template: butane
    state:
      design:
        temperature: {value: 333.15, provenance: assumed, source: "D-003: vaporised and superheated with LP steam"}
        pressure: {value: 400, provenance: assumed, source: "D-003"}
        phase: {value: vapor, provenance: assumed, source: "superheated about 20 K above the dew point at 400 kPa(a)"}
        flow: {value: 3337.14, provenance: calculated, source: 'cheme process propagate: pass-through E101 from S1', fingerprint: 0aee37a697431131}
        composition: {basis: mass_fraction, values: {NC4: 1.0}, provenance: calculated, source: 'cheme process propagate: pass-through E101 from S1', fingerprint: 0aee37a697431131}
  - id: S3
    title: Ambient air (humid)
    from: AIRF.out
    to: K102.in
    template: air
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "design ambient (D-003)"}
        pressure: {value: 101.325, provenance: assumed, source: "atmospheric (D-003)"}
        composition: {basis: mole_fraction, values: {N2: 0.767598, O2: 0.205908, AR: 0.009182, H2O: 0.017312}, provenance: assumed, source: "dry air (N2 78.084, O2 20.946, Ar 0.934 mol%, CO2 left out, normalised; N2 rounded so the fractions sum to 1) carrying the water that gives 1.7 mol% in the reactor feed, SRC-1's pilot inlet (D-003; humidification not modelled)"}
        flow: {value: 90120.8, provenance: calculated, source: 'cheme process propagate: spec rate (27.0054 x S1)', fingerprint: 1143fb14000f6f0e}
  - id: S4
    title: Compressed air
    from: K102.out
    to: M103.air
    template: air
    state:
      design:
        temperature: {value: 412.4, provenance: assumed, source: "scripts/balance.py: adiabatic compression to 260 kPa(a) at an isentropic efficiency of 0.80 (D-010)"}
        pressure: {value: 260, provenance: assumed, source: "D-003: 239 kPa(a) at the reactor inlet (SRC-1's 20 psig) and about 20 kPa for the feed train, ASSUMED"}
        flow: {value: 90120.8, provenance: calculated, source: 'cheme process propagate: pass-through K102 from S3', fingerprint: 7af491c31db2cead}
        composition: {basis: mole_fraction, values: {N2: 0.767598, O2: 0.205908, AR: 0.009182, H2O: 0.017312}, provenance: calculated, source: 'cheme process propagate: pass-through K102 from S3', fingerprint: 7af491c31db2cead}
  - id: S5
    title: Reactor feed (1.8 mol% butane)
    from: M103.out
    to: R201.in
    template: reactor_gas
    state:
      design:
        temperature: {value: 407.0, provenance: assumed, source: "scripts/balance.py: adiabatic mixing of S2 and S4 (D-010)"}
        pressure: {value: 239, provenance: given, source: "SRC-1 (US 7 589 217 B2): pilot inlet 20 psig"}
        flow: {value: 93457.9, provenance: calculated, source: 'cheme process propagate: mixer M103 from S2 S4', fingerprint: d00ac368225281b9}
        composition: {basis: mole_fraction, values: {NC4: 0.018, N2: 0.753781, O2: 0.202202, AR: 0.00901672, H2O: 0.0170004}, provenance: calculated, source: 'cheme process propagate: mixer M103 from S2 S4', fingerprint: 3ca6709c053208ec}
  - id: S6
    title: Reactor gas
    from: R201.out
    to: E202.in
    template: reactor_gas
    state:
