# The equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps,
# with the sizes the balance gives (DESIGN.md D-003 to D-010). Design pressures, temperatures
# and materials are not set yet (basic engineering). All sizes ASSUMED unless a source is named.
schema: cheme/equipment/v1
equipment:
  - {tag: E-101, type: TubularHeatExchanger, service: "Butane vaporiser on LP steam",
     notes: "387.6 kW (Q1): liquid n-butane from storage vaporised at 400 kPa(a) (saturation 315.1 K) and superheated to 333 K on LP steam 450 kPa(a); knock-out of heavy residues to the oxidiser not modelled (D-003, D-010)."}
  - {tag: K-102, type: CentrifugalCompressor, service: "Process air compressor",
     notes: "90.1 t/h of humid air from 101.3 to 260 kPa(a), 3035 kW at the motor (P1; isentropic efficiency 0.80, ASSUMED); intake filter; SRC-3's once-through example compresses 74.9 t/h to 355 kPa(a) for 3283 kW. A steam turbine drive on the exported HP steam is the usual alternative, not chosen (D-010)."}
  - {tag: M-103, type: StaticMixer, service: "Butane and air mixer",
     notes: "Butane vapour injected into the compressed air to 1.8 mol% (SRC-1), above butane's lower flammable limit of 1.4 vol% in air (IEC 60079-20-1 via chemicals 1.5.2): the feed is flammable from M-103 to R-201's outlet; butane-to-air ratio controlled with a trip on high ratio and on low air flow, an analyser on the reactor feed, no ignition source in the feed train (D-011)."}
  - {tag: R-201, type: Reactor, service: "Multitubular fixed-bed reactor, VPO catalyst, molten-salt cooled, with the salt circulation pump and the salt-cooled steam generator",
     notes: "About 39 m3 of catalyst at SRC-1's GHSV of 1850 h-1 for 71 500 Nm3/h of feed; as SRC-1's pilot tube (21.2 mm inside, 4.57 m of catalyst, 1.6 L each) about 24 000 tubes (ASSUMED, D-005); salt (nitrate-nitrite eutectic, SRC-1) at 675 K on the shell, hot spot 30 to 60 K above it (SRC-1); 10.5 MW (Q2, core's conversion step) raised as HP steam 4500 kPa(a) in the salt cooler; feed inlet 239 kPa(a) (SRC-1). Rupture discs on the inlet and outlet heads for a deflagration of the feed (D-011)."}
  - {tag: E-202, type: TubularHeatExchanger, service: "Reactor gas cooler: HP steam generator and boiler feed-water preheater",
     notes: "7.53 MW (Q3): the reactor gas from 683 to 423 K, HP steam above about 551 K and the feed water preheated below; the gas stays above the dew point of MA and water (no fouling by condensed MA or maleic acid, D-007, D-010)."}
  - {tag: A-301, type: ProcessColumn, service: "Absorber: MA taken up from the reactor gas in lean dibutyl phthalate",
     notes: "93.5 t/h of gas at 423 K and about 130 kPa(a) with 15.3 t/h of lean solvent at 307 K, 4.8 kg per kg of MA in the gas; 20 trays as SRC-2's example; rich solvent out at 376 K, off-gas at 331 K to F-501; 99.4 % of the MA absorbed (SRC-2, D-007)."}
  - {tag: T-302, type: ProcessColumn, service: "Vacuum stripper: crude MA side draw, lights to the vacuum system, lean solvent from the bottom",
     notes: "12 trays as SRC-2's example; condenser at about 341 K and 6.7 kPa(a), external reflux 2, reboiler at 519 K and 11.6 kPa(a) on HP steam (Q4 2027 kW, a fired or hot-oil reboiler needs to be checked against the 531 K steam's 12 K approach); crude drawn near the top and cooled to 348 K; liquid-ring vacuum pump (P2); the lean solvent's tars removed in a side-stream solvent still and filter (SRC-2: about 10 % of the solvent), modelled as a 0.1 % purge to F-501 (D-007)."}
  - {tag: V-304, type: Tank, service: "Lean solvent tank with the dibutyl phthalate make-up",
     notes: "Hold-up for the solvent loop, about 30 m3 (2 h of circulation, ASSUMED); make-up 17.0 kg/h (D-007)."}
  - {tag: E-305, type: TubularHeatExchanger, service: "Lean solvent cooler on cooling water",
     notes: "1803 kW (Q6): the lean solvent from 519 to 307 K; a lean/rich interchanger would recover part of it and of Q4 (not in the concept balance, D-010)."}
  - {tag: C-401, type: ProcessColumn, service: "Vacuum distillation of the crude MA",
     notes: "About 13 kPa(a) and 413 K at the top (SRC-2: about 100 torr and 140 C), reflux 1.5 (ASSUMED), reboiler on HP steam (Q7 1324 kW), condenser on tempered cooling water above MA's 326 K melting point (Q8 1303 kW); lights and residue to F-501; product molten at 343 K to storage (D-008)."}
  - {tag: F-501, type: Furnace, service: "Thermal oxidiser with waste-heat boiler and economiser",
     notes: "90.3 t/h of off-gas with the stripper's and the column's lights and residues and the solvent purge; butane, CO and the organics burnt (destruction 99.8 to 99.99 %, ASSUMED); 8.36 MW (Q9, core's conversion step) raised as HP steam with the flue gas cooled to 453 K; induced-draught fan (P4). The off-gas's heat of combustion keeps it burning without support fuel in normal operation; start-up fuel not modelled (D-009)."}
