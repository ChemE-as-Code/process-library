# maleic-anhydride-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# The preliminary LCI leaves most backgrounds unmapped (DESIGN.md D-012): the build reports each
# as a gap (lci/gaps.json). Linked here: the LP and HP steam the plant draws, counted as heat
# delivered (kWh), as oxalyl-chloride-1 and nitric-acid-1 count steam. n-Butane and dibutyl
# phthalate stay gaps: no library process makes them (CONTRIBUTING, "Gaps").
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:LPS": {use: steam-heat, source: "LP steam 450 kPa(a) to the butane vaporiser E-101 (Q1), counted as heat delivered (kWh), D-010"}
  "feed:HPSI": {use: steam-heat, source: "HP steam 4500 kPa(a) to the stripper and column reboilers (Q4, Q7), counted as heat delivered (kWh), D-010"}
