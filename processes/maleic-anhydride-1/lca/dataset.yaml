- key: emission-excluded:storage-breathing
  title: storage-tank emissions of the plant
  direction: output
  reason: The butane storage (pressurised), the molten MA and the solvent tanks' breathing are outside
    the balance; the MA tank is vented to the oxidiser (D-009).
- key: emission-excluded:wastewater
  title: effluent emissions of the plant
  direction: output
  reason: 'No aqueous effluent in normal operation: the water formed leaves with the off-gas and the lights
    to the oxidiser (D-007, D-009); boiler blowdown belongs to the steam system.'
