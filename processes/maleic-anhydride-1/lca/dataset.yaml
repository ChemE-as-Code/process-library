allocation:
  method: shares
  coproducts:
  - MAP
  - HPS
  shares:
    MAP: 1.0
    HPS: 0.0
  source: 'D-012: the exported HP steam (4500 kPa(a)) is the only co-product. All burdens are given to
    the maleic anhydride; the steam leaves without a burden and without a credit (conservative for the
    anhydride), as nitric-acid-1 and sulfuric-acid-1 do.'
  deviation: 'The library hierarchy allocates exported steam by energy or exergy (docs/system-model.md).
    Energy allocation on the anhydride''s heating value against the steam''s heat, or a credit for the
    avoided boiler steam (system expansion), would lower the anhydride''s burden markedly: the plant exports
    about 7.4 kWh of net HP steam per kg (8.46 raised less 1.07 drawn back for the reboilers). Shares
    1/0 are the conservative choice until the receiving site and its steam are known.'
