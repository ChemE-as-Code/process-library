title: Maleic anhydride by n-butane oxidation over VPO in a fixed bed, molten-salt cooling with steam
  raising, dibutyl phthalate absorption and vacuum distillation (25 kt/a)
description: Unallocated foreground LCI of Maleic anhydride by n-butane oxidation over VPO in a fixed
  bed, molten-salt cooling with steam raising, dibutyl phthalate absorption and vacuum distillation (25
  kt/a), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: n-Butane (1.8 mol% in humid air, 239 kPa(a)) over a VPO catalyst in a multitubular fixed-bed
  reactor with molten salt at 675 K, 81 % conversion and 69.5 % molar selectivity (US 7 589 217 B2); HP
  steam raised from the salt, the reactor gas and the thermal oxidiser; the anhydride absorbed in dibutyl
  phthalate (99.4 %), stripped under vacuum and distilled under vacuum (US 4 118 403 A); 25 kt/a in 8000
  h
