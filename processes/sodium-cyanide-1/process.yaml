# Process Atlas manifest of sodium-cyanide-1. Schema: schemas/process.schema.json (cheme-as-code/process/v1).
# plant.yaml stays the engineering manifest; sheets and results are derived from the
# ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: sodium-cyanide-1
title: Solid sodium cyanide from Andrussow HCN (6.25 t/h, 50 kt/a)
summary: >-
  Methane, ammonia and air react over a Pt/Rh gauze to HCN (Andrussow); unconverted ammonia is
  recovered and recycled, HCN is absorbed in chilled water, refined and neutralised with caustic
  soda, and sodium cyanide is crystallised under vacuum and dried. The tail gas raises steam.
  Concept stage, assumed basis, preliminary gate-to-gate inventory.
description: |
  An air-operated Andrussow converter (Pt/Rh 90/10 gauze, adiabatic, about 1430 K) converts a
  methane-ammonia-air mixture at the feed ratios of an open patent example (O2/NH3 1.15,
  CH4/NH3 0.98) with an HCN yield of 62.9 % on the ammonia fed; the by-products follow a
  published commercial converter-gas composition. A waste heat boiler raises MP steam, an
  ammonium phosphate absorber/stripper recycles 99 % of the unconverted ammonia, and HCN is
  absorbed in chilled water to 2.5 wt% and rectified to 99.5 wt%. Liquid HCN reacts with 50 wt%
  caustic soda; the 45 wt% NaCN solution is crystallised at 70 C and 100 mm Hg, centrifuged and
  dried to 98 wt% NaCN. The hydrogen- and CO-bearing tail gas is burned in a boiler, which is the
  plant's single emission point to air.

  All values are concept estimates. The converter yield and feed ratios are taken from
  US 6,596,251 B2 and the converter-gas by-products and crystalliser conditions from
  US 4,847,062 A; the absorption, stripping, crystallisation and duty values come from an
  independent script, because no property package is qualified by ChemE-as-Code for aqueous
  HCN/NH3 or the NaCN/NaOH electrolyte; see DESIGN.md of the engineering files.
families: [inorganic-chemicals]
keywords: [sodium cyanide, hydrogen cyanide, HCN, Andrussow, platinum-rhodium gauze, ammonia recycle, ammonium phosphate, absorption, neutralisation, caustic soda, evaporative crystallisation, gold mining]
facets:
  feedstock_basis: [fossil]
  product_classes: [chemicals]
  unit_operations: [reaction, compression, heat-exchange, absorption, stripping, distillation, crystallisation, drying, combustion]
  region: generic
# Honest claim: concept is the lowest level of the manifest; cheme maturity reports calculation
# maturity none (feeds assumed, separations specified), see validation.notes and DESIGN.md D-011.
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD with closed mass, component and element balances (cheme validate: 0 errors;
    cheme process streams: every block and step balanced). The converter outlet is calculated by
    cheme from conversions that reproduce a sourced HCN yield and a sourced converter-gas
    composition, and its adiabatic energy balance closes (duty 0.06 kW at 1429 K). Capacity,
    feed states, recoveries, the crystalliser and every duty are ASSUMED or come from
    scripts/nacn_balance.py; no property package covers HCN at converter temperature, aqueous
    HCN/NH3 or the NaCN/NaOH electrolyte, and cheme's crystallizer refuses the free NaOH, so
    energy closure of the separations is not evaluable in core. cheme maturity: calculation
    maturity none. Not reviewed. Main products and feeds are listed under chemistry with their
    chemicals registry entries (issue #251).
chemistry:
  inputs:
    - {chemical: ammonia, role: feedstock, note: "feed:NH3F: liquid ammonia from the ammonia plant (ammonia-1), 0.437 kg/kg NaCN"}
    - {chemical: sodium-hydroxide, role: feedstock, note: "feed:NAOHF: caustic soda 50 wt% from the chlor-alkali plant (chlor-alkali-1), counted by mass of the solution"}
    - {chemical: methane, role: feedstock, inventory_key: "feed:NG", note: "Natural gas modelled as methane (ASSUMED)"}
    - {chemical: air, role: feedstock, inventory_key: "feed:AIR", note: "Process air of the converter (oxygen source); combustion air of the tail gas boiler is feed:BAIR"}
  outputs:
    - {chemical: sodium-cyanide, role: main-product, inventory_key: "product:NACN", note: "Solid sodium cyanide (98 wt%) to packing"}
    - {chemical: carbon-dioxide, role: emission, inventory_key: "product:STACK", note: "Fossil CO2 of the tail gas boiler flue gas, 0.49 kg per kg product"}
    - {chemical: wastewater, role: waste, inventory_key: "product:WW", note: "Process water with traces of HCN and ammonia to cyanide destruction and wastewater treatment"}
    # No inventory_key: the export (product:MPSX, 1500 kPa(a) saturated) is not offered as an
    # Atlas steam producer (the same choice as aniline-1 made for its steam export).
    - {chemical: steam, role: co-product, note: "MP steam 1500 kPa(a) from the waste heat boiler and the tail gas boiler, net of the plant's own use (product:MPSX). Upper bound: adiabatic converter, no converter, waste heat boiler or tail gas boiler losses; probably 15-20 % lower (DESIGN.md D-010)"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "Air blower K-101 and an ASSUMED lump for pumps, vacuum pumps, centrifuge, dryer and briquetting; the chiller power (about 0.8-1.2 MW for 4.8 MW of chilled water) is not included, it belongs to the chilled-water background (DESIGN.md D-010)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "25/35 C (ASSUMED)"}
    - {chemical: chilled-water, role: utility, inventory_key: "product:CHW", note: "2/10 C (ASSUMED), HCN absorber and lean water chiller; the chiller power is carried by this background, not by feed:POWER"}
basis:
  capacity: "6.25 t/h solid NaCN (98 wt%), 50 kt/a (ASSUMED)"
  operating_hours_per_year: 8000
  location: generic (not chosen)
references:
  - {title: "Degussa AG (2003) Hydrogen cyanide synthesis process. US 6,596,251 B2", url: "https://patents.google.com/patent/US6596251"}
  - {title: "E. I. du Pont de Nemours and Company (1989) Process for production of sodium cyanide. US 4,847,062 A", url: "https://patents.google.com/patent/US4847062A/en"}
  - {title: "Cyano Compounds, Inorganic. Ullmann's Encyclopedia of Industrial Chemistry (Wiley-VCH); route reference lead, not read in this run", doi: 10.1002/14356007.a08_159.pub2}
lca:
