# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Solid sodium cyanide from Andrussow HCN (DESIGN.md D-001). Where the values come from:
# - feeds S1, S2, S3, S20, S30 and every temperature and pressure: design basis (D-002, D-003,
#   D-005), ASSUMED; the feed flows follow from the 6.25 t/h product (scripts/nacn_balance.py);
# - converter R-101: conversion reactor whose conversions reproduce the sourced HCN yield of
#   US 6,596,251 B2 and the converter-gas composition of US 4,847,062 A (D-004); its outlet S6
#   is calculated by `cheme process propagate`;
# - flows and compositions through the blower, vaporiser, waste heat boiler, mixer, lean water
#   chiller and splitter, the neutraliser, the crystalliser (cheme's crystallizer model) and
#   the tail gas boiler are calculated by `cheme process propagate --fill`;
# - the absorber/stripper outlets (C-101, C-201, C-202), the dryer and all duties come from
#   scripts/nacn_balance.py, given here as ASSUMED: core has no qualified model for aqueous
#   HCN/NH3 absorption or the NaCN/NaOH electrolyte (D-011).
schema: cheme/process/v1
kind: flowsheet
title: Solid sodium cyanide from Andrussow HCN (6.25 t/h NaCN)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 6.25 t/h solid NaCN (98 wt%), air-operated Andrussow converter at the feed ratios of US 6,596,251 B2 run 1, ammonia recycle, HCN refined before neutralisation (D-002)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: NG, title: Natural gas (as methane) from the site grid, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NH3F, title: Liquid ammonia from the ammonia plant (ammonia-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AIR, title: Process air (ambient), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NAOHF, title: Caustic soda 50 wt% from the chlor-alkali plant (chlor-alkali-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: BAIR, title: Combustion air of the tail gas boiler (ambient), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: k101, direction: out, kind: energy}
      - {id: misc, direction: out, kind: energy}
products:
  - {id: NACN, title: Solid sodium cyanide (98 wt%) to packing, category: product, ports: [{id: in, direction: in}]}
  - id: WW
    title: Cyanide- and ammonia-bearing process water to cyanide destruction and wastewater treatment
    category: wastewater
    ports: [{id: c101, direction: in}, {id: c202, direction: in}, {id: cond, direction: in}]
  - {id: STACK, title: Flue gas of the tail gas boiler to atmosphere, category: emission, ports: [{id: in, direction: in}]}
  - id: MPSX
    title: MP steam export (1500 kPa(a)), net of the plant's own steam use
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1500, provenance: assumed, source: "design basis, D-010"}
      supply_temperature: {value: 471.4, provenance: assumed, source: "saturation at 1500 kPa(a), D-010"}
      min_approach: {value: 20, provenance: assumed, source: D-010}
    ports: [{id: e101, direction: in, kind: energy}, {id: b301, direction: in, kind: energy}]
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-010"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-010"}
      min_approach: {value: 5, provenance: assumed, source: D-010}
    ports:
      - {id: c101, direction: in, kind: energy}
      - {id: c201, direction: in, kind: energy}
      - {id: c202, direction: in, kind: energy}
      - {id: r401, direction: in, kind: energy}
      - {id: e401, direction: in, kind: energy}
  - id: CHW
    title: Chilled water return (from the site refrigeration plant)
    category: utility
    utility:
      kind: refrigerant
      level: chilled water
      supply_temperature: {value: 275.15, provenance: assumed, source: "design basis, D-010"}
      return_temperature: {value: 283.15, provenance: assumed, source: "design basis, D-010"}
      min_approach: {value: 3, provenance: assumed, source: D-010}
    ports:
      - {id: c201, direction: in, kind: energy}
      - {id: e202, direction: in, kind: energy}

blocks:
  - id: RXN
    title: HCN synthesis (Andrussow converter, waste heat boiler)
    class: ReactingChemicals
    ports:
      - {id: ng, direction: in}
      - {id: nh3, direction: in}
      - {id: air, direction: in}
      - {id: rec, direction: in}
      - {id: gas, direction: out}
      - {id: power_k, direction: in, kind: energy}
      - {id: st_c101, direction: out, kind: energy}
      - {id: st_c202, direction: out, kind: energy}
      - {id: st_cr401, direction: out, kind: energy}
      - {id: st_d401, direction: out, kind: energy}
      - {id: st_x, direction: out, kind: energy}
  - id: NH3R
    title: Ammonia recovery and recycle (ammonium phosphate absorption and stripping)
    class: Absorbing
    ports:
      - {id: gas_in, direction: in}
      - {id: gas_out, direction: out}
      - {id: nh3, direction: out}
      - {id: water, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: HCNR
    title: HCN absorption in water and refining
    class: Absorbing
    ports:
      - {id: gas, direction: in}
      - {id: tailgas, direction: out}
      - {id: hcn, direction: out}
      - {id: purge, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: cw201, direction: out, kind: energy}
      - {id: cw202, direction: out, kind: energy}
      - {id: chw201, direction: out, kind: energy}
      - {id: chw202, direction: out, kind: energy}
  - id: NACNS
    title: Neutralisation, crystallisation and drying
    class: ReactingChemicals
    ports:
      - {id: hcn, direction: in}
      - {id: naoh, direction: in}
      - {id: product, direction: out}
      - {id: cond, direction: out}
      - {id: st_cr, direction: in, kind: energy}
      - {id: st_d, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: cw_r, direction: out, kind: energy}
      - {id: cw_e, direction: out, kind: energy}
  - id: TGB
    title: Tail gas boiler
    class: ReactingChemicals
    ports:
      - {id: tailgas, direction: in}
      - {id: air, direction: in}
      - {id: flue, direction: out}
      - {id: steam, direction: out, kind: energy}

steps:
  # ---- RXN
  - id: E001
    block: RXN
    title: Ammonia vaporiser
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-001}]
    ports:
      - {id: in, direction: in, delegates: nh3}
      - {id: out, direction: out}
      - {id: steam, direction: in, kind: energy}
  - id: K101
    block: RXN
    title: Process air blower
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in, delegates: air}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power_k}
  # D-005: methane, ammonia (fresh and recycled) and air are mixed below the gauze; the mixture
  # lies inside the flammable range and is handled as such (inherent-safety note, D-005).
  - id: M101
    block: RXN
    title: Converter feed mixer
    class: Mixing
    symbol: STATIC_MIXER_SHAPE
    links: [{target: equipment, ref: M-101}]
    ports:
      - {id: ng, direction: in, delegates: ng}
      - {id: nh3, direction: in}
      - {id: air, direction: in}
      - {id: rec, direction: in, delegates: rec}
      - {id: out, direction: out}
  # D-004: Pt/Rh gauze, adiabatic, conversions on the inlet flow of each key (reactions.yaml).
  - id: R101
    block: RXN
    title: Andrussow converter (Pt/Rh gauze)
    class: ReactingChemicals
    reactions: [ANDRUSSOW, NH3_DEC, CH4_REF, CH4_COMB, H2_OX]
    reactor: conversion
    catalyst: PT_RH_HCN
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: E101
    block: RXN
    title: Waste heat boiler (MP steam)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: gas}
      - {id: e001, direction: out, kind: energy}
      - {id: c101, direction: out, kind: energy, delegates: st_c101}
      - {id: c202, direction: out, kind: energy, delegates: st_c202}
      - {id: cr401, direction: out, kind: energy, delegates: st_cr401}
      - {id: d401, direction: out, kind: energy, delegates: st_d401}
      - {id: exp, direction: out, kind: energy, delegates: st_x}
  # ---- NH3R (D-006): absorber, phosphate solution stripper and ammonia column, lumped
  - id: C101
    block: NH3R
    title: Ammonia absorber, stripper and ammonia column (lumped)
    class: Absorbing
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: in, direction: in, delegates: gas_in}
      - {id: gas, direction: out, delegates: gas_out}
      - {id: nh3, direction: out, delegates: nh3}
      - {id: water, direction: out, delegates: water}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  # ---- HCNR (D-007)
  - id: C201
    block: HCNR
    title: HCN absorber (chilled water)
    class: Absorbing
    links: [{target: equipment, ref: C-201}]
    ports:
      - {id: gas, direction: in, delegates: gas}
      - {id: lean, direction: in}
      - {id: tail, direction: out, delegates: tailgas}
      - {id: rich, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw201}
      - {id: chw, direction: out, kind: energy, delegates: chw201}
  - id: C202
    block: HCNR
    title: HCN stripper and rectifier
    class: Distilling
    links: [{target: equipment, ref: C-202}]
    ports:
      - {id: feed, direction: in}
      - {id: hcn, direction: out, delegates: hcn}
      - {id: bot, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: cw, direction: out, kind: energy, delegates: cw202}
  - id: E202
    block: HCNR
    title: Lean water chiller
    class: Cooling
    links: [{target: equipment, ref: E-202}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: chw, direction: out, kind: energy, delegates: chw202}
  - id: SPL201
    block: HCNR
    title: Lean water / process water purge split
    class: SplittingMaterial
    split: {lean: 0.973457, purge: 0.026543}
    ports:
      - {id: in, direction: in}
      - {id: lean, direction: out}
      - {id: purge, direction: out, delegates: purge}
  # ---- NACNS (D-008)
  - id: R401
    block: NACNS
    title: Neutraliser (HCN + NaOH)
    class: ReactingChemicals
    reactions: [NEUTR]
    reactor: conversion
    links: [{target: equipment, ref: R-401}]
    ports:
      - {id: hcn, direction: in, delegates: hcn}
      - {id: naoh, direction: in, delegates: naoh}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw_r}
  - id: CR401
    block: NACNS
    title: Vacuum evaporative crystalliser with centrifuge (mother liquor recycled)
    class: SeparatingByThermalProcess
    links: [{target: equipment, ref: CR-401}]
    # cheme's crystallizer model (one solute, one solvent) refuses the free NaOH of the liquor
    # (cheme.process-propagate-crystallizer), so the outlets are the script's (D-008, D-011):
    # mother liquor saturated at 0.80 kg NaCN/kg water at 343 K, all filtrate recycled (no
    # purge; the free NaOH leaves with the cake liquor), cake with 10 wt% liquor.
    reactions: [NACN_CRYST]
    ports:
      - {id: feed, direction: in}
      - {id: cake, direction: out}
      - {id: vap, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: st_cr}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: D401
    block: NACNS
    title: Indirect (steam) vacuum dryer and briquetting
    class: Drying
    reactions: [NACN_CRYST]
    links: [{target: equipment, ref: DR-401}]
    ports:
      - {id: in, direction: in}
      - {id: prod, direction: out, delegates: product}
      - {id: vap, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: st_d}
  - id: E401
    block: NACNS
    title: Crystalliser and dryer vapour condenser
    class: Cooling
    links: [{target: equipment, ref: E-401}]
    ports:
      - {id: vap1, direction: in}
      - {id: vap2, direction: in}
      - {id: out, direction: out, delegates: cond}
      - {id: cw, direction: out, kind: energy, delegates: cw_e}
  # ---- TGB (D-009)
  - id: B301
    block: TGB
    title: Tail gas boiler (MP steam)
    class: ReactingChemicals
    reactions: [H2_COMB, CO_COMB, CH4_BURN, HCN_COMB]
    reactor: conversion
    links: [{target: equipment, ref: B-301}]
    ports:
      - {id: tail, direction: in, delegates: tailgas}
      - {id: air, direction: in, delegates: air}
      - {id: flue, direction: out, delegates: flue}
      - {id: steam, direction: out, kind: energy, delegates: steam}

streams:
  - id: S1
    title: Natural gas (methane)
    from: NG.out
    to: M101.ng
    template: gas
    state:
      design:
        pressure: {value: 400, provenance: assumed, source: "design basis: site gas header (D-003)"}
        temperature: {value: 298.15, provenance: assumed, source: D-003}
        flow: {value: 3128.57, basis: mass, provenance: assumed, source: "scripts/nacn_balance.py: CH4/NH3 0.98 mol/mol at the converter inlet, US 6,596,251 B2 Table 2 run 1 (D-004)"}
        composition: {basis: mole_fraction, values: {CH4: 1.0}, provenance: assumed, source: "D-003: natural gas modelled as methane"}
  - id: S2
    title: Fresh liquid ammonia
    from: NH3F.out
    to: E001.in
    template: gas
    state:
      design:
        pressure: {value: 1100, provenance: assumed, source: "design basis (D-003)"}
        temperature: {value: 298.15, provenance: assumed, source: D-003}
        flow: {value: 2733.80, basis: mass, provenance: assumed, source: "scripts/nacn_balance.py: converter NH3 less the recycle S9 (D-004, D-006)"}
        composition: {basis: mole_fraction, values: {NH3: 1.0}, provenance: assumed, source: "D-003: anhydrous ammonia"}
  - id: S2B
    title: Ammonia vapour
    from: E001.out
    to: M101.nh3
    template: gas
    state:
      design:
        pressure: {value: 1050, provenance: assumed, source: D-005}
        temperature: {value: 313.15, provenance: assumed, source: D-005}
        flow: {value: 2733.8, basis: mass, provenance: calculated, source: 'cheme process propagate: pass-through E001 from S2', fingerprint: 1e324f2c4a54ba14}
        composition: {basis: mole_fraction, values: {NH3: 1.0}, provenance: calculated, source: 'cheme process propagate: pass-through E001 from S2', fingerprint: 1e324f2c4a54ba14}
  - id: S3
    title: Process air
    from: AIR.out
    to: K101.in
    template: gas
    state:
      design:
        pressure: {value: 101.325, provenance: assumed, source: D-003}
        temperature: {value: 298.15, provenance: assumed, source: D-003}
        flow: {value: 31439.59, basis: mass, provenance: assumed, source: "scripts/nacn_balance.py: O2/NH3 1.15 mol/mol at the converter inlet, US 6,596,251 B2 Table 2 run 1 (D-004)"}
        composition: {basis: mole_fraction, values: {O2: 0.21, N2: 0.79}, provenance: assumed, source: "D-003: dry air, argon lumped with nitrogen"}
  - id: S4
    title: Compressed air
    from: K101.out
    to: M101.air
    template: gas
    state:
      design:
        pressure: {value: 180, provenance: assumed, source: D-005}
        temperature: {value: 369.1, provenance: assumed, source: "scripts/nacn_balance.py: isentropic efficiency 0.75 (D-005)"}
        flow: {value: 31439.59, basis: mass, provenance: calculated, source: 'cheme process propagate: pass-through K101 from S3', fingerprint: 1113a63f87275054}
        composition: {basis: mole_fraction, values: {O2: 0.21, N2: 0.79}, provenance: calculated, source: 'cheme process propagate: pass-through K101 from S3', fingerprint: 1113a63f87275054}
  - id: S9
    title: Recovered ammonia (recycle)
    from: C101.nh3
    to: M101.rec
    template: gas
    state:
      design:
        pressure: {value: 200, provenance: assumed, source: D-006}
        temperature: {value: 313.15, provenance: assumed, source: D-006}
        flow: {value: 662.22, basis: mass, provenance: assumed, source: "scripts/nacn_balance.py: 99 % of the converter outlet NH3 recovered (D-006)"}
        composition: {basis: mole_fraction, values: {NH3: 0.99, H2O: 0.01}, provenance: assumed, source: "D-006: ammonia column overhead, 1 mol% water"}
  - id: S5
    title: Converter feed
    from: M101.out
    to: R101.in
    template: gas
    state:
      design:
        pressure: {value: 170, provenance: assumed, source: D-005}
        temperature: {value: 349.34, provenance: assumed, source: "scripts/nacn_balance.py: adiabatic mixing, no preheat (D-005)"}
        flow: {value: 37964.2, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S2B S4 S9', fingerprint: 9f5d7ce69c5f1d7f}
        composition: {basis: mole_fraction, values: {CH4: 0.1314, NH3: 0.134081, O2: 0.154194, N2: 0.580063, H2: 0.0, CO: 0.0, CO2: 0.0, HCN: 0.0, H2O: 0.000261846}, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S2B S4 S9', fingerprint: 4e2c55084a2ecdc7}
  - id: S6
    title: Converter gas
    from: R101.out
    to: E101.in
    template: gas
    state:
      design:
        pressure: {value: 160, provenance: assumed, source: D-005}
        temperature: {value: 1429.24, provenance: assumed, source: "scripts/nacn_balance.py: adiabatic outlet from the ideal-gas data of materials.yaml, no heat loss (D-004)"}
        flow: {value: 37964.2, provenance: calculated, source: 'cheme process propagate: reactor R101 from S5', fingerprint: da45998f5f6eeaf4}
        composition: {basis: mole_fraction, values: {CH4: 0.00136787, NH3: 0.0231879, O2: 0.000137098, N2: 0.524111, H2: 0.110935, CO: 0.0328315, CO2: 0.00747768, HCN: 0.0746853, H2O: 0.225266}, provenance: calculated, source: 'cheme process propagate: reactor R101 from S5', fingerprint: c5583fd3883becff}
  - id: S7
    title: Cooled converter gas
    from: E101.out
    to: C101.in
    template: gas
    state:
      design:
        pressure: {value: 150, provenance: assumed, source: D-005}
        temperature: {value: 523.15, provenance: assumed, source: "D-005: waste heat boiler outlet, inside the 100-400 C quench range named in the Andrussow patents"}
        flow: {value: 37964.2, provenance: calculated, source: 'cheme process propagate: pass-through E101 from S6', fingerprint: 79f8233c544f5081}
        composition: {basis: mole_fraction, values: {CH4: 0.00136787, NH3: 0.0231879, O2: 0.000137098, N2: 0.524111, H2: 0.110935, CO: 0.0328315, CO2: 0.00747768, HCN: 0.0746853, H2O: 0.225266}, provenance: calculated, source: 'cheme process propagate: pass-through E101 from S6', fingerprint: 79f8233c544f5081}
  - id: S8
    title: Ammonia-free gas to the HCN absorber
    from: C101.gas
    to: C201.gas
    template: gas
