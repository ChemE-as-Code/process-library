  - id: S10
    title: Ammonia recovery process water
    from: C101.water
    to: WW.c101
    template: aqueous
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: D-006}
        temperature: {value: 333.15, provenance: assumed, source: D-006}
        flow: {value: 3027.21, basis: mass, provenance: assumed, source: "scripts/nacn_balance.py: water condensed in C-101 with 0.5 % of the converter NH3 (D-006)"}
        composition: {basis: mole_fraction, values: {NH3: 0.001156293, H2O: 0.998843707}, provenance: assumed, source: "scripts/nacn_balance.py (D-006)"}
  - id: S11
    title: Tail gas
    from: C201.tail
    to: B301.tail
    template: gas
    state:
      design:
        pressure: {value: 130, provenance: assumed, source: D-007}
        temperature: {value: 283.15, provenance: assumed, source: D-007}
        flow: {value: 27316.49, basis: mass, provenance: assumed, source: "scripts/nacn_balance.py: 0.1 % of the converter HCN slips, saturated with water at 283 K (D-007)"}
        composition: {basis: mole_fraction, values: {CH4: 0.002001147, O2: 0.000199809, N2: 0.766927803, H2: 0.162330165, CO: 0.048042119, CO2: 0.010941977, HCN: 0.000109287, H2O: 0.009447692}, provenance: assumed, source: "scripts/nacn_balance.py (D-007)"}
  - id: S12
    title: Rich HCN water
    from: C201.rich
    to: C202.feed
    template: aqueous
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: D-007}
        temperature: {value: 288.15, provenance: assumed, source: D-007}
        flow: {value: 137655.57, basis: mass, provenance: assumed, source: "scripts/nacn_balance.py: 2.5 wt% HCN (US 6,596,251 B2 background: 2-3 wt% in the absorber sump, air operation; D-007)"}
        composition: {basis: mole_fraction, values: {HCN: 0.016804398, NH3: 0.000966079, H2O: 0.982229522}, provenance: assumed, source: "scripts/nacn_balance.py (D-007)"}
  - id: S13
    title: Liquid HCN (99.5 wt%)
    from: C202.hcn
