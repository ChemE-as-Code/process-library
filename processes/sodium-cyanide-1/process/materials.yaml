  - {id: aqueous, title: "Aqueous HCN, ammonia and process water", components: [HCN, NH3, H2O]}
  - {id: salt, title: "Caustic, sodium cyanide solution and crystals", components: [NAOH, NACN, NACN_S, H2O, HCN]}
# property_method is a placeholder: no benchmarked package covers the converter gas at 1430 K
# with HCN and water (syngas-pr-vapor has no HCN), the aqueous HCN/NH3 absorption or the
# NaCN/NaOH electrolyte, see DESIGN.md D-011.
property_method:
  adapter: thermo
  status: placeholder
