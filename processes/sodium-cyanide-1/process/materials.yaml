# Components and templates of the process. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
# ideal_gas and critical data: `cheme chemistry thermo NAME --fit 298.15,1500` (chemicals /
# thermo, offline), unchanged, with the method named in each source; CH4, NH3, O2, H2O came with
# `cheme chemistry library hcn_andrussow --add`. The converter runs at about 1430 K, hence the
# heat capacities fitted to 1500 K. The sodium salts (NaOH, NaCN dissolved and solid) carry no
# ideal-gas data: they never enter a gas-phase energy balance, and core has no electrolyte
# property package (DESIGN.md D-011).
schema: cheme/process/v1
kind: materials
components:
