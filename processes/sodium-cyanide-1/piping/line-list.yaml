# Line list. Schema: `cheme schema lines`.
# Concept stage: one line per material stream of the PFD (stream id in the notes), no P&ID yet.
# DN: first-pass size from velocity (DESIGN.md D-010, ASSUMED): gas 20 m/s, liquid 1.5 m/s;
# ideal-gas density, liquid densities ASSUMED (water 1000, caustic 1500, NaCN solution 1300,
# liquid HCN 700, liquid NH3 610 kg/m3); inside diameter rounded up to the next DN, minimum DN25.
# The converter outlet S6 has no line: R-101 is close-coupled to E-101. The internal ammonia
# phosphate and HCN reflux loops are inside the lumped columns. Pressure classes come with the
# pipe specs.
schema: cheme/lines/v1
