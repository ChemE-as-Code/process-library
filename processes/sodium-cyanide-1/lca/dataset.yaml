id: solid-sodium-cyanide-from-andrussow-hcn-6.25-t-h-nacn
title: Solid sodium cyanide from Andrussow HCN (6.25 t/h NaCN)
description: Unallocated foreground LCI of Solid sodium cyanide from Andrussow HCN (6.25 t/h NaCN), case
  design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: air-operated Andrussow converter on Pt/Rh gauze, waste heat boiler, ammonium phosphate ammonia
  recovery and recycle, HCN absorption in chilled water and rectification, neutralisation with 50 wt%
  NaOH, vacuum evaporative crystallisation, steam drying, tail gas boiler; 6.25 t/h solid NaCN
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:fugitive-leaks
  title: equipment-leaks emissions of the plant
  direction: output
  reason: 'Not estimated in this preliminary LCI: equipment leaks of HCN, ammonia, methane and CO need
    the component count of the P&IDs (out of scope of this run). Recorded as an open gap for basic engineering,
    not as negligible (HCN is acutely toxic).'
- key: emission-excluded:boiler-nox-co
  title: combustion emissions of B-301
  direction: output
  reason: 'NOx (thermal NOx and the fuel nitrogen of the HCN and NH3 traces) and CO of the tail gas boiler
    are not estimated: no sourced emission factor for a hydrogen-rich, low-calorific tail gas was read
    in this run. Open gap for the next stage, not negligible.'
- key: emission-excluded:vents-and-dust
  title: non-routine emissions of CR-401, DR-401
  direction: output
  reason: The crystalliser vacuum vent (NH3 and HCN from NaCN hydrolysis, which forms the formate of real
    products) and the dryer/briquetting dust filter (NaCN particulate) emit traces not in the flowsheet;
    amounts not known at concept stage. Open gap.
- key: emission-excluded:start-up-and-flaring
  title: flare emissions of the plant
  direction: output
  reason: Converter light-off, gauze changes, trips and relief send HCN-bearing gas to a flare; not part
    of the steady design case and no flare is designed at concept stage. Open gap.
- key: emission-excluded:storage
  title: storage-tank emissions of the plant
  direction: output
  reason: Ammonia, caustic and intermediate HCN/NaCN solution tanks (breathing to a scrubber) are not
    designed at concept stage; liquid HCN is not stored (fed directly to R-401). Open gap.
