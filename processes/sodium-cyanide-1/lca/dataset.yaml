system_model: cutoff
technology_level: current
production_volume:
  amount: 50000000.0
  unit: kg/a
  source: product:NACN per hour x operation.hours_per_year (8000 h/a)
classification:
  isic: '2011'
modelling:
  principle: attributional
  multifunctionality: 'unallocated multi-output dataset; default allocation shares: D-012: the exported
    MP steam (Q8 + Q9, net of the plant''s own steam use) is a co-product of the sodium cyanide. The library
    allocates exported steam by energy or exergy, never by credit; exergy is the intended method, but
    the standard chemical exergy of solid NaCN has not been taken from a source in this run, so the preliminary
    inventory puts all burdens on the NaCN (shares 1/0, conservative for the product) and keeps the unallocated
    result in the comparison. Exergy allocation is an open item for the next stage. The steam export is
    an UPPER BOUND (review 2026-10-28-pfd-lci-review#1, D-010): the converter is adiabatic (1429 K against
    about 1267 K at the sourced gauze), the waste heat boiler E-101 and the tail gas boiler B-301 have
    no radiation or blowdown loss; the export is probably 15-20 % lower. It must be corrected before any
    energy or exergy allocation is applied.'
review:
- type: none
