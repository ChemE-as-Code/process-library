# sodium-cyanide-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# The preliminary LCI leaves every background unmapped (lca/lca.yaml `missing:`); an unmapped
# exchange of this process is a reported gap (ADR 0022). Overrides likely needed when
# the backgrounds are connected (DESIGN.md D-012):
# - product:NACN: the registry has no sodium-cyanide slug yet (to be added in the consolidated
#   chemicals PR);
# - feed:NAOHF: 50 wt% solution counted with its water; the background is per kg NaOH 100 %
#   (a properties_reason or a converted amount when linking chlor-alkali-1);
# - feed:NH3F and feed:NAOHF: link explicitly to ammonia-1 and chlor-alkali-1 (dataset:), not by
#   slug (another producer could be chosen first, as happened for aniline-1's hydrogen);
# - product:MPSX: MP steam co-product counted in kWh of heat (1500 kPa(a) saturated);
# - product:WW, product:CHW, product:CW: the treatment and utility entries of the shared file.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  # Mapping step of 2026-11-01 (ADR 0026): each entry below uses a reference the library already
  # holds. Notes above that call these exchanges unmapped describe the state before it. What is
  # still unmapped is a gap (lci/gaps.json), and this process is marked preliminary.
  "consumable:bfw-export": {use: water, source: "boiler feed water, demineralised; deaeration not counted"}
  "consumable:bfw-makeup": {use: water, source: "boiler feed water, demineralised; deaeration not counted"}
  "disposal:consumable.bfw-makeup": {use: wastewater, source: "blowdown and condensate drains to the site wastewater treatment, by mass"}
  "consumable:pt-rh-gauze": {use: pt-rh-gauze, source: "Pt/Rh 90/10 gauze pack, as nitric-acid-1 counts it"}
  "feed:NAOHF": {dataset: {path: processes/chlor-alkali-1/lca/dataset.yaml, product: "product:NAOH"}, source: "the Atlas producer chlor-alkali-1, caustic soda 50 wt-%, per kg of solution as this exchange counts it, which this feed names (D-012)"}
  "feed:NG": {use: natural-gas, source: "natural gas by mass, taken as methane (the shared unit proxy); not linked to an Atlas producer of the slug methane, which is hda-1's fuel gas", atlas: false}
  "feed:NH3F": {dataset: {path: processes/ammonia-1/lca/dataset.yaml, product: "product:NH3"}, source: "the Atlas producer ammonia-1, liquid ammonia, which this exchange's design names (D-012)"}
