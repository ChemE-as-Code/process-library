      design:
        pressure: {value: 400, provenance: assumed, source: D-003}
        temperature: {value: 313.15, provenance: assumed, source: D-003}
        composition: {basis: mass_fraction, values: {H2SO4: 0.985, H2O: 0.015}, provenance: assumed, source: "D-003: the 98.5 wt% product of sulfuric-acid-1"}
        flow: {value: 57.0137, provenance: calculated, source: 'cheme process propagate: spec acid (S6 H2SO4 per S3 ACH (mole) 1.4)', fingerprint: bdda2b787c12007d}
  - id: S5
