# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Methyl methacrylate by the acetone cyanohydrin (ACH-sulfo) route with sulfuric acid
# regeneration (DESIGN.md D-001):
# - ACH: acetone and HCN react to acetone cyanohydrin over a basic catalyst (R101);
# - AMID: the ACH is amidated in excess sulfuric acid (1.4 mol/mol, D-005) and the mixture is
#   heated in the conversion stage to methacrylamide hydrogen sulfate (R101 lumped as R201); the
#   CO of the lumped loss path leaves in the gas separator (V201);
# - EST: methanol and water are added and the amide esterified to MMA (R301); the crude MMA
#   with the excess methanol, the acetone and part of the water is stripped off (V301); the
#   spent acid (NH4HSO4, H2SO4, water) goes to the SAR plant;
# - PUR: the crude is distilled to pure MMA; the methanol is recycled, a purge of light ends
#   and water goes to the SAR furnace (C401, lumped);
# - SAR: the spent acid, the purge and the CO are burned with natural gas at 1273 K (F501), the
#   gas raises MP steam (E501), is quenched, cleaned and dried (C501), takes converter air
#   (M502), is blown (K502) through the converter (R502) and the SO3 absorbed to 98.5 wt%
#   sulfuric acid (A502, V502), which returns to the amidation (tear S5) with a small make-up
#   from sulfuric-acid-1.
# Where the values come from:
# - temperatures and pressures: design basis and D-004..D-009 (US 2023/0416184 A1 where
#   stated, else ASSUMED);
# - every flow and composition after the feeds: `cheme process propagate --fill` through the
#   conversion reactors (process/reactions.yaml), mixers and component separators
#   (`recovery:`), the two recycles converged at the tears S5 and S11 (core ADR 0060) and the
#   feeds solved by the three design specifications below (core ADR 0070);
# - the follower ratios of the rate spec (HCN, water, natural gas, air) and every duty and
#   power: scripts/mma_balance.py (D-008, D-009), ASSUMED.
schema: cheme/process/v1
kind: flowsheet
title: Methyl methacrylate by the ACH-sulfo route with sulfuric acid regeneration (12.5 t/h MMA)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 12.5 t/h pure MMA (100 kt/a in 8000 h), ACH-sulfo route at the acid ratio and yield of US 2023/0416184 A1 Example A2, spent acid regenerated on site (D-002)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h
# Two recycles (D-010): the regenerated acid S5 (SAR -> amidation; its loop is closed by the
# make-up spec `acid`) and the methanol S11 (purification -> esterification).
tears:
  - stream: S5
    initial: {flow: 18950.0, unit: kg/h, basis: mass_fraction, composition: {H2SO4: 0.985, H2O: 0.015}}
  - stream: S11
    initial: {flow: 770.0, unit: kg/h, basis: mass_fraction, composition: {MEOH: 1.0}}
convergence: {method: wegstein, max_iterations: 300, tolerance: {abs: 1.0e-6, rel: 1.0e-8}}
specs:
  - id: rate
    vary: {stream: S1, initial: 7918.6, with: {S2: 0.465318,S12: 0.644741, S19: 0.360092, S20: 8.450431, S27: 2.109303, S29: 0.468852}}
    target: {stream: S17, quantity: flow, value: 12500, unit: kg/h}
    provenance: assumed
    source: "design basis: 12.5 t/h MMA (D-002); followers in kg per kg acetone from scripts/mma_balance.py: HCN equimolar (D-004; 0.4653194 rounded down, so that R101's HCN, the conversion key, is never short of acetone), water 0.44 kg/kg ACH (D-006), natural gas and air of the adiabatic furnace at 1273 K and 2 mol% O2, converter air for O2/SO2 1.0, absorber water for 98.5 wt% acid (D-008)"
  - id: acid
    vary: {stream: S4, initial: 57.0}
    target: {stream: S6, component: H2SO4, quantity: ratio, per: {stream: S3, component: ACH}, basis: mole, value: 1.4}
    provenance: assumed
    source: "D-005: 1.4 mol H2SO4 per mol ACH at R-201, US 2023/0416184 A1 Example A2 (8100 kg/h H2SO4 for 5000 kg/h ACH, Table 1); the make-up from sulfuric-acid-1 replaces the SO2 lost to the stack"
  - id: methanol
    vary: {stream: S10, initial: 4080.0}
    target: {stream: S13, component: MEOH, quantity: ratio, per: {stream: S13, component: MAM}, basis: mole, value: 1.2}
    provenance: assumed
    source: "D-006: 1.2 mol methanol per mol methacrylamide at R-301, ASSUMED inside the 0.7-1.6 range of US 2023/0416184 A1"

feeds:
  - {id: ACEF, title: Acetone (acetone-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: HCNF, title: "Liquid hydrogen cyanide, stabilised (no library producer, D-003)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: MEOHF, title: Methanol (methanol-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: ACIDF, title: Sulfuric acid 98.5 wt% make-up (sulfuric-acid-1), category: raw_material, ports: [{id: out, direction: out}]}
  - id: PW
    title: Process water (demineralised)
    category: raw_material
    ports: [{id: est, direction: out}, {id: abs, direction: out}]
  - {id: NG, title: Natural gas (as methane) from the site grid, category: raw_material, ports: [{id: out, direction: out}]}
  - id: AIR
    title: Air (ambient)
    category: raw_material
    ports: [{id: furnace, direction: out}, {id: conv, direction: out}]
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: k501, direction: out, kind: energy}
      - {id: k502, direction: out, kind: energy}
      - {id: misc, direction: out, kind: energy}
products:
  - {id: MMAP, title: "Methyl methacrylate (pure, stabilised) to storage", category: product, ports: [{id: in, direction: in}]}
  - {id: STACK, title: Tail gas of the SAR absorber to atmosphere, category: emission, ports: [{id: in, direction: in}]}
  - {id: WW, title: Gas-cleaning condensate (weak acid water) to neutralisation and wastewater treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - id: MPSX
    title: MP steam export (1500 kPa(a)), net of the plant's own steam use
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1500, provenance: assumed, source: "design basis, D-009"}
      supply_temperature: {value: 471.4, provenance: assumed, source: "saturation at 1500 kPa(a), D-009"}
      min_approach: {value: 20, provenance: assumed, source: D-009}
    ports: [{id: e501, direction: in, kind: energy}]
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-009"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-009"}
      min_approach: {value: 5, provenance: assumed, source: D-009}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: r201, direction: in, kind: energy}
      - {id: c401, direction: in, kind: energy}
      - {id: c501, direction: in, kind: energy}
      - {id: a502, direction: in, kind: energy}

blocks:
  - id: ACH
    title: Acetone cyanohydrin synthesis
    class: ReactingChemicals
    ports:
      - {id: acetone, direction: in}
      - {id: hcn, direction: in}
      - {id: ach, direction: out}
      - {id: cw, direction: out, kind: energy}
  - id: AMID
    title: Amidation and conversion in sulfuric acid
    class: ReactingChemicals
    ports:
      - {id: ach, direction: in}
      - {id: makeup, direction: in}
      - {id: regen, direction: in}
      - {id: co, direction: out}
      - {id: liquor, direction: out}
      - {id: cw, direction: out, kind: energy}
  - id: EST
    title: Esterification with methanol and crude MMA stripping
    class: ReactingChemicals
    ports:
      - {id: liquor, direction: in}
      - {id: meoh, direction: in}
      - {id: rec, direction: in}
      - {id: water, direction: in}
      - {id: crude, direction: out}
      - {id: spent, direction: out}
      - {id: steam, direction: in, kind: energy}
  - id: PUR
    title: MMA purification (distillation) and methanol recovery
    class: Distilling
    ports:
      - {id: crude, direction: in}
      - {id: product, direction: out}
      - {id: rec, direction: out}
      - {id: purge, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  # The SAR plant is two blocks: the decomposition reaction H2SO4 -> SO2 + H2O + 1/2 O2 of the
  # furnace is the sum of the contact plant's two reactions reversed, so one block holding all
  # three has no unique extents (D-010).
  - id: SARF
    title: Spent acid decomposition, waste heat boiler and gas cleaning (SAR, hot end)
    class: ReactingChemicals
    ports:
      - {id: spent, direction: in}
      - {id: purge, direction: in}
      - {id: co, direction: in}
      - {id: ng, direction: in}
      - {id: air, direction: in}
      - {id: gas, direction: out}
      - {id: cond, direction: out}
      - {id: st_est, direction: out, kind: energy}
      - {id: st_pur, direction: out, kind: energy}
      - {id: st_x, direction: out, kind: energy}
      - {id: cw_c501, direction: out, kind: energy}
      - {id: p_k501, direction: in, kind: energy}
  - id: SARC
    title: Contact plant and SO3 absorption (SAR, cold end)
    class: ReactingChemicals
    ports:
      - {id: gas, direction: in}
      - {id: secair, direction: in}
      - {id: water, direction: in}
      - {id: acid, direction: out}
      - {id: tail, direction: out}
      - {id: cw_a502, direction: out, kind: energy}
      - {id: p_k502, direction: in, kind: energy}

steps:
  # ---- ACH (D-004)
  - id: R101
    block: ACH
    title: ACH reactor (acetone + HCN, basic catalyst, cooled)
    class: ReactingChemicals
    reactions: [ACH_FORM]
    reactor: conversion
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: acetone, direction: in, delegates: acetone}
      - {id: hcn, direction: in, delegates: hcn}
      - {id: out, direction: out, delegates: ach}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  # ---- AMID (D-005)
  - id: M201
    block: AMID
    title: Acid feed (regenerated acid and make-up)
    class: Mixing
    links: [{target: equipment, ref: T-201}]
    ports:
      - {id: regen, direction: in, delegates: regen}
      - {id: mk, direction: in, delegates: makeup}
      - {id: out, direction: out}
  - id: R201
    block: AMID
    title: Amidation loop reactor and conversion stage (lumped)
    class: ReactingChemicals
    reactions: [AMID, ACH_DEC]
    reactor: conversion
    links: [{target: equipment, ref: R-201}, {target: equipment, ref: R-202}]
    ports:
      - {id: ach, direction: in, delegates: ach}
      - {id: acid, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: V201
    block: AMID
    title: Gas separator after the conversion stage
    class: SeparatingByThermalProcess
    recovery:
      outlets: {gas: {CO: 1.0}}
      provenance: assumed
      source: "D-005: the CO of the lumped loss leaves as gas (US 2023/0416184 A1 Example A2: a gas separator after the conversion stage at about 950 mbar(a) and 155 C); dissolved gas and entrained liquid not modelled"
    links: [{target: equipment, ref: V-201}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out, delegates: co}
      - {id: liq, direction: out, delegates: liquor}
  # ---- EST (D-006)
  - id: M301
    block: EST
    title: Esterification feed (amide liquor, methanol fresh and recycled, water)
    class: Mixing
    ports:
      - {id: liq, direction: in, delegates: liquor}
      - {id: meoh, direction: in, delegates: meoh}
      - {id: rec, direction: in, delegates: rec}
      - {id: water, direction: in, delegates: water}
      - {id: out, direction: out}
  - id: R301
    block: EST
    title: Esterification tank cascade
    class: ReactingChemicals
    reactions: [EST]
    reactor: conversion
    links: [{target: equipment, ref: R-301}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: V301
    block: EST
    title: Crude MMA stripping (steam-heated)
    class: SeparatingByThermalProcess
    recovery:
      outlets: {vap: {MMA: 1.0, MEOH: 1.0, ACETONE: 1.0, H2O: 0.15}}
      provenance: assumed
      source: "D-006: MMA, methanol and acetone stripped completely, 15 % of the water with them: 0.062 kg water per kg MMA in the vapour against 0.060 in US 2023/0416184 A1 Example B1 (stream 12: 5.3 and 87.9 wt%); the rest is the spent acid"
    links: [{target: equipment, ref: R-301}]
    ports:
      - {id: in, direction: in}
      - {id: vap, direction: out, delegates: crude}
      - {id: spent, direction: out, delegates: spent}
      - {id: steam, direction: in, kind: energy, delegates: steam}
  # ---- PUR (D-007)
  - id: C401
    block: PUR
    title: Light-ends and pure MMA columns with methanol recovery (lumped)
    class: Distilling
    recovery:
      outlets: {product: {MMA: 0.99}, rec: {MEOH: 0.95}}
      provenance: assumed
      source: "D-007: 99 % of the MMA to the product, 95 % of the methanol recycled; the rest with the water and acetone to the SAR furnace (US 2023/0416184 A1: at least two distillation steps, part of the light heteroazeotrope discharged)"
    links: [{target: equipment, ref: C-401}, {target: equipment, ref: C-402}]
    ports:
      - {id: feed, direction: in, delegates: crude}
      - {id: product, direction: out, delegates: product}
      - {id: rec, direction: out, delegates: rec}
      - {id: purge, direction: out, delegates: purge}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: cw, direction: out, kind: energy, delegates: cw}
      - {id: power, direction: in, kind: energy, delegates: power}
  # ---- SAR (D-008)
  - id: K501
    block: SARF
    title: Combustion air blower
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-501}]
    ports:
      - {id: in, direction: in, delegates: air}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: p_k501}
  - id: F501
    block: SARF
    title: Spent acid decomposition furnace (natural gas fired)
    class: ReactingChemicals
    reactions: [H2SO4_DEC, AHS_DEC, ACET_COMB, MEOH_COMB, MMA_COMB, CO_COMB, CH4_COMB]
    reactor: conversion
    links: [{target: equipment, ref: F-501}]
    ports:
      - {id: spent, direction: in, delegates: spent}
      - {id: purge, direction: in, delegates: purge}
      - {id: co, direction: in, delegates: co}
      - {id: ng, direction: in, delegates: ng}
      - {id: air, direction: in}
      - {id: out, direction: out}
  - id: E501
    block: SARF
    title: Waste heat boiler (MP steam)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-501}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: est, direction: out, kind: energy, delegates: st_est}
      - {id: pur, direction: out, kind: energy, delegates: st_pur}
      - {id: exp, direction: out, kind: energy, delegates: st_x}
  - id: C501
    block: SARF
    title: Gas quench, cleaning, cooling and drying (lumped)
    class: SeparatingByThermalProcess
    recovery:
      outlets: {cond: {H2O: 1.0}}
      provenance: assumed
      source: "D-008: all water condensed or taken up by the drying acid and sent out as weak acid water; the SO2, SO3 traces and dust it carries are not modelled"
    links: [{target: equipment, ref: C-501}]
    ports:
      - {id: in, direction: in}
      - {id: cond, direction: out, delegates: cond}
      - {id: gas, direction: out, delegates: gas}
      - {id: cw, direction: out, kind: energy, delegates: cw_c501}
  - id: M502
    block: SARC
    title: Converter air addition
    class: Mixing
    ports:
      - {id: gas, direction: in, delegates: gas}
      - {id: air, direction: in, delegates: secair}
      - {id: out, direction: out}
  - id: K502
    block: SARC
    title: SO2 blower
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-502}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: p_k502}
  - id: R502
    block: SARC
    title: Contact converter (V2O5 beds, double contact)
    class: ReactingChemicals
    reactions: [SO2_OX]
    reactor: conversion
    links: [{target: equipment, ref: R-502}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: A502
    block: SARC
    title: SO3 absorbers (intermediate and final)
    class: ReactingChemicals
    reactions: [SO3_ABS]
    reactor: conversion
    links: [{target: equipment, ref: A-502}]
    ports:
      - {id: gas, direction: in}
      - {id: water, direction: in, delegates: water}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw_a502}
  - id: V502
    block: SARC
    title: Absorber acid / tail gas separation
    class: Absorbing
    recovery:
      outlets: {acid: {H2SO4: 1.0, H2O: 1.0}}
      provenance: assumed
      source: "D-008: the acid leaves the absorber sump, the tail gas (unconverted SO2, N2, O2, CO2) the top; acid mist not modelled"
    links: [{target: equipment, ref: A-502}]
    ports:
      - {id: in, direction: in}
      - {id: acid, direction: out, delegates: acid}
      - {id: tail, direction: out, delegates: tail}

streams:
  - id: S1
    title: Acetone
    from: ACEF.out
    to: R101.acetone
    template: organic
    state:
      design:
        pressure: {value: 400, provenance: assumed, source: "design basis (D-003)"}
        temperature: {value: 298.15, provenance: assumed, source: D-003}
        composition: {basis: mass_fraction, values: {ACETONE: 1.0}, provenance: assumed, source: "D-003: acetone from acetone-1, impurities not modelled"}
        flow: {value: 7918.66, provenance: calculated, source: 'cheme process propagate: spec rate (S17 flow kg/h 12500)', fingerprint: bdda2b787c12007d}
  - id: S2
    title: Liquid HCN
    from: HCNF.out
    to: R101.hcn
    template: organic
    state:
      design:
        pressure: {value: 400, provenance: assumed, source: D-003}
        temperature: {value: 283.15, provenance: assumed, source: "D-003: liquid HCN kept below its 298.8 K boiling point"}
        composition: {basis: mass_fraction, values: {HCN: 1.0}, provenance: assumed, source: "D-003: stabilised liquid HCN, the stabiliser not modelled"}
        flow: {value: 3684.7, provenance: calculated, source: 'cheme process propagate: spec rate (0.465318 x S1)', fingerprint: bdda2b787c12007d}
  - id: S3
    title: Acetone cyanohydrin
    from: R101.out
    to: R201.ach
    template: organic
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: D-004}
        temperature: {value: 303.15, provenance: assumed, source: "D-004: ACH reactor kept cool, not sourced"}
        flow: {value: 11603.4, provenance: calculated, source: 'cheme process propagate: reactor R101 from S1 S2', fingerprint: a4ac300edbb21a26}
        composition: {basis: mole_fraction, values: {ACETONE: 4.78159e-07, HCN: 0.0, ACH: 1.0, MAM: 0.0, MMA: 0.0, MEOH: 0.0, H2SO4: 0.0, AHS: 0.0, H2O: 0.0, CO: 0.0, CH4: 0.0, O2: 0.0, N2: 0.0, CO2: 0.0, SO2: 0.0, SO3: 0.0}, provenance: calculated, source: 'cheme process propagate: reactor R101 from S1 S2', fingerprint: 04cffd4cea697f52}
  - id: S4
    title: Sulfuric acid make-up 98.5 wt%
    from: ACIDF.out
    to: M201.mk
    template: acid
