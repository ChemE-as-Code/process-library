# Components and templates of methyl-methacrylate-1. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol (chemicals 1.5.2,
# SRC-5), normal_boiling_point in K at 101.325 kPa (chemicals 1.5.2, CRC tables, SRC-5).
# ideal_gas and critical data only for the gases of the SAR furnace, the waste heat boiler and
# the converter (H2O, N2, O2, CO2, SO2, SO3, CH4, CO): `cheme chemistry thermo NAME --fit
# 298.15,1400` (chemicals / thermo, offline), unchanged, with the method named in each source;
# scripts/mma_balance.py reads their heat capacities for the furnace energy balance (D-008).
# The liquids of the ACH, amidation and esterification sections carry no ideal-gas data: core
# has no property package for 98 wt% sulfuric acid with ammonium hydrogen sulfate and organics
# (L-1), so their energy balances are the script's (D-009).
schema: cheme/process/v1
kind: materials
components:
