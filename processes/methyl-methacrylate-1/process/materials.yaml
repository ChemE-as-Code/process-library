# The templates name the stream families for the drawings; each lists every component, because
# propagate carries every component of a step's inlets (at zero where absent) to its outlets.
templates:
  - {id: organic, title: "Acetone, HCN, acetone cyanohydrin, methanol, crude and pure MMA, purge", components: [ACETONE, HCN, ACH, MAM, MMA, MEOH, H2SO4, AHS, H2O, CO, CH4, O2, N2, CO2, SO2, SO3]}
  - {id: acid, title: "Sulfuric acid, amidation and esterification liquors, spent acid", components: [ACETONE, HCN, ACH, MAM, MMA, MEOH, H2SO4, AHS, H2O, CO, CH4, O2, N2, CO2, SO2, SO3]}
  - {id: gas, title: "Air, natural gas, SAR furnace gas, converter gas, tail gas", components: [ACETONE, HCN, ACH, MAM, MMA, MEOH, H2SO4, AHS, H2O, CO, CH4, O2, N2, CO2, SO2, SO3]}
  - {id: absorber, title: "Absorber outlet: regenerated acid with the tail gas", components: [ACETONE, HCN, ACH, MAM, MMA, MEOH, H2SO4, AHS, H2O, CO, CH4, O2, N2, CO2, SO2, SO3]}
# property_method is a placeholder: no benchmarked package of core covers 98 wt% sulfuric acid
# with ammonium hydrogen sulfate, methacrylamide and organics (L-1, D-009).
property_method:
  adapter: thermo
  status: placeholder
