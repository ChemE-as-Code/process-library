# Process Atlas manifest of methyl-methacrylate-1. Schema: schemas/process.schema.json (cheme-as-code/process/v1).
# plant.yaml stays the engineering manifest; sheets and results are derived from the
# ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: methyl-methacrylate-1
title: Methyl methacrylate by the acetone cyanohydrin route with sulfuric acid regeneration (12.5 t/h, 100 kt/a)
summary: >-
  Acetone and hydrogen cyanide react to acetone cyanohydrin, which is amidated in sulfuric acid
  and esterified with methanol to methyl methacrylate; the crude is distilled, and the spent acid
  (ammonium hydrogen sulfate in sulfuric acid) is burned with natural gas and regenerated to
  sulfuric acid in a contact plant on site. Concept stage, assumed basis, preliminary
  gate-to-gate inventory.
description: |
  The ACH-sulfo route, the process the open patent literature calls the commercial one for MMA
  (US 9,890,105 B2; US 2023/0416184 A1). Acetone (acetone-1) and liquid HCN react to acetone
  cyanohydrin (ACH) over a basic catalyst. The ACH is amidated in 98.5 wt% sulfuric acid at
  1.4 mol per mol, heated in a conversion stage to methacrylamide hydrogen sulfate, and
  esterified with methanol (methanol-1) and water in a tank cascade at about 393 K; 91.6 % of
  the ACH ends up as pure MMA, the yield of the patent's Example A2. The crude MMA is stripped
  off and distilled; the excess methanol is recycled. The spent acid, about 2 kg per kg MMA,
  is decomposed with natural gas at 1273 K together with the light-ends purge, the gas raises
  MP steam, is cleaned and dried, and its SO2 is converted (99.7 %) and absorbed to 98.5 wt%
  acid, which returns to the amidation with a small make-up from sulfuric-acid-1.

  All values are concept estimates. The acid ratio, the conditions and the yield come from
  US 2023/0416184 A1; the split of the losses, the SAR furnace, the duties and the power are
  ASSUMED or come from an independent script (scripts/mma_balance.py), because no property
  package is qualified by ChemE-as-Code for concentrated sulfuric acid with ammonium hydrogen
  sulfate and organics; see DESIGN.md of the engineering files.
families: [oxygenates]
keywords: [methyl methacrylate, MMA, acetone cyanohydrin, ACH, hydrogen cyanide, amidation, methacrylamide, esterification, methanol, sulfuric acid, spent acid regeneration, SAR, ammonium hydrogen sulfate, contact process, acrylic monomer, PMMA]
facets:
  feedstock_basis: [fossil]
  product_classes: [chemicals]
  unit_operations: [reaction, distillation, combustion, heat-exchange, compression, absorption]
  region: generic
# Honest claim: concept is the lowest level of the manifest; the calculation maturity is not
# recorded (no cheme maturity run), see validation.notes and DESIGN.md.
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD with closed mass, component and element balances (cheme validate: 0 errors;
    cheme process streams: every block and step balanced). Every flow after the feeds is
    calculated by cheme process propagate from conversions, recoveries, two recycle tears and
    three design specifications (rate, acid ratio, methanol ratio). The acid ratio, the
    temperatures and the 91.6 % MMA yield on ACH are from US 2023/0416184 A1 Example A2; the
    split of the losses, the recoveries, the SAR furnace and every duty are ASSUMED or come from
    scripts/mma_balance.py (formation enthalpies of the chemicals package); the heats of the
    amidation and esterification in the acid are not sourced (the amidation duty is a lower
    bound). Not reviewed.
chemistry:
  inputs:
    - {chemical: acetone, role: feedstock, inventory_key: "feed:ACEF", note: "Acetone from acetone-1 (cumene-phenol), 0.634 kg/kg MMA"}
    - {chemical: hydrogen-cyanide, role: feedstock, inventory_key: "feed:HCNF", note: "Liquid HCN, 0.295 kg/kg MMA; no library producer exports it (a gap)"}
    - {chemical: methanol, role: feedstock, inventory_key: "feed:MEOHF", note: "Methanol from methanol-1, 0.327 kg/kg MMA"}
    - {chemical: sulfuric-acid, role: feedstock, inventory_key: "feed:ACIDF", note: "98.5 wt% make-up from sulfuric-acid-1, 4.6 g/kg MMA; the 1.5 kg/kg circulating acid is regenerated on site"}
    - {chemical: methane, role: feedstock, inventory_key: "feed:NG", note: "Natural gas modelled as methane, fuel of the SAR furnace, 0.228 kg/kg MMA (ASSUMED adiabatic furnace: a lower bound)"}
    - {chemical: water, role: feedstock, inventory_key: "feed:PW", note: "Demineralised process water to the esterification and the SO3 absorbers"}
    - {chemical: air, role: feedstock, inventory_key: "feed:AIR", note: "Combustion and converter air of the SAR plant"}
  outputs:
    - {chemical: methyl-methacrylate, role: main-product, inventory_key: "product:MMAP", note: "Pure MMA to storage (the functional unit's product)"}
    - {chemical: carbon-dioxide, role: emission, inventory_key: "product:STACK", note: "Fossil CO2 of the SAR tail gas, 0.80 kg per kg MMA; with 2.9 g SO2 per kg MMA"}
    - {chemical: wastewater, role: waste, inventory_key: "product:WW", note: "Gas-cleaning condensate (weak acid water) to neutralisation and treatment, 1.55 kg/kg MMA"}
    # No inventory_key: the export (product:MPSX, 1500 kPa(a) saturated) is not offered as an
    # Atlas steam producer (the choice sodium-cyanide-1 made for its steam export).
    - {chemical: steam, role: co-product, note: "MP steam 1500 kPa(a) from the SAR waste heat boiler, net of the plant's own steam use (product:MPSX, 1.30 kWh/kg MMA). Upper bound: adiabatic furnace, no boiler loss (DESIGN.md D-009)"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "SAR blowers and an ASSUMED lump for pumps, agitators and vacuum, 0.17 kWh/kg MMA"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "25/35 C (ASSUMED), 3.6 kWh of heat per kg MMA"}
