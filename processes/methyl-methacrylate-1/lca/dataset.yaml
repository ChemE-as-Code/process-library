kind: lci_dataset
id: methyl-methacrylate-by-the-ach-sulfo-route-with-sulfuric-acid-regeneration-12.5-t-h-mma
title: Methyl methacrylate by the ACH-sulfo route with sulfuric acid regeneration (12.5 t/h MMA)
description: Unallocated foreground LCI of Methyl methacrylate by the ACH-sulfo route with sulfuric acid
  regeneration (12.5 t/h MMA), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'ACH-sulfo route: acetone + HCN to acetone cyanohydrin (basic catalyst); amidation in 98.5
  wt% sulfuric acid (1.4 mol/mol) and conversion at about 428 K; esterification with methanol and water
  at about 393 K, crude MMA stripped and distilled (91.6 % MMA on ACH); spent acid (NH4HSO4, H2SO4, water)
  and the light-ends purge decomposed with natural gas at 1273 K, waste heat boiler, gas cleaning and
  drying, double-contact converter and SO3 absorption to 98.5 wt% acid recycled to the amidation; 12.5
  t/h MMA'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:fugitive-leaks
  title: equipment-leaks emissions of the plant
  direction: output
  reason: 'Not estimated in this preliminary LCI: equipment leaks of HCN, acetone, methanol, MMA and SO2
    need the component count of the P&IDs (out of scope at concept stage). An open gap, not negligible
    (HCN and ACH are acutely toxic).'
- key: emission-excluded:furnace-nox-acid-mist
  title: combustion emissions of F-501, A-502
  direction: output
  reason: 'NOx of the SAR furnace (thermal NOx and the ammonium nitrogen of the spent acid, which the
    model sends entirely to N2) and sulfuric acid mist of the final absorber are not estimated: no sourced
    emission factor was read in this run. Open gap for the next stage.'
- key: emission-excluded:process-vents
  title: non-routine emissions of R-101, R-201, V-201, R-301, C-401, C-402
  direction: output
  reason: Vents of the ACH reactor, the amidation, the esterification and the columns (to a scrubber or
    the SAR furnace in practice) are not in the flowsheet; amounts not known at concept stage. Open gap.
    The gas separator V-201's off-gas, mainly CO, is in the flowsheet and burned in F-501 (S8); its releases
    on upsets are not estimated.
- key: emission-excluded:storage
  title: storage-tank emissions of the plant
  direction: output
  reason: Acetone, methanol, ACH, MMA and acid tanks (breathing losses) are not designed at concept stage.
    Open gap.
