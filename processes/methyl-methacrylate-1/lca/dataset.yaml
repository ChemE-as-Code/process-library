modelling:
  principle: attributional
  multifunctionality: 'unallocated multi-output dataset; default allocation shares: D-012: the exported
    MP steam (Q9, net of the plant''s own steam use) is a co-product of the MMA. The library allocates
    exported steam by energy or exergy, never by credit; exergy is the intended method, but the standard
    chemical exergy of MMA has not been taken from a source in this run, so the preliminary inventory
    puts all burdens on the MMA (shares 1/0, conservative for the product) and keeps the unallocated result
    in the comparison. The steam export is an UPPER BOUND (adiabatic furnace, no boiler loss, D-009).'
