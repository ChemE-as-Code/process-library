# Goal and scope of the methyl-methacrylate-1 LCA. Schema: `cheme schema lca`. Outputs: `cheme
# assess lca --write` (lca/inventory.csv, results.*, gaps.csv, dataset.yaml, manifest.json);
# never edit those by hand. DESIGN.md D-012.
#
# PRELIMINARY GATE-TO-GATE LCI. Every foreground exchange comes from the balanced flowsheet
# (process/flowsheet.yaml, case design). The backgrounds are left unmapped here (`missing:`):
# the Atlas LCI build links acetone, methanol, the sulfuric acid make-up, natural gas and water
# through lca/mappings.yaml; liquid HCN has no library producer and stays a gap. The plant's own
# emissions to air (the SAR tail gas) are elementary flows from the flowsheet.
schema: cheme/lca/v1
kind: lca
goal: >-
  Preliminary gate-to-gate life cycle inventory of methyl methacrylate by the acetone
  cyanohydrin (ACH-sulfo) route with on-site sulfuric acid regeneration at concept stage: the
  foreground exchanges per kg of MMA at the plant gate, ready to be linked to background
  datasets (acetone from acetone-1, methanol from methanol-1, sulfuric acid from
  sulfuric-acid-1, natural gas, grid power, cooling water, demineralised water, liquid HCN,
  wastewater treatment) (DESIGN.md D-012). Flows are concept estimates.
functional_unit: {product: MMAP, amount: 1, unit: kg, source: "1 kg of pure methyl methacrylate at the plant gate to storage, stream S17 (D-002)"}
boundary: gate-to-gate
case: design
location: GLO      # generic concept design, no site chosen
year: 2026
technology: "ACH-sulfo route: acetone + HCN to acetone cyanohydrin (basic catalyst); amidation in 98.5 wt% sulfuric acid (1.4 mol/mol) and conversion at about 428 K; esterification with methanol and water at about 393 K, crude MMA stripped and distilled (91.6 % MMA on ACH); spent acid (NH4HSO4, H2SO4, water) and the light-ends purge decomposed with natural gas at 1273 K, waste heat boiler, gas cleaning and drying, double-contact converter and SO3 absorption to 98.5 wt% acid recycled to the amidation; 12.5 t/h MMA"
rights: "CC-BY-4.0: the ChemE-as-Code process library's own concept design (LICENSE-DATA)"
allocation:
  method: shares
  coproducts: [MMAP, MPSX]
  shares: {MMAP: 1.0, MPSX: 0.0}
  compare: [none]
  source: >-
    D-012: the exported MP steam (Q9, net of the plant's own steam use) is a co-product of the
    MMA. The library allocates exported steam by energy or exergy, never by credit; exergy is
    the intended method, but the standard chemical exergy of MMA has not been taken from a
    source in this run, so the preliminary inventory puts all burdens on the MMA (shares 1/0,
    conservative for the product) and keeps the unallocated result in the comparison. The
    steam export is an UPPER BOUND (adiabatic furnace, no boiler loss, D-009).
  deviation: >-
    Shares 1/0 instead of the library's exergy allocation of exported steam, because the
    chemical exergy of MMA is not sourced yet (DESIGN.md D-012); the steam then carries no
    burden, which overstates the product's burdens.
flows:
  # ---- inputs
  - key: feed:ACEF
    missing: "background not mapped here; the Atlas build links acetone-1 (lca/mappings.yaml)"
    source: "Acetone (S1, 0.634 kg per kg MMA): the library process acetone-1 (cumene-phenol), product:ACETONE, which allocates between acetone and phenol"
  - key: feed:HCNF
    missing: "no background: no library process exports hydrogen cyanide (sodium-cyanide-1 makes it internally and does not export it); a gap"
    source: >-
      Liquid HCN (S2, 0.295 kg per kg MMA): connect to an Andrussow HCN plant (methane, ammonia
      and air over Pt/Rh; the converter and HCN refining of sodium-cyanide-1 without its
      neutralisation) or to the HCN co-product of an acrylonitrile plant (issue #460), once a
      library dataset exports it.
  - key: feed:MEOHF
    missing: "background not mapped here; the Atlas build links methanol-1 (lca/mappings.yaml)"
    source: "Fresh methanol (S10, 0.327 kg per kg MMA): the library process methanol-1, product:MEOH"
  - key: feed:ACIDF
    missing: "background not mapped here; the Atlas build links sulfuric-acid-1 (lca/mappings.yaml)"
    source: "Sulfuric acid 98.5 wt% make-up (S4, 4.6 g per kg MMA, counted by mass of the acid): the library process sulfuric-acid-1, product:ACID, the same 98.5 wt% basis"
  - key: feed:PW
    missing: "background not mapped here; the Atlas build links demineralised water (lca/mappings.yaml)"
    source: "Process water to the esterification (S12) and to the SO3 absorbers (S29), 0.705 kg per kg MMA"
  - key: feed:NG
    missing: "background not mapped here; the Atlas build links natural gas by mass (lca/mappings.yaml)"
    source: "Natural gas (S19, modelled as methane, 0.228 kg per kg MMA) burned in the SAR furnace F-501; adiabatic furnace, so a LOWER BOUND (D-008)"
  - key: feed:POWER
    missing: "background not mapped here; grid electricity at medium voltage by the shared mapping"
    source: "Electricity for the combustion air blower (Q10), the SO2 blower (Q11) and an ASSUMED 500 kW lump for pumps, agitators and vacuum (Q12)"
  - {key: feed:AIR, free: true, source: "ambient combustion and converter air (S20, S27): a resource without burden; its N2 and unused O2 leave in the tail gas"}
  # ---- outputs
  - key: product:CW
    missing: "background not mapped here; the shared mapping links the Atlas utility-cooling-tower"
    source: "Heat rejected to the site cooling water system (Q1, Q2, Q5, Q7, Q8, 298/308 K)"
  - key: product:WW
    treatment:
      kind: waste
      route: neutralisation of the weak acid condensate, then biological wastewater treatment
      hazardous: false
    missing: "no background: treatment of weak sulfuric/sulfurous acid condensate not mapped yet"
    source: >-
      Gas-cleaning condensate (S24, 1.55 kg per kg MMA): the water of the SAR furnace gas,
      modelled as water only; in a plant it carries dissolved SO2, some H2SO4 and dust, which
      need neutralisation (D-008). A gap rather than the average municipal treatment, which
      would not represent it.
  - {key: product:STACK, emission: true, source: "tail gas of the final SO3 absorber to atmosphere (S32, D-008)"}
  - {key: emission:N2, free: true, source: "atmospheric N2 of the air returned, with the N2 of the ammonium nitrogen, which is not a burden"}
  - {key: emission:O2, free: true, source: "unused O2 of the air returned"}
  - {key: emission:CO2, elementary: {compartment: air, subcompartment: unspecified, origin: fossil}, source: "S32: CO2 of the natural gas fuel and of the organics burned in F-501 (acetone, methanol, MMA, CO from HCN), all of fossil carbon"}
  - {key: emission:SO2, elementary: {compartment: air, subcompartment: unspecified}, source: "S32: the 0.3 % of the regenerated sulfur not converted (D-008), 2.9 g per kg MMA"}
  - {key: emission:H2O, free: true, source: "0 in the dried tail gas; water vapour to air would carry no burden"}
  - {key: emission:H2SO4, elementary: {compartment: air, subcompartment: unspecified}, source: "0 only because complete acid separation is ASSUMED (D-008); acid mist is an emission exclusion"}
  - {key: emission:AHS, elementary: {compartment: air, subcompartment: unspecified}, source: "0: decomposed completely in F-501 (D-008)"}
  - {key: emission:ACH, elementary: {compartment: air, subcompartment: unspecified}, source: "0 (a 1e-17 kg rounding residue of the trace acetone excess of R-101): no ACH reaches the tail gas"}
  - {key: emission:MAM, elementary: {compartment: air, subcompartment: unspecified}, source: "0: methacrylamide is esterified completely in R-301 (D-006)"}
  # components of the tail gas template whose flows are zero in this design (complete
  # conversions ASSUMED, D-008): mapped so that a non-zero value in a later case is
  # characterised, not dropped. NOT ESTIMATED, not measured zeros (emission_exclusions below).
  - {key: emission:CO, elementary: {compartment: air, subcompartment: unspecified, origin: fossil}, source: "0 only because complete combustion in F-501 is ASSUMED (D-008)"}
  - {key: emission:CH4, elementary: {compartment: air, subcompartment: unspecified, origin: fossil}, source: "0 only because complete combustion in F-501 is ASSUMED (D-008)"}
  - {key: emission:SO3, elementary: {compartment: air, subcompartment: unspecified}, source: "0 only because complete SO3 absorption is ASSUMED (D-008); acid mist is an emission exclusion"}
  - {key: emission:HCN, elementary: {compartment: air, subcompartment: unspecified}, source: "0: no HCN reaches the tail gas in the model (R-101 complete, D-004)"}
  - {key: emission:ACETONE, elementary: {compartment: air, subcompartment: unspecified}, source: "0 only because complete combustion in F-501 is ASSUMED (D-008)"}
  - {key: emission:MEOH, elementary: {compartment: air, subcompartment: unspecified}, source: "0 only because complete combustion in F-501 is ASSUMED (D-008)"}
  - {key: emission:MMA, elementary: {compartment: air, subcompartment: unspecified}, source: "0 only because complete combustion in F-501 is ASSUMED (D-008)"}
emission_exclusions:
  - id: fugitive-leaks
    method: equipment-leaks
    reason: >-
      Not estimated in this preliminary LCI: equipment leaks of HCN, acetone, methanol, MMA and
      SO2 need the component count of the P&IDs (out of scope at concept stage). An open gap,
      not negligible (HCN and ACH are acutely toxic).
  - id: furnace-nox-acid-mist
    method: combustion
    equipment: [F-501, A-502]
    reason: >-
      NOx of the SAR furnace (thermal NOx and the ammonium nitrogen of the spent acid, which the
      model sends entirely to N2) and sulfuric acid mist of the final absorber are not estimated:
      no sourced emission factor was read in this run. Open gap for the next stage.
  - id: process-vents
    method: non-routine
    equipment: [R-101, R-201, V-201, R-301, C-401, C-402]
    reason: >-
      Vents of the ACH reactor, the amidation, the esterification and the columns (to a
      scrubber or the SAR furnace in practice) are not in the flowsheet; amounts not known at
      concept stage. Open gap.
  - id: storage
    method: storage-tank
    reason: >-
      Acetone, methanol, ACH, MMA and acid tanks (breathing losses) are not designed at concept
      stage. Open gap.
operation:
  hours_per_year: 8000
  life_years: 25
  source: "design basis operating_hours_per_year 8000 (ASSUMED); 25 a service life ASSUMED"
dataset:
  version: 0.1.0
  geography: {description: "One generic concept design; no site chosen, no country-specific data"}
  classification: {isic: "2011"}
  system_model: cutoff
  technology_level: current
  modelling: {principle: attributional}
  review: unreviewed
  data_generator: "ChemE-as-Code process library, methyl-methacrylate-1 concept design (agent-drafted, not reviewed)"
