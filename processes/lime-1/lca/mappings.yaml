# lime-1's own exchange overrides for the Atlas LCI build (ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Limestone resolves through its registry slug to
# the shared entry `limestone`; electricity to the shared default. The by-product lime stays a
# reported gap until a cut-off decision for lime sent to use elsewhere is recorded.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:natural-gas":
    use: natural-gas
    atlas: false
    source: "Pipeline natural gas by mass, taken as methane (the shared unit proxy); not linked to an Atlas producer of the slug methane, which is hda-1's fuel gas (as styrene-1)."
