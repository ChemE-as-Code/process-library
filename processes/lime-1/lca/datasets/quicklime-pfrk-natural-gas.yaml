  unit: kg/kg
  description: 'By-product lime (off-specification grain size or calcination, from start-up, shutdown, screening
    and dedusting) as a share of total yearly production: midpoint of 1 to 5 %.'
  source: EU JRC (2013) CLM BREF, Schorcht et al., EUR 26129 EN, doi:10.2788/12850, section 2.3.4, p. 245 (range);
    the midpoint is our choice, and that the by-product is fully calcined CaO is ASSUMED (the source says some is
    partially calcined)
- name: heat
  value: 3700.0
  unit: MJ
  description: 'Fuel heat per t quicklime in a parallel flow regenerative kiln (PFRK): midpoint of 3.2 to 4.2 GJ/t.'
  source: EU JRC (2013) CLM BREF, Schorcht et al., EUR 26129 EN, doi:10.2788/12850, Table 2.23, p. 223 (EU-27 kilns),
    and the same range as the BAT-associated level, Table 4.6, p. 358; the midpoint is our choice
- name: lhv_ng
  value: 50.01
  unit: MJ/kg
  description: LHV of the kiln fuel, taken as methane.
  source: chemicals/chemicals.yaml methane lhv; natural gas as pure methane is ASSUMED (gas is 64 % of PFRK fuel
    in the EU, EU JRC (2013) CLM BREF, Schorcht et al., EUR 26129 EN, doi:10.2788/12850, Table 2.11, p. 186; the
    rest is solid, liquid and waste fuel). TODO a fuel mix
- name: elec
  value: 30.0
  unit: kWh
  description: 'Kiln electricity per t quicklime, PFRK: midpoint of 20 to 40 kWh/t.'
  source: EU JRC (2013) CLM BREF, Schorcht et al., EUR 26129 EN, doi:10.2788/12850, Table 2.23, p. 223 (Table 2.19,
    p. 206, gives 20 to 41); the midpoint is our choice. Crushing, screening, grinding and hydrating are not in
    it
- name: v_fg
  value: 3000.0
  unit: Nm3
  description: Specific dry flue gas of a PFRK per t lime, at 11 % O2 and 273 K.
  source: EU JRC (2013) CLM BREF, Schorcht et al., EUR 26129 EN, doi:10.2788/12850, sections 2.3.3.2, p. 230, and
    2.3.3.3, p. 233 (the basis the source uses to turn concentrations into kg/t)
- name: nox
  value: 0.9
  unit: kg
  description: 'NOx (as NO2) per t lime, PFRK and annular shaft kilns: midpoint of 0.3 to 1.5 kg/t.'
  source: EU JRC (2013) CLM BREF, Schorcht et al., EUR 26129 EN, doi:10.2788/12850, section 2.3.3.2, p. 230 (range);
    the midpoint is our choice. Its BAT-AEL of 100 to 350 mg/Nm3 (Table 4.9, p. 364) at v_fg is 0.3 to 1.05 kg/t,
    so the value sits inside it
- name: so2
  value: 0.2
  unit: kg
  description: 'SOx (as SO2) per t lime, PFRK and annular shaft kilns: the low end of 0.2 to 1.2 kg/t.'
  source: EU JRC (2013) CLM BREF, Schorcht et al., EUR 26129 EN, doi:10.2788/12850, section 2.3.3.3, p. 233 (range,
    which depends on the fuel); taking the low end for a natural-gas-fired kiln is ASSUMED (little fuel sulphur,
    and the same section says shaft kilns absorb SO2 into the lime)
- name: c_pm
  value: 10.0
  unit: mg/Nm3
  description: 'Dust in the kiln flue gas after a fabric filter: the BAT-AEL upper bound.'
  source: EU JRC (2013) CLM BREF, Schorcht et al., EUR 26129 EN, doi:10.2788/12850, Table 4.8, p. 362 (fabric filter,
    below 10 mg/Nm3); a fabric filter is ASSUMED (the source, p. 227, says all German shaft kilns have one)
- name: c_co
  value: 250.0
  unit: mg/Nm3
  description: 'CO in the PFRK flue gas (short peaks after each reversal): midpoint of 100 to 400 mg/Nm3, which at
    v_fg is the source''s 0.3 to 1.2 kg/t.'
  source: EU JRC (2013) CLM BREF, Schorcht et al., EUR 26129 EN, doi:10.2788/12850, section 2.3.3.4.2, p. 236 (PFRK
    range, depending on the fuel); the midpoint is our choice. Inside the PFRK BAT-AEL of below 500 mg/Nm3 (Table
    4.11, p. 365)
