# Tier 1 form, a library entry without a flowsheet (as process-library#317). Every amount is the formula
# of its parameters; core's validator re-checks each. Written from the CLM BREF and IPCC 2006 Vol. 3
# (facts in our own form).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: quicklime-pfrk-natural-gas
title: Quicklime by calcination of limestone in a natural-gas-fired parallel flow regenerative kiln
description: Per 1 t of high-calcium quicklime (counted as CaO), gate-to-gate, EU kilns of the CLM BREF data collection.
  Limestone and process CO2 from stoichiometry with the sourced by-product share; fuel heat, electricity and air
  emissions from the BREF's PFRK ranges.
basis: 1000 kg of quicklime (CaO)
boundary: 'gate-to-gate: kiln feeding, calcination in the PFRK, lime cooling and discharge, kiln dedusting; crushed,
  washed limestone, natural gas and power from outside; no grinding or hydrating'
technology: parallel flow regenerative shaft kiln (two shafts, alternating 8 to 15 minute firing periods, continuous
  production), natural gas through lances, fabric filter; rotary, annular and mixed-feed kilns and dolime are not
  modelled
geography:
  description: EU-27 kilns of the BREF data collection; no single site.
classification:
  isic: '2394'
system_boundary:
  included:
  - limestone, as its CaCO3
  - natural gas and its combustion, electricity of the kiln
  - calcination and combustion CO2, combustion water
  - NOx, SO2, CO and dust from the kiln stack
  - by-product lime (off-specification and filter dust)
  excluded:
  - 'TODO limestone impurities (SiO2, Al2O3, Fe2O3, MgCO3; BREF Table 2.10, p. 183) and moisture: the stone and
    the product are modelled as pure CaCO3 and CaO'
  - 'TODO residual CO2 in the lime (0.5 to 5 %, BREF p. 223): full calcination taken'
  - 'TODO fuel mix: 36 % of PFRK fuel in the EU is not gas (BREF Table 2.11, p. 186)'
  - 'TODO HCl, HF, TOC, PCDD/F and metals from the kiln (BREF Table 2.24, p. 226: not stated per kiln type)'
  - TODO diffuse dust from storage and handling; electricity of crushing, screening and conveying at the plant
  - TODO refractory lining (campaign life 4 to 8 years, BREF p. 205; no mass stated)
  - 'TODO the use of by-product lime: no cut-off decision recorded yet'
  - 'limestone washing water: in the washed-limestone background (BREF 2.3.5, p. 246)'
  - lime grinding and hydrating (separate products)
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: RER
year: 2007
valid_until: 2012
time:
  start: 2004
  description: 'BREF data collection: kiln statistics of 2003-2004 and industry and member-state data of 2006-2008.
    valid_until is the reference year + 5 (system-model section 6), so it has already lapsed.'
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation (the by-product lime is an output to use elsewhere, not a co-product
    of the dataset)'
