# Goal and scope of the ethylene-1 preliminary LCI. Schema: `cheme schema lca`. Outputs:
# `cheme assess lca --inventory --write` and `--coverage` (lca/inventory.csv, dataset.yaml, ...);
# never edit those by hand.
#
# A gate-to-gate foreground inventory of the concept flowsheet (DESIGN.md D-016). Every background
# is deliberately left UNMAPPED (`missing:` says which background activity the exchange should be
# linked to later): no factor, no licensed value. The result is a foreground inventory with gaps,
# not an impact assessment (library ADR 0022: an unmapped exchange of an internal process is a
# reported gap).
schema: cheme/lca/v1
kind: lca
goal: >-
  Preliminary gate-to-gate life cycle inventory of polymer-grade ethylene from ethane steam
  cracking at concept stage: every foreground exchange per kg ethylene from the balanced
  flowsheet, to be linked to background datasets later (DESIGN.md D-016).
functional_unit: {product: ETHYLENE, amount: 1, unit: kg}
boundary: gate-to-gate
year: 2026
technology: "ethane steam cracking, 1000 kt/a ethylene, front-end demethaniser, tail-end acetylene hydrogenation"
rights: "CC-BY-4.0: the ChemE-as-Code process library's own concept design (LICENSE-DATA)"
case: design
allocation:
  method: mass
  coproducts: [ETHYLENE, PROPYLENE, CRUDEC4, PYGAS]
  source: >-
    D-016: mass allocation among the hydrocarbon products, the usual physical basis for steam
    cracker outputs that are all chemical feedstocks. Preliminary: the allocation is the LCA
    practitioner's decision; substitution and economic allocation are to be compared once
    backgrounds and prices exist. The SHP steam export is an energy output, kept as its own
    exchange (product:HPS) and not allocated. Consequence: the fuel that preheats and
    superheats that steam (convection duty Q102, about 32 % of the fired duty) and its CO2 stay
    with the hydrocarbon products, and the compressors are charged as grid power as well
    (D-015), so the CO2 and power per kg ethylene are gross. A scenario netting HPS against
    POWER or crediting it by substitution is open (D-015).
flows:
  # --- raw materials
  - key: feed:ETHANE
    missing: "background to link: purity ethane (C2 >= 95 mol%) from natural gas liquids fractionation, delivered by pipeline (market for ethane); no open dataset chosen yet"
    source: "fresh ethane S101, scripts/balance.py (D-003)"
  - key: feed:NATGAS
    missing: "background to link: natural gas, high pressure, at the consumer (market for natural gas, site country); its combustion is in the foreground (flue gas S804)"
    source: "fuel make-up S801 closing the firebox heat balance (D-013)"
  - key: feed:AIR
    free: true
    source: "ambient combustion air: a resource without burden"
  - key: feed:BFW
    missing: "background to link: boiler feed water, demineralised (site water treatment, e.g. the library's utility-steam-ng-boiler water section or a deionised water dataset)"
    source: "dilution steam make-up S203 (D-007)"
  - key: feed:CAUSTIC
    missing: "background to link: sodium hydroxide 50 % from membrane chlor-alkali (library process chlor-alkali-1), diluted to 10 wt% with process water"
    source: "fresh caustic S304 (D-009); upper-bound assumption: 3 mol NaOH per mol CO2 (ASSUMED, unsourced excess) on an ASSUMED 0.2 mol% feed CO2"
  # --- utilities
  - key: feed:POWER
    missing: "background to link: grid electricity, high voltage, site country not chosen (market for electricity, high voltage)"
    source: "machine drives Q301, Q303, Q402 as electric motors (D-015); the refrigeration part Q402 is a conservative upper estimate (D-014)"
  - key: feed:MPS
    missing: "background to link: MP steam 1800 kPa(a) from the site utility system (library process utility-steam-ng-boiler)"
    source: "dilution steam generation Q210 (D-007)"
  - key: feed:LPS
    missing: "background to link: LP steam 450 kPa(a) from the site utility system (library process utility-steam-ng-boiler)"
    source: "column reboilers Q502, Q601, Q603, Q605 (D-014)"
  - key: product:CW
    missing: "background to link: heat rejected to a recirculating cooling water system (library process utility-cooling-tower: pumping, fans, make-up, blowdown)"
    source: "coolers and condensers Q201, Q302, Q304, Q403, Q602, Q604, Q606 (D-014)"
  - key: product:HPS
    missing: "background to link: SHP steam exported to the site; under substitution it would avoid steam from a natural-gas boiler (utility-steam-ng-boiler), in an integrated design it drives the compressor turbines instead of the electric motors (D-015)"
    source: "TLE and convection-section steam Q102, Q103 (D-007)"
  # --- emissions and wastes
  - key: product:FLUE
    emission: true
    source: "cracking furnace flue gas S804 to atmosphere through the stack (D-013)"
  - {key: emission:CO2, elementary: {compartment: air, subcompartment: non-urban-high-stack, origin: fossil}, source: "fossil CO2 of the fuel gas (cracked-gas tail gas and natural gas); the feed CO2 is removed in the caustic tower T310 and leaves as carbonate in the spent caustic, not in the flue gas (D-009)"}
  - {key: emission:N2, free: true, source: "atmospheric N2 of the combustion air returned"}
  - {key: emission:O2, free: true, source: "excess O2 of the combustion air returned"}
  - {key: emission:H2O, free: true, source: "water vapour from combustion"}
  - {key: emission:H2, free: true, source: "zero after complete combustion (template component)"}
  - {key: emission:CH4, elementary: {compartment: air, subcompartment: non-urban-high-stack, origin: fossil}, source: "zero in the flowsheet after complete combustion; the unburnt CH4 is the combustion estimate below (add: true)"}
  - {key: emission:NOx, elementary: {compartment: air, subcompartment: non-urban-high-stack}, source: "combustion estimate, as NO2 (D-017)"}
  - {key: emission:CO, elementary: {compartment: air, subcompartment: non-urban-high-stack, origin: fossil}, source: "combustion estimate (D-017)"}
  - {key: emission:PM, missing: "elementary flow to name later: particulate matter (total dust, size not known) to air, high stack; no CAS-based identity in the packaged crosswalk", source: "combustion estimate, total dust (D-017)"}
  - {key: emission:N2O, elementary: {compartment: air, subcompartment: non-urban-high-stack}, source: "combustion estimate (D-017)"}
  - {key: emission:C2H4, free: true, source: "zero after complete combustion (template component)"}
  - {key: emission:C2H6, free: true, source: "zero after complete combustion (template component)"}
  - key: product:BLOWDOWN
    treatment: {kind: waste, route: wastewater-treatment}
    missing: "background to link: industrial wastewater treatment of process water blowdown with dissolved hydrocarbons (library process utility-wwtp)"
    source: "process water blowdown S204 (D-007)"
  - key: product:SPENTCAUSTIC
    treatment: {kind: waste, route: wastewater-treatment, hazardous: true}
    missing: "background to link: spent caustic treatment (neutralisation or wet air oxidation, then biological treatment; utility-wwtp or a dedicated dataset)"
    source: "spent caustic S305 (D-009); upper-bound assumption: follows the ASSUMED 3:1 NaOH:CO2 ratio and 0.2 mol% feed CO2"
operation:
  hours_per_year: 8000
  life_years: 25
  source: "design basis operating_hours_per_year 8000 (ASSUMED, D-002); 25 a service life ASSUMED"
# Emissions the flowsheet does not carry (D-017). Activity: the fired duty 2199.3 GJ/h (LHV) of
# scripts/balance.py; the flue gas is 239.3 Nm3 (dry, 3 vol% O2) per GJ, also from
# scripts/balance.py, which turns the BREF concentrations into factors per GJ.
emission_estimates:
  - id: furnace-combustion
    title: Cracking furnace firebox (H-101, H-103)
    method: combustion
    equipment: [H-101, H-103]
    source: "D-017: BREF concentrations converted with the flue gas volume of scripts/balance.py; IPCC defaults as proxies"
    add: true
    activity: {value: 2199.3, unit: GJ, source: "fired duty 610.9 MW (LHV) of the fuel gas S802, scripts/balance.py (D-013)"}
    factors:
      NOx: {value: 23.93, unit: g/GJ, source: "BREF LVOC 2017 (JRC109279) Table 13.1: BAT-AEL NOx for a new cracker furnace 60-100 mg/Nm3 at 3 vol% O2; upper end 100 mg/Nm3 x 239.3 Nm3/GJ (scripts/balance.py), D-017"}
      CO: {value: 11.96, unit: g/GJ, source: "BREF LVOC 2017 Table 13.1 note (3): CO generally 10-50 mg/Nm3; upper end 50 mg/Nm3 x 239.3 Nm3/GJ, D-017"}
      PM: {value: 1.70, unit: g/GJ, source: "BREF LVOC 2017 Table 3.4: dust 2.8-7.1 mg/Nm3 (dry, 3 % O2); upper end x 239.3 Nm3/GJ, D-017"}
      CH4: {value: 1.0, unit: g/GJ, source: "2006 IPCC Guidelines Vol. 2 Ch. 2 Table 2.3: natural gas in manufacturing industries, 1 kg CH4/TJ, used for the H2-rich fuel gas as a proxy (D-017)"}
      N2O: {value: 0.1, unit: g/GJ, source: "2006 IPCC Guidelines Vol. 2 Ch. 2 Table 2.3: natural gas, 0.1 kg N2O/TJ, proxy (D-017)"}
emission_exclusions:
  - {id: sox, method: combustion, equipment: [H-101, H-103], reason: "the modelled fuel gas (tail gas and natural gas) carries no sulphur; the sulphur doping of the feed (DMDS) is not modelled (D-017): an open item, BREF Table 3.4 reports 2.5-38.5 mg/Nm3 SO2", source: "D-017"}
  - {id: decoking, method: non-routine, equipment: [H-101, H-103], reason: "coke burn-off (CO, CO2, dust) during decoking is not quantified: no sourced coke make for ethane cracking at this stage (BREF LVOC 2017 section 3.3.1.2 describes it qualitatively); an open gap, not negligible by evidence", source: "D-017"}
  - {id: fugitives, method: equipment-leaks, reason: "no P&ID take-off at concept stage to count components; BREF LVOC 2017 section 3.3.1.4 reports diffuse and fugitive VOC of 30-1925 t/a for lower-olefin plants: an open gap to estimate at basic engineering", source: "D-017"}
  - {id: flare, method: flare, reason: "no continuous flaring in normal operation; start-up, shutdown and upset flaring is non-routine and not quantified (D-017)", source: "D-017"}
  - {id: blowdown-effluent, method: effluent, exchange: product:BLOWDOWN, reason: "dissolved hydrocarbons, oil and phenols of the process water are not modelled; the blowdown goes to wastewater treatment outside the boundary (treatment gap above)", source: "D-007"}
  - {id: spent-caustic-effluent, method: effluent, exchange: product:SPENTCAUSTIC, reason: "goes to treatment outside the boundary; sulphides and red oil not modelled (D-009)", source: "D-009"}
location: GLO
dataset:
  version: 0.1.0
  classification: {isic: "2011", cpc: "34110"}
  geography: {description: "Generic site, country not chosen; no regional background applied"}
  system_model: cutoff
  technology_level: current
  modelling: {principle: attributional}
  review: unreviewed
  data_generator: "ChemE-as-Code process library, agent-drafted concept design (unreviewed)"
