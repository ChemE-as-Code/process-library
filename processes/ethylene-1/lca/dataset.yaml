# The plant's unallocated LCI dataset (kind lci_dataset): generated by cheme assess
# lca --write from the flowsheet and lca/lca.yaml; do not edit. Other studies reference
# it as a background (dataset: {path, product, allocation}).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: ethylene-and-propylene-by-ethane-steam-cracking-1000-kt-a-ethylene
title: Ethylene and propylene by ethane steam cracking (1000 kt/a ethylene)
description: Unallocated foreground LCI of Ethylene and propylene by ethane steam cracking (1000 kt/a
  ethylene), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: ethane steam cracking, 1000 kt/a ethylene, front-end demethaniser, tail-end acetylene hydrogenation
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:sox
  title: combustion emissions of H-101, H-103
  direction: output
  reason: 'the modelled fuel gas (tail gas and natural gas) carries no sulphur; the sulphur doping of
    the feed (DMDS) is not modelled (D-017): an open item, BREF Table 3.4 reports 2.5-38.5 mg/Nm3 SO2'
  source: D-017
- key: emission-excluded:decoking
  title: non-routine emissions of H-101, H-103
  direction: output
  reason: 'coke burn-off (CO, CO2, dust) during decoking is not quantified: no sourced coke make for ethane
    cracking at this stage (BREF LVOC 2017 section 3.3.1.2 describes it qualitatively); an open gap, not
    negligible by evidence'
  source: D-017
- key: emission-excluded:fugitives
  title: equipment-leaks emissions of the plant
  direction: output
  reason: 'no P&ID take-off at concept stage to count components; BREF LVOC 2017 section 3.3.1.4 reports
    diffuse and fugitive VOC of 30-1925 t/a for lower-olefin plants: an open gap to estimate at basic
    engineering'
  source: D-017
- key: emission-excluded:flare
  title: flare emissions of the plant
  direction: output
  reason: no continuous flaring in normal operation; start-up, shutdown and upset flaring is non-routine
    and not quantified (D-017)
  source: D-017
- key: emission-excluded:blowdown-effluent
  title: effluent emissions of product:BLOWDOWN
  direction: output
  reason: dissolved hydrocarbons, oil and phenols of the process water are not modelled; the blowdown
    goes to wastewater treatment outside the boundary (treatment gap above)
  source: D-007
- key: emission-excluded:spent-caustic-effluent
  title: effluent emissions of product:SPENTCAUSTIC
  direction: output
  reason: goes to treatment outside the boundary; sulphides and red oil not modelled (D-009)
  source: D-009
uuid: f8abf375-d19c-5a5c-aec5-3ff84e9bed26
version: 0.1.0
geography:
  description: Generic site, country not chosen; no regional background applied
time:
  start: 2026
valid_until: 2031
system_model: cutoff
technology_level: current
production_volume:
  amount: 1000000000.0
  unit: kg/a
  source: product:ETHYLENE per hour x operation.hours_per_year (8000 h/a)
classification:
  isic: '2011'
  cpc: '34110'
modelling:
  principle: attributional
  multifunctionality: 'unallocated multi-output dataset; default allocation mass: D-016: mass allocation
    among the hydrocarbon products, the usual physical basis for steam cracker outputs that are all chemical
    feedstocks. Preliminary: the allocation is the LCA practitioner''s decision; substitution and economic
    allocation are to be compared once backgrounds and prices exist. The SHP steam export is an energy
    output, kept as its own exchange (product:HPS) and not allocated. Consequence: the fuel that preheats
    and superheats that steam (convection duty Q102, about 32 % of the fired duty) and its CO2 stay with
    the hydrocarbon products, and the compressors are charged as grid power as well (D-015), so the CO2
    and power per kg ethylene are gross. A scenario netting HPS against POWER or crediting it by substitution
    is open (D-015).'
review:
- type: none
data_generator: ChemE-as-Code process library, agent-drafted concept design (unreviewed)
