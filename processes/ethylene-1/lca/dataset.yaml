allocation:
  coproducts:
  - ETHYLENE
  - PROPYLENE
  - CRUDEC4
  - PYGAS
  source: 'D-016: mass allocation among the hydrocarbon products, the usual physical basis for steam cracker
    outputs that are all chemical feedstocks. Preliminary: the allocation is the LCA practitioner''s decision;
    substitution and economic allocation are to be compared once backgrounds and prices exist. The SHP
    steam export is an energy output, kept as its own exchange (product:HPS) and not allocated. Consequence:
    the fuel that preheats and superheats that steam (convection duty Q102, about 32 % of the fired duty)
    and its CO2 stay with the hydrocarbon products, and the compressors are charged as grid power as well
    (D-015), so the CO2 and power per kg ethylene are gross. A scenario netting HPS against POWER or crediting
    it by substitution is open (D-015).'
  deviation: 'D-016: the WBCSD price-ratio test cannot be applied at concept stage because no co-product
    prices are set; mass allocation is kept as the physical relationship among co-products that are all
    hydrocarbon feedstocks, to be re-tested once prices exist.'
