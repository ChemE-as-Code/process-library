# ethylene-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>) without the process id.
#
# The steam bought in (feed:MPS, feed:LPS), which the dataset counts as heat in kWh while the
# registry slug `steam` is counted by mass (kg), uses the shared `steam-heat` entry (kWh), as
# hda-1 and nitric-acid-1 do. The exported SHP steam (product:HPS) has no override on purpose: a
# positive technosphere exchange is a consumption, so `use: steam-heat` would book the 337 MWh/h
# export as steam heat bought in (as acrylonitrile-1 found, d53dd620). It stays a reported gap
# until the netting or crediting of the export is decided (DESIGN.md D-015, D-016). The
# 2026-11-01 natural-gas link is below; every other background stays unmapped, deliberately:
# lca/lca.yaml `missing:` names the activity each exchange should link to. Unmapped exchanges are
# reported gaps (ADR 0022), not errors. Registry entries for the products and feeds now exist
# (chemicals/chemicals.yaml, ADR 0028); their background links stay open.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:MPS": {use: steam-heat, source: "MP steam 1800 kPa(a) to the dilution steam generator, counted as heat delivered (kWh)"}
  "feed:LPS": {use: steam-heat, source: "LP steam 450 kPa(a) to the column reboilers, counted as heat delivered (kWh)"}
  # Mapping step of 2026-11-01 (ADR 0026): each entry below uses a reference the library already
  # holds. Notes above that call these exchanges unmapped describe the state before it. What is
  # still unmapped is a gap (lci/gaps.json), and this process is marked preliminary.
  "feed:NATGAS": {use: natural-gas, source: "natural gas by mass, taken as methane (the shared unit proxy)"}
