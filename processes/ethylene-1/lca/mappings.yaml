# ethylene-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>) without the process id.
#
# None yet, deliberately: ethylene-1 is internal (publication.status: internal) and its
# backgrounds stay unmapped at this stage (lca/lca.yaml `missing:` names the activity each
# exchange should link to). Unmapped exchanges are reported gaps (ADR 0022), not errors. The
# products' `chemical` slugs (ethylene, propylene, crude C4, pyrolysis gasoline) and the feeds'
# (ethane, natural gas, sodium hydroxide) are missing from chemicals/chemicals.yaml and are
# listed for the consolidated registry PR (DESIGN.md D-016).
schema: cheme-as-code/lci-process-mappings/v1
exchanges: {}
