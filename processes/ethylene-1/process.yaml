# Process Atlas manifest of ethylene-1. Schema: schemas/process.schema.json (cheme-as-code/process/v1).
# plant.yaml stays the engineering manifest; sheets and results are derived from the
# ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: ethylene-1
title: Ethylene and propylene by ethane steam cracking (1000 kt/a ethylene, concept)
summary: >-
  Ethane steam cracking with ethane and propane recycle, quench, cracked-gas compression with
  caustic wash and drying, front-end demethaniser, tail-end acetylene hydrogenation and C2/C3
  splitters to polymer-grade ethylene and propylene, crude C4 and pyrolysis gasoline. Concept
  stage, assumed basis, preliminary gate-to-gate LCI with unmapped backgrounds.
description: |
  Purity ethane and the recycled ethane are cracked with dilution steam at a coil outlet of
  840 C; the recycled propane has its own coil. The furnace is a conversion model that
  reproduces the once-through ethane and propane yields of the EU BREF on large volume organic
  chemicals (2017, Table 3.3): a sourced yield model, not kinetics. The cracked gas raises SHP
  steam in the transfer line exchangers, is quenched with water (the condensate becomes dilution
  steam again), compressed in five stages with a caustic wash, dried and separated at low
  temperature: demethaniser (tail gas and hydrogen to the furnace fuel), deethaniser, acetylene
  converter, C2 splitter, depropaniser, MAPD converter, C3 splitter and debutaniser. The tail
  gas and a natural-gas make-up fire the furnaces.

  The separations are specified splits from an independent balance script, and the energy
  figures rest on ideal-gas enthalpies: core has no qualified property package for C2+
  hydrocarbon mixtures yet. See DESIGN.md for every assumption and gated step.
families: [olefins]
keywords: [ethylene, propylene, steam cracking, ethane, olefins, cracked gas compression, demethaniser, C2 splitter, acetylene hydrogenation, pyrolysis gasoline]
facets:
  feedstock_basis: [fossil]
  product_classes: [chemicals]
  unit_operations: [reaction, compression, cryogenic-distillation, distillation, absorption, adsorption, heat-exchange]
  region: generic
# Honest claim: concept is the lowest level of the manifest; see validation.notes and DESIGN.md.
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD with closed mass, component and element balances (cheme validate: 0 errors, 0
    warnings). Furnace, hydrogenation reactors and firebox outlets are calculated by cheme
    (conversion reactors; furnace conversions derived from the BREF LVOC 2017 Table 3.3 yields).
    Capacity, feed composition, splits, purities, efficiencies and utility levels are ASSUMED;
    separations and duties come from scripts/balance.py on ideal-gas enthalpies (no qualified
    property package for the C2+ hydrocarbons), so the energy balance is not evaluable in core
    beyond the reactor duties, which cheme process reactors reproduces. The preliminary
    gate-to-gate LCI closes in mass, elements and carbon by origin, with every background
    unmapped (gaps). Not reviewed. Main products and feeds are listed under chemistry with their
    chemicals registry entries (issue #251). cheme maturity: calculation maturity none (sourced
    boundary fails: capacity and feed are ASSUMED; balanced model basis fails: the splits and
    conversions of H102, T201, D210, T310, D320, V402, R501 and R601 are unsourced). concept is
    claimed as the lowest level of the manifest; the warning cheme.maturity-claim-exceeds is
    acknowledged. The refrigeration power is a conservative upper estimate (D-014).
chemistry:
  inputs:
    - {chemical: ethane, role: feedstock, note: "feed:ETHANE: purity ethane by pipeline, 1.27 kg/kg ethylene (unallocated)"}
    - {chemical: methane, role: feedstock, note: "feed:NATGAS: natural gas make-up to the fuel header, taken as methane"}
    - {chemical: sodium-hydroxide, role: feedstock, note: "feed:CAUSTIC: fresh caustic soda solution 10 wt%, counted by mass of the solution"}
    - {chemical: air, role: feedstock, inventory_key: "feed:AIR", note: "Combustion air of the cracking furnaces"}
    - {chemical: water, role: feedstock, inventory_key: "feed:BFW", note: "Boiler feed water make-up to the dilution steam system"}
  outputs:
    - {chemical: ethylene, role: main-product, inventory_key: "product:ETHYLENE", note: "Polymer-grade ethylene"}
    - {chemical: propylene, role: co-product, inventory_key: "product:PROPYLENE", note: "Polymer-grade propylene"}
    - {chemical: crude-c4, role: co-product, inventory_key: "product:CRUDEC4", note: "Crude C4 cut"}
    - {chemical: pyrolysis-gasoline, role: co-product, inventory_key: "product:PYGAS", note: "Pyrolysis gasoline (C5/C6 cut)"}
    - {chemical: carbon-dioxide, role: emission, inventory_key: "emission:CO2", note: "Fossil CO2 of the furnace flue gas: 0.472 kg/kg ethylene unallocated (59.1 t/h over 125 t/h ethylene), 0.433 kg/kg ethylene with mass allocation (ethylene share 91.6 %). Both are gross: they include the fuel that preheats and superheats the exported SHP steam (product:HPS, about a third of the fired duty), which carries no burden (D-015, D-016)"}
    - {chemical: wastewater, role: waste, inventory_key: "product:BLOWDOWN", note: "Process water blowdown; the spent caustic (product:SPENTCAUSTIC) is a second wastewater"}
    - {chemical: steam, role: co-product, inventory_key: "product:HPS", note: "SHP steam 11500 kPa(a), 520 C, raised in the TLEs and convection sections (ASSUMED export, D-015); outside the mass allocation and without a burden, so the fuel and CO2 that raise it stay with the hydrocarbon products"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "Cracked gas and refrigeration compressor drives (ASSUMED electric, D-015)"}
    - {chemical: steam, role: utility, inventory_key: "feed:MPS", note: "MP steam 1800 kPa(a) to the dilution steam generator"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "LP steam 450 kPa(a) to the column reboilers"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "25/35 C (ASSUMED)"}
basis:
  capacity: "1000 kt/a polymer-grade ethylene (ASSUMED)"
  operating_hours_per_year: 8000
  location: generic (not chosen)
references:
  - {title: "Falcke, H. et al. (2017) Best Available Techniques (BAT) Reference Document for the Production of Large Volume Organic Chemicals. JRC Science for Policy Report EUR 28882 EN (JRC109279), chapter 3 Lower olefins", doi: 10.2760/77304}
  - {title: "Zimmermann, H.; Walzl, R. Ethylene. Ullmann's Encyclopedia of Industrial Chemistry (lead from issue #176; not audited in this run)", doi: 10.1002/14356007.a10_045.pub2}
  - {title: "IPCC (2006) 2006 IPCC Guidelines for National Greenhouse Gas Inventories, Vol. 2 Energy, Ch. 2 Stationary Combustion"}
