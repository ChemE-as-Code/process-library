# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Ethylene and propylene by steam cracking of ethane, 1000 kt/a polymer-grade ethylene
# (DESIGN.md D-001, D-002). Where the values come from:
# - the furnace outlet S106, the hydrogenation reactor outlets S503/S603, the firebox flue gas
#   S804 and the mixer/pass-through streams are calculated by `cheme process propagate --fill`
#   from the reactions in process/reactions.yaml (furnace: conversions from the sourced BREF
#   yields, D-005);
# - feeds, separator and column outlets, the recycles and all duties come from the independent
#   balance scripts/balance.py (D-006), given here as ASSUMED: the separations are specified
#   splits, not a rigorous simulation, because core has no qualified property package for the
#   C2+ hydrocarbons yet (D-012);
# - temperatures and pressures are design choices (D-004, D-007, D-008), ASSUMED.
schema: cheme/process/v1
kind: flowsheet
title: Ethylene and propylene by ethane steam cracking (1000 kt/a ethylene)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 125 t/h polymer-grade ethylene from purity ethane, ethane and propane recycled to extinction (D-002)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: ETHANE, title: Purity ethane feed (pipeline), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NATGAS, title: Natural gas make-up to the fuel header, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AIR, title: Combustion air, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: BFW, title: Boiler feed water make-up to the dilution steam system, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: CAUSTIC, title: Fresh caustic soda solution 10 wt%, category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power (machine drives, D-015)
    category: utility
    utility: {kind: electricity}
    ports: [{id: k301, direction: out, kind: energy}, {id: k302, direction: out, kind: energy}, {id: k701, direction: out, kind: energy}]
  - id: MPS
    title: MP steam 1800 kPa(a) to the dilution steam generator
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1800, provenance: assumed, source: "D-007"}
      supply_temperature: {value: 480.3, provenance: assumed, source: "saturation at 1800 kPa(a), D-007"}
      min_approach: {value: 10, provenance: assumed, source: "D-007"}
    ports: [{id: d210, direction: out, kind: energy}]
  - id: LPS
    title: LP steam 450 kPa(a) to the column reboilers
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "D-014"}
      supply_temperature: {value: 420.8, provenance: assumed, source: "saturation at 450 kPa(a), D-014"}
      min_approach: {value: 10, provenance: assumed, source: "D-014"}
    ports: [{id: t501, direction: out, kind: energy}, {id: t601, direction: out, kind: energy}, {id: t602, direction: out, kind: energy}, {id: t603, direction: out, kind: energy}]
products:
  - {id: ETHYLENE, title: Polymer-grade ethylene, category: product, ports: [{id: in, direction: in}]}
  - {id: PROPYLENE, title: Polymer-grade propylene, category: by_product, ports: [{id: in, direction: in}]}
  - {id: CRUDEC4, title: Crude C4 cut, category: by_product, ports: [{id: in, direction: in}]}
  - {id: PYGAS, title: Pyrolysis gasoline (C5/C6 cut), category: by_product, ports: [{id: in, direction: in}]}
  - {id: FLUE, title: Cracking furnace flue gas to atmosphere, category: emission, ports: [{id: in, direction: in}]}
  - {id: BLOWDOWN, title: Process water blowdown to wastewater treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - {id: SPENTCAUSTIC, title: Spent caustic to treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - id: HPS
    title: SHP steam raised in the TLEs and convection sections (11500 kPa(a), 520 C)
    category: utility
    utility:
      kind: steam
      level: HP
      pressure: {value: 11500, provenance: assumed, source: "D-007"}
      supply_temperature: {value: 793.15, provenance: assumed, source: "D-007"}
      min_approach: {value: 20, provenance: assumed, source: "D-007"}
    ports: [{id: tle, direction: in, kind: energy}, {id: conv, direction: in, kind: energy}]
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "D-014"}
      return_temperature: {value: 308.15, provenance: assumed, source: "D-014"}
      min_approach: {value: 5, provenance: assumed, source: "D-014"}
    ports:
      - {id: t201, direction: in, kind: energy}
      - {id: k301, direction: in, kind: energy}
      - {id: k302, direction: in, kind: energy}
      - {id: k701, direction: in, kind: energy}
      - {id: t601, direction: in, kind: energy}
      - {id: t602, direction: in, kind: energy}
      - {id: t603, direction: in, kind: energy}

blocks:
  - id: CRK
    title: Cracking furnaces, TLEs and fuel header
    class: ReactingChemicals
    ports:
      - {id: fresh, direction: in}
      - {id: c2rec, direction: in}
      - {id: c3gas, direction: in}
      - {id: steam, direction: in}
      - {id: tail, direction: in}
      - {id: c2vent, direction: in}
      - {id: c3vent, direction: in}
      - {id: ng, direction: in}
      - {id: air, direction: in}
      - {id: gas, direction: out}
      - {id: flue, direction: out}
      - {id: hps_tle, direction: out, kind: energy}
      - {id: hps_conv, direction: out, kind: energy}
      - {id: heat3, direction: out, kind: energy}
  - id: CRK3
    title: Propane recycle cracking coil
    class: ReactingChemicals
    ports:
      - {id: c3rec, direction: in}
      - {id: steam3, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy}
  - id: QW
    title: Quench and dilution steam system
    class: SeparatingByThermalProcess
    ports:
      - {id: gas_in, direction: in}
      - {id: ko1, direction: in}
      - {id: ko2, direction: in}
      - {id: ko3, direction: in}
      - {id: bfw, direction: in}
      - {id: gas_out, direction: out}
      - {id: steam, direction: out}
      - {id: steam3, direction: out}
      - {id: bd, direction: out}
      - {id: cw, direction: out, kind: energy}
      - {id: mps, direction: in, kind: energy}
  - id: CGC
    title: Cracked gas compression, caustic wash and drying
    class: Compressing
    ports:
      - {id: gas_in, direction: in}
      - {id: caustic, direction: in}
      - {id: ko1, direction: out}
      - {id: ko2, direction: out}
      - {id: ko3, direction: out}
      - {id: spent, direction: out}
      - {id: gas_out, direction: out}
      - {id: power1, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: power2, direction: in, kind: energy}
      - {id: cw2, direction: out, kind: energy}
  - id: CHL
    title: Chilling train, demethaniser, hydrogen recovery and refrigeration
    class: SeparatingByThermalProcess
    ports:
      - {id: gas_in, direction: in}
      - {id: c2plus, direction: out}
      - {id: h2a, direction: out}
      - {id: h2m, direction: out}
      - {id: tail, direction: out}
      - {id: ref501, direction: in, kind: energy}
      - {id: ref502, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: C2F
    title: Deethaniser, acetylene hydrogenation and C2 splitter
    class: Distilling
    ports:
      - {id: feed, direction: in}
      - {id: h2, direction: in}
      - {id: c3plus, direction: out}
      - {id: vent, direction: out}
      - {id: ethylene, direction: out}
      - {id: ethane, direction: out}
      - {id: lps, direction: in, kind: energy}
      - {id: ref501, direction: out, kind: energy}
      - {id: ref502, direction: out, kind: energy}
  - id: C3F
    title: Depropaniser, MAPD hydrogenation, C3 splitter and debutaniser
    class: Distilling
    ports:
      - {id: feed, direction: in}
      - {id: h2, direction: in}
      - {id: vent, direction: out}
      - {id: propylene, direction: out}
      - {id: propane, direction: out}
      - {id: c4, direction: out}
      - {id: pygas, direction: out}
      - {id: lps1, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: lps2, direction: in, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: lps3, direction: in, kind: energy}
      - {id: cw3, direction: out, kind: energy}

steps:
  # --- CRK
  - id: M101
    block: CRK
    title: Furnace feed and dilution steam mixing
    class: Mixing
    ports:
      - {id: fresh, direction: in, delegates: fresh}
      - {id: c2rec, direction: in, delegates: c2rec}
      - {id: steam, direction: in, delegates: steam}
      - {id: out, direction: out}
  - id: H101
    block: CRK
    title: Cracking furnace radiant coils (ethane)
    class: ReactingChemicals
    reactor: conversion
    reactions: [C2H6_DH, C2H6_C2H2, C2H6_HGL, C2H6_C3H6, C2H6_C3H8, C2H6_C3H4, C2H6_C4H6, C2H6_C4H8, C2H6_C4H10, C2H6_C6H6]
    links: [{target: equipment, ref: H-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy}
  - id: M102
    block: CRK3
    title: Propane recycle and dilution steam mixing
    class: Mixing
    ports:
      - {id: c3rec, direction: in, delegates: c3rec}
      - {id: steam, direction: in, delegates: steam3}
      - {id: out, direction: out}
  - id: H103
    block: CRK3
    title: Recycle cracking coil (propane)
    class: ReactingChemicals
    reactor: conversion
    reactions: [C3H8_C2H4, C3H8_DH, C3H8_HGL]
    links: [{target: equipment, ref: H-103}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
      - {id: heat, direction: in, kind: energy, delegates: heat}
  - id: M103
    block: CRK
    title: Coil outlet collection
    class: Mixing
    ports:
      - {id: c2, direction: in}
      - {id: c3, direction: in, delegates: c3gas}
      - {id: out, direction: out}
  - id: E101
    block: CRK
    title: Transfer line exchangers (SHP steam)
    class: Cooling
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: gas}
      - {id: hps, direction: out, kind: energy, delegates: hps_tle}
  - id: M801
    block: CRK
    title: Fuel gas header
    class: Mixing
    ports:
      - {id: tail, direction: in, delegates: tail}
      - {id: c2vent, direction: in, delegates: c2vent}
      - {id: c3vent, direction: in, delegates: c3vent}
      - {id: ng, direction: in, delegates: ng}
      - {id: out, direction: out}
  - id: H102
    block: CRK
    title: Cracking furnace firebox and convection section
    class: ReactingChemicals
    reactor: conversion
    reactions: [COMB_H2, COMB_CH4, COMB_C2H4, COMB_C2H6]
    links: [{target: equipment, ref: H-101}]
    ports:
      - {id: fuel, direction: in}
      - {id: air, direction: in, delegates: air}
      - {id: out, direction: out, delegates: flue}
      - {id: coil, direction: out, kind: energy}
      - {id: coil3, direction: out, kind: energy, delegates: heat3}
      - {id: hps, direction: out, kind: energy, delegates: hps_conv}
  # --- QW
  - id: T201
    block: QW
    title: Quench water tower
    class: SeparatingByThermalProcess
    links: [{target: equipment, ref: T-201}]
    ports:
      - {id: in, direction: in, delegates: gas_in}
      - {id: gas, direction: out, delegates: gas_out}
      - {id: water, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: D210
    block: QW
    title: Process water stripper and dilution steam generator
    class: Evaporating
    links: [{target: equipment, ref: E-210}]
    ports:
      - {id: qw, direction: in}
      - {id: ko1, direction: in, delegates: ko1}
      - {id: ko2, direction: in, delegates: ko2}
      - {id: ko3, direction: in, delegates: ko3}
      - {id: bfw, direction: in, delegates: bfw}
      - {id: steam, direction: out, delegates: steam}
      - {id: steam3, direction: out, delegates: steam3}
      - {id: bd, direction: out, delegates: bd}
      - {id: mps, direction: in, kind: energy, delegates: mps}
  # --- CGC
  - id: K301
    block: CGC
    title: Cracked gas compressor stages 1-3 with intercoolers
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-301}]
    ports:
      - {id: in, direction: in, delegates: gas_in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power1}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: V301
    block: CGC
    title: Stage 3 discharge drum
    class: SeparatingByPhaseSeparation
    links: [{target: equipment, ref: V-301}]
    ports:
      - {id: in, direction: in}
      - {id: water, direction: out, delegates: ko1}
      - {id: gas, direction: out}
  - id: T310
    block: CGC
    title: Caustic tower
    class: Absorbing
    reactions: [CAUSTIC]
    links: [{target: equipment, ref: T-310}]
    ports:
      - {id: gas, direction: in}
      - {id: caustic, direction: in, delegates: caustic}
      - {id: spent, direction: out, delegates: spent}
      - {id: out, direction: out}
  - id: K302
    block: CGC
    title: Cracked gas compressor stages 4-5 with aftercooler
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-301}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power2}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  - id: V302
    block: CGC
    title: Compressor discharge drum
    class: SeparatingByPhaseSeparation
    links: [{target: equipment, ref: V-302}]
    ports:
      - {id: in, direction: in}
      - {id: water, direction: out, delegates: ko2}
      - {id: gas, direction: out}
  - id: D320
    block: CGC
    title: Cracked gas dryers (molecular sieve)
    class: Adsorbing
    links: [{target: equipment, ref: D-320}]
    ports:
      - {id: in, direction: in}
      - {id: water, direction: out, delegates: ko3}
      - {id: out, direction: out, delegates: gas_out}
  # --- CHL
  - id: T401
    block: CHL
    title: Chilling train and demethaniser
    class: Distilling
    links: [{target: equipment, ref: T-401}]
    ports:
      - {id: in, direction: in, delegates: gas_in}
      - {id: ovhd, direction: out}
      - {id: bot, direction: out, delegates: c2plus}
      - {id: ref, direction: out, kind: energy}
  - id: V402
    block: CHL
    title: Cold box hydrogen separation
    class: SeparatingByPhysicalProcess
    links: [{target: equipment, ref: E-402}]
    ports:
      - {id: in, direction: in}
      - {id: h2a, direction: out, delegates: h2a}
      - {id: h2m, direction: out, delegates: h2m}
      - {id: fuel, direction: out, delegates: tail}
  - id: K701
    block: CHL
    title: Propylene and ethylene refrigeration compressors
    class: Compressing
    links: [{target: equipment, ref: K-701}]
    ports:
      - {id: chill, direction: in, kind: energy}
      - {id: ref501, direction: in, kind: energy, delegates: ref501}
      - {id: ref502, direction: in, kind: energy, delegates: ref502}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  # --- C2F
  - id: T501
    block: C2F
    title: Deethaniser
    class: Distilling
    links: [{target: equipment, ref: T-501}]
    ports:
      - {id: in, direction: in, delegates: feed}
      - {id: ovhd, direction: out}
      - {id: bot, direction: out, delegates: c3plus}
      - {id: reb, direction: in, kind: energy, delegates: lps}
      - {id: cond, direction: out, kind: energy, delegates: ref501}
  - id: R501
    block: C2F
    title: Acetylene converter (tail end)
    class: ReactingChemicals
    reactor: conversion
    reactions: [AH_C2H4, AH_C2H6]
    links: [{target: equipment, ref: R-501}]
    ports:
      - {id: in, direction: in}
      - {id: h2, direction: in, delegates: h2}
      - {id: out, direction: out}
  - id: T502
    block: C2F
    title: C2 splitter with pasteurisation section
    class: Distilling
    links: [{target: equipment, ref: T-502}]
    ports:
      - {id: in, direction: in}
      - {id: vent, direction: out, delegates: vent}
      - {id: top, direction: out, delegates: ethylene}
      - {id: bot, direction: out, delegates: ethane}
      - {id: cond, direction: out, kind: energy, delegates: ref502}
  # --- C3F
  - id: T601
    block: C3F
    title: Depropaniser
    class: Distilling
    links: [{target: equipment, ref: T-601}]
    ports:
      - {id: in, direction: in, delegates: feed}
      - {id: ovhd, direction: out}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: lps1}
      - {id: cond, direction: out, kind: energy, delegates: cw1}
  - id: R601
    block: C3F
    title: MAPD converter
    class: ReactingChemicals
    reactor: conversion
    reactions: [MAPD_C3H6, MAPD_C3H8]
    links: [{target: equipment, ref: R-601}]
    ports:
      - {id: in, direction: in}
      - {id: h2, direction: in, delegates: h2}
      - {id: out, direction: out}
  - id: T602
    block: C3F
    title: C3 splitter
    class: Distilling
    links: [{target: equipment, ref: T-602}]
    ports:
      - {id: in, direction: in}
      - {id: vent, direction: out, delegates: vent}
      - {id: top, direction: out, delegates: propylene}
      - {id: bot, direction: out, delegates: propane}
      - {id: reb, direction: in, kind: energy, delegates: lps2}
      - {id: cond, direction: out, kind: energy, delegates: cw2}
  - id: T603
    block: C3F
    title: Debutaniser
    class: Distilling
    links: [{target: equipment, ref: T-603}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out, delegates: c4}
      - {id: bot, direction: out, delegates: pygas}
      - {id: reb, direction: in, kind: energy, delegates: lps3}
      - {id: cond, direction: out, kind: energy, delegates: cw3}

streams:
  # ---------------------------------------------------------------- cracking
  - id: S101
    title: Fresh ethane
    from: ETHANE.out
    to: M101.fresh
    template: cracked_gas
    state:
      design:
        temperature: {value: 313.15, provenance: assumed, source: D-003}
        pressure: {value: 3000, provenance: assumed, source: D-003}
        flow: {value: 158554.1, basis: mass, provenance: assumed, source: "scripts/balance.py: fresh feed for 125 t/h ethylene (D-002, D-006)"}
        composition: {basis: mole_fraction, values: {C2H6: 0.968, C3H8: 0.025, CH4: 0.005, CO2: 0.002}, provenance: assumed, source: "purity ethane, D-003"}
  - id: S102
    title: Ethane recycle
    from: T502.bot
    to: M101.c2rec
    template: cracked_gas
    state:
      design:
        temperature: {value: 313.15, provenance: assumed, source: D-006}
        pressure: {value: 600, provenance: assumed, source: D-006}
        flow: {value: 66028.3, basis: mass, provenance: assumed, source: "scripts/balance.py, D-006"}
        composition: {basis: mole_fraction, values: {C2H6: 0.99, C2H4: 0.01}, provenance: assumed, source: "scripts/balance.py, D-010"}
  - id: S103
    title: Propane recycle
    from: T602.bot
    to: M102.c3rec
    template: cracked_gas
    state:
      design:
        temperature: {value: 313.15, provenance: assumed, source: D-006}
        pressure: {value: 600, provenance: assumed, source: D-006}
        flow: {value: 7971.8, basis: mass, provenance: assumed, source: "scripts/balance.py, D-006"}
        composition: {basis: mole_fraction, values: {C3H8: 0.95, C3H6: 0.05}, provenance: assumed, source: "scripts/balance.py, D-010"}
  - id: S104
    title: Dilution steam
    from: D210.steam
    to: M101.steam
    template: water
    state:
      design:
        temperature: {value: 443.6, provenance: assumed, source: "saturated at 800 kPa(a), D-007"}
        pressure: {value: 800, provenance: assumed, source: D-007}
        flow: {value: 67374.7, basis: mass, provenance: assumed, source: "0.30 kg/kg hydrocarbon, D-004; scripts/balance.py"}
        composition: {basis: mole_fraction, values: {H2O: 1.0}, provenance: assumed, source: D-007}
  - id: S105
    title: Furnace feed with dilution steam
    from: M101.out
    to: H101.in
    template: cracked_gas
    state:
      design:
        temperature: {value: 343.64, provenance: assumed, source: "ideal-gas adiabatic mixing of S101-S104, scripts/balance.py"}
        pressure: {value: 600, provenance: assumed, source: D-004}
        flow: {value: 291957.0, provenance: calculated, source: 'cheme process propagate: mixer M101 from S101 S102 S104', fingerprint: 889d684b63549021}
        composition: {basis: mole_fraction, values: {H2: 0.0, CH4: 0.00233916, C2H2: 0.0, C2H4: 0.00196955, C2H6: 0.647848, C3H4: 0.0, C3H6: 0.0, C3H8: 0.0116958, C4H6: 0.0, C4H8: 0.0, C4H10: 0.0, C6H6: 0.0, H2O: 0.335212, CO2: 0.000935666}, provenance: calculated, source: 'cheme process propagate: mixer M101 from S101 S102 S104', fingerprint: 870f1b1b0920d942}
  - id: S106
    title: Cracked gas at the ethane coil outlet
    from: H101.out
    to: M103.c2
    template: cracked_gas
    state:
      design:
        temperature: {value: 1113.15, provenance: assumed, source: "coil outlet 840 C, D-004"}
