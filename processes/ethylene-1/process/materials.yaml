# Components and templates of the process. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
#
# Ideal-gas formation data and critical constants: `cheme chemistry library ethane_cracking --add`
# (C2H6, C2H4, H2, C3H8, CH4) and `cheme chemistry thermo NAME --fit 298.15,1200` (the others),
# both from the `chemicals` package (sources on each entry).
#
# Lumped representatives (DESIGN.md D-005): C3H4 (propadiene) stands for methylacetylene and
# propadiene (MAPD); C4H8 (1-butene) for all butylenes; C6H6 (benzene) for the C5/C6 cut of the
# cracked gas, i.e. the pyrolysis gasoline. NaOH and Na2CO3 only occur dissolved in the caustic
# wash liquor; they carry no gas-phase data.
schema: cheme/process/v1
kind: materials
