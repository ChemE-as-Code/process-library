    - {chemical: biowaste, role: feedstock, inventory_key: "feed:BIOW", note: "Source-separated biowaste, hygienised before delivery, DM 40 %, 7.813 kg/kg (5500 t/a); burden-free waste"}
    - {chemical: air, role: feedstock, inventory_key: "feed:AIR", note: "Combustion air of the hot-water boiler, 2.344 kg/kg (15 % excess, ASSUMED)"}
  outputs:
    - {chemical: methane/biomethane, role: main-product, inventory_key: "product:BIOMETHANE", note: "Biomethane, 98.0 mol% CH4 and 2.0 mol% CO2, dry, 1550 kPa(a), to the grid injection station; 87.99 kg/h, 118.8 Nm3/h, 0.947 kg CH4 and 47.4 MJ LHV per kg"}
    - {chemical: digestate, role: by-product, inventory_key: "product:DIGESTATE", note: "Whole digestate, 28.40 kg/kg, 12.0 wt% DM (ash and the unconverted VS), stored six months under a gas-tight cover and spread on farmland as fertiliser; a recyclable, burden-free under cut-off"}
