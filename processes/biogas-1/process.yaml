    - {chemical: carbon-dioxide, role: emission, inventory_key: "product:FLUE", note: "Flue gas of the hot-water boiler, 2.692 kg/kg, biogenic CO2"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "1.028 kWh/kg: the membrane unit at 0.25 kWh/Nm3 raw biogas (SGC Rapport 2013:270), the gas chiller (ASSUMED COP 3.0) and the digesters' agitators and pumps (FNR Table 8.4, ASSUMED run time)"}
