# biogas-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# The substrates, the air and the after-coolers' heat are free in the dataset (burden-free under
# cut-off, DESIGN.md D-012) and the digestate a recyclable leaving burden-free, so they need no
# mapping. The electricity is the library default; the plant's emissions link to the biosphere.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:POWER": {use: electricity, source: "the library default (medium voltage, the site country's grid): the membrane unit's compressor and vacuum pump (W2) and the digesters' agitators and pumps (W1), D-009"}
