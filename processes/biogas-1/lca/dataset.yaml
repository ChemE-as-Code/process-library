id: biogas-from-cattle-slurry-and-biowastes-with-membrane-upgrading-to-biomethane-217-nm3-h-raw-biogas
title: Biogas from cattle slurry and biowastes with membrane upgrading to biomethane (217 Nm3/h raw biogas)
description: Unallocated foreground LCI of Biogas from cattle slurry and biowastes with membrane upgrading
  to biomethane (217 Nm3/h raw biogas), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: DE
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Agricultural biogas plant next to a livestock farm: cattle slurry with hygienised catering
  waste, grease trap waste and biowaste (22 100 t/a) mixed in an intake pit, warmed to 313.15 K and digested
  in two stirred concrete digesters (3400 m3 gross, 51 d), the biogas chilled to 283.15 K to remove its
  water, desulphurised on activated carbon, compressed to 1600 kPa(a) and upgraded in three membrane stages
  to 98 mol% CH4 at 99.5 % methane recovery; 11.1 % of the biogas fired in a hot-water boiler for the
  digesters; the digestate stored six months under a gas-tight cover and spread on farmland'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:intake-pit
  title: storage-tank emissions of T-101
  direction: output
  reason: The covered intake pit is vented to the biogas system; its ammonia and odour emissions are not
    estimated (no nitrogen in the model, L-3).
- key: emission-excluded:digester-leaks
  title: storage-tank emissions of R-101, R-102, T-201
  direction: output
  reason: 'Methane leaking from the digesters'' and the store''s membrane roofs, their over-pressure valves
    and the emergency flare is not estimated: no open measured rate was read for this concept (D-011,
    L-4). Its size is not bounded: a leak equal to the membranes'' slip (4.76 g CH4 per kg of biomethane)
    would add 0.13 kg CO2-eq per kg, 40 % of the screening result, so the result is a lower bound (D-012).'
- key: emission-excluded:hydrogen-sulphide
  title: storage-tank emissions of A-301
  direction: output
  reason: H2S and its sulphur are not in the balance (no sulphur in the lumped substrates, L-3); the spent
    activated carbon is a waste not inventoried (D-007).
- key: emission-excluded:boiler-pollutants
  title: combustion emissions of B-101
  direction: output
  reason: CO, NOx and unburnt methane of the hot-water boiler are not estimated; complete combustion ASSUMED
    (D-008). Each 1 % of the boiler's methane left unburnt would add 1.2 g CH4, 0.03 kg CO2-eq, per kg
    of biomethane (D-012).
