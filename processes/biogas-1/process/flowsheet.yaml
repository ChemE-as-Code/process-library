  - {id: S3, title: Grease trap waste, from: GREASE.out, to: M101.grease, template: slurry, state: {design: {temperature: {value: 283.15, provenance: assumed, source: D-005}, pressure: {value: 101.325, provenance: assumed, source: D-005}, flow: {value: 575.0, basis: mass, provenance: assumed, source: "scripts/balance.py: 4600 t/a (FNR Table 8.3, plant VII) in 8000 h"}, composition: {basis: mass_fraction, values: {H2O: 0.95, ASH: 0.005, CARB: 0.00585, LIPID: 0.0278249, RVS: 0.011325}, provenance: assumed, source: "scripts/balance.py: DM 5 %, VS 90 % of DM, 1000 Nm3/t VS at 68 % CH4 (FNR Table 8.2), D-004"}}}}
  - {id: S4, title: Biowaste, from: BIOW.out, to: M101.biow, template: slurry, state: {design: {temperature: {value: 283.15, provenance: assumed, source: D-005}, pressure: {value: 101.325, provenance: assumed, source: D-005}, flow: {value: 687.5, basis: mass, provenance: assumed, source: "scripts/balance.py: 5500 t/a (FNR Table 8.3, plant VII) in 8000 h"}, composition: {basis: mass_fraction, values: {H2O: 0.6, ASH: 0.2, CARB: 0.0747925, LIPID: 0.0422527, RVS: 0.0829548}, provenance: assumed, source: "scripts/balance.py: DM 40 %, VS 50 % of DM, 615 Nm3/t VS at 60 % CH4 (FNR Table 8.2), D-004"}}}}
