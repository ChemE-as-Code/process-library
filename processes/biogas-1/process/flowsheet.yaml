# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Biogas from cattle slurry and hygienised biowastes (FNR model plant VII), mesophilic wet
# digestion in two stirred digesters, upgraded to biomethane in a three-stage membrane unit; the
# digestate stored for land application (DESIGN.md D-001 to D-010).
# Where the values come from:
# - the feeds (flows and lumped compositions), the air, the power and the after-coolers' heat
#   come from scripts/balance.py (D-002 to D-009), given as `assumed` with the script's path;
#   its inputs are sourced (FNR Guide to Biogas; SGC Rapport 2013:270) or ASSUMED;
# - the digesters R101 (Buswell, complete conversion of the digestible lumps), the gas space
#   V101, the boiler B101, the knock-out E301 and the membrane unit M301 (component separators
#   with the script's recoveries), the mixers and the splitter are calculated by
#   `cheme process propagate --fill`, which writes B101's heat to the hot-water circuit (Q1);
# - temperatures and pressures are design choices (ASSUMED, D-005 to D-008); no property
#   package of core covers the slurries, so no enthalpy is filled for them.
schema: cheme/process/v1
kind: flowsheet
title: Biogas from cattle slurry and biowastes with membrane upgrading to biomethane (217 Nm3/h raw biogas)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  normal_conditions: {temperature: 273.15, pressure: 101.325, basis: ideal_gas}
cases:
  - {id: design, description: "Design case: FNR model plant VII's substrates (22 100 t/a) in 8000 h/a, the biogas upgraded to 98 mol% biomethane (D-001, D-002)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: SLURRY, title: Cattle slurry from the farm (pumped from the slurry store), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: CATER, title: "Catering waste, hygienised before delivery", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: GREASE, title: "Grease trap waste, hygienised before delivery", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: BIOW, title: "Biowaste, hygienised before delivery", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AIR, title: Combustion air for the hot-water boiler, category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power (AC, grid)
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: u101, direction: out, kind: energy}
      - {id: c301, direction: out, kind: energy}
products:
  - {id: BIOMETHANE, title: "Biomethane, 98 mol% CH4, 1550 kPa(a), to the grid injection station", category: product, ports: [{id: in, direction: in}]}
  - {id: DIGESTATE, title: Digestate from the covered store to land application, category: by_product, ports: [{id: in, direction: in}]}
  - {id: OFFGAS, title: Membrane off-gas (CO2 with the methane slip) to atmosphere, category: emission, ports: [{id: in, direction: in}]}
  - {id: FLUE, title: Flue gas of the hot-water boiler to atmosphere, category: emission, ports: [{id: in, direction: in}]}
  - id: AMBIENT
    title: Heat of compression rejected to the air by the after-coolers
    category: utility
    utility: {kind: air_cooling}
    ports: [{id: e301, direction: in, kind: energy}]

blocks:
  - id: AD
    title: Substrate intake and anaerobic digestion
    class: ReactingChemicals
    ports:
      - {id: slurry, direction: in}
      - {id: cater, direction: in}
      - {id: grease, direction: in}
      - {id: biow, direction: in}
      - {id: cond, direction: in}
      - {id: biogas, direction: out}
      - {id: fuel, direction: out}
      - {id: digestate, direction: out}
      - {id: heat, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: HEAT
    title: Digester heating (biogas hot-water boiler)
    class: ReactingChemicals
    ports:
      - {id: gas, direction: in}
      - {id: air, direction: in}
      - {id: flue, direction: out}
      - {id: heat, direction: out, kind: energy}
  - id: UPG
    title: Biogas upgrading (activated carbon, compression, three-stage membranes)
    class: Separating
    ports:
      - {id: gas, direction: in}
      - {id: product, direction: out}
      - {id: offgas, direction: out}
      - {id: cond, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: cool, direction: out, kind: energy}

steps:
  # AD: intake pit, hot-water circuit, two-stage digesters with gas space, digestate store (D-003)
  - id: M101
    block: AD
    title: Intake pit (mixing of the substrates)
    class: Mixing
    links: [{target: equipment, ref: T-101}]
    ports:
      - {id: slurry, direction: in, delegates: slurry}
      - {id: cater, direction: in, delegates: cater}
      - {id: grease, direction: in, delegates: grease}
      - {id: biow, direction: in, delegates: biow}
      - {id: out, direction: out}
  - id: E101
    block: AD
    title: Hot-water circuit (substrate heat exchanger and digester heating coils)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: heat}
  - id: R101
    block: AD
    title: Digesters, first and second stage (mesophilic, stirred)
    class: ReactingChemicals
    reactions: [AD_CARB, AD_LIP]
    reactor: conversion
    links: [{target: equipment, ref: R-101}, {target: equipment, ref: R-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: V101
    block: AD
    title: Digesters' gas space (biogas leaves saturated with water)
    class: Separating
    links: [{target: equipment, ref: R-101}, {target: equipment, ref: R-102}]
    recovery:
      outlets:
        gas: {CH4: 1.0, CO2: 1.0, H2O: 0.0061867}
      provenance: assumed
      source: "scripts/balance.py: the gas saturated with water at 313.15 K and 102.0 kPa(a) (IAPWS-95, chemicals 1.5.2); CH4 and CO2 all to the gas, none dissolved (D-005, L-3)"
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out}
      - {id: liq, direction: out}
  - id: U101
    block: AD
    title: Digester agitators, intake pit mixer, feed and transfer pumps
    class: ProcessStep
    links: [{target: equipment, ref: R-101}, {target: equipment, ref: R-102}]
    ports:
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: T201
    block: AD
    title: Gas-tight covered digestate store (with the upgrading's condensate)
    class: Mixing
    links: [{target: equipment, ref: T-201}]
    ports:
      - {id: in, direction: in}
      - {id: cond, direction: in, delegates: cond}
      - {id: out, direction: out, delegates: digestate}
  - id: X101
    block: AD
    title: Biogas to the boiler and to upgrading
    class: SplittingMaterial
    split: {boiler: 0.1037056}   # scripts/balance.py: the share whose heat covers the digesters' demand (D-008)
    ports:
      - {id: in, direction: in}
      - {id: boiler, direction: out, delegates: fuel}
      - {id: upg, direction: out, delegates: biogas}
  # HEAT
  - id: B101
    block: HEAT
    title: Biogas hot-water boiler
    class: ReactingChemicals
    reactions: [COMB]
    reactor: conversion
    energy_port: heat
    links: [{target: equipment, ref: B-101}]
    ports:
      - {id: gas, direction: in, delegates: gas}
      - {id: air, direction: in, delegates: air}
      - {id: flue, direction: out, delegates: flue}
      - {id: heat, direction: out, kind: energy, delegates: heat}
  # UPG (D-006, D-007)
  - id: A301
    block: UPG
    title: Activated carbon filter (H2S removal) and particle filter
    class: Adsorbing
    links: [{target: equipment, ref: A-301}]
    # H2S, siloxanes and particles are not in the balance (L-3): the filter passes the gas
    recovery:
      outlets:
        out: {CH4: 1.0, CO2: 1.0, H2O: 1.0}
      provenance: assumed
      source: "D-007: the trace components it removes are not represented"
    ports:
      - {id: in, direction: in, delegates: gas}
      - {id: out, direction: out}
  - id: C301
    block: UPG
    title: Biogas compressor (with the recycle of the membrane stages)
    class: Compressing
    links: [{target: equipment, ref: C-301}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E301
    block: UPG
    title: After-cooler and condensate separator
    class: Separating
    links: [{target: equipment, ref: E-301}, {target: equipment, ref: V-301}]
    recovery:
      outlets:
        gas: {CH4: 1.0, CO2: 1.0, H2O: 0.034098}
      provenance: assumed
      source: "scripts/balance.py: the gas saturated with water at 303.15 K and 1600 kPa(a) (IAPWS-95, chemicals 1.5.2), the rest condenses (D-007)"
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out}
      - {id: cond, direction: out, delegates: cond}
      - {id: cool, direction: out, kind: energy, delegates: cool}
  - id: M301
    block: UPG
    title: Three-stage membrane unit (permeate of stage 2 and retentate of stage 3 recycled)
    class: Separating
    links: [{target: equipment, ref: M-301}]
    recovery:
      outlets:
        product: {CH4: 0.995, CO2: 0.0313388, H2O: 0.0}
      provenance: assumed
      source: "scripts/balance.py: 99.5 % of the methane to the product (SGC Rapport 2013:270, sections 2.3.4 and 3.3, design iii), the CO2 left for 98.0 mol% CH4 (section 3.1), the water to the permeate (section 2.3.1), D-006"
    ports:
      - {id: in, direction: in}
      - {id: product, direction: out, delegates: product}
      - {id: offgas, direction: out, delegates: offgas}

streams:
  # feeds (scripts/balance.py: FNR Tables 8.2 and 8.3, plant VII, over 8000 h; D-002, D-004)
  - {id: S1, title: Cattle slurry, from: SLURRY.out, to: M101.slurry, template: slurry, state: {design: {temperature: {value: 283.15, provenance: assumed, source: D-005}, pressure: {value: 101.325, provenance: assumed, source: D-005}, flow: {value: 500.0, basis: mass, provenance: assumed, source: "scripts/balance.py: 4000 t/a (FNR Table 8.3, plant VII) in 8000 h"}, composition: {basis: mass_fraction, values: {H2O: 0.92, ASH: 0.016, CARB: 0.0214745, LIPID: 0.0040672, RVS: 0.0384583}, provenance: assumed, source: "scripts/balance.py: DM 8 %, VS 80 % of DM, 370 Nm3/t VS at 55 % CH4 (FNR Table 8.2), D-004"}}}}
