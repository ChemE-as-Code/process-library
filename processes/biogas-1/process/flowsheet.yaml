    template: gas
    state:
      design:
        temperature: {value: 313.15, provenance: assumed, source: D-005}
        pressure: {value: 102.0, provenance: assumed, source: D-005}
        flow: {value: 275.304, provenance: calculated, source: 'cheme process propagate: separator V101 from S7', fingerprint: 9ad7798eeabfdc6d}
        composition: {basis: mole_fraction, values: {H2O: 0.0724015, CARB: 0.0, LIPID: 0.0, RVS: 0.0, ASH: 0.0, CH4: 0.562879, CO2: 0.364719, O2: 0.0, N2: 0.0}, provenance: calculated, source: 'cheme process propagate: separator V101 from S7', fingerprint: 9ad7798eeabfdc6d}
  - id: S9
