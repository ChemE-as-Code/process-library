    from: V101.liq
    to: T201.in
    template: slurry
    state:
      design:
        temperature: {value: 313.15, provenance: assumed, source: D-005}
        pressure: {value: 101.325, provenance: assumed, source: D-005}
        flow: {value: 2487.2, provenance: calculated, source: 'cheme process propagate: separator V101 from S7', fingerprint: 9ad7798eeabfdc6d}
        composition: {basis: mole_fraction, values: {H2O: 0.970962, CARB: 0.0, LIPID: 0.0, RVS: 0.00650894, ASH: 0.0225292, CH4: 0.0, CO2: 0.0, O2: 0.0, N2: 0.0}, provenance: calculated, source: 'cheme process propagate: separator V101 from S7', fingerprint: 9ad7798eeabfdc6d}
  - id: S10
    title: Digestate to land application
    from: T201.out
    to: DIGESTATE.in
    template: slurry
    state:
      design:
        temperature: {value: 288.15, provenance: assumed, source: 'D-010: the digestate cools in the store, whose walls are not insulated (ASSUMED); its heat goes to ambient'}
        pressure: {value: 101.325, provenance: assumed, source: D-010}
        flow: {value: 2498.88, provenance: calculated, source: 'cheme process propagate: mixer T201 from S9 S22 S18', fingerprint: 8d80a6f7bf569dc0}
        composition: {basis: mole_fraction, values: {H2O: 0.971112, CARB: 0.0, LIPID: 0.0, RVS: 0.00647534, ASH: 0.0224129, CH4: 0.0, CO2: 0.0, O2: 0.0, N2: 0.0}, provenance: calculated, source: 'cheme process propagate: mixer T201 from S9 S22 S18', fingerprint: e79b6a1f5e3deb0a}
  # boiler
  - id: S11
    title: Biogas to the boiler
    from: X101.boiler
    to: B101.gas
    template: gas
    state:
      design:
        temperature: {value: 313.15, provenance: assumed, source: D-008}
        pressure: {value: 102.0, provenance: assumed, source: D-008}
        flow: {value: 30.6002, provenance: calculated, source: 'cheme process propagate: splitter X101 from S8', fingerprint: c2de4b0dd3341f5c}
        composition: {basis: mole_fraction, values: {H2O: 0.0724015, CARB: 0.0, LIPID: 0.0, RVS: 0.0, ASH: 0.0, CH4: 0.562879, CO2: 0.364719, O2: 0.0, N2: 0.0}, provenance: calculated, source: 'cheme process propagate: splitter X101 from S8', fingerprint: 00479c12fd3c82a9}
  - {id: S13, title: Combustion air, from: AIR.out, to: B101.air, template: gas, state: {design: {temperature: {value: 283.15, provenance: assumed, source: D-008}, pressure: {value: 101.325, provenance: assumed, source: D-008}, flow: {value: 206.27, basis: mass, provenance: assumed, source: "scripts/balance.py: 15 % excess air, dry air 21/79 mol% (D-008)"}, composition: {basis: mass_fraction, values: {O2: 0.2329092, N2: 0.7670908}, provenance: assumed, source: "scripts/balance.py: dry air 21/79 mol%, argon counted as N2 (D-008)"}}}}
  - id: S14
    title: Boiler flue gas
    from: B101.flue
    to: FLUE.in
    template: gas
    state:
      design:
        temperature: {value: 423.15, provenance: assumed, source: 'D-008: flue gas leaving the boiler'}
        pressure: {value: 101.325, provenance: assumed, source: D-008}
        flow: {value: 236.87, provenance: calculated, source: 'cheme process propagate: reactor B101 from S11 S13', fingerprint: 11a03287aab35899}
        composition: {basis: mole_fraction, values: {CH4: 0.0, CO2: 0.129465, H2O: 0.167228, O2: 0.0235676, N2: 0.679739, CARB: 0.0, LIPID: 0.0, RVS: 0.0, ASH: 0.0}, provenance: calculated, source: 'cheme process propagate: reactor B101 from S11 S13', fingerprint: 46857124741a147f}
  # upgrading
  - id: S12
    title: Biogas to upgrading
    from: X101.upg
    to: E300.in
    template: gas
    state:
      design:
        temperature: {value: 313.15, provenance: assumed, source: D-007}
        pressure: {value: 102.0, provenance: assumed, source: D-007}
        flow: {value: 244.704, provenance: calculated, source: 'cheme process propagate: splitter X101 from S8 S11', fingerprint: e8bb9c3f0dc663b4}
        composition: {basis: mole_fraction, values: {H2O: 0.0724015, CARB: 0.0, LIPID: 0.0, RVS: 0.0, ASH: 0.0, CH4: 0.562879, CO2: 0.364719, O2: 0.0, N2: 0.0}, provenance: calculated, source: 'cheme process propagate: splitter X101 from S8', fingerprint: 00479c12fd3c82a9}
  - id: S21
    title: Chilled biogas to the activated carbon filter
    from: E300.gas
    to: A301.in
    template: gas
    state:
      design:
        temperature: {value: 283.15, provenance: assumed, source: 'D-007: chilled before compression (SGC Rapport 2013:270, section 2.3.1)'}
        pressure: {value: 101.5, provenance: assumed, source: D-007}
        flow: {value: 234.506, provenance: calculated, source: 'cheme process propagate: separator E300 from S12', fingerprint: 8f2c8c9b5b0e9fe7}
        composition: {basis: mole_fraction, values: {CH4: 0.599471, CO2: 0.388429, H2O: 0.0121005, O2: 0.0, N2: 0.0, CARB: 0.0, LIPID: 0.0, RVS: 0.0, ASH: 0.0}, provenance: calculated, source: 'cheme process propagate: separator E300 from S12', fingerprint: 8f2c8c9b5b0e9fe7}
  - id: S22
    title: Chiller condensate to the digestate store
    from: E300.cond
    to: T201.cond1
    template: slurry
    state:
      design:
        temperature: {value: 283.15, provenance: assumed, source: D-007}
