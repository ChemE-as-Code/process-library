# Components and templates of the process. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
#
# Biogas from cattle slurry and hygienised biowastes, upgraded to biomethane (DESIGN.md D-001).
# The substrates are NONCONVENTIONAL. Their volatile solids (VS) are represented by LUMPED model
# components with a nominal formula, so that elements balance and Buswell's stoichiometry gives
# the gas (DESIGN.md D-004), not by molecular identities:
# - CARB: the digestible carbohydrate fraction, as the anhydrohexose unit C6H10O5 (50 mol% CH4
#   in its gas, as FNR's Guide to Biogas, Table 2.3, gives for digestible carbohydrates);
# - LIPID: the digestible fat fraction, as triolein C57H104O6 (70 mol% CH4 by Buswell);
# - RVS: the VS that the digesters do not convert (refractory fibre, undigested protein and
#   biomass), as C6H10O5 with no reaction; it leaves with the digestate;
# - ASH: the mineral dry matter, as silica (lumped).
# Protein and its nitrogen are not represented (DESIGN.md L-3). No CAS is given for lumped
# components; molar masses of the lumps from the IUPAC 2021 abridged standard atomic weights.
# Gas data printed by `cheme chemistry thermo` (chemicals 1.5.2, offline; sources on each entry).
schema: cheme/process/v1
kind: materials
components:
  - id: H2O
    name: Water
    formula: H2O
    cas: 7732-18-5
    molar_mass: 18.015
    normal_boiling_point: 373.12
    ideal_gas: {dHf_298: -241822.0, S_298: 188.8, cp_R: [4.395, -0.004186, 1.405e-05, -1.564e-08, 6.32e-12], temperature_range: [50, 1000], provenance: given, source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R Poling (5th ed.)"}
    critical: {Tc: 647.096, Pc: 22064, omega: 0.3443, provenance: given, source: "chemicals: Tc HEOS, Pc HEOS, omega HEOS"}
  - {id: CARB, name: Digestible carbohydrate (anhydrohexose unit; lumped model component), formula: C6H10O5, molar_mass: 162.141, phase: solid}
  - {id: LIPID, name: Digestible fat (as triolein; lumped model component), formula: C57H104O6, molar_mass: 885.453, phase: solid}
  - {id: RVS, name: Volatile solids not converted (as C6H10O5; lumped model component), formula: C6H10O5, molar_mass: 162.141, phase: solid}
  - {id: ASH, name: Mineral dry matter (as silica; lumped model component), formula: SiO2, molar_mass: 60.083, phase: solid}
  - id: CH4
    name: Methane (biogenic)
    formula: CH4
    cas: 74-82-8
    molar_mass: 16.043
    normal_boiling_point: 111.67
    ideal_gas: {dHf_298: -74534.0, S_298: 186.3, cp_R: [4.568, -0.008975, 3.631e-05, -3.407e-08, 1.091e-11], temperature_range: [50, 1000], provenance: given, source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R Poling (5th ed.)"}
    critical: {Tc: 190.564, Pc: 4599.2, omega: 0.01142, provenance: given, source: "chemicals: Tc HEOS, Pc HEOS, omega HEOS"}
  - id: CO2
    name: Carbon dioxide (biogenic)
    formula: CO2
    cas: 124-38-9
    molar_mass: 44.009
    normal_boiling_point: 194.67
    ideal_gas: {dHf_298: -393474.0, S_298: 213.8, cp_R: [3.259, 0.001356, 1.502e-05, -2.374e-08, 1.056e-11], temperature_range: [50, 1000], provenance: given, source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R Poling (5th ed.)"}
    critical: {Tc: 304.128, Pc: 7377.3, omega: 0.22394, provenance: given, source: "chemicals: Tc HEOS, Pc HEOS, omega HEOS"}
  - id: O2
    name: Oxygen
    formula: O2
    cas: 7782-44-7
    molar_mass: 31.998
    normal_boiling_point: 90.19
    ideal_gas: {dHf_298: 0.0, S_298: 205.2, cp_R: [3.63, -0.001794, 6.58e-06, -6e-09, 1.79e-12], temperature_range: [50, 1000], provenance: given, source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R Poling (5th ed.)"}
    critical: {Tc: 154.581, Pc: 5043, omega: 0.0222, provenance: given, source: "chemicals: Tc HEOS, Pc HEOS, omega HEOS"}
  - id: N2
    name: Nitrogen (with the argon of the air)
    formula: N2
    cas: 7727-37-9
    molar_mass: 28.014
    normal_boiling_point: 77.35
    ideal_gas: {dHf_298: 0.0, S_298: 191.6, cp_R: [3.539, -0.000261, 7e-08, 1.57e-09, -9.9e-13], temperature_range: [50, 1000], provenance: given, source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R Poling (5th ed.)"}
    critical: {Tc: 126.192, Pc: 3395.8, omega: 0.0372, provenance: given, source: "chemicals: Tc HEOS, Pc HEOS, omega HEOS"}
# Both templates hold every component: propagate carries each inlet component (also at zero flow)
# through the gas-space split, the splitter and the separators.
templates:
  - {id: slurry, title: "Substrates, digester contents and digestate", components: [H2O, CARB, LIPID, RVS, ASH, CH4, CO2, O2, N2]}
  - {id: gas, title: "Biogas, biomethane, off-gas, air and flue gas", components: [CH4, CO2, H2O, O2, N2, CARB, LIPID, RVS, ASH]}
# property_method is a placeholder: no benchmarked package of cheme-as-code covers slurries of
# lumped organics, or wet CH4/CO2 at the membrane's pressure (`cheme process props --coverage`).
property_method:
  adapter: thermo
  status: placeholder
