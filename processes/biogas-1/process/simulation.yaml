# Simulation specs. Schema: `cheme schema process-simulation`.
# Not a simulation model (DESIGN.md D-004, L-1): no property package of cheme-as-code covers the
# lumped substrates. This file only records that the digesters R101 are adiabatic in the
# flowsheet: the substrate is warmed and the digesters' losses are covered upstream by the
# hot-water circuit E101 (Q1, D-008), as is the heat of vaporisation of the water that leaves
# saturated in the biogas (D-008); the digestion's own heat is negligible (FNR Guide to Biogas,
# section 5.1.3).
schema: cheme/simulation/v1
kind: simulation
specs:
  R101: {mode: adiabatic}
