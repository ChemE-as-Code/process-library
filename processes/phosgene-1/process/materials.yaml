  - {id: flue, title: Oxidiser flue gas, components: [N2, O2, AR, CO2, H2O, CO, COCL2, CL2, HCL]}
# No benchmarked property package covers phosgene or the caustic liquor (cheme process props
# --coverage; core #315, #364). Values are assumed from scripts/balance.py with their source.
property_method:
  adapter: thermo
  status: placeholder
