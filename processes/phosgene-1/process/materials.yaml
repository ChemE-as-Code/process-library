# Components and templates of phosgene-1. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
#
# Gas data printed by `cheme chemistry thermo` (chemicals/thermo packages: ATcT, CRC, Poling 5th
# ed.; phosgene's Cp/R fitted to TRCIG 298.15-1000 K). The scrubber species (NaOH, NaCl, Na2CO3,
# NaOCl) are molecular pseudo-components of the aqueous liquor without ideal-gas data: no
# property package of core covers phosgene or the caustic liquor (core #315, #364), so the
# condensation and scrubber values come from scripts/balance.py (DESIGN.md D-006).
schema: cheme/process/v1
kind: materials
