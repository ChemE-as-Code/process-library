# phosgene-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# None yet: phosgene-1's preliminary
# LCI leaves every background unmapped on purpose (DESIGN.md D-012). The build reports each
# unmapped exchange as a gap (lci/gaps.json). The shared vocabulary has no entry yet for carbon
# monoxide, chlorine, sodium hydroxide, refrigeration or phosgene, and no biosphere identity for
# CO, phosgene, chlorine or HCl to air: those belong to the consolidated shared-files PR
# (DESIGN.md D-013).
schema: cheme-as-code/lci-process-mappings/v1
exchanges: {}
