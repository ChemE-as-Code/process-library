# Components and templates of the process. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
#
# Ideal-gas data from the `chemicals` 1.5.2 and `thermo` 0.6.1 packages through `cheme chemistry
# thermo`, as printed in hydrogen-1's process/materials.yaml (single values with their source,
# library ADR 0037; DESIGN.md SRC-3): formation enthalpies ATcT (ATCT_G), standard entropies CRC,
# heat capacities fitted over 280-1500 K for CH4 and H2 and over 250-1600 K for CO, CO2 and H2O
# (each component's temperature_range), which hold every stream of this plant (283-623 K).
# Critical constants (HEOS) are recorded for completeness; no equation of state uses them here:
# the equilibrium is ideal-gas (Peng-Robinson rejected, D-005, L-3).
# CO is a component because the polishing reactor's equilibrium includes the reverse water-gas
# shift (D-005); no other species (higher hydrocarbons, carbon) is formed on nickel at these
# conditions in this concept (L-2).
schema: cheme/process/v1
kind: materials
components:
  - id: CH4
    name: Methane
    formula: CH4
    cas: 74-82-8
    molar_mass: 16.042
    normal_boiling_point: 111.67
    critical: {Tc: 190.564, Pc: 4599.2, omega: 0.01142, source: "chemicals: Tc HEOS, Pc HEOS, omega HEOS"}
    ideal_gas: {dHf_298: -74534.0, S_298: 186.3, cp_R: [3.17517, 0.000575545, 1.35658e-05, -1.15192e-08, 2.97188e-12], temperature_range: [280, 1500], source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R fitted to thermo TRCIG 280-1500 K (max deviation 1.09%)"}
  - id: H2
    name: Hydrogen
    formula: H2
    cas: 1333-74-0
    molar_mass: 2.0159
    normal_boiling_point: 20.37
    critical: {Tc: 33.145, Pc: 1296.4, omega: -0.219, source: "chemicals: Tc HEOS, Pc HEOS, omega HEOS"}
    ideal_gas: {dHf_298: 0.0, S_298: 130.7, cp_R: [3.23192, 0.00148072, -2.8966e-06, 2.52021e-09, -7.05007e-13], temperature_range: [280, 1500], source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R fitted to thermo TRCIG 280-1500 K (max deviation 0.61%)"}
  - id: CO
    name: Carbon monoxide
    formula: CO
    cas: 630-08-0
    molar_mass: 28.0101
    normal_boiling_point: 81.6
    critical: {Tc: 132.86, Pc: 3494.0, omega: 0.0497, source: "chemicals: Tc HEOS, Pc HEOS, omega HEOS"}
    ideal_gas: {dHf_298: -110525.0, S_298: 197.7, cp_R: [3.72554, -0.0018206, 4.43676e-06, -3.05418e-09, 7.03514e-13], temperature_range: [250, 1600], source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R fitted to thermo TRCIG 250-1600 K (max deviation 0.15%)"}
  - id: CO2
    name: Carbon dioxide
    formula: CO2
    cas: 124-38-9
    molar_mass: 44.0095
    critical: {Tc: 304.128, Pc: 7377.3, omega: 0.22394, source: "chemicals: Tc HEOS, Pc HEOS, omega HEOS"}
    ideal_gas: {dHf_298: -393474.0, S_298: 213.8, cp_R: [2.33203, 0.00924998, -8.01453e-06, 3.64303e-09, -6.80792e-13], temperature_range: [250, 1600], source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R fitted to thermo HEOS_FIT 250-1600 K (max deviation 0.19%)"}
  - id: H2O
    name: Water
    formula: H2O
    cas: 7732-18-5
    molar_mass: 18.0153
    normal_boiling_point: 373.12
    critical: {Tc: 647.096, Pc: 22064.0, omega: 0.3443, source: "chemicals: Tc HEOS, Pc HEOS, omega HEOS"}
    ideal_gas: {dHf_298: -241822.0, S_298: 188.8, cp_R: [3.99559, -0.000536056, 2.69412e-06, -1.4438e-09, 2.58654e-13], temperature_range: [250, 1600], source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R fitted to thermo TRCIG 250-1600 K (max deviation 0.27%)"}
templates:
  # Process gas: hydrogen, CO2, reactor feed and effluents, SNG.
  - {id: process_gas, title: Hydrogen / CO2 / methanation gas / SNG, components: [H2, CO2, CH4, CO, H2O]}
  # Process condensate from the knock-out drums and the dryers' regeneration (the gases are
  # listed for the separators' outlets; their solubility is neglected, D-007, L-4).
  - {id: water, title: Process condensate, components: [H2O, H2, CO2, CH4, CO]}
# property_method is a placeholder until `cheme process props --fill` records the method: its
# benchmarked property package, package versions and application range. Packages:
# air-pr-chemsep (N2/O2/Ar, 77-315 K, vapour 100-3200 kPa(a), liquid and two-phase 100-600
# kPa(a)) and syngas-pr-vapor (H2/N2/Ar/CH4/CO/CO2 mixtures, NH3 pure or dilute with H2/N2/Ar/
# CH4, vapour only, in benchmarked temperature-pressure boxes). `cheme process props --coverage` shows which applies
# to each stream; `package: <id>` here chooses one.
property_method:
  adapter: thermo
  status: placeholder
