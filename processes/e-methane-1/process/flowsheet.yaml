# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# e-Methane (synthetic natural gas) by two-stage catalytic CO2 methanation on nickel, after the
# STORE&GO demonstration at Falkenhagen (STORE&GO D5.9, DVGW 2020): electrolytic hydrogen
# compressed to 1.5 MPa, CO2 let down from a dense-phase pipeline (carbon-capture-1), a cooled
# honeycomb reactor (92 % conversion), cooling and knock-out at 10 C, an isothermal polishing
# reactor, cooling and knock-out again, adsorption drying and compression into a transport grid
# (DESIGN.md D-001 to D-010).
# Where the values come from:
# - the feeds, the compressor, cooler, heater and polishing-reactor duties, the electricity and
#   the knock-outs' water split come from scripts/balance.py (D-002 to D-008), given as
#   `assumed` with the script's path; its inputs are sourced (STORE&GO D5.9; carbon-capture-1)
#   or ASSUMED;
# - the mixers, the pass-through steps, the honeycomb reactor R101 (conversion reactor, 92 % of
#   the CO2), the polishing reactor R102 (conversion reactor at the script's ideal-gas
#   equilibrium conversion at 513.15 K and 1400 kPa(a), checked by `cheme process reactors`),
#   the knock-outs and the dryer (component separators with the script's recoveries) are
#   calculated by `cheme process propagate --fill`, which also writes both reactors' heat to
#   the thermal oil (Q3, Q5);
# - temperatures and pressures are the source's (D5.9 sections 2.1 and 8.4) or design choices
#   (ASSUMED, D-004 to D-008).
schema: cheme/process/v1
kind: flowsheet
title: e-Methane by two-stage CO2 methanation of electrolytic hydrogen (200 Nm3/h H2, 50.8 Nm3/h SNG)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  normal_conditions: {temperature: 273.15, pressure: 101.325, basis: ideal_gas}
cases:
  - {id: design, description: "Design case: the Falkenhagen methanation unit at its measured point of 200 Nm3/h hydrogen (95 % load, STORE&GO D5.9 Table 4-1) with stoichiometric CO2, 8000 h/a (D-002)", default: true}
tolerance: {abs: 0.05, rel: 0.001}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: H2, title: "Hydrogen from the electrolysis plant (dry, 120 kPa(a))", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: CO2, title: "CO2 from the dense-phase pipeline (15.3 MPa, carbon-capture-1)", category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power (AC, grid)
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: k101, direction: out, kind: energy}
      - {id: e104, direction: out, kind: energy}
      - {id: u101, direction: out, kind: energy}
      - {id: k201, direction: out, kind: energy}
products:
  - {id: SNG, title: "Synthetic natural gas, 99 mol% CH4, dry, 5000 kPa(a), to the transport grid", category: product, ports: [{id: in, direction: in}]}
  - {id: COND, title: Process condensate (reaction water) to treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - id: AMBIENT
    title: Heat rejected to air and cooling water (intercoolers, product coolers, thermal oil cooler)
    category: utility
    utility: {kind: air_cooling}
    ports:
      - {id: k101, direction: in, kind: energy}
      - {id: v101, direction: in, kind: energy}
      - {id: v102, direction: in, kind: energy}
      - {id: oil, direction: in, kind: energy}

blocks:
  - id: FEED
    title: Feed conditioning (hydrogen compression, CO2 let-down, mixing)
    class: Compressing
    ports:
      - {id: h2, direction: in}
      - {id: co2, direction: in}
      - {id: feed, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: cool, direction: out, kind: energy}
      - {id: heat, direction: in, kind: energy}
  - id: METH
    title: Two-stage methanation (honeycomb reactor, knock-out, polishing reactor, knock-out)
    class: ReactingChemicals
    ports:
      - {id: feed, direction: in}
      - {id: gas, direction: out}
      - {id: cond1, direction: out}
      - {id: cond2, direction: out}
      - {id: heat1, direction: out, kind: energy}
      - {id: heat2, direction: out, kind: energy}
      - {id: cool1, direction: out, kind: energy}
      - {id: cool2, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: power1, direction: in, kind: energy}
  - id: OIL
    title: Thermal oil circuit (reactor cooling, CO2 heater, oil cooler)
    class: ExchangingThermalEnergy
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: r102, direction: in, kind: energy}
      - {id: co2, direction: out, kind: energy}
      - {id: out, direction: out, kind: energy}
  - id: GAS
    title: Drying, grid injection and condensate collection
    class: Separating
    ports:
      - {id: gas, direction: in}
      - {id: sng, direction: out}
      - {id: cond1, direction: in}
      - {id: cond2, direction: in}
      - {id: cond, direction: out}
      - {id: power, direction: in, kind: energy}

steps:
  # FEED (D-003, D-006)
  - id: K101
    block: FEED
    title: Hydrogen compressor (two stages, intercooled)
    class: Compressing
    links: [{target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in, delegates: h2}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: cool, direction: out, kind: energy, delegates: cool}
  - id: E100
    block: FEED
    title: CO2 let-down heater and pressure control valve
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-100}]
    ports:
      - {id: in, direction: in, delegates: co2}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: heat}
  - id: M101
    block: FEED
    title: Feed gas mixing (hydrogen and CO2 at 4:1, ratio control)
    class: Mixing
    ports:
      - {id: h2, direction: in}
      - {id: co2, direction: in}
      - {id: out, direction: out, delegates: feed}
  # METH (D-004, D-005, D-007)
  - id: E101
    block: METH
    title: Feed/effluent exchanger, feed side
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in, delegates: feed}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy}
  - id: R101
    block: METH
    title: Honeycomb methanation reactor (catalyst-coated metallic honeycombs in oil-cooled tubes)
    class: ReactingChemicals
    reactions: [SAB]
    reactor: conversion
    conversion: {SAB: 0.92}   # STORE&GO D5.9 Table 4-1: honeycomb conversion 92 %, measured and ASPEN (D-004)
    energy_port: heat
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: out, kind: energy, delegates: heat1}
  - id: E102
    block: METH
    title: Feed/effluent exchanger, effluent side
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: out, kind: energy}
  - id: V101
    block: METH
    title: Air cooler, water cooler (10 C) and first knock-out drum
    class: Separating
    links: [{target: equipment, ref: E-102}, {target: equipment, ref: E-103}, {target: equipment, ref: V-101}]
    recovery:
      outlets:
        gas: {H2: 1.0, CO2: 1.0, CH4: 1.0, CO: 1.0, H2O: 0.0006209}
      provenance: assumed
      source: "scripts/balance.py: the gas saturated with water at 283.15 K and 1420 kPa(a) (IAPWS-95, chemicals 1.5.2), the rest condenses; the gases' solubility in the condensate neglected (D-007, L-4)"
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out}
      - {id: cond, direction: out, delegates: cond1}
      - {id: cool, direction: out, kind: energy, delegates: cool1}
  - id: E104
    block: METH
    title: Electric preheater of the polishing reactor
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-104}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: power1}
  - id: R102
    block: METH
    title: Polishing reactor (oil-cooled tubular fixed bed, nickel pellets, isothermal)
    class: ReactingChemicals
    reactions: [SAB]
    reactor: conversion
    conversion: {SAB: 0.976212}   # scripts/balance.py: the ideal-gas equilibrium of SAB and RWGS at 513.15 K and 1400 kPa(a) (D-005)
    energy_port: heat
    links: [{target: equipment, ref: R-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: out, kind: energy, delegates: heat2}
  - id: V102
    block: METH
    title: Product gas coolers (10 C) and second knock-out drum
    class: Separating
    links: [{target: equipment, ref: E-105}, {target: equipment, ref: V-102}]
    recovery:
      outlets:
        gas: {H2: 1.0, CO2: 1.0, CH4: 1.0, CO: 1.0, H2O: 0.0057048}
      provenance: assumed
      source: "scripts/balance.py: the gas saturated with water at 283.15 K and 1380 kPa(a) (IAPWS-95, chemicals 1.5.2), the rest condenses (D-007, L-4)"
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out, delegates: gas}
      - {id: cond, direction: out, delegates: cond2}
      - {id: cool, direction: out, kind: energy, delegates: cool2}
  - id: U101
    block: METH
    title: Balance of plant (10 C chiller, oil and cooling-water pumps, air-cooler fans, instruments)
    class: ProcessStep
    ports:
      - {id: power, direction: in, kind: energy, delegates: power}
  # OIL (D-009)
  - id: H301
    block: OIL
    title: Thermal oil circuit (pumps, expansion vessel, oil cooler)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: H-301}]
    ports:
      - {id: r101, direction: in, kind: energy, delegates: r101}
      - {id: r102, direction: in, kind: energy, delegates: r102}
      - {id: co2, direction: out, kind: energy, delegates: co2}
      - {id: out, direction: out, kind: energy, delegates: out}
  # GAS (D-008)
  - id: A201
    block: GAS
    title: Adsorption dryers (two vessels, one adsorbing, one regenerating)
    class: Adsorbing
    links: [{target: equipment, ref: A-201}]
    recovery:
      outlets:
        out: {H2: 1.0, CO2: 1.0, CH4: 1.0, CO: 1.0, H2O: 0.0}
      provenance: assumed
      source: "D-008: the residual water removed to the grid's dew point (a few ppm, not counted); the regeneration gas in a closed loop, its water condensed to the condensate (L-5)"
    ports:
      - {id: in, direction: in, delegates: gas}
      - {id: out, direction: out}
      - {id: water, direction: out}
  - id: K201
    block: GAS
    title: Grid injection compressor with aftercooler
    class: Compressing
    links: [{target: equipment, ref: K-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: sng}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M102
    block: GAS
    title: Condensate collection
    class: Mixing
    ports:
      - {id: c1, direction: in, delegates: cond1}
      - {id: c2, direction: in, delegates: cond2}
      - {id: c3, direction: in}
      - {id: out, direction: out, delegates: cond}

