  # feeds (scripts/balance.py; D-002, D-003)
  - {id: S1, title: Hydrogen feed, from: H2.out, to: K101.in, template: process_gas, state: {design: {temperature: {value: 303.15, provenance: assumed, source: D-006}, pressure: {value: 120.0, provenance: assumed, source: "D-006: an atmospheric alkaline electrolyser's outlet"}, flow: {value: 18.152, basis: mass, provenance: assumed, source: "scripts/balance.py: 9.0045 kmol/h, 200 Nm3/h (STORE&GO D5.9 section 4.1, 95 % load)"}, composition: {basis: mole_fraction, values: {H2: 1.0, CO2: 0.0, CH4: 0.0, CO: 0.0, H2O: 0.0}, provenance: assumed, source: "scripts/balance.py: dry hydrogen from the electrolysis plant (D-003)"}}}}
  - {id: S3, title: CO2 from the pipeline, from: CO2.out, to: E100.in, template: process_gas, state: {design: {temperature: {value: 303.15, provenance: assumed, source: "D-003: carbon-capture-1's product, 15.3 MPa and 30 C"}, pressure: {value: 15300.0, provenance: assumed, source: D-003}, flow: {value: 99.092, basis: mass, provenance: assumed, source: "scripts/balance.py: stoichiometric H2/CO2 of 4 (STORE&GO D5.9 appendix 8.4), 2.2511 kmol/h CO2"}, composition: {basis: mole_fraction, values: {H2: 0.0, CO2: 0.9995, CH4: 0.0, CO: 0.0, H2O: 0.0005}, provenance: assumed, source: "scripts/balance.py: carbon-capture-1's 99.95 mol% CO2 with 500 ppm water (D-003)"}}}}
