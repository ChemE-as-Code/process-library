id: e-methane-by-two-stage-co2-methanation-of-electrolytic-hydrogen-200-nm3-h-h2-50.8-nm3-h-sng
title: e-Methane by two-stage CO2 methanation of electrolytic hydrogen (200 Nm3/h H2, 50.8 Nm3/h SNG)
description: Unallocated foreground LCI of e-Methane by two-stage CO2 methanation of electrolytic hydrogen
  (200 Nm3/h H2, 50.8 Nm3/h SNG), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: DE
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Two-stage catalytic CO2 methanation on nickel after the STORE&GO Falkenhagen demonstration:
  dry electrolytic hydrogen compressed to 1.53 MPa(a), CO2 let down from a 15.3 MPa dense-phase pipeline,
  mixed 4:1, preheated to 523 K, an oil-cooled honeycomb reactor at 623 K (92 % conversion), cooling to
  283 K with water knock-out (the condensate degassed in an atmospheric tank), an electric preheater and
  an oil-cooled fixed-bed polishing reactor at 513 K to equilibrium (99.77 % hydrogen conversion overall),
  cooling and knock-out, two adsorption dryers and an injection compressor to 5.0 MPa(a); the reaction
  heat rejected through the thermal oil cooler at a site without a heat user'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:start-up-flaring
  title: combustion emissions of R-101, R-102
  direction: output
  reason: 'Off-spec gas flared during start-up until the injection quality is reached (STORE&GO D5.9 section
    4.1.1: about 33 Nm3 per start from hot standby at the demonstration, whose large dead volume an industrial
    design would avoid) is not estimated: continuous operation at the design point is assumed (D-002,
    L-6).'
- key: emission-excluded:fugitive-methane
  title: storage-tank emissions of K-201, A-201
  direction: output
  reason: 'Fugitive methane from the injection compressor''s seals, the dryers'' switching and flanges
    is not estimated: no open measured rate was read for this concept (D-011, L-6).'
- key: emission-excluded:dryer-regeneration
  title: storage-tank emissions of A-201
  direction: output
  reason: The dryers' regeneration is a closed loop (ASSUMED); its heat and any purge are not counted
    (D-008, L-5).
