    - {chemical: carbon-dioxide/dense-153bara-99.95, role: feedstock, inventory_key: "feed:CO2", note: "Dense-phase CO2, 99.95 mol% with 500 ppm water, 15.3 MPa, from carbon-capture-1 (linked in lca/mappings.yaml), 2.732 kg/kg SNG; fossil carbon (an ammonia plant's stripper vent)"}
  outputs:
    - {chemical: methane/synthetic-natural-gas, role: main-product, inventory_key: "product:SNG", note: "Synthetic natural gas, 99.06 mol% CH4, 0.75 mol% H2, 0.19 mol% CO2, dry, 5000 kPa(a), to the transport grid; 36.27 kg/h, 50.84 Nm3/h, 0.9939 kg CH4 and 49.8 MJ LHV per kg"}
    - {chemical: wastewater, role: waste, inventory_key: "product:COND", note: "Process condensate (the reaction water), 2.233 kg/kg SNG, to treatment"}
  utilities:
