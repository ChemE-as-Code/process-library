# Process Atlas manifest of e-methane-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: e-methane-1
title: e-Methane (synthetic natural gas) by two-stage catalytic CO2 methanation of electrolytic hydrogen (289 t/a)
summary: >-
  Power-to-gas after the STORE&GO Falkenhagen demonstration: electrolytic hydrogen and pipeline
  CO2 (4:1) react on nickel in an oil-cooled honeycomb reactor (92 %) and a polishing bed to
  equilibrium; the gas is dried and injected into the grid. Concept stage, 50.8 Nm3/h SNG of
  98.99 mol% methane, preliminary LCI with the hydrogen an open gap.
description: |
  9.0045 kmol/h (200 Nm3/h) of dry hydrogen from an electrolysis plant, compressed in two
  intercooled stages from 120 to 1530 kPa(a), and 2.2511 kmol/h of CO2 (H2/CO2 = 4), let down
  from carbon-capture-1's dense-phase pipeline at 15.3 MPa with a thermal-oil heater, are mixed,
  preheated to 523 K against the effluent and fed to an oil-cooled honeycomb reactor at about
  623 K, where 92 % of the CO2 is converted to methane: the measured and simulated value of the
  STORE&GO demonstration at Falkenhagen (D5.9, DVGW 2020, Table 4-1) at its 95 % load point,
  which is the design point. The effluent, 58 mol% water, leaves the feed/effluent exchanger at
  442 K, below its dew point, and is cooled by air to 333 K and by chilled water to 283 K; 74.8
  kg/h of reaction water is knocked out. An electric preheater brings the gas to 513 K for an
  oil-cooled fixed-bed polishing reactor, where the remaining CO2 reaches its ideal-gas
  equilibrium (98.9 % converted; 99.77 % of the hydrogen overall). After a second cooling and
  knock-out the gas is dried in two adsorbers and compressed to 5.0 MPa(a) for a transport grid:
  36.13 kg/h, 50.82 Nm3/h of SNG with 98.99 mol% CH4, 0.93 mol% H2 and 0.08 mol% CO2 (D5.9
  measured 99 vol-% CH4; the grid takes below 2 vol-% each of H2 and CO2), 555 kW on HHV, 289
  t/a in 8000 h. The methanation efficiency (HHV) is 77.7 %, against 77.5 % measured and 78.0 %
  in the source's ASPEN model. The electricity, computed part by part with ASSUMED efficiencies,
  is 0.92 kWh per Nm3 of SNG: 41.8 kW for the methanation unit (the source measured 41 kW with
  the mixed feed compressed and gives 0.7 kWh/m3 for a changed compressor configuration) and
  0.1 kWh/Nm3 for injection. The reactors give 101.5 kW to the oil, of which 94.7 kW at about
  180-200 C would be usable (1.86 kWh/Nm3; 86 kW, 1.7 kWh/Nm3 used at Falkenhagen) but go to an
  air cooler at this generic site. The CO2, methane and hydrogen dissolved in the condensate
  (Henry's law, 0.17 kg/h) are released at the atmospheric condensate tank. The plant is
  modelled with cheme-as-code's conversion reactors (the honeycomb at the measured conversion,
  the polishing bed at the equilibrium conversion the balance script solves from the same data
  on the same feed, checked by `cheme process reactors`: ln(Q/K) 0.0001), component separators
  for the knock-outs, the dryer and the condensate tank, mixers and pass-through steps
  (DESIGN.md D-004, D-005, D-007, L-1, L-2). The screening carbon footprint is 0.26 kg CO2-eq
  per kg of SNG: the plant's electricity (UK grid factor as a proxy) and the methane and CO2
  released from the condensate; the electrolytic hydrogen, about 31 kWh of electrolyser power
  per kg of SNG at the demonstration's efficiency, is an open gap, so the result is far from a
  complete footprint. The CO2 links to carbon-capture-1 in the Atlas build; its carbon is
  fossil. See DESIGN.md for every assumption.
families: [synthetic-fuels]
keywords: [e-methane, synthetic natural gas, SNG, power-to-gas, PtG, CO2 methanation, Sabatier reaction, nickel catalyst, honeycomb reactor, polishing reactor, electrolytic hydrogen, carbon capture and utilisation, CCU, e-fuel, STORE&GO, Falkenhagen, grid injection]
facets:
  feedstock_basis: [electricity, fossil]
  product_classes: [fuels]
  unit_operations: [compression, reaction, heat-exchange, condensation, adsorption]
  region: EU
# Honest claim: concept is the lowest level of the manifest. The design point, the first
# stage's conversion and the electricity are the demonstration's measured values; the rest is
# ideal-gas thermodynamics with ASSUMED temperatures, pressures and efficiencies (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD with closed mass and element balances (cheme validate, cheme process streams: 4
    blocks and 16 steps within tolerance). Calculated by cheme process propagate: the mixers,
    the honeycomb reactor R101 (conversion reactor, 92 % of the CO2, STORE&GO D5.9 Table 4-1)
    and the polishing reactor R102 (conversion reactor at the ideal-gas equilibrium conversion
    of the Sabatier and reverse water-gas shift reactions at 513.15 K and 1400 kPa(a), 98.94 %,
    which scripts/balance.py solves on the same feed), both reactors' heat to the thermal oil
    (Q3 93.03 kW, Q5 8.50 kW), the knock-outs V101 and V102, the dryer A201 and the condensate
    tank T101 (component separators). cheme process reactors: ln(Q/K) -4.61 at R101's outlet
    (short of equilibrium, as measured) and 0.0001 at R102's (at equilibrium). scripts/balance.py
    gives the feeds, the water saturation (IAPWS-95) and the gases dissolved in the condensate
    (Henry's law, ChemSep constants in thermo), the exchanger, cooler and heater duties (ideal
    gas, the effluent two-phase below its dew point after E-101), the CO2 let-down heat
    (Span-Wagner, CoolProp) and the electricity part by part (ASSUMED efficiencies), and
    reproduces the source's SNG output (555.2 against 549 kW measured and 557 kW ASPEN, HHV),
    methanation efficiency (77.7 against 77.5 and 78.0 %) and methane content (98.99 against 99
    vol-%); its methanation unit's electricity, 0.82 kWh/Nm3, compares with 0.8 measured as
    built (the mixed feed compressed) and 0.7 for a changed compressor configuration. Not
    modelled: kinetics and hot spots, carbon deposition, start-up and part load, the dryers'
    regeneration. Preliminary gate-to-gate LCI: the hydrogen an open gap, the CO2 linked to
    carbon-capture-1 in the Atlas build, electricity linked to the shared entry; screening
    carbon footprint 0.26 kg CO2-eq/kg from the plant's electricity and the gases released from
    the condensate. cheme maturity reaches no level (assumed feeds and separations); the claim
    `maturity: concept` is the lowest value of the schema, not an evidenced level. Not
    reviewed. Needs cheme-as-code 1.13.0.
