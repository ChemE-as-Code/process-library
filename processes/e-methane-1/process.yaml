    - {chemical: carbon-dioxide/dense-153bara-99.95, role: feedstock, inventory_key: "feed:CO2", note: "Dense-phase CO2, 99.95 mol% with 500 ppm water, 15.3 MPa, from carbon-capture-1 (linked in lca/mappings.yaml), 2.743 kg/kg SNG; captured CO2 of fossil carbon (an ammonia plant's stripper vent)"}
  outputs:
    - {chemical: methane/synthetic-natural-gas, role: main-product, inventory_key: "product:SNG", note: "Synthetic natural gas, 98.99 mol% CH4, 0.93 mol% H2, 0.08 mol% CO2, dry, 5000 kPa(a), to the transport grid; 36.13 kg/h, 50.82 Nm3/h, 0.9965 kg CH4 and 50.0 MJ LHV per kg"}
    - {chemical: wastewater, role: waste, inventory_key: "product:COND", note: "Process condensate (the reaction water), degassed, 2.240 kg/kg SNG, to treatment"}
    - {chemical: carbon-dioxide, role: emission, inventory_key: "product:VENT", note: "Gases dissolved in the condensate and released at the condensate tank: 0.0041 kg CO2 and 0.0007 kg CH4 per kg SNG, fossil (D-007)"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "1.297 kWh/kg SNG, computed part by part in scripts/balance.py (DESIGN.md D-006): hydrogen compressor 28.1 kW (isentropic efficiency 0.70 ASSUMED), electric preheater 7.2 kW, chiller, fans and pumps 6.4 kW (COP and specific power ASSUMED), together 41.8 kW for the methanation unit (STORE&GO D5.9 Table 4-1 measured 41 kW as built, with the mixed feed compressed: a cross-check, not the source of the split), and the injection compressor at 0.1 kWh/Nm3 (D5.9 Table 4-2)"}
basis:
  capacity: "200 Nm3/h hydrogen (9.0045 kmol/h) and 50 Nm3/h CO2, 36.13 kg/h (50.82 Nm3/h) SNG, 289 t/a in 8000 h: the Falkenhagen methanation unit at its 95 % load point (STORE&GO D5.9 Table 4-1), DESIGN.md D-002"
  operating_hours_per_year: 8000
  location: generic site in Germany at a transport gas grid and a dense-phase CO2 pipeline, next to an electrolysis plant (not chosen)
