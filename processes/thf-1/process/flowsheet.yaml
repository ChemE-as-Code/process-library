  # Energy streams (duties from scripts/thf_balance.py, D-006; ASSUMED until core qualifies them)
  - {id: Q1, title: P-101 power, kind: energy, from: POWER.p101, to: P101.power, state: {design: {duty: {value: 0.39, provenance: assumed, source: "scripts/thf_balance.py, 300 -> 400 kPa(a), efficiency 0.6 (D-008)"}}}}
