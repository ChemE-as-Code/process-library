# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# THF from 1,4-butanediol by acid-catalysed cyclodehydration (reactive distillation) and
# pressure-swing distillation of the THF/water azeotrope (D-001). Where the values come from:
# - feed conditions, reactor and column pressures and temperatures are design choices (design
#   basis, D-002 .. D-008), ASSUMED; the reactor temperature and catalyst follow US 9284289 B2;
# - the reactor outlet S5 is calculated by cheme (conversion reactor, D-005);
# - flows through mixers, pumps and coolers are calculated by `cheme process propagate --fill`;
# - the BDO feed, the reactor overhead and bleed, the column outlets and all duties come from
#   the independent balance scripts/thf_balance.py (D-006), given here as ASSUMED: core cannot
#   yet qualify the THF / water activity-coefficient VLE or a liquid-phase reactor's energy
#   balance (core #315).
schema: cheme/process/v1
kind: flowsheet
title: Tetrahydrofuran from 1,4-butanediol (50 kt/a, cyclodehydration and pressure-swing distillation)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 6250 kg/h THF (99.95 wt%), BDO conversion 0.9906 per pass with the heavies bleed, THF selectivity 0.995, LP 110 / HP 800 kPa(a) columns (D-002, D-005, D-007)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: BDOF, title: "1,4-Butanediol feed (boundary feed, D-003)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PTSAF, title: p-Toluenesulfonic acid catalyst make-up, category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports: [{id: p101, direction: out, kind: energy}, {id: p201, direction: out, kind: energy}]
  - id: MPS
    title: MP steam 1000 kPa(a)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1000, provenance: assumed, source: "design basis, D-008"}
      supply_temperature: {value: 453.0, provenance: assumed, source: "saturation at 1000 kPa(a), D-008"}
      min_approach: {value: 10, provenance: assumed, source: D-008}
    ports: [{id: r101, direction: out, kind: energy}, {id: c202, direction: out, kind: energy}]
  - id: LPS
    title: LP steam 450 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis, D-008"}
      supply_temperature: {value: 420.8, provenance: assumed, source: "saturation at 450 kPa(a), D-008"}
      min_approach: {value: 10, provenance: assumed, source: D-008}
    ports: [{id: c201, direction: out, kind: energy}]
products:
  - {id: THFP, title: THF product to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: WW, title: Process water (LP column bottoms) to wastewater treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - {id: BLEED, title: "Reactor heavies bleed (BDO, oligomers, catalyst) to incineration", category: by_product, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-008"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-008"}
      min_approach: {value: 5, provenance: assumed, source: D-008}
    ports:
      - {id: c101, direction: in, kind: energy}
      - {id: c201, direction: in, kind: energy}
      - {id: e203, direction: in, kind: energy}
      - {id: e204, direction: in, kind: energy}

blocks:
  - id: RXN
    title: BDO cyclodehydration (reactive distillation)
    class: ReactingChemicals
    ports:
      - {id: bdo, direction: in}
      - {id: cat, direction: in}
      - {id: crude, direction: out}
      - {id: bleed, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: steam, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: SEP
    title: Pressure-swing distillation of THF / water
    class: Distilling
    ports:
      - {id: feed, direction: in}
      - {id: thf, direction: out}
      - {id: water, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: lps, direction: in, kind: energy}
      - {id: mps, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: cw3, direction: out, kind: energy}

steps:
  - id: M101
    block: RXN
    title: BDO and catalyst make-up junction
    class: Mixing
    ports:
      - {id: bdo, direction: in, delegates: bdo}
      - {id: cat, direction: in, delegates: cat}
      - {id: out, direction: out}
  - id: P101
    block: RXN
    title: BDO feed pump
    class: GeneratingFlow
    links: [{target: equipment, ref: P-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  # D-004, D-005: liquid-phase reactor at 418 K with the homogeneous acid; the per-pass BDO
  # conversion is the plant conversion set by the heavies bleed (the reactor holds the BDO back
  # under its rectifying column), THF selectivity 0.995 ASSUMED.
  - id: R101
    block: RXN
    title: Dehydration reactor (stirred, steam-heated, homogeneous p-TSA)
    class: ReactingChemicals
    reactions: [CYCLO, ETHER]
    reactor: conversion
    selectivity: {key: BDO, conversion: 0.990637769, products: {THF: 0.995}, provenance: assumed, source: "D-005: THF selectivity ASSUMED; conversion from the bleed specification (30 wt% heavies, scripts/thf_balance.py)"}
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: steam}
  - id: C101
    block: RXN
    title: Reactor rectifying column, overhead condenser and heavies bleed
    class: Distilling
    links: [{target: equipment, ref: C-101}, {target: equipment, ref: E-101}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out, delegates: crude}
      - {id: bot, direction: out, delegates: bleed}
      - {id: cond, direction: out, kind: energy, delegates: cw}
  - id: M201
    block: SEP
    title: LP column feed junction (crude THF + HP column recycle)
    class: Mixing
    ports:
      - {id: fresh, direction: in, delegates: feed}
      - {id: rec, direction: in}
      - {id: out, direction: out}
  - id: C201
    block: SEP
    title: LP column (110 kPa(a)), water bottoms
    class: Distilling
    links: [{target: equipment, ref: C-201}, {target: equipment, ref: E-201}, {target: equipment, ref: E-202}, {target: equipment, ref: E-205}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out}
      - {id: bot, direction: out}
      - {id: reb_int, direction: in, kind: energy}
      - {id: reb, direction: in, kind: energy, delegates: lps}
      - {id: cond, direction: out, kind: energy, delegates: cw2}
  - id: P201
    block: SEP
    title: HP column feed pump
    class: GeneratingFlow
    links: [{target: equipment, ref: P-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: C202
    block: SEP
    title: HP column (800 kPa(a)), THF bottoms
    class: Distilling
    links: [{target: equipment, ref: C-202}, {target: equipment, ref: E-206}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: mps}
      - {id: cond, direction: out, kind: energy}
  - id: E203
    block: SEP
    title: THF product cooler
    class: Cooling
    links: [{target: equipment, ref: E-203}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: thf}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: E204
    block: SEP
    title: Process water cooler
    class: Cooling
    links: [{target: equipment, ref: E-204}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: water}
      - {id: cw, direction: out, kind: energy, delegates: cw3}

streams:
  - id: S1
    title: BDO feed
    from: BDOF.out
    to: M101.bdo
    template: mixture
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: "design basis, D-003"}
        temperature: {value: 303.15, provenance: assumed, source: "design basis, D-003"}
        flow: {value: 7921.18, basis: mass, provenance: assumed, source: "scripts/thf_balance.py: the BDO that gives 6250 kg/h THF (D-002, D-005, D-006)"}
        composition: {basis: mass_fraction, values: {BDO: 1.0}, provenance: assumed, source: "design basis, D-003: pure BDO (impurities not modelled)"}
  - id: S2
    title: Catalyst make-up
    from: PTSAF.out
    to: M101.cat
    template: mixture
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: "design basis, D-004"}
        temperature: {value: 303.15, provenance: assumed, source: "design basis, D-004"}
        flow: {value: 2.354, basis: mass, provenance: assumed, source: "scripts/thf_balance.py: replaces the p-TSA leaving with the bleed (2 wt% in the reactor liquid, D-004)"}
        composition: {basis: mass_fraction, values: {PTSA: 1.0}, provenance: assumed, source: "D-004: dosed as acid (anhydrous basis)"}
  - id: S3
    title: Reactor feed
    from: M101.out
    to: P101.in
    template: mixture
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: D-004}
        temperature: {value: 303.15, provenance: assumed, source: D-004}
        flow: {value: 7923.53, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S2', fingerprint: dbc19a1364654c89}
        composition: {basis: mole_fraction, values: {BDO: 0.999844, THF: 0.0, H2O: 0.0, DHBE: 0.0, PTSA: 0.000155503}, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S2', fingerprint: 5319055b2b5765a1}
  - id: S4
    title: Pumped reactor feed
    from: P101.out
    to: R101.in
    template: mixture
    state:
      design:
        pressure: {value: 400, provenance: assumed, source: D-004}
        temperature: {value: 303.15, provenance: assumed, source: "D-004: pump temperature rise neglected"}
        flow: {value: 7923.53, provenance: calculated, source: 'cheme process propagate: pass-through P101 from S3', fingerprint: 25c22d5ff6c86a83}
        composition: {basis: mole_fraction, values: {BDO: 0.999844, THF: 0.0, H2O: 0.0, DHBE: 0.0, PTSA: 0.000155503}, provenance: calculated, source: 'cheme process propagate: pass-through P101 from S3', fingerprint: 25c22d5ff6c86a83}
  - id: S5
    title: Reactor contents to the rectifying column (model stream)
    from: R101.out
    to: C101.feed
    template: mixture
    state:
      design:
        pressure: {value: 130, provenance: assumed, source: D-004}
        temperature: {value: 418.15, provenance: assumed, source: "D-004: 145 C, inside the 120-180 C of US 9284289 B2"}
        flow: {value: 7923.53, provenance: calculated, source: 'cheme process propagate: reactor R101 from S4', fingerprint: 9b5bcbe8adbd05e3}
        composition: {basis: mole_fraction, values: {BDO: 0.00471449, THF: 0.496356, H2O: 0.497604, DHBE: 0.00124713, PTSA: 7.83181e-05}, provenance: calculated, source: 'cheme process propagate: reactor R101 from S4', fingerprint: 65d1dae12d827f26}
  - id: S6
    title: Crude THF / water condensate
    from: C101.top
    to: M201.fresh
    template: mixture
    state:
      design:
        pressure: {value: 130, provenance: assumed, source: D-004}
        temperature: {value: 313.15, provenance: assumed, source: D-004}
        flow: {value: 7805.819, basis: mass, provenance: assumed, source: "scripts/thf_balance.py: all THF and the water not in the bleed; no BDO overhead (US 9284289 B2 reports BDO below 10 ppm in its condensate) (D-006)"}
        composition: {basis: mass_fraction, values: {THF: 0.8003003, H2O: 0.1996997}, provenance: assumed, source: "scripts/thf_balance.py (D-006); about 80 wt% THF, as the condensates of US 9284289 B2 (78-80 wt%)"}
  - id: S7
    title: Heavies bleed
    from: C101.bot
    to: BLEED.in
    template: mixture
    state:
      design:
        pressure: {value: 130, provenance: assumed, source: D-004}
        temperature: {value: 418.15, provenance: assumed, source: D-004}
        flow: {value: 117.714, basis: mass, provenance: assumed, source: "scripts/thf_balance.py: removes the DHBE formed at 30 wt% in the reactor liquid (D-005)"}
        composition: {basis: mass_fraction, values: {BDO: 0.63, H2O: 0.05, DHBE: 0.30, PTSA: 0.02}, provenance: assumed, source: "D-004, D-005: reactor liquid with 5 wt% water (US 9284289 B2: 2-8 wt%), 2 wt% p-TSA (0.2-5 wt%), 30 wt% heavies ASSUMED"}
  - id: S8
    title: HP column distillate recycle
    from: C202.top
    to: M201.rec
    template: mixture
    state:
      design:
        pressure: {value: 800, provenance: assumed, source: D-007}
        temperature: {value: 410.40, provenance: assumed, source: "scripts/thf_balance.py, bubble point at 800 kPa(a) (D-006)"}
        flow: {value: 8223.906, basis: mass, provenance: assumed, source: "scripts/thf_balance.py (D-007)"}
        composition: {basis: mass_fraction, values: {THF: 0.89526384, H2O: 0.10473616}, provenance: assumed, source: "D-007: 0.03 mol/mol above the 800 kPa(a) azeotrope (NRTL, x_THF 0.651)"}
  - id: S9
    title: LP column feed
    from: M201.out
    to: C201.feed
    template: mixture
    state:
      design:
        pressure: {value: 110, provenance: assumed, source: D-007}
        temperature: {value: 339.6, provenance: assumed, source: "scripts/thf_balance.py: partly flashing mixture, q 0.94 (D-006)"}
        flow: {value: 16029.7, provenance: calculated, source: 'cheme process propagate: mixer M201 from S6 S8', fingerprint: 6fcfe70cb254a03c}
        composition: {basis: mole_fraction, values: {BDO: 0.0, THF: 0.584197, H2O: 0.415803, DHBE: 0.0, PTSA: 0.0}, provenance: calculated, source: 'cheme process propagate: mixer M201 from S6 S8', fingerprint: 43100f05080abdd1}
  - id: S10
