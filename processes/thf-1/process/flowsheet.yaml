        flow: {value: 14473.906, basis: mass, provenance: assumed, source: "scripts/thf_balance.py (D-007)"}
        composition: {basis: mass_fraction, values: {THF: 0.94027422, H2O: 0.05972578}, provenance: assumed, source: "D-007: 0.03 mol/mol below the 110 kPa(a) azeotrope (NRTL, x_THF 0.827)"}
  - id: S11
