        flow: {value: 14473.906, basis: mass, provenance: calculated, source: 'cheme process propagate: pass-through P201 from S10', fingerprint: 4d3bc2bdfd5742f5}
        composition: {basis: mass_fraction, values: {THF: 0.94027422, H2O: 0.05972578}, provenance: calculated, source: 'cheme process propagate: pass-through P201 from S10', fingerprint: 4d3bc2bdfd5742f5}
  - id: S12
    title: LP column bottoms (process water)
    from: C201.bot
    to: E204.in
    template: mixture
    state:
      design:
        pressure: {value: 110, provenance: assumed, source: D-007}
        temperature: {value: 375.41, provenance: assumed, source: "scripts/thf_balance.py, bubble point (D-006)"}
        flow: {value: 1555.819, basis: mass, provenance: assumed, source: "scripts/thf_balance.py (D-007)"}
        composition: {basis: mass_fraction, values: {THF: 0.00008004, H2O: 0.99991996}, provenance: assumed, source: "D-007: x_THF 2e-5 (80 ppm by weight) ASSUMED"}
