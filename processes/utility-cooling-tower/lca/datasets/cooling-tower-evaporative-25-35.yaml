schema: cheme/lci_dataset/v2
kind: lci_dataset
id: cooling-tower-evaporative-25-35
title: Heat rejection in an evaporative cooling tower, 25/35 degC
description: Per 1 MWh of heat rejected from cooling water supplied at 25 degC and returned at 35 degC,
  in a mechanical-draught wet cooling tower. Make-up water, evaporation, drift and blowdown follow from
  the tower's air-side energy balance at an ASSUMED ambient state.
basis: 1000 kWh of heat rejected from the circulating cooling water
boundary: 'gate-to-gate: cooling tower, basin, circulating pumps; make-up withdrawn from nature, blowdown
  to wastewater treatment'
technology: mechanical-draught evaporative (wet) cooling tower, open recirculating system
geography:
  description: 'Generic: one ASSUMED ambient state (20 degC, 60 % RH). Evaporation per kWh changes with
    the climate.'
classification:
  isic: '3600'
system_boundary:
  included:
  - make-up water as a water resource
  - evaporation and drift to air
  - blowdown to wastewater treatment
  - pump and fan electricity
  excluded:
  - 'TODO water treatment chemicals (biocide, scale and corrosion inhibitor, acid for pH): the dosing
    programme is not sourced; the acceptance criterion of #45 needs them'
  - raw-water pretreatment (clarification, softening) of the make-up
  - the dissolved solids and biocide residues carried by drift and blowdown
  - infrastructure (tower, basin, fill)
  cutoff: none applied; the excluded flows are not quantified (TODO)
  infrastructure: excluded
  non_routine: excluded
