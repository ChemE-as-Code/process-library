# Process Atlas manifest. Schema: schemas/process.schema.json. A manifest-only process: its LCI
# dataset is lca/datasets/*.yaml, Tier 0 form, so maturity stays at concept
# (core's cheme.lci-tier-maturity). See README.md.
schema: cheme-as-code/process/v1
id: phthalimide-1
title: Phthalimide by continuous reaction of molten phthalic anhydride with ammonia
summary: >-
  Tier 0 screening per tonne of phthalimide: stoichiometry with a BASF patent's yield and ammonia
  ratio (ejector and tube reactor, continuous), electricity and heat from core's defaults. Phthalic
  anhydride is bought in. No flowsheet; not reviewed.
families: [nitrogen-organics]
keywords: [phthalimide, phthalic anhydride, ammonia, ammonolysis, imidation, melt reaction, flaking]
facets: {feedstock_basis: [fossil], product_classes: [chemicals], unit_operations: [reaction, absorption], region: generic}
maturity: concept
validation: {status: unreviewed}
chemistry:
  inputs:
    - {chemical: phthalic-anhydride, role: feedstock, inventory_key: "feed:phthalic-anhydride", note: "molten, bought in: no library process makes it"}
    - {chemical: ammonia, role: feedstock, inventory_key: "feed:ammonia", note: "vaporised; linked to ammonia-1"}
  outputs:
    - {chemical: phthalimide, role: main-product, inventory_key: "product:phthalimide"}
    - {chemical: wastewater, role: waste, inventory_key: "output:wastewater", note: "reaction water from the off-gas absorber; the absorption water itself is not counted (TODO)"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:electricity", note: "core's Tier 0 default (ASSUMED, dated)"}
basis: {capacity: "per tonne of phthalimide (the dataset's basis); no plant size"}
publication: {status: public, license: CC-BY-4.0}
references:
  - {title: "BASF AG (1983) Continuous preparation of phthalimide. US Patent 4,419,519 (description and Examples 1 and 2)", url: "https://patents.google.com/patent/US4419519A/en"}
  - {title: "BASF AG (1977) Continuous manufacture of phthalimide. US Patent 4,001,273 (route context: countercurrent column and off-gas wash)", url: "https://patents.google.com/patent/US4001273A/en"}
  - {title: "Chemcess: Phthalimide: properties, reactions, production and uses (secondary summary citing Ullmann's; continuous industrial practice, tube-process yield)", url: "https://chemcess.com/?p=28683"}
repository: {url: "https://github.com/ChemE-as-Code/process-library", path: processes/phthalimide-1, access: public}
