# phthalimide-1's own exchange overrides for the Atlas LCI build (ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Phthalic anhydride stays a reported gap: no
# library process makes it and the shared vocabulary has no entry for it.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:ammonia": {dataset: {path: processes/ammonia-1/lca/dataset.yaml, product: "product:NH3"}, source: "the Atlas producer ammonia-1, refrigerated liquid ammonia; its vaporisation and heating to about 260 degC are in this dataset's heat"}
  "feed:heat": {use: heat-natural-gas, source: "core's Tier 0 heat default, heat from fossil fuel in kWh, taken as natural-gas-fired heat absorbed (ASSUMED carrier; the patent's heated jackets and melt lines may run on hot oil or HP steam instead)"}
