  value: 1000.0
  unit: kg
  description: Phthalimide delivered (the basis), counted as phthalimide.
  source: basis
- name: M_PI
  value: 147.133
  unit: g/mol
  description: Molar mass of phthalimide (C8H5NO2).
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573),
    applied to the formula
- name: M_PA
  value: 148.117
  unit: g/mol
  description: Molar mass of phthalic anhydride (C8H4O3).
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573),
    applied to the formula
- name: M_N
  value: 17.031
  unit: g/mol
  description: Molar mass of ammonia.
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573),
    applied to the formula
- name: M_W
  value: 18.015
  unit: g/mol
  description: Molar mass of water.
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573),
    applied to the formula
- name: Y
  value: 0.996
  unit: dimensionless
  description: 'Phthalimide per phthalic anhydride fed, fraction of theory: midpoint of the patent''s two
    examples, 0.994 and 0.998. The patent counts the product as obtained (99.6 to 99.8 wt% phthalimide,
    the rest phthalic anhydride), so the yield of pure phthalimide is about 0.2 to 0.4 points lower; the
    dataset counts the product as pure phthalimide.'
  source: 'US 4,419,519 (BASF AG, 1983) Continuous preparation of phthalimide, Examples 1 and 2 (melt plus
    the phthalimide recovered from the off-gas). Pilot-scale tube reactors of 25 and 100 mm; that they
    stand for an industrial plant, and taking the midpoint, are ASSUMED'
- name: r_N
  value: 1.002
  unit: dimensionless
  description: 'Ammonia per phthalic anhydride fed, mol/mol: midpoint of the two examples, 1.000 and 1.003
    (46 parts NH3 on 400 parts anhydride, 82.5 on 715), the runs that give the yield Y. The description
    prefers 1 to 1.02, in particular 1.'
  source: US 4,419,519 (BASF AG, 1983), Examples 1 and 2 (ratio computed by us with the molar masses), and
    the description (preferred molar ratio); the midpoint is our choice
- name: elec
  value: 333.3
  unit: kWh
  description: 'Electricity per t phthalimide: core''s Tier 0 default, 0.3333 kWh/kg.'
  source: 'ASSUMED: cheme tier-defaults 1.0.0: electricity [ASSUMED]: 1.2 MJ (0.333 kWh) per kg of product,
    attributed to the Gendorf (2000) site average that the ecoinvent v2-era chemicals proxies used. ASSUMED,
    not read in either source: Hischier et al. 2005 (p. 61) names the Gendorf (2000) average as the default
    but prints no value, and the number could not be confirmed in an open copy of Althaus et al. 2007
    (ecoinvent report No. 8). Dated: newer ecoinvent proxies rest on later Gendorf reports, so this value
    may be low for a present-day process. No open phthalimide figure was found; TODO source'
- name: heat
  value: 555.6
  unit: kWh
  description: 'Heat from fossil fuel per t phthalimide: core''s Tier 0 default, 0.5556 kWh/kg. The reaction
    is exothermic (the patent says so), so the default may overstate the reactor''s own demand; melting
    and heating the anhydride and vaporising and heating the ammonia to about 260 degC are the heat users.'
  source: 'ASSUMED: cheme tier-defaults 1.0.0: heat [ASSUMED]: 2.0 MJ (0.556 kWh) of heat per kg of product,
    generated from fossil fuel, attributed to the Gendorf (2000) site average that the ecoinvent v2-era
    chemicals proxies used; not read in either source; dated. No open phthalimide figure was found; TODO
    source'
