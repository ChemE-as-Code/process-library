# Tier 0 form, a manifest-only entry as process-library#313 piloted (PR #317). Every amount is the
# formula of its parameters; core's validator re-checks each. The yield and the ammonia ratio are a
# patent's figures (facts in our own form); electricity and heat are core's Tier 0 defaults.
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: phthalimide-pa-ammonia-continuous
title: Phthalimide by continuous reaction of molten phthalic anhydride with ammonia
description: Tier 0 screening estimate per 1 t of phthalimide, gate-to-gate. Molten phthalic anhydride and
  gaseous ammonia in about the stoichiometric ratio, mixed in an ejector and reacted in a heated tube at
  about 265 degC; the melt is flaked and the phthalimide in the off-gas is recovered by absorption in
  water. Feeds from stoichiometry with a patent's yield and ammonia ratio; electricity and heat from
  core's Tier 0 defaults.
basis: 1000 kg of phthalimide
boundary: 'gate-to-gate: phthalic anhydride melt and ammonia from storage, mixing and tube reaction,
  melt separation and flaking, off-gas absorption and phthalimide recovery; power and heat from outside;
  the effluent to treatment'
technology: continuous ejector mixing and tube reaction of molten phthalic anhydride with ammonia (1 to
  1.02 mol per mol), 240 to 280 degC, 2 to 10 bar; the batch melt routes, the countercurrent column, the
  urea route and o-xylene ammoxidation are not modelled
geography:
  description: 'A patent''s examples (BASF, Germany, priority 1979); no single site.'
classification:
  isic: '2011'
system_boundary:
  included:
  - phthalic anhydride and ammonia
  - electricity and heat (Tier 0 defaults)
  - reaction water, excess ammonia and unconverted phthalic anhydride to the effluent
  excluded:
  - 'TODO absorption water for the off-gas: the patent names the step (US 4,419,519, Example 1) but gives
    no amount, so the effluent volume is understated'
  - 'TODO drying of the phthalimide recovered from the absorption water: not described in the source'
  - 'TODO air emissions of the absorber vent (ammonia, phthalic anhydride, phthalimide dust): not quantified
    in the source; the dataset sends all unconverted material to the effluent, because the patent absorbs
    the off-gas in water (US 4,419,519, Example 1). This departs from core''s Tier 0 loss split (0.2 % of
    each reactant''s input mass to air, Hischier et al. 2005), which would give about 2.0 kg phthalic anhydride
    and 0.23 kg ammonia to air per t'
  - 'TODO cooling water of the flaking drum or belt and of the absorber: not quantified'
  - 'TODO nitrogen blanketing and heat-tracing losses of the melt lines: not quantified'
  - 'impurities of technical phthalic anhydride (90 to 95 wt%, which the patent allows): pure feed taken,
    as in the patent''s examples'
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: GLO
year: 1983
valid_until: 1988
time:
  start: 1979
  description: The patent has a 1979 priority (parent application filed 1980) and was granted in 1983. valid_until is the reference
    year + 5 (system-model section 6), so it has long lapsed; the energy defaults date from 2000.
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation (the effluent constituents are wastes)'
