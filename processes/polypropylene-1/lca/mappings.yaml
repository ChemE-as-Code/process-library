# polypropylene-1's own exchange overrides for the Atlas LCI build (ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Propylene stays a reported gap: the shared
# vocabulary has no entry, and the Atlas producer of the slug is not chosen here.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:propylene":
    atlas: false
    source: "Polymer-grade propylene; the supplier is not decided. ethylene-1's propylene (polymer grade, a cracker co-product) and propylene-pdh-1 are candidates. Link one explicitly once chosen."
  "feed:natural-gas":
    atlas: false
    source: "Pipeline natural gas: the only Atlas producer of the slug methane is hda-1's fuel gas, which is not natural gas (as utility-steam-ng-boiler)."
