# Tier 1 form, manifest-only entry (pattern of process-library#317). Every amount is the formula of its
# parameters; core's validator re-checks each. Numbers from a public report, used as facts in our own form.
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: polypropylene-bulk-gas-phase
title: Polypropylene by Ziegler-Natta polymerisation of propylene, bulk loop and gas phase
description: 'Per 1 t of polypropylene resin (pellets), gate-to-gate: the weighted average of three US
  plants of 2015-2016, about two-thirds bulk liquid-propylene loop (Spheripol type) and one-third gas
  phase (Unipol type), as reported by Franklin Associates for the American Chemistry Council (2021). Natural
  gas combustion from stoichiometry.'
basis: 1000 kg of polypropylene
boundary: 'gate-to-gate: monomer purification, polymerisation, monomer recovery, deactivation and purging,
  extrusion and pelletising; power, natural gas and nitrogen from outside'
technology: continuous Ziegler-Natta polymerisation in liquid propylene (loop reactors) or in the gas
  phase (fluidised bed), with extrusion; not the solvent slurry process or metallocene grades in particular
geography:
  description: United States, three plants; no single site.
classification:
  isic: '2013'
system_boundary:
  included:
  - propylene, nitrogen, electricity and natural gas
  - CO2 and water of the natural gas burnt, and the process CO2 the source reports
  - 'air emissions the source reports with a flow identity: NMVOC, PM2.5, NOx, CH4, N2O, CO, SO2, NH3'
  - off-gas residual, solid and hazardous wastes
  excluded:
  - 'TODO combustion emissions of the natural gas other than CO2 (NOx, CO, CH4, N2O, PM): no factor applied.
    The source''s Table 12 emissions are the plant''s process emissions, flaring included (report p. 24,
    PDF p. 29), and the report counts fuel burnt in boilers separately, so these are most likely missing
    here rather than double counted'
  - 'TODO fate of the off-gas residual (fuel gas burnt on site, flare, export): not split by the source'
  - 'TODO particulates 2.5 to 10 um (0.016 kg/t), particulates unspecified (0.010 kg/t, order of magnitude)
    and aldehydes (0.010 kg/t, order of magnitude) to air: reported by the source, no flow identity in
    the shared vocabulary yet'
  - 'TODO releases to water reported by the source (BOD5 and COD 0.010 kg/t each, order of magnitude;
    suspended solids 0.013 kg/t; zinc, fluoride, cyanide 1e-06 kg/t and dissolved solids 1e-04 kg/t, order
    of magnitude): no flow identity yet'
  - 'TODO water consumption (3 m3/t in the source): its withdrawal source and fate are not stated'
  - 'TODO catalyst, cocatalyst, donor and additives (stabilisers): not reported by the source; the POL
    BREF section 3.2.5.2.1 puts the catalyst left in the product below 100 g/t'
  - 'cogeneration fuel: the cogeneration electricity is supplied as grid electricity (ASSUMED; the report
    names natural gas as the cogeneration fuel of most data providers, report p. 14, but the library has
    no natural-gas CHP electricity dataset)'
  - 'pipeline transport of the propylene (38 t km/t in the source): transport is outside the gate-to-gate
    boundary'
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified in the inventory
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: US
year: 2016
valid_until: 2021
time:
  start: 2015
  description: Primary data of 2015 and 2016 (report of February 2021). valid_until is the reference year
    + 5 (system-model section 6), so it has already lapsed.
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation. The source allocated its own small off-spec and trim
    co-products by mass; here the solid waste sold for recycling is cut off without burden and the exported
    vent gas is not credited (the report''s 2.70 m3/t avoided natural gas is left out)'
