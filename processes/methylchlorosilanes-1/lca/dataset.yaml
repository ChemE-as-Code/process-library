id: methylchlorosilanes-by-the-direct-process-silicon-and-methyl-chloride-over-copper-in-a-fluidised-bed-with-crude-silane-distillation-60-kt-a-me2sicl2
title: Methylchlorosilanes by the direct process (silicon and methyl chloride over copper in a fluidised
  bed) with crude silane distillation (60 kt/a Me2SiCl2)
description: Unallocated foreground LCI of Methylchlorosilanes by the direct process (silicon and methyl
  chloride over copper in a fluidised bed) with crude silane distillation (60 kt/a Me2SiCl2), case design,
  derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Direct process: ground metallurgical silicon (2.07 t/h) with about 2 % copper in a fluidised
  bed at 573 K and 400 kPa(a) fluidised by methyl chloride (US 4 500 724 A), 95 % of the silicon and half
  of the methyl chloride converted per pass, the bed cooled by coils raising MP steam; the methyl chloride
  recovered in a column at 800 kPa(a) with a brine-cooled vent condenser and recycled, the crude distilled
  into a heavies residue, a light silanes cut, a MeSiCl3 cut and Me2SiCl2 (US 2 563 557), the close-boiling
  split at a relative volatility of 1.17 (EP 1 957 504 B1); 60 kt/a Me2SiCl2 in 8000 h'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:fugitives
  title: equipment-leaks emissions of the plant
  direction: output
  reason: 'No P&ID yet: the methyl chloride and chlorosilane leaks are not counted (D-011); to be estimated
    with the equipment-leaks method at basic engineering.'
- key: emission-excluded:storage-breathing
  title: storage-tank emissions of the plant
  direction: output
  reason: The silane tanks are blanketed with dry nitrogen and vented through a scrubber; their breathing
    and the scrubber's effluent are outside the balance (D-011).
- key: emission-excluded:dust
  title: non-routine emissions of the plant
  direction: output
  reason: The silicon dust past the filter of CY-202 and the hoppers' vents is not estimated (D-006).
- key: emission-excluded:wastewater
  title: effluent emissions of the plant
  direction: output
  reason: 'No aqueous effluent in normal operation: the plant is kept dry (chlorosilanes hydrolyse to
    HCl); the vent scrubber''s effluent belongs to the site''s thermal oxidiser (D-007).'
