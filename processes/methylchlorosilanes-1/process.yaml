    - {chemical: chlorotrimethylsilane, role: co-product, inventory_key: "product:LIGHTSP", note: "Light silanes cut, 57 wt% Me3SiCl, 29 wt% MeHSiCl2 (dichloromethylsilane) and 8 wt% methyl chloride, 0.062 kg/kg; mass allocation (D-012)"}
    - {chemical: steam, role: co-product, inventory_key: "product:MPS", note: "MP steam 1500 kPa(a) raised in the reactor's cooling coils, 0.62 kWh/kg; allocation share 0 (D-012)"}
