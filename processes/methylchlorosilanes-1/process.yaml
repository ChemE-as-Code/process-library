# Process Atlas manifest of methylchlorosilanes-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: methylchlorosilanes-1
title: Methylchlorosilanes by the direct process in a copper-catalysed fluidised bed with crude distillation (60 kt/a Me2SiCl2)
summary: >-
  Ground silicon reacts with methyl chloride over a copper catalyst in a fluidised bed at 573 K;
  the methyl chloride is recovered in a column at 800 kPa(a) and recycled, and the crude is
  distilled into dimethyldichlorosilane, a methyltrichlorosilane cut, a light silanes cut and a
  residue. Concept stage, 60 kt/a, balanced flowsheet with the feeds solved for the rate,
  preliminary gate-to-gate LCI.
description: |
  Liquid methyl chloride (fresh from chloromethane-1 and recovered) is vaporised and superheated
  to 453 K and fluidises a bed of ground metallurgical silicon (mean 100 to 150 um, at least 98 %
  Si) with about 2 % copper at 573 K and 400 kPa(a), the conditions of US 4 500 724 A (General
  Electric) and the ranges of the direct process (Wikipedia). 95 % of the silicon and half of
  the methyl chloride convert per pass (both ASSUMED inside the open ranges). The crude
  distribution is ASSUMED inside Wikipedia's direct-process ranges: 84.0 wt% Me2SiCl2, 7.0
  MeSiCl3, 3.0 Me3SiCl, 1.5 MeHSiCl2 (below the 3 to 5 % of Wikipedia's Dimethyldichlorosilane
  article) and 4.5 of a high-boiling residue, with US 4 500 724 A's continuous fluid-bed T/D
  ratio and residue. Cooling coils in the bed take 4.64 MW (about 239 kJ per mol of silicon)
  and raise MP steam. Without them the gas would heat to about 1250 K. Cyclones return the
  fines; the spent contact mass leaves the bed.

  The crude gas is cooled on cooling water and flashed; the condensate and the compressed gas
  enter a column at 800 kPa(a), a little above the 90 psig of US 2 563 557, so that methyl
  chloride condenses on cooling water and the reflux drum (306 K) can vent the ethane and
  ethylene (the lumped hydrocarbons). A brine-cooled vent condenser at 253 K keeps the methyl
  chloride in the vent to 15 mol%; the vent goes to the site's thermal oxidiser. The methyl
  chloride returns to the feed. Three
  columns follow US 2 563 557: the heavies, the lights (Me3SiCl, MeHSiCl2) and the close-boiling
  MeSiCl3/Me2SiCl2 split (66.1 and 70.1 C, relative volatility 1.17 after EP 1 957 504 B1). That
  split needs 93 theoretical stages at a reflux of 94 for 99.5 wt% Me2SiCl2 and an 89 wt%
  MeSiCl3 cut, and its reboilers take 40 % of the plant's steam.

  Per kg of Me2SiCl2: 0.276 kg of silicon (0.218 stoichiometric), 0.963 kg of methyl chloride,
  0.28 g of copper, 0.028 kWh of electricity, 0.53 kWh of MP and 0.49 kWh of LP steam drawn,
  0.62 kWh of MP steam raised, 1.07 kWh to cooling water and 0.033 kWh to brine. Co-products:
  0.087 kg of the MeSiCl3 cut and 0.062 kg of the light silanes cut. Wastes: 0.055 kg of
  residue, 14 g of spent contact mass and 21 g of vent gas. Hazards: methyl chloride, a flammable gas (7.6 to 19 vol%
  in air) handled under pressure; the chlorosilanes, flammable liquids (Me2SiCl2: flash point
  -9 C, H225) that release HCl with water; MeHSiCl2, which also releases hydrogen with water and
  is fatal if inhaled (H260, H330); methyl chloride's health hazards (H351, H341); combustible
  silicon dust; and a strongly exothermic bed (DESIGN.md D-011).

  The mass balance is solved by cheme-as-code: the reactor as a conversion step on the silicon,
  the cyclones and columns as component separators with sourced or ASSUMED splits, the silicon
  solved for 60 000 t/a and the fresh methyl chloride for the reactor's ratio by design
  specifications, and the methyl chloride loop torn and converged (core ADRs 0060, 0070). Every
  duty comes from a balance script (chemicals 1.5.2 / thermo 0.6.1 data). Me2SiCl2's formation
  enthalpy is ASSUMED, because no open value was found. See DESIGN.md for every assumption.
families: [chlorinated-organics]
keywords: [methylchlorosilanes, dimethyldichlorosilane, dichlorodimethylsilane, methyltrichlorosilane, trimethylchlorosilane, methyldichlorosilane, direct process, Mueller-Rochow, Rochow process, silicon, methyl chloride, chloromethane, copper catalyst, fluidised bed, contact mass, superfractionation, close-boiling distillation, silicones]
facets:
  feedstock_basis: [mineral, fossil]
  product_classes: [chemicals]
  unit_operations: [reaction, compression, condensation, distillation]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, the conversions, the crude
# distribution, the splits and Me2SiCl2's formation enthalpy are assumed; the conditions, the
# selectivity metrics, the column pressure, the product cuts and the relative volatility come
# from patents (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD with closed mass, component and element balances (cheme validate, cheme process
    streams). cheme process propagate solves the reactor R201 as a conversion step on the silicon,
    the cyclones CY202 and the columns C302, C401, C402 and C403 as component separators (core ADR
    0070), the silicon for 60 000 t/a of Me2SiCl2 and the fresh methyl chloride for 6.9152 kg per
    kg of silicon at the bed (design specifications), and the methyl chloride loop at the tear S2
    (ADR 0060). scripts/balance.py derives the reaction shares from the ASSUMED crude
    distribution and gives every duty and power: the reactor's energy balance with the silicon
    and copper as solids (core counts every inlet of a conversion step as an ideal gas), the
    vaporiser, the condenser, the compressor and each column closed from its feed to its outlets;
    the superfractionator's minimum reflux and stages by Underwood, Fenske and Gilliland at
    EP 1 957 504 B1's relative volatility. Conditions and selectivity metrics from US 4 500 724
    A; the methyl chloride column's pressure and the product cuts from US 2 563 557; conversions,
    the crude distribution, the lumped by-product chemistry, the splits, reflux ratios and
    Me2SiCl2's formation enthalpy ASSUMED. Preliminary gate-to-gate LCI, mass allocation between
    the three silane products, the exported steam at share 0; methyl chloride linked to
    chloromethane-1, silicon and copper are gaps. cheme maturity not evaluated; the claim
    `maturity: concept` is the lowest value of the schema, not an evidenced level. Not reviewed.
    Needs cheme-as-code 1.13.0.
