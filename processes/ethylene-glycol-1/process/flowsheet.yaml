# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Ethylene glycol by ethylene oxide hydration, glycols-only plant, 50 t/h MEG (D-001, D-002).
# Where the values come from:
# - every flow and composition is from the independent sequential balance
#   scripts/eg_balance.py (D-006), given here as ASSUMED: it rests on ASSUMED design parameters
#   inside the ranges of the BREF LVOC 2017 chapter 7 (conversion, selectivity, purge, MEG share)
#   and on a consecutive-reaction model with an ASSUMED relative rate for the glycol split (D-005);
# - the reactor steps name their reactions (process/reactions.yaml) and give the conversion and
#   selectivities of the script, so cheme checks them by elements and extents;
# - duties are a lumped estimate of the same script (D-008), ASSUMED; no property package covers
#   these streams (D-007, core #315).
# The steam raised in R-101 (its reaction heat less the gas heating across the reactor) is used
# inside the plant (energy streams Q1-Q3); MP steam is imported for the rest (Q4-Q8, Q23). The
# feed side of the E-101 feed/effluent exchanger is the step E100 (Q24), D-008.
schema: cheme/process/v1
kind: flowsheet
title: Ethylene glycol by ethylene oxide hydration (glycols only, 50 t/h MEG)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - id: design
    description: "Design case: 50 t/h MEG (1200 t/d, 400 kt/a at 8000 h/a), fresh-catalyst selectivity 85 % (D-002, D-004)"
    default: true
    capacity: 50 t/h MEG
    provenance: assumed
    source: "D-002: a normalisation basis for the inventory, not a commercial plant claim"
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: ETH, title: Ethylene (pipeline polymer grade), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: OXY, title: Oxygen (pipeline GOX from asu-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: MET, title: Methane ballast make-up, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PW, title: Process water make-up (demineralised), category: raw_material, ports: [{id: out, direction: out}]}
  - id: MPS
    title: MP steam 2800 kPa(a) import
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 2800, provenance: assumed, source: "design basis, D-008"}
      supply_temperature: {value: 503.6, provenance: assumed, source: "saturation at 2800 kPa(a), D-008"}
    ports:
      - {id: ev501, direction: out, kind: energy}
      - {id: e401, direction: out, kind: energy}
      - {id: c501, direction: out, kind: energy}
      - {id: c601, direction: out, kind: energy}
      - {id: c602, direction: out, kind: energy}
      - {id: c603, direction: out, kind: energy}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: k101, direction: out, kind: energy}
      - {id: p202, direction: out, kind: energy}
      - {id: p401, direction: out, kind: energy}
      - {id: aux, direction: out, kind: energy}
products:
  - {id: MEG, title: Monoethylene glycol to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: DEG, title: Diethylene glycol to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: TEG, title: Triethylene glycol to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: HVY, title: Heavy glycols residue (to sale or incineration), category: by_product, ports: [{id: in, direction: in}]}
  - {id: PURGE, title: Inerts purge to the fuel gas header, category: off_gas, ports: [{id: in, direction: in}]}
  - {id: CO2V, title: CO2 stripper vent to atmosphere, category: off_gas, ports: [{id: in, direction: in}]}
  - {id: WW, title: Recycle water bleed to biological treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-008"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-008"}
      min_approach: {value: 5, provenance: assumed, source: D-008}
    ports:
      - {id: e101, direction: in, kind: energy}
      - {id: c201, direction: in, kind: energy}
      - {id: c202, direction: in, kind: energy}
      - {id: k101, direction: in, kind: energy}
      - {id: c301, direction: in, kind: energy}
      - {id: ev501, direction: in, kind: energy}
      - {id: c501, direction: in, kind: energy}
      - {id: c601, direction: in, kind: energy}
      - {id: c602, direction: in, kind: energy}
      - {id: c603, direction: in, kind: energy}

blocks:
  - id: RXN
    title: EO reaction (oxygen-based, methane ballast)
    class: ReactingChemicals
    ports:
      - {id: eth, direction: in}
      - {id: oxy, direction: in}
      - {id: met, direction: in}
      - {id: rec, direction: in}
      - {id: gas, direction: out}
      - {id: st1, direction: out, kind: energy}
      - {id: st2, direction: out, kind: energy}
      - {id: st3, direction: out, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: EOR
    title: EO absorption, stripping and light-gas removal
    class: Absorbing
    ports:
      - {id: gas, direction: in}
      - {id: gasout, direction: out}
      - {id: lights, direction: out}
      - {id: eo, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
  - id: LOOP
    title: Recycle gas compression, inerts purge and CO2 removal (hot potassium carbonate)
    class: Compressing
    ports:
      - {id: gas, direction: in}
      - {id: lights, direction: in}
      - {id: rec, direction: out}
      - {id: purge, direction: out}
      - {id: vent, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: steam, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
  - id: GLY
    title: Glycol reaction (thermal hydration)
    class: ReactingChemicals
    ports:
      - {id: eo, direction: in}
      - {id: pw, direction: in}
      - {id: rec, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: steam, direction: in, kind: energy}
  - id: EVP
    title: Multi-effect evaporation and drying (water recycle)
    class: Evaporating
    ports:
      - {id: in, direction: in}
      - {id: rec, direction: out}
      - {id: bleed, direction: out}
      - {id: crude, direction: out}
      - {id: steam1, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: steam3, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
  - id: PUR
    title: Glycol purification (MEG, DEG and TEG vacuum columns)
    class: Distilling
    ports:
      - {id: crude, direction: in}
      - {id: meg, direction: out}
      - {id: deg, direction: out}
      - {id: teg, direction: out}
      - {id: hvy, direction: out}
      - {id: steam1, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: steam3, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: cw3, direction: out, kind: energy}

steps:
  # ---------------------------------------------------------------- EO reaction (D-004)
  - id: M101
    block: RXN
    title: Feed gas mixing (oxygen mixing station)
    class: Mixing
    ports:
      - {id: eth, direction: in, delegates: eth}
      - {id: oxy, direction: in, delegates: oxy}
      - {id: met, direction: in, delegates: met}
      - {id: rec, direction: in, delegates: rec}
      - {id: out, direction: out}
  - id: E100
    block: RXN
    title: Reactor feed gas preheating (cold side of the E-101 feed/effluent exchanger)
    class: ExchangingThermalEnergy
    # D-008: the mixed feed gas is heated from 333 to 483 K (ASSUMED, 40 K approach at the hot
    # end) by the reactor effluent (Q24); review 2026-10-28 #1.
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy}
  - id: R101
    block: RXN
    title: EO reactor (multitubular, silver catalyst, boiling-water shell)
    class: ReactingChemicals
    reactions: [EOX, COMB]
    # D-004: per-pass ethylene conversion 9 % and EO selectivity 85 mol% (BREF LVOC 2017
    # 7.2.1.1.1: 8-10 %, 75-90 %), given in process/reactions.yaml as the fraction of the inlet
    # C2H4 each reaction converts: EOX 0.09 x 0.85, COMB 0.09 x 0.15. (A selectivity: block here
    # would be the natural form, but core's reactor check loses the reactions of a second
    # selectivity reactor in the same flowsheet; DESIGN.md D-006.)
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: st1, direction: out, kind: energy, delegates: st1}
      - {id: st2, direction: out, kind: energy, delegates: st2}
      - {id: st3, direction: out, kind: energy, delegates: st3}
  - id: E101
    block: RXN
    title: Reactor gas feed/effluent exchanger (hot side) and trim cooler
    class: Cooling
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: gas}
      - {id: ff, direction: out, kind: energy}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  # ---------------------------------------------------------------- EO recovery (D-004)
  - id: C201
    block: EOR
    title: EO absorber (water scrubbing) with lean absorbent cooler
    class: Absorbing
    links: [{target: equipment, ref: C-201}]
    ports:
      - {id: gas, direction: in, delegates: gas}
      - {id: lean, direction: in}
      - {id: gasout, direction: out, delegates: gasout}
      - {id: rich, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: C202
    block: EOR
    title: EO stripper (desorber) with lean/rich exchanger and lean absorbent pump
    class: SeparatingByThermalProcess
    links: [{target: equipment, ref: C-202}, {target: equipment, ref: P-202}]
    ports:
      - {id: rich, direction: in}
      - {id: lean, direction: out}
      - {id: ovh, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  - id: C203
    block: EOR
    title: Light-gas stripper (non-condensables back to the loop)
    class: SeparatingByThermalProcess
    links: [{target: equipment, ref: C-203}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out, delegates: lights}
      - {id: eo, direction: out, delegates: eo}
  # ---------------------------------------------------------------- recycle gas loop (D-004)
  - id: M102
    block: LOOP
    title: Recycle gas and light gases
    class: Mixing
    ports:
      - {id: gas, direction: in, delegates: gas}
      - {id: lights, direction: in, delegates: lights}
      - {id: out, direction: out}
  - id: K101
    block: LOOP
    title: Recycle gas compressor
    class: Compressing
    links: [{target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: SP101
    block: LOOP
    title: Inerts purge
    class: SplittingMaterial
    split: {purge: 0.0015, out: 0.9985}
    ports:
      - {id: in, direction: in}
      - {id: purge, direction: out, delegates: purge}
      - {id: out, direction: out}
  - id: SP102
    block: LOOP
    title: Slip stream to CO2 removal
    class: SplittingMaterial
    split: {slip: 0.496315, bypass: 0.503685}
    ports:
      - {id: in, direction: in}
      - {id: slip, direction: out}
      - {id: bypass, direction: out}
  - id: C301
    block: LOOP
    title: CO2 absorber and regenerator (hot potassium carbonate)
    class: Absorbing
    links: [{target: equipment, ref: C-301}, {target: equipment, ref: C-302}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: vent, direction: out, delegates: vent}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  - id: M103
    block: LOOP
    title: Treated gas and bypass
    class: Mixing
    ports:
      - {id: bypass, direction: in}
      - {id: treated, direction: in}
      - {id: out, direction: out, delegates: rec}
  # ---------------------------------------------------------------- glycol reaction (D-005)
  - id: M401
    block: GLY
    title: Glycol reactor feed mixing and feed pump
    class: Mixing
    links: [{target: equipment, ref: P-401}]
    ports:
      - {id: eo, direction: in, delegates: eo}
      - {id: pw, direction: in, delegates: pw}
      - {id: rec, direction: in, delegates: rec}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E401
    block: GLY
    title: Glycol reactor feed heater (MP steam)
    class: ExchangingThermalEnergy
    # D-008: the mixed feed (about 384 K) is heated to the 423 K reactor inlet with MP steam
    # (Q23); review 2026-10-28 #2.
    links: [{target: equipment, ref: E-401}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
  - id: R401
    block: GLY
    title: Glycol reactor (adiabatic tubular, no catalyst)
    class: ReactingChemicals
    reactions: [HYD1, HYD2, HYD3, HYD4]
    selectivity:
      key: EO
      conversion: 1.0
      products: {MEG: 0.906713, DEG: 0.044401, TEG: 0.001447, TTEG: 0.000036}
      provenance: assumed
      source: "D-005: full EO conversion (BREF LVOC 2017 7.2.2.5); split from the consecutive-reaction model of scripts/eg_balance.py, water:EO 20 mol/mol and relative rate 2.0 (both ASSUMED); MEG net of the recycled MEG"
    links: [{target: equipment, ref: R-401}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
  # ---------------------------------------------------------------- evaporation and drying (D-005)
  - id: EV501
    block: EVP
    title: Multi-effect evaporator (four effects)
    class: Evaporating
    links: [{target: equipment, ref: EV-501}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: vap, direction: out}
      - {id: conc, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam1}
      - {id: steam_mps, direction: in, kind: energy, delegates: steam3}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: C501
    block: EVP
    title: Drying column (vacuum)
    class: Distilling
    links: [{target: equipment, ref: C-501}]
    ports:
      - {id: in, direction: in}
      - {id: ovh, direction: out}
      - {id: btm, direction: out, delegates: crude}
      - {id: steam, direction: in, kind: energy, delegates: steam2}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  - id: M501
    block: EVP
    title: Recycle water collection
    class: Mixing
    ports:
      - {id: ev, direction: in}
      - {id: dry, direction: in}
      - {id: out, direction: out}
  - id: SP501
    block: EVP
    title: Recycle water bleed (aldehyde purge)
    class: SplittingMaterial
    split: {bleed: 0.005, rec: 0.995}
    ports:
      - {id: in, direction: in}
      - {id: bleed, direction: out, delegates: bleed}
      - {id: rec, direction: out, delegates: rec}
  # ---------------------------------------------------------------- glycol purification (D-005)
  - id: C601
    block: PUR
    title: MEG column (vacuum)
    class: Distilling
    links: [{target: equipment, ref: C-601}]
    ports:
      - {id: in, direction: in, delegates: crude}
      - {id: top, direction: out, delegates: meg}
      - {id: btm, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam1}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: C602
    block: PUR
    title: DEG column (vacuum)
    class: Distilling
    links: [{target: equipment, ref: C-602}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out, delegates: deg}
      - {id: btm, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam2}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  - id: C603
    block: PUR
    title: TEG column (vacuum)
    class: Distilling
    links: [{target: equipment, ref: C-603}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out, delegates: teg}
      - {id: btm, direction: out, delegates: hvy}
      - {id: steam, direction: in, kind: energy, delegates: steam3}
      - {id: cw, direction: out, kind: energy, delegates: cw3}

streams:
  # Material streams: scripts/eg_balance.py (D-006); pressures and temperatures ASSUMED (D-004, D-005)
  - {id: S1, title: "Ethylene feed (pipeline)", from: ETH.out, to: M101.eth, template: loop, state: {design: {
      pressure: {value: 2400, provenance: assumed, source: D-004}, temperature: {value: 298.15, provenance: assumed, source: D-004},
      flow: {value: 29779.6, basis: mass, provenance: assumed, source: eg_balance.py D-006},
      composition: {basis: mass_fraction, values: {C2H4: 0.999464, C2H6: 0.000536}, provenance: assumed, source: eg_balance.py D-006}}}}
  - {id: S2, title: "Oxygen feed (pipeline GOX)", from: OXY.out, to: M101.oxy, template: loop, state: {design: {
      pressure: {value: 2400, provenance: assumed, source: D-004}, temperature: {value: 298.15, provenance: assumed, source: D-004},
      flow: {value: 29530.2, basis: mass, provenance: assumed, source: eg_balance.py D-006},
      composition: {basis: mass_fraction, values: {O2: 0.993765, AR: 0.006235}, provenance: assumed, source: eg_balance.py D-006}}}}
  - {id: S3, title: "Methane ballast make-up", from: MET.out, to: M101.met, template: loop, state: {design: {
      pressure: {value: 2400, provenance: assumed, source: D-004}, temperature: {value: 298.15, provenance: assumed, source: D-004},
      flow: {value: 502.9, basis: mass, provenance: assumed, source: eg_balance.py D-006},
      composition: {basis: mass_fraction, values: {CH4: 1.0}, provenance: assumed, source: eg_balance.py D-006}}}}
  - {id: S4, title: "Recycle gas to the mixer", from: M103.out, to: M101.rec, template: loop, state: {design: {
      pressure: {value: 2200, provenance: assumed, source: D-004}, temperature: {value: 333.15, provenance: assumed, source: D-004},
      flow: {value: 838899.1, basis: mass, provenance: assumed, source: eg_balance.py D-006},
      composition: {basis: mass_fraction, values: {C2H4: 0.352591, O2: 0.083052, CH4: 0.383551, CO2: 0.020293, H2O: 0.001761, AR: 0.146088, C2H6: 0.012664}, provenance: assumed, source: eg_balance.py D-006}}}}
  - {id: S38, title: "Mixed feed gas to the feed/effluent exchanger", from: M101.out, to: E100.in, template: loop, state: {design: {
      pressure: {value: 2200, provenance: assumed, source: D-004}, temperature: {value: 333.15, provenance: assumed, source: D-004},
      flow: {value: 898711.8, basis: mass, provenance: assumed, source: eg_balance.py D-006},
      composition: {basis: mass_fraction, values: {C2H4: 0.362243, O2: 0.110178, CH4: 0.358585, CO2: 0.018942, H2O: 0.001644, AR: 0.13657, C2H6: 0.011838}, provenance: assumed, source: eg_balance.py D-006}}}}
  - {id: S5, title: "Reactor feed gas (preheated)", from: E100.out, to: R101.in, template: loop, state: {design: {
      pressure: {value: 2170, provenance: assumed, source: D-004}, temperature: {value: 483.15, provenance: assumed, source: "D-008: E-101 feed/effluent exchanger outlet, 40 K approach to the 523 K effluent"},
      flow: {value: 898711.8, basis: mass, provenance: assumed, source: eg_balance.py D-006},
      composition: {basis: mass_fraction, values: {C2H4: 0.362243, O2: 0.110178, CH4: 0.358585, CO2: 0.018942, H2O: 0.001644, AR: 0.13657, C2H6: 0.011838}, provenance: assumed, source: eg_balance.py D-006}}}}
  - {id: S6, title: "Reactor outlet gas", from: R101.out, to: E101.in, template: loop, state: {design: {
      pressure: {value: 2100, provenance: assumed, source: D-004}, temperature: {value: 523.15, provenance: assumed, source: D-004},
      flow: {value: 898711.8, basis: mass, provenance: assumed, source: eg_balance.py D-006},
      composition: {basis: mass_fraction, values: {C2H4: 0.329641, O2: 0.077641, CH4: 0.358586, CO2: 0.034285, H2O: 0.007924, AR: 0.13657, C2H6: 0.011838, EO: 0.043515}, provenance: assumed, source: eg_balance.py D-006}}}}
  - {id: S7, title: "Cooled reactor gas to the EO absorber", from: E101.out, to: C201.gas, template: loop, state: {design: {
      pressure: {value: 2050, provenance: assumed, source: D-004}, temperature: {value: 313.15, provenance: assumed, source: D-004},
      flow: {value: 898711.8, basis: mass, provenance: assumed, source: eg_balance.py D-006},
      composition: {basis: mass_fraction, values: {C2H4: 0.329641, O2: 0.077641, CH4: 0.358586, CO2: 0.034285, H2O: 0.007924, AR: 0.13657, C2H6: 0.011838, EO: 0.043515}, provenance: assumed, source: eg_balance.py D-006}}}}
  - {id: S8, title: "EO absorber off-gas", from: C201.gasout, to: M102.gas, template: loop, state: {design: {
      pressure: {value: 2000, provenance: assumed, source: D-004}, temperature: {value: 308.15, provenance: assumed, source: D-004},
      flow: {value: 852689.9, basis: mass, provenance: assumed, source: eg_balance.py D-006},
      composition: {basis: mass_fraction, values: {C2H4: 0.346995, O2: 0.081832, CH4: 0.377805, CO2: 0.034761, H2O: 0.002189, AR: 0.143941, C2H6: 0.012477}, provenance: assumed, source: eg_balance.py D-006}}}}
  - {id: S9, title: "Rich absorbent (aqueous EO)", from: C201.rich, to: C202.rich, template: aq, state: {design: {
