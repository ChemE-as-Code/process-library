location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'EO/EG glycols-only plant: O2-based EO reactor (silver catalyst, methane ballast), water absorption
  of EO, hot potassium carbonate CO2 removal, thermal hydration (water:EO 20 mol/mol), 4-effect evaporation,
  vacuum MEG/DEG/TEG columns; 50 t/h MEG'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: cutoff:k2co3-makeup
  title: Potassium carbonate make-up of the CO2 removal solution
  reason: solution losses not sourced at the concept stage (no open per-tonne figure found); a small make-up
    compared with the 1 % input-mass limit is expected but not shown
  cas: 584-08-7
  source: DESIGN.md D-010
- key: cutoff:moderator
  title: Organochlorine moderator of the EO catalyst (e.g. ethyl chloride or 1,2-dichloroethane)
  reason: ppm-level feed to the reactor gas, amount and compound not sourced; its chlorine leaves with
    the purge, the vent and the bleed (emission_exclusions trace-byproducts)
  source: DESIGN.md D-001, D-010
- key: emission-excluded:eo-vents
  title: non-routine emissions of C-202, C-203
  direction: output
  reason: 'EO and VOC from the EO-containing vents after their scrubber (BREF LVOC 7.3.1.4: 0.1-40 ppm
    wt EO in the scrubber vent) and EO storage are not modelled: the glycols-only plant has no EO storage
    and the light gases return to the loop'
  source: DESIGN.md D-006, D-010
- key: emission-excluded:fugitives
  title: equipment-leaks emissions of the plant
  direction: output
  reason: fugitive ethylene, methane and EO from flanges, valves and compressor seals are not estimated
    at the concept stage (no P&ID, no component count)
  source: DESIGN.md D-010
- key: emission-excluded:trace-byproducts
  title: effluent emissions of product:WW
  direction: output
  reason: aldehydes (acetaldehyde, formaldehyde), organic acids and the organochlorine moderator are not
    modelled; they end up in the bleed, the vent and the purge (BREF LVOC 7.2.2.1, 7.3.2.2)
  source: DESIGN.md D-006
