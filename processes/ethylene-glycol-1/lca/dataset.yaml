title: Ethylene glycol by ethylene oxide hydration (glycols only, 50 t/h MEG)
description: Unallocated foreground LCI of Ethylene glycol by ethylene oxide hydration (glycols only,
  50 t/h MEG), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
