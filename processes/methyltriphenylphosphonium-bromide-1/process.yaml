    - {chemical: bromomethane, role: feedstock, inventory_key: "feed:MEBR", note: "Liquefied methyl bromide (merchant), 0.281 kg/kg salt, 1.045 mol per mol PPh3 fed; no library process makes it (proxy methanol + HBr recorded, as methylmagnesium-bromide-1, D-012)"}
    - {chemical: toluene, role: feedstock, inventory_key: "feed:TOL", note: "Toluene make-up (btx-1), 0.056 kg/kg salt; the still recovers the rest of the 4.0 kg per kg PPh3 charged"}
    - {chemical: nitrogen, role: feedstock, inventory_key: "consumable:nitrogen", note: "Nitrogen (asu-1) for inerting, padding, sweeping and pressing, 103 kg per batch, 0.097 kg/kg salt (ASSUMED)"}
  outputs:
