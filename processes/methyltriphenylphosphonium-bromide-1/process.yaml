    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "0.703 kWh/kg salt removed by cooling water: the still's condenser and distillate cooler (0.544 kWh), the heat of quaternisation, the slurry's cool-down and the product's in F-101"}
    - {chemical: chilled-water, role: utility, inventory_key: "product:BRINE", note: "0.042 kWh/kg salt removed by brine at 258 K: F-101's vacuum condenser (the registry has chilled water, not brine: closest entry)"}
