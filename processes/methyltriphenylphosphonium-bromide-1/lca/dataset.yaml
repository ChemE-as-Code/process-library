title: Methyltriphenylphosphonium bromide by semi-batch quaternisation of triphenylphosphine with methyl
  bromide in toluene
description: Unallocated foreground LCI of Methyltriphenylphosphonium bromide by semi-batch quaternisation
  of triphenylphosphine with methyl bromide in toluene, case design, derived from the flowsheet by cheme
  assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Batch plant: PPh3 dissolved in recovered toluene (20 wt%), liquefied methyl bromide dosed
  over 3 h into the closed, nitrogen-padded glass-lined pressure vessel at 333 K (semi-batch, 1.05 mol
  per mol PPh3 with the recycled excess), the salt precipitated and cooled to 313 K, filtered, reslurry-washed
  with recovered toluene and vacuum-dried at 333 K in an agitated filter-dryer; the toluene and the excess
  methyl bromide distilled in a batch still and reused; 1057.10 kg per batch, 776.6 batches a year on
  a dedicated train'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:tank-breathing
  title: storage-tank emissions of T-201, T-202
  direction: output
  reason: Breathing and filling losses of the liquor and recovered-toluene tanks (toluene with about 0.05
    wt% methyl bromide), vented through the nitrogen blanket to the thermal oxidiser; not estimated (no
    P&ID yet, D-009).
- key: emission-excluded:methyl-bromide-store
  title: storage-tank emissions of the plant
  direction: output
  reason: Breathing and transfer losses of the liquefied methyl bromide store (a pressure vessel with
    a vapour return) are outside the boundary and not estimated (D-004).
- key: emission-excluded:dryer-dust
  title: equipment-leaks emissions of F-101
  direction: output
  reason: Salt dust in the vacuum pump's exhaust (behind the filter-dryer's dust filter) is not estimated
    (D-008).
