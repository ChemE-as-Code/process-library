# Tier 1 form, without a flowsheet (as process-library#317). Every amount is the formula of its parameters;
# core's validator re-checks each. Written from the Iron and Steel BREF and IPCC 2006 Vol. 3 ch. 4 (facts in our own form).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: iron-steel-bf-bof-integrated
title: Crude steel by the integrated blast furnace and basic oxygen furnace route
description: Per 1 t of crude steel (liquid steel cast into semis), gate-to-gate, an integrated works
  with coke ovens, sinter plant, blast furnace and BOF steel plant, from the EU Iron and Steel BREF data
  collection (2004-2005). Batch steps (coke oven charges, converter heats) are taken as a time average
  over the works. Process gases are burnt at the works; CO2 from an IPCC Tier 2 carbon balance.
basis: 1000 kg of crude steel
boundary: 'gate-to-gate: coke oven plant with gas treatment, sinter plant, blast furnace with hot stoves,
  BOF steel plant with secondary metallurgy and continuous casting; the process gases are burnt at the
  works (power plant, stoves, mills) and their CO2 is counted here; ore, coal, fluxes, scrap, oxygen,
  nitrogen and purchased power from outside; hot rolling and finishing excluded'
technology: coke ovens with by-product recovery, strand sintering, blast furnace with coal and oil injection
  and oxygen enrichment, top-blown oxygen converter with scrap, continuous casting; pellets bought, no
  pellet plant
geography:
  description: EU plants of the BREF data collection (EU-25, 2004-2005); no single site.
classification:
  isic: '2410'
system_boundary:
  included:
  - coking coal, injected coal and oil, natural gas, iron ore, pellets, fluxes, lime, scrap, ferroalloys
  - oxygen, nitrogen, argon; purchased electricity of the four plants (gross)
  - CO2 of all carbon burnt at the works, by an IPCC Tier 2 carbon balance
  - CO, CH4, SO2, NOx, dust, H2S, NH3, benzene, HCl, HF, NMVOC of the plants' main sources
  - slags, coal tar, light oil, sulfur as co-products with a share of 0 (see allocation); coke and sinter
    plant waste water
  excluded:
  - 'TODO energy exported by the works: process-gas surplus to the power plant and mills, BF top-gas turbine
    power (40 to 91 MJ/t HM, BREF Table 6.2), recovered steam (Table 7.3): not quantified and not credited;
    the purchased electricity is gross'
  - TODO hot stove, power plant and coke underfiring stack emissions other than those in the BREF per-tonne
    tables (Table 6.9 gives concentrations only)
  - 'TODO heavy metals (As, Cd, Cr, Cu, Hg, Mn, Ni, Pb, Tl, V, Zn), PAH, PCDD/F and PCB to air: given
    per tonne in BREF Tables 3.4, 5.2, 6.5, 7.3 and 7.4, not yet exchanges (no flow identity chosen)'
  - TODO diffuse and fugitive dust and VOC (BREF Tables 3.5, 3.6, 5.4, 5.8)
  - 'TODO process residues partly recycled to the sinter plant and partly landfilled: BF top gas dust
    and sludge, BOF dusts and sludge, mill scale, spittings, refractories (BREF Tables 6.2 and 7.3); the
    split is not given'
  - 'TODO water intake and BF, BOF and casting waste water: the BREF ranges mix once-through and closed
    systems'
  - TODO other BF injectants (plastics, recovered oils, fats; 3.6 kg/t HM weighted average, Table 6.1),
    compressed air, steam (made at the works from the process gases and waste heat)
  - TODO ammonia and ammonium sulfate from the coke oven gas (alternative routes in BREF Table 5.2)
  - pellet plant (pellets are bought), hot rolling and finishing
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: RER
year: 2004
valid_until: 2009
time:
  start: 2004
  description: 'BREF data collection: blast furnace, sinter and BOF data of 2004, coke ovens of 2005.
    valid_until is the reference year + 5 (system-model section 6), so it has already lapsed.'
modelling:
  principle: attributional
  multifunctionality: 'six products: crude steel and the works'' by-products (blast furnace and steelmaking
    slags, coal tar, light oil, sulfur), listed unallocated. Shares give every burden to the steel (see
    allocation and its deviation); the exported energy is neither quantified nor credited.'
allocation:
  method: shares
  coproducts:
  - steel
  - bf-slag
  - bof-slag
  - coal-tar
  - crude-benzole
  - recovered-sulfur
  shares:
    steel: 1.0
    bf-slag: 0.0
    bof-slag: 0.0
    coal-tar: 0.0
    crude-benzole: 0.0
    recovered-sulfur: 0.0
  source: All burdens to the crude steel; the slags and the coke oven by-products leave with no burden and
    no credit (an upper view for steel).
  deviation: 'The library hierarchy (docs/system-model.md section 2, step 3) would decide between economic
    and mass allocation by the price ratio of the co-products, but no open prices of the slags, tar, light
    oil and sulfur are sourced, so the ratio cannot be computed. Mass allocation would give the steel only
    about 70 % of the burdens (the slags 28 %), which is not a physical relationship for a slag; that the
    steel-to-slag price ratio is far above 5, so that the rule would choose economic allocation with nearly
    all of the burden on the steel, is ASSUMED and not sourced. Tar, light oil and sulfur are each below 1
    % of the output mass. Shares 1/0 are the conservative choice for the steel until prices are sourced. Also
    not allocated, and counted against the steel: the works'' exported energy (process-gas surplus, top-gas
    turbine power, steam; system_boundary.excluded) is neither a co-product nor credited, while the CO2
    of all process gases burnt is counted and the 143 kWh/t of electricity is bought gross from the grid,
    so electricity the works makes from its own gases is counted twice (CO2 here and grid power). Both
    make this an upper view for steel.'
