# Reactions of iodine-1, brine blowing-out route (DESIGN.md D-001, D-004 .. D-007). Schema:
# `cheme schema process-reactions`. Overall, per iodine recovered:
#   2 I- + 2 Cl2 + SO2 + 2 H2O -> I2 + 4 Cl- + SO4(2-) + 4 H+  (chlorine twice: liberation and
#   re-liberation after the SO2 absorption).
# Conversions are design specifications (a conversion model with sourced ranges where a source
# exists, D-004 .. D-006), not kinetics; none is predicted. The redox steps are fast ionic
# reactions run to an oxidation-potential end point (US 1,897,031). Heats of reaction at 298 K
# from standard enthalpies of formation of the ions at infinite dilution (NBS tables, Wagman et
# al. 1982, J. Phys. Chem. Ref. Data 11 Suppl. 2): values recalled for this concept stage and to
# be checked against the tables (D-007), so ASSUMED. They are small against the brine's heat
# capacity (D-008).
schema: cheme/reactions/v1
kind: reactions
reactions:
  - id: ALK
    title: Neutralisation of the brine alkalinity by the acid (R-101)
    equation: 2 NaHCO3(aq) + H2SO4(aq) -> Na2SO4(aq) + 2 CO2(g) + 2 H2O(l)
    stoichiometry: {NaHCO3: -2, H2SO4: -1, Na2SO4: 1, CO2: 2, H2O: 2}
    phase: liquid
    conversion: {key: NaHCO3, value: 1.0, provenance: assumed, source: "D-004: the brine is acidified to pH about 2.4, far below the bicarbonate's pKa"}
    heat_of_reaction: {value: 25300, provenance: assumed, source: "HCO3-(aq) -692.0, CO2(g) -393.5, H2O(l) -285.8 kJ/mol (NBS tables, D-007)"}
  - id: OXI
    title: Liberation of iodine from the brine iodide by chlorine (R-101)
    equation: 2 NaI(aq) + Cl2(g) -> 2 NaCl(aq) + I2(aq)
    stoichiometry: {NaI: -2, Cl2: -1, NaCl: 2, I2: 1}
    phase: liquid
    conversion: {key: NaI, value: 0.98, provenance: assumed, source: "D-004: chlorine in slight excess (US 4,282,324 background) dosed to an oxidation-potential end point (US 1,897,031); 2 % of the iodide ASSUMED left unoxidised"}
    heat_of_reaction: {value: -201300, provenance: assumed, source: "I-(aq) -55.2, Cl-(aq) -167.2, I2(aq) 22.6 kJ/mol (NBS tables, D-007)"}
  - id: OXH1
    title: Liberation of iodine from the recycled hydriodic acid (R-101)
    equation: 2 HI(aq) + Cl2(g) -> 2 HCl(aq) + I2(aq)
    stoichiometry: {HI: -2, Cl2: -1, HCl: 2, I2: 1}
    phase: liquid
    conversion: {key: HI, value: 0.98, provenance: assumed, source: "D-004: as OXI, the same end point"}
    heat_of_reaction: {value: -201300, provenance: assumed, source: "as OXI (the same ionic reaction; NBS tables, D-007)"}
  - id: ABS
    title: Reduction of the blown-out iodine by sulfur dioxide (T-202)
    equation: I2(g) + SO2(g) + 2 H2O(l) -> 2 HI(aq) + H2SO4(aq)
    stoichiometry: {I2: -1, SO2: -1, H2O: -2, HI: 2, H2SO4: 1}
    phase: mixed
    conversion: {key: I2, value: 0.995, provenance: assumed, source: "D-005: absorption of 99.5 % of the iodine entering the HI/H2SO4 absorber (absorber and SO2 reduction: US 2013/0243684 A1 and US 4,282,324 backgrounds; the fraction is ASSUMED)"}
    heat_of_reaction: {value: -213600, provenance: assumed, source: "I2(g) 62.4, SO2(g) -296.8, H2O(l) -285.8, I-(aq) -55.2, SO4(2-)(aq) -909.3 kJ/mol (NBS tables, D-007)"}
  - id: CLSA
    title: Reduction of the blown-out excess chlorine by sulfur dioxide (T-202)
    equation: Cl2(g) + SO2(g) + 2 H2O(l) -> 2 HCl(aq) + H2SO4(aq)
    stoichiometry: {Cl2: -1, SO2: -1, H2O: -2, HCl: 2, H2SO4: 1}
    phase: mixed
    conversion: {key: Cl2, value: 1.0, provenance: assumed, source: "D-005: the chlorine slip is reduced completely by the excess SO2"}
    heat_of_reaction: {value: -375100, provenance: assumed, source: "Cl-(aq) -167.2, SO2(g) -296.8, H2O(l) -285.8, SO4(2-)(aq) -909.3 kJ/mol (NBS tables, D-007)"}
  - id: OXH2
    title: Precipitation of iodine from the absorber bleed by chlorine (R-301)
    equation: 2 HI(aq) + Cl2(g) -> 2 HCl(aq) + I2(s)
    stoichiometry: {HI: -2, Cl2: -1, HCl: 2, I2: 1}
    phase: mixed
    conversion: {key: HI, value: 0.995, provenance: assumed, source: "D-006: chlorine dosed to an end point short of over-chlorination (which would form iodine monochloride); 0.5 % of the HI ASSUMED left"}
    heat_of_reaction: {value: -223900, provenance: assumed, source: "I-(aq) -55.2, Cl-(aq) -167.2, I2(s) 0 kJ/mol (NBS tables, D-007)"}
  - id: CLSB
    title: Oxidation of the excess SO2 of the bleed by chlorine (R-301)
    equation: SO2(aq) + Cl2(g) + 2 H2O(l) -> H2SO4(aq) + 2 HCl(aq)
    stoichiometry: {SO2: -1, Cl2: -1, H2O: -2, HCl: 2, H2SO4: 1}
    phase: mixed
    conversion: {key: SO2, value: 1.0, provenance: assumed, source: "D-006: the dissolved SO2 is oxidised before the iodide"}
    heat_of_reaction: {value: -348900, provenance: assumed, source: "SO2(aq) -323.0, Cl-(aq) -167.2, H2O(l) -285.8, SO4(2-)(aq) -909.3 kJ/mol (NBS tables, D-007)"}
  - id: NEU1
    title: Neutralisation of the sulfuric acid of the spent brine (R-401)
    equation: H2SO4(aq) + 2 NaOH(aq) -> Na2SO4(aq) + 2 H2O(l)
    stoichiometry: {H2SO4: -1, NaOH: -2, Na2SO4: 1, H2O: 2}
    phase: liquid
    conversion: {key: H2SO4, value: 1.0, provenance: assumed, source: "D-009: caustic dosed to neutral"}
    heat_of_reaction: {value: -111700, provenance: assumed, source: "2 x heat of neutralisation H+ + OH- -> H2O, -55.8 kJ/mol (NBS tables, D-007)"}
  - id: NEU2
    title: Neutralisation of the hydrochloric acid of the spent brine (R-401)
    equation: HCl(aq) + NaOH(aq) -> NaCl(aq) + H2O(l)
    stoichiometry: {HCl: -1, NaOH: -1, NaCl: 1, H2O: 1}
    phase: liquid
    conversion: {key: HCl, value: 1.0, provenance: assumed, source: "D-009: caustic dosed to neutral"}
    heat_of_reaction: {value: -55800, provenance: assumed, source: "heat of neutralisation (NBS tables, D-007)"}
  - id: NEU3
    title: Neutralisation of the residual hydriodic acid of the spent brine (R-401)
    equation: HI(aq) + NaOH(aq) -> NaI(aq) + H2O(l)
    stoichiometry: {HI: -1, NaOH: -1, NaI: 1, H2O: 1}
    phase: liquid
    conversion: {key: HI, value: 1.0, provenance: assumed, source: "D-009: caustic dosed to neutral"}
    heat_of_reaction: {value: -55800, provenance: assumed, source: "heat of neutralisation (NBS tables, D-007)"}
