# What the plant must do. Schema: `cheme schema design_basis`.
# Iodine from natural iodide brine by the blowing-out process, issue
# ChemE-as-Code/process-library#145. Chlorine, caustic soda and sulfuric acid are boundary feeds
# that library processes make (chlor-alkali-1, sulfuric-acid-1); the brine comes from a
# wellfield outside the boundary (DESIGN.md D-001). Values marked ASSUMED are engineering
# choices of this concept study, not client or licensor data; every decision is in DESIGN.md.
schema: cheme/design_basis/v1
capacity:
  basis: Iodine flakes to packing (product stream incl. its impurities)
  product_t_per_a: 1000               # ASSUMED (D-002): a normalisation basis of the order of one Oklahoma brine plant, not a client figure
  product_kg_per_h: 125.0             # ASSUMED (D-002)
  operating_hours_per_year: 8000      # ASSUMED
  turndown_percent: 50                # ASSUMED, not checked yet
feeds:
  - name: Raw iodide brine (formation water from a deep brine wellfield, degassed and de-oiled at the wellhead)
    source_of_values: >-
      Iodine 300 mg/kg as iodide: the average of the Woodward trench (Morrow Formation) brines of
      northwest Oklahoma (Oklahoma Geological Survey, iodine page; US Bureau of Mines, Minerals
      Yearbook 1987, iodine chapter, from a search-result extract; D-003). NaCl 10 wt%, alkalinity 2 meq/kg (as NaHCO3) and 313.15 K are
      ASSUMED (D-003): no open analysis of these brines' salinity was found.
    composition_mass_fraction: {NaI: 0.000354, NaCl: 0.10, NaHCO3: 0.000168, H2O: balance}
    conditions: {pressure_kPa_a: 300, temperature_K: 313.15}   # ASSUMED battery limit
    flow: set by the product rate through the balance (D-006); stream S1 of process/flowsheet.yaml (about 462 t/h)
    excluded: "H2S, oil and suspended solids (removed at the wellhead, outside the boundary, D-003); bromide, ammonium and organics not modelled (open input)"
  - name: Chlorine gas (library process chlor-alkali-1, product CL2, dry, 400 kPa(a))
    source_of_values: chlor-alkali-1 product CL2; modelled as pure Cl2 (D-004)
    conditions: {pressure_kPa_a: 400, temperature_K: 298.15}
    flow: streams S2 and S14
  - name: Sulfur dioxide (liquid, purchased; vaporised at the absorber)
    source_of_values: "ASSUMED pure SO2 (D-005); no library process sells SO2 (a sulfur burner as in sulfuric-acid-1 is the usual source)"
    flow: stream S11
  - name: Sulfuric acid 98.5 wt% (library process sulfuric-acid-1, product ACID)
    flow: stream S18 (melter acid; the spent acid acidifies the brine, D-006)
  - name: Caustic soda 50 wt% (library process chlor-alkali-1, product NAOH)
    flow: stream S22 (neutralisation of the spent brine, D-009)
  - name: Process water
    flow: stream S12 (absorber make-up)
products:
  - name: Iodine flakes
    purity: "99.8 wt% I2 (ASSUMED, D-002: the usual resublimed/USP-type grade is 99.8 % minimum; the Oklahoma Geological Survey quotes about 98 % for prilled/flaked brine iodine); impurities lumped as water"
    delivery: {pressure_kPa_a: 101.325, temperature_K: 313.15, battery_limit: drum packing (outside the boundary)}
  - name: Neutralised spent brine
    use: "reinjection into the producing formation (outside the boundary): Oklahoma Geological Survey; about 30 mg/kg iodine left (D-005, D-009)"
  - name: Blowing-out loop purge
    use: "vent to atmosphere: air, water vapour, the CO2 of the brine alkalinity and traces of iodine (D-005)"
utilities:
  - {name: Electric power, use: "circulation fan K-201, reinjection pump P-401, absorbent pump P-202, filter/melter/flaker drives", note: "ASSUMED electric drives (D-008)"}
  - {name: LP steam, pressure_kPa_a: 450, saturation_K: 420.8, use: iodine melter M-301, note: ASSUMED level (D-008)}
  - {name: Cooling water, supply_K: 298.15, return_K: 308.15, use: iodine flaker X-301, note: ASSUMED (D-008)}
site:
  location: "ASSUMED generic brine-field site (the brine composition is of the Oklahoma type); not chosen"
  design_ambient_K: 303.15            # ASSUMED
  atmospheric_pressure_kPa: 101.325   # ASSUMED
assumptions:
  - "ASSUMED brine acidified with the recycled filtrate and spent melter acid to pH about 2.4 (ideal estimate), inside the pH 1-3 of the blowing-out effluent (US 9,994,448 B2) and below the pH 3 above which iodine liberation is incomplete (US 1,897,031) (D-004)."
  - "ASSUMED chlorine 5 % over the iodide-to-iodine stoichiometry, dosed to an oxidation-potential end point; 98 % of the iodide oxidised (D-004)."
  - "ASSUMED 92 % of the liberated iodine blown out with 130 Nm3 circulating air per m3 brine at 313 K (US 1,897,031: 90-100 % removal in tower blowing-out); excess chlorine and CO2 completely stripped (D-005)."
  - "ASSUMED closed air loop between the blowing-out tower and the absorber with 5 % purge; 99.5 % of the iodine absorbed in HI/H2SO4 liquor with 2 % excess SO2; bleed at 10 wt% HI (D-005)."
  - "ASSUMED 99.5 % of the bleed's HI oxidised to iodine by chlorine and 99 % of the iodine precipitated; cake with 10 wt% mother liquor; filtrate recycled to the brine head (D-006)."
  - "ASSUMED melting under 98.5 wt% sulfuric acid, 0.2 kg H2SO4 per kg iodine, spent acid recycled to the brine head (D-006)."
  - "ASSUMED neutralisation of the spent brine's strong acid with 50 wt% caustic to neutral before reinjection at 3100 kPa(a) (D-009)."
  - "Overall recovery 90 % follows from these (cheme process streams; scripts/iodine_balance.py). The yields were chosen within sourced ranges so that the overall recovery equals the 90 % that US 2013/0243684 A1 states (about 30 mg/L returned then follows by arithmetic): a calibration to the patent, not an independent check (D-006)."
