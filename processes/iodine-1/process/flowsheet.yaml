# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Iodine from natural iodide brine by the blowing-out process, 1000 t/a (DESIGN.md D-001, D-002).
# Where the values come from:
# - the brine's iodine content (300 mg/kg as iodide) is sourced (D-003); its salinity,
#   alkalinity and temperature are ASSUMED;
# - every flow and composition is from the independent sequential balance
#   scripts/iodine_balance.py (D-006), given here as ASSUMED: it rests on ASSUMED design
#   parameters (chlorine excess, oxidation and stripping fractions, air ratio, purge, absorber
#   bleed strength, cake moisture, melter acid) and a neutral-molecule basis for the liquors,
#   because core cannot speciate the I-/I2/I3-/Cl2 electrolyte system (core #364, D-007);
# - reactor steps name their reactions (process/reactions.yaml), so cheme checks their element
#   balance; pass-through and splitter streams are filled by cheme process propagate;
# - duties and powers are from the same script (D-008), ASSUMED; no property package covers
#   these streams.
schema: cheme/process/v1
kind: flowsheet
title: Iodine from natural brine by chlorine oxidation, air blowing-out and SO2 absorption (1000 t/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - id: design
    description: "Design case: 125 kg/h iodine flakes (99.8 wt% I2), 8000 h/a, brine with 300 mg/kg iodine (D-002, D-003)"
    default: true
    capacity: 1000 t/a iodine
    provenance: assumed
    source: "D-002: a normalisation basis for the inventory, not a commercial plant claim"
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: BRINE, title: "Raw iodide brine from the wellfield (degassed, de-oiled)", category: raw_material, ports: [{id: out, direction: out}]}
  - id: CL2
    title: Chlorine gas 400 kPa(a) (chlor-alkali-1 product CL2)
    category: raw_material
    ports: [{id: r101, direction: out}, {id: r301, direction: out}]
  - {id: SO2, title: Liquid sulfur dioxide (vaporised at the absorber), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: H2SO4, title: Sulfuric acid 98.5 wt% (sulfuric-acid-1 product ACID), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NAOH, title: Caustic soda 50 wt% (chlor-alkali-1 product NAOH), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AIR, title: Make-up air to the blowing-out loop, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PW, title: Process water (absorber make-up), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: k201, direction: out, kind: energy}
      - {id: p401, direction: out, kind: energy}
      - {id: t202, direction: out, kind: energy}
      - {id: rec, direction: out, kind: energy}
  - id: LPS
    title: LP steam 450 kPa(a) to the iodine melter (condensate returned)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis, D-008"}
      supply_temperature: {value: 420.8, provenance: assumed, source: "saturation at 450 kPa(a), D-008"}
      min_approach: {value: 20, provenance: assumed, source: D-008}
    ports: [{id: m301, direction: out, kind: energy}]
products:
  - {id: IODINE, title: Iodine flakes (99.8 wt% I2) to packing, category: product, ports: [{id: in, direction: in}]}
  - {id: SPENT, title: Neutralised spent brine to reinjection into the producing formation, category: wastewater, ports: [{id: in, direction: in}]}
  - {id: VENT, title: Blowing-out loop purge to atmosphere, category: off_gas, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-008"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-008"}
      min_approach: {value: 5, provenance: assumed, source: D-008}
    ports: [{id: x301, direction: in, kind: energy}]

blocks:
  - id: OXD
    title: Brine acidification and chlorination
    class: ReactingChemicals
    ports:
      - {id: brine, direction: in}
      - {id: cl2, direction: in}
      - {id: filtrate, direction: in}
      - {id: acid, direction: in}
      - {id: out, direction: out}
  - id: BLO
    title: Air blowing-out and SO2 absorption
    class: SeparatingByThermalProcess
    ports:
      - {id: brine, direction: in}
      - {id: air, direction: in}
      - {id: so2, direction: in}
      - {id: water, direction: in}
      - {id: brine_out, direction: out}
      - {id: bleed, direction: out}
      - {id: purge, direction: out}
      - {id: power1, direction: in, kind: energy}
      - {id: power2, direction: in, kind: energy}
  - id: REC
    title: Iodine precipitation, filtration, melting and flaking
    class: ReactingChemicals
    ports:
      - {id: bleed, direction: in}
      - {id: cl2, direction: in}
      - {id: acid, direction: in}
      - {id: filtrate, direction: out}
      - {id: acid_out, direction: out}
      - {id: product, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: heat, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: NEU
    title: Spent brine neutralisation and reinjection
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: naoh, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy}

steps:
  # D-004: acid (recycled liquors) and chlorine mixed into the brine in static mixers in series
  - id: R101
    block: OXD
    title: Brine acidifier and chlorinator (static mixers, redox end point)
    class: ReactingChemicals
    reactions: [ALK, OXI, OXH1]
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: brine, direction: in, delegates: brine}
      - {id: cl2, direction: in, delegates: cl2}
      - {id: filtrate, direction: in, delegates: filtrate}
      - {id: acid, direction: in, delegates: acid}
      - {id: out, direction: out, delegates: out}
  # D-005: packed tower, brine down, circulating air up
  - id: T201
    block: BLO
    title: Blowing-out tower
    class: SeparatingByThermalProcess
    links: [{target: equipment, ref: T-201}]
    ports:
      - {id: brine, direction: in, delegates: brine}
      - {id: gas_in, direction: in}
      - {id: air, direction: in, delegates: air}
      - {id: brine_out, direction: out, delegates: brine_out}
      - {id: gas, direction: out}
  # D-005: packed absorber irrigated with circulating HI/H2SO4 liquor (P-202), SO2 injected
  - id: T202
    block: BLO
    title: Iodine absorber (HI/H2SO4 liquor with SO2, circulation pump P-202)
    class: ReactingChemicals
    reactions: [ABS, CLSA]
    links: [{target: equipment, ref: T-202}, {target: equipment, ref: P-202}]
    ports:
      - {id: gas, direction: in}
      - {id: so2, direction: in, delegates: so2}
      - {id: water, direction: in, delegates: water}
      - {id: gas_out, direction: out}
      - {id: bleed, direction: out, delegates: bleed}
      - {id: power, direction: in, kind: energy, delegates: power2}
  - id: S201
    block: BLO
    title: Loop purge split
    class: SplittingMaterial
    split: {purge: 0.05}
    ports:
      - {id: in, direction: in}
      - {id: purge, direction: out, delegates: purge}
      - {id: rec, direction: out}
  - id: K201
    block: BLO
    title: Air circulation fan
    class: Compressing
    links: [{target: equipment, ref: K-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power1}
  # D-006: stirred, rubber-lined reactor; chlorine to a redox end point
  - id: R301
    block: REC
    title: Iodine precipitation reactor
    class: ReactingChemicals
    reactions: [OXH2, CLSB]
    links: [{target: equipment, ref: R-301}]
    ports:
      - {id: in, direction: in, delegates: bleed}
      - {id: cl2, direction: in, delegates: cl2}
      - {id: out, direction: out}
  - id: F301
    block: REC
    title: Iodine filter
    class: Filtering
    links: [{target: equipment, ref: F-301}]
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out, delegates: filtrate}
      - {id: power, direction: in, kind: energy, delegates: power}
  # D-006: iodine melted under a layer of concentrated sulfuric acid, which takes up the water
  - id: M301
    block: REC
    title: Iodine melter (under sulfuric acid)
    class: SeparatingByPhaseSeparation
    links: [{target: equipment, ref: M-301}]
    ports:
      - {id: cake, direction: in}
      - {id: acid, direction: in, delegates: acid}
      - {id: melt, direction: out}
      - {id: acid_out, direction: out, delegates: acid_out}
      - {id: heat, direction: in, kind: energy, delegates: heat}
  - id: X301
    block: REC
    title: Iodine flaker (cooled drum)
    class: Cooling
    links: [{target: equipment, ref: X-301}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: product}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  # D-009: caustic to neutral before reinjection
  - id: R401
    block: NEU
    title: Spent brine neutraliser
    class: ReactingChemicals
    reactions: [NEU1, NEU2, NEU3]
    links: [{target: equipment, ref: R-401}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: naoh, direction: in, delegates: naoh}
      - {id: out, direction: out}
  - id: P401
    block: NEU
    title: Reinjection pump
    # TransportingFluids, not Pumping: cheme process build fails on the Pumping class (its
    # pyDEXPI method field is a Union; core finding, DESIGN.md D-010)
    class: TransportingFluids
    links: [{target: equipment, ref: P-401}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
      - {id: power, direction: in, kind: energy, delegates: power}

