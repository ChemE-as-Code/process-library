# Components and templates of the process. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
#
# Iodine from natural brine by the blowing-out process (DESIGN.md D-001). Dissolved species are
# carried as neutral molecules (NaI, NaCl, HI, HCl, H2SO4, Na2SO4, NaHCO3, NaOH, I2, Cl2, SO2,
# CO2 in water): an inventory basis, not a speciation; core does not speciate electrolytes (core
# #364, D-007). I2 is one component in every state it takes here (dissolved, vapour in the air,
# precipitated crystals, melt, flakes); the stream's title says which. Molar masses from IUPAC
# standard atomic weights; CAS from PubChem.
schema: cheme/process/v1
kind: materials
components:
  - {id: H2O, name: Water, formula: H2O, cas: 7732-18-5, molar_mass: 18.015, normal_boiling_point: 373.12}
  - {id: NaCl, name: Sodium chloride (dissolved), formula: NaCl, cas: 7647-14-5, molar_mass: 58.443}
  - {id: NaI, name: Sodium iodide (stands for the iodide of the brine), formula: NaI, cas: 7681-82-5, molar_mass: 149.894}
  - {id: NaHCO3, name: Sodium bicarbonate (stands for the brine alkalinity), formula: NaHCO3, cas: 144-55-8, molar_mass: 84.007}
  - {id: Na2SO4, name: Sodium sulfate (dissolved), formula: Na2SO4, cas: 7757-82-6, molar_mass: 142.04}
  - {id: NaOH, name: Sodium hydroxide, formula: NaOH, cas: 1310-73-2, molar_mass: 39.997}
  - {id: H2SO4, name: Sulfuric acid, formula: H2SO4, cas: 7664-93-9, molar_mass: 98.079}
  - {id: HCl, name: Hydrogen chloride (dissolved), formula: HCl, cas: 7647-01-0, molar_mass: 36.461}
  - {id: HI, name: Hydrogen iodide (dissolved; hydriodic acid), formula: HI, cas: 10034-85-2, molar_mass: 127.912}
  - {id: I2, name: Iodine, formula: I2, cas: 7553-56-2, molar_mass: 253.809, normal_boiling_point: 457.5}
  - {id: Cl2, name: Chlorine, formula: Cl2, cas: 7782-50-5, molar_mass: 70.906, normal_boiling_point: 239.11}
  - {id: SO2, name: Sulfur dioxide, formula: SO2, cas: 7446-09-5, molar_mass: 64.066, normal_boiling_point: 263.13}
  - {id: CO2, name: Carbon dioxide, formula: CO2, cas: 124-38-9, molar_mass: 44.010}
  - {id: N2, name: Nitrogen (with the argon of the air), formula: N2, cas: 7727-37-9, molar_mass: 28.014, normal_boiling_point: 77.36}
  - {id: O2, name: Oxygen, formula: O2, cas: 7782-44-7, molar_mass: 31.998, normal_boiling_point: 90.19}
templates:
  - id: iodine
    title: Iodine plant streams (brine, acid liquors, loop air, iodine)
    components: [H2O, NaCl, NaI, NaHCO3, Na2SO4, NaOH, H2SO4, HCl, HI, I2, Cl2, SO2, CO2, N2, O2]
# property_method is a placeholder: no benchmarked package covers aqueous electrolytes, iodine or
# solids (D-007); `cheme process props --coverage` reports the streams as not covered.
property_method:
  adapter: thermo
  status: placeholder
