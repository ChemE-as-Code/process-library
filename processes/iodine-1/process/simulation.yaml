# Simulation specs of iodine-1 (`cheme schema process-simulation`). The flowsheet is not solved
# in DWSIM: no property package covers the iodide/iodine/chlorine electrolyte liquors, iodine
# vapour in air or solid iodine (core #364, #365; DESIGN.md D-007). Only the heat boundary of the
# reacting steps is declared here: their reaction heats are small against the flows that carry
# them (R-101 about 30 kW into 460 t/h brine, below 0.1 K; T-202 about 120 kW into the 76 t/h
# loop gas and the absorbent; R-301 about 33 kW into 1.3 t/h liquor, 6 K; R-401 about 28 kW
# into the spent brine), so they are adiabatic (D-008).
schema: cheme/simulation/v1
kind: simulation
specs:
  R101: {mode: adiabatic}
  T202: {mode: adiabatic}
  R301: {mode: adiabatic}
  R401: {mode: adiabatic}
