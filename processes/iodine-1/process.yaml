# Process Atlas manifest of iodine-1. Schema: schemas/process.schema.json (cheme-as-code/process/v1).
# plant.yaml stays the engineering manifest; sheets and results are derived from the
# ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: iodine-1
title: Iodine from natural iodide brine by chlorine oxidation, air blowing-out and SO2 absorption (1000 t/a)
summary: >-
  An Oklahoma-type formation brine with 300 mg/kg iodide is acidified, chlorinated and blown
  out with circulating air; the iodine is absorbed in HI/H2SO4 liquor with SO2, re-liberated
  with chlorine, filtered, melted under sulfuric acid and flaked; the spent brine is
  neutralised and reinjected. Concept stage, assumed basis, preliminary gate-to-gate inventory.
description: |
  Raw brine (462 t/h, 300 mg/kg iodine as iodide, the average of the Woodward trench brines of
  northwest Oklahoma) is acidified to about pH 2.4 by the plant's own recycled acid liquors and
  chlorinated to an oxidation-potential end point. A packed tower blows the liberated iodine out
  into a closed air loop (130 Nm3 air per m3 brine, 5 % purge); a second tower absorbs it in a
  circulating hydriodic/sulfuric acid liquor into which SO2 is injected. A bleed of the liquor is
  chlorinated again, the iodine precipitates, is filtered, melted under concentrated sulfuric
  acid and flaked (99.8 wt% I2). Filtrate and spent melter acid return to the brine head; the
  stripped brine is neutralised with caustic and pumped back into the formation. Overall
  recovery 90 %.

  All values are concept estimates. The route and its steps follow open patent backgrounds and
  the Oklahoma Geological Survey; the design parameters (chlorine excess, stripping fraction,
  air ratio, absorber and precipitation yields) are ASSUMED and come from the independent script
  scripts/iodine_balance.py, whose neutral-molecule liquor basis is not an electrolyte model
  (core #364); see DESIGN.md of the engineering files for every assumption and gated step.
families: [inorganic-chemicals]
keywords: [iodine, brine, iodide, blowing-out, air stripping, chlorine oxidation, sulfur dioxide absorption, hydriodic acid, precipitation, iodine melting, reinjection, Oklahoma, Woodward trench]
facets:
  feedstock_basis: [mineral]
  product_classes: [chemicals]
  unit_operations: [reaction, stripping, absorption, filtration, melting, neutralisation]
  region: generic
# Honest claim: concept is the lowest level of the manifest; cheme maturity reports the level
# the evidence supports (see validation.notes and DESIGN.md D-006, D-012).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD with closed mass, component and element balances (cheme validate, cheme process
    streams, cheme assess lca --balance: every element within 0.01 %). Only the brine iodine
    content (300 mg/kg, Oklahoma Geological Survey; US Bureau of Mines, Minerals Yearbook 1987)
    is sourced; the route steps follow patent backgrounds (US 2013/0243684 A1, US 4,282,324, US
    1,897,031, US 9,994,448 B2); every flow, conversion and duty is ASSUMED or comes from
    scripts/iodine_balance.py. The yields were chosen within sourced ranges so that the overall
    recovery equals the 90 % that US 2013/0243684 A1 states (about 30 mg/kg iodine left then
    follows by arithmetic): the recovery is calibrated to the patent, not an independent check
    of the model. Energy closure is not evaluable in core (no electrolyte enthalpies, core
    #364). Not reviewed. Main products and feeds are listed under chemistry with their chemicals
    registry entries (issue #251).
chemistry:
  inputs:
    - {chemical: chlorine, role: feedstock, note: "feed:CL2: chlorine gas 400 kPa(a) (e.g. chlor-alkali-1)"}
    - {chemical: sulfur-dioxide, role: feedstock, note: "feed:SO2: liquid sulfur dioxide, vaporised at the absorber"}
    - {chemical: sulfuric-acid, role: feedstock, note: "feed:H2SO4: sulfuric acid 98.5 wt% (e.g. sulfuric-acid-1)"}
    - {chemical: sodium-hydroxide, role: feedstock, note: "feed:NAOH: caustic soda 50 wt% (e.g. chlor-alkali-1), counted by mass of the solution"}
    - {chemical: water, role: feedstock, inventory_key: "feed:PW", note: "Absorber make-up water, 8.9 kg/kg iodine"}
  outputs:
    - {chemical: iodine, role: main-product, inventory_key: "product:IODINE", note: "Iodine flakes, 99.8 wt% I2, to packing"}
    - {chemical: wastewater, role: waste, inventory_key: "product:SPENT", note: "Neutralised spent brine, 3.7 t/kg iodine, reinjected into the producing formation (about 30 mg/kg iodine left)"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "Air circulation fan, reinjection pump (dominant, ASSUMED 3000 kPa), absorbent pump and recovery drives: 4.8 kWh/kg"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "LP steam 450 kPa(a) to the iodine melter (ASSUMED)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "Flaker, 25/35 C (ASSUMED)"}
basis:
  capacity: "1000 t/a iodine flakes, 125 kg/h (ASSUMED)"
  operating_hours_per_year: 8000
  location: generic (Oklahoma-type brine; site not chosen)
