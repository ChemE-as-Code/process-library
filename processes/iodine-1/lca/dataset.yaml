id: iodine-from-natural-brine-by-chlorine-oxidation-air-blowing-out-and-so2-absorption-1000-t-a
title: Iodine from natural brine by chlorine oxidation, air blowing-out and SO2 absorption (1000 t/a)
description: Unallocated foreground LCI of Iodine from natural brine by chlorine oxidation, air blowing-out
  and SO2 absorption (1000 t/a), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'iodine from natural iodide brine: acidification with recycled liquors, chlorine oxidation,
  air blowing-out in a closed air loop, absorption in HI/H2SO4 with SO2, chlorine precipitation, filtration,
  melting under sulfuric acid, flaking; spent brine neutralised with caustic and reinjected; 1000 t/a'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:fugitive-leaks
  title: equipment-leaks emissions of the plant
  direction: output
  reason: 'Not estimated in this preliminary LCI: leaks of chlorine, SO2, iodine and HCl need the component
    count of the P&IDs (out of scope of this run). Open gap for basic engineering, not negligible by evidence.'
- key: emission-excluded:melter-vent
  title: non-routine emissions of M-301
  direction: output
  reason: 'The melter at about 393 K may release HCl and iodine vapour from the cake liquor; the balance
    sends them to the spent acid (D-006). Its vent and scrubber are not designed at concept stage. Upper
    bound for HCl: all of the cake''s HCl (S17, 0.46 kg/h, 3.7 g per kg iodine, 0.4 % of the product mass)
    if none stayed in the acid. Iodine: not bounded, the vent gas flow is not designed (the 2026-10-28
    review estimates iodine''s vapour pressure near its melting point at the order of 10 kPa, not sourced
    here; the bound depends on that flow). The schema has no amount field for an exclusion, so the cut-off
    rule cannot be checked by cheme. Open gap.'
- key: emission-excluded:storage-and-unloading
  title: storage-tank emissions of the plant
  direction: output
  reason: Chlorine, SO2 and acid storage and unloading are outside the designed steps; their vents (to
    a caustic scrubber in practice) are not estimated. Open gap.
