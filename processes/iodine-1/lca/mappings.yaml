# iodine-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# None yet: the preliminary LCI leaves every background unmapped (lca/lca.yaml `missing:`), and an
# unmapped exchange of this internal process is a reported gap (ADR 0022). Overrides likely
# needed when the backgrounds are connected (DESIGN.md D-011):
# - product:IODINE: the registry has no iodine slug yet (consolidated chemicals PR); then the
#   downstream library cases hydrogen iodide (#149) and iodomethane (#163) can link to it;
# - feed:BRINE and product:SPENT: no registry slug or shared technosphere entry for a brine
#   wellfield or brine reinjection; both need new entries (or a library brine-field utility);
# - feed:SO2: no sulfur dioxide slug or technosphere entry yet;
# - feed:CL2, feed:NAOH: link to chlor-alkali-1; the registry has no chlorine or sodium-hydroxide
#   slug yet (consolidated chemicals PR); pin the producer explicitly if the build picks another;
# - feed:H2SO4: link to sulfuric-acid-1; no sulfuric-acid slug in the registry yet.
# - feed:POWER, feed:LPS, feed:PW, product:CW: the registry slugs electricity, steam, water and
#   cooling-water exist; their shared technosphere entries apply once the backgrounds are mapped.
schema: cheme-as-code/lci-process-mappings/v1
exchanges: {}
