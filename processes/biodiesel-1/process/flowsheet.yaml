# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Biodiesel (FAME) by base-catalysed transesterification of refined soybean oil in two CSTRs in
# series with glycerol decanted after each, methanol flashed off the esters and stripped from
# the glycerol phase and recycled, the esters washed with slightly acid water and vacuum dried,
# the glycerol phase neutralised to crude glycerol (D-001). Where the values come from:
# - the oil feed S1 and the fresh methanol S3 are solved by `cheme process propagate` for two
#   design specifications (ADR 0070 of core): 32 420 t/a of dried biodiesel (D-002) and 6 mol of
#   methanol per mol of oil to the reactors (D-005); the catalyst solution, the wash water and the
#   two acids follow the oil at fixed ratios (D-005, D-007, D-008);
# - the methanol recycle S20 is the loop's tear stream, converged by propagate (D-006);
# - the reactors' outlets follow the conversions of process/reactions.yaml, the decanters, the
#   methanol flash, the wash settler, the dryer and the glycerol column their specified
#   recoveries (`recovery:`, D-006 to D-008, all ASSUMED: no qualified LLE or VLE of
#   FAME-glycerol-methanol in core, limit L-1);
# - temperatures and pressures are design choices, ASSUMED (design basis);
# - the reactors' and neutralisers' duties are written by propagate from the heats of reaction and
#   the liquids' heat capacities, net of the work of the step's agitator and pumps (D-009); the
#   flash, column, dryer and cooler duties are hand estimates, ASSUMED, with their arithmetic in
#   their sources, each step's heater and condenser closing its balance (D-009, limit L-4).
schema: cheme/process/v1
kind: flowsheet
title: Biodiesel (FAME) from soybean oil by base-catalysed transesterification (32 420 t/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 32 420 t/a biodiesel in 8000 h/a from refined soybean oil, 6:1 methanol, sodium methoxide 0.25 wt% of the oil", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

tears:
  - stream: S20
    initial: {flow: 430.0, unit: kg/h, basis: mass_fraction, composition: {MEOH: 1.0}}
convergence: {method: wegstein, max_iterations: 200, tolerance: {abs: 1.0e-6, rel: 1.0e-8}}

specs:
  - id: rate
    vary: {stream: S1, initial: 4040, with: {S4: 0.01, S23: 1.14, S24: 0.0001503, S29: 0.0049700}}
    target: {stream: S27, quantity: annual, value: 32420, unit: t, hours: 8000}
    provenance: assumed
    source: "D-002: the 9.8 Mgal/a plant of Pradhan and Shrestha (2009, p. 9) at 0.8739 kg/L (Van Gerpen et al. 2004, p. 4) is 32 420 t/a; 8000 h/a ASSUMED. Followers at their ratios to the oil: catalyst solution 0.01 (D-005), wash water 1.14 (D-007), wash acid 0.0001503 (5 % over the methoxide, D-007) and glycerol acid 0.0049700 (equal to the methoxide, D-008)"
  - id: methanol-ratio
    vary: {stream: S3, initial: 440}
    target: {stream: S5, component: MEOH, quantity: ratio, per: {stream: S1, component: TG}, basis: mole, value: 6.0}
    provenance: given
    source: "D-005: 6 mol of methanol per mol of triglyceride, the usual base-catalysed ratio (Van Gerpen et al. 2004, NREL/SR-510-36244, pp. 31-32 and 34); counted on all the methanol to the reactors, the catalyst solution's included"

feeds:
  - {id: OIL, title: "Refined, bleached soybean oil (no library process)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: MEOHF, title: Methanol (methanol-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: CATF, title: "Sodium methoxide, 25 wt% in methanol (no library process)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PW, title: Process water (softened) to the ester wash, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: HCLW, title: "Hydrochloric acid 33 wt% (hydrogen-chloride-1) to the ester wash", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: HCLG, title: "Hydrochloric acid 33 wt% (hydrogen-chloride-1) to the glycerol neutraliser", category: raw_material, ports: [{id: out, direction: out}]}
  - id: LPS
    title: LP steam 450 kPa(a) (condensate returned)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis, D-009"}
      supply_temperature: {value: 421.1, provenance: assumed, source: "saturation at 450 kPa(a) (thermo 0.6.1, IAPWS), D-009"}
      min_approach: {value: 10, provenance: assumed, source: D-009}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: e201, direction: out, kind: energy}
      - {id: r201, direction: out, kind: energy}
      - {id: d201, direction: out, kind: energy}
  - id: MPS
    title: MP steam 1000 kPa(a) (condensate returned)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1000, provenance: assumed, source: "design basis, D-009"}
      supply_temperature: {value: 453.0, provenance: assumed, source: "saturation at 1000 kPa(a) (thermo 0.6.1, IAPWS), D-009"}
      min_approach: {value: 10, provenance: assumed, source: D-009}
    ports:
      - {id: c301, direction: out, kind: energy}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: met, direction: out, kind: energy}
      - {id: rxn, direction: out, kind: energy}
      - {id: rxn2, direction: out, kind: energy}
      - {id: est, direction: out, kind: energy}
      - {id: gly, direction: out, kind: energy}
      - {id: gly2, direction: out, kind: energy}
products:
  - {id: BD, title: "Biodiesel (FAME) to storage", category: product, ports: [{id: in, direction: in}]}
  - {id: CGLY, title: "Crude glycerol (about 87 wt%) to sale or refining (glycerol-1)", category: by_product, ports: [{id: in, direction: in}]}
  - id: WW
    title: Wash water and dryer condensate to wastewater treatment
    category: wastewater
    ports: [{id: wash, direction: in}, {id: dry, direction: in}]
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-009"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-009"}
      min_approach: {value: 5, provenance: assumed, source: D-009}
    ports:
      - {id: r102, direction: in, kind: energy}
      - {id: e201, direction: in, kind: energy}
      - {id: d201, direction: in, kind: energy}
      - {id: e202, direction: in, kind: energy}
      - {id: r301, direction: in, kind: energy}
      - {id: c301, direction: in, kind: energy}
      - {id: e301, direction: in, kind: energy}

blocks:
  - id: MET
    title: Methanol and catalyst make-up and recycle
    class: Mixing
    ports:
      - {id: meoh, direction: in}
      - {id: cat, direction: in}
      - {id: rec1, direction: in}
      - {id: rec2, direction: in}
      - {id: r1, direction: out}
      - {id: r2, direction: out}
      - {id: power, direction: in, kind: energy}
  - id: RXN
    title: Transesterification (two CSTRs with glycerol decanters)
    class: ReactingChemicals
    ports:
      - {id: oil, direction: in}
      - {id: m1, direction: in}
      - {id: m2, direction: in}
      - {id: est, direction: out}
      - {id: gly1, direction: out}
      - {id: gly2, direction: out}
      - {id: q1, direction: in, kind: energy}
      - {id: q2, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: power2, direction: in, kind: energy}
  - id: EST
    title: Ester finishing (methanol flash, acid water wash, vacuum drying)
    class: SeparatingByThermalProcess
    ports:
      - {id: in, direction: in}
      - {id: water, direction: in}
      - {id: acid, direction: in}
      - {id: meoh, direction: out}
      - {id: wash, direction: out}
      - {id: dryv, direction: out}
      - {id: prod, direction: out}
      - {id: q3, direction: in, kind: energy}
      - {id: q4, direction: out, kind: energy}
      - {id: q5, direction: in, kind: energy}
      - {id: q6, direction: in, kind: energy}
      - {id: q7, direction: out, kind: energy}
      - {id: q8, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: GLY
    title: Glycerol neutralisation and methanol stripping
    class: Distilling
    ports:
      - {id: g1, direction: in}
      - {id: g2, direction: in}
      - {id: acid, direction: in}
      - {id: meoh, direction: out}
      - {id: crude, direction: out}
      - {id: q9, direction: out, kind: energy}
      - {id: q10, direction: in, kind: energy}
      - {id: q11, direction: out, kind: energy}
      - {id: q12, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: power2, direction: in, kind: energy}

steps:
  # methanol make-up and recycle (D-005, D-006)
  - id: M501
    block: MET
    title: Recovered methanol drum
    class: Mixing
    links: [{target: equipment, ref: V-501}]
    ports:
      - {id: in1, direction: in, delegates: rec1}
      - {id: in2, direction: in, delegates: rec2}
      - {id: out, direction: out}
  - id: M101
    block: MET
    title: Methanol and catalyst mixer
    class: Mixing
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: meoh, direction: in, delegates: meoh}
      - {id: cat, direction: in, delegates: cat}
      - {id: rec, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: SP101
    block: MET
    title: Methanol and catalyst split to the two reactors
    class: SplittingMaterial
    split: {r1: 0.8}
    ports:
      - {id: in, direction: in}
      - {id: r1, direction: out, delegates: r1}
      - {id: r2, direction: out, delegates: r2}
  # transesterification (D-005)
  - id: R101
    block: RXN
    title: First transesterification reactor (CSTR)
    class: ReactingChemicals
    reactions: [TRANS]
    energy_port: heat
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: oil, direction: in, delegates: oil}
      - {id: meoh, direction: in, delegates: m1}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: q1}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: V101
    block: RXN
    title: First glycerol decanter
    class: SeparatingByPhaseSeparation
    links: [{target: equipment, ref: V-102}]
    recovery:
      outlets:
        gly: {GLY: 0.98, MEOH: 0.40, NAOME: 0.90, FAME: 0.005}
      provenance: assumed
      source: "D-006: methanol 60:40 between the ester and glycerol phases (Van Gerpen et al. 2004, p. 75, at 90:10 ester to glycerol); the catalyst mostly to the glycerol (p. 4); 98 % of the glycerol and 0.5 % of the esters to the heavy phase, no oil, ASSUMED"
    ports:
      - {id: in, direction: in}
      - {id: est, direction: out}
      - {id: gly, direction: out, delegates: gly1}
  - id: R102
    block: RXN
    title: Second transesterification reactor (CSTR)
    class: ReactingChemicals
    reactions: [TRANS]
    conversion: {TRANS: 0.97}
    energy_port: cw
    links: [{target: equipment, ref: R-102}]
    ports:
      - {id: in, direction: in}
      - {id: meoh, direction: in, delegates: m2}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: q2}
      - {id: power, direction: in, kind: energy, delegates: power2}
  - id: V102
    block: RXN
    title: Second glycerol decanter
    class: SeparatingByPhaseSeparation
    links: [{target: equipment, ref: V-103}]
    recovery:
      outlets:
        gly: {GLY: 0.98, MEOH: 0.1203, NAOME: 0.90, FAME: 0.005}
      provenance: assumed
      source: "D-006: GLY, NAOME and FAME as V101 (Van Gerpen et al. 2004, p. 4), ASSUMED. The 60:40 methanol split of p. 75 holds at 90:10 ester to glycerol; this feed is about 99:1, so the methanol is split instead at V101's distribution coefficient (5.4, mass fraction in the glycerol phase over that in the ester phase), held constant, ASSUMED: 12.0 % of the methanol to the glycerol phase"
    ports:
      - {id: in, direction: in}
      - {id: est, direction: out, delegates: est}
      - {id: gly, direction: out, delegates: gly2}
  # ester finishing (D-007)
  - id: E201
    block: EST
    title: Ester methanol flash (vacuum) with condenser
    class: Evaporating
    links: [{target: equipment, ref: E-201}]
    recovery:
      outlets:
        vap: {MEOH: 0.9376}
      provenance: assumed
      source: "D-007: one equilibrium stage at 373.15 K and 40 kPa(a) (methanol condenses at 315.7 K there, against cooling water), the vapour taken as pure methanol: x = 40 / (gamma Psat) = 40 / (2.933 x 353.7) = 0.0386 mol/mol of methanol left in the esters (Psat thermo 0.6.1 HEOS_FIT; gamma Dortmund UNIFAC in thermo 0.6.1, DOUFIP2016, methyl oleate as 2 CH3, 13 CH2, 1 CH=CH, 1 CH2COO), 93.76 % of S13's methanol off; methanol removed before the wash (Van Gerpen et al. 2004, pp. 68 and 76). Recovery ASSUMED as that equilibrium value"
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: vap, direction: out, delegates: meoh}
      - {id: liq, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: q3}
      - {id: cond, direction: out, kind: energy, delegates: q4}
  - id: R201
    block: EST
    title: Acid water wash contactor
    class: ReactingChemicals
    reactions: [NEUT]
    links: [{target: equipment, ref: C-202}]
    ports:
      - {id: in, direction: in}
      - {id: water, direction: in, delegates: water}
      - {id: acid, direction: in, delegates: acid}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: q5}
  - id: V201
    block: EST
    title: Wash water settler
    class: SeparatingByPhaseSeparation
    links: [{target: equipment, ref: V-203}]
    recovery:
      outlets:
        wat: {H2O: 0.998, MEOH: 0.95, GLY: 0.99, NACL: 1.0, HCL: 1.0}
      provenance: assumed
      source: "D-007: the ester-water split is clean (Van Gerpen et al. 2004, p. 69), the washed esters keep 0.2 % of the water (about 0.2 wt%, above the 0.050 vol% limit, p. 69), the salts, acid, 99 % of the glycerol and 95 % of the methanol go to the water, ASSUMED"
    ports:
      - {id: in, direction: in}
      - {id: est, direction: out}
      - {id: wat, direction: out, delegates: wash}
  - id: D201
    block: EST
    title: Vacuum ester dryer with condenser
    class: Drying
    links: [{target: equipment, ref: D-204}]
    recovery:
      outlets:
        vap: {H2O: 0.90, MEOH: 1.0}
      provenance: assumed
      source: "D-007: vacuum dryer at 368 K and 10 kPa(a) (Van Gerpen et al. 2004, p. 69), 90 % of the water and all the methanol off, ASSUMED, to below the 0.050 vol% water and sediment limit of ASTM D6751 (p. 23)"
    ports:
      - {id: in, direction: in}
      - {id: vap, direction: out, delegates: dryv}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: q6}
      - {id: cond, direction: out, kind: energy, delegates: q7}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E202
    block: EST
    title: Biodiesel cooler
    class: Cooling
    links: [{target: equipment, ref: E-205}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: prod}
      - {id: cw, direction: out, kind: energy, delegates: q8}
  # glycerol phase (D-008)
  - id: M301
    block: GLY
    title: Glycerol phases collected
    class: Mixing
    links: [{target: equipment, ref: V-301}]
    ports:
      - {id: in1, direction: in, delegates: g1}
      - {id: in2, direction: in, delegates: g2}
      - {id: out, direction: out}
  - id: R301
    block: GLY
    title: Glycerol neutraliser
    class: ReactingChemicals
    reactions: [NEUT]
    energy_port: cw
    links: [{target: equipment, ref: R-302}]
    ports:
      - {id: in, direction: in}
      - {id: acid, direction: in, delegates: acid}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: q9}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: C301
    block: GLY
    title: Glycerol methanol stripping column
    class: Distilling
    links: [{target: equipment, ref: C-303}]
    recovery:
      outlets:
        top: {MEOH: 0.995}
      provenance: assumed
      source: "D-008: a packed column at 40 kPa(a) at the top (methanol condenses at 315.7 K on cooling water) and 42 kPa(a) at the bottom, reboiler on MP steam at 405 K, 99.5 % of the methanol overhead with no water (a rectifying section with reflux 1, ASSUMED); the water of the acid stays in the crude glycerol, which ends near the 88 wt% of Van Gerpen et al. 2004, p. 40"
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out, delegates: meoh}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: q10}
      - {id: cond, direction: out, kind: energy, delegates: q11}
      - {id: power, direction: in, kind: energy, delegates: power2}
  - id: E301
    block: GLY
    title: Crude glycerol cooler
    class: Cooling
    links: [{target: equipment, ref: E-304}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: crude}
      - {id: cw, direction: out, kind: energy, delegates: q12}

streams:
  # feeds
  - id: S1
    title: Refined soybean oil
    from: OIL.out
    to: R101.oil
    template: bio
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: design basis}
        pressure: {value: 300, provenance: assumed, source: design basis}
        composition: {basis: mass_fraction, values: {TG: 1.0}, provenance: assumed, source: "D-004: refined, dry soybean oil as one triglyceride lump; free fatty acids below 0.05 % in refined oils (Van Gerpen et al. 2004, p. 52) not carried"}
        flow: {value: 4071.78, provenance: calculated, source: 'cheme process propagate: spec rate (S27 t/a 32420)', fingerprint: 98fd4302510fe48a}
  - id: S3
    title: Fresh methanol
    from: MEOHF.out
    to: M101.meoh
    template: bio
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: design basis}
        pressure: {value: 300, provenance: assumed, source: design basis}
        composition: {basis: mass_fraction, values: {MEOH: 1.0}, provenance: assumed, source: "D-005: anhydrous methanol (Van Gerpen et al. 2004, p. 32), from methanol-1"}
        flow: {value: 422.689, provenance: calculated, source: 'cheme process propagate: spec methanol-ratio (S5 MEOH per S1 TG (mole) 6)', fingerprint: 98fd4302510fe48a}
  - id: S4
    title: Sodium methoxide solution 25 wt% in methanol
    from: CATF.out
    to: M101.cat
    template: bio
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: design basis}
        pressure: {value: 300, provenance: assumed, source: design basis}
        composition: {basis: mass_fraction, values: {NAOME: 0.25, MEOH: 0.75}, provenance: given, source: "D-005: sodium methoxide usually as a 25 % solution in methanol (Van Gerpen et al. 2004, p. 33)"}
        flow: {value: 40.7178, provenance: calculated, source: 'cheme process propagate: spec rate (0.01 x S1)', fingerprint: 98fd4302510fe48a}
  - id: S23
    title: Wash water (softened, warm)
    from: PW.out
    to: R201.water
    template: bio
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "D-007: softened water at the design ambient; warmed to the wash's 333 K (120 to 140 F, Van Gerpen et al. 2004, p. 68) inside the wash step, by the hot esters and LP steam (Q5)"}
        pressure: {value: 300, provenance: assumed, source: design basis}
        composition: {basis: mass_fraction, values: {H2O: 1.0}, provenance: assumed, source: D-007}
        flow: {value: 4641.83, provenance: calculated, source: 'cheme process propagate: spec rate (1.14 x S1)', fingerprint: 98fd4302510fe48a}
  - id: S24
    title: Hydrochloric acid 33 wt% to the wash
    from: HCLW.out
    to: R201.acid
    template: bio
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: design basis}
        pressure: {value: 300, provenance: assumed, source: design basis}
        composition: {basis: mass_fraction, values: {HCL: 0.33, H2O: 0.67}, provenance: assumed, source: "D-007: the 33 wt% acid of hydrogen-chloride-1"}
        flow: {value: 0.611989, provenance: calculated, source: 'cheme process propagate: spec rate (0.0001503 x S1)', fingerprint: 98fd4302510fe48a}
  - id: S29
    title: Hydrochloric acid 33 wt% to the glycerol neutraliser
    from: HCLG.out
    to: R301.acid
    template: bio
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: design basis}
        pressure: {value: 300, provenance: assumed, source: design basis}
        composition: {basis: mass_fraction, values: {HCL: 0.33, H2O: 0.67}, provenance: assumed, source: "D-008: the 33 wt% acid of hydrogen-chloride-1, dosed equal to the methoxide (pH control)"}
        flow: {value: 20.2367, provenance: calculated, source: 'cheme process propagate: spec rate (0.00497 x S1)', fingerprint: 98fd4302510fe48a}
  # methanol loop
  - id: S20
    title: Recovered methanol
    from: M501.out
    to: M101.rec
    template: bio
    state:
      design:
        temperature: {value: 308.15, provenance: assumed, source: "D-006: condensed against cooling water"}
        pressure: {value: 300, provenance: assumed, source: design basis}
        flow: {value: 430.849, provenance: calculated, source: 'cheme process propagate: recycle M501 from S15 S17 (tear, broyden)', fingerprint: 6b3423113ab115f4}
        composition: {basis: mole_fraction, values: {TG: 0.0, MEOH: 1.0, FAME: 0.0, GLY: 0.0, NAOME: 0.0, HCL: 0.0, NACL: 0.0, H2O: 0.0}, provenance: calculated, source: 'cheme process propagate: recycle M501 from S15 S17 (tear, broyden)', fingerprint: 6b3423113ab115f4}
  - id: S5
    title: Methanol and catalyst to the reactors
    from: M101.out
    to: SP101.in
    template: bio
    state:
      design:
        temperature: {value: 303.15, provenance: assumed, source: "D-006: mixed feeds and recycle"}
        pressure: {value: 300, provenance: assumed, source: design basis}
        flow: {value: 894.256, provenance: calculated, source: 'cheme process propagate: mixer M101 from S3 S4 S20', fingerprint: 4c4d061ec1478647}
        composition: {basis: mole_fraction, values: {TG: 0.0, MEOH: 0.993217, FAME: 0.0, GLY: 0.0, NAOME: 0.00678284, HCL: 0.0, NACL: 0.0, H2O: 0.0}, provenance: calculated, source: 'cheme process propagate: mixer M101 from S3 S4 S20', fingerprint: 6c150180783d5e04}
  - id: S6
    title: Methanol and catalyst to R-101
    from: SP101.r1
    to: R101.meoh
    template: bio
    state:
      design:
