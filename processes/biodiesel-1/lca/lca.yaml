# Goal and scope of the biodiesel-1 LCI. Schema: `cheme schema lca`. Outputs: `cheme assess lca
# --write` (lca/inventory.csv, gaps.csv, dataset.yaml, manifest.json, results); never edit those
# by hand.
#
# Preliminary gate-to-gate foreground inventory (DESIGN.md D-011): every exchange of the
# continuous plant with its amount per kg of biodiesel, from the flowsheet's design case. The
# backgrounds are left unmapped (`missing:` with the activity each should connect to), except
# where lca/mappings.yaml links a library producer or a shared entry: a gap, never zero, and no
# values from licensed databases. The soybean oil and the sodium methoxide have no library
# producer: their gaps name the activity each should connect to (D-011).
schema: cheme/lca/v1
kind: lca
goal: >-
  Preliminary gate-to-gate life cycle inventory of biodiesel (fatty acid methyl esters) made by
  base-catalysed transesterification of refined soybean oil with methanol in two CSTRs, with
  methanol recovery, an acid water wash and vacuum drying, at the concept stage: which raw
  materials, utilities and wastes the plant exchanges per kg of biodiesel, as the foreground for
  a later cradle-to-gate study. No impact results: most backgrounds are not mapped yet (D-011).
functional_unit: {product: BD, amount: 1, unit: kg, source: "1 kg of dried biodiesel (modelled 99.68 wt% methyl esters) at the plant gate to storage, stream S27 (D-002, D-007, D-011)"}
# The boundary key stays cradle-to-gate so that the purchased inputs remain open gaps instead of
# being mapped free (the schema's gate-to-gate maps every feed free), as oxalyl-chloride-1 does.
boundary: cradle-to-gate
case: design
year: 2026
location: GLO
technology: "Continuous plant: refined soybean oil transesterified with methanol (6 mol per mol of oil) and sodium methoxide (0.25 wt% of the oil) in two CSTRs at 333 K, the glycerol decanted after each; methanol flashed off the esters at 40 kPa(a) and stripped from the neutralised glycerol phase in a column at 40 kPa(a) with an MP-steam reboiler, and recycled; the esters washed once with water warmed to 333 K and acidified with HCl, and vacuum dried; 32 420 t/a of biodiesel and 3 880 t/a of crude glycerol (about 87 wt%) in 8000 h/a"
rights: "CC-BY-4.0: the ChemE-as-Code process library's own concept design (LICENSE-DATA)"
system_model: cutoff
allocation:
  # Mass allocation written as its shares (D-011): S27 4052.51 kg/h biodiesel and S32 485.06
  # kg/h crude glycerol give 4052.51 / 4537.57 = 0.8931 and 0.1069.
  method: shares
  coproducts: [BD, CGLY]
  shares: {BD: 0.8931, CGLY: 0.1069}
  source: >-
    D-011 (agent proposal, for the LCA practitioner to confirm): two products leave for use,
    biodiesel and crude glycerol. The library hierarchy (docs/system-model.md) gives an energy
    allocation for co-produced fuels; crude glycerol is not traded as a fuel here but as a
    chemical feed (to a glycerol refinery such as glycerol-1), so the WBCSD rule applies. No
    prices are sourced at the concept stage, so the price ratio is not known, and the shares are
    by mass, as the USDA plant model of Pradhan and Shrestha (2009, pp. 7-9) allocates the
    conversion energy (82.4 % to the biodiesel, 17.6 % to its 80 % crude glycerin).
  deviation: >-
    The method rests on missing prices: Van Gerpen et al. (2004, p. 40) put crude glycerol of 50 %
    or less at under 5 US cents per pound, which against fuel prices may give a price ratio above
    5 and so economic allocation, with a smaller share for the glycerol. The conservative bound
    is all burdens to the biodiesel (share 1). Sourced prices replace the mass shares.
flows:
  # raw materials
  - key: feed:OIL
    missing: "not mapped yet (D-011); no library process makes vegetable oil. Connect to: refined, bleached soybean oil from soybean crushing (hexane extraction), degumming and alkali refining, per kg; the crushing's meal is its co-product (Pradhan and Shrestha 2009 allocate 20.6 % of the farming and crushing energy to the oil, p. 7)"
    source: "flowsheet stream S1 (D-004)"
  - key: feed:MEOHF
    missing: "linked to processes/methanol-1 (lca/mappings.yaml): Grade AA methanol"
    source: "flowsheet stream S3 (D-005)"
  - key: feed:CATF
    missing: "not mapped yet (D-011); no library process makes sodium methoxide. Connect to: sodium methoxide, 25 wt% solution in methanol, made from sodium hydroxide and methanol with water removal (or from sodium metal or sodium amalgam and methanol), per kg of solution; its methanol 0.75 kg/kg from processes/methanol-1, its sodium from processes/chlor-alkali-1 (recorded proxy, not linked)"
    source: "flowsheet stream S4 (D-005)"
  - key: feed:PW
    missing: "not mapped yet (D-011); connect to: softened process water from the site water treatment, per kg (processes/demineralised-water-1 when merged, a stricter grade)"
    source: "flowsheet stream S23, softened water at 298 K warmed in the wash by the esters and LP steam (Q5) (D-007)"
  - key: feed:HCLW
    missing: "linked to processes/hydrogen-chloride-1 (lca/mappings.yaml): hydrochloric acid 33 wt%"
    source: "flowsheet stream S24 (D-007)"
  - key: feed:HCLG
    missing: "linked to processes/hydrogen-chloride-1 (lca/mappings.yaml): hydrochloric acid 33 wt%"
    source: "flowsheet stream S29 (D-008)"
  # utilities
  - key: feed:POWER
    missing: "not mapped yet (D-011); connect to: electricity, medium voltage, grid mix of the (undecided) site country"
    source: "flowsheet energy streams P1 to P6 (D-009)"
  - key: feed:LPS
    missing: "linked as heat from steam (lca/mappings.yaml); connect to: steam in the chemical industry, 450 kPa(a), from a natural-gas-fired site boiler (e.g. processes/utility-steam-ng-boiler), per kWh of condensing heat"
    source: "flowsheet energy streams Q1 (R-101) and Q5 (the wash, its water warmed from 298 to 333 K), core's conversion duties, Q3 (the ester flash) and Q6 (the dryer), hand estimates, D-009"
  - key: feed:MPS
    missing: "linked as heat from steam (lca/mappings.yaml); connect to: steam in the chemical industry, 1000 kPa(a), from a natural-gas-fired site boiler (e.g. processes/utility-steam-ng-boiler), per kWh of condensing heat"
    source: "flowsheet energy stream Q10 (the glycerol column's reboiler, whose bottoms boil at 405 K), hand estimate, D-008, D-009"
  - key: product:CW
    missing: "not mapped yet (D-011); connect to: heat rejected to a recirculating cooling-water system with cooling tower (processes/utility-cooling-tower), per kWh removed"
    source: "flowsheet energy streams Q2 (R-102), Q4, Q7, Q8, Q9, Q11 and Q12 (D-009)"
  # wastes
  - key: product:WW
    treatment: {kind: waste, route: "the spent wash water and the dryer condensate (traces of methanol, glycerol, NaCl and HCl) to the site's biological wastewater treatment (D-007)"}
    missing: "not mapped yet (D-011); connect to: treatment of wastewater with a low organic load in a municipal or industrial biological plant, per kg (processes/utility-wwtp)"
    source: "flowsheet streams S22 and S25 (D-007)"
operation:
  hours_per_year: 8000
  life_years: 20
  source: "design basis operating_hours_per_year 8000 (ASSUMED, D-002); 20 a service life ASSUMED"
carbon_accounting:
  content:
    "feed:OIL":
      biogenic_fraction: 1.0
      source: "D-004, D-011: refined soybean oil, all its carbon from the plant (the triglyceride lump, 0.7732 kg C per kg)"
    "feed:MEOHF":
      biogenic_fraction: 0.0
      source: "D-011: methanol from natural gas (methanol-1)"
    "feed:CATF":
      biogenic_fraction: 0.0
      source: "D-011: sodium methoxide and its methanol from fossil methanol"
  source: "D-011: the oil's chains carry their biogenic carbon into the esters and the crude glycerol; the esters' methyl groups and the methanol lost are fossil (methanol from natural gas, methanol-1)"

emission_exclusions:
  - {id: methanol-vents, method: storage-tank, equipment: [V-101, V-501, E-201, D-204, C-303], reason: "No P&ID yet: the breathing of the methanol drums and the discharges of the vacuum pumps of the ester flash, the dryer and the glycerol column carry methanol vapour; vented through a vent condenser, not estimated at the concept stage (D-012)."}
  - {id: reactor-vents, method: storage-tank, equipment: [R-101, R-102, V-102, V-103, R-302], reason: "The reactors, the decanters and the neutraliser run liquid-full above methanol's vapour pressure (D-005, D-006) with nitrogen-blanketed vents to the methanol vent condenser (D-012); their breathing at start-up and level changes is not estimated."}
  - {id: glycerol-phase-vents, method: storage-tank, equipment: [V-301], reason: "The glycerol phase collection tank holds the decanted glycerol phases with about 26 wt% methanol (S28, D-006); nitrogen-blanketed and vented to the methanol vent condenser (D-012); its breathing is not estimated."}
  - {id: wash-vents, method: storage-tank, equipment: [C-202, V-203], reason: "The wash contactor and settler hold the esters and wash water at 333 K with about 0.4 wt% methanol in the water (S22, D-007); vented to the methanol vent condenser (D-012); not estimated."}
dataset:
  version: 0.1.0
  classification: {isic: "2029"}   # ISIC Rev.4 2029 Manufacture of other chemical products n.e.c. (biodiesel)
  modelling: {principle: attributional}
  geography: {description: "Generic site beside an oilseed crushing and refining plant, not chosen (GLO); one design case"}
  system_model: cutoff
  technology_level: current
  review: {type: none}
  data_generator: "ChemE-as-Code agent session (Claude Opus 5.5) for issue #515, unreviewed"
