id: biodiesel-fame-from-soybean-oil-by-base-catalysed-transesterification-32-420-t-a
title: Biodiesel (FAME) from soybean oil by base-catalysed transesterification (32 420 t/a)
description: Unallocated foreground LCI of Biodiesel (FAME) from soybean oil by base-catalysed transesterification
  (32 420 t/a), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Continuous plant: refined soybean oil transesterified with methanol (6 mol per mol of oil)
  and sodium methoxide (0.25 wt% of the oil) in two CSTRs at 333 K, the glycerol decanted after each;
  methanol flashed off the esters at 40 kPa(a) and stripped from the neutralised glycerol phase in a column
  at 40 kPa(a) with an MP-steam reboiler, and recycled; the esters washed once with water warmed to 333
  K and acidified with HCl, and vacuum dried; 32 420 t/a of biodiesel and 3 880 t/a of crude glycerol
  (about 87 wt%) in 8000 h/a'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:methanol-vents
  title: storage-tank emissions of V-101, V-501, E-201, D-204, C-303
  direction: output
  reason: 'No P&ID yet: the breathing of the methanol drums and the discharges of the vacuum pumps of
    the ester flash, the dryer and the glycerol column carry methanol vapour; vented through a vent condenser,
    not estimated at the concept stage (D-012).'
- key: emission-excluded:reactor-vents
  title: storage-tank emissions of R-101, R-102, V-102, V-103, R-302
  direction: output
  reason: The reactors, the decanters and the neutraliser run liquid-full above methanol's vapour pressure
    (D-005, D-006) with nitrogen-blanketed vents to the methanol vent condenser (D-012); their breathing
    at start-up and level changes is not estimated.
- key: emission-excluded:glycerol-phase-vents
  title: storage-tank emissions of V-301
  direction: output
  reason: The glycerol phase collection tank holds the decanted glycerol phases with about 26 wt% methanol
    (S28, D-006); nitrogen-blanketed and vented to the methanol vent condenser (D-012); its breathing
    is not estimated.
- key: emission-excluded:wash-vents
  title: storage-tank emissions of C-202, V-203
  direction: output
  reason: The wash contactor and settler hold the esters and wash water at 333 K with about 0.4 wt% methanol
    in the water (S22, D-007); vented to the methanol vent condenser (D-012); not estimated.
