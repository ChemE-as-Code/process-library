location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Continuous plant: refined soybean oil transesterified with methanol (6 mol per mol of oil)
  and sodium methoxide (0.25 wt% of the oil) in two CSTRs at 333 K, the glycerol decanted after each;
  methanol flashed off the esters at 50 kPa(a) and stripped from the neutralised glycerol phase at atmospheric
  pressure, and recycled; the esters washed once with warm water acidified with HCl and vacuum dried;
  32 420 t/a of biodiesel and 3 890 t/a of crude glycerol (about 87 wt%) in 8000 h/a'
