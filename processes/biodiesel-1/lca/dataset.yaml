cutoff:
- key: emission-excluded:methanol-vents
  title: storage-tank emissions of V-101, V-501, E-201, D-204
  direction: output
  reason: 'No P&ID yet: the breathing of the methanol drums and the discharges of the flash and dryer
    vacuum pumps carry methanol vapour; vented through a vent condenser, not estimated at the concept
    stage (D-007).'
- key: emission-excluded:reactor-vents
  title: storage-tank emissions of R-101, R-102, R-302
  direction: output
  reason: The reactors and the neutraliser run liquid-full above methanol's vapour pressure (D-005) with
    nitrogen-blanketed vents to the methanol vent condenser; their breathing at start-up and level changes
    is not estimated (D-007).
- key: emission-excluded:storage-breathing
  title: storage-tank emissions of V-301
  direction: output
  reason: The breathing of the oil, biodiesel and crude glycerol tanks is not estimated (low vapour pressures,
    D-011).
