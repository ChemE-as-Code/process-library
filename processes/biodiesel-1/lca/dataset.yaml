allocation:
  method: shares
  coproducts:
  - BD
  - CGLY
  shares:
    BD: 0.8931
    CGLY: 0.1069
  source: 'D-011 (agent proposal, for the LCA practitioner to confirm): two products leave for use, biodiesel
    and crude glycerol. The library hierarchy (docs/system-model.md) gives an energy allocation for co-produced
    fuels; crude glycerol is not traded as a fuel here but as a chemical feed (to a glycerol refinery
    such as glycerol-1), so the WBCSD rule applies. No prices are sourced at the concept stage, so the
    price ratio is not known, and the shares are by mass, as the USDA plant model of Pradhan and Shrestha
    (2009, pp. 7-9) allocates the conversion energy (82.4 % to the biodiesel, 17.6 % to its 80 % crude
    glycerin).'
  deviation: 'The method rests on missing prices: Van Gerpen et al. (2004, p. 40) put crude glycerol of
    50 % or less at under 5 US cents per pound, which against fuel prices may give a price ratio above
    5 and so economic allocation, with a smaller share for the glycerol. The conservative bound is all
    burdens to the biodiesel (share 1). Sourced prices replace the mass shares.'
