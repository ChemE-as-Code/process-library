title: Biodiesel (FAME) from soybean oil by base-catalysed transesterification (32 420 t/a)
description: Unallocated foreground LCI of Biodiesel (FAME) from soybean oil by base-catalysed transesterification
  (32 420 t/a), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
