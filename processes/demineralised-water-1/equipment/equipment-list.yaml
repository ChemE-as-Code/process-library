# The equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps,
# with the sizes scripts/balance.py gives. Design pressures, temperatures and materials are not
# set yet (basic engineering); the materials named are usual choices for demineralised water,
# hydrochloric acid and caustic soda, to be confirmed. All values ASSUMED unless a source is named.
schema: cheme/equipment/v1
equipment:
  - {tag: P-101, type: CentrifugalPump, service: "Raw water pump to the media filters",
     notes: "69.0 m3/h from 1.013 to 4 bar(a), 8.2 kW at an efficiency of 0.70 (D-007); duty and standby."}
  - {tag: F-101, type: Filter, service: "Dual-media pressure filters (anthracite over sand) with backwash, and cartridge filters ahead of the RO",
     notes: "Filtration at 15 m/h (SRC-1 p. 60: 10-20 m/h): about 4.6 m2 of filter area in service, e.g. three filters of 1.8 m diameter (2.5 m2 each), two in service while one backwashes; backwash at 45 m/h for 10 min and a 10 min rinse to drain every 24 h, 2.8 % of the filtered water (D-003); cartridge filters before the high-pressure pump. Blower for air scour not counted."}
  - {tag: P-102, type: CentrifugalPump, service: "RO high-pressure pump",
     notes: "67.1 m3/h from 2.0 to 12.5 bar(a), 28.0 kW at 0.70 (D-004, D-007); variable-speed drive; no energy recovery from the concentrate (D-004); stainless steel."}
  - {tag: M-101, type: Separator, service: "Reverse osmosis, two stages in a 2:1 array of six-element pressure vessels",
     notes: "57 brackish-water elements of 37.2 m2 at 23.8 L/(m2 h) (SRC-1 p. 107), rounded up to 10 vessels of six (60 elements, 22.5 L/(m2 h)) in a 7:3 array (about 2:1); 75 % recovery (SRC-1 p. 105, 108), salt rejection 0.99 ASSUMED; clean-in-place skid not counted (D-004)."}
  - {tag: T-101, type: Tank, service: "RO permeate tank (feed of the mixed beds and regeneration water)",
     notes: "About 50 m3 (1 h of permeate), atmospheric, stainless steel or lined, with a CO2 vent filter (D-005)."}
  - {tag: P-201, type: CentrifugalPump, service: "Mixed-bed feed and demineralised water forwarding pump",
     notes: "50.0 m3/h from 1.013 to 6 bar(a), 9.9 kW at 0.70 (D-007); duty and standby; stainless steel (demineralised water is corrosive to carbon steel)."}
  - {tag: X-201, type: Vessel, service: "Mixed-bed ion exchangers, two (one in service, one regenerating or on standby), with acid and caustic dilution and the regeneration pumps",
     notes: "1.25 m3 of resin each at 40 bed volumes per hour (ASSUMED), 40 % strong acid cation and 60 % strong base anion resin by volume; regenerated in place every 72 h (SRC-3: one or a few days on RO permeate): 50 kg HCl at 5 wt-% and 82.5 kg NaOH at 4 wt-% (SRC-2), 15 bed volumes of backwash, displacement and rinse water; resins remixed with air (D-005); rubber-lined steel."}
  - {tag: T-301, type: Tank, service: "Neutralisation pit for the regeneration effluent, with trim acid",
     notes: "About 30 m3 (more than one regeneration's 21.8 m3 of effluent), lined concrete or plastic, agitated, pH-controlled to 6 to 9 before release (SRC-5, D-006)."}
  - {tag: T-302, type: Tank, service: "Wastewater sump to the site's treatment (backwash, RO concentrate, neutralised effluent)",
     notes: "About 20 m3 (1 h of the 19.0 m3/h), concrete, with transfer pumps to the site's wastewater treatment (D-006)."}
