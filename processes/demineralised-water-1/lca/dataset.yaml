id: demineralised-water-by-media-filtration-reverse-osmosis-and-mixed-bed-ion-exchange-50-m3-h
title: Demineralised water by media filtration, reverse osmosis and mixed-bed ion exchange (50 m3/h)
description: Unallocated foreground LCI of Demineralised water by media filtration, reverse osmosis and
  mixed-bed ion exchange (50 m3/h), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: Raw surface water pumped through dual-media pressure filters (backwash 2.8 % of the filtered
  water), a two-stage brackish-water reverse osmosis at 75 % recovery and 12.5 bar(a) without energy recovery,
  and two mixed beds (2.5 m3 of resin, one in service) regenerated in place every 36 h with 5 wt-% hydrochloric
  acid and 4 wt-% caustic soda; the regeneration effluent neutralised with trim acid, all wastewater (backwash,
  RO concentrate, effluent) discharged to surface water under the site's permit; 50 m3/h, 8000 h/a
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:discharge-traces
  title: effluent emissions of product:WW
  direction: output
  reason: 'what the balance does not carry in the discharge: the suspended solids the filters take out
    of the river water and return with the backwash (D-003), the raw water''s hardness, alkalinity, silica
    and CO2 (lumped as NaCl, L-2), and the residues of antiscalant and dechlorination dosing, which are
    outside the boundary (D-001); to be estimated with a raw-water analysis (D-008)'
- key: emission-excluded:water-tanks
  title: storage-tank emissions of T-101, T-301, T-302
  direction: output
  reason: 'Tanks of water, dilute salt solutions and the neutralised effluent at 25 degC: no volatile
    component (the regenerants are diluted and neutralised; HCl over 5 wt-% acid has a negligible vapour
    pressure, and the 33 wt-% acid is stored in a vented tank with a scrubber outside this flowsheet''s
    tanks); the RO permeate tank vents only dissolved CO2, which the flowsheet does not carry (L-2). Negligible
    (D-008).'
