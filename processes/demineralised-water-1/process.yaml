  - {title: "de Dardel, F. Ion exchange: regeneration methods (regenerant levels and concentrations, mixed-bed regeneration), updated 2021", url: "https://dardel.info/IX/processes/regeneration.html"}
  - {title: "de Dardel, F. Basic ion exchange processes in water treatment (demineralisation, mixed-bed polishing), updated 2020", url: "https://dardel.info/IX/processes/processes.html"}
  - {title: "de Dardel, F. Ion exchange capacity, updated 2021", url: "https://dardel.info/IX/capacity.html"}
  - {title: "de Dardel, F. Neutralisation of regenerants, updated 2014", url: "https://dardel.info/IX/processes/neutralisation.html"}
