# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Demineralised water from fresh surface water: media filters, a two-stage brackish-water RO
# and mixed-bed polishing regenerated with hydrochloric acid and caustic soda (DESIGN.md D-001).
# Where the values come from:
# - cheme process propagate: every flow and composition downstream of the feeds, from the
#   filter's backwash share, the RO's and the mixed bed's splits (component separators, core
#   ADR 0070), the regeneration mixer and the neutralisation R301 (a conversion step); the
#   raw-water flow and the regeneration water's share of the permeate are solved by the two
#   specs (the product rate and the regeneration water);
# - scripts/balance.py (run with `cheme run scripts/balance.py`, library ADR 0027): the
#   splits' values (written beside them), the regenerant feeds, the RO feed pressure and the
#   pump powers, given here as ASSUMED with the script as source; its inputs are sourced
#   (SRC-n) or ASSUMED in DESIGN.md;
# - temperatures and the other pressures are design choices (D-002, D-007), ASSUMED.
# Year averages: the mixed bed runs 36 h between regenerations (D-005); its chemicals, rinse
# water and the salt it holds are spread over the run.
schema: cheme/process/v1
kind: flowsheet
title: Demineralised water by media filtration, reverse osmosis and mixed-bed ion exchange (50 m3/h)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 50 000 kg/h (50 m3/h) demineralised water at the gate, 8000 h/a, raw water with 500 mg/kg dissolved solids taken as NaCl, 25 degC (D-002)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: RAW, title: "Raw water (fresh surface water, clarified), withdrawn", category: raw_material, ports: [{id: out, direction: out}]}
  - id: HCL
    title: Hydrochloric acid 33 wt-% from hydrogen-chloride-1
    category: raw_material
    ports:
      - {id: regen, direction: out}
      - {id: trim, direction: out}
  - {id: NAOH, title: Caustic soda 50 wt-% from chlor-alkali-1, category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power (AC, grid)
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: p101, direction: out, kind: energy}
      - {id: p102, direction: out, kind: energy}
      - {id: p201, direction: out, kind: energy}
      - {id: u201, direction: out, kind: energy}
products:
  - {id: DEMIN, title: "Demineralised water to the site header (below 1 uS/cm)", category: product, ports: [{id: in, direction: in}]}
  - {id: WW, title: "Wastewater discharged to surface water under the site's permit: filter backwash, RO concentrate and neutralised regeneration effluent", category: wastewater, ports: [{id: in, direction: in}]}
  - id: AMBIENT
    title: Heat of neutralisation left in the pit's water (to the ambient)
    category: utility
    utility: {kind: other}
    ports: [{id: r301, direction: in, kind: energy}]

blocks:
  - id: PRE
    title: Raw water pumping and media filtration
    class: Filtering
    ports:
      - {id: raw, direction: in}
      - {id: filt, direction: out}
      - {id: bw, direction: out}
      - {id: power, direction: in, kind: energy}
  - id: RO
    title: Two-stage reverse osmosis and permeate tank
    class: SeparatingByPhysicalProcess
    ports:
      - {id: filt, direction: in}
      - {id: conc, direction: out}
      - {id: svc, direction: out}
      - {id: regen, direction: out}
      - {id: power, direction: in, kind: energy}
  - id: IX
    title: Mixed-bed ion exchange and its regeneration
    class: SeparatingByPhysicalProcess
    ports:
      - {id: svc, direction: in}
      - {id: regen, direction: in}
      - {id: acid, direction: in}
      - {id: caustic, direction: in}
      - {id: prod, direction: out}
      - {id: spent, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: aux, direction: in, kind: energy}
  - id: NEU
    title: Neutralisation and wastewater collection
    class: ReactingChemicals
    ports:
      - {id: spent, direction: in}
      - {id: trim, direction: in}
      - {id: bw, direction: in}
      - {id: conc, direction: in}
      - {id: ww, direction: out}
      - {id: heat, direction: out, kind: energy}

steps:
  # PRE: raw-water pump and dual-media pressure filters (D-003)
  - id: P101
    block: PRE
    title: Raw water pump
    class: GeneratingFlow
    links: [{target: equipment, ref: P-101}]
    ports:
      - {id: in, direction: in, delegates: raw}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  # the backwash and the rinse to drain are filtered water, taken here as a share of what
  # passes the filters: (45 m/h x 10 min + 15 m/h x 10 min) / (15 m/h x 24 h) = 0.0277778
  - id: F101
    block: PRE
    title: Dual-media pressure filters with backwash (and cartridge filters)
    class: SplittingMaterial
    split: {bw: 0.0277778}
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: filt, direction: out, delegates: filt}
      - {id: bw, direction: out, delegates: bw}
  # RO: high-pressure pump, 2:1 array of 8-inch brackish-water elements, permeate tank (D-004)
  - id: P102
    block: RO
    title: RO high-pressure pump
    class: GeneratingFlow
    links: [{target: equipment, ref: P-102}]
    ports:
      - {id: in, direction: in, delegates: filt}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M101
    block: RO
    title: Reverse osmosis, two stages (2:1 array)
    class: SeparatingByPhysicalProcess
    recovery:
      outlets:
        perm: {H2O: 0.75, NaCl: 0.0138629}
      provenance: assumed
      source: "scripts/balance.py: water recovery 0.75 (SRC-1 p. 105 Table 25 and p. 108); salt passage (1 - 0.99) x 1.8484 x 0.75 = 0.0138629 of the feed's salt, rejection 0.99 ASSUMED on the log-mean feed-side concentration (SRC-1 p. 11: 95 to above 99 %), D-004"
    links: [{target: equipment, ref: M-101}]
    ports:
      - {id: feed, direction: in}
      - {id: perm, direction: out}
      - {id: conc, direction: out, delegates: conc}
  # the permeate tank: the mixed bed's feed and the regeneration water (dilution and rinse)
  - id: SP101
    block: RO
    title: Permeate tank (to the mixed beds and to regeneration water)
    class: SplittingMaterial
    links: [{target: equipment, ref: T-101}]
    ports:
      - {id: in, direction: in}
      - {id: svc, direction: out, delegates: svc}
      - {id: regen, direction: out, delegates: regen}
  # IX: mixed-bed feed pump, the mixed beds in service, their regeneration (D-005)
  - id: P201
    block: IX
    title: Mixed-bed feed and demineralised water forwarding pump
    class: GeneratingFlow
    links: [{target: equipment, ref: P-201}]
    ports:
      - {id: in, direction: in, delegates: svc}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  # the salt the beds take up leaves by `load` and is released at regeneration (year average)
  - id: X201
    block: IX
    title: Mixed-bed ion exchangers in service (one in service, one regenerating or standby)
    class: SeparatingByPhysicalProcess
    recovery:
      outlets:
        prod: {H2O: 1.0, NaCl: 0.002}
      provenance: assumed
      source: "D-005: all water to the product; 0.2 % of the permeate's salt slips through (about 0.02 mg/kg, ASSUMED); the product's conductivity is set by the CO2 the model does not carry (L-2): at most 1 uS/cm for a mixed bed on RO permeate (SRC-3)"
    links: [{target: equipment, ref: X-201}]
    ports:
      - {id: in, direction: in}
      - {id: prod, direction: out, delegates: prod}
      - {id: load, direction: out}
  - id: M201
    block: IX
    title: Regeneration (acid and caustic diluted to 5 and 4 wt-%, backwash, displacement and rinse)
    class: Mixing
    links: [{target: equipment, ref: X-201}]
    ports:
      - {id: ions, direction: in}
      - {id: water, direction: in, delegates: regen}
      - {id: acid, direction: in, delegates: acid}
      - {id: caustic, direction: in, delegates: caustic}
      - {id: out, direction: out, delegates: spent}
  # IX's electrical auxiliaries (dosing and regeneration pumps, the air blower that remixes the
  # resins, instruments): their power never reaches the water (core ADR 0059, D-007)
  - id: U201
    block: IX
    title: Regeneration pumps, chemical dosing, resin-mixing blower and instruments
    class: ProcessStep
    links: [{target: equipment, ref: X-201}]
    ports:
      - {id: aux, direction: in, kind: energy, delegates: aux}
  # NEU: neutralisation pit with trim acid, wastewater sump (D-006)
  - id: R301
    block: NEU
    title: Neutralisation pit
    class: ReactingChemicals
    reactions: [NEUT]
    reactor: conversion
    energy_port: heat   # the heat of neutralisation, written by the conversion model (core ADR 0059)
    links: [{target: equipment, ref: T-301}]
    ports:
      - {id: in, direction: in, delegates: spent}
      - {id: trim, direction: in, delegates: trim}
      - {id: out, direction: out}
      - {id: heat, direction: out, kind: energy, delegates: heat}
  - id: M301
    block: NEU
    title: Wastewater sump (to the site's permitted discharge)
    class: Mixing
    links: [{target: equipment, ref: T-302}]
    ports:
      - {id: neut, direction: in}
      - {id: bw, direction: in, delegates: bw}
      - {id: conc, direction: in, delegates: conc}
      - {id: out, direction: out, delegates: ww}

# Design specifications (core ADR 0070): the raw water for the product rate, and the share of the
# permeate drawn as regeneration water for the script's dilution and rinse water.
specs:
  - id: PRODUCT_RATE
    vary: {stream: S1, initial: 69000.0}
    target: {stream: S11, quantity: flow, value: 50000.0}
    provenance: assumed
    source: "D-002: 50 m3/h of demineralised water, ASSUMED"
  - id: REGEN_WATER
    vary: {node: SP101, port: regen, initial: 0.006}
    target: {stream: S9, quantity: flow, value: 1194.221}
    provenance: assumed
    source: "scripts/balance.py: dilution of the acid to 5 wt-% (47.14 kg/h) and of the caustic to 4 wt-% (105.42 kg/h), and 15 bed volumes of backwash, displacement and rinse water per regeneration (1041.67 kg/h), D-005"

