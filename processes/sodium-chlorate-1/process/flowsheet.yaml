        pressure: {value: 300, provenance: assumed, source: "design basis"}
        composition: {basis: mass_fraction, values: {H2O: 1.0}, provenance: assumed, source: "demineralised water (SRC-1, Table 7.79)"}
        flow: {value: 3459.36, provenance: calculated, source: 'cheme process propagate: spec liquor (S6 NaClO3 mass fraction 0.40357)', fingerprint: fde8e5447cdd34cc}
