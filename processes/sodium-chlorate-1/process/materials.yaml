# Components and templates of sodium-chlorate-1. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol from the formula
# with the IUPAC 2021 abridged standard atomic weights (Na 22.990, Cl 35.45, O 15.999, H 1.008).
#
# The liquor is written as neutral salts in water, an inventory basis and not a speciation
# (DESIGN.md D-004, L-1): NaCl and NaClO3 are dissolved; NaOCl lumps the "active chlorine" of the
# cell liquor (hypochlorous acid plus hypochlorite, Cl2 + H2O -> HOCl + HCl in the anode layer),
# whose split between HOCl and OCl- at pH 6.1-6.5 the reaction-tank sizing takes from the source
# (DESIGN.md D-007), not the flowsheet. The crystals are the separate solid component NaClO3_s
# (phase: solid, core ADR 0025). Sodium dichromate (3-5 g/L in the liquor, SRC-1) is not a
# component: it circulates, its make-up is an LCA consumable (D-010).
schema: cheme/process/v1
kind: materials
components:
  - {id: NaCl, name: Sodium chloride (salt feed and dissolved), formula: NaCl, cas: 7647-14-5, molar_mass: 58.440}
  - {id: NaClO3, name: Sodium chlorate (dissolved), formula: NaClO3, cas: 7775-09-9, molar_mass: 106.437}
  - {id: NaClO3_s, name: Sodium chlorate (crystals), formula: NaClO3, cas: 7775-09-9, molar_mass: 106.437, phase: solid}
  - {id: NaOCl, name: "Active chlorine (hypochlorous acid and hypochlorite), as NaOCl", formula: NaClO, cas: 7681-52-9, molar_mass: 74.439}
  - {id: H2O, name: Water, formula: H2O, cas: 7732-18-5, molar_mass: 18.015, normal_boiling_point: 373.12}
  - {id: H2, name: Hydrogen, formula: H2, cas: 1333-74-0, molar_mass: 2.016, normal_boiling_point: 20.37}
  - {id: O2, name: Oxygen, formula: O2, cas: 7782-44-7, molar_mass: 31.998, normal_boiling_point: 90.19}
templates:
  - {id: liquor, title: "Chlorate liquor (NaCl, NaClO3, active chlorine in water)", components: [NaCl, NaClO3, NaOCl, H2O, NaClO3_s, H2, O2]}
  - {id: slurry, title: Crystal cake and dried product, components: [NaClO3_s, NaCl, NaClO3, NaOCl, H2O]}
  - {id: salt, title: Salt, components: [NaCl]}
  - {id: water, title: Water and vapour, components: [H2O]}
  - {id: cellgas, title: Cell gas (hydrogen with oxygen), components: [H2, O2, NaCl, NaClO3, NaOCl, H2O, NaClO3_s]}
  - {id: loop, title: Electrolyte with cell gas, components: [NaCl, NaClO3, NaOCl, H2O, H2, O2, NaClO3_s]}
# No property package covers these electrolyte liquors (core's packages are gas mixtures); the
# duties are from core's cell, crystallizer and dryer models and hand balances (DESIGN.md D-009).
property_method:
  adapter: thermo
  status: placeholder
