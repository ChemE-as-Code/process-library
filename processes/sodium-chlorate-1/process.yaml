    - {chemical: hydrogen-chloride, role: feedstock, inventory_key: "consumable:hydrochloric-acid", note: "Hydrochloric acid 33 wt% (hydrogen-chloride-1) for pH adjustment, 68 g/kg (BREF Table 7.81 middle)"}
    - {chemical: sodium-carbonate, role: feedstock, inventory_key: "consumable:sodium-carbonate", note: "Soda ash (soda-ash-1) for the brine treatment, 1.0 g/kg"}
    - {chemical: hydrogen-peroxide, role: feedstock, inventory_key: "consumable:hydrogen-peroxide", note: "Hydrogen peroxide 50 wt% (hydrogen-peroxide-1) to reduce hypochlorite, 4 g/kg"}
    - {chemical: nitrogen, role: feedstock, inventory_key: "consumable:nitrogen", note: "Nitrogen (asu-1) for purging, 3.2 g/kg"}
  outputs:
    - {chemical: sodium-chlorate, role: main-product, inventory_key: "product:NACLO3P", note: "Sodium chlorate crystal, dried (modelled 99.6 wt% NaClO3, 0.28 wt% NaCl), to storage"}
    - {chemical: hydrogen, role: co-product, inventory_key: "product:H2P", note: "Hydrogen used as fuel or feedstock, 69 % of the cell gas (40.9 g H2 per kg, with 14.7 g O2); mass allocation 3.9 % (DESIGN.md D-011)"}
    - {chemical: hydrogen, role: emission, inventory_key: "product:H2V", note: "Hydrogen not used, vented, 18.4 g/kg (BREF: 9-28 g/kg)"}
    - {chemical: wastewater, role: waste, inventory_key: "product:PURGE", note: "Mother-liquor bleed to effluent treatment, 0.41 g/kg"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "5.196 kWh/kg: rectifiers 4.90 (cells 4.75 DC) and auxiliaries 0.30 (BREF: 5.0-6.0 kWh/kg)"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "LP steam 450 kPa(a) for the dryer's air heater, 0.034 kWh/kg (counted as heat); the crystallizer runs on the cells' heat"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "2.42 kWh/kg removed: the cells' heat not recovered, the crystallizer condenser, the rectifier losses"}
