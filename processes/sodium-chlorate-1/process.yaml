# Process Atlas manifest of sodium-chlorate-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: sodium-chlorate-1
title: Sodium chlorate by electrolysis of brine in undivided cells, crystallisation and drying (50 000 t/a, concept)
summary: >-
  Sodium chlorate crystal from salt, water and electricity: brine electrolysed in undivided
  cells with dichromate, the active chlorine turned into chlorate in reaction tanks, a side
  stream crystallised under vacuum with the cells' heat, centrifuged and dried, the mother
  liquor recycled; hydrogen a co-product. Concept stage, 4.9 MWh per t at the rectifiers,
  preliminary gate-to-gate LCI.
description: |
  Solid salt is dissolved in the recycled mother liquor and the crystallizer's condensate and
  joins the circulating electrolyte (about 121 g/L NaCl and 565 g/L NaClO3, 98 m3 per t of
  chlorate through the cells). 400 undivided cells with titanium anodes and steel cathodes run at
  70 C, 2.5 kA/m2 and 3.0 V with a current efficiency of 0.95 and 3-5 g/L sodium dichromate:
  chlorine formed at the anode hydrolyses to hypochlorous acid and hypochlorite, which
  disproportionate to chlorate in the reaction tanks (about 650 m3, sized from the third-order
  rate of Spasojevic et al. 2018 at pH 6.4); hydrogen forms at the cathode, with 2.2 mol% oxygen
  from the efficiency loss. Overall NaCl + 3 H2O -> NaClO3 + 3 H2. A 12 % side stream goes to a
  vacuum crystallizer at 323 K, heated by the cells' heat through a hot-water loop: 15 % of its
  water evaporates and 15 % of its chlorate crystallises; the crystal is centrifuged and dried in
  a fluidised bed; the condensate dissolves the next salt. 69 % of the hydrogen goes to users,
  the rest is vented.

  cheme process propagate solves the whole flowsheet: the cells and tanks as conversion reactors,
  core's crystallizer, centrifuge and dryer, the recycle torn at the cell feed and two design
  specifications (the salt for 6250 kg/h of crystal, the water for 565 g/L of chlorate). The
  cells' power and heat are core's Faraday balance (cheme process cell): 4771 DC kWh per t of
  chlorate formed, 48 % of it heat, 59.5 kg of hydrogen per t; each checks against the BREF
  LVIC-S 2007. The crystallizer's yield is ASSUMED (no open solubility data of NaClO3 in the
  chloride liquor were read). See DESIGN.md for every assumption.
families: [inorganic-chemicals, electrolysis]
keywords: [sodium chlorate, NaClO3, chlorate cell, undivided cell, electrolysis, brine, sodium chloride, sodium dichromate, hypochlorite, hypochlorous acid, disproportionation, reaction tank, crystallisation, vacuum crystallizer, centrifuge, fluidised-bed dryer, hydrogen, chlorine dioxide, pulp bleaching]
facets:
  feedstock_basis: [mineral, water, electricity]
  product_classes: [chemicals]
  unit_operations: [electrolysis, reaction, crystallization, drying]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, voltage, oxygen share,
# liquor density, crystallizer yield and centrifuge cake are assumed; the current efficiency,
# operating ranges and consumptions from the BREF and US 5 419 818 A (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD with closed mass, component and element balances (cheme validate, cheme process
    streams: 4 blocks and 14 steps within tolerance; the loop converged at the tear S6 with the
    design specifications rate and liquor). The cells are a conversion of the chloride to active
    chlorine per pass (HYPO) and the reaction tanks its conversion to chlorate (CHEM) and, for the
    cell's oxygen, to oxygen (OXY); the conversions are set so that the extents equal core's
    Faraday balance of process/cells.yaml (the step lists HYPO, the cell the overall CHLORATE: a
    core limit, its cell-flowsheet warning accepted, DESIGN.md L-7). Power 30.19 MW DC, heat 14.61 MW, 4771 kWh/t
    (cheme process cell) against 4700-5200 AC kWh/t in the BREF with an ASSUMED rectifier
    efficiency of 0.97; hydrogen 59.5 kg/t (BREF: 60); heat 48 % of the power (BREF: about 50 %).
    The crystallizer is core's model on an imposed, ASSUMED yield and evaporation; its duty
    (3.44 MW) comes from the cells' heat; the dryer is core's model with ASSUMED parameters. The
    reaction tanks are sized by hand from the open rate constant (D-007). Heats of solution and
    dilution are left out (no electrolyte package). Preliminary gate-to-gate LCI with the BREF's
    auxiliary chemicals as consumables, mass allocation to the hydrogen used; the salt, water,
    steam and the consumables linked to library producers or shared entries, electricity (in
    cheme assess lca; the Atlas build links it to the shared grid entry) and dichromate gaps. cheme maturity reaches no level; the claim `maturity: concept` is the
    lowest value of the schema, not an evidenced level. Not reviewed. Needs cheme-as-code 1.12.0.
