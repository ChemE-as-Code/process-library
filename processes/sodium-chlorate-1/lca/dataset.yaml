location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Continuous plant: solid salt dissolved in the recycled mother liquor and the crystallizer
  condensate; 400 undivided cells (DSA titanium anodes, steel cathodes) at 70 C, 2.5 kA/m2 and 3.0 V,
  current efficiency 0.95, with 3-5 g/L sodium dichromate; reaction tanks of about 650 m3 for the chlorate
  formation; 15 % of a 101 t/h side stream''s chlorate crystallised in a vacuum crystallizer heated with
  the cells'' heat, centrifuged and dried in a fluidised bed; 69 % of the hydrogen used, the rest vented
  (BREF LVIC-S 2007 section 7.13; US 5 419 818 A)'
