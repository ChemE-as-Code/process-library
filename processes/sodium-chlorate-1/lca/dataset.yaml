title: Sodium chlorate by electrolysis of brine in undivided cells, crystallisation and drying (6250 kg/h)
description: Unallocated foreground LCI of Sodium chlorate by electrolysis of brine in undivided cells,
  crystallisation and drying (6250 kg/h), case design, derived from the flowsheet by cheme assess lca.
