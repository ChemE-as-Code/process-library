# Tier 0 form, a manifest-only entry without a flowsheet (as processes/cumene-1). Every amount is the formula of its
# parameters; core's validator re-checks each. Written from the LVIC-AAF BREF (2007) and the EFMA BAT booklet No. 7 (2000),
# facts in our own form. Generated amounts and balance: the formulas are the record.
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: npk-nitrophosphate-odda
title: NPK 15-15-15 by the nitrophosphate (ODDA) route, with CNTH conversion to ammonium nitrate and lime
description: Tier 0 screening per 1 t of NPK 15-15-15, gate-to-gate, integrated nitrophosphate complex without its
  ammonia and nitric acid plants. Feeds from the stoichiometry of a model rock and product with the NP-solution
  composition of the EFMA BAT booklet; utilities from AMI Linz and Dutch infoMil figures in the LVIC-AAF BREF; emissions
  from EFMA BAT levels and one plant. Ammonium nitrate and calcium carbonate from the conversion are co-products.
basis: 1000 kg of NPK 15-15-15
boundary: 'gate-to-gate: rock digestion in nitric acid, sand removal, CNTH crystallisation and filtration, CNTH
  conversion with NH3 and CO2 to CaCO3 and AN solution, AN evaporation, neutralisation, potash addition, granulation,
  drying, cooling, coating; ammonia, nitric acid, CO2, steam and power from outside'
technology: 'nitrophosphate (ODDA) process: digestion in about 60 % HNO3, cooling crystallisation of calcium nitrate
  tetrahydrate, ammoniation of the nitrophosphoric acid, spherodiser or drum granulation; the mixed-acid route and
  CN fertiliser instead of conversion are not modelled'
geography:
  description: 'EU: utilities of AMI Linz (AT) and Dutch figures (infoMil 2001), BAT levels of the European industry;
    no single site.'
classification:
  isic: '2012'
system_boundary:
  included:
  - phosphate rock, nitric acid, ammonia, potash, CO2 for the conversion, filler
  - electricity, steam, natural gas for the dryers, compressed air
  - co-products ammonium nitrate and calcium carbonate; sand to building use
  - CO2 of the rock carbonate and the fuel; NH3, NOx, HF and dust to air; N, P2O5 and F to water
  excluded:
  - 'TODO cooling water (17 m3/t at AMI Linz, BREF Table 7.4): not converted to heat rejected, the temperature rise
    is not stated'
  - TODO process and scrubbing water and the effluent volume (AMI Linz discharges 3450 m3/d at 1200 t/d, BREF Table
    7.6); the net water is counted as vapour
  - 'TODO the rock''s minor constituents (5.6 wt%: Al, Fe, Mg, Na, SO3, organics), its excess fluorine, trace metals
    (Cd) and their fate; the dolomite filler stands in for their mass'
  - 'TODO HNO3 reduced to NOx by the rock''s organics and iron, and N, P and F lost to air and water: not added
    to the feeds'
  - TODO coating agent and anti-caking oil; micronutrients, magnesium and sulfate salts of other grades
  - 'TODO steam export of an on-site nitric acid plant (EFMA 2.2.2): no credit in the cut-off model'
  - the ammonia and nitric acid plants of the integrated complex (their products are feeds)
  - storage, bagging and loading emissions
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: RER
year: 2002
valid_until: 2007
time:
  start: 2000
  description: AMI Linz data of 2000 and 2001 and infoMil 2001 as reported in the 2007 BREF; EFMA booklet of 2000.
    valid_until is the reference year + 5 (system-model section 6), so it has long lapsed.
modelling:
  principle: attributional
  multifunctionality: 'three products: NPK, ammonium nitrate and calcium carbonate from the CNTH conversion (see
    allocation); the dataset itself is unallocated'
allocation:
  method: mass
  coproducts:
  - npk
  - ammonium-nitrate
  - calcium-carbonate
  deviation: No sourced prices, so the WBCSD price ratio cannot be computed; nutrient-based or economic allocation
    would shift burden to the NPK. Mass is the preliminary choice.
