# Process Atlas manifest of formic-acid-1. Schema: schemas/process.schema.json (cheme-as-code/process/v1).
# plant.yaml stays the engineering manifest; sheets and results are derived from the
# ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: formic-acid-1
title: Formic acid 85 wt% by methanol carbonylation and methyl formate hydrolysis (50 kt/a)
summary: >-
  Methanol and carbon monoxide form methyl formate over sodium methoxide; the ester is
  hydrolysed with water, methyl formate and methanol are recycled, and the aqueous acid is
  concentrated to 85 wt% by pressure-swing distillation. Concept stage, assumed basis,
  preliminary gate-to-gate LCI.
description: |
  Carbon monoxide (from a syngas cold box outside the boundary) is compressed to 4.6 MPa and
  absorbed into recycled methanol with 2.5 wt% sodium methoxide in a gas-liquid loop reactor at
  353 K; 30 % of the methanol is converted per pass and the CO-rich vent (8 % of the CO fed) is
  burnt in a thermal oxidiser. Methyl formate is distilled off and hydrolysed at 393 K with
  water (1.5 mol/mol), autocatalysed by recycled formic acid, to 95 % of the equilibrium
  conversion (28.9 % per pass). Unreacted ester and the methanol formed are distilled off and
  recycled; the methanol returns dry to the carbonylation, so only losses are made up. The
  dilute acid (49 wt%) is concentrated by pressure-swing distillation across the maximum-boiling
  formic acid / water azeotrope: a 203 kPa(a) column takes water overhead (recycled to the
  hydrolysis) and a 12 kPa(a) column gives the 85 wt% product overhead, its 66 wt% bottoms
  returning to the hydrolyser as catalyst.

  The reactors are conversion models from open patents (US4216339A, EP2747883A1, EP3661904B1,
  US4299981); separators and columns are specified splits and every duty a shortcut estimate
  from an independent script (scripts/balance.py), because no property package of core covers
  this liquid system (core #315). See DESIGN.md for every assumption and gated step.
families: [oxygenates]
keywords: [formic acid, methyl formate, methanol carbonylation, sodium methoxide, hydrolysis, pressure-swing distillation, azeotrope, carbon monoxide]
facets:
  feedstock_basis: [fossil, water]
  product_classes: [chemicals]
  unit_operations: [reaction, distillation, compression, incineration]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Feeds, conversions, splits and duties
# are assumed or taken from patents (DESIGN.md D-002..D-011).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD with closed mass, component and element balances on every block and step
    (cheme validate, cheme process streams), recycles of methyl formate, methanol, water and
    66 wt% acid closed by scripts/balance.py. The reactors and the oxidiser are calculated by
    cheme (conversion model); core's equilibrium check puts the hydrolyser outlet just short of
    the sourced Kx = 0.20 (ln Q/K = -0.11). Separator and column outlets are specified splits;
    duties are shortcut estimates with assumed reflux ratios and no heat integration (3.64 kWh
    LP steam heat per kg product, about 1.5 times the 2400 kWh/t of prior art quoted in
    EP2747883A1). The energy balance is not evaluable in core: no property package covers the
    liquid methanol / methyl formate / water / formic acid system and the liquid-reactor energy
    basis is not verified (core #315). Capacity, feed purities, reflux ratios and the purge
    fraction are assumed. Preliminary gate-to-gate LCI with every background unmapped (gaps).
    Not reviewed. The chemicals registry has no formic-acid, methyl-formate, carbon-monoxide,
    methanol, sodium-methoxide or sodium-formate entry yet, so the main product and those feeds
    are not listed under chemistry (open library item, DESIGN.md D-013).
chemistry:
  # formic acid, CO, methanol and sodium methoxide have no registry entry yet (D-013); listed in the notes
  inputs:
    - {chemical: water, role: feedstock, inventory_key: "feed:PW", note: "Demineralised hydrolysis make-up water, 0.483 kg/kg product. The reactant carbon monoxide (feed:CO, 0.568 kg/kg), the methanol make-up (feed:MEOH, 12.5 g/kg, from methanol-1) and the sodium methoxide 30 wt% catalyst solution (feed:CAT, 2.3 g/kg) have no registry entry yet"}
    - {chemical: air, role: feedstock, inventory_key: "feed:AIR", note: "Combustion air of the vent oxidiser, 0.235 kg/kg product"}
  outputs:
    - {chemical: carbon-dioxide, role: emission, inventory_key: "emission:CO2", note: "72.4 g/kg product, from burning the carbonylation vent (unreacted CO) in the oxidiser (fossil). The main product, formic acid 85 wt% (product:FA), has no registry entry yet"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "84 Wh/kg product: CO compressor (89 %), pumps, vacuum system (ASSUMED efficiencies)"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "3.64 kWh heat/kg product as LP steam (450 kPa(a)): reboilers of five columns, hydrolyser feed preheat (shortcut, no heat integration, D-011)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "3.61 kWh/kg product removed, 25/35 C (ASSUMED)"}
basis:
  capacity: "6.25 t/h formic acid 85 wt% (50 kt/a), ASSUMED"
  operating_hours_per_year: 8000
  location: generic (not chosen)
