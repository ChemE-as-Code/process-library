- key: emission-excluded:decomposition-co
  title: non-routine emissions of the plant
  direction: output
  reason: 'Formic acid decomposition to CO and water above about 140 C (EP2747883A1) is neglected: the
    hydrolyser runs at 393 K and the reboilers below about 405 K (D-008); a residual decomposition would
    add CO to the column vents.'
