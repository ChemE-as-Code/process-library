templates:
  - {id: co, title: Carbon monoxide feed, components: [CO, N2]}
  - {id: methanol, title: Methanol, components: [MEOH, H2O]}
  - {id: catalyst, title: Sodium methoxide in methanol, components: [NAOME, MEOH]}
  - {id: carb, title: "Carbonylation liquor (methanol, methyl formate, catalyst)", components: [MEOH, MF, NAOME, NAFORM, H2O]}
  - {id: carb_out, title: Carbonylation effluent, components: [CO, N2, MEOH, MF, NAOME, NAFORM, H2O]}
  - {id: vent, title: Carbonylation vent gas, components: [CO, N2, MF, MEOH]}
  - {id: ester, title: Methyl formate with methanol, components: [MF, MEOH]}
  - {id: hydrolysate, title: Methyl formate / methanol / water / formic acid, components: [MF, MEOH, H2O, FA]}
  - {id: acid, title: Aqueous formic acid, components: [FA, H2O]}
  - {id: water, title: Process water, components: [H2O]}
  - {id: air, title: Dry air, components: [N2, O2, AR]}
  - {id: flue, title: Oxidiser flue gas, components: [N2, O2, AR, CO2, H2O, CO, MF, MEOH]}
# No benchmarked property package covers the liquid streams of this process (cheme process
# props --coverage). Values are assumed from scripts/balance.py with their source.
property_method:
  adapter: thermo
  status: placeholder
