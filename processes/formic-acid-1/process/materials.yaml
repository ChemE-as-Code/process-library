# Components and templates of formic-acid-1. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
#
# Ideal-gas data printed by `cheme chemistry thermo` (chemicals package: ATcT, CRC, Poling 5th
# ed.); boiling points `cheme chemistry props ... -p temperature_boil --source Thermo`. Sodium
# methoxide and sodium formate are molecular pseudo-components of the methanolic catalyst liquor
# without ideal-gas data. No benchmarked property package of core covers the liquid
# methanol / methyl formate / water / formic acid system (cheme process props --coverage),
# so the separator and column outlets come from scripts/balance.py (DESIGN.md D-006).
schema: cheme/process/v1
kind: materials
components:
  - id: CO
    name: Carbon monoxide
    formula: CO
    cas: 630-08-0
    molar_mass: 28.010
    normal_boiling_point: 81.6
    critical: {Tc: 132.86, Pc: 3494.0, omega: 0.0497, source: "chemicals: Tc HEOS, Pc HEOS, omega HEOS"}
    ideal_gas: {dHf_298: -110525.0, S_298: 197.7, cp_R: [3.912, -0.003913, 1.182e-05, -1.3e-08, 5.15e-12], temperature_range: [50, 1000], source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R Poling (5th ed.)"}
