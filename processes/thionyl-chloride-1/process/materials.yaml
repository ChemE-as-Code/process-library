    ideal_gas: {dHf_298: -17570.0, S_298: 281.6, cp_R: [3.65028, 0.0140413, -2.46912e-05, 2.02375e-08, -6.34247e-12], temperature_range: [298.15, 1000], source: "chemicals: dHf_298 WEBBOOK, S_298 WEBBOOK, cp_R fitted to thermo JANAF 298.15-1000 K (max deviation 0.11 %)"}
  - id: S2CL2
