    ideal_gas: {dHf_298: -16740.0, S_298: 327.19, cp_R: [5.51588, 0.0180999, -3.01972e-05, 2.32692e-08, -6.82476e-12], temperature_range: [298.15, 1000], source: "chemicals: dHf_298 WEBBOOK, S_298 WEBBOOK, cp_R fitted to thermo TRCIG 298.15-1000 K (max deviation 0.36 %)"}
