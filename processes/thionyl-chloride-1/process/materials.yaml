# Components and templates of thionyl-chloride-1. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
#
# Gas data printed by `cheme chemistry thermo` (chemicals/thermo packages: CRC, NIST WebBook,
# JANAF, Poling 5th ed., TRCIG fits). Sulfur is the condensed element (liquid in the process):
# it has no ideal-gas entry here, its enthalpy in scripts/balance.py comes from approximate
# condensed-phase data (DESIGN.md D-006). The scrubber species (NaOH, Na2SO3, Na2SO4, NaCl,
# Na2S2O3) are molecular pseudo-components of the aqueous liquor without ideal-gas data. No
# property package of core is qualified for the sulfur chlorides, thionyl chloride or the
# alkaline liquor, so the condensation, degassing, distillation and scrubber
# values come from scripts/balance.py (D-006).
schema: cheme/process/v1
kind: materials
components:
  - id: SOCL2
    name: Thionyl chloride
    formula: Cl2OS
    cas: 7719-09-7
    molar_mass: 118.970
    normal_boiling_point: 348.75
    critical: {Tc: 567.0, Pc: 4430.0, omega: 0.0946, source: "chemicals: Tc PINAMARTINES, Pc PINAMARTINES, omega YAWS"}
    ideal_gas: {dHf_298: -212500.0, S_298: 309.8, cp_R: [4.42692, 0.0189314, -2.92695e-05, 2.22068e-08, -6.64823e-12], temperature_range: [298.15, 1000], source: "chemicals: dHf_298 CRC, S_298 CRC, cp_R fitted to thermo TRCIG 298.15-1000 K (max deviation 0.17 %)"}
  - id: SCL2
    name: Sulfur dichloride
    formula: Cl2S
    cas: 10545-99-0
    molar_mass: 102.971
    normal_boiling_point: 332.75
