    name: Sodium sulfate (dissolved)
    formula: Na2SO4
    cas: 7757-82-6
    molar_mass: 142.042
  - id: NACL
    name: Sodium chloride (dissolved)
    formula: NaCl
    cas: 7647-14-5
    molar_mass: 58.443
  - id: NA2S2O3
    name: Sodium thiosulfate (dissolved)
    formula: Na2S2O3
    cas: 7772-98-7
    molar_mass: 158.108
templates:
  - {id: sulfur, title: Molten sulfur, components: [S]}
  - {id: chlorine, title: Chlorine gas, components: [CL2, O2]}
  - {id: so2, title: Sulfur dioxide, components: [SO2]}
  - {id: schl, title: Sulfur chlorides (chlorinator liquor), components: [S2CL2, SCL2, SOCL2, S, O2]}
  - {id: process, title: "Reactor gas and condensate (SO2, Cl2, sulfur chlorides, thionyl chloride)", components: [SOCL2, SCL2, S2CL2, SO2, CL2, O2]}
  - {id: crude, title: Crude thionyl chloride, components: [SOCL2, SCL2, S2CL2, S]}
  - {id: product, title: Thionyl chloride product, components: [SOCL2, SCL2, S2CL2]}
  - {id: caustic, title: Caustic soda solution, components: [NAOH, H2O]}
  - {id: water, title: Process water, components: [H2O]}
  - {id: vent, title: Scrubbed vent gas, components: [O2, SO2, CL2, SOCL2, SCL2, S2CL2, H2O]}
  - {id: liquor, title: Spent scrubber liquor, components: [NAOH, NA2SO3, NA2SO4, NACL, NA2S2O3, S, H2O]}
# No benchmarked property package covers the sulfur chlorides, thionyl chloride or the alkaline
# liquor (cheme process props --coverage). Values are assumed from
# scripts/balance.py with their source.
property_method:
  adapter: thermo
  status: placeholder
