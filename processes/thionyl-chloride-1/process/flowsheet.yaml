# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Thionyl chloride from sulfur, chlorine and sulfur dioxide (DESIGN.md D-001): molten sulfur is
# chlorinated to S2Cl2 and on to SCl2 inside the boundary, the SCl2 vapour reacts with SO2 and
# chlorine over activated carbon at about 200 C, the crude is condensed and degassed (SO2 and
# Cl2 recycled as gas, a small purge to a caustic scrubber) and distilled with sulfur, which
# turns the remaining SCl2 into S2Cl2; the still bottoms return to the sulfur chlorination.
# Where the values come from:
# - feeds, temperatures, pressures, conversions, recycle and purge rules: design basis and
#   decisions D-002..D-010, ASSUMED, the ranges from the open patents cited there;
# - every stream value and duty: the independent balance scripts/balance.py (D-006), given
#   here as ASSUMED: no property package of core is qualified for the sulfur chlorides,
#   thionyl chloride or the alkaline scrubber liquor (core #315, #364), so core can neither
#   flash the condensers nor close the energy balance. cheme checks the mass, component and
#   element balances and the conversion reactors (cheme process propagate --check).
schema: cheme/process/v1
kind: flowsheet
title: Thionyl chloride from sulfur, chlorine and SO2 over activated carbon (3.75 t/h)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 3750 kg/h thionyl chloride (99.7 wt%), 30 kt/a at 8000 h (D-002)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: SULFUR, title: Molten sulfur (merchant sulfur from refinery or gas-plant sulfur recovery), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: CL2, title: Chlorine gas (chlor-alkali-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: SO2, title: Liquid sulfur dioxide (merchant; sulfur burning), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NAOH, title: Caustic soda 50 wt% (chlor-alkali-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PW, title: Process water (scrubber dilution), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: p101, direction: out, kind: energy}
      - {id: k201, direction: out, kind: energy}
      - {id: p201, direction: out, kind: energy}
      - {id: p301, direction: out, kind: energy}
      - {id: p401, direction: out, kind: energy}
  - id: LPS
    title: LP steam 500 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 500, provenance: assumed, source: "design basis (D-010)"}
      supply_temperature: {value: 424.98, provenance: given, source: "saturation at 500 kPa(a), IAPWS-IF97"}
      min_approach: {value: 10, provenance: assumed, source: "D-010"}
    ports:
      - {id: e201, direction: out, kind: energy}
      - {id: e202, direction: out, kind: energy}
      - {id: e203, direction: out, kind: energy}
      - {id: t201, direction: out, kind: energy}
      - {id: t301, direction: out, kind: energy}
products:
  - {id: SOCL2, title: Thionyl chloride to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: EFF, title: Spent scrubber liquor to wastewater treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - {id: STACK, title: Scrubbed vent to atmosphere, category: off_gas, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis (D-010)"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis (D-010)"}
      min_approach: {value: 5, provenance: assumed, source: "design basis"}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: r102, direction: in, kind: energy}
      - {id: r201, direction: in, kind: energy}
      - {id: e204, direction: in, kind: energy}
      - {id: t301, direction: in, kind: energy}
  - id: BRINE
    title: Refrigerated brine return (253 K)
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 253.15, provenance: assumed, source: "design basis (D-007)"}
      return_temperature: {value: 258.15, provenance: assumed, source: "design basis (D-007)"}
      min_approach: {value: 5, provenance: assumed, source: "D-007"}
    ports:
      - {id: e205, direction: in, kind: energy}
      - {id: t201, direction: in, kind: energy}

blocks:
  - id: SCHL
    title: Sulfur chlorination (S2Cl2 and SCl2)
    class: ReactingChemicals
    ports:
      - {id: s, direction: in}
      - {id: cl2, direction: in}
      - {id: rec, direction: in}
      - {id: cl2_out, direction: out}
      - {id: s_out, direction: out}
      - {id: out, direction: out}
      - {id: cw_r101, direction: out, kind: energy}
      - {id: cw_r102, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: REACT
    title: Thionyl chloride synthesis (activated carbon)
    class: ReactingChemicals
    ports:
      - {id: schl, direction: in}
      - {id: cl2, direction: in}
      - {id: so2, direction: in}
      - {id: rec, direction: in}
      - {id: out, direction: out}
      - {id: steam_e201, direction: in, kind: energy}
      - {id: steam_e202, direction: in, kind: energy}
      - {id: steam_e203, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: REC
    title: Condensation, degassing and gas recycle
    class: SeparatingByThermalProcess
    ports:
      - {id: in, direction: in}
      - {id: crude, direction: out}
      - {id: rec, direction: out}
      - {id: purge, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: brine_e205, direction: out, kind: energy}
      - {id: brine_t201, direction: out, kind: energy}
      - {id: power_t201, direction: in, kind: energy}
      - {id: power_k201, direction: in, kind: energy}
  - id: PURIF
    title: Purification by distillation with sulfur
    class: Distilling
    ports:
      - {id: crude, direction: in}
      - {id: s, direction: in}
      - {id: product, direction: out}
      - {id: bottoms, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: SCRUB
    title: Purge gas scrubbing (caustic)
    class: Absorbing
    ports:
      - {id: gas, direction: in}
      - {id: naoh, direction: in}
      - {id: water, direction: in}
      - {id: vent, direction: out}
      - {id: liquor, direction: out}
      - {id: power, direction: in, kind: energy}

steps:
  # --- SCHL ------------------------------------------------------------------------------------
  - id: X101
    block: SCHL
    title: Chlorine distribution
    class: SplittingMaterial
    split: {r101: 0.13538119, r102: 0.32987036}
    ports:
      - {id: in, direction: in, delegates: cl2}
      - {id: r101, direction: out}
      - {id: r102, direction: out}
      - {id: m201, direction: out, delegates: cl2_out}
  - id: X102
    block: SCHL
    title: Sulfur distribution
    class: SplittingMaterial
    split: {r101: 0.49350619}
    ports:
      - {id: in, direction: in, delegates: s}
      - {id: r101, direction: out}
      - {id: t301, direction: out, delegates: s_out}
  - id: R101
    block: SCHL
    title: S2Cl2 reactor (sulfur chlorination)
    class: ReactingChemicals
    reactions: [S2CL2_FORM]
    reactor: conversion
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: s, direction: in}
      - {id: cl2, direction: in}
      - {id: rec, direction: in, delegates: rec}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: cw_r101}
  - id: R102
    block: SCHL
    title: SCl2 chlorinator
    class: ReactingChemicals
    reactions: [SCL2_FORM]
    reactor: conversion
    links: [{target: equipment, ref: R-102}]
    ports:
      - {id: in, direction: in}
      - {id: cl2, direction: in}
      - {id: out, direction: out, delegates: out}
      - {id: q, direction: out, kind: energy, delegates: cw_r102}
      - {id: power, direction: in, kind: energy, delegates: power}
  # --- REACT -----------------------------------------------------------------------------------
  - id: E201
    block: REACT
    title: Sulfur chloride vaporiser
    class: Evaporating
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in, delegates: schl}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: steam_e201}
  - id: E202
    block: REACT
    title: SO2 vaporiser
    class: Evaporating
    links: [{target: equipment, ref: E-202}]
    ports:
      - {id: in, direction: in, delegates: so2}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: steam_e202}
  - id: M201
    block: REACT
    title: Reactor feed mixer
    class: Mixing
    links: [{target: equipment, ref: M-201}]
    ports:
      - {id: schl, direction: in}
      - {id: cl2, direction: in, delegates: cl2}
      - {id: so2, direction: in}
      - {id: rec, direction: in, delegates: rec}
      - {id: out, direction: out}
  - id: E203
    block: REACT
    title: Reactor feed preheater
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-203}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: steam_e203}
  - id: R201
    block: REACT
    title: Thionyl chloride reactor (multitubular, activated carbon)
    class: ReactingChemicals
    reactions: [SCL2_FORM_R201, SOCL2_SYN]
    reactor: conversion
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
      - {id: q, direction: out, kind: energy, delegates: cw}
  # --- REC -------------------------------------------------------------------------------------
  - id: E204
    block: REC
    title: Crude condenser (cooling water)
    class: Cooling
    links: [{target: equipment, ref: E-204}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: cw}
  - id: E205
    block: REC
    title: Crude after-condenser (brine)
    class: Cooling
    links: [{target: equipment, ref: E-205}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: brine_e205}
  - id: V201
    block: REC
    title: Crude separator
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-201}]
    ports:
      - {id: in, direction: in}
      - {id: liquid, direction: out}
      - {id: gas, direction: out}
  - id: T201
    block: REC
    title: Degasser (SO2 and Cl2 stripping)
    class: Distilling
    links: [{target: equipment, ref: T-201}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out}
      - {id: liquid, direction: out, delegates: crude}
      - {id: reb, direction: in, kind: energy, delegates: steam}
      - {id: cond, direction: out, kind: energy, delegates: brine_t201}
      - {id: power, direction: in, kind: energy, delegates: power_t201}
  - id: M202
    block: REC
    title: Off-gas collector
    class: Mixing
    ports:
      - {id: sep, direction: in}
      - {id: deg, direction: in}
      - {id: out, direction: out}
  - id: X201
    block: REC
    title: Purge take-off
    class: SplittingMaterial
    split: {purge: 0.01}
    ports:
      - {id: in, direction: in}
      - {id: purge, direction: out, delegates: purge}
      - {id: recycle, direction: out}
  - id: K201
    block: REC
    title: Recycle gas compressor
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: rec}
      - {id: power, direction: in, kind: energy, delegates: power_k201}
  # --- PURIF -----------------------------------------------------------------------------------
  - id: M301
    block: PURIF
    title: Sulfur dosing
    class: Mixing
    ports:
      - {id: crude, direction: in, delegates: crude}
      - {id: s, direction: in, delegates: s}
      - {id: out, direction: out}
  - id: T301
    block: PURIF
    title: Thionyl chloride column (with sulfur)
    class: Distilling
    reactions: [SCL2_SULFUR]
    reactor: conversion
    links: [{target: equipment, ref: T-301}]
    ports:
      - {id: in, direction: in}
      - {id: distillate, direction: out, delegates: product}
      - {id: bottoms, direction: out, delegates: bottoms}
      - {id: reb, direction: in, kind: energy, delegates: steam}
      - {id: cond, direction: out, kind: energy, delegates: cw}
      - {id: power, direction: in, kind: energy, delegates: power}
  # --- SCRUB -----------------------------------------------------------------------------------
  - id: M401
    block: SCRUB
    title: Caustic dilution
    class: Mixing
    ports:
      - {id: naoh, direction: in, delegates: naoh}
      - {id: water, direction: in, delegates: water}
      - {id: out, direction: out}
  - id: T401
    block: SCRUB
    title: Caustic scrubber
    class: Absorbing
    reactions: [SO2_NAOH, CL2_SULFITE, SOCL2_NAOH, SCL2_NAOH, S2CL2_NAOH]
    reactor: conversion
    links: [{target: equipment, ref: T-401}]
    ports:
      - {id: gas_in, direction: in, delegates: gas}
      - {id: liq_in, direction: in}
      - {id: gas_out, direction: out, delegates: vent}
      - {id: liq_out, direction: out, delegates: liquor}
      - {id: power, direction: in, kind: energy, delegates: power}

streams:
  # every value from scripts/balance.py (D-006); temperatures, pressures and rules: the decisions named
  - {id: S1, title: Molten sulfur feed, from: SULFUR.out, to: X102.in, template: sulfur, state: {design: {pressure: {value: 400, provenance: assumed, source: "battery limit (D-003)"}, temperature: {value: 413.15, provenance: assumed, source: "molten sulfur (D-003)"}, phase: {value: liquid, provenance: assumed, source: "molten"}, flow: {value: 508.715, basis: mass, provenance: assumed, source: "scripts/balance.py: sulfur demand of R101 and T301 (D-004, D-008)"}, composition: {basis: mole_fraction, values: {S: 1.0}, provenance: assumed, source: "D-003: bright sulfur, impurities neglected"}}}}
  - {id: S1A, title: Sulfur to the S2Cl2 reactor, from: X102.r101, to: R101.s, template: sulfur, state: {design: {pressure: {value: 400, provenance: assumed, source: "D-003"}, temperature: {value: 413.15, provenance: assumed, source: "D-003"}, phase: {value: liquid, provenance: assumed, source: "molten"}, flow: {value: 251.054, basis: mass, provenance: assumed, source: "scripts/balance.py (D-004)"}, composition: {basis: mole_fraction, values: {S: 1.0}, provenance: assumed, source: "D-003"}}}}
  - {id: S1B, title: Sulfur dosed to the purification, from: X102.t301, to: M301.s, template: sulfur, state: {design: {pressure: {value: 400, provenance: assumed, source: "D-003"}, temperature: {value: 413.15, provenance: assumed, source: "D-003"}, phase: {value: liquid, provenance: assumed, source: "molten"}, flow: {value: 257.661, basis: mass, provenance: assumed, source: "scripts/balance.py: 1.10 x the SCl2 converted in T301 (D-008)"}, composition: {basis: mole_fraction, values: {S: 1.0}, provenance: assumed, source: "D-003"}}}}
  - {id: S2, title: Chlorine feed (chlor-alkali-1), from: CL2.out, to: X101.in, template: chlorine, state: {design: {pressure: {value: 400, provenance: assumed, source: "chlor-alkali-1 chlorine product, 400 kPa(a) (D-003)"}, temperature: {value: 313.15, provenance: assumed, source: "D-003"}, phase: {value: vapor, provenance: assumed, source: "gas"}, flow: {value: 2242.675, basis: mass, provenance: assumed, source: "scripts/balance.py: R101 + R102 + reactor make-up (D-004, D-005)"}, composition: {basis: mole_fraction, values: {CL2: 0.999, O2: 0.001}, provenance: assumed, source: "D-003: liquefied and re-evaporated chlorine, 0.1 mol% O2"}}}}
  - {id: S2A, title: Chlorine to the S2Cl2 reactor, from: X101.r101, to: R101.cl2, template: chlorine, state: {design: {pressure: {value: 400, provenance: assumed, source: "D-003"}, temperature: {value: 313.15, provenance: assumed, source: "D-003"}, phase: {value: vapor, provenance: assumed, source: "gas"}, flow: {value: 303.616, basis: mass, provenance: assumed, source: "scripts/balance.py: stoichiometric for the sulfur (D-004)"}, composition: {basis: mole_fraction, values: {CL2: 0.999, O2: 0.001}, provenance: assumed, source: "D-003"}}}}
  - {id: S2B, title: Chlorine to the SCl2 chlorinator, from: X101.r102, to: R102.cl2, template: chlorine, state: {design: {pressure: {value: 400, provenance: assumed, source: "D-003"}, temperature: {value: 313.15, provenance: assumed, source: "D-003"}, phase: {value: vapor, provenance: assumed, source: "gas"}, flow: {value: 739.792, basis: mass, provenance: assumed, source: "scripts/balance.py: stoichiometric for 90 % of the S2Cl2 (D-004)"}, composition: {basis: mole_fraction, values: {CL2: 0.999, O2: 0.001}, provenance: assumed, source: "D-003"}}}}
  - {id: S2C, title: Chlorine make-up to the reactor feed, from: X101.m201, to: M201.cl2, template: chlorine, state: {design: {pressure: {value: 400, provenance: assumed, source: "D-003"}, temperature: {value: 313.15, provenance: assumed, source: "D-003"}, phase: {value: vapor, provenance: assumed, source: "gas"}, flow: {value: 1199.267, basis: mass, provenance: assumed, source: "scripts/balance.py: reactor inlet Cl2 5 % over stoichiometric less the recycled Cl2 (D-005)"}, composition: {basis: mole_fraction, values: {CL2: 0.999, O2: 0.001}, provenance: assumed, source: "D-003"}}}}
  - {id: S3, title: Liquid sulfur dioxide feed, from: SO2.out, to: E202.in, template: so2, state: {design: {pressure: {value: 500, provenance: assumed, source: "battery limit, liquid SO2 (D-003)"}, temperature: {value: 298.15, provenance: assumed, source: "D-003"}, phase: {value: liquid, provenance: assumed, source: "liquefied SO2 above its vapour pressure (about 390 kPa at 298 K, thermo)"}, flow: {value: 1026.621, basis: mass, provenance: assumed, source: "scripts/balance.py: reactor inlet SO2 100 % over stoichiometric less the recycled SO2 (D-005)"}, composition: {basis: mole_fraction, values: {SO2: 1.0}, provenance: assumed, source: "D-003: commercial liquid SO2, impurities neglected"}}}}
  - {id: S10, title: Disulfur dichloride liquor, from: R101.out, to: R102.in, template: schl, state: {design: {pressure: {value: 200, provenance: assumed, source: "D-004"}, temperature: {value: 343.15, provenance: assumed, source: "D-004"}, phase: {value: liquid, provenance: assumed, source: "liquid"}, flow: {value: 1817.408, basis: mass, provenance: assumed, source: "scripts/balance.py (D-004)"}, composition: {basis: mole_fraction, values: {S2CL2: 0.84490394, SOCL2: 0.15478367, O2: 0.00031239174}, provenance: assumed, source: "scripts/balance.py (D-004)"}}}}
  - {id: S11, title: Sulfur dichloride liquor, from: R102.out, to: E201.in, template: schl, state: {design: {pressure: {value: 300, provenance: assumed, source: "pump P-101 (D-004)"}, temperature: {value: 313.15, provenance: assumed, source: "D-004"}, phase: {value: liquid, provenance: assumed, source: "liquid"}, flow: {value: 2557.200, basis: mass, provenance: assumed, source: "scripts/balance.py (D-004)"}, composition: {basis: mole_fraction, values: {S2CL2: 0.047973885, SOCL2: 0.087886607, SCL2: 0.86352993, O2: 0.00060957408}, provenance: assumed, source: "scripts/balance.py (D-004)"}}}}
  - {id: S12, title: Sulfur chloride vapour, from: E201.out, to: M201.schl, template: process, state: {design: {pressure: {value: 190, provenance: assumed, source: "D-005"}, temperature: {value: 383.15, provenance: assumed, source: "D-005: above the dew point (Raoult, thermo vapour pressures)"}, phase: {value: vapor, provenance: assumed, source: "vapour"}, flow: {value: 2557.200, basis: mass, provenance: assumed, source: "scripts/balance.py (D-005)"}, composition: {basis: mole_fraction, values: {S2CL2: 0.047973885, SOCL2: 0.087886607, SCL2: 0.86352993, O2: 0.00060957408}, provenance: assumed, source: "scripts/balance.py"}}}}
  - {id: S13, title: Sulfur dioxide vapour, from: E202.out, to: M201.so2, template: so2, state: {design: {pressure: {value: 180, provenance: assumed, source: "D-005"}, temperature: {value: 313.15, provenance: assumed, source: "D-005"}, phase: {value: vapor, provenance: assumed, source: "vapour"}, flow: {value: 1026.621, basis: mass, provenance: assumed, source: "scripts/balance.py (D-005)"}, composition: {basis: mole_fraction, values: {SO2: 1.0}, provenance: assumed, source: "D-003"}}}}
  - {id: S24, title: Recycle gas (compressed), from: K201.out, to: M201.rec, template: process, state: {design: {pressure: {value: 180, provenance: assumed, source: "D-007"}, temperature: {value: 293.58, provenance: assumed, source: "scripts/balance.py: isentropic efficiency 0.70 (D-007)"}, phase: {value: vapor, provenance: assumed, source: "gas"}, flow: {value: 2771.549, basis: mass, provenance: assumed, source: "scripts/balance.py (D-007)"}, composition: {basis: mole_fraction, values: {S2CL2: 1.1059611e-06, SOCL2: 0.016650889, SCL2: 0.002269597, O2: 0.072489592, CL2: 0.2023995, SO2: 0.70618932}, provenance: assumed, source: "scripts/balance.py (D-007)"}}}}
