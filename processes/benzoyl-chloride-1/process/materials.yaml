# Components and templates of benzoyl-chloride-1. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol (IUPAC 2021
# standard atomic weights applied to the formula), normal_boiling_point in K at 101.325 kPa.
#
# The liquid data the semi-batch R101 needs (DESIGN.md D-005):
# - liquid_molar_volume, m3/kmol, at the 413 K of R101: benzoic acid from its liquid density,
#   1.029 g/cm3 at 180 C (PubChem CID 243, HSDB); benzoyl chloride 1.2070 g/cm3 at 25 C
#   (PubChem CID 7412, HSDB) and benzotrichloride 1.3756 g/cm3 at 20 C (PubChem CID 7367, HSDB),
#   each volume raised by 10 % for the 115 K above room temperature (ASSUMED, a thermal
#   expansion of about 0.09 %/K usual for aromatic liquids); ZnCl2 from the solid's 2.907 g/cm3
#   (PubChem CID 5727), taken as its volume in the solution. Ideal mixing.
# - liquid_heat_capacity, kJ/(kmol K): benzoyl chloride 187.0 (NIST WebBook, von Reis 1881,
#   290-477 K); benzoic acid 259 at 413 K (NIST WebBook, Pacor 1967); benzotrichloride 250,
#   ASSUMED (no open measured value found; about 1.28 kJ/(kg K), as benzoyl chloride's 1.33);
#   ZnCl2 71.3, the solid's (NIST-JANAF order), ASSUMED for the dissolved salt.
# - HCl is vented whole as it forms (batch.vent, core ADR 0054) and never charged or dosed, so
#   it needs no liquid data. Its ideal-gas heat capacity (chemicals 1.5.2, `cheme chemistry
#   thermo`; SRC-8) lets R-101's vent condenser count the HCl cooled from 413 to 308 K
#   (core 1.10.0, ADR 0062, D-010); about 29.1 kJ/(kmol K) there, as scripts/balance.py takes.
# The batch still ST101 (core ADR 0055, Raoult's law): the Antoine constants of NIST WebBook
# (log10(P/bar) = A - B/(T/K + C), each fitted by NIST to Stull 1947) and heats of
# vaporization in kJ/kmol (NIST's kJ/mol times 1000). ZnCl2 is non-volatile in the still.
# Normal boiling points: benzoyl chloride 471 K (NIST WebBook, mean of 8 values, +/- 2 K),
# benzotrichloride 493.8 K, benzoic acid 522.2 K (NIST WebBook, Weast and Grasselli 1989).
schema: cheme/process/v1
kind: materials
