    normal_boiling_point: 493.8
    liquid_molar_volume: 0.1563
    liquid_heat_capacity: 250.0
    heat_of_vaporization: 52000
    vapour_pressure: {a: 4.82927, b: 2166.28, c: -37.699, temperature_range: [318.9, 486.7], provenance: given, source: "NIST WebBook (C98077), coefficients fitted by NIST to Stull (1947)"}
  - id: BA
    name: Benzoic acid
    formula: C7H6O2
    cas: 65-85-0
    molar_mass: 122.123
    normal_boiling_point: 522.2
    liquid_molar_volume: 0.1187
    liquid_heat_capacity: 259.0
    heat_of_vaporization: 63300
    vapour_pressure: {a: 4.47834, b: 1771.357, c: -127.484, temperature_range: [369.0, 522.4], provenance: given, source: "NIST WebBook (C65850), coefficients fitted by NIST to Stull (1947)"}
  - id: BZCL
    name: Benzoyl chloride
    formula: C7H5ClO
    cas: 98-88-4
    molar_mass: 140.566
    normal_boiling_point: 471.0
    liquid_molar_volume: 0.1281
    liquid_heat_capacity: 187.0
    heat_of_vaporization: 49600
    vapour_pressure: {a: 4.61296, b: 1978.427, c: -41.011, temperature_range: [305.3, 470.4], provenance: given, source: "NIST WebBook (C98884), coefficients fitted by NIST to Stull (1947)"}
  - {id: ZNCL2, name: Zinc chloride (catalyst), formula: ZnCl2, cas: 7646-85-7, molar_mass: 136.28, liquid_molar_volume: 0.0469, liquid_heat_capacity: 71.3}
  - id: HCL
    name: Hydrogen chloride
    formula: HCl
    cas: 7647-01-0
    molar_mass: 36.458
    normal_boiling_point: 188.1
