      design:
        composition: {basis: mole_fraction, values: {BTC: 0.000481425, BA: 0.0348735, BZCL: 0.961214, ZNCL2: 0.0034314, HCL: 0.0}, provenance: calculated, source: 'cheme process propagate: reactor R101 from S3 S4', fingerprint: bc6bbc4b1357e47b}
        flow: {value: 268.761, provenance: calculated, source: 'cheme process propagate: reactor R101 from S3 S4', fingerprint: bc6bbc4b1357e47b}
        temperature: {value: 413.15, provenance: calculated, source: 'cheme process propagate: reactor R101 from S3 S4', fingerprint: bc6bbc4b1357e47b}
        pressure: {value: 101.325, provenance: calculated, source: 'cheme process propagate: reactor R101 from S3 S4', fingerprint: bc6bbc4b1357e47b}
  - id: S6
    title: HCl off-gas
    from: R101.vent
    to: A101.gas
    template: acid
    state:
      design:
        composition: {basis: mole_fraction, values: {HCL: 0.998609, BZCL: 0.0013821, BTC: 8.08022e-06, BA: 5.49769e-07}, provenance: calculated, source: 'cheme process propagate: reactor R101 from S3 S4', fingerprint: bc6bbc4b1357e47b}
        flow: {value: 33.8575, provenance: calculated, source: 'cheme process propagate: reactor R101 from S3 S4', fingerprint: bc6bbc4b1357e47b}
        temperature: {value: 308.15, provenance: calculated, source: 'cheme process propagate: reactor R101 from S3 S4', fingerprint: bc6bbc4b1357e47b}
