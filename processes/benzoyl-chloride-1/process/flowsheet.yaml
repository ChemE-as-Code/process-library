# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Benzoyl chloride from benzotrichloride and benzoic acid over zinc chloride (DESIGN.md D-001),
# a batch plant: benzoic acid is melted with the catalyst, benzotrichloride is dosed into the
# melt at 413 K over 2 h (a semi-batch, reactor: semibatch) and the HCl it forms leaves as gas
# (batch.vent) to an absorber that makes 30 wt% hydrochloric acid; the crude is distilled at
# 5 kPa(a) from its catalyst and excess acid in a batch still with a short column on top.
# The flows are the year averages of the batch recipe (process/recipe.yaml, `cheme process
# recipe`, D-003).
# Where the values come from:
# - feeds, temperatures, pressures, ratios: design basis and D-002..D-009, ASSUMED or from
#   US 4 276 231 A, Example 1 (D-004);
# - R101: cheme's semi-batch model with a vent (core ADRs 0050, 0054), from the ASSUMED rate law
#   of BZCL, to 0.999 conversion of the benzotrichloride (D-005); the HCl leaves saturated with
#   the liquid's vapour through the reflux condenser E-102, whose condensate returns to R-101
#   (core 1.10.0, ADR 0062, D-010);
# - ST101: cheme's batch still with its column K-101 on Diwekar's shortcut (core 1.10.0, ADR
#   0061): Raoult's law with NIST Antoine constants, the column's stages and reflux ASSUMED
#   (D-007, D-008);
# - M101, A101: mixers, E101: a pass-through cooler (`cheme process propagate --fill`);
# - the duties: R101's Q2, its vent condenser's Q8, the still's reboiler Q4 and its condenser
#   Q5 are written by `cheme process propagate --fill` from the models (ADR 0059; core 1.10.0,
#   ADRs 0061 and 0062: R101's energy stream is its one heat stream, its vent condenser's is
#   named by `vent.condenser.energy_port`, the still's by `energy_port` and `condenser_port`);
#   the melter's Q1, the absorber's Q3 and the product cooler's Q7 come from scripts/balance.py
#   (D-009), no property package of core covers these liquids;
# - the feeds S1, S2, S4 and the absorber water S7: scripts/balance.py (D-006).
schema: cheme/process/v1
kind: flowsheet
title: Benzoyl chloride by semi-batch reaction of benzotrichloride with benzoic acid and batch vacuum distillation (2000 t/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 2000 t/a distilled benzoyl chloride, year averages of the batch recipe in 7920 h (D-002, D-003)", default: true}
tolerance: {abs: 0.05, rel: 0.002}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: BA, title: Benzoic acid (flakes; no library process), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: ZNCL2, title: Zinc chloride (anhydrous catalyst), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: BTC, title: Benzotrichloride (no library process), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PW, title: Process water (HCl absorber), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: st101, direction: out, kind: energy}
  - id: MPS
    title: MP steam 1100 kPa(a) (melter)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1100, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 457.0, provenance: given, source: "saturation at 1100 kPa(a), IAPWS-IF97"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: m101, direction: out, kind: energy}
  - id: LPS
    title: LP steam 450 kPa(a) (still reboiler)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 421.0, provenance: given, source: "saturation at 450 kPa(a), IAPWS-IF97"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: st101, direction: out, kind: energy}
products:
  - {id: BZCL, title: Benzoyl chloride to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: HCLAQ, title: Hydrochloric acid 30 wt% (co-product), category: by_product, ports: [{id: in, direction: in}]}
  - {id: RES, title: Still residue to hazardous-waste incineration, category: by_product, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: e102, direction: in, kind: energy}
      - {id: a101, direction: in, kind: energy}
      - {id: st101, direction: in, kind: energy}
      - {id: e101, direction: in, kind: energy}

blocks:
  - id: PREP
    title: Benzoic acid melting
    class: Mixing
    ports:
      - {id: ba, direction: in}
      - {id: zncl2, direction: in}
      - {id: out, direction: out}
      - {id: steam, direction: in, kind: energy}
  - id: REACT
    title: Semi-batch reaction with HCl off-gas
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: btc, direction: in}
      - {id: out, direction: out}
      - {id: vent, direction: out}
      - {id: q, direction: out, kind: energy}
      - {id: q_vent, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: ABSORB
    title: HCl absorption to hydrochloric acid
    class: Mixing
    ports:
      - {id: gas, direction: in}
      - {id: water, direction: in}
      - {id: acid, direction: out}
      - {id: q, direction: out, kind: energy}
  - id: PURIFY
    title: Batch vacuum distillation
    class: Distilling
    ports:
      - {id: in, direction: in}
      - {id: product, direction: out}
      - {id: residue, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: condenser, direction: out, kind: energy}
      - {id: cooler, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}

steps:
  - id: M101
    block: PREP
    title: Melter (benzoic acid with the catalyst to 413 K)
    class: Mixing
    links: [{target: equipment, ref: M-101}]
    ports:
      - {id: ba, direction: in, delegates: ba}
      - {id: zncl2, direction: in, delegates: zncl2}
      - {id: out, direction: out, delegates: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
  - id: R101
    block: REACT
    title: Reactor (benzotrichloride dosed into the melt at 413 K, HCl vented)
    class: ReactingChemicals
    reactions: [BZCL]
    reactor: semibatch
    batch:
      dosing: [{stream: S4, time: 7200}]
      target: {key: BTC, conversion: 0.999}
      heat: isothermal
      vent:
        stream: S6
        components: [HCL]
        # the HCl leaves saturated with the liquid's vapour (Raoult, ideal liquid, the NIST
        # Antoine constants of materials.yaml; core 1.10.0, ADR 0062, D-010)
        vapour: {components: [BZCL, BTC, BA], source: "the HCl leaves saturated with the liquid's vapour at 413 K and 101.3 kPa(a): Raoult's law, ideal liquid ASSUMED, NIST WebBook Antoine constants (materials.yaml; D-010)"}
        condenser:
          temperature: 308.15
          returns: vessel
          energy_port: q_vent
          provenance: assumed
          source: "E-102, the reflux condenser on cooling water in R-101's off-gas line, its gas outlet 10 K above the cooling water's 298.15 K supply (the design basis' minimum approach, D-009), the condensate back to R-101 (D-010)"
      provenance: assumed
      source: "benzotrichloride dosed over 2 h into the melt at 413 K, the dosing time of US 4 276 231 A, Example 1; post-reaction to 0.999 conversion of the benzotrichloride; the HCl leaves as gas as it forms, none taken as dissolved (no solubility data for a Henry split, D-005, L-3)"
    hazard:
      mtt: 471.0
      vent_capacity: 130.0
      provenance: assumed
      source: "mtt: the normal boiling point of benzoyl chloride (NIST WebBook, mean of 8 values, 471 +/- 2 K), the liquid's main component once dosed: R101 runs at atmospheric pressure with its vent open to the absorber; the default, benzotrichloride's 493.8 K, lies above it, since core takes the MTT from the charge and doses, not the product (D-011, L-5). vent_capacity: ASSUMED design of R-101's off-gas system, the vapour line, its reflux condenser E-102 and A-101 (D-014): 1.2 x the gas release at the MTSR with the liquid's vapour (107.2 m3/h at 421.9 K and 101.3 kPa(a), 0.239 of it vapour, no condenser credited: cheme process reactor-hazards), rounded up to 130 m3/h; holds for the assumed kinetics only: at k/10 the release at the MTSR is 273.2 m3/h, 2.10 x (D-011, D-014, open)"
    links: [{target: equipment, ref: R-101}, {target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: btc, direction: in, delegates: btc}
      - {id: out, direction: out, delegates: out}
      - {id: vent, direction: out, delegates: vent}
      - {id: q, direction: out, kind: energy, delegates: q}
      - {id: q_vent, direction: out, kind: energy, delegates: q_vent}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: A101
    block: ABSORB
    title: HCl absorber (falling film with tail scrubber, to 30 wt% acid)
    class: Mixing
    links: [{target: equipment, ref: A-101}]
    ports:
      - {id: gas, direction: in, delegates: gas}
      - {id: water, direction: in, delegates: water}
      - {id: acid, direction: out, delegates: acid}
      - {id: q, direction: out, kind: energy, delegates: q}
  - id: ST101
    block: PURIFY
    title: Batch still at 5 kPa(a) with its column (Diwekar's shortcut)
    class: Distilling
    # the reboiler's duty, (R + 1) D lambda, goes on Q4 (energy_port), the condenser's, the same
    # latent heat out, on Q5 (condenser_port; core 1.10.0, ADR 0061, D-009)
    energy_port: steam
    still:
      pressure: 5.0
      volatility: {model: raoult, provenance: assumed, source: "ideal liquid, NIST WebBook Antoine constants (materials.yaml); benzoic acid dimerises in the vapour and its mixture with benzoyl chloride is not shown to be ideal: ASSUMED (D-007)"}
      nonvolatile: [ZNCL2]
      boilup: {value: 200, unit: kW, provenance: assumed, source: "the reboiler's heat input, LP steam on the still's jacket (D-007, D-009)"}
      column:
        stages: 15
        reflux: constant
        ratio: 2
        provenance: assumed
        source: "K-101, a packed column of 15 theoretical stages, the still included, at a constant reflux ratio of 2: the least boil-up of the cases scanned that keeps the product to the design basis' 99.99 wt% with about its benzotrichloride (11 ppm against 12 ppm), D-008"
      condenser_port: condenser
      end: {residue: {key: BZCL, mole_fraction: 0.40}}
      outlets: {distillate: top, residue: bottom}
      provenance: assumed
      source: "distil until benzoyl chloride is 40 mol% of the residue, so the bottoms stay a mobile liquid (US 4 276 231 A: bottoms of 20-70 % benzoyl chloride; D-007)"
    links: [{target: equipment, ref: C-101}, {target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: top, direction: out}
      - {id: bottom, direction: out, delegates: residue}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: condenser, direction: out, kind: energy, delegates: condenser}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E101
    block: PURIFY
    title: Product cooler (the distillate subcooled to storage)
    class: Cooling
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: product}
      - {id: q, direction: out, kind: energy, delegates: cooler}

streams:
  - id: S1
    title: Benzoic acid
    from: BA.out
    to: M101.ba
    template: organics
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "design basis"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 120.9846, provenance: assumed, source: "scripts/balance.py: 15/14 mol per mol of benzotrichloride (US 4 276 231 A, Example 1: 15.0 mol on 14.0 mol; D-004)"}
        composition: {basis: mass_fraction, values: {BA: 1.0}, provenance: assumed, source: "technical benzoic acid, impurities not modelled (D-004)"}
  - id: S2
    title: Zinc chloride
    from: ZNCL2.out
    to: M101.zncl2
    template: organics
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "design basis"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 0.89814, provenance: assumed, source: "scripts/balance.py: 0.742 kg per 100 kg of benzoic acid (US 4 276 231 A, Example 1: 13.6 g on 1832 g; D-004)"}
        composition: {basis: mass_fraction, values: {ZNCL2: 1.0}, provenance: assumed, source: "anhydrous zinc chloride (D-004)"}
  - id: S3
    title: Molten charge (benzoic acid and catalyst, 413 K)
    from: M101.out
    to: R101.in
    template: organics
    state:
      design:
        temperature: {value: 413.15, provenance: assumed, source: "melted and heated to the reaction temperature in M101 (D-005)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 121.883, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S2', fingerprint: 89d455ef9e1a79d4}
        composition: {basis: mole_fraction, values: {BTC: 0.0, BA: 0.993392, BZCL: 0.0, ZNCL2: 0.00660845, HCL: 0.0}, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S2', fingerprint: b97fd4731b2d1fed}
  - id: S4
    title: Benzotrichloride (dosed)
    from: BTC.out
    to: R101.btc
    template: organics
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "from storage through the off-gas wash (D-004, D-010)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 180.7353, provenance: assumed, source: "scripts/balance.py: the benzotrichloride that makes 2000 t/a of S11 (the balance is linear in the feeds; D-002)"}
        composition: {basis: mass_fraction, values: {BTC: 1.0}, provenance: assumed, source: "benzotrichloride, its benzal chloride and ring-chlorinated impurities not modelled (D-004)"}
  - id: S5
    title: Crude benzoyl chloride
    from: R101.out
