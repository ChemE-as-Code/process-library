title: Benzoyl chloride by semi-batch reaction of benzotrichloride with benzoic acid and batch vacuum
  distillation (2000 t/a)
description: Unallocated foreground LCI of Benzoyl chloride by semi-batch reaction of benzotrichloride
  with benzoic acid and batch vacuum distillation (2000 t/a), case design, derived from the flowsheet
