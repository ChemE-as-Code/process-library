    deposits) goes to the vent scrubber; not estimated (open for basic engineering, D-009).'
- key: emission-excluded:absorber-tail-gas
  title: storage-tank emissions of R-101, A-101
  direction: output
  reason: 'No P&ID yet: R-101 vents only through its reflux condenser E-102 and the absorber; its tail
    gas (nitrogen of the purges with HCl, benzotrichloride and benzoyl chloride traces) goes through a
    water tail scrubber to air. The balance absorbs all HCl and all the organics past E-102 in the acid
    (0.18 kg/h, D-010); the tail gas is not estimated (open for basic engineering).'
- key: emission-excluded:vacuum-vent
  title: storage-tank emissions of C-101, K-101, E-101
  direction: output
  reason: The vacuum pump's exhaust (nitrogen, air in-leakage, the HCl the crude still holds dissolved
    and benzoyl chloride traces) to the vent scrubber is not estimated (D-007, D-010).
