year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Batch plant: benzotrichloride dosed over 2 h into molten benzoic acid with zinc chloride
  at 413 K (semi-batch, 7 % acid excess), the HCl vented as it forms and absorbed to 30 wt% acid, the
  off-gas through a reflux condenser, the crude distilled at 5 kPa(a) in a batch still with a packed column
  (15 theoretical stages, reflux ratio 2); 1229 kg per batch, 1627 batches a year on a dedicated train'
