allocation:
  method: shares
  coproducts:
  - BZCL
  - HCLAQ
  shares:
    BZCL: 1.0
    HCLAQ: 0.0
  source: 'D-012 (agent proposal, for the LCA practitioner to confirm): the 30 wt% hydrochloric acid (0.444
    kg per kg of benzoyl chloride, 0.133 kg of HCl) is a by-product of fixed stoichiometry (one HCl per
    two benzoyl chloride). All burdens are given to the benzoyl chloride, the acid leaves without a burden
    and without a credit (conservative for the main product).'
  deviation: The library hierarchy (docs/system-model.md) has no physical relationship here (the acid
    carries no energy content; no exergy, since no property package covers HCl-water), so the WBCSD rule
    applies. Merchant hydrochloric acid is priced well over five times below a fine acid chloride per
    kg, so the rule gives economic allocation, which would leave the acid a share of a few per cent. No
    prices are set at the concept stage (none sourced), so shares 1/0 stand for it until prices are; the
    acid's share is then small, not zero.
