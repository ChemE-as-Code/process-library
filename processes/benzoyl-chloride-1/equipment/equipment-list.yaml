# Equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes per batch from the recipe (D-003) and the models of R101 and ST101; design pressures,
# temperatures and materials are not set yet (basic engineering); the materials named are usual
# choices for hot benzoyl chloride and wet HCl, to be confirmed (open input). All values ASSUMED.
schema: cheme/equipment/v1
equipment:
  - {tag: M-101, type: StirredTankReactor, service: "Melter: benzoic acid flakes and zinc chloride melted and heated to 413 K",
     notes: "Holds one batch's charge, about 593 kg (121.82 kg/h x 4.869 h), 0.58 m3 molten; jacket on MP steam 1100 kPa(a), 30 kW over the 2 h melt (Q1 x the 4.869 h cycle: 59 kWh a batch); agitator 1 kW; glass-lined or Hastelloy (molten acid with ZnCl2) (D-003, D-009)."}
  - {tag: R-101, type: StirredTankReactor, service: "Reactor: benzotrichloride dosed into the melt at 413 K, HCl vented as it forms",
     notes: "1.19 m3 of crude per batch at the end of the dosing; 1.6 m3 (R10 preferred size, 75 % full, D 1.19 m) as the recipe sizes it from R101's semi-batch model (core ADR 0052), glass-lined; jacket on a pressurised tempered-water loop at 363 K (U 300 W/(m2 K)), the check passes: 45.6 kW removable against the model's 22.8 kW peak; agitator 3 kW; a reflux condenser on cooling water in the off-gas line returns the benzoyl chloride and benzotrichloride vapour the HCl carries at 413 K (not modelled, D-010, L-2); off-gas line to A-101 sized for 100 m3/h of HCl (hazard.vent_capacity, D-014): 1.2 x the 81.6 m3/h released at the MTSR on a cooling failure (cheme process reactor-hazards), the normal peak 75.25 m3/h at 413 K (cheme process recipe); open (D-014): that holds for the assumed kinetics only, at k/10 the release at the MTSR is 164.3 m3/h (1.64 x), at k/100 443.2 m3/h (4.43 x, D-011), so the off-gas system is to be sized for about 200 m3/h or the dosing rate set from calorimetry; the vapour line to the reflux condenser for about 130 m3/h with the liquid's vapour (for example DN80); open (D-014): a relief device for the blocked-vent case and the dosing interlocked on R-101's pressure; benzotrichloride dosing interlocked with the temperature, the agitator and the off-gas flow, and to assess on A-101's water flow and HCl breakthrough at the tail scrubber (D-005, D-011); open (D-011): water ingress from the tempered-water jacket or by suck-back from A-101 releases HCl at once (about 3.8 m3 at 413 K per kg of water reacting with benzotrichloride), so anti-suck-back protection on the off-gas line (nitrogen-padded seal pot, barometric leg or vacuum breaker) and a non-water heat-transfer fluid or jacket-leak detection are to be assessed."}
  - {tag: A-101, type: Column, service: "HCl absorber: falling-film absorber with a water tail scrubber, 30 wt% hydrochloric acid",
     notes: "Takes the off-gas while R-101 doses: 164 kg of HCl a batch, at most 0.62 mol/s (75 m3/h at 413 K, 101 kPa(a)) in normal operation; sized with the off-gas line for 100 m3/h of HCl (0.80 mol/s, about 54 kW of heat), the gas released at a cooling failure at the MTSR being 81.6 m3/h with the assumed kinetics (D-014); open (D-014): at k/10 that release is 164.3 m3/h (1.254 mol/s, about 84 kW), 1.64 x the capacity, so A-101 is to be sized for about 200 m3/h or the dosing rate set from calorimetry; 15.8 kW year average to cooling water (77 kWh a batch), 23 kW on average over the 3.37 h of dosing and post-reaction and about 41 kW at the off-gas peak (0.62 mol/s x 66.9 kJ/mol, D-010); graphite (impregnated) for wet HCl; an upstream wash with the benzotrichloride feed (US 4 276 231 A) is not modelled (D-010); open (D-011): a loss of the absorber water while R-101 doses sends up to 0.62 mol/s of HCl to the tail scrubber or to air, and stopping the dosing does not stop it (about 0.32 kmol of HCl from the accumulated benzotrichloride), so the dosing is to be interlocked on A-101's water flow and the HCl breakthrough; the absorber's vacuum on cooling is a suck-back path to R-101 (anti-suck-back protection on the off-gas line)."}
  - {tag: C-101, type: StirredTankReactor, service: "Batch still at 5 kPa(a): the crude boiled off its residue (benzoic acid, catalyst)",
     notes: "Receives one batch of crude, 1309 kg, about 1.15 m3 at 413 K; 1.6 m3 with a jacket on LP steam 450 kPa(a) (200 kW reboiling, 100 kW net as distillate at the reflux ratio 1; year averages Q4 25.1 kW from the still's model and Q6 25.1 kW for the reflux, D-009); boil-up 1.22 h (cheme process stills); agitator 1 kW; dry vacuum pump 5 kW; glass-lined (D-007, D-009)."}
  - {tag: K-101, type: Column, service: "Short packed column on C-101 with condenser, reflux divider and product cooler",
     notes: "Rectification of the still's vapour (a specified split: core has no batch rectification with reflux, core#173): about 5 theoretical stages and a reflux ratio of 1 ASSUMED, keeping benzoic acid and benzotrichloride in the pot; condenser at 5 kPa(a) on cooling water, 200 kW while distilling; glass or glass-lined with PTFE (D-008)."}
