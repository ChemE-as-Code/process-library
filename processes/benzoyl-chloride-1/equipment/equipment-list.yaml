# Equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes per batch from the recipe (D-003) and the models of R101 (with its vent condenser) and ST101
# (with its column); design pressures,
# temperatures and materials are not set yet (basic engineering); the materials named are usual
# choices for hot benzoyl chloride and wet HCl, to be confirmed (open input). All values ASSUMED.
schema: cheme/equipment/v1
equipment:
  - {tag: M-101, type: StirredTankReactor, service: "Melter: benzoic acid flakes and zinc chloride melted and heated to 413 K",
     notes: "Holds one batch's charge, about 593 kg (121.88 kg/h x 4.868 h), 0.58 m3 molten; jacket on MP steam 1100 kPa(a), 30 kW over the 2 h melt (Q1 x the 4.868 h cycle: 59 kWh a batch); agitator 1 kW; glass-lined or Hastelloy (molten acid with ZnCl2) (D-003, D-009)."}
  - {tag: R-101, type: StirredTankReactor, service: "Reactor: benzotrichloride dosed into the melt at 413 K, HCl vented as it forms",
     notes: "1.19 m3 of crude per batch at the end of the dosing; 1.6 m3 (R10 preferred size, 75 % full, D 1.19 m) as the recipe sizes it from R101's semi-batch model (core ADR 0052), glass-lined; jacket on a pressurised tempered-water loop at 363 K (U 300 W/(m2 K)), the check passes: 45.6 kW removable against the model's 22.8 kW peak; agitator 3 kW; the reflux condenser E-102 in the off-gas line returns the benzoyl chloride, benzotrichloride and benzoic acid vapour the HCl carries at 413 K (core 1.10.0 vent model, D-010); off-gas system (the vapour line, E-102 and A-101) sized for 130 m3/h with the liquid's vapour (hazard.vent_capacity, D-014): 1.2 x the 107.2 m3/h released at the MTSR on a cooling failure, 0.239 of it vapour, no condenser credited (cheme process reactor-hazards), for example DN80 at about 7.6 m/s; the normal peak 0.62 mol/s, 75.25 m3/h of HCl at 413 K, 56.2 m3/h past E-102 at 308 K (cheme process recipe); open (D-014): that holds for the assumed kinetics only, at k/10 the release at the MTSR is 273.2 m3/h (2.10 x), at k/100 2951 m3/h (22.7 x, D-011), so the off-gas system is to be sized for about 330 m3/h or the dosing rate set from calorimetry; open (D-014): a relief device for the blocked-vent case and the dosing interlocked on R-101's pressure; benzotrichloride dosing interlocked with the temperature, the agitator and the off-gas flow, and to assess on A-101's water flow and HCl breakthrough at the tail scrubber (D-005, D-011); open (D-011): water ingress from the tempered-water jacket or by suck-back from A-101 releases HCl at once (about 3.8 m3 at 413 K per kg of water reacting with benzotrichloride), so anti-suck-back protection on the off-gas line (nitrogen-padded seal pot, barometric leg or vacuum breaker) and a non-water heat-transfer fluid or jacket-leak detection are to be assessed."}
  - {tag: A-101, type: Column, service: "HCl absorber: falling-film absorber with a water tail scrubber, 30 wt% hydrochloric acid",
     notes: "Takes the off-gas while R-101 doses: 164 kg of HCl a batch, at most 0.62 mol/s (75 m3/h at 413 K, 101 kPa(a)) in normal operation, the gas past E-102 at 308 K with about 0.54 wt% (0.14 mol%) of organics (0.18 kg/h of benzoyl chloride, year average); sized with the off-gas system for 130 m3/h with the liquid's vapour (its non-condensables about 99 m3/h of HCl at 421.9 K, 0.79 mol/s, about 53 kW of heat), the gas released at a cooling failure at the MTSR being 107.2 m3/h with the assumed kinetics, E-102 not credited (D-014); open (D-014): at k/10 that release is 273.2 m3/h (1.255 mol/s of HCl, about 84 kW, and 0.398 of the gas vapour), 2.10 x the capacity, so A-101 is to be sized for about 330 m3/h or the dosing rate set from calorimetry; 15.0 kW year average to cooling water (73 kWh a batch), about 39 kW at the off-gas peak (0.62 mol/s x 63.9 kJ/mol with the gas at 308 K, D-010); graphite (impregnated) for wet HCl; an upstream wash with the benzotrichloride feed (US 4 276 231 A) is not modelled (D-010); open (D-011): a loss of the absorber water while R-101 doses sends up to 0.62 mol/s of HCl to the tail scrubber or to air, and stopping the dosing does not stop it (about 0.32 kmol of HCl from the accumulated benzotrichloride), so the dosing is to be interlocked on A-101's water flow and the HCl breakthrough; the absorber's vacuum on cooling is a suck-back path to R-101 (anti-suck-back protection on the off-gas line)."}
  - {tag: C-101, type: StirredTankReactor, service: "Batch still at 5 kPa(a): the crude boiled off its residue (benzoic acid, catalyst)",
     notes: "Receives one batch of crude, 1309 kg, about 1.15 m3 at 413 K; 1.6 m3 with a jacket on LP steam 450 kPa(a) (the reboiler, 200 kW, at the column K-101's reflux ratio 2: 67 kW net as distillate; year average Q4 74.3 kW from the still's model, D-009); boil-up 1.81 h (cheme process stills, 361 kWh a batch); agitator 1 kW; dry vacuum pump 5 kW; glass-lined (D-007, D-009)."}
  - {tag: K-101, type: Column, service: "Packed column on C-101 with condenser and reflux divider",
     notes: "Rectification of the still's vapour on core's batch shortcut (core 1.10.0, ADR 0061, flowsheet ST101): 15 theoretical stages with the still and a constant reflux ratio of 2, ASSUMED (D-008): 14 above the pot, for example about 5 m of structured packing at an HETP of about 0.35 m under vacuum (ASSUMED; not sized, the shortcut has no pressure drop or holdup; 20 stages at reflux 1.5 would save 17 % of the boil-up for about 1.75 m more packing, rejected on that trade, D-008); keeps the benzotrichloride (1.5 % of it over, 11 ppm in the product) and the benzoic acid in the pot; total condenser at 5 kPa(a) on cooling water, 200 kW while distilling (Q5 74.3 kW year average, from the still's model); glass or glass-lined with PTFE."}
  - {tag: E-101, type: HeatExchanger, service: "Product cooler: the distillate subcooled from 375.5 to 308 K to storage",
     notes: "6.29 kW year average to cooling water (scripts/balance.py, Q7), about 17 kW while distilling (the 1.81 h of 4.87 h); the product leaves at 308 K, 10 K above the cooling water's 298 K supply, the design basis' minimum approach (D-009); glass or graphite shell and tube (D-009)."}
  - {tag: E-102, type: HeatExchanger, service: "Reflux condenser on R-101's off-gas line, cooling water, condensate back to R-101",
     notes: "Cools the HCl from 413 to 308 K and condenses the organic vapour it carries (core 1.10.0 vent condenser, D-010): 0.130 kmol/h of vapour, 0.12 kmol/h of benzoyl chloride, back to R-101; 3.33 kW year average (Q8, from R101's model), 16 kWh a batch; benzoic acid condenses with the benzoyl chloride and stays dissolved in it, but deposits where the condensate runs thin (trace the line); sized for the off-gas system's 130 m3/h; graphite (D-014)."}
