    - {chemical: hydrogen-chloride, role: co-product, inventory_key: "product:HCLAQ", note: "Hydrochloric acid 30 wt%, 0.444 kg/kg (0.133 kg HCl), allocated no burden (shares 1/0, DESIGN.md D-012)"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "0.028 kWh/kg: agitators of M-101, R-101 and the still, vacuum pump (ASSUMED)"}
    - {chemical: steam, role: utility, inventory_key: "feed:MPS", note: "0.048 kWh/kg of MP steam 1100 kPa(a) to the benzoic acid melter"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "0.199 kWh/kg of LP steam 450 kPa(a) to the still at a reflux ratio of 1"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "0.310 kWh/kg: R-101's tempered-water loop, the HCl absorber, the column's condenser and product cooler"}
