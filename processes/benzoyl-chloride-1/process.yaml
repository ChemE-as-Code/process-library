# Process Atlas manifest of benzoyl-chloride-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: benzoyl-chloride-1
title: Benzoyl chloride by semi-batch reaction of benzotrichloride with benzoic acid and batch vacuum distillation (2000 t/a)
summary: >-
  A batch plant: benzotrichloride is dosed over 2 h into molten benzoic acid with zinc chloride
  at 140 C; the HCl it forms leaves as gas and is absorbed to 30 wt% hydrochloric acid, and the
  crude is distilled at 50 mbar. Concept stage, 1229 kg per batch every 4.9 h on a dedicated
  train, thermal screening with a rate-constant sensitivity, preliminary gate-to-gate LCI.
description: |
  Benzoic acid flakes are melted with 0.74 wt% of anhydrous zinc chloride and heated to 413 K;
  benzotrichloride (14 mol per 15 mol of acid) is dosed into the melt over 2 h and held until
  0.999 of it has reacted, C7H5Cl3 + C7H6O2 -> 2 C7H5ClO + HCl, the batch route of US 4 276 231 A
  (Bayer, Example 1). The HCl leaves the liquid as it forms and is absorbed in water to 30 wt%
  hydrochloric acid, 0.444 kg per kg of product. The crude is distilled at 5 kPa(a) in a batch
  still with a short column: benzoyl chloride (99.99 wt%) goes to storage, the residue (benzoic
  acid, benzoyl chloride, zinc chloride, 64 g per kg) to hazardous-waste incineration. Yield
  97.2 % of theory on the benzotrichloride (the patent's example: 96.7 %).

  The batch is modelled with cheme-as-code's semi-batch reactor with a gas vent (reactor:
  semibatch, batch.vent, core ADRs 0050 and 0054), its batch still (still:, one Rayleigh stage,
  ADR 0055) and the batch recipe (process/recipe.yaml, ADRs 0051 and 0052): the dosing,
  post-reaction and distillation times come from the models, the reactor is the bottleneck
  (cycle 4.87 h, 1627 batches a year), the recipe sizes the reactor (1.6 m3) and checks its
  jacket, and the flowsheet's flows are the recipe's year averages. The column's rectification
  on the still is a specified split until core has a batch column with reflux (core#173). The
  kinetics and the heat of reaction are ASSUMED (no open data): the benzotrichloride accumulates
  to 7.0 % at the end of the dosing and the cooling-failure temperature stays 49 K below the
  boiling point of benzoyl chloride; a 100 times slower reaction would exceed it. See DESIGN.md
  for every assumption.
families: [chlorinated-organics]
keywords: [benzoyl chloride, benzotrichloride, benzoic acid, zinc chloride, acid chloride, semi-batch, batch, dosing, gas evolution, HCl off-gas, hydrochloric acid, batch distillation, vacuum distillation, thermal screening, fine chemicals]
facets:
  feedstock_basis: [fossil, mineral, electricity]
  product_classes: [chemicals]
  unit_operations: [reaction, absorption, distillation]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, kinetics, heat of
# reaction, the still's ideal liquid and the column's split are assumed; ratios and conditions
# from the patent's example (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept batch PFD with closed mass, component and element balances (cheme validate, cheme
    process streams: 4 blocks and 6 steps within tolerance). The semi-batch R101 with its HCl vent
    (from its ASSUMED rate law), the batch still ST101 (one Rayleigh stage on Raoult's law with
    NIST Antoine constants, the ideal liquid ASSUMED) and the mixers are calculated by cheme
    process propagate; scripts/balance.py gives the feeds for 2000 t/a, the column K101 as a
    specified split of the still's distillate, the absorber water and every duty (no property
    package of core covers these liquids, and core has no batch rectification with reflux,
    core#173). The recipe's year-average rate of the product agrees with the flowsheet (no
    cheme.recipe-basis finding); the recipe sizes R-101 (1.6 m3), its jacket check passes, and
    the still's distillation time comes from its boil-up. Thermal screening (cheme process
    reactor-hazards): dT_ad 94.7 K, accumulation 7.04 %, MTSR 421.9 K against an MTT of 471.0 K
    (hazard.mtt: the boiling point of benzoyl chloride); no criticality class without a TD24
    (1 or 2 if the TD24 lies above the MTSR, 5 if below).
    With k/10 the MTSR is 443.3 K, with k/100 484.8 K, above the MTT (DESIGN.md D-011). The
    off-gas carries no organic vapour in the model (a core limit, D-010). Preliminary
    gate-to-gate LCI with the per-batch nitrogen; the nitrogen linked to asu-1, the other
    backgrounds gaps; the hydrochloric acid a by-product with shares 1/0. cheme maturity reaches
    no level (assumed feeds, kinetics and separations); the claim `maturity: concept` is the
    lowest value of the schema, not an evidenced level. Not reviewed. Needs cheme-as-code 1.8.0.
chemistry:
  inputs:
    - {chemical: benzotrichloride, role: feedstock, inventory_key: "feed:BTC", note: "Benzotrichloride (no library process; proxy: toluene side-chain photochlorination), 0.715 kg/kg benzoyl chloride"}
    - {chemical: benzoic-acid, role: feedstock, inventory_key: "feed:BA", note: "Benzoic acid flakes (no library process; proxy: toluene air oxidation), 0.479 kg/kg, 7 % above the stoichiometric need"}
    - {chemical: zinc-chloride, role: feedstock, inventory_key: "feed:ZNCL2", note: "Anhydrous zinc chloride catalyst, 3.6 g/kg, leaves with the still residue"}
    - {chemical: water, role: feedstock, inventory_key: "feed:PW", note: "Process water to the HCl absorber, 0.311 kg/kg"}
    - {chemical: nitrogen, role: feedstock, inventory_key: "consumable:nitrogen", note: "Nitrogen (asu-1) for inerting and breaking the still's vacuum, 10 kg per batch, 8.1 g/kg (ASSUMED)"}
  outputs:
