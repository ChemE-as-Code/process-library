schema: cheme-as-code/process/v1
id: vinyl-acetate-1
title: Vinyl acetate monomer by gas-phase acetoxylation of ethylene over Pd/Au, recycle gas and distillation (200 kt/a)
summary: >-
  A continuous plant: ethylene, acetic acid and oxygen react over Pd/Au in a boiling-water-cooled
  multitubular reactor; the cycle gas is scrubbed with acetic acid, purged, partly freed of CO2
  and recycled; azeotropic and dewatering columns give the product. Concept stage, 200 kt/a, the
  loop solved by core's design specifications, preliminary LCI.
description: |
  Ethylene, acetic acid and oxygen react in the gas phase over palladium and gold with
  potassium acetate on a support: C2H4 + CH3COOH + 0.5 O2 -> CH2=CHOOCCH3 + H2O, while part of
  the ethylene burns to CO2 and water. The reactor R-101 is a multitubular fixed bed cooled by
  boiling water. Its feed is the one of Wacker's pilot tubes in US 8 765 995 B2 (Table 2):
  65 mol% ethylene, 12.3 mol% acetic acid and 8.6 mol% oxygen at 1000 kPa(a) and 423 K. The
  same table's space-time yield, space velocity and 91.0 % ethylene selectivity give the
  conversions per pass: 9.61 % of the ethylene to vinyl acetate and 0.95 % burnt. The work-up
  follows Wacker's US 8 410 307 B2. A preliminary dewatering column at loop pressure condenses
  and decants the crude. The uncondensed cycle gas is scrubbed with recycle acetic acid and
  0.3 % of it is purged to a thermal oxidiser. A slip stream passes a hot potassium carbonate
  absorber, which removes almost half of its CO2 (US 6 420 595 B1), and the gas is recompressed.
  An azeotropic column with a decanter takes vinyl acetate and water overhead and leaves the
  recycle acid at the bottom; 70 % of that acid goes to the saturator, 30 % to the scrubber. A
  dewatering column draws the product from its stripping section: 99.99 wt% vinyl acetate.

  The material balance is solved by cheme-as-code (core ADRs 0060, 0070). Design specifications
  set the ethylene, oxygen and acetic acid feeds, and the CO2 slip split, for the product rate and
  the reactor feed of the source. The cycle gas, the recycle acid and the dewatering column's
  bottoms are tear streams, and the separators are component splits (`recovery:`, ASSUMED).
  R-101's heat, 23.7 MW from the ideal-gas data (core ADR 0059), raises LP steam at 450 kPa(a)
  for the saturator, the CO2 regenerator and both columns; only 3.03 MW more steam is imported.
  Per kg of vinyl acetate: 0.370 kg ethylene, 0.701 kg acetic acid, 0.299 kg oxygen, 0.099 kg
  CO2 vented. See DESIGN.md for every assumption.
families: [oxygenates]
keywords: [vinyl acetate, VAM, vinyl acetate monomer, acetoxylation, ethylene, acetic acid, oxygen, palladium, gold, potassium acetate, fixed bed, multitubular reactor, boiling water, cycle gas, recycle gas, CO2 removal, hot potassium carbonate, purge, acetic acid scrubber, azeotropic distillation, dewatering column, design specification, recycle]
facets:
  feedstock_basis: [fossil, atmospheric, electricity]
  product_classes: [chemicals]
  unit_operations: [reaction, absorption, compression, distillation, separation]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, the separators' splits,
# the purge, the temperatures and the duties' basis are assumed; feed, conversion and selectivity
# from the patents' examples (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept continuous PFD with closed mass, component and element balances (cheme validate,
    cheme process streams: 3 blocks and 20 steps within tolerance). cheme process propagate
    solves the feeds with four design specifications (200 kt/a of vinyl acetate; 65 mol%
    ethylene, 12.3 mol% acetic acid and 8.6 mol% oxygen in the reactor feed, from US 8 765 995
    B2 Table 2; the ethylene held by the CO2 slip split, 0.340) together with three tear streams
    (the cycle gas S2, the recycle acid S28, the dewatering column's bottoms S31), the
    conversion reactor R101 (9.61 % and 0.95 % of the inlet ethylene, from the same table's
    space-time yield, GHSV and selectivity; the GHSV's normal conditions ASSUMED) and five
    component separators with ASSUMED splits inside the compositions US 8 410 307 B2 and
    US 6 420 595 B1 state. Propagate writes R101's duty on the elements basis from the
    ideal-gas data (chemicals 1.5.2 and a fit to thermo 0.6.1, which reproduce the source's
    heats of reaction, -176.6 and -1323 kJ/mol). scripts/balance.py gives every other duty and
    power on an ideal-gas and constant-liquid-heat-capacity basis (no property package of core
    covers these liquids), the mixed reactor feed's and the compressor's temperatures; the
    column duties rest on ASSUMED boil-ups. Preliminary gate-to-gate LCI with the ethylene,
    acetic acid and oxygen linked to ethylene-1, acetic-acid-1 and asu-1 and the steam counted
    as heat; electricity, cooling water, the purge's oxidation and the effluent's treatment are
    gaps. No thermal screening by core applies to a cooled fixed bed without kinetics; the
    oxygen and flammability reasoning is in DESIGN.md D-009. cheme maturity reaches no level
    (assumed splits); the claim `maturity: concept` is the lowest value of the schema, not an
    evidenced level. Not reviewed. Needs cheme-as-code 1.12.0.
