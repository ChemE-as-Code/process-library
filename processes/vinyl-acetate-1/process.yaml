    - {chemical: acetic-acid, role: feedstock, inventory_key: "feed:ACF", note: "Glacial acetic acid (acetic-acid-1), 0.701 kg/kg, 99.5 % of it to the product"}
    - {chemical: oxygen, role: feedstock, inventory_key: "feed:OXY", note: "GOX 99.7 mol% (asu-1), 0.299 kg/kg"}
  outputs:
    - {chemical: vinyl-acetate, role: main-product, inventory_key: "product:VAMP", note: "Vinyl acetate monomer, modelled 99.99 wt% with 95 ppm(wt) water, to inhibited storage"}
    - {chemical: carbon-dioxide, role: emission, inventory_key: "product:CO2V", note: "CO2 of the carbonate regenerator to atmosphere, 0.099 kg/kg, with 1.0 g/kg of co-absorbed ethylene"}
    - {chemical: ethylene, role: waste, inventory_key: "product:PURGE", note: "Cycle-gas purge to the thermal oxidiser, 13.0 g/kg (70 wt% ethylene)"}
