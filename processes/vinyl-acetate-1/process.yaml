    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "0.045 kWh/kg: cycle-gas compressor, carbonate and distillation pumps"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "1.34 kWh/kg removed by cooling water: C-101's condenser, the columns' condensers, the coolers"}
