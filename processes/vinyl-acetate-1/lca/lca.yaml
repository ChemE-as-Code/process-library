# Goal and scope of the vinyl-acetate-1 LCI. Schema: `cheme schema lca`. Outputs: `cheme
# assess lca --write` (lca/inventory.csv, gaps.csv, dataset.yaml, manifest.json, results); never
# edit those by hand.
#
# Preliminary gate-to-gate foreground inventory (DESIGN.md D-010): every exchange of the plant
# with its amount per kg of vinyl acetate from the design case of process/flowsheet.yaml. This
# study links no background, so every feed, utility and waste carries `missing:` with the
# activity it should connect to, never zero, and no values from licensed databases. In the Atlas
# LCI (scripts/build_lci.py) lca/mappings.yaml links the three raw materials to their library
# producers (ethylene-1, acetic-acid-1, asu-1), the LP steam as heat and the wash water to
# deionised water, and the shared lci/mappings.yaml links electricity, cooling water and the
# effluent's treatment through its proxies; there the purge and the vent's zero acetic acid and
# vinyl acetate stay gaps.
schema: cheme/lca/v1
kind: lca
goal: >-
  Preliminary gate-to-gate life cycle inventory of vinyl acetate monomer made by gas-phase
  acetoxylation of ethylene with acetic acid and oxygen over a Pd/Au catalyst, with acetic acid
  scrubbing of the cycle gas, CO2 removal on hot potassium carbonate, an inerts purge and
  distillation, at the concept stage: which raw materials, utilities, wastes and emissions the
  plant exchanges per kg of vinyl acetate, as the foreground for a cradle-to-gate study with the
  library's ethylene, acetic acid and oxygen.
functional_unit: {product: VAMP, amount: 1, unit: kg, source: "1 kg of vinyl acetate monomer (modelled 99.99 wt%, 90 ppm(wt) water) at the plant gate to storage, stream S33 (D-002, D-007)"}
# The boundary key stays cradle-to-gate so that the purchased inputs remain gaps or links
# instead of being mapped free (the schema's gate-to-gate maps every feed free).
boundary: cradle-to-gate
case: design
year: 2026
location: GLO
technology: "Gas-phase acetoxylation of ethylene at 1000 kPa(a) and 423-438 K in a multitubular fixed bed (Pd/Au with potassium acetate) cooled by boiling water raising LP steam at 450 kPa(a); reactor feed 65 mol% ethylene, 12.3 mol% acetic acid, 8.6 mol% oxygen (US 8 765 995 B2 Table 2); effluent condensed in a preliminary dewatering column at loop pressure, cycle gas scrubbed with recycle acetic acid, 0.3 % purged to a thermal oxidiser, a third of it washed with water and passed through a hot potassium carbonate CO2 removal, recompressed; crude separated in an azeotropic column with decanter (recycle acid at the bottom) and a dewatering column with the pure VAM side draw (US 8 410 307 B2); 200 kt/a in 8000 h"
rights: "CC-BY-4.0: the ChemE-as-Code process library's own concept design (LICENSE-DATA)"
system_model: cutoff
flows:
  # --- raw materials
  - key: feed:ETH
    missing: "linked to processes/ethylene-1 (lca/mappings.yaml): polymer-grade ethylene from steam cracking"
    source: "flowsheet stream S1, 0.370 kg/kg (D-003, D-004)"
  - key: feed:OXY
    missing: "linked to processes/asu-1 (lca/mappings.yaml): GOX from cryogenic air separation"
    source: "flowsheet stream S7, 0.299 kg/kg (D-003, D-004)"
  - key: feed:ACF
    missing: "linked to processes/acetic-acid-1 (lca/mappings.yaml): glacial acetic acid by methanol carbonylation"
    source: "flowsheet stream S4, 0.703 kg/kg (D-003, D-004)"
  - key: feed:DMW
    missing: "linked in the Atlas LCI to deionised water (lca/mappings.yaml); connect to: demineralised water from the site's water treatment, per kg"
    source: "flowsheet stream S35, the wash water of the slip-gas scrubber C-104, 0.0216 kg/kg (540 kg/h ASSUMED, D-006)"
  # --- utilities
  - key: feed:POWER
    missing: "linked in the Atlas LCI by the shared mapping (market for electricity, medium voltage), D-010; connect to: electricity, medium voltage, grid mix of the (undecided) site country"
    source: "flowsheet energy streams P1 (K-101), P2 (A-101's solution pumps) and P3 (the distillation pumps), 0.045 kWh/kg (D-008)"
  - key: feed:LPS
    missing: "linked as heat from steam (lca/mappings.yaml); connect to: steam in the chemical industry, 450 kPa(a), from a natural-gas-fired site boiler (e.g. processes/utility-steam-ng-boiler), per kWh of condensing heat"
    source: "flowsheet energy stream Q9: the part of C-201's reboiler that R-101's steam does not cover, 0.247 kWh/kg; R-101's 23.7 MW cover T-101, the CO2 regenerator, C-202 and the rest of C-201 (D-008)"
  - key: product:CW
    missing: "linked in the Atlas LCI by the shared mapping (cooling water service per kWh rejected, a screening proxy), D-010; connect to: heat rejected to a recirculating cooling-water system with cooling tower (processes/utility-cooling-tower), per kWh removed"
    source: "flowsheet energy streams Q4, Q5, Q6, Q8, Q10, Q12 and Q13: effluent trim cooler, C-101's condenser, the scrubber with its acid cooler, the regenerator's condenser, the column condensers and the product cooler, 1.38 kWh/kg (D-008)"
  # --- wastes to treatment
  - key: product:WW
    treatment: {kind: waste, route: "biological treatment of the aqueous effluent (the water phases of C-101 and C-201 and C-202's top: water with 1.5 wt% vinyl acetate and 0.65 wt% acetic acid); a stripper recovering the vinyl acetate is a next-stage option (D-007)"}
    missing: "linked in the Atlas LCI by the shared mapping (wastewater to treatment per kg, a unit proxy), D-010; connect to: treatment of industrial waste water in a biological plant, per kg, with its organic load (processes/utility-wwtp)"
    source: "flowsheet stream S34, 0.280 kg/kg (D-005, D-007)"
  - key: product:PURGE
    treatment: {kind: waste, route: "thermal oxidation of the cycle-gas purge (70 wt% ethylene, ethane, the inerts and CO2) at the site's thermal oxidiser"}
    missing: "not mapped (an Atlas gap, D-010); connect to: thermal oxidation (or flaring) of a hydrocarbon vent gas, with the CO2 of its ethylene, per kg (processes/utility-flare)"
    source: "flowsheet stream S18, 0.013 kg/kg (D-006)"
  # --- emissions
  - key: product:CO2V
    emission: true
    source: "flowsheet stream S21: the carbonate regenerator's CO2 to atmosphere in the base case, with the co-absorbed ethylene (D-006)"
  - key: emission:CO2
    elementary: {compartment: air, subcompartment: non-urban-high-stack, origin: fossil}
    source: "CO2 of the burnt fossil ethylene in R-101, desorbed in the carbonate regenerator, 0.0995 kg/kg (D-006)"
  - key: emission:C2H4
    elementary: {compartment: air, subcompartment: non-urban-high-stack, origin: fossil}
    source: "ethylene co-absorbed in the carbonate solution and released with the CO2, 1.0 g/kg, ASSUMED 0.1 % of the slip's ethylene (D-006)"
  - key: emission:C2H6
    elementary: {compartment: air, subcompartment: non-urban-high-stack, origin: fossil}
    source: "ethane co-absorbed with the ethylene (D-006)"
  - {key: emission:O2, free: true, source: "oxygen co-absorbed and released with the CO2 (D-006)"}
  - {key: emission:AR, free: true, source: "argon co-absorbed and released with the CO2 (D-006)"}
  - {key: emission:H2O, free: true, source: "template component, zero in the vent"}
  - key: emission:ACOH
    elementary: {compartment: air, subcompartment: non-urban-high-stack, origin: fossil}
    source: "template component, zero in the vent: the regenerator's split (A101) sends no acid to the vent; the water wash C-104 takes 99 % of the slip's acid to C-201, and the 0.12 g/kg left passes back to the loop with the treated gas (in a plant the carbonate takes it up as potassium acetate, see the cut-off carbonate-make-up), D-006"
  - key: emission:VAM
    elementary: {compartment: air, subcompartment: non-urban-high-stack, origin: fossil}
    source: "template component, zero in the vent: the scrubbed cycle gas keeps 0.01 mol% vinyl acetate, which passes the carbonate with the treated gas back to the loop (A101's split sends none to the vent), D-006"
emission_exclusions:
  - {id: fugitive-losses, method: equipment-leaks, reason: "No P&ID yet: fugitive losses of ethylene, vinyl acetate and acetic acid from flanges, seals and valves are not estimated at the concept stage (D-010)."}
  - {id: storage-breathing, method: storage-tank, equipment: [V-201], reason: "The breathing of the crude and product vinyl acetate tanks (nitrogen-blanketed, vented to the thermal oxidiser, ASSUMED) is not estimated (D-010)."}
  - {id: carbonate-bleed, method: effluent, equipment: [C-103], reason: "The liquid bleed that keeps the potassium acetate of the carbonate solution below 4 wt% (US 6 420 595 B1): about 38 t/a of potassium acetate from the 0.12 g/kg of acid the water wash leaves in the slip (D-006), with its solution water; its organic load is not estimated at the concept stage (D-006, D-010)."}
# Not inventoried, and not cut off: the replacement of the Pd/Au/potassium acetate catalyst of
# R-101 (about 28 m3 at 1.5 wt% Pd and 1 wt% Au, US 8 765 995 B2) with the precious metals lost on
# refining the spent catalyst, and the potassium acetate the catalyst is replenished with in
# operation. No open source read here gives the catalyst's life, its metal losses or the
# make-up rate (DESIGN.md D-010, Open inputs); an amount would be a guess, and a precious-metal
# catalyst is never cut off. It is added as a consumable once a rate is sourced (background:
# primary palladium and gold with recovery from spent catalyst, potassium acetate).
cutoff:
  - {id: carbonate-make-up, title: "K2CO3 make-up of the hot carbonate CO2 removal", unit: kg, per_year: 27000, cas: "584-08-7", reason: "the carbonate consumed by the acid that passes the water wash C-104 (0.049 kmol/h, half a mole of K2CO3 per mole of acid: 3.4 kg/h, 0.14 g/kg), leaving as potassium acetate with the bleed; 0.01 % of the input mass", source: "D-006; the acid from flowsheet stream S36"}
  - {id: inhibitor, title: "Polymerisation inhibitor of the vinyl acetate product", unit: kg, per_year: 4000, reason: "the product is stored inhibited (D-002, D-009); the inhibitor is not modelled: ASSUMED order of 20 ppm by weight of the 200 kt/a, 0.0015 % of the input mass", source: "D-002, ASSUMED"}
operation:
  hours_per_year: 8000
  life_years: 20
  source: "design basis operating_hours_per_year 8000 (ASSUMED); 20 a service life ASSUMED"
dataset:
  version: 0.1.0
  classification: {isic: "2011"}   # ISIC Rev.4 2011 Manufacture of basic chemicals
  modelling: {principle: attributional}
  geography: {description: "Generic site with ethylene, oxygen and acetic acid supply, not chosen (GLO); one design case"}
  system_model: cutoff
  technology_level: current
  review: {type: none}
  data_generator: "ChemE-as-Code agent session (Claude Opus 5.5) for issue #479, unreviewed"
