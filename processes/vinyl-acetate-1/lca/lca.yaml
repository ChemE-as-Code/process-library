# Goal and scope of the vinyl-acetate-1 LCI. Schema: `cheme schema lca`. Outputs: `cheme
# assess lca --write` (lca/inventory.csv, gaps.csv, dataset.yaml, manifest.json, results); never
# edit those by hand.
#
# Preliminary gate-to-gate foreground inventory (DESIGN.md D-010): every exchange of the plant
# with its amount per kg of vinyl acetate from the design case of process/flowsheet.yaml. The
# three raw materials are linked to their library producers (lca/mappings.yaml: ethylene-1,
# acetic-acid-1, asu-1) and the LP steam is counted as heat; the other backgrounds stay gaps
# (`missing:` with the activity each should connect to), never zero, and no values from
# licensed databases.
schema: cheme/lca/v1
kind: lca
goal: >-
  Preliminary gate-to-gate life cycle inventory of vinyl acetate monomer made by gas-phase
  acetoxylation of ethylene with acetic acid and oxygen over a Pd/Au catalyst, with acetic acid
  scrubbing of the cycle gas, CO2 removal on hot potassium carbonate, an inerts purge and
  distillation, at the concept stage: which raw materials, utilities, wastes and emissions the
  plant exchanges per kg of vinyl acetate, as the foreground for a cradle-to-gate study with the
  library's ethylene, acetic acid and oxygen.
functional_unit: {product: VAMP, amount: 1, unit: kg, source: "1 kg of vinyl acetate monomer (modelled 99.99 wt%, 95 ppm(wt) water) at the plant gate to storage, stream S33 (D-002, D-007)"}
# The boundary key stays cradle-to-gate so that the purchased inputs remain gaps or links
# instead of being mapped free (the schema's gate-to-gate maps every feed free).
boundary: cradle-to-gate
case: design
year: 2026
location: GLO
technology: "Gas-phase acetoxylation of ethylene at 1000 kPa(a) and 423-438 K in a multitubular fixed bed (Pd/Au with potassium acetate) cooled by boiling water raising LP steam at 450 kPa(a); reactor feed 65 mol% ethylene, 12.3 mol% acetic acid, 8.6 mol% oxygen (US 8 765 995 B2 Table 2); effluent condensed in a preliminary dewatering column at loop pressure, cycle gas scrubbed with recycle acetic acid, 0.3 % purged to a thermal oxidiser, a third of it through a hot potassium carbonate CO2 removal, recompressed; crude separated in an azeotropic column with decanter (recycle acid at the bottom) and a dewatering column with the pure VAM side draw (US 8 410 307 B2); 200 kt/a in 8000 h"
rights: "CC-BY-4.0: the ChemE-as-Code process library's own concept design (LICENSE-DATA)"
system_model: cutoff
flows:
  # --- raw materials
  - key: feed:ETH
    missing: "linked to processes/ethylene-1 (lca/mappings.yaml): polymer-grade ethylene from steam cracking"
    source: "flowsheet stream S1, 0.370 kg/kg (D-003, D-004)"
  - key: feed:OXY
    missing: "linked to processes/asu-1 (lca/mappings.yaml): GOX from cryogenic air separation"
    source: "flowsheet stream S7, 0.299 kg/kg (D-003, D-004)"
  - key: feed:ACF
    missing: "linked to processes/acetic-acid-1 (lca/mappings.yaml): glacial acetic acid by methanol carbonylation"
    source: "flowsheet stream S4, 0.701 kg/kg (D-003, D-004)"
  # --- utilities
  - key: feed:POWER
    missing: "not mapped yet (D-010); connect to: electricity, medium voltage, grid mix of the (undecided) site country"
    source: "flowsheet energy streams P1 (K-101), P2 (A-101's solution pumps) and P3 (the distillation pumps), 0.045 kWh/kg (D-008)"
  - key: feed:LPS
    missing: "linked as heat from steam (lca/mappings.yaml); connect to: steam in the chemical industry, 450 kPa(a), from a natural-gas-fired site boiler (e.g. processes/utility-steam-ng-boiler), per kWh of condensing heat"
    source: "flowsheet energy stream Q9: the part of C-201's reboiler that R-101's steam does not cover, 0.121 kWh/kg; R-101's 23.7 MW cover T-101, the CO2 regenerator, C-202 and the rest of C-201 (D-008)"
  - key: product:CW
    missing: "not mapped yet (D-010); connect to: heat rejected to a recirculating cooling-water system with cooling tower (processes/utility-cooling-tower), per kWh removed"
    source: "flowsheet energy streams Q4, Q5, Q6, Q8, Q10, Q12 and Q13: effluent trim cooler, C-101's condenser, the scrubber with its acid cooler, the regenerator's condenser, the column condensers and the product cooler, 1.34 kWh/kg (D-008)"
  # --- wastes to treatment
  - key: product:WW
    treatment: {kind: waste, route: "biological treatment of the aqueous effluent (water with 1.5 wt% vinyl acetate and 0.19 wt% acetic acid); a stripper recovering the vinyl acetate is a next-stage option (D-007)"}
    missing: "not mapped yet (D-010); connect to: treatment of industrial waste water in a biological plant, per kg, with its organic load (processes/utility-wwtp)"
    source: "flowsheet stream S34, 0.256 kg/kg (D-007)"
  - key: product:PURGE
    treatment: {kind: waste, route: "thermal oxidation of the cycle-gas purge (70 wt% ethylene, ethane, the inerts and CO2) at the site's thermal oxidiser"}
    missing: "not mapped yet (D-010); connect to: thermal oxidation (or flaring) of a hydrocarbon vent gas, with the CO2 of its ethylene, per kg (processes/utility-flare)"
    source: "flowsheet stream S18, 0.013 kg/kg (D-006)"
  # --- emissions
  - key: product:CO2V
    emission: true
    source: "flowsheet stream S21: the carbonate regenerator's CO2 to atmosphere in the base case, with the co-absorbed ethylene (D-006)"
  - key: emission:CO2
    elementary: {compartment: air, subcompartment: non-urban-high-stack, origin: fossil}
    source: "CO2 of the burnt fossil ethylene in R-101, desorbed in the carbonate regenerator, 0.099 kg/kg (D-006)"
  - key: emission:C2H4
    elementary: {compartment: air, subcompartment: non-urban-high-stack, origin: fossil}
    source: "ethylene co-absorbed in the carbonate solution and released with the CO2, 1.0 g/kg, ASSUMED 0.1 % of the slip's ethylene (D-006)"
  - key: emission:C2H6
    elementary: {compartment: air, subcompartment: non-urban-high-stack, origin: fossil}
    source: "ethane co-absorbed with the ethylene (D-006)"
  - {key: emission:O2, free: true, source: "oxygen co-absorbed and released with the CO2 (D-006)"}
  - {key: emission:AR, free: true, source: "argon co-absorbed and released with the CO2 (D-006)"}
  - {key: emission:H2O, free: true, source: "template component, zero in the vent"}
  - {key: emission:ACOH, free: true, source: "template component, zero in the vent (the carbonate keeps the acid as potassium acetate, D-006)"}
  - {key: emission:VAM, free: true, source: "template component, zero in the vent (D-006)"}
emission_exclusions:
  - {id: fugitive-losses, method: equipment-leaks, reason: "No P&ID yet: fugitive losses of ethylene, vinyl acetate and acetic acid from flanges, seals and valves are not estimated at the concept stage (D-010)."}
  - {id: storage-breathing, method: storage-tank, equipment: [V-201], reason: "The breathing of the crude and product vinyl acetate tanks (nitrogen-blanketed, vented to the thermal oxidiser, ASSUMED) is not estimated (D-010)."}
  - {id: carbonate-bleed, method: storage-tank, equipment: [C-103], reason: "The bleed that keeps the potassium acetate of the carbonate solution below 4 wt% (US 6 420 595 B1) and the catalyst's potassium acetate make-up are not quantified at the concept stage (D-006, D-010)."}
operation:
  hours_per_year: 8000
  life_years: 20
  source: "design basis operating_hours_per_year 8000 (ASSUMED); 20 a service life ASSUMED"
dataset:
  version: 0.1.0
  classification: {isic: "2011"}   # ISIC Rev.4 2011 Manufacture of basic chemicals
  modelling: {principle: attributional}
  geography: {description: "Generic site with ethylene, oxygen and acetic acid supply, not chosen (GLO); one design case"}
  system_model: cutoff
  technology_level: current
  review: {type: none}
  data_generator: "ChemE-as-Code agent session (Claude Opus 5.5) for issue #479, unreviewed"
