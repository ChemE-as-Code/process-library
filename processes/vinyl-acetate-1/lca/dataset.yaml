id: vinyl-acetate-monomer-by-gas-phase-acetoxylation-of-ethylene-200-kt-a
title: Vinyl acetate monomer by gas-phase acetoxylation of ethylene (200 kt/a)
description: Unallocated foreground LCI of Vinyl acetate monomer by gas-phase acetoxylation of ethylene
  (200 kt/a), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: Gas-phase acetoxylation of ethylene at 1000 kPa(a) and 423-438 K in a multitubular fixed bed
  (Pd/Au with potassium acetate) cooled by boiling water raising LP steam at 450 kPa(a); reactor feed
  65 mol% ethylene, 12.3 mol% acetic acid, 8.6 mol% oxygen (US 8 765 995 B2 Table 2); effluent condensed
  in a preliminary dewatering column at loop pressure, cycle gas scrubbed with recycle acetic acid, 0.3
  % purged to a thermal oxidiser, a third of it washed with water and passed through a hot potassium carbonate
  CO2 removal, recompressed; crude separated in an azeotropic column with decanter (recycle acid at the
  bottom) and a dewatering column with the pure VAM side draw (US 8 410 307 B2); 200 kt/a in 8000 h
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: cutoff:carbonate-make-up
  title: K2CO3 make-up of the hot carbonate CO2 removal
  amount: 3.375
  reason: 'the carbonate consumed by the acid that passes the water wash C-104 (0.049 kmol/h, half a mole
    of K2CO3 per mole of acid: 3.4 kg/h, 0.14 g/kg), leaving as potassium acetate with the bleed; 0.01
    % of the input mass'
  cas: 584-08-7
  source: D-006; the acid from flowsheet stream S36
- key: cutoff:inhibitor
  title: Polymerisation inhibitor of the vinyl acetate product
  amount: 0.5
  reason: 'the product is stored inhibited (D-002, D-009); the inhibitor is not modelled: ASSUMED order
    of 20 ppm by weight of the 200 kt/a, 0.0015 % of the input mass'
  source: D-002, ASSUMED
- key: emission-excluded:fugitive-losses
  title: equipment-leaks emissions of the plant
  direction: output
  reason: 'No P&ID yet: fugitive losses of ethylene, vinyl acetate and acetic acid from flanges, seals
    and valves are not estimated at the concept stage (D-010).'
- key: emission-excluded:storage-breathing
  title: storage-tank emissions of V-201
  direction: output
  reason: The breathing of the crude and product vinyl acetate tanks (nitrogen-blanketed, vented to the
    thermal oxidiser, ASSUMED) is not estimated (D-010).
- key: emission-excluded:carbonate-bleed
  title: effluent emissions of C-103
  direction: output
  reason: 'The liquid bleed that keeps the potassium acetate of the carbonate solution below 4 wt% (US
    6 420 595 B1): about 38 t/a of potassium acetate from the 0.12 g/kg of acid the water wash leaves
    in the slip (D-006), with its solution water; its organic load is not estimated at the concept stage
    (D-006, D-010).'
