# Components and templates of vinyl-acetate-1. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol (IUPAC 2021
# conventional atomic weights applied to the formula), normal_boiling_point in K at 101.325 kPa.
#
# Property sources (DESIGN.md source register SRC-5):
# - ideal_gas: dHf_298 and S_298 as the `chemicals` 1.5.2 package gives them (ATcT for the light
#   gases and water, the CRC Handbook's standard-state table for acetic acid and vinyl acetate),
#   cp_R the Poling et al. (5th ed.) polynomials packaged there; vinyl acetate has no Poling
#   polynomial: its cp_R is a cubic fitted by us (298 to 700 K, within 0.2 %) to thermo 0.6.1's
#   TRCIG ideal-gas heat capacity (the TRC tables as thermo packages them), ASSUMED. Single
#   facts with the package named, not open data (library ADR 0037); no table copied.
# - normal boiling points and the heats of vaporization at the boiling point that
#   scripts/balance.py uses (vinyl acetate 34.6, acetic acid 23.7, water 40.65 kJ/mol): the CRC
#   Handbook values as packaged in `chemicals` 1.5.2 (CRC_organic_data, Hvap_data_CRC); light
#   gases from the HEOS reference equations packaged there.
# - The ideal-gas formation enthalpies give the heat of the acetoxylation at 298.15 K,
#   -314.4 - 241.822 - 52.56 + 432.2 = -176.6 kJ/mol, and of the ethylene combustion -1323.2
#   kJ/mol, the two values US 8 765 995 B2 states (SRC-1, -176 and -1324 kJ/mol): R101's duty,
#   which `cheme process propagate` writes on the elements basis, rests on these data.
# Acetic acid is taken as the monomer in the gas (its dimerization in the vapour is not
# modelled; DESIGN.md L-2). Argon stands for all the inerts of the oxygen. Ethane is the
# impurity of the ethylene. The by-products of the real process (ethyl acetate, acetaldehyde,
# methyl acetate, ethylidene diacetate, heavies) are not modelled (D-004).
schema: cheme/process/v1
kind: materials
components:
  - id: C2H4
    name: Ethylene
    formula: C2H4
    cas: 74-85-1
    molar_mass: 28.054
    normal_boiling_point: 169.38
    ideal_gas: {dHf_298: 52560.0, S_298: 219.3, cp_R: [4.221, -0.008782, 5.795e-05, -6.729e-08, 2.511e-11], temperature_range: [50, 1000], provenance: given, source: "chemicals 1.5.2: dHf_298 ATcT, S_298 CRC, cp_R Poling et al. (5th ed.)"}
  - id: C2H6
    name: Ethane (impurity of the ethylene)
    formula: C2H6
    cas: 74-84-0
    molar_mass: 30.070
    normal_boiling_point: 184.57
    ideal_gas: {dHf_298: -83780.0, S_298: 229.2, cp_R: [4.178, -0.004427, 5.66e-05, -6.651e-08, 2.487e-11], temperature_range: [50, 1000], provenance: given, source: "chemicals 1.5.2: dHf_298 ATcT, S_298 CRC, cp_R Poling et al. (5th ed.)"}
  - id: O2
    name: Oxygen
    formula: O2
    cas: 7782-44-7
    molar_mass: 31.998
    normal_boiling_point: 90.19
    ideal_gas: {dHf_298: 0.0, S_298: 205.2, cp_R: [3.63, -0.001794, 6.58e-06, -6.0e-09, 1.79e-12], temperature_range: [50, 1000], provenance: given, source: "chemicals 1.5.2: S_298 CRC, cp_R Poling et al. (5th ed.)"}
  - id: AR
    name: Argon (with the other inerts of the oxygen)
    formula: Ar
    cas: 7440-37-1
    molar_mass: 39.95
    normal_boiling_point: 87.30
    ideal_gas: {dHf_298: 0.0, S_298: 154.8, cp_R: [2.5], provenance: given, source: "chemicals 1.5.2: S_298 CRC; monatomic ideal gas cp = 2.5 R"}
  - id: CO2
    name: Carbon dioxide
    formula: CO2
    cas: 124-38-9
    molar_mass: 44.009
    ideal_gas: {dHf_298: -393474.0, S_298: 213.8, cp_R: [3.259, 0.001356, 1.502e-05, -2.374e-08, 1.056e-11], temperature_range: [50, 1000], provenance: given, source: "chemicals 1.5.2: dHf_298 ATcT, S_298 CRC, cp_R Poling et al. (5th ed.)"}
  - id: H2O
    name: Water
    formula: H2O
    cas: 7732-18-5
    molar_mass: 18.015
    normal_boiling_point: 373.12
    ideal_gas: {dHf_298: -241822.0, S_298: 188.8, cp_R: [4.395, -0.004186, 1.405e-05, -1.564e-08, 6.32e-12], temperature_range: [50, 1000], provenance: given, source: "chemicals 1.5.2: dHf_298 ATcT, S_298 CRC, cp_R Poling et al. (5th ed.)"}
  - id: ACOH
    name: Acetic acid
    formula: C2H4O2
    cas: 64-19-7
    molar_mass: 60.052
    normal_boiling_point: 391.05
    ideal_gas: {dHf_298: -432200.0, S_298: 283.5, cp_R: [4.375, -0.002397, 6.757e-05, -8.764e-08, 3.478e-11], temperature_range: [50, 1000], provenance: given, source: "chemicals 1.5.2: dHf_298 and S_298 CRC (monomer), cp_R Poling et al. (5th ed.)"}
  - id: VAM
    name: Vinyl acetate
    formula: C4H6O2
    cas: 108-05-4
    molar_mass: 86.090
    normal_boiling_point: 345.95
    ideal_gas: {dHf_298: -314400.0, S_298: 328.02, cp_R: [0.73351, 0.0434057, -2.02724e-05, 4.72673e-10], temperature_range: [298, 700], provenance: assumed, source: "chemicals 1.5.2: dHf_298 CRC, S_298 Yaws (as chemicals cites it); cp_R a cubic fitted by us to thermo 0.6.1 TRCIG over 298-700 K (within 0.2 %), ASSUMED"}
templates:
  - id: gas
    title: Reactor and cycle gas (ethylene, oxygen, CO2, inerts, acetic acid, vinyl acetate, water)
    components: [C2H4, C2H6, O2, AR, CO2, H2O, ACOH, VAM]
  - id: liquid
    title: Crude liquids, acid recycle and products (vinyl acetate, water, acetic acid; the gases at zero, D-005)
    components: [VAM, H2O, ACOH, C2H4, C2H6, O2, AR, CO2]
# property_method is a placeholder: no benchmarked package of core covers the vinyl acetate,
# water and acetic acid liquids or the cycle gas with acetic acid (DESIGN.md L-2).
property_method:
  adapter: thermo
  status: placeholder
