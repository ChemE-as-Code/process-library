# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Vinyl acetate monomer by gas-phase acetoxylation of ethylene, 200 kt/a (D-001, D-002). Where the
# values come from:
# - the feeds' compositions are the library producers' products (ethylene-1, asu-1,
#   acetic-acid-1, D-003); their flows are solved by core's design specifications (`specs:`, core
#   ADR 0070) for the product rate and the reactor feed of US 8 765 995 B2 Table 2 (SRC-1: 65
#   mol% ethylene, 12.3 mol% acetic acid, 8.6 mol% oxygen), with the CO2 slip split solved for
#   the ethylene;
# - R101 converts the fractions of process/reactions.yaml (D-004); the separators' splits
#   (`recovery:`) are ASSUMED design specifications inside the compositions US 8 410 307 B2 and
#   US 6 420 595 B1 state (SRC-2, SRC-3, D-005 to D-007); the splits X101 and X201 are ASSUMED;
# - the cycle gas, the recycle acid and the dewatering column's bottoms are torn (S2, S28, S31,
#   core ADR 0060) and solved together with the specifications by `cheme process propagate
#   --fill`, which writes every flow and composition but the feeds' compositions;
# - temperatures and pressures are ASSUMED design values inside the sources' ranges (D-005);
# - R101's duty Q1 is written by propagate on the elements basis from the ideal-gas data of
#   process/materials.yaml (core ADR 0059); every other duty and power comes from
#   scripts/balance.py (D-008), which reads the propagated streams.
schema: cheme/process/v1
kind: flowsheet
title: Vinyl acetate monomer by gas-phase acetoxylation of ethylene (200 kt/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - id: design
    description: "Design case: 200 kt/a vinyl acetate (25 t/h in 8000 h), the reactor feed of US 8 765 995 B2 Table 2 (D-002, D-004)"
    default: true
    capacity: 25 t/h vinyl acetate
    provenance: assumed
    source: "D-002: a normalisation basis for the inventory, not a commercial plant claim"
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h
tears:
  - stream: S2
    initial: {flow: 109000, unit: kg/h, basis: mole_fraction, composition: {C2H4: 0.76, C2H6: 0.001, O2: 0.047, AR: 0.05, CO2: 0.12, H2O: 0.015, ACOH: 0.005, VAM: 0.002}}
  - stream: S28
    initial: {flow: 23000, unit: kg/h, basis: mass_fraction, composition: {ACOH: 0.85, H2O: 0.149, VAM: 0.001}}
  - stream: S31
    initial: {flow: 130, unit: kg/h, basis: mass_fraction, composition: {VAM: 0.99, ACOH: 0.01}}
convergence: {method: wegstein, max_iterations: 200}
specs:
  - id: rate
    vary: {stream: S1, initial: 9300}
    target: {stream: S33, component: VAM, quantity: annual, value: 200000, unit: t, hours: 8000}
    provenance: assumed
    source: "D-002: 200 kt/a of vinyl acetate in 8000 h, ASSUMED normalisation basis"
  - id: oxygen
    vary: {stream: S7, initial: 7500}
    target: {stream: S9, component: O2, quantity: fraction, basis: mole, value: 0.086}
    provenance: given
    source: "US 8 765 995 B2 (SRC-1) Table 2: 8.6 mol% oxygen in the reactor feed (D-004)"
  - id: acid
    vary: {stream: S4, initial: 17500}
    target: {stream: S9, component: ACOH, quantity: fraction, basis: mole, value: 0.123}
    provenance: given
    source: "US 8 765 995 B2 (SRC-1) Table 2: 12.3 mol% acetic acid in the reactor feed (D-004)"
  - id: ethylene
    vary: {node: X102, port: slip, initial: 0.2}
    target: {stream: S9, component: C2H4, quantity: fraction, basis: mole, value: 0.65}
    provenance: given
    source: "US 8 765 995 B2 (SRC-1) Table 2: 65 mol% ethylene in the reactor feed; the CO2 slip to A101 holds it (D-006)"

feeds:
  - {id: ETH, title: "Ethylene (polymer grade, ethylene-1)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: OXY, title: "Oxygen (GOX, asu-1)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: ACF, title: "Acetic acid (glacial, acetic-acid-1)", category: raw_material, ports: [{id: out, direction: out}]}
  - id: LPS
    title: LP steam import 450 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis, D-008"}
      supply_temperature: {value: 420.8, provenance: assumed, source: "saturation at 450 kPa(a), D-008"}
    ports:
      - {id: c201, direction: out, kind: energy}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: k101, direction: out, kind: energy}
      - {id: a101, direction: out, kind: energy}
      - {id: dis, direction: out, kind: energy}
products:
  - {id: VAMP, title: Vinyl acetate monomer to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: PURGE, title: Cycle-gas purge to the thermal oxidiser, category: off_gas, ports: [{id: in, direction: in}]}
  - {id: CO2V, title: CO2 vent of the carbonate regenerator, category: off_gas, ports: [{id: in, direction: in}]}
  - {id: WW, title: Aqueous effluent to biological treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-008"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-008"}
    ports:
      - {id: e102, direction: in, kind: energy}
      - {id: c101, direction: in, kind: energy}
      - {id: c102, direction: in, kind: energy}
      - {id: a101, direction: in, kind: energy}
      - {id: c201, direction: in, kind: energy}
      - {id: c202, direction: in, kind: energy}
      - {id: e201, direction: in, kind: energy}

blocks:
  - id: RXN
    title: Acetic acid saturation and acetoxylation reactor
    class: ReactingChemicals
    ports:
      - {id: eth, direction: in}
      - {id: oxy, direction: in}
      - {id: acf, direction: in}
      - {id: rec, direction: in}
      - {id: acid, direction: in}
      - {id: out, direction: out}
      - {id: fe, direction: in, kind: energy}
      - {id: stm1, direction: out, kind: energy}
      - {id: stm2, direction: out, kind: energy}
      - {id: stm3, direction: out, kind: energy}
  - id: GAS
    title: Effluent condensation, cycle-gas scrubbing, CO2 removal and recycle compression
    class: Absorbing
    ports:
      - {id: in, direction: in}
      - {id: scr, direction: in}
      - {id: rec, direction: out}
      - {id: purge, direction: out}
      - {id: co2, direction: out}
      - {id: org, direction: out}
      - {id: bot, direction: out}
      - {id: scrbot, direction: out}
      - {id: fe, direction: out, kind: energy}
      - {id: stm, direction: in, kind: energy}
      - {id: pw1, direction: in, kind: energy}
      - {id: pw2, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: cw3, direction: out, kind: energy}
      - {id: cw4, direction: out, kind: energy}
  - id: DIS
    title: Distillation (azeotropic column, dewatering column with the VAM side draw)
    class: Distilling
    ports:
      - {id: bot, direction: in}
      - {id: org, direction: in}
      - {id: scrbot, direction: in}
      - {id: acid, direction: out}
      - {id: scr, direction: out}
      - {id: vam, direction: out}
      - {id: ww, direction: out}
      - {id: stm1, direction: in, kind: energy}
      - {id: stm2, direction: in, kind: energy}
      - {id: stm3, direction: in, kind: energy}
      - {id: pw, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: cw3, direction: out, kind: energy}

steps:
  # ---------------------------------------------------------------- reaction (D-004, D-005)
  - id: M101
    block: RXN
    title: Fresh ethylene into the cycle gas
    class: Mixing
    ports:
      - {id: eth, direction: in, delegates: eth}
      - {id: rec, direction: in, delegates: rec}
      - {id: out, direction: out}
  - id: T101
    block: RXN
    title: Acetic acid saturator (cycle gas saturated with fresh and recycle acid)
    class: Mixing
    links: [{target: equipment, ref: T-101}]
    ports:
      - {id: gas, direction: in}
      - {id: acf, direction: in, delegates: acf}
      - {id: acid, direction: in, delegates: acid}
      - {id: out, direction: out}
      - {id: stm, direction: in, kind: energy}
  - id: M102
    block: RXN
    title: Oxygen mixing nozzle
    class: Mixing
    ports:
      - {id: gas, direction: in}
      - {id: oxy, direction: in, delegates: oxy}
      - {id: out, direction: out}
  - id: E101
    block: RXN
    title: Reactor feed superheater
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: fe, direction: in, kind: energy, delegates: fe}
  - id: R101
    block: RXN
    title: Acetoxylation reactor (multitubular fixed bed, Pd/Au catalyst, boiling-water shell)
    class: ReactingChemicals
    reactions: [ACX, COMB]
    reactor: conversion
    # Q1: the heat left after the steam R-101 raises for T-101 (Q2), the CO2 regenerator (Q7)
    # and C-202 (Q11), all at 450 kPa(a), goes to C-201's reboiler (D-008)
    energy_port: stm
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
      - {id: stm, direction: out, kind: energy, delegates: stm1}
      - {id: sat, direction: out, kind: energy}
      - {id: co2, direction: out, kind: energy, delegates: stm2}
      - {id: c202, direction: out, kind: energy, delegates: stm3}
  # ---------------------------------------------------------------- gas recovery (D-005, D-006)
  - id: E102
    block: GAS
    title: Reactor effluent cooler
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: out, direction: out}
      - {id: fe, direction: out, kind: energy, delegates: fe}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: C101
    block: GAS
    title: Preliminary dewatering column at loop pressure, overhead condenser and decanter
    class: Separating
    recovery:
      outlets:
        gas: {C2H4: 1.0, C2H6: 1.0, O2: 1.0, AR: 1.0, CO2: 1.0, VAM: 0.25, H2O: 0.03, ACOH: 0.002}
        org: {VAM: 0.55, H2O: 0.02}
      provenance: assumed
      source: "D-005: ASSUMED split; the organic phase about 98.9 wt% VAM and 1.1 wt% water, inside US 8 410 307 B2's 90-99 wt% VAM and 0.5-8 wt% water (SRC-2); the gases leave overhead (their solution in the liquids not modelled)"
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out}
      - {id: org, direction: out, delegates: org}
      - {id: bot, direction: out, delegates: bot}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  - id: C102
    block: GAS
    title: Cycle-gas scrubber with recycle acetic acid
    class: Absorbing
    recovery:
      outlets:
        out: {C2H4: 1.0, C2H6: 1.0, O2: 1.0, AR: 1.0, CO2: 1.0, VAM: 0.005, H2O: 0.3, ACOH: 0.01}
      provenance: assumed
      source: "D-005: ASSUMED split; the acetic acid scrub of the uncondensed gas of US 8 410 307 B2 (SRC-2), its bottoms to the azeotropic column"
    links: [{target: equipment, ref: C-102}]
    ports:
      - {id: gas, direction: in}
      - {id: acid, direction: in, delegates: scr}
      - {id: out, direction: out}
      - {id: bot, direction: out, delegates: scrbot}
      - {id: cw, direction: out, kind: energy, delegates: cw3}
  - id: X101
    block: GAS
    title: Inerts purge
    class: SplittingMaterial
    split: {purge: 0.003}
    ports:
      - {id: in, direction: in}
      - {id: purge, direction: out, delegates: purge}
      - {id: out, direction: out}
  - id: X102
    block: GAS
    title: Slip stream to the CO2 removal
    class: SplittingMaterial
    ports:
      - {id: in, direction: in}
      - {id: slip, direction: out}
      - {id: byp, direction: out}
  - id: A101
    block: GAS
    title: CO2 removal by hot potassium carbonate (absorber and regenerator)
    class: Absorbing
    recovery:
      outlets:
        vent: {CO2: 0.45, C2H4: 0.001, C2H6: 0.001, O2: 0.001, AR: 0.001}
      provenance: assumed
      source: "D-006: US 6 420 595 B1 (SRC-3): the carbonate removes almost half of the CO2 of the gas it treats, ASSUMED 0.45; the hydrocarbons co-absorbed and lost with the regenerator's CO2, ASSUMED 0.1 %"
    links: [{target: equipment, ref: C-103}]
    ports:
      - {id: in, direction: in}
      - {id: vent, direction: out, delegates: co2}
      - {id: gas, direction: out}
      - {id: stm, direction: in, kind: energy, delegates: stm}
      - {id: pw, direction: in, kind: energy, delegates: pw2}
      - {id: cw, direction: out, kind: energy, delegates: cw4}
  - id: M103
    block: GAS
    title: Treated slip back into the cycle gas
    class: Mixing
    ports:
      - {id: slip, direction: in}
      - {id: byp, direction: in}
      - {id: out, direction: out}
  - id: K101
    block: GAS
    title: Cycle-gas compressor
    class: Compressing
    links: [{target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: rec}
      - {id: pw, direction: in, kind: energy, delegates: pw1}
  # ---------------------------------------------------------------- distillation (D-007)
  - id: M201
    block: DIS
    title: Azeotropic column feeds
    class: Mixing
    ports:
      - {id: bot, direction: in, delegates: bot}
      - {id: scr, direction: in, delegates: scrbot}
      - {id: c202, direction: in}
      - {id: out, direction: out}
  - id: C201
    block: DIS
    title: Azeotropic column with overhead decanter
    class: Distilling
    recovery:
      outlets:
        org: {VAM: 0.995, H2O: 0.02, ACOH: 0.00002}
        aq: {VAM: 0.004, H2O: 0.75, ACOH: 0.0005}
      provenance: assumed
      source: "D-007: ASSUMED split; the VAM-water heteroazeotrope overhead, decanted, the acetic acid at the bottom as recycle acid (US 8 410 307 B2, SRC-2; US 6 420 595 B1, SRC-3)"
    links: [{target: equipment, ref: C-201}]
    ports:
      - {id: in, direction: in}
      - {id: org, direction: out}
      - {id: aq, direction: out}
      - {id: bot, direction: out}
      - {id: rx, direction: in, kind: energy, delegates: stm1}
      - {id: stm, direction: in, kind: energy, delegates: stm2}
      - {id: pw, direction: in, kind: energy, delegates: pw}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: X201
    block: DIS
    title: Recycle acid to the saturator and to the cycle-gas scrubber
    class: SplittingMaterial
    split: {scr: 0.3}
    ports:
      - {id: in, direction: in}
      - {id: sat, direction: out, delegates: acid}
      - {id: scr, direction: out, delegates: scr}
  - id: M202
    block: DIS
    title: Collection vessel of the organic phases
    class: Mixing
    links: [{target: equipment, ref: V-201}]
    ports:
      - {id: c101, direction: in, delegates: org}
      - {id: c201, direction: in}
      - {id: out, direction: out}
  - id: C202
    block: DIS
    title: Dewatering column with the pure VAM side draw
    class: Distilling
    recovery:
      outlets:
        vam: {VAM: 0.993, H2O: 0.0075}
        top: {VAM: 0.002, H2O: 0.98}
      provenance: assumed
      source: "D-007: ASSUMED split; US 8 410 307 B2 (SRC-2): water and low boilers overhead, pure VAM as a side draw from the stripping section, the bottoms (0.5 % of the feed in its example) back to the azeotropic column"
    links: [{target: equipment, ref: C-202}]
    ports:
      - {id: in, direction: in}
      - {id: vam, direction: out}
      - {id: top, direction: out}
      - {id: bot, direction: out}
      - {id: stm, direction: in, kind: energy, delegates: stm3}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  - id: E201
    block: DIS
    title: Product cooler
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: vam}
      - {id: cw, direction: out, kind: energy, delegates: cw3}
  - id: M203
    block: DIS
    title: Aqueous effluents
    class: Mixing
    ports:
      - {id: c201, direction: in}
      - {id: c202, direction: in}
      - {id: out, direction: out, delegates: ww}

streams:
  - id: S1
    title: Fresh ethylene
    from: ETH.out
    to: M101.eth
    template: gas
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "D-003"}
        pressure: {value: 2000, provenance: assumed, source: "D-003: pipeline delivery above the loop"}
        composition: {basis: mole_fraction, values: {C2H4: 0.9995, C2H6: 0.0005}, provenance: assumed, source: "D-003: ethylene-1's product, C2H4 >= 99.95 mol%, ethane the impurity"}
        flow: {value: 9245.52, provenance: calculated, source: 'cheme process propagate: spec rate (S33 VAM t/a 200000)', fingerprint: 2138f9c5f4112d2e}
  - id: S2
    title: Compressed cycle gas
    from: K101.out
    to: M101.rec
    template: gas
    state:
      design:
        temperature: {value: 334.14, provenance: assumed, source: "scripts/balance.py: K-101's discharge, isentropic efficiency 0.75 (D-008)"}
        pressure: {value: 1050, provenance: assumed, source: "D-005"}
        phase: {value: vapor, provenance: assumed, source: "D-005"}
        flow: {value: 105213.0, provenance: calculated, source: 'cheme process propagate: recycle K101 from S24 (tear, broyden)', fingerprint: a4138b93dd4643a1}
        composition: {basis: mole_fraction, values: {C2H4: 0.781776, C2H6: 0.0142218, O2: 0.0487366, AR: 0.0604526, CO2: 0.0905879, H2O: 0.00377133, ACOH: 0.000348876, VAM: 0.000105256}, provenance: calculated, source: 'cheme process propagate: recycle K101 from S24 (tear, broyden)', fingerprint: a4138b93dd4643a1}
  - id: S3
    title: Cycle gas with fresh ethylene to the saturator
    from: M101.out
    to: T101.gas
    template: gas
    state:
      design:
        temperature: {value: 333.15, provenance: assumed, source: "D-005"}
        pressure: {value: 1050, provenance: assumed, source: "D-005"}
        phase: {value: vapor, provenance: assumed, source: "D-005"}
        flow: {value: 114459.0, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S2', fingerprint: acb738a79ef840b5}
        composition: {basis: mole_fraction, values: {C2H4: 0.800716, C2H6: 0.0130281, O2: 0.044497, AR: 0.0551938, CO2: 0.0827076, H2O: 0.00344326, ACOH: 0.000318527, VAM: 9.60998e-05}, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S2', fingerprint: b054533f8a57c471}
  - id: S4
    title: Fresh acetic acid
    from: ACF.out
    to: T101.acf
    template: liquid
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "D-003"}
        pressure: {value: 1200, provenance: assumed, source: "D-003: pumped"}
        phase: {value: liquid, provenance: assumed, source: "D-003"}
        composition: {basis: mass_fraction, values: {ACOH: 0.999309, H2O: 0.000691}, provenance: assumed, source: "D-003: acetic-acid-1's product at its design point, 691 ppm(wt) water (propionic acid not modelled)"}
        flow: {value: 17530.1, provenance: calculated, source: 'cheme process propagate: spec acid (S9 ACOH mole fraction 0.123)', fingerprint: 2138f9c5f4112d2e}
  - id: S5
    title: Recycle acid to the saturator
    from: X201.sat
    to: T101.acid
    template: liquid
    state:
      design:
        temperature: {value: 393.15, provenance: assumed, source: "D-007: the azeotropic column's bottoms, pumped"}
        pressure: {value: 1200, provenance: assumed, source: "D-007"}
        phase: {value: liquid, provenance: assumed, source: "D-007"}
        flow: {value: 18173.8, provenance: calculated, source: 'cheme process propagate: splitter X201 from S28 S15', fingerprint: 7392cae304ebb294}
        composition: {basis: mole_fraction, values: {VAM: 0.000263127, H2O: 0.202426, ACOH: 0.797311, C2H4: 0.0, C2H6: 0.0, O2: 0.0, AR: 0.0, CO2: 0.0}, provenance: calculated, source: 'cheme process propagate: splitter X201 from S28', fingerprint: c1598731059625f6}
  - id: S6
    title: Acid-saturated cycle gas
    from: T101.out
    to: M102.gas
    template: gas
    state:
      design:
        temperature: {value: 408.15, provenance: assumed, source: "D-005: saturator top"}
        pressure: {value: 1020, provenance: assumed, source: "D-005"}
        phase: {value: vapor, provenance: assumed, source: "D-005"}
        flow: {value: 150163.0, provenance: calculated, source: 'cheme process propagate: mixer T101 from S3 S4 S5', fingerprint: 7bfffca695da67d4}
        composition: {basis: mole_fraction, values: {C2H4: 0.684232, C2H6: 0.0111328, O2: 0.0380238, AR: 0.0471645, CO2: 0.0706757, H2O: 0.0191915, ACOH: 0.129477, VAM: 0.000103044}, provenance: calculated, source: 'cheme process propagate: mixer T101 from S3 S4 S5', fingerprint: 50c28de7ee920644}
  - id: S7
    title: Oxygen
    from: OXY.out
    to: M102.oxy
    template: gas
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "D-003"}
        pressure: {value: 1200, provenance: assumed, source: "D-003: let down from asu-1's 31 bar(a)"}
        phase: {value: vapor, provenance: assumed, source: "D-003"}
        composition: {basis: mole_fraction, values: {O2: 0.997, AR: 0.003}, provenance: assumed, source: "D-003: asu-1's GOX, 99.7 mol% O2, the rest counted as argon"}
        flow: {value: 7476.2, provenance: calculated, source: 'cheme process propagate: spec oxygen (S9 O2 mole fraction 0.086)', fingerprint: 2138f9c5f4112d2e}
  - id: S8
    title: Mixed reactor feed
    from: M102.out
    to: E101.in
    template: gas
    state:
      design:
