# Tier 1 form, a manifest-only entry as process-library#317. Every amount is the formula of its
# parameters; core's validator re-checks each. Written from the Plastics Europe eco-profile of
# polyolefins (2026) with the POL BREF (2007) (facts in our own form).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: hdpe-low-pressure-eu-average
title: High-density polyethylene by low-pressure catalytic polymerisation of ethylene, European average
description: Per 1 t of HDPE pellets, gate-to-gate, average of European HDPE units (2011 data of the Plastics Europe
  eco-profile), slurry and gas-phase plants together. Ethylene, utilities and direct emissions as the source's
  averages; 1-butene from the branch count; the ethylene the source does not itemise closes the carbon balance.
basis: 1000 kg of HDPE pellets
boundary: 'gate-to-gate: feed purification, polymerisation, diluent and monomer recovery, drying, extrusion and
  pelletising, degassing; power and heat from outside; on-site energy production not in the plant data'
technology: Ziegler or chromium-catalysed low-pressure polymerisation; the source averages slurry (loop and stirred-tank)
  and gas-phase plants, and the slurry-specific choices (isobutane diluent) are ASSUMED
geography:
  description: European average (EU28, Norway, Switzerland), 19 HDPE units of the eco-profile's data collection;
    no single site.
classification:
  isic: '2013'
system_boundary:
  included:
  - ethylene, 1-butene, hydrogen, diluent make-up
  - electricity and net thermal energy
  - process water and effluent
  - ethylene the source does not itemise (closes the carbon balance)
  - combustion of purge and vent gases (CO2, CO, water vapour) and the reported air emissions
  excluded:
  - 'TODO cooling water: 8.6 kg/kg withdrawn (eco-profile Table 7), but the duty in kWh, which the library''s cooling-water
    link needs, is not stated'
  - 'TODO catalysts and cocatalysts: ''chemical, inorganic'' 0.26 kg/t (eco-profile Table 5), identity not stated'
  - 'TODO other organic chemicals: the eco-profile''s 22 kg/t of organics less the modelled 1-butene (about 6 kg/t:
    additives, stabilisers, aluminium alkyls), identity not stated'
  - TODO propylene, 0.02 kg/t (eco-profile Table 5)
  - 'TODO process wastes, about 2.2 kg/t to landfill, recovery and incineration (eco-profile Table 4), composition
    not stated: inside output:ethylene-unaccounted, whose treatment is not linked'
  - 'TODO nitrogen for purging and conveying: not quantified in the source'
  - 'TODO hydrocarbons to air other than ethylene and methane: for HDPE the eco-profile reports these two only (its
    propylene to air is n/a), the POL BREF 0.65 to 5.75 kg/t VOC (Table 3.11); the model burns the diluent loss
    instead'
  - 'COD of the effluent after on-site treatment (0.035 kg/t): the effluent is linked to a treatment activity instead'
  - 'on-site energy production: its fuels are behind the electricity and heat'
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified as exchanges
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: RER
year: 2011
valid_until: 2016
time:
  start: 2011
  description: Polymerisation data are 12-month averages of 2011; a 2020 survey of the producers found no major
    change (eco-profile, temporal reference). valid_until is the reference year + 5 (system-model section 6), so
    it has already lapsed.
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation (the source treats returned monomer and fuel gas as internal
    flows). DEVIATION from system-model section 2: feed:steam is the source''s net thermal energy, which may embed
    a credit for exported heat; gross import and export are not stated, so it cannot be corrected here.'
