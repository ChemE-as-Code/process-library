# polyethylene-1's own exchange overrides for the Atlas LCI build (ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. 1-butene and the isobutane diluent stay reported
# gaps: the shared vocabulary has no entry and no Atlas process makes them.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:hydrogen":
    atlas: false
    source: "The supplier is not decided: hydrogen-1 (SMR with PSA) and chlor-alkali-1's by-product hydrogen both make the slug. The shared background entry until one is linked explicitly."
  "feed:ethylene": {dataset: {path: processes/ethylene-1/lca/dataset.yaml, product: "product:ETHYLENE"}, source: "the Atlas producer ethylene-1, polymer-grade ethylene from a steam cracker, as ethanol-1 links it. ethylene-1 cracks ethane, while the European plants of this dataset are mostly fed by naphtha crackers: a technology difference, not a grade difference"}
  "feed:steam": {use: steam-heat, source: "the source's net thermal energy, counted as steam heat delivered (kWh), as ethylbenzene-1 counts its steam"}
