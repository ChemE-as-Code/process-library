# polyethylene-1's own exchange overrides for the Atlas LCI build (ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. 1-butene and the isobutane diluent stay reported
# gaps: the shared vocabulary has no entry and no Atlas process makes them.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:hydrogen":
    atlas: false
    source: "The supplier is not decided: several Atlas processes make the slug (hydrogen-1 by SMR with PSA as its main product; chlor-alkali-1, catalytic-reforming-1 and hda-1 as a co-product). The shared background entry until one is linked explicitly."
  "feed:ethylene": {dataset: {path: processes/ethylene-1/lca/dataset.yaml, product: "product:ETHYLENE"}, source: "the Atlas producer ethylene-1, fossil polymer-grade ethylene from a steam cracker, as acetaldehyde-1, ethanol-1 and ethylene-glycol-1 link it. The other producer of the slug, bio-ethylene-1, makes biogenic ethylene from bio-ethanol, which the fossil-fed European plants of this dataset (the eco-profile takes their ethylene from steam crackers) do not use, so ethylene-1 is chosen rather than left open as in ethylbenzene-1. ethylene-1 cracks ethane, while these plants are mostly fed by naphtha crackers: a technology difference, not a grade difference"}
  "feed:steam": {use: steam-heat, source: "the source's net thermal energy, counted as steam heat delivered (kWh), as ethylbenzene-1 counts its steam"}
