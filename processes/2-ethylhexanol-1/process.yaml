  # liquid fuel, a gap) carry no chemical: the registry has no slug for an oxo heavies mixture.
  utilities:
    - {chemical: steam, role: utility, inventory_key: "feed:MPS", note: "0.479 kWh/kg of MP steam 1500 kPa(a): E-301 and the reboilers of C-401 to C-403; R-101's heat covers C-102's reboiler and R-301's LP steam R-302's feed heater"}
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "0.032 kWh/kg: the two cycle-gas compressors, the pumps and the vacuum pumps of the four vacuum columns"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "1.39 kWh/kg removed by cooling water: the condensers and coolers and R-101's trim cooler"}
