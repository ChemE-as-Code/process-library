    - {chemical: synthesis-gas, role: feedstock, inventory_key: "feed:SYN", note: "Synthesis gas 50 mol% H2, 49 mol% CO, 1 mol% inerts (ASSUMED), 0.530 kg/kg; no library producer of this grade (a gap)"}
    - {chemical: hydrogen, role: feedstock, inventory_key: "feed:H2F", note: "Hydrogen 99.9 mol% (hydrogen-1), 0.034 kg/kg, for the two hydrogenation stages"}
    - {chemical: sodium-hydroxide, role: reactant, inventory_key: "feed:NAOH", note: "Caustic soda 50 wt% (chlor-alkali-1), 3.9 g/kg of solution, the aldol catalyst's make-up"}
    - {chemical: water, role: utility, inventory_key: "feed:DMW", note: "Demineralised make-up water of the aqueous catalyst phase, 0.012 kg/kg"}
  outputs:
    - {chemical: 2-ethylhexanol, role: main-product, inventory_key: "product:EHP", note: "2-Ethylhexanol, modelled 99.98 wt%, to storage"}
    - {chemical: isobutyraldehyde, role: co-product, inventory_key: "product:IBAL", note: "Isobutanal 99.9 wt% from C-102's overhead, 0.059 kg/kg; mass allocation, 5.5 % of the burdens"}
    - {chemical: n-butanol, role: by-product, inventory_key: "product:LIGHTS", note: "Light ends, 86 wt% n-butanol and 10 wt% isobutanol with 2 wt% 2-ethylhexanol, 0.023 kg/kg, to the site's liquid fuel (a gap)"}
    - {chemical: carbon-monoxide, role: waste, inventory_key: "product:OFFGAS", note: "Oxo purge, C-102 vent and hydrogenation purge (39 wt% CO, 27 % inerts, 20 % propane, 8 % hydrogen), 0.039 kg/kg, to the site's fuel gas (a gap)"}
    - {chemical: wastewater, role: waste, inventory_key: "product:WW", note: "Aqueous effluent (the aldol caustic purge with 1.3 wt% NaOH and the decanted water), 0.154 kg/kg, to neutralisation and biological treatment"}
    - {chemical: steam, role: co-product, inventory_key: "product:LPSX", note: "LP steam 300 kPa(a) raised in R-301, 0.249 kWh/kg exported after the plant's own users; no burden and no credit (D-010)"}
