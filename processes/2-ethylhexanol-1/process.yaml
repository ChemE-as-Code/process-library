# Process Atlas manifest of 2-ethylhexanol-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: 2-ethylhexanol-1
title: 2-Ethylhexanol by propylene hydroformylation (aqueous Rh), aldol condensation and hydrogenation (120 kt/a)
summary: >-
  A continuous oxo-alcohol plant: propylene and synthesis gas react over a water-soluble rhodium
  catalyst to n- and isobutanal, a 100-plate column splits them, n-butanal condenses with
  aqueous caustic to 2-ethylhexenal, which is hydrogenated over Cu and then Ni and distilled.
  Concept stage, 120 kt/a, the loops solved by core's design specifications, preliminary LCI.
description: |
  Propylene, carbon monoxide and hydrogen react in a stirred reactor whose catalyst is rhodium
  with the water-soluble ligand TPPTS in an aqueous phase, as in Ruhrchemie's US 4 684 750 A:
  5 MPa, 393 K, CO/H2 about 1:1, about 30 min. The crude holds 94.0 wt% n-butanal, 5.0 wt%
  isobutanal and 1.0 wt% heavies (the patent's figures). The aqueous catalyst phase is decanted
  and returned to the reactor; the propylene dissolved in the crude is stripped back by the fresh
  synthesis gas (US 4 523 036 A), and 5 % of the cycle gas is purged. A column of 100
  theoretical plates at 50-80 kPa(a) takes 99.9 wt% isobutanal overhead, a co-product; its
  reboiler takes the reactor's heat. n-Butanal condenses with 1.5 wt% aqueous caustic at 413 K
  in a mixing section; at 333 K the phases separate, 90 % of the caustic phase returns and the
  rest is purged, and the organic phase holds 95 wt% 2-ethylhexenal. It is hydrogenated in the
  gas phase over copper (423-433 K, the heat raising LP steam) and then in the liquid phase over
  nickel at 2.3 MPa, and three columns take off the light ends, the product and the heavies.

  The material balance is solved by cheme-as-code (core ADRs 0060, 0070). Design
  specifications set the propylene, synthesis gas, water make-up, caustic and hydrogen feeds; six
  recycles are tear streams; the separators are component splits (`recovery:`, ASSUMED inside
  the patents' purities). The plant yields 97.73 % of theory on n-butanal, the 97.74 % of
  US 4 684 750 A. Per kg of 2-ethylhexanol: 0.713 kg propylene, 0.530 kg synthesis gas,
  0.034 kg hydrogen, 0.059 kg isobutanal co-produced; 0.48 kWh of MP steam, 1.39 kWh to
  cooling water. See DESIGN.md for every assumption.
families: [oxygenates]
keywords: [2-ethylhexanol, 2-EH, oxo alcohol, oxo process, hydroformylation, propylene, synthesis gas, rhodium, TPPTS, aqueous biphasic catalysis, Ruhrchemie/Rhone-Poulenc, n-butanal, butyraldehyde, isobutyraldehyde, aldol condensation, 2-ethylhexenal, sodium hydroxide, hydrogenation, copper catalyst, nickel catalyst, distillation, plasticiser alcohol, design specification, recycle]
facets:
  feedstock_basis: [fossil, electricity]
  product_classes: [chemicals]
  unit_operations: [reaction, distillation, separation, compression, stripping]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, the per-pass conversion,
# the separators' splits, the purges, the temperatures and the duties' basis are assumed; the
# route, conditions, compositions and the overall yield from the patents (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept continuous PFD with closed mass, component and element balances (cheme validate,
    cheme process streams: 5 blocks and 31 steps within tolerance). cheme process propagate
    solves the feeds with five design specifications (120 kt/a of 2-ethylhexanol; 1.5 mol CO
    per mol propylene in R-101's feed; 1.0 wt% water in the crude; 1.5 wt% NaOH in the aldol's
    aqueous phase, from US 4 684 750 A; 90 mol% hydrogen in R-301's vapour feed) together with
    six tear streams (the strip gas S3, the oxo cycle gas S11, the caustic S19, the hydrogen
    cycle gas S33, the second stage's hydrogen S38, the after-run S43), the conversion steps
    and nine component separators with ASSUMED splits inside the purities of US 4 684 750 A.
    scripts/balance.py gives every duty and power on a formation-enthalpy basis with constant
    heat capacities (chemicals 1.5.2 and thermo 0.6.1, single facts; no property package of
    core covers these liquids), the C-102 boil-up from Underwood's minimum reflux, the
    outlet temperatures of the mixers, the compressors and the adiabatic V-101 and C-101, and
    checks that every step's energy balance closes. Preliminary gate-to-gate LCI with mass
    allocation between 2-ethylhexanol and isobutanal; in the Atlas build the propylene,
    hydrogen and caustic soda are linked to propylene-pdh-1, hydrogen-1 and chlor-alkali-1, the
    MP steam counted as heat, the make-up water as deionised water, and electricity, cooling
    water and the effluent's treatment through the shared proxies; the synthesis gas (no
    library producer of a 1:1 H2/CO gas), the off-gas, the light ends and the heavies to fuel
    are the gaps. The rhodium and ligand make-up and the hydrogenation catalysts are open inputs
    (no open rate). No thermal screening by core applies to continuous conversion reactors
    without kinetics; the hazards are in DESIGN.md D-008. cheme maturity reaches no level
    (assumed splits); the claim `maturity: concept` is the lowest value of the schema, not an
    evidenced level. Not reviewed. Needs cheme-as-code 1.13.0.
