# The equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps,
# with the sizes the balance gives. Design pressures, temperatures and materials are not set yet
# (basic engineering); materials named are usual choices, to be confirmed. All values ASSUMED
# unless a source is named (DESIGN.md).
schema: cheme/equipment/v1
equipment:
  - {tag: R-101, type: StirredTankReactor, service: "Hydroformylation reactor: stirred, aqueous Rh/TPPTS catalyst phase, synthesis gas and propylene at 5 MPa and 393 K, internal cooling register",
     notes: "As US 4 684 750 A's example (SRC-1): about 400 mg Rh per litre of the aqueous catalyst solution with TPPTS, 50 bar CO/H2, 115-125 C, about 30 min, 8.75 volumes of catalyst solution per volume of liquid propylene and hour. At 10.7 t/h of propylene (21.2 m3/h at 506 kg/m3, thermo's HEOS fit) that is about 185 m3/h of catalyst solution and about 105 m3 of liquid in the reactor (ASSUMED one or two vessels, D-004), so about 40 kg of rhodium in the reactor's catalyst phase. The cooling register takes 9.68 MW (Q1) to C-102's reboiler (US 4 523 036 A, SRC-2). R-101 holds the heavies-forming step R102 too. Stainless steel (to be confirmed)."}
  - {tag: V-101, type: Vessel, service: "Phase separator after R-101: gas, crude aldehyde and the aqueous catalyst phase returned to R-101",
     notes: "Separated uncooled (SRC-2); the catalyst phase circulates between R-101 and V-101 and is not a flowsheet stream (L-3)."}
  - {tag: C-101, type: Column, service: "Crude stripper: the dissolved propylene stripped by the fresh synthesis gas in countercurrent",
     notes: "As US 4 523 036 A (SRC-2); 99.5 % of the dissolved propylene and propane back to R-101 with the synthesis gas (ASSUMED split, D-004)."}
  - {tag: K-101, type: Compressor, service: "Oxo cycle-gas compressor",
     notes: "9.8 t/h from 4950 to 5100 kPa(a), 20 kW (P1, isentropic efficiency 0.75, drive 0.95, ASSUMED); 5 % of the cycle gas purged ahead of it to the fuel gas (X101, D-004)."}
  - {tag: C-102, type: Column, service: "n/iso-Butanal column with overhead decanter, 100 theoretical plates at 50-80 kPa(a)",
     notes: "As US 4 684 750 A's example (SRC-1): head 60-70 C, bottom 90-100 C, overhead 99.9 wt% isobutanal, bottoms 0.2 wt% isobutanal. Reflux 50 (1.1 x Underwood's minimum 45.5 at a relative volatility of 1.43, thermo's vapour pressures; ASSUMED, D-004); reboiler 11.09 MW, 9.68 MW from R-101 (Q1), 1.41 MW from R-301's LP steam (Q2); condenser 11.30 MW to cooling water (Q5)."}
  - {tag: P-201, type: Pump, service: "Aldol mixing pump: n-butanal, caustic make-up and the recycled aqueous phase",
     notes: "As SRC-1: a mixing pump with a downstream mixing section; 34.8 t/h. The plant's pumps together 150 kW (P3, ASSUMED)."}
  - {tag: R-201, type: TubularReactor, service: "Aldol reactor: mixing section at 413 K and 500 kPa(a), about 3 min",
     notes: "As US 4 684 750 A (SRC-1): 130-150 C, 0.1-0.7 MPa, 1-3 min, 1-2 wt% NaOH. About 1.9 m3 at 3 min for 38 m3/h (ASSUMED densities, D-005). The reaction heat (68.7 kJ/mol) takes the feed from 345 to 413 K; the small surplus, 0.11 MW, to cooling water (Q6). A feed/effluent exchanger would start it; not modelled."}
  - {tag: E-201, type: HeatExchanger, service: "Aldol product cooler to 333 K", notes: "2.48 MW to cooling water (Q7)."}
  - {tag: V-201, type: Vessel, service: "Aldol decanter at 333 K: organic 2-ethylhexenal phase and aqueous caustic phase",
     notes: "SRC-1 separates at about 60 C; 90 % of the aqueous phase back to P-201 (X201, ASSUMED), 10 % purged to biological treatment (1.6 t/h with 1.5 wt% NaOH, D-005)."}
  - {tag: E-301, type: HeatExchanger, service: "Vaporiser and superheater of the first-stage hydrogenation feed on MP steam",
     notes: "The crude 2-ethylhexenal vaporised into the hydrogen cycle gas, 341 to 423 K at 400 kPa(a), 3.27 MW (Q8); 2-ethylhexenal at 7.3 mol% is below its dew point (thermo's vapour pressure, D-006)."}
  - {tag: R-301, type: TubularReactor, service: "First-stage hydrogenation: gas phase over Cu/SiO2, multitubular, 423-433 K, raising LP steam",
     notes: "As US 4 684 750 A (SRC-1): about 60 % Cu on silica, 140-160 C, LHSV 0.4 (most preferably 0.35-0.45), 0.05-0.5 MPa; about 46 m3 of catalyst for 15.3 t/h of liquid at about 0.83 t/m3 (ASSUMED density). 4.91 MW raise LP steam at 300 kPa(a) (Q2, Q3, Q4)."}
  - {tag: E-302, type: HeatExchanger, service: "First-stage product condenser", notes: "433 to 313 K, 4.45 MW to cooling water (Q9)."}
  - {tag: V-301, type: Vessel, service: "First-stage separator", notes: "Hydrogen cycle gas off the top, 1 % of it purged to the fuel gas (X301, ASSUMED)."}
  - {tag: K-301, type: Compressor, service: "Hydrogenation cycle-gas compressor",
     notes: "3.0 t/h from 360 to 440 kPa(a), 250 kW (P2, isentropic efficiency 0.75, drive 0.95, ASSUMED)."}
  - {tag: P-301, type: Pump, service: "Second-stage feed pump", notes: "The first-stage liquid to 2.4 MPa(a); the fresh hydrogen joins it."}
  - {tag: R-302, type: TubularReactor, service: "Second-stage hydrogenation: liquid phase over Ni/SiO2, trickle bed, 2.3 MPa(a), 393-395 K, with its feed heater",
     notes: "As US 4 684 750 A (SRC-1): Ni 55-60 %, 120-140 C, 2-2.5 MPa, LHSV 0.8-1.1; about 20 m3 of catalyst at LHSV 0.9 (ASSUMED density as R-301). The feed heater takes 1.17 MW of R-301's LP steam (Q3)."}
  - {tag: V-302, type: Vessel, service: "Second-stage separator: excess hydrogen let down to the first stage", notes: "D-006."}
  - {tag: C-401, type: Column, service: "Light-ends column with overhead decanter (water, butanols)",
     notes: "SRC-1's first column; 60 kPa(a) at the bottom, reflux 3 (ASSUMED); reboiler 1.28 MW on MP steam (Q10), condenser 0.76 MW (Q11)."}
  - {tag: C-402, type: Column, service: "2-Ethylhexanol column: pure product overhead at 20 kPa(a)",
     notes: "SRC-1's second column; reflux 1 (ASSUMED); reboiler 2.92 MW on MP steam (Q12), condenser 3.30 MW (Q13)."}
  - {tag: E-401, type: HeatExchanger, service: "Product cooler", notes: "409 to 313 K, 1.18 MW (Q14); 15.0 t/h of 2-ethylhexanol, 99.98 wt% as modelled."}
  - {tag: C-403, type: Column, service: "After-run column: reusable 2-ethylhexanol back to C-402, heavies out",
     notes: "SRC-1's third column; 30 kPa(a), reflux 1 (ASSUMED); reboiler 0.10 MW (Q15), condenser and heavies cooler 0.12 MW (Q16)."}
