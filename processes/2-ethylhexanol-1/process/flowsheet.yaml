# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# 2-Ethylhexanol by propylene hydroformylation (aqueous Rh/TPPTS), aldol condensation of
# n-butanal and two-stage hydrogenation, 120 kt/a (DESIGN.md D-001, D-002). Where the values
# come from:
# - the feeds' compositions are the library producers' products or ASSUMED grades (D-003);
#   their flows are solved by core's design specifications (`specs:`, core ADR 0070) for the
#   product rate, the reactor feed, the crude's water, the caustic's strength and the
#   hydrogenation gas;
# - the conversion steps take the fractions of process/reactions.yaml (D-004 to D-006); the
#   separators' splits (`recovery:`) and the splitters are ASSUMED design specifications inside
#   what US 4 684 750 A and US 4 523 036 A state (SRC-1, SRC-2), D-004 to D-007;
# - the oxo cycle gas, the aldol caustic, the hydrogenation cycle gas, the hydrogen cascade and
#   the after-run are torn (S11, S19, S33, S38, S43, core ADR 0060) and solved together with the
#   specifications by `cheme process propagate --fill`, which writes every flow and composition
#   but the feeds' compositions;
# - temperatures and pressures are ASSUMED design values inside the sources' ranges (D-004 to
#   D-007); the adiabatic mixers' outlet temperatures, every duty and every power come from
#   scripts/balance.py (D-009, balance-output contract of library ADR 0027), which reads the
#   propagated streams.
schema: cheme/process/v1
kind: flowsheet
title: 2-Ethylhexanol by propylene hydroformylation, aldol condensation and hydrogenation (120 kt/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - id: design
    description: "Design case: 120 kt/a 2-ethylhexanol (15 t/h in 8000 h), the route and yields of US 4 684 750 A (D-002)"
    default: true
    capacity: 15 t/h 2-ethylhexanol
    provenance: assumed
    source: "D-002: a normalisation basis for the inventory, not a commercial plant claim"
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h
tears:
  - stream: S3
    initial: {flow: 15800, unit: kg/h, basis: mole_fraction, composition: {C3H6: 0.03067, C3H8: 0.2083, CO: 0.3742, H2: 0.37039, N2: 0.01254, NBAL: 0.00346, IBAL: 0.00028, H2O: 0.00016}}
  - stream: S11
    initial: {flow: 9960, unit: kg/h, basis: mole_fraction, composition: {C3H6: 0.01404, C3H8: 0.09551, CO: 0.27324, H2: 0.1501, N2: 0.45277, NBAL: 0.01287, IBAL: 0.00087, H2O: 0.00059}}
  - stream: S19
    initial: {flow: 15279, unit: kg/h, basis: mole_fraction, composition: {NBAL: 0.00004, H2O: 0.9905, NAOH: 0.0094, EPA: 0.00006}}
  - stream: S33
    initial: {flow: 10685, unit: kg/h, basis: mole_fraction, composition: {H2: 0.99399, N2: 0.00601}}
  - stream: S38
    initial: {flow: 595, unit: kg/h, basis: mole_fraction, composition: {H2: 0.99899, N2: 0.00101}}
  - stream: S43
    initial: {flow: 466, unit: kg/h, basis: mole_fraction, composition: {EH: 0.97507, BUBU: 0.02493}}
convergence: {method: wegstein, max_iterations: 300}
specs:
  - id: rate
    vary: {stream: S1, initial: 10700}
    target: {stream: S46, component: EH, quantity: annual, value: 120000, unit: t, hours: 8000}
    provenance: assumed
    source: "D-002: 120 kt/a of 2-ethylhexanol in 8000 h, ASSUMED normalisation basis"
  - id: syngas
    vary: {stream: S2, initial: 8000}
    target: {stream: S5, component: CO, quantity: ratio, per: {stream: S5, component: C3H6}, basis: mole, value: 1.5}
    provenance: assumed
    source: "D-004: 1.5 mol CO per mol propylene in R-101's feed, ASSUMED (no open source read gives the gas composition of the aqueous Rh process); the synthesis gas follows from it"
  - id: water
    vary: {stream: S4, initial: 200}
    target: {stream: S13, component: H2O, quantity: fraction, basis: mass, value: 0.01}
    provenance: assumed
    source: "D-004: the crude leaves the catalyst phase with 1.0 wt% dissolved water, ASSUMED; the water make-up S4 replaces it"
  - id: caustic
    vary: {stream: S18, initial: 70}
    target: {stream: S23, component: NAOH, quantity: fraction, basis: mass, value: 0.015}
    provenance: given
    source: "US 4 684 750 A (SRC-1), aldol example: the aqueous phase holds about 1-2 wt% NaOH; 1.5 wt% taken (D-005)"
  - id: hydrogen
    vary: {stream: S35, initial: 600}
    target: {stream: S27, component: H2, quantity: fraction, basis: mole, value: 0.90}
    provenance: assumed
    source: "D-006: 90 mol% hydrogen in R-301's vapour feed, ASSUMED, so that 2-ethylhexenal stays below its dew point at 423 K and 400 kPa(a)"

feeds:
  - {id: C3, title: "Propylene (chemical grade, propylene-pdh-1)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: SYN, title: "Synthesis gas H2/CO 1:1", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: DMW, title: "Demineralised water, catalyst-phase make-up", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NAOH, title: "Caustic soda 50 wt% (chlor-alkali-1)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: H2F, title: "Hydrogen 99.9 mol% (hydrogen-1)", category: raw_material, ports: [{id: out, direction: out}]}
  - id: MPS
    title: MP steam 1500 kPa(a)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1500, provenance: assumed, source: "design basis, D-009"}
      supply_temperature: {value: 471.4, provenance: assumed, source: "saturation at 1500 kPa(a) (IAPWS-97), D-009"}
    ports:
      - {id: e301, direction: out, kind: energy}
      - {id: c401, direction: out, kind: energy}
      - {id: c402, direction: out, kind: energy}
      - {id: c403, direction: out, kind: energy}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: k101, direction: out, kind: energy}
      - {id: k301, direction: out, kind: energy}
      - {id: pumps, direction: out, kind: energy}
products:
  - {id: EHP, title: 2-Ethylhexanol to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: IBAL, title: Isobutanal to storage, category: by_product, ports: [{id: in, direction: in}]}
  - {id: LIGHTS, title: Light ends (butanols) to the site's fuel, category: by_product, ports: [{id: in, direction: in}]}
  - {id: HVY, title: Heavy ends to the site's fuel, category: by_product, ports: [{id: in, direction: in}]}
  - {id: OFFGAS, title: Purge and vent gases to the site's fuel gas, category: off_gas, ports: [{id: in, direction: in}]}
  - {id: WW, title: Aqueous effluent to biological treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - id: LPSX
    title: LP steam 300 kPa(a) raised in R-301, surplus to the site's header
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 300, provenance: assumed, source: "design basis, D-009"}
      supply_temperature: {value: 406.7, provenance: assumed, source: "saturation at 300 kPa(a) (IAPWS-97), D-009"}
    ports:
      - {id: r301, direction: in, kind: energy}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-009"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-009"}
    ports:
      - {id: c102, direction: in, kind: energy}
      - {id: r201, direction: in, kind: energy}
      - {id: e201, direction: in, kind: energy}
      - {id: e302, direction: in, kind: energy}
      - {id: c401, direction: in, kind: energy}
      - {id: c402, direction: in, kind: energy}
      - {id: e401, direction: in, kind: energy}
      - {id: c403, direction: in, kind: energy}

blocks:
  - id: OXO
    title: Hydroformylation (aqueous Rh/TPPTS), syngas stripping and n/iso-butanal separation
    class: ReactingChemicals
    ports:
      - {id: c3, direction: in}
      - {id: syn, direction: in}
      - {id: dmw, direction: in}
      - {id: purge, direction: out}
      - {id: vent, direction: out}
      - {id: iso, direction: out}
      - {id: aq, direction: out}
      - {id: nbal, direction: out}
      - {id: lp, direction: in, kind: energy}
      - {id: pw, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: ALD
    title: Aldol condensation with aqueous caustic and phase separation
    class: ReactingChemicals
    ports:
      - {id: nbal, direction: in}
      - {id: naoh, direction: in}
      - {id: purge, direction: out}
      - {id: org, direction: out}
      - {id: pw, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
  - id: HYD
    title: Two-stage hydrogenation (gas phase over Cu, liquid phase over Ni)
    class: ReactingChemicals
    ports:
      - {id: org, direction: in}
      - {id: h2, direction: in}
      - {id: purge, direction: out}
      - {id: crude, direction: out}
      - {id: lp, direction: out, kind: energy}
      - {id: lpx, direction: out, kind: energy}
      - {id: mp, direction: in, kind: energy}
      - {id: pw, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: DIS
    title: Distillation (light ends, 2-ethylhexanol, after-run columns)
    class: Distilling
    ports:
      - {id: crude, direction: in}
      - {id: aq, direction: out}
      - {id: lights, direction: out}
      - {id: eh, direction: out}
      - {id: hvy, direction: out}
      - {id: mp1, direction: in, kind: energy}
      - {id: mp2, direction: in, kind: energy}
      - {id: mp3, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: cw3, direction: out, kind: energy}
      - {id: cw4, direction: out, kind: energy}
  - id: COL
    title: Off-gas and effluent collection
    class: Mixing
    ports:
      - {id: oxo, direction: in}
      - {id: c102, direction: in}
      - {id: hyd, direction: in}
      - {id: offgas, direction: out}
      - {id: wc102, direction: in}
      - {id: wald, direction: in}
      - {id: wc401, direction: in}
      - {id: ww, direction: out}

steps:
  # ---------------------------------------------------------------- hydroformylation (D-004)
  - id: M101
    block: OXO
    title: Reactor gas feed (propylene, strip gas with the synthesis gas, cycle gas, water make-up)
    class: Mixing
    ports:
      - {id: c3, direction: in, delegates: c3}
      - {id: strip, direction: in}
      - {id: rec, direction: in}
      - {id: dmw, direction: in, delegates: dmw}
      - {id: out, direction: out}
  - id: R101
    block: OXO
    title: Hydroformylation reactor (stirred, aqueous Rh/TPPTS catalyst phase, 5 MPa, 393 K)
    class: ReactingChemicals
    reactions: [HYN, HYI, HYD]
    reactor: conversion
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy}
  - id: R102
    block: OXO
    title: Heavies formed in R-101 (second conversion step of the same vessel)
    class: ReactingChemicals
    reactions: [TISH]
    reactor: conversion
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy}
  - id: V101
    block: OXO
    title: Phase separator (gas, crude aldehyde; the catalyst phase returns to R-101)
    class: Separating
    recovery:
      outlets:
        gas: {C3H6: 0.2, C3H8: 0.2, CO: 0.97, H2: 0.99, N2: 0.98, NBAL: 0.02, IBAL: 0.025, H2O: 0.02}
      provenance: assumed
      source: "D-004: ASSUMED split; US 4 523 036 A (SRC-2) separates the crude uncooled with much propylene dissolved in it and strips it with the synthesis gas; the aqueous catalyst phase is decanted and returned inside R-101/V-101 (not a stream, L-3)"
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out}
      - {id: liq, direction: out}
  - id: C101
    block: OXO
    title: Crude stripper (dissolved propylene stripped by the fresh synthesis gas)
    class: Absorbing
    recovery:
      outlets:
        gas: {C3H6: 0.995, C3H8: 0.995, CO: 1.0, H2: 1.0, N2: 1.0, NBAL: 0.01, IBAL: 0.015, H2O: 0.01}
      provenance: assumed
      source: "D-004: ASSUMED split; US 4 523 036 A (SRC-2): the dissolved olefin is stripped from the uncooled crude by synthesis gas in countercurrent and returns to the reactor"
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: liq, direction: in}
      - {id: syn, direction: in, delegates: syn}
      - {id: gas, direction: out}
      - {id: bot, direction: out}
  - id: X101
    block: OXO
    title: Oxo cycle-gas purge
    class: SplittingMaterial
    split: {purge: 0.05}
    ports:
      - {id: in, direction: in}
      - {id: purge, direction: out, delegates: purge}
      - {id: out, direction: out}
  - id: K101
    block: OXO
    title: Oxo cycle-gas compressor
    class: Compressing
    links: [{target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: pw, direction: in, kind: energy, delegates: pw}
  - id: C102
    block: OXO
    title: n/iso-Butanal column (100 theoretical plates, 50-80 kPa(a)) with overhead decanter
    class: Distilling
    recovery:
      outlets:
        vent: {C3H6: 1.0, C3H8: 1.0, CO: 1.0, H2: 1.0, N2: 1.0}
        iso: {IBAL: 0.962, NBAL: 0.0000512}
        aq: {H2O: 1.0}
      provenance: assumed
      source: "D-004: ASSUMED split for the purities of US 4 684 750 A (SRC-1): overhead 99.9 wt% isobutanal and 0.1 wt% n-butanal, bottoms 0.2 wt% isobutanal; the dissolved gases to the vent, the water decanted from the overhead"
    links: [{target: equipment, ref: C-102}]
    ports:
      - {id: in, direction: in}
      - {id: vent, direction: out, delegates: vent}
      - {id: iso, direction: out, delegates: iso}
      - {id: aq, direction: out, delegates: aq}
      - {id: bot, direction: out, delegates: nbal}
      - {id: rx, direction: in, kind: energy}
      - {id: rx2, direction: in, kind: energy}
      - {id: lp, direction: in, kind: energy, delegates: lp}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  # ---------------------------------------------------------------- aldol condensation (D-005)
  - id: M201
    block: ALD
    title: Mixing pump (n-butanal, caustic make-up, recycled aqueous phase)
    class: Mixing
    links: [{target: equipment, ref: P-201}]
    ports:
      - {id: nbal, direction: in, delegates: nbal}
      - {id: naoh, direction: in, delegates: naoh}
      - {id: rec, direction: in}
      - {id: out, direction: out}
      - {id: pw, direction: in, kind: energy, delegates: pw}
  - id: R201
    block: ALD
    title: Aldol reactor (mixing section, 413 K, about 3 min)
    class: ReactingChemicals
    reactions: [ALD, TISH2]
    reactor: conversion
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: E201
    block: ALD
    title: Aldol product cooler to 333 K
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  - id: V201
    block: ALD
    title: Aldol decanter (organic 2-ethylhexenal phase, aqueous caustic phase)
    class: Separating
    recovery:
      outlets:
        aq: {NAOH: 1.0, H2O: 0.99, NBAL: 0.01, EPA: 0.0005}
      provenance: assumed
      source: "D-005: ASSUMED split; US 4 684 750 A (SRC-1) separates the phases at about 60 C; the organic phase keeps some water, the aqueous phase dissolves a little aldehyde"
    links: [{target: equipment, ref: V-201}]
    ports:
      - {id: in, direction: in}
      - {id: aq, direction: out}
      - {id: org, direction: out, delegates: org}
  - id: X201
    block: ALD
    title: Aqueous phase recycle and purge
    class: SplittingMaterial
    split: {purge: 0.10}
    ports:
      - {id: in, direction: in}
      - {id: purge, direction: out, delegates: purge}
      - {id: rec, direction: out}
  # ---------------------------------------------------------------- hydrogenation (D-006)
  - id: M301
    block: HYD
    title: 2-Ethylhexenal with the cycle hydrogen and the hydrogen from the second stage
    class: Mixing
    ports:
      - {id: org, direction: in, delegates: org}
      - {id: rec, direction: in}
      - {id: h2, direction: in}
      - {id: out, direction: out}
  - id: E301
    block: HYD
    title: Vaporiser and superheater of the first-stage feed
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-301}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: mp, direction: in, kind: energy, delegates: mp}
  - id: R301
    block: HYD
    title: First-stage hydrogenation, gas phase over Cu (fixed bed, 423-433 K)
    class: ReactingChemicals
    reactions: [HEPA, HNB, HIB]
    reactor: conversion
    links: [{target: equipment, ref: R-301}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: c102, direction: out, kind: energy, delegates: lp}
      - {id: r302, direction: out, kind: energy}
      - {id: exp, direction: out, kind: energy, delegates: lpx}
  - id: E302
    block: HYD
    title: First-stage product condenser
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-302}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: V301
    block: HYD
    title: First-stage separator
    class: Separating
    recovery:
      outlets:
        gas: {H2: 1.0, N2: 1.0}
      provenance: assumed
      source: "D-006: ASSUMED split; the condensed organics leave as liquid, hydrogen and inerts as gas (their solution in the liquid not modelled)"
    links: [{target: equipment, ref: V-301}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out}
      - {id: liq, direction: out}
  - id: X301
    block: HYD
    title: Hydrogenation cycle-gas purge
    class: SplittingMaterial
    split: {purge: 0.01}
    ports:
      - {id: in, direction: in}
      - {id: purge, direction: out, delegates: purge}
      - {id: out, direction: out}
  - id: K301
    block: HYD
    title: Hydrogenation cycle-gas compressor
    class: Compressing
    links: [{target: equipment, ref: K-301}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: pw, direction: in, kind: energy, delegates: pw}
  - id: M302
    block: HYD
    title: First-stage product with the fresh hydrogen (second-stage feed)
    class: Mixing
    links: [{target: equipment, ref: P-301}]
    ports:
      - {id: liq, direction: in}
      - {id: h2, direction: in, delegates: h2}
      - {id: out, direction: out}
  - id: R302
    block: HYD
    title: Second-stage hydrogenation, liquid phase over Ni (trickle bed, 2.3 MPa, 393-403 K)
    class: ReactingChemicals
    reactions: [HEPA, HNB, HIB]
    reactor: conversion
    links: [{target: equipment, ref: R-302}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: lp, direction: in, kind: energy}
  - id: V302
    block: HYD
    title: Second-stage separator (excess hydrogen let down to the first stage)
    class: Separating
    recovery:
      outlets:
        gas: {H2: 1.0, N2: 1.0}
      provenance: assumed
      source: "D-006: ASSUMED split, as V301"
    links: [{target: equipment, ref: V-302}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out}
      - {id: liq, direction: out, delegates: crude}
  # ---------------------------------------------------------------- distillation (D-007)
  - id: C401
    block: DIS
    title: Light-ends column with overhead decanter
    class: Distilling
    recovery:
      outlets:
        aq: {H2O: 0.98}
        lights: {H2O: 0.02, NBAL: 1.0, IBAL: 1.0, NBOL: 0.995, IBOL: 0.998, EH: 0.0005}
      provenance: assumed
      source: "D-007: ASSUMED split; US 4 684 750 A (SRC-1): the first column takes the compounds boiling below 2-ethylhexanol overhead; the water decanted"
    links: [{target: equipment, ref: C-401}]
    ports:
      - {id: in, direction: in, delegates: crude}
      - {id: aq, direction: out, delegates: aq}
      - {id: lights, direction: out, delegates: lights}
      - {id: bot, direction: out}
      - {id: mp, direction: in, kind: energy, delegates: mp1}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: M402
    block: DIS
    title: 2-Ethylhexanol column feed (light-ends bottoms and the after-run)
    class: Mixing
    ports:
      - {id: c401, direction: in}
      - {id: rec, direction: in}
      - {id: out, direction: out}
  - id: C402
    block: DIS
    title: 2-Ethylhexanol column (pure product overhead)
    class: Distilling
    recovery:
      outlets:
        top: {EH: 0.97, NBOL: 1.0, IBOL: 1.0, EPA: 1.0, H2O: 1.0, BUBU: 0.002}
      provenance: assumed
      source: "D-007: ASSUMED split; US 4 684 750 A (SRC-1): the second column takes pure 2-ethylhexanol overhead; the heavies (butyl butyrate standing for them) stay at the bottom"
    links: [{target: equipment, ref: C-402}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out}
      - {id: bot, direction: out}
      - {id: mp, direction: in, kind: energy, delegates: mp2}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  - id: E401
    block: DIS
    title: Product cooler
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-401}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: eh}
      - {id: cw, direction: out, kind: energy, delegates: cw3}
  - id: C403
    block: DIS
    title: After-run column (reusable 2-ethylhexanol back, heavies out)
    class: Distilling
    recovery:
      outlets:
