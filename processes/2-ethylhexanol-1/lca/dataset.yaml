title: 2-Ethylhexanol by propylene hydroformylation, aldol condensation and hydrogenation (120 kt/a)
description: Unallocated foreground LCI of 2-Ethylhexanol by propylene hydroformylation, aldol condensation
  and hydrogenation (120 kt/a), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: Propylene hydroformylation at 5 MPa and 393 K with an aqueous Rh/TPPTS catalyst phase (US
  4 684 750 A), the dissolved propylene stripped by the synthesis gas (US 4 523 036 A), n/iso-butanal
  column of 100 theoretical plates at 50-80 kPa(a) with the reactor's heat in its reboiler; aldol condensation
  with 1.5 wt% aqueous NaOH at 413 K and phase separation at 333 K; hydrogenation in the gas phase over
  Cu at 423-433 K raising LP steam and in the liquid phase over Ni at 2.3 MPa; light-ends, product and
  after-run columns; 120 kt/a in 8000 h, yield 97.73 % of theory on n-butanal
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
