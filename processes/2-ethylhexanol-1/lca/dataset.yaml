  deviation: The isobutanal is allocated by mass though it carries only the oxo step and the n/iso column
    (not the aldol, hydrogenation and distillation that only the n-butanal sees), which puts slightly
    too much burden on it; no co-product prices are sourced for the WBCSD price test. The library hierarchy
