# Equipment list. Schema: `cheme schema equipment`.
# Concept stage: the items the PFD (process/flowsheet.yaml) needs, no P&ID yet (no sheet).
# Duties and flows from scripts/balance.py (D-006). Design pressure and temperature are ASSUMED
# concept values (D-012): highest operating value + 10 % (at least + 2 bar g, vacuum where it
# applies) and + 25 K. Materials follow the service split of D-011 (wet Cl2 titanium or lined,
# dry Cl2 carbon steel, strong caustic nickel); all ASSUMED, to be confirmed by a materials
# engineer. Sizes and weights come at basic engineering (datasheets).
schema: cheme/equipment/v1
equipment:
  # ---- brine saturation and primary purification (BRN)
  - {tag: TK-101, type: Tank, service: Salt saturator (dissolver), design_pressure_barg: 2, design_temperature_degc: 105, material: "CS rubber-lined or FRP",
     notes: "Rock salt 21.4 t/h dissolved in return brine, process condensate and make-up water to 26 wt-% NaCl, 142 t/h at 55 degC (D-005). ASSUMED."}
  - {tag: R-101, type: Tank, service: "Brine treatment reactors (soda ash, caustic)",design_pressure_barg: 2, design_temperature_degc: 80, material: "CS rubber-lined",
     notes: "Ca as CaCO3 with Na2CO3 (+0.5 g/kg excess), Mg as Mg(OH)2 with NaOH (+0.3 g/kg excess), D-005. Residence time not sized. ASSUMED."}
  - {tag: S-101, type: Filter, service: Clarifier and brine filters, design_pressure_barg: 5, design_temperature_degc: 80, material: "CS rubber-lined / FRP",
     notes: "Solids 6.7 kg/t Cl2 leave as a 50 wt-% cake, 274 kg/h (D-005). Clarifier plus candle or pressure-leaf filters in practice; one item here. ASSUMED."}
  # ---- secondary purification and feed brine conditioning (POL)
  - {tag: X-201, type: Vessel, service: Chelating ion-exchange columns, design_pressure_barg: 6, design_temperature_degc: 85, material: "CS rubber-lined",
     notes: "Two or three columns in series with regeneration (HCl, NaOH, DMW rinse; D-005). Ca+Mg removal to the ppb level of BREF 2014 Table 2.4 not modelled (traces). ASSUMED."}
  - {tag: R-202, type: Tank, service: Feed brine acidification, design_pressure_barg: 5, design_temperature_degc: 80, material: "CS rubber-lined / FRP",
     notes: "HCl neutralises the excess carbonate (CO2 released, 29.5 kg/h) and hydroxide (D-005). ASSUMED."}
  - {tag: E-201, type: PlateHeatExchanger, service: Feed brine heater, design_pressure_barg: 10, design_temperature_degc: 205, material: "titanium plates",
     notes: "55 -> 70 degC, 1.96 MW from MP steam (3.5 t/h, D-010). ASSUMED."}
  # ---- electrolysis (ELY)
  - {tag: T-301, type: CustomEquipment, service: Transformer-rectifiers, material: "-",
     notes: "30.3 MW AC -> 29.4 MW DC, efficiency 0.97 (D-009, ASSUMED); number of rectifier units and DC circuits not chosen."}
  - {tag: EL-301, type: CustomEquipment, service: Bipolar membrane electrolysers, design_pressure_barg: 0.5, design_temperature_degc: 95, material: "anode side titanium, cathode side nickel, perfluorinated membrane",
     notes: "605 elements x 2.7 m2 at 6.0 kA/m2, 3.0 V, CE 0.965 (process/cells.yaml, D-004); split into electrolysers not chosen (vendor input). ASSUMED."}
  - {tag: E-302, type: PlateHeatExchanger, service: Catholyte cooler, design_pressure_barg: 6, design_temperature_degc: 115, material: "nickel",
     notes: "0.72 MW to cooling water: the cell heat not taken up by the feed brine and the gas saturation (D-006). ASSUMED."}
  # ---- dechlorination and purge (DCL)
  - {tag: C-401, type: ProcessColumn, service: Vacuum dechlorination tower, design_pressure_barg: 2, design_temperature_degc: 115, material: "titanium or FRP (wet chlorine, full vacuum)",
     notes: "Anolyte at pH ~2 under 55 kPa(a), residual Cl2 20 mg/kg (BREF 2014 2.5.4); recovered Cl2 to the wet Cl2 header (D-005). ASSUMED."}
  - {tag: R-402, type: Tank, service: Chemical dechlorination (sulfite) and neutralisation, design_pressure_barg: 5, design_temperature_degc: 110, material: "CS rubber-lined",
     notes: "Na2SO3 and NaOH destroy the residual Cl2 and neutralise the acid (D-005). ASSUMED."}
  # ---- chlorine treatment (CLT)
  - {tag: E-501, type: TubularHeatExchanger, service: "Wet chlorine coolers (cooling water, chilled water)",design_pressure_barg: 2, design_temperature_degc: 115, material: "titanium",
     notes: "90 -> 40 degC on cooling water (2.38 MW), 40 -> 20 degC on chilled water (0.15 MW); chlorine water condensate 3.65 t/h to C-401 (D-008). Two exchangers in practice. ASSUMED."}
  - {tag: C-502, type: ProcessColumn, service: Chlorine drying towers (sulfuric acid), design_pressure_barg: 2, design_temperature_degc: 55, material: "CS / PVC-FRP lined (strong sulfuric acid)",
     notes: "98 wt-% acid in, 75 wt-% out, 18.7 kg H2SO4/t Cl2 (D-008). ASSUMED."}
  - {tag: K-503, type: CentrifugalCompressor, service: Chlorine compressor, design_pressure_barg: 5, design_temperature_degc: 140, material: "CS (dry chlorine)",
     notes: "105 -> 410 kPa(a), two stages intercooled, 246 kW at isentropic efficiency 0.75, discharge 114 degC (< 120 degC, BREF 2014 4.3.4); D-008. Liquid-ring or centrifugal; ASSUMED."}
  - {tag: E-504, type: TubularHeatExchanger, service: Chlorine inter- and aftercoolers, design_pressure_barg: 5, design_temperature_degc: 140, material: "CS (dry chlorine)",
     notes: "0.22 MW to cooling water, product at 40 degC (D-008). ASSUMED."}
  # ---- hydrogen treatment (H2T)
  - {tag: E-601, type: TubularHeatExchanger, service: Hydrogen cooler, design_pressure_barg: 2, design_temperature_degc: 115, material: "SS / nickel (caustic mist)",
     notes: "90 -> 35 degC, 0.22 MW; condensate 0.86 t/h to TK-101 (D-008). ASSUMED."}
  - {tag: K-602, type: CentrifugalCompressor, service: Hydrogen blower, design_pressure_barg: 2, design_temperature_degc: 90, material: "CS / SS",
     notes: "112 -> 140 kPa(a), 45 kW at efficiency 0.70 (D-008). ASSUMED."}
  # ---- caustic evaporation (CAU)
  - {tag: EV-701, type: HeatExchanger, service: Double-effect falling-film caustic evaporator, design_pressure_barg: 10, design_temperature_degc: 205, material: "nickel (first effect), nickel or SS (second effect)",
     notes: "32 -> 50 wt-% NaOH, 15.7 t/h water evaporated with 8.75 t/h MP steam (economy 1.8, 0.625 t/t NaOH, BREF 2014 Table 3.11 range 0.46-1.5); surface condenser 4.1 MW (D-010). ASSUMED."}
  - {tag: E-702, type: PlateHeatExchanger, service: Caustic product cooler, design_pressure_barg: 4, design_temperature_degc: 165, material: "nickel",
     notes: "140 -> 50 degC, 2.24 MW to cooling water (D-010). ASSUMED."}
