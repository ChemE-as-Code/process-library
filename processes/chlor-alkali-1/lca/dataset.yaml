# lca --write from the flowsheet and lca/lca.yaml; do not edit. Other studies reference
# it as a background (dataset: {path, product, allocation}).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: chlor-alkali-membrane-cell-plant-100-kt-a-cl2-50-wt--naoh-h2
title: Chlor-alkali membrane-cell plant (100 kt/a Cl2, 50 wt-% NaOH, H2)
description: Unallocated foreground LCI of Chlor-alkali membrane-cell plant (100 kt/a Cl2, 50 wt-% NaOH,
  H2), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: bipolar membrane-cell NaCl electrolysis, 100 kt/a Cl2, rock salt with brine recirculation,
  3.0 V at 6.0 kA/m2, double-effect caustic evaporation to 50 wt-%
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:cl2-vents
  title: non-routine emissions of the plant
  direction: output
  reason: chlorine to the absorption (hypochlorite) unit and hydrogen venting occur at start-up, shutdown
    and upsets only; normal operation sends all Cl2 and H2 to the consumers (D-008). BREF 2014 Table 3.2
    reports 0.01-15 g Cl2/t and < 0.3-14 kg H2/t vented for EU plants; the upper end of the H2 range (about
    half of this plant's 29.5 kg H2/t) describes plants that vent hydrogen for want of a consumer, which
    this design excludes (D-008), so only start-up and upset venting is cut off; no amount is estimated
    yet
  source: D-013
- key: emission-excluded:tanks
  title: storage-tank emissions of the plant
  direction: output
  reason: caustic, brine and acid tanks hold non-volatile aqueous solutions; HCl tank breathing goes to
    a scrubber (ASSUMED); no volatile organic or chlorine release estimated at this stage
  source: D-013
- key: emission-excluded:effluent-traces
  title: effluent emissions of product:WW
  direction: output
  reason: trace species of the purge and regeneration effluent not carried by the balance (free chlorine,
    chlorate, bromate, AOX, heavy metals from the salt); BREF 2014 Table 3.2 reports e.g. 0-3.8 g free
    chlorine and 0.92-3500 g chlorate per t Cl2 for EU plants; to be estimated with a salt analysis and
    the effluent treatment (D-013)
  source: D-013
- key: emission-excluded:leaks
  title: equipment-leaks emissions of the plant
  direction: output
  reason: fugitive Cl2 and H2 from flanges and seals are not estimated at the concept stage; to be added
    with the P&IDs
  source: D-013
uuid: 1de76be9-296d-5436-972d-1173af6562c0
version: 0.1.0
geography:
  description: One concept design for an undecided site; technology data from EU plants (BREF 2014); no
    site-specific supply
  site: generic industrial site with salt by rail or ship
time:
  start: 2026
valid_until: 2031
system_model: cutoff
technology_level: current
production_volume:
  amount: 100818480.0
  unit: kg/a
  source: product:CL2 per hour x operation.hours_per_year (8000 h/a)
classification:
  isic: '2011'
modelling:
  principle: attributional
  multifunctionality: 'unallocated multi-output dataset; default allocation shares: D-013: mass allocation
    on the contained products (Cl2, NaOH 100 %, dry H2), given as shares. Chlorine, caustic soda (1.12
    kg NaOH 100 % per kg Cl2, delivered as 50 wt-%) and hydrogen (29.5 g per kg Cl2) leave one electrochemical
    reaction in fixed stoichiometric ratio; the electricity and steam are listed once for the whole output.
    The inventory itself stays unallocated; a study may choose another basis (the Euro Chlor electrochemical
    unit, economic or substitution) and must then not use product-stream mass, which counts solvent water.'
review:
- type: none
data_generator: ChemE-as-Code process library, chlor-alkali-1 concept design (agent run, unreviewed)
