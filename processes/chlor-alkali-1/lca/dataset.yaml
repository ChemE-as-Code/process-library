  shares:
    CL2: 0.4653
    NAOH: 0.521
    H2: 0.0137
  source: 'D-013: mass allocation on the contained products (Cl2, NaOH 100 %, dry H2), given as shares.
    Chlorine, caustic soda (1.12 kg NaOH 100 % per kg Cl2, delivered as 50 wt-%) and hydrogen (29.5 g
    per kg Cl2) leave one electrochemical reaction in fixed stoichiometric ratio; the electricity and
    steam are listed once for the whole output. The inventory itself stays unallocated; a study may choose
    another basis (the Euro Chlor electrochemical unit, economic or substitution) and must then not use
    product-stream mass, which counts solvent water.'
  deviation: 'Hierarchy step 3 (WBCSD price ratio) cannot be applied: no sourced prices of Cl2, NaOH and
    H2 are recorded for this concept design. Mass of the contained products is used instead, as shares,
    because core''s mass method weighs the product streams including the water of the 50 wt-% caustic
    and of the wet hydrogen. To be revisited when prices are sourced (D-013).'
