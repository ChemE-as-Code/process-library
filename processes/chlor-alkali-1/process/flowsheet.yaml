# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Membrane-cell chlor-alkali plant, 100 kt/a dry chlorine gas with 50 wt-% caustic soda and
# hydrogen (DESIGN.md D-001, D-002). Where the values come from:
# - flows, compositions and duties: the independent balance scripts/balance.py (D-006), run with
#   `cheme run scripts/balance.py`, given here as ASSUMED; its inputs are sourced (EU BREF 2014)
#   or ASSUMED in DESIGN.md D-002..D-012;
# - the electrolysers EL301 are checked by `cheme process cell` (process/cells.yaml, D-004):
#   Faraday, charge, element and energy balance from the specified voltage and efficiency;
# - temperatures and pressures are design choices (D-007, D-008, D-010), ASSUMED;
# - electrolyte stream enthalpies are not modelled: duties outside the cell rest on
#   constant heat capacities and latent heats in scripts/balance.py (D-006).
schema: cheme/process/v1
kind: flowsheet
title: Chlor-alkali membrane-cell plant (100 kt/a Cl2, 50 wt-% NaOH, H2)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 12 500 kg/h dry Cl2 at the gate, 8000 h/a, cells at 6.0 kA/m2 and 3.0 V (D-002, D-004)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: SALT, title: Rock salt, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: WATER, title: Make-up process water, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: DMW, title: Demineralised water, category: raw_material, ports: [{id: ix, direction: out}, {id: cath, direction: out}]}
  - {id: NA2CO3, title: Soda ash, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: HCL, title: Hydrochloric acid 32 wt-%, category: raw_material, ports: [{id: ix, direction: out}, {id: feed, direction: out}, {id: dcl, direction: out}]}
  - {id: NA2SO3, title: Sodium sulfite, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: H2SO4, title: Sulfuric acid 98 wt-%, category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power (AC, grid)
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: rect, direction: out, kind: energy}
      - {id: aux, direction: out, kind: energy}
      - {id: k503, direction: out, kind: energy}
      - {id: k602, direction: out, kind: energy}
  - id: MPS
    title: MP steam 1000 kPa(a)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1000, provenance: assumed, source: "D-010: BREF 2014 Table 3.11 median 10 bar"}
      supply_temperature: {value: 453.0, provenance: assumed, source: "saturation at 1000 kPa(a), D-010"}
      min_approach: {value: 10, provenance: assumed, source: D-010}
    ports: [{id: e201, direction: out, kind: energy}, {id: ev701, direction: out, kind: energy}]
products:
  - {id: CL2, title: Dry chlorine gas to the consumer (400 kPa(a)), category: product, ports: [{id: in, direction: in}]}
  - {id: NAOH, title: Caustic soda 50 wt-% to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: H2, title: Hydrogen to the consumer or fuel (140 kPa(a)), category: product, ports: [{id: in, direction: in}]}
  - {id: SPENT, title: Spent sulfuric acid to off-site use, category: by_product, ports: [{id: in, direction: in}]}
  - {id: WW, title: Waste water to treatment, category: wastewater, ports: [{id: ix, direction: in}, {id: purge, direction: in}]}
  - {id: SLUDGE, title: Brine filter cake to landfill, category: solid_waste, ports: [{id: in, direction: in}]}
  - {id: VENT, title: Feed brine acidification vent to air, category: emission, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: D-010}
      return_temperature: {value: 308.15, provenance: assumed, source: D-010}
      min_approach: {value: 5, provenance: assumed, source: D-010}
    ports:
      - {id: t301, direction: in, kind: energy}
      - {id: e302, direction: in, kind: energy}
      - {id: e501, direction: in, kind: energy}
      - {id: e504, direction: in, kind: energy}
      - {id: e601, direction: in, kind: energy}
      - {id: ev701, direction: in, kind: energy}
      - {id: e702, direction: in, kind: energy}
  - id: CHW
    title: Chilled water return
    category: utility
    utility:
      kind: refrigerant
      level: chilled water
      supply_temperature: {value: 281.15, provenance: assumed, source: D-010}
      return_temperature: {value: 288.15, provenance: assumed, source: D-010}
      min_approach: {value: 5, provenance: assumed, source: D-010}
    ports: [{id: e501, direction: in, kind: energy}]

blocks:
  - id: BRN
    title: Brine saturation and primary purification
    class: ProcessStep
    ports:
      - {id: salt, direction: in}
      - {id: water, direction: in}
      - {id: ret, direction: in}
      - {id: cond, direction: in}
      - {id: h2cond, direction: in}
      - {id: carb, direction: in}
      - {id: naoh, direction: in}
      - {id: sludge, direction: out}
      - {id: brine, direction: out}
      - {id: aux, direction: in, kind: energy}
  - id: POL
    title: Secondary purification and feed brine conditioning
    class: ProcessStep
    ports:
      - {id: brine, direction: in}
      - {id: hcl_ix, direction: in}
      - {id: naoh, direction: in}
      - {id: rinse, direction: in}
      - {id: hcl, direction: in}
      - {id: regen, direction: out}
      - {id: vent, direction: out}
      - {id: feed, direction: out}
      - {id: steam, direction: in, kind: energy}
  - id: ELY
    title: Membrane electrolysis
    class: ReactingChemicals
    ports:
      - {id: feed, direction: in}
      - {id: dmw, direction: in}
      - {id: anolyte, direction: out}
      - {id: cl2, direction: out}
      - {id: h2, direction: out}
      - {id: caustic, direction: out}
      - {id: naoh_brn, direction: out}
      - {id: naoh_pol, direction: out}
      - {id: naoh_dcl, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: cw_rect, direction: out, kind: energy}
      - {id: cw_cath, direction: out, kind: energy}
  - id: DCL
    title: Depleted brine dechlorination and purge
    class: ProcessStep
    ports:
      - {id: anolyte, direction: in}
      - {id: hcl, direction: in}
      - {id: cond, direction: in}
      - {id: naoh, direction: in}
      - {id: sulfite, direction: in}
      - {id: gas, direction: out}
      - {id: ret, direction: out}
      - {id: purge, direction: out}
  - id: CLT
    title: Chlorine cooling, drying and compression
    class: ProcessStep
    ports:
      - {id: cell, direction: in}
      - {id: strip, direction: in}
      - {id: acid, direction: in}
      - {id: cond, direction: out}
      - {id: spent, direction: out}
      - {id: product, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: chw, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
  - id: H2T
    title: Hydrogen cooling and compression
    class: ProcessStep
    ports:
      - {id: h2, direction: in}
      - {id: cond, direction: out}
      - {id: product, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: CAU
    title: Caustic evaporation to 50 wt-%
    class: Evaporating
    ports:
      - {id: caustic, direction: in}
      - {id: cond, direction: out}
      - {id: product, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}

steps:
  # BRN: salt dissolving, Ca/Mg precipitation, clarification and filtration (D-005)
  - id: D101
    block: BRN
    title: Salt saturator
    class: Mixing
    symbol: TANK_CONE_ROOF_SHAPE
    links: [{target: equipment, ref: TK-101}]
    ports:
      - {id: salt, direction: in, delegates: salt}
      - {id: water, direction: in, delegates: water}
      - {id: ret, direction: in, delegates: ret}
      - {id: cond, direction: in, delegates: cond}
      - {id: h2cond, direction: in, delegates: h2cond}
      - {id: out, direction: out}
      - {id: aux, direction: in, kind: energy, delegates: aux}
  - id: R101
    block: BRN
    title: Brine treatment reactors (soda ash, caustic)
    class: ReactingChemicals
    reactions: [CA_PRECIP, MG_PRECIP]
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: carb, direction: in, delegates: carb}
      - {id: naoh, direction: in, delegates: naoh}
      - {id: out, direction: out}
  - id: S101
    block: BRN
    title: Clarifier and brine filters
    class: Filtering
    links: [{target: equipment, ref: S-101}]
    ports:
      - {id: in, direction: in}
      - {id: sludge, direction: out, delegates: sludge}
      - {id: clear, direction: out, delegates: brine}
  # POL: chelating ion exchange, acidification, heating (D-005)
  - id: X201
    block: POL
    title: Chelating ion-exchange columns (with regeneration)
    class: Separating
    reactions: [HYDROXIDE_NEUT]
    links: [{target: equipment, ref: X-201}]
    ports:
      - {id: in, direction: in, delegates: brine}
      - {id: hcl, direction: in, delegates: hcl_ix}
      - {id: naoh, direction: in, delegates: naoh}
      - {id: rinse, direction: in, delegates: rinse}
      - {id: out, direction: out}
      - {id: regen, direction: out, delegates: regen}
  - id: R202
    block: POL
    title: Feed brine acidification
    class: ReactingChemicals
    reactions: [CARBONATE_NEUT, HYDROXIDE_NEUT]
    links: [{target: equipment, ref: R-202}]
    ports:
      - {id: in, direction: in}
      - {id: hcl, direction: in, delegates: hcl}
      - {id: vent, direction: out, delegates: vent}
      - {id: out, direction: out}
  - id: E201
    block: POL
    title: Feed brine heater
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: feed}
      - {id: steam, direction: in, kind: energy, delegates: steam}
  # ELY: rectifiers, electrolysers, catholyte loop (D-004, D-009)
  - id: T301
    block: ELY
    title: Transformer-rectifiers
    class: ProcessStep
    links: [{target: equipment, ref: T-301}]
    ports:
      - {id: ac, direction: in, kind: energy, delegates: power}
      - {id: dc, direction: out, kind: energy}
      - {id: loss, direction: out, kind: energy, delegates: cw_rect}
  - id: EL301
    block: ELY
    title: Bipolar membrane electrolysers
    class: ReactingChemicals
    reactions: [CHLORALKALI, WATER_SPLIT]
    links: [{target: equipment, ref: EL-301}]
    ports:
      - {id: brine, direction: in, delegates: feed}
      - {id: dmw, direction: in, delegates: dmw}
      - {id: dc, direction: in, kind: energy}
      - {id: anolyte, direction: out, delegates: anolyte}
      - {id: cl2, direction: out, delegates: cl2}
      - {id: h2, direction: out, delegates: h2}
      - {id: caustic, direction: out}
  - id: E302
    block: ELY
    title: Catholyte cooler
    class: Cooling
    links: [{target: equipment, ref: E-302}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw_cath}
  - id: SP303
    block: ELY
    title: Caustic distribution (product and internal use)
    class: SplittingMaterial
    split: {r101: 0.0036666, x201: 0.0009722, r402: 0.0028991}
    ports:
      - {id: in, direction: in}
      - {id: evap, direction: out, delegates: caustic}
      - {id: r101, direction: out, delegates: naoh_brn}
      - {id: x201, direction: out, delegates: naoh_pol}
      - {id: r402, direction: out, delegates: naoh_dcl}
  # DCL: vacuum stripping, sulfite, purge (D-005)
  - id: C401
    block: DCL
    title: Vacuum dechlorination tower
    class: SeparatingByFlash
    links: [{target: equipment, ref: C-401}]
    ports:
      - {id: anolyte, direction: in, delegates: anolyte}
      - {id: cond, direction: in, delegates: cond}
      - {id: hcl, direction: in, delegates: hcl}
      - {id: gas, direction: out, delegates: gas}
      - {id: out, direction: out}
  - id: R402
    block: DCL
    title: Chemical dechlorination (sulfite) and neutralisation
    class: ReactingChemicals
    reactions: [SULFITE_DECHLOR, HYDROXIDE_NEUT]
    links: [{target: equipment, ref: R-402}]
    ports:
      - {id: in, direction: in}
      - {id: sulfite, direction: in, delegates: sulfite}
      - {id: naoh, direction: in, delegates: naoh}
      - {id: out, direction: out}
  - id: SP403
    block: DCL
    title: Brine purge take-off
    class: SplittingMaterial
    split: {purge: 0.0424898}
    ports:
      - {id: in, direction: in}
      - {id: purge, direction: out, delegates: purge}
      - {id: ret, direction: out, delegates: ret}
  # CLT: wet chlorine cooling, drying with sulfuric acid, compression (D-008)
  - id: M501
    block: CLT
    title: Wet chlorine header
    class: Mixing
    ports:
      - {id: cell, direction: in, delegates: cell}
      - {id: strip, direction: in, delegates: strip}
      - {id: out, direction: out}
  - id: E501
    block: CLT
    title: Wet chlorine coolers (cooling water, chilled water)
    class: Cooling
    links: [{target: equipment, ref: E-501}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out}
      - {id: cond, direction: out, delegates: cond}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
      - {id: chw, direction: out, kind: energy, delegates: chw}
  - id: C502
    block: CLT
    title: Chlorine drying towers (sulfuric acid)
    class: Absorbing
    links: [{target: equipment, ref: C-502}]
    ports:
      - {id: in, direction: in}
      - {id: acid, direction: in, delegates: acid}
      - {id: gas, direction: out}
      - {id: spent, direction: out, delegates: spent}
  - id: K503
    block: CLT
    title: Chlorine compressor (two stages, intercooled)
    class: Compressing
    links: [{target: equipment, ref: K-503}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E504
    block: CLT
    title: Chlorine inter- and aftercoolers
    class: Cooling
    links: [{target: equipment, ref: E-504}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: product}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  # H2T: hydrogen cooling and blower (D-008)
  - id: E601
    block: H2T
    title: Hydrogen cooler
    class: Cooling
    links: [{target: equipment, ref: E-601}]
    ports:
      - {id: in, direction: in, delegates: h2}
      - {id: gas, direction: out}
      - {id: cond, direction: out, delegates: cond}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: K602
    block: H2T
    title: Hydrogen blower
    class: Compressing
    links: [{target: equipment, ref: K-602}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: product}
      - {id: power, direction: in, kind: energy, delegates: power}
  # CAU: double-effect falling-film evaporation and product cooling (D-010)
  - id: EV701
    block: CAU
    title: Double-effect caustic evaporator
    class: Evaporating
    links: [{target: equipment, ref: EV-701}]
    ports:
      - {id: in, direction: in, delegates: caustic}
      - {id: out, direction: out}
      - {id: cond, direction: out, delegates: cond}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: E702
    block: CAU
    title: Caustic product cooler
    class: Cooling
    links: [{target: equipment, ref: E-702}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: product}
      - {id: cw, direction: out, kind: energy, delegates: cw2}

# Material streams: flow (kg/h) and composition (mass fractions) from scripts/balance.py
# (D-006); temperatures and pressures D-007/D-008/D-010. All ASSUMED until core qualifies
# electrolyte balances.
streams:
  - {id: S1, title: Rock salt, from: SALT.out, to: D101.salt, template: salt, state: {design: {temperature: {value: 288.15, provenance: assumed, source: D-007}, pressure: {value: 101.325, provenance: assumed, source: D-007}, flow: {value: 21390.37, basis: mass, provenance: assumed, source: scripts/balance.py}, composition: {basis: mass_fraction, values: {NaCl: 0.988, CaSO4: 0.0015, MgCl2: 0.0005, SiO2: 0.005, H2O: 0.005}, provenance: assumed, source: "rock salt analysis, D-003"}}}}
  - {id: S2, title: Make-up process water, from: WATER.out, to: D101.water, template: aqueous, state: {design: {temperature: {value: 288.15, provenance: assumed, source: D-007}, pressure: {value: 300, provenance: assumed, source: D-007}, flow: {value: 11623.03, basis: mass, provenance: assumed, source: scripts/balance.py}, composition: {basis: mass_fraction, values: {H2O: 1.0}, provenance: assumed, source: scripts/balance.py}}}}
  - {id: S3, title: Return brine to saturation, from: SP403.ret, to: D101.ret, template: aqueous, state: {design: {temperature: {value: 353.15, provenance: assumed, source: D-007}, pressure: {value: 250, provenance: assumed, source: D-007}, flow: {value: 92804.21, basis: mass, provenance: assumed, source: scripts/balance.py}, composition: {basis: mass_fraction, values: {NaCl: 0.1706637, Na2SO4: 0.008871149, H2O: 0.8204651}, provenance: assumed, source: scripts/balance.py}}}}
  - {id: S4, title: Process condensate from caustic evaporation, from: EV701.cond, to: D101.cond, template: aqueous, state: {design: {temperature: {value: 323.15, provenance: assumed, source: D-010}, pressure: {value: 250, provenance: assumed, source: D-010}, flow: {value: 15747.74, basis: mass, provenance: assumed, source: scripts/balance.py}, composition: {basis: mass_fraction, values: {H2O: 1.0}, provenance: assumed, source: scripts/balance.py}}}}
  - {id: S5, title: Hydrogen cooler condensate, from: E601.cond, to: D101.h2cond, template: aqueous, state: {design: {temperature: {value: 308.15, provenance: assumed, source: D-008}, pressure: {value: 250, provenance: assumed, source: D-008}, flow: {value: 861.36, basis: mass, provenance: assumed, source: scripts/balance.py}, composition: {basis: mass_fraction, values: {H2O: 1.0}, provenance: assumed, source: scripts/balance.py}}}}
  - {id: S6, title: Raw saturated brine, from: D101.out, to: R101.in, template: aqueous, state: {design: {temperature: {value: 328.15, provenance: assumed, source: D-007}, pressure: {value: 250, provenance: assumed, source: D-007}, flow: {value: 142426.71, basis: mass, provenance: assumed, source: scripts/balance.py}, composition: {basis: mass_fraction, values: {NaCl: 0.2595861, Na2SO4: 0.005780376, H2O: 0.7335822, CaSO4: 0.0002252777, MgCl2: 7.509256e-05, SiO2: 0.0007509256}, provenance: assumed, source: scripts/balance.py}}}}
  - {id: S7, title: Soda ash, from: NA2CO3.out, to: R101.carb, template: solid_reagent, state: {design: {temperature: {value: 298.15, provenance: assumed, source: D-007}, pressure: {value: 101.325, provenance: assumed, source: D-007}, flow: {value: 96.19, basis: mass, provenance: assumed, source: scripts/balance.py}, composition: {basis: mass_fraction, values: {Na2CO3: 1.0}, provenance: assumed, source: scripts/balance.py}}}}
  - {id: S8, title: Caustic for magnesium precipitation, from: SP303.r101, to: R101.naoh, template: aqueous, state: {design: {temperature: {value: 358.15, provenance: assumed, source: D-007}, pressure: {value: 400, provenance: assumed, source: D-007}, flow: {value: 161.61, basis: mass, provenance: assumed, source: scripts/balance.py}, composition: {basis: mass_fraction, values: {NaOH: 0.32, H2O: 0.68}, provenance: assumed, source: scripts/balance.py}}}}
  - {id: S9, title: Treated brine slurry, from: R101.out, to: S101.in, template: aqueous, state: {design: {temperature: {value: 328.15, provenance: assumed, source: D-007}, pressure: {value: 250, provenance: assumed, source: D-007}, flow: {value: 142684.51, basis: mass, provenance: assumed, source: scripts/balance.py}, composition: {basis: mass_fraction, values: {NaCl: 0.2592091, Na2SO4: 0.006004549, H2O: 0.733027, SiO2: 0.0007495688, Na2CO3: 0.0004990966, NaOH: 0.000299458, CaCO3: 0.0001653247, MgOH2: 4.591366e-05}, provenance: assumed, source: scripts/balance.py}}}}
  - {id: S10, title: Brine filter cake, from: S101.sludge, to: SLUDGE.in, template: aqueous, state: {design: {temperature: {value: 318.15, provenance: assumed, source: D-007}, pressure: {value: 101.325, provenance: assumed, source: D-007}, flow: {value: 274.18, basis: mass, provenance: assumed, source: scripts/balance.py}, composition: {basis: mass_fraction, values: {SiO2: 0.3900725, CaCO3: 0.08603427, MgOH2: 0.02389327, NaCl: 0.1297292, Na2SO4: 0.003005162, H2O: 0.366866, Na2CO3: 0.0002497883, NaOH: 0.000149873}, provenance: assumed, source: scripts/balance.py}}}}
  - {id: S11, title: Clarified brine, from: S101.clear, to: X201.in, template: aqueous, state: {design: {temperature: {value: 328.15, provenance: assumed, source: D-007}, pressure: {value: 400, provenance: assumed, source: D-007}, flow: {value: 142410.33, basis: mass, provenance: assumed, source: scripts/balance.py}, composition: {basis: mass_fraction, values: {NaCl: 0.2594584, Na2SO4: 0.006010323, H2O: 0.7337319, Na2CO3: 0.0004995766, NaOH: 0.000299746}, provenance: assumed, source: scripts/balance.py}}}}
