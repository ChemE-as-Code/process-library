# Components and templates of the process. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa (gases and water only; the salts are dissolved or solid).
# SiO2 stands for the insoluble matter of the rock salt (D-003). Mg(OH)2 has the id MgOH2.
schema: cheme/process/v1
kind: materials
components:
  - {id: NaCl, name: Sodium chloride, formula: NaCl, cas: 7647-14-5, molar_mass: 58.443}
  - {id: H2O, name: Water, formula: H2O, cas: 7732-18-5, molar_mass: 18.015, normal_boiling_point: 373.12}
  - {id: NaOH, name: Sodium hydroxide, formula: NaOH, cas: 1310-73-2, molar_mass: 39.997}
  - {id: Cl2, name: Chlorine, formula: Cl2, cas: 7782-50-5, molar_mass: 70.906, normal_boiling_point: 239.11}
  - {id: H2, name: Hydrogen, formula: H2, cas: 1333-74-0, molar_mass: 2.016, normal_boiling_point: 20.28}
  - {id: O2, name: Oxygen, formula: O2, cas: 7782-44-7, molar_mass: 31.998, normal_boiling_point: 90.19}
  - {id: CO2, name: Carbon dioxide, formula: CO2, cas: 124-38-9, molar_mass: 44.009}
  - {id: HCl, name: Hydrogen chloride, formula: HCl, cas: 7647-01-0, molar_mass: 36.461, normal_boiling_point: 188.1}
  - {id: Na2SO4, name: Sodium sulfate, formula: Na2SO4, cas: 7757-82-6, molar_mass: 142.04}
  - {id: Na2CO3, name: Sodium carbonate, formula: Na2CO3, cas: 497-19-8, molar_mass: 105.99}
  - {id: Na2SO3, name: Sodium sulfite, formula: Na2SO3, cas: 7757-83-7, molar_mass: 126.04}
  - {id: H2SO4, name: Sulfuric acid, formula: H2SO4, cas: 7664-93-9, molar_mass: 98.079}
  - {id: CaSO4, name: Calcium sulfate, formula: CaSO4, cas: 7778-18-9, molar_mass: 136.14}
  - {id: MgCl2, name: Magnesium chloride, formula: MgCl2, cas: 7786-30-3, molar_mass: 95.211}
  - {id: CaCO3, name: Calcium carbonate, formula: CaCO3, cas: 471-34-1, molar_mass: 100.09}
  - {id: MgOH2, name: Magnesium hydroxide, formula: Mg(OH)2, cas: 1309-42-8, molar_mass: 58.320}
  - {id: SiO2, name: Silicon dioxide (insoluble matter of the salt), formula: SiO2, cas: 14808-60-7, molar_mass: 60.084}
templates:
  - {id: salt, title: Rock salt, components: [NaCl, CaSO4, MgCl2, SiO2, H2O]}
  - id: aqueous
    title: Brine, caustic, acid solutions, process water and brine sludge
    components: [NaCl, H2O, Na2SO4, Na2CO3, NaOH, HCl, Cl2, CaSO4, MgCl2, SiO2, CaCO3, MgOH2, Na2SO3]
  - {id: gas, title: "Chlorine, hydrogen and vent gases", components: [Cl2, O2, H2, H2O, CO2]}
  - {id: sulfuric_acid, title: Sulfuric acid, components: [H2SO4, H2O]}
  - {id: solid_reagent, title: Solid reagents, components: [Na2CO3, Na2SO3]}
# property_method is a placeholder: no benchmarked package covers electrolytes
# (`cheme process methods`); stream properties are not filled (D-006).
property_method:
  adapter: thermo
  status: placeholder
