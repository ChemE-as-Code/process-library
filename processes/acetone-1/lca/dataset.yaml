cutoff:
- key: emission-excluded:fugitive-leaks
  title: equipment-leaks emissions of the plant
  direction: output
  reason: 'fugitive VOC (cumene, acetone, phenol) not estimated, not claimed negligible: the LVOC BREF
    reports 0.02-0.06 kg/t phenol (8.3.1.6), but an estimate for this plant needs the P&ID component counts;
    to become an emission_estimates entry with the P&IDs (D-015)'
  source: D-015
- key: emission-excluded:storage-tanks
  title: storage-tank emissions of the plant
  direction: output
  reason: cumene, acetone and phenol tanks are outside the battery limit (design basis); their breathing
    losses belong to storage (D-015)
  source: design basis
- key: emission-excluded:tar-combustion
  title: combustion emissions of the plant
  direction: output
  reason: the tar is burned outside the plant boundary; its combustion emissions belong to the treatment
    background of product:TAR (D-015)
  source: D-015
- key: emission-excluded:vacuum-vents
  title: non-routine emissions of the plant
  direction: output
  reason: 'the vacuum-system and fractionation vents (LVOC BREF 8.3.1.2-3: about 10-15 Nm3/t phenol, to
    a thermal oxidiser) and the methane in the oxidiser off-gas (100-400 mg/Nm3 before treatment, 8.3.1.1)
    are not in the flowsheet; open item I-04 (D-015)'
  source: D-015
