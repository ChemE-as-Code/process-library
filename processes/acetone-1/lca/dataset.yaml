modelling:
  principle: attributional
  multifunctionality: 'unallocated multi-output dataset; default allocation mass: D-014 (agent proposal,
    for the LCA practitioner to confirm): mass allocation between acetone and phenol. The two are made
    in a fixed stoichiometric ratio in one reaction (CLEAVAGE), are both liquid organic chemicals sold
    by mass, and no co-product prices are set at the concept stage; the BREF notes the acetone price varies
    considerably (LVOC 8.1), which makes an economic split unstable. Energy (LHV) allocation is computed
    for comparison: the LHVs are close (31.8 and 29.0 MJ/kg), so it moves the acetone share by about 2
    points.'
