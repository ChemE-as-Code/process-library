# acetone-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# acetone-1's preliminary LCI leaves the backgrounds open (DESIGN.md D-014):
# exchanges without a mapping are reported gaps. Only two kinds of override are set: the steam
# counted in kWh (the default `steam` entry is per kg, a unit error otherwise) and the hydrogen,
# which must not be linked to an Atlas producer chosen by the build. Proposed later, once the
# shared vocabulary has the entries (DESIGN.md I-09):
#   feed:CUM     -> a `cumene` technosphere entry (new) or a library cumene process
#   feed:ACID    -> sulfuric-acid (exists), or sulfuric-acid-1 when published
#   feed:NAOH50  -> a `sodium-hydroxide-50` entry (new), or chlor-alkali-1 when published
#   product:TAR  -> a heavy-residue thermal treatment entry (new)
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:LPS": {use: steam-heat, source: "LP steam 500 kPa(a) to the CHP concentration, counted as heat delivered (kWh), D-011"}
  "feed:MPS": {use: steam-heat, source: "MP steam 1800 kPa(a) to the fractionation reboilers, counted as heat delivered (kWh), D-011"}
  "feed:H2F":
    atlas: false
    source: >-
      Hydrogen for the AMS hydrogenation: the supplier is not decided (hydrogen-1 or a site
      header, D-008). Without this the build links the first Atlas producer it finds (the
      chlor-alkali-1 by-product hydrogen); link hydrogen-1 explicitly once it is chosen.
