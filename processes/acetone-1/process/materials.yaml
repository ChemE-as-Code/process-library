# Components and templates of the process. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol.
# Identity (formula, CAS, molar mass) from PubChem; 4-cumylphenol stands for all heavies (D-005).
schema: cheme/process/v1
kind: materials
components:
  - {id: CUM, name: Cumene, formula: C9H12, cas: 98-82-8, molar_mass: 120.19}
  - {id: O2, name: Oxygen, formula: O2, cas: 7782-44-7, molar_mass: 31.998}
  - {id: N2, name: Nitrogen, formula: N2, cas: 7727-37-9, molar_mass: 28.014}
  - {id: CHP, name: Cumene hydroperoxide, formula: C9H12O2, cas: 80-15-9, molar_mass: 152.19}
  - {id: DMBA, name: 2-Phenyl-2-propanol (dimethylbenzyl alcohol), formula: C9H12O, cas: 617-94-7, molar_mass: 136.19}
  - {id: ACP, name: Acetophenone, formula: C8H8O, cas: 98-86-2, molar_mass: 120.15}
  - {id: MEOH, name: Methanol, formula: CH4O, cas: 67-56-1, molar_mass: 32.042}
  - {id: PHEN, name: Phenol, formula: C6H6O, cas: 108-95-2, molar_mass: 94.111}
  - {id: ACET, name: Acetone, formula: C3H6O, cas: 67-64-1, molar_mass: 58.079}
  - {id: AMS, name: alpha-Methylstyrene, formula: C9H10, cas: 98-83-9, molar_mass: 118.18}
  - {id: H2O, name: Water, formula: H2O, cas: 7732-18-5, molar_mass: 18.015}
  - {id: CUMPH, name: 4-Cumylphenol (heavies surrogate), formula: C15H16O, cas: 599-64-4, molar_mass: 212.29}
  - {id: H2, name: Hydrogen, formula: H2, cas: 1333-74-0, molar_mass: 2.016}
  - {id: H2SO4, name: Sulfuric acid, formula: H2SO4, cas: 7664-93-9, molar_mass: 98.079}
  - {id: NAOH, name: Sodium hydroxide, formula: NaOH, cas: 1310-73-2, molar_mass: 39.997}
  - {id: NA2SO4, name: Sodium sulfate, formula: Na2SO4, cas: 7757-82-6, molar_mass: 142.04}
templates:
  - {id: air, title: "Air (dry, Ar counted as N2)", components: [N2, O2]}
  - {id: hydrogen, title: Hydrogen, components: [H2]}
  - {id: water, title: Process water, components: [H2O]}
  - {id: acid, title: Sulfuric acid solution, components: [H2SO4, H2O]}
  - {id: caustic, title: Caustic soda solution, components: [NAOH, H2O]}
  - id: process
    title: Cumene / phenol process mixture
    components: [CUM, O2, N2, CHP, DMBA, ACP, MEOH, PHEN, ACET, AMS, H2O, CUMPH, H2, H2SO4, NAOH, NA2SO4]
# No benchmarked property package covers this polar mixture (core#315): placeholder (D-012).
property_method:
  adapter: thermo
  status: placeholder
