    from: E201.conc
    to: R301.in
    template: process
    state:
      design:
        flow: {value: 51375.77, basis: mass, provenance: assumed, source: "scripts/balance.py (D-006)"}
        composition: {basis: mass_fraction, values: {CUM: 0.15341, CHP: 0.8, DMBA: 0.03808, ACP: 0.006719, MEOH: 0.001791}, provenance: assumed, source: "D-006: methanol stays with the concentrate"}
  - id: S11
    title: Recycle cumene from concentration
    from: E201.cum
    to: M101.rec_conc
    template: process
    state:
      design:
        flow: {value: 113026.69, basis: mass, provenance: assumed, source: "scripts/balance.py (D-006)"}
        composition: {basis: mass_fraction, values: {CUM: 1.0}, provenance: assumed, source: D-006}
  - id: S12
    title: Sulfuric acid
    from: ACID.out
    to: R301.acid
    template: acid
