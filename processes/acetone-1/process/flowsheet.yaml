# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
# Phenol and acetone from cumene (cumene hydroperoxide route), concept stage, issue #132.
# Assumed stream values come from scripts/balance.py (D-002 to D-010); mixer, reactor and
# compressor outlets are calculated by `cheme process propagate --fill`. Utility duties are
# anchored to the LVOC BREF energy data (D-011), not calculated for this design.
schema: cheme/process/v1
kind: flowsheet
title: Phenol and acetone from cumene (cumene hydroperoxide route)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 200 kt/a phenol, 8000 h/a (D-002)", default: true}
tolerance: {abs: 1.0, rel: 0.005}

feeds:
  - {id: CUM, title: Fresh cumene (from a cumene unit), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AIR, title: Ambient air, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: H2F, title: Hydrogen (hydrogen-1 or site header), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: ACID, title: Sulfuric acid 98 wt%, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NAOH50, title: Caustic soda 50 wt% (chlor-alkali-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PW, title: Process water, category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: k101, direction: out, kind: energy}
      - {id: e201, direction: out, kind: energy}
      - {id: c404, direction: out, kind: energy}
  - id: LPS
    title: LP steam 500 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 500, provenance: assumed, source: "BREF LVOC 2017 Table 8.5 (5 bar steam), D-011"}
      supply_temperature: {value: 424.98, provenance: given, source: "saturation at 500 kPa(a), IAPWS-IF97"}
      min_approach: {value: 10, provenance: assumed, source: D-011}
    ports: [{id: e201, direction: out, kind: energy}]
  - id: MPS
    title: MP steam 1800 kPa(a)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1800, provenance: assumed, source: "BREF LVOC 2017 Table 8.5 (18 bar steam), D-011"}
      supply_temperature: {value: 480.3, provenance: given, source: "saturation at 1800 kPa(a), IAPWS-IF97"}
      min_approach: {value: 10, provenance: assumed, source: D-011}
    ports:
      - {id: c401, direction: out, kind: energy}
      - {id: c402, direction: out, kind: energy}
      - {id: c403, direction: out, kind: energy}
      - {id: c404, direction: out, kind: energy}

products:
  - {id: ACETONE, title: Acetone product, category: product, ports: [{id: in, direction: in}]}
  - {id: PHENOL, title: Phenol product, category: product, ports: [{id: in, direction: in}]}
  - {id: TAR, title: Tar and acetophenone to fuel, category: by_product, ports: [{id: in, direction: in}]}
  - id: WW
    title: Aqueous effluent to waste water treatment
    category: wastewater
    ports: [{id: brine, direction: in}, {id: c402, direction: in}]
  - id: VENT
    title: Spent air and hydrogenation vent to atmosphere
    category: off_gas
    ports: [{id: ox, direction: in}, {id: hyd, direction: in}]
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis"}
      min_approach: {value: 5, provenance: assumed, source: "design basis"}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: a101, direction: in, kind: energy}
      - {id: e201, direction: in, kind: energy}
      - {id: r301, direction: in, kind: energy}
      - {id: r302, direction: in, kind: energy}
      - {id: c401, direction: in, kind: energy}
      - {id: c402, direction: in, kind: energy}
      - {id: c403, direction: in, kind: energy}
      - {id: c404, direction: in, kind: energy}
      - {id: r501, direction: in, kind: energy}

blocks:
  - id: OXI
    title: Cumene oxidation
    class: ReactingChemicals
    ports:
      - {id: cum, direction: in}
      - {id: air, direction: in}
      - {id: rec_conc, direction: in}
      - {id: rec_hyd, direction: in}
      - {id: oxidate, direction: out}
      - {id: vent, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: cw_r, direction: out, kind: energy}
      - {id: cw_a, direction: out, kind: energy}
  - id: CONC
    title: CHP concentration (vacuum)
    class: SeparatingByThermalProcess
    ports:
      - {id: oxidate, direction: in}
      - {id: conc, direction: out}
      - {id: cumene, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: CLV
    title: Acid cleavage and neutralisation
    class: ReactingChemicals
    ports:
      - {id: conc, direction: in}
      - {id: acid, direction: in}
      - {id: caustic, direction: in}
      - {id: water, direction: in}
      - {id: organic, direction: out}
      - {id: brine, direction: out}
      - {id: cw, direction: out, kind: energy}
      - {id: cw_n, direction: out, kind: energy}
  - id: FRAC
    title: Fractionation
    class: Distilling
    ports:
      - {id: feed, direction: in}
      - {id: acetone, direction: out}
      - {id: phenol, direction: out}
      - {id: tar, direction: out}
      - {id: water, direction: out}
      - {id: cumams, direction: out}
      - {id: steam1, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: steam3, direction: in, kind: energy}
      - {id: steam4, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: cw3, direction: out, kind: energy}
      - {id: cw4, direction: out, kind: energy}
  - id: HYD
    title: AMS hydrogenation
    class: ReactingChemicals
    ports:
      - {id: feed, direction: in}
      - {id: h2, direction: in}
      - {id: cumene, direction: out}
      - {id: vent, direction: out}
      - {id: cw, direction: out, kind: energy}

steps:
  - id: M101
    block: OXI
    title: Oxidiser feed junction (fresh and recycled cumene)
    class: Mixing
    ports:
      - {id: fresh, direction: in, delegates: cum}
      - {id: rec_off, direction: in}
      - {id: rec_conc, direction: in, delegates: rec_conc}
      - {id: rec_hyd, direction: in, delegates: rec_hyd}
      - {id: out, direction: out}
  - id: K101
    block: OXI
    title: Oxidation air compressor
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in, delegates: air}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  # D-003, D-004: bubble-column oxidisers in series (liquid) / parallel (air), lumped; sourced
  # selectivity model, not kinetics.
  - id: R101
    block: OXI
    title: Cumene oxidisers (bubble columns in series)
    class: ReactingChemicals
    reactions: [OX_CHP, OX_DMBA, OX_ACP]
    reactor: conversion
    selectivity: {key: CUM, conversion: 0.217404, products: {CHP: 0.94, DMBA: 0.05, ACP: 0.01}, provenance: assumed, source: "D-004: total CHP selectivity at the top of the typical 92-94 % (US 8,975,444, Description of Related Art), DMBA/ACP split ASSUMED; conversion from scripts/balance.py for 25 wt% CHP in the oxidate (US 8,975,444: 22-32 %)"}
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: feed, direction: in}
      - {id: air, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw_r}
  - id: V101
    block: OXI
    title: Oxidiser gas/liquid disengagement
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out}
      - {id: liq, direction: out, delegates: oxidate}
  - id: A101
    block: OXI
    title: Spent-air condensers and carbon adsorbers
    class: SeparatingByPhysicalProcess
    links: [{target: equipment, ref: A-101}]
    ports:
      - {id: in, direction: in}
      - {id: vent, direction: out, delegates: vent}
      - {id: rec, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw_a}
  - id: E201
    block: CONC
    title: CHP concentration (pre-flash and flash column under vacuum)
    class: SeparatingByThermalProcess
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in, delegates: oxidate}
      - {id: conc, direction: out, delegates: conc}
      - {id: cum, direction: out, delegates: cumene}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: R301
    block: CLV
    title: CHP cleavage reactor (sulfuric acid)
    class: ReactingChemicals
    reactions: [CLEAVAGE, DMBA_DEHYD, HEAVIES]
    reactor: conversion
    links: [{target: equipment, ref: R-301}]
    ports:
      - {id: in, direction: in, delegates: conc}
      - {id: acid, direction: in, delegates: acid}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: R302
    block: CLV
    title: Neutraliser
    class: ReactingChemicals
    reactions: [NEUTRALISATION]
    reactor: conversion
    links: [{target: equipment, ref: R-302}]
    ports:
      - {id: in, direction: in}
      - {id: caustic, direction: in, delegates: caustic}
      - {id: water, direction: in, delegates: water}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw_n}
  - id: V301
    block: CLV
    title: Neutralisation decanter
    class: SeparatingByPhaseSeparation
    links: [{target: equipment, ref: V-301}]
    ports:
      - {id: in, direction: in}
      - {id: org, direction: out, delegates: organic}
      - {id: aq, direction: out, delegates: brine}
  - id: C401
    block: FRAC
    title: Crude acetone column
    class: Distilling
    links: [{target: equipment, ref: C-401}]
    ports:
      - {id: in, direction: in, delegates: feed}
      - {id: top, direction: out}
      - {id: bot, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam1}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: C402
    block: FRAC
    title: Acetone finishing column
    class: Distilling
    links: [{target: equipment, ref: C-402}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out, delegates: acetone}
      - {id: bot, direction: out, delegates: water}
      - {id: steam, direction: in, kind: energy, delegates: steam2}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  - id: C403
    block: FRAC
    title: Cumene/AMS column
    class: Distilling
    links: [{target: equipment, ref: C-403}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out, delegates: cumams}
      - {id: bot, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam3}
      - {id: cw, direction: out, kind: energy, delegates: cw3}
  - id: C404
    block: FRAC
    title: Phenol column (heavy ends removal and finishing, vacuum)
    class: Distilling
    links: [{target: equipment, ref: C-404}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out, delegates: phenol}
      - {id: bot, direction: out, delegates: tar}
      - {id: steam, direction: in, kind: energy, delegates: steam4}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: cw, direction: out, kind: energy, delegates: cw4}
  - id: R501
    block: HYD
    title: AMS hydrogenation reactor (Pd, fixed bed)
    class: ReactingChemicals
    reactions: [AMS_HYD]
    reactor: conversion
    links: [{target: equipment, ref: R-501}]
    ports:
      - {id: in, direction: in, delegates: feed}
      - {id: h2, direction: in, delegates: h2}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: V501
    block: HYD
    title: Hydrogenation flash drum
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-501}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out, delegates: vent}
      - {id: liq, direction: out, delegates: cumene}

streams:
  # ---- feeds
  - id: S01
    title: Fresh cumene
    from: CUM.out
    to: M101.fresh
    template: process
    state:
      design:
        pressure: {value: 400, provenance: assumed, source: design basis}
        temperature: {value: 313.15, provenance: assumed, source: design basis}
        flow: {value: 33236.8, basis: mass, provenance: assumed, source: "scripts/balance.py (D-002, D-004, D-005)"}
        composition: {basis: mass_fraction, values: {CUM: 1.0}, provenance: assumed, source: D-001}
  - id: S02
    title: Air
    from: AIR.out
    to: K101.in
    template: air
    state:
      design:
        pressure: {value: 101.325, provenance: assumed, source: design basis}
        temperature: {value: 298.15, provenance: assumed, source: design basis}
        flow: {value: 47984.18, basis: mass, provenance: assumed, source: "scripts/balance.py: spent air 5 mol% O2 (D-003)"}
        composition: {basis: mole_fraction, values: {N2: 0.79, O2: 0.21}, provenance: assumed, source: "dry air, Ar counted as N2 (D-003)"}
  - id: S03
    title: Compressed air
    from: K101.out
    to: R101.air
    template: air
    state:
      design:
        pressure: {value: 600, provenance: assumed, source: D-003}
        flow: {value: 47984.18, basis: mass, provenance: calculated, source: 'cheme process propagate: pass-through K101 from S02', fingerprint: d60b304c583f73de}
        composition: {basis: mole_fraction, values: {N2: 0.79, O2: 0.21}, provenance: calculated, source: 'cheme process propagate: pass-through K101 from S02', fingerprint: d60b304c583f73de}
