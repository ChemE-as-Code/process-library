        flow: {value: 158831.0, provenance: calculated, source: 'cheme process propagate: mixer M101 from S01 S09 S11 S29', fingerprint: 8307d912a3212912}
  - id: S05
    title: Oxidiser effluent (oxidate and spent air)
    from: R101.out
    to: V101.in
    template: process
    state:
      design:
        pressure: {value: 500, provenance: assumed, source: D-003}
        temperature: {value: 383.15, provenance: assumed, source: D-003}
        flow: {value: 206815.0, provenance: calculated, source: 'cheme process propagate: reactor R101 from S03 S04', fingerprint: 765368998ea01248}
        composition: {basis: mole_fraction, values: {N2: 0.485299, O2: 0.025542, CUM: 0.381983, CHP: 0.0997475, DMBA: 0.00530572, ACP: 0.00106114, MEOH: 0.00106114, PHEN: 0.0, ACET: 0.0, AMS: 0.0, H2O: 0.0, CUMPH: 0.0, H2: 0.0, H2SO4: 0.0, NAOH: 0.0, NA2SO4: 0.0}, provenance: calculated, source: 'cheme process propagate: reactor R101 from S03 S04', fingerprint: 2b0b90c13ed7de9a}
  - id: S06
    title: Spent air from the oxidisers
    from: V101.gas
    to: A101.in
    template: offgas
    state:
      design:
        flow: {value: 42413.49, basis: mass, provenance: assumed, source: "scripts/balance.py (D-003)"}
        composition: {basis: mass_fraction, values: {N2: 0.867842, O2: 0.052172, CUM: 0.079986}, provenance: assumed, source: "5 mol% O2 dry; 2 mol% cumene vapour (D-003)"}
  - id: S07
    title: Oxidate (25 wt% CHP)
    from: V101.liq
    to: E201.in
    template: process
    state:
