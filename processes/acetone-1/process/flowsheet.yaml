  - id: S15
    title: Neutralised cleavage product
    from: R302.out
    to: V301.in
    template: process
    state:
      design:
        composition: {basis: mole_fraction, values: {CUM: 0.0937077, O2: 0.0, N2: 0.0, CHP: 0.0, DMBA: 1.26921e-18, ACP: 0.00410557, MEOH: 0.00410362, PHEN: 0.380787, ACET: 0.385919, AMS: 0.0153959, H2O: 0.109393, CUMPH: 0.00513197, H2: 0.0, H2SO4: 0.0, NAOH: 7.46322e-08, NA2SO4: 0.00145641}, provenance: calculated, source: 'cheme process propagate: reactor R302 from S13 S14 S30', fingerprint: fbcfa89734839ee1}
        flow: {value: 52640.9, provenance: calculated, source: 'cheme process propagate: reactor R302 from S13 S14 S30', fingerprint: a2b3f03b4de8b8d3}
