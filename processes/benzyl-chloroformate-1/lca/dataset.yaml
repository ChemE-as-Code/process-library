technology: 'Batch plant: phosgene gas dosed over 10 h into neat benzyl alcohol at 278 K and 50 kPa(a)
  (semi-batch, 1.27 mol per mol), the HCl vented as it forms, the crude degassed at 20 kPa(a) in the same
  enamelled vessel and not distilled; the HCl and the excess phosgene destroyed in a caustic scrubber;
  1770 kg per batch, 565 batches a year on a dedicated train'
