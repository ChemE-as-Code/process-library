# Equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes per batch from the recipe (D-003) and R101's model; design pressures, temperatures and
# materials are not set yet (basic engineering); the materials named are the usual choices for
# wet phosgene, HCl and chloroformates (enamelled steel, US 3 966 786 A background), to be
# confirmed (open input). All values ASSUMED.
schema: cheme/equipment/v1
equipment:
  - {tag: R-101, type: StirredTankReactor, service: "Phosgenator: benzyl alcohol charged and cooled, phosgene gas dosed at 50 kPa(a), HCl vented, crude degassed at 20 kPa(a)",
     notes: "1.63 m3 of crude per batch; 2.5 m3 (R10 preferred size, 65 % full, D 1.38 m) as the recipe sizes it from R101's semi-batch model (core ADR 0052), enamelled steel; jacket on brine at 248 K, U 250 W/(m2 K) ASSUMED: peak duty 31.4 kW against 34.4 kW at the charge (recipe); agitator 3 kW; brine reflux condenser and the vent to K-201; phosgene dosing over 10 h interlocked with the cooling, the agitator, the temperature, the pressure and the vent; an emergency relief to the scrubber, not sized yet: the gas release of a cooling failure is 17.6 times K-201's capacity by the screening (D-003, D-005, D-011, D-014)."}
  - {tag: E-102, type: HeatExchanger, service: "Phosgene evaporator: liquid phosgene from phosgene-1 evaporated with tempered water",
     notes: "7.5 kW year average, about 10 kW while dosing (Q3, the 10 h of dosing in a 14 h cycle); small hold-up, inside the phosgene containment (D-004, D-009)."}
  - {tag: K-201, type: VacuumPump, service: "Dry-running vacuum pump for the reactor vent (50 kPa(a)) and the degassing (20 kPa(a)) to the scrubber",
     notes: "Peak vent 58 m3/h at 50 kPa(a) while dosing (cheme process recipe), about 173 m3/h at 20 kPa(a) and 278 K while degassing (D-006), taken as R101's vent capacity at 50 kPa(a) (D-014); 2 kW year average (D-009)."}
  - {tag: T-201, type: Column, service: "Caustic scrubber: HCl absorbed, phosgene destroyed in circulating 10 wt% NaOH",
     notes: "Takes 429 kg of vent and 233 kg of degassing gas per batch (cheme process recipe, cheme process stills); cooling-water cooler 44.7 kW year average; caustic dilution in its sump (M202); circulation pump 1.5 kW (D-007, D-009)."}
