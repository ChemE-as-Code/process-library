        pressure: {value: 50.0, provenance: assumed, source: "US 6 696 590 B2 Ex. 3: 500 mbar (D-005)"}
        flow: {value: 80.274, provenance: calculated, source: 'cheme process propagate: pass-through E101 from S1', fingerprint: 44709b3e276c3a05}
