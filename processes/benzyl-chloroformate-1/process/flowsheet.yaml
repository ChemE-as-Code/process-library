# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Benzyl chloroformate by the phosgenation of benzyl alcohol without base at reduced pressure
# (DESIGN.md D-001), a batch plant: benzyl alcohol is charged to the enamelled reactor R-101 and
# cooled to 278 K, phosgene (liquid from phosgene-1, evaporated) is dosed as a gas at 50 kPa(a);
# the HCl leaves as it forms by the reactor's vent (batch.vent, core ADR 0054), a share of the
# dosed phosgene passes straight through (dosing.absorbed); the crude is then degassed in the
# same vessel at 20 kPa(a) (a batch still, core ADR 0055) and leaves neat, without distillation,
# as the product. Vent and degassing gas go through the vacuum pump to a caustic scrubber.
# The flows are the year averages of the batch recipe (process/recipe.yaml, `cheme process
# recipe`, D-003).
# Where the values come from:
# - feeds, temperatures, pressures, ratios: design basis and D-002..D-007, ASSUMED;
# - R101: cheme's semi-batch model with its vent (the rate laws of PHOSG, CARB, CLBN, D-005),
#   to 0.994 conversion of the alcohol; T101: cheme's batch still (constant relative
#   volatility, D-006); E101, E102: pass-through; M201, M202: mixers; S101: conversion step (all
#   calculated by `cheme process propagate --fill`);
# - the duties: Q2 (R101, `energy_port: q`) and Q4 (T101) are the year-average duties of the
#   semi-batch and still models, written by `cheme process propagate --fill` (core ADR 0059);
#   Q2A, the heat of absorption of the gas left dissolved, which the semi-batch leaves out, and
#   Q1, Q3, Q5 and the power are hand arithmetic, ASSUMED with the arithmetic in the source
#   (D-009); no property package of core covers the reaction mass or the caustic liquor.
schema: cheme/process/v1
kind: flowsheet
title: Benzyl chloroformate by semi-batch phosgenation of benzyl alcohol (1000 t/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 1000 t/a neat benzyl chloroformate, year averages of the batches in 7920 h on a dedicated train (D-002, D-003)", default: true}
tolerance: {abs: 0.05, rel: 0.002}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: BNOH, title: Benzyl alcohol (merchant), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PHOS, title: Liquid phosgene (phosgene-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NAOH, title: Caustic soda 50 wt% (chlor-alkali-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PW, title: Process water (caustic dilution), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: m201, direction: out, kind: energy}
      - {id: s101, direction: out, kind: energy}
  - id: LPS
    title: LP steam 350 kPa(a) (to the tempered-water circuits of the phosgene evaporator and the degassing)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 350, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 412.0, provenance: given, source: "saturation at 350 kPa(a), IAPWS-IF97"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: e102, direction: out, kind: energy}
      - {id: t101, direction: out, kind: energy}
products:
  - {id: BCF, title: Benzyl chloroformate (neat) to cold storage, category: product, ports: [{id: in, direction: in}]}
  - {id: WW, title: Spent scrubber liquor to wastewater treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - id: BRINE
    title: Chilled brine return (253 K)
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 248.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 253.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: e101, direction: in, kind: energy}
      - {id: r101, direction: in, kind: energy}
      - {id: r101_abs, direction: in, kind: energy}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: s101, direction: in, kind: energy}

blocks:
  - id: PREP
    title: Feed preparation
    class: ExchangingThermalEnergy
    ports:
      - {id: bnoh, direction: in}
      - {id: phos, direction: in}
      - {id: charge, direction: out}
      - {id: dose, direction: out}
      - {id: brine, direction: out, kind: energy}
      - {id: steam, direction: in, kind: energy}
  - id: REACT
    title: Phosgenation and degassing (R-101)
    class: ReactingChemicals
    ports:
      - {id: charge, direction: in}
      - {id: dose, direction: in}
      - {id: product, direction: out}
      - {id: vent, direction: out}
      - {id: degas, direction: out}
      - {id: brine, direction: out, kind: energy}
      - {id: brine_abs, direction: out, kind: energy}
      - {id: steam, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: SCRUB
    title: Off-gas destruction (caustic scrubber)
    class: ReactingChemicals
    ports:
      - {id: vent, direction: in}
      - {id: degas, direction: in}
      - {id: naoh, direction: in}
      - {id: pw, direction: in}
      - {id: liquor, direction: out}
      - {id: cw, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: power_pump, direction: in, kind: energy}

steps:
  - id: E101
    block: PREP
    title: Charge cooling to 278 K (R-101 jacket)
    class: Cooling
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in, delegates: bnoh}
      - {id: out, direction: out, delegates: charge}
      - {id: q, direction: out, kind: energy, delegates: brine}
  - id: E102
    block: PREP
    title: Phosgene evaporator
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in, delegates: phos}
      - {id: out, direction: out, delegates: dose}
      - {id: q, direction: in, kind: energy, delegates: steam}
  - id: R101
    block: REACT
    title: Phosgenation (phosgene gas dosed into the cold alcohol at 50 kPa(a), HCl vented)
    class: ReactingChemicals
    reactions: [PHOSG, CARB, CLBN]
    reactor: semibatch
    batch:
      dosing: [{stream: S4, time: 36000, absorbed: 0.95}]
      target: {key: BNOH, conversion: 0.994}
      heat: isothermal
      vent: {stream: S6, components: [HCL, CO2], fraction: {HCL: 0.95}}
      provenance: assumed
      source: "phosgene gas dosed over 10 h at 278 K (8 h exceeds the jacket, D-003) and 50 kPa(a), 95 % of it taken up and 95 % of the HCl leaving as it forms, then the post-reaction to 0.994 conversion of the alcohol (D-005)"
    hazard:
      mtt: 280.65
      reactions: [PHOSG, CARB, CLBN]
      vent_capacity: 173
      provenance: assumed
      source: "D-011: mtt is phosgene's normal boiling point: above it the dissolved excess phosgene boils off and the vent and scrubber, not the jacket, set the limit (core 1.9's default leaves the dosed phosgene out and takes benzyl alcohol's 478.4 K, which says nothing of the phosgene released); reactions: every reaction counted on purpose, CARB (the product with the alcohol left) included, as a cooling failure mid-dosing holds both and no calorimetry shows CARB too slow to run, its rate and heat being ASSUMED (D-014); vent_capacity: the vacuum pump K-201's suction volume, about 173 m3/h (1.5 kmol/h at 20 kPa(a) and 278 K, D-006), the only path from R-101 at its 50 kPa(a), its displacement taken as the same at 50 kPa(a) (D-014); no TD24 (never estimated)"
    energy_port: q
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: charge, direction: in, delegates: charge}
      - {id: dose, direction: in, delegates: dose}
      - {id: out, direction: out}
      - {id: gas, direction: out, delegates: vent}
      - {id: q, direction: out, kind: energy, delegates: brine}
      - {id: q_abs, direction: out, kind: energy, delegates: brine_abs}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: T101
    block: REACT
    title: Degassing of the crude at 20 kPa(a) (R-101)
    class: Distilling
    still:
      pressure: 20
      volatility:
        model: constant
        alpha: {HCL: 30, COCL2: 1, CO2: 100}
        provenance: assumed
        source: "D-006: the vapour pressures of HCl and phosgene at 278 K stand in for their unknown solubilities in the crude (about 2940 and 92 kPa, chemicals 1.5.2); the benzyl compounds are non-volatile (below 0.01 kPa)"
      nonvolatile: [BNOH, BCF, DBC, BNCL]
      boilup: {value: 1.5, unit: kmol/h, provenance: assumed, source: "D-006: gas drawn off by the vacuum pump, about 173 m3/h at 20 kPa(a) and 278 K"}
      end: {residue: {key: COCL2, mole_fraction: 0.0005}}
      outlets: {distillate: gas, residue: crude}
      provenance: assumed
      source: "degassing under vacuum at the reaction temperature, no distillation of the product (D-006, D-008)"
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out, delegates: degas}
      - {id: crude, direction: out, delegates: product}
      - {id: q, direction: in, kind: energy, delegates: steam}
  - id: M201
    block: SCRUB
    title: Off-gas header and vacuum pump
    class: Mixing
    links: [{target: equipment, ref: K-201}]
    ports:
      - {id: vent, direction: in, delegates: vent}
      - {id: degas, direction: in, delegates: degas}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M202
    block: SCRUB
    title: Caustic dilution
    class: Mixing
    links: [{target: equipment, ref: T-201}]
    ports:
      - {id: naoh, direction: in, delegates: naoh}
      - {id: pw, direction: in, delegates: pw}
      - {id: out, direction: out}
  - id: S101
    block: SCRUB
    title: Caustic scrubber (HCl absorbed, phosgene destroyed)
    class: ReactingChemicals
    reactions: [NEUT_HCL, NEUT_PHOS, NEUT_CO2]
    reactor: conversion
    links: [{target: equipment, ref: T-201}]
    ports:
      - {id: gas, direction: in}
      - {id: caustic, direction: in}
      - {id: out, direction: out, delegates: liquor}
      - {id: q, direction: out, kind: energy, delegates: cw}
      - {id: power, direction: in, kind: energy, delegates: power_pump}

streams:
  - id: S1
    title: Benzyl alcohol
    from: BNOH.out
    to: E101.in
    template: alcohol
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "storage (D-004)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 80.274, provenance: assumed, source: "D-002: the alcohol that makes 1000 t/a"}
        composition: {basis: mass_fraction, values: {BNOH: 1.0}, provenance: assumed, source: "dry benzyl alcohol, impurities and water not modelled (D-004)"}
  - id: S2
