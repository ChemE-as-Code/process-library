# Process Atlas manifest of a library utility (process-library#45). Schema:
# schemas/process.schema.json. A manifest-only process: its LCI dataset is lca/datasets/*.yaml,
# written from parameters with sources or ASSUMED (see README.md). Tier 1 form, so
# maturity stays at concept (core's cheme.lci-tier-maturity).
schema: cheme-as-code/process/v1
id: utility-instrument-air
title: "Instrument air, dried, 8 bar(a)"
summary: >-
  Utility dataset: dry instrument air at 8 bar(a) (-40 degC pressure dew point), per kg: compressor power from the isothermal work and an ASSUMED efficiency, heatless dryer purge, heat to cooling water, condensate to treatment.
families: [utilities]
keywords: [utility, instrument air, compressed air, dryer]
facets: {feedstock_basis: [atmospheric, electricity], unit_operations: [compression, adsorption], region: generic}
maturity: concept
validation: {status: unreviewed}
chemistry:
  inputs:
    - {chemical: air, role: feedstock, note: "ambient air, free"}
  outputs:
    - {chemical: instrument-air, role: main-product, inventory_key: "product:instrument-air"}
    - {chemical: wastewater, role: waste, inventory_key: "output:condensate"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:electricity"}
    - {chemical: cooling-water, role: utility, inventory_key: "output:heat-rejected"}
basis: {capacity: "per unit of the utility delivered (the dataset's basis); no plant size"}
references:
  - {title: "Wagner, W. and Pruss, A. (2002) The IAPWS formulation 1995 for the thermodynamic properties of ordinary water substance for general and scientific use, J. Phys. Chem. Ref. Data 31:387"}
  - {title: "Bell, I. H., Wronski, J., Quoilin, S. and Lemort, V. (2014) Pure and pseudo-pure fluid thermophysical property evaluation and the open-source thermophysical property library CoolProp, Ind. Eng. Chem. Res. 53:2498"}
  - {title: "Prohaska, T. et al. (2022) Standard atomic weights of the elements 2021 (IUPAC Technical Report), Pure Appl. Chem. 94:573"}
  - {title: "Herrmann, S., Kretzschmar, H.-J. and Gatley, D. P. (2009) Thermodynamic properties of real moist air, dry air, steam, water, and ice (ASHRAE RP-1485), HVAC&R Research 15:961"}
repository: {url: "https://github.com/ChemE-as-Code/process-library", path: processes/utility-instrument-air, access: private}
