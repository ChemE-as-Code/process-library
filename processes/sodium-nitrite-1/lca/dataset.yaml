    are all in the balance, S5) and the steam comes from the WHB or the site header (the header''s combustion
    is in its background, feed:LPS)'
  source: D-013
- key: emission-excluded:non-routine
  title: non-routine emissions of the plant
  direction: output
  reason: start-up (gauze ignition, absorber filling), shutdown and burner trips release ammonia, NOx
    and N2O; not estimated at the concept stage (D-013)
  source: D-013
- key: emission-excluded:dust
  title: equipment-leaks emissions of DR-301, DR-401
