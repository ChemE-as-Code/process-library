    specification); to be added with the dryer datasheets
  source: D-013
- key: emission-excluded:dissolver
  title: storage-tank emissions of T-201
  direction: output
  reason: 'the soda ash dissolver holds a non-volatile aqueous Na2CO3 solution near 70 degC: no volatile
    component to breathe out; soda dust at the feeder is filtered (ASSUMED)'
  source: D-013
- key: emission-excluded:leaks
  title: equipment-leaks emissions of the plant
  direction: output
  reason: fugitive NH3 and NOx from flanges and seals are not estimated at the concept stage; to be added
    with the P&IDs
  source: D-013
- key: emission-excluded:platinum
  title: non-routine emissions of R-101
  direction: output
  reason: 'platinum and rhodium lost from the gauze (partly recovered in filters) are a material input
    and particulate emission not quantified: no open loss rate for nitrite burners was found (open input,
    D-013)'
  source: D-013
