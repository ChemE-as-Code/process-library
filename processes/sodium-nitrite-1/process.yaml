# Process Atlas manifest of sodium-nitrite-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: sodium-nitrite-1
title: Sodium nitrite from ammonia oxidation and soda absorption (with sodium nitrate by inversion)
summary: >-
  Nitrous gas from the catalytic oxidation of ammonia absorbed in soda solution near
  atmospheric pressure, the nitrite liquor evaporated and crystallised to dried sodium nitrite,
  and the mother-liquor purge inverted with nitric acid to sodium nitrate. Ammonia, soda ash and
  nitric acid from ammonia-1, soda-ash-1 and nitric-acid-1. Concept stage, 20 kt/a NaNO2,
  assumed basis.
description: |
  Liquid ammonia is vaporised, mixed with air to 10.3 mol-% and burnt over Pt/Rh gauzes; a
  waste heat boiler cools the nitrous gas to 200 degC and its steam drives the first effect of
  the liquor evaporator. In an oxidation volume and absorption towers in series the gas meets a
  20 wt-% soda solution; the oxidation degree of the nitric oxide is held near one half
  (NO : NO2 about 1 : 1, the N2O3 ratio) so that nitrite forms and nitrate stays at about one
  twentieth of it. The liquor is concentrated, sodium nitrite crystallised by vacuum cooling,
  centrifuged and dried; most of the mother liquor returns to the evaporator, and a purge that
  removes the nitrate is converted with nitric acid to sodium nitrate, whose nitric oxide goes
  back to the absorbers.

  All values are concept estimates. The burner outlet and duty are calculated by cheme
  (conversion reactor, specified selectivities); absorption, crystallisation and inversion are
  specified values from an independent balance script; the liquors are aqueous electrolytes
  that no ChemE-as-Code property method covers yet. See DESIGN.md of the
  engineering files for every assumption and gated step.
families: [inorganic-chemicals]
keywords: [sodium nitrite, sodium nitrate, nitrous gas, NOx absorption, ammonia oxidation, soda ash, alkaline absorption, crystallisation, inversion, nitric acid]
facets:
  feedstock_basis: [fossil, mineral, atmospheric]
  product_classes: [chemicals]
  unit_operations: [reaction, absorption, evaporation, crystallization, drying]
  region: generic
# Honest claim: concept is the lowest level of the manifest; cheme maturity reports level none
# (feed flows are design choices, absorber and crystallisation specified values), see
# validation.notes and DESIGN.md D-007.
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD with closed mass, component and element balances in every block and step
    (cheme validate, cheme process streams; the absorber and inversion steps balance by
    elements over their reactions). The burner outlet is calculated by cheme (conversion
    reactor with specified selectivities NO 0.97, N2O 0.014, N2 0.016) and cheme's reactor
    duty (2 005 kW) equals the independent script's. The N2O share (79 % of the direct climate
    result) is an analogy to the IPCC nitric-acid default, uncertain by about a factor of 2
    (DESIGN.md D-005, D-013). cheme maturity reaches no level: feed
    flows follow from an assumed product rate, the absorber, crystalliser and inversion are
    specified values, and energy closure is not evaluable in core (no package covers the
    nitrite/nitrate/carbonate liquors). The preliminary gate-to-gate LCI closes in
    mass and elements; every background is a gap. Not reviewed. The chemicals registry has no
    sodium-nitrite, sodium-nitrate, ammonia, sodium-carbonate or nitric-acid entry yet, so the
    main product, co-product and feeds are not listed under chemistry (open library item).
chemistry:
  inputs:
    - {chemical: air, role: feedstock, inventory_key: "feed:AIR", note: "Plant ratios per kg NaNO2 before allocation (the LCI gives the allocated values, x 0.862). Combustion air of the ammonia burner, 4.0 kg per kg NaNO2. The feeds without a registry entry yet: liquid ammonia (feed:NH3, 0.272 kg/kg, from ammonia-1), soda ash (feed:SODA, 0.866 kg/kg, from soda-ash-1), nitric acid 60 wt-% (feed:HNO3, 0.096 kg/kg, from nitric-acid-1); the main product sodium nitrite (product:NANO2) and the co-product sodium nitrate (product:NANO3, 0.160 kg/kg) have none either"}
  outputs:
    - {chemical: carbon-dioxide, role: emission, inventory_key: "emission:CO2", note: "CO2 from the soda ash, 0.359 kg per kg NaNO2 before allocation, in the tail gas"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "Air blower, pumps, centrifuges, dryer fans (ASSUMED), 0.075 kWh per kg NaNO2 before allocation"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "LP steam 450 kPa(a) from the site, 0.80 kWh of heat per kg NaNO2 before allocation; the waste-heat-boiler steam is used internally in the evaporator"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "25/35 C (ASSUMED), absorber coolers and condensers, 2.2 kWh per kg NaNO2 before allocation"}
basis:
  capacity: "2 500 kg/h dried sodium nitrite (99.0 wt-% NaNO2) = 20 kt/a (ASSUMED), with 0.40 t/h sodium nitrate"
  operating_hours_per_year: 8000
  location: generic (not chosen)
