# Process Atlas manifest of hydrogen-bromide-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: hydrogen-bromide-1
title: Hydrogen bromide synthesis burner with catalytic finishing and absorption (48 wt-% hydrobromic acid)
summary: >-
  Bromine vapour burnt in a 5 % excess of hydrogen in a water-cooled burner, the residual
  bromine converted on an activated-carbon bed, the HBr gas absorbed in a graphite falling-film
  absorber to 48 wt-% hydrobromic acid and the tail gas scrubbed with the absorption water;
  bromine (bromine-1, planned) and hydrogen (hydrogen-1) as boundary feeds. Concept stage,
  8 kt/a HBr, assumed basis.
description: |
  Liquid bromine is vaporised with LP steam at 300 kPa(a) and burnt with hydrogen from
  hydrogen-1 in a burner whose chamber is cooled by water; 99.97 % of the bromine reacts in
  the flame (a sourced flame-reactor result), the rest on an adiabatic activated-carbon
  finishing bed at about 175 degC. A graphite block cooler takes the gas to 60 degC and an
  isothermal falling-film absorber dissolves it in weak acid from the tail gas scrubber to
  48 wt-% acid, just above the 47.6 wt-% azeotrope. All absorption water passes the scrubber
  first; the excess hydrogen and the nitrogen of the hydrogen feed leave through the vent.

  All values are concept estimates. The reactor outlets and the burner duty are calculated by
  cheme (a sourced conversion for the burner, ideal-gas equilibrium for the finishing bed); the absorber and scrubber are specified values from an
  independent balance script, and the acid's enthalpy rests on an assumed heat of solution
  because no ChemE-as-Code property method covers HBr-water yet (core #364). See DESIGN.md of
  the engineering files for every assumption and gated step.
families: [inorganic-chemicals]
keywords: [hydrogen bromide, hydrobromic acid, HBr synthesis, bromine, burner, activated carbon, graphite absorber, falling-film absorption, tail gas scrubber, hydrogen]
facets:
  feedstock_basis: [mineral, fossil]
  product_classes: [chemicals]
  unit_operations: [evaporation, reaction, absorption, heat-exchange]
  region: generic
# Honest claim: concept is the lowest level of the manifest; the feeds are assumed states, the
# absorber and scrubber specified values, see validation.notes and DESIGN.md.
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD with closed mass, component and element balances (cheme validate, cheme process
    streams). The burner and finishing-bed outlets are calculated by cheme (99.97 % Br2
    conversion in the flame from US 3 988 427 A; the carbon bed as an ideal-gas equilibrium
    reactor, K = 1.1e13 at 448 K, leaving a Br2 mole fraction of 4e-12); cheme maturity reaches
    no level (assumed feed flows, specified absorber and scrubber splits); cheme's burner duty
    (166.4 kW) equals the independent script's. The absorber, the scrubber and the acid's heat
    of solution are specified or ASSUMED values: no property package covers Br2/HBr gas or
    HBr-water (core #364), so energy closure is not evaluable in core. The preliminary
    gate-to-gate LCI closes in mass and in Br and H; every background is a gap. Not reviewed.
    Main products and feeds are listed under chemistry with their chemicals registry entries
    (issue #251).
chemistry:
  inputs:
    - {chemical: bromine, role: feedstock, note: "feed:BR2, liquid bromine (e.g. bromine-1), 0.988 kg per kg HBr"}
    # no inventory_key on the feeds: the Atlas build would link them by their registry slug;
    # every background stays a gap until the shared vocabulary has fitting entries
    # (lca/mappings.yaml, DESIGN.md D-012)
    - {chemical: hydrogen, role: feedstock, note: "Hydrogen 99.9 mol-% from hydrogen-1 (feed:H2: 0.0133 kg per kg HBr), 5 mol-% excess"}
    - {chemical: water, role: feedstock, note: "Demineralised water for the absorption (feed:DMW), 1.08 kg per kg HBr"}
  outputs:
    - {chemical: hydrogen-bromide, role: main-product, inventory_key: "product:HBRACID", note: "Hydrobromic acid 48 wt-% to storage, counted by mass of the acid (2.083 kg per kg HBr)"}
    - {chemical: hydrogen, role: emission, inventory_key: "emission:H2", note: "Excess hydrogen vented after the tail gas scrubber, 0.62 g per kg HBr"}
  utilities:
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "LP steam 450 kPa(a) for the bromine vaporiser, 0.058 kWh (0.098 kg) per kg HBr"}
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "Pump, burner management, instruments and analysers (ASSUMED)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "25/35 C (ASSUMED), burner, gas cooler and absorber, 0.41 kWh per kg HBr"}
basis:
  capacity: "1 000 kg/h HBr (100 %) as 2 083 kg/h hydrobromic acid 48 wt-% = 8 kt/a HBr (ASSUMED)"
  operating_hours_per_year: 8000
  location: generic (not chosen)
