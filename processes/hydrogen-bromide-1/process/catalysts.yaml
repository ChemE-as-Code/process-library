# Catalysts of hydrogen-bromide-1. Schema `cheme schema catalysts`. The finishing bed R102
# converts the bromine left by the burner (DESIGN.md D-005); no rate law is used.
schema: cheme/catalysts/v1
kind: catalysts
catalysts:
  - id: ACT_C
    name: Activated carbon (finishing bed)
    active_phase: C
    window:
      temperature: [423.15, 473.15]
      pressure: [130.0, 1000.0]
      provenance: given
      source: "US 6 036 936 A (Elf Atochem): gas enters the jacketed active-charcoal finishing stage at 150-200 degC (FIG. 3 variant), pressures 1.3-10 bar(a) preferred (Summary, claims 18-19)"
    sources:
      - https://patents.google.com/patent/US6036936
