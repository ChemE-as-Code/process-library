# Components and templates of hydrogen-bromide-1. Schema cheme/process/v1 (`cheme schema
# process-materials`). molar_mass in kg/kmol, normal_boiling_point in K at 101.325 kPa.
# ideal_gas: formation enthalpy (ATcT), entropy (CRC) and cp/R polynomial (Poling 5th ed.,
# 50-1000 K) as printed by `cheme chemistry thermo` (the `chemicals` package); used by the
# reactors R101/R102 and their duties (D-005). Bromine enters as a liquid; its gas formation
# enthalpy (30.88 kJ/mol) is its vaporisation enthalpy at 298.15 K (D-007). Hydrobromic acid is
# an electrolyte solution: no package covers it (`cheme process methods`), so its
# enthalpy and phase are not calculated by cheme (D-009).
schema: cheme/process/v1
kind: materials
components:
  - id: HBr
    name: Hydrogen bromide
    formula: HBr
    cas: 10035-10-6
    molar_mass: 80.912
    normal_boiling_point: 206.35   # -66.8 degC, Wikipedia "Hydrogen bromide", infobox
    ideal_gas: {dHf_298: -35850.0, S_298: 198.7, cp_R: [3.842, -0.003098, 9.17e-06, -1.032e-08, 4.26e-12], temperature_range: [50, 1000], provenance: given, source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R Poling (5th ed.), via cheme chemistry thermo"}
  - id: Br2
    name: Bromine
    formula: Br2
    cas: 7726-95-6
    molar_mass: 159.808
    normal_boiling_point: 331.9    # 58.8 degC (thermo: Tsat at 101.325 kPa)
    ideal_gas: {dHf_298: 30880.0, S_298: 245.5, cp_R: [3.212, 0.00716, -1.528e-05, 1.445e-08, -4.99e-12], temperature_range: [50, 1000], provenance: given, source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R Poling (5th ed.), via cheme chemistry thermo"}
  - id: H2
    name: Hydrogen
    formula: H2
    cas: 1333-74-0
    molar_mass: 2.016
    normal_boiling_point: 20.28
    ideal_gas: {dHf_298: 0.0, S_298: 130.7, cp_R: [2.883, 0.003681, -7.72e-06, 6.92e-09, -2.13e-12], temperature_range: [50, 1000], provenance: given, source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R Poling (5th ed.), via cheme chemistry thermo"}
  - id: N2
    name: Nitrogen
    formula: N2
    cas: 7727-37-9
    molar_mass: 28.013
    normal_boiling_point: 77.36
    ideal_gas: {dHf_298: 0.0, S_298: 191.6, cp_R: [3.539, -0.000261, 7e-08, 1.57e-09, -9.9e-13], temperature_range: [50, 1000], provenance: given, source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R Poling (5th ed.), via cheme chemistry thermo"}
  - id: H2O
    name: Water
    formula: H2O
    cas: 7732-18-5
    molar_mass: 18.015
    normal_boiling_point: 373.12
    ideal_gas: {dHf_298: -241822.0, S_298: 188.8, cp_R: [4.395, -0.004186, 1.405e-05, -1.564e-08, 6.32e-12], temperature_range: [50, 1000], provenance: given, source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R Poling (5th ed.), via cheme chemistry thermo"}
templates:
  - {id: bromine, title: "Liquid bromine and bromine vapour", components: [Br2]}
  - {id: gas, title: "Hydrogen, burner gas, HBr gas and vent gas", components: [H2, N2, Br2, HBr, H2O]}
  - {id: aqueous, title: "Hydrobromic acid, weak acid and demineralised water", components: [HBr, H2O]}
# property_method is a placeholder: no benchmarked package covers HBr-water (an electrolyte,
# core's electrolyte support) or Br2/HBr gas; stream properties are not filled (D-006).
property_method:
  adapter: thermo
  status: placeholder
