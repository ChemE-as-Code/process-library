- key: cutoff:r102-carbon-spent
  title: R-102 spent activated carbon (bromine-loaded)
  direction: output
  amount: 0.01625
  reason: the spent charge of the R-102 bed to hazardous waste treatment, same amount as the make-up (its
    adsorbed bromine not estimated; ASSUMED)
  catalyst: true
  contains:
  - C
  - Br
  source: D-013
- key: emission-excluded:burner-combustion
  title: combustion emissions of the plant
  direction: output
  reason: 'R101 burns hydrogen in bromine vapour: no air and no carbon enter the flame, so no NOx, CO,
    CO2, CH4, N2O or particulates form; its products are all in the balance (S4). The air of the burner
    start-up (US 6 036 936 A: ignition in air, then bromine replaces air) is non-routine'
  source: D-012
- key: emission-excluded:bromine-slip
  title: non-routine emissions of the plant
  direction: output
  reason: 'bromine in the vent: zero in the balance (Br2 converted in R101/R102 and absorbed); at upsets
    bromine or HBr-bearing gas reaches the scrubber and vent, not estimated at the concept stage'
  source: D-005, D-012
- key: emission-excluded:non-routine
  title: non-routine emissions of the plant
  direction: output
  reason: start-up (purging, ignition), shutdown and burner trips send hydrogen and HBr/Br2-bearing gas
    to the scrubber and vent; not estimated at the concept stage (D-012)
  source: D-012
- key: emission-excluded:tanks
  title: storage-tank emissions of the plant
  direction: output
  reason: bromine and acid storage are outside the boundary (D-001); their breathing is normally scrubbed
    (ASSUMED)
  source: D-012
- key: emission-excluded:leaks
  title: equipment-leaks emissions of the plant
  direction: output
  reason: fugitive Br2, H2 and HBr from flanges and seals are not estimated at the concept stage; to be
    added with the P&IDs
  source: D-012
