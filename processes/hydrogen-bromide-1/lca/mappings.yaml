# hydrogen-bromide-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# None yet (DESIGN.md D-012): the preliminary inventory leaves every background unlinked, so the
# Atlas build reports the exchanges of this internal process as gaps (ADR 0022). What each
# should connect to is in lca/lca.yaml (`missing:`). Candidates once the shared vocabulary has
# them (not active, listed for the consolidated mapping PR):
#   feed:BR2   -> a `bromine` entry (none in lci/mappings.yaml or chemicals/chemicals.yaml yet);
#                 with prefer_atlas the planned Atlas producer bromine-1
#   feed:H2    -> `hydrogen` (kg H2); this feed is 0.986 kg H2 per kg (0.1 mol-% N2), close
#                 enough by mass, or prefer_atlas hydrogen-1 (product H2)
#   feed:DMW   -> a demineralised-water entry (#45: none yet; `water` is raw water)
#   feed:POWER -> the library default (electricity, medium voltage)
#   product:CW -> cooling-water (heat rejected, kWh; Atlas utility-cooling-tower)
#   emission:HBr, emission:H2, emission:Br2 -> biosphere identities for hydrogen bromide,
#                 hydrogen and bromine to air
# The steam is counted as heat delivered (kWh, Q1), not by mass: without the override below the
# utility slug `steam` (kg) would apply and the build refuses the unit mismatch.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:LPS": {use: steam-heat, source: "LP steam 450 kPa(a) for the bromine vaporiser E-101, counted as heat delivered (kWh, Q1; D-007)"}
