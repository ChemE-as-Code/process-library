# Equipment list. Schema: `cheme schema equipment`.
# Concept stage: the items the PFD (process/flowsheet.yaml) needs, no P&ID yet (no sheet).
# Flows and duties from scripts/kraft_balance.py (D-004 to D-011), all ASSUMED; trains, spares,
# sizes, design conditions and materials come at basic engineering. Per ADt = per air-dry
# tonne of pulp (1000 ADt/d, D-002).
schema: cheme/equipment/v1
equipment:
  - {tag: R-101, type: Vessel, service: "Continuous digester with chip steaming and impregnation vessel",
     notes: "170 t/h chips (85 t/h dry wood), 184 t/h white liquor, EA 19 % on wood, ~160 C, kappa ~28, yield 47 % on wood (D-004, D-005); MP steam 1.8 GJ/ADt (D-011). Hot alkaline sulfide service under pressure. ASSUMED."}
  - {tag: W-201, type: Filter, service: "Brown stock wash presses (counter-current) and pressure screens",
