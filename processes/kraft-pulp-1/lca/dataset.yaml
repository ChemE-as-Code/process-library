schema: cheme/lci_dataset/v2
kind: lci_dataset
id: bleached-softwood-kraft-pulp-with-chemical-recovery-1000-adt-d-market-pulp
title: Bleached softwood kraft pulp with chemical recovery (1000 ADt/d market pulp)
description: Unallocated foreground LCI of Bleached softwood kraft pulp with chemical recovery (1000 ADt/d
  market pulp), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Bleached softwood kraft market pulp: continuous digester, O2 delignification, ECF D0-EOP-D1,
  drying machine, 7-effect evaporation to 80 % solids, recovery boiler 84 bar with extraction back-pressure
  turbine and condensing tail, recausticizing, natural gas lime kiln; 1000 ADt/d'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:trs-co-voc
  title: combustion emissions of B-701, K-901
  direction: output
  reason: 'Total reduced sulfur (H2S, methyl mercaptan, dimethyl sulfide; BREF Table 3.13: 0.0007-0.4
    kg S/ADt from the recovery boiler), CO, VOC and the collected non-condensable gases (burnt in the
    boiler or kiln) are not estimated: no sulfur species beyond SO2 are in the component set (D-010)'
  source: DESIGN.md D-010
- key: emission-excluded:kiln-so2-dust
  title: combustion emissions of K-901
  direction: output
  reason: 'Lime kiln SO2 and dust are not estimated: natural gas firing without NCG incineration is assumed,
    but a kiln burning NCG emits SO2 (BREF 2015 Table 3.26 and Figures 3.72-3.73, 3.80-3.81) (D-010)'
  source: DESIGN.md D-010
- key: emission-excluded:dissolving-tank-vent
  title: storage-tank emissions of T-702
  direction: output
  reason: 'The smelt dissolving tank vent (water vapour with sodium salt particulates and TRS, scrubbed;
    BREF 2015 sec. 3.2.2.6) is not a stream of the flowsheet: its water is counted in the green liquor
    balance and its particulates and TRS are not estimated (D-010)'
  source: DESIGN.md D-010
- key: emission-excluded:diffuse-and-water-organics
  title: effluent emissions of R-401, E-601
  direction: output
  reason: Methanol and reduced sulfur in the evaporator foul condensates, chlorate and chlorinated organics
    (AOX) of the ClO2 stages and the chelating agents are not components; the effluent is passed to treatment
    as a waste flow with its lumped composition (D-008)
  source: DESIGN.md D-008
