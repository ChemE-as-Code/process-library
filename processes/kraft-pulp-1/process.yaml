  - {title: "Tran, H. and Vakkilainen, E. K. (2007) Advances in the kraft chemical recovery process. 3rd ICEP International Colloquium on Eucalyptus Pulp, Belo Horizonte (recovery ~97 %, reduction > 90 %, causticizing 80-83 %, black liquor 13-15 MJ/kg, steam ~3.5 kg/kg solids, 84 bar 480 C unit)", url: "https://www.eucalyptus.com.br/icep03/200Tran.text.pdf.pdf"}
  - {title: "US EPA (1990, reformatted 1995) AP-42 Fifth Edition, Volume I, Section 10.2 Chemical Wood Pulping (process description; NOx order of magnitude from kilns and recovery furnaces)", url: "https://www.epa.gov/sites/default/files/2020-10/documents/c10s02.pdf"}
