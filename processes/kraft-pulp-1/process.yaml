# Process Atlas manifest of kraft-pulp-1. Schema: schemas/process.schema.json (cheme-as-code/process/v1).
# plant.yaml stays the engineering manifest; sheets and results are derived from the
# ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: kraft-pulp-1
title: Bleached softwood kraft pulp with chemical recovery (1000 ADt/d market pulp, concept)
summary: >-
  Softwood chips to bleached kraft market pulp: continuous digester, brown stock washing, O2
  delignification, ECF bleaching outline, drying machine, black liquor evaporation, recovery
  boiler, recausticizing and lime kiln, with the turbine generator; biogenic and fossil CO2
  kept apart. Concept stage, assumed basis.
description: |
  Chips are cooked with white liquor (NaOH and Na2S) in a continuous digester; the brown stock
  is washed counter-currently with the O2-stage filtrate, delignified with oxygen, bleached in
  a D0-EOP-D1 sequence (outline) and dried to 90 % dry market pulp. The weak black liquor is
  evaporated to 80 % solids and burnt in the recovery boiler: the organics raise HP steam for
  an extraction back-pressure turbine with a condensing tail, and the smelt (Na2CO3, Na2S) is
  dissolved to green liquor, causticized with lime to white liquor and returned to the
  digester. The lime mud is reburned in a natural gas fired kiln. Sodium and sulfur losses
  are made up with NaOH and saltcake, calcium losses with purchased lime.

  All flows are concept estimates of an independent balance (scripts/kraft_balance.py) on
  lumped model components for wood and black liquor, with sourced ranges (JRC pulp and paper
  BREF 2015, Tran and Vakkilainen) and assumed design parameters. No wood, black liquor or
  electrolyte thermodynamics is calculated. See DESIGN.md for every assumption and gated step.
# No pulp-and-paper family exists in taxonomy/families.yaml yet (ISIC 1701, NACE 17.11):
# bio-based-chemicals is the nearest; listed as missing for the consolidated registry PR.
families: [bio-based-chemicals]
keywords: [kraft pulp, bleached softwood kraft, market pulp, chemical pulping, continuous digester, oxygen delignification, ECF bleaching, black liquor, recovery boiler, causticizing, lime kiln, biogenic CO2]
facets:
  feedstock_basis: [biogenic]
  product_classes: [materials]
  unit_operations: [reaction, washing, evaporation, combustion, calcination, filtration, drying, power-generation]
  region: generic
# Honest claim: concept is the lowest level of the manifest; every design parameter is
# assumed or a sourced range, the components are lumped.
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept BFD/PFD with closed mass, component and element balances (cheme validate, cheme
    process streams: 10 blocks, 17 steps, reactive steps balanced by extents of lumped
    bookkeeping reactions). Flows and compositions are specified values of an independent
    balance (scripts/kraft_balance.py) whose element residuals are below 1e-6 kmol/h. Wood and
    black liquor are lumped model components (not molecular identities), no electrolyte
    speciation (core #364) and no property package covers the streams, so the energy balance is
    not evaluable in core: duties are sourced specific consumptions split by consumer
    (ASSUMED). The gate-to-gate LCI is preliminary, every background unmapped. Not reviewed.
chemistry:
  inputs:
    - {chemical: oxygen, role: feedstock, inventory_key: "feed:O2", note: "O2 delignification and EOP stage; asu-1 makes it"}
    - {chemical: water, role: feedstock, inventory_key: "feed:FW", note: "Process water to the bleach plant and post-O2 washing"}
    - {chemical: air, role: feedstock, inventory_key: "feed:AIR", note: "Recovery boiler and kiln combustion air"}
    - {chemical: methane, role: feedstock, inventory_key: "feed:NG", note: "Natural gas (as methane) to the lime kiln. Wood chips, NaOH, ClO2, H2O2, H2SO4, Na2SO4 and CaO have no registry entries yet (DESIGN.md section 5)"}
  outputs:
    - {chemical: electricity, role: co-product, inventory_key: "product:EEXP", note: "Net export, 263 kWh/ADt (D-014). The main product (bleached kraft pulp) has no registry entry yet"}
    - {chemical: wastewater, role: waste, inventory_key: "product:WW", note: "Bleach plant effluent, 18 m3/ADt to biological treatment"}
    - {chemical: carbon-dioxide, role: emission, inventory_key: "product:STACK", note: "Mostly biogenic (black liquor, lime mud); fossil from kiln natural gas"}
  utilities:
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "25/35 C (ASSUMED)"}
basis:
  capacity: "1000 ADt/d bleached softwood kraft market pulp (ASSUMED normalisation basis)"
  operating_hours_per_year: 8400
  location: generic (not chosen)
lca: {source: auto}
