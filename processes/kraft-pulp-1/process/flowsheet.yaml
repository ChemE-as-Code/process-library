# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Bleached softwood kraft market pulp mill with chemical recovery, 1000 ADt/d (D-001, D-002).
# Where the values come from:
# - every flow and composition is from the independent sequential balance
#   scripts/kraft_balance.py (`cheme run scripts/kraft_balance.py --yaml`), given here as
#   ASSUMED: it rests on sourced ranges and ASSUMED design parameters (wood composition,
#   yields, alkali and bleaching charges, washing carry-over, reduction, causticity,
#   calcination; DESIGN.md D-003 to D-010) and on lumped model components for wood and black
#   liquor (materials.yaml), because core represents neither wood nor electrolyte liquors (D-007);
# - reactive steps name their reactions (process/reactions.yaml): cheme checks their element
#   balances by extents;
# - duties are from the same script (D-011): sourced specific heat and power figures split by
#   consumer (ASSUMED), recovery boiler steam from the steam-to-solids ratio, turbine with
#   IAPWS-IF97 (CoolProp); no property package covers these streams, so cheme cannot close
#   the energy balance (D-011);
# - temperatures and pressures are ASSUMED nominal values (D-013).
schema: cheme/process/v1
kind: flowsheet
title: Bleached softwood kraft pulp with chemical recovery (1000 ADt/d market pulp)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - id: design
    description: "Design case: 1000 ADt/d bleached softwood kraft market pulp (90 % dry), 8400 h/a (D-002)"
    default: true
    capacity: 1000 ADt/d bleached softwood kraft pulp
    provenance: assumed
    source: "D-002: a normalisation basis for the inventory, not a commercial plant claim"
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: CHIPS, title: "Softwood chips, screened (50 % moisture)", category: raw_material, ports: [{id: out, direction: out}]}
  - id: NAOH
    title: Sodium hydroxide 50 wt% (make-up to the O2 stage, bleaching alkali)
    category: raw_material
    ports: [{id: o2, direction: out}, {id: ble, direction: out}]
  - id: O2
    title: Oxygen (O2 delignification and EOP stage)
    category: raw_material
    ports: [{id: o2, direction: out}, {id: ble, direction: out}]
  - {id: CLO2, title: "Chlorine dioxide water, 10 g/kg (generated outside the boundary)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: H2O2, title: Hydrogen peroxide 50 wt%, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: H2SO4, title: Sulfuric acid 93 wt%, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: SALT, title: Sodium sulfate (saltcake make-up), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: CAO, title: Purchased burnt lime (Ca make-up), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NG, title: Natural gas (lime kiln fuel), category: raw_material, ports: [{id: out, direction: out}]}
  - id: AIR
    title: Combustion air
    category: raw_material
    ports: [{id: rb, direction: out}, {id: kiln, direction: out}]
  - id: FW
    title: Process water (fresh, treated)
    category: raw_material
    ports: [{id: ble, direction: out}, {id: w301, direction: out}]
products:
  - {id: PULP, title: "Bleached softwood kraft market pulp, 90 % dry (bales)", category: product, ports: [{id: in, direction: in}]}
  - id: EEXP
    title: Electricity export to the grid (turbine generation less mill use)
    category: by_product
    ports: [{id: in, direction: in, kind: energy}]
  - {id: WW, title: Bleach plant effluent to the biological treatment plant, category: wastewater, ports: [{id: in, direction: in}]}
  - id: STACK
    title: Flue gases (recovery boiler after ESP, lime kiln) to stack
    category: off_gas
    ports: [{id: rb, direction: in}, {id: kiln, direction: in}]
  - id: VENT
    title: Vents to atmosphere (O2 stage, bleach plant, pulp dryer exhaust)
    category: off_gas
    ports: [{id: o2, direction: in}, {id: ble, direction: in}, {id: dry, direction: in}]
  - id: SW
    title: Solid wastes to landfill (dregs, grits, lime mud purge)
    category: solid_waste
    ports: [{id: dregs, direction: in}, {id: grits, direction: in}, {id: mud, direction: in}]
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-011"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-011"}
      min_approach: {value: 5, provenance: assumed, source: D-011}
    ports:
      - {id: e601, direction: in, kind: energy}
      - {id: u1001, direction: in, kind: energy}

blocks:
  - id: DIG
    title: Cooking (chip steaming, continuous digester)
    class: ReactingChemicals
    ports:
      - {id: chips, direction: in}
      - {id: wl, direction: in}
      - {id: out, direction: out}
      - {id: mp, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: BSW
    title: Brown stock washing and screening
    class: Filtering
    ports:
      - {id: in, direction: in}
      - {id: filt, direction: in}
      - {id: pulp, direction: out}
      - {id: wbl, direction: out}
      - {id: power, direction: in, kind: energy}
  - id: OXD
    title: Oxygen delignification and post-O2 washing
    class: ReactingChemicals
    ports:
      - {id: pulp, direction: in}
      - {id: naoh, direction: in}
      - {id: wl, direction: in}
      - {id: o2, direction: in}
      - {id: cond, direction: in}
      - {id: water, direction: in}
      - {id: vent, direction: out}
      - {id: pulp_out, direction: out}
      - {id: filt, direction: out}
      - {id: mp, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: BLE
    title: ECF bleaching D0-EOP-D1 (outline)
    class: ReactingChemicals
    ports:
      - {id: pulp, direction: in}
      - {id: clo2, direction: in}
      - {id: naoh, direction: in}
      - {id: h2o2, direction: in}
      - {id: acid, direction: in}
      - {id: o2, direction: in}
      - {id: water, direction: in}
      - {id: press, direction: in}
      - {id: pulp_out, direction: out}
      - {id: eff, direction: out}
      - {id: vent, direction: out}
      - {id: mp, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: DRY
    title: Pulp drying machine
    class: Drying
    ports:
      - {id: in, direction: in}
      - {id: press, direction: out}
      - {id: prod, direction: out}
      - {id: vap, direction: out}
      - {id: lp, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: EVP
    title: Black liquor evaporation
    class: Evaporating
    ports:
      - {id: wbl, direction: in}
      - {id: sbl, direction: out}
      - {id: c_oxd, direction: out}
      - {id: c_mud, direction: out}
      - {id: c_dt, direction: out}
      - {id: lp, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: REC
    title: Recovery boiler and smelt dissolving
    class: ReactingChemicals
    ports:
      - {id: sbl, direction: in}
      - {id: salt, direction: in}
      - {id: air, direction: in}
      - {id: ww, direction: in}
      - {id: cond, direction: in}
      - {id: flue, direction: out}
      - {id: gl, direction: out}
      - {id: mp, direction: in, kind: energy}
      - {id: steam, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: CAU
    title: Recausticizing (green liquor clarification, slaking, causticizing, white liquor and lime mud filtration)
    class: ReactingChemicals
    ports:
      - {id: gl, direction: in}
      - {id: cao, direction: in}
      - {id: lime, direction: in}
      - {id: wash, direction: in}
      - {id: dregs, direction: out}
      - {id: grits, direction: out}
      - {id: wl_dig, direction: out}
      - {id: wl_o2, direction: out}
      - {id: ww, direction: out}
      - {id: purge, direction: out}
      - {id: mud, direction: out}
      - {id: power, direction: in, kind: energy}
  - id: KLN
    title: Lime kiln
    class: ReactingChemicals
    ports:
      - {id: mud, direction: in}
      - {id: fuel, direction: in}
      - {id: air, direction: in}
      - {id: gas, direction: out}
      - {id: lime, direction: out}
      - {id: power, direction: in, kind: energy}
  - id: UTL
    title: Steam turbine generator and steam distribution
    class: ProcessStep
    ports:
      - {id: hp, direction: in, kind: energy}
      - {id: mp_dig, direction: out, kind: energy}
      - {id: mp_oxd, direction: out, kind: energy}
      - {id: mp_ble, direction: out, kind: energy}
      - {id: mp_rec, direction: out, kind: energy}
      - {id: lp_evp, direction: out, kind: energy}
      - {id: lp_dry, direction: out, kind: energy}
      - {id: pw_dig, direction: out, kind: energy}
      - {id: pw_bsw, direction: out, kind: energy}
      - {id: pw_oxd, direction: out, kind: energy}
      - {id: pw_ble, direction: out, kind: energy}
      - {id: pw_dry, direction: out, kind: energy}
      - {id: pw_evp, direction: out, kind: energy}
      - {id: pw_rec, direction: out, kind: energy}
      - {id: pw_cau, direction: out, kind: energy}
      - {id: pw_kln, direction: out, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: exp, direction: out, kind: energy}

steps:
  - id: R101
    block: DIG
    title: Continuous digester (with chip steaming and impregnation)
    class: ReactingChemicals
    reactions: [COOK_LIG, PEEL_C, PEEL_H, SAPON]
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: chips, direction: in, delegates: chips}
      - {id: wl, direction: in, delegates: wl}
      - {id: out, direction: out, delegates: out}
      - {id: mp, direction: in, kind: energy, delegates: mp}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: W201
    block: BSW
    title: Brown stock wash presses (counter-current) and screening
    class: Filtering
    links: [{target: equipment, ref: W-201}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: filt, direction: in, delegates: filt}
      - {id: pulp, direction: out, delegates: pulp}
      - {id: wbl, direction: out, delegates: wbl}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: R301
    block: OXD
    title: Two-stage medium-consistency O2 delignification reactor
    class: ReactingChemicals
    reactions: [OXD_LIG, PEEL_H, SULF_OX]
    links: [{target: equipment, ref: R-301}]
    ports:
      - {id: pulp, direction: in, delegates: pulp}
      - {id: naoh, direction: in, delegates: naoh}
      - {id: wl, direction: in, delegates: wl}
      - {id: o2, direction: in, delegates: o2}
      - {id: out, direction: out}
      - {id: vent, direction: out, delegates: vent}
      - {id: mp, direction: in, kind: energy, delegates: mp}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: W301
    block: OXD
    title: Post-O2 wash presses
    class: Filtering
    links: [{target: equipment, ref: W-301}]
    ports:
      - {id: in, direction: in}
      - {id: cond, direction: in, delegates: cond}
      - {id: water, direction: in, delegates: water}
      - {id: pulp, direction: out, delegates: pulp_out}
      - {id: filt, direction: out, delegates: filt}
  - id: R401
    block: BLE
    title: Bleach plant D0-EOP-D1 with washers (lumped)
    class: ReactingChemicals
    # BL_O2 = BL_H2O2 - PER_DEC/2 is linearly dependent: the EOP oxygen that reacts is
    # counted through BL_H2O2 and PER_DEC (net oxygen released), so extents stay unique
    reactions: [BL_CLO2, BL_H2O2, PER_DEC, CARB_OX, PEEL_C, PEEL_H, NEUT]
    links: [{target: equipment, ref: R-401}]
    ports:
      - {id: pulp, direction: in, delegates: pulp}
      - {id: clo2, direction: in, delegates: clo2}
      - {id: naoh, direction: in, delegates: naoh}
      - {id: h2o2, direction: in, delegates: h2o2}
      - {id: acid, direction: in, delegates: acid}
      - {id: o2, direction: in, delegates: o2}
      - {id: water, direction: in, delegates: water}
      - {id: press, direction: in, delegates: press}
      - {id: pulp_out, direction: out, delegates: pulp_out}
      - {id: eff, direction: out, delegates: eff}
      - {id: vent, direction: out, delegates: vent}
      - {id: mp, direction: in, kind: energy, delegates: mp}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: D501
    block: DRY
    title: Pulp drying machine (wire and press section, airborne dryer, baling)
    class: Drying
    links: [{target: equipment, ref: D-501}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: press, direction: out, delegates: press}
      - {id: prod, direction: out, delegates: prod}
      - {id: vap, direction: out, delegates: vap}
      - {id: lp, direction: in, kind: energy, delegates: lp}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E601
    block: EVP
    title: Seven-effect evaporator train with concentrator (15 to 80 % solids)
    class: Evaporating
    links: [{target: equipment, ref: E-601}]
    ports:
      - {id: wbl, direction: in, delegates: wbl}
      - {id: sbl, direction: out, delegates: sbl}
      - {id: c_oxd, direction: out, delegates: c_oxd}
      - {id: c_mud, direction: out, delegates: c_mud}
      - {id: c_dt, direction: out, delegates: c_dt}
      - {id: lp, direction: in, kind: energy, delegates: lp}
      - {id: cw, direction: out, kind: energy, delegates: cw}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: B701
    block: REC
    title: Recovery boiler (with ESP)
    class: ReactingChemicals
    reactions: [BURN_LIG, BURN_OXL, BURN_ISA, BURN_EXT, CARBON, REDUC, SO2_REL, NOX]
    links: [{target: equipment, ref: B-701}]
    ports:
      - {id: sbl, direction: in, delegates: sbl}
      - {id: salt, direction: in, delegates: salt}
      - {id: air, direction: in, delegates: air}
      - {id: flue, direction: out, delegates: flue}
      - {id: smelt, direction: out}
      - {id: mp, direction: in, kind: energy, delegates: mp}
      - {id: steam, direction: out, kind: energy, delegates: steam}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: T702
    block: REC
    title: Smelt dissolving tank
    class: Mixing
    links: [{target: equipment, ref: T-702}]
    ports:
      - {id: smelt, direction: in}
      - {id: ww, direction: in, delegates: ww}
      - {id: cond, direction: in, delegates: cond}
      - {id: gl, direction: out, delegates: gl}
  - id: C801
    block: CAU
    title: Green liquor clarifier (dregs removal)
    class: Separating
    links: [{target: equipment, ref: C-801}]
    ports:
      - {id: in, direction: in, delegates: gl}
      - {id: dregs, direction: out, delegates: dregs}
      - {id: gl, direction: out}
  - id: R802
    block: CAU
    title: Slaker and causticizers (grits removal)
    class: ReactingChemicals
    reactions: [SLAKE, CAUST]
    links: [{target: equipment, ref: R-802}]
    ports:
      - {id: gl, direction: in}
      - {id: lime, direction: in, delegates: lime}
      - {id: cao, direction: in, delegates: cao}
      - {id: grits, direction: out, delegates: grits}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: F804
    block: CAU
    title: White liquor pressure disc filter
    class: Filtering
    links: [{target: equipment, ref: F-804}]
    ports:
      - {id: in, direction: in}
      - {id: wl, direction: out}
      - {id: mud, direction: out}
  - id: X805
    block: CAU
    title: White liquor distribution (digester, O2 stage)
    class: Splitting
    ports:
      - {id: in, direction: in}
      - {id: dig, direction: out, delegates: wl_dig}
      - {id: o2, direction: out, delegates: wl_o2}
  - id: F806
    block: CAU
    title: Lime mud washer and precoat mud filter
    class: Filtering
    links: [{target: equipment, ref: F-806}]
    ports:
      - {id: mud, direction: in}
      - {id: wash, direction: in, delegates: wash}
      - {id: ww, direction: out, delegates: ww}
      - {id: purge, direction: out, delegates: purge}
      - {id: kiln, direction: out, delegates: mud}
  - id: K901
    block: KLN
    title: Rotary lime kiln (natural gas fired)
    class: ReactingChemicals
    reactions: [CALC, COMB_NG, NOX]
    links: [{target: equipment, ref: K-901}]
    ports:
      - {id: mud, direction: in, delegates: mud}
      - {id: fuel, direction: in, delegates: fuel}
      - {id: air, direction: in, delegates: air}
      - {id: gas, direction: out, delegates: gas}
      - {id: lime, direction: out, delegates: lime}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: U1001
    block: UTL
    title: Extraction back-pressure turbine with condensing tail, generator, deaerator and steam headers
    class: ProcessStep
    links: [{target: equipment, ref: TG-1001}]
    ports:
      - {id: hp, direction: in, kind: energy, delegates: hp}
      - {id: mp_dig, direction: out, kind: energy, delegates: mp_dig}
      - {id: mp_oxd, direction: out, kind: energy, delegates: mp_oxd}
      - {id: mp_ble, direction: out, kind: energy, delegates: mp_ble}
      - {id: mp_rec, direction: out, kind: energy, delegates: mp_rec}
      - {id: lp_evp, direction: out, kind: energy, delegates: lp_evp}
      - {id: lp_dry, direction: out, kind: energy, delegates: lp_dry}
      - {id: pw_dig, direction: out, kind: energy, delegates: pw_dig}
      - {id: pw_bsw, direction: out, kind: energy, delegates: pw_bsw}
      - {id: pw_oxd, direction: out, kind: energy, delegates: pw_oxd}
      - {id: pw_ble, direction: out, kind: energy, delegates: pw_ble}
      - {id: pw_dry, direction: out, kind: energy, delegates: pw_dry}
      - {id: pw_evp, direction: out, kind: energy, delegates: pw_evp}
      - {id: pw_rec, direction: out, kind: energy, delegates: pw_rec}
      - {id: pw_cau, direction: out, kind: energy, delegates: pw_cau}
      - {id: pw_kln, direction: out, kind: energy, delegates: pw_kln}
      - {id: cw, direction: out, kind: energy, delegates: cw}
      - {id: exp, direction: out, kind: energy, delegates: exp}

# Values: B = scripts/kraft_balance.py (D-004 to D-010); conditions ASSUMED nominal (D-013).
streams:
  - {id: S1, title: Softwood chips, from: CHIPS.out, to: R101.chips, template: kraft, state: {design: {pressure: {value: 101.325, provenance: assumed, source: D-013}, temperature: {value: 288.15, provenance: assumed, source: D-013}, flow: {value: 170454.5, basis: mass, provenance: assumed, source: "scripts/kraft_balance.py: 2045 kg dry wood/ADt at 44 % bleached yield (D-003, D-004)"}, composition: {basis: mass_fraction, values: {H2O: 0.5, CELL: 0.205, HEMI: 0.14, LIG: 0.135, EXTR: 0.0175, ASH: 0.0025}, provenance: assumed, source: "D-003"}}}}
  - {id: S2, title: White liquor to the digester, from: X805.dig, to: R101.wl, template: kraft, state: {design: {pressure: {value: 800, provenance: assumed, source: D-013}, temperature: {value: 358.15, provenance: assumed, source: D-013}, flow: {value: 183783.7, basis: mass, provenance: assumed, source: "scripts/kraft_balance.py: EA 19 % on wood, sulfidity 35 %, causticity 81 %, reduction 92 % (D-005)"}, composition: {basis: mass_fraction, values: {H2O: 0.866767, NaOH: 0.06942, Na2S: 0.036467, Na2CO3: 0.021575, Na2SO4: 0.005771}, provenance: assumed, source: "scripts/kraft_balance.py (D-005)"}}}}
  - {id: S3, title: Cooked brown stock with black liquor, from: R101.out, to: W201.in, template: kraft, state: {design: {pressure: {value: 300, provenance: assumed, source: D-013}, temperature: {value: 363.15, provenance: assumed, source: D-013}, flow: {value: 354238.2, basis: mass, provenance: assumed, source: "scripts/kraft_balance.py (D-004)"}, composition: {basis: mass_fraction, values: {H2O: 0.696798, CELL: 0.090463, HEMI: 0.017804, LIG: 0.004812, ASH: 0.001203, NaOH: 0.007308, Na2S: 0.01892, Na2CO3: 0.011193, Na2SO4: 0.002994, NaLIG: 0.067485, NaISA: 0.071986, NaEXT: 0.009033}, provenance: assumed, source: "scripts/kraft_balance.py (D-004)"}}}}
  - {id: S4, title: Washed brown stock (25 % consistency), from: W201.pulp, to: R301.pulp, template: kraft, state: {design: {pressure: {value: 101.325, provenance: assumed, source: D-013}, temperature: {value: 343.15, provenance: assumed, source: D-013}, flow: {value: 160227.3, basis: mass, provenance: assumed, source: "scripts/kraft_balance.py: 3 % of dissolved solids carried (D-006)"}, composition: {basis: mass_fraction, values: {H2O: 0.73642, CELL: 0.2, HEMI: 0.039362, LIG: 0.010638, ASH: 0.000082, NaOH: 0.000615, Na2S: 0.001255, Na2CO3: 0.000809, Na2SO4: 0.00042, NaLIG: 0.004606, NaOXL: 0.000187, NaISA: 0.00499, NaEXT: 0.000616}, provenance: assumed, source: "scripts/kraft_balance.py (D-006)"}}}}
