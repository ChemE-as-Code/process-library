# Tagged piping special items: relief devices, silencers. Schema: `cheme schema piping_items`.
# Sizes are basic-engineering estimates (D-031); the vendor sizes them at detail.
schema: cheme/piping_items/v1
piping_items:
  - tag: PSE-2045A
    type: RuptureDisc
    line: 150-VT-2027A
    sheet: P-202
    set_pressure_barg: 2.5
    relief_case: >-
      SIP steam valves failed open: 3 t/h of LP steam (ASSUMED), 0.45 m3/s at relieving conditions,
      25 m/s in DN 150; governs over PCV-2042A failed open (restricted trim, 1500 Nm3/h N2 at 6 barg,
      ASSUMED: 0.14 m3/s). Sanitary reverse-acting disc, tagged by a note (pyDEXPI RuptureDisc
      carries no tag). Typical of R-201A to P (D-019, D-031).
  - tag: PSV-2046A
    type: CheckValve
    line: 150-NS-2026A
    sheet: P-202
    set_pressure_barg: -0.2
    relief_case: >-
      Loss of N2 make-up during the controlled cool-down after SIP: 1300 m3/h of air through F-202A
      (D-019). Drawn as a check valve (no vacuum relief valve class in the authoring API). The
      uncontrolled steam-collapse cases (about 24 000 m3/h) are prevented by I-204 and the CIP/fill
      permissives, not relieved (D-031).
