# Tagged piping special items: relief devices, silencers. Schema: `cheme schema piping_items`.
# Sizes are basic-engineering estimates (D-031); the vendor sizes them at detail.
schema: cheme/piping_items/v1
piping_items:
  - tag: PSE-2045A
    type: RuptureDisc
    line: 150-VT-2027A
    sheet: P-202
    set_pressure_barg: 2.5
    relief_case: >-
      SIP steam paths full open from the LP header at 4.5 bar(a) (design basis) into the vessel at
      3.75 bar(a) relieving (2.5 barg + 10 %): 100-SS-2020A and 80-SS-2021A, each with an ASSUMED
      resistance K = 10 (take-off, steam filter, ball valves, bends), 0.75 bar across them, about
      79 m/s: 1.55 + 0.95 = 2.5 kg/s (9 t/h), 1.25 m3/s at 2.0 kg/m3. The DN 150 disc to atmosphere
      is choked: about 360 kg/(m2 s) with Kd 0.62 (ASSUMED), 6.7 kg/s, 2.7 times the load. Governs
      over PCV-2042A failed open (restricted trim, 1500 Nm3/h N2 at 6 barg, ASSUMED: 0.52 kg/s).
      Burst indicator XA-2045A (alarm). Sanitary reverse-acting disc, tagged by a note (pyDEXPI
      RuptureDisc carries no tag). Typical of R-201A to P (D-019, D-031, D-033).
  - tag: PSV-2046A
    type: CheckValve
    line: 150-NS-2026A
    sheet: P-202
    set_pressure_barg: -0.2
    relief_case: >-
      Loss of N2 make-up during the controlled cool-down after SIP: 1300 m3/h of air through F-202A
      (D-019). Drawn as a check valve (no vacuum relief valve class in the authoring API), tagged
      and labelled "vacuum relief -0.2 barg" on P-202 (D-033). The
      uncontrolled steam-collapse cases (about 24 000 m3/h) are prevented by I-204 and the CIP/fill
      permissives, not relieved (D-031).
  # Seed fermenters (D-036, review S3#1): DN 25 sanitary rupture discs, tagged by the connector
  # text on P-201, P-205, P-208 (pyDEXPI RuptureDisc carries no tag).
  - tag: PSE-2115A
    type: RuptureDisc
    line: 25-VT-2155A
    sheet: P-201
    set_pressure_barg: 3.0
    relief_case: >-
      Governing: N2 reducer PCV-2116A and PV-2114A both failed open from the 6 barg header; the
      restricted trim of PCV-2116A passes at most 150 Nm3/h (ASSUMED, 0.052 kg/s). The DN 25 disc at
      4.3 bar(a) relieving (3.0 barg + 10 %) is choked: about 1000 kg/(m2 s) for N2 at 293 K, with
      Kd 0.62 (ASSUMED) 0.30 kg/s, 5.8 times the load. SIP steam (15-SS-2148 block feeds and
      25-SS-2150 at the bottom, at most about 0.1 kg/s at the 0.2 bar left between the 4.5 bar(a) LP
      header and the relieving pressure) against about 0.20 kg/s of steam through the disc: 2 times.
      Transfer: R-211A pushes at under 1 barg (local, D-030).
  - {tag: PSE-2125A, type: RuptureDisc, line: 25-VT-2156A, sheet: P-201, set_pressure_barg: 3.0, relief_case: "As PSE-2115A with PCV-2126A and PV-2124A (D-036)."}
  - tag: PSE-2135A
    type: RuptureDisc
    line: 25-VT-2157A
    sheet: P-201
    set_pressure_barg: 6.0
    relief_case: >-
      R-213A is designed for 6.0 barg, the N2 header's pressure; PCV-2136A (4.0 barg, restricted
      trim 150 Nm3/h, ASSUMED) limits the transfer pressure (3.5 barg, D-030). Governing: an N2
      header excursion above 6 barg with PCV-2136A failed open: 0.052 kg/s against about 0.54 kg/s
      of N2 through the DN 25 disc at 7.6 bar(a); SIP steam as PSE-2115A, with more margin at the
      higher set pressure (D-036).
  - {tag: PSE-2115B, type: RuptureDisc, line: 25-VT-2155B, sheet: P-205, set_pressure_barg: 3.0, relief_case: "As PSE-2115A."}
  - {tag: PSE-2125B, type: RuptureDisc, line: 25-VT-2156B, sheet: P-205, set_pressure_barg: 3.0, relief_case: "As PSE-2125A."}
  - {tag: PSE-2135B, type: RuptureDisc, line: 25-VT-2157B, sheet: P-205, set_pressure_barg: 6.0, relief_case: "As PSE-2135A."}
  - {tag: PSE-2115C, type: RuptureDisc, line: 25-VT-2155C, sheet: P-208, set_pressure_barg: 3.0, relief_case: "As PSE-2115A."}
  - {tag: PSE-2125C, type: RuptureDisc, line: 25-VT-2156C, sheet: P-208, set_pressure_barg: 3.0, relief_case: "As PSE-2125A."}
  - {tag: PSE-2135C, type: RuptureDisc, line: 25-VT-2157C, sheet: P-208, set_pressure_barg: 6.0, relief_case: "As PSE-2135A."}
  - {tag: PSV-4105, type: CheckValve, line: 80-RV-4106, sheet: P-402, set_pressure_barg: 3.5, relief_case: "R-401 at its design pressure. Candidate cases: external fire (ethanol inventory), blocked vapour outlet with E-411 on full steam. Not sized (D-041). Drawn as a check valve, no safety valve class in the authoring API (as PSV-2046A, D-031)."}
  - {tag: PSV-4206, type: CheckValve, line: 150-RV-4206, sheet: P-402, set_pressure_barg: 3.5, relief_case: "C-401 at its design pressure. Candidate cases: loss of vacuum with the reboiler on (TV-4202 failed open on 12.1 MW MP steam) and loss of cooling water to E-422; external fire. Not sized (D-041). Drawn as a check valve (D-031)."}
