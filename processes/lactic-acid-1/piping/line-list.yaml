# Line list. Schema: `cheme schema lines`.
# First entries for the fermentation area (DESIGN.md D-023: <DN>-<fluid>-<area><3 digits>[train]).
# DN from the flow and a velocity basis in each note (ASSUMED limits: liquids 1 to 2.5 m/s,
# slurries 1.5 m/s or more, gas and steam up to 30 m/s). R-201B to P repeat R-201A's branches
# with their own letter; they are listed when P-203 is drawn. Headers end at their last user.
schema: cheme/lines/v1
