id: lactic-acid-by-fermentation-of-glucose-100-000-t-a
title: Lactic acid by fermentation of glucose (100 000 t/a)
description: Unallocated foreground LCI of Lactic acid by fermentation of glucose (100 000 t/a), case
  design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: Batch fermentation of a 70 wt% glucose syrup with corn steep liquor at 323 K in 16 fermenters
  (130 g/L, 0.89 g/(L h), 12 h turnaround), pH held with milk of lime; cell mass centrifuged; calcium
  lactate acidulated with 93 wt% sulfuric acid, gypsum filtered; four-effect evaporation; esterification
  with ethanol by reactive distillation on Amberlyst-15, ester distillation at 20 kPa(a), ethanol recovery,
  hydrolysis with water and concentration to 88 wt%; 100 000 t/a of lactic acid in 8000 h/a
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:ethanol-vents
  title: storage-tank emissions of R-401, C-401, C-402, C-403, R-402, E-404
  direction: output
  reason: 'No P&ID yet: the vents of the ethanol-bearing columns, reactors and drums (and the vacuum pumps
    of C-401 and E-404) carry ethanol vapour; to a vent condenser, not estimated at the concept stage
    (D-012).'
- key: emission-excluded:lime-and-acid-vents
  title: storage-tank emissions of R-101, R-301
  direction: output
  reason: The lime slaker gives off steam and lime dust and the acidulation tank holds a hot slurry with
    traces of acetic acid; vented to a scrubber or dust filter, not estimated at the concept stage (D-012).
- key: emission-excluded:fermenter-vents
  title: storage-tank emissions of R-201, T-201
  direction: output
  reason: The fermenters breathe sterile air at filling and harvest; homofermentative lactic acid bacteria
    give off little gas and the model carries none (D-005, limit L-3); not estimated.
