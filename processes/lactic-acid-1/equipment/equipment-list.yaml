# The equipment list. Schema: `cheme schema equipment`.
# Basic engineering (DESIGN.md D-013 to D-024): the concept's items (D-010) split into their
# parts, with the seed train, the steriliser's parts, CIP and SIP, tanks, pumps and the
# downstream auxiliaries. Tags: DESIGN.md D-023. Every size, design pressure, design temperature
# and material is ASSUMED unless a source is named (DESIGN.md decision in the note); dimensions
# are overall (vertical: bottom of skirt or legs to top of head) for the 3D layout.
# Atmospheric tanks carry design_pressure_barg 0.05 (vented); "FV" in a note means full vacuum.
schema: cheme/equipment/v1
equipment:
