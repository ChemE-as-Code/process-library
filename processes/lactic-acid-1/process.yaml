schema: cheme-as-code/process/v1
id: lactic-acid-1
title: Lactic acid by fermentation of glucose, gypsum route and ethyl lactate purification (100 000 t/a)
summary: >-
  Glucose syrup fermented in batches at 50 C with the pH held by milk of lime, the cell mass
  centrifuged off, the calcium lactate acidulated with sulfuric acid and the gypsum filtered,
  the crude acid evaporated, esterified with ethanol, the ester distilled and hydrolysed back
  to lactic acid, concentrated to 88 wt%. Concept stage, 12 500 kg/h of lactic acid,
  preliminary gate-to-gate LCI.
description: |
  A 70 wt% glucose syrup, diluted with water and fed corn steep liquor (10 g/L), is fermented
  by lactic acid bacteria in 16 batch fermenters at 323 K (50 C), the pH held at 5 to 6 by milk
  of lime slaked on site from quicklime. Following the open BioSTEAM lactic biorefinery (SRC-1),
  0.76 of the glucose goes to lactic acid, 0.07 to acetic acid and 0.02 to cell mass, to a titer
  of 130 g/L at 0.89 g/(L h): 146 h of fermentation and a 12 h turnaround, so a batch is
  harvested every 9.9 h. The cell mass is centrifuged off, the calcium lactate is acidulated
  with 93 wt% sulfuric acid (1.01 mol per mol of calcium) and the gypsum is filtered off at
  20 wt% moisture. A four-effect evaporator takes the crude acid to about 71 wt%. The acid is
  esterified with ethanol (1.5 mol per mol) by reactive distillation on Amberlyst-15 (98 %,
  ASSUMED). The ethyl lactate is distilled off the residue of sugars and salts at 20 kPa(a), the
  ethanol is recovered, and the ester is hydrolysed with 12 mol of water per mol (80 % per pass,
  SRC-1). The ethanol is stripped and recycled, and the product is concentrated to 88 wt% lactic
  acid (SRC-2), with the water and the unconverted ester returned to the hydrolysis.

  The flowsheet is solved by cheme-as-code's propagate: the glucose syrup for 100 000 t/a of
  lactic acid, the medium water for the titer, the ethanol make-up for its ratio and the
  hydrolysis recycle for its water ratio as design specifications, three recycles converged as
  tears, the reactors on their conversions and the centrifuge, filter, evaporators and columns
  as component separators on ASSUMED recoveries. The fermenters' batch cycle is a recipe whose
  year averages the flowsheet holds. The reactors' duties are core's, the separations' duties
  hand estimates. Per kg of lactic acid (as 100 %): 1.40 kg of glucose, 0.42 kg of quicklime,
  0.75 kg of sulfuric acid (as 100 %), 1.61 kg of wet gypsum cake, 4.1 kWh of steam heat and
  0.24 kWh of power (unallocated); 92 % of the lactic acid formed reaches the product. See
  DESIGN.md for every assumption.
families: [bio-based-chemicals]
keywords: [lactic acid, PLA monomer, fermentation, lactic acid bacteria, glucose, dextrose, calcium lactate, lime, gypsum, acidulation, sulfuric acid, evaporation, esterification, ethyl lactate, reactive distillation, Amberlyst-15, hydrolysis, ethanol recycle, batch fermenter, recipe]
facets:
  feedstock_basis: [biogenic, mineral, electricity]
  product_classes: [chemicals]
  unit_operations: [fermentation, reaction, centrifugation, filtration, evaporation, distillation, reactive-distillation]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, hours, recoveries of the
# separations, the esterification conversion, temperatures and pressures and the separations'
# duties are assumed; the fermentation, acidulation and hydrolysis data from SRC-1 (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD of a batch fermentation train with continuous downstream, with closed mass and
    component balances (cheme validate clean; cheme process streams: 5 blocks and 17 steps
    within tolerance; the recycles torn at S18, S19 and S29 converge). The glucose syrup S1, the
    medium water S2, the ethanol make-up S17 and the hydrolysis purge split are solved by cheme
    process propagate for four design specifications: 100 000 t/a of lactic acid in S32 in
    8000 h, calcium lactate 0.14716 kg/kg in the broth S8 (130 g/L at 1070 kg/m3), 1.5 mol of
    ethanol per mol of lactic acid in S20 and 12 mol of water per mol of ester in S25; CSL,
    quicklime, slaking water and sulfuric acid follow the syrup at fixed ratios. The batch
    recipe (16 fermenters, 158.07 h each, a batch every 9.88 h, 809.8 batches/a of 1106 t) holds
    the flowsheet's year average of S8 (cheme process recipe). Fermentation, acidulation and
    hydrolysis conversions from SRC-1; esterification 98 % ASSUMED (reactive distillation);
    centrifuge, filter, evaporators and columns on ASSUMED recoveries (core's component
    separators), the cakes' moisture from SRC-1. Duties of R101, R201, R301, R401 and R402
    written by propagate from heats of reaction (some ASSUMED 0) and heat capacities; the
    evaporators', columns' and cooler's duties are hand estimates closing each step's balance
    (DESIGN.md D-009). No property package of core covers these liquids; no heat integration.
    Preliminary gate-to-gate LCI with no allocation (one product); quicklime linked to lime-1,
    sulfuric acid to sulfuric-acid-1, ethanol to bioethanol-1, LP and MP steam as heat; glucose
    syrup and corn steep liquor gaps; the Amberlyst-15 resin and the fermenters' steaming cut off
    with their amounts. cheme maturity reaches no level (assumed separations);
    the claim `maturity: concept` is the lowest value of the schema, not an evidenced level. Not
    reviewed. Needs cheme-as-code 1.13.0.
