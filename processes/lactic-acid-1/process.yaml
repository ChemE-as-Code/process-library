    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "2.75 kWh/kg of LP steam 450 kPa(a): evaporator, ethanol column, stripper, concentrator, medium steriliser (hand estimates), esterifier and hydrolysis (core's conversion duties)"}
    - {chemical: steam, role: utility, inventory_key: "feed:MPS", note: "0.855 kWh/kg of MP steam 1000 kPa(a): the ester column's reboiler (hand estimate)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "4.15 kWh/kg removed by cooling water: fermenters, slaker, acidulation, condensers, product cooler"}
