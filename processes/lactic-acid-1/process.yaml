    - {chemical: cell-mass, role: waste, inventory_key: "product:CELL", note: "Cell mass and CSL solids at 35 wt% moisture, 0.062 kg/kg, to anaerobic digestion"}
    - {chemical: sugar-residue, role: waste, inventory_key: "product:RES", note: "Ester column residue (82 wt% residual glucose, unconverted lactic acid, sulfuric acid), 0.216 kg/kg, to anaerobic digestion"}
    - {chemical: wastewater, role: waste, inventory_key: "product:WW", note: "Evaporator condensate (about 1.4 wt% acetic acid) and the hydrolysis-water purge, 5.90 kg/kg, to biological treatment"}
  utilities:
