    - {chemical: water, role: feedstock, inventory_key: "feed:PW", note: "Process water for the medium and the lime slaking, 5.67 kg/kg"}
  outputs:
    - {chemical: lactic-acid, role: main-product, inventory_key: "product:LAP", note: "Lactic acid 88 wt% solution (modelled 88.1 wt% lactic acid, 0.6 wt% ethyl lactate, 0.1 wt% acetic acid, the rest water), to storage"}
