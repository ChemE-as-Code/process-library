      - id: "pid/P-202.xml#offpage-not-on-edge:Line_CS_SS_From"
        reason: "D-031: as Line_SM_SS_From (agent proposal, for the design review to confirm)"
      - id: "pid/P-202.xml#offpage-not-on-edge:Line_ML_SS_From"
        reason: "D-031: as Line_SM_SS_From (agent proposal, for the design review to confirm)"
      - id: "pid/P-202.xml#offpage-not-on-edge:Line_BR_SS_From"
        reason: "D-031: as Line_SM_SS_From (agent proposal, for the design review to confirm)"
      - id: "pid/P-202.xml#offpage-not-on-edge:Line_CR_SS_From"
        reason: "D-031: as Line_SM_SS_From (agent proposal, for the design review to confirm)"
