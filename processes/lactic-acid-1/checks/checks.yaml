      - {id: "pid/P-201.xml#line-crossing:Line_100SM2130A_S1_P1+Line_40NS2141_S3_P1", reason: "D-030: header drop (agent proposal, for the design review to confirm)"}
      - {id: "pid/P-201.xml#line-crossing:Line_100SM2130A_S1_P1+Line_50CS2142_S3_P1", reason: "D-030: header drop (agent proposal, for the design review to confirm)"}
      - {id: "pid/P-201.xml#line-crossing:Line_100SM2130A_S1_P1+Line_50SS2140_S8_P1", reason: "D-030: header drop (agent proposal, for the design review to confirm)"}
      - {id: "pid/P-201.xml#line-crossing:Line_25NS2132A_S1_P1+Line_50CS2142_S4_P1", reason: "D-030: header drop (agent proposal, for the design review to confirm)"}
      - {id: "pid/P-201.xml#line-crossing:Line_25NS2132A_S1_P1+Line_50SS2140_S8_P1", reason: "D-030: header drop (agent proposal, for the design review to confirm)"}
