# Engineering-step gates. Schema: `cheme schema checks`. Run: `cheme check`.
schema: cheme/checks/v1
checks:
  - id: design-basis
    title: Design basis exists
    stage: concept
    kind: files
    files: [process/design-basis.yaml]
  - id: concept-lists
    title: Design decisions and the equipment, line and instrument lists exist
    stage: concept
    kind: files
    files: [DESIGN.md, equipment/equipment-list.yaml, piping/line-list.yaml, control/instrument-list.yaml]
  # Once plant.yaml declares the BFD ({id: BFD, kind: bfd}), add process/BFD.xml to files.
  - id: process-concept
    title: Materials and flowsheet exist (the BFD is generated by cheme process build)
    stage: concept
    kind: files
    files: [process/materials.yaml, process/flowsheet.yaml, process/BFD.xml]
  - id: process-balances
    title: Every block balance is evaluable and clean, the BFD current
    stage: concept
    kind: validate
    fail_on: info
    rules: [cheme.process-balance*, cheme.process-schema, cheme.generated-*]
  # Links from blocks, steps and streams to equipment, lines, instruments and sheets: reported
  # at concept, required at basic.
  - id: process-links-concept
    title: Process links resolve (reported only)
    stage: concept
    kind: process-links
    level: warning
  # The concept gate accepts cheme.process-component-balance-not-evaluable (a component
  # balance without compositions); the basic gate requires component balances.
  - id: process-basic
    title: PFD generated for the design case, process rules clean, no stale calculated values
    stage: basic
    kind: validate
    generated: [pfd]                # fails until plant.yaml declares a kind: pfd sheet, built
    fail_on: info
    rules: [cheme.process-refine-pending, cheme.process-balance*,
            cheme.process-component-balance*, cheme.process-calculated-stale,
            cheme.generated-*]
    # The CSL protein lump NUT has no formula (D-004: no composition was read); the mass
    # balances of these blocks and steps close, the component balance cannot be evaluated
    # without inventing one. Proposed for the design review to accept or reject.
    accept:
      - {id: "process/flowsheet.yaml#process-component-balance-not-evaluable:*", reason: "D-004 and D-027: NUT (CSL protein) is a lump without a formula; mass balances close; a formula would be invented data"}
  - id: process-links
    title: Every process link resolves against the lists and sheets
    stage: basic
    kind: process-links
    level: error
  - id: assumptions-marked
    title: Assumed values are marked ASSUMED in the design basis
    stage: concept
    kind: command
    command: grep -q ASSUMED process/design-basis.yaml
  # kind: validate fails on errors. `fail_on: warning` (or info) makes warnings fail too, `rules`
  # limits it to some rule ids (* matches any text), and `accept` lists findings the gate lets
  # pass, each by the id `cheme validate --json` gives it and with a reason (who, why).
  - id: pids-valid
    title: Every P&ID and list validates
    stage: basic
    kind: validate
  - id: drawing-clean
    title: No line through a label or valve, along a pipe or slanted, no crossing, overlapping or
      misplaced label, no off-page connector off the sheet's edge left unaccepted
    stage: basic
    kind: validate
    # info: cheme.line-not-orthogonal (a slanted line) is an info finding
    fail_on: info
    rules: [cheme.line-through-label, cheme.line-crossing, cheme.label-overlap,
            cheme.label-far-from-owner, cheme.line-through-valve, cheme.line-on-pipe,
            cheme.line-not-orthogonal, cheme.offpage-not-on-edge]
    accept:
      - id: "pid/P-401.xml#line-crossing:Line_100CL4013*+Line_*PC4016*"
        reason: "D-039: each effect has a vapour, a liquid transfer and a condensate connection to its neighbours; the condensate drop of E-401B to D crosses the transfer from the effect before (agent proposal, for the design review to confirm)"
      - id: "pid/P-401.xml#line-crossing:Line_100PC4016_S3_P1+Line_80CL4014_S1_P1"
        reason: "D-039: the concentrate draw from E-401D to P-402A/B crosses the condensate header once (agent proposal, for the design review to confirm)"
      - id: "pid/P-401.xml#line-crossing:Line_150CL4011*+Inst_LIC4011*_MeasuringLine"
        reason: "D-039: the sump level transmitter sits on the effect between the circulation riser and the transfer valve it acts on (agent proposal, for the design review to confirm)"
      - id: "pid/P-402.xml#line-crossing:Line_*PL421*+Inst_*42*_Signal"
        reason: "D-041: LIC-4204 and TIC-4202 act on valves below the reflux line and the pump discharge header, which run between the instrument and its valve (agent proposal, for the design review to confirm)"
      - id: "pid/P-403.xml#line-crossing:Line_65ET4505_S2_P2+Line_80RV4406_S1_P2"
        reason: "D-042, D-044: R-402's relief line 80-RV-4406 runs to the vent header at the top edge and crosses the C-403 distillate 65-ET-4505 once (agent proposal, for the design review to confirm)"
      - id: "pid/P-401.xml#line-crossing:Line_100PC4016_S3_P1+Inst_LIC4011D_Signal"
        reason: "D-040: LIC-4011D sits beside E-401D and acts on LV-4011D at the concentrate pumps below the condensate header (agent proposal, for the design review to confirm)"
      - id: "pid/P-301.xml#line-crossing:Line_100CM3004*+Line_150PL3002_S*"
        reason: "D-038: three centrifuges each joined to three headers (feed, clarified broth, cell mass cake) form a K3,3 graph, which no plane drawing draws without a crossing; the cake chutes of S-301B and C cross the clarified header (agent proposal, for the design review to confirm)"
      - id: "pid/P-103.xml#line-crossing:Line_P108A_DB_S2_P1+Inst_US1025_Signal"
        reason: "D-028: the booster discharge 200-SM-1014 encloses the sterile loop's instruments; every signal route from US-1025 to XV-1025A crosses it once (agent proposal, for the design review to confirm)"
      - id: "pid/P-103.xml#line-crossing:Line_P108A_DB_S2_P1+Inst_PDT1028_Signal"
        reason: "D-028: as above, PDT-1028 to US-1025 crosses 200-SM-1014 once (agent proposal, for the design review to confirm)"
      - id: "pid/P-103.xml#offpage-not-on-edge:Line_150CW1023_From"
        reason: "D-028: CW supply stub kept at E-103; every route to the bottom edge crosses the sterile loop and the header (agent proposal, for the design review to confirm)"
      - id: "pid/P-103.xml#offpage-not-on-edge:Line_150CW1024_To"
        reason: "D-028: CW return stub kept at E-103, as 150-CW-1023 (agent proposal, for the design review to confirm)"
      # Seed trains P-201, P-205, P-208 (D-030, D-036): only crossings with a named common header
      # are accepted (S3#6: no sheet-wide wildcard); a crossing between two branches still warns.
      # Header drops: the drops from the top headers (medium, N2, CIP, NaOH) to the three seed
      # vessels cross the headers below them; SIP is the lowest top header.
      - {id: "pid/P-20[158].xml#line-crossing:*Line_40NS2141_S*", reason: "D-030, D-036: drop across the N2 header (agent proposal, for the design review to confirm)"}
      - {id: "pid/P-20[158].xml#line-crossing:*Line_50CS2142_S*", reason: "D-030, D-036: drop across the CIP supply header (agent proposal, for the design review to confirm)"}
      - {id: "pid/P-20[158].xml#line-crossing:*Line_15NA2147_S*", reason: "D-030, D-036: drop across the NaOH header (agent proposal, for the design review to confirm)"}
      - {id: "pid/P-20[158].xml#line-crossing:*Line_50SS2140_S*", reason: "D-030, D-036: drop across the SIP steam header (agent proposal, for the design review to confirm)"}
      # The bottom SIP risers and the outer steam feed of R-213x cross the CIP return.
      - {id: "pid/P-20[158].xml#line-crossing:Line_50CR2143_S*+Line_R21*", reason: "D-030, D-036: SIP riser across the CIP return (agent proposal, for the design review to confirm)"}
      # P-201: jacket cooling-water supply and return stubs at each seed vessel (utility stubs).
      - {id: "pid/P-201.xml#offpage-not-on-edge:Line_25CW2119A_From", reason: "D-030: CW stub at R-211A (agent proposal, for the design review to confirm)"}
      - {id: "pid/P-201.xml#offpage-not-on-edge:Line_R211A_CWR_To", reason: "D-030: CWR stub at R-211A (agent proposal, for the design review to confirm)"}
      - {id: "pid/P-201.xml#offpage-not-on-edge:Line_25CW2129A_From", reason: "D-030: CW stub at R-212A (agent proposal, for the design review to confirm)"}
      - {id: "pid/P-201.xml#offpage-not-on-edge:Line_R212A_CWR_To", reason: "D-030: CWR stub at R-212A (agent proposal, for the design review to confirm)"}
      - {id: "pid/P-201.xml#offpage-not-on-edge:Line_25CW2139A_From", reason: "D-030: CW stub at R-213A (agent proposal, for the design review to confirm)"}
      - {id: "pid/P-201.xml#offpage-not-on-edge:Line_R213A_CWR_To", reason: "D-030: CWR stub at R-213A (agent proposal, for the design review to confirm)"}
      # P-204 (D-037): the caustic make-up to T-221 and the recovery riser cross the suction header and
      # the LP steam inlet; the fresh-water inlet crosses the recovery header above the tanks.
      - {id: "pid/P-204.xml#line-crossing:Line_100CS2207_S1_P2+Line_25NA2231_S2_P1", reason: "D-037: caustic make-up riser across the CIP suction header (agent proposal, for the design review to confirm)"}
      - {id: "pid/P-204.xml#line-crossing:Line_150LS2233_S1_P2+Line_25NA2231_S2_P1", reason: "D-037: caustic make-up riser across the LP steam inlet (agent proposal, for the design review to confirm)"}
      - {id: "pid/P-204.xml#line-crossing:Line_100CR2226_S3_P1+Line_100CS2207_S4_P1", reason: "D-037: recovery riser across the CIP suction header (agent proposal, for the design review to confirm)"}
      - {id: "pid/P-204.xml#line-crossing:Line_100CR2226_S4_P1+Line_80PW2232_S1_P1", reason: "D-037: fresh-water inlet across the recovery header (agent proposal, for the design review to confirm)"}
      - {id: "pid/P-204.xml#offpage-not-on-edge:Line_15NA2152_To", reason: "D-037: 11 mm above the bottom edge, kept clear of the sheet notes (agent proposal, for the design review to confirm)"}
      - {id: "pid/P-20[158].xml#label-overlap:F241[ABC]:F-241[ABC]+F242[ABC]", reason: "D-036: at the narrow R-211x the vent-filter tag touches the inlet filter's symbol; the render reads clearly (agent proposal, for the design review to confirm)"}
      - {id: "pid/P-20[58].xml#offpage-not-on-edge:Line_25CW21[123]9[BC]_From", reason: "D-036: CW stubs at the seed vessels of trains B and C, as train A (agent proposal, for the design review to confirm)"}
      - {id: "pid/P-20[58].xml#offpage-not-on-edge:Line_R21[123][BC]_CWR_To", reason: "D-036: CWR stubs at the seed vessels of trains B and C, as train A (agent proposal, for the design review to confirm)"}
      - id: "pid/P-202.xml#line-crossing:Line_150TW2023A_S3_P1+Inst_TIC2011A_Signal"
        reason: "D-033: TIC-2011A now sits right of the tempered-water riser, its measuring line straight from the broth; its two split-range outputs cross the riser once each to reach TV-2011A and TV-2011B on the utility side (agent proposal, for the design review to confirm)"
      - id: "pid/P-202.xml#line-crossing:Line_150TW2023A_S3_P1+Inst_TIC2011A_SignalB"
        reason: "D-033: as the other split-range output (agent proposal, for the design review to confirm)"
      - id: "pid/P-202.xml#label-tag-unknown:PlantModel1:PSE-2045A"
        reason: "D-031: the rupture disc is tagged by a note because pyDEXPI's RuptureDisc carries no tag; the tag is in piping/special-items.yaml (agent proposal, for the design review to confirm)"
      - id: "pid/P-202.xml#offpage-not-on-edge:Line_SM_SS_From"
        reason: "D-031: steam feed (SS) of a steam block drawn as a stub at the block so the sterile boundary reads at the vessel; the local SIP steam distribution is on P-204 (agent proposal, for the design review to confirm)"
      - id: "pid/P-202.xml#offpage-not-on-edge:Line_IN_SS_From"
        reason: "D-031: as Line_SM_SS_From (agent proposal, for the design review to confirm)"
      - id: "pid/P-202.xml#offpage-not-on-edge:Line_CS_SS_From"
        reason: "D-031: as Line_SM_SS_From (agent proposal, for the design review to confirm)"
      - id: "pid/P-202.xml#offpage-not-on-edge:Line_ML_SS_From"
        reason: "D-031: as Line_SM_SS_From (agent proposal, for the design review to confirm)"
      - id: "pid/P-202.xml#offpage-not-on-edge:Line_BR_SS_From"
        reason: "D-031: as Line_SM_SS_From (agent proposal, for the design review to confirm)"
      - id: "pid/P-202.xml#offpage-not-on-edge:Line_CR_SS_From"
        reason: "D-031: as Line_SM_SS_From (agent proposal, for the design review to confirm)"
      - id: "pid/P-202.xml#offpage-not-on-edge:Line_SP_SS_From"
        reason: "D-031: steam feed of the aseptic sampling valve, as Line_SM_SS_From (agent proposal, for the design review to confirm)"
      - id: "pid/P-202.xml#offpage-not-on-edge:Line_25PW2032A_From"
        reason: "D-031: flush water stub at the lime dosing branch, from the PW utility station by the fermenter (agent proposal, for the design review to confirm)"
    # A sheet kept from the DEXPI reference P&ID (pyDEXPI's sample, e.g. as a worked example)
    # fails this gate by design: the reference has crossings and labels on its lines. Accept
    # its findings here, naming the sheet:
    #   accept:
    #     - {id: "pid/P-01.xml#*", reason: "DEXPI reference sheet, kept as drawn by DEXPI"}
    # Other findings are accepted one by one, by the id `cheme validate --json` gives them:
    # accept:
    #   - id: "pid/P-03.xml#line-crossing:Line_GOX3001_S1_P1+Line_LOX3001_S1_P1"
    #     reason: "D-023: no route around the GOX riser; J. Smith, design review 2026-10-20"
    # A crossing a connector's move to the sheet's edge adds is accepted the same way (the
    # connector goes on the edge even so), and so is a utility stub kept at its user:
    #   - id: "pid/P-04.xml#offpage-not-on-edge:OPC_CW4001"
    #     reason: "CW stub drawn at E-4102 by convention; plant owner, 2026-11-05"
  - id: pids-exist
    title: At least one P&ID sheet
    stage: basic
    kind: files
    files: ["pid/*.xml"]
  - id: design-review
    title: A current, independent design review is recorded
    stage: basic
    kind: review                   # a record with front matter (reviews/README.md)
    topic: design
    require_kind: [human, agent]    # an author's self review does not pass
  # The 3D layout (layout/, skills layout-yaml, pipe-routing, structures-access,
  # area-classification, review). A kind: layout-model gate checks the layout files and the
  # generated layout/plant-model.yaml against each item of require (`cheme schema checks`).
  - id: layout-plot-plan
    title: Plot plan - site, areas, roads, racks, every item placed, separations declared
    stage: concept
    kind: layout-model
    require: [site, areas, roads, racks, placed, separations]
  - id: layout-3d
    title: 3D model current, nozzles resolved, elevated items mounted, process lines routed or skipped, no clashes, zones declared, plan and sections reviewed
    stage: basic
    kind: layout-model
    require: [model-current, nozzles, mounted, routed, clashes, zones, drawings]
    min_dn: 25                      # smaller lines are field-run at basic engineering
    # utilities are routed at detail engineering (gate layout-detail)
    exclude_fluids: [Cooling water, Cooling water return, Chilled water, Instrument air,
                     Plant air, Utility nitrogen, Steam, Condensate]
    sections: 2                     # the layout review cites the plot plan and two sections
    # A clash or headroom finding that stays is accepted here with a reason, by its id:
    # accept:
    #   - id: "layout/plant-model.yaml#layout-clash-pipe:P-01/Line_A_S1+P-01/Line_B_S1"
    #     reason: "insulated lines touch at the support only; J. Smith, layout review 2026-11-02"
  # The lifting study (cheme layout lifting, skill structures-access): every heavy item
  # (5 t or more, ASSUMED) has its crane, a clear lane and a laydown; with crane load charts in
  # layout/crane-chart.yaml, a chart that carries each lift. The study is written and current.
  - id: lifting-study
    title: Lifting study - every heavy item has a crane, a clear lane and a laydown
    stage: basic
    kind: layout-model
    require: [model-current, lifting, lifting-current]
    # Field-erected items (D-043, ASSUMED): built in place, never lifted whole in service; their
    # maintenance lifts (drives, seals, filters) go from the crane pads CP-201/CP-202 to the deck.
    accept:
      - {id: "layout/plant-model.yaml#layout-laydown:laydown-T-101A", reason: "T-101A, 14 m field-erected storage tank: built in place, no whole lift (D-043)"}
      - {id: "layout/plant-model.yaml#layout-lifting:T-101B", reason: "T-101B, 14 m field-erected storage tank: built in place, no whole lift (D-043)"}
      - {id: "layout/plant-model.yaml#layout-laydown:laydown-T-101B", reason: "T-101B field-erected (D-043)"}
      - {id: "layout/plant-model.yaml#layout-lifting:T-201", reason: "T-201, 14 m field-erected broth hold tank: built in place, no whole lift (D-043)"}
      - {id: "layout/plant-model.yaml#layout-lifting:V-102", reason: "V-102 quicklime silo field-erected in place (D-043)"}
      - {id: "layout/plant-model.yaml#layout-laydown:laydown-V-102", reason: "V-102 field-erected (D-043)"}
      - {id: "layout/plant-model.yaml#layout-lifting:S-302", reason: "S-302 belt filter assembled on site from modules; no whole lift (D-043)"}
      - {id: "layout/plant-model.yaml#layout-laydown:laydown-S-302", reason: "S-302 assembled on site (D-043)"}
      - {id: "layout/plant-model.yaml#layout-lifting:R-201A", reason: "Production fermenters, 9 m diameter, are field-fabricated before the top deck ST-201/ST-202 is erected; the shell is never lifted in service, the drive and seal lifts go from CP-201/CP-202 (D-043)"}
      - {id: "layout/plant-model.yaml#layout-lifting:R-201B", reason: "As R-201A (D-043)"}
      - {id: "layout/plant-model.yaml#layout-lifting:R-201C", reason: "As R-201A (D-043)"}
      - {id: "layout/plant-model.yaml#layout-lifting:R-201D", reason: "As R-201A (D-043)"}
      - {id: "layout/plant-model.yaml#layout-lifting:R-201E", reason: "As R-201A (D-043)"}
      - {id: "layout/plant-model.yaml#layout-lifting:R-201F", reason: "As R-201A (D-043)"}
      - {id: "layout/plant-model.yaml#layout-lifting:R-201G", reason: "As R-201A (D-043)"}
      - {id: "layout/plant-model.yaml#layout-lifting:R-201H", reason: "As R-201A (D-043)"}
      - {id: "layout/plant-model.yaml#layout-lifting:R-201I", reason: "As R-201A (D-043)"}
      - {id: "layout/plant-model.yaml#layout-lifting:R-201J", reason: "As R-201A (D-043)"}
      - {id: "layout/plant-model.yaml#layout-lifting:R-201K", reason: "As R-201A (D-043)"}
      - {id: "layout/plant-model.yaml#layout-lifting:R-201L", reason: "As R-201A (D-043)"}
      - {id: "layout/plant-model.yaml#layout-lifting:R-201M", reason: "As R-201A (D-043)"}
      - {id: "layout/plant-model.yaml#layout-lifting:R-201N", reason: "As R-201A (D-043)"}
      - {id: "layout/plant-model.yaml#layout-lifting:R-201O", reason: "As R-201A (D-043)"}
      - {id: "layout/plant-model.yaml#layout-lifting:R-201P", reason: "As R-201A (D-043)"}
  # The material take-off of the 3D model (estimate/, skill mto-estimate): rewritten after the
  # model's last change. Add rates (the project's own, not the example) and estimate-current
  # once the project prices it.
  - id: mto
    title: Material take-off current with the 3D model
    stage: basic
    kind: mto
    require: [mto-current]
  # The LCA of the operation (lca/): once lca/lca.yaml exists, uncomment; add factors once the
  # project's own replace the example.
  # - id: lca
  #   title: LCA mapped and current with the flowsheet
  #   stage: basic
  #   kind: lca
  #   require: [mapped, lca-current]
  # The techno-economic analysis (estimate/tea.yaml, skill tea): once the project prices its
  # plant, uncomment; add class-stage (the estimate class the stage expects) and decision (the
  # baseline meets the decision's threshold) before the stage's investment decision.
  # - id: tea
  #   title: TEA priced, of the project's own premises, and current
  #   stage: basic
  #   kind: tea
  #   require: [prices, no-example, tea-current]
  # Calculation maturity (cheme maturity, docs/framework/maturity.md): the level the evidence
  # supports reaches require (one of sourced, balanced, predictive, engineering); max_claim also
  # fails when process.yaml claims more than that. Engineering runs the whole validation (slow
  # on a large plant); a lower level skips it. Uncomment once the design basis is written.
  # - id: maturity-balanced
  #   title: The conceptual PFD is sourced and balanced
  #   stage: basic
  #   kind: maturity
  #   require: [balanced]
  #   max_claim: true
  - id: layout-review
    title: A current, independent layout review is recorded
    stage: basic
    kind: review
    topic: layout
    require_kind: [human, agent]
  - id: layout-detail
    title: Every line routed, including utilities and small bore, no clashes
    stage: detail
    kind: layout-model
    require: [model-current, nozzles, mounted, routed, clashes]
    min_dn: 0
  # Cables and trays (electrical/, skill electrical-cabling): every motor and instrument has a
  # cable routed in trays, no tray over its fill, power and instrument trays apart.
  - id: electrical
    title: A cable to every motor and instrument, routed in trays, fill and separation kept
    stage: detail
    kind: layout-model
    require: [model-current, cables, trays]
  # Ventilation (layout/hvac.yaml, skill hvac-ducts): every clad building ventilated, ducts
  # routed inside it within their velocity limits, units and louvres large enough.
  - id: hvac
    title: Clad buildings ventilated, ducts routed within their velocity limits
    stage: detail
    kind: layout-model
    require: [model-current, hvac]
  # Control records (control/loops.yaml, control/sequences.yaml, process/narrative.md,
  # control/philosophy.md; skills control-loops, control-sequences, control-narrative): at
  # concept and basic a draft may have gaps (cheme.control-incomplete and -unresolved are info);
  # at detail every loop and sequence is complete and every reference resolves. A plant without
  # control records passes. Left out on purpose: logic given as text, a loop sharing a tag with
  # an interlock, an alarm at a trip level (each to be judged, not removed) and a changed basis
  # (cheme.control-stale); a file that fails its schema is the pids-valid gate's.
  - id: control-complete
    title: Loops and sequences complete, every control reference resolved
    stage: detail
    kind: validate
    fail_on: info
    rules: [cheme.control-incomplete, cheme.control-unresolved, cheme.control-ref,
            cheme.control-unknown-tag, cheme.control-conflict, cheme.control-unit,
            cheme.control-case, cheme.control-cycle, cheme.control-duplicate,
            cheme.control-document, cheme.control-unreachable]
  - id: datasheets
    title: A datasheet for every equipment-list item
    stage: detail
    kind: datasheets               # equipment/datasheets/<TAG>.yaml, see its README
    # require: [dimensions, weights, nozzle-schedule, drawing-current]  # main dimensions,
    #   weights, a located nozzle schedule and current outline drawings (<TAG>.svg)
  # Prefer on-sheet over grep for what a P&ID must show: it finds printed tags in the model.
  # - id: relief-on-pid
  #   title: Relief devices drawn and connected
  #   stage: basic
  #   kind: on-sheet
  #   sheets: [P-01]            # or sheet: P-01; omitted: any sheet
  #   tags: [PSV-101]           # equipment, instrument (PICSA-101), valve or line tags
  #   classes: [SafetyValve]    # at least min_count (1) of each class
  #   connected: true           # piped, on a segment, with a measuring/signal line

  # Open items (plant.yaml issues:): every action, engineering hold, technical query and design
  # change labelled gate:<stage> (or an earlier stage) is closed out before the stage is signed
  # off, as an action tracker. n/a until plant.yaml declares issues; without a GitHub token the
  # gate fails as "not evaluated", it never passes unseen.
  - id: issues-concept
    title: No open item to close before the concept gate
    stage: concept
    kind: issues
  - id: issues-basic
    title: No open item to close before the basic engineering gate
    stage: basic
    kind: issues
  - id: issues-detail
    title: No open item to close before the detail engineering gate
    stage: detail
    kind: issues

