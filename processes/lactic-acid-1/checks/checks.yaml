# Engineering-step gates. Schema: `cheme schema checks`. Run: `cheme check`.
schema: cheme/checks/v1
checks:
  - id: design-basis
    title: Design basis exists
    stage: concept
    kind: files
    files: [process/design-basis.yaml]
  - id: concept-lists
    title: Design decisions and the equipment, line and instrument lists exist
    stage: concept
    kind: files
    files: [DESIGN.md, equipment/equipment-list.yaml, piping/line-list.yaml, control/instrument-list.yaml]
  # Once plant.yaml declares the BFD ({id: BFD, kind: bfd}), add process/BFD.xml to files.
  - id: process-concept
    title: Materials and flowsheet exist (the BFD is generated by cheme process build)
    stage: concept
    kind: files
    files: [process/materials.yaml, process/flowsheet.yaml, process/BFD.xml]
  - id: process-balances
    title: Every block balance is evaluable and clean, the BFD current
    stage: concept
    kind: validate
    fail_on: info
    rules: [cheme.process-balance*, cheme.process-schema, cheme.generated-*]
  # Links from blocks, steps and streams to equipment, lines, instruments and sheets: reported
  # at concept, required at basic.
  - id: process-links-concept
    title: Process links resolve (reported only)
    stage: concept
    kind: process-links
    level: warning
  # The concept gate accepts cheme.process-component-balance-not-evaluable (a component
  # balance without compositions); the basic gate requires component balances.
  - id: process-basic
    title: PFD generated for the design case, process rules clean, no stale calculated values
    stage: basic
    kind: validate
    generated: [pfd]                # fails until plant.yaml declares a kind: pfd sheet, built
    fail_on: info
    rules: [cheme.process-refine-pending, cheme.process-balance*,
            cheme.process-component-balance*, cheme.process-calculated-stale,
            cheme.generated-*]
    # The CSL protein lump NUT has no formula (D-004: no composition was read); the mass
    # balances of these blocks and steps close, the component balance cannot be evaluated
    # without inventing one. Proposed for the design review to accept or reject.
    accept:
      - {id: "process/flowsheet.yaml#process-component-balance-not-evaluable:*", reason: "D-004 and D-027: NUT (CSL protein) is a lump without a formula; mass balances close; a formula would be invented data"}
  - id: process-links
    title: Every process link resolves against the lists and sheets
    stage: basic
    kind: process-links
    level: error
  - id: assumptions-marked
    title: Assumed values are marked ASSUMED in the design basis
    stage: concept
    kind: command
    command: grep -q ASSUMED process/design-basis.yaml
  # kind: validate fails on errors. `fail_on: warning` (or info) makes warnings fail too, `rules`
  # limits it to some rule ids (* matches any text), and `accept` lists findings the gate lets
  # pass, each by the id `cheme validate --json` gives it and with a reason (who, why).
  - id: pids-valid
    title: Every P&ID and list validates
    stage: basic
    kind: validate
  - id: drawing-clean
    title: No line through a label or valve, along a pipe or slanted, no crossing, overlapping or
      misplaced label, no off-page connector off the sheet's edge left unaccepted
    stage: basic
    kind: validate
    # info: cheme.line-not-orthogonal (a slanted line) is an info finding
    fail_on: info
    rules: [cheme.line-through-label, cheme.line-crossing, cheme.label-overlap,
            cheme.label-far-from-owner, cheme.line-through-valve, cheme.line-on-pipe,
            cheme.line-not-orthogonal, cheme.offpage-not-on-edge]
    accept:
      - id: "pid/P-103.xml#line-crossing:Line_P108A_DB_S2_P1+Inst_US1025_Signal"
        reason: "D-028: the booster discharge 200-SM-1014 encloses the sterile loop's instruments; every signal route from US-1025 to XV-1025A crosses it once (agent proposal, for the design review to confirm)"
      - id: "pid/P-103.xml#line-crossing:Line_P108A_DB_S2_P1+Inst_PDT1028_Signal"
        reason: "D-028: as above, PDT-1028 to US-1025 crosses 200-SM-1014 once (agent proposal, for the design review to confirm)"
      - id: "pid/P-103.xml#offpage-not-on-edge:Line_150CW1023_From"
        reason: "D-028: CW supply stub kept at E-103; every route to the bottom edge crosses the sterile loop and the header (agent proposal, for the design review to confirm)"
      - id: "pid/P-103.xml#offpage-not-on-edge:Line_150CW1024_To"
        reason: "D-028: CW return stub kept at E-103, as 150-CW-1023 (agent proposal, for the design review to confirm)"
      # P-201: explicit ids (S3#6). Header drops: the drops from the top headers (medium, N2, CIP,
      # NaOH) to the three seed vessels cross the headers below them; SIP is the lowest top header.
      - {id: "pid/P-201.xml#line-crossing:Line_40NS2141_S2_P1+Line_50SM2120A_S1_P1", reason: "D-030: header drop (agent proposal, for the design review to confirm)"}
