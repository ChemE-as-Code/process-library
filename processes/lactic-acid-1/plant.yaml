# The root of this plant repository. Schema: `cheme schema plant`.
schema: cheme/plant/v1
name: "Lactic acid by fermentation"
# The oldest cheme-as-code this repository works with; an older one stops with an upgrade hint.
requires: cheme-as-code>=1.13
description: "Lactic acid (88 wt%) by batch fermentation of glucose with lime, acidulation with sulfuric acid to gypsum, multiple-effect evaporation and purification through ethyl lactate (esterification with ethanol, ester distillation, hydrolysis), a batch fermentation train with continuous downstream, concept stage (issue ChemE-as-Code/process-library#517)"
units: SI
stage: basic
stages:
  - {id: concept, title: Concept and feasibility}
  - {id: basic, title: Basic engineering}
  - {id: detail, title: Detail engineering}
# Where the plant's issues are tracked (optional): actions, engineering holds, technical
# queries and design changes as GitHub issues with the engineering labels of cheme-as-code's
# docs/framework/issues.md; `cheme issues` lists them, the gates of kind issues use them.
# issues: {repository: your-org/your-plant, label: "process:your-plant",
#          forms: {action: 1-action-item.yml, hold: 2-engineering-hold.yml}}
# Title-block data for `cheme sheet new` (optional):
# project: {number: "24-017", client: "", site: "", revision: A}
# P&ID sheets, DEXPI 2.0.1 XML. Empty: every pid/*.xml. A sheet not drawn yet is
# `status: planned` (no file needed); `cheme sheet new P-01` starts it.
sheets:
  - {id: BFD, kind: bfd, file: process/BFD.xml, title: Block flow diagram}
  - {id: PFD, kind: pfd, file: process/PFD.xml, title: Process flow diagram}
  # Basic engineering P&IDs (DESIGN.md D-023), planned until drawn.
  - {id: P-101, file: pid/P-101.xml, title: Medium preparation, status: drafted}
  - {id: P-102, file: pid/P-102.xml, title: Lime and ring main, status: drafted}
  - {id: P-201, file: pid/P-201.xml, title: "Seed train A, stages 3 to 5", status: drafted}
  - {id: P-205, file: pid/P-205.xml, title: "Seed trains B and C (typical of train A)", status: planned}
  - {id: P-202, file: pid/P-202.xml, title: "Fermenter R-201A (typical)", status: drafted}
  - {id: P-203, file: pid/P-203.xml, title: "Fermenters R-201B to I", status: drafted}
  - {id: P-204, file: pid/P-204.xml, title: CIP station and SIP steam, status: planned}
  - {id: P-301, file: pid/P-301.xml, title: "Cell removal, acidulation and gypsum filtration", status: planned}
  - {id: P-401, file: pid/P-401.xml, title: Evaporation, status: planned}
  - {id: P-402, file: pid/P-402.xml, title: Esterification and ester column, status: planned}
  - {id: P-403, file: pid/P-403.xml, title: "Ethanol recovery, hydrolysis and product", status: planned}
  - {id: P-103, file: pid/P-103.xml, title: Continuous steriliser}
  - {id: P-206, file: pid/P-206.xml, title: "Fermenters R-201J to P"}
  - {id: P-207, file: pid/P-207.xml, title: "Harvest, broth hold T-201"}
#  - {id: P-01, file: pid/P-01.xml, title: Feed and reaction, status: planned}
# The block and process flow diagrams are generated from process/flowsheet.yaml by
# `cheme process build` (skill `process-design`); declare them by kind:
#  - {id: BFD, kind: bfd, file: process/BFD.xml, title: Block flow diagram}
#  - {id: PFD, kind: pfd, file: process/PFD.xml, title: Process flow diagram}
# A generated sheet names its generator (script and the frame it starts from, a commit or a
# file); it is then rebuilt with `cheme regen P-02`, never edited by hand:
#  - {id: P-02, file: pid/P-02.xml, title: Utilities,
#     generator: {script: scripts/draft_P-02.py, frame: 1a2b3c4}}
