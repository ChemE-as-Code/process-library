# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Lactic acid by batch fermentation of glucose with lime, acidulation with sulfuric acid to
# gypsum, evaporation and purification through ethyl lactate (D-001). The fermenters run in
# batches on a dedicated train (process/recipe.yaml, D-003); every rate here is the recipe's
# year average, and everything downstream of the broth tank runs continuously. Where the values
# come from:
# - the glucose syrup S1 is solved by `cheme process propagate` for 100 000 t/a of lactic acid
#   in the product (D-002); the corn steep liquor, quicklime, slaking water and sulfuric acid
#   follow the syrup at fixed ratios (D-005 to D-007); the medium water S2 is solved for the
#   broth's titer of 130 g/L (D-005), the ethanol make-up S17 for 1.5 mol of ethanol per mol of
#   lactic acid to the esterifier (D-008) and the hydrolysis water's recycle split for 12 mol of
#   water per mol of ester (D-008), all design specifications (core ADR 0070);
# - the ethanol recycles S18 and S19 and the hydrolysis recycle S29 are the loops' tear streams;
# - the reactors' outlets follow the conversions of process/reactions.yaml, the centrifuge,
#   filter, evaporators and columns their specified recoveries (`recovery:`, D-006 to D-008;
#   core has no qualified model of these liquids, limit L-1);
# - temperatures and pressures are design choices, ASSUMED (design basis);
# - the reactors' duties are written by propagate from the heats of reaction and the heat
#   capacities of process/materials.yaml, net of the agitators' and pumps' work (D-009); the
#   evaporators', columns' and cooler's duties are hand estimates, ASSUMED, with their arithmetic
#   in their sources (D-009, limit L-4).
schema: cheme/process/v1
kind: flowsheet
title: Lactic acid by fermentation of glucose (100 000 t/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 100 000 t/a of lactic acid (as 100 %) in an 88 wt% solution, 8000 h/a, from glucose syrup by batch fermentation with lime, the gypsum route and purification through ethyl lactate", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

tears:
  - stream: S18
    initial: {flow: 11000.0, unit: kg/h, basis: mass_fraction, composition: {ETOH: 0.91, H2O: 0.09}}
  - stream: S19
    initial: {flow: 1400.0, unit: kg/h, basis: mass_fraction, composition: {ETOH: 0.98, H2O: 0.02}}
  - stream: S29
    initial: {flow: 30000.0, unit: kg/h, basis: mass_fraction, composition: {H2O: 0.85, ETLA: 0.15}}
convergence: {method: wegstein, max_iterations: 300, tolerance: {abs: 1.0e-6, rel: 1.0e-8}}

specs:
  - id: rate
    vary: {stream: S1, initial: 25500, with: {S3: 0.04092, S4: 0.21084, S5: 1.18205, S11: 0.40047}}
    target: {stream: S32, component: LA, quantity: annual, value: 100000, unit: t, hours: 8000}
    provenance: assumed
    source: "D-002: 100 000 t/a of lactic acid (as 100 %), the order of SRC-2's scenario I (100 945 t/a recovered, p. 11, Table 4); 8000 h/a ASSUMED. Followers at their ratios per kg of the 70 wt% syrup (D-005 to D-007): corn steep liquor 0.04092 (10 g per litre of broth, SRC-1, at 5.846 L of broth per kg of glucose for the 130 g/L titer at the 0.76 yield), quicklime 0.21084 (CaO for the acids formed and the CSL's lactic acid, 10 % over, SRC-1), slaking water 1.18205 (a 20 wt% Ca(OH)2 slurry, ASSUMED) and sulfuric acid 93 wt% 0.40047 (1.01 mol per mol of the lime's calcium, D-007)"
  - id: titer
    vary: {stream: S2, initial: 95000}
    target: {stream: S8, component: CALA, quantity: fraction, basis: mass, value: 0.14716}
    provenance: given
    source: "D-005: the titer 130 g/L of lactic acid (SRC-1 `_units.py`, CoFermentation.target_titer, as lactic acid and its calcium salt), as calcium lactate 130 x 218.218 / 180.156 = 157.5 g/L, at a broth density of 1070 kg/m3 (ASSUMED): 0.14716 kg/kg"
  - id: ethanol-ratio
    vary: {stream: S17, initial: 700}
    target: {stream: S20, component: ETOH, quantity: ratio, per: {stream: S20, component: LA}, basis: mole, value: 1.5}
    provenance: given
    source: "D-008: 1.5 mol of ethanol per mol of acid to the esterifier (SRC-1 `_units.py`, Esterification.ethanol2acids), counted on the lactic acid"
  - id: hydrolysis-water
    vary: {node: SP401, port: purge, initial: 0.1}
    target: {stream: S25, component: H2O, quantity: ratio, per: {stream: S25, component: ETLA}, basis: mole, value: 12.0}
    provenance: given
    source: "D-008: 12 mol of water per mol of ester to the hydrolysis (SRC-1 `_units.py`, HydrolysisReactor.water2esters); the rest of E-404's condensate purged to the wastewater"

feeds:
  - {id: GLCF, title: "Glucose syrup 70 wt% (dextrose; no library process)", category: raw_material, ports: [{id: out, direction: out}]}
  - id: PW
    title: Process water
    category: raw_material
    ports: [{id: med, direction: out}, {id: slk, direction: out}]
  - {id: CSLF, title: "Corn steep liquor (no library process)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: LIMEF, title: "Quicklime (lime-1)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: ACIDF, title: "Sulfuric acid 93 wt% (sulfuric-acid-1)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: ETOHF, title: "Ethanol make-up (bioethanol-1)", category: raw_material, ports: [{id: out, direction: out}]}
  - id: LPS
    title: LP steam 450 kPa(a) (condensate returned)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis, D-009"}
      supply_temperature: {value: 421.1, provenance: assumed, source: "saturation at 450 kPa(a) (thermo 0.6.1, IAPWS), D-009"}
      min_approach: {value: 10, provenance: assumed, source: D-009}
    ports:
      - {id: e401, direction: out, kind: energy}
      - {id: r401, direction: out, kind: energy}
      - {id: c402, direction: out, kind: energy}
      - {id: r402, direction: out, kind: energy}
      - {id: c403, direction: out, kind: energy}
      - {id: e404, direction: out, kind: energy}
  - id: MPS
    title: MP steam 1000 kPa(a) (condensate returned)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1000, provenance: assumed, source: "design basis, D-009"}
      supply_temperature: {value: 453.0, provenance: assumed, source: "saturation at 1000 kPa(a) (thermo 0.6.1, IAPWS), D-009"}
      min_approach: {value: 10, provenance: assumed, source: D-009}
    ports:
      - {id: c401, direction: out, kind: energy}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: prep, direction: out, kind: energy}
      - {id: ferm, direction: out, kind: energy}
      - {id: clar, direction: out, kind: energy}
      - {id: acid, direction: out, kind: energy}
      - {id: evap, direction: out, kind: energy}
      - {id: pur, direction: out, kind: energy}
products:
  - {id: LAP, title: "Lactic acid 88 wt% to storage", category: product, ports: [{id: in, direction: in}]}
  - {id: GYPC, title: "Gypsum filter cake to disposal or use", category: solid_waste, ports: [{id: in, direction: in}]}
  - {id: CELL, title: "Cell mass cake to disposal (anaerobic digestion or feed)", category: solid_waste, ports: [{id: in, direction: in}]}
  - {id: RES, title: "Ester column residue (sugars, unconverted acid) to anaerobic digestion", category: wastewater, ports: [{id: in, direction: in}]}
  - id: WW
    title: Evaporator condensate and hydrolysis-water purge to wastewater treatment
    category: wastewater
    ports: [{id: evap, direction: in}, {id: purge, direction: in}]
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-009"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-009"}
      min_approach: {value: 5, provenance: assumed, source: D-009}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: r201, direction: in, kind: energy}
      - {id: r301, direction: in, kind: energy}
      - {id: e401, direction: in, kind: energy}
      - {id: c401, direction: in, kind: energy}
      - {id: c402, direction: in, kind: energy}
      - {id: c403, direction: in, kind: energy}
      - {id: e404, direction: in, kind: energy}
      - {id: e405, direction: in, kind: energy}

blocks:
  - id: PREP
    title: Medium and milk-of-lime preparation
    class: Mixing
    ports:
      - {id: glc, direction: in}
      - {id: water, direction: in}
      - {id: csl, direction: in}
      - {id: cao, direction: in}
      - {id: slw, direction: in}
      - {id: med, direction: out}
      - {id: lime, direction: out}
      - {id: q1, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: FERM
    title: Batch fermentation with lime (fermenters in parallel)
    class: ReactingChemicals
    ports:
      - {id: med, direction: in}
      - {id: lime, direction: in}
      - {id: broth, direction: out}
      - {id: q2, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: ACID
    title: Cell mass removal, acidulation and gypsum filtration
    class: Separating
    ports:
      - {id: broth, direction: in}
      - {id: acid, direction: in}
      - {id: cells, direction: out}
      - {id: gyp, direction: out}
      - {id: crude, direction: out}
      - {id: q3, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: power2, direction: in, kind: energy}
  - id: EVAP
    title: Multiple-effect evaporation
    class: Evaporating
    ports:
      - {id: in, direction: in}
      - {id: cond, direction: out}
      - {id: conc, direction: out}
      - {id: q4, direction: in, kind: energy}
      - {id: q5, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: PUR
    title: Purification through ethyl lactate (esterification, ester distillation, hydrolysis, concentration)
    class: SeparatingByThermalProcess
    ports:
      - {id: in, direction: in}
      - {id: etoh, direction: in}
      - {id: res, direction: out}
      - {id: purge, direction: out}
      - {id: prod, direction: out}
      - {id: q6, direction: in, kind: energy}
      - {id: q7, direction: in, kind: energy}
      - {id: q8, direction: out, kind: energy}
      - {id: q9, direction: in, kind: energy}
      - {id: q10, direction: out, kind: energy}
      - {id: q11, direction: in, kind: energy}
      - {id: q12, direction: in, kind: energy}
      - {id: q13, direction: out, kind: energy}
      - {id: q14, direction: in, kind: energy}
      - {id: q15, direction: out, kind: energy}
      - {id: q16, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}

steps:
  # medium and lime (D-005, D-006)
  - id: M101
    block: PREP
    title: Medium tank (glucose syrup, water, corn steep liquor)
    class: Mixing
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: glc, direction: in, delegates: glc}
      - {id: water, direction: in, delegates: water}
      - {id: csl, direction: in, delegates: csl}
      - {id: out, direction: out, delegates: med}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: R101
    block: PREP
    title: Lime slaker (milk of lime)
    class: ReactingChemicals
    reactions: [SLK]
    energy_port: cw
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: cao, direction: in, delegates: cao}
      - {id: water, direction: in, delegates: slw}
      - {id: out, direction: out, delegates: lime}
      - {id: cw, direction: out, kind: energy, delegates: q1}
  # batch fermentation (D-003, D-005)
  - id: R201
    block: FERM
    title: Fermenters (batch, in parallel), pH held with milk of lime
    class: ReactingChemicals
    reactions: [FLA, FAA, FBIO, NEU]
    energy_port: cw
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: med, direction: in, delegates: med}
      - {id: lime, direction: in, delegates: lime}
      - {id: out, direction: out, delegates: broth}
      - {id: cw, direction: out, kind: energy, delegates: q2}
      - {id: power, direction: in, kind: energy, delegates: power}
  # cell mass, acidulation, gypsum (D-006, D-007)
  - id: S301
    block: ACID
    title: Cell mass centrifuge
    class: SeparatingMechanically
    links: [{target: equipment, ref: S-301}]
    recovery:
      outlets:
        cake: {BIO: 0.98, NUT: 0.90, H2O: 0.00278, GLC: 0.00278, CALA: 0.00278, CAAC: 0.00278, CAOH: 0.00278}
      provenance: assumed
      source: "D-006: 98 % of the cell mass and 90 % of the CSL solids to the cake, ASSUMED; the cake at 35 wt% moisture (SRC-1 `_processes.py`, the cell mass filter's moisture_content 0.35), which takes the same share of every dissolved component and of the fine excess lime, here 0.278 % of the liquid (ASSUMED; the solved cake S9 holds 35 wt% liquid, D-006)"
    ports:
      - {id: in, direction: in, delegates: broth}
      - {id: cake, direction: out, delegates: cells}
      - {id: liq, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: R301
    block: ACID
    title: Acidulation tank (sulfuric acid, gypsum precipitation)
    class: ReactingChemicals
    reactions: [ACL, ACA, ACH]
    energy_port: cw
    links: [{target: equipment, ref: R-301}]
    ports:
      - {id: in, direction: in}
      - {id: acid, direction: in, delegates: acid}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: q3}
  - id: S302
    block: ACID
    title: Gypsum belt filter
    class: SeparatingMechanically
    links: [{target: equipment, ref: S-302}]
    recovery:
      outlets:
        cake: {GYP: 0.995, BIO: 1.0, NUT: 1.0, H2O: 0.0385, GLC: 0.0385, LA: 0.0385, AA: 0.0385, H2SO4: 0.0385}
      provenance: assumed
      source: "D-007: 99.5 % of the gypsum to the cake (SRC-1 `utils.py` get_splits, the gypsum's split 0.995), the cake at 20 wt% moisture (SRC-1 `_processes.py`, GypsumFilter moisture_content 0.2, and SRC-2 p. 8 via the issue), which takes the same share of every dissolved component, here 3.85 % of the liquid (the solved cake S13 holds 20 wt% liquid, D-007); the cell mass the centrifuge missed stays in the cake; no cake wash (SRC-1 has none)"
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out, delegates: gyp}
      - {id: liq, direction: out, delegates: crude}
      - {id: power, direction: in, kind: energy, delegates: power2}
  # evaporation (D-008)
  - id: E401
    block: EVAP
    title: Multiple-effect evaporator (four effects) with surface condenser
    class: Evaporating
    links: [{target: equipment, ref: E-401}]
    recovery:
      outlets:
        vap: {H2O: 0.97, AA: 0.99, LA: 0.005}
      provenance: assumed
      source: "D-008: 97 % of the water off, ASSUMED, to about 64 wt% lactic acid (SRC-1 takes its esterifier's feed to about 50 wt% in a flash at 379 K and a light-ends column, `_processes.py` F401, D401; a drier feed is taken here for the reactive distillation); 99 % of the acetic acid off (SRC-1 D401: light key recovery 0.99); 0.5 % of the lactic acid entrained, ASSUMED"
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: vap, direction: out, delegates: cond}
      - {id: liq, direction: out, delegates: conc}
      - {id: heat, direction: in, kind: energy, delegates: q4}
      - {id: cond, direction: out, kind: energy, delegates: q5}
      - {id: power, direction: in, kind: energy, delegates: power}
  # purification (D-008)
  - id: M401
    block: PUR
    title: Esterifier feed (concentrate, ethanol make-up and recycles)
    class: Mixing
    ports:
      - {id: la, direction: in, delegates: in}
      - {id: etoh, direction: in, delegates: etoh}
      - {id: rec1, direction: in}
      - {id: rec2, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: R401
    block: PUR
    title: Esterification (reactive distillation on Amberlyst-15)
    class: ReactingChemicals
    reactions: [EST]
    energy_port: heat
    links: [{target: equipment, ref: R-401}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: q6}
  - id: C401
    block: PUR
    title: Ester column (vacuum), residue purged
    class: Distilling
    links: [{target: equipment, ref: C-401}]
    recovery:
      outlets:
        top: {ETOH: 1.0, H2O: 1.0, ETLA: 0.995, AA: 1.0}
      provenance: assumed
      source: "D-008: the ester and everything lighter overhead, 99.5 % of the ethyl lactate (SRC-1 `_processes.py` D403: ethyl lactate recovery 0.995 over lactic acid 0.9995); the unconverted lactic acid, sugar, sulfuric acid and solids to the bottoms, purged (SRC-1 recycles 97 % of these bottoms, not taken here, D-008)"
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out}
      - {id: bot, direction: out, delegates: res}
      - {id: reb, direction: in, kind: energy, delegates: q7}
      - {id: cond, direction: out, kind: energy, delegates: q8}
  - id: C402
    block: PUR
    title: Ethanol recovery column
    class: Distilling
    links: [{target: equipment, ref: C-402}]
    recovery:
      outlets:
        top: {ETOH: 0.99, H2O: 0.06}
      provenance: assumed
      source: "D-008: 99 % of the ethanol overhead (SRC-1 `_processes.py` D402, ethanol recovery 0.99) at about 91 wt% ethanol (SRC-1 `_units.py`, Esterification: the D402 recycle is about 91 % ethanol with 8 % water), the water's split chosen for that, ASSUMED; ethyl lactate and acetic acid to the bottoms"
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: q9}
      - {id: cond, direction: out, kind: energy, delegates: q10}
  - id: M402
    block: PUR
    title: Hydrolysis feed (ester and recycled water)
    class: Mixing
    ports:
      - {id: in1, direction: in}
      - {id: in2, direction: in}
      - {id: out, direction: out}
  - id: R402
    block: PUR
    title: Hydrolysis reactor
    class: ReactingChemicals
    reactions: [HYD]
    energy_port: heat
    links: [{target: equipment, ref: R-402}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: q11}
  - id: C403
    block: PUR
    title: Ethanol stripper on the hydrolysate
    class: Distilling
    links: [{target: equipment, ref: C-403}]
    recovery:
      outlets:
        top: {ETOH: 0.90, H2O: 0.016}
      provenance: assumed
      source: "D-008: 90 % of the ethanol overhead (SRC-1 `_processes.py` D404, ethanol recovery 0.90); the water's split set for about 92 wt% ethanol overhead, near C-402's 91 wt% (SRC-1's composition of its ethanol recycle), ASSUMED, instead of SRC-1's 0.9935 of the water to the bottoms, which here would give an overhead of 96.6 wt% ethanol"
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: q12}
      - {id: cond, direction: out, kind: energy, delegates: q13}
  - id: E404
    block: PUR
    title: Product concentrator (vacuum) with condenser
    class: Evaporating
    links: [{target: equipment, ref: E-404}]
    recovery:
      outlets:
        vap: {H2O: 0.9537, ETOH: 1.0, ETLA: 0.98, AA: 0.5}
      provenance: assumed
      source: "D-008: water off to an 88 wt% lactic acid (SRC-1 `_processes.py` F402 flashes to 0.88; SRC-2 p. 5, final product 88 % w/w), the water's split chosen for that; all the ethanol and 98 % of the ester off with the water and returned to the hydrolysis, half of the acetic acid, ASSUMED"
    ports:
      - {id: in, direction: in}
      - {id: vap, direction: out}
      - {id: liq, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: q14}
      - {id: cond, direction: out, kind: energy, delegates: q15}
  - id: SP401
    block: PUR
    title: Hydrolysis water recycle and purge
    class: SplittingMaterial
    ports:
      - {id: in, direction: in}
      - {id: rec, direction: out}
      - {id: purge, direction: out, delegates: purge}
  - id: E405
    block: PUR
    title: Product cooler
    class: Cooling
    links: [{target: equipment, ref: E-405}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: prod}
      - {id: cw, direction: out, kind: energy, delegates: q16}

streams:
  - id: S1
    title: Glucose syrup 70 wt%
    from: GLCF.out
    to: M101.glc
    template: broth
    state:
      design:
        temperature: {value: 323.15, provenance: assumed, source: "design basis: received warm"}
        pressure: {value: 300, provenance: assumed, source: design basis}
        composition: {basis: mass_fraction, values: {GLC: 0.70, H2O: 0.30}, provenance: assumed, source: "D-004: a glucose syrup of 70 wt% dry substance taken as glucose, ASSUMED (the open models ferment lignocellulosic sugars, SRC-1, SRC-2)"}
        flow: {value: 25083.8, provenance: calculated, source: 'cheme process propagate: spec rate (S32 LA t/a 100000)', fingerprint: aa7df0693ea6fea0}
  - id: S2
    title: Medium water
    from: PW.med
    to: M101.water
    template: broth
    state:
      design:
        temperature: {value: 323.15, provenance: assumed, source: "D-005: the medium made up at the fermentation temperature; its sterilisation not modelled (limit L-6)"}
        pressure: {value: 300, provenance: assumed, source: design basis}
        composition: {basis: mass_fraction, values: {H2O: 1.0}, provenance: assumed, source: D-005}
        flow: {value: 50902.0, provenance: calculated, source: 'cheme process propagate: spec titer (S8 CALA mass fraction 0.14716)', fingerprint: aa7df0693ea6fea0}
  - id: S3
    title: Corn steep liquor
    from: CSLF.out
    to: M101.csl
    template: broth
    state:
      design:
        temperature: {value: 323.15, provenance: assumed, source: design basis}
        pressure: {value: 300, provenance: assumed, source: design basis}
        composition: {basis: mass_fraction, values: {H2O: 0.50, NUT: 0.25, LA: 0.25}, provenance: given, source: "D-005: SRC-1 `_chemicals.py`: CSL modelled as 50 % water, 25 % protein and 25 % lactic acid"}
        flow: {value: 1026.43, provenance: calculated, source: 'cheme process propagate: spec rate (0.04092 x S1)', fingerprint: aa7df0693ea6fea0}
  - id: S4
    title: Quicklime
    from: LIMEF.out
    to: R101.cao
    template: broth
    state:
