# Steel structures (schema: cheme schema structures). DESIGN.md D-043; every size ASSUMED.
# The production fermenters stand outdoors on their own skirts and foundations in two rows of
# eight (pitch 14 m). Over each row an open steel frame carries the top deck at 24.5 m
# (0.7 m above the head tops at 23.8 m): the agitator drive bridges, the vent and gas filters
# and the top-head valves are worked from it. The columns stand in the 5 m gaps between the
# shells and 2.5 m off them north and south; a stair tower at each end of each row (two ways
# down, about 104 m apart).
structures:
