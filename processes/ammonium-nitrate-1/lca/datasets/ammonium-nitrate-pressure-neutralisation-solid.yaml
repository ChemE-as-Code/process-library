# Tier 1 form, a manifest-only entry without a flowsheet (as process-library#317). Every amount is the
# formula of its parameters; core's validator re-checks each. Written from the LVIC-AAF BREF chapter 9
# (facts in our own form); ASSUMED choices are marked in the parameters.
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: ammonium-nitrate-pressure-neutralisation-solid
title: Ammonium nitrate, solid, by pressure neutralisation of nitric acid with ammonia
description: Per 1 t of solid ammonium nitrate (as NH4NO3), gate-to-gate, EU plants of the LVIC-AAF BREF data
  collection. Feeds from stoichiometry with the sourced losses, utilities as midpoints of sourced ranges.
basis: 1000 kg of solid ammonium nitrate (as NH4NO3)
boundary: 'gate-to-gate: ammonia vaporisation, neutralisation, evaporation, prilling or granulation, cooling,
  screening, exhaust gas and condensate treatment; steam and power from outside; storage excluded'
technology: continuous neutralisation of 60 wt% nitric acid with gaseous ammonia at elevated pressure, evaporation
  to a melt, prilling or granulation
geography:
  description: EU plants of the BREF data collection; no single site.
classification:
  isic: '2012'
system_boundary:
  included:
  - ammonia and 60 wt% nitric acid
  - electricity and imported steam
  - ammonia and dust to air after abatement
  - process condensate and scrubber water to treatment
  - the acid's water as vapour
  excluded:
  - 'TODO nitrogen in the waste water (AMI Linz: 0.026 kg N per t N, about 9 g N per t AN, BREF Table 9.5):
    core''s crosswalk has no nitrate or ammonium flow to water yet, and the amount is left out of the feeds'
  - TODO nitric acid to air (named by the BREF, section 9.2.2 and Table 9.10, not quantified per t)
  - 'TODO N2O from ammonium nitrate decomposition: not quantified in the source'
  - TODO cooling water (Table 9.8 gives 3.8 to 31 m3/t for new solution plants; none for solid AN)
  - 'TODO steam export of pressure neutralisers (up to 240 kg/t in Table 9.8): no export counted, so no co-product'
  - 'TODO additives, stabilisers and coating agents (section 9.2.7): not quantified'
  - storage and loading emissions
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: RER
year: 2001
valid_until: 2006
time:
  start: 2000
  description: 'BREF data collection: the energy figures are from EFMA (2000) and infoMil (2001), the plant
    emissions from Austrian UBA (2002) and infoMil (2001). valid_until is the reference year + 5 (system-model
    section 6), so it has already lapsed.'
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation'
