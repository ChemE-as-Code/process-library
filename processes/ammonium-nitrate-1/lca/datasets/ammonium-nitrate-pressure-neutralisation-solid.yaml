    to the formula
- name: nh3_air
  value: 0.0153
  unit: kg
  description: 'Ammonia to air per t: the AMI Linz central waste gas scrubber (1.6 g/t) and its prilling tower
    for technical-grade AN (13.7 g/t).'
  source: EU JRC (2007) LVIC-AAF BREF (Best Available Techniques for the Manufacture of Large Volume Inorganic
    Chemicals - Ammonia, Acids and Fertilisers), Table 9.4, p. 372 (Austrian UBA 2002). One plant; the table
    is headed CAN fertilisers and the central scrubber serves the whole plant, so applying both figures per
    t of solid AN is ASSUMED. TODO an AN-only figure
- name: dust
  value: 0.0379
  unit: kg
  description: 'Dust to air per t: AMI Linz central waste gas scrubber (17.4 g/t) and prilling tower (20.5
    g/t), taken as ammonium nitrate.'
  source: EU JRC (2007) LVIC-AAF BREF (Best Available Techniques for the Manufacture of Large Volume Inorganic
    Chemicals - Ammonia, Acids and Fertilisers), Table 9.4, p. 371 (Austrian UBA 2002); as nh3_air, applying
    both per t of solid AN is ASSUMED; that the dust is AN (no coating) is ASSUMED. The same table gives
    two UK AN plants (Comments on D2, 2004), 30 g/t from a prilling tower with state-of-the-art abatement
    (Terra Severnside) and 400 g/t from prill towers and coolers (Terra Billingham), so the value here is
    near the low end of the AN plants in the table
- name: ww_n
  value: 0.24
  unit: m3
  description: 'Waste water per t of nitrogen in the product: AMI Linz pressure neutralisation (1800 t/d AN).'
  source: EU JRC (2007) LVIC-AAF BREF (Best Available Techniques for the Manufacture of Large Volume Inorganic
    Chemicals - Ammonia, Acids and Fertilisers), Table 9.5, p. 373 (Austrian UBA 2002, one plant); applying
    it to this product is ASSUMED
- name: rho_w
  value: 1000.0
  unit: kg/m3
  description: Density taken for the waste water.
  source: ASSUMED
- name: elec
  value: 42.5
  unit: kWh
  description: 'Electricity per t of solid AN, new AN facility: midpoint of 25 to 60 kWh/t.'
  source: EU JRC (2007) LVIC-AAF BREF (Best Available Techniques for the Manufacture of Large Volume Inorganic
    Chemicals - Ammonia, Acids and Fertilisers), Table 9.3, p. 370 (EFMA 2000); the midpoint is our choice
- name: steam
  value: 25.0
  unit: kg
  description: 'Steam imported per t of solid AN: midpoint of 0 to 50 kg/t.'
  source: EU JRC (2007) LVIC-AAF BREF (Best Available Techniques for the Manufacture of Large Volume Inorganic
    Chemicals - Ammonia, Acids and Fertilisers), Table 9.3, p. 370, and section 9.4.3, p. 378 (EFMA 2000);
    the midpoint is our choice. The pressure is not stated for this range; Table 9.8 gives 10 bar for the import
    of new plants
