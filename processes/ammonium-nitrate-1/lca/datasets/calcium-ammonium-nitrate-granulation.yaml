# Tier 1 form, a manifest-only entry without a flowsheet (as process-library#317). Every amount is the
# formula of its parameters; core's validator re-checks each. Written from the LVIC-AAF BREF chapter 9
# (facts in our own form); ASSUMED choices are marked in the parameters.
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: calcium-ammonium-nitrate-granulation
title: Calcium ammonium nitrate by neutralisation and granulation with limestone filler
description: Per 1 t of calcium ammonium nitrate (about 27 % N), gate-to-gate, EU plants of the LVIC-AAF BREF
  data collection. Ammonium nitrate made on site from ammonia and nitric acid and granulated with ground limestone;
  feeds from stoichiometry with the sourced losses, utilities as midpoints of sourced ranges.
basis: 1000 kg of calcium ammonium nitrate (about 27 % N)
boundary: 'gate-to-gate: neutralisation, evaporation, filler grinding and mixing, granulation, drying, cooling,
  screening, exhaust gas and condensate treatment; steam and power from outside; storage excluded'
technology: continuous neutralisation of 60 wt% nitric acid with gaseous ammonia, evaporation, mixing with
  ground limestone, drum or pugmill granulation, drying and fluid bed cooling
geography:
  description: EU plants of the BREF data collection; no single site.
classification:
  isic: '2012'
system_boundary:
  included:
  - ammonia, 60 wt% nitric acid and limestone filler
  - electricity and steam
  - ammonia and dust to air after abatement
  - process condensate and scrubber water to treatment
  - the acid's water as vapour
  excluded:
  - 'TODO nitrogen in the waste water (DSM Geleen: about 12 to 23 g N per t CAN after treatment, BREF Table
    9.6): no nitrate or ammonium flow to water in core''s crosswalk yet, and the amount is left out of the
    feeds'
  - 'TODO nitric acid to air and fluoride (AMI Linz 0.5 g HF per t, from raw materials of a nitrophosphate
    plant, Table 9.4): not added'
  - 'TODO N2O from ammonium nitrate decomposition: not quantified in the source'
  - 'TODO cooling water (AMI Linz: 24500 m3/d at a 10 K rise, Table 9.3): not converted per t here'
  - 'TODO coating and anticaking agents (section 9.2.7): not quantified'
  - TODO moisture of the filler and the product
  - 'CO2 of the carbonate filler: it stays in the product (no calcination); its release in the soil belongs
    to the use phase'
  - storage and loading emissions
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: RER
year: 2001
valid_until: 2006
time:
  start: 2000
  description: 'BREF data collection: the energy figures are from EFMA (2000) and infoMil (2001), the plant
    emissions from Austrian UBA (2002) and infoMil (2001). valid_until is the reference year + 5 (system-model
    section 6), so it has already lapsed.'
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation'
