- name: eta
  value: 0.985
  unit: kg/kg
  description: 'Sulfur recovery efficiency of the whole chain (Claus and tail gas unit): S to the pit per S
    in the H2S feed. The median of 26 daily-average data sets of SRUs with a catalytic direct oxidation tail
    gas unit (SuperClaus type); observed 95.5 to 99.3 %, typical 98 to 99 %.'
  source: 'EU JRC (2015) REF BREF, EUR 27140 EN, doi:10.2791/010758, section 4.23.5.2.2, Table 4.89, p. 491
    (CONCAWE measurements in more than 40 EU refineries, 2004-2008); the same value is the median of the installed
    base of 47 EU sites (section 3.23.2, p. 216). Choosing this TGTU category as representative is ASSUMED:
    it is the largest category in Table 4.89 (26 of 61 data sets) and Table 4.103 (5 of 8 SRUs). In Figure
    3.36 (47 sites) SuperClaus is the most frequent single process (10, our count), but amine-based units
    together (about 12) are more, and about a third of the sites have no tail gas unit'
- name: fuel
  value: 1300.0
  unit: MJ
  description: 'Fuel per t sulfur: midpoint of 1000 to 1600 MJ/t. The source does not say which users it
    covers; line burners and the tail gas incinerator is our reading.'
  source: EU JRC (2015) REF BREF, EUR 27140 EN, doi:10.2791/010758, section 4.23.5.2.1, Table 4.85, p. 485
    (typical utilities of a 20 000 t/yr SRU, read as per t of sulfur); the midpoint is our choice
- name: lhv_ng
  value: 50.01
  unit: MJ/kg
  description: LHV of the fuel, taken as methane.
  source: chemicals/chemicals.yaml methane lhv; natural gas as pure methane is ASSUMED (refinery SRUs also
    fire refinery fuel gas). TODO a fuel mix
- name: elec
  value: 67.5
  unit: kWh
  description: 'Electricity per t sulfur: midpoint of 60 to 75 kWh/t (mainly the air blowers and pumps, our
    reading; the source does not split it).'
  source: EU JRC (2015) REF BREF, EUR 27140 EN, doi:10.2791/010758, section 4.23.5.2.1, Table 4.85, p. 485;
    the midpoint is our choice
- name: steam
  value: 1750.0
  unit: kg
  description: 'Steam produced per t sulfur (waste heat boiler and sulfur condensers): midpoint of 1500 to
    2000 kg/t. The BREF gives no pressure; its flow scheme shows steam raised in the waste heat boiler and the
    condensers, and AP-42 says the waste heat boiler raises high- to medium-pressure steam. All of it is taken
    as exported: steam used inside the unit (reheaters, sulfur pit and line heating) is not subtracted (ASSUMED).'
  source: EU JRC (2015) REF BREF, EUR 27140 EN, doi:10.2791/010758, section 4.23.5.2.1, Table 4.85, p. 485,
    and Figure 4.53, p. 483; US EPA AP-42 section 8.13.2, p. 8.13-1 (pressure level only); the midpoint is our
    choice. TODO the pressure levels and the internal steam use
- name: cw
  value: 10.0
  unit: m3
  description: 'Cooling water per t sulfur at a 10 K rise: midpoint of 0 to 20 m3/t.'
  source: EU JRC (2015) REF BREF, EUR 27140 EN, doi:10.2791/010758, section 4.23.5.2.1, Table 4.85, p. 485;
    the midpoint is our choice
- name: cp_w
  value: 4.186
  unit: kJ/(kg*K)
  description: Specific heat of cooling water, with 1000 kg/m3.
  source: 'ASSUMED: liquid water near 25 degC, rounded; the density of 1000 kg/m3 is in the formula'
- name: dT_cw
  value: 10.0
  unit: K
  description: Temperature rise of the cooling water.
  source: EU JRC (2015) REF BREF, EUR 27140 EN, doi:10.2791/010758, Table 4.85, p. 485 (the basis of its cooling-water
    figure)
- name: nox
  value: 0.11
  unit: kg
  description: 'NOx (as NO2) per t sulfur from the incinerator: 0.22 lb/ton of sulfur produced.'
  source: US EPA (2015) AP-42, 5th ed., Vol. I, section 8.13 Sulfur Recovery (4/15), Table 8.13-2, footnote
    a (factor per sulfur production, for SRUs controlled by a thermal incinerator or oxidiser; US source tests).
    1 lb/ton = 0.5 kg/t
- name: co
  value: 0.65
  unit: kg
  description: 'CO per t sulfur from the incinerator: 1.3 lb/ton of sulfur produced.'
  source: US EPA (2015) AP-42, 5th ed., Vol. I, section 8.13 Sulfur Recovery (4/15), Table 8.13-2, footnote
    b (as nox). 1 lb/ton = 0.5 kg/t
- name: thc
  value: 0.02
  unit: kg
  description: 'Total hydrocarbons (as propane) per t sulfur: 0.040 lb/ton of sulfur produced.'
