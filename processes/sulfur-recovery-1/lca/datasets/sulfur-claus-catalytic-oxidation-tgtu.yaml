# Tier 1 form, process-library#313 pilot without a flowsheet. Every amount is the formula of its parameters;
# core's validator re-checks each. Written from the REF BREF and US EPA AP-42 8.13 (facts in our own form).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: sulfur-claus-catalytic-oxidation-tgtu
title: Sulfur from acid gas by the modified Claus process with a catalytic oxidation tail gas unit
description: Per 1 t of liquid sulfur, gate-to-gate, EU refinery SRUs of the REF BREF data collection. H2S
  of an amine acid gas in; steam exported as a co-product; tail gas incinerated. Recovery, fuel, electricity,
  steam and cooling water from the BREF; NOx, CO and hydrocarbons from US EPA AP-42.
basis: 1000 kg of sulfur
boundary: 'gate-to-gate: Claus furnace and waste heat boiler, catalytic converters and condensers, selective-oxidation
  tail gas stage, incinerator, sulfur pit; acid gas, fuel, power and boiler feed water from outside'
technology: modified Claus (thermal stage and two to three catalytic stages) with a catalytic direct oxidation
  tail gas unit (SuperClaus type) and thermal incineration; amine-based and sub-dew-point tail gas units and
  oxygen enrichment are not modelled
geography:
  description: EU refinery SRUs of the BREF data collection; NOx, CO and hydrocarbon factors from US source
    tests. No single site.
classification:
  isic: '1920'
system_boundary:
  included:
  - H2S of the acid gas, combustion oxygen (free), fuel, electricity, boiler feed water
  - sulfur and exported steam (co-product)
  - SO2 of the unrecovered sulfur, combustion CO2 and water, NOx, CO and hydrocarbons
  - cooling water as heat rejected
  excluded:
  - 'TODO acid gas components other than H2S (CO2, NH3 of sour water stripper gas, hydrocarbons, water): they
    change the air, the fuel and the stack gas, and their CO2 passes through; not quantified for a generic
    SRU in the source'
  - 'TODO COS, CS2 and H2S slip and sulfur vapour or mist in the stack gas: counted as SO2 here'
  - 'TODO Claus alumina (or titania) catalyst and the selective-oxidation catalyst (iron and chromium oxides
    on alumina): plant-specific, the source gives no amount'
  - 'TODO sour water from knock-out drums (Table 4.84: 0.02 m3/h for a 20 000 t/yr SRU, from sour water stripper
    gas) to the sour water stripper'
  - 'TODO particulates (Table 3.88: 0.15 kg/t at one site, from limit values, size not stated)'
  - TODO liquid sulfur degassing and its vent; sulfur storage and loading
  - TODO boiler blowdown
  - 'amine-based tail gas units (SCOT type: their quench sour water of about 1 m3/t and Ni/Mo or Co/Mo catalyst,
    Table 4.88): another configuration, not this dataset'
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: RER
year: 2010
valid_until: 2015
time:
  start: 2004
  description: 'REF BREF data: CONCAWE recovery measurements of 2004-2008 and an installed-base sample of 2007-2008,
    utilities undated; AP-42 factors from tests of 1996-2011. valid_until is the reference year + 5 (system-model
    section 6), so it has already lapsed.'
modelling:
  principle: attributional
  multifunctionality: 'two products: sulfur and exported steam, listed unallocated. Default allocation shares
    give all burdens to the sulfur (see allocation and its deviation).'
allocation:
  method: shares
  coproducts:
  - sulfur
  - steam
  shares:
    sulfur: 1.0
    steam: 0.0
  source: All burdens to the sulfur; the exported steam leaves without a burden and without a credit (conservative
    for the sulfur), as sulfuric-acid-1 does for its steam (its DESIGN.md D-014).
  deviation: 'The library hierarchy allocates exported steam by energy or exergy (docs/system-model.md section
    2). Neither can be computed here: the source states no steam pressure, so the steam''s exergy and enthalpy
    are unknown, and the registry has no exergy or heating value of sulfur. The steam is a by-product of a
    unit whose purpose is H2S abatement; shares 1/0 are the conservative choice for the sulfur until the steam
    state is sourced.'
