# Process Atlas manifest of alumina-1. Schema: schemas/process.schema.json (cheme-as-code/process/v1).
# plant.yaml stays the engineering manifest; sheets and results are derived from the
# ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: alumina-1
title: Alumina by the Bayer process (3000 t/d smelter-grade alumina, concept)
summary: >-
  Smelter-grade alumina from Guinean gibbsitic bauxite by the Bayer process: low-temperature
  caustic digestion, red mud settling, washing and filtration, seeded gibbsite precipitation,
  spent liquor evaporation and gas suspension calcination; caustic and lime make-up, bauxite
  residue and calciner CO2 explicit. Concept stage, assumed liquor basis.
description: |
  Bauxite (Debele/Balaya plateau type, 54.7 wt% Al2O3, 0.76 wt% SiO2, sourced assay) is ground
  in spent liquor with milk of lime, pre-desilicated at 373 K and digested at 418 K, where the
  gibbsite dissolves as sodium aluminate. The blow-off is flashed (the flash vapour preheats the
  slurry), the residue settles, is washed counter-currently and leaves as filter cake for dry
  stacking. The pregnant liquor is cooled and seeded; gibbsite precipitates, is classified
  (seed recycle), filtered, washed and calcined with natural gas to alumina. The spent liquor
  is evaporated, made up with caustic soda and returned to the mill: the defining recycle.

  All flows are concept estimates from an independent sequential balance on assumed liquor
  ratios (A/C 0.70 blow-off, 0.38 spent; caustic 250 g/L as Na2CO3), washing and cake
  parameters: no caustic aluminate speciation or gibbsite solubility is calculated.
  Lime dose and electricity are IAI 2019 global averages; calciner energy is a sourced
  specific energy (cheme process furnace refuses gibbsite). See DESIGN.md.
families: [aluminium]           # no alumina family in taxonomy/families.yaml yet; aluminium shares ISIC 2420 (DESIGN.md section 4)
keywords: [alumina, aluminium oxide, Bayer process, bauxite, gibbsite, digestion, red mud, bauxite residue, precipitation, calcination, caustic soda, sodium aluminate]
facets:
  feedstock_basis: [mineral]
  product_classes: [materials]
  unit_operations: [reaction, crystallization, sedimentation, filtration, evaporation, calcination]
  region: generic
# Honest claim: concept is the lowest level of the manifest. cheme maturity reports calculation
# maturity "none": the feed flows are ASSUMED (solved from the capacity) and the conversions and
# splits are ASSUMED specifications, not sourced values (DESIGN.md section 5).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept BFD/PFD with closed mass, component and element balances (cheme validate, cheme
    process streams: 6 blocks, 19 steps, reactive balances by extents for 8 reactions). All
    flows and compositions are specified values of an independent balance
    (scripts/bayer_balance.py) on assumed design parameters; no electrolyte speciation or
    gibbsite solubility is calculated, and no property package covers the
    liquors and solids, so energy closure is not evaluable in core: the duties are a lumped
    script estimate. The calciner uses a sourced specific energy (gibbsite calcination is
    refused by cheme process furnace, core's furnace energy covers limestone only). The gate-to-gate LCI is
    preliminary, with every background unmapped. Not reviewed.
chemistry:
  inputs:
    - {chemical: water, role: feedstock, inventory_key: "feed:PW", note: "Fresh water make-up to the hot water tank. Bauxite, quicklime, caustic soda and natural gas have no registry entries yet (DESIGN.md section 4)"}
    - {chemical: air, role: feedstock, inventory_key: "feed:AIR", note: "Calciner combustion air"}
  outputs:
    - {chemical: carbon-dioxide, role: emission, inventory_key: "emission:CO2", note: "Calciner natural gas CO2, ~0.154 kg/kg alumina. The main product (alumina) and the bauxite residue have no registry entries yet"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER"}
    - {chemical: steam, role: utility, inventory_key: "feed:MPS", note: "MP steam 1000 kPa(a), digestion heaters, counted as heat delivered"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "LP steam 450 kPa(a), liquor heater trim and evaporators, counted as heat delivered"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "25/35 C (ASSUMED)"}
basis:
  capacity: "3000 t/d smelter-grade alumina (ASSUMED normalisation basis)"
  operating_hours_per_year: 8400
  location: generic (not chosen)
lca: {source: auto}
