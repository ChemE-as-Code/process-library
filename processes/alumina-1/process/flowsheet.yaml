# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Bayer alumina refinery, 3000 t/d smelter-grade alumina from Guinean gibbsitic bauxite by
# low-temperature digestion (D-001, D-002, D-003). Where the values come from:
# - every flow and composition is from the independent sequential balance
#   scripts/bayer_balance.py (D-004..D-006), given here as ASSUMED: it rests on ASSUMED liquor
#   ratios (A/C), extraction, washing and cake parameters and on a neutral-molecule basis for
#   the caustic aluminate liquor, because core cannot speciate it or predict
#   gibbsite solubility and precipitation yield;
# - the bauxite mineralogy is derived from a sourced assay (D-003); the lime dose and the
#   lumped electricity are sourced industry averages (IAI 2019 LCI report, D-004, D-007); the
#   calciner fuel is a sourced specific energy for gas suspension calciners (D-008), because
#   cheme process furnace refuses gibbsite calcination (cheme.furnace-unsupported);
# - reactor steps name their reactions (process/reactions.yaml), so cheme checks their balance
#   by elements;
# - duties are from the same script (D-007), ASSUMED; no property package covers these streams.
# - S8, S11, S12 and S24 (heaters and coolers) are filled by cheme process propagate.
schema: cheme/process/v1
kind: flowsheet
title: Alumina by the Bayer process (3000 t/d smelter-grade alumina)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - id: design
    description: "Design case: 3000 t/d smelter-grade alumina (99.0 wt% Al2O3), 8400 h/a, Guinean gibbsitic bauxite (D-002, D-003)"
    default: true
    capacity: 3000 t/d smelter-grade alumina
    provenance: assumed
    source: "D-002: a normalisation basis for the inventory, not a commercial plant claim"
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: BX, title: "Bauxite, gibbsitic (Guinea, Debele type), crushed", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: LIME, title: Quicklime, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NAOH, title: "Caustic soda make-up, 50 wt% solution", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PW, title: Fresh water make-up, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NG, title: Natural gas (calciner fuel), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AIR, title: Calciner combustion air, category: raw_material, ports: [{id: out, direction: out}]}
  - id: MPS
    title: MP steam 1000 kPa(a) to the digestion heaters (condensate returned)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1000, provenance: assumed, source: "design basis, D-007"}
      supply_temperature: {value: 453.0, provenance: assumed, source: "saturation at 1000 kPa(a), D-007"}
      min_approach: {value: 10, provenance: assumed, source: D-007}
    ports: [{id: e202, direction: out, kind: energy}]
  - id: LPS
    title: LP steam 450 kPa(a) to the liquor heater and the evaporators (condensate returned)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis, D-007"}
      supply_temperature: {value: 420.8, provenance: assumed, source: "saturation at 450 kPa(a), D-007"}
      min_approach: {value: 10, provenance: assumed, source: D-007}
    ports:
      - {id: e101, direction: out, kind: energy}
      - {id: e501, direction: out, kind: energy}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports: [{id: aux, direction: out, kind: energy}]
products:
  - {id: ALU, title: Smelter-grade alumina to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: RES, title: Bauxite residue filter cake to the residue storage area (dry stacking), category: solid_waste, ports: [{id: in, direction: in}]}
  - {id: STACK, title: Calciner flue gas to atmosphere, category: off_gas, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-007"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-007"}
      min_approach: {value: 5, provenance: assumed, source: D-007}
    ports:
      - {id: e501, direction: in, kind: energy}
      - {id: e401, direction: in, kind: energy}
      - {id: r401, direction: in, kind: energy}

blocks:
  - id: PRE
    title: Bauxite grinding, lime slaking and pre-desilication
    class: ReactingChemicals
    ports:
      - {id: bx, direction: in}
      - {id: lime, direction: in}
      - {id: slk, direction: in}
      - {id: liq, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: heat, direction: in, kind: energy}
      - {id: rec, direction: in, kind: energy}
      - {id: flash, direction: in, kind: energy}
  - id: DIG
    title: Digestion (418 K) and flash heat recovery
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cond, direction: out}
      - {id: heat, direction: in, kind: energy}
      - {id: surplus, direction: out, kind: energy}
  - id: CLA
    title: Clarification, residue washing and filtration
    class: Separating
    ports:
      - {id: in, direction: in}
      - {id: water, direction: in}
      - {id: ovf, direction: out}
      - {id: cake, direction: out}
  - id: PRC
    title: Precipitation, classification and hydrate filtration
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: wash, direction: in}
      - {id: ovf, direction: out}
      - {id: filtrate, direction: out}
      - {id: cake, direction: out}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: rec, direction: out, kind: energy}
  - id: EVA
    title: Spent liquor evaporation, caustic make-up and condensate
    class: Evaporating
    ports:
      - {id: liq, direction: in}
      - {id: filt, direction: in}
      - {id: naoh, direction: in}
      - {id: fc, direction: in}
      - {id: pw, direction: in}
      - {id: out, direction: out}
      - {id: slk, direction: out}
      - {id: wash, direction: out}
      - {id: hwash, direction: out}
      - {id: heat, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: CAL
    title: Hydrate calcination (gas suspension calciner)
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: fuel, direction: in}
      - {id: air, direction: in}
      - {id: prod, direction: out}
      - {id: gas, direction: out}

steps:
  # PRE (D-004)
  - id: M101
    block: PRE
    title: Lime slaker
    class: ReactingChemicals
    reactions: [SLAKE]
    links: [{target: equipment, ref: M-101}]
    ports:
      - {id: lime, direction: in, delegates: lime}
      - {id: water, direction: in, delegates: slk}
      - {id: milk, direction: out}
  - id: E101
    block: PRE
    title: Spent liquor heaters (recovered heat and LP steam)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in, delegates: liq}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: heat}
      - {id: rec, direction: in, kind: energy, delegates: rec}
      - {id: flash, direction: in, kind: energy, delegates: flash}
  - id: G101
    block: PRE
    title: Bauxite wet grinding mill (in spent liquor)
    class: Grinding
    links: [{target: equipment, ref: G-101}]
    ports:
      - {id: bx, direction: in, delegates: bx}
      - {id: milk, direction: in}
      - {id: liq, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: R101
    block: PRE
    title: Pre-desilication tanks (373 K)
    class: ReactingChemicals
    reactions: [DESIL, TCA]
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
  # DIG (D-004, D-007)
  - id: E201
    block: DIG
    title: Regenerative slurry heaters (flash vapour)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: out, direction: out}
      - {id: vap, direction: in}
      - {id: cond, direction: out, delegates: cond}
      - {id: surplus, direction: out, kind: energy, delegates: surplus}
  - id: E202
    block: DIG
    title: Digestion heaters (MP steam)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-202}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: heat}
  - id: R201
    block: DIG
    title: Digesters (418 K)
    class: ReactingChemicals
    reactions: [DIG]
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: F201
    block: DIG
    title: Blow-off flash tanks
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-201}]
    ports:
      - {id: in, direction: in}
      - {id: vap, direction: out}
      - {id: out, direction: out, delegates: out}
  # CLA (D-005)
  - id: T301
    block: CLA
    title: Settler (thickener) with flocculant and security filtration of the overflow
    class: SeparatingByGravity
    links: [{target: equipment, ref: T-301}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: wash, direction: in}
      - {id: ovf, direction: out, delegates: ovf}
      - {id: uf, direction: out}
  - id: T302
    block: CLA
    title: Counter-current residue washers (6 stages)
    class: SeparatingByGravity
    links: [{target: equipment, ref: T-302}]
    ports:
      - {id: mud, direction: in}
      - {id: water, direction: in, delegates: water}
      - {id: filtrate, direction: in}
      - {id: ovf, direction: out}
      - {id: mud_out, direction: out}
  - id: F301
    block: CLA
    title: Residue filter presses (dry stacking cake)
    class: Filtering
    links: [{target: equipment, ref: F-301}]
    ports:
      - {id: in, direction: in}
      - {id: filtrate, direction: out}
      - {id: cake, direction: out, delegates: cake}
  # PRC (D-006)
  - id: E401
    block: PRC
    title: Pregnant liquor coolers (heat interchange with spent liquor)
    class: Cooling
    links: [{target: equipment, ref: E-401}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
      - {id: rec, direction: out, kind: energy, delegates: rec}
  - id: R401
    block: PRC
    title: Seeded precipitators with interstage cooling
    class: ReactingChemicals
    reactions: [PREC]
    links: [{target: equipment, ref: R-401}]
    ports:
      - {id: in, direction: in}
      - {id: seed, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  - id: S401
    block: PRC
    title: Hydrate classification (hydrocyclones, seed thickeners)
    class: SeparatingByCyclonicMotion
    links: [{target: equipment, ref: S-401}]
    ports:
      - {id: in, direction: in}
      - {id: seed, direction: out}
      - {id: prod, direction: out}
      - {id: ovf, direction: out, delegates: ovf}
  - id: F401
    block: PRC
    title: Product hydrate filters with washing
    class: Filtering
    links: [{target: equipment, ref: F-401}]
    ports:
      - {id: in, direction: in}
      - {id: wash, direction: in, delegates: wash}
      - {id: filtrate, direction: out, delegates: filtrate}
      - {id: cake, direction: out, delegates: cake}
  # EVA (D-005, D-006)
  - id: E501
    block: EVA
    title: Spent liquor multiple-effect evaporators
    class: Evaporating
    links: [{target: equipment, ref: E-501}]
    ports:
      - {id: feed, direction: in, delegates: liq}
      - {id: filt, direction: in, delegates: filt}
      - {id: liq, direction: out}
      - {id: cond, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: heat}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: M501
    block: EVA
    title: Caustic make-up tank
    class: Mixing
    links: [{target: equipment, ref: T-501}]
    ports:
      - {id: in, direction: in}
      - {id: naoh, direction: in, delegates: naoh}
      - {id: out, direction: out, delegates: out}
  - id: T501
    block: EVA
    title: Hot water (condensate) tank
    class: Mixing
    links: [{target: equipment, ref: T-502}]
    ports:
      - {id: fc, direction: in, delegates: fc}
      - {id: ec, direction: in}
      - {id: pw, direction: in, delegates: pw}
      - {id: slk, direction: out, delegates: slk}
      - {id: wash, direction: out, delegates: wash}
      - {id: hwash, direction: out, delegates: hwash}
  # CAL (D-008)
  - id: R601
    block: CAL
    title: Gas suspension calciner (preheating cyclones, furnace, fluid-bed coolers, ESP)
    class: ReactingChemicals
    reactions: [CALC, SODA, COMB]
    links: [{target: equipment, ref: R-601}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: fuel, direction: in, delegates: fuel}
      - {id: air, direction: in, delegates: air}
      - {id: prod, direction: out, delegates: prod}
      - {id: gas, direction: out, delegates: gas}

