# Reactions of the Bayer process (D-004, D-006, D-008). Schema: `cheme schema
# process-reactions`. Net: Al(OH)3 of the bauxite -> Al2O3 + 1.5 H2O, run through the caustic
# aluminate liquor cycle; the caustic losses go with the desilication product and the residue.
# Conversions are design specifications (a conversion model with ASSUMED values, D-004, D-006),
# not kinetics and not a solubility prediction. Heats of reaction at 298 K from standard
# enthalpies of formation (NBS tables of chemical thermodynamic properties, Wagman et al.
# 1982, J. Phys. Chem. Ref. Data 11 Suppl. 2; gibbsite from Robie and Hemingway 1995, USGS
# Bulletin 2131): recalled for this concept stage, to be checked against the tables, so
# ASSUMED. Aqueous species at infinite dilution; NaAlO2(aq) = NaAl(OH)4(aq) - 2 H2O(l).
schema: cheme/reactions/v1
kind: reactions
reactions:
  - id: SLAKE
    title: Lime slaking
    equation: CaO(s) + H2O(l) -> Ca(OH)2(s)
    stoichiometry: {CaO: -1, H2O: -1, CaOH2: 1}
    conversion: {key: CaO, value: 1.0, provenance: assumed, source: "complete slaking (D-004)"}
    heat_of_reaction: {value: -64270, provenance: assumed, source: "formation enthalpies Ca(OH)2(s) -985.2, CaO(s) -635.1, H2O(l) -285.83 kJ/mol (NBS tables)"}
  - id: DESIL
    title: Desilication (kaolinite to sodalite-type desilication product)
    equation: 3 Al2Si2O5(OH)4(s) + 8 NaOH(aq) -> Na8Al6Si6O24(OH)2(s) + 9 H2O(l)
    stoichiometry: {Kaol: -3, NaOH: -8, DSP: 1, H2O: 9}
    phase: mixed
    conversion: {key: Kaol, value: 1.0, provenance: assumed, source: "D-004: reactive silica fully converted in pre-desilication and digestion; DSP carried as hydroxysodalite (Na/Si 1.33), the anions of real Bayer sodalite (carbonate, sulfate, chloride) not carried"}
  - id: TCA
    title: Lime in aluminate liquor to tricalcium aluminate
    equation: 3 Ca(OH)2(s) + 2 NaAlO2(aq) + 4 H2O(l) -> Ca3Al2(OH)12(s) + 2 NaOH(aq)
    stoichiometry: {CaOH2: -3, NaAlO2: -2, H2O: -4, TCA: 1, NaOH: 2}
    phase: mixed
    conversion: {key: CaOH2, value: 1.0, provenance: assumed, source: "D-004: all lime leaves with the residue as TCA (hydrogarnet); a simplification of the lime chemistry (causticisation, phosphate and titania control are not carried)"}
  - id: DIG
    title: Gibbsite digestion
    equation: Al(OH)3(s) + NaOH(aq) -> NaAlO2(aq) + 2 H2O(l)
    stoichiometry: {AlOH3: -1, NaOH: -1, NaAlO2: 1, H2O: 2}
    phase: mixed
    conversion: {key: AlOH3, value: 0.98, provenance: assumed, source: "D-004: 98 % of the gibbsite dissolved at 418 K to a blow-off A/C of 0.70; diaspore/boehmite and quartz not attacked at this temperature"}
    heat_of_reaction: {value: 20590, provenance: assumed, source: "formation enthalpies Al(OH)4-(aq) -1502.5, Na+(aq) -240.12, NaOH(aq) -470.11 kJ/mol (NBS tables), gibbsite -1293.1 kJ/mol (Robie and Hemingway 1995)"}
  - id: PREC
    title: Seeded gibbsite precipitation
    equation: NaAlO2(aq) + 2 H2O(l) -> Al(OH)3(s) + NaOH(aq)
    stoichiometry: {NaAlO2: -1, H2O: -2, AlOH3: 1, NaOH: 1}
    phase: mixed
    conversion: {key: NaAlO2, value: 0.4103, provenance: assumed, source: "D-006: from the A/C of the precipitator feed (pregnant liquor + seed liquor) to the spent A/C 0.38; scripts/bayer_balance.py"}
    heat_of_reaction: {value: -20590, provenance: assumed, source: "reverse of DIG"}
  - id: CALC
    title: Hydrate calcination
    equation: 2 Al(OH)3(s) -> Al2O3(s) + 3 H2O(g)
    stoichiometry: {AlOH3: -2, Al2O3: 1, H2O: 3}
    conversion: {key: AlOH3, value: 1.0, provenance: assumed, source: "D-008: complete calcination; the product's LOI is carried as H2O"}
    heat_of_reaction: {value: 185040, provenance: assumed, source: "formation enthalpies corundum -1675.7, H2O(g) -241.82 (NBS tables), gibbsite -1293.1 kJ/mol (Robie and Hemingway 1995)"}
  - id: SODA
    title: Occluded soda fixed as Na2O in the calciner
    equation: 2 NaOH -> Na2O(s) + H2O(g)
    stoichiometry: {NaOH: -2, Na2O: 1, H2O: 1}
    conversion: {key: NaOH, value: 1.0, provenance: assumed, source: "D-008"}
  - id: COMB
    title: Natural gas combustion (calciner)
    equation: CH4 + 2 O2 -> CO2 + 2 H2O(g)
    stoichiometry: {CH4: -1, O2: -2, CO2: 1, H2O: 2}
    conversion: {key: CH4, value: 1.0, provenance: assumed, source: "D-008: complete combustion; CO and NOx not estimated"}
    heat_of_reaction: {value: -802550, provenance: assumed, source: "formation enthalpies CH4 -74.6, CO2 -393.51, H2O(g) -241.82 kJ/mol (NBS tables)"}
