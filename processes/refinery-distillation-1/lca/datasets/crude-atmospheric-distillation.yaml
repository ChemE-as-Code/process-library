    table (manufacturer literature; the sheet gives no guarantee of accuracy), light ends
- name: tbp_180
  value: 0.165
  unit: kg/kg
  description: Mass distilled up to 180 degC, light ends included; the BREF's naphtha end point.
  source: TotalEnergies crude oil data sheet Johan Sverdrup (assay of 01-Apr-2021, sheet Jul-21), TBP distillation
    table (manufacturer literature; the sheet gives no guarantee of accuracy), TBP curve; cut point from EU
