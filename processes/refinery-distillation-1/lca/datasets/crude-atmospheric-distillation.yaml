# Tier 1 form, without a flowsheet. Every amount is the formula of its parameters; core's validator
# re-checks each. Written from the REF BREF, one public crude assay and IPCC 2006 (facts in our own form).
# The element balance counts every hydrocarbon stream as the pseudo-component CH2 (ASSUMED): it checks
# the mass balance of the cuts, not how carbon, hydrogen and sulfur split between them.
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: crude-atmospheric-distillation
title: Atmospheric distillation of desalted crude oil
description: 'Per 1 t of desalted crude oil, gate-to-gate, crude distillation unit (CDU) with side strippers.
  Cut yields of one medium North Sea crude at the REF BREF''s cut points; utilities as midpoints of the REF
  BREF''s ranges; furnace CO2, CH4 and N2O from IPCC defaults. Unallocated: all cuts are co-products.'
basis: 1000 kg of desalted crude oil distilled
boundary: 'gate-to-gate: preheat furnace, atmospheric column, side strippers, overhead condensing; desalting,
  naphtha stabilisation and sour water stripping are outside; steam and power from outside'
technology: atmospheric crude distillation at 0.5 to 1 barg with steam stripping (REF BREF 2.19); one crude
  assay
geography:
  description: EU utility data of the REF BREF; the crude is a Norwegian North Sea grade refined in Europe;
    no single site.
classification:
  isic: '1920'
system_boundary:
  included:
  - crude feed and the six cuts
  - furnace fuel and its combustion emissions
  - electricity, stripping steam, cooling water
  - sour water
  - column clean-out sludge
  - fugitive hydrocarbons of both distillation units
  excluded:
  - 'TODO desalting (REF BREF 2.9 and 3.9): its water, electricity and desalter effluent'
  - 'TODO H2S and NH3 in the overhead gas and sour water: the sheet gives no H2S, and they go to amine treating
    and the sour water stripper'
  - 'TODO furnace decoking (once or twice a year, REF BREF 3.19): soot and spent decoking steam not quantified'
  - 'TODO corrosion inhibitors and caustic soda dosed to the overhead: no amount in the source'
  - 'heat integration with downstream units: no credit in the cut-off model'
  - infrastructure
  - storage emissions
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: RER
year: 2001
valid_until: 2006
time:
  start: 1999
  description: Utilities from the REF BREF table, whose sources date from 1999 to 2001 (the 2015 BREF still
    gives them); cut yields from an assay of 2021; combustion factors of IPCC 2006. valid_until is the reference
    year + 5 (system-model section 6), so it has long lapsed.
version: 0.1.0
methodology_version: 1.0.0
system_model: cutoff
technology_level: current
review: unreviewed
rights: CC-BY-4.0
data_generator: ChemE-as-Code process library
modelling:
  principle: attributional
  multifunctionality: 'unallocated: every cut is a co-product. Default allocation for the export: energy (LHV,
    IPCC 2006 default NCVs), hierarchy step 2 for co-produced fuels (see allocation)'
  sampling: One crude (Johan Sverdrup); a lighter or heavier crude shifts every cut. EU utility ranges of 1999
    to 2001.
allocation:
  method: energy
  coproducts:
  - refinery-gas
  - lpg
  - naphtha
  - kerosene
  - gas-oil
  - atmospheric-residue
  source: 'docs/system-model.md section 2, step 2: the cuts are co-produced fuels and refinery feedstocks,
    so energy content (LHV) is the physical relationship'
  deviation: 'Not a departure in substance: energy (LHV) is the hierarchy''s step 2 for co-produced fuels.
    It is stated here because no curated rule (physical-energy) for refinery-distillation-1 is in lci/mappings.yaml
    allocation yet; once one is added the build records rule physical-energy. The LHVs are IPCC 2006 category
    defaults (Vol. 2, Table 1.2), not measured per cut.'
uuid: 0d4d6ddb-1be7-5599-a036-73edd76f2fec
parameters:
