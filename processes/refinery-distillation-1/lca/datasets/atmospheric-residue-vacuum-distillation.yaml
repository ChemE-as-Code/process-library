# Tier 1 form, without a flowsheet. Every amount is the formula of its parameters; core's validator
# re-checks each. Written from the REF BREF, one public crude assay and IPCC 2006 (facts in our own form).
# The element balance counts every hydrocarbon stream as the pseudo-component CH2 (ASSUMED): it checks
# the mass balance of the cuts, not how carbon, hydrogen and sulfur split between them.
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: atmospheric-residue-vacuum-distillation
title: Vacuum distillation of atmospheric residue
description: 'Per 1 t of atmospheric residue, gate-to-gate, high vacuum unit (HVU). Cut yields of the same
  crude as the atmospheric dataset; utilities as midpoints of the REF BREF''s ranges; furnace CO2, CH4 and
  N2O from IPCC defaults. Unallocated: vacuum gas oil and vacuum residue are co-products.'
basis: 1000 kg of atmospheric residue distilled
boundary: 'gate-to-gate: vacuum furnace, vacuum column at 40 to 100 mbar, ejectors or vacuum pumps, overhead
  condensing; sour water stripping is outside; steam and power from outside'
technology: vacuum distillation with steam injection and steam ejectors (REF BREF 2.19); one crude assay
geography:
  description: EU utility data of the REF BREF; the crude is a Norwegian North Sea grade refined in Europe;
    no single site.
classification:
  isic: '1920'
system_boundary:
  included:
  - atmospheric residue feed and the two vacuum cuts
  - furnace fuel and its combustion emissions
  - electricity, steam, cooling water
  - sour water
  excluded:
  - 'TODO non-condensables of the ejector condensers (50 to 200 kg/h of hydrocarbons and H2S, REF BREF 3.19):
    routed to the sour fuel gas system or a heater, not quantified per t'
  - 'TODO oily water of barometric condensers (about 10 m3/h, REF BREF 3.19): not per t, and the dataset assumes
    surface condensers'
  - 'fugitive hydrocarbons: booked in the atmospheric dataset for both units'
  - 'TODO wash oil and slop recycle: internal'
  - infrastructure
  - storage emissions
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: RER
year: 2001
valid_until: 2006
time:
  start: 1999
  description: Utilities from the REF BREF table, whose sources date from 1999 to 2001 (the 2015 BREF still
    gives them); cut yields from an assay of 2021; combustion factors of IPCC 2006. valid_until is the reference
    year + 5 (system-model section 6), so it has long lapsed.
version: 0.1.0
methodology_version: 1.0.0
system_model: cutoff
technology_level: current
review: unreviewed
rights: CC-BY-4.0
data_generator: ChemE-as-Code process library
modelling:
  principle: attributional
  multifunctionality: 'unallocated: every cut is a co-product. Default allocation for the export: energy (LHV,
    IPCC 2006 default NCVs), hierarchy step 2 for co-produced fuels (see allocation)'
  sampling: One crude (Johan Sverdrup), vacuum cut at 560 degC (ASSUMED). EU utility ranges of 1999 to 2001.
allocation:
  method: energy
  coproducts:
  - vacuum-gas-oil
  - vacuum-residue
  source: 'lci/mappings.yaml allocation.refinery-distillation-1 (rule physical-energy): the two cuts are refinery
    feedstocks and fuel oil, so energy content (LHV) is the physical relationship, docs/system-model.md section
    2, step 2. The LHVs are IPCC 2006 category defaults (Vol. 2, Table 1.2), not measured per cut: vacuum gas
    oil as refinery feedstocks (43.0) and vacuum residue as residual fuel oil (40.4), while the feed is residual
    fuel oil (40.4) too. The categories give the products 3.9 % more energy than the feed of a pure separation,
    which moves about 1.5 points of the burden to the vacuum gas oil (61.8 % against 60.3 % by mass).'
uuid: 2be2543e-1948-5185-8baf-cee34fe1a86c
parameters:
- name: ar
  value: 1000.0
  unit: kg
  description: Atmospheric residue to the vacuum unit (the basis).
  source: basis
- name: tbp_360
  value: 0.474
  unit: kg/kg
  description: 'Mass of the crude distilled up to 360 degC: the start of the atmospheric residue.'
  source: TotalEnergies crude oil data sheet Johan Sverdrup (assay of 01-Apr-2021, sheet Jul-21), TBP distillation
    table (manufacturer literature; the sheet gives no guarantee of accuracy), TBP curve; cut point from EU
    JRC (2015) REF BREF, Barthe et al., EUR 27140 EN, doi:10.2791/010758, section 2.19, p. 101
- name: tbp_560
  value: 0.791
  unit: kg/kg
  description: 'Mass of the crude distilled up to 560 degC: the vacuum gas oil end point.'
  source: TotalEnergies crude oil data sheet Johan Sverdrup (assay of 01-Apr-2021, sheet Jul-21), TBP distillation
    table (manufacturer literature; the sheet gives no guarantee of accuracy), TBP curve; the cut point is
    ASSUMED (the BREF names none; the sheet's residues above 550 and 565 degC bracket it)
- name: fuel_v
  value: 600.0
  unit: MJ
  description: 'Fuel per t of vacuum feed: midpoint of 400 to 800 MJ/t.'
  source: EU JRC (2015) REF BREF, Barthe et al., EUR 27140 EN, doi:10.2791/010758, section 3.19, Table 3.77,
    p. 207 (sources VROM 1999, Canales 2000, TWG 2001); the midpoint is our choice
- name: elec_v
  value: 3.0
  unit: kWh
  description: 'Electricity per t of vacuum feed: midpoint of 1.5 to 4.5 kWh/t.'
  source: EU JRC (2015) REF BREF, Barthe et al., EUR 27140 EN, doi:10.2791/010758, section 3.19, Table 3.77,
    p. 207 (sources VROM 1999, Canales 2000, TWG 2001); the midpoint is our choice
- name: steam_v
  value: 40.0
  unit: kg
  description: 'Steam consumed per t of vacuum feed: midpoint of 20 to 60 kg/t (stripping and ejector steam).'
  source: EU JRC (2015) REF BREF, Barthe et al., EUR 27140 EN, doi:10.2791/010758, section 3.19, Table 3.77,
    p. 207 (sources VROM 1999, Canales 2000, TWG 2001); the midpoint is our choice; pressure not stated
- name: cw_v
  value: 4.0
  unit: m3
  description: 'Cooling water per t of vacuum feed at a 17 K rise: midpoint of 3 to 5 m3/t.'
  source: EU JRC (2015) REF BREF, Barthe et al., EUR 27140 EN, doi:10.2791/010758, section 3.19, Table 3.77,
    p. 207 (sources VROM 1999, Canales 2000, TWG 2001); the midpoint is our choice
- name: dt_cw
  value: 17.0
  unit: K
  description: Temperature rise of the cooling water.
  source: EU JRC (2015) REF BREF, Barthe et al., EUR 27140 EN, doi:10.2791/010758, section 3.19, Table 3.77,
    p. 207 (sources VROM 1999, Canales 2000, TWG 2001)
- name: v_nox
  value: 0.01258
  unit: kg
  description: 'NOx per t of vacuum feed: the plant''s load of 56.6 t/yr over 4 500 000 t/yr of atmospheric
    residue (the table''s kg/t row rounds it to 0.013).'
  source: EU JRC (2015) REF BREF, Barthe et al., EUR 27140 EN, doi:10.2791/010758, section 3.19, Table 3.78,
    p. 208 (TOTAL Mitteldeutschland, loads calculated by the source from permit limit values, yearly average,
    3 % O2 dry)
- name: v_so2
  value: 0.0044
  unit: kg
  description: 'SO2 per t of vacuum feed (the plant''s flue gas passes FGD): the plant''s load of 19.8 t/yr
    over 4 500 000 t/yr of atmospheric residue (the table''s kg/t row rounds it to 0.004).'
  source: EU JRC (2015) REF BREF, Barthe et al., EUR 27140 EN, doi:10.2791/010758, section 3.19, Table 3.78,
    p. 208 (TOTAL Mitteldeutschland, loads calculated by the source from permit limit values, yearly average,
