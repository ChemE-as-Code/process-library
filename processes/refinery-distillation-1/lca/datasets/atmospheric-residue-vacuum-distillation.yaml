  source: EU JRC (2015) REF BREF, Barthe et al., EUR 27140 EN, doi:10.2791/010758, section 3.19, Table 3.78,
    p. 208 (TOTAL Mitteldeutschland, loads calculated by the source from permit limit values, yearly average,
