- name: ef_co2
  value: 57.6
  unit: g/MJ
  description: 'CO2 per MJ (LHV) of refinery gas burned: 57 600 kg/TJ, 95 % interval 48 200 to 69 000.'
  source: IPCC (2006) Guidelines, Vol. 2 Energy, ch. 1, Table 1.4, p. 1.23 (refinery gas) and IPCC (2006) Guidelines,
