id: carbon-dioxide-by-direct-air-capture-koh-solvent-and-calcium-loop-1.17-mt-a-15-mpa
title: Carbon dioxide by direct air capture, KOH solvent and calcium loop (1.17 Mt/a, 15 MPa)
description: Unallocated foreground LCI of Carbon dioxide by direct air capture, KOH solvent and calcium
  loop (1.17 Mt/a, 15 MPa), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Liquid-solvent direct air capture: ambient air through cross-flow contactors with aqueous
  KOH (74.5 % of its CO2 captured), the carbonate causticised with slaked lime in fluidised pellet reactors,
  the CaCO3 pellets dried in a steam slaker and calcined at 900 C in an oxy-fired circulating fluidised
  bed on natural gas and 95.6 wt% oxygen, the CaO slaked in steam and recycled; the calciner off-gas compressed
  to 15.1 MPa and dried with glycol; grid power, no on-site generation (Keith et al. 2018, scenario C);
  885 kt/a of CO2 from the air, 1.17 Mt/a of product in 7884 h/a'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:calciner-combustion
  title: combustion emissions of F-401
  direction: output
  reason: 'The calciner is fired in oxygen and its whole off-gas (CO2, water, excess O2 and N2) goes to
    the CO2 product through K-501 (S19, S20): the flowsheet carries it. NOx, CO and the SO2 of the gas''s
    odorant are taken to leave with the product (ASSUMED, D-008), a departure from SRC-2: its Case 1 sulfur
    balance (Exhibit 5-6) has 0.2 kg/h of sulfur (about 0.4 kg/h as SO2) in the calciner''s gas leaving
    through the CO2 dryer vent, a release to air, and its carbon balance (Exhibit 5-5) a dryer-vent outflow
    of 13 kg C/h, for a plant capturing 909 kt/a from the air; not estimated at the concept stage (D-008,
    D-012).'
- key: emission-excluded:lime-mix-tank
  title: storage-tank emissions of TK-302
  direction: output
  reason: The lime mix tank holds an aqueous Ca(OH)2 slurry with no volatile component; its vent carries
    water vapour and, from the hot lime, steam only (D-012).
