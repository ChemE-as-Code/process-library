# Components and templates of the process. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol.
#
# Direct air capture of CO2 with aqueous KOH and a calcium caustic recovery loop (DESIGN.md
# D-001). The capture liquor is carried as dissolved KOH and K2CO3 in water, an inventory basis,
# not a speciation (no K+, OH-, CO3-- or HCO3- ions; limit L-1). The calcium species are solids.
# Natural gas is carried as methane, as SRC-1 (Keith et al. 2018, Fig. 2) models it (D-007), and
# the oxidant from the air separation unit as O2 and N2 (its argon lumped with the N2, as SRC-1
# Fig. 2 gives the oxidant). Air is carried as N2, O2, H2O and CO2 in the mass fractions of SRC-1
# Fig. 2 (its argon lumped with N2 there too).
#
# Molar masses from the formulas with the standard atomic weights H 1.008, C 12.011, N 14.007,
# O 15.999, K 39.098, Ca 40.078 (IUPAC abridged values, as scripts/dac_balance.py uses them);
# CAS numbers from PubChem. No heat capacities: the flowsheet's duties are not calculated by
# core (no conversion duties, D-009, limit L-4).
schema: cheme/process/v1
kind: materials
components:
  - {id: CO2, name: Carbon dioxide, formula: CO2, cas: 124-38-9, molar_mass: 44.009}
  - {id: N2, name: "Nitrogen (with the argon of air and of the oxidant lumped)", formula: N2, cas: 7727-37-9, molar_mass: 28.014}
  - {id: O2, name: Oxygen, formula: O2, cas: 7782-44-7, molar_mass: 31.998}
  - {id: H2O, name: Water, formula: H2O, cas: 7732-18-5, molar_mass: 18.015}
  - {id: KOH, name: Potassium hydroxide (dissolved in the liquor; solid as make-up), formula: KOH, cas: 1310-58-3, molar_mass: 56.105}
  - {id: K2CO3, name: Potassium carbonate (dissolved in the liquor; carried with the solids), formula: K2CO3, cas: 584-08-7, molar_mass: 138.204}
  - {id: CAOH2, name: Calcium hydroxide (slaked lime), formula: CaH2O2, cas: 1305-62-0, molar_mass: 74.092, phase: solid}
  - {id: CACO3, name: Calcium carbonate (pellets and seed), formula: CaCO3, cas: 471-34-1, molar_mass: 100.086, phase: solid}
  - {id: CAO, name: Calcium oxide (quicklime), formula: CaO, cas: 1305-78-8, molar_mass: 56.077, phase: solid}
  - {id: CH4, name: "Methane (natural gas, as SRC-1 models it)", formula: CH4, cas: 74-82-8, molar_mass: 16.043}
templates:
  - id: air
    title: Ambient and CO2-depleted air
    components: [CO2, N2, O2, H2O]
  - id: dac
    title: Air, KOH liquor, calcium solids, natural gas, oxidant and CO2 streams
    components: [CO2, N2, O2, H2O, KOH, K2CO3, CAOH2, CACO3, CAO, CH4]
# property_method is a placeholder: no package of core covers the aqueous KOH-K2CO3 electrolyte
# or the calcium solids (limit L-1); `cheme process props --coverage` reports the streams as
# not covered.
property_method:
  adapter: thermo
  status: placeholder
