        flow: {value: 2010.45, provenance: assumed, source: "scripts/dac_balance.py: D-005: KOH make-up at SRC-2's 69.8 short ton/d per 147.2 t/h of CO2 taken up by its liquor (air and NGCC flue gas), applied per t of CO2 captured from the air"}
        composition: {basis: mass_fraction, values: {CO2: 0.0, N2: 0.0, O2: 0.0, H2O: 0.0, KOH: 1.0, K2CO3: 0.0, CAOH2: 0.0, CACO3: 0.0, CAO: 0.0, CH4: 0.0}, provenance: assumed, source: "scripts/dac_balance.py: D-005: KOH make-up at SRC-2's 69.8 short ton/d per 147.2 t/h of CO2 taken up by its liquor (air and NGCC flue gas), applied per t of CO2 captured from the air"}
