# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Direct air capture of CO2 by the liquid-solvent process of Keith et al. (2018, SRC-1): aqueous
# KOH in cross-flow air contactors, causticisation in pellet reactors, a steam slaker and an
# oxy-fired circulating fluidised bed calciner, in the configuration with a natural-gas-fired
# calciner and grid electricity (SRC-1 scenario C; no on-site power island, D-001). Where the
# values come from:
# - every material stream is the steady state of scripts/dac_balance.py, `provenance: assumed`
#   with that script as its source (library ADR 0027: CI re-runs the script and compares). The
#   two loops (KOH liquor, calcium) are closed in the script by stoichiometry, not iterated by
#   core: the electrolyte and the solids have no model in core (limit L-1, D-003);
# - the capture fraction, the conversions, the carry-overs and the calciner's specific energy are
#   SRC-1's; the make-ups of KOH and CaCO3 are NETL's (SRC-2) scaled to the CO2 captured; the
#   rest ASSUMED (DESIGN.md D-002 to D-008);
# - temperatures and pressures are SRC-1's where it gives them, otherwise ASSUMED;
# - the power streams are SRC-1's specific consumptions (Table 1) times the flows; the CO2
#   train's cooling (Q1), the calciner's heat beyond the calcination (Q2) and the slaker's surplus
#   heat (Q3) are hand estimates, and so are the temperatures of the lean liquor (R201) and of the
#   depleted air (C101), from the energy printout of scripts/dac_balance.py with round heat
#   capacities (D-003, D-006, D-007, D-009). No conversion duty is calculated by core (L-4).
schema: cheme/process/v1
kind: flowsheet
title: Carbon dioxide by direct air capture, KOH solvent and calcium loop (1.17 Mt/a, 15 MPa)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 251 000 t/h of air at 20 C and 64 % RH, 74.5 % of its CO2 captured (112.2 t/h), gas-fired oxy calciner, grid power, 7884 h/a", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: AIR, title: Ambient air, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: KOHF, title: "Potassium hydroxide make-up (as 100 % KOH)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: SEED, title: "Calcium carbonate seed make-up (ground limestone)", category: raw_material, ports: [{id: out, direction: out}]}
  - id: PW
    title: Process water (pellet wash, slaker, lime slurry)
    category: raw_material
    ports: [{id: r201, direction: out}, {id: slaker, direction: out}, {id: lime, direction: out}]
  - {id: NG, title: "Natural gas to the calciner (as methane)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: OXY, title: "Oxygen 95.6 wt% from an air separation unit", category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power (grid)
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: c101, direction: out, kind: energy}
      - {id: r201, direction: out, kind: energy}
      - {id: sl301, direction: out, kind: energy}
      - {id: k501, direction: out, kind: energy}
products:
  - {id: CO2P, title: "CO2 product, dense phase at 15.1 MPa, to pipeline", category: product, ports: [{id: in, direction: in}]}
  - {id: AIROUT, title: CO2-depleted air from the contactors to atmosphere, category: off_gas, ports: [{id: in, direction: in}]}
  - {id: PURGE, title: "Filter cake purge (the seed's CaCO3 with lean liquor) to disposal", category: solid_waste, ports: [{id: in, direction: in}]}
  - {id: COND, title: Condensate from the CO2 compression and drying, category: wastewater, ports: [{id: in, direction: in}]}
  - {id: BLEED, title: "Liquor bleed (KOH and K2CO3 solution) to treatment", category: wastewater, ports: [{id: in, direction: in}]}
  - id: AMBIENT
    title: "Heat not used in the plant: the calciner's beyond the calcination and the slaker's surplus (lumped)"
    category: utility
    utility: {kind: other}
    ports:
      - {id: f401, direction: in, kind: energy}
      - {id: sl301, direction: in, kind: energy}

blocks:
  - id: CAP
    title: Air contactors
    class: Absorbing
    ports:
      - {id: air, direction: in}
      - {id: koh, direction: in}
      - {id: lean, direction: in}
      - {id: air_out, direction: out}
      - {id: rich, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: heat, direction: in, kind: energy}
  - id: CAUS
    title: Pellet reactors and lime slurry
    class: ReactingChemicals
    ports:
      - {id: rich, direction: in}
      - {id: seed, direction: in}
      - {id: water, direction: in}
      - {id: limew, direction: in}
      - {id: lime, direction: in}
      - {id: lean, direction: out}
      - {id: pellets, direction: out}
      - {id: purge, direction: out}
      - {id: bleed, direction: out}
      - {id: power, direction: in, kind: energy}
  - id: REG
    title: Steam slaker and oxy-fired calciner
    class: ReactingChemicals
    ports:
      - {id: pellets, direction: in}
      - {id: water, direction: in}
      - {id: ng, direction: in}
      - {id: o2, direction: in}
      - {id: lime, direction: out}
      - {id: offgas, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: heat, direction: out, kind: energy}
      - {id: slheat, direction: out, kind: energy}
  - id: CO2C
    title: CO2 compression and drying
    class: Compressing
    ports:
      - {id: in, direction: in}
      - {id: prod, direction: out}
      - {id: cond, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}

steps:
  - id: C101
    block: CAP
    title: Cross-flow air contactors with KOH liquor
    class: Absorbing
    reactions: [ABS]
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: air, direction: in, delegates: air}
      - {id: koh, direction: in, delegates: koh}
      - {id: lean, direction: in, delegates: lean}
      - {id: air_out, direction: out, delegates: air_out}
      - {id: rich, direction: out, delegates: rich}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: heat, direction: in, kind: energy, delegates: heat}
  - id: R201
    block: CAUS
    title: Pellet reactors, fines filters and pellet washers
    class: ReactingChemicals
    reactions: [SLAKE, CAUST]
    conversion: {SLAKE: 1.0}
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: rich, direction: in, delegates: rich}
      - {id: lime, direction: in}
      - {id: seed, direction: in, delegates: seed}
      - {id: water, direction: in, delegates: water}
      - {id: lean, direction: out, delegates: lean}
      - {id: pellets, direction: out, delegates: pellets}
      - {id: purge, direction: out, delegates: purge}
      - {id: bleed, direction: out, delegates: bleed}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M302
    block: CAUS
    title: Lime mix tank (30 wt% slurry)
    class: Mixing
    links: [{target: equipment, ref: TK-302}]
    ports:
      - {id: lime, direction: in, delegates: lime}
      - {id: water, direction: in, delegates: limew}
      - {id: out, direction: out}
  - id: SL301
    block: REG
    title: Steam slaker (pellets dried, lime slaked)
    class: ReactingChemicals
    reactions: [SLAKE]
    links: [{target: equipment, ref: SL-301}]
    ports:
      - {id: pellets, direction: in, delegates: pellets}
      - {id: cao, direction: in}
      - {id: water, direction: in, delegates: water}
      - {id: dried, direction: out}
      - {id: lime, direction: out, delegates: lime}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: heat, direction: out, kind: energy, delegates: slheat}
  - id: F401
    block: REG
    title: Oxy-fired circulating fluidised bed calciner
    class: HeatingInFurnace
    reactions: [CALC, COMB]
    links: [{target: equipment, ref: F-401}]
    ports:
      - {id: pellets, direction: in}
      - {id: ng, direction: in, delegates: ng}
      - {id: o2, direction: in, delegates: o2}
      - {id: lime, direction: out}
      - {id: offgas, direction: out, delegates: offgas}
      - {id: heat, direction: out, kind: energy, delegates: heat}
  - id: K501
    block: CO2C
    title: CO2 cooling, compression to 15 MPa and glycol drying
    class: Compressing
    links: [{target: equipment, ref: K-501}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: prod, direction: out, delegates: prod}
      - {id: cond, direction: out, delegates: cond}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: cw, direction: out, kind: energy, delegates: cw}

streams:
  - id: S1
    title: Ambient air to the contactors
    from: AIR.out
    to: C101.air
    template: air
    state:
      design:
        temperature: {value: 293.15, provenance: assumed, source: "design basis: 20 C (SRC-1 Fig. 2 and p. 1581, D-002)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis, ASSUMED"}
        flow: {value: 251000000.0, provenance: assumed, source: "scripts/dac_balance.py: D-002: ambient air through the contactors, 251 000 t/h with 0.060 wt% CO2 (SRC-1 Fig. 2; about 395 ppm by volume)"}
        composition: {basis: mass_fraction, values: {CO2: 0.0006, N2: 0.7596, O2: 0.23, H2O: 0.0098}, provenance: assumed, source: "scripts/dac_balance.py: D-002: ambient air through the contactors, 251 000 t/h with 0.060 wt% CO2 (SRC-1 Fig. 2; about 395 ppm by volume)"}
  - id: S3
    title: Potassium hydroxide make-up
    from: KOHF.out
