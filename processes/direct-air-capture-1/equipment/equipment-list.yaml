# The equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps,
# with first counts and sizes from SRC-1 (Keith et al. 2018) and SRC-2 (NETL 2022) scaled to
# this plant's 112.2 t/h of CO2 captured (DESIGN.md D-010). Design pressures, temperatures and
# materials are not set yet (basic engineering). Values not from a source are ASSUMED.
schema: cheme/equipment/v1
equipment:
  - {tag: C-101, type: Column, service: "Cross-flow air contactors: aqueous KOH over structured plastic packing, 7 m air travel at 1.4 m/s, fans and basin pumps",
     notes: "Modular cooling-tower type units (SRC-1 p. 1576 and Table 1: 1.4 m/s, 7 m packing depth, 210 m2/m3, 9.7 Pa/m, 22 t-CO2 per m2 of inlet area per year at 400 ppm). Inlet area about 112.2 t/h x 7884 h / 22 t/(m2 a) = 40 200 m2, ASSUMED at the same utilisation; SRC-2 (section 5.2, account 15) lists 277 units for 122 t/h. Liquor recirculated in the basins and pulsed over the packing (SRC-1 p. 1577); fans 61 and pumps 21 kWh/t (P1); exchangers in the basins cool the CO2 train's closed cooling-water circuit (Q1, D-003, D-009). Fibre-reinforced plastic and polymer packing (SRC-2 section 4.1), D-010."}
  - {tag: R-201, type: Vessel, service: "Pellet reactors (fluidised-bed reactive crystallisers), fines filters and pellet washers",
     notes: "SRC-1 Table 1: 1.65 cm/s upflow, 4.5 m bed, calcium loading 20 kg Ca per m2 h, pellets above 0.85 mm screened off; bed area about 2540 kmol/h x 40.08 kg/kmol / 20 = 5 090 m2, ASSUMED by that loading. SRC-2 lists 178 reactors of 22 t/d of CO2 each, pinned-bed clarifiers and two filter presses. Fluidisation pumping 27 kWh/t (P2). Concrete reactors with conical feed sections (SRC-1 p. 1579), D-010."}
  - {tag: TK-302, type: Tank, service: "Lime mix tank: slaked lime slurried to 30 wt% Ca(OH)2",
     notes: "About 1 h residence on 533 t/h of slurry, about 450 m3 in two agitated tanks (SRC-2 lists two lime mix tanks of 1 h residence), ASSUMED, D-010."}
  - {tag: SL-301, type: Vessel, service: "Steam slaker: refractory-lined bubbling/turbulent fluidised bed at 300 C, dries the pellets and slakes the hot CaO",
     notes: "Fluidised by recirculating steam at about 1 m/s (SRC-1 p. 1580); 85 % slaking; dust collector for the fine slaked lime; SRC-2 lists two slakers of 850 m3. Blowers and conveying 32 kWh/t (P3); SRC-1's power from the slaking heat (77 kWh/t) needs a steam cycle not included here (D-006)."}
  - {tag: F-401, type: Furnace, service: "Oxy-fired circulating fluidised bed calciner at 900 C with preheat cyclones and oxygen preheat",
     notes: "Natural gas fired in 95.6 wt% oxygen, about 11.7 t/h of CH4 (587 GJ/h LHV, 5.25 GJ/t of CO2 calcined, SRC-1 p. 1580); bed bulk density 710 kg/m3, 0.25 to 2.5 m/s (SRC-1 Table 1); refractory-lined steel vessels (SRC-2 section 4.4); SRC-2 lists two units for 154 t/h of CaCO3. Off-gas heat recovered to the pellets, the oxygen and steam (not modelled, D-007)."}
  - {tag: K-501, type: Compressor, service: "CO2 compressor 0.1 to 15.1 MPa, four stages with intercoolers and knock-out, triethylene glycol dryer before the last stage",
     notes: "About 19.0 MW (132 kWh per t of CO2, SRC-1 Table 1), centrifugal (SRC-1 p. 1581; SRC-2 names a reciprocating unit); intercoolers and aftercooler on a closed cooling-water circuit cooled in the contactor basins, about 38.7 MW with the knock-out (Q1, hand estimate, D-009); glycol dryer to 0.01 wt% water, D-008."}
