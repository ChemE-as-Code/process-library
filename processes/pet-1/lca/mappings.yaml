# pet-1's own exchange overrides for the Atlas LCI build (ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Terephthalic acid links the Atlas producer
# terephthalic-acid-1 explicitly. Isophthalic acid stays a reported gap: the shared vocabulary has
# no entry, and no Atlas process makes it.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:ethylene-glycol": {dataset: {path: processes/ethylene-glycol-1/lca/dataset.yaml, product: "product:MEG"}, source: "the Atlas producer ethylene-glycol-1, MEG of 99.90 wt% from EO hydration (fibre grade aimed at, its design basis), the glycol this feed names"}
  "feed:natural-gas":
    atlas: false
    source: "Pipeline natural gas: the only Atlas producer of the slug methane is hda-1's fuel gas, which is not natural gas (as styrene-1)."
  "feed:terephthalic-acid": {dataset: {path: processes/terephthalic-acid-1/lca/datasets/pta-px-air-oxidation.yaml, product: "product:terephthalic-acid"}, source: "the Atlas producer terephthalic-acid-1, purified terephthalic acid by p-xylene air oxidation, the PTA this feed names"}
