# Tier 1 form, process-library#313 pilot without a flowsheet. Every amount is the formula of its parameters;
# core's validator re-checks each. Written from the POL BREF (2007) and NAPCOR (2020) (facts in our own form).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: pet-pta-continuous-ssp
title: Polyethylene terephthalate by continuous PTA esterification, melt polycondensation and SSP
description: Per 1 t of bottle-grade PET resin, gate-to-gate. Feeds from stoichiometry with sourced losses
  (POL BREF ranges); electricity, natural gas and water from a US industry average of 2015 (NAPCOR 2020); air
  emissions, wastes and effluent COD from the POL BREF.
basis: 1000 kg of PET resin
boundary: 'gate-to-gate: paste preparation, esterification, prepolycondensation, melt polycondensation, chip
  cutting, crystallisation and solid-state polycondensation, glycol recovery, heat-transfer-medium heaters;
  PTA, MEG and power from outside'
technology: continuous direct esterification of PTA with MEG and continuous melt polycondensation with antimony
  catalyst, then continuous solid-state polycondensation; the DMT routes and batch units are not modelled
geography:
  description: 'Mixed: US plants of 2015 for energy and water, EU plants of the POL BREF data collection for
    losses and emissions; no single site.'
classification:
  isic: '2013'
system_boundary:
  included:
  - PTA, isophthalic acid and MEG, with the polymer waste and the glycol losses
  - electricity, natural gas fired for the heat-transfer medium and its CO2 and water
  - consumed water
  - reaction water and effluent organics to wastewater treatment
  - polymer, other and hazardous waste
  - catalyst and phosphorus stabiliser
  - acetaldehyde and ethylene glycol to air
  excluded:
  - 'TODO nitrogen for SSP gas loops and chip blanketing: not quantified in either source'
  - 'TODO diethylene glycol formed in the melt and other comonomers or additives (toners, cobalt): the model
    takes the repeat unit of the homopolymer'
  - 'TODO VOC other than acetaldehyde and glycol (POL BREF Table 10.4: up to 1.2 kg/t for the TPA process,
    5 g/t with catalytic oxidation; its overlap with acetaldehyde is not stated) and HTM losses (none given
    for the TPA process)'
  - 'TODO NOx and CO of the heaters: not stated in either source'
  - 'TODO coal (0.87 kg/t), diesel and residual oil of NAPCOR Table 36: fuel use not stated'
  - TODO steam-ejector condensate and other effluent water; antimony and other metals in the effluent
  - TODO the fate of the consumed water (mostly evaporation), not inventoried
  - 'energy credit from waste-to-energy (16 MJ/t in NAPCOR Table 36): not credited in the cut-off model'
  - transport, storage emissions
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: included
  non_routine: excluded
location: GLO
year: 2015
valid_until: 2020
time:
  start: 2004
  description: 'Energy and water: US plants in 2015 (NAPCOR 2020). Losses and emissions: the POL BREF data
    collection (BREF of 2007, technical working group comments of 2004 and 2005). valid_until is the reference
    year + 5 (system-model section 6), so it has already lapsed.'
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation (polymer waste is a waste)'
uuid: e3cdff86-dd7f-554d-8162-5db5885f3ea6
version: 0.1.0
methodology_version: 1.0.0
system_model: cutoff
technology_level: current
review: unreviewed
rights: CC-BY-4.0
data_generator: ChemE-as-Code process library
