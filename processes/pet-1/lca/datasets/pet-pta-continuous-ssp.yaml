- name: pw_m
  value: 9.07
  unit: kg
  description: 'Polymer waste per t of the continuous TPA melt-phase process: midpoint of 0.14 to 18 kg/t.'
  source: EU JRC (2007) Reference Document on Best Available Techniques in the Production of Polymers (POL
    BREF), August 2007, Table 10.4, p. 170 (TPA process column, range); the midpoint is our choice, and modelling
    the waste as PET of the product's composition is ASSUMED
- name: pw_s
  value: 0.667
  unit: kg
  description: 'Polymer waste per t of continuous solid-state post-condensation: the upper bound of ''up to
    667 g/t''.'
  source: EU JRC (2007) Reference Document on Best Available Techniques in the Production of Polymers (POL
    BREF), August 2007, Table 10.5, p. 171 (continuous post-condensation, upper bound); using the bound is
    our choice
- name: x_ipa
  value: 0.026034
  unit: kg/kg
  description: 'Isophthalic acid share of the diacids fed: 22.4 kg in 838 + 22.4 kg per t of resin.'
  source: Franklin Associates (2020) Cradle-to-resin life cycle analysis of polyethylene terephthalate resin,
    prepared for NAPCOR, revised 3.2.20, Table 36, p. 92 (US average of seven plants, 2015); the ratio is ours.
    Treating IPA units like TPA units in the polymer (same formula) is ASSUMED
- name: cod
  value: 9.0
  unit: kg
  description: 'COD of the effluent before treatment, per t: midpoint of 2 to 16 kg O2/t.'
  source: 'EU JRC (2007) Reference Document on Best Available Techniques in the Production of Polymers (POL
    BREF), August 2007, Table 10.4, p. 170 (TPA process column; COD before the waste water treatment plant);
    the midpoint is our choice. Reading all of it as ethylene glycol (2.5 mol O2 per mol) is ASSUMED: the source
    names no compounds. TODO acetaldehyde and 2-methyl-1,3-dioxolane in the effluent. For comparison, NAPCOR
    2020 Table 36 (p. 93) reports 0.57 kg/t of COD released to water, after treatment'
- name: cod_s
  value: 0.663
  unit: kg
  description: 'COD of the effluent of continuous solid-state post-condensation before treatment, per t: the
    upper bound of ''up to 663 g/t''.'
  source: 'EU JRC (2007) Reference Document on Best Available Techniques in the Production of Polymers (POL
    BREF), August 2007, Table 10.5, p. 171 (continuous post-condensation, upper bound); using the bound is our
    choice, as for pw_s. Reading it as ethylene glycol is ASSUMED, as for cod'
- name: e_ach
  value: 0.06
  unit: kg
  description: 'Acetaldehyde to air per t: the upper bound of ''up to 60 g/t''.'
  source: EU JRC (2007) Reference Document on Best Available Techniques in the Production of Polymers (POL
    BREF), August 2007, Table 10.4, p. 170 (TPA process column, upper bound); using the bound is our choice.
    Forming it from ethylene glycol (C2H6O2 -> C2H4O + H2O) is ASSUMED. NAPCOR 2020 Table 36 (p. 92) gives
    0.010 kg/t, as an order of magnitude only
- name: e_eg
  value: 0.01
  unit: kg
  description: 'Ethylene glycol to air per t: the upper bound of ''up to 10 g/t''.'
  source: EU JRC (2007) Reference Document on Best Available Techniques in the Production of Polymers (POL
    BREF), August 2007, Table 10.4, p. 170 (TPA process column, upper bound); using the bound is our choice.
    It is not a conservative value, since NAPCOR 2020 Table 36 (p. 92) reports 0.049 kg/t for the US plants
    (order of magnitude only)
- name: elec
  value: 230.0
  unit: kWh
  description: Grid electricity per t of PET resin, melt phase with SSP, MTR and Integrex plants together.
  source: Franklin Associates (2020) Cradle-to-resin life cycle analysis of polyethylene terephthalate resin,
    prepared for NAPCOR, revised 3.2.20, Table 36, p. 92 (process energy; US average of seven plants of three
    producers, 2015)
- name: ng_v
  value: 62.0
  unit: m3
  description: Natural gas per t of PET resin, as a gas volume.
  source: Franklin Associates (2020) Cradle-to-resin life cycle analysis of polyethylene terephthalate resin,
    prepared for NAPCOR, revised 3.2.20, Table 36, p. 92 (process energy, 993 ft3 per 1000 lb; the report's
    m3 per t). The report does not say what the gas is used for; firing it in the heat-transfer-medium heaters
    (and so its combustion products here) is our reading, ASSUMED
- name: rho_ng
  value: 0.6772
  unit: kg/m3
  description: Density of the natural gas, taken as methane, at 15.56 degC and 101.325 kPa (ideal gas, p M
    / (R T)).
  source: 'ASSUMED: the report states no reference state; the US standard of 60 degF is our reading, and natural
    gas as pure methane is ASSUMED (as styrene-1). TODO a stated composition'
- name: water
  value: 730.0
  unit: kg
  description: 'Water consumed per t of PET resin (withdrawn and not returned): 730 l at 1 kg/l.'
  source: Franklin Associates (2020) Cradle-to-resin life cycle analysis of polyethylene terephthalate resin,
    prepared for NAPCOR, revised 3.2.20, Table 36, p. 93 (water consumption); the density is ASSUMED. Its fate
    (mostly evaporation) is not inventoried
- name: cat
  value: 0.4425
  unit: kg
  description: 'Polycondensation catalyst per t (antimony compounds; the source also names catalysts without
    antimony): midpoint of 270 to 615 g/t.'
  source: EU JRC (2007) Reference Document on Best Available Techniques in the Production of Polymers (POL
    BREF), August 2007, Table 10.4, p. 170 (TPA process column, range) and section 10.2.1, p. 161 (antimony
    trioxide, triglycolate or triacetate; described there for the DMT process, and taking the same catalysts
    for the TPA process is our reading); the midpoint is our choice. It stays in the polymer. NAPCOR 2020
    Table 36 (p. 92) gives the catalyst metals only as orders of magnitude (antimony and titanium 0.10 kg/t,
    cobalt 0.010 kg/t)
- name: stab
  value: 0.05
  unit: kg
  description: 'Phosphorus stabiliser per t: midpoint of 0 to 100 g/t.'
  source: EU JRC (2007) Reference Document on Best Available Techniques in the Production of Polymers (POL
    BREF), August 2007, Table 10.4, p. 170 (TPA process column, range) and section 10.2.1, p. 161 (e.g. polyphosphoric
    acid; described there for the DMT process, its use in the TPA process is our reading); the midpoint is
    our choice
- name: ow
  value: 3.5
  unit: kg
  description: 'Other (non-polymer) waste per t: midpoint of 2 to 5 kg/t; composition not stated.'
  source: EU JRC (2007) Reference Document on Best Available Techniques in the Production of Polymers (POL
    BREF), August 2007, Table 10.4, p. 170 (TPA process column, range); the midpoint is our choice
- name: hw
  value: 0.00045
  unit: kg
  description: 'Hazardous waste per t: the upper bound of ''up to 0.45 g/t''.'
  source: EU JRC (2007) Reference Document on Best Available Techniques in the Production of Polymers (POL
    BREF), August 2007, Table 10.4, p. 170 (TPA process column, upper bound)
