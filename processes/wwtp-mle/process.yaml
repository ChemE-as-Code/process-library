schema: cheme-as-code/process/v1
id: wwtp-mle
title: MLE pre-denitrification wastewater waterline
summary: >
  A generic activated-sludge waterline with upstream denitrification, mixed-liquor
  recycle, and a secondary clarifier. The teaching case uses the EXPOsan ASM1
  CSTR configuration and the shared QSDsan worker.
families: [wastewater-treatment]
keywords: [MLE, ASM1, wastewater, denitrification, QSDsan, EXPOsan]
maturity: concept
repository: {url: "https://github.com/ChemE-as-Code/process-library", path: processes/wwtp-mle, access: public}
publication: {status: public, license: CC-BY-4.0}
lca: {source: none, notes: "Teaching waterline; no LCI dataset or environmental footprint is claimed."}
validation:
  status: unreviewed
  notes: "Software reproducibility checked locally. Site performance, steady state and whole-system nitrogen balance remain unverified."
chemistry:
  inputs:
    - {chemical: wastewater, role: feedstock, note: "ASM1 influent expressed on explicit COD, nitrogen and solids bases."}
  outputs:
    - {chemical: wastewater, role: main-product, note: "product:EFFLUENT treated effluent. No inventory key is declared because there is no LCI dataset."}
basis:
  capacity: "18446 m3/day example influent; 5999 m3 biological volume"
references:
  - {title: "EXPOsan 1.5.3: exposan/bsm1/system.py, ASM1 CSTR branch"}
  - {title: "US EPA Nutrient Control Design Manual", url: "https://www.epa.gov/sustainable-water-infrastructure/nutrient-control-design-manual"}
  - {title: "QSDsan: An integrated platform for quantitative sustainable design of sanitation and resource recovery systems", doi: "10.1039/d2ew00455k"}
