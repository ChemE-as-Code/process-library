# Process Atlas manifest of silicon-carbide-1. Schema: schemas/process.schema.json (cheme-as-code/process/v1).
# plant.yaml stays the engineering manifest; sheets and results are derived from the
# ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: silicon-carbide-1
title: Silicon carbide by the Acheson process (5000 kg/h crude SiC, concept)
summary: >-
  Crude crystalline silicon carbide from silica sand and petroleum coke in batch Acheson
  resistance furnaces: gas burn-off over the charge, ingot cooling, breaking and sorting with
  recycle of the unreacted mix, crushing. Electricity per kg, CO and SO2 explicit. Concept
  stage, assumed basis.
description: |
  Silica sand and green petroleum coke are mixed with the unreacted mix of earlier runs and
  piled around a graphite core in batch Acheson furnaces. Electric resistance heating drives
  SiO2 + 3 C -> SiC + 2 CO; the CO, the coke volatiles, the sulfur and escaping SiO burn partly
  with air over the charge and leave through the hood stack. After cooling, the ingot is broken
  and sorted into crude crystalline SiC, a metallurgical-grade fraction and unreacted mix, which
  is recycled with a small purge; the crude SiC is crushed and screened.

  All values are concept estimates from an independent sequential balance with assumed yields,
  grades and splits, cross-checked against the IPCC/EPA emission factors for silicon carbide.
  The furnace electricity is a labelled specific-energy basis (7.5 kWh/kg crude SiC, inside
  the published range for European plants), because cheme process furnace does not cover
  carbothermal SiC. See DESIGN.md for every assumption and gated step.
families: [inorganic-chemicals]
keywords: [silicon carbide, SiC, Acheson process, carborundum, carbothermal reduction, electric resistance furnace, petroleum coke, silica sand, abrasives, refractories, metallurgical SiC]
facets:
  feedstock_basis: [mineral, fossil, electricity]
  product_classes: [materials, chemicals]
  unit_operations: [reaction, comminution, separation]
  region: generic
# Honest claim: concept is the lowest level of the manifest; every design parameter is assumed.
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept BFD/PFD with closed mass, component and element balances (cheme validate, cheme
    process streams: 4 blocks, 7 steps, reactive balances by extents). All flows and
    compositions are specified values of an independent balance (scripts/sic_balance.py) on
    assumed yields, grades and splits; no furnace heat transfer, kinetics or SiO/CO gas-solid
    model is calculated. cheme process furnace supports limestone calcination only (core #387)
    and refuses carbothermal SiC, so the furnace electricity is a labelled specific-energy
    basis; no property package covers the solids or the hot furnace gas, so energy closure is
    a lumped script estimate. cheme maturity supports no calculation maturity level until the
    feeds, conversions and sorting split are given with sources; concept is the lowest level
    the manifest allows. The gate-to-gate LCI is preliminary, with every background unmapped:
    its climate value (about 2.0 kg CO2-eq per kg, with its interval) is the DIRECT furnace
    CO2 and CH4 only, NOT a carbon footprint; electricity (about 7.7 kWh/kg, the largest
    exchange), coke, sand and landfill are gaps, and fossil CO (0.41 kg/kg) is not
    characterised (about 0.64 kg CO2-eq/kg more if counted as oxidised to CO2). Not reviewed.
chemistry:
  inputs:
    - {chemical: silicon-dioxide, role: feedstock, note: "feed:SAND: silica sand, 1.56 kg/kg crude SiC"}
    - {chemical: petroleum-coke, role: feedstock, note: "feed:COKE: green petroleum coke, 1.09 kg/kg crude SiC"}
    - {chemical: air, role: feedstock, inventory_key: "feed:AIR", note: "Air drawn over the furnace for the gas burn-off"}
  outputs:
    - {chemical: silicon-carbide, role: main-product, inventory_key: "product:SIC", note: "Crushed crude crystalline SiC, 98 wt%"}
    - {chemical: silicon-carbide, role: co-product, inventory_key: "product:MET", note: "Metallurgical-grade SiC, 88 wt%"}
    - {chemical: carbon-dioxide, role: emission, inventory_key: "product:VENT", note: "Burnt furnace gas (fossil carbon of the coke), about 2.1 kg/kg crude SiC unallocated; with CO, CH4, SO2 and silica fume"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "Furnace transformers 7.5 kWh/kg crude SiC plus auxiliaries and crushing"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "Transformer and bus-bar cooling, 25/35 C (ASSUMED)"}
basis:
  capacity: "5000 kg/h crushed crude crystalline SiC, 40 kt/a (ASSUMED normalisation basis)"
  operating_hours_per_year: 8000
  location: generic (not chosen)
lca: {source: auto}
