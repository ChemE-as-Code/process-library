# Process Atlas manifest of glycerol-1. Schema: schemas/process.schema.json (cheme-as-code/process/v1).
# plant.yaml stays the engineering manifest; sheets and results are derived from the
# ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: glycerol-1
title: Refined glycerol (USP) from biodiesel crude glycerol (10 000 t/a, concept)
summary: >-
  Refining of the crude glycerol phase of a biodiesel plant to USP-grade glycerol (99.7 wt%):
  HCl acidulation, fatty-layer separation, neutralisation, methanol recovery, vacuum dewatering,
  vacuum distillation with salt removal and activated carbon bleaching. Concept stage, sourced
  feed, assumed separation parameters.
description: |
  The glycerol phase of a sodium-methylate catalysed biodiesel plant (about 60 wt% glycerol,
  29 wt% methanol, 8 wt% fatty matter and the catalyst; Thompson & He 2006) is acidulated with
  32 wt% hydrochloric acid: the catalyst becomes NaCl and methanol, the soaps split, and the
  freed fatty matter is decanted as a layer returned to the biodiesel plant. The glycerol phase
  is neutralised with caustic soda, the methanol is distilled off at atmospheric pressure and
  returned, and the remaining water is evaporated under vacuum. A vacuum still (1.5 kPa(a),
  448 K, live steam) distils the glycerol; the salt crystallises in the still residue and is
  separated by a centrifuge, the residue liquor (glycerol foots) leaves as waste. The
  distillate is bleached and deodorised with activated carbon and cooled.

  All separator splits and duties are concept estimates from an independent balance
  (scripts/glycerol_balance.py) on assumed design parameters; no phase equilibrium, salt
  solubility or enthalpy model is qualified for these mixtures in core. See DESIGN.md.
families: [bio-based-chemicals]   # no glycerol family in taxonomy/families.yaml
keywords: [glycerol, glycerine, crude glycerol, biodiesel by-product, USP glycerin, acidulation, methanol recovery, vacuum distillation, bleaching, activated carbon]
facets:
  feedstock_basis: [biogenic]
  product_classes: [chemicals]
  unit_operations: [reaction, decanting, distillation, evaporation, vacuum-distillation, centrifugation, adsorption]
  region: generic
# Honest claim: concept is the lowest level of the manifest; every separator parameter is assumed.
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept BFD/PFD with closed mass, component and element balances (cheme validate clean,
    cheme process streams: 5 blocks, 9 steps, reactive balances by extents). The crude glycerol
    composition is sourced (Thompson & He 2006); all separator outlets and duties are specified
    values of an independent balance on assumed parameters. No property package or
    electrolyte route covers glycerol-methanol-water-NaCl, so energy
    closure is not evaluable in core. cheme maturity: balanced level blocked by the specified
    separator values (no sourced model); sourced level blocked by assumed feed flows. The
    gate-to-gate LCI is preliminary, with every background unmapped. `cheme maturity` supports
    no level and warns cheme.maturity-claim-exceeds on the `maturity: concept` claim, the
    lowest value of the manifest; the warning stays until the feed flow basis is accepted as
    sourced (DESIGN.md section 6). Agent review reviews/2026-10-28-pfd-lci-review.md answered
    (PROGRESS.md); no human review.
# No inventory_key: an inventory key would link the exchange to the registry slug's background
# in the Atlas LCI build; this preliminary LCI leaves every background unmapped (D-013).
chemistry:
  inputs:
    - {chemical: crude-glycerol, role: feedstock, note: "feed:CRUDE, crude glycerol from the biodiesel plant, 1.54 kg/kg refined glycerol"}
    - {chemical: hydrogen-chloride, role: feedstock, note: "feed:HCLA, hydrochloric acid 32 wt%"}
    - {chemical: sodium-hydroxide, role: feedstock, note: "feed:NAOHS, caustic soda 50 wt%"}
    - {chemical: water, role: feedstock, note: "Water of the 32 wt% hydrochloric acid and the 50 wt% caustic soda. Activated carbon (feed:ACF) and the fatty layer co-product (product:FAL) have no registry entry yet"}
  outputs:
    - {chemical: glycerol, role: main-product, note: "product:GLYC, refined glycerol USP 99.7 wt% to storage"}
    - {chemical: methanol, role: co-product, note: "product:MEOHR, recovered methanol to the biodiesel plant, 0.539 kg/kg"}
    - {chemical: wastewater, role: waste, note: "product:WW, evaporator and vacuum intercondenser condensates (with the ejector motive steam) with about 0.7 wt% methanol and 1.7 wt% glycerol"}
  utilities:
    - {chemical: electricity, role: utility, note: "feed:POWER: pumps, agitators, liquid-ring vacuum pumps, salt centrifuge (50 kWh/t, ASSUMED)"}
    - {chemical: steam, role: utility, note: "feed:LPS (heat, kWh) and feed:LSTM (live steam, kg): LP steam 450 kPa(a); feed:MPS (heat, kWh) and feed:MSTM (ejector motive steam, kg): MP steam 1000 kPa(a); feed:HPS (heat, kWh): HP steam 3000 kPa(a)"}
    - {chemical: cooling-water, role: utility, note: "product:CW, 25/35 C (ASSUMED)"}
basis:
  capacity: "10 000 t/a refined glycerol, 1250 kg/h (ASSUMED normalisation basis)"
  operating_hours_per_year: 8000
  location: generic (not chosen)
lca: {source: auto}
