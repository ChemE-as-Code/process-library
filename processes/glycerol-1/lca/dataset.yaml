  source: 'D-013: three outputs leave for use: refined glycerol (the functional unit), recovered methanol
    and the fatty layer, both returned to the biodiesel plant. The recovered methanol is the biodiesel
    plant''s own excess reactant, which arrives in the crude and leaves unchanged, so it is treated as
    a return (share 0) and glycerol and the fatty layer share the burden by mass (review 2026-10-28-pfd-lci-review#5).
    Plain mass allocation (methanol as a co-product) and no allocation are reported side by side; economic
    allocation and substitution (avoided fatty feedstock) are open sensitivities. The unallocated dataset
    (lca/dataset.yaml) lets a later study choose.'
  deviation: 'D-013: the library hierarchy prefers subdivision or system expansion, then economic (price
    ratio) allocation. Subdivision is not possible (one acidulation serves all three outputs), substitution
    needs background datasets that are not linked at this stage and no sourced prices for refined glycerol
    and the fatty layer were collected in this run. Mass shares with the methanol as a return are a declared
    preliminary placeholder until prices are sourced and the crude-glycerol background is chosen.'
