allocation:
  coproducts:
  - GLYC
  - MEOHR
  - FAL
  source: 'D-013: three outputs leave for use: refined glycerol (the functional unit), recovered methanol
    and the fatty layer, both returned to the biodiesel plant. Mass allocation is the preliminary choice
    because it needs no price or property data; it charges about a third of the refinery''s burden to
    the methanol pass-through, so economic allocation and substitution (avoided methanol, avoided fatty
    feedstock) are open sensitivities. The unallocated dataset (lca/dataset.yaml) lets a later study choose.'
  deviation: 'D-013: the library hierarchy prefers subdivision or system expansion, then economic (price
    ratio) allocation. Subdivision is not possible (one acidulation serves all three outputs), substitution
    needs background datasets that are not linked at this stage and no sourced prices for refined glycerol,
    recovered methanol and the fatty layer were collected in this run. Mass allocation is a declared preliminary
    placeholder until prices are sourced.'
