# Components and templates of the process. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
#
# Crude glycerol refining (D-001). Lumps (D-004): the fatty matter of the crude glycerol
# (soaps, methyl esters, mono-, di- and triglycerides; the "fat" of Thompson & He 2006 Table 6)
# is carried as one component with the formula of methyl oleate; the residual catalyst as
# sodium methoxide, as charged (Thompson & He 2006 Table 1). Dissolved salts are carried as
# neutral NaCl, NaOH and HCl: an inventory basis, not a speciation (core #364).
# Molar masses from IUPAC 2021 standard atomic weights; CAS numbers from PubChem.
schema: cheme/process/v1
kind: materials
components:
  - {id: GLY, name: Glycerol, formula: C3H8O3, cas: 56-81-5, molar_mass: 92.094, normal_boiling_point: 563.0}
  - {id: MEOH, name: Methanol, formula: CH4O, cas: 67-56-1, molar_mass: 32.042, normal_boiling_point: 337.8}
  - {id: H2O, name: Water, formula: H2O, cas: 7732-18-5, molar_mass: 18.015, normal_boiling_point: 373.12}
  - {id: NAOME, name: Sodium methoxide (residual catalyst), formula: CH3NaO, cas: 124-41-4, molar_mass: 54.024}
  - {id: FAME, name: Fatty matter (lump with the formula of methyl oleate), formula: C19H36O2, cas: 112-62-9, molar_mass: 296.495}
  - {id: NAOH, name: Sodium hydroxide (dissolved), formula: NaOH, cas: 1310-73-2, molar_mass: 39.997}
  - {id: HCL, name: Hydrogen chloride (dissolved), formula: HCl, cas: 7647-01-0, molar_mass: 36.461}
  - {id: NACL, name: Sodium chloride (dissolved or crystals), formula: NaCl, cas: 7647-14-5, molar_mass: 58.443}
  - {id: AC, name: Activated carbon, formula: C, cas: 7440-44-0, molar_mass: 12.011, phase: solid}
templates:
  - id: glycerol
    title: Crude, intermediate and refined glycerol streams, reagents and residues
    components: [GLY, MEOH, H2O, NAOME, FAME, NAOH, HCL, NACL, AC]
# property_method is a placeholder: no benchmarked package covers glycerol, methanol, water,
# fatty matter or salts (D-012); `cheme process props --coverage` reports every stream as not
# covered.
property_method:
  adapter: thermo
  status: placeholder
