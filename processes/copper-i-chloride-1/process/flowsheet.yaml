# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Copper(I) chloride by the wet chlorination of copper in a sodium chloride brine (DESIGN.md
# D-001, after US 3 030 178 A, run as a batch), a batch plant: a brine of 300 g/L NaCl, made up
# from salt, water, a little hydrochloric acid and a share of the recycled mother liquor, is
# charged over copper (fresh copper and the heel kept from the previous batch) into the
# glass-lined R-101 and heated to 353 K; chlorine is dosed below the surface and absorbed (a
# semi-batch, reactor: semibatch), the copper(II) it forms is reduced by the excess copper, and
# the brine ends with about 129 g/L CuCl dissolved (103 g/kg, S11A); it is cooled to 308 K
# and drawn off through the strainer, the copper heel staying in R-101 for the next batch (the tear S6). In P-101 the
# liquor is diluted with seven volumes of deoxygenated water and CuCl precipitates (CR101, core's
# crystallizer with the brine's other solutes as spectators); the slurry is filtered in the
# agitated filter-dryer F-101, reslurry-washed with dilute hydrochloric acid, displacement-washed
# with ethanol and vacuum-dried at 333 K under nitrogen. A tenth of the mother liquor returns to
# the next brine (the tear S17); the rest, with the acid wash, goes to copper recovery and
# wastewater treatment; the spent ethanol and the dryer's condensate to solvent recovery.
# The flows are the year averages of the batch recipe (process/recipe.yaml, `cheme process
# recipe`, D-003).
# Where the values come from:
# - feeds, temperatures, pressures, ratios: design basis and D-002..D-008, ASSUMED; the feeds are
#   the sources' ratios scaled by hand to the product rate of S29 (every outlet scales with them);
# - R101: cheme's semi-batch model (the ASSUMED rate laws, D-005); CR101, W101: core's
#   crystallizer with the liquor's other solutes as spectators and a solubility measured_in the
#   mother liquor (core ADR 0056, D-006, D-007); SS101, F101..F103: specified separations, the
#   filters with a Ruth filtration time; D101: core's dryer to a residual moisture (core ADR 0057,
#   D-008); E101, E102: pass-through; SP101: a splitter; M100..M104, M201, M202: mixers (all
#   calculated by `cheme process propagate --fill`);
# - the recycles S6 (the copper heel) and S17 (the mother liquor to the next brine): declared
#   tears, converged by propagate (core ADR 0060, D-004);
# - the heat of R101 (Q2): written by `cheme process propagate --fill` from the model at its
#   `energy_port` (core ADR 0059, D-009);
# - the dryer's heat Q5: core's dryer model (`cheme process crystallizers`), compared at its port;
# - the other duties (Q1, Q3, Q6, Q7): hand arithmetic from the stream table, given as ASSUMED
#   with the arithmetic in the source (D-009): the heat-up and the cool-down of R-101's content,
#   the dryer's vapour condenser and the product's cooling in the dryer.
schema: cheme/process/v1
kind: flowsheet
title: Copper(I) chloride by semi-batch chlorination of copper in brine, dilution precipitation and filter-drying (300 t/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 300 t/a dried CuCl, year averages of the batches in 7920 h on a dedicated train (D-002, D-003)", default: true}
tolerance: {abs: 0.05, rel: 0.002}   # balances: |in - out| <= abs + rel * max(in, out), kg/h
# The two recycles (core ADR 0060, D-004): the copper heel S6, which stays in R-101 from one
# batch to the next, and the share of the mother liquor S17 that makes up the next brine. Each
# loop is torn once; Wegstein's method, the tolerance far tighter than the balances' so that the
# digits written are the fixed point's (as sodium-azide-1, D-006 there).
tears:
  - stream: S6
    initial: {flow: 20.65, unit: kg/h, basis: mass_fraction, composition: {CU: 0.9091, H2O: 0.0611, NACL: 0.0203, CUCL: 0.0094, CUCL2: 0.0001}}
  - stream: S17
    initial: {flow: 301.4, unit: kg/h, basis: mass_fraction, composition: {H2O: 0.96134, NACL: 0.03471, CUCL: 0.00377, HCL: 0.00006, CUCL2: 0.00012}}
convergence: {method: wegstein, max_iterations: 200, tolerance: {abs: 1.0e-6, rel: 1.0e-9}}

feeds:
  - {id: NACL, title: "Sodium chloride (vacuum salt, merchant)", category: raw_material, ports: [{id: out, direction: out}]}
  - id: PW
    title: Process water (brine make-up, dilution, acid wash)
    category: raw_material
    ports:
      - {id: m100, direction: out}
      - {id: cr101, direction: out}
      - {id: m102, direction: out}
  - id: HCLA
    title: Hydrochloric acid 33 wt% (hydrogen-chloride-1)
    category: raw_material
    ports:
      - {id: m100, direction: out}
      - {id: m102, direction: out}
  - {id: CU, title: "Copper (cathode granules or clean scrap, merchant)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: CL2, title: Chlorine gas (chlor-alkali-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: ETOH, title: Ethanol (ethanol-1), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: cr101, direction: out, kind: energy}
      - {id: d101, direction: out, kind: energy}
  - id: LPS
    title: LP steam 350 kPa(a) (R-101 heating, the dryer's hot-water circuit)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 350, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 412.0, provenance: given, source: "saturation at 350 kPa(a): 412.007 K (CoolProp's IAPWS water, DESIGN.md SRC-10)"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: e101, direction: out, kind: energy}
      - {id: d101, direction: out, kind: energy}
products:
  - {id: CUCL, title: Copper(I) chloride powder to packing (under nitrogen), category: product, ports: [{id: in, direction: in}]}
  - {id: ML, title: "Copper-bearing brine (mother liquor and acid wash) to copper recovery and wastewater treatment", category: wastewater, ports: [{id: in, direction: in}]}
  - {id: SE, title: "Spent ethanol (wash filtrate and dryer condensate) to solvent recovery", category: solid_waste, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: e102, direction: in, kind: energy}
      - {id: d101, direction: in, kind: energy}
  - id: CHW
    title: Chilled water return (285 K)
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 280.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 285.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: d101, direction: in, kind: energy}

blocks:
  - id: CHLOR
    title: Brine make-up (T-100) and chlorination over copper (R-101)
    class: ReactingChemicals
    ports:
      - {id: salt, direction: in}
      - {id: pw, direction: in}
      - {id: acid, direction: in}
      - {id: mlr, direction: in}
      - {id: cu, direction: in}
      - {id: cl2, direction: in}
      - {id: liquor, direction: out}
      - {id: fines, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: PREC
    title: Dilution precipitation (P-101)
    class: Crystallizing
    ports:
      - {id: liquor, direction: in}
      - {id: water, direction: in}
      - {id: slurry, direction: out}
      - {id: clear, direction: out}
      - {id: power, direction: in, kind: energy}
  - id: ISOL
    title: Filtration, washing and drying in the filter-dryer (F-101); liquor recycle and effluents
    class: SeparatingMechanically
    ports:
      - {id: in, direction: in}
      - {id: clear, direction: in}
      - {id: fines, direction: in}
      - {id: pw, direction: in}
      - {id: acid, direction: in}
      - {id: etoh, direction: in}
      - {id: product, direction: out}
      - {id: mlr, direction: out}
      - {id: ml, direction: out}
      - {id: se, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: chw, direction: out, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}

steps:
  - id: M100
    block: CHLOR
    title: "Brine make-up (T-100): salt dissolved in recycled mother liquor and water"
    class: Mixing
    links: [{target: equipment, ref: T-100}]
    ports:
      - {id: mlr, direction: in, delegates: mlr}
      - {id: salt, direction: in, delegates: salt}
      - {id: pw, direction: in, delegates: pw}
      - {id: acid, direction: in, delegates: acid}
      - {id: out, direction: out}
  - id: M101
    block: CHLOR
    title: R-101 charge (the brine over fresh copper and the heel)
    class: Mixing
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: brine, direction: in}
      - {id: cu, direction: in, delegates: cu}
      - {id: heel, direction: in}
      - {id: out, direction: out}
  - id: E101
    block: CHLOR
    title: Charge heated to 353 K (R-101 jacket)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: steam}
  - id: R101
    block: CHLOR
    title: Chlorinator (chlorine dosed into the brine over copper at 353 K)
    class: ReactingChemicals
    reactions: [CHL, COMP]
    reactor: semibatch
    batch:
      dosing: [{stream: S8, time: 10800, absorbed: 1.0}]
      time: 3600
      heat: isothermal
      provenance: assumed
      source: "chlorine dosed below the surface over 3 h and taken up whole by the hot brine over the copper bed (US 3 030 178 A: the chlorine fed below the surface of the copper column is absorbed; the 3 h set by R-101's jacket, D-003, D-005), then a 1 h post-reaction for the copper(II) to be reduced by the excess copper to about 0.5 % of the copper (US 4 582 579 A leaves 0.5-2 %; D-005)"
    energy_port: q
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: charge, direction: in}
      - {id: cl2, direction: in, delegates: cl2}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: cw}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E102
    block: CHLOR
    title: Liquor cooled to 308 K before the transfer (R-101 jacket)
    class: Cooling
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: cw2}
  - id: SS101
    block: CHLOR
    title: Strainer (the copper heel kept in R-101, the liquor drawn off)
    class: Filtering
    solid_separation:
      solid_recovery: 0.998
      cake_liquid: {value: 0.1, basis: per_kg_solid}
      outlets: {cake: heel, filtrate: liquor}
      provenance: assumed
      source: "R-101's bottom strainer keeps the copper granules as the next batch's heel, 0.2 % of the copper passing as fines, the heel wet with 0.1 kg of liquor per kg (D-004, D-005)"
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: heel, direction: out}
      - {id: liquor, direction: out}
  - id: SS102
    block: CHLOR
    title: Bag filter on the transfer line (copper fines)
    class: Filtering
    solid_separation:
      solid_recovery: 1.0
      cake_liquid: {value: 1.0, basis: per_kg_solid}
      outlets: {cake: fines, filtrate: liquor}
      provenance: assumed
      source: "a bag filter on the liquor's transfer line to P-101 takes the copper fines that pass R-101's strainer, wet with about their own mass of liquor; the bags are emptied into the copper-bearing effluent (to copper recovery) (D-004)"
    links: [{target: equipment, ref: X-101}]
    ports:
      - {id: in, direction: in}
      - {id: fines, direction: out, delegates: fines}
      - {id: liquor, direction: out, delegates: liquor}
  - id: CR101
    block: PREC
    title: Dilution precipitation (CuCl crystallises as the chloride is diluted)
    class: Crystallizing
    crystallizer:
      solute: CUCL
      solvent: H2O
      crystal: CUCL_S
      basis: solubility
      temperature: 299.33
      solubility:
        unit: kg/kg_liquor
        value: 0.003787
        measured_in: mother_liquor
        provenance: assumed
        source: "ASSUMED (D-006): 3.79 g per kg of liquor at the mother liquor's 0.621 mol/kg of chloride not bound to copper(I) (NaCl, HCl and 2 x CuCl2 per kg of water, S15), from a power law s = 1.0 g/L x (m / 0.282)^1.686 through two open points: about 1 g/L with 10 g/L (0.282 mol/L) of excess chloride at 20 C (US 4 308 239 A, description) and 0.4 mol/L (39.6 g/L) held dissolved in 2.0 mol/L NaCl with 0.5 mol/L HCl at 25 C (US 4 308 239 A, Table III), a lower bound; checked on its own basis at the R-101 liquor S11A (m = 5.71 mol/kg) the law gives 159 g per kg of liquor, against about 119-124 g/kg for the 155 g/L that US 3 030 178 A, Example 1, keeps dissolved at room temperature (at 1.25-1.3 kg/L, ASSUMED): it overpredicts by about 30 % at the brine's chloride level, outside its fit range, which CR101's liquor is inside; g/L read as g per kg of liquor; no temperature dependence (the liquor at 299.3 K)"
      spectators: [NACL, HCL, CUCL2, CL2]
      outlets: {slurry: out}
    links: [{target: equipment, ref: P-101}]
    ports:
      - {id: liquor, direction: in, delegates: liquor}
      - {id: water, direction: in, delegates: water}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: DC101
    block: PREC
    title: Settling and decanting (the clear mother liquor drawn off, the slurry thickened)
    class: SeparatingByGravity
    solid_separation:
      solid_recovery: 1.0
      cake_liquid: {value: 2.0, basis: per_kg_solid}
      outlets: {cake: thick, filtrate: clear}
      provenance: assumed
      source: "CuCl crystals (4.14 g/cm3) settle in P-101 within the hold; the clear liquor is drawn off down to a thickened slurry of 2 kg of liquor per kg of CuCl, which goes to F-101 (US 4 582 579 A siphons the supernatant off its precipitate; the fines that stay suspended are not modelled, D-006)"
    links: [{target: equipment, ref: P-101}]
    ports:
      - {id: in, direction: in}
      - {id: thick, direction: out, delegates: slurry}
      - {id: clear, direction: out, delegates: clear}
  - id: F101
    block: ISOL
    title: Filtration of the thickened slurry (filter-dryer)
    class: Filtering
    solid_separation:
      solid_recovery: 1.0
      cake_liquid: {value: 0.15, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "agitated filter-dryer, a dense crystalline cake with 0.15 kg of liquor per kg of CuCl; the fines that pass the cloth are not modelled (in the recycled share they redissolve in the next brine, whose R-101 liquor S11A holds about 129 g/L CuCl, 103 g/kg; D-007)"
      filtration:
        specific_cake_resistance: 3.0e+9
        medium_resistance: 1.0e+10
        pressure_difference: 200
        viscosity: 0.95
        filtrate_density: 1030
        provenance: assumed
        source: "ASSUMED (D-007): a free-filtering crystalline cake, a cloth medium, 200 kPa of nitrogen on the cake; the dilute brine near 299 K about water's viscosity (0.89 mPa s at 298 K, CoolProp's IAPWS water) raised for its 4 wt% NaCl"
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out}
  - id: SP101
    block: ISOL
    title: Mother liquor split (a share to the next brine)
    class: SplittingMaterial
    split: {mlr: 0.1}
    links: [{target: equipment, ref: T-102}]
    ports:
      - {id: in, direction: in, delegates: clear}
      - {id: mlr, direction: out, delegates: mlr}
      - {id: purge, direction: out}
  - id: M102
    block: ISOL
    title: Dilute hydrochloric acid for the wash (T-103)
    class: Mixing
    links: [{target: equipment, ref: T-103}]
    ports:
      - {id: pw, direction: in, delegates: pw}
      - {id: acid, direction: in, delegates: acid}
      - {id: out, direction: out}
  - id: W101
    block: ISOL
    title: Reslurry wash with dilute hydrochloric acid
    class: Crystallizing
    crystallizer:
      solute: CUCL
      solvent: H2O
      crystal: CUCL_S
      basis: solubility
      temperature: 298.68
      solubility:
        unit: kg/kg_liquor
        value: 0.000323
        measured_in: mother_liquor
        provenance: assumed
        source: "ASSUMED as CR101 (D-007): 0.32 g per kg of liquor at the wash liquor's 0.144 mol/kg of excess chloride (S23), the same power law taken below its lowest point (0.282 mol/L); pure water dissolves 0.047 g/L at 20 C (Wikipedia, Copper(I) chloride, citing the CRC Handbook, SRC-6)"
      spectators: [NACL, HCL, CUCL2, CL2]
      outlets: {slurry: out}
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: cake, direction: in}
      - {id: wash, direction: in}
      - {id: out, direction: out}
  - id: F102
    block: ISOL
    title: Filtration of the acid wash
    class: Filtering
    solid_separation:
      solid_recovery: 0.998
      cake_liquid: {value: 0.15, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "as F101 (D-007)"
      filtration:
        specific_cake_resistance: 3.0e+9
        medium_resistance: 1.0e+10
        pressure_difference: 200
        viscosity: 0.90
        filtrate_density: 1005
        provenance: assumed
        source: "as F101; the acid wash filtrate nearly water (D-007)"
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out}
  - id: M103
    block: ISOL
    title: Displacement wash with ethanol
    class: Mixing
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: cake, direction: in}
      - {id: etoh, direction: in, delegates: etoh}
      - {id: out, direction: out}
  - id: F103
    block: ISOL
    title: Ethanol wash drained
    class: Filtering
    solid_separation:
      solid_recovery: 0.999
      cake_liquid: {value: 0.10, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "the ethanol displaces the aqueous cake liquor; the drained cake keeps 0.1 kg of liquid per kg (D-007)"
      filtration:
        specific_cake_resistance: 3.0e+9
        medium_resistance: 1.0e+10
        pressure_difference: 200
        viscosity: 1.1
        filtrate_density: 850
        provenance: assumed
        source: "as F101; the wash filtrate ethanol with about a third of water (ethanol 1.07 mPa s at 298 K, an ethanol-water mixture higher, ASSUMED) (D-007)"
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out}
  - id: D101
    block: ISOL
    title: Vacuum drying at 333 K under nitrogen (filter-dryer)
    class: Drying
    dryer:
      volatiles: [H2O, ETOH, HCL]
      residual_moisture: {value: 0.002, basis: mass_fraction, provenance: assumed, source: "0.2 wt% volatiles in the dried product (D-008)"}
      temperature: 333.15
      energy:
        heat_capacity: 0.8
        latent_heat: {H2O: 2358.0, ETOH: 866.0, HCL: 443.0}
        vessel_heat_capacity: 2000
        efficiency: 0.7
        port: steam
        provenance: assumed
        source: "wet cake 0.8 kJ/(kg K) (CuCl 0.49 with 0.1 kg of ethanol and water per kg, ASSUMED); latent heats at 333 K: water 2358 kJ/kg (CoolProp's IAPWS water, SRC-10), ethanol 866 kJ/kg (39.9 kJ/mol, linear between chemicals 1.5.2's packaged CRC values of 42.32 kJ/mol at 298 K and 38.56 at 351.4 K, SRC-10), HCl 443 kJ/kg (16.15 kJ/mol at its boiling point, packaged CRC table); F-101's metal with its agitator, about 4 t of steel, 2000 kJ/K, heated each batch from the cake's 303.3 K; 70 % efficiency; hot water at 343 K, the product's temperature limit (D-008)"
      drying_rate: {value: 3.0, provenance: assumed, source: "ASSUMED mean rate of an agitated filter-dryer under vacuum at 333 K with hot water at 343 K (as p-toluenesulfonyl-chloride-1's paddle dryer at a like approach, D-008)"}
      cake_density: {value: 2400, provenance: assumed, source: "ASSUMED bulk density of the drained cake: CuCl 4.14 g/cm3 (chemicals 1.5.2, packaged CRC table) with 0.1 kg of liquid per kg and gas in the voids (D-008)"}
      outlets: {product: product, vapour: vapour}
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: product, direction: out, delegates: product}
      - {id: vapour, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: cond, direction: out, kind: energy, delegates: chw}
      - {id: cool, direction: out, kind: energy, delegates: cw}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M201
    block: ISOL
    title: Copper-bearing brine to copper recovery (T-104)
    class: Mixing
    links: [{target: equipment, ref: T-104}]
    ports:
      - {id: ml, direction: in}
      - {id: f101, direction: in}
      - {id: fines, direction: in, delegates: fines}
      - {id: wf, direction: in}
      - {id: out, direction: out, delegates: ml}
  - id: M202
    block: ISOL
    title: Spent ethanol to solvent recovery (T-105)
    class: Mixing
    links: [{target: equipment, ref: T-105}]
    ports:
      - {id: wf, direction: in}
      - {id: cond, direction: in}
      - {id: out, direction: out, delegates: se}

streams:
  - id: S1
    title: Sodium chloride
    from: NACL.out
    to: M100.salt
    template: brine
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "design basis"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 96.786, provenance: assumed, source: "the salt that brings the brine S4 to about 300 g/L NaCl (US 3 030 178 A, Example 1: a 300 g/L NaCl brine with 0.5 g/L HCl), 0.249 kg of NaCl per kg of NaCl and water, less the NaCl recycled with S17 (D-004)"}
        composition: {basis: mass_fraction, values: {NACL: 1.0}, provenance: assumed, source: "vacuum salt, dry, impurities not modelled (D-004)"}
  - id: S2
    title: Process water (brine make-up)
    from: PW.m100
    to: M100.pw
    template: brine
    state:
      design:
