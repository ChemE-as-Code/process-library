# Simulation specs of copper-i-chloride-1 (`cheme schema process-simulation`). The flowsheet is
# not solved in DWSIM: no property package covers the copper(I) chloro complexes in a sodium
# chloride brine, and a semi-batch is not coupled to DWSIM (core ADR 0050). Only the heat
# boundary is declared: the dilution precipitation CR101 (P-101) and the acid reslurry wash W101
# are core crystallizers (DESIGN.md D-006, D-007) without an energy: block: the heat of
# precipitation of CuCl from its chloro complexes is not known openly, so they have no utility
# energy port (adiabatic, DESIGN.md D-009).
schema: cheme/simulation/v1
kind: simulation
specs:
  CR101: {mode: adiabatic}
  W101: {mode: adiabatic}
