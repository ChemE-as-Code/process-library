# Goal and scope of the copper-i-chloride-1 LCI. Schema: `cheme schema lca`. Outputs:
# `cheme assess lca --inventory --write` and `--coverage` (lca/inventory.csv, gaps.csv,
# dataset.yaml, manifest.json); never edit those by hand.
#
# Preliminary gate-to-gate foreground inventory (DESIGN.md D-012): every exchange of the batch
# plant with its amount per kg of dried CuCl, from the flowsheet's year averages of the recipe
# (D-003). Per batch: multiply by 355.0 kg. The backgrounds are left unmapped (`missing:` with
# the activity each should connect to), except where lca/mappings.yaml links a library producer:
# a gap, never zero, and no values from licensed databases. The plant has no emission to air in
# the balance: the chlorine is absorbed whole in normal operation, and R-101's breathing vent
# goes through a caustic scrubber whose traces are not estimated (emission_exclusions).
schema: cheme/lca/v1
kind: lca
goal: >-
  Preliminary gate-to-gate life cycle inventory of copper(I) chloride made by the semi-batch
  chlorination of copper in a sodium chloride brine, precipitation by dilution with water,
  filtration, acid and ethanol washes and vacuum drying, at the concept stage: which raw
  materials, utilities and wastes the batch plant exchanges per kg of dried CuCl, as the
  foreground for a later cradle-to-gate study. No impact results: most backgrounds are not mapped
  yet, and copper, the main input, is a gap (D-012).
functional_unit: {product: CUCL, amount: 1, unit: kg, source: "1 kg of dried copper(I) chloride (modelled 99.8 wt% CuCl, an ASSUMED upper bound: no oxidation by air in the model, D-002) at the plant gate to packing under nitrogen, stream S29 (D-002, D-012)"}
# The boundary key stays cradle-to-gate so that the purchased inputs remain open gaps instead of
# being mapped free (the schema's gate-to-gate maps every feed free), as n-bromosuccinimide-1 does.
boundary: cradle-to-gate
case: design
year: 2026
location: GLO
technology: "Batch plant: chlorine dosed below the surface of a 300 g/L NaCl brine over excess copper at 353 K (semi-batch, the copper heel kept for the next batch), the liquor cooled and diluted with about 7 volumes of deoxygenated water, CuCl precipitated, settled, filtered, washed with dilute hydrochloric acid and ethanol and vacuum-dried at 333 K under nitrogen in an agitated filter-dryer; a tenth of the mother liquor to the next brine; 355.0 kg per batch, 846 batches a year on a dedicated train"
rights: "CC-BY-4.0: the ChemE-as-Code process library's own concept design (LICENSE-DATA)"
flows:
  # raw materials
  - key: feed:CU
    missing: "not mapped yet (D-012): no library process makes copper; connect to: copper cathode (electrorefined, grade A) or clean copper scrap, granulated; proxy recorded, not linked: copper cathode, global market (D-004, D-012)"
    source: "flowsheet stream S5 (D-004)"
  - key: feed:CL2
    missing: "linked to processes/chlor-alkali-1 (lca/mappings.yaml): dry chlorine gas from membrane chlor-alkali electrolysis"
    source: "flowsheet stream S8 (D-004)"
  - key: feed:NACL
    missing: "not mapped yet (D-012): no library process makes sodium chloride; connect to: sodium chloride, vacuum salt (evaporated from brine), dry; proxy recorded, not linked (D-004, D-012)"
    source: "flowsheet stream S1 (D-004)"
  - key: feed:HCLA
    missing: "linked to processes/hydrogen-chloride-1 (lca/mappings.yaml): hydrochloric acid 33 wt% from HCl synthesis and absorption, counted by mass of the acid"
    source: "flowsheet streams S3 (brine) and S19 (acid wash), D-004, D-007"
  - key: feed:ETOH
    missing: "linked to processes/ethanol-1 (lca/mappings.yaml): anhydrous ethanol from the direct hydration of ethylene"
    source: "flowsheet stream S24 (D-007)"
  - key: feed:PW
    missing: "not mapped yet (D-012); connect to: process water from the site water treatment (deionised)"
    source: "flowsheet streams S2 (brine make-up), S12 (dilution water) and S18 (acid wash), D-004, D-006, D-007"
  # utilities
  - key: feed:POWER
    missing: "not mapped yet (D-012); connect to: electricity, medium voltage, grid mix of the (undecided) site country"
    source: "flowsheet energy streams P1 (R-101 agitator, vent scrubber), P2 (P-101 agitator) and P3 (filter-dryer agitator, vacuum pump), D-009"
  - key: feed:LPS
    missing: "linked as heat from steam (lca/mappings.yaml); connect to: steam in the chemical industry, 350 kPa(a), from a natural-gas-fired site boiler (e.g. processes/utility-steam-ng-boiler), per kWh of condensing heat"
    source: "flowsheet energy streams Q1 (R-101 heat-up) and Q5 (the filter-dryer's hot-water circuit), D-009"
  - key: product:CW
    missing: "not mapped yet (D-012); connect to: heat rejected to a recirculating cooling-water system with cooling tower (processes/utility-cooling-tower), per kWh removed"
    source: "flowsheet energy streams Q2 (heat of chlorination, R101's model), Q3 (the liquor's cool-down in R-101) and Q7 (the product and F-101 cooled before the discharge), D-009"
  - key: product:CHW
    missing: "not mapped yet (D-012); connect to: chilled water at 280 K from an electric vapour-compression unit (e.g. processes/utility-chiller), per kWh of heat removed: compressor electricity at its COP, condenser cooling water"
    source: "flowsheet energy stream Q6 (the filter-dryer's vacuum condenser), D-009"
  # waste
  - key: product:ML
    treatment: {kind: waste, route: "copper recovery from a dilute copper-bearing brine (cementation on iron or neutralisation to a copper hydroxide/oxychloride sludge returned to a smelter), then the saline effluent to the site wastewater treatment (D-010)"}
    missing: "not mapped yet (D-012); connect to: treatment of a saline effluent with about 0.4 wt% dissolved copper (copper recovery, neutralisation, an industrial wastewater treatment plant, e.g. processes/utility-wwtp), per kg; the copper it recovers is not credited"
    source: "flowsheet stream S30: the decanted mother liquor's purge S16, F101's filtrate S33, the acid wash filtrate S23 and the bag filter's copper fines S34 (D-010)"
  - key: product:SE
    treatment: {kind: waste, route: "solvent recovery of an aqueous ethanol (about 78 wt% ethanol with the cake's water and salts) by distillation, or incineration with energy recovery (D-010)"}
    missing: "not mapped yet (D-012); connect to: distillation of a spent ethanol-water solvent, or treatment of spent solvent in a hazardous-waste incinerator, per kg"
    source: "flowsheet stream S31: the ethanol wash filtrate S27 and the dryer condensate S28 (D-010)"
# What the batch plant uses per batch and the flowsheet does not carry (library ADR 0035, core
# ADR 0053), converted with the recipe's batches per year (process/recipe.yaml): the nitrogen
# that inerts R-101, sparges the dilution water free of oxygen, presses F-101's filtrations,
# blankets the drying and breaks the vacuum (it leaves through R-101's vent scrubber or the vacuum
# pump to air: no burden, no disposal exchange), and the rinse of P-101 between batches with its
# water to the copper-bearing effluent. R-101 and F-101 are not rinsed with water: the heel stays
# in R-101, and F-101 is washed with the batch's ethanol.
consumables:
  - id: nitrogen
    title: Nitrogen for inerting R-101, sparging the dilution water, pressing and drying in F-101
    unit: kg
    per_batch: 66.0
    source: "about 53 Nm3 per batch x 1.2506 kg/Nm3, ASSUMED (D-012): R-101 purged with 3 volumes of its 5 m3 (15 Nm3), the 26 m3 of dilution water sparged with about 1 Nm3 per m3 (26 Nm3), F-101's 1 m3 brought to 300 kPa(a) for each of its three filtrations (9 Nm3), the dryer's vacuum broken and the discharge blanketed (3 Nm3)"
    missing: "linked to processes/asu-1 (lca/mappings.yaml): gaseous nitrogen to the battery limit"
  - id: rinse-water
    title: Rinse water of P-101 between batches
    unit: kg
    per_batch: 1000
    source: "1 rinse per batch (recipe operation clean of P-101) x 1 m3, ASSUMED (D-003, D-012)"
    missing: "not mapped yet (D-012); connect to: process water from the site water treatment"
    disposal:
      kind: waste
      route: "with the copper-bearing brine to copper recovery and wastewater treatment (D-010)"
      source: "rinse to the copper-bearing effluent (D-012)"
      missing: "not mapped yet (D-012); connect to: treatment of a copper-bearing saline effluent in an industrial wastewater treatment plant (e.g. processes/utility-wwtp), per kg"
operation:
  hours_per_year: 7920
  life_years: 20
  source: "design basis operating_hours_per_year 7920 (ASSUMED, the recipe's hours); 20 a service life ASSUMED"
emission_exclusions:
  - {id: vessel-vents, method: storage-tank, equipment: [R-101, P-101, T-100], reason: "No P&ID yet: R-101's breathing vent (the nitrogen of the purge and the gas the liquid displaces while it is charged and dosed) goes through the caustic vent scrubber T-201; no chlorine leaves in normal operation (it is absorbed whole, D-005), so its traces and the scrubber's caustic make-up are not estimated (D-011, D-012). P-101's and T-100's vents carry nitrogen and water vapour only."}
  - {id: tank-vents, method: storage-tank, equipment: [T-102, T-103, T-104], reason: "The aqueous tanks breathe air and water vapour only: no volatile component above a trace (the brines' HCl below 0.02 wt%), not estimated (D-010)."}
  - {id: ethanol-tank, method: storage-tank, equipment: [T-105], reason: "The spent ethanol tank is nitrogen-blanketed; its breathing losses, at an ASSUMED one tank volume (1 m3) of nitrogen leaving per batch saturated with ethanol at 298 K (7.9 kPa: 3.2 mol, about 0.15 kg a batch, 125 kg a year, 0.4 g per kg of product), are left out of the balance (D-010)."}
  - {id: dryer-vent, method: equipment-leaks, equipment: [F-101], reason: "CuCl dust and the ethanol the vacuum condenser does not hold in the vacuum pump's exhaust are not estimated (D-008, D-011): in the model the condenser holds all of the 27 kg of ethanol evaporated a batch, so the exhaust carries the nitrogen and other non-condensables the pump draws, saturated with ethanol at the condensate's 290 K; it goes to a safe place (a vent stack with a flame arrester or the site's VOC treatment, open input), not to the caustic scrubber."}
dataset:
  version: 0.1.0
  classification: {isic: "2011"}   # ISIC Rev.4 2011 Manufacture of basic chemicals
  modelling: {principle: attributional}
  geography: {description: "Generic chemical site with a chlorine supply, not chosen (GLO); one design case"}
  system_model: cutoff
  technology_level: current
  review: {type: none}
  data_generator: "ChemE-as-Code agent session (Claude Opus 5.5) for issue #143, unreviewed"
