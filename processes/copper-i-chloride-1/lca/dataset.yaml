id: copper-i-chloride-by-semi-batch-chlorination-of-copper-in-brine-dilution-precipitation-and-filter-drying-300-t-a
title: Copper(I) chloride by semi-batch chlorination of copper in brine, dilution precipitation and filter-drying
  (300 t/a)
description: Unallocated foreground LCI of Copper(I) chloride by semi-batch chlorination of copper in
  brine, dilution precipitation and filter-drying (300 t/a), case design, derived from the flowsheet by
  cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Batch plant: chlorine dosed below the surface of a 300 g/L NaCl brine over excess copper
  at 353 K (semi-batch, the copper heel kept for the next batch), the liquor cooled and diluted with about
  7 volumes of deoxygenated water, CuCl precipitated, settled, filtered, washed with dilute hydrochloric
  acid and ethanol and vacuum-dried at 333 K under nitrogen in an agitated filter-dryer; a tenth of the
  mother liquor to the next brine; 355.0 kg per batch, 846 batches a year on a dedicated train'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:vessel-vents
  title: storage-tank emissions of R-101, P-101, T-100
  direction: output
  reason: 'No P&ID yet: R-101''s breathing vent (the nitrogen of the purge and the gas the liquid displaces
    while it is charged and dosed) goes through the caustic vent scrubber T-201; no chlorine leaves in
    normal operation (it is absorbed whole, D-005), so its traces and the scrubber''s caustic make-up
    are not estimated (D-011, D-012). P-101''s and T-100''s vents carry nitrogen and water vapour only.'
- key: emission-excluded:tank-vents
  title: storage-tank emissions of T-102, T-103, T-104
  direction: output
  reason: 'The aqueous tanks breathe air and water vapour only: no volatile component above a trace (the
    brines'' HCl below 0.02 wt%), not estimated (D-010).'
- key: emission-excluded:ethanol-tank
  title: storage-tank emissions of T-105
  direction: output
  reason: 'The spent ethanol tank is nitrogen-blanketed; its breathing losses, at an ASSUMED one tank
    volume (1 m3) of nitrogen leaving per batch saturated with ethanol at 298 K (7.9 kPa: 3.2 mol, about
    0.15 kg a batch, 125 kg a year, 0.4 g per kg of product), are left out of the balance (D-010).'
- key: emission-excluded:dryer-vent
  title: equipment-leaks emissions of F-101
  direction: output
  reason: 'CuCl dust and the ethanol the vacuum condenser does not hold in the vacuum pump''s exhaust
    are not estimated (D-008, D-011): in the model the condenser holds all of the 27 kg of ethanol evaporated
    a batch, so the exhaust carries the nitrogen and other non-condensables the pump draws, saturated
    with ethanol at the condensate''s 290 K; it goes to a safe place (a vent stack with a flame arrester
    or the site''s VOC treatment, open input), not to the caustic scrubber.'
