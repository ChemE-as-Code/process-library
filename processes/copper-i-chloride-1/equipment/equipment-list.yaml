# Equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes per batch from the recipe (D-003) and the semi-batch model; design pressures,
# temperatures and materials are not set yet (basic engineering); materials named are usual
# choices for hot copper chloride brines with chlorine, to be confirmed (open input). All values
# ASSUMED.
schema: cheme/equipment/v1
equipment:
  - {tag: T-100, type: Tank, service: "Brine make-up: salt dissolved in the recycled mother liquor, water and a little hydrochloric acid",
     notes: "About 6 m3 (one batch's 4.0 t of brine, 3.4 m3, with margin; ASSUMED), agitated, rubber-lined or FRP; at ambient, the salt's heat of solution cools the brine to about 294.7 K (D-004, D-009)."}
  - {tag: R-101, type: StirredTankReactor, service: "Chlorinator: chlorine dosed below the surface of the brine over the copper heel at 353 K",
     notes: "5 m3 glass-lined steel (R10 preferred size, 73 % full with 3.64 m3 at the end of the dosing), as the recipe sizes it from R101's model (core ADR 0052); jacket on cooling water at 298/308 K (log-mean 303.3 K at 353 K) and LP steam, 10.6 m2 wetted at the charge, removes 158 kW against the model's peak 57.8 kW; chlorine through a dip pipe with a check valve and a nitrogen purge, its dosing over 3 h interlocked with the cooling, the agitator, a high temperature, the vent scrubber's circulation and a sign of accumulation (the reaction heat falling behind the dose, a low redox potential, chlorine in the vent; D-011); bottom strainer (SS101) keeping the copper heel, about 150 kg of copper; breathing vent to the caustic vent scrubber T-201 (D-003, D-005, D-011)."}
  - {tag: T-201, type: Column, service: "Caustic vent scrubber for R-101's breathing vent and the chlorine line's relief",
     notes: "Packed column with a circulating caustic liquor and a fan; in normal operation it takes only the nitrogen of the purge and the gas the liquid displaces, but it is sized for the whole chlorine feed, about 22.4 m3/h (54.7 kg/h) during the dosing, until the dosing trip closes the chlorine valve (ASSUMED 30 m3/h); the loss of its circulation or a low caustic strength trips the chlorine (D-011)."}
  - {tag: X-101, type: Filter, service: "Bag filter on R-101's liquor transfer line: copper fines",
     notes: "Duplex bag filter, about 0.3 kg of copper fines a batch (0.6 kg wet with liquor), emptied into the copper-bearing effluent (D-004)."}
  - {tag: P-101, type: StirredTankReactor, service: "Precipitator: the liquor run into about 7 volumes of deoxygenated water, CuCl precipitating, settling and the clear liquor decanted",
     notes: "40 m3 rubber-lined or FRP-lined steel (R10 preferred size, 71 % full with one batch's 28.5 m3 of slurry; the model's volume, D-003; core sizes no vessel for a crystallizer), agitator 7.5 kW, a nitrogen sparger for the dilution water and a decanting arm; adiabatic (D-006, D-009)."}
  - {tag: T-102, type: Tank, service: "Decanted mother liquor: a tenth to the next brine, the rest to copper recovery",
     notes: "About 32 m3 (one batch's 28.2 t of clear liquor with margin; ASSUMED), FRP (D-004, D-010)."}
  - {tag: T-103, type: Tank, service: "Dilute hydrochloric acid (0.1 mol/L) for the acid wash",
     notes: "About 1 m3 (one batch's 0.56 t; ASSUMED), FRP or PE (D-007)."}
  - {tag: F-101, type: Filter, service: "Agitated filter-dryer: filtration of the thickened slurry, reslurry wash with dilute HCl, ethanol displacement wash, vacuum drying at 333 K under nitrogen",
     notes: "1 m3 (R10 preferred size, 78 % full with the largest batch content, 0.78 m3, D 1.08 m) as the recipe sizes it (core ADR 0057); filtrations 0.54, 0.45 and 0.23 h by Ruth with ASSUMED cake data, under 200 kPa of nitrogen; drying 4.62 h at an ASSUMED 3 kg/(m2 h) on 2.5 m2 of jacket and heated agitator with hot water at 343 K (the product's limit, D-008); vacuum condenser on chilled water; Hastelloy C or glass-lined (wet chloride, HCl); 7.59 h per batch; handles 186 kg of ethanol a batch above its flash point (285 K): nitrogen-inerted with an oxygen analyser (below 5 vol%, ASSUMED), vacuum broken with nitrogen only, the vacuum pump's exhaust to a safe place, hazardous-area zone to be classified (D-003, D-007, D-008, D-011)."}
  - {tag: T-104, type: Tank, service: "Copper-bearing brine (the mother liquor's purge, the filtrates, the copper fines) to copper recovery and wastewater treatment",
     notes: "About 32 m3 (one batch's 26.6 t with margin; ASSUMED), FRP (D-010)."}
  - {tag: T-105, type: Tank, service: "Spent ethanol (the wash filtrate and the dryer's condensate) to solvent recovery",
     notes: "About 1 m3 (one batch's 0.24 t; ASSUMED), stainless steel, nitrogen-blanketed, flammable liquid (ethanol above its flash point of 285 K), earthed, hazardous-area zone to be classified (D-010, D-011)."}
