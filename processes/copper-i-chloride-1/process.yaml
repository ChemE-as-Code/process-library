# Honest claim: concept is the lowest level of the manifest. Capacity, kinetics, the solubility,
# filtration and drying are assumed (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept batch PFD with closed mass, component and element balances (cheme validate: 3 blocks,
    19 steps). Every material stream is calculated by cheme process propagate from the feeds: the
    semi-batch R101 from its ASSUMED rate laws with the chlorine as an absorbed dose (core ADR
    0054), the copper heel S6 and the recycled mother liquor S17 as tears converged by Wegstein's
    method (core ADR 0060), the precipitation CR101 and the acid wash W101 as crystallizers with
    spectators on an ASSUMED solubility measured_in the mother liquor (a power law through two
    open points), the strainer, the bag filter, the settler and the filters as specified splits,
    the dryer D101 to an ASSUMED residual moisture with its heat from cheme's dryer model. The
    feeds are sized by hand for 300 t/a (the outlets scale with them); R101's duty is written by
    its model (core ADR 0059), the other duties are hand arithmetic from the stream table, and
    every mixed temperature is the mix of its inlets. The recipe takes the dosing, post-reaction,
    heating, cooling, filtration and drying times from the models (cheme process recipe, no
    cheme.recipe-basis or cheme.recipe-jacket finding). Thermal screening (cheme process
    reactor-hazards): R101 dT_ad 36.9 K (core's, the chlorination alone; 45.8 K for the net
    reaction by hand), accumulation 0.63 %, MTSR 354.2 K against an MTT of 373.1 K; no criticality
    class without a TD24 from calorimetry (never estimated): classes 1, 2 or 5 are still possible.
    Core's MTSR takes each reaction alone; with the comproportionation's heat (the network, by
    hand) it is 354.4 K. At k/10 and k/100 the accumulation is 4.26 % and 28.1 %, core's MTSR 357.9
    and 363.5 K, the network's 359.8 and 372.1 K (within about 1 K of the MTT at k/100), and the
    copper(II) left after the post-reaction 24 % and 78 %: the dosing's stop on accumulation, the
    end point and the chlorine's breakthrough to the vent scrubber are the design findings (D-011). Preliminary gate-to-gate
    LCI with nitrogen and the rinse as per-batch consumables; chlorine, hydrochloric acid, ethanol
    and nitrogen linked to chlor-alkali-1, hydrogen-chloride-1, ethanol-1 and asu-1, copper and
    sodium chloride gaps with their proxies recorded. Not reviewed. Needs cheme-as-code 1.9.0.
