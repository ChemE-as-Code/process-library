    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "0.750 kWh/kg CuCl of LP steam: R-101's heat-up and the filter-dryer's hot-water circuit (cheme's dryer model, the vessel's heat each batch included)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "1.032 kWh/kg CuCl removed by cooling water: the heat of chlorination (R101's model), the liquor's cool-down to 308 K and the product's and F-101's cooling before the discharge"}
    - {chemical: chilled-water, role: utility, inventory_key: "product:CHW", note: "0.036 kWh/kg CuCl removed by chilled water at 280 K: the filter-dryer's vacuum condenser"}
