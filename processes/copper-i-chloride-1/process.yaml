    - {chemical: ethanol, role: feedstock, note: "feed:ETOH: anhydrous ethanol (ethanol-1) for the cake wash, 0.525 kg/kg CuCl"}
    - {chemical: water, role: feedstock, inventory_key: "feed:PW", note: "Brine make-up, dilution water and acid wash, 72.3 kg/kg CuCl"}
  outputs:
    - {chemical: copper-i-chloride, role: main-product, inventory_key: "product:CUCL", note: "Dried CuCl powder to packing under nitrogen; modelled 99.8 wt% CuCl, an ASSUMED upper bound (no oxidation by air in the model, D-002); the open specification (CN 1 696 062 A) is at least 98 wt%"}
    - {chemical: wastewater, role: waste, inventory_key: "product:ML", note: "Copper-bearing brine (the decanted mother liquor's purge, the filtrates, the copper fines), 75.0 kg/kg CuCl: 3.4 wt% NaCl, 0.37 wt% CuCl dissolved, 22.3 % of the copper fed (22.1 % dissolved), to copper recovery and wastewater treatment"}
