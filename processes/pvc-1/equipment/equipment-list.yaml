# The equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes from the recipe (D-003) and the models; design pressures and materials are usual
# choices for VCM service, to be confirmed in basic engineering. All values ASSUMED.
schema: cheme/equipment/v1
equipment:
  - {tag: R-101, type: StirredTankReactor, service: "Polymerisation autoclave (one of four, R-101 to R-104): charge, heat-up, polymerisation at 330.15 K to the pressure drop, short-stop, venting, drop, rinse",
     notes: "130 m3 (US 6 825 288 B2, Example 1), 87 % full with 112.6 m3 at the charge (cheme process recipe), stainless-clad steel, agitated; jacket and cooled baffles on chilled water (150 m2, U 620 W/(m2 K) ASSUMED, set to the 3889 kW the example's jacket and baffle remove at 80 % conversion) remove 3887 kW against the model's peak of 5438 kW; the model's peak falls at the start, before the example's reflux condenser comes in at 15 % conversion, so the reflux condenser does not close that gap: the peak is the zero-order rate's, above the example's largest heat removal (5.28 MW), and the warning stays open (D-005, D-008); later in the batch a reflux condenser takes 26 to 45 % of the heat (the example's Table 1; core's batch has none, L-3); relief set at 1700 kPa(a) (ASSUMED) to the VCM recovery, which sets the MTT 357.10 K (D-010); short-stop injection, emergency cooling, agitator on emergency power, controlled emergency vent (EU Polymers BREF 2007, BAT 9 of 13.4; D-010); the four autoclaves take the batches in turn (cycle 1.9145 h)."}
  - {tag: C-301, type: Column, service: "Continuous slurry stripper with live steam",
     notes: "Fed from the slurry tank T-301; live steam 3709 kg/h at 450 kPa(a) (S11); 99.995 % of the slurry's VCM overhead, below 1 g/t left in the resin (D-007); bottoms at about 368 K."}
  - {tag: T-301, type: Tank, service: "Unstripped slurry tank (buffer between the autoclaves and the stripper)",
     notes: "Agitated, vented to the gas holder T-401; holds about two batches (about 250 m3, ASSUMED, D-003)."}
  - {tag: E-301, type: HeatExchanger, service: "Stripper overhead condenser on cooling water",
     notes: "720.8 kW (Q5, by hand, D-007); the condensate to the wastewater stripper, the gas to T-401."}
  - {tag: T-401, type: Tank, service: "Gas holder buffering the vent gas of the autoclaves and the stripper",
     notes: "EU Polymers BREF 2007, 5.2.7: the batch venting fluctuates; kept free of oxygen (polyperoxides) (D-006, D-010)."}
  - {tag: K-401, type: Compressor, service: "VCM recovery compressor",
     notes: "2418 kg/h of VCM year average (S16), peaks while an autoclave vents; 303.4 kW (P2, an ASSUMED share of the plant's power, not a rating, D-008), rejected as heat in Q6 (D-006)."}
  - {tag: E-401, type: HeatExchanger, service: "VCM recovery condensers on cooling water and chilled water, water knock-out",
     notes: "560.7 kW (Q6, by hand, with the compressor's shaft power, D-006); 99.8 % of the VCM condensed and returned to the charge, the vent to the incinerator (D-006)."}
  - {tag: E-501, type: HeatExchanger, service: "Stripped slurry cooler on cooling water",
     notes: "1543.6 kW (Q4) from 368 to 333 K; a feed/bottoms exchanger against the stripper's feed would recover most of it (D-007)."}
  - {tag: CF-501, type: Centrifuge, service: "Decanter centrifuge: wet cake and centrate",
     notes: "21.8 t/h of resin, wet cake 0.30 kg water per kg resin (ASSUMED, D-009); 455.2 kW (P3)."}
  - {tag: DR-601, type: Dryer, service: "Fluid-bed dryer on LP steam with cyclones",
     notes: "6461 kg/h of water evaporated, 7786.9 kW of steam (Q3, core's dryer model, efficiency 0.55 ASSUMED); the resin at 338 K, below its 355 K glass transition; cyclones on the exhaust (BAT 6 of the EU Polymers BREF 2007, 13.4) (D-009)."}
  - {tag: T-701, type: Tank, service: "Process wastewater collection to the wastewater stripper",
     notes: "Centrate, stripper condensate and the recovery's water, 27.9 t/h; stripped of VCM before the site's treatment (EU Polymers BREF 2007, 5.2.8; D-009)."}
