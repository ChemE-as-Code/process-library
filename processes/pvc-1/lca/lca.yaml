# Goal and scope of the pvc-1 LCI. Schema: `cheme schema lca`. Outputs: `cheme assess lca
# --write` (lca/inventory.csv, gaps.csv, dataset.yaml, manifest.json, results); never edit those
# by hand.
#
# Preliminary gate-to-gate foreground inventory (DESIGN.md D-011): every exchange of the S-PVC
# plant with its amount per kg of resin, from the flowsheet's year averages of the recipe
# (D-003). Per batch: multiply by 41 794 kg. Linked in lca/mappings.yaml: the VCM to vcm-1, the
# demineralised water and the steam to the shared entries; the electricity, the cooling water
# and the wastewater go to the library defaults. The suspending agent, the initiator, the
# short-stop, the chilled water and the vent treatment are gaps with the activity each should
# connect to, and the dryer's VCM to air has no biosphere3 flow identity (not in
# lci/mappings.yaml biosphere): six gaps, never zero, and no values from licensed databases.
schema: cheme/lca/v1
kind: lca
goal: >-
  Preliminary gate-to-gate life cycle inventory of suspension PVC made by batch polymerisation
  of vinyl chloride in autoclaves with VCM recovery, steam stripping, centrifuge and fluid-bed
  drying, at the concept stage: which raw materials, utilities, wastes and emissions the plant
  exchanges per kg of resin, as the foreground for a cradle-to-gate study linked to the
  library's vcm-1. No impact results are claimed: several backgrounds are not mapped yet
  (D-011).
functional_unit: {product: PVCP, amount: 1, unit: kg, source: "1 kg of dried suspension PVC resin (0.3 wt% volatiles) at the plant gate to sieving and silos, stream S23 (D-009, D-011)"}
# The boundary key stays cradle-to-gate so that the purchased inputs remain open gaps instead of
# being mapped free (the schema's gate-to-gate maps every feed free), as oxalyl-chloride-1 does.
boundary: cradle-to-gate
case: design
year: 2026
location: GLO
technology: "Suspension PVC in four 130 m3 batch autoclaves: water, suspending agent, VCM and a peroxydicarbonate initiator charged, polymerised at 330 K to the pressure drop at 90 % conversion, short-stopped, the unreacted VCM vented to a compress-and-condense recovery and recycled; the slurry stripped continuously with live steam, centrifuged and dried in a fluid bed on LP steam; 41 794 kg per batch, 4179 batches a year"
rights: "CC-BY-4.0: the ChemE-as-Code process library's own concept design (LICENSE-DATA)"
system_model: cutoff
flows:
  # raw materials
  - key: feed:VCMF
    missing: "linked to processes/vcm-1 (lca/mappings.yaml): vinyl chloride monomer by the balanced EDC process"
    source: "flowsheet stream S1 (D-004)"
  - key: feed:DMW
    missing: "linked to the shared entry water (demineralised water), lca/mappings.yaml"
    source: "flowsheet streams S2 (the charge) and S25 (the autoclave rinse), D-004"
  - key: feed:PVAF
    missing: "not mapped yet (D-011); no library process makes it. Connect to: polyvinyl alcohol, partially hydrolysed (from polyvinyl acetate by alcoholysis), per kg; 0.53 g per kg of resin"
    source: "flowsheet stream S3 (D-004)"
  - key: feed:INITF
    missing: "not mapped yet (D-011); no library process makes it. Connect to: an organic peroxide (di(2-ethylhexyl) peroxydicarbonate from 2-ethylhexyl chloroformate, hydrogen peroxide and caustic soda), per kg; 0.54 g per kg of resin"
    source: "flowsheet stream S4 (D-004)"
  - key: feed:STOPF
    missing: "not mapped yet (D-011); no library process makes it. Connect to: a hindered-phenol antioxidant as a 30 % aqueous dispersion, per kg; 1.07 g of dispersion per kg of resin"
    source: "flowsheet stream S8 (D-004)"
  # utilities
  - key: feed:LSTM
    missing: "linked to the shared entry steam by mass (lca/mappings.yaml): live steam into the slurry, its condensate lost to the wastewater"
    source: "flowsheet stream S11 (D-007)"
  - key: feed:POWER
    missing: "the library default (electricity, medium voltage) of the undecided site's country"
    source: "flowsheet energy streams P1 to P4: 139 kWh per t of resin (EU Polymers BREF 2007, Table 5.10), D-008"
  - key: feed:LPS
    missing: "linked as heat from steam (lca/mappings.yaml); connect to: steam in the chemical industry, 450 kPa(a), from a natural-gas-fired site boiler (processes/utility-steam-ng-boiler), per kWh of condensing heat"
    source: "flowsheet energy streams Q1 (the charge and the autoclave's metal heated, by hand, D-003, L-6) and Q3 (the dryer, core's dryer model), D-008, D-009"
  - key: product:CW
    missing: "the library default: heat rejected to a recirculating cooling-water system with cooling tower (processes/utility-cooling-tower), per kWh removed"
    source: "flowsheet energy streams Q4 (slurry cooler) and Q5 (stripper condenser), D-007, D-009"
  - key: product:CHW
    missing: "not mapped yet (D-011); connect to: cold from an electric chiller at 283 K (processes/utility-chiller makes chilled water at 6 C), per kWh of heat removed: compressor electricity at its COP, condenser cooling water, refrigerant losses"
    source: "flowsheet energy streams Q2 (the polymerisation heat, from core's batch model; in the plant 26 to 45 % of it goes to the reflux condenser on cooling water, L-3) and Q6 (the recovery's condensers with the compressor's shaft power), D-006, D-008"
  # wastes and emissions
  - key: product:WW
    treatment: {kind: waste, route: "the site's wastewater stripper (VCM back to the recovery), flocculation of the PVC fines and biological treatment (EU Polymers BREF 2007, 5.2.8 and BAT 5 of 13.4)"}
    missing: "the library default (processes/utility-wwtp, or the shared wastewater entry), per kg (1 m3 = 1000 kg); its VCM (17 g per t of resin before the wastewater stripper), the fines and the suspending agent's COD are not characterised"
    source: "flowsheet stream S26 (D-009)"
  - key: product:VENT
    treatment: {kind: waste, route: "incineration of the recovery's vent (VCM traces) with HCl scrubbing and dioxin control (EU Polymers BREF 2007, 5.2.7 and BAT 7 of 13.4)"}
    missing: "not mapped yet (D-011); connect to: thermal oxidation of a chlorinated process vent with caustic scrubbing, per kg; 0.22 g of VCM per kg of resin"
    source: "flowsheet stream S19 (D-006)"
  - key: product:DRYEX
    emission: true
    source: "stream S24: the dryer's exhaust, water vapour with VCM traces, through cyclones to air (D-009)"
  - key: emission:H2O
    free: true
    source: "water vapour evaporated from the wet cake, to air"
  - key: emission:VCM
    elementary: {compartment: air, subcompartment: unspecified}
    source: "the VCM the dryer drives off the stripped resin, 0.16 g per t of resin (D-007, D-009); no biosphere3 flow identity for vinyl chloride to air in lci/mappings.yaml biosphere yet, a gap (D-011)"
operation:
  hours_per_year: 8000
  life_years: 20
  source: "design basis operating_hours_per_year 8000 (ASSUMED, the recipe's hours); 20 a service life ASSUMED"
emission_exclusions:
  - {id: fugitive-vcm, method: equipment-leaks, equipment: [R-101, T-301, T-401, K-401, C-301], reason: "No P&ID yet: the fugitive VCM of seals, connections and the gas holder is not estimated; the EU Polymers BREF 2007 associates 18 to 45 g of total VCM per t of S-PVC with BAT (Table 13.9), all sources included (D-011)."}
  - {id: tank-breathing, method: storage-tank, equipment: [T-301, T-401, T-701], reason: "The slurry tank and the wastewater tank vent to the gas holder, the gas holder to the recovery (EU Polymers BREF 2007, 5.2.7); their losses past the recovery are in the fugitive VCM, not estimated (D-011)."}
  - {id: autoclave-opening, method: storage-tank, equipment: [R-101], reason: "The VCM released when an autoclave is opened (closed-reactor practice: less than once in 100 batches, EU Polymers BREF 2007, 5.2.3.2) is not estimated (D-011)."}
  - {id: pvc-dust, method: equipment-leaks, equipment: [DR-601], reason: "The PVC dust leaving the dryer's cyclones (10 to 40 g/t associated with BAT, EU Polymers BREF 2007, Table 13.9) is not in the balance (D-009)."}
dataset:
  version: 0.1.0
  classification: {isic: "2013"}   # ISIC Rev.4 2013 Manufacture of plastics and synthetic rubber in primary forms
  modelling: {principle: attributional}
  geography: {description: "Generic site beside a VCM plant, not chosen (GLO); one design case"}
  system_model: cutoff
  technology_level: current
  review: {type: none}
  data_generator: "ChemE-as-Code agent session (Claude Opus 5.5) for issue #461, unreviewed"
