id: polyvinyl-chloride-by-batch-suspension-polymerisation-of-vinyl-chloride-with-vcm-recovery-steam-stripping-centrifuge-and-fluid-bed-drying
title: Polyvinyl chloride by batch suspension polymerisation of vinyl chloride with VCM recovery, steam
  stripping, centrifuge and fluid-bed drying
description: Unallocated foreground LCI of Polyvinyl chloride by batch suspension polymerisation of vinyl
  chloride with VCM recovery, steam stripping, centrifuge and fluid-bed drying, case design, derived from
  the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Suspension PVC in four 130 m3 batch autoclaves: water, suspending agent, VCM and a peroxydicarbonate
  initiator charged, polymerised at 330 K to the pressure drop at 90 % conversion, short-stopped, the
  unreacted VCM vented to a compress-and-condense recovery and recycled; the slurry stripped continuously
  with live steam, centrifuged and dried in a fluid bed on LP steam; 41 794 kg per batch, 4110 batches
  a year'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:fugitive-vcm
  title: equipment-leaks emissions of R-101, T-301, T-401, K-401, C-301
  direction: output
  reason: 'No P&ID yet: the fugitive VCM of seals, connections and the gas holder is not estimated; the
    EU Polymers BREF 2007 associates 18 to 45 g of total VCM per t of S-PVC with BAT (Table 13.9), all
    sources included (D-011).'
- key: emission-excluded:tank-breathing
  title: storage-tank emissions of T-301, T-401, T-701
  direction: output
  reason: The slurry tank and the wastewater tank vent to the gas holder, the gas holder to the recovery
    (EU Polymers BREF 2007, 5.2.7); their losses past the recovery are in the fugitive VCM, not estimated
    (D-011).
- key: emission-excluded:autoclave-opening
  title: storage-tank emissions of R-101
  direction: output
  reason: 'The VCM released when an autoclave is opened (closed-reactor practice: less than once in 100
    batches, EU Polymers BREF 2007, 5.2.3.2) is not estimated (D-011).'
- key: emission-excluded:pvc-dust
  title: equipment-leaks emissions of D-601
  direction: output
  reason: The PVC dust leaving the dryer's cyclones (10 to 40 g/t associated with BAT, EU Polymers BREF
    2007, Table 13.9) is not in the balance (D-009).
