# adipic-acid-1's own exchange overrides for the Atlas LCI build (ADR 0022), for both datasets.
# Schema: schemas/lci-process-mappings.schema.json. Cyclohexane stays a reported gap: the shared
# vocabulary has no entry and the library has no producer. The residue and dibasic-acid outputs
# stay gaps too: their treatment is not chosen.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:nitric-acid": {dataset: {path: processes/nitric-acid-1/lca/dataset.yaml, product: "product:ACID"}, source: "the Atlas producer nitric-acid-1, weak nitric acid 60 wt% counted by mass of the acid, the strength this feed is counted in"}
  "feed:steam": {use: steam-heat, source: "steam counted as heat delivered (kWh), as hda-1 and ethylbenzene-1 do"}
  "feed:fuel": {use: heat-natural-gas, source: "fuel counted as heat from natural gas (kWh), as hda-1's feed heater; natural gas ASSUMED"}
