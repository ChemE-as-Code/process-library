# Tier 1 form, a manifest-only entry as process-library#317. Every amount is the formula of its parameters;
# core's validator re-checks each. Written by hand from open sources (facts in our own form).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: adipic-acid-ka-nitric-catalytic-n2o-abatement
title: Adipic acid from cyclohexane via KA oil and nitric acid oxidation, catalytic N2O decomposition
description: Per 1 t of adipic acid, gate-to-gate from cyclohexane, with catalytic N2O decomposition at the
  IPCC default destruction and utilisation factors. Feeds from stoichiometry with sourced yields (US EPA 1991),
  energy from the IEA's Western European averages (2009, after a 1989 source), N2O from the IPCC 2006 defaults,
  other air emissions from AP-42 (1995).
basis: 1000 kg of adipic acid
boundary: 'gate-to-gate: cobalt-catalysed air oxidation of cyclohexane to KA (cyclohexanol and cyclohexanone)
  with cyclohexane recycle, nitric acid oxidation over copper-vanadium, NOx stripping and reabsorption, crystallisation,
  drying, catalytic N2O decomposition; nitric acid, steam, fuel and power from outside'
technology: 'continuous two-stage process: air oxidation of cyclohexane, then oxidation of KA with 50 to 60
  % nitric acid (EPA 1991, 3.2.2: 98 % of US output from cyclohexane in continuous operation)'
geography:
  description: 'Mixed: yields and air emissions of US plants (EPA 1991, AP-42 1995), Western European energy
    averages (IEA 2009), IPCC defaults; no single site. Located RER because all EU plants had N2O abatement
    by 2009 (Ecofys et al. 2009, section 6.1) and the energy is a Western European average.'
classification:
  isic: '2011'
system_boundary:
  included:
  - cyclohexane, nitric acid make-up, process air oxygen
  - electricity, steam, fuel
  - N2O after abatement, and the N2 and O2 of its decomposition
  - CO2, CO, NOx and organics to air; the KA-section off-gas burned
  - residue, dibasic acids, effluent
  excluded:
  - 'TODO N2 formed in the nitric acid oxidation (EPA 1991, 3.2.2.3, names N2 among the reduction products;
    not quantified in an open source): the nitric acid make-up is a lower bound'
  - 'TODO nitric acid, catalyst metals and organic acids in the effluent and the mother-liquor bleed (BREF
    2.1.2.3.3: recovered in part); not quantified'
  - 'TODO catalysts: cobalt (cyclohexane oxidation), copper and vanadium (nitric acid oxidation), and the metal-oxide
    N2O decomposition catalyst (replaced about twice a year, BREF 2.1.2.3.3); no open charge or make-up'
  - 'TODO wash and recrystallisation water, cooling water and the caustic wash of the KA (spent caustic): not
    quantified'
  - 'TODO adipic acid dust after the baghouses, 0.1 + 0.4 kg/t (AP-42 Table 6.2-2): no particle size, so no
    PM flow; left out of the balance'
  - 'TODO organics in the effluent: the BREF gives < 3 kg TOC/t after biological treatment, which belongs to
    the treatment activity'
  - 'TODO heat recovered from the reaction and the N2O decomposition (BREF: may raise steam): no credit in
    the cut-off model, so the steam is gross'
  - storage and handling emissions (carboxylic acids, odour), and the KA-section residue's own treatment (an
    output to treatment, not linked)
  - the phenol hydrogenation and borate-promoted routes to KA, and thermal destruction or recycle of N2O
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: RER
year: 2009
valid_until: 2014
time:
  start: 1989
  description: Energy of a 1989 source in a 2009 estimate; yields of 1991, emission factors of 1995, IPCC defaults
    of 2006. valid_until is the reference year + 5 (system-model section 6), so it has already lapsed.
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation. The dibasic acids, which some plants sell (AP-42 6.2.2),
    and the residue are outputs without a burden share; the cut-off model gives them no credit.'
