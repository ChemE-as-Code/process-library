# Components and templates of methanesulfonyl-chloride-1. Schema cheme/process/v1 (`cheme
# schema process-materials`). Every component has a stable id; molar_mass in kg/kmol (IUPAC 2021
# abridged standard atomic weights applied to the formula), normal_boiling_point in K at 101.325
# kPa. Sources are the register rows of DESIGN.md (SRC-n).
#
# The liquid data the semi-batch R101 and the stills need (DESIGN.md D-005, D-007):
# - liquid_molar_volume, m3/kmol, from the densities PubChem's HSDB records give (SRC-3):
#   methanesulfonyl chloride 1.4805 g/cm3 and methanesulfonic acid 1.4812 g/cm3, both at 18 C;
#   thionyl chloride 1.638 g/cm3 at 20 C (the CRC liquid density packaged in chemicals 1.5.2,
#   thermo 0.6.1's CRC_INORG_L_CONST, SRC-5); water 0.01807. Ideal mixing.
# - liquid_heat_capacity, kJ/(kmol K): thionyl chloride 121.0 and water 75.3 (the CRC standard
#   table packaged in chemicals 1.5.2, SRC-5); methanesulfonyl chloride 150 and methanesulfonic
#   acid 145, ASSUMED: no measured value was found (NIST WebBook and PubChem give none); 150 is
#   1.31 J/(g K), between acetyl chloride's 1.49 and sulfuryl chloride's 0.99 J/(g K), and 145 is
#   1.51 J/(g K), a little above sulfuric acid's 1.42 J/(g K) (all three from the same CRC table,
#   SRC-5) (D-005).
# - vapour_pressure (NIST form, log10(P/bar) = a - b/(T/K + c)) and heat_of_vaporization:
#   * thionyl chloride: NIST WebBook's Antoine line fitted to Stull (1947), 220.3-348.6 K, used
#     to 370 K in R-101 (at 368.15 K it gives 177 kPa, against 180 kPa from the normal boiling
#     point and CRC's 31.7 kJ/mol at it); heat of vaporization 32.4 kJ/mol at 272 K (NIST
#     WebBook, Dykyj et al.), at the forerun's condensing temperature (SRC-2, SRC-5);
#   * methanesulfonyl chloride: no Antoine line is published openly; a two-point
#     Clausius-Clapeyron line (c = 0) through PubChem's 62 C at 18 mmHg and 161 C at 730 mmHg
#     (SRC-3), ASSUMED; it gives 20.8 mmHg at 65 C against Organic Syntheses' 64-66 C at 20
#     mmHg (SRC-1) and 0.23 kPa at 20 C against the ICSC's 0.27 kPa (SRC-3). Its slope, 45.2
#     kJ/mol, is taken as the heat of vaporization at the stills' 345-365 K; HSDB's 349 kJ/kg
#     (40.0 kJ/mol, temperature not stated, SRC-3) is 12 % lower and would give a smaller
#     reboiler duty (D-007);
#   * methanesulfonic acid: a two-point line through PubChem's 167 C at 10 mmHg and 4.28e-4 mmHg
#     at 25 C (SRC-3), ASSUMED (0.02 kPa at 368 K, so it hardly volatilises); heat of
#     vaporization 73.9 kJ/mol at 410 K (NIST WebBook, Stephenson and Malanowski 1987, SRC-2).
# - ideal_gas: HCl, SO2, SOCl2 and water as `cheme chemistry thermo` prints them (chemicals
#   1.5.2: ATcT and CRC formation data, Poling's or thermo's TRCIG heat capacities, SRC-5); the
#   vent condenser cools the vented gas with them.
# The scrubber species (NaOH, NaCl, Na2SO3, sodium methanesulfonate) are molecular
# pseudo-components of the aqueous liquor (D-010); their heat capacities are the solids' (CRC
# table in chemicals 1.5.2), as other library entries take them, ASSUMED for the dissolved salt.
schema: cheme/process/v1
kind: materials
