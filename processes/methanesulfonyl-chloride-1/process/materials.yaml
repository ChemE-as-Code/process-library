  - {id: crude, title: "The reaction mass leaving R-101 (the vented gases at zero, D-005)", components: [SOCL2, MSA, MSCL, H2O, SO2, HCL]}
  - {id: liquor, title: "Caustic scrubber liquor (D-010)", components: [NAOH, H2O, NACL, NA2SO3, MSNA]}
  - {id: spent, title: "Spent scrubber liquor (the off-gas taken up whole, its components at zero, D-010)", components: [NAOH, H2O, NACL, NA2SO3, MSNA, HCL, SO2, SOCL2, MSCL]}
property_method:
