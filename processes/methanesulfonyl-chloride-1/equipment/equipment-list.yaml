# The equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps,
# with E-105 and the vacuum pump P-101, which the flowsheet does not draw. Sizes per batch from
# the recipe (D-003) and the models; design pressures, temperatures and materials are not set yet
# (basic engineering); materials named are usual choices for thionyl chloride, methanesulfonyl
# chloride and wet HCl/SO2, to be confirmed (open input). All values ASSUMED.
schema: cheme/equipment/v1
equipment:
  - {tag: T-101, type: Tank, service: "Thionyl chloride dose tank: fresh thionyl chloride with the recovered forerun",
     notes: "About 2 m3 (one batch's dose, 1.80 t, 1.1 m3), nitrogen-blanketed, vented to E-102; dosing pump or nitrogen-pressure transfer through a flow meter to R-101, interlocked as in D-014; kept dry (D-008)."}
  - {tag: R-101, type: StirredTankReactor, service: "Reactor: thionyl chloride dosed into methanesulfonic acid at 368 K over 4 h, SO2 and HCl vented through E-102 to A-101",
     notes: "1.6 m3 enamelled (glass-lined) steel (R10 preferred size, 69 % full with 1.10 m3 at the end of the dosing), as the recipe sizes it from R101's model (core ADR 0052); jacket on LP steam let down to 140 kPa(a) (382.44 K, below the 388.15 K limit for the product's heated wall, D-009): 3.48 m2 at the charge, 4.8 m2 full, U 300 W/(m2 K), 14.9 to 20.6 kW of heat into the batch at 368.15 K; the endothermic reaction with the dose's warming and the vapour's evaporation needs up to about 80 kW during the dosing, so the heating loop E-105 is part of R-101's heating (D-009, D-014); vent line to E-102 for 400 m3/h of gas at 368 K (hazard.vent_capacity, D-014): the normal peak 182.9 m3/h of SO2 and HCl at 1.1 h into the dosing, 322 m3/h with the liquid's vapour; dosing interlocked on R-101's temperature (permissive above about 360 K), on the steam's flow, on the off-gas flow through E-102 and on the scrubber's caustic flow (D-014); kept dry: no water rinse (D-003, D-011)."}
  - {tag: E-102, type: HeatExchanger, service: "R-101's vent condenser on brine: thionyl chloride and methanesulfonyl chloride vapour returned to R-101",
     notes: "Shell and tube or graphite block condenser on brine at 253/258 K, gas out at 263.15 K; Q2 16.0 kW year average from the model (core ADR 0062), 153 kWh a batch; at k/10 the refluxing thionyl chloride takes 3.6 times that per batch (D-011): sized with margin; loss of brine sends thionyl chloride vapour (178 kPa over the pure liquid at 368 K) to the scrubber: brine flow and gas outlet temperature alarms interlocked with the dosing (D-010)."}
  - {tag: E-105, type: HeatExchanger, service: "R-101's heating loop: the reaction mass pumped through an external heater on let-down LP steam",
     notes: "About 12 m2 (80 kW at U 500 W/(m2 K) and 14.3 K between the steam at 382.44 K and the batch at 368.15 K), silicon carbide or tantalum tubes, pump P-102 1.1 kW; added because R-101's jacket gives at most about 21 kW against the peak demand (D-009, D-014); not modelled as a separate step (its heat is part of R101's model duty Q1)."}
  - {tag: C-101, type: Vessel, service: "Batch still: the crude stripped of thionyl chloride, then the product distilled at 4 kPa(a)",
     notes: "About 2.5 m3 (one batch's 1.66 t of crude, 1.1 m3, with room to boil and flash on evacuation), enamelled steel, jacket on the let-down LP steam at 382.44 K for a 120 kW boil-up (the pot ends at 362 K, below Organic Syntheses' 115 C limit, D-007, D-009); not sized by core (its still has no vessel, L-4)."}
  - {tag: K-101, type: Column, service: "Packed column on the still: forerun at reflux ratio 1, product at 0.5",
     notes: "About 8 theoretical stages (the still included), glass-lined or PTFE-lined with ceramic packing; modelled with core's batch rectification (ADR 0061): forerun 78.6 wt% thionyl chloride recovering 99.8 % of it, product 99.95 wt% methanesulfonyl chloride (D-007, D-008)."}
  - {tag: E-103, type: HeatExchanger, service: "Forerun condenser on brine at 4 kPa(a)",
     notes: "Thionyl chloride condensing at about 270 to 280 K at 4 kPa(a), brine at 253/258 K; Q4 7.6 kW year average from the still's model, with the crude's flash as C-101 is evacuated, Q10 4.0 kW (L-4)."}
  - {tag: E-104, type: HeatExchanger, service: "Product condenser on cooling water at 4 kPa(a)",
     notes: "Methanesulfonyl chloride condensing at 346 K, 38 to 48 K above the cooling water; Q6 20.8 kW year average from the still's model, 120 kW while distilling."}
  - {tag: E-101, type: HeatExchanger, service: "Product cooler: distillate to 308 K on cooling water",
     notes: "Q7 1.7 kW year average (scripts/balance.py)."}
  - {tag: P-101, type: Pump, service: "Dry vacuum pump of the still, 4 kPa(a), discharge to A-101",
     notes: "About 4 kW, running over the evacuation and the two cuts, 2.76 h a batch (D-009)."}
  - {tag: T-102, type: Tank, service: "Forerun receiver: recovered thionyl chloride, nine tenths back to T-101, a tenth purged",
     notes: "About 1 m3, nitrogen-blanketed, vented to E-102 (D-008)."}
  - {tag: D-101, type: Vessel, service: "Waste drum: still residue and forerun purge to incineration",
     notes: "About 1 m3 (72 kg a batch), PTFE-lined or HDPE drum under nitrogen, vented to A-101; the residue is acid and acid chlorides, which hydrolyse with moisture (D-008)."}
  - {tag: T-201, type: Tank, service: "Caustic dilution: 50 wt% caustic soda diluted to 15 wt% with its cooler",
     notes: "About 15 m3 (a day of 15 wt% caustic), carbon steel; dilution cooler on cooling water, the caustic to 308.15 K, Q9 11.2 kW (D-010)."}
  - {tag: A-101, type: Column, service: "Caustic scrubber: packed column with circulating 15 wt% caustic and its cooler",
     notes: "Per batch 1.18 t of off-gas (SO2 11.0 kmol, HCl 11.3 kmol, thionyl chloride 0.52 kmol; cheme process recipe), 3.11 t of 50 wt% caustic and 7.25 t of water a batch, spent liquor of about 12.6 % sodium sulfite and 6.2 % sodium chloride; liquor cooler on cooling water (Q8 101 kW year average, from the model); sized with R-101's vent line for 400 m3/h; caustic flow and strength (conductivity) alarms interlocked with the dosing; anti-suck-back protection on the vent line (a nitrogen-padded seal pot and a vacuum breaker on nitrogen): SO2 and HCl absorption pulls a vacuum that could draw caustic back into thionyl chloride (D-010, D-014)."}
