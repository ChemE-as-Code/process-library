title: Methanesulfonyl chloride by semi-batch reaction of methanesulfonic acid with thionyl chloride and
  batch vacuum distillation (1000 t/a)
description: Unallocated foreground LCI of Methanesulfonyl chloride by semi-batch reaction of methanesulfonic
  acid with thionyl chloride and batch vacuum distillation (1000 t/a), case design, derived from the flowsheet
