basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Batch plant: thionyl chloride (fresh with the recovered forerun, 4/3 mol per mol) dosed over
  4 h into methanesulfonic acid at 368 K (semi-batch), held to 0.99 conversion of the acid, the SO2 and
  HCl vented through a brine condenser to a caustic scrubber; the crude stripped of thionyl chloride and
  the product distilled at 4 kPa(a) in a batch still with an 8-stage column; 1203.4 kg per batch, 831
  batches a year on a dedicated train'
