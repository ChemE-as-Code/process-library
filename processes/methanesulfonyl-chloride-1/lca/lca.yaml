# Goal and scope of the methanesulfonyl-chloride-1 LCI. Schema: `cheme schema lca`. Outputs:
# `cheme assess lca --write` (lca/inventory.csv, gaps.csv, dataset.yaml, manifest.json, results);
# never edit those by hand.
#
# Preliminary gate-to-gate foreground inventory (DESIGN.md D-012): every exchange of the batch
# plant with its amount per kg of methanesulfonyl chloride, from the flowsheet's year averages of
# the recipe (D-003). Per batch: multiply by 1203.4 kg. The backgrounds are left unmapped
# (`missing:` with the activity each should connect to), except where lca/mappings.yaml links a
# library producer or a shared entry: a gap, never zero, and no values from licensed databases.
# Methanesulfonic acid has no library producer: its gap names the proxy it should connect to
# (D-012). The scrubber's tail gas is not estimated (emission_exclusions).
schema: cheme/lca/v1
kind: lca
goal: >-
  Preliminary gate-to-gate life cycle inventory of methanesulfonyl chloride made by dosing
  thionyl chloride into methanesulfonic acid in a semi-batch reactor, venting the SO2 and HCl to
  a caustic scrubber and distilling the product in a batch vacuum still with a column, at the
  concept stage: which raw materials, utilities and wastes the batch plant exchanges per kg of
  methanesulfonyl chloride, as the foreground for a later cradle-to-gate study. No impact
  results: most backgrounds are not mapped yet (D-012).
functional_unit: {product: MSCL, amount: 1, unit: kg, source: "1 kg of distilled methanesulfonyl chloride (modelled 99.95 wt%, 530 ppm thionyl chloride, an upper bound) at the plant gate to storage, stream S10 (D-002, D-007, D-012)"}
# The boundary key stays cradle-to-gate so that the purchased inputs remain open gaps instead of
# being mapped free (the schema's gate-to-gate maps every feed free), as acetyl-chloride-1 does.
boundary: cradle-to-gate
case: design
year: 2026
location: GLO
technology: "Batch plant: thionyl chloride (fresh with the recovered forerun, 4/3 mol per mol) dosed over 4 h into methanesulfonic acid at 368 K (semi-batch), held to 0.99 conversion of the acid, the SO2 and HCl vented through a brine condenser to a caustic scrubber; the crude stripped of thionyl chloride and the product distilled at 4 kPa(a) in a batch still with an 8-stage column; 1203.4 kg per batch, 831 batches a year on a dedicated train"
rights: "CC-BY-4.0: the ChemE-as-Code process library's own concept design (LICENSE-DATA)"
system_model: cutoff
flows:
  # raw materials
  - key: feed:MSA
    missing: "not mapped yet (D-012); no library process makes methanesulfonic acid. Connect to: methanesulfonic acid, anhydrous, from the oxidation of dimethyl disulfide or methyl mercaptan (chlorine and water, or nitric acid, or air with a catalyst) or from methane and SO3 in oleum; 0.839 kg MSA per kg of MsCl at the stoichiometric floor; recorded proxy, not linked (D-012)"
    source: "flowsheet stream S1 (D-004)"
  - key: feed:SOCL2
    missing: "linked to processes/thionyl-chloride-1 (lca/mappings.yaml): thionyl chloride from sulfur, chlorine and SO2 over activated carbon, 99.7 wt%"
    source: "flowsheet stream S2 (D-004, D-008)"
  - key: feed:NAOH
    missing: "linked to processes/chlor-alkali-1 (lca/mappings.yaml): caustic soda 50 wt%, per kg of solution"
    source: "flowsheet stream S14 (D-010)"
  - key: feed:PW
    missing: "not mapped yet (D-012); connect to: process water from the site water treatment, for diluting the scrubber's caustic"
    source: "flowsheet stream S15 (D-010)"
  # utilities
  - key: feed:POWER
    missing: "not mapped yet (D-012); connect to: electricity, medium voltage, grid mix of the (undecided) site country"
    source: "flowsheet energy streams P1 (R-101's agitator and the heating loop's pump), P2 (C-101's agitator and the vacuum pump) and P3 (the scrubber's pump and fan), D-009"
  - key: feed:LPS
    missing: "linked as heat from steam (lca/mappings.yaml); connect to: steam in the chemical industry, from a natural-gas-fired site boiler (e.g. processes/utility-steam-ng-boiler), per kWh of condensing heat"
    source: "flowsheet energy streams Q1 (R-101's jacket and heating loop: the endothermic reaction, the dose warmed, the acid's heat-up, the vapour the gas carries; from core's semi-batch model), Q3 and Q5 (the still's reboiler from core's still model), D-009"
  - key: product:CW
    missing: "not mapped yet (D-012); connect to: heat rejected to a recirculating cooling-water system with cooling tower (processes/utility-cooling-tower), per kWh removed"
    source: "flowsheet energy streams Q6 (the product condenser, from core's still model), Q7 (product cooler), Q8 (the scrubber's cooler, from core's conversion step) and Q9 (the caustic dilution cooler), D-009"
  - key: product:BRINE
    missing: "not mapped yet (D-012); connect to: refrigeration at 253 K (brine) from an electric vapour-compression unit (e.g. processes/utility-chiller), per kWh of heat removed: compressor electricity at its COP, condenser cooling water, refrigerant losses"
    source: "flowsheet energy streams Q2 (R-101's vent condenser E-102, from core's model), Q4 (the forerun condenser E-103 with the vacuum pump's after-condenser E-106, from core's still model, which condenses the whole forerun once, the crude's flash on evacuation included), D-007, D-009, D-010"
  # wastes
  - key: product:RES
    treatment: {kind: waste, route: "hazardous-waste incineration of the still residue and the forerun purge (thionyl chloride, methanesulfonyl chloride, methanesulfonic acid) with flue-gas scrubbing (HCl and SO2 captured) (D-008)"}
    missing: "not mapped yet (D-012); connect to: incineration of hazardous liquid chlorinated and sulfur-containing waste, per kg"
    source: "flowsheet stream S13 (D-008)"
  - key: product:EFF
    treatment: {kind: waste, route: "spent scrubber liquor (sodium sulfite, sodium chloride, a little NaOH): sulfite oxidised to sulfate, neutralised, then the site's wastewater treatment (D-010)"}
    missing: "not mapped yet (D-012); connect to: treatment of a saline, sulfite-bearing alkaline process effluent in an industrial wastewater treatment plant (e.g. processes/utility-wwtp), per kg"
    source: "flowsheet stream S17 (D-010)"
# What the batch plant uses per batch and the flowsheet does not carry (library ADR 0035, core
# ADR 0053): the nitrogen that inerts R-101, the still and the receivers and breaks the still's
# vacuum, converted with the recipe's batches per year (process/recipe.yaml). It leaves through
# the vent condensers and the scrubber to air (nitrogen: no burden, no disposal exchange). There
# is no rinse between batches: the train is kept dry (thionyl chloride and methanesulfonyl
# chloride react with water).
consumables:
  - id: nitrogen
    title: Nitrogen for inerting R-101, the still and the receivers and breaking the vacuum
    unit: kg
    per_batch: 11.3
    source: "9 Nm3 per batch x 1.2506 kg/Nm3, ASSUMED (D-012): R-101's 1.6 m3 purged with two volumes before the charge (3.2 Nm3), C-101's vacuum broken with nitrogen (2.5 Nm3), C-101 purged before the crude is received (2.5 Nm3) and the receivers blanketed (0.8 Nm3)"
    missing: "linked to processes/asu-1 (lca/mappings.yaml): gaseous nitrogen to the battery limit"
operation:
  hours_per_year: 7920
  life_years: 20
  source: "design basis operating_hours_per_year 7920 (ASSUMED, the recipe's hours); 20 a service life ASSUMED"
emission_exclusions:
  - {id: scrubber-tail-gas, method: storage-tank, equipment: [R-101, E-102, A-101, P-101, E-106], reason: "No P&ID yet: R-101 vents only through E-102 and the caustic scrubber A-101, the still's vacuum pump also discharges there through its after-condenser E-106, which lets about 0.7 kg of thionyl chloride a batch (0.57 g per kg of product, with ASSUMED 1 kg/h of air in-leakage and C-101's purge nitrogen) pass to A-101, where it is destroyed; the balance does not carry that 0.05 % of the fresh thionyl chloride (D-007, D-010); the tail gas (the purge nitrogen with SO2 and HCl traces past 15 wt% caustic) goes to air; the balance takes all SO2, HCl and the vapour past E-102 up in the caustic (D-010, L-5); not estimated (open for basic engineering)."}
  - {id: storage-breathing, method: storage-tank, equipment: [T-101, T-102, D-101], reason: "The breathing of the thionyl chloride, forerun and waste tanks (nitrogen-blanketed, vented to E-102 or A-101) is not estimated (D-010)."}
  - {id: caustic-tank-breathing, method: storage-tank, equipment: [T-201], reason: "The caustic dilution tank breathes air with water vapour only: 15 wt% NaOH at 308 K has no volatile component but water (D-010); negligible, not estimated."}
dataset:
  version: 0.1.0
  classification: {isic: "2011"}   # ISIC Rev.4 2011 Manufacture of basic chemicals
  modelling: {principle: attributional}
  geography: {description: "Generic fine-chemicals site with a thionyl chloride and caustic soda supply, not chosen (GLO); one design case"}
  system_model: cutoff
  technology_level: current
  review: {type: none}
  data_generator: "ChemE-as-Code agent session (Claude Opus 5.5) for issue #159, unreviewed"
