    - {chemical: thionyl-chloride, role: feedstock, inventory_key: "feed:SOCL2", note: "Thionyl chloride (thionyl-chloride-1, 99.7 wt%), 1.167 kg/kg MsCl fresh (stoichiometric 1.039), dosed at 4/3 mol per mol with the recycled forerun"}
    - {chemical: sodium-hydroxide, role: feedstock, inventory_key: "feed:NAOH", note: "Caustic soda 50 wt% (chlor-alkali-1) for the SO2/HCl scrubber, 2.58 kg/kg of solution"}
    - {chemical: water, role: feedstock, inventory_key: "feed:PW", note: "Process water diluting the scrubber's caustic to 15 wt%, 6.03 kg/kg"}
    - {chemical: nitrogen, role: feedstock, inventory_key: "consumable:nitrogen", note: "Nitrogen (asu-1) for inerting R-101, the still and the receivers and breaking the vacuum, 11.3 kg per batch, 9.4 g/kg (ASSUMED)"}
  outputs:
    - {chemical: methanesulfonyl-chloride, role: main-product, inventory_key: "product:MSCL", note: "Distilled methanesulfonyl chloride, modelled 99.95 wt% with 530 ppm thionyl chloride (an upper bound; specification at least 99.5 wt% ASSUMED), to storage under nitrogen; no source states a purity for this route"}
    - {chemical: wastewater, role: waste, inventory_key: "product:EFF", note: "Spent scrubber liquor, 9.59 kg/kg: about 12.6 wt% sodium sulfite, 6.2 wt% sodium chloride, 1.2 wt% NaOH, to wastewater treatment"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "0.052 kWh/kg: agitators of R-101 and C-101, the heating loop's pump, the vacuum pump, the scrubber's pump and fan (ASSUMED)"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "0.554 kWh/kg of LP steam let down to 140 kPa(a): R-101's jacket and heating loop (the endothermic reaction, the dose's warming, the acid's heat-up, the vented vapour; core's semi-batch model) and the still's reboiler (core's still model with its column)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "1.069 kWh/kg removed by cooling water: the product condenser (core's still model), the scrubber's cooler (core's conversion model), the caustic dilution cooler, the product cooler"}
    - {chemical: chilled-water, role: utility, inventory_key: "product:BRINE", note: "0.219 kWh/kg removed by brine at 253 K: the vent condenser E-102 (core's vent model), the forerun condenser E-103 (core's still model) and the crude's flash into it (the registry has chilled water, not brine: closest entry)"}
