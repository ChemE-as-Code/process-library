# Process Atlas manifest of methanesulfonyl-chloride-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: methanesulfonyl-chloride-1
title: Methanesulfonyl chloride from methanesulfonic acid and thionyl chloride, semi-batch, vacuum distillation (1000 t/a)
summary: >-
  A batch plant: thionyl chloride is dosed over 4 h into methanesulfonic acid at 368 K, the SO2
  and HCl leave through a brine vent condenser to a caustic scrubber, and the crude is distilled
  at 4 kPa(a), the excess thionyl chloride recycled. Concept stage, 1203 kg per batch every 9.53 h
  on a dedicated train, gas-release screening with a rate-constant sensitivity, preliminary
  gate-to-gate LCI.
description: |
  Methanesulfonic acid (99.5 wt%) is charged to an enamelled reactor and warmed to 368 K;
  thionyl chloride, fresh from thionyl-chloride-1 with the recovered forerun, is dosed into it
  over 4 h at 4/3 mol per mol and held until 99 % of the acid is converted, CH3SO3H + SOCl2 ->
  CH3SO2Cl + SO2 + HCl, the procedure of Organic Syntheses, Coll. Vol. 4, p. 571 (95 C, 4 h
  addition, 3.5 h hold). Both gases leave as they form, saturated with the liquid's vapour,
  through a brine vent condenser that returns the condensate, to a scrubber with circulating
  15 wt% caustic (from chlor-alkali-1). The crude is distilled at 4 kPa(a) in a batch still with
  an 8-stage column: the excess thionyl chloride as a forerun at reflux ratio 1, nine tenths
  recycled to the dose tank and a tenth purged; then the product at reflux ratio 0.5, to 50 mol%
  of methanesulfonyl chloride in the residue. The pot ends at 362 K and the let-down steam
  condenses at 382 K, below the 115 C the source sets for the product's heated wall. Product
  99.95 wt% with 530 ppm thionyl chloride, an upper bound of the shortcut column on an ideal
  liquid. Yield 97.2 % of theory on the acid: a model result and an upper bound (the
  laboratory source reports 71-83 %).

  The batch is modelled with cheme-as-code's semi-batch reactor with a gas vent, its vapour and a
  vent condenser (reactor: semibatch, batch.vent, core ADRs 0050, 0054, 0062), its batch still
  with a rectifying column (still.column, ADRs 0055, 0061), a recycle tear (ADR 0060) and the
  batch recipe (process/recipe.yaml, ADRs 0051, 0052, 0057): the dosing, post-reaction, warming
  and distillation times come from the models, R-101 is the bottleneck (cycle 9.53 h, 831
  batches a year), the recipe sizes R-101 (1.6 m3), and the flowsheet's flows are the recipe's
  year averages. The models write their duties (ADR 0059). The kinetics and the heat of reaction
  are ASSUMED (no open calorimetry): the reaction is endothermic by analogy, so a cooling failure
  releases nothing and the MTSR is the process temperature; the hazard is the gas. A dose
  accumulated during a heating failure releases about 1280 m3/h when it reacts, 3.2 times R-101's
  400 m3/h vent, and the jacket alone cannot supply the dosing's heat, so an external heating
  loop is part of the design: design findings for basic engineering. See DESIGN.md for every
  assumption.
families: [chlorinated-organics]
keywords: [methanesulfonyl chloride, mesyl chloride, MsCl, methanesulfonic acid, thionyl chloride, sulfonyl chloride, acid chloride, semi-batch, batch, dosing, SO2 vent, HCl vent, vent condenser, caustic scrubber, batch distillation, vacuum distillation, recycle, thermal screening, gas release, fine chemicals]
facets:
  feedstock_basis: [fossil, mineral, electricity]
  product_classes: [chemicals]
  unit_operations: [reaction, distillation, absorption]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, kinetics, the heat of
# reaction, the still's ideal liquid and the column's stages and reflux are assumed; ratios,
# times and conditions from the Organic Syntheses procedure (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept batch PFD with closed mass, component and element balances (cheme validate, cheme
    process streams: 4 blocks and 9 steps within tolerance) and the thionyl chloride recycle
    converged at its tear S3. The semi-batch R101 with its vent, vapour and vent condenser (from
    its ASSUMED rate laws), the batch still with its column (8 theoretical stages, reflux ratios
    1 and 0.5, Diwekar's shortcut on Raoult's law with NIST and two-point vapour-pressure lines,
    the ideal liquid ASSUMED; the forerun 78.4 wt% thionyl chloride, the product 99.95 wt% at
    99.0 % recovery from the stripped crude), the scrubber and the mixers are calculated by cheme
    process propagate; scripts/balance.py gives the feeds for 1000 t/a with the recycle, the
    scrubber's caustic, the still's stream temperatures and the duties core's models do not
    write (the product cooler, the caustic's dilution, the crude's flash on evacuation). The
    recipe's year-average rate of the product agrees with the flowsheet (no cheme.recipe-basis
    finding); the recipe sizes R-101 (1.6 m3); its jacket check is a cooling check, and the
    heating the endothermic dosing needs (about 80 kW at the peak) is checked by hand from the
    model's profile against the jacket's 15 to 21 kW (DESIGN.md D-009, L-3). Thermal and gas
    screening (cheme process reactor-hazards): dT_ad 0 K (endothermic), accumulation 0.297 at
    the end of the dosing (most of it the planned excess), MTSR 368.15 K against an MTT of 388.15
    K (hazard.mtt: the source's 115 C limit for the product's heated wall; the batch's own
    bubble point stays above 390.6 K); criticality without a TD24: 1 if the TD24 lies above the
    MTT, 2 if between the MTSR and the MTT, 5 if below the MTSR. With k/10 the accumulation is
    0.683, with k/100 0.935 and the content within 2.4 K of boiling (DESIGN.md D-011). The
    normal vent peak, 322 m3/h with the vapour, lies within R-101's vent capacity of 400 m3/h
    (ASSUMED); an accumulated dose (a heating failure) releasing about 1280 m3/h and water
    ingress beyond about 15 kg/h are design findings for the relief study (DESIGN.md D-014).
    Preliminary gate-to-gate LCI with the per-batch nitrogen; thionyl chloride linked to
    thionyl-chloride-1, caustic soda to chlor-alkali-1, nitrogen to asu-1, methanesulfonic acid
    a gap with a recorded proxy, the other backgrounds gaps. cheme maturity reaches no level
    (assumed feeds, kinetics and separations); the claim `maturity: concept` is the lowest value
    of the schema, not an evidenced level. Not reviewed. Needs cheme-as-code 1.11.0.
