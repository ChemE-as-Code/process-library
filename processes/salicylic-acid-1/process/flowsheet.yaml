# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Salicylic acid by the one-stage Kolbe-Schmitt carboxylation of dry sodium phenoxide
# (US 4 376 867 A, Example I; DESIGN.md D-001), a batch plant: molten phenol (fresh and
# recovered) is neutralised with 50 wt% caustic soda dosed into it (R101, a semi-batch), the
# phenoxide solution is dried to a powder in a kneader-reactor at 463 K and 4 kPa(a) (D101,
# core's dryer), CO2 is dosed into the dry powder at 463 K over 5 h and held 1 h (R102, a
# semi-batch with the gas not taken up passing to a vent: the head space's CO2, let down after the
# hold), the crude is cooled to 373 K in the kneader (E103), the crude sodium salicylate is taken
# up in about 9 kg of water per kg and acidified with sulfuric acid at 328 K (R201), the first
# crop crystallises at 328 K (CR201), is centrifuged (F201), washed with water on the centrifuge
# (W201, F203) and vacuum-dried at 333 K (D201); the mother liquor is cooled to 298 K for a
# second crop (CR202, F202) that goes back to the next acidification. The liquors and the
# condensates are collected (M301) and their phenol recovered (X301) for the next charge.
# The flows are the year averages of the batch recipe (process/recipe.yaml, `cheme process
# recipe`, D-003).
# Where the values come from:
# - ratios and conditions: US 4 376 867 A (SRC-1) and the design basis, else ASSUMED (D-002 to
#   D-009);
# - the feeds: two design specifications (core ADR 0070): the caustic S3 for 1000 t/a of dried
#   product, with the CO2, the dissolution water, the acid and the wash water following it at
#   fixed ratios, and the fresh phenol S1 for the charge's 23.2 mol of phenol per 23.0 mol of
#   NaOH (Example I);
# - R101, R102: cheme's semi-batch models (the rate laws of NEUT, CARB and PARA, D-005); D101,
#   D201: core's dryer; R201: a conversion step; CR201, CR202, W201: core's crystallizer with
#   the liquor's other solutes as spectators and the water solubility of salicylic acid
#   (SRC-3); F201 to F203: specified filters; X301: a component separator (core ADR 0070); M101,
#   M301: mixers; the second crop S19 and the recovered phenol S20 converged at two tears (core
#   ADR 0060): all calculated by `cheme process propagate --fill`, with the duties the models
#   give (core ADRs 0059, 0063);
# - the phenol recovery's steam Q7 and the drives' power: ASSUMED year averages (D-009);
# - the duties of the condensers E-102 and E-202 and of the kneader's cool-down E103 (Q8 to
#   Q10), the CO2 dose's head-space share: scripts/balance.py (library ADR 0027, D-005, D-009).
schema: cheme/process/v1
kind: flowsheet
title: Salicylic acid by batch Kolbe-Schmitt carboxylation of dry sodium phenoxide (1000 t/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 1000 t/a dried salicylic acid, year averages of the batch recipe in 7920 h (D-002, D-003)", default: true}
tolerance: {abs: 0.05, rel: 0.002}   # balances: |in - out| <= abs + rel * max(in, out), kg/h
# Two recycles (core ADR 0060): the second crop S19 back to the acidifier and the recovered
# phenol S20 back to the phenol charge (D-007, D-008).
tears:
  - stream: S19
    initial: {flow: 14.0, unit: kg/h, basis: mass_fraction, composition: {SA_S: 0.75, H2O: 0.23, NA2SO4: 0.02}}
  - stream: S20
    initial: {flow: 11.0, unit: kg/h, basis: mass_fraction, composition: {PHOH: 1.0}}
convergence: {method: wegstein, max_iterations: 500, tolerance: {abs: 1.0e-6, rel: 1.0e-8}}
specs:
  - id: rate
    vary:
      stream: S3
      initial: 85.0
      with: {S7: 0.50027, S10: 15.96, S11: 0.63478, S16: 2.0}
    target: {stream: S22, quantity: annual, value: 1000, unit: t}
    provenance: assumed
    source: "1000 t/a of dried salicylic acid, ASSUMED (D-002); per kg of 50 wt% caustic: CO2 0.50027 kg (0.90932 mol per mol NaOH: the 0.88954 mol taken up in Example I, 20.48 mol of acids from 23.0 mol of NaOH, and the 0.01978 mol that fills R-102's free volume of about 3.68 m3 at 500 kPa(a) and 463.15 K at the end of the hold, 0.478 kmol a batch of 24.18 kmol NaOH, ASSUMED; scripts/balance.py), dissolution water 15.96 kg (9 kg per kg of the sodium salicylate formed, the middle of SRC-1's 8 to 10 t per t), sulfuric acid 98.5 wt% 0.63478 kg (0.51 mol per mol of sodium, 2 % excess), wash water 2.0 kg (about 1.4 kg per kg of first-crop crystals) (D-004, D-007)"
  - id: phenol
    vary: {stream: S1, initial: 90.0}
    target: {stream: S2, component: PHOH, quantity: ratio, basis: mole, per: {stream: S3, component: NAOH}, value: 1.008696}
    provenance: given
    source: "US 4 376 867 A, Example I: 23.2 mol phenol per 23.0 mol NaOH (0.87 % excess; the patent prefers 1 to 10 %); the recovered phenol S20 counts in the charge (D-004)"

feeds:
  - {id: PHF, title: Phenol (acetone-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NAOHF, title: Caustic soda 50 wt% (chlor-alkali-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: CO2F, title: "Carbon dioxide (carbon-capture-1, let down)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: DW, title: Process water (dissolution), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: ACIDF, title: Sulfuric acid 98.5 wt% (sulfuric-acid-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: WASHW, title: Process water (cake wash), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: r102, direction: out, kind: energy}
      - {id: r201, direction: out, kind: energy}
      - {id: f201, direction: out, kind: energy}
      - {id: d201, direction: out, kind: energy}
      - {id: x301, direction: out, kind: energy}
  - id: HPS
    title: HP steam 4100 kPa(a) (to the kneader's hot-oil circuit)
    category: utility
    utility:
      kind: steam
      level: HP
      pressure: {value: 4100, provenance: assumed, source: "design basis (D-009): the HP steam sulfuric-acid-1 raises"}
      supply_temperature: {value: 525.0, provenance: given, source: "saturation at 4100 kPa(a), IAPWS-95 (chemicals 1.5.2 iapws95_Tsat: 524.97 K)"}
      min_approach: {value: 20, provenance: assumed, source: "D-009: through a hot-oil circuit"}
    ports:
      - {id: d101, direction: out, kind: energy}
  - id: LPS
    title: LP steam 350 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 350, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 412.0, provenance: given, source: "saturation at 350 kPa(a), IAPWS-95 (chemicals 1.5.2 iapws95_Tsat: 412.01 K)"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: r201, direction: out, kind: energy}
      - {id: d201, direction: out, kind: energy}
      - {id: x301, direction: out, kind: energy}
products:
  - {id: SA, title: Salicylic acid crystals to packing, category: product, ports: [{id: in, direction: in}]}
  - {id: VENT, title: CO2 not taken up (vented from the kneader), category: emission, ports: [{id: in, direction: in}]}
  - {id: WW, title: "Sodium sulfate liquor after phenol recovery, to wastewater treatment", category: wastewater, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: r102, direction: in, kind: energy}
      - {id: e102, direction: in, kind: energy}
      - {id: e103, direction: in, kind: energy}
      - {id: e202, direction: in, kind: energy}
  - id: CHW
    title: Chilled water return (278 K)
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 278.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 283.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: cr202, direction: in, kind: energy}

blocks:
  - id: PHENOX
    title: Phenoxide preparation
    class: ReactingChemicals
    ports:
      - {id: phenol, direction: in}
      - {id: rec, direction: in}
      - {id: naoh, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: CARBOX
    title: Drying and carboxylation (kneader-reactor)
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: co2, direction: in}
      - {id: out, direction: out}
      - {id: vap, direction: out}
      - {id: vent, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: q, direction: out, kind: energy}
      - {id: q_cond, direction: out, kind: energy}
      - {id: q_cool, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: ACID
    title: Dissolution, acidification and crystallisation
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: water, direction: in}
      - {id: acid, direction: in}
      - {id: crop, direction: out}
      - {id: ml, direction: out}
      - {id: q, direction: in, kind: energy}
      - {id: qc, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: power_c, direction: in, kind: energy}
  - id: ISOL
    title: Washing and drying
    class: SeparatingMechanically
    ports:
      - {id: in, direction: in}
      - {id: wash, direction: in}
      - {id: product, direction: out}
      - {id: wf, direction: out}
      - {id: vap, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: q_cond, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: RECOV
    title: Liquor collection and phenol recovery
    class: Separating
    ports:
      - {id: ml, direction: in}
      - {id: wf, direction: in}
      - {id: vap1, direction: in}
      - {id: vap2, direction: in}
      - {id: phenol, direction: out}
      - {id: ww, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}

steps:
  - id: M101
    block: PHENOX
    title: Phenol charge (fresh and recovered, molten at 343 K)
    class: Mixing
    links: [{target: equipment, ref: T-101}]
    ports:
      - {id: phenol, direction: in, delegates: phenol}
      - {id: rec, direction: in, delegates: rec}
      - {id: out, direction: out}
  - id: R101
    block: PHENOX
    title: Neutraliser (caustic dosed into the molten phenol at 343 K)
    class: ReactingChemicals
    reactions: [NEUT]
    reactor: semibatch
    energy_port: q
    batch:
      dosing: [{stream: S3, time: 3600}]
      target: {key: NAOH, conversion: 0.999}
      heat: isothermal
      provenance: assumed
      source: "50 wt% caustic dosed at a constant rate over 1 h into the molten phenol at 343.15 K and held to 0.999 conversion of the NaOH (SRC-1: NaOH as a 25 to 55 % solution; the dosing time and temperature ASSUMED, D-005)"
    hazard:
      mtt: 373.15
      provenance: assumed
      source: "MTT: the normal boiling point of water, a lower bound of the bubble point of the phenoxide solution (the dissolved salts raise it, phenol boils at 454.95 K); R-101 is vented to atmosphere through its condenser, so the mass boils there (D-011)"
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: charge, direction: in}
      - {id: naoh, direction: in, delegates: naoh}
      - {id: out, direction: out, delegates: out}
      - {id: q, direction: out, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: D101
    block: CARBOX
    title: Drying the phenoxide to a powder (atmospheric, then 4 kPa(a) to 463 K)
    class: Drying
    dryer:
      volatiles: [H2O, PHOH]
      residual_moisture: {value: 0.002, basis: mass_fraction, provenance: assumed, source: "0.2 wt% water and phenol left in the dry phenoxide (D-006): SRC-1 dries at ambient pressure, then at 30 mm Hg to 190 C, and shows that incomplete drying lowers the conversion (Example 3, run 3-5: 60 %)"}
      temperature: 463.15
      energy:
        heat_capacity: 3.0
        latent_heat: {H2O: 2256.4, PHOH: 486.6}
        vessel_heat_capacity: 6300
        efficiency: 0.8
        port: steam
        provenance: assumed
        source: "the phenoxide solution about 3.0 kJ/(kg K), ASSUMED; latent heats: water at 373.15 K, where most of it boils off at ambient pressure (thermo 0.6.1, method HEOS_FIT, 2256.4 kJ/kg), phenol at 463.15 K (thermo 0.6.1, method DIPPR_PERRY_8E, 486.6 kJ/kg; SRC-5); the 6.3 m3 kneader's metal, about 12.6 t of steel (2 t per m3) at 0.5 kJ/(kg K), heated each batch, ASSUMED; 80 % efficiency (D-006, D-009)"
      drying_rate: {value: 10.0, provenance: assumed, source: "ASSUMED mean evaporation of a jacketed kneader-dryer with self-cleaning blades: a wall flux of about 6 kW/m2 over 2256 kJ/kg, the solution boiling at first, the powder at the end (D-006)"}
      cake_density: {value: 1300, provenance: assumed, source: "ASSUMED, no open density of sodium phenoxide solutions read: the phenoxide solution as charged, S4, about 66 wt% sodium phenoxide, 33 wt% water and 0.5 wt% phenol; it sizes R-102 by hand from the solution (D-003, D-006)"}
      outlets: {product: product, vapour: vapour}
    links: [{target: equipment, ref: R-102}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: product, direction: out}
      - {id: vapour, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
  - id: E102
    block: CARBOX
    title: Vapour condenser of the kneader (water and phenol from the drying, cooling water)
    class: Cooling
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: vap}
      - {id: q, direction: out, kind: energy, delegates: q_cond}
  - id: R102
    block: CARBOX
    title: Carboxylation (CO2 dosed into the dry phenoxide at 463 K, then 1 h at about 5 bar)
    class: ReactingChemicals
    reactions: [CARB, PARA]
    reactor: semibatch
    energy_port: q
    batch:
      dosing:
        - stream: S7
          time: 18000
          absorbed: 0.97825
      time: 3600
      heat: isothermal
      vent: {stream: S8, components: [CO2]}
      provenance: assumed
      source: "SRC-1 Example I: CO2 at a constant rate over 5 h into the dry phenoxide at 463.15 K (190 C, the final drying temperature; Example 3's 190 to 195 C), taken up at once, the pressure rising to 5 bar at the end, then held 1 h; dosed: what reacts in Example I (20.48 mol of acids from 23.0 mol, 0.999 of the NaOH as phenoxide: 0.88954 mol per mol of NaOH) and what fills the head space at the end (0.01978 mol per mol, ASSUMED 500 kPa(a) in R-102's free volume, scripts/balance.py), so 0.97825 of the dose is taken up; the rest is the head space's CO2, let down to the vent after the hold (the model sends it to the vent through the dosing, L-2; D-005)"
    hazard:
      mtt: 493.15
      vent_capacity: 100.0
      provenance: assumed
      source: "MTT ASSUMED at 220 C, the upper end of SRC-1's preferred range (claim 2): above it SRC-1 Example 3 run 3-7 (237 to 243 C) loses conversion to phenol's vapour pressure, and salicylic acid decarboxylates slowly to phenol and CO2 at 200 to 230 C (Wikipedia); the dry powder does not boil (sodium phenoxide melts at 657.15 K, CRC via chemicals 1.5.2), so no boiling point bounds it; vent capacity 100 m3/h ASSUMED for the head-space vent line, against the head space let down after the hold (about 0.48 kmol of CO2 in 0.25 h, about 73 m3/h at 463 K and 101.325 kPa(a), scripts/balance.py) and no gas formed at a cooling failure at the MTSR, below the decarboxylation range (D-011)"
    links: [{target: equipment, ref: R-102}]
    ports:
      - {id: charge, direction: in}
      - {id: co2, direction: in, delegates: co2}
      - {id: out, direction: out}
      - {id: vent, direction: out, delegates: vent}
      - {id: q, direction: out, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E103
    block: CARBOX
    title: Crude cooled to 373 K in the kneader (hot-oil loop to cooling water)
    class: Cooling
    links: [{target: equipment, ref: R-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
      - {id: q, direction: out, kind: energy, delegates: q_cool}
  - id: R201
    block: ACID
    title: Dissolution in water and acidification with sulfuric acid at 328 K
    class: ReactingChemicals
    reactions: [ACS, ACP, ACH, ACN]
    reactor: conversion
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: crop, direction: in}
      - {id: water, direction: in, delegates: water}
      - {id: acid, direction: in, delegates: acid}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: CR201
    block: ACID
    title: First crop (salicylic acid crystallises at 328 K)
    class: Crystallizing
    crystallizer:
      solute: SA
      solvent: H2O
      crystal: SA_S
      basis: solubility
      temperature: 328.15
      solubility:
        unit: kg/kg_solvent
        points: [[273.15, 0.00124], [298.15, 0.00248], [313.15, 0.00414], [348.15, 0.01741], [373.15, 0.07779]]
        provenance: given
        source: "Wikipedia, Salicylic acid (infobox): 1.24, 2.48, 4.14, 17.41 and 77.79 g/L of water at 0, 25, 40, 75 and 100 C, taken here as kg per kg of water (dilute solutions; ASSUMED) (SRC-3); interpolated linearly by core, 0.00983 at 328.15 K (D-007)"
        salting_out:
          coefficients: {NA2SO4: 0.0, H2SO4: 0.0, PHOH: 0.0, HBA: 0.0, CO2: 0.0, NAOPH: 0.0, NASAL: 0.0, NA4HB: 0.0, NAOH: 0.0}
          provenance: assumed
          source: "no open salting-out data of salicylic acid by sodium sulfate or phenol read; no correction taken, the pure-water solubility in the mother liquor (D-007, L-4)"
      spectators: [NA2SO4, H2SO4, PHOH, HBA, CO2, NAOPH, NASAL, NA4HB, NAOH]
      outlets: {slurry: out}
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: F201
    block: ACID
    title: Centrifuging the first crop
    class: Filtering
    solid_separation:
      solid_recovery: 0.995
      cake_liquid: {value: 0.15, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "a peeler centrifuge (SRC-1: recovered by centrifugation), 99.5 % of the crystals to the cake, spun to 0.15 kg of liquor per kg (D-008)"
    links: [{target: equipment, ref: C-201}]
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out, delegates: crop}
      - {id: filtrate, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power_c}
  - id: CR202
    block: ACID
    title: Second crop (the mother liquor cooled to 298 K)
    class: Crystallizing
    crystallizer:
      solute: SA
      solvent: H2O
      crystal: SA_S
      basis: solubility
      temperature: 298.15
      solubility:
        unit: kg/kg_solvent
        points: [[273.15, 0.00124], [298.15, 0.00248], [313.15, 0.00414], [348.15, 0.01741], [373.15, 0.07779]]
        provenance: given
        source: "as CR201 (SRC-3, D-007)"
        salting_out:
          coefficients: {NA2SO4: 0.0, H2SO4: 0.0, PHOH: 0.0, HBA: 0.0, CO2: 0.0, NAOPH: 0.0, NASAL: 0.0, NA4HB: 0.0, NAOH: 0.0}
          provenance: assumed
          source: "as CR201 (D-007, L-4)"
      energy: {heat_capacity: 4.0, heat_of_crystallization: 0.0, provenance: assumed, source: "the dilute sodium sulfate liquor about 4.0 kJ/(kg K), ASSUMED; the heat of crystallisation not counted (no open value; the crop is about 1 % of the liquor, D-009)"}
      spectators: [NA2SO4, H2SO4, PHOH, HBA, CO2, NAOPH, NASAL, NA4HB, NAOH]
      outlets: {slurry: out}
    energy_port: q
    links: [{target: equipment, ref: V-202}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: qc}
  - id: F202
    block: ACID
    title: Filtering the second crop (back to the next acidification)
    class: Filtering
    solid_separation:
      solid_recovery: 0.99
      cake_liquid: {value: 0.3, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "a nutsche filter, 99 % of the fine second crop to the cake, 0.3 kg of liquor per kg (D-008)"
    links: [{target: equipment, ref: F-202}]
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out, delegates: ml}
  - id: W201
    block: ISOL
    title: Cake wash with water on the centrifuge (salicylic acid dissolves to saturation)
    class: Crystallizing
    crystallizer:
      solute: SA
      solvent: H2O
      crystal: SA_S
      basis: solubility
      temperature: 298.15
      solubility:
        unit: kg/kg_solvent
        points: [[273.15, 0.00124], [298.15, 0.00248], [313.15, 0.00414], [348.15, 0.01741], [373.15, 0.07779]]
        provenance: given
        source: "as CR201 (SRC-3, D-007)"
        salting_out:
          coefficients: {NA2SO4: 0.0, H2SO4: 0.0, PHOH: 0.0, HBA: 0.0, CO2: 0.0, NAOPH: 0.0, NASAL: 0.0, NA4HB: 0.0, NAOH: 0.0}
          provenance: assumed
          source: "as CR201 (D-007, L-4)"
      spectators: [NA2SO4, H2SO4, PHOH, HBA, CO2, NAOPH, NASAL, NA4HB, NAOH]
      outlets: {slurry: out}
    links: [{target: equipment, ref: C-201}]
    ports:
      - {id: cake, direction: in, delegates: in}
      - {id: wash, direction: in, delegates: wash}
      - {id: out, direction: out}
  - id: F203
    block: ISOL
    title: Spinning the washed cake
    class: Filtering
    solid_separation:
      solid_recovery: 0.995
      cake_liquid: {value: 0.15, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "as F201 (D-008)"
    links: [{target: equipment, ref: C-201}]
