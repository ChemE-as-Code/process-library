id: salicylic-acid-by-batch-kolbe-schmitt-carboxylation-of-dry-sodium-phenoxide-1000-t-a
title: Salicylic acid by batch Kolbe-Schmitt carboxylation of dry sodium phenoxide (1000 t/a)
description: Unallocated foreground LCI of Salicylic acid by batch Kolbe-Schmitt carboxylation of dry
  sodium phenoxide (1000 t/a), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Batch plant: molten phenol neutralised with 50 wt% caustic soda dosed over 1 h at 343 K;
  the phenoxide solution dried to a powder in a kneader-reactor at ambient pressure, then at 4 kPa(a)
  to 463 K; CO2 dosed into the dry phenoxide at 463 K over 5 h and held 1 h (one-stage Kolbe-Schmitt carboxylation),
  the CO2 not taken up vented; the crude sodium salicylate taken up in about 9 kg of water per kg and
  acidified with sulfuric acid at 328 K, the first crop centrifuged, washed and vacuum-dried at 333 K,
  a second crop at 298 K returned to the next acidification, the phenol recovered from the liquors (95
  %, specified); 2796.53 kg per batch, 357.6 batches a year on a dedicated train'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
