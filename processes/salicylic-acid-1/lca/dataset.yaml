  direction: output
  reason: 'No P&ID yet: the air displaced from the heated phenol tank and the neutraliser and the non-condensables
    of the kneader''s vacuum system carry phenol vapour, to a carbon filter or the site''s thermal oxidiser;
    not estimated (D-010, D-011).'
- key: emission-excluded:dryer-dust
  title: equipment-leaks emissions of the plant
  direction: output
  reason: Salicylic acid dust and sublimate in the product dryer's vacuum vent (salicylic acid sublimes
    from 76 C) and in packing are not estimated (D-008, D-010).
- key: emission-excluded:liquor-tanks
  title: storage-tank emissions of R-201, T-301
  direction: output
  reason: 'No P&ID yet: the breathing of the acidifier and the liquor tank carries water vapour, traces
    of phenol (0.7 wt% in the liquor) and the CO2 left dissolved in the crude; vented through the site''s
    scrubber or carbon filter, not estimated (D-010).'
- key: emission-excluded:phenol-recovery
  title: equipment-leaks emissions of X-301
  direction: output
  reason: 'The extraction solvent''s losses and the recovery unit''s vent are not estimated: X-301 is
    a specified split, its solvent not chosen (D-008).'
