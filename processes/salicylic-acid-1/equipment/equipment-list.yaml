# Equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes per batch from the recipe (D-003: 2796.53 kg of product every 22.15 h, 357.6 batches a
# year) and the models; design pressures, temperatures and materials are not set yet (basic
# engineering); materials named are usual choices for hot caustic phenoxide, dry phenoxide under
# CO2 and acidic sulfate liquors, to be confirmed (open input). All values ASSUMED.
schema: cheme/equipment/v1
equipment:
  - {tag: T-101, type: Tank, service: "Phenol tank: fresh and recovered phenol kept molten at 343 K",
     notes: "Heated (phenol melts at 314.04 K), nitrogen-blanketed, vented through a carbon filter (D-004, D-010); one batch's 2.24 t of phenol at least; stainless steel."}
  - {tag: R-101, type: StirredTankReactor, service: "Neutraliser: 50 wt% caustic soda dosed into the molten phenol at 343 K (R101)",
     notes: "5 m3 (R10 preferred size, 70 % full with 3.50 m3 of phenoxide solution) as the recipe sizes it from R101's semi-batch model (core ADR 0052); jacket on cooling water, 5.85 kW year average (Q1); caustic dosed over 1 h, interlocked with the temperature and the agitator (D-005, D-011); stainless steel or nickel-clad (hot caustic phenoxide)."}
  - {tag: R-102, type: StirredTankReactor, service: "Kneader-reactor (mixer-kneader with counter-rotating blades): the phenoxide dried at ambient pressure, then at 4 kPa(a) to 463 K (D101), carboxylated with CO2 at 463 K (R102), cooled and taken up in water",
     notes: "5 m3 (R10 preferred size) as the recipe sizes it from R102's content (2.55 m3); the solution it dries, about 4.13 t at an ASSUMED 1300 kg/m3 (3.18 m3), fills it to 64 %, within the 60 % working fill of a kneader only just (checked by hand, D-003, D-006); hot-oil circuit from HP steam for the drying (Q2 81.1 kW year average, core's dryer model) and cooled through the oil circuit to cooling water during the carboxylation (Q3 11.2 kW, core's semi-batch model); design pressure for the 5 bar CO2 hold and full vacuum (ASSUMED 10 bar(g)/FV); drive and vacuum pump 20 kW year average; CO2 dosing interlocked with the temperature and the drive (D-011); the bottleneck (22.15 h a batch); stainless steel or nickel (hot phenoxide, SRC-1 Heinz List type, US 3 880 407)."}
  - {tag: E-102, type: HeatExchanger, service: "Vapour condenser of the kneader: water and phenol from the drying",
     notes: "Condenses 62.5 kg/h year average (about 1.38 t a batch over 13.4 h) of water with 1.6 wt% phenol to T-301; cooling water; with the vacuum pump K-101 for the 4 kPa(a) stage (D-006); its duty is not counted separately (part of the cooling water, L-6)."}
  - {tag: R-201, type: StirredTankReactor, service: "Acidifier and first-crop crystalliser: the stock solution with the last batch's second crop acidified with sulfuric acid at 328 K, the first crop crystallised",
     notes: "40 m3 (R10 preferred size, 85 % full with about 35.3 t of slurry a batch at about 1040 kg/m3, checked by hand: core sizes no vessel from a conversion step, D-003); jacket on LP-steam hot water, 27.6 kW year average net heat (Q4: the dissolution water warmed to 328 K, less the crude's and the acid's heat, core's conversion duty); acid dosed over 1.5 h with the temperature controlled; rubber- or glass-lined (sulfuric acid, salicylic acid)."}
  - {tag: C-201, type: Centrifuge, service: "Peeler centrifuge: the first crop spun, washed with water and spun dry (F201, W201, F203)",
     notes: "Takes the slurry in loads, 3.5 h a batch (ASSUMED); 0.15 kg of liquor per kg of cake, 99.5 % of the crystals to the cake (ASSUMED, D-008); 4 kW year average; stainless steel, Hastelloy or rubber-lined basket (acidic sulfate liquor)."}
  - {tag: V-202, type: Vessel, service: "Second-crop crystalliser: the mother liquor cooled from 328 to 298 K on chilled water (CR202)",
     notes: "About 40 m3 (the first mother liquor, about 32 t a batch); jacket or external cooler on chilled water, 48.3 kW year average (Q5, core's crystallizer duty); agitated; rubber-lined (D-007)."}
  - {tag: F-202, type: Filter, service: "Nutsche filter for the second crop (F202), its cake back to R-201",
     notes: "About 300 kg of wet cake a batch; 0.3 kg liquor per kg, 99 % recovery (ASSUMED, D-008)."}
  - {tag: D-201, type: Dryer, service: "Conical vacuum dryer: the washed product dried at 333 K (D201)",
     notes: "8 m3 (R10 preferred size, 50 % full with 4.0 m3 of wet cake) as the recipe sizes it (core ADR 0057), 11.1 m2 heated; 10.73 h a batch with the drying from D201's rate (recipe); hot water from LP steam, 21.1 kW year average (Q6, core's dryer model); 333 K, below the 349 K at which salicylic acid sublimes (Wikipedia), with a dust filter and a vacuum condenser (D-008, D-010); 3 kW; stainless steel."}
  - {tag: T-301, type: Tank, service: "Liquor collection: the mother liquor, the wash filtrate and the condensates (M301)",
     notes: "Buffer for the phenol recovery, about one batch's 37 t; rubber-lined (D-008)."}
  - {tag: X-301, type: Package, service: "Phenol recovery: solvent extraction of the collected liquors and stripping of the solvent (X301, specified split)",
     notes: "95 % of the phenol back to T-101 (ASSUMED), LP steam 22.7 kW (ASSUMED 2 kWh per kg phenol), 2 kW pumps; solvent and stages to be chosen at basic engineering (open input, D-008)."}
