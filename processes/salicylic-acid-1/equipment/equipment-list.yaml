# Equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes per batch from the recipe (D-003: 2865.51 kg of product every 22.7 h, 349.0 batches a
# year) and the models; design pressures, temperatures and materials are not set yet (basic
# engineering); materials named are usual choices for hot caustic phenoxide, dry phenoxide under
# CO2 and acidic sulfate liquors, to be confirmed (open input). All values ASSUMED.
schema: cheme/equipment/v1
equipment:
  - {tag: T-101, type: Tank, service: "Phenol tank: fresh and recovered phenol kept molten at 343 K",
     notes: "Heated (phenol melts at 314.04 K), nitrogen-blanketed, vented through a carbon filter (D-004, D-010); one batch's 2.30 t of phenol at least; stainless steel."}
  - {tag: R-101, type: StirredTankReactor, service: "Neutraliser: 50 wt% caustic soda dosed into the molten phenol at 343 K (R101)",
     notes: "5 m3 (R10 preferred size, 72 % full with 3.58 m3 of phenoxide solution) as the recipe sizes it from R101's semi-batch model (core ADR 0052); jacket on cooling water, 5.85 kW year average (Q1); caustic dosed over 1 h, interlocked with the temperature and the agitator (D-005, D-011); stainless steel or nickel-clad (hot caustic phenoxide)."}
  - {tag: R-102, type: StirredTankReactor, service: "Kneader-reactor (mixer-kneader with counter-rotating blades): the phenoxide dried at ambient pressure, then at 4 kPa(a) to 463 K (D101), carboxylated with CO2 at 463 K (R102), cooled and taken up in water",
     notes: "6.3 m3 (R10 preferred size), sized by hand from the solution it dries: about 4.23 t a batch at an ASSUMED 1300 kg/m3 (3.25 m3) over the 60 % working fill of a kneader is 5.4 m3 (52 % full with the solution; the recipe would size it from R102's content, 2.62 m3, only; D-003, D-006); hot-oil circuit from HP steam for the drying (Q2 83.3 kW year average, core's dryer model), cooled through the oil circuit to cooling water during the carboxylation (Q3 11.5 kW, core's semi-batch model) and for the cool-down from 463 to 373 K before the water fill (Q9 11.9 kW, the crude and the metal, scripts/balance.py); free volume about 3.7 m3 at the end of the hold, which holds about 0.48 kmol (21 kg) of CO2 at 500 kPa(a), let down to the vent after the hold (D-005); design pressure for the 5 bar CO2 hold and full vacuum (ASSUMED 10 bar(g)/FV, above the 700 kPa(a) CO2 supply); drive and vacuum pump 20 kW year average; CO2 dosing interlocked with the temperature and the drive (D-011); the bottleneck (22.7 h a batch); stainless steel or nickel (hot phenoxide, SRC-1 Heinz List type, US 3 880 407)."}
  - {tag: E-102, type: HeatExchanger, service: "Vapour condenser of the kneader: water and phenol from the drying",
     notes: "Condenses 62.5 kg/h year average (about 1.42 t a batch over 13.95 h) of water with 1.6 wt% phenol to T-301; cooling water, 43.0 kW year average (Q8, the latent heats D101 uses and the condensate cooled to 313 K, scripts/balance.py; D-009); with the vacuum pump K-101 for the 4 kPa(a) stage (D-006)."}
  - {tag: R-201, type: StirredTankReactor, service: "Acidifier and first-crop crystalliser: the stock solution with the last batch's second crop acidified with sulfuric acid at 328 K, the first crop crystallised",
     notes: "40 m3 (R10 preferred size, 87 % full with about 36.2 t of slurry a batch at about 1040 kg/m3, checked by hand: core sizes no vessel from a conversion step, D-003); jacket on LP-steam hot water, 32.6 kW year average net heat (Q4: the dissolution water warmed to 328 K, less the heat of the crude from 373 K and of the acid, core's conversion duty); acid dosed over 1.5 h with the temperature controlled; rubber- or glass-lined (sulfuric acid, salicylic acid)."}
  - {tag: C-201, type: Centrifuge, service: "Peeler centrifuge: the first crop spun, washed with water and spun dry (F201, W201, F203)",
     notes: "Takes the slurry in loads, 3.5 h a batch (ASSUMED); 0.15 kg of liquor per kg of cake, 99.5 % of the crystals to the cake (ASSUMED, D-008); 4 kW year average; stainless steel, Hastelloy or rubber-lined basket (acidic sulfate liquor)."}
  - {tag: V-202, type: Vessel, service: "Second-crop crystalliser: the mother liquor cooled from 328 to 298 K on chilled water (CR202)",
     notes: "About 40 m3 (the first mother liquor, about 33 t a batch); jacket or external cooler on chilled water, 48.3 kW year average (Q5, core's crystallizer duty); agitated; rubber-lined (D-007)."}
  - {tag: F-202, type: Filter, service: "Nutsche filter for the second crop (F202), its cake back to R-201",
     notes: "About 300 kg of wet cake a batch; 0.3 kg liquor per kg, 99 % recovery (ASSUMED, D-008)."}
  - {tag: D-201, type: Dryer, service: "Conical vacuum dryer: the washed product dried at 333 K (D201)",
     notes: "8 m3 (R10 preferred size, 51 % full with 4.1 m3 of wet cake) as the recipe sizes it (core ADR 0057), 11.3 m2 heated; 10.81 h a batch with the drying from D201's rate (recipe); hot water from LP steam, 21.1 kW year average (Q6, core's dryer model); 333 K, below the 349 K at which salicylic acid sublimes (Wikipedia), with a dust filter and the vacuum condenser E-202 (D-008, D-010); 3 kW; stainless steel."}
  - {tag: E-202, type: HeatExchanger, service: "Vacuum condenser of the product dryer: the water evaporated from the cake (E202)",
     notes: "Condenses 18.5 kg/h year average of water with traces of phenol at about 10 kPa(a) (ASSUMED) to T-301; cooling water, 12.7 kW year average (Q10, D201's latent heats and the condensate cooled to 303 K, scripts/balance.py; D-008, D-009); behind D-201's dust filter; stainless steel."}
  - {tag: T-301, type: Tank, service: "Liquor collection: the mother liquor, the wash filtrate and the condensates (M301)",
     notes: "Buffer for the phenol recovery, about one batch's 38 t; rubber-lined (D-008)."}
  - {tag: X-301, type: Package, service: "Phenol recovery: solvent extraction of the collected liquors and stripping of the solvent (X301, specified split)",
     notes: "95 % of the phenol back to T-101 (ASSUMED), LP steam 22.7 kW (ASSUMED 2 kWh per kg phenol), 2 kW pumps; solvent and stages to be chosen at basic engineering (open input, D-008)."}
