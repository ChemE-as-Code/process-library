schema: cheme-as-code/process/v1
id: salicylic-acid-1
title: Salicylic acid by batch Kolbe-Schmitt carboxylation of dry sodium phenoxide, acidification and two crops (1000 t/a)
summary: >-
  Phenol is neutralised with caustic soda, dried to sodium phenoxide in a kneader-reactor and
  carboxylated with CO2 at 463 K in one stage; the salicylate is acidified with sulfuric acid and
  crystallised in two crops, the phenol recovered. Concept stage, 2796.5 kg per batch every
  22.15 h, thermal screening, preliminary gate-to-gate LCI.
description: |
  Molten phenol (fresh, with the phenol recovered from the liquors) is neutralised with 50 wt%
  caustic soda dosed over 1 h at 343 K, 23.2 mol of phenol per 23.0 mol of NaOH. The phenoxide
  solution is dried in a kneader-reactor with counter-rotating blades at ambient pressure, then
  at 4 kPa(a) to 463 K, and CO2 is dosed into the dry powder at 463 K over 5 h and held 1 h: the
  one-stage Kolbe-Schmitt carboxylation of US 4 376 867 A (Jansen and Wolff, Example I), which
  gives sodium salicylate directly above 175 C with under 0.5 % of non-salicylic acids. The
  crude is taken up in about 9 kg of water per kg of sodium salicylate and acidified with
  sulfuric acid at 328 K; the first crop is centrifuged, washed with water and vacuum-dried at
  333 K, the mother liquor is cooled to 298 K for a second crop that goes back to the next
  acidification, and 95 % of the phenol in the collected liquors is recovered (a specified
  split). Model yield 87.8 % of salicylate on the phenol charged per batch (the source's 88 %),
  96.6 % of it isolated in the two crops, 95.5 % overall on the fresh phenol; the dried product
  is 99.7 wt% salicylic acid.

  The batch is modelled with cheme-as-code's semi-batches (reactor: semibatch, core ADR 0050),
  the CO2 a dosed gas of which the share that reacts in the source is taken up and the rest
  vented (ADR 0054), core's dryer for the phenoxide and the product (ADR 0057), core's
  crystallizer for both crops and the cake wash with the solubility of salicylic acid in water
  (ADR 0056), a component separator for the phenol recovery and two design specifications that
  size the caustic for 1000 t/a and the fresh phenol for the source's charge ratio (ADR 0070),
  the second-crop and phenol recycles converged at two tears (ADR 0060) and the batch recipe
  (ADRs 0051, 0052, 0057): the kneader-reactor is the bottleneck (cycle 22.15 h, 357.6 batches a
  year), the recipe sizes the neutraliser, the kneader and the product dryer. The kinetics and
  every heat of reaction are ASSUMED. The thermal screening gives MTSRs of 343.4 K (neutraliser,
  MTT 373.15 K) and 464.4 K (carboxylation, MTT 493.15 K ASSUMED): the gas-dosed carboxylation
  stops when the CO2 stops. See DESIGN.md for every assumption.
families: [oxygenates]
keywords: [salicylic acid, 2-hydroxybenzoic acid, Kolbe-Schmitt, carboxylation, CO2 utilisation, sodium phenoxide, sodium phenolate, phenol, caustic soda, sodium salicylate, sulfuric acid, acidification, crystallisation, second crop, centrifuge, vacuum drying, kneader-reactor, mixer-kneader, phenol recovery, semi-batch, batch, gas dosing, thermal screening, aspirin intermediate, fine chemicals]
facets:
  feedstock_basis: [fossil, mineral, atmospheric]
  product_classes: [chemicals]
  unit_operations: [reaction, drying, crystallization, filtration, extraction]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, kinetics, heats of
# reaction, the filters, the drying rates and the phenol recovery are assumed; ratios and
# conditions from the patent's Example I (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept batch PFD with closed mass, component and element balances (cheme validate, cheme
    process streams: 5 blocks and 14 steps within tolerance; the second-crop and phenol recycles
    converged at the tears S19 and S20). The feeds are sized by two design specifications: the
    caustic for 1000 t/a of dried product, with the CO2, the dissolution water, the acid and the
    wash water following it at fixed ratios, and the fresh phenol for US 4 376 867 A Example I's
    23.2 mol of phenol per 23.0 mol of NaOH. The semi-batches R101 and R102, the dryers D101 and
    D201, the conversion step R201, the crystallizers CR201, CR202 and W201, the filters and the
    phenol recovery are calculated by cheme process propagate, which writes the semi-batches',
    the acidifier's and the second crop's duties (Q1, Q3, Q4, Q5); the dryers' duties Q2 and Q6
    are core's dryer model as reported by cheme process crystallizers (core does not write them).
    The CO2 taken up is calibrated to Example I (20.48 mol of acids from 23.0 mol of NaOH), the
    by-product share to its 4-hydroxybenzoic and 4-hydroxyisophthalic acids. The recipe's rate
    agrees with the flowsheet (no cheme.recipe-basis finding); it sizes R-101 (5 m3), R-102 (5 m3)
    and D-201 (8 m3); R-201 (40 m3) is sized by hand. Thermal screening (cheme process
    reactor-hazards): R101 dT_ad 70.4 K, accumulation 0.30 %, MTSR 343.4 K against an MTT of
    373.15 K; R102 dT_ad 229.4 K, accumulation 0.51 %, MTSR 464.4 K against an ASSUMED MTT of
    493.15 K; no gas forms at a cooling failure; no criticality class without a TD24.
    Preliminary gate-to-gate LCI: the phenol linked to acetone-1, the caustic to chlor-alkali-1,
    the CO2 to carbon-capture-1, the acid to sulfuric-acid-1, the steam as heat; water, power,
    cooling and wastewater are gaps. cheme maturity reaches no level (assumed kinetics, heats
    and separations); the claim `maturity: concept` is the lowest value of the schema, not an
    evidenced level. Not reviewed. Needs cheme-as-code 1.12.0.
