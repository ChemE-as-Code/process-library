# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Acetaldehyde by the one-stage Wacker process (ethylene + oxygen, aqueous PdCl2/CuCl2),
# 100 kt/a (D-001, D-002). Where the values come from:
# - temperatures, pressures and every separator specification are design choices (ASSUMED,
#   DESIGN.md decisions); the water and steam rates are scaled from the 13 t/h example of
#   US 4,237,073 (D-006, D-008);
# - the reactor outlet S07 is calculated by cheme from the selectivity model of R101
#   (process/reactions.yaml, D-004); mixers, pass-through steps and the purge splitter by
#   `cheme process propagate --fill`;
# - separator outlets, the cycle-gas loop (tear stream S15) and all duties come from the
#   independent balance scripts/acet_balance.py (D-006), given here as ASSUMED: no property
#   package of cheme covers the aqueous acetaldehyde system.
schema: cheme/process/v1
kind: flowsheet
title: Acetaldehyde, one-stage Wacker oxidation of ethylene (100 kt/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 12500 kg/h acetaldehyde product (99.9 wt%), 8000 h/a (D-002)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: ETH, title: "Ethylene, polymer grade (boundary feed; e.g. a steam cracker)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: OXY, title: Oxygen 99.5 mol% (boundary feed; e.g. from asu-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: HCLA, title: Hydrochloric acid 30 wt% (catalyst make-up), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: DEMIN, title: Demineralised water, category: raw_material, ports: [{id: r101, direction: out}, {id: c201, direction: out}]}
  - {id: PW, title: Process water to the scrubber, category: raw_material, ports: [{id: out, direction: out}]}
  - id: MPS
    title: MP steam 1000 kPa(a), direct (catalyst regenerator)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1000, provenance: assumed, source: "design basis, D-009"}
      supply_temperature: {value: 453.0, provenance: assumed, source: "saturation at 1000 kPa(a), D-009"}
    ports: [{id: out, direction: out}]
  - id: LPS
    title: LP steam 450 kPa(a), direct (live steam to the columns)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis, D-009"}
      supply_temperature: {value: 421.0, provenance: assumed, source: "saturation at 450 kPa(a), D-009"}
    ports: [{id: c201, direction: out}, {id: c202, direction: out}]
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: k101, direction: out, kind: energy}
      - {id: r101, direction: out, kind: energy}
      - {id: c101, direction: out, kind: energy}
      - {id: c202, direction: out, kind: energy}
products:
  - {id: PROD, title: Acetaldehyde 99.9 wt% to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: PURGE, title: Cycle-gas purge to the thermal oxidiser, category: off_gas, ports: [{id: in, direction: in}]}
  - {id: LIGHTS, title: Light ends to the thermal oxidiser, category: off_gas, ports: [{id: in, direction: in}]}
  - {id: HEAVY, title: Crotonaldehyde and chlorinated aldehyde side draw to incineration, category: by_product, ports: [{id: in, direction: in}]}
  - {id: WW, title: Waste water to biological treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-009"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-009"}
      min_approach: {value: 5, provenance: assumed, source: D-009}
    ports:
      - {id: e101, direction: in, kind: energy}
      - {id: e102, direction: in, kind: energy}
      - {id: c201, direction: in, kind: energy}
      - {id: c202, direction: in, kind: energy}
      - {id: e203, direction: in, kind: energy}
      - {id: e204, direction: in, kind: energy}

blocks:
  - id: RXN
    title: Wacker reaction and catalyst regeneration
    class: ReactingChemicals
    ports:
      - {id: eth, direction: in}
      - {id: rec, direction: in}
      - {id: o2, direction: in}
      - {id: hcl, direction: in}
      - {id: water, direction: in}
      - {id: steam, direction: in}
      - {id: gas, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: REC
    title: Gas cooling, scrubbing and cycle gas
    class: SeparatingByPhysicalProcess
    ports:
      - {id: gas, direction: in}
      - {id: water, direction: in}
      - {id: cond, direction: out}
      - {id: crude, direction: out}
      - {id: purge, direction: out}
      - {id: rec, direction: out}
      - {id: power1, direction: in, kind: energy}
      - {id: power2, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: DIS
    title: Crude acetaldehyde distillation
    class: Distilling
    ports:
      - {id: cond, direction: in}
      - {id: crude, direction: in}
      - {id: water, direction: in}
      - {id: steam1, direction: in}
      - {id: steam2, direction: in}
      - {id: lights, direction: out}
      - {id: prod, direction: out}
      - {id: heavy, direction: out}
      - {id: ww, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: cw3, direction: out, kind: energy}
      - {id: cw4, direction: out, kind: energy}

steps:
  # --- RXN
  - id: M101
    block: RXN
    title: Cycle gas and fresh ethylene
    class: Mixing
    ports:
      - {id: eth, direction: in, delegates: eth}
      - {id: rec, direction: in, delegates: rec}
      - {id: out, direction: out}
  # D-004, D-005: bubble-column reactor with the aqueous PdCl2/CuCl2 catalyst, boiling-cooled
  # (the heat of reaction evaporates water); the catalyst regenerator R-102 (side stream heated
  # with MP steam) is lumped into this step.
  - id: R101
    block: RXN
    title: Wacker reactor (bubble column) with catalyst regenerator
    class: ReactingChemicals
    reactions: [R1, R2, R3, R4, R5, R6, R7]
    reactor: conversion
    selectivity:
      key: C2H4
      conversion: 0.35
      products: {ACH: 0.963599596, ACOH: 0.007077856, CO2: 0.017189080, CAC: 0.016177958, CROT: 0.001263903, ETCL: 0.001516684, MECL: 0.001011122}
      provenance: assumed
      source: "D-004: per-pass conversion ASSUMED; selectivities from the ethylene fate per 100 mol fed (95 acetaldehyde, 1.9 chlorinated aldehydes, 1.1 unconverted, 0.8 CO2, 0.7 acetic acid; Wikipedia 'Wacker process', Industrial process, citing Ullmann's) with our split of the minor products"
    links: [{target: equipment, ref: R-101}, {target: equipment, ref: R-102}]
    ports:
      - {id: gas, direction: in}
      - {id: o2, direction: in, delegates: o2}
      - {id: hcl, direction: in, delegates: hcl}
      - {id: water, direction: in, delegates: water}
      - {id: steam, direction: in, delegates: steam}
      - {id: ret, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E101
    block: RXN
    title: Precondenser (water back to the reactor)
    class: Cooling
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: V101
    block: RXN
    title: Precondenser separator
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: in, direction: in}
      - {id: liq, direction: out}
      - {id: gas, direction: out, delegates: gas}
  # --- REC
  - id: E102
    block: REC
    title: Process gas cooler
    class: Cooling
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in, delegates: gas}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: V102
    block: REC
    title: Cooler separator (acetaldehyde-rich condensate)
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-102}]
    ports:
      - {id: in, direction: in}
      - {id: liq, direction: out, delegates: cond}
      - {id: gas, direction: out}
  - id: C101
    block: REC
    title: Acetaldehyde water scrubber
    class: Absorbing
    links: [{target: equipment, ref: C-101}, {target: equipment, ref: P-101}]
    ports:
      - {id: gas, direction: in}
      - {id: water, direction: in, delegates: water}
      - {id: top, direction: out}
      - {id: liq, direction: out, delegates: crude}
      - {id: power, direction: in, kind: energy, delegates: power2}
  - id: K101
    block: REC
    title: Cycle-gas compressor
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power1}
  - id: X101
    block: REC
    title: Cycle-gas purge
    class: SplittingMaterial
    split: {purge: 0.0051298}
    ports:
      - {id: in, direction: in}
      - {id: purge, direction: out, delegates: purge}
      - {id: rec, direction: out, delegates: rec}
  # --- DIS
  - id: T201
    block: DIS
    title: Crude acetaldehyde tank
    class: Mixing
    symbol: TANK_CONE_ROOF_SHAPE
    links: [{target: equipment, ref: T-201}]
    ports:
      - {id: cond, direction: in, delegates: cond}
      - {id: scrub, direction: in, delegates: crude}
      - {id: out, direction: out}
  - id: E201
    block: DIS
    title: Crude preheater (feed side of the feed/effluent exchanger)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy}
  - id: C201
    block: DIS
    title: Light-ends column (extractive, live steam)
    class: Distilling
    links: [{target: equipment, ref: C-201}]
    ports:
      - {id: feed, direction: in}
      - {id: water, direction: in, delegates: water}
      - {id: steam, direction: in, delegates: steam1}
      - {id: top, direction: out, delegates: lights}
      - {id: bot, direction: out}
      - {id: cond, direction: out, kind: energy, delegates: cw1}
  - id: C202
    block: DIS
    title: Acetaldehyde column (live steam, side draw)
    class: Distilling
    links: [{target: equipment, ref: C-202}, {target: equipment, ref: P-201}]
    ports:
      - {id: feed, direction: in}
      - {id: steam, direction: in, delegates: steam2}
      - {id: top, direction: out}
      - {id: side, direction: out, delegates: heavy}
      - {id: bot, direction: out}
      - {id: cond, direction: out, kind: energy, delegates: cw2}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E203
    block: DIS
    title: Product cooler
    class: Cooling
    links: [{target: equipment, ref: E-203}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: prod}
      - {id: cw, direction: out, kind: energy, delegates: cw3}
  - id: E202
    block: DIS
    title: Waste-water side of the feed/effluent exchanger
    class: Cooling
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: out, kind: energy}
  - id: E204
    block: DIS
    title: Waste-water trim cooler
    class: Cooling
    links: [{target: equipment, ref: E-204}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: ww}
      - {id: cw, direction: out, kind: energy, delegates: cw4}

