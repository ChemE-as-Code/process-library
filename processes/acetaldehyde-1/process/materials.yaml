# Components and templates of the process. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
#
# One-stage Wacker oxidation of ethylene to acetaldehyde (DESIGN.md D-001, D-004). The catalyst
# solution (PdCl2, CuCl2/CuCl, HCl in water) stays inside the reactor and regenerator and is
# not a stream component; the HCl make-up that replaces the chlorine leaving in the chlorinated
# by-products is. The chlorinated aldehydes (mono-, di- and trichloroacetaldehyde) are lumped as
# 2-chloroacetaldehyde (CAC), the "minor products" as crotonaldehyde, ethyl chloride and methyl
# chloride (D-004). Argon stands for all inerts of the oxygen feed (D-003). Identities: PubChem;
# ideal_gas data: `cheme chemistry thermo` (chemicals package: ATcT, CRC, Yaws formation
# enthalpies; Poling, TRCIG or Joback heat capacities, each named in its source).
schema: cheme/process/v1
kind: materials
components:
