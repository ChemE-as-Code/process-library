  - {id: wastewater, title: Column bottoms waste water, components: [H2O, ACH, ACOH, CAC]}
# property_method is a placeholder: no benchmarked package of cheme covers the aqueous
# acetaldehyde / acetic acid / chlorinated aldehyde system or the catalyst solution
# (cheme process props --coverage, DESIGN.md D-006).
property_method:
  adapter: thermo
  status: placeholder
