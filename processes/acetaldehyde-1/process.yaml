# Process Atlas manifest of acetaldehyde-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: acetaldehyde-1
title: Acetaldehyde by the one-stage Wacker oxidation of ethylene (100 kt/a)
summary: >-
  Ethylene and oxygen react in an aqueous PdCl2/CuCl2 catalyst solution in a boiling bubble
  column; the cycle gas is cooled, scrubbed with water and recycled with a purge, and the crude
  acetaldehyde is purified in two live-steam columns. Ethylene and oxygen are boundary feeds.
  Concept stage.
description: |
  One-stage (Hoechst-Wacker) process: ethylene and 99.5 % oxygen are fed to a bubble-column
  reactor with the aqueous palladium/copper chloride catalyst at about 130 C and 400 kPa(a). The
  heat of reaction evaporates water; a precondenser returns it, a cooler condenses an
  acetaldehyde-rich aqueous condensate and a water scrubber recovers the rest of the
  acetaldehyde. The scrubbed cycle gas is recompressed and recycled; a small purge limits CO2,
  argon and ethane. Crude acetaldehyde (about 12 wt%) passes an extractive light-ends column
  (CO2, chloroethane, chloromethane) and the acetaldehyde column, which gives 99.9 wt% product
  overhead, a side draw of crotonaldehyde and chlorinated aldehydes, and waste water with the
  acetic acid at the bottom. A catalyst side stream is regenerated with direct steam.

  All values are concept estimates (scripts/acet_balance.py of the engineering files): the
  ethylene fate follows the product distribution reported for the industrial process; water,
  steam and waste-water rates are scaled from the 13 t/h example of US 4,237,073; conversion per
  pass and the cycle-gas oxygen content are assumptions. See DESIGN.md for every assumption and
  gated step.
families: [oxygenates]
keywords: [acetaldehyde, Wacker process, ethylene oxidation, palladium chloride, copper chloride, homogeneous catalysis, oxygen, cycle gas, absorption, distillation]
facets:
  feedstock_basis: [fossil]
  product_classes: [chemicals]
  unit_operations: [reaction, compression, absorption, distillation, heat-exchange]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Mass, component and element
# balances close in cheme; energy closure is not evaluable in core (no property package covers
# the aqueous acetaldehyde system), duties come from the independent script.
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD with closed mass, component and element (reaction extent) balances in every
    block and step (cheme validate, cheme process streams). The reactor is a selectivity model
    calculated by cheme (per-pass conversion ASSUMED 35 %, selectivities from the reported
    ethylene fate); separator outlets, the cycle-gas loop and all duties are specified values of
    an independent script (scripts/acet_balance.py). Consumptions agree with the 1980 patent
    example (ethylene 677 vs 692 kg/t, oxygen 410 vs 408 kg/t, waste water 8.7 vs 8.7 m3/t).
    Energy closure is not evaluable in core (core #315). The preliminary gate-to-gate LCI in
    lca/ leaves every background unmapped (gaps). Not reviewed. Main products and feeds are
    listed under chemistry with their chemicals registry entries (issue #251).
chemistry:
  inputs:
    - {chemical: ethylene, role: feedstock, note: "feed:ETH: polymer-grade ethylene, 0.676 kg/kg acetaldehyde (boundary feed; e.g. a steam cracker such as ethylene-1)"}
    - {chemical: hydrogen-chloride, role: feedstock, note: "feed:HCLA: hydrochloric acid 30 wt% (catalyst make-up), counted by mass of the solution"}
    - {chemical: oxygen, role: feedstock, inventory_key: "feed:OXY", note: "99.5 mol% O2 at 600 kPa(a), 410 kg/t (boundary feed; e.g. processes/asu-1)"}
    - {chemical: water, role: feedstock, inventory_key: "feed:DEMIN", note: "Demineralised water: reactor make-up and extraction water, 1.27 t/t"}
    - {chemical: water, role: feedstock, inventory_key: "feed:PW", note: "Process water to the acetaldehyde scrubber, 5.96 t/t"}
  outputs:
    - {chemical: acetaldehyde, role: main-product, inventory_key: "product:PROD", note: "Acetaldehyde 99.9 wt% to storage"}
    - {chemical: wastewater, role: waste, inventory_key: "product:WW", note: "Column bottoms with acetic acid, residual aldehydes and organic chlorine, 8.7 t/t, to biological treatment"}
    - {chemical: carbon-dioxide, role: emission, inventory_key: "product:PURGE", note: "Cycle-gas purge (CO2, ethylene, argon, ethane, O2) to a thermal oxidiser outside the boundary"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "Cycle-gas compressor and pumps (ASSUMED electric drives), 42.8 kWh/t"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "LP steam 450 kPa(a) injected live into the two columns, 1.31 t/t"}
    - {chemical: steam, role: utility, inventory_key: "feed:MPS", note: "MP steam 1000 kPa(a) injected into the catalyst regenerator, 0.115 t/t"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "25/35 C (ASSUMED)"}
