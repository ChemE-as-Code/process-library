# Equipment list. Schema: `cheme schema equipment`.
# Concept stage: the items the PFD (process/flowsheet.yaml) needs, no P&ID yet (no sheet).
# Design pressure and temperature are ASSUMED concept values (D-012): the highest operating
# value of the balance (scripts/acet_balance.py) + 10 % (at least + 2 bar) and + 25 K. Sizes,
# dimensions and weights come at basic engineering (datasheets). Materials: the wet chloride
# catalyst solution is extremely corrosive (US 5,557,014): titanium or ceramic/rubber-lined steel
# in the reaction section (D-012), stainless steel downstream, open input.
schema: cheme/equipment/v1
equipment:
  # ---- reaction (block RXN)
  - {tag: R-101, type: Vessel, service: Wacker reactor (bubble column with the aqueous PdCl2/CuCl2 catalyst), design_pressure_barg: 5, design_temperature_degc: 155, material: "rubber/ceramic-lined CS, Ti internals",
     notes: "403 K, 400 kPa(a) top; 35 % ethylene conversion per pass; boiling-cooled, 19.2 MW heat of reaction evaporates water (D-004, D-005). Volume not sized: no kinetics. ASSUMED."}
  - {tag: R-102, type: Vessel, service: Catalyst regenerator (side stream heated with direct steam), design_pressure_barg: 10, design_temperature_degc: 205, material: Ti,
     notes: "165-180 C with direct MP steam per US 4,237,073; 1.44 t/h steam (D-006). Lumped into step R101 of the PFD. ASSUMED."}
  - {tag: P-102, type: CentrifugalPump, service: Catalyst circulation pump to the regenerator, design_pressure_barg: 12, design_temperature_degc: 205, material: Ti,
     notes: "50 m3/h x 1000 kPa, ~20 kW (D-009, ASSUMED)."}
  - {tag: E-101, type: TubularHeatExchanger, service: Precondenser (water back to the reactor), design_pressure_barg: 5, design_temperature_degc: 155, material: Ti,
     notes: "403 -> 383 K, 7.4 MW to cooling water, 10.7 t/h condensate returned (D-005). ASSUMED."}
  - {tag: V-101, type: Vessel, service: Precondenser separator, design_pressure_barg: 5, design_temperature_degc: 135, material: "lined CS / Ti", notes: "ASSUMED."}
  # ---- gas cooling, scrubbing and cycle gas (block REC)
  - {tag: E-102, type: TubularHeatExchanger, service: Process gas cooler, design_pressure_barg: 5, design_temperature_degc: 135, material: SS,
     notes: "383 -> 318 K, 13.3 MW to cooling water; condenses 20.5 t/h acetaldehyde-rich condensate (D-007). ASSUMED."}
  - {tag: V-102, type: Vessel, service: Cooler separator, design_pressure_barg: 5, design_temperature_degc: 70, material: SS, notes: "ASSUMED."}
  - {tag: C-101, type: Column, service: Acetaldehyde water scrubber, design_pressure_barg: 5, design_temperature_degc: 70, material: SS,
     notes: "74.5 t/h wash water; acetaldehyde to 0.05 mol% in the cycle gas (D-007). Stages not calculated (no property package). ASSUMED."}
  - {tag: P-101, type: CentrifugalPump, service: Wash-water and crude pumps, design_pressure_barg: 6, design_temperature_degc: 70, material: SS,
     notes: "75 m3/h x 500 kPa and 110 m3/h x 400 kPa, 32 kW together (D-009, ASSUMED)."}
  - {tag: K-101, type: CentrifugalCompressor, service: Cycle-gas compressor, design_pressure_barg: 6.5, design_temperature_degc: 95, material: SS,
     notes: "1372 kmol/h, 370 -> 520 kPa(a), 461 kW shaft at isentropic efficiency 0.75 (D-009, ASSUMED)."}
  # ---- distillation (block DIS)
  - {tag: T-201, type: Tank, service: Crude acetaldehyde tank, design_pressure_barg: 4, design_temperature_degc: 70, material: SS,
     notes: "104 t/h crude, ~12 wt% acetaldehyde; vented to the thermal oxidiser (D-008). Hold-up not sized. ASSUMED."}
  - {tag: E-201, type: TubularHeatExchanger, service: Crude / waste-water feed-effluent exchanger, design_pressure_barg: 5, design_temperature_degc: 160, material: SS,
     notes: "8.5 MW recovered: crude 313 -> 383 K, waste water 407 -> 339 K (D-008). Steps E201 and E202 of the PFD. ASSUMED."}
  - {tag: C-201, type: Column, service: "Light-ends column (extractive with water, live steam)", design_pressure_barg: 3, design_temperature_degc: 150, material: SS,
     notes: "200 kPa(a); 2.9 t/h live LP steam, 1.4 t/h extraction water; overhead CO2, chloroethane, chloromethane, dissolved ethylene; condenser 0.39 MW (D-008). ASSUMED."}
  - {tag: C-202, type: Column, service: "Acetaldehyde column (live steam, side draw)", design_pressure_barg: 3.5, design_temperature_degc: 160, material: SS,
     notes: "270-300 kPa(a); 13.5 t/h live LP steam; 99.9 wt% acetaldehyde overhead, crotonaldehyde/chlorinated-aldehyde side draw, waste water bottoms; condenser 7.2 MW, implied reflux ratio ~2.5 (D-008). ASSUMED."}
  - {tag: P-201, type: CentrifugalPump, service: "Reflux, product and waste-water pumps", design_pressure_barg: 5, design_temperature_degc: 160, material: SS,
     notes: "22 kW together (D-009, ASSUMED)."}
  - {tag: E-203, type: TubularHeatExchanger, service: Product cooler, design_pressure_barg: 5, design_temperature_degc: 75, material: SS,
     notes: "323 -> 303 K, 0.15 MW (D-008). ASSUMED."}
  - {tag: E-204, type: TubularHeatExchanger, service: Waste-water trim cooler, design_pressure_barg: 5, design_temperature_degc: 90, material: SS,
     notes: "339 -> 308 K, 3.9 MW (D-008). ASSUMED."}
