# Tier 0 form, process-library#313 pilot without a flowsheet. Every amount is the formula of its parameters;
# core's validator re-checks each. The main numbers are a licensor's, marked as such.
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: cumene-zeolite-alkylation
title: Cumene by zeolite alkylation of benzene with propylene
description: Tier 0 screening estimate per 1 t of cumene, gate-to-gate, with transalkylation of the polyisopropylbenzenes.
  Stoichiometry with a licensor's benzene figure and net steam, air emissions from US EPA facility data,
  electricity from core's Tier 0 default.
basis: 1000 kg of cumene
boundary: 'gate-to-gate: alkylation, transalkylation, benzene, cumene and PIPB columns; steam and power
  from outside'
technology: zeolite-catalysed alkylation and transalkylation with distillation; SPA and AlCl3 routes are
  not modelled
geography:
  description: 'Mixed: a licensor''s design figures and US facility emissions (2011); no single site.'
classification:
  isic: '2011'
system_boundary:
  included:
  - benzene and propylene
  - net steam and electricity
  - heavy ends
  - benzene, propylene and cumene to air
  excluded:
  - TODO oily water and vacuum vents (named by the brochure, PDF p. 3, not quantified)
  - 'TODO other facility air releases in the EPA sheet: not attributable to this process'
  - 'TODO catalyst: run length up to 8 years, the brochure gives no charge'
  - 'propane in the propylene feed: polymer-grade feed taken'
  - 'fuel beyond the steam: the EPA fuel total is facility-wide, see README'
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: GLO
year: 2018
valid_until: 2023
time:
  start: 2011
  description: US emissions of 2011; licensor's figures of a brochure dated 11-2018. valid_until is the
    reference year + 5 (system-model section 6), so it has already lapsed.
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation (heavy ends are a residue). DEVIATION from system-model
    section 2: feed:steam is the licensor''s net figure (HP import less LP export), so it embeds a credit
    for exported steam, which the cut-off model does not give. Gross import and export are not stated,
    so it cannot be corrected here and is a lower view of the steam burden.'
