modelling:
  principle: attributional
  multifunctionality: 'unallocated multi-output dataset; default allocation exergy: D-013: the propane
    (LPG), the heavy ends (fuel) and the exported LP steam are co-products of cumene. The library allocates
    exported steam by energy or exergy, never by credit (docs/system-model.md section 2); exergy is used
    for all four because it weighs the steam by its work potential and the hydrocarbons by their chemical
    exergy on one basis (aniline-1 D-013 is the precedent). Cumene carries 97.1 %, the LPG 2.2 %, the
    heavy ends 0.3 % and the steam 0.4 %. The unallocated result is kept in the comparison; mass allocation
    does not apply (the steam is counted in kWh).'
