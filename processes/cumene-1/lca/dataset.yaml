    not claimed negligible: an equipment-leak estimate needs the P&ID component counts, which do not exist
    at the concept stage; the pilot''s US EPA facility figures (about 6, 8 and 19 g/t of benzene, propylene
    and cumene to air, doi:10.23719/1503030) are kept as the order of magnitude in DESIGN.md D-012, not
    as this plant''s emissions'
  source: D-012, D-013
- key: emission-excluded:storage-tanks
  title: storage-tank emissions of the plant
  direction: output
  reason: 'benzene, propylene, cumene and LPG storage is outside the battery limit (design basis): its
    breathing losses belong to the storage, not to this plant boundary'
  source: design basis
- key: emission-excluded:vacuum-vent
  title: effluent emissions of C-204
  direction: output
  reason: the C-204 vacuum system vents non-condensables with traces of DIPB and cumene; not quantified
    (no vacuum system designed, D-008); the Versalis brochure names vacuum pump vents and oily water as
    the only releases (PDF p. 3)
  source: D-008, D-012
- key: emission-excluded:oily-water
  title: effluent emissions of the plant
  direction: output
  reason: no process water is fed or formed in the model; the oily water the Versalis brochure names (feed-water
    carry-over, drains) is not quantified (I-07)
  source: D-012
- key: emission-excluded:catalyst-regeneration
  title: non-routine emissions of R-101, R-102
  direction: output
  reason: 'ex-situ regeneration of the zeolite (coke burn-off) every few years and the catalyst charge
    are not quantified: no open charge or life figure for this design (the brochure gives a run length
    of up to 8 years, no mass); open gap, not negligible by evidence'
  source: D-012
