      exergy: 43550.5
      source: 'scripts/allocation_exergy.py: standard chemical exergy of liquid S25 (99.97 wt% cumene)
        from the ideal-gas formation data of process/materials.yaml and Szargut''s standard element exergies
        (Szargut, Morris and Steward 1988), less the Gibbs energy of condensation at 298.15 K; physical
        exergy neglected'
    LPG:
      exergy: 48523.3
      source: 'scripts/allocation_exergy.py: chemical exergy of S20 (97.8 mol% propane, 2 mol% benzene,
        0.2 mol% cumene), gas basis'
    HEAVY:
      exergy: 44592.6
      source: 'scripts/allocation_exergy.py: chemical exergy of liquid S27 (TIPB surrogate with 5 mol%
        DIPB); TIPB formation data estimated (D-005)'
    LPSX:
      exergy: 916.9
      source: 'scripts/allocation_exergy.py: exergy added per kWh of heat raised in the R-101 interbed
        coolers, saturated steam at 250 kPa(a) from boiler feed water at 378.15 K (ASSUMED), dead state
        298.15 K, 101.325 kPa, IAPWS-95 (thermo)'
  compare:
  - none
  source: 'D-013: the propane (LPG), the heavy ends (fuel) and the exported LP steam are co-products of
    cumene. The library allocates exported steam by energy or exergy, never by credit (docs/system-model.md
    section 2); exergy is used for all four because it weighs the steam by its work potential and the
    hydrocarbons by their chemical exergy on one basis (aniline-1 D-013 is the precedent). Cumene carries
    97.1 %, the LPG 2.2 %, the heavy ends 0.3 % and the steam 0.4 %. The unallocated result is kept in
    the comparison; mass allocation does not apply (the steam is counted in kWh).'
  deviation: 'The products do not come from one separation of a joint product only (the steam is raised
    by the reactor''s heat), and the WBCSD price ratio does not apply: no sourced prices at the concept
    stage and the steam counted in kWh. Exergy is the library''s rule for exported steam (D-013).'
