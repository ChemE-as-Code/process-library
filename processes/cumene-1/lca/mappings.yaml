# cumene-1's own exchange overrides for the Atlas LCI build (ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Benzene and propylene stay reported gaps: the
# shared vocabulary has no entry, and the Atlas producers of the slugs are not chosen here.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:steam":
    use: steam
    atlas: false
    source: "Net steam by mass, pressure not stated by the source: the shared background entry, not one Atlas producer's pressure level."
  "feed:benzene":
    atlas: false
    source: "The supplier is not decided: hda-1 is one route and styrene-1's by-product benzene another. Link one explicitly once chosen."
  "feed:propylene":
    atlas: false
    source: "The supplier is not decided; ethylene-1's co-product propylene and propylene-pdh-1 are candidates. Link one explicitly once chosen."
