# Reaction evidence for cumene (skill reaction-evidence-search). Schema cheme/reaction-evidence/v1.
# Citations and facts extracted from them only; no source text, table or figure is copied.
# Unit conversions of reported values (F to C, psig to MPa(a)) are marked derived.
schema: cheme/reaction-evidence/v1
kind: reaction-evidence
product: CUM
question: >-
  Liquid-phase alkylation of benzene with chemical-grade propylene (propane inert) to cumene on a
  zeolite catalyst, with transalkylation of the diisopropylbenzenes, at a scale of about 270 kt/a:
  which temperature, pressure, benzene/propylene ratio, propylene conversion and cumene/DIPB
  selectivity are reported, and which DIPB conversion in transalkylation?
searches:
  - {query: "patent cumene liquid phase alkylation benzene propylene beta zeolite example temperature pressure benzene/propylene molar ratio transalkylation diisopropylbenzene", tool: web search, date: 2026-11-03, found: [S1, S2]}
  - {query: "Versalis cumene licensing brochure (the pilot's reference, re-read)", tool: web fetch, date: 2026-11-03, found: [S3]}
sources:
  - id: S1
    kind: patent
    title: Liquid phase alkylation or transalkylation process using zeolite beta
    authors: Innes, R.A.; Zones, S.I.; Nacamuli, G.J. (Chevron Research)
    year: 1990
    patent: US4891458A
    url: https://patents.google.com/patent/US4891458A/en
    accessed: 2026-11-03
    access: full-text
    reuse: "patent text: citation and extracted facts only"
    notes: "Read on Google Patents (the description up to about character 100000, which holds Examples 4 to 8)."
  - id: S2
    kind: patent
    title: Process for producing cumene
    authors: Dandekar, A.B.; Hryniszak, M.; Stern, D.L. (ExxonMobil Chemical Patents)
    year: 2005
    patent: US6888037B2
    url: https://patents.google.com/patent/US6888037B2/en
    accessed: 2026-11-03
    access: full-text
    reuse: "patent text: citation and extracted facts only"
    notes: "MCM-49 catalyst. Gives ranges of suitable alkylation and transalkylation conditions in the description; its two examples are batch autoclave tests without a reported conversion, not used."
  - id: S3
    kind: report
    title: "Cumene: proprietary process technology (licensing brochure 11-2018)"
    authors: Versalis (Eni)
    year: 2018
    url: https://versalis.eni.com/assets/documents/versalis/it/documentazione/licensing/2022/Cumene.pdf
    accessed: 2026-11-03
    access: full-text
    reuse: "manufacturer literature, copyrighted: citation and extracted facts only"
    notes: "PDF p. 3: product yield 99.7 wt% or higher, cumene purity 99.95 wt% typical, benzene 0.651 and propylene 0.352 t/t, net steam 0.2 t/t (HP import less LP export). PDF p. 4: benzene, cumene and PIPB columns, propylene injected before each bed, PIPB transalkylated, propane recovered as propane product or fuel. A licensor's figures, no conditions of the reactors."
routes:
  - id: ZEO
    title: Liquid-phase alkylation on zeolite (beta or MWW type) with DIPB transalkylation
    equations: ["C6H6 + C3H6 -> C9H12", "C9H12 + C3H6 -> C12H18", "C12H18 + C6H6 -> 2 C9H12"]
    reactants: [BZ, C3H6]
    products: [CUM, DIPB, TIPB]
    reactions: [ALK, ALK2, ALK3, TRANS]
    status: selected
    rationale: >-
      The route of the issue (#313) and of the current licensed processes (S3); complete
      propylene conversion and DIPB transalkylation are reported on zeolite beta (S1), the
      catalyst is non-corrosive and leaves no acid waste (S3). DESIGN.md D-005.
    gaps:
      - "No open operating example at the design benzene/propylene ratio of 4 mol/mol: S1 Example 4 runs at about 7.4 (derived); the cumene/DIPB split at 4 is ASSUMED."
      - "No heavy-ends (TIPB, diphenylpropanes) selectivity reported in the sources read."
      - "No transalkylation equilibrium data read; the 40 % per pass is not checked against equilibrium (I-05)."
      - "n-Propylbenzene and propylene oligomers not reported numerically in the sources read."
  - id: SPA
    title: Vapour-phase alkylation on solid phosphoric acid
    reactants: [BZ, C3H6]
    products: [CUM, DIPB]
    status: rejected
    rationale: "Older route without transalkylation of the DIPB; S3 offers revamps of SPA units to zeolite. Not the route of the issue."
  - id: ALCL3
    title: Liquid-phase alkylation with aluminium chloride
    reactants: [BZ, C3H6]
    products: [CUM, DIPB]
    status: rejected
    rationale: "Corrosive homogeneous catalyst with an acid/aqueous waste stream; not the route of the issue."
