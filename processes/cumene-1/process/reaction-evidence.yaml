model_basis:
  route: ZEO
  reactions: [ALK, ALK2, ALK3, TRANS]
  evidence: [O1, O2]
  assumptions:
    - "Propylene converted completely in R-101 (O1 at 436 K and 4.24 MPa(a), the design outlet temperature; at a lower benzene ratio than O1)."
    - "Propylene split 0.88/0.115/0.005 to cumene/DIPB/TIPB at benzene/propylene 4 mol/mol, ASSUMED: O1 gives 0.915/0.085 at about 7.4; a lower ratio forms more DIPB. Check: open data at ratio 3-5 or a licensor's figure."
    - "TRANS 0.40 per pass at 433 K, ASSUMED at the upper end of O2 (35-40 % at 411 K initial); equilibrium not checked (I-05)."
    - "TIPB (heavy ends) 0.005 of the propylene, ASSUMED; no source read reports it. The overall yield it gives is compared with S3 (99.7 wt%) and the LVOC BREF (99 %) in DESIGN.md D-012."
  validation: "Compare the overall benzene and propylene consumption with the licensor's figures (S3) and the BREF yield at every revision (D-012); replace the selectivity split with sourced data before basic engineering."
  decision: D-005
  decided_by: agent proposal (Claude Code), unreviewed
  date: 2026-11-03
