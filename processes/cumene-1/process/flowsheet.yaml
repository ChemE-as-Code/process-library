# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Liquid-phase zeolite cumene process (D-001). Where the values come from:
# - the feeds' compositions and all temperatures and pressures are design choices (design
#   basis, D-003, D-004, D-008), ASSUMED;
# - the feed flows S1 and S4 and the split fractions of SPL1 come from the independent balance
#   scripts/cumene_balance.py (D-007), ASSUMED;
# - the other stream values and the duties are calculated: by `cheme process propagate --fill`
#   (mixers, splitters, pass-throughs, the conversion reactors) and by `cheme process simulate
#   --fill` (DWSIM, Peng-Robinson, D-011). Peng-Robinson is not qualified by core for aromatics
#   with light hydrocarbons: the simulated values are a second implementation's check of the
#   script, not validated data.
schema: cheme/process/v1
kind: flowsheet
title: Cumene by zeolite alkylation of benzene with propylene (272 kt/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 34.0 t/h cumene, benzene/propylene 4 at the alkylator, propylene fully converted, DIPB transalkylated (D-002, D-004, D-005)", default: true}
# balances: |in - out| <= abs + rel * max(in, out), kg/h. abs 5 kg/h (not the usual 1): DWSIM
# carries TIPB with its surrogate's molar mass (1-tetradecene, 196.4 against 204.4 kg/kmol,
# D-011), so the TIPB of streams rich in it (S27) comes back about 3.9 % (4 kg/h) light against
# the leaner ones; the totals are unaffected beyond that.
tolerance: {abs: 5.0, rel: 0.005}

feeds:
  - {id: BZF, title: Fresh benzene, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PRF, title: "Propylene feed (95 mol% propylene, 5 mol% propane)", category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports: [{id: p101, direction: out, kind: energy}, {id: p102, direction: out, kind: energy}, {id: p103, direction: out, kind: energy}]
  - id: MPS
    title: MP steam 1500 kPa(a)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1500, provenance: assumed, source: "design basis, D-010"}
      supply_temperature: {value: 471.4, provenance: assumed, source: "saturation at 1500 kPa(a), D-010"}
      min_approach: {value: 10, provenance: assumed, source: D-010}
    ports: [{id: e102, direction: out, kind: energy}, {id: c202, direction: out, kind: energy}]
  - id: HPS
    title: HP steam 4200 kPa(a)
    category: utility
    utility:
      kind: steam
      level: HP
      pressure: {value: 4200, provenance: assumed, source: "design basis, D-010"}
      supply_temperature: {value: 526.4, provenance: assumed, source: "saturation at 4200 kPa(a), D-010"}
      min_approach: {value: 10, provenance: assumed, source: D-010}
    ports: [{id: c201, direction: out, kind: energy}, {id: c203, direction: out, kind: energy}, {id: c204, direction: out, kind: energy}]
products:
  - {id: CUMENE, title: Cumene to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: LPG, title: Propane (LPG) to sale or fuel, category: by_product, ports: [{id: in, direction: in}]}
  - {id: HEAVY, title: Heavy ends (polyisopropylbenzenes) to fuel, category: by_product, ports: [{id: in, direction: in}]}
  - id: LPSX
    title: LP steam export 250 kPa(a), raised by the alkylator interbed coolers
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 250, provenance: assumed, source: "design basis, D-009"}
      supply_temperature: {value: 400.6, provenance: assumed, source: "saturation at 250 kPa(a), D-009"}
      min_approach: {value: 10, provenance: assumed, source: D-009}
    ports: [{id: r101, direction: in, kind: energy}]
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-010"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-010"}
      min_approach: {value: 5, provenance: assumed, source: D-010}
    ports:
      - {id: c201, direction: in, kind: energy}
      - {id: c202, direction: in, kind: energy}
      - {id: c203, direction: in, kind: energy}
      - {id: e103, direction: in, kind: energy}
      - {id: c204, direction: in, kind: energy}

blocks:
  - id: RXN
    title: Alkylation and transalkylation
    class: ReactingChemicals
    ports:
      - {id: bz, direction: in}
      - {id: c3, direction: in}
      - {id: bzrec, direction: in}
      - {id: dipbrec, direction: in}
      - {id: eff, direction: out}
      - {id: slip, direction: out}
      - {id: power1, direction: in, kind: energy}
      - {id: power2, direction: in, kind: energy}
      - {id: power3, direction: in, kind: energy}
      - {id: steam, direction: in, kind: energy}
      - {id: lps, direction: out, kind: energy}
  - id: SEP
    title: Depropaniser, benzene, cumene and DIPB columns
    class: Distilling
    ports:
      - {id: eff, direction: in}
      - {id: slip, direction: in}
      - {id: bzrec, direction: out}
      - {id: dipbrec, direction: out}
      - {id: lpg, direction: out}
      - {id: cumene, direction: out}
      - {id: heavy, direction: out}
      - {id: steam1, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: steam3, direction: in, kind: energy}
      - {id: steam4, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: cw3, direction: out, kind: energy}
      - {id: cw4, direction: out, kind: energy}
      - {id: cw5, direction: out, kind: energy}

steps:
  - id: M101
    block: RXN
    title: Benzene feed drum (fresh + recycle)
    class: Mixing
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: fresh, direction: in, delegates: bz}
      - {id: rec, direction: in, delegates: bzrec}
      - {id: out, direction: out}
  - id: P101
    block: RXN
    title: Benzene charge pump
    class: Pumping
    links: [{target: equipment, ref: P-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power1}
  # D-004, D-005, D-006: the fractions of the pumped benzene that hold benzene/DIPB 5 at R-102
  # and 5 mol% propane in the benzene recycle (scripts/cumene_balance.py); the rest to R-101.
  - id: SPL1
    block: RXN
    title: Benzene distribution (alkylator, transalkylator, depropaniser slipstream)
    class: SplittingMaterial
    split: {tr: 0.120772923, dep: 0.204903973}
    ports:
      - {id: in, direction: in}
      - {id: alk, direction: out}
      - {id: tr, direction: out}
      - {id: dep, direction: out, delegates: slip}
  - id: P102
    block: RXN
    title: Propylene feed pump
    class: Pumping
    links: [{target: equipment, ref: P-102}]
    ports:
      - {id: in, direction: in, delegates: c3}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power2}
  - id: M102
    block: RXN
    title: Alkylator feed junction (benzene + propylene)
    class: Mixing
    ports:
      - {id: bz, direction: in}
      - {id: c3, direction: in}
      - {id: out, direction: out}
  - id: E101
    block: RXN
    title: Alkylator feed / effluent exchanger
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: cold_in, direction: in}
      - {id: cold_out, direction: out}
      - {id: hot_in, direction: in}
      - {id: hot_out, direction: out}
  # D-004, D-005, D-009: liquid-phase fixed beds with propylene before each bed and interbed
  # coolers raising LP steam, modelled as one conversion reactor with a fixed outlet temperature;
  # the heat removed is the LP steam export.
  - id: R101
    block: RXN
    title: Alkylation reactor (zeolite, liquid phase, interbed steam raising)
    class: ReactingChemicals
    reactions: [ALK, ALK2, ALK3]
    reactor: conversion
    links: [{target: equipment, ref: R-101}]
    # liquid-full reactor: `out` is its liquid; `vap` is DWSIM's vapour outlet, empty by design
    # (it checks that the reactor stays liquid; D-011)
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: vap, direction: out}
      - {id: q, direction: out, kind: energy, delegates: lps}
  - id: P103
    block: RXN
    title: DIPB recycle pump
    class: Pumping
    links: [{target: equipment, ref: P-103}]
    ports:
      - {id: in, direction: in, delegates: dipbrec}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power3}
  - id: M103
    block: RXN
    title: Transalkylator feed junction (benzene + DIPB)
    class: Mixing
    ports:
      - {id: bz, direction: in}
      - {id: dipb, direction: in}
      - {id: out, direction: out}
  - id: E102
    block: RXN
    title: Transalkylator feed heater
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
  - id: R102
    block: RXN
    title: Transalkylation reactor (zeolite, liquid phase, adiabatic)
    class: ReactingChemicals
    reactions: [TRANS]
    reactor: conversion
    links: [{target: equipment, ref: R-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: vap, direction: out}
  - id: M104
    block: RXN
    title: Reactor effluents junction
    class: Mixing
    ports:
      - {id: alk, direction: in}
      - {id: tr, direction: in}
      - {id: alkv, direction: in}
      - {id: trv, direction: in}
      - {id: out, direction: out, delegates: eff}
  - id: C201
    block: SEP
    title: Depropaniser (on the benzene slipstream)
    class: Distilling
    links: [{target: equipment, ref: C-201}]
    ports:
      - {id: feed, direction: in, delegates: slip}
      - {id: top, direction: out, delegates: lpg}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: steam1}
      - {id: cond, direction: out, kind: energy, delegates: cw1}
  - id: M105
    block: SEP
    title: Benzene column feed junction (effluents + depropaniser bottoms)
    class: Mixing
    ports:
      - {id: eff, direction: in, delegates: eff}
      - {id: c201, direction: in}
      - {id: out, direction: out}
  - id: C202
    block: SEP
    title: Benzene column
    class: Distilling
    links: [{target: equipment, ref: C-202}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out, delegates: bzrec}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: steam2}
      - {id: cond, direction: out, kind: energy, delegates: cw2}
  - id: C203
    block: SEP
    title: Cumene column
    class: Distilling
    links: [{target: equipment, ref: C-203}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: steam3}
      - {id: cond, direction: out, kind: energy, delegates: cw3}
  - id: E103
    block: SEP
    title: Cumene product cooler
    class: Cooling
    links: [{target: equipment, ref: E-103}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: cumene}
      - {id: cw, direction: out, kind: energy, delegates: cw4}
  - id: C204
    block: SEP
    title: DIPB column (vacuum)
    class: Distilling
    links: [{target: equipment, ref: C-204}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out, delegates: dipbrec}
      - {id: bot, direction: out, delegates: heavy}
      - {id: reb, direction: in, kind: energy, delegates: steam4}
      - {id: cond, direction: out, kind: energy, delegates: cw5}

