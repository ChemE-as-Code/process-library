  - id: S1
    title: Fresh benzene
    from: BZF.out
    to: M101.fresh
    template: mixture
    state:
      design:
        pressure: {value: 400, provenance: assumed, source: "design basis, D-003"}
        temperature: {value: 303.15, provenance: assumed, source: "design basis, D-003"}
        flow: {value: 22160.57, basis: mass, provenance: assumed, source: "scripts/cumene_balance.py: the fresh benzene that gives 34.0 t/h cumene (D-002, D-007)"}
        composition: {basis: mole_fraction, values: {BZ: 1.0}, provenance: assumed, source: "design basis, D-003"}
