        flow: {value: 135092.41, basis: mass, provenance: assumed, source: "scripts/cumene_balance.py: the drum outflow that holds benzene/propylene 4 at R-101 (D-004, D-007); the closing point of the benzene loop, checked by the M101 balance (D-011)"}
        composition: {basis: mole_fraction, values: {C3H8: 0.0419460, BZ: 0.9576346, CUM: 0.0004195}, provenance: assumed, source: "scripts/cumene_balance.py (D-006, D-007)"}
