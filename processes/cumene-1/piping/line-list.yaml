# Line list. Schema: `cheme schema lines`.
# Concept stage: one line per material stream of the PFD (stream id in the notes), no P&ID yet.
# DN: first-pass size from velocity (D-014, ASSUMED), scripts/line_sizes.py on the simulated
# streams: liquid 1.5 m/s (0.6 m/s on the low-pressure pump suctions), inside diameter taken as
# the DN, DN25 the smallest. Reflux, reboiler and utility lines come with the P&IDs. Pressure
# classes come with the pipe specs. Fluid codes: BZ benzene-rich, PR propylene/propane,
# AR alkylate (aromatics), CU cumene, PB polyisopropylbenzenes, HE heavy ends.
