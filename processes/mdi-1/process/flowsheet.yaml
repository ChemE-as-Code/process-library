# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# MDI and polymeric MDI from aniline, formaldehyde and phosgene (DESIGN.md D-001): HCl-catalysed
# condensation of aniline with formalin to the MDA mixture, neutralisation with caustic soda,
# washing and aniline recovery; liquid-phase phosgenation of the MDA in monochlorobenzene (MCB),
# HCl and phosgene separation, phosgene absorption in MCB and recycle, solvent recovery;
# distillation of monomeric MDI from the crude, the bottoms polymeric MDI; part of the HCl
# absorbed in water as the condensation's acid (the HCl recycle), the rest exported as gas.
# Where the values come from:
# - feeds, ratios, temperatures and pressures: the design basis and decisions D-002..D-010,
#   from US 10 640 455 B1 (condensation) and US 10 364 214 B1 (phosgenation) where they give
#   them, ASSUMED otherwise;
# - every flow and composition is calculated by `cheme process propagate --fill`: conversion
#   reactors (selectivity), component separators (`recovery:`, ASSUMED splits), splitters and
#   mixers, the five recycles torn and converged, and seven design specifications that set the
#   fresh aniline, caustic, phosgene, MCB make-up and absorber water feeds and the two splits
#   from the sourced ratios (D-003, D-005, D-006);
# - every duty is an ASSUMED estimate whose arithmetic is in its source (D-009): core has no
#   measured formation enthalpy for MDA and no property package for these mixtures (L-1, L-2);
#   the reaction heats are sized in Q1 and Q6, and every cooler and heater around R-102, V-101,
#   T-102, M-201 and T-201 is an energy stream (Q15 to Q19, Q8).
schema: cheme/process/v1
kind: flowsheet
title: MDI and polymeric MDI by aniline-formaldehyde condensation and liquid-phase phosgenation (178 kt/a crude MDI)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 6144 kg/h of 50 wt% formalin (3.07 t/h formaldehyde, the nameplate of US 10 640 455 B1) to about 22.2 t/h of crude MDI, 8000 h/a (D-002)", default: true}
tolerance: {abs: 0.5, rel: 0.002}   # balances: |in - out| <= abs + rel * max(in, out), kg/h
tears:
  - stream: S3
    initial: {flow: 5400.0, unit: kg/h, basis: mass_fraction, composition: {ANL: 0.95, H2O: 0.045, CH3OH: 0.005}}
  - stream: S17
    initial: {flow: 600.0, unit: kg/h, basis: mass_fraction, composition: {H2O: 0.95, ANL: 0.04, CH3OH: 0.01}}
  - stream: S4
    initial: {flow: 2800.0, unit: kg/h, basis: mass_fraction, composition: {HCL: 0.30, H2O: 0.70}}
  - stream: S31
    initial: {flow: 115000.0, unit: kg/h, basis: mass_fraction, composition: {MCB: 1.0}}
  - stream: S23
    initial: {flow: 86000.0, unit: kg/h, basis: mass_fraction, composition: {COCL2: 0.22, MCB: 0.775, HCL: 0.005}}
convergence: {method: wegstein, max_iterations: 500, tolerance: {abs: 1.0e-4, rel: 1.0e-8}}
specs:
  - id: SP-ANILINE
    vary: {stream: S1, initial: 15500.0, low: 10000.0, high: 25000.0}
    target: {stream: S5, component: ANL, quantity: ratio, basis: mole, per: {stream: S5, component: HCHO}, value: 2.25}
    provenance: assumed
    source: "D-003: 2.25 mol aniline per mol formaldehyde at the condensation's inlet, the nameplate ratio of US 10 640 455 B1 (description of the starting state)"
  - id: SP-PROTONATION
    vary: {node: X301, port: abs, initial: 0.065, low: 0.0, high: 1.0}
    target: {stream: S5, component: HCL, quantity: ratio, basis: mole, per: {stream: S5, component: ANL}, value: 0.10}
    provenance: assumed
    source: "D-003: protonation level 10 %, 0.10 mol HCl per mol of amino groups, US 10 640 455 B1 (nameplate)"
  - id: SP-ACID
    vary: {stream: S40, initial: 1960.0, low: 500.0, high: 5000.0}
    target: {stream: S4, component: HCL, quantity: fraction, basis: mass, value: 0.30}
    provenance: assumed
    source: "D-003: 30 % aqueous hydrochloric acid as the condensation's catalyst, US 10 640 455 B1"
  - id: SP-CAUSTIC
    vary: {stream: S7, initial: 2030.0, low: 500.0, high: 5000.0}
    target: {stream: S7, component: NAOH, quantity: ratio, basis: mole, per: {stream: S6, component: HCL}, value: 1.10}
    provenance: assumed
    source: "D-003: caustic soda at 1.10 mol per mol HCl, US 10 640 455 B1 (neutralisation of the starting state)"
  - id: SP-PHOSGENE
    vary: {stream: S24, initial: 17500.0, low: 10000.0, high: 40000.0}
    target: {stream: S25, component: COCL2, quantity: ratio, basis: mass, per: {stream: S14}, value: 2.0588}
    provenance: assumed
    source: "D-005: 42 t/h of phosgene per 20.4 t/h of MDA (120 t/h of 35 % phosgene solution), US 10 364 214 B1 (nameplate example): 42 / 20.4 = 2.0588 kg/kg, about 2.08 mol per amino group"
  - id: SP-MCB-MDA
    vary: {stream: S20, initial: 6.0, low: 0.0, high: 500.0}
    target: {stream: S22, component: MCB, quantity: fraction, basis: mass, value: 0.729}
    provenance: assumed
    source: "D-005: 27.1 % MDA solution in MCB (20.4 t/h MDA in 55.0 t/h MCB), US 10 364 214 B1"
  - id: SP-PHOSGENE-SOLUTION
    vary: {node: X201, port: mda, initial: 0.42, low: 0.05, high: 0.95}
    target: {stream: S25, component: COCL2, quantity: fraction, basis: mass, value: 0.35}
    provenance: assumed
    source: "D-005: 35.0 % phosgene solution in MCB, US 10 364 214 B1"

feeds:
  - {id: ANLF, title: Aniline (aniline-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: HCHOF, title: Formalin 50 wt% (formaldehyde-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NAOHF, title: Caustic soda 50 wt% (chlor-alkali-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PHOSF, title: Liquid phosgene (phosgene-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: MCBF, title: Monochlorobenzene make-up (no library process), category: raw_material, ports: [{id: out, direction: out}]}
  - id: PW
    title: Process water (MDA wash, HCl absorber)
    category: raw_material
    ports:
      - {id: w101, direction: out}
      - {id: a301, direction: out}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: r201, direction: out, kind: energy}
      - {id: d203, direction: out, kind: energy}
  - id: LPS
    title: LP steam 600 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 600, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 432.0, provenance: given, source: "saturation at 600 kPa(a), IAPWS-IF97 (431.98 K)"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: t102, direction: out, kind: energy}
      - {id: r201, direction: out, kind: energy}
  - id: MPS
    title: MP steam 1600 kPa(a)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1600, provenance: assumed, source: "design basis (D-009): the cascade's last reactors (429 K), the dephosgenation bottoms (428 K) and the solvent column's countercurrent evaporator (443 K, 170 C in US 10 364 214 B1) are too hot for LP steam's 432 K"}
      supply_temperature: {value: 474.5, provenance: given, source: "saturation at 1600 kPa(a), IAPWS-95 (chemicals 1.5.2 iapws95_Tsat, 474.52 K)"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: d201, direction: out, kind: energy}
      - {id: d202, direction: out, kind: energy}
  - id: HPS
    title: HP steam 4000 kPa(a)
    category: utility
    utility:
      kind: steam
      level: HP
      pressure: {value: 4000, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 523.5, provenance: given, source: "saturation at 4000 kPa(a), IAPWS-IF97 (523.51 K)"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: d101, direction: out, kind: energy}
      - {id: d203, direction: out, kind: energy}
products:
  - {id: MDIP, title: Monomeric MDI (two-ring isomers) to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: PMDIP, title: Polymeric MDI to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: HCLG, title: Hydrogen chloride gas to an adjacent consumer, category: by_product, ports: [{id: in, direction: in}]}
  - {id: BRINE, title: MDA brine (NaCl) to wastewater treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - {id: MEOH, title: Methanol-rich condensate to the site's thermal oxidiser (fuel), category: by_product, ports: [{id: in, direction: in}]}
  - {id: RESID, title: Distillation lights and residue (MCB) to incineration, category: by_product, ports: [{id: in, direction: in}]}
  - {id: VENT, title: Absorber vent to the phosgene destruction and thermal oxidiser, category: off_gas, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: d101, direction: in, kind: energy}
      - {id: t102, direction: in, kind: energy}
      - {id: d202, direction: in, kind: energy}
      - {id: d203, direction: in, kind: energy}
      - {id: a301, direction: in, kind: energy}
      - {id: r101, direction: in, kind: energy}
      - {id: r102, direction: in, kind: energy}
      - {id: v101, direction: in, kind: energy}
      - {id: t102b, direction: in, kind: energy}
      - {id: m201, direction: in, kind: energy}
  - id: REFR
    title: Refrigerated brine return (253 K)
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 248.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 253.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: t201, direction: in, kind: energy}

blocks:
  - id: MDA
    title: MDA synthesis (condensation, neutralisation, washing, aniline recovery)
    class: ReactingChemicals
    ports:
      - {id: anl, direction: in}
      - {id: hcho, direction: in}
      - {id: acid, direction: in}
      - {id: naoh, direction: in}
      - {id: water, direction: in}
      - {id: mda, direction: out}
      - {id: brine, direction: out}
      - {id: meoh, direction: out}
      - {id: mps, direction: in, kind: energy}
      - {id: lps2, direction: in, kind: energy}
      - {id: hps, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: cw3, direction: out, kind: energy}
      - {id: cw4, direction: out, kind: energy}
      - {id: cw5, direction: out, kind: energy}
      - {id: cw6, direction: out, kind: energy}
  - id: PHOSG
    title: Phosgenation, phosgene and HCl recovery, solvent recovery
    class: ReactingChemicals
    ports:
      - {id: mda, direction: in}
      - {id: phosgene, direction: in}
      - {id: mcb, direction: in}
      - {id: crude, direction: out}
      - {id: hcl, direction: out}
      - {id: lps, direction: in, kind: energy}
      - {id: mps, direction: in, kind: energy}
      - {id: mps2, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: refr, direction: out, kind: energy}
  - id: PURIF
    title: MDI distillation (monomeric MDI and polymeric MDI)
    class: SeparatingByThermalProcess
    ports:
      - {id: crude, direction: in}
      - {id: mdi, direction: out}
      - {id: pmdi, direction: out}
      - {id: resid, direction: out}
      - {id: hps, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: HCLREC
    title: HCl recycle (absorption to the condensation's acid) and HCl export
    class: Absorbing
    ports:
      - {id: hcl, direction: in}
      - {id: water, direction: in}
      - {id: acid, direction: out}
      - {id: export, direction: out}
      - {id: vent, direction: out}
      - {id: cw, direction: out, kind: energy}

steps:
  # --- MDA ---------------------------------------------------------------------------------------
  - id: M101
    block: MDA
    title: Aniline, formalin and acid mixing (aminal stage)
    class: Mixing
    symbol: STATIC_MIXER_SHAPE
    links: [{target: equipment, ref: M-101}]
    ports:
      - {id: anl, direction: in, delegates: anl}
      - {id: rec, direction: in}
      - {id: hcho, direction: in, delegates: hcho}
      - {id: acid, direction: in, delegates: acid}
      - {id: out, direction: out}
  - id: R101
    block: MDA
    title: Condensation and rearrangement cascade
    class: ReactingChemicals
    reactions: [MDA_FORM, PMDA_FORM]
    reactor: conversion
    energy_port: q
    selectivity: {key: HCHO, conversion: 1.0, products: {MDA: 0.44333, PMDA: 0.278335}, provenance: assumed, source: "D-004: formaldehyde converted completely; the split fixes the MDA mixture at 51.0 wt% two-ring diamines (US 10 640 455 B1, nameplate: 45.2 % 4,4'-, 5.5 % 2,4'-, 0.3 % 2,2'-MDA), the rest lumped as the three-ring triamine: per kmol formaldehyde 0.44333 kmol MDA and 0.278335 kmol PMDA (0.51 / 198.269 and 0.49 / 303.409 kmol per kg, 1 and 2 formaldehyde each, normalised to the formaldehyde converted)"}
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: mps}
      - {id: cool, direction: out, kind: energy, delegates: cw3}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: R102
    block: MDA
    title: Neutralisation with caustic soda
    class: ReactingChemicals
    reactions: [NEUT]
    reactor: conversion
    conversion: {NEUT: 1.0}
    links: [{target: equipment, ref: R-102}]
    ports:
      - {id: in, direction: in}
      - {id: naoh, direction: in, delegates: naoh}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: cw4}
  - id: V101
    block: MDA
    title: Neutralisation separator
    class: SeparatingByGravity
    recovery:
      outlets:
        org: {MDA: 0.999, PMDA: 0.999, ANL: 0.95, H2O: 0.03, CH3OH: 0.2, NACL: 0.001, NAOH: 0.001}
      provenance: assumed
      source: "D-006: ASSUMED phase split at 368 K, the neutralised mixture cooled from 388 K on the way in (Q16, the cooler lumped with V-101); the polyamines stay organic, the aniline about 5 % with the brine, the organic phase holds about 3 % of the water and entrains 0.1 % of the salt"
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: in, direction: in}
      - {id: org, direction: out}
      - {id: brine, direction: out}
      - {id: q, direction: out, kind: energy, delegates: cw5}
  - id: W101
    block: MDA
    title: MDA washing with process water
    class: SeparatingByGravity
    recovery:
      outlets:
        org: {MDA: 1.0, PMDA: 1.0, ANL: 0.99, H2O: 0.08, CH3OH: 0.5, NACL: 0.02, NAOH: 0.02}
      provenance: assumed
      source: "D-006: ASSUMED wash efficiency: 98 % of the entrained salt and 92 % of the water leave with the wash water"
    links: [{target: equipment, ref: W-101}]
    ports:
      - {id: in, direction: in}
      - {id: water, direction: in, delegates: water}
      - {id: org, direction: out}
      - {id: wash, direction: out}
  - id: D101
    block: MDA
    title: MDA column (water and aniline off, vacuum)
    class: SeparatingByThermalProcess
    recovery:
      outlets:
        ovhd: {ANL: 0.9995, H2O: 1.0, CH3OH: 1.0}
      provenance: assumed
      source: "D-006: ASSUMED: water and methanol overhead, the MDA bottoms with 0.05 % of the aniline fed; the polyamines and the salt traces stay in the bottoms"
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: in, direction: in}
      - {id: ovhd, direction: out}
      - {id: btm, direction: out, delegates: mda}
      - {id: q, direction: in, kind: energy, delegates: hps}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: T102
    block: MDA
    title: Brine stripper with methanol draw
    class: SeparatingByThermalProcess
    recovery:
      outlets:
        ovhd: {ANL: 0.995, H2O: 0.03, CH3OH: 0.04}
        meoh: {CH3OH: 0.95, ANL: 0.0005, H2O: 0.001}
      provenance: assumed
      source: "D-006: ASSUMED: 99.5 % of the dissolved aniline stripped overhead with 3 % of the water, the methanol taken as a side draw (LVOC BREF 10.4.4.2: recovered and burnt as fuel); the salt, the caustic excess and the polyamine traces leave with the brine"
    links: [{target: equipment, ref: T-102}]
    ports:
      - {id: brine, direction: in}
      - {id: wash, direction: in}
      - {id: aq, direction: in}
      - {id: ovhd, direction: out}
      - {id: meoh, direction: out, delegates: meoh}
      - {id: btm, direction: out, delegates: brine}
      - {id: q, direction: in, kind: energy, delegates: lps2}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
      - {id: cool, direction: out, kind: energy, delegates: cw6}
  - id: V102
    block: MDA
    title: Aniline-water decanter
    class: SeparatingByGravity
    recovery:
      outlets:
        org: {ANL: 0.98, H2O: 0.05, CH3OH: 0.3}
      provenance: assumed
      source: "D-006: ASSUMED liquid-liquid split at 313 K: 2 % of the aniline dissolved in the water phase, which returns to T-102"
    links: [{target: equipment, ref: V-102}]
    ports:
      - {id: mda, direction: in}
      - {id: brine, direction: in}
      - {id: org, direction: out}
      - {id: aq, direction: out}
  # --- PHOSG -------------------------------------------------------------------------------------
  - id: M201
    block: PHOSG
    title: MDA solution make-up (MDA in MCB)
    class: Mixing
    symbol: STATIC_MIXER_SHAPE
    links: [{target: equipment, ref: M-201}]
    ports:
      - {id: mda, direction: in, delegates: mda}
      - {id: mcb, direction: in}
      - {id: makeup, direction: in, delegates: mcb}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: cw2}
  - id: M202
    block: PHOSG
    title: Phosgene solution make-up
    class: Mixing
    links: [{target: equipment, ref: M-202}]
    ports:
      - {id: rec, direction: in}
      - {id: fresh, direction: in, delegates: phosgene}
      - {id: out, direction: out}
  - id: R201
    block: PHOSG
    title: Mixing nozzle and phosgenation tower
    class: ReactingChemicals
    reactions: [MDI_FORM, PMDI_FORM]
    reactor: conversion
    conversion: {MDI_FORM: 1.0, PMDI_FORM: 1.0}
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: amine, direction: in}
      - {id: phosgene, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: lps}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: V201
    block: PHOSG
    title: Tower top gas-liquid separation
    class: SeparatingByFlash
    recovery:
      outlets:
        gas: {HCL: 0.9, COCL2: 0.4, MCB: 0.03}
      provenance: assumed
      source: "D-007: ASSUMED split at the tower top (384 K, 160 kPa(a), US 10 364 214 B1): 90 % of the HCl and 40 % of the phosgene leave as gas with 3 % of the MCB"
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out}
      - {id: liq, direction: out}
  - id: D201
    block: PHOSG
    title: Dephosgenation column
    class: SeparatingByThermalProcess
    recovery:
      outlets:
        ovhd: {HCL: 1.0, COCL2: 1.0, MCB: 0.05}
      provenance: assumed
      source: "D-007: ASSUMED: the remaining HCl and phosgene overhead with 5 % of the MCB (top 389 K, 160 kPa(a), US 10 364 214 B1)"
    links: [{target: equipment, ref: C-201}]
    ports:
      - {id: in, direction: in}
      - {id: ovhd, direction: out}
      - {id: btm, direction: out}
      - {id: q, direction: in, kind: energy, delegates: mps}
  - id: T201
    block: PHOSG
    title: Phosgene absorber (phosgene into MCB, HCl gas overhead)
    class: Absorbing
    recovery:
      outlets:
        gas: {HCL: 0.99, COCL2: 1.0e-5, MCB: 4.36e-4}
      provenance: assumed
      source: "D-007: ASSUMED: 1 % of the HCl dissolves in the cold absorbent and returns with the phosgene; the HCl gas keeps 10 ppm of the phosgene fed (about 5 ppmv) and leaves saturated with MCB at the top: 110.9 Pa vapour pressure at 258.15 K (thermo 0.6.1, HEOS_FIT) over 150 kPa(a), 7.4e-4 mol/mol, about 29 kg/h on the 352 kmol/h of HCl, 4.36e-4 of the 67.2 t/h of MCB fed. The LVOC BREF's under 1 ppmv solvent (10.2.2.1.3) is for HCl from a pressure process and is not met here (D-007)"
    links: [{target: equipment, ref: T-201}]
    ports:
      - {id: gas1, direction: in}
      - {id: gas2, direction: in}
      - {id: mcb, direction: in}
      - {id: gas, direction: out, delegates: hcl}
      - {id: liq, direction: out}
      - {id: q, direction: out, kind: energy, delegates: refr}
  - id: D202
    block: PHOSG
    title: Solvent column (MCB off, to recycle)
    class: SeparatingByThermalProcess
    recovery:
      outlets:
        ovhd: {MCB: 0.99995}
      provenance: assumed
      source: "D-008: ASSUMED: 99.995 % of the MCB recovered overhead (600 mbar top, then a countercurrent evaporator at 20 mbar, US 10 364 214 B1); the rest leaves with the crude"
    links: [{target: equipment, ref: C-202}]
    ports:
      - {id: in, direction: in}
      - {id: ovhd, direction: out}
      - {id: btm, direction: out, delegates: crude}
      - {id: q, direction: in, kind: energy, delegates: mps2}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: X201
    block: PHOSG
    title: MCB recycle split (MDA solution / phosgene absorbent)
    class: SplittingMaterial
    symbol: junction
    ports:
      - {id: in, direction: in}
