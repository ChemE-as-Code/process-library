allocation:
  coproducts:
  - MDIP
  - PMDIP
  - HCLG
  source: 'D-012: three marketable products of one plant, monomeric MDI, polymeric MDI and anhydrous HCl
    gas. Mass allocation, as the ACC cradle-to-gate MDI study (Franklin Associates for the American Chemistry
    Council, 2022) allocates between MDI and its HCl co-product. The two isocyanates are one product family
    sold for the same use (polyurethanes) and share a burden per kg under any physical key.'
  deviation: The ISOPA 2021 eco-profile allocates instead by a combined elemental and mass key (the chlorine
    to the HCl, the MDA and the carbon monoxide to the MDI, the rest by mass); its Table 2 gives the MDI's
    cradle-to-gate GWP 2.76 kg CO2 eq per kg with that key, 2.32 with mass and 3.37 with price allocation.
    The mass key here sits at the low end of that range.
