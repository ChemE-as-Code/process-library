id: mdi-and-polymeric-mdi-by-aniline-formaldehyde-condensation-and-liquid-phase-phosgenation-178-kt-a-crude-mdi
title: MDI and polymeric MDI by aniline-formaldehyde condensation and liquid-phase phosgenation (178 kt/a
  crude MDI)
description: Unallocated foreground LCI of MDI and polymeric MDI by aniline-formaldehyde condensation
  and liquid-phase phosgenation (178 kt/a crude MDI), case design, derived from the flowsheet by cheme
  assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: Aniline and 50 wt% formalin (2.25 mol per mol) condensed with 30 % hydrochloric acid (0.10
  mol per mol amino groups) in a seven-reactor cascade at 323-429 K, neutralised with caustic soda (1.10
  mol per mol HCl), washed, aniline and water distilled off and recycled, the brine stripped; the MDA
  phosgenated as a 27.1 % solution in MCB with a 35 % phosgene solution (2.06 kg phosgene per kg MDA)
  through a mixing nozzle and tower at 384 K, 160 kPa(a); HCl and phosgene separated, the phosgene absorbed
  in chilled MCB and recycled, the solvent distilled off; monomeric MDI distilled off the crude under
  vacuum, the bottoms polymeric MDI; 6.5 % of the HCl absorbed to the condensation's acid, the rest exported
  as gas; 22.2 t/h crude MDI
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:start-up-vents
  title: storage-tank emissions of R-201, D-201, T-201, A-301
  direction: output
  reason: 'No P&ID yet: the waste gas of start-up and shutdown, which the LVOC BREF (10.3.7) reports is
    often treated by caustic scrubbing only and carries most of a plant''s tetrachloromethane, is not
    estimated (D-011).'
- key: emission-excluded:cascade-vents
  title: storage-tank emissions of R-101, R-102
  direction: output
  reason: 'No P&ID yet: the cascade''s first reactor runs under vacuum with a reflux condenser fed with
    aniline (US 10 640 455 B1) and the neutraliser is liquid-full under 140 kPa(a); their small vents
    (aniline, water, methanol and formaldehyde vapour) go to the waste-gas treatment and are not estimated
    (D-011).'
- key: emission-excluded:storage-breathing
  title: storage-tank emissions of M-101, V-102, D-203
  direction: output
  reason: The breathing of the aniline, MCB, MDI and PMDI tanks (nitrogen-blanketed, vented to the waste-gas
    treatment) is not estimated (D-011).
