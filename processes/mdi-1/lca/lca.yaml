# Goal and scope of the mdi-1 LCI. Schema: `cheme schema lca`. Outputs: `cheme assess lca
# --write` (lca/inventory.csv, gaps.csv, dataset.yaml, manifest.json, results); never edit those
# by hand.
#
# Preliminary gate-to-gate foreground inventory (DESIGN.md D-012): every exchange of the plant
# per kg of monomeric MDI, from the flowsheet's design case. The aniline, formalin, caustic soda
# and phosgene link their library producers (lca/mappings.yaml); the MCB make-up, power,
# cooling, refrigeration, process water and the waste treatments are left unmapped (`missing:`
# with the activity each should connect to): a gap, never zero, and no values from licensed
# databases.
schema: cheme/lca/v1
kind: lca
goal: >-
  Preliminary gate-to-gate life cycle inventory of methylene diphenyl diisocyanate made by the
  HCl-catalysed condensation of aniline with formaldehyde, liquid-phase phosgenation of the MDA
  in monochlorobenzene and distillation of monomeric MDI from the crude, at the concept stage:
  which raw materials, utilities and wastes the plant exchanges per kg of product, as the
  foreground for a later cradle-to-gate study. Monomeric MDI, polymeric MDI and hydrogen
  chloride gas share the burdens (D-012).
functional_unit: {product: MDIP, amount: 1, unit: kg, source: "1 kg of monomeric MDI (two-ring isomers, stream S36) at the plant gate to storage; polymeric MDI (S37) carries the same burden per kg under the mass allocation (D-008, D-012)"}
# The boundary key stays cradle-to-gate so that the purchased inputs remain open gaps instead of
# being mapped free (the schema's gate-to-gate maps every feed free), as oxalyl-chloride-1 does.
boundary: cradle-to-gate
case: design
year: 2026
location: GLO
technology: "Aniline and 50 wt% formalin (2.25 mol per mol) condensed with 30 % hydrochloric acid (0.10 mol per mol amino groups) in a seven-reactor cascade at 323-429 K, neutralised with caustic soda (1.10 mol per mol HCl), washed, aniline and water distilled off and recycled, the brine stripped; the MDA phosgenated as a 27.1 % solution in MCB with a 35 % phosgene solution (2.06 kg phosgene per kg MDA) through a mixing nozzle and tower at 384 K, 160 kPa(a); HCl and phosgene separated, the phosgene absorbed in chilled MCB and recycled, the solvent distilled off; monomeric MDI distilled off the crude under vacuum, the bottoms polymeric MDI; 6.5 % of the HCl absorbed to the condensation's acid, the rest exported as gas; 22.2 t/h crude MDI"
rights: "CC-BY-4.0: the ChemE-as-Code process library's own concept design (LICENSE-DATA)"
system_model: cutoff
allocation:
  method: mass
  coproducts: [MDIP, PMDIP, HCLG]
  source: >-
    D-012: three marketable products of one plant, monomeric MDI, polymeric MDI and anhydrous
    HCl gas. Mass allocation, as the ACC cradle-to-gate MDI study (Franklin Associates for the
    American Chemistry Council, 2022) allocates between MDI and its HCl co-product. The two
    isocyanates are one product family sold for the same use (polyurethanes) and share a
    burden per kg under any physical key.
  deviation: >-
    The ISOPA 2021 eco-profile allocates instead by a combined elemental and mass key (the
    chlorine to the HCl, the MDA and the carbon monoxide to the MDI, the rest by mass); its
    Table 2 gives the MDI's cradle-to-gate GWP 2.76 kg CO2 eq per kg with that key, 2.32 with
    mass and 3.37 with price allocation. The mass key here sits at the low end of that range.
flows:
  # raw materials
  - key: feed:ANLF
    missing: "linked to processes/aniline-1 (lca/mappings.yaml): aniline to storage"
    source: "flowsheet stream S1 (D-002)"
  - key: feed:HCHOF
    missing: "linked to processes/formaldehyde-1 (lca/mappings.yaml): formalin 50 wt%, per kg of solution"
    source: "flowsheet stream S2 (D-002)"
  - key: feed:NAOHF
    missing: "linked to processes/chlor-alkali-1 (lca/mappings.yaml): caustic soda 50 wt%, per kg of solution"
    source: "flowsheet stream S7 (D-003)"
  - key: feed:PHOSF
    missing: "linked to processes/phosgene-1 (lca/mappings.yaml): liquid phosgene, captive"
    source: "flowsheet stream S24 (D-005)"
  - key: feed:MCBF
    missing: "not mapped yet (D-012); no library process makes monochlorobenzene. Connect to: chlorobenzene by liquid-phase chlorination of benzene over an iron(III) chloride catalyst, with HCl and dichlorobenzenes as co-products (a recorded proxy, not linked); 0.24 g per kg of crude MDI"
    source: "flowsheet stream S20, the solvent losses to the lights cut and the HCl (D-005)"
  - key: feed:PW
    missing: "not mapped yet (D-012); connect to: process (demineralised) water from the site water treatment, for the MDA wash and the HCl absorber"
    source: "flowsheet streams S11 and S40 (D-006, D-007)"
  # utilities
  - key: feed:POWER
    missing: "not mapped yet (D-012); connect to: electricity, medium voltage, grid mix of the (undecided) site country"
    source: "flowsheet energy streams P1, P2 and P3, ASSUMED allowances (D-009)"
  - key: feed:LPS
    missing: "linked as heat from steam (lca/mappings.yaml); connect to: steam in the chemical industry from a natural-gas-fired site boiler, per kWh of condensing heat"
    source: "flowsheet energy streams Q1, Q4, Q6, Q7 and Q9, ASSUMED estimates (D-009)"
  - key: feed:HPS
    missing: "linked as heat from steam (lca/mappings.yaml); connect to: high-pressure steam or hot oil from a natural-gas-fired site boiler, per kWh of heat delivered"
    source: "flowsheet energy streams Q2 and Q12, ASSUMED estimates (D-009)"
  - key: product:CW
    missing: "not mapped yet (D-012); connect to: heat rejected to a recirculating cooling-water system with cooling tower (processes/utility-cooling-tower), per kWh removed"
    source: "flowsheet energy streams Q3, Q5, Q10, Q13 and Q14 (D-009)"
  - key: product:REFR
    missing: "not mapped yet (D-012); connect to: refrigeration at 248 K from an electric vapour-compression unit (compressor electricity at its COP, condenser cooling water), per kWh of heat removed"
    source: "flowsheet energy stream Q8, the phosgene absorber (D-009)"
  # wastes
  - key: product:BRINE
    treatment: {kind: waste, route: "site wastewater treatment for saline effluent: about 11 wt% NaCl with the caustic excess and traces of aniline and MDA (LVOC BREF 10.3.2.5: plants sit near an outlet that can take the salt water)"}
    missing: "not mapped yet (D-012); connect to: treatment of saline industrial wastewater, per kg, with its chloride and organic load"
    source: "flowsheet stream S19 (D-006)"
  - key: product:MEOH
    treatment: {kind: waste, route: "burnt as fuel in the site's thermal oxidiser or boiler (LVOC BREF 10.4.4.2); no credit for its heat in this preliminary inventory"}
    missing: "not mapped yet (D-012); connect to: thermal treatment of a methanol-water condensate (about 45 mol% methanol), per kg"
    source: "flowsheet stream S18 (D-006)"
  - key: product:RESID
    treatment: {kind: waste, route: "incineration of the chlorinated lights cut (MCB) with flue-gas scrubbing", hazardous: true}
    missing: "not mapped yet (D-012); connect to: incineration of hazardous liquid chlorinated organic waste, per kg"
    source: "flowsheet stream S35 (D-008)"
  - key: product:VENT
    treatment: {kind: waste, route: "phosgene destruction and thermal oxidation of the absorber vent (phosgene and MCB traces) with caustic scrubbing (LVOC BREF 10.3.1.3)"}
    missing: "not mapped yet (D-012); connect to: thermal oxidation of a chlorinated process off-gas with caustic scrubbing, per kg"
    source: "flowsheet stream S41 (D-007)"
operation:
  hours_per_year: 8000
  life_years: 25
  source: "design basis operating_hours_per_year 8000 (ASSUMED); 25 a service life ASSUMED"
emission_exclusions:
  - {id: start-up-vents, method: storage-tank, equipment: [R-201, D-201, T-201, A-301], reason: "No P&ID yet: the waste gas of start-up and shutdown, which the LVOC BREF (10.3.7) reports is often treated by caustic scrubbing only and carries most of a plant's tetrachloromethane, is not estimated (D-011)."}
  - {id: cascade-vents, method: storage-tank, equipment: [R-101, R-102], reason: "No P&ID yet: the cascade's first reactor runs under vacuum with a reflux condenser fed with aniline (US 10 640 455 B1) and the neutraliser is liquid-full under 140 kPa(a); their small vents (aniline, water, methanol and formaldehyde vapour) go to the waste-gas treatment and are not estimated (D-011)."}
  - {id: storage-breathing, method: storage-tank, equipment: [M-101, V-102, D-203], reason: "The breathing of the aniline, MCB, MDI and PMDI tanks (nitrogen-blanketed, vented to the waste-gas treatment) is not estimated (D-011)."}
dataset:
  version: 0.1.0
  classification: {isic: "2011"}   # ISIC Rev.4 2011 Manufacture of basic chemicals
  modelling: {principle: attributional}
  geography: {description: "Generic site integrated with aniline, formaldehyde, phosgene and chlor-alkali plants, an HCl consumer and saline wastewater treatment, not chosen (GLO); one design case"}
  system_model: cutoff
  technology_level: current
  review: {type: none}
  data_generator: "ChemE-as-Code agent session (Claude Opus 5.5) for issue #465, unreviewed"
