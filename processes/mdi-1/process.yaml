    - {chemical: formaldehyde, role: feedstock, inventory_key: "feed:HCHOF", note: "Formalin 50 wt% (formaldehyde-1), counted by mass of the solution, 0.277 kg per kg of crude MDI"}
    - {chemical: phosgene, role: feedstock, inventory_key: "feed:PHOSF", note: "Liquid phosgene (phosgene-1), 0.784 kg per kg of crude MDI"}
    - {chemical: sodium-hydroxide, role: feedstock, inventory_key: "feed:NAOHF", note: "Caustic soda 50 wt% (chlor-alkali-1), counted by mass of the solution, 0.091 kg per kg of crude MDI"}
    - {chemical: chlorobenzene, role: feedstock, inventory_key: "feed:MCBF", note: "Monochlorobenzene make-up (no library process), 1.56 g per kg of crude MDI, most of it lost with the HCl gas (D-007, D-008)"}
    - {chemical: water, role: feedstock, inventory_key: "feed:PW", note: "Process water for the MDA wash and the HCl absorber, 0.223 kg per kg of crude MDI"}
  outputs:
    - {chemical: methylene-diphenyl-diisocyanate, role: main-product, inventory_key: "product:MDIP", note: "Monomeric MDI (two-ring isomers, not separated), 4.44 t/h, a fifth of the crude"}
    - {chemical: polymeric-mdi, role: co-product, inventory_key: "product:PMDIP", note: "Polymeric MDI, 17.75 t/h, about 40 wt% two-ring MDI; mass allocation, 51.9 % of the burdens"}
    - {chemical: hydrogen-chloride, role: co-product, inventory_key: "product:HCLG", note: "Anhydrous HCl gas to an adjacent consumer, 0.542 kg per kg of crude MDI with about 740 ppmv MCB (D-007); mass allocation, 35.1 % of the burdens"}
    - {chemical: wastewater, role: waste, inventory_key: "product:BRINE", note: "MDA brine, 0.574 kg per kg of crude MDI, 10.6 wt% NaCl, to treatment"}
    - {chemical: methanol, role: waste, inventory_key: "product:MEOH", note: "Methanol-rich condensate from the formalin, 1.3 g per kg of crude MDI, burnt as fuel"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "0.032 kWh per kg of crude MDI, ASSUMED allowances"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "0.141 kWh of LP steam heat per kg of crude MDI (ASSUMED estimates): the brine stripper and the phosgenation tower"}
    - {chemical: steam, role: utility, inventory_key: "feed:MPS", note: "0.600 kWh of MP steam heat per kg of crude MDI (ASSUMED estimates): the cascade, the dephosgenation and the solvent column, the last 9.3 of 13.3 MW"}
    - {chemical: steam, role: utility, inventory_key: "feed:HPS", note: "0.158 kWh of HP steam heat per kg of crude MDI (ASSUMED estimates)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "0.988 kWh removed per kg of crude MDI"}
    - {chemical: chilled-water, role: utility, inventory_key: "product:REFR", note: "Refrigerated brine at 248 K for the phosgene absorber and its absorbent chiller, 0.171 kWh removed per kg of crude MDI"}
basis:
  capacity: "22.2 t/h crude MDI (about 178 kt/a): 4.44 t/h monomeric MDI and 17.75 t/h polymeric MDI, set by 3.07 t/h formaldehyde, the nameplate of US 10 640 455 B1 (ASSUMED, DESIGN.md D-002)"
  operating_hours_per_year: 8000
  location: generic (not chosen), integrated with aniline, formaldehyde, phosgene and chlor-alkali plants
