# Process Atlas manifest of mdi-1. Schema: schemas/process.schema.json (cheme-as-code/process/v1).
# plant.yaml stays the engineering manifest; sheets and results are derived from the
# ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: mdi-1
title: MDI and polymeric MDI by aniline-formaldehyde condensation and liquid-phase phosgenation (178 kt/a crude MDI)
summary: >-
  Aniline and formalin condensed over hydrochloric acid to MDA, neutralised and worked up; the
  MDA phosgenated in monochlorobenzene, HCl and phosgene recovered, the solvent recycled;
  monomeric MDI distilled off the crude, the bottoms polymeric MDI; part of the HCl recycled as
  the condensation's acid, the rest exported. Concept stage, sourced ratios, preliminary LCI.
description: |
  Aniline (aniline-1) and 50 wt% formalin (formaldehyde-1), 2.25 mol per mol, are condensed with
  30 % hydrochloric acid (0.10 mol HCl per mol of amino groups) in a seven-reactor cascade from
  323 to 429 K to the MDA mixture (51 wt% two-ring diamines, the rest lumped as the three-ring
  triamine), neutralised with caustic soda (chlor-alkali-1, 1.10 mol per mol HCl), washed and
  freed of water and the excess aniline, which is recycled; the brine is stripped of aniline and
  methanol and goes to wastewater treatment. The MDA, as a 27.1 % solution in MCB, meets a 35 %
  phosgene solution (2.06 kg phosgene per kg MDA; liquid phosgene from phosgene-1) in a mixing
  nozzle and a phosgenation tower (384 K, 160 kPa(a)); HCl and phosgene are separated, the
  phosgene is absorbed in chilled MCB and recycled, the MCB is distilled off and recycled, and
  monomeric MDI is distilled off the crude under vacuum (a fifth of the crude), the bottoms
  polymeric MDI. 6.5 % of the HCl is absorbed to the condensation's acid, the rest leaves as gas.
  The ratios and conditions are the nameplate examples of US 10 640 455 B1 (MDA) and
  US 10 364 214 B1 (phosgenation), the route that of the EU LVOC BREF (2017, Chapter 10).

  Every flow and composition is calculated by cheme process propagate: conversion reactors,
  component separators with ASSUMED recovery fractions, five recycles converged at tears and
  seven design specifications that set the fresh aniline, caustic, phosgene, MCB make-up and
  absorber water and the two splits from the sourced ratios. The duties are ASSUMED estimates
  with their arithmetic in the flowsheet (core has no formation enthalpies for MDA or MDI and no
  property package for these mixtures; DESIGN.md L-1, L-2). Phosgene is 0.784 kg per kg of crude
  MDI, as the BREF's example plant (0.78). Preliminary gate-to-gate LCI with mass allocation
  between monomeric MDI, polymeric MDI and HCl gas; the aniline, formalin, caustic soda and
  phosgene linked to their library producers, the other backgrounds gaps. TDI is left for
  another entry. Needs cheme-as-code 1.12.0.
families: [nitrogen-organics]
keywords: [MDI, methylene diphenyl diisocyanate, polymeric MDI, PMDI, isocyanates, MDA, methylenedianiline, aniline, formaldehyde, phosgene, phosgenation, monochlorobenzene, hydrogen chloride, polyurethanes]
facets:
  feedstock_basis: [fossil]
  product_classes: [chemicals]
  unit_operations: [reaction, distillation, absorption]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Ratios are sourced from patents,
# the separator splits and duties are assumed (DESIGN.md D-003..D-009).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD with closed mass, component and element balances (cheme validate, cheme process
    propagate: five tears and seven specifications converged). Ratios and conditions from
    US 10 640 455 B1 and US 10 364 214 B1; MDA and MDI lumped as two-ring and three-ring
    components; separator splits and duties ASSUMED. Preliminary gate-to-gate LCI. cheme maturity
    reaches no level (assumed separations and duties). Not reviewed.
chemistry:
  inputs:
