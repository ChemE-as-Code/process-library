# Simulation specs of bromine-1 (`cheme schema process-simulation`). The flowsheet is not solved
# in DWSIM: no property package covers the Ca/Na chloride brine with bromine and chlorine
# (DESIGN.md D-006). Only the heat boundary is declared: the steaming-out tower C101 is
# heated by the live steam S4 (a material stream; its energy balance is in scripts/balance.py)
# and loses about 3 % to the surroundings, so it has no utility energy port (adiabatic); the
# neutraliser T107's heat of neutralisation stays in the tail brine (D-009).
schema: cheme/simulation/v1
kind: simulation
specs:
  C101: {mode: adiabatic}
  T107: {mode: adiabatic}
