cutoff:
- key: emission-excluded:vent
  title: equipment-leaks emissions of V-103, C-104
  direction: output
  reason: 'process vent, not a leak: the separator and C-104 vent of non-condensables (air in-leakage,
    inerts of the chlorine, nitrogen from ammonia oxidation) with its bromine and chlorine traces, normally
    scrubbed, is not in the concept balance (the chlorine is taken inert-free, D-003); to be added with
    a vent scrubber at the next stage'
  source: D-013
- key: emission-excluded:h2s-ammonia
  title: equipment-leaks emissions of C-101
  direction: output
  reason: 'process vent, not a leak: the brine''s H2S is taken fully oxidised to sulfur in C-101 and its
    ammonia (150-200 ppm, US 4 719 096) is not modelled; any H2S stripped overhead or degassed before
    the tower and the N2/chloramines from ammonia are not estimated'
  source: D-004, D-005
- key: emission-excluded:non-routine
  title: non-routine emissions of the plant
  direction: output
  reason: start-up, shutdown and upsets (bromine or chlorine releases to the emergency scrubber) not estimated
    at the concept stage
  source: D-013
- key: emission-excluded:tanks
  title: storage-tank emissions of the plant
  direction: output
  reason: bromine storage and loading are outside the boundary (D-001)
  source: D-013
- key: emission-excluded:leaks
  title: equipment-leaks emissions of the plant
  direction: output
  reason: fugitive Br2 and Cl2 from flanges and seals are not estimated at the concept stage; to be added
    with the P&IDs
  source: D-013
- key: emission-excluded:effluent
  title: effluent emissions of the plant
  direction: output
  reason: 'no surface-water effluent: the tail brine is reinjected (treated as a waste to the reinjection
    route, product:TAILB) and the condensed live steam leaves with it'
  source: D-009
