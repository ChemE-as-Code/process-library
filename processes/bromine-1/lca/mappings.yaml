# bromine-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# None yet (DESIGN.md D-013): the preliminary inventory leaves every background unlinked, so the
# Atlas build reports the exchanges of this process as gaps (ADR 0022). What each
# should connect to is in lca/lca.yaml (`missing:`). Candidates once the shared vocabulary has
# them (not active, listed for the consolidated mapping PR):
#   feed:BRINE   -> a brine-extraction entry (well pumping, with the resource bromine in ground
#                   brine); none in lci/mappings.yaml or chemicals/chemicals.yaml yet
#   feed:CL2     -> a `chlorine` entry (liquid); with prefer_atlas the Atlas producer
#                   chlor-alkali-1 (product CL2) plus liquefaction
#   feed:H2SO4   -> `sulfuric-acid` (Atlas producer sulfuric-acid-1), if registered
#   feed:LIME    -> a hydrated-lime / calcium-hydroxide entry
#   feed:LPS     -> steam by mass (live steam, condensate lost); feed:LPH -> steam-heat
#   feed:POWER   -> the library default (electricity, medium voltage)
#   product:CW   -> cooling-water
#   product:TAILB -> a produced-brine reinjection treatment entry
#   product:SPACID -> a spent sulfuric acid treatment entry
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  # The build links live steam to an Atlas producer by its registry slug and finds several
  # (ammonia-1, hydrogen-1, utility-steam-ng-boiler), none of them LP steam at 350 kPa(a) from a
  # chosen site boiler: kept out of the Atlas until the site's steam supply is decided.
  "feed:LPS":
    atlas: false
    source: >-
      LP steam 350 kPa(a) saturated, live steam injected into C-101 (kg, condensate lost with the
      tail brine; S4, D-006). The site boiler and its fuel are not chosen (D-013), and the Atlas
      has no LP steam producer: ammonia-1's and hydrogen-1's export steam is superheated at high
      pressure and utility-steam-ng-boiler makes steam/mp-11bara. Not linked inside the Atlas
      until the steam supply is decided.
  # Mapping step of 2026-11-01 (ADR 0026): each entry below uses a reference the library already
  # holds. Notes above that call these exchanges unmapped describe the state before it. What is
  # still unmapped is a gap (lci/gaps.json), and this process is marked preliminary.
  "feed:CL2": {dataset: {path: processes/chlor-alkali-1/lca/dataset.yaml, product: "product:CL2"}, source: "the Atlas producer chlor-alkali-1, dry chlorine gas 400 kPa(a); this feed is vaporised liquid chlorine, whose liquefaction is not counted (screening)"}
  "feed:H2SO4": {use: sulfuric-acid, source: "sulfuric acid 98 wt-% for drying, the shared entry, counted as the solution"}
  "feed:LPH": {use: steam-heat, source: "LP steam 350 kPa(a), counted as heat delivered (kWh); the shared entry converts it to the background's heat from steam, which does not distinguish pressure levels"}
