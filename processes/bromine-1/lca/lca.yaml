# Goal and scope of the bromine-1 LCI. Schema: `cheme schema lca`. Outputs: `cheme assess lca
# --inventory --write` (lca/inventory.csv, dataset.yaml, gaps.csv, manifest.json); never edit
# those by hand.
#
# A preliminary gate-to-gate inventory (DESIGN.md D-013): every foreground exchange of the
# balanced flowsheet (D-006) per kg of bromine product. No background is linked yet: every feed,
# utility and waste route is declared `missing:` with the activity it should connect to later,
# so it is a gap in every category, never 0. No values from licensed databases are used.
schema: cheme/lca/v1
kind: lca
goal: >-
  Preliminary gate-to-gate life cycle inventory of bromine (99.96 wt-% Br2) recovered from a
  Smackover-type bromide brine by chlorine oxidation and steaming-out, for the concept stage:
  the foreground exchanges of the balanced flowsheet per kg of bromine, ready to be linked to
  background datasets (chlor-alkali-1's chlorine first). No impact assessment is claimed.
# 1 kg of the product stream S12 (3 750 kg/h, 99.957 wt-% Br2)
functional_unit: {product: BR2, amount: 1, unit: kg, kg_per_unit: 1.0, source: "S12: 3 750 kg/h dry bromine, 99.957 wt-% Br2, 400 ppm Cl2, 30 ppm water (D-002)"}
boundary: gate-to-gate
year: 2026
location: GLO
technology: "Hot-brine steaming-out tower (chlorine oxidation of bromide, live LP steam), bromine condenser and gravity separator, chlorine stripping column, sulfuric acid drying, lime neutralisation of the tail brine; 30 kt/a Br2 from 913 t/h brine at 4 300 mg/kg bromide; chlorine from a chlor-alkali plant"
rights: "CC-BY-4.0: the ChemE-as-Code process library's own concept design (LICENSE-DATA)"
case: design
system_model: cutoff
flows:
  # ---- raw materials ----
  - {key: feed:BRINE, missing: "not linked yet: extraction of bromide-bearing brine from deep wells (well pumping electricity, wells, gathering pipeline and their maintenance) per kg brine at the plant fence, plus the resource bromine in ground brine (4 300 mg Br per kg); no such dataset in the library yet", source: "S1, D-004"}
  - {key: feed:CL2, missing: "not linked yet: chlorine from membrane-cell chlor-alkali electrolysis, liquefied and vaporised at the user (inerts removed); link processes/chlor-alkali-1 lca/dataset.yaml (product CL2) with chlorine liquefaction added, or a market for chlorine, liquid", source: "S3, D-003"}
  - {key: feed:H2SO4, missing: "not linked yet: sulfuric acid 98 wt-% from sulfur burning (double contact); link processes/sulfuric-acid-1 lca/dataset.yaml or a market for sulfuric acid", source: "S13, D-008"}
  - {key: feed:LIME, missing: "not linked yet: hydrated lime (calcium hydroxide) from limestone calcination and slaking, including the process CO2 of calcination, per kg Ca(OH)2", source: "S16, D-009"}
  # ---- utilities ----
  - {key: feed:LPS, missing: "not linked yet: LP steam 350 kPa(a) saturated from the site boiler (fuel not chosen; natural gas assumed for a later screening), per kg of live steam injected (condensate not returned, it leaves with the tail brine)", source: "S4, D-006"}
  - {key: feed:LPH, missing: "not linked yet: heat from LP steam 350 kPa(a) from the site boiler (condensate returned), per kWh", source: "Q2, D-007"}
  - {key: feed:POWER, missing: "not linked yet: grid electricity, medium voltage, for the site's market (US SERC region for an Arkansas site, D-002); the packaged open profile desnz-ghg-2026 is available for a later screening", source: "Q5, Q6; D-011"}
  - {key: product:CW, missing: "not linked yet: heat rejection to a recirculating cooling-water circuit with cooling tower (pump and fan electricity, make-up water, treatment chemicals) per kWh removed; processes/utility-cooling-tower", source: "Q1, Q3, Q4; D-010"}
  # ---- wastes to treatment ----
  - key: product:TAILB
    treatment: {kind: waste, route: "reinjection of the neutralised tail brine (about 31 wt-% NaCl/CaCl2, 189 mg/kg bromide, 230 mg/kg suspended sulfur) into the brine-producing formation through injection wells; returned to where it was extracted, not discharged to surface water", hazardous: false}
    missing: "not linked yet: deep-well reinjection of produced brine (injection pumping electricity, wells and pipeline), per kg brine; no such dataset in the library yet"
    source: "S17, D-009"
  - key: product:SPACID
    treatment: {kind: waste, route: "spent sulfuric acid 80 wt-% (traces of bromine) to neutralisation, or to an acid regeneration plant", hazardous: true}
    missing: "not linked yet: treatment of spent sulfuric acid by neutralisation with lime (or regeneration in a sulfuric acid plant), per kg of acid"
    source: "S14, D-008"
operation: {hours_per_year: 8000, life_years: 25, source: "design basis, D-002; life ASSUMED"}
emission_exclusions:
  # vent and h2s-ammonia are process vents; the schema has no process-vent method, so they are
  # filed under equipment-leaks with their equipment named (DESIGN.md O-9)
  - {id: vent, method: equipment-leaks, equipment: [V-103, C-104], reason: "process vent, not a leak: the separator and C-104 vent of non-condensables (air in-leakage, inerts of the chlorine, nitrogen from ammonia oxidation) with its bromine and chlorine traces, normally scrubbed, is not in the concept balance (the chlorine is taken inert-free, D-003); to be added with a vent scrubber at the next stage", source: "D-013"}
  - {id: h2s-ammonia, method: equipment-leaks, equipment: [C-101], reason: "process vent, not a leak: the brine's H2S is taken fully oxidised to sulfur in C-101 and its ammonia (150-200 ppm, US 4 719 096) is not modelled; any H2S stripped overhead or degassed before the tower and the N2/chloramines from ammonia are not estimated", source: "D-004, D-005"}
  - {id: non-routine, method: non-routine, reason: "start-up, shutdown and upsets (bromine or chlorine releases to the emergency scrubber) not estimated at the concept stage", source: "D-013"}
  - {id: tanks, method: storage-tank, reason: "bromine storage and loading are outside the boundary (D-001)", source: "D-013"}
  - {id: leaks, method: equipment-leaks, reason: "fugitive Br2 and Cl2 from flanges and seals are not estimated at the concept stage; to be added with the P&IDs", source: "D-013"}
  - {id: effluent, method: effluent, reason: "no surface-water effluent: the tail brine is reinjected (treated as a waste to the reinjection route, product:TAILB) and the condensed live steam leaves with it", source: "D-009"}
dataset:
  version: 0.1.0
  geography: {description: "One concept design on a Smackover-type brine field (southern Arkansas brine basis); site not chosen", site: "generic brine-field site"}
  system_model: cutoff
  technology_level: current
  classification: {isic: "2011", cpc: "34210"}   # CPC Ver. 2.1 34210: chemical elements n.e.c. (incl. bromine), to confirm
  modelling: {principle: attributional}
  review: unreviewed
  data_generator: "ChemE-as-Code process library, bromine-1 concept design (agent run, unreviewed)"
