# Pipe routing intent. Schema: `cheme schema routing` (skill pipe-routing).
# Racks: PR1 tank area, PR2 the ~2 km trestle, PR3 to the BOG area and the flare, PR4 north
# to the trains (layout/site-plan.yaml). Liquid on the lower tier, vapour and utilities on the
# upper (D-013, ASSUMED). Battery-limit points: the trains (north end of PR4), the liquid
# burner, fuel gas and oily water at their areas; the six sheet junctions where a line changes
# its number with its size (D-021) are fixed points so both lines meet there.
# Pipe centrelines resting on a tier are "tier + outside radius with insulation"; the
# insulation of piping/pipe-specs.yaml (D-012: 200 mm on LNG-4001 / LNG-4002, 150 mm on
# BOG-4001 / BOG-4002, 80 mm on the other cold lines, ASSUMED) sets that radius (D-027).
rules:
  tiers:
    # main racks PR1-PR4 at 7 / 10 m, riser racks PR5 / PR6 at 12 / 14 m (layout/site-plan.yaml)
    - {rack: PR1, elevation: 7, fluids: [LNG, Water]}
    - {rack: PR1, elevation: 10, fluids: [Boil-off gas, Flare gas, Nitrogen, Instrument air, Fuel gas]}
    # on the trestle the small utilities ride on the bottom tier, so the two DN 750 vapour
    # returns have the top tier to themselves
    # the N2 mains ride on the top tier of the trestle: they cross loading line B at the
    # platform end to reach the Berth 2 tie-in west of it (ASSUMED)
    - {rack: PR2, elevation: 7, fluids: [LNG, Instrument air]}
    - {rack: PR2, elevation: 10, fluids: [Boil-off gas, Nitrogen]}
    - {rack: PR3, elevation: 7, fluids: [LNG, Nitrogen, Instrument air]}
    - {rack: PR3, elevation: 10, fluids: [Boil-off gas, Flare gas, Fuel gas]}
    - {rack: PR4, elevation: 7, fluids: [LNG]}
    - {rack: PR4, elevation: 10, fluids: [Boil-off gas]}
    - {rack: PR5, elevation: 12, fluids: [LNG]}
    - {rack: PR5, elevation: 14, fluids: [Boil-off gas, Air, Flare gas]}
    - {rack: PR6, elevation: 12, fluids: [LNG]}
    - {rack: PR6, elevation: 14, fluids: [Boil-off gas, Air, Flare gas]}
  local_max_m: 20
  # tank relief valve tailpipes on the pump platform: the outlet rises until the 3 m zone 1
  # sphere (Z-HA-TANK-PSV) clears the platform floor and its 2.1 m headroom (D-027, ASSUMED)
  vents:
    - {lines: [BOG-2002, BOG-2003, BOG-2004, BOG-3002, BOG-3003, BOG-3004], radius_m: 3.0, max_rise_m: 9.0}
  battery_limits:
    # trains 1-4 (north end of PR4): rundown in, compressed BOG out
    # points are pipe centrelines resting on the tier (tier + outside radius with insulation)
    - {id: BL-train-1, lines: [LNG-1001], point: [1088.587, 3620.0, 7.537]}
    - {id: BL-train-2, lines: [LNG-1012], point: [1093.0, 3620.0, 7.34]}
    - {id: BL-train-3, lines: [LNG-1013], point: [1096.0, 3620.0, 7.34]}
    - {id: BL-train-4, lines: [LNG-1014], point: [1099.0, 3620.0, 7.34]}
    # compressed BOG on the west half of PR3 / PR4's top tier, west of the lines that turn
    # east at the PR3 corner, so it reaches the trains without crossing them
    - {id: BL-train-BOG, lines: [BOG-7002], point: [1090.5, 3620.0, 10.34]}
    # make-up gas from the trains' fuel gas system (D-025 item 1), independent of the
    # terminal's compressors: from the trains at the north end of PR4 (ASSUMED tie-in)
    - {id: BL-train-FG, lines: [FG-1001], point: [1089.0, 3620.0, 10.164]}
    # site systems
    - {id: BL-liquid-burner, lines: [LNG-8001], point: [1500.0, 3070.0, 1.0]}
    - {id: BL-fuel-gas, lines: [FG-8001, FG-8002], rack: PR3, rack_end: end}
    - {id: BL-oily-water, lines: [W-8002], point: [1000.0, 2952.0, 0.5]}
    - {id: BL-site-N2, lines: [N-8001], rack: PR3, rack_end: end}
    - {id: BL-site-IA, lines: [IA-8001], rack: PR3, rack_end: end}
    # sheet junctions where the line number changes with the size (D-021); the DN 800 trestle
    # lines rest on the bottom tier with their 200 mm insulation (centreline 7.6065), so the
    # tank pump headers arrive at that height on raised shoes (ASSUMED, D-027)
    # on PR1 east of the riser racks, where each tank's pump header has come down (ASSUMED)
    # at the foot of each pump header's riser rack drop onto PR1, so the trestle line takes the
    # whole PR1 run on its own tier (ASSUMED)
    - {id: J-T2101-header, lines: [LNG-2001, LNG-4001], point: [984.66, 2940.0, 7.6065]}
    # on the PR1 bottom-tier lane y 2946 that loading line B keeps to the trestle (ASSUMED)
    - {id: J-T3101-header, lines: [LNG-3001, LNG-4002], point: [843.75, 2946.0, 7.6065]}
    # 2.5 m off the platform end of PR2 (y 890), each in line with its trestle lane, line A
    # west of line B, so the lines leave the rack straight and the berth headers fan out to
    # their face from there (ASSUMED).
    - {id: J-Berth2-liquid, lines: [LNG-4001, LNG-5001], point: [1149.659, 887.5, 7.6065]}
    - {id: J-Berth1-liquid, lines: [LNG-4002, LNG-6001], point: [1156.096, 887.5, 7.6065]}
    # carrier manifolds: the outboard arm (ERS, couplers) ends at the ship's manifold flange,
    # 3.15 m outboard of the arm's outboard nozzle at the arm apex, clear of the ship envelope
    # boxes of layout/zones.yaml (ASSUMED, D-014; the arm vendor's envelope replaces it)
    - {id: BL-carrier-B2-L1, lines: [LNG-5011], point: [1131.5, 878.0, 19.0]}
    - {id: BL-carrier-B2-V, lines: [BOG-5012], point: [1131.5, 884.0, 19.0]}
    - {id: BL-carrier-B2-H, lines: [LNG-5013], point: [1131.5, 890.0, 19.0]}
    - {id: BL-carrier-B2-L2, lines: [LNG-5014], point: [1131.5, 896.0, 19.0]}
    - {id: BL-carrier-B1-L1, lines: [LNG-6011], point: [1178.5, 878.0, 19.0]}
    - {id: BL-carrier-B1-V, lines: [BOG-6012], point: [1178.5, 884.0, 19.0]}
    - {id: BL-carrier-B1-H, lines: [LNG-6013], point: [1178.5, 890.0, 19.0]}
    - {id: BL-carrier-B1-L2, lines: [LNG-6014], point: [1178.5, 896.0, 19.0]}
    # vapour returns on their trestle lanes (PR2 top tier, 5.7 m and 4.4 m west of the rack
    # centreline, 150 mm insulation: centreline 10.531), 2.5 m off the platform end of PR2
    - {id: J-Berth2-vapour, lines: [BOG-5001, BOG-4001], point: [1148.372, 887.5, 10.531]}
    - {id: J-Berth1-vapour, lines: [BOG-6001, BOG-4002], point: [1149.672, 887.5, 10.531]}
