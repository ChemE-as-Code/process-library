  - {number: N-5001, from: N-8001 (between HV-5151 and HV-5152), to: atmosphere, nominal_diameter: DN25, pressure_class: Class 150, fluid: Nitrogen, insulation: none, sheet: P-05, notes: 'Bleed of the N2 double block and bleed HV-5151 / HV-5153 / HV-5152: open to atmosphere while the N2 tie-in is isolated, so that LNG cannot reach the N2 system (review #18, H-03 A7).'}
  - {number: DR-5001, from: LNG-5001, to: D-5101, nominal_diameter: DN150, pressure_class: Class 150, fluid: LNG, insulation: cold (PIR), sheet: P-05, notes: 'Header and arm drain to the jetty drain drum after loading through XV-5161 (fail closed, closed in cooldown and loading, opened for the drain in SEQ-LOAD S6). Downstream of XV-5161 it receives the surge relief PSV-5131 (DR-5002, DN 150, so DR-5001 is DN 150 throughout), the arm thermal relief PSV-5171 (DR-5004), PSV-5173 and PSV-5174 (DR-5003, DR-5005), the drain pump thermal relief PSV-5118 (DR-5006) and the drain pump vent/drain HV-5119 (DR-5007), so the relief outlets stay open to D-5101 (D-016, review #1).'}
