e station is austenitic stainless steel, Class 150 (the material of the LNG service, piping/pipe-specs.yaml), because the section from HV-4153 to the tee holds LNG at -160 degC and the bleed section can; that section takes cold insulation (PIR, as the loading lines'' branches), the rest of the station may stay bare (piping detail). Drawn on P-04 only (the site N2 at the battery limit).'}
