  - {number: LNG-4005, from: LNG-4002, to: T-2101, nominal_diameter: DN250, pressure_class: Class 150, fluid: LNG, insulation: cold (PIR), sheet: P-04, notes: 'Circulation return from line B to the tanks (holding, S10); to T-2101 or, via LNG-4009, T-3101 (D-008); thermal relief PSV-4114 between XV-4105 and the tank valves.'}
  - {number: LNG-4009, from: LNG-4005, to: T-3101, nominal_diameter: DN250, pressure_class: Class 150, fluid: LNG, insulation: cold (PIR), sheet: P-04, notes: Circulation return branch to T-3101. Drawn on P-04 and P-03.}
  - {number: LNG-4001, from: LNG-2001 (P-02), to: LNG-5001 (P-05), nominal_diameter: DN800, pressure_class: Class 150, fluid: LNG, insulation: cold (PIR 200 mm), sheet: P-04, notes: 'Loading line A over the trestle, ~2.16 km routed (~2.45 km with the tank area and platform runs, D-013); 6,000 m3/h at 3.4 m/s in every 12,000 m3/h line-up, both lines reaching the loading berth through the DN 800 platform crossover LNG-4010; ~147 kPa over the trestle with its expansion loops (D-008, D-011, D-034); out-leg of the circulation loop in holding (S2 holding). Butt-welded from the PR1 joint to the shore ESD valve (no flanged joint, spool, drain, vent or tapping on the trestle and platform DN 800 runs, piping/pipe-specs.yaml Class 150, D-035.6); its only branches there are the relief tee T4A3 and the N2 tee T4A6 at the PR1 joint and the welded crossover tees at the platform (D-036). Falls without a pocket from the PR1 joint (+15.3 m CD grade) to the platform crossover tees, whose branches leave from the bottom of the line, so that in SEQ-LINE-EMPTY the liquid the N2 overruns drains along the bottom to them and not to a platform-end leak (expansion loops flat in the rack plane; checker of D-036).'}
  - {number: LNG-4002, from: LNG-3001 (P-03), to: LNG-6001 (P-06), nominal_diameter: DN800, pressure_class: Class 150, fluid: LNG, insulation: cold (PIR 200 mm), sheet: P-04, notes: 'Loading line B, as LNG-4001 (~2.31 km routed); reaches Berth 2 through the DN 800 platform crossover LNG-4010 / XV-4107, as line A reaches Berth 1 (D-034); return leg of the circulation loop in holding through the DN 250 platform crossover LNG-4003 (D-008). Butt-welded as LNG-4001, its PR1-joint branches the relief tee T4B3 and the N2 tee T4B6 (D-035.6, D-036); falls without a pocket to the bottom-of-line platform crossover tees as LNG-4001.'}
  - {number: LNG-4010, from: LNG-4001, to: LNG-4002, nominal_diameter: DN800, pressure_class: Class 150, fluid: LNG, insulation: cold (PIR), sheet: P-04, notes: 'Platform crossover DN 800 (review 2026-11-05-basic-design-7 #1, D-034): open in loading, so both DN 800 lines reach the loading berth at 6,000 m3/h each (3.4 m/s, ~6 kPa across it); ESD valve XV-4107 (UZ-4107, fail closed, closed by ESD-1 of either berth after the pumps have stopped, 25-30 s), closed in holding. Butt-weld ends on the valve and tees, ASSUMED (no gasketed joint on the trestle side of the shore ESD valves, D-034). Its tees T4A5 / T4B5 take it off the bottom of both loading lines, so it is also a crossover of SEQ-LINE-EMPTY when XV-4103 is the leaking item (D-036).'}
  - {number: LNG-4003, from: LNG-4001, to: LNG-4002, nominal_diameter: DN250, pressure_class: Class 150, fluid: LNG, insulation: cold (PIR), sheet: P-04, notes: 'Platform crossover DN 250, the holding circulation bypass (~314 m3/h, S10; 500 m3/h at 2.7 m/s): open in holding, closed in loading, when the DN 800 crossover LNG-4010 carries line B to Berth 2 or line A to Berth 1 (D-008, D-034; 6,000 m3/h in DN 250 would be ~33 m/s, review 2026-11-05-basic-design-7 #1); the crossover of SEQ-LINE-EMPTY (~450 m3/h at ~2.5 m/s, D-036), so its tees T4A4 / T4B4 take it off the bottom of both loading lines, at the low point of the trestle run above the drops to the berth headers (checker of D-036: with a side or top takeoff the liquid below it, a stratified wedge of up to ~500 m at the line''s ~0.16 % fall, would stay in the line and drain to the leak). Butt-weld ends, no tapping: the jetty drain pump returns enter the berth headers downstream of XV-5101 / XV-6101 since D-036 (layout review 2026-11-05-basic-layout-6 #2).'}
  - {number: LNG-4006, from: LNG-4001, to: LNG-4002, nominal_diameter: DN800, pressure_class: Class 150, fluid: LNG, insulation: cold (PIR), sheet: P-04, notes: 'Tank-end crossover: either tank''s pumps load through both lines (D-008, D-011); thermal relief PSV-4113.'}
  - {number: N-4001, from: BL (site N2), to: LNG-4001, nominal_diameter: DN80, pressure_class: Class 150, fluid: Nitrogen, insulation: cold (PIR), sheet: P-04, notes: 'Tank-end N2 connection of loading line A for SEQ-LINE-EMPTY (layout review 2026-11-05-basic-layout-6 #2, D-036): site N2 at 7 barg into the trestle side of XV-4101 at the PR1 joint (the high end of the line), ~4,000 Nm3/h set by the restriction orifice FO-4151 (choked, ~39 mm bore, ASSUMED), ~3.7 bar(a) at the line, so the line''s ~1,030 m3 return downhill through the bottom-of-line platform crossover and the other loading line to the tanks in ~2.3 h (D-036); at least 3,500 Nm3/h (site N2 at 6 barg or more at PI-4155) keeps the leak within the 240 min PFP and the 40 m3 kept in T-8102 (D-039). PI-4155 upstream of FO-4151 reads the site N2 at the station, PI-4156 downstream of the regulator PCV-4159 the injection pressure (choked while PI-4155 is at least ~1.9 times PI-4156 in absolute terms). PCV-4159: self-acting pressure regulator between FO-4151 and CV-4151, set at 3.0 barg (ASSUMED; review 2026-11-05-basic-design-9 #3, D-039): wide open during the displacement (the line takes ~2.7 barg), it holds the emptied line at ~3 barg in SEQ-LINE-EMPTY S3 instead of the 7 barg site N2, so the leak is never driven harder than in the displacement; failed open it leaves 7 barg, below the 15 barg line design. Double block HV-4152 (outer) / HV-4151 (inner) with the check valve CV-4151 and the bleed HV-4161 between them (line N-4003); no blind. Since D-039 (review 2026-11-05-basic-design-9 #5, #6) the bleed is locked closed and the local gauge PI-4163 between the blocks is read on rounds (a rising reading: a passing block) and, with HV-4151 opened and HV-4152 and HV-4161 closed (CV-4151 holding), gives the pressure of the isolated line at its tank end; the bleed is opened only under permit with a gas test, to depressurise the section before maintenance. Spec break at the battery-limit flange upstream of HV-4152: the station is austenitic stainless steel, Class 150 (the material of the LNG service, piping/pipe-specs.yaml), because the section from HV-4151 to the tee holds LNG at -160 degC and the bleed section can; that section takes cold insulation (PIR, as the loading lines'' branches), the rest of the station may stay bare (piping detail). Drawn on P-04 only (the site N2 at the battery limit).'}
  - {number: N-4003, from: N-4001 (between HV-4152 and HV-4151), to: atmosphere, nominal_diameter: DN25, pressure_class: Class 150, fluid: Nitrogen, insulation: none, sheet: P-04, notes: 'Bleed of the N2 double block and bleed HV-4152 / HV-4161 / HV-4151 of N-4001. Locked closed since D-039 (review 2026-11-05-basic-design-9 #5: open, it vented any LNG passing the inner block continuously at grade): PI-4163 between the blocks shows a passing block on rounds instead, and the bleed is opened only under permit with a gas test, to depressurise the section before maintenance, its outlet at 2.5 m over the PR1 trough collection (D-037.15 (g)). A passing inner block then connects the section to the line, not to the N2 system (CV-4151 and the outer block hold; the station is Class 150 austenitic stainless). Austenitic stainless steel as N-4001.'}
