  - {number: BOG-6001, from: LA-6102, to: BOG-4002 (P-04), nominal_diameter: DN400, pressure_class: Class 150, fluid: Boil-off gas, insulation: cold (PIR), sheet: P-06, notes: 'Berth 1 vapour line from the vapour arm (and the hybrid arm) to vapour return line B; one 16 inch vapour arm carries ~23.5 t/h of the -120 degC return at 40 m/s (D-023). The vapour arm is needed for every transfer (XV-6122 proven open by ZSO-6122); the hybrid arm normally runs as the third liquid arm and is the second vapour path of line-up (b) only; above the vapour arm''s capacity the carrier burns gas on board or the loading rate is reduced (D-023, D-026.6, D-032). Receives the drain drum vent BOG-6002; the berth O2 analyser AI-6126 samples it downstream of both vapour isolations (D-032).'}
