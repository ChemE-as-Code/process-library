  - {number: BOG-5002, from: D-5101, to: BOG-5001, nominal_diameter: DN100, pressure_class: Class 150, fluid: Boil-off gas, insulation: cold (PIR), sheet: P-05, notes: 'Drain drum vent to the vapour line, downstream of XV-5122; no valve: it is the relief path of D-5101 and stays open (review #1). After loading it also carries the hydrocarbon purge N2 of the arms, drained to D-5101, into the vapour return (to the flare while AI-4133 reads off-specification; D-026.13).'}
  - {number: LNG-5005, from: D-5101, to: P-5101, nominal_diameter: DN100, pressure_class: Class 150, fluid: LNG, insulation: cold (PIR), sheet: P-05, notes: Drain pump suction with its isolation valve HV-5115.}
  - {number: LNG-5006, from: P-5101, to: LNG-5001, nominal_diameter: DN80, pressure_class: Class 150, fluid: LNG, insulation: cold (PIR), sheet: P-05, notes: 'Drain pump discharge into the Berth 2 header LNG-5001 downstream of the shore ESD valve XV-5101 (tee T50K), ~60 m3/h: D-5101 is emptied into the cooldown flow to the arms and the carrier in SEQ-LOAD S3 of the next transfer, with XV-5101 open (D-036; was a tie-in into the platform crossover LNG-4003 on the trestle side of XV-5101, layout review 2026-11-05-basic-layout-6 #2, so its flanged check and isolation valves are no longer fed by the trestle line after an ESD). Minimum-flow take-off and the vent/drain HV-5119 upstream of the check valve CV-5116, then the thermal relief PSV-5118 and the isolation valve HV-5117 (review #2, H-03 A4). Drawn on P-05 only.'}
  - {number: DR-5006, from: LNG-5006 (PSV-5118), to: DR-5001, nominal_diameter: DN25, pressure_class: Class 150, fluid: LNG, insulation: cold (PIR), sheet: P-05, notes: Thermal relief of the drain pump discharge through PSV-5118 into DR-5001 downstream of XV-5161.}
  - {number: DR-5007, from: LNG-5006 (HV-5119), to: DR-5001, nominal_diameter: DN25, pressure_class: Class 150, fluid: LNG, insulation: cold (PIR), sheet: P-05, notes: 'Vent/drain of the drain pump P-5101 between its suction isolation HV-5115 and discharge isolation HV-5117, through the normally closed HV-5119 into DR-5001 downstream of XV-5161, to D-5101 (review #2).'}
