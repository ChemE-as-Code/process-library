  - {number: LNG-5013, from: LA-5103, to: carrier manifold, nominal_diameter: DN400, pressure_class: Class 150, fluid: LNG, insulation: cold (PIR), sheet: P-05, notes: 'Hybrid arm outboard: arm, ERS (XV-5133, emergency release coupler, XV-5143), quick connect/disconnect coupler, carrier manifold (D-014).'}
