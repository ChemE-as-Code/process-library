  # ---- P-05
  - {number: LNG-5001, from: LNG-4001 (P-04), to: LA-5103, nominal_diameter: DN800, pressure_class: Class 150, fluid: LNG, insulation: cold (PIR), sheet: P-05, notes: 'Berth 2 liquid header on the loading platform, 12,000 m3/h at loading (S3); shore ESD valve XV-5101 and strainer SR-5102 (S-01: shore strainers; D-016). SR-5102 is a permanent horizontal T-type strainer with a top cover (ASSUMED, vendor; was drawn as a conical temporary strainer): its basket lifts vertically through the gap between PR10''s top-tier beams (the layout''s removal path, D-037.1 (c)), the cover takes the PFP jacket of Class 150 (d); PDI-5102 across it is transmitted to the control room with a PDAH (D-039). After ESD-1 the header and the arms stay open to the carrier''s manifold spool behind its closed ESD valve: the lowest-set relief of that section is the arm thermal reliefs PSV-5171 / 5173 / 5174 at 8.0 barg, below the carrier''s 10 barg (D-016, D-039).', segments: [{number: S7, nominal_diameter: DN400, notes: 'to the hybrid arm, after the LA-n104 tee'}, {number: S8, nominal_diameter: DN400, notes: 'hybrid arm connection, to the thermal relief tee'}, {number: S9, nominal_diameter: DN400, notes: 'hybrid arm connection, thermal relief tee to the arm'}]}
  - {number: LNG-5002, from: LNG-5001, to: LA-5101, nominal_diameter: DN400, pressure_class: Class 150, fluid: LNG, insulation: cold (PIR), sheet: P-05, notes: Liquid arm LA-5101 shore connection with its isolation valve and the thermal relief tee of the arm section.}
  - {number: LNG-5003, from: LNG-5001, to: LA-5104, nominal_diameter: DN400, pressure_class: Class 150, fluid: LNG, insulation: cold (PIR), sheet: P-05, notes: Liquid arm LA-5104 shore connection with its isolation valve and the thermal relief tee of the arm section.}
  - {number: BOG-5001, from: LA-5102, to: BOG-4001 (P-04), nominal_diameter: DN400, pressure_class: Class 150, fluid: Boil-off gas, insulation: cold (PIR), sheet: P-05, notes: 'Berth 2 vapour line from the vapour arm (and the hybrid arm) to vapour return line A; one 16 inch vapour arm carries ~23.5 t/h of the -120 degC return at 40 m/s (D-023). The vapour arm is needed for every transfer (XV-5122 proven open by ZSO-5122); the hybrid arm normally runs as the third liquid arm and is the second vapour path of line-up (b) only; above the vapour arm''s capacity the carrier burns gas on board or the loading rate is reduced (D-023, D-026.6, D-032). Receives the drain drum vent BOG-5002; the berth O2 analyser AI-5126 samples it downstream of both vapour isolations (D-032).'}
  - {number: BOG-5003, from: LA-5103, to: BOG-5001, nominal_diameter: DN400, pressure_class: Class 150, fluid: Boil-off gas, insulation: cold (PIR), sheet: P-05, notes: 'Hybrid arm to the vapour line: the second vapour path of line-up (b), beside the vapour arm, never instead of it (D-026.6, D-032); XV-5125 opens only with XV-5123 closed (ZSC-5123 / ZSC-5125).'}
