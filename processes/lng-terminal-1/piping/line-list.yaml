  - {number: LNG-8006, from: LNG-8001 (PSV-8109), to: D-8101, nominal_diameter: DN25, pressure_class: Class 150, fluid: LNG, insulation: cold (PIR), sheet: P-08, notes: 'Thermal relief outlet of PSV-8109 (common discharge LNG-8001 between HV-8108A/B and the battery limit) back to the knock-out drum D-8101, own nozzle N8 (HAZOP H-05 A3).'}
  - {number: W-8002, from: P-8102, to: BL (oily water), nominal_diameter: DN100, pressure_class: Class 150, fluid: Rainwater, insulation: none, sheet: P-08, notes: 'Riser of the submersible rainwater pump P-8102 from the floor pocket of T-8101 (the pit kept dry, D-039) up through the pit cover, then along PR8 to the site oily water system; interlocked off on LNG in the sump (C&E I-801, the feeder isolated; TSL-8120 in its flow upstream of CV-8114). Static lift ~27.8 m from the pocket floor, 1.2 m below the 19.5 m pit floor, to the PR8 rack (D-036, D-039). Check valve CV-8114 and isolation valve HV-8115 above the pit cover (no back-flow into the impoundment, the pump pulled with the riser isolated). Self-draining against freezing (design ambient -20 degC; adversarial check of review 2026-11-05-basic-design-9, D-039, as W-8003 in D-037.17): CV-8114 has a drain-back hole in its disc (~6 mm, ASSUMED), so when P-8102 stops the riser drains back through the pump into the pocket (~0.23 m3, ~0.10 m of pocket level, below the start level) and the run on PR8 is laid to fall to the battery limit (ASSUMED, layout), so no water stands above the cover; no heat tracing. Austenitic stainless steel from the pump to the isolation valve, design -170 degC (the first item a spill reaches, D-036), ASSUMED.'}
  - {number: W-8003, from: P-8103, to: BL (jetty drain), nominal_diameter: DN80, pressure_class: Class 150, fluid: Rainwater, insulation: none, sheet: P-08, notes: 'Discharge of the dry-sump pump P-8103 from the T-8102 floor pocket up through the sump cover to the jetty drain at the edge of the sump deck A9 (battery limit; its outfall, treatment and consent the civil and environmental owners'', ASSUMED): ~20 m3/h of rain, ~1.1 m/s in DN 80. Check valve CV-8116 (no full reverse flow and reverse spin through a stopped pump) with a drain-back hole in its disc (~6 mm, ASSUMED) and isolation valve HV-8117 (the pump pulled with its column isolated) above the cover. Self-draining against freezing (design ambient -20 degC, D-037.17): when the pump stops, the column, the discharge head and the riser drain back through the disc hole and the bowl into the pocket (air enters from the open end at the drain), and the overhead run and the drop drain to the jetty drain (laid to a fall, ASSUMED), so no water stands above the cover; no heat tracing. Austenitic stainless steel from the pump to the battery limit, design -170 degC (an LNG spill reaches the pump first), ASSUMED. Started and stopped by LZT-8106 in the pocket (C&E I-806 / I-807), locked out on LNG by TSL-8104 in the pocket or TSL-8118 on the discharge head (1oo2, C&E I-808); D-037.15 (a), D-037.16, D-037.17.'}
  - {number: IA-8001, from: BL (site instrument air), to: instrument users, nominal_diameter: DN50, pressure_class: Class 150, fluid: Instrument air, insulation: none, sheet: P-08, notes: 'Instrument-air header of the terminal, 7 barg (D-020); low-low pressure trip PZT-8123A/B/C (2oo3, C&E I-804) initiates ESD-1 of both berths and the rundown trip before the fail-closed valves move (D-016, D-028).'}
