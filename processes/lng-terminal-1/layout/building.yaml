# Buildings. Schema: `cheme schema building`. Metres, site frame of layout/site-plan.yaml.
# Electrical buildings of the terminal (electrical/electrical-list.yaml) and the analyser house;
# sizes and positions ASSUMED at this stage, to be replaced by the electrical and civil design.
# Siting basis: DESIGN.md D-027.
buildings:
  - id: B-SUB
    title: "Terminal substation and control building: 6.6 kV switchgear SWG-1, 400 V MCC-1, control room CR-1 and its instrument rack room (ASSUMED)"
    # occupied: east of road R3, 63 m from the racks PR1 / PR2 / PR3 (rack valves and flanges,
    # the vapour switch station, the spill troughs under them), 85 m from the analyser house
    # B-ANA, 110 m from the nearest BOG compressor K-7101C, 189 m from the impoundment sump
    # T-8101 and from T-2101 (separations of layout/site-plan.yaml, ASSUMED screening values
    # until the CSA Z276 / NFPA 59A exclusion zones and a building siting study, D-027); outside
    # every hazardous zone of layout/zones.yaml; road access from R8 along its north side,
    # reached from R3 and, away from the troughs, from R11 (D-033); the cables leave the west
    # wall on the cable bridge PR7 to PR3.
    # Temporary refuge (D-037, review 2026-11-05-basic-layout-6 #4): in the tank-area design fire
    # no walk from B-SUB to the muster point Z-ESC-A1-MUSTER keeps 5 kW/m2 (S1 -> R11 -> R1 -> R4
    # ~6.3 at most; the north door over the R2 culvert far above), so the control room CR-1 and
    # the rooms of B-SUB are the occupants' temporary refuge for the duration of the trough fire:
    # 3.1 kW/m2 on the building (cladding and the AHU-1 intake LV1 on the east wall, ASSUMED
    # tolerable for a clad steel building at that flux), the intake gas detection with the AHU-1
    # trip and LV1 / LV2 damper closure of D-035.10 (layout/hvac.yaml) making it gas-tight, no
    # overpressure case of a pool fire (vapour cloud explosion and the dispersion of the 150 m
    # kept to the basin are the siting study's), held until the run-out has drained to the basin
    # and the open troughs no longer burn (~30 min ASSUMED: ~10 min of run-out plus the trough
    # drain-down), then evacuation by S1 -> R11 -> R1 -> R4 to the muster point with only the
    # basin and the pad fires burning (D-037 screening: at most 1.6 kW/m2 on that walk; 6.4 in
    # the design fire, which is why the occupants stay in the refuge while the troughs burn)
    origin: [1165, 2955]
    width: 30
    depth: 20
    use: substation
    levels:
      - {id: L0, title: "Ground floor on a 1.5 m cable cellar (not modelled)", elevation: 0, height: 5, kind: floor}
      - {id: RF, title: "Roof", elevation: 5, kind: roof}
    frame:
      grid_x: [0, 6, 12, 18, 24, 30]
      grid_y: [0, 10, 20]
    walls: all
    wall_material: cladding
    # offsets from the left end of the side seen from outside
    openings:
      - {id: N1, side: north, offset: 9, width: 3.0, height: 3.5, kind: roller_door}   # switchgear delivery from R8
      - {id: N2, side: north, offset: 20, width: 1.2, height: 2.2, kind: door}         # control room entrance / escape
      # escape door moved from the south wall, 10 m from the transformer bays, to the west wall
      # south of the PR7 cable bridge (review 2026-11-05-basic-layout-4 #6, D-033.6): it faces
      # R3, 70 m from the PR3 trough (2.6 kW/m2 from a trough fire incl. tilt)
      - {id: S1, side: west, offset: 15, width: 1.2, height: 2.2, kind: door}         # escape (y ~2960)
      # ventilation louvres of AHU-1 (layout/hvac.yaml): outdoor air in from the east (away
      # from the racks and the plant), exhaust out of the south wall
      - {id: LV1, side: east, offset: 12.5, width: 3.0, height: 2.0, sill: 2.5, kind: louvre}
      - {id: LV2, side: south, offset: 26, width: 3.0, height: 2.0, sill: 2.5, kind: louvre}
  - id: B-JET
    title: "Jetty substation and instrument room: 6.6/0.4 kV transformer TR-5, 400 V MCC-2, rack room RR-2 (ASSUMED)"
    # on a piled deck west of the trestle road R5, 208 m north of the nearest arm (LA-5104) and
    # 220 m from the Berth 2 vapour arm LA-5102, so outside the 200 m ignition-free radius and
    # the 200 m vapour-arm safety zone of both berths (D-018, separations of the site plan);
    # unclassified (no hazardous zone reaches it), so no pressurised room; the platform's
    # loads (arm HPUs, drain pumps) and junction boxes are fed from here over ~220-240 m of
    # cable on the PR2 trestle tray (D-027, ASSUMED)
    origin: [1116, 1104]
    width: 14
    depth: 12
    use: substation
    levels:
      - {id: L0, title: "Deck floor", elevation: 0, height: 4.5, kind: floor}
      - {id: RF, title: "Roof", elevation: 4.5, kind: roof}
    frame:
      grid_x: [0, 7, 14]
      grid_y: [0, 6, 12]
    walls: all
    wall_material: cladding
    openings:
      - {id: E1, side: east, offset: 3, width: 3.0, height: 3.5, kind: roller_door}   # transformer and switchgear delivery from R5
      - {id: E2, side: east, offset: 9, width: 1.2, height: 2.2, kind: door}         # entrance / escape to R5
      - {id: N1, side: north, offset: 6, width: 1.2, height: 2.2, kind: door}        # escape
      # ventilation louvres of AHU-2: outdoor air in from the west wall (away from the trestle
      # and the road), exhaust out of the south wall
      - {id: LV1, side: west, offset: 6, width: 2.0, height: 1.5, sill: 2.5, kind: louvre}
      - {id: LV2, side: south, offset: 2, width: 1.5, height: 1.5, sill: 2.5, kind: louvre}
  - id: B-ANA
    title: "Analyser house of AI-4133 / AI-4134 (carrier vapour CH4 / N2 / O2 at the tank end of the trestle, D-026.7), ASSUMED"
    # east of PR2's straight north end beside the vapour switch valve station, so the sample
    # lines from vapour returns A and B are short; its vent and sample conditioning are a
    # secondary release source (zone Z-HA-ANALYSER); 85 m from B-SUB (D-027, ASSUMED)
    origin: [1103.5, 2888]
    width: 4
    depth: 5
    use: analyser
    levels:
      - {id: L0, title: "Floor", elevation: 0, height: 3.0, kind: floor}
      - {id: RF, title: "Roof", elevation: 3.0, kind: roof}
    frame:
      grid_x: [0, 4]
      grid_y: [0, 5]
    walls: all
    wall_material: cladding
    openings:
      - {id: E1, side: east, offset: 2, width: 1.2, height: 2.2, kind: door}
