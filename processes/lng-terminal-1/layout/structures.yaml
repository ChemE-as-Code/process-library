# Steel structures and declared pipe supports. Schema: `cheme schema structures` (skill
# structures-access). Every size ASSUMED (D-027); sections are cheme-as-code's defaults by span.
schema: cheme/structures/v1
structures:
  # Tank-top pump platforms (D-027): the grated steel platform on the dome around the pump
  # column heads, with its edge handrails, the pump-removal gantry crane over the pump wells
  # and the set-down space for a pulled pump, carrying the relief and vacuum valves and the
  # column-head valves within reach of its floor (57.4 m, 1.4 m above the column head base
  # plates). Part of the tank supply, resting on the roof steel (ASSUMED). In the model a
  # structure stands on grade, so the platform is the one level of a frame spanning the whole
  # tank: its four corner columns outside the shell are a modelling artefact (the real platform
  # has no columns to grade), and its ways off are the roof walkways (escape zones
  # Z-ESC-Tn-ROOF-*) to the tank's spiral stair and to the north stair tower S-ESC-Tn.
  - id: S-T2101-TOP
    title: "T-2101 tank-top pump platform (pump column heads P-2101A-D, P-2102, relief and vacuum valves), tank supply, ASSUMED"
    origin: [881.4, 2977.8]
    spans_x: [96.0]
    spans_y: [96.0]
    levels:
      - {id: PP, title: "Pump platform floor", elevation: 57.4, kind: platform, extent: [49.1, 38.7, 79.6, 66.2], use: regular}
    notes: "Deck x 930.5-961.0, y 3016.5-3044 (site); corner columns are a modelling artefact (D-027)."
  - id: S-T3101-TOP
    title: "T-3101 tank-top pump platform (P-3101A-D, P-3102, relief and vacuum valves), as S-T2101-TOP, ASSUMED"
    origin: [741.4, 2977.8]
    spans_x: [96.0]
    spans_y: [96.0]
    levels:
      - {id: PP, title: "Pump platform floor", elevation: 57.4, kind: platform, extent: [49.1, 38.7, 79.6, 66.2], use: regular}
    notes: "Deck x 790.5-821.0, y 3016.5-3044 (site); corner columns are a modelling artefact (D-027)."
