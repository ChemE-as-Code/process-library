  # Tank-top pump platforms (D-027): the grated steel platform on the dome around the pump
  # column heads, with its edge handrails, carrying the relief and vacuum valves and the
  # column-head valves within reach of its floor (57.4 m, 1.4 m above the column head base
  # plates). Part of the tank supply, resting on the roof steel (ASSUMED). The in-tank pumps
  # are pulled through the column heads by a mobile crane on the pad north of the tank
  # (Z-PAD-Tn101N, D-029), not by a platform crane. In the model a structure stands on grade,
  # so the platform is the one level of a frame spanning the whole tank: its four corner
  # columns outside the shell are a modelling artefact (the real platform has no columns to
  # grade), and its ways off are the roof walkways (escape zones Z-ESC-Tn-ROOF-*) to the
  # tank's spiral stair and to the north stair tower S-ESC-Tn.
  # The frame's columns and perimeter beams are the artefact: they take the light section
  # HEA100, used nowhere else, so the take-off shows them as their own row (steel, HEA100,
  # structure) and the estimate prices that row at nothing with the reason (estimate/rates.yaml,
  # review 2026-11-05-basic-layout-2 #11); the platform's real steel (deck beams, roof stools,
  # handrails) is in the tank supply, and its grating stays in the MTO.
  - id: S-T2101-TOP
    title: "T-2101 tank-top pump platform (pump column heads P-2101A-D, P-2102, relief and vacuum valves), tank supply, ASSUMED"
    origin: [881.4, 2977.8]
    spans_x: [96.0]
    spans_y: [96.0]
    column_section: HEA100
    beam_section: HEA100
    levels:
