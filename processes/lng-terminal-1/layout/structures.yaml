  # at the south-west and from the relief valves on the pump platform, reached from the pump
  # platform by the north roof walkway (escape zone Z-ESC-Tn-ROOF-N). Tank supply (ASSUMED).
  - id: S-ESC-T2101
    title: "T-2101 north escape stair tower to the roof edge (ASSUMED)"
