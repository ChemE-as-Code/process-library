    bracing: {east: x, west: x}
    notes: "The landing meets the roof edge handrail ring at the north; the roof walkway from the pump platform arrives here (D-027)."
    stairs: [{id: stair-to-L42, from: grade, to: L42, side: east, offset: -4.723, width: 0.9}]
    ladders: [{id: ladder-to-L42, from: grade, to: L42, at: [0.5, 3.5], facing: north}]
