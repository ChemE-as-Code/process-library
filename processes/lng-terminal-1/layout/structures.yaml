notes: >-
  The tank-top pump platforms are the single platform level of a frame spanning each tank
  (S-Tn101-TOP above, D-027): a cheme-as-code structure stands on grade and cannot stand on the
  tank roof, so the frame's corner columns outside the shell are a modelling artefact, taken
  off as their own HEA100 row and priced at nothing in the estimate (D-029). The riser towers
  S-RTn101 are real terminal steel (D-029).
