  - {id: PR2, title: "Trestle to the loading platform, ~1.98 km at 178 deg (measured, D-013): 2 x DN 800 loading, 2 x DN 750 vapour return, circulation, N2, drains", points: [[1095, 2945], [1095, 2872], [1154, 890]], width: 10, levels: [6, 9]}
