  # it carries nothing else, so it is not held to the basin's rack separation
  - {id: PR8, title: "Basin services rack from PR4 west to the impoundment basin T-8101: oily water W-8002, the basin pump and instrument cables (ASSUMED)", points: [[1095, 3220.5], [985, 3220.5]], width: 6, levels: [7], bent_spacing_m: 8, intermediate_supports: {spacing_m: 3}}
  # platform header rack (D-035.1; review 2026-11-05-basic-layout-5, missed high of its
  # adversarial check): from PR2's end south over the deck strip between the two berths'
  # manifold trays (x 1151.5-1157.0, the bays' kerbs) to the header bay Z-HA-TRAY-HDR at the
  # platform's south end; top tier the loading lines (welded) and the drain pump returns,
  # bottom tier the berth headers LNG-5001 / LNG-6001 back north to the arm tees (welded);
  # bents 8.5 m apart at y 900 / 891.5 / 883 / 874.5 / 866, clear of the BOG-6001 riser, the
  # drain drums and pumps (ASSUMED; structural design on the platform deck, marine engineer).
  # Fire exposure (independent check of D-035, D-035.14 (a)): PR9 and the PR2 end over the deck
  # (y 866 to the platform's north edge, y ~925) stand in the bay fires' near field (above the
  # 8 kW/m2 of an LNG rack from y 866 to ~920 for every bay beside them, 10-1,000 kW/m2), and no
  # route on the deck keeps the welded loading lines out of that band (the bays fill the deck
  # between the two berths, a bay fire needs ~24 m to fall to 8). So PR9's and the PR2 end's
  # steel (columns, both tiers' beams and bracing) and the insulation of the lines on them
  # (LNG-4001 / LNG-4002 upstream of XV-n101, the berth headers LNG-5001 / LNG-6001, the vapour
  # return ends BOG-4001 / BOG-4002) take passive fire protection for a 60 min hydrocarbon pool
