  - {id: R11, title: "South-east road from R1 / R5 under PR2, along the transformer bays' south side and north to R8 at B-SUB: second access to B-SUB and the bays, fire approach to the PR3 trough from the east (D-033, ASSUMED)", points: [[1083, 2901], [1205, 2901], [1205, 2980]], width: 6}
  - {id: R5, title: "Jetty road along the trestle (west side)", points: [[1083, 2930], [1083, 2872], [1141, 925]], width: 6}
  - {id: R6, title: "Link from the jetty road R5 under PR2's straight north end to R3 (ASSUMED)", points: [[1083, 2925], [1116.4, 2925]], width: 6}
  - {id: R7, title: "BOG area access from R3 under PR3 to the crane pad Z-PAD-A2E (fire and crane access from the east, ASSUMED)", points: [[1116.4, 2995], [1082, 2995]], width: 6}
  - {id: R8, title: "Road from R3 along the north side of the substation and control building B-SUB to R11 (ASSUMED, D-033)", points: [[1116.4, 2980], [1205, 2980]], width: 6}
