  # shown to start. The escalation to the unisolable trestle inventory (~1,020 m3 per line,
  # D-034.3) is a stated residual for the siting study.
  # D-037 (review 2026-11-05-basic-layout-6 #1): the bottom tier is lowered from 5 m to 4.5 m,
  # level with the header bay frame PR10's bottom tier, so the berth headers run level from the
  # header bay to the arm tees (lanes x 1152.45 for LNG-5001 and x 1156.1 for LNG-6001) and the
  # header bay's access aisle can stand on PR10's bottom tier with 2.2 m under its top tier
  # D-037.15 (independent check of D-037): at 5.5 m wide its columns (half-width + 0.15 m)
  # stood at x 1151.35 / 1157.15, 0.15 m inside the B2 / B1 manifold bays and the drum bays
  # (edges x 1151.5 / 1157.0); narrowed to 4.9 m, so its columns stand at x 1151.65 / 1156.85
  # with their faces on the bays' kerb walls and no foot in a recess; every line on it keeps
  # its pinned lane (outermost insulation x 1151.84 / 1156.59)
  - {id: PR9, title: "Platform header rack from PR2's end south to the header bay: loading lines on the top tier, berth headers on the bottom tier (ASSUMED, D-035.1, D-037)", points: [[1154.25, 900], [1154.25, 866]], width: 4.9, levels: [4.5, 7], bent_spacing_m: 8.5, intermediate_supports: {spacing_m: 2.5}, ladders: []}
  # header bay frame (D-037, review 2026-11-05-basic-layout-6 #1 and its adversarial check): the
