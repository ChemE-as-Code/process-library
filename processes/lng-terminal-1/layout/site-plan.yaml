# Site plan. Schema: `cheme schema site_plan`. Metres, x east, y north, origin at the site's
# south-west corner (53.990 N, 128.700 W). The reference points (tank 1, the flare, the trains,
# the trestle and Berth 2) are measured positions of the LNG Canada site at Kitimat
# (scripts/site_frame.py, D-013); tank 2, Berth 1, the roads, the buildings and the area
# outlines are ASSUMED (D-019, D-027). z = 0 is the local grade of each area, the jetty deck
# included (D-013): tank area grade ~+15.3 m chart datum (12 m SRTM above mean sea level, taken
# as the 3.3 m CD mean water of S-01), jetty deck +12.0 m CD (ASSUMED, marine engineer); design
# water levels on the deck datum: extreme high -5.3 m, mean -8.7 m, extreme low -12.2 m
# (process/design-basis.yaml tides, S-01; D-013, D-035.8).
site: {name: "lng-terminal-1, Kitimat BC (LNG Canada reference geometry)", width: 1800, depth: 4050}
areas:
  - {id: A1, title: "LNG tanks T-2101 (Phase 1) and T-3101 (Phase 2), impoundment sump (P-02, P-03, P-08)", box: [720, 2955, 1005, 3100], kind: storage}
  - {id: A2, title: "BOG compressors and suction drum (P-07)", box: [1010, 2960, 1085, 3060], kind: process}
  - {id: A3, title: "Storage and loading flare, knock-out drum (P-08); sterile radiation area", box: [1425, 3055, 1535, 3155], kind: reserved}
  - {id: A4, title: "Loading platform, Berth 2 (west, as built) and Berth 1 (east, Phase 2) (P-05, P-06)", box: [1130, 855, 1180, 925], kind: process}
  - {id: A5, title: "Liquefaction trains 1-4 (outside the battery limit; OSM train blocks, D-001)", box: [560, 3630, 1372, 4015], kind: reserved}
  - {id: A6, title: "Terminal substation and control building B-SUB, east of road R3, 60 m or more from the racks, the analyser house and the spill troughs, with its outdoor transformer bays south of it (D-027, D-031, ASSUMED)", box: [1160, 2918, 1200, 2984], kind: building}
  - {id: A7, title: "Jetty substation B-JET on a piled deck west of the trestle road, outside the 200 m vapour-arm safety zone of both berths, with the platform muster point, life-raft station and boat landing north of it (D-018, D-027, D-033, ASSUMED)", box: [1112, 1100, 1132, 1132], kind: building}
  - {id: A8, title: "LNG spill impoundment basin T-8101 north of road R2, at the pool fire screening distances of D-018 (D-029, ASSUMED; moved north with the basin, D-033.11)", box: [965, 3205, 1010, 3255], kind: storage}
  - {id: A9, title: "Jetty spill sump deck T-8102 on piles south of the loading platform, between the carriers' bows, reached by the catwalk S-CW-A9 (D-018, D-029, D-031, ASSUMED)", box: [1152.5, 800, 1174.5, 824], kind: process}
