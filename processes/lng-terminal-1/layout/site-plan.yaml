  # between the two berth headers (layout/structures.yaml). Fire protection as PR9 (D-037): its
  # steel, the lines on it and the valve actuators take PFP / a fire-rated jacket for 240 min of
  # hydrocarbon pool fire (the bounded trestle drain-down of D-036, D-037), and its valves are
  # fire-tested (piping/pipe-specs.yaml Class 150 (d), (e)); structural design and the deck
  # connection the marine engineer's (ASSUMED)
  - {id: PR10, title: "Header bay frame over the header bay at the platform's south end: loading lines and crossovers on the top tier, berth headers with the shore ESD valves and strainers on the bottom tier (ASSUMED, D-037)", points: [[1151.5, 860.0], [1163.0, 860.0]], width: 5.3, levels: [4.5, 7], bent_spacing_m: 11.5, intermediate_supports: {spacing_m: 2.3}, ladders: []}
