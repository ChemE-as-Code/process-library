  deg; tank 1 to the Berth 2 loading platform 2,147 m at 174 deg; trestle from the plant's
  south edge 1,982 m at 178 deg; berth face 375 m at 173.5 deg. Tank 2 140 m west of tank 1
  (centre to centre) and Berth 1 on the east side of the loading platform are ASSUMED: the
