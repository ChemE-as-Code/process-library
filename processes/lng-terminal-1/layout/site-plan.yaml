  - {id: R4, title: "West road of the tank area", points: [[704, 2930], [704, 3122]], width: 8}
  - {id: R5, title: "Jetty road along the trestle (west side)", points: [[1083, 2930], [1083, 2872], [1141, 925]], width: 6}
  - {id: R6, title: "Link from the jetty road R5 under PR2's straight north end to R3 (ASSUMED)", points: [[1083, 2925], [1116.4, 2925]], width: 6}
  - {id: R7, title: "BOG area access from R3 under PR3 to the crane pad Z-PAD-A2E (fire and crane access from the east, ASSUMED)", points: [[1116.4, 2995], [1082, 2995]], width: 6}
  - {id: R8, title: "Spur from R3 along the north side of the substation and control building B-SUB (ASSUMED)", points: [[1116.4, 2980], [1196, 2980]], width: 6}
  - {id: R9, title: "Loading platform roadway from the trestle road onto the deck to the Berth 2 crane strip Z-PAD-A4W (ASSUMED)", points: [[1140.5, 925], [1142, 912], [1142, 901]], width: 6}
  - {id: R10, title: "Loading platform roadway under the PR2 end (between its bents at y 906 / 914) to the Berth 1 crane strip Z-PAD-A4E (ASSUMED)", points: [[1142, 910], [1164, 910], [1164, 901]], width: 6}
# All racks 14 m wide so the lanes line up where they join (PR1/PR2/PR3 at x 1095, y 2945;
# PR3/PR4 at y 3110). Bents about 8 m apart on PR1, PR2, PR5 and PR6 and 9.1 m on PR3, so the
# first bent of a branch rack and the last bent of PR1 stand clear of the rack they join (and
# no PR3 bent stands in PR4 at their corner); PR4 17 m apart so its portal over road R2 spans
# the road (bent at y 3127, road 3118-3126). Main racks PR1 to PR4 with tiers at 7 / 10 m, so
# the steel under the bottom tier clears the 6 m road headroom where PR4 crosses R2 and all
# main racks join level. The riser racks PR5 and PR6 have their tiers at 12 / 14 m, above the
# 10 m top tier of PR1 and PR3, so their lines cross those racks' columns above them and drop
# onto their tiers. Intermediate steel every 3 m on every tier for the small lines
# (all ASSUMED, D-013).
# Cold contraction of the 2.45 km loading and vapour return lines (D-027, ASSUMED): expansion
# loops in plan on the trestle every ~150 m, each a 14 m wide loop bay beside the rack; the
# loop bays are keep-clear zones Z-LOOP-* in layout/zones.yaml (the first bays at the trestle
# north end), the rest are reserved along the trestle every ~150 m on the east side.
racks:
  - {id: PR1, title: "Tank-area rack south of the tanks: loading, vapour return, circulation and BOG lines (P-02 to P-04, P-07)", points: [[760, 2945], [1095, 2945]], width: 14, levels: [7, 10], bent_spacing_m: 8, intermediate_supports: {spacing_m: 3}}
  - {id: PR2, title: "Trestle to the loading platform, ~1.98 km at 178 deg (measured, D-013): 2 x DN 800 loading, 2 x DN 750 vapour return, circulation, N2, drains", points: [[1095, 2945], [1095, 2872], [1154, 890]], width: 14, levels: [7, 10], bent_spacing_m: 8, intermediate_supports: {spacing_m: 3}}
  - {id: PR3, title: "BOG area rack and the flare header to A3; fuel gas, N2 and instrument air from the site at its east end", points: [[1095, 2945], [1095, 3110], [1430, 3110]], width: 14, levels: [7, 10], bent_spacing_m: 9.1, intermediate_supports: {spacing_m: 3}}
  - {id: PR4, title: "Rundown and BOG rack north to the trains (battery limit at its north end); portal frame over road R2", points: [[1095, 3110], [1095, 3625]], width: 14, levels: [7, 10], bent_spacing_m: 17, intermediate_supports: {spacing_m: 3}}
  - {id: PR5, title: "Riser rack beside the T-3101 east shell: tank roof piping down to PR1 (D-013; moved from x 859 to the shell, ASSUMED); tiers 12 / 14 m, over PR1's steel at the joint", points: [[846, 2945], [846, 3060]], width: 14, levels: [12, 14], bent_spacing_m: 8, intermediate_supports: {spacing_m: 3}}
  # cable bridge from B-SUB's west wall to PR3 (trays only, D-027): one level at 15 m under the
  # PR3 tray tier, bents 14 m apart so none stands in road R3 (x 1112.9-1119.9)
  - {id: PR7, title: "Cable bridge from the substation and control building B-SUB to PR3 (power and instrument trays only, ASSUMED)", points: [[1095, 2968], [1164, 2968]], width: 10, levels: [12.0], bent_spacing_m: 13.8, ladders: []}
  # (its east end 1 m off B-SUB's west wall; bents at x 1108.8 / 1122.6 either side of R3; the
  # trays at 15.5 m on their own steel above its level, power and instrument 8.6 m apart)
  - {id: PR6, title: "Riser rack east of T-2101: tank roof piping down to PR1 (D-013), turning east along the north edge of the BOG area to PR3 (tank vapour header to D-7101, flare header and drains to PR3, ASSUMED); tiers 12 / 14 m, over PR1's and PR3's steel at the joints", points: [[988, 2945], [988, 3052], [1095, 3052]], width: 14, levels: [12, 14], bent_spacing_m: 8, intermediate_supports: {spacing_m: 3}}
  # the impoundment basin's own services (D-029): its oily water line W-8002 and the cables of
  # its rainwater pump and instruments, from PR4 west north of road R2 (between PR4's bents at
  # y 3144 / 3161); it carries nothing else, so it is not held to the basin's rack separation
  - {id: PR8, title: "Basin services rack from PR4 west to the impoundment basin T-8101: oily water W-8002, the basin pump and instrument cables (ASSUMED)", points: [[1095, 3150], [975, 3150], [975, 3175]], width: 6, levels: [7], bent_spacing_m: 8, intermediate_supports: {spacing_m: 3}}
rack_reach: 60
# the in-tank pump removal crane on the pads north of the tanks works at up to ~75 m radius
# (D-029, ASSUMED until the lifting contractor's crane selection); every pad still states its
# own reach_m
criteria: {crane_reach_m: 80}
separations:
  - {from: T-2101, to: T-3101, min_m: 46, reason: "full-containment tanks: shell to shell at least a quarter of the sum of the diameters", basis: "NFPA 59A practice (cited only), ASSUMED (D-018)"}
  - {from: T-2101, to: K-7101A, min_m: 30, reason: "tank to the BOG compressors (ignition source, fire exposure)", basis: "D-018, ASSUMED"}
  - {from: T-2101, to: R1, min_m: 15, reason: "tank to roads", basis: "D-018, ASSUMED"}
  - {from: T-2101, to: FL-8101, min_m: 300, reason: "flare radiation at the tank roof (fence-line limit 5.0 kW/m2: LNG Canada flaring factsheet)", basis: "D-017, D-018, ASSUMED"}
  - {from: T-3101, to: site-boundary, min_m: 30, reason: "tank to the site boundary", basis: "D-018, ASSUMED"}
  - {from: LA-5101, to: T-2101, min_m: 500, reason: "loading point far from storage: 200 m ignition-free radius around the loading point (EA application 2014 §2) and the 200 m safety zone around the vapour arm (TIG Rev 3)", basis: "D-018"}
