# Ventilation of the clad buildings. Schema: `cheme schema hvac`. Skill hvac-ducts.
# Every air change, capacity and size ASSUMED until the HVAC engineer's heat load calculation
# replaces it; duct sizes come from cheme-as-code's velocity table (ASSUMED). The analyser
# house B-ANA is ventilated by the analyser vendor's package (purge and gas detection), not
# modelled here (D-027).
units:
  - id: AHU-1
    title: "Substation and control building air handling unit (filtered, overpressure)"
    building: B-SUB
    position: [1187.0, 2969.0]
    rotation_deg: 180
    size: [5.0, 2.0, 2.5]
    capacity_m3h: 20000
    intake: LV1
    exhaust: LV2
    notes: "North-east part of B-SUB, turned so its outdoor-air port faces LV1 in the east wall (away from the plant) and its supply port the rooms to the west; exhaust through LV2 at the east end of the south wall, 13 m from the intake (ASSUMED size). Interim safeguard for the 69.7 m from B-SUB to the PR3 / PR4 trough leg until the siting study's dispersion distance (D-033.2 (d), D-035.10; review 2026-11-05-basic-layout-5 #6), a requirement of this layout, ASSUMED: flammable gas detectors in the LV1 intake duct (2oo3, at 10 % / 25 % LFL alarm / trip, ASSUMED), whose trip stops AHU-1, closes the gas-tight intake and exhaust dampers of LV1 / LV2 and holds the building on its stored overpressure; since D-039 the detectors AT-8141A/B/C (2oo3), the damper outputs UZ-8142 (LV1) / UZ-8143 (LV2) and the fan stop UZ-8144, C&E I-811, drawn on P-08 and in the instrument list (layout review 2026-11-05-basic-layout-5 #6, design owner); their cabling point is LV1 (east wall, y 2967.5) to the control room CR-1 (electrical/electrical-list.yaml notes)"
  - id: AHU-2
    title: "Jetty substation and rack room air handling unit (filtered, overpressure)"
    building: B-JET
    position: [1119.5, 1111.0]
    rotation_deg: 0
    size: [3.0, 1.5, 2.0]
    capacity_m3h: 4000
    intake: LV1
    exhaust: LV2
    notes: "Along the west wall of B-JET beside the outdoor-air louvre LV1 (west wall, away from the trestle and the road), exhaust out of LV2 at the west end of the south wall (ASSUMED size)"
rooms:
  - id: B-SUB-ROOMS
    title: "6.6 kV switchgear, 400 V MCC, control room and rack room"
    building: B-SUB
    air_changes_per_h: 6
    extract_fraction: 0.8
    unit: AHU-1
    # supply along the north and middle of the building, extract along the south wall, both
    # west of the unit, so neither main crosses the outdoor-air duct from LV1 east of it
    supply: [[1182.0, 2972.5], [1178.0, 2972.5], [1174.0, 2972.5], [1170.0, 2972.5], [1167.0, 2972.5], [1167.0, 2966.0], [1171.0, 2966.0], [1175.0, 2966.0]]
    extract: [[1183.0, 2958.0], [1179.0, 2958.0], [1175.0, 2958.0], [1171.0, 2958.0], [1167.0, 2958.0], [1167.0, 2961.5]]
    basis: "Switchgear, MCC, soft starters / VSDs, UPS and DCS / SIS cabinets ~60 kW to the room air at a 10 K rise need ~18,000 m3/h = 6 air changes of the 3,000 m3 building; 20 % kept as overpressure against the plant air (ASSUMED); the control room's air conditioning and gas-tight intakes are detail engineering"
  - id: B-JET-ROOMS
    title: "Jetty transformer, MCC-2 and rack room RR-2"
    building: B-JET
    air_changes_per_h: 4
    extract_fraction: 0.8
    unit: AHU-2
    # (supply main 1 m west of the RR-2 / UPS cable exits since PR2 has two LV power trays, D-037)
    supply: [[1124.0, 1113.5], [1127.0, 1113.5], [1127.0, 1108.0]]
    extract: [[1124.0, 1106.0], [1120.0, 1106.0]]
    basis: "TR-5 losses (~6 kW), MCC-2 and the remote I/O ~10 kW at a 10 K rise need ~3,000 m3/h = 4 air changes of the 756 m3 building; overpressure against the outside air (ASSUMED); the building is outside the 200 m ignition-free radius and every hazardous zone, so no pressurisation for the area classification (D-027)"
notes: >-
  Supply air is outdoor air (no recirculation, no cooling coil modelled). Air conditioning and
  fire dampers are detail engineering (ASSUMED). Gas detection with a damper trip at the B-SUB
  intake LV1 is a layout requirement (AHU-1 notes, D-035.10); at the B-JET intake it is detail
  engineering (B-JET is outside every hazardous zone and the 200 m radius).
