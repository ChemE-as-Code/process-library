    box: [1177.5, 857.0, -1.3, 1178.5, 902.0, -0.1]
    basis: "As Z-KC-CHANNEL-JETTY (ASSUMED)"
  - id: Z-KC-TROUGH-JETTY
    title: Open spill trough on the sump deck catwalk from the platform south edge to the jetty sump T-8102
    kind: keep_clear
    shape: box
    box: [1163.2, 816.0, -1.2, 1163.8, 855.0, 0.0]
    basis: "0.6 m trough along the catwalk S-CW-A9 (39 m); line-source screening x 1.2 tilt (D-031, ASSUMED): 6.1 kW/m2 at D-6101, 4.9 at D-5101, 2.7 at LA-6101, below 1 at both carriers (D-018, D-031)"
  # ---- marine safety zones during transfer (LNG Canada TIG Rev 3: 200 m around the vapour
  # arm while a carrier is alongside and transferring; no other vessel, no ignition source).
  # Drawn on the water, below the jetty deck (z -30 .. -6), as the vessel traffic keep-clear
  # volume; at deck level the 200 m no-ignition radius is measured as separations of every arm
  # to the jetty substation B-JET in layout/site-plan.yaml (the only non-Ex building of the
  # jetty), since a keep-clear volume over the deck would bar the platform's own piping.
  # Both berths' carriers are inside each other's zone: simultaneous berthing with one carrier
  # transferring is the design basis (D-027).
  - id: Z-SZ-B2
    title: Berth 2 marine safety zone, 200 m around the vapour arm LA-5102 during transfer
    kind: keep_clear
    shape: cylinder
    centre: [1137.0, 884.0, -30.0]
    radius: 200
    height: 24
    basis: "LNG Canada TIG Rev 3: 200 m marine safety zone around the vapour arm during transfer (cited); centre the measured Berth 2 vapour arm position (D-013, D-014); vertical extent on the water ASSUMED; the carrier at the other berth is under terminal control inside it (D-027, ASSUMED)"
  - id: Z-SZ-B1
