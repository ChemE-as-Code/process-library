  - id: Z-HA-SUMP-T8101
    title: LNG spill impoundment basin T-8101 (tank-area troughs), north of road R2
    kind: hazardous
    zone: 2
    shape: cylinder
    centre: [990.0, 3237.5, -19.5]
    radius: 11.0
    height: 20.5
    basis: "Collects cold flashing LNG from the troughs only on a spill: secondary grade; the cold vapour is denser than air and spreads at grade, zone 2 inside the pit and 3 m around it to 1 m above grade (ASSUMED; the CSA Z276 / NFPA 59A vapour dispersion exclusion zone replaces it). Re-sited north of R2 by the pool fire screening of D-018 (D-029); deepened to 10.5 m so the design spill stays below the trough inlet (D-033.3); moved 47.5 m north and 10 m east with the trough's north end, so the troughs and the basin burning together keep the BOG area's way out, road R2 and the PR6 east leg within their criteria (D-033.11); deepened to 19.5 m for 10 min of the governing tank-area flow of D-034.3 (one tank's loading pumps at run-out, ~14,400 m3/h, 2,400 m3) with 1.79 m to the inlet, the 16 m diameter and so the burning surface kept (D-035.2); a tanked, watertight shaft against groundwater and uplift (civil, ASSUMED). Ground basis (D-037, review 2026-11-05-basic-layout-6 #8, ASSUMED until the site investigation): groundwater at grade (the conservative case ~370 m from the shore), so the empty shaft carries ~39 MN of uplift (pi x 8^2 x 19.5 m x 10 kN/m3) against its weight and base anchorage; concept a diaphragm-wall or caisson shaft with a tension-piled base slab, an inner cellular glass lining with a thermal break to the structural wall, and heating or a drained, insulated zone behind the wall against frost heave of the saturated ground (civil engineer). Pit cover: a grated deck only over the south 3 x 16 m strip (P-8102's davit and discharge head, LI-8103, TSL-8102, reached from R13), the rest of the 201 m2 left open (the burning surface of D-018 kept, no confined vapour space); high-expansion foam from fixed generators on the pit rim discharging onto the open surface (ASSUMED, fire protection engineer)"
  - id: Z-HA-SUMP-T8102
    title: Jetty LNG spill sump T-8102 on the sump deck south of the loading platform
    kind: hazardous
    zone: 2
    shape: cylinder
    centre: [1163.5, 812.0, -13.0]
    radius: 6.0
    height: 14.0
    basis: "As Z-HA-SUMP-T8101 for the jetty sump (ASSUMED); re-sited off the platform by the pool fire screening of D-018 (D-029); 6 m across and 9.5 m deep since D-033.11 (smaller burning surface, more volume below the collector inlet), the only outlet of the enclosed jetty collectors enters below its rim; 13.0 m deep since D-035.1 for the governing platform spill of D-034.3 (~170 m3, 257 m3 below the inlet), a sealed, anchored caisson whose bottom lies below extreme high water (D-035.8). Volume budget below the inlet (D-037, review 2026-11-05-basic-layout-6 #2; corrected by D-037.15, independent check of D-037): the binding basis is no LNG on standing water (rapid phase transition in the closed caisson, the boil-off of LNG on water and its higher burning rate are not in the vapour and fire basis), so the sump is dry at the start of and throughout a transfer: water is held in a floor pocket (~0.8 m across, 0.5 m deep, ~0.25 m3, ASSUMED) below the sump floor and taken out continuously by a fixed dry-sump pump whose drive stands on the cover above the sump (no motor in the sump): since D-037.16 the vertical line-shaft pump P-8103 on P-08, its bowl in the pocket, started and stopped by LZT-8106 in the pocket (C&E I-806 / I-807) and locked out on LNG by TSL-8104 in the pocket or TSL-8118 on its discharge head, 1oo2 (C&E I-808, D-037.17), with the LAH lowered to the pocket's rim as a transfer hold and the LAHH at 0.60 m (C&E I-805) (its position the cover's south edge, opposite the collector inlet on the north wall, its cable along the catwalk S-CW-A9 with TSL-8104's, its self-draining discharge W-8003 east over A9 to the jetty drain, D-037.16 (c), D-037.17). The budget is then 170 m3 platform spill + 40 m3 kept for the drain-down (a trestle-side stem or bonnet seal leak at ~1 kg/s until the isolated line is emptied by N2: ~36 m3, the leak fed for ~3.5 h at most since D-036.11 (b); D-036 item 5 (c) had ~4 h) = 210 m3 of 257, 47 m3 left with no credit for the rain: rain falling during the ~4 h drain-down onto LNG already in the sump (~42 m3 at the ASSUMED design rainfall below) lowers the volume (each m3 of rain freezes to ~1.1 m3 of ice and boils ~2.7 m3 of LNG, ASSUMED properties), and with no credit it gives 252 m3 of 257. The ~45 m3 of standing rain the LZT-8106 LAHH allowed by D-036 item 6 / D-037 is withdrawn from the basis. The catchment draining to the sump is ~1,006 m2 (the arm, manifold, drum and header bays and the sump itself; ~935 m2 before left out the drum bays D5101 / D6101): the design rainfall (ASSUMED 250 mm in 24 h, conservative, no Kitimat design storm cited yet, civil engineer) brings ~10.5 m3/h, which a dry-sump pump of ~20 m3/h (ASSUMED) removes. The collectors carry the drain-down's ~8 m3/h with no backing up (sized for 3.33 m3/s). Cover (D-037.15): open steel grating (~70 % open, ASSUMED) over the whole 6 m sump on beams at the deck datum, with no plated part, so the 28.3 m2 burning surface of the screening and no confined vapour space under a cover (as T-8101, D-037.9); the collector vapour vents through the grating; LZT-8106's guided-wave radar head (its stilling pipe down to the pocket, D-037.17) and the dry-sump pump's drive stand on brackets off the cover beams above the grating, and the portable pump, the inspection and the pocket are reached through a removable grating panel. The caisson concept is the marine engineer's hold (D-035.13): double wall, inner cellular glass lining on the LNG side, outer marine concrete, monitored annulus for an inner-wall crack, anchored for ~2.2 MN of uplift when empty at extreme high water, internal inspection through the cover (ASSUMED, D-037). D-040 (review 2026-11-05-basic-layout-7 #3, #5): the cable of P-8103 now runs in the catwalk cable rack PR13's power tray and the sump instruments' multicore from JB-A9 (on A9 outside this zone) in its instrument tray, ~1.0 m apart (no longer 'with TSL-8104's'). The rain falling on LNG in the sump boils LNG (above, ~3.5 kg/s at the design rain on the whole catchment) only while LNG is there: through a drain-down in rain no pool forms and the vapour is the ~1 kg/s feed; rain onto a pool already in the sump is the siting study's named case SC-3 (DESIGN.md D-040.3), rescoped by D-040.12 to every pool in the sump: the governing 170-210 m3 platform spill during a transfer puts the carrier hulls over 8 kW/m2 from ~2 mm/h of rain for 3.7-9 h, so the 8 kW/m2 hull basis of this site holds dry and below ~2 mm/h only; in the design rain ~20 m3 of unfrozen rain water stands under a drain-down's falling LNG (RPT, with the pocket case). The pocket water at a spill's arrival (0.05-0.25 m3) is the RPT basis of the pocket (D-040.7)"
  # ---- spill collection (D-018, D-031, D-033; layout reviews 2026-11-05-basic-layout-3 #1 /
  # #2 and -4 #1 to #4 with their adversarial checks). The collection serves the leak sources
  # only: the flanged valves, instruments and seals; an all-welded run is not a leak source
  # (as the welded trestle run, D-018), so the riser towers and the riser racks PR5 / PR6
  # between the dome edge and their PR1 joints, which carry welded runs only, have no channel
  # (the enclosed channels of D-031 are removed, D-033.1), and PR2's straight north end, whose
  # valve station is on the vapour returns only, has no trough (D-033.2).
  # D-033.11 (independent screening check of the D-033 arrangement): the troughs and the basin
  # are one design fire (the trough carries the spill into the basin while it still flows);
  # - open troughs (Z-KC-TROUGH-*), 0.6 m wide, falling 0.5 % from 3.22 m deep at x 975, the
  #   first flanged LNG item east of the PR6 joint, east to the PR1 / PR2 / PR3 junction, north
  #   under PR3 and PR4 past road R2 to y 3237.5 and west into the basin's east side at an
  #   invert of -5.77 m (profile in D-035.2, for the governing flow of D-034.3); lined with cellular glass like the basin
  #   (ASSUMED, D-033.2); each a keep-clear volume (no pipe, post or tray in it) and inside its
  #   own zone 2 (Z-HA-TROUGH-*). PR1 west of x 975 carries no LNG flanged item but XV-3123
  #   (DN 250, on PR5 at the joint) and the DN 25 thermal relief PSV-1123; they are held at the
  #   item in drip trays as the dome-edge valves (Z-HA-TRAY-XV3123), so the 140 m trough leg in
  #   front of T-2101 and the PR1W catchment are removed (D-033.11).
  #   A trough fire is screened by the D-018 point-source method integrated along the trough
  #   (line source q' = chi_r m'' dHc w = 0.35 x 0.078 x 50 MJ/kg x 0.6 m = 0.82 MW per m,
  #   every leg burning at once with the basin and the releasing item's pad, x 1.2 for flame
  #   tilt, ASSUMED; table in D-033.11);
  # - kerbed drip pads at grade only under the flanged LNG items off the trough's line, each
  #   draining straight to the trough or by a 0.6 m gutter (Z-HA-CATCH-*, Z-KC-GUTTER-*), with
  #   spray shields on the flanges (ASSUMED) so a leak falls onto the pad: the broad paved
  #   catchments of D-033.3 are removed, whose burning flow path was not screened;
  # - enclosed collectors (Z-KC-CHANNEL-JETTY*) only under the loading platform deck, one under
  #   each tray row so every bay drains through an open floor outlet straight down into one, a
  #   south collector and a collector under the catwalk into the sump T-8102, below its rim:
  #   lined with cellular glass and sized for the liquid and the vapour formed (D-033.4,
  #   D-033.11). No liquid seals and no other enclosed drain pipe (XO's DN 300 drain removed).
  - id: Z-KC-TROUGH-PR1
    title: Open spill trough under PR1 (tank-area rack) from the PR6 joint (x 975) east to the PR1 / PR2 / PR3 junction
    kind: keep_clear
    shape: box
    box: [975.0, 2944.7, -3.85, 1095.3, 2945.3, 0.3]
    basis: "0.6 m wide on the rack centreline, lined with cellular glass, falling 0.5 % east from 3.22 m deep at x 975 to an invert of -3.82 m at the junction: deepened 1.61 m for the governing tank-area flow of D-034.3, the run-out of one tank's loading pumps into one line at the loading valve station or XV-4105 (~14,400 m3/h = 4.0 m3/s, ASSUMED 1.2 x the rated 12,000 m3/h until the vendor's curve), which runs 2.92 m deep (Manning, n 0.013), with 0.30 m freeboard where the trough is shallowest (was 1.61 m deep for 6,000 m3/h, review 2026-11-05-basic-layout-5 missed medium; the rundown's 7,560 m3/h through XV-1102 / 1103 runs 1.61 m deep, D-035.2); the width, and so the burning surface, is kept; the drip pads under the off-centre flanged items drain to it (Z-HA-CATCH-*); 46.8 m from the T-2101 shell, 62.7 m from S-RT2101 (D-018, D-031, D-033, ASSUMED)"
  - id: Z-KC-TROUGH-PR3
    title: Open spill trough under PR3's north-south leg and PR4, from the junction north past road R2 to y 3237.5
    kind: keep_clear
    shape: box
    box: [1094.7, 2945.3, -5.30, 1095.3, 3237.8, 0.3]
    basis: "Collector to the basin under the centreline of PR3 and PR4, invert -3.82 m at the junction, -4.07 m at the road R7 culvert, -4.71 m at the road R2 culvert (under PR4's portal), -5.28 m at the corner (1095, 3237.5) between PR4's bents at y 3229 / 3246 (1.61 m lower than D-033.11 throughout for the D-034.3 flow, D-035.2); 119.6 m from the T-2101 shell, 98.5 m from S-RT2101, 70 m from B-SUB (D-018, D-031, D-033.11, ASSUMED; on the flat concept grade of D-013 the trough deepens as it falls, the real terrain and the civil design set the final profile)"
  - id: Z-KC-TROUGH-SUMP
    title: Open spill trough from PR4 west at y 3237.5 into the east side of the basin T-8101
    kind: keep_clear
    shape: box
    box: [997.8, 3237.2, -5.80, 1095.3, 3237.8, 0.3]
    basis: "West leg 111 m north of road R2's north edge and 17 m north of PR8, invert -5.28 m at the corner to -5.77 m where it enters the basin wall at x 998, 1.79 m above the basin's full design-spill level (2,400 m3, 10 min of the governing run-out flow of D-034.3, -7.56 m in the 19.5 m pit, D-035.2), so the spill never backs up into the troughs, with 100 m3 (0.5 m) of rain standing in the pit before it is pumped down still 1.29 m below; it replaces the west leg 39 m from R2 and the last leg of D-033.3 (D-018, D-031, D-033.11, ASSUMED)"
