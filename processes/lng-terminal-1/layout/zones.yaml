  # enclosed collectors under the deck (D-033.4, D-033.11): one under each tray row, so each bay
  # drains straight down through its floor outlet, a south collector and a collector under
  # the catwalk into the sump below its rim. Covered concrete, 1.0 x 1.2 m, lined with cellular
  # glass, 1 % fall; inverts -2.8 m at the four upstream ends (soffit -1.6 m, below the 1.5 m
  # arm bays; -2.9 m under the 2.4 m deep XO bay, entered through its side wall), -3.50 m at
  # the catwalk junction (1163.5, 856.5), -3.91 m at the sump wall
  # (profile D-033.11, ASSUMED). Sized for the liquid and the vapour (D-033.11, ASSUMED):
  # 1.11 m3/s runs 0.40 m deep; the lining's conduction boil-off (1.8 kW/m2 mean over the first
  # minute) on the wetted perimeter of the longest path forms ~0.7 kg/s, which with the gas the
  # liquid displaces leaves at ~1.9 m/s with ~11 Pa of pressure drop into the sump; the cold
  # vapour, denser than air, flows down the fall with the liquid. No liquid seals (they would
  # hold rainwater, which the first LNG freezes in the receiving bay's outlet): a dry outlet
  # downstream of the receiving bay may pass some vapour, so the screening burns the whole
  # vapour flow at the worst such outlet as well as at the sump
