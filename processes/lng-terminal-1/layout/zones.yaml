  # glass, 1 % fall; inverts -2.8 m at the four upstream ends (soffit -1.6 m, below the 1.5 m
  # arm bays; the XO bay and its collector are removed, D-035.1), -3.50 m at
  # the catwalk junction (1163.5, 856.5), -3.91 m at the sump wall
  # (profile D-033.11, ASSUMED). Sized for the liquid and the vapour (D-033.11, D-035.1,
  # ASSUMED): the berth header flow of D-034.3, 3.33 m3/s, runs 0.60 m deep; the lining's
  # conduction boil-off (1.8 kW/m2 mean over the first minute) on the wetted perimeter of the
  # longest path (~110 m) forms ~1.05 kg/s, which with the gas the liquid displaces leaves at
  # ~2.9 m/s with ~22 Pa of pressure drop into the sump; the cold
  # vapour, denser than air, flows down the fall with the liquid. No liquid seals (they would
  # hold rainwater, which the first LNG freezes in the receiving bay's outlet): a dry outlet
