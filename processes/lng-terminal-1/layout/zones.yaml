# Zones of the 3D layout. Schema: `cheme schema zones`. Skill area-classification.
# SCREENING ONLY, every zone ASSUMED: the hazardous volumes from sources take cheme-as-code's
# indicative radius table (domains/safety/data/release-radii.yaml); no dispersion is modelled.
# The terminal's area classification (CSA C22.1 / IEC 60079-10-1, by a competent person) and
# the marine terminal safety zones of the TERMPOL / TIG review replace or confirm each one.
# Substance: LNG and boil-off gas, taken as methane (flammable gas, lighter than air once warm;
# cold vapour from a liquid release is denser than air and spreads at grade).
# Layout basis of the escape routes, keep-clear volumes and the tank-top platforms: D-027.
zones:
  # ---- hazardous areas (flammable releases)
  - id: Z-HA-TANK-PSV
    title: Tank roof relief valve outlets PSV-2131A/B/C (T-2101) and PSV-3131A/B/C (T-3101)
    kind: hazardous
    zone: 1
    sources:
      - {item: BOG-2002, release_grade: secondary, substance: methane, source_kind: psv_outlet}   # PSV-2131A tailpipe
      - {item: BOG-2003, release_grade: secondary, substance: methane, source_kind: psv_outlet}   # PSV-2131B tailpipe
      - {item: BOG-2004, release_grade: secondary, substance: methane, source_kind: psv_outlet}   # PSV-2131C tailpipe
      - {item: BOG-3002, release_grade: secondary, substance: methane, source_kind: psv_outlet}   # PSV-3131A tailpipe
      - {item: BOG-3003, release_grade: secondary, substance: methane, source_kind: psv_outlet}   # PSV-3131B tailpipe
      - {item: BOG-3004, release_grade: secondary, substance: methane, source_kind: psv_outlet}   # PSV-3131C tailpipe
    basis: "Tank overpressure relief to atmosphere above the pump platform, only when PV-1110 to the flare and the BOG compressors have failed (D-017): secondary grade; table row psv_outlet/secondary/flammable_gas, zone 1 within 3 m of the outlet (ASSUMED); the tailpipes rise so the zone clears the platform's walking level and headroom (piping/routing.yaml vents rule, D-027)"
  - id: Z-HA-BOG-SEALS
    title: BOG compressor shaft seals K-7101A/B/C
    kind: hazardous
    zone: 2
    sources:
      - {item: K-7101A, release_grade: secondary, substance: methane, source_kind: compressor_seal}
      - {item: K-7101B, release_grade: secondary, substance: methane, source_kind: compressor_seal}
      - {item: K-7101C, release_grade: secondary, substance: methane, source_kind: compressor_seal}
    basis: "Dry gas seals with their vents to the flare: leakage only on seal failure, secondary grade; table row compressor_seal/secondary/flammable_gas, zone 2 within 3 m (ASSUMED)"
  - id: Z-HA-ARMS-B2
    title: Berth 2 loading arms LA-5101 to LA-5104 (coupling flanges, swivels)
    kind: hazardous
    zone: 2
    sources:
      - {item: LA-5101, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: LA-5102, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: LA-5103, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: LA-5104, release_grade: secondary, substance: methane, source_kind: flange}
    basis: "Swivel joints and the arm base flanges: secondary grade; table row flange/secondary/flammable_gas, zone 2 within 1 m (ASSUMED)"
  - id: Z-HA-ARMS-B1
    title: Berth 1 loading arms LA-6101 to LA-6104 (coupling flanges, swivels)
    kind: hazardous
    zone: 2
    sources:
      - {item: LA-6101, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: LA-6102, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: LA-6103, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: LA-6104, release_grade: secondary, substance: methane, source_kind: flange}
    basis: "As Z-HA-ARMS-B2 (ASSUMED)"
  - id: Z-HA-MANIFOLD-B2
    title: Berth 2 arm envelope and ship manifold area (couplings opened at every connection, purged)
    kind: hazardous
    zone: 1
    shape: box
    box: [1120, 872, 0, 1142, 902, 24]
    basis: "The arm couplings (QCDC, ERC) are connected, purged with nitrogen and drained at every transfer: a primary release a few times a month; zone 1 over the arm envelope from the west face to 10 m outboard, up to the arm apex (ASSUMED screening; the table has no row for a loading coupling)"
  - id: Z-HA-MANIFOLD-B1
    title: Berth 1 arm envelope and ship manifold area
    kind: hazardous
    zone: 1
    shape: box
    box: [1168, 872, 0, 1190, 902, 24]
    basis: "As Z-HA-MANIFOLD-B2, on the east face (ASSUMED)"
  - id: Z-HA-FLARE-KO
    title: Flare knock-out drum D-8101 flanges and its pump seals P-8101A/B
    kind: hazardous
    zone: 2
    sources:
      - {item: D-8101/N1, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: D-8101/N2, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: D-8101/N3, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: P-8101A, release_grade: secondary, substance: methane, source_kind: pump_seal}
      - {item: P-8101B, release_grade: secondary, substance: methane, source_kind: pump_seal}
    basis: "Inlet, outlet and drain flanges of the KO drum and the seals of its LNG pump-out pumps: secondary grade; table rows flange (1 m) and pump_seal (3 m cylinder from grade), zone 2 (ASSUMED)"
  - id: Z-HA-JETTY-DRAIN
    title: Jetty drain pump seals P-5101 and P-6101
    kind: hazardous
    zone: 2
    sources:
      - {item: P-5101, release_grade: secondary, substance: methane, source_kind: pump_seal}
      - {item: P-6101, release_grade: secondary, substance: methane, source_kind: pump_seal}
    basis: "LNG pump seals, secondary grade; table row pump_seal/secondary/flammable_gas (ASSUMED)"
  # rack valve stations, the analyser house and the LNG spill collection (review
  # 2026-11-05-basic-layout #3, #17; D-027)
  - id: Z-HA-PR2-VALVES
    title: Vapour switch valve station at the tank end of the trestle (XV-4131/4132/4135/4136, flanged valves on PR2's straight north end)
    kind: hazardous
    zone: 2
    shape: box
    box: [1086, 2880, 6.0, 1104, 2950, 12.5]
    basis: "Flanged butterfly and ball valves on the vapour returns and the de-inerting lines: stem packing and flange leaks, secondary grade; table rows valve and flange, zone 2 within 1 m, drawn as one envelope over the station from the bottom tier to above the top tier (ASSUMED)"
  - id: Z-HA-PR1-VALVES
    title: Tank-end valve stations on PR1 (loading line and circulation valves XV-4101/4102/4105/4106, FV-4101/4102, the rundown selection valves XV-1102/1103)
    kind: hazardous
    zone: 2
    shape: box
    box: [975, 2936, 6.0, 1104, 2954, 12.5]
    basis: "Flanged valves and their stem packings on the LNG and vapour lines of PR1 east of the riser racks: secondary grade, zone 2 within 1 m, drawn as one envelope over the rack (ASSUMED)"
  - id: Z-HA-ANALYSER
    title: Analyser house B-ANA of AI-4133 / AI-4134 (sample conditioning, analyser vent)
    kind: hazardous
    zone: 2
    shape: box
    box: [1100.5, 2885.0, 0.0, 1110.5, 2896.0, 6.0]
    basis: "Carrier vapour sample lines, the sample conditioning and the analyser vent: secondary grade around the house, zone 2 within 3 m of it (ASSUMED; inside the house the analyser vendor's purge and gas detection, D-027)"
  - id: Z-HA-SUMP-T8101
    title: LNG spill impoundment basin T-8101 (tank area and trestle), north of road R2
    kind: hazardous
    zone: 2
    shape: cylinder
    centre: [980.0, 3190.0, -6.0]
    radius: 11.0
    height: 7.0
    basis: "Collects cold flashing LNG from the troughs only on a spill: secondary grade; the cold vapour is denser than air and spreads at grade, zone 2 inside the pit and 3 m around it to 1 m above grade (ASSUMED; the CSA Z276 / NFPA 59A vapour dispersion exclusion zone replaces it). Re-sited north of R2 by the pool fire screening of D-018 (D-029)"
  - id: Z-HA-SUMP-T8102
    title: Jetty LNG spill sump T-8102 on the sump deck south of the loading platform
    kind: hazardous
    zone: 2
    shape: cylinder
    centre: [1163.5, 812.0, -4.0]
    radius: 7.0
    height: 5.0
    basis: "As Z-HA-SUMP-T8101 for the jetty sump (ASSUMED); re-sited off the platform by the pool fire screening of D-018 (D-029)"
  # ---- spill collection (D-018, D-031; review 2026-11-05-basic-layout-3 #1 / #2 and its
  # adversarial check). Two kinds of channel, both keep-clear volumes (no pipe, post or tray
  # in them):
  # - open troughs (Z-KC-TROUGH-*), 0.6 m wide, 1.2 m deep, under the racks whose own LNG lines
  #   they collect, falling to the basin away from the tanks: PR1 east to the PR1 / PR2 / PR3
  #   junction, PR2's straight north end north to it, then north under PR3's north-south leg
  #   and PR4 (which carry the rundown header and had no collection) past road R2, west north
  #   of PR8 and into the basin. A trough fire is screened by the D-018 point-source method
  #   integrated along the trough (line source q' = chi_r m'' dHc w = 0.35 x 0.078 x 50 MJ/kg
  #   x 0.6 m = 0.82 MW per m, every leg burning at once, x 1.2 for flame tilt, ASSUMED):
  #   7.0 kW/m2 at the T-2101 shell, 5.3 at T-3101, 4.8 at S-RT2101, 3.4 at S-RT3101, 3.5 at
  #   B-SUB (separations in layout/site-plan.yaml);
  # - enclosed channels (Z-KC-CHANNEL-*) where the collection must start beside a tank shell,
  #   under a riser tower or under the platform deck: covered, sealed concrete channels that
  #   only conduct a spill rapidly away from that critical area, sized for the liquid flow and
  #   vented at their downstream end into the open trough or sump (the enclosed drainage
  #   channel provision of NFPA 59A, cited by number only; sizing basis D-031, ASSUMED). They
  #   have no burning surface along their length.
  - id: Z-KC-TROUGH-PR1
    title: Open spill trough under PR1 (tank-area rack), falling east to the PR1 / PR2 / PR3 junction
    kind: keep_clear
    shape: box
    box: [760.0, 2944.7, -1.2, 1095.3, 2945.3, 0.3]
    basis: "Concrete trough 0.6 m wide, 1.2 m deep along the rack centreline, falling east (no longer to x 988 under PR6); it takes the enclosed channels from under PR5 and PR6 at their joints with PR1; 34.8 m from both tank shells, 63 m from both riser towers (D-018, D-031, ASSUMED size)"
  - id: Z-KC-TROUGH-PR2
    title: Open spill trough under PR2's straight north end (vapour switch valve station), falling north to the junction
    kind: keep_clear
    shape: box
    box: [1094.7, 2872.0, -1.2, 1095.3, 2944.7, 0.3]
    basis: "As Z-KC-TROUGH-PR1; it collects the shore-end valve station and the trestle's shore end (the welded trestle run over the water has no tray, D-031) and passes under road R6 in a culvert (D-018, D-027, D-031, ASSUMED)"
  - id: Z-KC-TROUGH-PR3
    title: Open spill trough under PR3's north-south leg and PR4, from the junction north past road R2
    kind: keep_clear
    shape: box
    box: [1094.7, 2945.3, -1.2, 1095.3, 3165.3, 0.3]
    basis: "Collector to the basin, 0.6 m wide: under the centreline of PR3 (rundown header, BOG) and PR4 (rundown), which it also serves, crossing road R7 and road R2 (under PR4's portal) in culverts; 119.6 m from the T-2101 shell, 98.5 m from S-RT2101, 70 m from B-SUB (D-018, D-031, ASSUMED; the fall follows the terrain, civil detail)"
  - id: Z-KC-TROUGH-SUMP
    title: Open spill trough from PR4 west north of PR8 and north into the basin T-8101
    kind: keep_clear
    shape: box
    box: [985.7, 3164.7, -1.2, 1095.3, 3165.3, 0.3]
    basis: "West leg 39 m north of road R2 (between PR4's bents at y 3161 / 3178) and 15 m north of PR8, then north at x 986 into the basin (Z-KC-TROUGH-SUMP-N); 103.5 m from the T-2101 shell (D-018, D-031, ASSUMED)"
  - id: Z-KC-TROUGH-SUMP-N
    title: Open spill trough, last leg into the basin T-8101 at its east side
    kind: keep_clear
    shape: box
    box: [985.7, 3165.3, -1.2, 986.3, 3184.7, 0.3]
    basis: "Enters the basin rim at x 986 (D-018, D-031, ASSUMED)"
  - id: Z-KC-CHANNEL-PR6
    title: Enclosed spill channel under PR6 and the riser tower S-RT2101, from the riser drops south to the PR1 trough
    kind: keep_clear
    shape: box
    box: [987.7, 2945.3, -1.3, 988.3, 3046.0, 0.0]
    basis: "Collects only PR6 and the T-2101 riser drops (it no longer carries the PR1, PR2 or trestle spills); covered and sealed under the riser tower and beside the shell (12.6 m), vented at its south end into the open PR1 trough; 0.6 x 1.3 m, sized for one loading line (D-018, D-031, ASSUMED; NFPA 59A enclosed drainage channel provision, cited by number only)"
  - id: Z-KC-CHANNEL-PR5
    title: Enclosed spill channel under PR5 and the riser tower S-RT3101, from the riser drops south to the PR1 trough
    kind: keep_clear
    shape: box
    box: [845.7, 2945.3, -1.3, 846.3, 3048.5, 0.0]
    basis: "As Z-KC-CHANNEL-PR6 for T-3101 (PR5 had no collection before, D-031, ASSUMED)"
  - id: Z-KC-CHANNEL-JETTY
