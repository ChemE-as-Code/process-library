    kind: keep_clear
    shape: box
    box: [1131.5, 856.0, -1.3, 1178.5, 857.0, -0.1]
    basis: "Under the deck slab along the platform's south edge, from the drip trays under the Berth 2 arms and manifold (west face) and the Berth 1 ones (east face), to the catwalk at x 1163.5, vented there into the open catwalk trough; no muster point or escape station over it any more (D-018, D-031, ASSUMED)"
