    basis: "0.6 m wide on the rack centreline, lined with cellular glass, falling 0.5 % east from 1.61 m deep at x 975 to an invert of -2.21 m at the junction (D-033.11); the drip pads under the off-centre flanged items drain to it (Z-HA-CATCH-*); 46.8 m from the T-2101 shell, 62.7 m from S-RT2101 (D-018, D-031, D-033, ASSUMED)"
  - id: Z-KC-TROUGH-PR3
    title: Open spill trough under PR3's north-south leg and PR4, from the junction north past road R2 to y 3237.5
    kind: keep_clear
    shape: box
    box: [1094.7, 2945.3, -3.70, 1095.3, 3237.8, 0.3]
    basis: "Collector to the basin under the centreline of PR3 and PR4, invert -2.21 m at the junction, -2.46 m at the road R7 culvert, -3.10 m at the road R2 culvert (under PR4's portal), -3.67 m at the corner (1095, 3237.5) between PR4's bents at y 3229 / 3246; 119.6 m from the T-2101 shell, 98.5 m from S-RT2101, 70 m from B-SUB (D-018, D-031, D-033.11, ASSUMED; on the flat concept grade of D-013 the trough deepens as it falls, the real terrain and the civil design set the final profile)"
  - id: Z-KC-TROUGH-SUMP
    title: Open spill trough from PR4 west at y 3237.5 into the east side of the basin T-8101
    kind: keep_clear
    shape: box
    box: [997.8, 3237.2, -4.20, 1095.3, 3237.8, 0.3]
    basis: "West leg 111 m north of road R2's north edge and 17 m north of PR8, invert -3.67 m at the corner to -4.16 m where it enters the basin wall at x 998, 1.37 m above the basin's full design-spill level (-5.53 m in the 10.5 m pit), so the spill never backs up into the troughs; it replaces the west leg 39 m from R2 and the last leg of D-033.3 (D-018, D-031, D-033.11, ASSUMED)"
  # the troughs and their catchments as release sources (review 2026-11-05-basic-layout-4 #2):
  # LNG lies in them only on a spill, secondary grade, the cold vapour at grade: zone 2 over the
  # trough and 3 m either side to 1 m above grade, as the sumps (ASSUMED until the terminal's
