      - {item: D-6101/N2, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: D-6101/N3, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: D-6101/N4, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: D-6101/N5, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: D-6101/N6, release_grade: secondary, substance: methane, source_kind: flange}
    basis: "LNG pump seals, secondary grade; table row pump_seal/secondary/flammable_gas (ASSUMED). The drain drums' nozzle flanges (arm drain inlet N1, vent N2, bottom outlet N3 with HV-n115, bridle N4 / N5, surge relief inlet N6) as D-8101's: table row flange/secondary, zone 2 within 1 m (ASSUMED); the drums and HV-n115 stand over their own drip tray bays Z-HA-TRAY-D5101 / -D6101 (adversarial check of D-035, D-035.14)"
