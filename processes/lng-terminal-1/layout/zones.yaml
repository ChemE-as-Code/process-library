    basis: "A ~100 t class mobile crane (ASSUMED) on the bare deck east of the header bay and the S-HDR stair (x 1165.9) and south of the D6101 bay (y 865.5) and the Berth 1 arm bays (y 875), over the enclosed collector -E (x 1169.25-1170.75, outrigger loads on its cover slab the marine engineer's). It makes the header bay lifts vertically through their lift paths (Z-MNT-*, nothing stands over the bay above 5.5 m): XV-5101 / XV-6101 ~12 t at ~9 m, SR-5102 / SR-6102 ~6 t (cover ~1 t, basket ~0.6 t) at ~11.3 m, XV-4107 ~12 t at ~14.3 m, XV-4103 ~1.5 t at ~11 m from its centre (1170.0, 860.5); gross 13.9 t at most (x 1.1 dynamic x 1.05 rigging), ~200 tm, ~18.5 t of chart capacity at 75 % (D-040 table, the lifting study's criteria; cheme-as-code 1.11 has no study row for an in-line item), and the drain drum D-6101 (18 t, lifting study). Reached from R10 over the Z-MNT-A4E strip covers and the deck strip east of the D6101 bay (x 1167-1170) (D-040, ASSUMED)"
  - id: Z-MNT-A4W
    title: Crane strip on the platform between the Berth 2 arms and the trestle rack (part lifts only, D-040)
    kind: maintenance
    shape: box
    box: [1140, 870, 0, 1146.5, 900, 1]
    basis: "D-040: a maintenance strip, no longer a crane pad of the lifting study: a ~100 t class crane here lifts arm parts up to ~10 t (counterweights, swivels, couplers, cheme-as-code 1.11 makes no study row for a part); the whole arms are lifted from Z-PAD-B2-FC and D-5101 from Z-PAD-A4SW. Before D-040: deck crane position for an arm (40-45 t) or its counterweight and swivels, and the jetty drain drum D-5101 (ASSUMED); a crane on the deck or a floating crane, per the arm vendor's maintenance plan; reached by the platform roadway R9 from the trestle road (D-027). It lies over the Berth 2 manifold tray bays (x 1140.5-1146.5) and the collector -W under them; part of this layout, so the strip is a crane position only with them (review 2026-11-05-basic-layout-5 #9, review 1 #2 disputed closure, D-035.11): the bays inside the strip are covered with load-bearing open steel grating on beams spanning the 3.25 m bays between the bay kerbs, which passes drips into the bay and carries the outrigger pads on spreader mats; the covers are in place before any lift and are removed or lifted only under permit with the berth out of service. Crane class (D-037, review 1 #2 disputed closure, review 2026-11-05-basic-layout-6): the strip is a position for a ~100 t class mobile crane (ASSUMED) for the drain drum D-5101 (27.7 t of chart capacity at ~17.3 m, lifting study) and arm parts up to ~10 t (counterweights, swivels, couplers); it is not the position for a whole-arm lift: an arm (40-45 t) needs ~69 t of chart capacity at 9.4-12.7 m (~660 tm), a crane class whose outrigger base and loads the 6.5 m strip over the bay covers cannot take. Whole arms are lifted by a floating sheerleg crane moored in the berth pocket west of the arms with no carrier alongside (ASSUMED, arm vendor's maintenance plan, ~15-20 m outreach over the arm risers); the lifting-study rows of LA-5101..5104 from this strip are the model's nearest-pad rows, not the lift plan (cheme-as-code 1.7.0 has no floating crane position; layout/lifting-study.md, D-037)"
