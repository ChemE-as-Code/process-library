  # 2026-11-05-basic-layout #3, #17; D-027)
  - id: Z-HA-PR2-VALVES
    title: Vapour switch valve station at the tank end of the trestle (XV-4131/4132/4135/4136, flanged valves on PR2's straight north end)
    kind: hazardous
    zone: 2
    shape: box
    box: [1086, 2880, 6.0, 1104, 2950, 12.5]
    basis: "Flanged butterfly and ball valves on the vapour returns and the de-inerting lines: stem packing and flange leaks, secondary grade; table rows valve and flange, zone 2 within 1 m, drawn as one envelope over the station from the bottom tier to above the top tier (ASSUMED)"
  - id: Z-HA-PR1-VALVES
    title: Tank-end valve stations on PR1 (loading line and circulation valves XV-4101/4102/4105/4106, FV-4101/4102, the rundown selection valves XV-1102/1103)
    kind: hazardous
    zone: 2
    shape: box
    box: [975, 2936, 6.0, 1104, 2954, 12.5]
    basis: "Flanged valves and their stem packings on the LNG and vapour lines of PR1 east of the riser racks: secondary grade, zone 2 within 1 m, drawn as one envelope over the rack (ASSUMED)"
  - id: Z-HA-ANALYSER
    title: Analyser house B-ANA of AI-4133 / AI-4134 (sample conditioning, analyser vent)
    kind: hazardous
    zone: 2
    shape: box
    box: [1100.5, 2885.0, 0.0, 1110.5, 2896.0, 6.0]
    basis: "Carrier vapour sample lines, the sample conditioning and the analyser vent: secondary grade around the house, zone 2 within 3 m of it (ASSUMED; inside the house the analyser vendor's purge and gas detection, D-027)"
  - id: Z-HA-SUMP-T8101
    title: LNG spill impoundment basin T-8101 (tank-area troughs), north of road R2
    kind: hazardous
    zone: 2
    shape: cylinder
    centre: [990.0, 3237.5, -10.5]
    radius: 11.0
    height: 11.5
    basis: "Collects cold flashing LNG from the troughs only on a spill: secondary grade; the cold vapour is denser than air and spreads at grade, zone 2 inside the pit and 3 m around it to 1 m above grade (ASSUMED; the CSA Z276 / NFPA 59A vapour dispersion exclusion zone replaces it). Re-sited north of R2 by the pool fire screening of D-018 (D-029); deepened to 10.5 m so the design spill stays below the trough inlet (D-033.3); moved 47.5 m north and 10 m east with the trough's north end, so the troughs and the basin burning together keep the BOG area's way out, road R2 and the PR6 east leg within their criteria (D-033.11)"
  - id: Z-HA-SUMP-T8102
    title: Jetty LNG spill sump T-8102 on the sump deck south of the loading platform
    kind: hazardous
    zone: 2
    shape: cylinder
    centre: [1163.5, 812.0, -9.5]
    radius: 6.0
    height: 10.5
    basis: "As Z-HA-SUMP-T8101 for the jetty sump (ASSUMED); re-sited off the platform by the pool fire screening of D-018 (D-029); 6 m across and 9.5 m deep since D-033.11 (smaller burning surface, more volume below the collector inlet), the only outlet of the enclosed jetty collectors enters below its rim"
  # ---- spill collection (D-018, D-031, D-033; layout reviews 2026-11-05-basic-layout-3 #1 /
  # #2 and -4 #1 to #4 with their adversarial checks). The collection serves the leak sources
  # only: the flanged valves, instruments and seals; an all-welded run is not a leak source
  # (as the welded trestle run, D-018), so the riser towers and the riser racks PR5 / PR6
  # between the dome edge and their PR1 joints, which carry welded runs only, have no channel
  # (the enclosed channels of D-031 are removed, D-033.1), and PR2's straight north end, whose
  # valve station is on the vapour returns only, has no trough (D-033.2).
  # D-033.11 (independent screening check of the D-033 arrangement): the troughs and the basin
  # are one design fire (the trough carries the spill into the basin while it still flows);
  # - open troughs (Z-KC-TROUGH-*), 0.6 m wide, falling 0.5 % from 1.61 m deep at x 975, the
  #   first flanged LNG item east of the PR6 joint, east to the PR1 / PR2 / PR3 junction, north
  #   under PR3 and PR4 past road R2 to y 3237.5 and west into the basin's east side at an
  #   invert of -4.16 m (profile in D-033.11); lined with cellular glass like the basin
  #   (ASSUMED, D-033.2); each a keep-clear volume (no pipe, post or tray in it) and inside its
  #   own zone 2 (Z-HA-TROUGH-*). PR1 west of x 975 carries no LNG flanged item but XV-3123
  #   (DN 250, on PR5 at the joint) and the DN 25 thermal relief PSV-1123; they are held at the
  #   item in drip trays as the dome-edge valves (Z-HA-TRAY-XV3123), so the 140 m trough leg in
  #   front of T-2101 and the PR1W catchment are removed (D-033.11).
  #   A trough fire is screened by the D-018 point-source method integrated along the trough
  #   (line source q' = chi_r m'' dHc w = 0.35 x 0.078 x 50 MJ/kg x 0.6 m = 0.82 MW per m,
  #   every leg burning at once with the basin and the releasing item's pad, x 1.2 for flame
  #   tilt, ASSUMED; table in D-033.11);
  # - kerbed drip pads at grade only under the flanged LNG items off the trough's line, each
  #   draining straight to the trough or by a 0.6 m gutter (Z-HA-CATCH-*, Z-KC-GUTTER-*), with
  #   spray shields on the flanges (ASSUMED) so a leak falls onto the pad: the broad paved
  #   catchments of D-033.3 are removed, whose burning flow path was not screened;
  # - enclosed collectors (Z-KC-CHANNEL-JETTY*) only under the loading platform deck, one under
  #   each tray row so every bay drains through an open floor outlet straight down into one, a
  #   south collector and a collector under the catwalk into the sump T-8102, below its rim:
  #   lined with cellular glass and sized for the liquid and the vapour formed (D-033.4,
  #   D-033.11). No liquid seals and no other enclosed drain pipe (XO's DN 300 drain removed).
