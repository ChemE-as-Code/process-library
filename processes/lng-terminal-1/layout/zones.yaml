# Zones of the 3D layout. Schema: `cheme schema zones`. Skill area-classification.
# SCREENING ONLY, every zone ASSUMED: the hazardous volumes from sources take cheme-as-code's
# indicative radius table (domains/safety/data/release-radii.yaml); no dispersion is modelled.
# The terminal's area classification (CSA C22.1 / IEC 60079-10-1, by a competent person) and
# the marine terminal safety zones of the TERMPOL / TIG review replace or confirm each one.
# Substance: LNG and boil-off gas, taken as methane (flammable gas, lighter than air once warm;
# cold vapour from a liquid release is denser than air and spreads at grade).
# Layout basis of the escape routes, keep-clear volumes and the tank-top platforms: D-027.
zones:
  # ---- hazardous areas (flammable releases)
  - id: Z-HA-TANK-PSV
    title: Tank roof relief valve outlets PSV-2131A/B/C (T-2101) and PSV-3131A/B/C (T-3101)
    kind: hazardous
    zone: 1
    sources:
      - {item: BOG-2002, release_grade: secondary, substance: methane, source_kind: psv_outlet}   # PSV-2131A tailpipe
      - {item: BOG-2003, release_grade: secondary, substance: methane, source_kind: psv_outlet}   # PSV-2131B tailpipe
      - {item: BOG-2004, release_grade: secondary, substance: methane, source_kind: psv_outlet}   # PSV-2131C tailpipe
      - {item: BOG-3002, release_grade: secondary, substance: methane, source_kind: psv_outlet}   # PSV-3131A tailpipe
      - {item: BOG-3003, release_grade: secondary, substance: methane, source_kind: psv_outlet}   # PSV-3131B tailpipe
      - {item: BOG-3004, release_grade: secondary, substance: methane, source_kind: psv_outlet}   # PSV-3131C tailpipe
    basis: "Tank overpressure relief to atmosphere above the pump platform, only when PV-1110 to the flare and the BOG compressors have failed (D-017): secondary grade; table row psv_outlet/secondary/flammable_gas, zone 1 within 3 m of the outlet (ASSUMED); the tailpipes rise so the zone clears the platform's walking level and headroom (piping/routing.yaml vents rule, D-027)"
  - id: Z-HA-BOG-SEALS
    title: BOG compressor shaft seals K-7101A/B/C
    kind: hazardous
    zone: 2
    sources:
      - {item: K-7101A, release_grade: secondary, substance: methane, source_kind: compressor_seal}
      - {item: K-7101B, release_grade: secondary, substance: methane, source_kind: compressor_seal}
      - {item: K-7101C, release_grade: secondary, substance: methane, source_kind: compressor_seal}
    basis: "Dry gas seals with their vents to the flare: leakage only on seal failure, secondary grade; table row compressor_seal/secondary/flammable_gas, zone 2 within 3 m (ASSUMED)"
  - id: Z-HA-ARMS-B2
    title: Berth 2 loading arms LA-5101 to LA-5104 (coupling flanges, swivels)
    kind: hazardous
    zone: 2
    sources:
      - {item: LA-5101, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: LA-5102, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: LA-5103, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: LA-5104, release_grade: secondary, substance: methane, source_kind: flange}
    basis: "Swivel joints and the arm base flanges: secondary grade; table row flange/secondary/flammable_gas, zone 2 within 1 m (ASSUMED)"
  - id: Z-HA-ARMS-B1
    title: Berth 1 loading arms LA-6101 to LA-6104 (coupling flanges, swivels)
    kind: hazardous
    zone: 2
    sources:
      - {item: LA-6101, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: LA-6102, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: LA-6103, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: LA-6104, release_grade: secondary, substance: methane, source_kind: flange}
    basis: "As Z-HA-ARMS-B2 (ASSUMED)"
  - id: Z-HA-MANIFOLD-B2
    title: Berth 2 arm envelope and ship manifold area (couplings opened at every connection, purged)
    kind: hazardous
    zone: 1
    shape: box
    box: [1120, 872, 0, 1142, 902, 24]
    basis: "The arm couplings (QCDC, ERC) are connected, purged with nitrogen and drained at every transfer: a primary release a few times a month; zone 1 over the arm envelope from the west face to 10 m outboard, up to the arm apex (ASSUMED screening; the table has no row for a loading coupling)"
  - id: Z-HA-MANIFOLD-B1
    title: Berth 1 arm envelope and ship manifold area
    kind: hazardous
    zone: 1
    shape: box
    box: [1168, 872, 0, 1190, 902, 24]
    basis: "As Z-HA-MANIFOLD-B2, on the east face (ASSUMED)"
  - id: Z-HA-FLARE-KO
    title: Flare knock-out drum D-8101 flanges and its pump seals P-8101A/B
    kind: hazardous
    zone: 2
    sources:
      - {item: D-8101/N1, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: D-8101/N2, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: D-8101/N3, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: P-8101A, release_grade: secondary, substance: methane, source_kind: pump_seal}
      - {item: P-8101B, release_grade: secondary, substance: methane, source_kind: pump_seal}
    basis: "Inlet, outlet and drain flanges of the KO drum and the seals of its LNG pump-out pumps: secondary grade; table rows flange (1 m) and pump_seal (3 m cylinder from grade), zone 2 (ASSUMED)"
  - id: Z-HA-JETTY-DRAIN
    title: Jetty drain pump seals P-5101 and P-6101
    kind: hazardous
    zone: 2
    sources:
