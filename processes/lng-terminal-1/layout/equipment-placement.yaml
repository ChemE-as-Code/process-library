  # bows and more volume below the collector inlet
  - {tag: T-8102, position: [1163.5, 812, -9.5], notes: "Jetty spill sump pit on the sump deck A9 south of the loading platform (zone Z-HA-SUMP-T8102), 6 m across, 9.5 m deep. ASSUMED (D-018, D-029, D-031, D-033.11)."}
