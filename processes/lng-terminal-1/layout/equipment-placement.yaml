# Equipment placement. Schema: `cheme schema placement`. Position = footprint centre, bottom
# elevation, m (site frame of layout/site-plan.yaml). Shapes and sizes come from the equipment
# list. Measured: T-2101, FL-8101, the Berth 2 platform (D-013); everything else ASSUMED.
equipment:
  # ---- A1 tanks (P-02, P-03)
  # Full-containment tanks: every connection goes through the roof (no shell penetration of
  # the inner or outer tank, D-007). The process nozzles stand in a row near the east edge of
  # the dome, facing the riser rack (PR6 / PR5); the relief and vacuum valves on the north-east
  # quarter, away from the stair head (south-west); the minimum-flow returns beside their pump
  # columns; the instrument wells west of the crown. Offsets from the roof centre, ASSUMED.
  - tag: T-2101
    position: [929.4, 3025.8, 0]
    notes: "Measured centre (OSM way 1435792133, D-013). Roof nozzle positions ASSUMED."
    nozzles: &tank_roof_nozzles
      - {id: N1, face: top, offset: [37, -14]}    # top fill (spray ring)
      - {id: N2, face: top, offset: [37, -20]}    # bottom fill (internal down-comer)
      - {id: N3, face: top, offset: [37, 18]}     # vapour outlet
      - {id: N8, face: top, offset: [37, -8]}     # circulation return
      - {id: N4, face: top, offset: [30, 24]}     # PSV A
      - {id: N5, face: top, offset: [26, 28]}     # PSV B
      - {id: N6, face: top, offset: [20, 32]}     # vacuum relief A
      - {id: N7, face: top, offset: [14, 34]}     # vacuum relief B
      - {id: N11, face: top, offset: [33, 19]}    # third relief valve
      - {id: N12, face: top, offset: [8, 36]}     # third vacuum relief valve
      - {id: N9, face: top, offset: [34, -3]}     # DN 25 connections (LNG-n031 / n032)
      - {id: N10, face: top, offset: [34, 3]}
      - {id: I8, face: top, offset: [-6, 16]}
      - {id: MA, face: top, offset: [3.0, 2.5]}   # minimum-flow returns at the crown, beside
      - {id: MB, face: top, offset: [3.0, -2.5]}  # the pump platform (above the 56 m roof
      - {id: MC, face: top, offset: [0.5, 3.8]}   # level, so the lines come in from above)
      - {id: MD, face: top, offset: [0.5, -3.8]}
      - {id: MR, face: top, offset: [3.8, 0.0]}
      - {id: I1, face: top, offset: [-6, -12]}    # level, temperature and density wells
      - {id: I2, face: top, offset: [-6, -8]}
      - {id: I3, face: top, offset: [-6, -4]}
      - {id: I4, face: top, offset: [-6, 0]}
      - {id: I5, face: top, offset: [-6, 4]}
      - {id: I6, face: top, offset: [-6, 8]}
      - {id: I7, face: top, offset: [-6, 12]}
  - tag: T-3101
    position: [789.4, 3025.8, 0]
    notes: "Phase 2 tank 140 m west of T-2101, ASSUMED (D-019). Roof nozzles as T-2101, ASSUMED."
    nozzles: *tank_roof_nozzles
  # In-tank pumps: the column head plates on the tank-top pump platform near the crown (D-011)
  - {tag: P-2101A, position: [941, 3032, 56], notes: "Pump column head on the T-2101 roof platform."}
  - {tag: P-2101B, position: [941, 3020, 56], notes: "Pump column head on the T-2101 roof platform."}
  - {tag: P-2101C, position: [953, 3032, 56], notes: "Pump column head on the T-2101 roof platform."}
  - {tag: P-2101D, position: [953, 3020, 56], notes: "Pump column head on the T-2101 roof platform."}
  - {tag: P-2102, position: [947, 3040, 56], notes: "Circulation pump column head on the T-2101 roof platform."}
  - {tag: P-3101A, position: [801, 3032, 56], notes: "Pump column head on the T-3101 roof platform."}
  - {tag: P-3101B, position: [801, 3020, 56], notes: "Pump column head on the T-3101 roof platform."}
  - {tag: P-3101C, position: [813, 3032, 56], notes: "Pump column head on the T-3101 roof platform."}
  - {tag: P-3101D, position: [813, 3020, 56], notes: "Pump column head on the T-3101 roof platform."}
  - {tag: P-3102, position: [807, 3040, 56], notes: "Circulation pump column head on the T-3101 roof platform."}
  # ---- A1 impoundment (P-08)
  - {tag: T-8101, position: [968, 2968, -6], notes: "Sump pit below grade, 6 m deep, south-east of T-2101 between the tank and the rack. ASSUMED (D-018)."}
  - {tag: P-8102, position: [954, 2966, 0], notes: "Sump pump at the pit edge. ASSUMED."}
  # ---- A2 BOG compression (P-07)
  - tag: D-7101
    position: [1030, 3040, 0]
    notes: "BOG suction drum, north end of A2. ASSUMED. Inlet N1 on the north side, under the PR6 east leg that brings the tank vapour header."
    nozzles: [{id: N1, angle_deg: 90, elevation: 5.9}]
    access: {platforms: [], notes: "No platforms: N1 (inlet) and N2 (outlet to the suction header) are piped nozzles with no manual valve at the drum; N4/N5 are the level bridle tappings at 3.8-4.3 m, whose transmitters are remote-mounted at grade on the bridle; the drain valve on N3 is at grade. Inspection access by mobile platform (ASSUMED)."}
  # Compressor packages, shaft east-west, suction (N1) on the west end, motor on the east end
  # (its removal space kept free); the discharge (N2) on the south side at mid-height, so the
  # discharge header runs low east of the machines and the crane lanes from Z-PAD-A2E stay
  # clear above them (ASSUMED).
  - {tag: K-7101A, position: [1050, 3015, 0], notes: "Compressor package, shaft east-west. ASSUMED.", nozzles: [{id: N2, face: south}]}
  - {tag: K-7101B, position: [1050, 3000, 0], notes: "ASSUMED.", nozzles: [{id: N2, face: south}]}
  - {tag: K-7101C, position: [1050, 2985, 0], notes: "Installed spare. ASSUMED.", nozzles: [{id: N2, face: south}]}
  # ---- A3 flare (P-08)
  - {tag: FL-8101, position: [1484.9, 3102.8, 0], notes: "Storage and loading flare on the site derrick, measured derrick position (OSM node 13436993551, D-013)."}
  - tag: D-8101
    position: [1448, 3075, 0]
    notes: "Flare KO drum near the derrick base. ASSUMED. The PSV-8109 thermal relief return (N8) on the top near the east head, apart from the minimum-flow return N7 on the east head (ASSUMED)."
    nozzles: [{id: N8, face: top, offset: [5.5, 0]}]
  - {tag: P-8101A, position: [1438, 3065, 0], notes: "ASSUMED."}
  - {tag: P-8101B, position: [1444, 3065, 0], notes: "ASSUMED."}
  # ---- A4 loading platform: Berth 2 arms on the west face, south to north L, V, H, L (TIG Rev 3)
  # Arm nozzles: N1 the shore connection at the riser base, facing the platform piping; N2 the
  # outboard (ERS, coupler, carrier manifold) high on the arm, facing the ship (ASSUMED, D-014).
  - {tag: LA-5101, position: [1137, 878, 0], notes: "Berth 2 liquid arm, southernmost. Arm spacing 6 m ASSUMED (D-014).", nozzles: &arms_b2 [{id: N1, face: east, offset: [0, -8]}, {id: N2, face: west, offset: [0, 8]}]}
  - {tag: LA-5102, position: [1137, 884, 0], notes: "Berth 2 vapour arm.", nozzles: *arms_b2}
  - {tag: LA-5103, position: [1137, 890, 0], notes: "Berth 2 hybrid arm.", nozzles: *arms_b2}
  - {tag: LA-5104, position: [1137, 896, 0], notes: "Berth 2 liquid arm, northernmost.", nozzles: *arms_b2}
  - {tag: D-5101, position: [1150, 868, 0], notes: "Berth 2 jetty drain drum. ASSUMED."}
  - {tag: P-5101, position: [1151, 874.5, 0], notes: "North of its drum, so its discharge rises to PR2 clear of the drum's crane lane. ASSUMED."}
  # Berth 1 (Phase 2) on the east face of the platform, ASSUMED (D-019)
  - {tag: LA-6101, position: [1173, 878, 0], notes: "Berth 1 liquid arm. ASSUMED position (D-019).", nozzles: &arms_b1 [{id: N1, face: west, offset: [0, -8]}, {id: N2, face: east, offset: [0, 8]}]}
  - {tag: LA-6102, position: [1173, 884, 0], notes: "Berth 1 vapour arm.", nozzles: *arms_b1}
  - {tag: LA-6103, position: [1173, 890, 0], notes: "Berth 1 hybrid arm.", nozzles: *arms_b1}
  - {tag: LA-6104, position: [1173, 896, 0], notes: "Berth 1 liquid arm.", nozzles: *arms_b1}
  - {tag: D-6101, position: [1162, 868, 0], notes: "Berth 1 jetty drain drum. ASSUMED."}
  - {tag: P-6101, position: [1160, 874.5, 0], notes: "North of its drum, as P-5101. ASSUMED."}
  - {tag: T-8102, position: [1168, 914, -4], notes: "Jetty spill sump pit below the deck between the berths. ASSUMED (D-018)."}
