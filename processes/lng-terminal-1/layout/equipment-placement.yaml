  # carriers, at the pool fire screening distances of D-018 from both carrier envelopes, the
  # PR2 end, the arms, road R10 and the muster point; the platform drip trays drain to it in
  # enclosed collectors under the deck and under the sump deck's catwalk S-CW-A9
  # (Z-KC-CHANNEL-JETTY*, D-033.11; the open catwalk trough is removed). Moved 2.5 m east onto
