# Process Atlas manifest of lng-terminal-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: lng-terminal-1
title: LNG export marine terminal (2 x 225,000 m3 tanks, 2 berths, 28 MTPA; LNG Canada reference)
summary: >-
  The storage, ship loading and boil-off gas system of an LNG export plant: 28 MTPA of rundown
  from four trains into two full-containment tanks, in-tank pumps, ~2 km trestle lines and two
  berths loading carriers at 12,000 m3/h, with BOG compressed back to the trains. Modelled on
  LNG Canada (Kitimat, Shell 40 %), Phase 1 + 2; concept stage.
description: |
  A design case built from public facts of LNG Canada's export terminal at Kitimat, British
  Columbia: the as-built Phase 1 (one 225,000 m3 full-containment tank, one berth, the
  Terminal Information Guide's four 16 inch arms, 12,000 m3/h loading) and the Phase 2
  extension decided in September 2026 (a second tank, a second berth, trains 3 and 4). The
  plot plan follows the real site: tank, flare and trains from OpenStreetMap, the ~2 km trestle
  and the loading platform from satellite imagery, redrawn as our own geometry.

  Rundown (3,365 t/h) fills the tanks; four of eight in-tank pumps (3,000 m3/h each) load a
  carrier through two DN 800 lines over the trestle; in holding one circulation pump keeps the
  lines cold through a loop. The carrier's own compressor returns its vapour; with the tank
  boil-off and the displaced vapour it is desuperheated with an LNG spray and compressed (3 x
  50 %) to 600 kPa(a) for the trains' fuel gas. Holding makes 21.9 t/h of BOG, loading 49.1
  t/h.

  Stream values come from an independent sizing script on the GERG-2008 reference equation of
  state (CoolProp), because no property package of ChemE-as-Code covers LNG yet. In-tank pump,
  BOG compressor, ERS and LNG specification data are not public and are ASSUMED. See DESIGN.md.
families: [fuels]
keywords: [LNG, liquefied natural gas, export terminal, marine terminal, LNG storage tank, full containment, in-tank pump, loading arm, jetty, trestle, boil-off gas, BOG compressor, vapour return, LNG carrier, LNG Canada, Kitimat, Shell]
facets:
  feedstock_basis: [fossil]
  product_classes: [fuels]
  unit_operations: [storage, compression]
  region: CA
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept stage: balanced flowsheet (mass and component balances of every block and step in
    three cases: average, loading, holding) from scripts/terminal_sizing.py, GERG-2008 via
    CoolProp; no cheme property package covers LNG, so the values are assumed with the script
    as their source (library ADR 0027). The reference facts are from LNG Canada's public
    documents (DESIGN.md source register); pump, compressor, ERS and LNG specification data
    are ASSUMED. Not reviewed.
chemistry:
  inputs:
    - {chemical: liquefied-natural-gas, role: feedstock, note: "feed:RUNDOWN: LNG rundown from the liquefaction trains, 3,365 t/h (composition derived, ASSUMED, D-004)"}
  outputs:
    - {chemical: liquefied-natural-gas, role: main-product, note: "product:SHIP: LNG loaded to carriers; net of the carrier return vapour 27.7 Mt/a"}
    - {chemical: methane, role: co-product, note: "product:BOGOUT: boil-off gas (about 92 mol% CH4, 8 mol% N2) compressed to the trains' fuel gas, 39 t/h on average; taken as methane"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "in-tank pumps 1.7 MW and BOG compressors 2.1 MW on average (motor efficiency 0.95 ASSUMED)"}
basis:
  capacity: "28 MTPA LNG (4 trains), 2 x 225,000 m3 storage, 12,000 m3/h loading"
  operating_hours_per_year: 8322
  location: "Kitimat, British Columbia, Canada (LNG Canada reference site)"
