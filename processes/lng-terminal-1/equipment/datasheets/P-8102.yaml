sizing_basis:
- parameter: basis
  value: "DESIGN.md D-018, D-034 (submersible in the pit, review 2026-11-05-basic-design-7 #6) and D-036 (19.5 m
    pit, materials and motor, review 2026-11-05-basic-design-8 #3), ASSUMED where marked"
  reference: D-036
notes: "Submersible rainwater pump in the floor pocket of the T-8101 pit (since D-039; was on the pit floor) on a
  guide rail, lifted through the pit cover; its riser W-8002 leaves through the cover, so there is no suction lift
  and no wall penetration in the LNG impoundment. Re-rated for the 19.5 m pit: 50 m3/h at 45 m (44 m before the
  pocket), shut-off ~59 m, design 10 barg. Austenitic stainless steel down to -170 degC and a flameproof, zone 1
  submersible motor, because it stands where an LNG spill arrives first. T-8101 is kept dry (review
  2026-11-05-basic-design-9 #1 and its adversarial check, D-039): the pit floor falls to the pocket (~1.5 x 1.5 m,
  1.2 m deep, ASSUMED), which holds the pump's ~0.5 m submergence, so no water stands on the pit floor. Started at
  0.90 m and stopped at 0.60 m above the pocket floor by LI-8103 through HS-8103 (loop LC-8103); its start is
  inhibited by a level rising at a spill rate on the independent LZT-8113 (C&E I-810); C&E I-801 opens the motor
  feeder, latching, on TSL-8102 (tip 1.0 m above the pocket floor, above the start level), TSL-8120 (fast probe in
  the discharge upstream of CV-8114) or AT-8124 (gas at the pit rim). Check valve CV-8114, with a ~6 mm drain-back
  hole in its disc (ASSUMED, as CV-8116 on P-8103), and isolation valve HV-8115 on the riser above the cover: no
  back-flow from the oily water system into the impoundment beyond the riser's own ~0.23 m3, and the riser drains
  back through the stopped pump into the pocket, so nothing stands above the cover to freeze at the -20 degC design
  ambient (the run on PR8 laid to fall to the battery limit, ASSUMED; vendor to confirm the reverse run-down of the
  stopped pump); the pump is pulled with its riser isolated. Motor 400 V, 15 kW unchanged; the electrical list power
  follows this datasheet. ASSUMED."
