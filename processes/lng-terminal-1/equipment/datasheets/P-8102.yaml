notes: "Submersible rainwater pump on the T-8101 pit floor on a guide rail, lifted through the pit cover; its
  riser W-8002 leaves through the cover, so there is no suction lift and no wall penetration in the LNG
  impoundment. Started and stopped by LI-8103 (radar through the cover) and interlocked off on low
  temperature, TSL-8102 hung from the cover (LNG in the sump, C&E I-801). Motor 400 V; the electrical list
  power follows this datasheet (owner of electrical/). ASSUMED."
