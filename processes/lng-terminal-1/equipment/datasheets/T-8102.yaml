notes: "On its own sump deck A9 south of the loading platform (D-029, D-031); collects the drip trays below
  both berths' manifolds and arms; 6 m x 13 m since D-035.1 (9.5 m in D-033.11), for the platform spill of D-034.3. Below its inlet ~257 m3 hold the ~170 m3 platform spill, the 40 m3 kept for the trestle drain-down bounded by SEQ-LINE-EMPTY (~36 m3, the leak fed at ~1 kg/s for ~3.5 h at most, checker of D-036): 170 + 40 = 210 of 257 m3, 47 m3 left with no rain allowance (D-037.15 (a), D-037.16). No LNG on standing water: the sump is dry at the start of and during every transfer, rain collecting only in the ~0.25 m3 floor pocket (~0.8 m across, 0.5 m deep) and taken out by the fixed dry-sump pump P-8103 (motor on the cover, bowl in the pocket; C&E I-806 / I-807 on LZT-8106), locked out on LNG by TSL-8104 in the pocket or TSL-8118 on its discharge head, 1oo2 (C&E I-808, D-037.17). LZT-8106, a guided-wave radar in a stilling pipe from the cover down to the pocket (D-037.17), measures from the pocket floor and is the P-8103 control alone since D-039; the independent LZT-8119 (N3, a second guided-wave radar in its own stilling pipe, review 2026-11-05-basic-design-9 #4) gives LAH 0.50 m at the pocket rim, a transfer hold (SEQ-LOAD S0 / S4), and LAHH 0.60 m, 0.1 m over the sump floor (~3 m3), C&E I-805, blocks the start of a transfer and during one trips ESD-1 of the transferring berth. D-036's LAH ~20 m3 / LAHH ~45 m3 and its rain allowance are withdrawn. The portable pump through the cover is a spare means only. ASSUMED (D-018)."
