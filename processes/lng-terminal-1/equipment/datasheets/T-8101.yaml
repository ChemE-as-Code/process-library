notes: "Collects spills from the tank-area troughs (the welded trestle run has no drip tray, D-031, D-033).
  Depth and volume follow the equipment list (19.5 m, the layout's D-035: 2,400 m3 of D-034.3 below the
  trough inlet); the governing release flows of the
  tank area are stated in D-034. No wall penetration (review 2026-11-05-basic-design-7 #6, D-034): N1 is the
  radar level LI-8103 and N2 the low-temperature probe TSL-8102, both through the pit cover, and the
  submersible rainwater pump P-8102 stands in the floor pocket (D-039; was on the pit floor) with its riser W-8002 through the cover.
  High-expansion foam. Kept dry since D-039 (review 2026-11-05-basic-design-9 #1 and its adversarial
  check), as T-8102: the pit floor falls to a floor pocket (~1.5 x 1.5 m, 1.2 m deep, ~2.7 m3, ASSUMED,
  civil) in which P-8102 stands with its ~0.5 m submergence; LI-8103 (N1) starts it at 0.90 m and stops
  it at 0.60 m above the pocket floor; TSL-8102 (N2) has its tip 1.0 m above the pocket floor; N3 is the
  independent level LZT-8113 (second radar through the cover: LAH 1.20 m at the pocket rim, LAHH 1.30 m,
  rate of rise; C&E I-809 / I-810) and N4 the rim gas detection AT-8124 (F&G, C&E I-801 and the foam
  start). D-035's 100 m3 (0.5 m) of rain allowed on the floor is withdrawn: the ~2,760 m3 below the
  trough inlet hold the 2,400 m3 design spill with no rain allowance. All ASSUMED."
