notes: 'Knock-out of spray droplets and LNG carry-over from the vapour return and the tank BOG; ~54 t/h
  at 108 kPa(a), -140 degC (~32,000 m3/h); diameter from a K value of 0.1 m/s with margin (ASSUMED, D-010).
