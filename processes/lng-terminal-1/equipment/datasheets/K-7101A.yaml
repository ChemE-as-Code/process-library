notes: '50 % of the loading case +10 %: 31.1 t/h of the 56.5 t/h loading case (S14, D-034), so two machines
  carry the design case and the third is the installed spare (review 2026-11-05-basic-design-8 #2, D-036; was
  27 t/h); 108 to 600 kPa(a), suction -140 degC, discharge ~-49 degC, ~1.6 MW gas power at 78 % polytropic,
  ~1.64 MW shaft (scripts/terminal_sizing.py, ideal-gas estimate); electric motor 6.6 kV; inlet guide vanes,
  anti-surge recycle UV-7104A. Holding (22 t/h) needs one machine. ASSUMED (D-010).'
