  - {tag: T-8101, type: Tank, service: LNG spill impoundment sump (tank area), sheet: P-08, design_pressure_barg: 0, design_temperature_degc: -170, material: Concrete with insulated lining,
     dimensions: {diameter: 16, height: 19.5, head: flat, support: none},
     notes: "Collects spills from the tank-area troughs only (the trestle has no tray, D-018): the PR1 trough from the PR6 joint (x 975) east to the PR1 / PR2 / PR3 junction, with the drip pads under the off-centre flanged items, then under PR3 and PR4 to y 3237.5 and west into the pit (D-031, D-033, D-033.11); no channel under the riser racks PR5 / PR6 (welded runs only, D-033.1, piping/pipe-specs.yaml), no trough under PR2's north end (vapour valves only, D-033.2) and none west of x 975 (XV-3123 and the DN 25 thermal reliefs held in drip trays at the item, D-033.11, D-035.6). Sized for the governing tank-area release of D-034.3, one tank's loading pumps at run-out into one line at the loading valve station or XV-4105 (~14,400 m3/h, ASSUMED 1.2 x the rated 12,000 m3/h) for the 10 min of D-018: 2,400 m3 (was 10 min of one loading line, 1,000 m3; the rundown through XV-1102 / XV-1103 gives 1,260 m3): 19.5 m deep so the design spill fills it to -7.56 m, 1.79 m below the trough inlet invert (-5.77 m), ~2,760 m3 below the inlet, with no rain allowance since D-039 (D-035's 100 m3 / 0.5 m of rain on the floor withdrawn); the 16 m diameter, and so the burning surface of D-018, kept; a tanked, watertight shaft (groundwater, uplift; civil, ASSUMED); high-expansion foam, started by the fire and gas system on TSL-8102, TSL-8120 or the rim gas detection AT-8124 (D-039). Kept dry as T-8102 (review 2026-11-05-basic-design-9 #1 and its adversarial check, D-039: no LNG on standing water, D-018, D-037.15 (a)): the pit floor falls to a floor pocket (~1.5 x 1.5 m, 1.2 m deep, ~2.7 m3, ASSUMED, civil) in which the submersible P-8102 stands with its submergence (D-034.8; re-rated for the 19.5 m pit in D-036), started and stopped in the pocket by LI-8103 (0.90 / 0.60 m), the independent LZT-8113 giving the LAH at the pocket rim (1.20 m, a transfer hold), the LAHH (1.30 m, C&E I-809) and the rate-of-rise inhibit of P-8102 (C&E I-810). Sited north of road R2 by the pool fire screening of D-018 (D-029), at (990, 3237.5) since D-033.11; road R12 and the hardstanding Z-LAY-A8W west of it are its fire approach, R13 its maintenance access (D-035.4). The datasheet follows the 19.5 m (design owner, D-035). Ground basis and cover (D-037, ASSUMED until the site investigation): groundwater taken at grade, ~39 MN of uplift on the empty shaft, a diaphragm-wall or caisson shaft with a tension-piled base slab, the cellular glass lining with a thermal break to the structural wall and frost-heave control behind it (civil); the pit cover a grated deck over the south 3 x 16 m strip only (P-8102's davit and head, LI-8103, LZT-8113, TSL-8102, with the pocket below it; AT-8124 round the rim), the rest open (the 201 m2 burning surface of D-018 kept, no confined vapour space), fixed high-expansion foam generators on the rim."}
  - {tag: P-8102, type: CentrifugalPump, service: Impoundment sump rainwater pump, sheet: P-08, design_pressure_barg: 10, design_temperature_degc: -170, material: "Austenitic SS (casing, impeller, riser)",
     dimensions: {diameter: 0.6, height: 2.5, weight: 1.5, variant: vertical_inline, orientation: vertical},
     notes: "Submersible pump in the floor pocket of the T-8101 pit (since D-039, T-8101 kept dry; was on the pit floor) on a guide rail, lifted out through the pit cover, its riser W-8002 through the cover: no suction lift and no wall penetration in the impoundment (review 2026-11-05-basic-design-7 #6, D-034; was a grade pump on a pit-bottom suction). Re-rated for the 19.5 m pit (review 2026-11-05-basic-design-8 #3, D-036; was 36 m for 12.5 m): 50 m3/h at ~44 m (static ~26.6 m from the pit floor to the PR8 rack, ~10.2 m at the oily water battery limit, ~7 m friction; NPSH available ~10.8 m from atmospheric pressure and the submergence), shut-off ~57 m (1.3 x, ASSUMED), so design 10 barg (was 5). Austenitic stainless steel casing, impeller and riser to the isolation valve, design -170 / +40 degC: the first item a spill reaches (was CS at 40 degC). Submersible motor flameproof (Ex d, IIA T3), certified for zone 1 (the pit is zone 2 in layout/zones.yaml; zone 1 taken for the motor because LNG vapour collects in the pit after a spill) with a cold-rated cable and seals (ASSUMED, vendor). Rainwater to the site oily water system through the check valve CV-8114 (drain-back hole in its disc, so the riser empties into the pocket when the pump stops and nothing above the cover freezes, D-039) and the isolation valve HV-8115 above the cover, started and stopped by LI-8103 (radar through the cover) through HS-8103 at 0.90 / 0.60 m above the pocket floor, its speed following the level in between through a VSD (D-039.9: at most ~9 ramped starts an hour, was ~22 direct-on-line starts at the design rain); since D-039 50 m3/h at ~45 m (static ~27.8 m from the pocket), 10.2 kW, motor 15 kW unchanged; C&E I-801 on TSL-8102 (tip 1.0 m above the pocket floor, above the start level), TSL-8120 (fast probe in its discharge upstream of CV-8114) or AT-8124 (gas at the pit rim) opens its motor feeder (LNG in the sump), and C&E I-810 inhibits it on a level rising at a spill rate (review 2026-11-05-basic-design-9 #1); the 3D item is its column head on the pit cover (layout, D-035). ASSUMED."}
  - {tag: P-8103, type: CentrifugalPump, service: Jetty sump dry-sump pump (T-8102 floor pocket), sheet: P-08, design_pressure_barg: 5, design_temperature_degc: -170, material: "Austenitic SS (bowl, impeller, column, line shaft, discharge head)",
     dimensions: {diameter: 0.5, height: 1.8, weight: 1.2, variant: vertical_inline, orientation: vertical},
     notes: "Fixed dry-sump pump of the jetty sump T-8102 (D-037.15 (a), D-037.16): a vertical line-shaft pump, its bowl in the ~0.25 m3 floor pocket (~0.8 m across, 0.5 m deep below the sump floor) and its motor and discharge head on the sump cover at the cover's south edge, opposite the collector inlet on the north wall, so no motor is in the sump; column and line shaft ~13.5 m from the cover to the pocket, the line-shaft bearings dry-running and cold-rated (ASSUMED, vendor). 20 m3/h (ASSUMED, ~1.9 x the ~10.5 m3/h of the ASSUMED 250 mm in 24 h on the ~1,006 m2 draining to the sump) at ~20 m (static ~16 m from the pocket to the discharge 2.5 m above the cover, ~2 m column and line losses, ~2 m at the jetty drain battery limit; ASSUMED), shut-off ~26 m, design 5 barg; austenitic stainless steel wetted parts, design -170 / +40 degC (an LNG spill reaches the pump first). Motor 400 V from MCC-2 with a VSD, flameproof Ex d IIA T3 certified for zone 1 (the sump's zone 2 at the cover, zone 1 taken for it as for P-8102; ASSUMED), certified as a converter-fed combination with its VSD (thermal protection in the winding, dv/dt or sine filter for the ~334 m cable; vendor, D-037.17), with a non-reverse ratchet for the drain-back. Started by LZT-8106 at 0.35 m in the pocket (C&E I-806), its speed following the level, stopped at 0.10 m (C&E I-807); locked out on LNG by TSL-8104 in the pocket (tip 0.40 m above its floor) or TSL-8118 on the discharge head, 1oo2, its feeder opened, latching (C&E I-808, D-037.17). Discharge W-8003 through the check valve CV-8116 (drain-back hole in its disc) and the isolation valve HV-8117 above the cover to the jetty drain at the edge of A9, stainless to the battery limit; self-draining when stopped (column, head and riser back into the pocket, the overhead run to the drain), so nothing above the cover can freeze at the -20 degC design ambient (D-037.17). Pulled with its column through the removable grating panel by a davit on the cover beams, with no transfer on either berth (ASSUMED; layout/lifting-study). The portable pump stays a spare means. ASSUMED."}
  - {tag: T-8102, type: Tank, service: LNG spill impoundment sump (jetty), sheet: P-08, design_pressure_barg: 0, design_temperature_degc: -170, material: Concrete with insulated lining,
     dimensions: {diameter: 6, height: 13.0, head: flat, support: none},
     notes: "On its own piled sump deck A9 south of the loading platform (D-029), centred between the two carriers' hulls (D-031), reached by the catwalk S-CW-A9; collects the drip trays below both berths' manifolds and arms and the header bay at the platform's south end (kerbed bays of at most 36 m2, drained by 1.5 x 1.5 m open floor outlets without liquid seals into enclosed collectors 1.5 m wide under the deck and the catwalk, lined with cellular glass and sized for the berth rate and the vapour formed, entering the sump wall at an invert of -3.91 m; D-033.4, D-033.11, D-035.1). 6 m across and 13.0 m deep since D-035.1 (9.5 m in D-033.11): ~368 m3, of which ~257 m3 below the inlet, against the governing platform spill of D-034.3, the berth header flow of 12,000 m3/h until ESD-1 closure with the drainable header and arm inventory, ~170 m3 per berth (was ~33 m3 for one arm); the ~87 m3 left below the inlet are not a rain allowance since D-037.15 (a): the budget below. A sealed, anchored caisson: its bottom at -1.0 m chart datum lies 7.7 m below extreme high water (deck +12.0 m CD, D-013, D-035.8), designed for the external head and uplift with no opening below the deck (marine engineer, ASSUMED). The slow leak of a trestle-side stem or bonnet seal after ESD closure (D-034.3, ~1 kg/s) is bounded since D-036 by emptying the leaking line back to the tanks with N2 (SEQ-LINE-EMPTY, the leak fed at ~1 kg/s for ~3.5 h at most since the checker of D-036, with bottom-of-line crossover takeoffs and ~4,000 Nm3/h of N2): ~36 m3 with the film left in the line, 40 m3 kept, a design case of this sump beside the ~170 m3 platform spill (the DN 25 tappings and the drain pump tie-ins are no longer on the trestle side). LNG must not meet standing water in the sump (rapid phase transition), so the sump is kept dry (review 2026-11-05-basic-design-7 #9, D-034; since D-037.16 by a fixed pump, the same statement as P-08): the dry-sump pump P-8103 (vertical line-shaft, bowl in the floor pocket, motor on the cover) empties the pocket, started at 0.35 m and stopped at 0.10 m by LZT-8106 (guided-wave radar in a stilling pipe from the cover down to the pocket since D-037.17; C&E I-806 / I-807) and locked out on LNG by TSL-8104 in the pocket or TSL-8118 on its discharge head, 1oo2 (C&E I-808, D-037.17). The LAH at the pocket rim (0.50 m) and the LAHH are on the independent LZT-8119 since D-039 (review 2026-11-05-basic-design-9 #4; LZT-8106 is the P-8103 control alone): the LAH is a transfer hold (no transfer starts, a transfer in progress is paused, SEQ-LOAD S0 / S4), LAHH at 0.60 m, 0.1 m over the floor (~3 m3, C&E I-805), blocks the start of a transfer and during one trips ESD-1 of the transferring berth. The portable submersible pump through the cover stays a spare means, used only while TSL-8104 reads no LNG and with no transfer (D-036's LAH ~20 m3 / LAHH ~45 m3 and its rain allowance are withdrawn, D-037.15 (a)). The platform design spill is restated in D-034 (header flow until ESD closure); the sump size follows it in the layout (D-035). Kept at 6 x 13.0 m by D-037 (a wider sump would put the Berth 2 hull over 8 kW/m2 from its own fire, a deeper one deepens the caisson). Layout basis since D-037.15 (independent check of D-037): no LNG on standing water binds, so the sump is dry at the start of and throughout a transfer, water held only in a floor pocket (~0.8 m across, 0.5 m deep, ~0.25 m3, ASSUMED) and removed continuously by a fixed dry-sump pump with its drive on the cover (no motor in the sump), started by LZT-8106 in the pocket, locked out by TSL-8104 on LNG, the LAH lowered to the pocket rim as a transfer hold: on P-08 and in the C&E since D-037.16 (P-8103, I-805 to I-808; the ~45 m3 of standing rain the LAHH allowed is withdrawn from the basis, and the pump-down during a transfer needs no person on A9). Budget: 170 + 40 = 210 m3 of the 257 m3 below the inlet, 47 m3 left with no rain credit (~42 m3 of rain during the ~4 h drain-down falls on LNG and lowers the volume). Catchment ~1,006 m2 (the drum bays included; was ~935), ~10.5 m3/h at the rainfall ASSUMED 250 mm in 24 h until the civil engineer's Kitimat design storm. Cover: open grating over the whole 6 m sump (~70 % open, no plated part: the 28.3 m2 burning surface and no confined vapour space, as T-8101), LZT-8106 and the P-8103 drive on brackets above it, a removable grating panel for P-8103's column, the portable pump and the inspection (layout/zones.yaml Z-HA-SUMP-T8102). Caisson concept for the marine engineer (hold, D-035.13): double wall, inner cellular glass lining, outer marine concrete, monitored annulus, anchored for ~2.2 MN of uplift empty at extreme high water, internal inspection through the cover (D-037). Rain on LNG in the sump (D-040, review 2026-11-05-basic-layout-7 #3): each kg of rain boils up to ~1.2 kg of LNG, so the ~2.9 kg/s of the ASSUMED design rain on the ~1,006 m2 catchment boils up to ~3.5 kg/s, but only as long as LNG is there: with rain through a drain-down no pool forms (the ~1 kg/s feed boils as it arrives, hulls ~1.9 kW/m2); rain onto a pool already in the sump (at most ~36 m3, ~16 t, boiled off in ~80 min at that rate) is the siting study's named case SC-3 (hulls ~11 kW/m2 with the pool burning, ~7.6 at half the rain); a roof over the sump would keep out only its own 28 m2, so none is fitted. Corrected by D-040.12: SC-3 covers every pool in the sump, governed by the 170-210 m3 platform spill during a transfer (hulls over 8 kW/m2 from ~2 mm/h of rain with the collector vapour, 13.6 / 12.3 at the design rain, for 3.7-9 h with the carrier alongside), and in the design rain ~20 m3 of rain water the drain-down cannot freeze stands under its falling LNG (an RPT case with the pocket water). Pocket water (D-040): between the P-8103 stop and start levels 0.05-0.25 m3 stands in the pocket when a spill arrives; that mass is the RPT basis of the pocket (unconfined under the open grating, its instruments and the bowl at risk, their loss safe: hold or lockout, D-039.4, D-039.6 (d)), for the siting study and H-05. ASSUMED (D-018)."}
