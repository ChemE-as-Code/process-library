     notes: "Keeps the loading lines cold in holding (one pump circulates, EA application 2014 §2): 500 m3/h rated, ~314 m3/h needed for a 3 K rise (scripts/terminal_sizing.py); also tank-to-tank transfer and the desuperheater spray. Design pressure 15 barg, the class of the loading system (was 10 barg): its column, discharge head and minimum-flow tee sit behind the single check valve CV-2122 on the circulation header LNG-2002, which in loading is the loading header at up to the re-rated pumps' shut-off of ~12.2 barg (full tank, at the pump; ~12.1-12.3 barg from XV-n101 to the lowest carrier manifold, scripts/terminal_sizing.py), so a passing check valve is no overpressure case (review 2026-11-05-basic-design-8, adversarial check, D-036). In loading it is held on that check valve by the loading header and runs on its fail-open minimum flow, the spray then coming from the loading header. ASSUMED (D-008, D-011)."}
