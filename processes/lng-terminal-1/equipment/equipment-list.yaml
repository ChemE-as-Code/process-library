  - {tag: T-8101, type: Tank, service: LNG spill impoundment sump (tank area), sheet: P-08, design_pressure_barg: 0, design_temperature_degc: -170, material: Concrete with insulated lining,
     dimensions: {diameter: 16, height: 19.5, head: flat, support: none},
     notes: "Collects spills from the tank-area troughs only (the trestle has no tray, D-018): the PR1 trough from the PR6 joint (x 975) east to the PR1 / PR2 / PR3 junction, with the drip pads under the off-centre flanged items, then under PR3 and PR4 to y 3237.5 and west into the pit (D-031, D-033, D-033.11); no channel under the riser racks PR5 / PR6 (welded runs only, D-033.1, piping/pipe-specs.yaml), no trough under PR2's north end (vapour valves only, D-033.2) and none west of x 975 (XV-3123 and the DN 25 thermal reliefs held in drip trays at the item, D-033.11, D-035.6). Sized for the governing tank-area release of D-034.3, one tank's loading pumps at run-out into one line at the loading valve station or XV-4105 (~14,400 m3/h, ASSUMED 1.2 x the rated 12,000 m3/h) for the 10 min of D-018: 2,400 m3 (was 10 min of one loading line, 1,000 m3; the rundown through XV-1102 / XV-1103 gives 1,260 m3): 19.5 m deep so the design spill fills it to -7.56 m, 1.79 m below the trough inlet invert (-5.77 m), ~2,760 m3 below the inlet, 100 m3 (0.5 m) of rain allowed before it is pumped down; the 16 m diameter, and so the burning surface of D-018, kept; a tanked, watertight shaft (groundwater, uplift; civil, ASSUMED); high-expansion foam. Rainwater by the submersible P-8102 on the pit floor (D-034.8; its head for the 19.5 m pit: design owner, D-035). Sited north of road R2 by the pool fire screening of D-018 (D-029), at (990, 3237.5) since D-033.11; road R12 and the hardstanding Z-LAY-A8W west of it are its fire approach, R13 its maintenance access (D-035.4). The datasheet follows the 19.5 m (design owner, D-035)."}
  - {tag: P-8102, type: CentrifugalPump, service: Impoundment sump rainwater pump, sheet: P-08, design_pressure_barg: 5, design_temperature_degc: 40, material: CS,
     dimensions: {diameter: 0.6, height: 2.5, weight: 1.5, variant: vertical_inline, orientation: vertical},
     notes: "Submersible pump on the T-8101 pit floor on a guide rail, lifted out through the pit cover, its riser W-8002 through the cover: no suction lift and no wall penetration in the impoundment (review 2026-11-05-basic-design-7 #6, D-034; was a grade pump on a pit-bottom suction). 50 m3/h at ~36 m from the 12.5 m pit floor (static ~20 m to the PR8 rack, ~10 m at the oily water battery limit, ~6 m friction; NPSH available ~10.8 m from atmospheric pressure and the submergence). Rainwater to the site oily water system, started and stopped by LI-8103 (radar through the cover) and interlocked off on low temperature, TSL-8102 hung from the cover (LNG in the sump, C&E I-801); the 3D item is its column head on the pit cover (layout, D-035). ASSUMED."}
  - {tag: T-8102, type: Tank, service: LNG spill impoundment sump (jetty), sheet: P-08, design_pressure_barg: 0, design_temperature_degc: -170, material: Concrete with insulated lining,
     dimensions: {diameter: 6, height: 13.0, head: flat, support: none},
     notes: "On its own piled sump deck A9 south of the loading platform (D-029), centred between the two carriers' hulls (D-031), reached by the catwalk S-CW-A9; collects the drip trays below both berths' manifolds and arms and the header bay at the platform's south end (kerbed bays of at most 36 m2, drained by 1.5 x 1.5 m open floor outlets without liquid seals into enclosed collectors 1.5 m wide under the deck and the catwalk, lined with cellular glass and sized for the berth rate and the vapour formed, entering the sump wall at an invert of -3.91 m; D-033.4, D-033.11, D-035.1). 6 m across and 13.0 m deep since D-035.1 (9.5 m in D-033.11): ~368 m3, of which ~257 m3 below the inlet, against the governing platform spill of D-034.3, the berth header flow of 12,000 m3/h until ESD-1 closure with the drainable header and arm inventory, ~170 m3 per berth, leaving ~87 m3 below the inlet for rainwater, ~93 mm on the ~935 m2 of tray bays and sump that drain to it (was ~33 m3 for one arm). A sealed, anchored caisson: its bottom at -1.0 m chart datum lies 7.7 m below extreme high water (deck +12.0 m CD, D-013, D-035.8), designed for the external head and uplift with no opening below the deck (marine engineer, ASSUMED). The slow leak of a trestle-side stem or bonnet seal after ESD closure (D-034.3, up to ~1,020 m3 of one line's inventory at ~1 kg/s) is a residual for the siting study, not this sump's design case. LNG must not meet standing water in the sump (rapid phase transition), so the sump is kept pumped down: no fixed pump; a portable submersible pump lowered through the sump cover, used once TSL-8104 confirms no LNG, and the sump checked dry before every transfer (a SEQ-LOAD permissive) and after heavy rain (review 2026-11-05-basic-design-7 #9, D-034; the same statement as P-08). The platform design spill is restated in D-034 (header flow until ESD closure); the sump size follows it in the layout (D-035). ASSUMED (D-018)."}
