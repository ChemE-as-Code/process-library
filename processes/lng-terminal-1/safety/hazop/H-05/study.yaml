  - {id: A16, status: proposed, by: agent, text: "Write the power-failure case: which loads are on UPS (ESD logic, ship-shore link XS-5100 / XS-6100, ERS hydraulic accumulators, PV-1110 solenoid, flare pilots ignition), and the resulting flare load (A4).", response: "Partly answered by commit 79d5c7ad (F-POWER, D-016, D-030 item 3): the control system, the ESD logic, the ship-shore link and the two solenoid channels of each ERS valve are on uninterruptible supplies (ASSUMED), the HPU keeps its accumulator charged, the couplers are energise-to-release, and a loss of the solenoid supply trips ESD-1. Still open: the UPS capacity and duration, the PV-1110 solenoid and the flare pilot ignition supplies, and the resulting flare load (A4). Commit 709fcf20 (F-POWER, D-032 item 2) puts the two ERS solenoid channels on two independent UPS A / UPS B on separate distribution (ASSUMED), each monitored (XA-n130A / B). Still open as before. Still proposed."}
