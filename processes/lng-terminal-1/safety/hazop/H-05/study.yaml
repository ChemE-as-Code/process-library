              incomplete purge: O2 ingress, H-03 S6); compressor seal gas lost (H-04 S18) where
              the site system that feeds N-8001 also feeds the seal gas (since f5d925f6 D-020 lists
              the seal gas as a site-system user, not on N-8001).
            refs: [N-8001, PI-8121]
            modes: [startup, loading]
            safeguards: [SG10]
            actions: [A13]
            status: proposed
            by: agent
            risk:
              initial:
