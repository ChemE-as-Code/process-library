# HAZOP study H-05: a DRAFT until the team has accepted every entry and a
# human review record covers it (cheme safety hazop check). Schema: cheme schema
# hazop-study; workflow: safety/README.md and the skill hazop-study.
# Drafted by an agent from the plant as drawn (P-08 rev A, C&E, loops, sequences,
# special items) and revised by an agent to the P&IDs, C&E and sequences of commit
# 589c9ca7 (DESIGN.md D-025), then to those of commit fac0bbb5 (DESIGN.md D-026: FL-7001 removed,
# HV-8108A/B, LIC-8101 start/stop by signal, I-803 low-low stop, the O2 limits of the carrier
# vapour), then to those of commit 54648679 (the response to review 2026-11-05-basic-design-3 in
# commit 886b0ad5: I-802 starts both KO drum pumps, non-latching, yielding to I-803; HV-8106A/B
# cryogenic ball valves with the cavity vented to the drum side; I-514/614 on O2 above 5 vol %;
# XV-4131/4132 fail closed; the core 1.7.0 regeneration in 54648679 changed the drawing only),
# then to those of commit f5d925f6 (DESIGN.md D-028, D-020: the instrument-air header low-low trip
# PZT-8123A/B/C with I-804, PI-8122 a low alarm, the pressure-equalising hole of CV-8102A/B,
# I-514 / I-614 2oo2 and mode-armed, the N2 users restated; and DESIGN.md D-018 / D-029: the
# impoundment basin T-8101 re-sited north of road R2 and the jetty sump T-8102 on its own deck,
# from the layout, which is not an analysed input of this study).
# Every entry is a proposal for the team: status proposed.
schema: cheme/hazop-study/v1
kind: hazop-study
id: H-05
title: Storage and loading flare, KO drum, sumps and utilities
scope: >-
  Detail-stage HAZOP of P-08: the storage and loading flare header FL-8001 (from PV-1110 and,
  since 589c9ca7, the SIS vent XV-1115, PSV-7111, the compressor depressurising vents
  FL-7003, the carrier de-inerting vapour BOG-4013 and the purge), the knock-out drum D-8101 with
  LIC-8101, since 589c9ca7 the independent high-high LZT-8105 (I-802), and pumps P-8101A/B (suction
  isolation HV-8106A/B, minimum flow LNG-8005 / FO-8107, thermal relief PSV-8109) to the site
  liquid burner, the stack FL-8101 with pilots (FG-8002, PCV-8132, TI-8131)
  and purge (FG-8001, FO-8111, FI-8111), the spill impoundment sumps T-8101 (with TSL-8102,
  LI-8103, P-8102) and T-8102 (TSL-8104), and the terminal N2 (N-8001, N-8002, PI-8121) and
  instrument-air (IA-8001, PI-8122) headers. Not covered: the flare derrick steel, the other
  three flares on it and the liquid burner (site scope, D-001), and the N2, air and power
  generation beyond the battery limit; loss of these utilities is analysed as a cause.
modes:
  - {id: holding, title: Holding, description: "Routine flare load only: pilots, purge and seal gas (6.0 m3/min permit limit, S-02); tank pressure control normally on the compressors."}
  - {id: loading, title: Loading, description: "The largest flare cases: BOG compressor trip at loading (~54 t/h design case, D-017), carrier de-inerting and cooldown vapour."}
  - {id: cooldown, title: Cooldown, description: "Carrier cooldown and de-inerting vapour to the flare (D-017, S-02)."}
  - {id: startup, title: Start-up and shutdown, description: "Flare header purge and pilot light-off, KO drum pump-out, sump draining after rain."}
analysed:
  - {path: pid/P-08.xml, revision: 'sha256:b0b910e505e3121c7d41ebe12bb4639749507979ae9c556319f6240ead74c7da', relation: analyses}
  - {path: control/cause-effect.yaml, revision: 'sha256:352e48f9b45bd8e3a8b29589857dcb69796444e0a63912affcaa49d4b5a979dc', relation: analyses}
  - {path: control/loops.yaml, revision: 'sha256:a7417294d1288704b77fac600cc7963a95b21a3dcaa295aef23e52e0cf9a7b30', relation: analyses}
  - {path: control/sequences.yaml, revision: 'sha256:0d332d0f14317556593aeaf2dead9813e491e00c31709646db8c9f7bbede1290', relation: analyses}
  - {path: piping/special-items.yaml, revision: 'sha256:c784631008c61f95e990795ccb28a49e5a3f66dc880e00036aca140ebc9a4e0e', relation: analyses}
risk_matrix: safety/risk-matrix.yaml
assessment_basis: >-
  Each scenario is rated per category before its safeguards (initial): severity is the credible
  worst outcome if every safeguard fails, likelihood that of the cause. The codes are agent
  proposals with their basis, for the team to accept or change. Residual ratings are proposed
  (by the agent, status proposed) only for the scenarios whose safeguards changed in commit
  589c9ca7 and where a new layer independent of the cause now exists as drawn: the severity is
  kept, the likelihood is lowered by one code per independent layer named in the basis, and
  nothing is credited whose capacity or integrity the files leave open. Crediting safeguards
  remains the team's judgement (and a LOPA's where needed). The matrix is the example matrix of
  cheme init (example: true), so the bands are illustrative. In the revision for commit fac0bbb5
  (D-026) the new scenario S20 is rated before safeguards only, and S2 gets a residual for the
  new low-low stop I-803, independent of LIC-8101. In the revision for commit 54648679
  (886b0ad5) the new scenario S21 is rated before safeguards only, S18 gets a residual for the
  new O2 rejection I-514 / I-614 and S20 one for the HV-8106A/B cavity vent, both independent of
  their causes. In the revision for commit f5d925f6 (D-028, D-029) the new scenarios S22 to S26
  are rated before safeguards only; the existing ratings keep their codes (the residual bases of
  S18 and S20 are corrected for the mode condition of I-514 and the equalising hole of CV-8102A/B).
team: []            # to be named by the project; no team has sat on this draft yet
notes: >-
  Drafted by an agent (skills hazop-study, hazop-equipment-causes, relief-scenarios,
  safeguard-crediting). The flare load figures are the concept values of D-017 and the equipment
  list (ASSUMED); the fire and gas system and the foam system are not drawn at this revision.
nodes:
  - id: N1
    title: Flare header FL-8001, KO drum D-8101, KO pumps and stack FL-8101
    design_intent: >-
      Take the tank pressure control vent PV-1110 (design case the BOG compressor trip at loading,
      ~54 t/h), the relief of PSV-7111 and the D-7101 drain DR-7001 through FL-8001
      (DN 900) into D-8101 (3.5 barg, -170 degC); knock out liquid and pump it by P-8101A/B (30 m3/h,
      LIC-8101, high-high alarm) through LNG-8001 to the site liquid burner; burn the gas at
      FL-8101 on the 122 m derrick with a continuous fuel-gas purge (FO-8111, FI-8111) and pilots
      (FG-8002, PCV-8132, TI-8131) (D-017, S-02). Since 589c9ca7 (D-025 item 6): FL-8001 also
      takes XV-1115 (I-203 / I-303), the compressor vents FL-7003 and the carrier de-inerting and
      cool-down vapour BOG-4013 (I-511 / I-611); the independent LZT-8105 and I-802 start the
      standby pump and close LV-7102; the pumps have suction isolation HV-8106A/B, a continuous
      minimum flow LNG-8005 through FO-8107 and the thermal relief PSV-8109 (LNG-8006). Since
      fac0bbb5 (D-026 items 9, 11, 12): the D-7101 relief valve and its flare line are removed
      (D-7101 is open to the tanks and protected by the tank PSVs); each pump has a discharge
      isolation HV-8108A/B downstream of its check valve, PSV-8109 sits on the common discharge
      downstream of HV-8108A/B; LIC-8101 starts and stops the duty pump by signal lines through
      the motor control functions HS-8101A -> HS-8101B, and I-803 stops both pumps at low-low
      level on LZT-8105. Since 886b0ad5 (D-026 item 14): I-802 starts both pumps (whichever is
      not running starts), is non-latching (clears below high-high) and yields to I-803, which has
      priority over I-802 and LIC-8101; HV-8106A/B are cryogenic ball valves with the cavity
      vented to the drum side, so a pump blocked in between HV-8106x and HV-8108x relieves into
      D-8101, and the pump is drained to the drum before maintenance (P-08 note). Since f5d925f6
      (D-028 item 9; review 2026-11-05-basic-design-4 #5) the check valves CV-8102A/B (tagged on
      P-08) have a pressure-equalising hole in the disc, so the spool between a check valve and a
      closed HV-8108x relieves back through the pump and the HV-8106x cavity vent into D-8101
      (P-08 note, LNG-8001 / LNG-8004 notes).
