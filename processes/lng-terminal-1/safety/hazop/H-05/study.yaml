  - id: N2
    title: Spill impoundment sumps T-8101 (tank area) and T-8102 (jetty)
    design_intent: >-
      Collect LNG spills from the tank-area troughs and trestle drip trays in T-8101 (10 min of one
      loading line, D-018) and from the platform drip trays in T-8102; keep the sumps free of
      water by P-8102 (started on LI-8103, stopped by TSL-8102 on LNG in the sump, I-801) to the
      site oily water system; detect LNG with TSL-8102 / TSL-8104 and start the high-expansion
      foam (C&E I-801 notes, instrument list). T-8101: 1,000 m3 of release (6,000 m3/h for 10 min)
      against ~1,200 m3 of pit (ASSUMED, D-018). Since f5d925f6 (D-018, D-029 items 2, 3; layout,
      not an analysed input of this study): the basin T-8101 is re-sited north of road R2 in its
      own area A8, 117.9 m from the T-2101 shell, fed by a trough of ~240 m from PR1 under the PR6
      centreline, across the north apron east of the T-2101 crane pad and under R2 in a culvert
      (Z-KC-TROUGH-SUMP); the jetty sump T-8102 is off the loading platform on its own piled sump
      deck A9 between the bows of the two berthed carriers (24.0-34.8 m from their envelopes,
      39.5 m from the muster point), fed from the platform drip trays by a covered trough under
      the deck and along the sump deck catwalk; both are sited by a pool-fire radiation screening
      (8 kW/m2 at racks, tanks, arms, carriers and roads, 5 kW/m2 at the occupied building, the
      muster point and escape routes, ASSUMED; the CSA Z276 / NFPA 59A siting study replaces it).
      Since 79d5c7ad (D-018, D-031 items 1-6; layout, not an analysed input): the tank-area
      collection no longer runs under PR6, past the shell or under the riser tower: open troughs
      (0.6 x 1.2 m) under PR1, PR2's shore end, PR3's north-south leg and PR4 fall to the PR1 / PR2 /
      PR3 junction and on under PR3 and PR4, across R7 and R2 in culverts, west 39 m north of R2
      into the basin (~760 m of open trough); under PR5 / PR6 and their riser towers the riser
      drops drain into an enclosed, covered and sealed channel (0.6 x 1.3 m) vented at its south
      end into the open PR1 trough (sized ASSUMED for one loading line, ~1.0 m deep at 1 % fall);
      the trestle run over the water has no drip tray (a rupture there is a spill onto the sea, the
      marine transfer area case of the siting study), its shore end drains to the PR2 trough; the
      platform drip trays drain into enclosed collectors under the deck slab vented at the catwalk,
      then a 39 m open trough on the catwalk S-CW-A9 to T-8102, which is re-centred between the
      hulls at (1163.5, 812); the muster point, life-raft station and escape ladder are moved to
      the platform's north-west corner beside the trestle road; the sump limits carry a x 1.2
