risk_matrix: safety/risk-matrix.yaml
assessment_basis: >-
  Each scenario is rated per category before its safeguards (initial): severity is the credible
  worst outcome if every safeguard fails, likelihood that of the cause. The codes are agent
  proposals with their basis, for the team to accept or change. Residual ratings are proposed
  (by the agent, status proposed) only for the scenarios whose safeguards changed in commit
  589c9ca7 and where a new layer independent of the cause now exists as drawn: the severity is
  kept, the likelihood is lowered by one code per independent layer named in the basis, and
  nothing is credited whose capacity or integrity the files leave open. Crediting safeguards
  remains the team's judgement (and a LOPA's where needed). The matrix is the example matrix of
  cheme init (example: true), so the bands are illustrative. In the revision for commit fac0bbb5
  (D-026) the new scenario S20 is rated before safeguards only, and S2 gets a residual for the
  new low-low stop I-803, independent of LIC-8101. In the revision for commit 54648679
  (886b0ad5) the new scenario S21 is rated before safeguards only, S18 gets a residual for the
  new O2 rejection I-514 / I-614 and S20 one for the HV-8106A/B cavity vent, both independent of
  their causes. In the revision for commit f5d925f6 (D-028, D-029) the new scenarios S22 to S26
  are rated before safeguards only; the existing ratings keep their codes (the residual bases of
  S18 and S20 are corrected for the mode condition of I-514 and the equalising hole of CV-8102A/B).
  In the revision for commit 79d5c7ad (D-030, D-031) the new scenarios S27 (the enclosed spill
  channels and collectors) and S28 (the muster point beside the Berth 2 manifold) are rated before
  safeguards only; S23 is re-described for the ESD-1 that now answers the O2 high-high during a
  transfer and S26 for the re-routed trough, both keeping their codes; the S18 residual basis is
  corrected for the new arming of I-514; no other code changes. In the revision for commit
  709fcf20 (D-032, D-033) the new scenario S29 (an item drip tray without a drain overflowing) is
  rated before safeguards only; S28 is re-described for the cause the moved muster point and the
  two ways off leave and its likelihood re-rated (B to A); S27 is re-described for the jetty
  collectors that remain (the tank-area channels are removed) and keeps its codes; S18 (residual
  basis), S23, S26, S12, S13 and S17 are re-described in place with their codes kept. In the
  revision for commit aedd8dbd (D-034, D-035) the new scenarios S30 (the submersible P-8102 on the
  floor of an LNG basin) and S31 (people at the platform's south end against the occupancy rule
  during a transfer) are rated before safeguards only; S28 is re-described for the release-point
  fire that D-035.14 (b) screens and its likelihood re-rated (A to B); S5, S10 to S13, S18, S26,
  S27, S29 and S17 are re-described in place with their codes kept. In the revision for commit
  c257902c (D-036, D-037) the new scenarios S32 (the dry-sump pump P-8103 drawing LNG to the jetty
  drain past TSL-8104 / TSL-8118), S33 (P-8103 failing to keep the pocket empty, including the
  detectors' spurious lockout and the drain-back hole) and S34 (SEQ-LINE-EMPTY drawing the site
  N2) are rated before safeguards only; S13 is re-described for the cause the dry sump leaves (water
  on the floor unseen with the one level transmitter failed low) and its likelihood re-rated (B to
  A); S10, S11, S29 (TSL-3124 / TSL-7115), S30 (the LNG-rated P-8102), S28 and S31 (the layout of
  D-037) are re-described in place with their codes kept. In the revision for commit ae718797
  (D-038, D-039, D-040) the new scenarios S35 (the first LNG of a spill meeting the pocket water of
  T-8101 or T-8102, and the ice that sinks into the T-8102 pocket), S36 (rain on an LNG pool in
  T-8102, siting case SC-3, and rain water under the drain-down), S37 (P-8102 not keeping the
  T-8101 pocket empty: the VSD, the lockouts I-801 / I-810 acting spuriously, W-8002 and its
  drain-back hole), S38 (a small inflow below the TSL-8102 tip with TSL-8120 failed), S39 (the
  B-SUB intake gas trip I-811 failing on demand) and S40 (I-811 acting spuriously) are rated
  before safeguards only, in the new node N4 for the last two; S10 is re-described for the cause
  the dry pit leaves (water on the floor with P-8102 failed and LZT-8113 failed low or its hold not
  acted on) and its likelihood re-rated (B to A), as S13 was for c257902c; S13 is re-described for
  LZT-8119, which removes the common transmitter as its cause, and keeps its codes (already A);
  S11 (the 1oo2 I-801 with AT-8124 and the rate-of-rise inhibit I-810), S12 (no rain allowance),
  S30 (the converter-fed motor), S31 (the occupancy rule written into SEQ-LOAD S4) and S34 (no
  abort on low site N2, the regulators) are re-described in place with their codes kept. P-08's
  drawing-only change of D-038 (connectors on the sheet edge) touches no scenario.
team: []            # to be named by the project; no team has sat on this draft yet
