  - id: N3
    title: Terminal N2 and instrument-air headers
    design_intent: >-
      Supply N2 at 7 barg (N-8001 to Berth 2, N-8002 to Berth 1) for arm purge to below 1 % O2 and
      2 % hydrocarbons and the leak tests at 5 bar (liquid arms) and 2.5 bar (vapour arm);
      instrument air at 7 barg (IA-8001) to all pneumatic valves (D-020, S-01). Since f5d925f6
      (D-020, D-028 items 1, 12): N-8001 / N-8002 serve only the berth purge and leak test; the
      other N2 users (compressor seal gas and purge, tank inerting, trestle purge) are supplied
      from the site systems and not drawn at basic, and no vessel is blanketed; IA-8001 carries
      the low-low trip PZT-8123A/B/C (own tappings, 2oo3 at 4.5 barg against the ~3.5 barg at which
      the spring-return actuators start to stroke, both ASSUMED; C&E I-804), which stops the
      loading pumps, trips both carriers (XS-5100 / XS-6100) and the trains' rundown (XS-1100) and
      initiates ESD-1 of both berths and the rundown trip I-102 before the valves move; PI-8122 is
      an indication with a low alarm; the fail-closed liquid-path valves hold on non-return valves
      and local air accumulators and close at their set speed, the ERS valves are hydraulic.
