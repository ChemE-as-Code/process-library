                - {category: people, severity: "3", likelihood: B, status: proposed, by: agent, basis: "Flange leak from a commanded ESD closure surge at a berth or on the rundown (as H-01 S18, H-03 S2); matrix 3 = lost-time injury. B: once in the plant life.", evidence: [DESIGN.md D-023], band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: aa86891dd127d418, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '3', likelihood: B}}}
            notes: >-
