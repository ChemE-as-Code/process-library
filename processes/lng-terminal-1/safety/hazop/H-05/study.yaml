# O2 high-high an ESD-1 cause during a transfer, the manual push buttons and the platform fire and
# gas written into I-501 / I-601, ZSO-5122 / ZSO-6122 detecting an air loss at the platform end,
# the ERS solenoids on the UPS in F-POWER; and DESIGN.md D-018 / D-031 from the layout: the
