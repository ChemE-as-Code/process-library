  - {id: SG9, title: TSL-8104 jetty sump low temperature alarm, kind: alarm, refs: [TSL-8104], status: proposed, by: agent}
  - {id: SG10, title: PI-8121 N2 header pressure indication, kind: other, refs: [PI-8121], status: proposed, by: agent}
  - {id: SG11, title: PI-8122 instrument-air header pressure indication and low alarm, kind: alarm, refs: [PI-8122], status: proposed, by: agent, notes: "Low alarm since f5d925f6 (instrument list); the trip is PZT-8123A/B/C (SG18)."}
  - {id: SG12, title: "Interlock I-802: independent KO drum high-high LZT-8105 starts P-8101A/B (whichever is not running) and closes LV-7102", kind: interlock, interlock: I-802, refs: [LZT-8105, P-8101A, P-8101B, LV-7102], status: proposed, by: agent, notes: "Added in 589c9ca7 (D-025 item 6); since 886b0ad5 it starts both pumps, is non-latching (reset automatic) and yields to I-803 (D-026 item 14); SIL null."}
  - {id: SG13, title: "KO pump minimum flow LNG-8005 through FO-8107 back to D-8101", kind: mechanical, refs: [LNG-8005, FO-8107], status: proposed, by: agent, notes: "Added in 589c9ca7; continuous, sized with the pump vendor (TBD)."}
  - {id: SG14, title: "Thermal relief PSV-8109 of LNG-8001 / LNG-8004 back to D-8101 (LNG-8006)", kind: relief, refs: [PSV-8109, LNG-8006], status: proposed, by: agent, notes: "Added in 589c9ca7, 15.0 barg; since fac0bbb5 on the common discharge downstream of HV-8108A/B."}
  - {id: SG15, title: "Interlock I-803: KO drum low-low on LZT-8105 stops P-8101A/B", kind: interlock, interlock: I-803, refs: [LZT-8105, P-8101A, P-8101B], status: proposed, by: agent, notes: "Added in fac0bbb5 (D-026 item 11), independent of LIC-8101; latching false, reset automatic, SIL null; since 886b0ad5 priority over I-802 and LIC-8101."}
  - {id: SG16, title: "HV-8106A/B cryogenic ball valves with the cavity vented to the drum side, and the pressure-equalising hole of CV-8102A/B", kind: mechanical, refs: [HV-8106A, HV-8106B, D-8101, CV-8102A, CV-8102B], status: proposed, by: agent, notes: "Added in 886b0ad5 (D-026 item 14; P-08 note, line list LNG-8002 / LNG-8003): an isolated pump relieves its thermal expansion back into D-8101; the relief pressure of the seat is a vendor item. Since f5d925f6 (D-028 item 9) the check valve discs have an equalising hole, so the piece between CV-8102x and HV-8108x is covered too; the hole also passes reverse flow (S22)."}
  - {id: SG18, title: "Interlock I-804: instrument-air header low-low PZT-8123A/B/C (2oo3, 4.5 barg ASSUMED) initiates ESD-1 of both berths and the rundown trip I-102 before the fail-closed actuators stroke (~3.5 barg ASSUMED)", kind: interlock, interlock: I-804, refs: [PZT-8123A, PZT-8123B, PZT-8123C, XS-5100, XS-6100, XS-1100], status: proposed, by: agent, notes: "Added in f5d925f6 (D-028 item 1; P-08 note); latching, manual reset, SIL null; a transmitter fault alarms. Its failure on demand is S25, its spurious action S24."}
  - {id: SG19, title: "Non-return valves, local air accumulators and exhaust speed controllers of the fail-closed liquid-path valves (XV-5101 / XV-6101, XV-4101 / XV-4102, the arm isolations, XV-1102 / XV-1103, XV-1111..XV-1114)", kind: mechanical, refs: [UZ-5101, UZ-6101, UZ-4101, UZ-4102, UZ-1102, UZ-1103, UZ-1111, HS-5121], status: proposed, by: agent, notes: "Added in f5d925f6 (D-016, D-028 item 1; instrument list, P-01 / P-05 / P-06 notes): one closing stroke and a hold of at least 5 min after a loss of the header, closure no faster than the set speed (both ASSUMED); no proof test in the files (A20)."}
  - {id: SG17, title: "Interlocks I-514 / I-614: O2 above 5 vol % for 10 s on the berth analyser AI-5126 / AI-6126 or the tank-end AI-4133 / AI-4134 closes the vapour arm isolation XV-5122 / XV-6122 (and XV-5125 / XV-6125) and opens XV-4135 / XV-4136", kind: interlock, interlock: I-514, refs: [AI-5126, AI-6126, AI-4133, AI-4134, XV-5122, XV-6122, XV-4135, XV-4136], status: proposed, by: agent, notes: "Added in 886b0ad5 (D-026 item 7; review 2026-11-05-basic-design-2#11); latching, manual reset, SIL null; on the same single analyser as I-511 / I-611; its spurious action is a cause of H-03 S14. Since f5d925f6 2oo2 on two O2 cells and also closing XV-5125 / XV-6125; since 79d5c7ad (D-030 item 4) armed only with no liquid transfer at the berth (at 79d5c7ad the shore ESD valve not commanded open, or both loading line flows below 50 m3/h, ASSUMED); during a transfer the same O2 high-high trips ESD-1 (S23). Title and refs revised for 709fcf20 (D-032 items 1, 3, 4): the berth analyser (two cells, 2oo2) is the O2 input with the tank-end analyser as backup, so the trip no longer shares the analyser of I-511; armed with XV-5101 / XV-6101 proven closed by ZSC-n101 and not held open by UZ-n101; it also opens XV-4135 / XV-4136, so the slug goes to the tanks and I-513 / I-613 close the flare valve (H-02 S25)."}
  - {id: SG20, title: "Interlocks I-501 / I-601 on ZSO-5122 / ZSO-6122: the vapour arm isolation not proven open during a liquid transfer trips ESD-1, which detects an air loss at the platform end of the jetty air main", kind: interlock, interlock: I-501, refs: [ZSO-5122, ZSO-6122, XV-5122, XV-6122], status: proposed, by: agent, notes: "Added in 79d5c7ad (D-030 items 2, 8); XV-5122 / XV-6122 have no accumulator and move first; only during a liquid transfer; SIL null; voted platform-end transmitters remain hold H-04 (A20). Since 709fcf20 (D-032 items 1, 7) the transfer state is ZSC-n101 / UZ-n101, and a maintenance override of a failed ZSO-n122 may suspend it for one transfer (C&E bypass)."}
actions:
  - {id: A1, status: proposed, by: agent, text: "P&ID P-08 and C&E change: add an independent high-high level switch on D-8101 (separate from LIC-8101) with a defined action (start the spare pump, alarm, close LV-7102), and confirm the KO drum liquid hold-up for the largest credible liquid slug (H-01 S6, H-04 S9).", response: "Partly answered by commit 589c9ca7 (D-025 item 6; review #20): independent high-high LZT-8105 on its own nozzle; I-802 starts the standby pump P-8101B and closes LV-7102 (the D-7101 drain). Still open: the KO drum hold-up for the largest liquid slug; I-802's own consequence is S19. Commit 886b0ad5 (D-026 item 14) has I-802 start both pumps, non-latching and yielding to I-803; the hold-up is still not confirmed, and the parallel running is S21 (A19). Still proposed."}
  - {id: A2, status: proposed, by: agent, text: "P&ID P-08 change: add a low-level pump trip on D-8101 independent of LIC-8101 and a minimum-flow return for P-8101A/B to D-8101; state the response when the site liquid burner is unavailable.", response: "Partly answered by commit 589c9ca7 (D-025 item 6): a continuous minimum flow LNG-8005 through FO-8107 to D-8101 for either pump, and suction isolation HV-8106A/B. Still open: a low-level pump trip independent of LIC-8101 and the response when the site liquid burner is unavailable. Commit fac0bbb5 (DESIGN.md D-026 items 9, 11) adds the low-level trip: I-803 on LZT-8105 (own nozzle, independent of LIC-8101) stops P-8101A/B at low-low level, LIC-8101 drives the pumps by signal lines through HS-8101A / HS-8101B, and HV-8108A/B isolate the discharges. Still open: the response when the site liquid burner is unavailable; the discharge isolations create S20 (A18). Still proposed."}
  - {id: A3, status: proposed, by: agent, text: "P&ID P-08 change: thermal relief on LNG-8001 / LNG-8004 between the pump check valves and the battery limit (or show the battery-limit arrangement that relieves it), listed in piping/special-items.yaml.", response: "Answered in the design by commit 589c9ca7 (D-025 item 6): PSV-8109 on LNG-8001 / LNG-8004 downstream of CV-8102A/B, back to D-8101 through LNG-8006 (own nozzle N8), 15.0 barg, in piping/special-items.yaml. For the team to verify and close; S4 re-rated."}
  - {id: A4, status: proposed, by: agent, text: "Flare study: cumulative relief load of the common-cause cases (power failure and instrument-air failure at loading) on FL-8001 / D-8101 / FL-8101, the back-pressure at PV-1110 and the PSVs, and the radiation at the fence (S-10); see H-04 A3."}
  - {id: A5, status: proposed, by: agent, text: "P&ID P-08 and C&E change: add a low purge-flow alarm on FI-8111, a back-up purge (N2) on loss of fuel gas, an O2 analyser on FL-8001 / D-8101, and show the molecular or velocity seal at the tip; confirm the purge rate against header contraction after a cold release."}
  - {id: A6, status: proposed, by: agent, text: "Show the pilot ignition system and its re-ignition on pilot failure (TI-8131) on P-08, and define the response to an unlit flare during loading."}
  - {id: A7, status: proposed, by: agent, text: "Line list change: give FL-8001, FL-8002 (and FL-7002, FL-7003..FL-7005; the D-7101 relief line of the revision analysed was removed in fac0bbb5) a low-temperature material and minimum design temperature for the coldest relief (cold BOG, LNG carry-over), or show where the gas is warmed."}
  - {id: A8, status: proposed, by: agent, text: "P&ID P-05 / P-06 / P-08 change: draw the carrier de-inerting and cooldown route to the storage and loading flare (D-017, S-02) separate from the tank vapour header, with its valves and the switch-over criterion (hydrocarbon content).", response: "Answered in the design by commit 589c9ca7 (D-025 items 3, 6; review #19): BOG-4013 from vapour return A (XV-4131) joined by BOG-4014 from return B (XV-4132) to D-8101, switched at the tank end by AI-4133 / AI-4134 (N2 / O2 / CH4) and I-511 / I-611, make-before-break with XV-4135 / XV-4136; drawn on P-04 and P-08. For the team to verify and close; the switch's failures are H-02 S15 to S18, the O2 it sends to the flare is S18 here."}
  - {id: A9, status: proposed, by: agent, text: "Confirm the dry-sump philosophy of T-8101: a high level alarm on LI-8103, the P-8102 capacity against the design rain, and the start of the high-expansion foam on TSL-8102 shown on P-08 (the foam system is in the I-801 notes only).", response: "Not answered at 709fcf20: D-033 items 3 and 10 deepen the basin to 10.5 m and leave the type and head of P-8102 for the deeper pit with the design owner; high-expansion foam at the junction, the culverts and the basin inlet is ASSUMED until the fire protection design; nothing is added to P-08. Still proposed."}
  - {id: A10, status: proposed, by: agent, text: "Determine the required integrity of I-801 (single TSL-8102) and consider a second, independent low-temperature switch or a discharge isolation valve on W-8002 that closes on LNG in the sump."}
  - {id: A11, status: proposed, by: agent, text: "C&E change: add tank-area and trestle fire and gas / low-temperature spill detection as a cause of ESD-1 (I-501 / I-601) and of I-101, and confirm the T-8101 design spill against the ESD response time.", response: "Not answered at 79d5c7ad: D-030 item 7 writes the manual push buttons and the confirmed platform fire and gas into the I-501 / I-601 logic; there is still no tank-area or trestle fire and gas or spill detection and no cause of ESD-1 or I-101 from it, now also none along the ~760 m of open trough and in the enclosed channels (S26, S27). Not answered at 709fcf20: the cause tags HS-n100 and XS-n108 are written (D-032 item 7); D-033 item 2 (d) gives the B-SUB intake gas detection with a damper trip (HVAC engineer, ASSUMED), not an ESD-1 cause; there is still no tank-area, trestle, trough or collector detection acting on ESD-1 or I-101 (S26, S27, S29). Still proposed."}
  - {id: A12, status: proposed, by: agent, text: "P&ID P-08 change: give T-8102 a level measurement and a water removal (pump or drain with LNG interlock as I-801), and show its foam system.", response: "Not answered at 79d5c7ad: D-031 item 6 names it open with the design owner (P-08 and this action): a level transmitter with a high alarm and a fixed water removal interlocked off on low temperature for T-8102, or a covered sump; until then the T-8102 notes give a rain margin of ~170 m3 against ~33 m3 for an arm or flange failure until ESD closure (ASSUMED); the catwalk S-CW-A9 now carries TSL-8104's cable and a walkway for access. Not answered at 709fcf20: D-033 items 10, 11 (g) make T-8102 6 m across and 9.5 m deep (~159 m3 below the inlet) and require it to be kept pumped down so LNG never meets standing water, with its level measurement and fixed water removal with a low-temperature trip open with the design owner (P-08, this action); the foam is still not shown. Still proposed."}
  - {id: A13, status: proposed, by: agent, text: "Add a low-pressure alarm on PI-8121 and make 'N2 header healthy' a permissive of SEQ-LOAD S1 / S2; consider a back-up N2 supply for purge and seal gas."}
  - {id: A14, status: proposed, by: agent, text: "P&ID P-05 / P-06 / P-08 change: show the N2 connection for the vapour arm leak test and purge with a pressure regulator and a relief valve set below the 3.5 barg design of LA-5102 / LA-6102.", response: "Not answered at 709fcf20: SEQ-LOAD S1 now states the test boundary (XV-n122 closed, the carrier's manifold valve closed, the ERS valves open) and vents the test N2 into the carrier's manifold (D-032 item 7, #6); the N2 connection to the vapour arm, its regulator and its relief are still not drawn (S15). Still proposed."}
  - {id: A15, status: proposed, by: agent, text: "Record the fail position of every ESD and switching valve (XV) in the instrument list or the C&E, add a low instrument-air pressure alarm and action (ESD-1 at a set pressure) on PI-8122, and size air receivers for the ESD valves and PV-1110 (see H-04 A2).", response: "Partly answered by commit 589c9ca7: the fail positions of the valves it added are in the instrument list (XV-1115, XV-5161 / XV-6161, XV-7123A..C, XV-7130 closed; XV-7125A..C, XV-4135 / XV-4136 open), control/philosophy.md F-AIR states the ESD, ERS and fill valves close, and XV-1115 has its own air accumulator. Still open: the fail position of every other XV (e.g. XV-7121A..C, XV-4131 / XV-4132), the low instrument-air alarm and action on PI-8122, and the air receivers. Since fac0bbb5 / 886b0ad5 XV-7121A..C are given fail closed (D-026 item 5) and XV-4131 / XV-4132 fail closed (D-026 item 1, P-04, instrument list). Still open: the low instrument-air alarm and action on PI-8122 and the air receivers. Mostly answered by commit f5d925f6 (D-016, D-028 item 1): PI-8122 has a low alarm, and the low-low trip PZT-8123A/B/C (own tappings, 2oo3, 4.5 barg ASSUMED, C&E I-804) initiates ESD-1 of both berths and the rundown trip before the valves move; the fail-closed liquid-path valves have local air accumulators with non-return valves (one stroke, at least 5 min hold, ASSUMED) and speed controllers; the ERS valves are hydraulic; XV-2123 / XV-3123 are given fail closed. Still open: the accumulator and hold-time sizing (detail engineering, D-028), an air receiver or assured action for PV-1110 (H-04 A2), and the proof test of the trip and the accumulators (A20). Still proposed."}
  - {id: A17, status: proposed, by: agent, text: "Agree with the carrier operators the maximum O2 content of the de-inerting and gassing-up vapour, and confirm that the flare system may receive it (O2 limit, purge rate, the O2 analyser on FL-8001 / D-8101 of A5); otherwise state where vapour above that O2 content goes.", response: "Partly answered by commit fac0bbb5 (DESIGN.md D-026 item 7): vapour goes to the flare only below 5 vol % O2 (inert gas quality, ASSUMED) and to the tanks only below 1 vol % O2 and on hydrocarbon specification (S-01 purge limit); above 5 % the berth does not take the vapour and the carrier vents on board under the terminal rules; AI-4133 / AI-4134 measure CH4, N2 and O2. Still open: agreement of the limit with the carrier operators, confirmation that the flare system may receive vapour at up to 5 vol % O2 with its purge, and the O2 analyser on FL-8001 / D-8101 (A5). Commit 886b0ad5 implements the rejection above 5 vol %: I-514 / I-614 close XV-5122 / XV-6122 (S18 residual). The other open items are unchanged. Still proposed."}
  - {id: A18, status: proposed, by: agent, text: "P&ID P-08 / special items: give each KO pump section between HV-8106x and HV-8108x (including the piece between CV-8102x and HV-8108x) a thermal relief to D-8101, or a casing vent and drain with a written isolation procedure that drains the pump to D-8101 before both isolations are closed; list the device in piping/special-items.yaml (S20).", response: "Partly answered by commit 886b0ad5 (D-026 item 14; review 2026-11-05-basic-design-3#3): HV-8106A/B are cryogenic ball valves with the cavity vented to the drum side, so a pump blocked in between HV-8106x and HV-8108x relieves into D-8101, and the P-08 note and the equipment list say to drain the pump to the drum before maintenance. Still open: the piece between CV-8102x and a closed HV-8108x (the check valve separates it from the pump and the vent), the seat relief pressure from the valve vendor, and a written isolation procedure. Commit f5d925f6 (D-028 item 9; review 2026-11-05-basic-design-4 #5) gives CV-8102A/B a disc with a pressure-equalising hole, tagged on P-08, so that piece relieves back through the pump and the HV-8106x cavity vent into D-8101 (P-08 note, LNG-8001 / LNG-8004 notes). Still open: the seat relief pressure and the hole size from the vendors, and the written isolation procedure; the hole's reverse flow is S22 (A21). Still proposed."}
  - {id: A19, status: proposed, by: agent, text: "Confirm with the site the capacity of the liquid burner and of LNG-8001 for both KO pumps in parallel (I-802 starts the pump that is not running, S21), and the burner's interface trip; otherwise have I-802 start the standby only when the duty pump is not running (run feedback), and size FO-8107 for two pumps or give each pump its own minimum flow."}
  - {id: A20, status: proposed, by: agent, text: "Air header trip I-804 and the valve accumulators: agree with the site air system the 4.5 barg trip point (ASSUMED) against the header's normal transients and the ~3.5 barg stroke pressure, and whether a short confirmation delay fits that margin (S24); decide the second set of air-header transmitters at the platform end of the jetty air main and the air distribution (D-020, D-028) so that a break of the air main far from IA-8001 trips ESD-1 before the berth valves move (S25); size the accumulators and hold times; put I-804 (transmitters, voting, outputs) and every non-return valve, accumulator and speed controller of the fail-closed liquid-path valves in the proof test; write the reset and restart after an I-804 trip (F-AIR: reset I-804, then the berths by SEQ-LOAD and the compressors by SEQ-BOG-START) (S16, S24, S25).", response: "Partly answered by commit 79d5c7ad (D-030 items 2, 13): at basic an air loss at the platform end is detected during a transfer by ZSO-5122 / ZSO-6122 on the accumulator-less vapour arm isolations (SG20); the voted platform-end transmitters and the jetty air distribution are hold H-04, the accumulator and hold-time sizing hold H-03, the voting of PZT-8123A/B/C and of the position switches the SIL screening (hold H-06). Still open: the trip point against the header transients and a confirmation delay, the proof test, and the written reset and restart. Still proposed."}
  - {id: A21, status: proposed, by: agent, text: "Confirm with the check valve and pump vendors the size of the pressure-equalising hole of CV-8102A/B against the reverse flow through a stopped standby pump (reverse rotation limit, start against reverse rotation), and state in the operating instructions whether the standby is kept with HV-8108x open or closed (S22)."}
  - {id: A22, status: proposed, by: agent, text: "Layout and spill design: state the cover, slope and capacity of the ~240 m tank-area trough to T-8101 and the ventilation of its culvert under road R2 (Z-KC-TROUGH-SUMP), consider gas or low-temperature detection along the trough and at the culvert with the closure of road R2 on a spill, and include the trough route in the vapour dispersion of the CSA Z276 / NFPA 59A siting study (D-018 says dispersion is not calculated); consider adding the layout files to the analysed inputs of this study (S26).", response: "Partly answered by commit 79d5c7ad (D-018, D-031 item 1; layout): the collector is re-routed away from the shells and the riser towers in open 0.6 x 1.2 m troughs under PR1, PR2, PR3 and PR4 (~760 m), across R7 and R2 in culverts, with an enclosed channel under PR5 / PR6 and the riser towers vented into the PR1 trough, sized for one loading line (ASSUMED), and screened as a line-source trough fire with its residuals stated (roads beside the troughs above 8 kW/m2, a third A2 way out). Still open: the culvert ventilation, the vapour formed along the troughs and in the channel and its vent (the civil / process detail's, D-031), gas or low-temperature detection along the route, a road closure on a spill, and the vapour dispersion in the siting study; the layout is still not an analysed input. Partly answered further by commit 709fcf20 (D-018, D-033 items 1-3, 7, 11; layout): the enclosed channels and PR2's trough are removed; ~510 m of open trough, 0.6 m, lined with cellular glass (about 25 times less vapour than bare concrete, ASSUMED), at 0.5 % fall on a recorded profile from the PR6 joint into the basin at (990, 3237.5), 10.5 m deep, so the design spill does not back up; every trough leg is a zone 2 release source; vehicle entry at the R7 and R2 culverts under the site's control (gas test or permit, ASSUMED, an operating measure); gas detection with a damper trip at the B-SUB intake LV1 (ASSUMED); fire approaches on R1, R11, R8, R2, R4. Still open: the culvert ventilation, gas or low-temperature detection along the troughs, a road closure on a spill, the B-SUB vapour distance and the dispersion in the siting study, the civil quantities; the layout is still not an analysed input. Still proposed."}
  - {id: A23, status: proposed, by: agent, text: "Alarm and operating instruction for the O2 high-high of AI-4133 / AI-4134 during the transfer (SEQ-LOAD S4 on, where I-514 / I-614 are not armed): set point, priority and the operator's response time to ESD-1, and whether I-511 / I-611 should keep vapour above 5 vol % O2 out of the flare in that mode (S23).", response: "Answered in the design by commit 79d5c7ad (D-030 item 4; review 2026-11-05-basic-design-5 #4): during any liquid transfer, the S3 cooldown included, the 2oo2 O2 high-high of AI-4133 / AI-4134 for 10 s trips ESD-1 (I-501 / I-601), so the response no longer rests on the operator; I-511 does not act while ESD-1 is tripped and I-513 closes the flare valve once the tank-side valve is proven open. For the team to verify and close; the vapour of the 10 s delay still reaches the flare, and the line pack the tanks (H-02 S23, A19). Commit 709fcf20 (D-032 item 3) moves the O2 trips to the berth analysers AI-5126 / AI-6126, so the trip acts before the vapour enters the return and the slug goes to the tanks, not the flare (S18, S23); the flare sees vapour above 5 vol % only with the berth analyser failed low (H-03 S37). For the team to verify and close. Still proposed."}
  - {id: A24, status: proposed, by: agent, text: "Civil / process detail: size the vents of the enclosed channel under PR5 / PR6 and the riser towers and of the enclosed collectors under the jetty deck for the vapour formed by a spill on the warm channel in the first minutes, keep the vent outlets out of the racks, riser towers and platform working areas, decide whether the channel is designed for a confined deflagration, inerted or given gas and low-temperature detection with an ESD action, and include the channels in the siting study (S27).", response: "Partly answered by commit 709fcf20 (D-018, D-033 items 1, 4, 11 (f); layout): the enclosed channels under PR5 / PR6 and the riser towers are removed; the jetty collectors are lined with cellular glass and sized for the vapour formed (~10 Pa over the longest path, ASSUMED), with no seals and no vent other than the sump wall, and the collector vapour flame is screened at the sump and at the worst dry outlet. Still open: a design for a confined deflagration inside the collectors, inerting or gas and low-temperature detection with an ESD action, and the collectors in the siting study. Still proposed."}
  - {id: A25, status: proposed, by: agent, text: "Screen the muster point Z-ESC-A4N, the start of the trestle road R5 and the boat route Z-ESC-A4-SEA against a jet or pool fire and a vapour cloud at the Berth 2 manifold and arms (11.5 m from the muster point), and state an alternative muster point or refuge for a Berth 2 manifold event with the wind toward the north-west; confirm the boat's approach with the marine engineer and the TERMPOL review (S28).", response: "Mostly answered by commit 709fcf20 (D-033 item 5; layout): Z-ESC-A4N is removed; the muster point, life-raft station and boat landing are on the B-JET deck A7 (Z-ESC-A4-MUSTER), 214 m from the nearest tray bay and ~300 m from T-8102; two ways off from opposite corners of the platform's north edge (W1 the trestle road R5, W2 a walkway east of PR2) are screened so that one stays at 4.9 kW/m2 or less for each of the 27 bay fires and the muster point at 0.21 kW/m2 (1.27 with every Berth 1 bay burning); the boat leaves west, 71 m north of the Berth 2 hull envelope (all ASSUMED). Still open: the jet fire and vapour cloud screening of the ways off (S28, the siting study), the W2 walkway, the A7 landing and the mooring lines (marine engineer), and the TERMPOL review of the boat's approach. Still proposed."}
  - {id: A26, status: proposed, by: agent, text: "Design owner / layout: give the item drip trays without a drain (XV-3123, TV-7103, PSV-1122, PSV-1123, PSV-4111, PSV-4113) low-temperature detection with an alarm and a written response (close XV-4105 and stop the circulation pump for XV-3123, isolate TV-7103), state how they are kept free of rain and ice, and confirm their hold-up against the largest credible leak at the item until it is isolated; otherwise give them a drain to the trough (S29)."}
