                - {category: people, severity: "4", likelihood: A, status: proposed, by: agent, basis: "Deflagration inside the occupied refuge; matrix 4 = permanent injury or fatality. A: a tank-area release reaching the B-SUB intake (once in the plant life at most) together with the 2oo3 trip or a damper failing on demand, not expected in the plant life.", evidence: [control/cause-effect.yaml, control/instrument-list.yaml, DESIGN.md D-039], band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: ddcedc61b5d20d1a, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '4', likelihood: A}}}
                - {category: asset, severity: "4", likelihood: A, status: proposed, by: agent, basis: "Loss of the substation and the control room; matrix 4 = loss of the unit.", evidence: [control/cause-effect.yaml, DESIGN.md D-039], band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: eca0767de9ee2296, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '4', likelihood: A}}}
            notes: >-
