nodes:
  - id: N1
    title: Flare header FL-8001, KO drum D-8101, KO pumps and stack FL-8101
    design_intent: >-
      Take the tank pressure control vent PV-1110 (design case the BOG compressor trip at loading,
      ~54 t/h), the relief of PSV-7111 and the D-7101 drain DR-7001 through FL-8001
      (DN 900) into D-8101 (3.5 barg, -170 degC); knock out liquid and pump it by P-8101A/B (30 m3/h,
      LIC-8101, high-high alarm) through LNG-8001 to the site liquid burner; burn the gas at
      FL-8101 on the 122 m derrick with a continuous fuel-gas purge (FO-8111, FI-8111) and pilots
      (FG-8002, PCV-8132, TI-8131) (D-017, S-02). Since 589c9ca7 (D-025 item 6): FL-8001 also
      takes XV-1115 (I-203 / I-303), the compressor vents FL-7003 and the carrier de-inerting and
      cool-down vapour BOG-4013 (I-511 / I-611); the independent LZT-8105 and I-802 start the
      standby pump and close LV-7102; the pumps have suction isolation HV-8106A/B, a continuous
      minimum flow LNG-8005 through FO-8107 and the thermal relief PSV-8109 (LNG-8006). Since
      fac0bbb5 (D-026 items 9, 11, 12): the D-7101 relief valve and its flare line are removed
      (D-7101 is open to the tanks and protected by the tank PSVs); each pump has a discharge
      isolation HV-8108A/B downstream of its check valve, PSV-8109 sits on the common discharge
      downstream of HV-8108A/B; LIC-8101 starts and stops the duty pump by signal lines through
      the motor control functions HS-8101A -> HS-8101B, and I-803 stops both pumps at low-low
      level on LZT-8105. Since 886b0ad5 (D-026 item 14): I-802 starts both pumps (whichever is
      not running starts), is non-latching (clears below high-high) and yields to I-803, which has
      priority over I-802 and LIC-8101; HV-8106A/B are cryogenic ball valves with the cavity
      vented to the drum side, so a pump blocked in between HV-8106x and HV-8108x relieves into
      D-8101, and the pump is drained to the drum before maintenance (P-08 note). Since f5d925f6
      (D-028 item 9; review 2026-11-05-basic-design-4 #5) the check valves CV-8102A/B (tagged on
      P-08) have a pressure-equalising hole in the disc, so the spool between a check valve and a
      closed HV-8108x relieves back through the pump and the HV-8106x cavity vent into D-8101
      (P-08 note, LNG-8001 / LNG-8004 notes). Since aedd8dbd (D-034 items 1, 4): the balance's
      loading envelope is 56.5 t/h at the compressor suction (S14 / S9) with a carrier return
      envelope of 52.5 t/h (was 49.1 / 45.6), above the ~54 t/h flare design case of D-017 (the arms
      limit a line-up's return to ~38 t/h at most, D-034.1; the compressor rating is left to the
      carrier data); the tank PSV relief cases name the 52.5 t/h; after an O2 reject the return is
      held on the tanks for 30 min after the reset, so the trapped slug does not reach BOG-4013.
    members: [CV-8102A, CV-8102B,FL-8001, PI-8112, D-8101, LIC-8101, P-8101A, P-8101B, LNG-8002, LNG-8003, LNG-8001, LNG-8004, FL-8002, FL-8101, FI-8133, FG-8001, FO-8111, FI-8111, FG-8002, PCV-8132, TI-8131, DR-7001, FL-7002, LZT-8105, HV-8106A, HV-8106B, LNG-8005, FO-8107, LNG-8006, PSV-8109, BOG-4013, FL-7003, HV-8108A, HV-8108B, HS-8101A, HS-8101B]
    status: proposed
    by: agent
