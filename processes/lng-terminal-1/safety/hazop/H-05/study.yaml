safeguards:
  - {id: SG1, title: "LIC-8101 KO drum level with high-high alarm, starting and stopping P-8101A/B", kind: control, refs: [LIC-8101, P-8101A, P-8101B], status: proposed, by: agent}
  - {id: SG2, title: Installed spare KO pump P-8101B, kind: other, refs: [P-8101B], status: proposed, by: agent}
  - {id: SG3, title: Tank relief valves PSV-2131A/B and PSV-3131A/B to atmosphere, kind: relief, refs: [PSV-2131A, PSV-2131B, PSV-3131A, PSV-3131B], status: proposed, by: agent}
  - {id: SG4, title: "FI-8111 purge gas flow indication with the orifice FO-8111", kind: other, refs: [FI-8111, FO-8111], status: proposed, by: agent, notes: "No low-flow alarm is stated in the files."}
  - {id: SG5, title: "TI-8131 pilot flame temperature, pilot failure alarm", kind: alarm, refs: [TI-8131], status: proposed, by: agent}
  - {id: SG6, title: "LI-8103 sump level starting P-8102 (keeps T-8101 free of water)", kind: control, refs: [LI-8103, P-8102], status: proposed, by: agent, notes: "Since aedd8dbd (D-034 item 8) LI-8103 is a radar through the pit cover and starts and stops the submersible P-8102 on the pit floor; the pump's head for the 19.5 m pit is open with the design owner (S10). Since c257902c (D-036 item 3) P-8102 is re-rated for the 19.5 m pit (50 m3/h at ~44 m). Since ae718797 (D-039 item 1, D-039.9 (c), (j); loop LC-8103, HS-8103): P-8102 stands in a floor pocket, started at 0.90 m and stopped at 0.60 m above its floor through HS-8103, its speed on a VSD following the level (minimum ~85 %, ASSUMED), 50 m3/h at 45 m; CV-8114's drain-back hole empties the riser into the pocket when it stops; not a safety function (the safeguards against water on the floor are SG24); its failure is S37."}
  - {id: SG7, title: "Interlock I-801: TSL-8102 low temperature stops P-8102 (since c257902c by opening its motor feeder through the SIS; since ae718797 on any of TSL-8102, TSL-8120 and AT-8124)", kind: interlock, interlock: I-801, refs: [TSL-8102, P-8102, TSL-8120, AT-8124], status: proposed, by: agent, notes: "Since ae718797 (D-039 item 1 (c), D-039.9 (f); C&E I-801): TSL-8102's tip 1.0 m above the pocket floor (in air in normal service), TSL-8120 a fast-response probe in W-8002 upstream of CV-8114, both -60 degC on their own SIS inputs, and the rim gas detection AT-8124 (F&G voted), any one tripping; the fire and gas system starts the T-8101 foam on the same three; reset by hand once all three read normal and the pit is confirmed free of LNG; a small inflow below the TSL-8102 tip is seen by TSL-8120 alone (S38); its spurious action locks the pump out (S37). Earlier:Since aedd8dbd (D-034 item 8) TSL-8102 hangs from the pit cover to the floor beside P-8102; latching, manual reset, SIL null. Since c257902c (D-036 item 3) the feeder breaker is opened through the SIS (not a control stop through the MCC), TSL-8102's tip is at the pit floor below the pump intake, and CV-8114 / HV-8115 on the riser keep the oily water system from flowing back; still one sensor (A10)."}
  - {id: SG8, title: "ESD-1 of the berths (I-501 / I-601) stops the loading pumps", kind: interlock, interlock: I-501, refs: [XS-5100], status: proposed, by: agent, notes: "Initiated by the platform fire and gas, not by a spill in the tank area or on the trestle (I-501 notes). Since 79d5c7ad (D-030 items 4, 7) the manual push buttons (control room, jetty, platform) and the confirmed platform fire and gas are written causes in the I-501 / I-601 logic, and during a liquid transfer also the 2oo2 O2 high-high of AI-4133 / AI-4134; still no tank-area or trestle detection (A11). Since 709fcf20 (D-032 items 1, 3, 7) they are the tags HS-5100 / HS-6100 and XS-5108 / XS-6108, the O2 high-high is that of the berth analyser AI-5126 / AI-6126 or of AI-4133 / AI-4134, and the transfer state is ZSC-n101 / UZ-n101. Since aedd8dbd (D-034 item 9) the manual causes are one tag per station, HS-5100A / B / C and HS-6100A / B / C; still no tank-area detection, and no automatic stop of the loading pumps on a tank-area release (D-034.3, A11). Since c257902c (D-036 item 11 (e)) the jetty sump high-high I-805 is a transfer cause (SG22), and the close outputs on XV-4101 / XV-4102 / XV-4107 may be overridden after a trip for SEQ-LINE-EMPTY only (H-02 N5)."}
  - {id: SG9, title: TSL-8104 jetty sump low temperature alarm, kind: alarm, refs: [TSL-8104], status: proposed, by: agent, notes: "Since aedd8dbd (D-034 item 9 (d)) it also confirms no LNG before the portable rain pump is used in T-8102; it sees the sump only, not the header bay or the bays (H-02 S29). Since c257902c (D-037.16, .17) it hangs in the floor pocket beside the P-8103 bowl, its tip 0.40 m above the pocket floor, trips at -60 degC, starts the high-expansion foam and is one of the two inputs of the P-8103 lockout I-808 (SG23)."}
  - {id: SG21, title: "Dry-sump pump P-8103 on LZT-8106: started at 0.35 m (I-806, only with TSL-8104 / TSL-8118 normal and I-808 reset), stopped at 0.10 m (I-807), speed following the level (VSD), 20 m3/h to the jetty drain through W-8003", kind: control, refs: [P-8103, LZT-8106, W-8003, CV-8116, HV-8117], status: proposed, by: agent, notes: "Added in c257902c (D-037.15 (a), .16, .17; P-08, C&E I-806 / I-807, equipment list); keeps the T-8102 floor dry against ~10.5 m3/h of the ASSUMED design rain; not a safety function by its notes; its failure is S33, its drawing LNG S32."}
  - {id: SG22, title: "T-8102 level high at the pocket rim (0.50 m): a transfer hold (no start in SEQ-LOAD S0, a pause in S4 with no one sent to A9); high-high at 0.60 m (I-805): blocks the start of SEQ-LOAD and during a transfer trips ESD-1 of the transferring berth; on LZT-8106 until c257902c, on the independent LZT-8119 since ae718797", kind: interlock, interlock: I-805, refs: [LZT-8119, T-8102], status: proposed, by: agent, notes: "Since ae718797 (D-039 item 4; C&E I-805, SEQ-LOAD S0 / S4): LZT-8119, a second guided-wave radar in its own stilling pipe with its own SIS input, independent of LZT-8106 (the P-8103 control), a deviation alarm between them; a bad LZT-8119 signal is a hold, not a trip; SIL null (H-06). Earlier:Added in c257902c (D-036 item 6 as corrected by D-037.15 (a), .16; C&E I-805, I-501 / I-601, SEQ-LOAD); latching, manual reset, SIL null (H-06); on the same transmitter that runs P-8103, so not independent of an LZT-8106 failure (S13); a separate trip transmitter if the SIL screening asks."}
  - {id: SG23, title: "Interlock I-808: TSL-8104 in the pocket or TSL-8118 on the P-8103 discharge head (1oo2, -60 degC) opens P-8103's feeder through the SIS, latching; both also start permissives of I-806 and SEQ-LOAD S0", kind: interlock, interlock: I-808, refs: [TSL-8104, TSL-8118, P-8103], status: proposed, by: agent, notes: "Added in c257902c (D-037.16 (b), .17 (b); C&E I-808, instrument list); own SIS inputs and cables; reset by hand once both read normal and the sump is confirmed free of LNG; SIL null (H-06); residual with TSL-8104 failed: seconds of flow to the drain (S32); its spurious action locks the pump out (S33)."}
  - {id: SG24, title: "LZT-8113 (independent of LI-8103) high at the T-8101 pocket rim (1.20 m): a transfer hold (no start in SEQ-LOAD S0, a pause in S4 while P-8102 is restored from R13); high-high at 1.30 m (I-809): blocks the start of SEQ-LOAD and during a transfer trips ESD-1 of the transferring berth", kind: interlock, interlock: I-809, refs: [LZT-8113, T-8101], status: proposed, by: agent, notes: "Added in ae718797 (D-039 item 1 (b), D-039.9 (e); P-08, C&E I-809, I-501 / I-601, SEQ-LOAD S0 / S4); a second radar through the cover on its own nozzle N3, a deviation alarm against LI-8103; a bad signal is a hold, not the trip; latching, manual reset, SIL null (H-06); outside a transfer the rundown is not stopped (the water a residual, S10)."}
  - {id: SG25, title: "Interlock I-810: T-8101 level rising faster than ~250 m3/h of inflow on LZT-8113 stops P-8102 through HS-8103 and blocks its start, latching", kind: interlock, interlock: I-810, refs: [LZT-8113, P-8102, HS-8103], status: proposed, by: agent, notes: "Added in ae718797 (D-039 item 1 (d); C&E I-810); a spill rises ~1.2 m/min over the 201 m2 floor, the design rain millimetres; acts before any probe has cooled, through the control circuit, not the credited LNG protection (I-801); independent of TSL-8102 / TSL-8120 but on the same LZT-8113 as SG24; a fire-water run may trip it (S37); SIL null; does not see a small inflow (S38)."}
  - {id: SG26, title: "Interlock I-811: B-SUB AHU-1 intake gas AT-8141A/B/C (2oo3 at 25 % LFL, alarm 10 %) stops the fan (UZ-8144) and closes the intake and exhaust dampers UZ-8142 / UZ-8143 (spring-return, fail closed)", kind: interlock, interlock: I-811, refs: [AT-8141A, AT-8141B, AT-8141C, UZ-8142, UZ-8143, UZ-8144], status: proposed, by: agent, notes: "Added in ae718797 (D-039 item 6 (b); P-08, C&E I-811, instrument list, layout/hvac.yaml); latching, manual reset, SIL null (H-06); a detector fault counts as tripped; its failure on demand is S39, its spurious action S40; the hold time of the closed building ASSUMED."}
  - {id: SG10, title: PI-8121 N2 header pressure indication, kind: other, refs: [PI-8121], status: proposed, by: agent}
  - {id: SG11, title: PI-8122 instrument-air header pressure indication and low alarm, kind: alarm, refs: [PI-8122], status: proposed, by: agent, notes: "Low alarm since f5d925f6 (instrument list); the trip is PZT-8123A/B/C (SG18)."}
  - {id: SG12, title: "Interlock I-802: independent KO drum high-high LZT-8105 starts P-8101A/B (whichever is not running) and closes LV-7102", kind: interlock, interlock: I-802, refs: [LZT-8105, P-8101A, P-8101B, LV-7102], status: proposed, by: agent, notes: "Added in 589c9ca7 (D-025 item 6); since 886b0ad5 it starts both pumps, is non-latching (reset automatic) and yields to I-803 (D-026 item 14); SIL null."}
  - {id: SG13, title: "KO pump minimum flow LNG-8005 through FO-8107 back to D-8101", kind: mechanical, refs: [LNG-8005, FO-8107], status: proposed, by: agent, notes: "Added in 589c9ca7; continuous, sized with the pump vendor (TBD)."}
  - {id: SG14, title: "Thermal relief PSV-8109 of LNG-8001 / LNG-8004 back to D-8101 (LNG-8006)", kind: relief, refs: [PSV-8109, LNG-8006], status: proposed, by: agent, notes: "Added in 589c9ca7, 15.0 barg; since fac0bbb5 on the common discharge downstream of HV-8108A/B."}
  - {id: SG15, title: "Interlock I-803: KO drum low-low on LZT-8105 stops P-8101A/B", kind: interlock, interlock: I-803, refs: [LZT-8105, P-8101A, P-8101B], status: proposed, by: agent, notes: "Added in fac0bbb5 (D-026 item 11), independent of LIC-8101; latching false, reset automatic, SIL null; since 886b0ad5 priority over I-802 and LIC-8101."}
  - {id: SG16, title: "HV-8106A/B cryogenic ball valves with the cavity vented to the drum side, and the pressure-equalising hole of CV-8102A/B", kind: mechanical, refs: [HV-8106A, HV-8106B, D-8101, CV-8102A, CV-8102B], status: proposed, by: agent, notes: "Added in 886b0ad5 (D-026 item 14; P-08 note, line list LNG-8002 / LNG-8003): an isolated pump relieves its thermal expansion back into D-8101; the relief pressure of the seat is a vendor item. Since f5d925f6 (D-028 item 9) the check valve discs have an equalising hole, so the piece between CV-8102x and HV-8108x is covered too; the hole also passes reverse flow (S22)."}
  - {id: SG18, title: "Interlock I-804: instrument-air header low-low PZT-8123A/B/C (2oo3, 4.5 barg ASSUMED) initiates ESD-1 of both berths and the rundown trip I-102 before the fail-closed actuators stroke (~3.5 barg ASSUMED)", kind: interlock, interlock: I-804, refs: [PZT-8123A, PZT-8123B, PZT-8123C, XS-5100, XS-6100, XS-1100], status: proposed, by: agent, notes: "Added in f5d925f6 (D-028 item 1; P-08 note); latching, manual reset, SIL null; a transmitter fault alarms. Its failure on demand is S25, its spurious action S24."}
  - {id: SG19, title: "Non-return valves, local air accumulators and exhaust speed controllers of the fail-closed liquid-path valves (XV-5101 / XV-6101, XV-4101 / XV-4102, the arm isolations, XV-1102 / XV-1103, XV-1111..XV-1114)", kind: mechanical, refs: [UZ-5101, UZ-6101, UZ-4101, UZ-4102, UZ-1102, UZ-1103, UZ-1111, HS-5121], status: proposed, by: agent, notes: "Added in f5d925f6 (D-016, D-028 item 1; instrument list, P-01 / P-05 / P-06 notes): one closing stroke and a hold of at least 5 min after a loss of the header, closure no faster than the set speed (both ASSUMED); no proof test in the files (A20)."}
  - {id: SG17, title: "Interlocks I-514 / I-614: O2 above 5 vol % for 10 s on the berth analyser AI-5126 / AI-6126 or the tank-end AI-4133 / AI-4134 closes the vapour arm isolation XV-5122 / XV-6122 (and XV-5125 / XV-6125) and opens XV-4135 / XV-4136", kind: interlock, interlock: I-514, refs: [AI-5126, AI-6126, AI-4133, AI-4134, XV-5122, XV-6122, XV-4135, XV-4136], status: proposed, by: agent, notes: "Added in 886b0ad5 (D-026 item 7; review 2026-11-05-basic-design-2#11); latching, manual reset, SIL null; on the same single analyser as I-511 / I-611; its spurious action is a cause of H-03 S14. Since f5d925f6 2oo2 on two O2 cells and also closing XV-5125 / XV-6125; since 79d5c7ad (D-030 item 4) armed only with no liquid transfer at the berth (at 79d5c7ad the shore ESD valve not commanded open, or both loading line flows below 50 m3/h, ASSUMED); during a transfer the same O2 high-high trips ESD-1 (S23). Title and refs revised for 709fcf20 (D-032 items 1, 3, 4): the berth analyser (two cells, 2oo2) is the O2 input with the tank-end analyser as backup, so the trip no longer shares the analyser of I-511; armed with XV-5101 / XV-6101 proven closed by ZSC-n101 and not held open by UZ-n101; it also opens XV-4135 / XV-4136, so the slug goes to the tanks and I-513 / I-613 close the flare valve (H-02 S25)."}
  - {id: SG20, title: "Interlocks I-501 / I-601 on ZSO-5122 / ZSO-6122: the vapour arm isolation not proven open during a liquid transfer trips ESD-1, which detects an air loss at the platform end of the jetty air main", kind: interlock, interlock: I-501, refs: [ZSO-5122, ZSO-6122, XV-5122, XV-6122], status: proposed, by: agent, notes: "Added in 79d5c7ad (D-030 items 2, 8); XV-5122 / XV-6122 have no accumulator and move first; only during a liquid transfer; SIL null; voted platform-end transmitters remain hold H-04 (A20). Since 709fcf20 (D-032 items 1, 7) the transfer state is ZSC-n101 / UZ-n101, and a maintenance override of a failed ZSO-n122 may suspend it for one transfer (C&E bypass)."}
actions:
  - {id: A1, status: proposed, by: agent, text: "P&ID P-08 and C&E change: add an independent high-high level switch on D-8101 (separate from LIC-8101) with a defined action (start the spare pump, alarm, close LV-7102), and confirm the KO drum liquid hold-up for the largest credible liquid slug (H-01 S6, H-04 S9).", response: "Partly answered by commit 589c9ca7 (D-025 item 6; review #20): independent high-high LZT-8105 on its own nozzle; I-802 starts the standby pump P-8101B and closes LV-7102 (the D-7101 drain). Still open: the KO drum hold-up for the largest liquid slug; I-802's own consequence is S19. Commit 886b0ad5 (D-026 item 14) has I-802 start both pumps, non-latching and yielding to I-803; the hold-up is still not confirmed, and the parallel running is S21 (A19). Still proposed."}
  - {id: A2, status: proposed, by: agent, text: "P&ID P-08 change: add a low-level pump trip on D-8101 independent of LIC-8101 and a minimum-flow return for P-8101A/B to D-8101; state the response when the site liquid burner is unavailable.", response: "Partly answered by commit 589c9ca7 (D-025 item 6): a continuous minimum flow LNG-8005 through FO-8107 to D-8101 for either pump, and suction isolation HV-8106A/B. Still open: a low-level pump trip independent of LIC-8101 and the response when the site liquid burner is unavailable. Commit fac0bbb5 (DESIGN.md D-026 items 9, 11) adds the low-level trip: I-803 on LZT-8105 (own nozzle, independent of LIC-8101) stops P-8101A/B at low-low level, LIC-8101 drives the pumps by signal lines through HS-8101A / HS-8101B, and HV-8108A/B isolate the discharges. Still open: the response when the site liquid burner is unavailable; the discharge isolations create S20 (A18). Still proposed."}
  - {id: A3, status: proposed, by: agent, text: "P&ID P-08 change: thermal relief on LNG-8001 / LNG-8004 between the pump check valves and the battery limit (or show the battery-limit arrangement that relieves it), listed in piping/special-items.yaml.", response: "Answered in the design by commit 589c9ca7 (D-025 item 6): PSV-8109 on LNG-8001 / LNG-8004 downstream of CV-8102A/B, back to D-8101 through LNG-8006 (own nozzle N8), 15.0 barg, in piping/special-items.yaml. For the team to verify and close; S4 re-rated."}
  - {id: A4, status: proposed, by: agent, text: "Flare study: cumulative relief load of the common-cause cases (power failure and instrument-air failure at loading) on FL-8001 / D-8101 / FL-8101, the back-pressure at PV-1110 and the PSVs, and the radiation at the fence (S-10); see H-04 A3."}
  - {id: A5, status: proposed, by: agent, text: "P&ID P-08 and C&E change: add a low purge-flow alarm on FI-8111, a back-up purge (N2) on loss of fuel gas, an O2 analyser on FL-8001 / D-8101, and show the molecular or velocity seal at the tip; confirm the purge rate against header contraction after a cold release."}
  - {id: A6, status: proposed, by: agent, text: "Show the pilot ignition system and its re-ignition on pilot failure (TI-8131) on P-08, and define the response to an unlit flare during loading."}
  - {id: A7, status: proposed, by: agent, text: "Line list change: give FL-8001, FL-8002 (and FL-7002, FL-7003..FL-7005; the D-7101 relief line of the revision analysed was removed in fac0bbb5) a low-temperature material and minimum design temperature for the coldest relief (cold BOG, LNG carry-over), or show where the gas is warmed."}
  - {id: A8, status: proposed, by: agent, text: "P&ID P-05 / P-06 / P-08 change: draw the carrier de-inerting and cooldown route to the storage and loading flare (D-017, S-02) separate from the tank vapour header, with its valves and the switch-over criterion (hydrocarbon content).", response: "Answered in the design by commit 589c9ca7 (D-025 items 3, 6; review #19): BOG-4013 from vapour return A (XV-4131) joined by BOG-4014 from return B (XV-4132) to D-8101, switched at the tank end by AI-4133 / AI-4134 (N2 / O2 / CH4) and I-511 / I-611, make-before-break with XV-4135 / XV-4136; drawn on P-04 and P-08. For the team to verify and close; the switch's failures are H-02 S15 to S18, the O2 it sends to the flare is S18 here."}
  - {id: A9, status: proposed, by: agent, text: "Confirm the dry-sump philosophy of T-8101: a high level alarm on LI-8103, the P-8102 capacity against the design rain, and the start of the high-expansion foam on TSL-8102 shown on P-08 (the foam system is in the I-801 notes only).", response: "Not answered at 709fcf20: D-033 items 3 and 10 deepen the basin to 10.5 m and leave the type and head of P-8102 for the deeper pit with the design owner; high-expansion foam at the junction, the culverts and the basin inlet is ASSUMED until the fire protection design; nothing is added to P-08. Partly answered by commit aedd8dbd (D-034 item 8; P-08): P-8102 is a submersible on the pit floor, LI-8103 a radar and TSL-8102 a probe through the cover, the pump sized 50 m3/h at ~36 m for a 12.5 m pit; D-035 makes the pit 19.5 m deep with 100 m3 of rain allowed and leaves the pump head for it with the design owner. Still open: a high level alarm on LI-8103, the pump capacity and head against the design rain for the 19.5 m pit, and the foam start on TSL-8102 on P-08. Still proposed. Partly answered by commit c257902c (D-036 item 3; equipment list, datasheet P-8102): P-8102 is re-rated for the 19.5 m pit, 50 m3/h at ~44 m. Still open: a high level alarm on LI-8103, the 50 m3/h against the civil engineer's design rain on the tank-area catchment, and the foam start on P-08. Still proposed. Mostly answered by commit ae718797 (D-039 item 1, D-039.9 (c), (e), (j); P-08, C&E I-801, I-809, I-810, loop LC-8103, SEQ-LOAD S0 / S4): T-8101 is kept dry with a floor pocket, P-8102 on a VSD on LI-8103 (50 m3/h at 45 m against ~20 m3/h of the ASSUMED design rain on the troughs and the pit), the high alarm is on the independent LZT-8113 (LAH 1.20 m a transfer hold, LAHH 1.30 m I-809 ESD-1 during a transfer), D-035's 100 m3 of rain withdrawn; the fire and gas system starts the T-8101 foam on TSL-8102, TSL-8120 or AT-8124 (C&E I-801 notes). For the team to verify and close; still open: the foam system on a P&ID (it is in the C&E notes only), the civil engineer's design storm for the tank-area catchment, and the floor fall and pocket (civil). Still proposed."}
  - {id: A10, status: proposed, by: agent, text: "Determine the required integrity of I-801 (single TSL-8102) and consider a second, independent low-temperature switch or a discharge isolation valve on W-8002 that closes on LNG in the sump.", response: "Partly answered by commit c257902c (D-036 item 3; C&E I-801, line list W-8002): I-801 opens the motor feeder through the SIS (latching), TSL-8102's tip is at the pit floor below the pump intake, the pump and W-8002 up to HV-8115 are stainless for -170 degC, and CV-8114 / HV-8115 stand above the cover. Still open: the integrity of I-801 on the single TSL-8102 (the jetty pump P-8103 got a second detection, I-808 1oo2, this one did not), and the LNG rating of W-8002 beyond HV-8115. Still proposed. Partly answered by commit ae718797 (D-039 item 1 (c), (d), D-039.9 (f); P-08, C&E I-801, I-810, instrument list): the second independent detection is drawn, TSL-8120 in the discharge upstream of CV-8114 (1oo2 with TSL-8102, whose tip is now 1.0 m above the pocket floor), with the rim gas detection AT-8124 as a third cause, and the rate-of-rise inhibit I-810 on LZT-8113 stops the pump on a large spill before the probes cool. Still open: the SIL target of I-801 (H-06), the small inflow seen by TSL-8120 alone (S38, A34), and the LNG rating of W-8002 beyond HV-8115 (no discharge isolation that closes on LNG was added). Still proposed."}
  - {id: A11, status: proposed, by: agent, text: "C&E change: add tank-area and trestle fire and gas / low-temperature spill detection as a cause of ESD-1 (I-501 / I-601) and of I-101, and confirm the T-8101 design spill against the ESD response time.", response: "Not answered at 79d5c7ad: D-030 item 7 writes the manual push buttons and the confirmed platform fire and gas into the I-501 / I-601 logic; there is still no tank-area or trestle fire and gas or spill detection and no cause of ESD-1 or I-101 from it, now also none along the ~760 m of open trough and in the enclosed channels (S26, S27). Not answered at 709fcf20: the cause tags HS-n100 and XS-n108 are written (D-032 item 7); D-033 item 2 (d) gives the B-SUB intake gas detection with a damper trip (HVAC engineer, ASSUMED), not an ESD-1 cause; there is still no tank-area, trestle, trough or collector detection acting on ESD-1 or I-101 (S26, S27, S29). Not answered at aedd8dbd: D-034.3 confirms the T-8101 design spill against the ESD response only for the 10 min of D-018 (2,400 m3, ~11.5 min to the trough inlet) and states that a shorter release needs a defined automatic stop of the loading pumps on a tank-area release, which the design does not have; the push buttons are one tag per station (HS-n100A / B / C). Still proposed. Not answered by commit ae718797: I-809 (the T-8101 water high-high) is a transfer cause of ESD-1, but it detects water, not a spill; AT-8124 at the pit rim trips I-801 and the foam, not ESD-1 or I-101; the B-SUB intake detection I-811 acts on the HVAC only; there is still no tank-area or trestle spill detection acting on ESD-1 or I-101. Still proposed."}
  - {id: A12, status: proposed, by: agent, text: "P&ID P-08 change: give T-8102 a level measurement and a water removal (pump or drain with LNG interlock as I-801), and show its foam system.", response: "Not answered at 79d5c7ad: D-031 item 6 names it open with the design owner (P-08 and this action): a level transmitter with a high alarm and a fixed water removal interlocked off on low temperature for T-8102, or a covered sump; until then the T-8102 notes give a rain margin of ~170 m3 against ~33 m3 for an arm or flange failure until ESD closure (ASSUMED); the catwalk S-CW-A9 now carries TSL-8104's cable and a walkway for access. Not answered at 709fcf20: D-033 items 10, 11 (g) make T-8102 6 m across and 9.5 m deep (~159 m3 below the inlet) and require it to be kept pumped down so LNG never meets standing water, with its level measurement and fixed water removal with a low-temperature trip open with the design owner (P-08, this action); the foam is still not shown. Partly answered by commit aedd8dbd (D-034 item 9 (d), SEQ-LOAD permissive, P-08 and equipment list; D-035 items 1 (c), 8): one statement for T-8102: no fixed pump, a portable submersible pump lowered through the cover once TSL-8104 confirms no LNG, the sump checked dry before every transfer (a SEQ-LOAD permissive, text) and after heavy rain; 13.0 m deep (~257 m3 below the inlet) for ~170 m3 per berth, a sealed caisson. Still open: a level indication with a high alarm (D-035.14 (j) asks for it), the foam on P-08, and a recorded dry check. Still proposed. Mostly answered by commit c257902c (D-036 item 6; D-037.15 (a), .16, .17; P-08, C&E I-805 to I-808, SEQ-LOAD S0 / S4): LZT-8106 (guided-wave radar in a stilling pipe) with the LAH a transfer hold and the LAHH (I-805) a start block and ESD-1 trip; the fixed dry-sump pump P-8103 (motor on the cover) started and stopped on it and locked out on LNG by TSL-8104 / TSL-8118 (1oo2, I-808), 'P-8103 in auto and available, TSL-8104 and TSL-8118 normal' and LZT-8106 below its LAH as SEQ-LOAD S0 permissives; no rain allowance (210 of 257 m3). For the team to verify and close; still open: the foam on P-08, the one transmitter for the control and the trip, and the vendor items (A29). Still proposed. Commit ae718797 (D-039 item 4) answers the one transmitter: the hold and I-805 are on LZT-8119, independent of LZT-8106. Still open: the foam on a P&ID and the vendor items (A29). Still proposed."}
  - {id: A13, status: proposed, by: agent, text: "Add a low-pressure alarm on PI-8121 and make 'N2 header healthy' a permissive of SEQ-LOAD S1 / S2; consider a back-up N2 supply for purge and seal gas.", response: "Not answered by commit c257902c, which adds a large site N2 user (SEQ-LINE-EMPTY, ~4,000 Nm3/h for ~2.5 h) with the site rate and its liquid N2 back-up as a hold (S34, A30). Still proposed. Not answered by commit ae718797: PI-8121 still has no low alarm and 'N2 header healthy' is not a SEQ-LOAD permissive; the back-up named in process/design-basis.yaml (ASSUMED, D-039.3) serves the site N2, not the berth purge specifically. Still proposed."}
  - {id: A14, status: proposed, by: agent, text: "P&ID P-05 / P-06 / P-08 change: show the N2 connection for the vapour arm leak test and purge with a pressure regulator and a relief valve set below the 3.5 barg design of LA-5102 / LA-6102.", response: "Not answered at 709fcf20: SEQ-LOAD S1 now states the test boundary (XV-n122 closed, the carrier's manifold valve closed, the ERS valves open) and vents the test N2 into the carrier's manifold (D-032 item 7, #6); the N2 connection to the vapour arm, its regulator and its relief are still not drawn (S15). Still proposed."}
  - {id: A15, status: proposed, by: agent, text: "Record the fail position of every ESD and switching valve (XV) in the instrument list or the C&E, add a low instrument-air pressure alarm and action (ESD-1 at a set pressure) on PI-8122, and size air receivers for the ESD valves and PV-1110 (see H-04 A2).", response: "Partly answered by commit 589c9ca7: the fail positions of the valves it added are in the instrument list (XV-1115, XV-5161 / XV-6161, XV-7123A..C, XV-7130 closed; XV-7125A..C, XV-4135 / XV-4136 open), control/philosophy.md F-AIR states the ESD, ERS and fill valves close, and XV-1115 has its own air accumulator. Still open: the fail position of every other XV (e.g. XV-7121A..C, XV-4131 / XV-4132), the low instrument-air alarm and action on PI-8122, and the air receivers. Since fac0bbb5 / 886b0ad5 XV-7121A..C are given fail closed (D-026 item 5) and XV-4131 / XV-4132 fail closed (D-026 item 1, P-04, instrument list). Still open: the low instrument-air alarm and action on PI-8122 and the air receivers. Mostly answered by commit f5d925f6 (D-016, D-028 item 1): PI-8122 has a low alarm, and the low-low trip PZT-8123A/B/C (own tappings, 2oo3, 4.5 barg ASSUMED, C&E I-804) initiates ESD-1 of both berths and the rundown trip before the valves move; the fail-closed liquid-path valves have local air accumulators with non-return valves (one stroke, at least 5 min hold, ASSUMED) and speed controllers; the ERS valves are hydraulic; XV-2123 / XV-3123 are given fail closed. Still open: the accumulator and hold-time sizing (detail engineering, D-028), an air receiver or assured action for PV-1110 (H-04 A2), and the proof test of the trip and the accumulators (A20). Still proposed."}
  - {id: A17, status: proposed, by: agent, text: "Agree with the carrier operators the maximum O2 content of the de-inerting and gassing-up vapour, and confirm that the flare system may receive it (O2 limit, purge rate, the O2 analyser on FL-8001 / D-8101 of A5); otherwise state where vapour above that O2 content goes.", response: "Partly answered by commit fac0bbb5 (DESIGN.md D-026 item 7): vapour goes to the flare only below 5 vol % O2 (inert gas quality, ASSUMED) and to the tanks only below 1 vol % O2 and on hydrocarbon specification (S-01 purge limit); above 5 % the berth does not take the vapour and the carrier vents on board under the terminal rules; AI-4133 / AI-4134 measure CH4, N2 and O2. Still open: agreement of the limit with the carrier operators, confirmation that the flare system may receive vapour at up to 5 vol % O2 with its purge, and the O2 analyser on FL-8001 / D-8101 (A5). Commit 886b0ad5 implements the rejection above 5 vol %: I-514 / I-614 close XV-5122 / XV-6122 (S18 residual). The other open items are unchanged. Still proposed."}
  - {id: A18, status: proposed, by: agent, text: "P&ID P-08 / special items: give each KO pump section between HV-8106x and HV-8108x (including the piece between CV-8102x and HV-8108x) a thermal relief to D-8101, or a casing vent and drain with a written isolation procedure that drains the pump to D-8101 before both isolations are closed; list the device in piping/special-items.yaml (S20).", response: "Partly answered by commit 886b0ad5 (D-026 item 14; review 2026-11-05-basic-design-3#3): HV-8106A/B are cryogenic ball valves with the cavity vented to the drum side, so a pump blocked in between HV-8106x and HV-8108x relieves into D-8101, and the P-08 note and the equipment list say to drain the pump to the drum before maintenance. Still open: the piece between CV-8102x and a closed HV-8108x (the check valve separates it from the pump and the vent), the seat relief pressure from the valve vendor, and a written isolation procedure. Commit f5d925f6 (D-028 item 9; review 2026-11-05-basic-design-4 #5) gives CV-8102A/B a disc with a pressure-equalising hole, tagged on P-08, so that piece relieves back through the pump and the HV-8106x cavity vent into D-8101 (P-08 note, LNG-8001 / LNG-8004 notes). Still open: the seat relief pressure and the hole size from the vendors, and the written isolation procedure; the hole's reverse flow is S22 (A21). Still proposed."}
  - {id: A19, status: proposed, by: agent, text: "Confirm with the site the capacity of the liquid burner and of LNG-8001 for both KO pumps in parallel (I-802 starts the pump that is not running, S21), and the burner's interface trip; otherwise have I-802 start the standby only when the duty pump is not running (run feedback), and size FO-8107 for two pumps or give each pump its own minimum flow."}
  - {id: A20, status: proposed, by: agent, text: "Air header trip I-804 and the valve accumulators: agree with the site air system the 4.5 barg trip point (ASSUMED) against the header's normal transients and the ~3.5 barg stroke pressure, and whether a short confirmation delay fits that margin (S24); decide the second set of air-header transmitters at the platform end of the jetty air main and the air distribution (D-020, D-028) so that a break of the air main far from IA-8001 trips ESD-1 before the berth valves move (S25); size the accumulators and hold times; put I-804 (transmitters, voting, outputs) and every non-return valve, accumulator and speed controller of the fail-closed liquid-path valves in the proof test; write the reset and restart after an I-804 trip (F-AIR: reset I-804, then the berths by SEQ-LOAD and the compressors by SEQ-BOG-START) (S16, S24, S25).", response: "Partly answered by commit 79d5c7ad (D-030 items 2, 13): at basic an air loss at the platform end is detected during a transfer by ZSO-5122 / ZSO-6122 on the accumulator-less vapour arm isolations (SG20); the voted platform-end transmitters and the jetty air distribution are hold H-04, the accumulator and hold-time sizing hold H-03, the voting of PZT-8123A/B/C and of the position switches the SIL screening (hold H-06). Still open: the trip point against the header transients and a confirmation delay, the proof test, and the written reset and restart. Still proposed."}
  - {id: A21, status: proposed, by: agent, text: "Confirm with the check valve and pump vendors the size of the pressure-equalising hole of CV-8102A/B against the reverse flow through a stopped standby pump (reverse rotation limit, start against reverse rotation), and state in the operating instructions whether the standby is kept with HV-8108x open or closed (S22)."}
  - {id: A22, status: proposed, by: agent, text: "Layout and spill design: state the cover, slope and capacity of the ~240 m tank-area trough to T-8101 and the ventilation of its culvert under road R2 (Z-KC-TROUGH-SUMP), consider gas or low-temperature detection along the trough and at the culvert with the closure of road R2 on a spill, and include the trough route in the vapour dispersion of the CSA Z276 / NFPA 59A siting study (D-018 says dispersion is not calculated); consider adding the layout files to the analysed inputs of this study (S26).", response: "Partly answered by commit 79d5c7ad (D-018, D-031 item 1; layout): the collector is re-routed away from the shells and the riser towers in open 0.6 x 1.2 m troughs under PR1, PR2, PR3 and PR4 (~760 m), across R7 and R2 in culverts, with an enclosed channel under PR5 / PR6 and the riser towers vented into the PR1 trough, sized for one loading line (ASSUMED), and screened as a line-source trough fire with its residuals stated (roads beside the troughs above 8 kW/m2, a third A2 way out). Still open: the culvert ventilation, the vapour formed along the troughs and in the channel and its vent (the civil / process detail's, D-031), gas or low-temperature detection along the route, a road closure on a spill, and the vapour dispersion in the siting study; the layout is still not an analysed input. Partly answered further by commit 709fcf20 (D-018, D-033 items 1-3, 7, 11; layout): the enclosed channels and PR2's trough are removed; ~510 m of open trough, 0.6 m, lined with cellular glass (about 25 times less vapour than bare concrete, ASSUMED), at 0.5 % fall on a recorded profile from the PR6 joint into the basin at (990, 3237.5), 10.5 m deep, so the design spill does not back up; every trough leg is a zone 2 release source; vehicle entry at the R7 and R2 culverts under the site's control (gas test or permit, ASSUMED, an operating measure); gas detection with a damper trip at the B-SUB intake LV1 (ASSUMED); fire approaches on R1, R11, R8, R2, R4. Still open: the culvert ventilation, gas or low-temperature detection along the troughs, a road closure on a spill, the B-SUB vapour distance and the dispersion in the siting study, the civil quantities; the layout is still not an analysed input. Commit aedd8dbd (D-034 item 3, D-035 items 2, 4; layout) deepens the trough for the run-out of one tank's pumps (2.92 m at 0.5 %), the basin to 19.5 m for 2,400 m3, adds road R12 and the hardstanding Z-LAY-A8W as the basin's fire approach and a tank-area muster point; still open as before. Still proposed. Partly answered by commit ae718797 (D-039 item 6 (b); P-08, C&E I-811): the B-SUB intake gas detection is drawn, AT-8141A/B/C (2oo3) with the trip I-811 stopping AHU-1 and closing the intake and exhaust dampers (N4, S39, S40); AT-8124 detects gas at the basin rim (I-801, foam). Still open: the culvert ventilation, detection along the troughs, a road closure on a spill, the dispersion in the siting study and the civil quantities; the layout is still not an analysed input. Still proposed."}
  - {id: A23, status: proposed, by: agent, text: "Alarm and operating instruction for the O2 high-high of AI-4133 / AI-4134 during the transfer (SEQ-LOAD S4 on, where I-514 / I-614 are not armed): set point, priority and the operator's response time to ESD-1, and whether I-511 / I-611 should keep vapour above 5 vol % O2 out of the flare in that mode (S23).", response: "Answered in the design by commit 79d5c7ad (D-030 item 4; review 2026-11-05-basic-design-5 #4): during any liquid transfer, the S3 cooldown included, the 2oo2 O2 high-high of AI-4133 / AI-4134 for 10 s trips ESD-1 (I-501 / I-601), so the response no longer rests on the operator; I-511 does not act while ESD-1 is tripped and I-513 closes the flare valve once the tank-side valve is proven open. For the team to verify and close; the vapour of the 10 s delay still reaches the flare, and the line pack the tanks (H-02 S23, A19). Commit 709fcf20 (D-032 item 3) moves the O2 trips to the berth analysers AI-5126 / AI-6126, so the trip acts before the vapour enters the return and the slug goes to the tanks, not the flare (S18, S23); the flare sees vapour above 5 vol % only with the berth analyser failed low (H-03 S37). For the team to verify and close. Still proposed."}
  - {id: A24, status: proposed, by: agent, text: "Civil / process detail: size the vents of the enclosed channel under PR5 / PR6 and the riser towers and of the enclosed collectors under the jetty deck for the vapour formed by a spill on the warm channel in the first minutes, keep the vent outlets out of the racks, riser towers and platform working areas, decide whether the channel is designed for a confined deflagration, inerted or given gas and low-temperature detection with an ESD action, and include the channels in the siting study (S27).", response: "Partly answered by commit 709fcf20 (D-018, D-033 items 1, 4, 11 (f); layout): the enclosed channels under PR5 / PR6 and the riser towers are removed; the jetty collectors are lined with cellular glass and sized for the vapour formed (~10 Pa over the longest path, ASSUMED), with no seals and no vent other than the sump wall, and the collector vapour flame is screened at the sump and at the worst dry outlet. Still open: a design for a confined deflagration inside the collectors, inerting or gas and low-temperature detection with an ESD action, and the collectors in the siting study. Commit aedd8dbd (D-035 items 1 (b), 14 (f); layout) widens the collectors to 1.5 m for the header flow and states that the header bay's outlets run drowned and the collectors back up at the berth rate (~1.7 kg/s of vapour, ASSUMED); still open as before. Still proposed."}
  - {id: A25, status: proposed, by: agent, text: "Screen the muster point Z-ESC-A4N, the start of the trestle road R5 and the boat route Z-ESC-A4-SEA against a jet or pool fire and a vapour cloud at the Berth 2 manifold and arms (11.5 m from the muster point), and state an alternative muster point or refuge for a Berth 2 manifold event with the wind toward the north-west; confirm the boat's approach with the marine engineer and the TERMPOL review (S28).", response: "Mostly answered by commit 709fcf20 (D-033 item 5; layout): Z-ESC-A4N is removed; the muster point, life-raft station and boat landing are on the B-JET deck A7 (Z-ESC-A4-MUSTER), 214 m from the nearest tray bay and ~300 m from T-8102; two ways off from opposite corners of the platform's north edge (W1 the trestle road R5, W2 a walkway east of PR2) are screened so that one stays at 4.9 kW/m2 or less for each of the 27 bay fires and the muster point at 0.21 kW/m2 (1.27 with every Berth 1 bay burning); the boat leaves west, 71 m north of the Berth 2 hull envelope (all ASSUMED). Still open: the jet fire and vapour cloud screening of the ways off (S28, the siting study), the W2 walkway, the A7 landing and the mooring lines (marine engineer), and the TERMPOL review of the boat's approach. Commit aedd8dbd (D-035 items 12, 14 (b), (d), (e); layout) screens the release-point fire (both ways off above 5 kW/m2 for every arm and manifold release while it lasts, muster 0.3-0.8 kW/m2), the drift-off pool on the water and the south-end walks, carries the first two to the siting study and answers the third with an occupancy rule (S31); the north-edge crossing (6.2 / 5.9 kW/m2) is a residual with a water curtain considered (ASSUMED). Still open: the siting study cases, the water curtain, the occupancy rule in the operating philosophy (A28), and the marine items. Still proposed."}
  - {id: A26, status: proposed, by: agent, text: "Design owner / layout: give the item drip trays without a drain (XV-3123, TV-7103, PSV-1122, PSV-1123, PSV-4111, PSV-4113) low-temperature detection with an alarm and a written response (close XV-4105 and stop the circulation pump for XV-3123, isolate TV-7103), state how they are kept free of rain and ice, and confirm their hold-up against the largest credible leak at the item until it is isolated; otherwise give them a drain to the trough (S29).", response: "Partly answered by commit aedd8dbd (D-035 items 6, 7; layout): TV-7103's tray is deepened to 2.4 m3 (18.5 min of 3.5 t/h by D-035, ~15.6 min of the 4.1 t/h spray of D-034, agent arithmetic), XV-3123's holds 22.5 min of 1 kg/s, PSV-1121 gets a 0.3 m3 tray, and the low-temperature detectors in the XV-3123 and TV-7103 trays are named for the design owner to add on P-03 / P-07 with their alarm. Still open: those detectors on the P&IDs with the written response, the PSV trays' detection, rain and ice, and the hold-up against the 10 min to isolate at the 4.1 t/h spray. Still proposed. Partly answered by commit c257902c (D-036 item 7; P-03, P-07, instrument list): TSL-3124 in the XV-3123 tray and TSL-7115 in the TV-7103 tray, alarm in the control room, the response (isolate within the 10 min of the tray concept) in their instrument notes. Still open: the detection of the DN 25 relief trays (PSV-1121, PSV-1122, PSV-1123, PSV-4111, PSV-4113), rain and ice in the trays without a drain, and TV-7103's hold-up at the 4.1 t/h loading spray (~15.6 min). Still proposed."}
  - {id: A27, status: proposed, by: agent, text: "Design owner: classify the T-8101 pit as a hazardous area and state the protection type of the submersible P-8102, its cable and gland (or isolate its supply on TSL-8102 at the switchboard), the material and minimum design temperature of P-8102, its rail and the riser W-8002 against LNG on the pit floor, and the rule for lifting the pump out through the cover (no LNG or vapour in the pit, gas test); confirm the I-801 reset only once the pit is free of LNG; size the pump's head for the 19.5 m pit (S30, S10).", response: "Mostly answered by commit c257902c (D-036 item 3, D-037 item 9; equipment list, datasheet, C&E I-801, line list W-8002): a flameproof Ex d IIA T3 motor certified for zone 1 (the pit zone 2 in the layout, zone 1 taken for it) with cold-rated cable and seals (vendor), the pump, rail and riser to HV-8115 austenitic stainless for -170 degC, the feeder opened by I-801 through the SIS, the pump re-rated for the 19.5 m pit, the pit cover grated over the south strip only. For the team to verify and close; still open: the rule for lifting the pump out (no LNG or vapour, gas test), the I-801 reset condition written in the C&E, and the vendor's certificate. Still proposed. Partly answered by commit ae718797 (C&E I-801 notes): the reset condition is written (by hand only once TSL-8102, TSL-8120 and AT-8124 read normal and the pit is confirmed free of LNG). Still open: the lifting-out rule, the vendor's certificate, now for a converter-fed Ex d motor with its filter (A33). Still proposed."}
  - {id: A28, status: proposed, by: agent, text: "Operating philosophy: write the south-end occupancy rule of D-018 (o) (no work position at y < 876 on the platform while a transfer runs on either berth) as a procedure with its exceptions and the response to alarms at the drain pumps, the strainers and the header bay during a transfer, and consider remote indication or a camera so that those alarms need no visit; carry the release-point fire and the north-edge crossing to the siting study (S31, S28).", response: "Partly answered by commit c257902c (D-037 items 1, 3, 15 (i), 16; layout): the T-8102 pump-down no longer needs a person on A9 (P-8103), the header bay valves are reached from the aisle S-HDR, XV-4107 / XV-4103 are maintained by exchange with no transfer on either berth, SC-1 / SC-2 are named for the siting study and the north-edge water curtain is an ASSUMED requirement. Still open: the occupancy rule as a written procedure with its exceptions, the remote indication of the south-end alarms, the MEWP duty (operating owner). Still proposed. Mostly answered by commit ae718797 (D-039 item 6 (a), (c); D-040 items 1, 4, 13, layout; SEQ-LOAD S4, control/philosophy.md, instrument list PDI-5102 / PDI-6102): the occupancy rules are written into SEQ-LOAD S4 and the philosophy (no one at the south end or on A9 from S3 to the end of S5 on either berth, the arm positions occupied for connection, cooldown and disconnection only); PDI-n102 is transmitted with a PDAH to the control room; the header bay valve and strainer work, the deck crane pads and the floating crane are used with no transfer on either berth (or at that berth). For the team to verify and close; still open: the exceptions and the permit system for the rule, the MEWP and crane contractors' plans, and the siting study cases. Still proposed."}
  - {id: A29, status: proposed, by: agent, text: "T-8102 dry sump (vendor, SIL screening hold H-06, marine and civil engineers): give I-805 its own trip transmitter or show in the SIL screening that one LZT-8106 for the pump control, the transfer hold and the trip is enough (S13); state the SIL targets of I-805 and I-808 and put LZT-8106, TSL-8104, TSL-8118 and the I-808 reset in the proof test; confirm the TSL-8118 response time (the seconds of flow of S32), the P-8103 start count against the cycling (up to ~18 an hour), the drain-back hole of CV-8116 kept clear (inspection) and the line-shaft ratchet, the frost-free pocket and a backflow from the jetty drain; write the I-808 reset rule (sump confirmed free of LNG) and the use of the portable spare pump; confirm the jetty drain outfall for LNG drawn in the residual case (S32, S33).", response: "Partly answered by commit ae718797 (D-039 item 4; C&E I-805, instrument list LZT-8119): I-805 and the LAH hold have their own trip transmitter LZT-8119 (own stilling pipe and SIS input) with a deviation alarm against LZT-8106 and a bad signal taken as a hold; the I-808 reset rule is in its notes (both read normal and the sump confirmed free of LNG). Still open: the SIL targets of I-805 / I-808 and the proof test (now of LZT-8119 too), the TSL-8118 response time, the P-8103 start count, the drain-back hole inspection and the ratchet, the frost-free pocket, the backflow from the jetty drain and its outfall, the portable pump's use; the ice in the pocket after a spill is A31. Still proposed."}
  - {id: A30, status: proposed, by: agent, text: "Site N2 (the trains' utility owner): confirm the site N2 rate and pressure for SEQ-LINE-EMPTY (~4,000 Nm3/h at 7 barg for ~2.5 h, ~9,500 Nm3 per line, ASSUMED) with its liquid N2 back-up, the effect of that draw on the other site N2 users (compressor seal gas, berth purge), a low-pressure alarm at the stations or the site header with the response, and whether the stations need a dedicated supply (S34; H-02 A26).", response: "Partly answered by commit ae718797 (D-039 item 3, D-039.9 (b), (j); SEQ-LINE-EMPTY, process/design-basis.yaml): the minimum rate is stated, ~3,500 Nm3/h (6 barg at PI-4155, the acceptance value of hold H-07), the response to low N2 is written (the displacement continues at the reduced rate, the back-up is called, the expected end is reported from the return flow on FIC-4101 / FIC-4102; S2 timeout 5 h), and the source and back-up (liquid N2 storage and vaporisers, or a trailer at the station flange) are in the design basis, ASSUMED. Still open: the trains' utility owner's confirmation of the rate and the back-up, the effect on the other site N2 users, and a remote low-pressure alarm (PI-4155 / PI-4157 are local gauges). Still proposed."}
  - {id: A31, status: proposed, by: agent, text: "Siting study and design owner (marine and civil engineers, pump and instrument vendors): carry the rapid phase transition of the first LNG on the T-8101 (up to ~2 m3) and T-8102 (0.05-0.25 m3) pocket water as a named case, state the pocket, cover and stilling-pipe design against its pressure pulse, and write the recovery after a spill (the ice in the T-8102 pocket melted or removed, P-8103, LZT-8106, LZT-8119, TSL-8104 and in T-8101 P-8102, LI-8103, LZT-8113, TSL-8102 inspected and proof-tested) as a permissive of the next transfer (S35)."}
  - {id: A32, status: proposed, by: agent, text: "Design owner and siting study (SC-3): decide the arrangement for rain on a T-8102 pool during a transfer with the carrier alongside (hulls above 8 kW/m2 from ~2 mm/h of rain for 3.7-9 h): a remote sump on the trestle, high-expansion foam on T-8102 shown to work (fire protection engineer), or the carrier's emergency departure after ERS (marine engineer); write the drain-down operating rules of D-040.3 (no carrier berths while LNG stands in T-8102; a carrier alongside at the ESD-1 of a trestle leak leaves once its arms are drained) into SEQ-LOAD / SEQ-LINE-EMPTY; and state the response to steady rain through a drain-down with P-8103 locked out (~20 m3 of water and ~19 m3 of ice under the LNG at 10.4 mm/h) against D-018 (s) (S36)."}
