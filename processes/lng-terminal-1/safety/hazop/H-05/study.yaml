        guide_word: more
        parameter: level (liquid carry-over)
        scenarios:
          - id: S1
            cause: >-
              Liquid into the flare header beyond the KO drum's hold-up: liquid through PV-1110
              after a tank overfill or rollover (H-01), LNG from D-7101 through DR-7001 (H-04), and
              P-8101A/B not pumping (LIC-8101 fault, pump trip, the liquid burner not available).
            consequence: >-
              Level rises in D-8101 and LNG is carried with the gas up FL-8002 to the stack: burning
              liquid rain around the 122 m derrick, cold liquid in the stack riser, flame-out.
            refs: [D-8101, LIC-8101, P-8101A, P-8101B, FL-8002, FL-8101, LZT-8105, LV-7102]
            modes: [loading, holding]
            safeguards: [SG1, SG2, SG12]
            actions: [A1]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "4", likelihood: B, status: proposed, by: agent, basis: "Burning liquid falling around the derrick; matrix 4 = permanent injury or fatality. B: needs a liquid source and failed pump-out, once in the plant life.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: c7123d4b67bd5af0, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '4', likelihood: B}}}
                - {category: asset, severity: "3", likelihood: B, status: proposed, by: agent, basis: "Stack tip and derrick damage; matrix 3 = plant down for weeks.", band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: 579975b5e9fe3f0e, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '3', likelihood: B}}}
              residual:
                - {category: people, severity: "4", likelihood: A, status: proposed, by: agent, basis: "Agent proposal for the team: one layer credited, I-802 on the independent LZT-8105 (own nozzle, independent of LIC-8101) starting the pumps (since 886b0ad5 both, whichever is not running) and closing LV-7102 (589c9ca7). It covers the LIC-8101 fault, a tripped duty pump and the D-7101 drain; it does not help when the site liquid burner is unavailable or the liquid comes through PV-1110 / XV-1115, and the KO drum hold-up is not confirmed (A1): the team to judge whether one code is justified.", evidence: [control/cause-effect.yaml, control/instrument-list.yaml, DESIGN.md D-025], band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: ddcedc61b5d20d1a, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '4', likelihood: A}}}
            notes: >-
              Before 589c9ca7 LIC-8101 carried both the pump control and the high-high alarm.
              Since 589c9ca7 the independent LZT-8105 and I-802 (D-025 item 6) answer A1 in part.
