        scenarios:
          - id: S40
            cause: >-
              I-811 trips with no flammable cloud at the intake: two of AT-8141A/B/C faulty (a fault
              counts as tripped, so after one fault a single further fault or reading trips), a false
              reading of the point IR heads (spray, condensation, a vehicle exhaust or a solvent at
