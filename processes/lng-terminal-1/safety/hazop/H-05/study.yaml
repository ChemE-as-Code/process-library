            refs: [PZT-8123A, PZT-8123B, PZT-8123C, IA-8001, XS-5100, XS-6100, XS-1100, XV-5101, XV-6101, XV-1111]
            modes: [loading, holding]
            safeguards: [SG19]
            actions: [A20]
            status: proposed
            by: agent
            risk:
