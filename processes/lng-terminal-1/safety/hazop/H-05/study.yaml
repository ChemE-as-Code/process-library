# the hulls, the muster point moved to the platform's north-west corner, no trestle drip tray), then
# to those of commit 709fcf20 (DESIGN.md D-032 items 1-3, 7 and D-016, D-026.1 / .7: the berth O2
# analysers AI-5126 / AI-6126 for I-514 / I-614 and the ESD-1 transfer cause, I-n14 also opening
# XV-4135 / XV-4136 so that I-n13 closes the flare valve, the D-026.1 bound restated, the transfer
