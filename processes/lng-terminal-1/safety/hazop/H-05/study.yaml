            notes: >-
              Revised for f5d925f6 (D-016, D-028 item 1; review 2026-11-05-basic-design-4 #1):
              I-804, the accumulators and the hydraulic ERS valves answer the loss of control at
              loading (the surge of fail-closed valves closing ahead of the pump stop); the tank
