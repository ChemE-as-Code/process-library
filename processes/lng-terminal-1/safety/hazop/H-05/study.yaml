              cuts the LIC-8101 chain to HS-8101B (review 2026-11-05-basic-design-3#5, the chain
              kept) is met at high-high by starting P-8101B directly; it is non-latching and yields
              to I-803. Running both pumps in parallel is S21. Codes kept.
