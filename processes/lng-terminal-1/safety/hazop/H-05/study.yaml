            modes: [startup]
            actions: [A14]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "3", likelihood: C, status: proposed, by: agent, basis: "Pressure release at the arm during a test with people present; matrix 3 = lost-time injury.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: b6fe1208a949a698, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '3', likelihood: C}}}
      - id: N3-NA
        guide_word: "no"
        parameter: flow (instrument air)
        scenarios:
          - id: S16
            cause: Loss of instrument air (compressor or dryer failure at the site, header rupture).
            consequence: >-
              Every pneumatic valve goes to its fail position at once: PV-1110 and PV-1111 closed,
