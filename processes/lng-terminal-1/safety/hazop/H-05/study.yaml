  - id: N4
    title: B-SUB refuge AHU-1 outdoor-air intake gas trip I-811
    design_intent: >-
      Added for ae718797 (D-039 item 6 (b), D-040 item 7 (a); P-08, C&E I-811, instrument list,
      layout/hvac.yaml, not an analysed input). B-SUB, the substation and control building with
      CR-1, is the temporary refuge of the trough phase of the tank-area design fire (D-037.5); its
      gas-tightness rests on this trip. Flammable gas detectors AT-8141A/B/C in the AHU-1 outdoor-air
      intake duct LV1 downstream of the louvre (point IR, ASSUMED, F&G vendor) alarm at 10 % LFL on
      any one and trip at 25 % LFL voted 2oo3 (a detector fault counts as tripped, so the vote
      degrades to 1oo2); I-811 (latching, manual reset once all three read below the alarm) stops the
      AHU-1 fan (UZ-8144, SIS output to its starter, de-energise-to-trip) and closes the gas-tight
      dampers of the intake LV1 (UZ-8142) and the exhaust LV2 (UZ-8143), spring-return, fail closed
      (ASSUMED, HVAC vendor), so the building holds on its stored overpressure and draws in no gas;
      the occupants stay inside or leave by the exit the screening names. Drawn on P-08 as
      stand-alone functions (no HVAC sheet); the hold time of the closed building is the HVAC
      engineer's (ASSUMED); SIL null until the screening (H-06).
