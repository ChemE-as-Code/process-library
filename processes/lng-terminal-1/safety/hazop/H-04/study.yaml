risk_matrix: safety/risk-matrix.yaml
assessment_basis: >-
  Each scenario is rated per category before its safeguards (initial): severity is the credible
  worst outcome if every safeguard fails, likelihood that of the cause. The codes are agent
  proposals with their basis, for the team to accept or change. Residual ratings are proposed
  (by the agent, status proposed) only for the scenarios whose safeguards changed in commit
  589c9ca7 and where a new layer independent of the cause now exists as drawn: the severity is
  kept, the likelihood is lowered by one code per independent layer named in the basis, and
  nothing is credited whose capacity or integrity the files leave open. Where 589c9ca7 removed
  the original cause (S6, S13, S16), the scenario keeps its id and is re-described for the cause
  that remains. Crediting safeguards remains the team's judgement (and a LOPA's where needed).
  The matrix is the example matrix of cheme init (example: true), so the bands are illustrative.
  The revision for commit 54648679 (886b0ad5) adds no scenario and changes no code; it corrects
  the texts on I-705A..C, the D-7101 fire relief case and the de-inerting switch. The revision
  for commit f5d925f6 (D-028) adds no scenario and changes no code: the air-failure response
  (S3), the make-up and spray sources (S6, S10), the oxygen routes (S7) and the compressor
  start (S16, S23) are re-described in place; the new deviations of the air-header trip are
  analysed in H-01 S21, H-03 S25 and H-05 S24, S25.
team: []            # to be named by the project; no team has sat on this draft yet
notes: >-
  Drafted by an agent (skills hazop-study, hazop-equipment-causes, relief-scenarios,
  safeguard-crediting). K-7101B and K-7101C are identical to K-7101A: scenarios name the A
  machine. Fail positions are those of control/loops.yaml and, for the valves added in
  589c9ca7, of the instrument list (XV-1115, XV-7123A..C and XV-7130 fail closed, XV-7125A..C
  fail open); the fail position of XV-7121A..C was not in the files at 589c9ca7 and is given as
  fail closed by D-026 item 5 (fac0bbb5). The fac0bbb5 revision rates the new scenario S25 before
  safeguards only; S13 and S14 keep their ids and are re-described without the removed D-7101 relief valve.
  Since 886b0ad5 the de-inerting switch on P-04 has XV-4135 / XV-4136 fail open and XV-4131 /
  XV-4132 fail closed (D-026 item 1).
nodes:
  - id: N1
    title: Tank vapour header BOG-1001 with pressure control to the flare and make-up gas
    design_intent: >-
      Collect the tank BOG (BOG-1001 from T-2101, BOG-1003 from T-3101) and the carrier's return
      (BOG-4001 / BOG-4002) at about 14 kPa(g); PIC-1110 sets the compressor load (0-50 %) and
      opens PV-1110 (fails closed) to the flare header FL-8001 (50-100 %); the tank high-high
      trips I-203 / I-303 open the SIS vent XV-1115 (fail closed, energise-to-trip, own air
      accumulator) in the bypass FL-1001 of PV-1110; PIC-1111 admits fuel gas from the trains
      (FG-1001, through the restriction orifice FO-1117 and PV-1111, fails closed) below 6 kPa(g)
      (D-017, D-025 item 1). No isolation valve is drawn between the tanks, the header and D-7101
      (BOG-1001, DN 750), so the tank relief valves PSV-2131A/B/C / PSV-3131A/B/C also protect
      D-7101 and its suction header (D-026 item 12); no check valve or battery-limit isolation is
      drawn on FG-1001.
    members: [BOG-1001, BOG-1003, BOG-4001, BOG-4002, PIC-1110, PV-1110, FL-8001, PIC-1111, PV-1111, FG-1001, FO-1117, XV-1115, UZ-1115, FL-1001, TI-1112]
    status: proposed
    by: agent
    deviations:
      - id: N1-HP
        guide_word: more
        parameter: pressure
        scenarios:
          - id: S1
            cause: >-
              PV-1111 sticks open or PIC-1111 fails low (reads a low pressure): since 589c9ca7 the
              trains' fuel gas at its supply pressure (not in the files) flows through FG-1001, the
              restriction orifice FO-1117 and PV-1111 into the tank vapour header (no battery-limit
              isolation or check valve drawn on FG-1001). Before 589c9ca7 the source was compressed
              BOG from BOG-7002 through BOG-1009 (removed).
            consequence: >-
              A pressurised source into tanks designed for +29 kPa(g): the header and tank
              pressure rise beyond what PV-1110 can vent; PSV-2131A/B/C and PSV-3131A/B/C vent to
              atmosphere; above their capacity the tank roof is overpressured.
            refs: [PV-1111, PIC-1111, FG-1001, FO-1117, T-2101, XV-1115]
            modes: [holding, loading]
            safeguards: [SG1, SG2, SG3, SG23]
            actions: [A1]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "4", likelihood: B, status: proposed, by: agent, basis: "Atmospheric venting from the tank tops, possible roof damage; matrix 4 = permanent injury or fatality. B: a control valve stuck open, once in the plant life.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: c7123d4b67bd5af0, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '4', likelihood: B}}}
                - {category: asset, severity: "4", likelihood: B, status: proposed, by: agent, basis: "Tank roof overpressure; matrix 4 = loss of the unit.", band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: f33c22768a8b83e6, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '4', likelihood: B}}}
              residual:
                - {category: people, severity: "4", likelihood: A, status: proposed, by: agent, basis: "Agent proposal for the team: one layer credited, I-203 / I-303 opening the SIS vent XV-1115 (589c9ca7), independent of PIC-1111 / PV-1111 (the cause) and of PV-1110. FO-1117 is not credited until its size and the fuel-gas pressure are stated (A1).", evidence: [control/cause-effect.yaml, piping/line-list.yaml, DESIGN.md D-025], band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: ddcedc61b5d20d1a, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '4', likelihood: A}}}
                - {category: asset, severity: "4", likelihood: A, status: proposed, by: agent, basis: "As the people residual: XV-1115 credited as one layer.", evidence: [control/cause-effect.yaml], band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: eca0767de9ee2296, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '4', likelihood: A}}}
            notes: >-
              At 589c9ca7 the relief case 'control valve failure open' (skill relief-scenarios)
              was not among the relief cases of PSV-2131A/B/C. Since fac0bbb5 (D-026 item 8) the
              fuel gas blow-by through FO-1117 with PV-1111 failed open is a relief case of
              PSV-2131A/B/C and PSV-3131A/B/C (special items) and on the detail-stage relief sizing
              list; the PSVs are not credited until sized (A1).
          - id: S2
            cause: >-
              Carrier's return above the design (warm carrier tanks, carrier cooldown, the
              carrier's return-gas compressor ramped faster than the 1 h of S-01) or a second
              compressor not started in time (SEQ-LOAD S4).
            consequence: Header pressure rises; PV-1110 flares the excess; with PV-1110 failed, as H-01 S11.
            refs: [BOG-4001, PIC-1110, PV-1110, K-7101B]
            modes: [loading, cooldown]
            safeguards: [SG4, SG2]
            status: proposed
            by: agent
            notes: >-
              Since 886b0ad5 SEQ-LOAD S4 carries the two arm line-ups of D-026 item 6 and still
              starts K-7101B during the ramp-up; D-026 item 6 keeps the 45.6 t/h of D-009 as the
              compressor envelope (line-up (b) ~34 t/h, ASSUMED until carrier data). Codes kept.
            risk:
              initial:
                - {category: environment, severity: "2", likelihood: C, status: proposed, by: agent, basis: "Flaring above the routine limit of the permit (S-02); matrix 2 = minor release off site.", band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: 286f676bb8108832, inputs: {matrix: b6caa11838fe6bc7, category: environment, severity: '2', likelihood: C}}}
          - id: S3
            cause: >-
              Loss of instrument air (common cause): PV-1110 and PV-1111 fail closed, the anti-surge
              valves UV-7104A..C and the recycle isolation XV-7125A..C fail open, and since 589c9ca7
              the discharge isolation XV-7123A..C and the battery-limit valve XV-7130 fail closed,
              TV-7103 and LV-7102 fail closed; since fac0bbb5 the suction valves XV-7121A..C fail
              closed too. Since f5d925f6 (D-028 item 1, F-AIR rewritten) the air-header trip I-804
              (PZT-8123A/B/C, 2oo3) acts first: ESD-1 of both berths and the rundown trip I-102.
            consequence: >-
              The BOG has no outlet through the compressors or PV-1110: the fail-closed suction
              valves leave the open position and I-705A..C stop every running machine (discharge
              XV-7123x closed, recycles open), as F-AIR now states; the tank pressure rises on the
              boil-off; since 589c9ca7 I-203 / I-303 open XV-1115 from its own air accumulator to
              the flare; if that fails, the tanks reach PSV-2131A/B/C / PSV-3131A/B/C and cold BOG is
              vented to atmosphere for as long as the air is lost. Since f5d925f6 I-804 stops the
              loading and trips the carrier, so the carrier's return ends with the line pack, and
              the fill stops once the fill valves have closed (at least 30 s), after which the
              vapour it displaced ends too; the trains are tripped through XS-1100, so the make-up
              fuel gas FG-1001 may be lost as well (S6).
            refs: [PV-1110, UV-7104A, UV-7104B, UV-7104C, XV-7123A, XV-7130, XV-1115, PSV-2131A, PI-8122, PZT-8123A, XV-7121A]
            safeguards: [SG2, SG3, SG5, SG29]
            actions: [A2]
            notes: >-
              Revised for f5d925f6 (D-028 items 1, 7; control/philosophy.md F-AIR): the response to
              an air failure is now stated from the fail positions and the C&E, including the
              compressor stop by I-705A..C and I-804 stopping the loading and the fill. I-804 removes
              the carrier's return and the fill displacement from the load but not the boil-off, so
              it is not counted as a layer against the tank PSV venting; the codes and the
              residual are kept.
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "4", likelihood: C, status: proposed, by: agent, basis: "Prolonged cold methane venting at the tank tops; matrix 4. C: instrument air failures occur several times in the plant life.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: ac0a4b03e3d8d0c2, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '4', likelihood: C}}}
                - {category: environment, severity: "3", likelihood: C, status: proposed, by: agent, basis: "Methane release; matrix 3 = reportable release.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: 1fb9317519cce7ee, inputs: {matrix: b6caa11838fe6bc7, category: environment, severity: '3', likelihood: C}}}
              residual:
                - {category: people, severity: "4", likelihood: B, status: proposed, by: agent, basis: "Agent proposal for the team: one layer credited, I-203 / I-303 opening XV-1115 from its own air accumulator (589c9ca7, control/philosophy.md F-AIR), which the loss of the air header does not defeat. Still high: the accumulator's duration against the length of an air outage, the SIS power supply and the vent capacity are not in the files (A2, A3).", evidence: [control/philosophy.md, control/instrument-list.yaml, DESIGN.md D-025], band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: c7123d4b67bd5af0, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '4', likelihood: B}}}
                - {category: environment, severity: "3", likelihood: B, status: proposed, by: agent, basis: "As the people residual; flaring through XV-1115 instead of venting.", evidence: [control/philosophy.md], band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: 92790e212f41fb89, inputs: {matrix: b6caa11838fe6bc7, category: environment, severity: '3', likelihood: B}}}
          - id: S4
            cause: Power failure (6.6 kV) stops all BOG compressors and the in-tank pumps.
            consequence: >-
              All BOG goes to the flare through PV-1110 (if air and the control system remain); at
              loading the cumulative load (carrier return, boil-off, line flash) may exceed the
              ~54 t/h design case of FL-8001 / D-8101 (D-017); without PV-1110, tank PSV venting.
            refs: [K-7101A, K-7101B, PV-1110, FL-8001, XV-1115]
            modes: [loading, holding]
            safeguards: [SG4, SG3]
            actions: [A3]
            notes: >-
