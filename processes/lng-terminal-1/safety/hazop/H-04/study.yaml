  - {id: SG6, title: "PIC-1111 / PV-1111 make-up gas from the trains' fuel gas FG-1001 through FO-1117", kind: control, refs: [PIC-1111, PV-1111, FG-1001, FO-1117], status: proposed, by: agent, notes: "Source changed in 589c9ca7 (BOG-1009 removed); regulatory, not credited in the C&E."}
  - {id: SG7, title: "Interlocks I-204 / I-304: tank PALL stops the loading pumps and the compressors", kind: interlock, interlock: I-204, refs: [PZT-2112, K-7101A], status: proposed, by: agent, notes: "Since 589c9ca7 it no longer opens PV-1111; it does not close XV-1115 (S20) or XV-4131 / XV-4132 (H-02 S16)."}
  - {id: SG8, title: "Tank vacuum relief valves PSV-2133A/B/C, PSV-3133A/B/C", kind: relief, refs: [PSV-2133A, PSV-2133B, PSV-2133C, PSV-3133A, PSV-3133B, PSV-3133C], status: proposed, by: agent}
  - {id: SG9, title: "Arm purge to below 1 % O2 before cooldown and de-inerting to the flare (SEQ-LOAD S2, D-017)", kind: procedural, refs: [HV-5151], status: proposed, by: agent}
  - {id: SG10, title: "LIC-7102 / LV-7102 drain of D-7101 to D-8101", kind: control, refs: [LIC-7102, LV-7102], status: proposed, by: agent}
  - {id: SG11, title: "Interlock I-701: LZT-7106 high-high stops K-7101A/B/C and closes XV-7121A/B/C and XV-7123A/B/C", kind: interlock, interlock: I-701, refs: [LZT-7106, XV-7121A, XV-7121B, XV-7121C, XV-7123A, XV-7123B, XV-7123C], status: proposed, by: agent}
  - {id: SG12, title: TIC-7103 suction temperature control and indication, kind: control, refs: [TIC-7103, TV-7103], status: proposed, by: agent, notes: "The cause in S8 and S10 is its failure."}
  - {id: SG13, title: TI-7107 discharge temperature indication, kind: other, refs: [TI-7107], status: proposed, by: agent}
  - {id: SG14, title: "LIC-8101 KO drum level and the flare (D-8101 designed for the drum pressure)", kind: mechanical, refs: [D-8101, LIC-8101], status: proposed, by: agent}
  - {id: SG15, title: "XV-7121A suction ESD valve, closed by I-701 / I-702 / I-703A", kind: interlock, interlock: I-702, refs: [XV-7121A, VZ-7110A], status: proposed, by: agent, notes: "Not closed on a normal stop according to the C&E and SEQ-BOG-START; no longer used in S13 since 589c9ca7 (the back flow path now runs through the recycle upstream of the check valve)."}
