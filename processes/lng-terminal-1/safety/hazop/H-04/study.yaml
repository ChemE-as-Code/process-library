  - {id: SG22, title: "Interlock I-702 closes XV-7121A and XV-7123A on a machine trip", kind: interlock, interlock: I-702, refs: [XV-7121A, XV-7123A], status: proposed, by: agent, notes: "K-7101B / C: I-702B, I-702C."}
  - {id: SG23, title: Restriction orifice FO-1117 on the make-up FG-1001, kind: mechanical, refs: [FO-1117, FG-1001], status: proposed, by: agent, notes: "Added in 589c9ca7; its size and the fuel-gas pressure are not in the files, so it limits the S1 flow by an unknown amount (A1)."}
  - {id: SG24, title: "De-inerting switch to the flare at the tank end: AI-4133 / AI-4134 with I-511 / I-611 (XV-4131 / XV-4135, XV-4132 / XV-4136)", kind: interlock, interlock: I-511, refs: [AI-4133, AI-4134, XV-4131, XV-4132], status: proposed, by: agent, notes: "Added in 589c9ca7 on P-04 (analysed in H-02 N3); single analyser, SIL null. Since 886b0ad5 I-511 / I-611 do not act while ESD-1 is tripped, the flare valves XV-4131 / XV-4132 fail closed and the tank-side XV-4135 / XV-4136 fail open, so ESD-1 and an air failure send the vapour to the tanks (H-02 S20, S21); I-514 / I-614 reject vapour above 5 vol % O2 at the berth."}
  - {id: SG25, title: "Discharge isolation XV-7123A..C (fail closed), closed with XV-7121A..C on a trip (I-701, I-702 / I-702B / I-702C, I-703A..C)", kind: interlock, interlock: I-703A, refs: [XV-7123A, XV-7123B, XV-7123C], status: proposed, by: agent, notes: "Added in 589c9ca7; the instrument list says it closes on a stop too, the C&E only on trips (A9)."}
  - {id: SG26, title: "Interlock I-704: all BOG compressors stopped close the battery-limit ESD valve XV-7130", kind: interlock, interlock: I-704, refs: [K-7101A, K-7101B, K-7101C, XV-7130], status: proposed, by: agent, notes: "Added in 589c9ca7 (D-025 item 5): keeps the trains' system from back-feeding the stopped machines and the tanks."}
  - {id: SG27, title: "Interlocks I-703A..C: discharge temperature high-high TZT-7112A..C stops the machine and closes XV-7121x / XV-7123x", kind: interlock, interlock: I-703A, refs: [TZT-7112A, TZT-7112B, TZT-7112C], status: proposed, by: agent, notes: "Added in 589c9ca7 (D-025 item 5), independent of TIC-7103 and TI-7107."}
  - {id: SG28, title: "Interlocks I-705A..C: ZSO-7121x not open or PZT-7113 suction header low-low stops the running machine and closes XV-7123x", kind: interlock, interlock: I-705A, refs: [ZSO-7121A, ZSO-7121B, ZSO-7121C, PZT-7113, XV-7123A], status: proposed, by: agent, notes: "Added in fac0bbb5 (D-026 item 5); the recycle XV-7125x stays open; since 886b0ad5 it acts only while the machine runs (no start bypass) and the PZT-7113 path has a 5 s on-delay, PZT-7113 1oo1; SIL null. Its spurious action is S25."}
  - {id: SG29, title: "Interlock I-804: instrument-air header low-low PZT-8123A/B/C (2oo3) initiates ESD-1 of both berths and the rundown trip I-102, which ends the carrier's return and the fill on an air failure", kind: interlock, interlock: I-804, refs: [PZT-8123A, PZT-8123B, PZT-8123C], status: proposed, by: agent, notes: "Added in f5d925f6 (D-028 item 1; P-08); latching, manual reset, SIL null. It does not act on the BOG compressors, which I-705A..C stop, or on the tank pressure (S3)."}
actions:
  - {id: A1, status: proposed, by: agent, text: "Relief study / P&ID P-01 change: add 'PV-1111 fully open with the BOG-7002 and trains' pressure behind it' as a relief case of the tanks and the header, or limit the make-up flow below the PV-1110 and PSV capacity (restriction orifice on BOG-1009, smaller trim), and consider a high-high header pressure trip that closes a separate make-up ESD valve.", response: "Partly answered by commit 589c9ca7 (D-025 item 1): the make-up source is now the trains' fuel gas FG-1001 with a restriction orifice FO-1117 ahead of PV-1111 (BOG-1009 removed), and I-203 / I-303 open the SIS vent XV-1115 independent of PV-1110. Still open: the size of FO-1117 and the fuel-gas pressure against the PV-1110 / XV-1115 and PSV capacity, the relief case 'PV-1111 fully open', and a trip that closes the make-up on high-high pressure (I-203 does not act on PV-1111). Commit fac0bbb5 (DESIGN.md D-026 item 8) adds the fuel gas blow-by through FO-1117 with PV-1111 failed open to the relief cases of PSV-2131A/B/C and PSV-3131A/B/C (special items) and to the detail-stage relief sizing list. Still open: the FO-1117 size and fuel-gas pressure, the sizing itself, and a make-up trip on high-high pressure. Still proposed."}
  - {id: A2, status: proposed, by: agent, text: "Utility failure review: give PV-1110 and the anti-surge valves an assured action on loss of instrument air (air receivers or accumulators, or review the PV-1110 fail position) so that the BOG keeps an outlet other than the tank PSVs; add a low instrument-air pressure alarm and action on PI-8122 to the C&E.", response: "Partly answered by commit 589c9ca7 (D-025 item 1, control/philosophy.md F-AIR): the SIS vent XV-1115 opens on I-203 / I-303 from its own air accumulator, PV-1110 stays fail closed on purpose (a fail-open vent with the fail-closed make-up would depressurise the tanks), the recycle isolation XV-7125A..C fails open. Still open: the accumulator duration, the PSV relief case for the utility failure (named, sizing not done, D-025), and a low instrument-air alarm and action on PI-8122. Partly answered by commit f5d925f6 (D-016, D-028 item 1, F-AIR rewritten): PI-8122 has a low alarm and the trip PZT-8123A/B/C (2oo3, I-804) initiates ESD-1 of both berths and the rundown trip before the valves move; the liquid-path valves hold on accumulators; F-AIR states the compressor stop by I-705A..C. Still open: an assured outlet for the BOG other than XV-1115 and the tank PSVs on a long air outage (PV-1110 and the compressors are lost together), the XV-1115 accumulator duration, and the PSV sizing for the utility failure. Still proposed."}
  - {id: A3, status: proposed, by: agent, text: "Flare study: size FL-8001 / D-8101 / FL-8101 for the cumulative load of the common-cause cases (power failure at loading: carrier return, boil-off, line flash, cooldown vapour, PSV-7111), not only the ~54 t/h compressor trip (D-017), and list which loads are on UPS (control system, PV-1110 solenoid, ship-shore link)."}
  - {id: A4, status: proposed, by: agent, text: "P&ID P-07 / P-01 change: give the make-up a source that does not depend on the running compressors (e.g. from the trains' fuel gas header through a pressure reducing station, with the battery-limit connection drawn), or show and confirm that BOG-7002 stays pressurised from the trains after I-204 / I-304; record the answer in DESIGN.md D-017.", response: "Answered in the design by commit 589c9ca7 (D-025 item 1; review #13): the make-up comes from the trains' fuel gas FG-1001 (battery-limit off-page drawn on P-01) through FO-1117 and PV-1111, independent of the BOG compressors; BOG-1009 removed; recorded in DESIGN.md D-025. For the team to verify and close; the fuel-gas capacity and availability are followed in A17."}
  - {id: A5, status: proposed, by: agent, text: "Consider an O2 analyser on the BOG header upstream of D-7101 with an alarm and compressor trip, and show the carrier de-inerting route to the flare (D-017 says to the storage and loading flare; no connection is drawn).", response: "Partly answered by commit 589c9ca7 (D-025 item 3; review #19): the de-inerting route BOG-4013 / BOG-4014 to D-8101 is drawn, switched by XV-4131 / XV-4135 (XV-4132 / XV-4136) on the analysers AI-4133 / AI-4134 (I-511 / I-611). Still open: an O2 measurement on the BOG header upstream of D-7101 with a compressor trip (air after a vacuum relief lift is not covered)."}
  - {id: A6, status: proposed, by: agent, text: "Determine the required integrity of I-701 (single LZT-7106) as the only layer against carry-over to all three machines; consider a high-high spray / low suction temperature cut-out that closes TV-7103 independently of TIC-7103."}
  - {id: A7, status: proposed, by: agent, text: "State the spray source during loading (circulation pump running, or the loading header back-feeding LNG-2002) in SEQ-LOAD and SEQ-BOG-START, and add a high suction temperature alarm / trip on the compressor inlet independent of TIC-7103.", response: "Mostly answered by commit 589c9ca7: SEQ-LOAD S0 starts the circulation pump P-2102 and states that it keeps the desuperheater spray during loading; the discharge temperature trips TZT-7112A..C / I-703A..C act independently of TIC-7103 (D-025 item 5). Not done: a suction temperature alarm; SEQ-BOG-START does not name the spray source. For the team to judge whether the discharge trip suffices and to close."}
  - {id: A8, status: proposed, by: agent, text: "P&ID P-07 change: move the anti-surge take-off upstream of the discharge check valve CV7122A..C, or add a discharge ESD valve / second check valve downstream of the recycle tee, so that the discharge header cannot back-flow through an open UV-7104 into the suction; add an ESD valve or check valve at the battery limit on BOG-7002.", response: "Answered in the design by commit 589c9ca7 (D-025 item 5; review #10, #11): each discharge check valve CV7122A..C is downstream of its recycle tee, the discharge isolation XV-7123A..C (fail closed) follows it, and the battery-limit ESD valve XV-7130 (fail closed) on BOG-7002 is closed by I-704 when all machines have stopped. For the team to verify and close; S13, S19 re-rated."}
  - {id: A9, status: proposed, by: agent, text: "C&E / sequence change: close XV-7121A..C (and a discharge isolation, if added) on every compressor stop, not only on I-701 / I-702, and add the normal stop to SEQ-BOG-START or a stop sequence.", response: "Partly answered by commit 589c9ca7: XV-7123A..C close with XV-7121A..C on every trip (I-701, I-702 / I-702B / I-702C, I-703A..C), and the instrument list (UZ-7123A..C) says they close on a stop as well. Still open: the normal stop in the C&E or a stop sequence, and the opening of XV-7123A..C in SEQ-BOG-START. Commit fac0bbb5 (D-026 item 5) adds I-705A..C: a running machine stops and its XV-7123x closes when ZSO-7121x loses the open position of the fail-closed suction valve or PZT-7113 reads the suction header low-low, so a suction valve closing on a running machine now has its own trip (S15; spurious action S25). The normal stop is still not in the C&E or a stop sequence, and SEQ-BOG-START still does not open XV-7123x. Commit f5d925f6 (D-028 item 10) adds the opening of XV-7123x and XV-7130 with their proof to SEQ-BOG-START S2. Still open: the normal stop in the C&E or a stop sequence (closing XV-7121x / XV-7123x). Still proposed."}
  - {id: A10, status: proposed, by: agent, text: "Relief study: restate the relief case and set pressure of the D-7101 suction system relief valve (2.5 barg at the revision analysed; removed in fac0bbb5) for a suction system that cannot be isolated from tanks designed for +29 kPa(g): fire on D-7101 and back flow from the discharge (S13) are the credible cases.", response: "Answered by commit 589c9ca7 (review #26) with the relief case restated as fire on D-7101 and the suction header. Commit fac0bbb5 (DESIGN.md D-026 item 12; review 2026-11-05-basic-design-2, previous #26) removes that relief valve and its flare line from P-07, P-08 and the special items: D-7101 and BOG-1001 (DN 750) have no valve to the tanks, so neither a blocked outlet nor a fire raises them above the tank pressure; fire vapour vents back to the tank vapour space and PSV-2131A/B/C / PSV-3131A/B/C protect the drum (3.5 barg design). Still open for the team: whether the D-7101 fire load is in the tank PSV relief cases (not named in the special items) and the S13 back flow, which the tank PSVs alone face. Commit 886b0ad5 (review 2026-11-05-basic-design-3#9) names fire on D-7101 and the BOG suction header among the relief cases of PSV-2131A/B/C and PSV-3131A/B/C (special items), which answers the first point in the files; the sizing is not done at basic (D-025). Still open: the S13 back flow from the discharge, which is not among the tank PSV relief cases. Still proposed."}
  - {id: A11, status: proposed, by: agent, text: "P&ID P-07 change: route the anti-surge recycle upstream of the desuperheater (or add a recycle cooler), and add a high discharge temperature alarm and trip (TI-7107 is an indication) to the C&E.", response: "Answered in the design by commit 589c9ca7 (D-025 item 5; review #9): the recycles BOG-7008 / BOG-7009 / BOG-7012 return to BOG-1001 upstream of the spray TV-7103; discharge temperature trips TZT-7112A..C with I-703A..C. For the team to verify and close; S10, S16 re-rated."}
  - {id: A12, status: proposed, by: agent, text: "Consider a high discharge pressure alarm / trip on PI-7108 that unloads or stops the compressors before PSV-7111 lifts, with the trains informing the terminal of a stop of their BOG intake.", response: "Partly answered by commit fac0bbb5 (D-026 item 5): the vendor unit control panel trips summarised as VZ-7110x in I-702 / I-702B / I-702C include a discharge pressure high-high below the PSV-7111 set point, to be confirmed with the vendor. Still open: the trip point, whether it is a vendor or a terminal function, and the trains' signal of a stop of their BOG intake. Still proposed."}
  - {id: A13, status: proposed, by: agent, text: "Show the compressor seal gas supply (N2), its low-pressure trip and the seal vent destination on P-07, or reference the vendor P&ID in the sheet notes.", response: "Partly answered by commit fac0bbb5 (D-026 items 5, 9): I-702 / I-702B / I-702C name dry gas seal leakage and seal gas low differential pressure among the vendor trips; the seal gas and N2 purge points stay in the vendor package and are not drawn at basic (D-020 lists them as N2 users). Still open: the seal vent destination and a reference to the vendor P&ID on P-07. Still proposed."}
  - {id: A14, status: proposed, by: agent, text: "Determine the required integrity of I-204 / I-304 (SIL null in the C&E) for the compressor over-draw case, and consider a minimum suction pressure limit on the inlet guide vanes that does not depend on PIC-7101 or its PIC-1110 setpoint."}
  - {id: A15, status: proposed, by: agent, text: "Size the D-7101 liquid hold-up and the drain LV-7102 / DR-7001 (DN 50) for the largest credible liquid slug from the vapour return (D-5101 overflow, hybrid arm misline-up, thermal relief discharges), or show that these sources are removed by the H-03 actions.", response: "Partly answered by commit 589c9ca7 (D-025 item 4): of the sources, the open header drain is replaced by XV-5161 / XV-6161 with I-506 / I-606, and the hybrid arm misline-up by I-504 / I-505 (I-604 / I-605). Still open: the D-7101 hold-up and the LV-7102 / DR-7001 drain capacity for the remaining sources (thermal relief discharges now also from PSV-1122 / 1123 / 4113 / 4114, tank overfill, D-5101 relief inflow H-03 S21)."}
  - {id: A16, status: proposed, by: agent, text: "Confirm with the compressor vendor the anti-surge response time and a surge detection / trip independent of UIC-7104A..C, the turndown of one 27 t/h machine against the 21.9 t/h holding BOG, and add the vendor trips to the C&E (I-702 lists only vibration and bearings).", response: "Partly answered by commit fac0bbb5 (D-026 item 5): I-702 / I-702B / I-702C now name the vendor unit control panel trips (vibration and bearing temperature, dry gas seal, lube oil, motor protection, discharge pressure high-high), to be confirmed with the vendor in detail engineering. Still open: the anti-surge response time, a surge detection or trip independent of UIC-7104A..C, and the turndown of one machine against the holding BOG. Still proposed."}
  - {id: A17, status: proposed, by: agent, text: "Confirm with the trains the fuel-gas supply to FG-1001: pressure, capacity against the largest withdrawal (full loading rate from one tank, compressor draw), availability when I-101 / I-102 trip the trains, and the size of FO-1117 (D-025 lists the fuel-gas capacity as not done at basic); if the make-up can be lost with the trains, state which layer protects the tanks then (I-204 / I-304, the vacuum valves)."}
  - {id: A18, status: proposed, by: agent, text: "P&ID P-01 change / interface: consider a check valve and a battery-limit isolation on FG-1001 so that tank vapour cannot back-flow into a depressurised fuel gas system, and state the composition and temperature of the make-up fuel gas at the battery limit (S21, S22)."}
  - {id: A19, status: proposed, by: agent, text: "Sequence / C&E change: make 'recycle isolation XV-7125A..C open' (a position switch) a start permissive of SEQ-BOG-START, and add the opening of the discharge isolation XV-7123A..C and the trip I-703A..C to its steps and abort conditions.", response: "Partly answered by commit fac0bbb5 (control/sequences.yaml SEQ-BOG-START): S1 now begins with 'XV-7125A (recycle isolation) proven open' by the operator before XV-7121A opens and K-7101A starts, and I-703A and I-705A are in its interlocks and abort condition. Still open: the check is procedural (no position switch on XV-7125A..C is drawn, and it is not a permissive), and the opening of XV-7123A..C is not a step. Commit f5d925f6 (D-028 item 10) makes the opening of XV-7123x (proven by the actuator's feedback, vendor) and of XV-7130 a step of S2 with a time-out. Still open: a position switch and a start permissive for XV-7125A..C, and a position switch for XV-7123A..C. Still proposed."}
  - {id: A22, status: proposed, by: agent, text: "C&E / instrument list: consider voting the suction header low-low of I-705A..C (two or three transmitters instead of the single PZT-7113, which stops every running machine on one fault), a short confirmation delay on the ZSO-7121x 'not open' signal against contact bounce, and state how the SEQ-BOG-START S1 bypass of I-705x is removed (automatically once ZSO-7121x proves open) (S25).", response: "Partly answered by commit 886b0ad5 (review 2026-11-05-basic-design-3#6): the bypass is no longer needed, since I-705A..C act only while their machine runs; the PZT-7113 path has a 5 s on-delay. Still open: the voting of the suction header low-low (PZT-7113 stays 1oo1, its voting set in the SIL screening) and a confirmation delay on the ZSO-7121x 'not open' path (none in the C&E). Still proposed."}
  - {id: A20, status: proposed, by: agent, text: "Lock or car-seal the depressurising vents HV-7124A..C closed in operation and put them on the maintenance isolation list of each machine."}
  - {id: A21, status: proposed, by: agent, text: "C&E / relief study: limit the consequence of a spurious opening of XV-1115 - close XV-1115 on low tank pressure (I-204 / I-304 overriding I-203) or limit its capacity, consider 2oo3 transmitters for I-203 / I-303 against spurious trips, and include 'XV-1115 open with the make-up limited by FO-1117' in the vacuum relief case of PSV-2133A/B/C / PSV-3133A/B/C (H-01 A13)."}
