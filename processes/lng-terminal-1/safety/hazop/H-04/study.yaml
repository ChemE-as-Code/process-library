# HAZOP study H-04: a DRAFT until the team has accepted every entry and a
# human review record covers it (cheme safety hazop check). Schema: cheme schema
# hazop-study; workflow: safety/README.md and the skill hazop-study.
# Drafted by an agent from the plant as drawn (P-07, P-01 rev A, C&E, loops,
# sequences, special items) and revised by an agent to the P&IDs, C&E and sequences of
# commit 589c9ca7 (DESIGN.md D-025), then to those of commit fac0bbb5 (DESIGN.md D-026:
# PSV-7105 and FL-7001 removed, ZSO-7121A-C and PZT-7113 with I-705A-C, the vendor trips in
# I-702, XV-7125x proven open in SEQ-BOG-START), then to those of commit 54648679 (the response to
# review 2026-11-05-basic-design-3 in commit 886b0ad5: I-705A-C only on a running machine, PZT-7113
# 1oo1 with a 5 s on-delay, fire on D-7101 in the PSV-2131/3131 relief cases, XV-4131/4132 fail
# closed and I-511/611 not on ESD-1, I-514/614; the core 1.7.0 regeneration in 54648679 changed
# the drawing only), then to those of commit f5d925f6 (DESIGN.md D-028: the instrument-air trip
# I-804 and the rewritten control philosophy F-AIR, the rundown link XS-1100, SEQ-BOG-START S2
# opening and proving XV-7123x and XV-7130, I-201 / I-301 stopping the circulation pumps that feed
# the desuperheater spray, I-514 / I-614 2oo2 and mode-armed; the P-01 and P-07 changes are
# drawing positions of UZ-1115 / XV-1115, UZ-7125C and ZSO-7121A-C). Every entry is a proposal
# for the team.
schema: cheme/hazop-study/v1
kind: hazop-study
id: H-04
title: Tank vapour header, BOG desuperheater and compressors
scope: >-
  Detail-stage HAZOP of the tank vapour header on P-01 (BOG-1001 with BOG-1003, the vapour
  returns BOG-4001 / BOG-4002, the split-range pressure control PIC-1110 / PV-1110 to the flare
  header FL-8001, since 589c9ca7 the SIS vent XV-1115 in its bypass FL-1001, and the make-up
  PIC-1111 / PV-1111, since 589c9ca7 from the trains' fuel gas FG-1001 through FO-1117 instead of
  BOG-1009, removed) and of the BOG system on P-07: desuperheater TV-7103 (TIC-7103), suction
  drum D-7101 (LIC-7102 / LV-7102, LZT-7106; open to the tanks without a relief valve of its own
  since fac0bbb5, D-026 item 12), compressors K-7101A/B/C with anti-surge
  UIC-7104A..C / UV-7104A..C and, since 589c9ca7, the recycle isolation XV-7125A..C (fail open)
  returning upstream of the desuperheater (BOG-7008, BOG-7009, BOG-7012), suction ESD valves
  XV-7121A..C with, since fac0bbb5, their open-position switches ZSO-7121A..C and the suction
  header low-low PZT-7113 (I-705A..C), discharge isolation XV-7123A..C, depressurising vents
  HV-7124A..C (FL-7003..FL-7005), machine protection VZ-7110A..C (vendor unit control panel
  trips, I-702, I-702B, I-702C), discharge temperature trips
  TZT-7112A..C (I-703A..C), discharge header BOG-7002 with PSV-7111 and the battery-limit ESD
  valve XV-7130 (I-704) to the trains. The tank pressure deviations as seen by the tanks are in
  H-01; the carrier de-inerting switch on P-04 in H-02; the flare and KO drum in H-05. Not covered: the trains' end-flash / fuel gas system beyond the battery limit, the
  compressor vendor packages (lube oil, seal gas, motors), shown only as causes.
modes:
  - {id: holding, title: Holding, description: "One compressor takes ~21.9 t/h of tank BOG (D-009, D-010)."}
  - {id: loading, title: Loading, description: "Two compressors take 49.1 t/h with the carrier's return at about -120 degC, desuperheated to -140 degC (D-009, D-010)."}
  - {id: cooldown, title: Cooldown, description: "Carrier and arm cooldown vapour, warmer and variable, through the vapour return."}
  - {id: startup, title: Start-up and shutdown, description: "Compressor start on full recycle and loading (SEQ-BOG-START), stop and trip."}
