      operator after I-704 has reset) before PIC-7101 goes to auto, with a 30 min time-out; on
      an air failure F-AIR now has I-705A..C stop every running machine.
    members: [K-7101A, K-7101B, K-7101C, UIC-7104A, UV-7104A, UIC-7104B, UV-7104B, UIC-7104C, UV-7104C, XV-7121A, XV-7121B, XV-7121C, VZ-7110A, VZ-7110B, VZ-7110C, BOG-7001, BOG-7002, BOG-7008, BOG-7009, BOG-7012, PSV-7111, PI-7108, TI-7107, FI-7109, XV-7123A, XV-7123B, XV-7123C, XV-7125A, XV-7125B, XV-7125C, HV-7124A, HV-7124B, HV-7124C, FL-7003, FL-7004, FL-7005, TZT-7112A, TZT-7112B, TZT-7112C, XV-7130, ZSO-7121A, ZSO-7121B, ZSO-7121C, PZT-7113]
