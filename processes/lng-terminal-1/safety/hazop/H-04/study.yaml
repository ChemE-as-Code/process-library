  - {id: SG2, title: "Interlocks I-203 / I-303: tank PAHH opens the SIS vent XV-1115 to the flare and stops the fill", kind: interlock, interlock: I-203, refs: [PZT-2112, XV-1115], status: proposed, by: agent, notes: "Since 589c9ca7 its own final element XV-1115 (fail closed, energise-to-trip, own air accumulator), independent of PIC-1110 / PV-1110; I-303 alike for T-3101."}
  - {id: SG3, title: "Tank relief valves PSV-2131A/B/C, PSV-3131A/B/C to atmosphere", kind: relief, refs: [PSV-2131A, PSV-2131B, PSV-2131C, PSV-3131A, PSV-3131B, PSV-3131C], status: proposed, by: agent}
  - {id: SG4, title: "PIC-1110 split range: compressor load, then PV-1110 to the flare", kind: control, refs: [PIC-1110, PV-1110, PIC-7101], status: proposed, by: agent}
