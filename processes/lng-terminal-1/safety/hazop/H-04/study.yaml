      then the depressurising vents HV-7124A..C (normally closed, FL-7003..FL-7005 to D-8101) and
      the discharge isolation XV-7123A..C (fail closed); trips I-701, I-702 / I-702B / I-702C,
      I-703A..C on TZT-7112A..C; relief PSV-7111 (7.5 barg) to the flare; battery-limit ESD valve
      XV-7130 (fail closed) closed by I-704 when all machines have stopped (D-010, D-025 item 5).
      Since fac0bbb5 (D-026 item 5): I-702 / I-702B / I-702C name the vendor unit control panel
      trips (vibration and bearings, dry gas seal, lube oil, motor protection, discharge pressure
      high-high below PSV-7111), to be confirmed with the vendor; I-705A..C stop a running
      machine and close its XV-7123x when ZSO-7121x loses the open position of the fail-closed
      suction valve or PZT-7113 reads the common suction header BOG-7001 low-low; SEQ-BOG-START S1
      has XV-7125x proven open before the start. Since 886b0ad5 (review 2026-11-05-basic-design-3#6)
      I-705x acts only while its machine runs (the logic includes K-7101x running), so no start
      bypass is needed, and the PZT-7113 path has a 5 s on-delay; PZT-7113 stays a single
      transmitter (1oo1), its voting left to the SIL screening. Since f5d925f6 (D-028 item 10;
