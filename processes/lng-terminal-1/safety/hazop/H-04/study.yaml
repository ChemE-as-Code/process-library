              21.9 t/h), the end of a loading when the carrier's return stops, a compressor started
              with PIC-7101 in auto, or UIC-7104A / UV-7104A failing to open (stuck); or (added for
              fac0bbb5) the fail-closed suction valve XV-7121A closing on a running machine
              (instrument air failure, spurious closure) or the suction header pressure falling.
            consequence: Surge with flow reversal, vibration, thrust bearing and seal damage; repeated surge can destroy the machine.
