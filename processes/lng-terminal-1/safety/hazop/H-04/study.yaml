              K-7101A for maintenance, 589c9ca7) is left closed when the machine is returned to
              service and started on full recycle (SEQ-BOG-START S1).
            consequence: >-
              No anti-surge path: UIC-7104A opens UV-7104A to no effect; the machine surges at
              start or at the first low-flow event (as S15); with XV-7123A also closed (fail closed)
