      - id: N5-PR
        guide_word: other-than
        parameter: pressure (the station regulator PCV-4159 / PCV-4160 not at its set point)
        description: Created by the self-acting regulators PCV-4159 / PCV-4160 added in ae718797 (D-039 item 3 (b), D-039.9 (b)).
        scenarios:
          - id: S34
            cause: >-
              The self-acting regulator PCV-4159 (PCV-4160) does not hold its 4.5 barg set point:
              (a) failed open (diaphragm, spring, ice on the pilot or the seat), so the station
              passes the full site N2 behind the orifice; (b) failed closed or frozen shut, or its
              set point or offset larger than the ~0.5 bar ASSUMED, so it delivers less than the
              ~3.4 barg the displacement needs in the bounding case (the receiving tank at its design
              pressure, the two-phase friction); (c) set wrong after maintenance.
            consequence: >-
              (a) In S2 nothing changes while the line takes ~2.7 barg (the regulator is wide open by
              design), but a blocked return (S31), the abort's hold and S3 drive the leak at up to the
              7 barg site N2 instead of ~4.7 barg, ~1.6 kg/s against ~1.3 kg/s (agent arithmetic,
              square root of the gauge pressure as D-039.9 (d)), so the line's remaining contents
              reach the leak and T-8102 sooner; inside the 15 barg line design and PSV-4111 / 4112.
