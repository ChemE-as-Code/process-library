              switch, so once the trip has stood for 15 s any momentary 'not closed' of the switch
              (contact bounce, vibration, a wiring transient) stops the pumps (latching).
            consequence: >-
              In loading the desuperheater spray LNG-4008 is lost once the loading pumps stop (since
              c257902c the loading header feeds it while they run, notes): the return vapour reaches
              the BOG compressors warm and I-703A..C trip them on discharge temperature (H-04 S10),
              the tank pressure goes to PV-1110 and XV-1115 at the BOG rate (H-01 S11); in holding
              the circulation stops and the trestle lines warm up (S5). A production loss, which the
              C&E notes accept as the safe direction.
