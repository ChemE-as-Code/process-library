                - {category: asset, severity: "2", likelihood: B, status: proposed, by: agent, basis: "Compressor trip or trains' fuel gas upset on inerts; matrix 2 = plant down for days.", evidence: [control/cause-effect.yaml], band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: c0d4218f7f2f3b3d, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '2', likelihood: B}}}
            notes: >-
