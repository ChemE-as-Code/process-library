assessment_basis: >-
  Each scenario is rated per category before its safeguards (initial): severity is the credible
  worst outcome if every safeguard fails, likelihood that of the cause. The codes are agent
  proposals with their basis, for the team to accept or change. Residual ratings are proposed
  (by the agent, status proposed) only for the scenarios whose safeguards changed in commit
  589c9ca7 and where a new layer independent of the cause now exists as drawn: the severity is
  kept, the likelihood is lowered by one code per independent layer named in the basis, and
  nothing is credited whose capacity or integrity the files leave open. Crediting safeguards
  remains the team's judgement (and a LOPA's where needed). The matrix is the example matrix
  of cheme init (example: true), so the bands are illustrative. The revision for commit
  fac0bbb5 (D-026) rates the new scenarios S19 and S20 before safeguards only; S15 and S16 keep
  their ids and are re-described for the causes that remain. The revision for commit 54648679
  (886b0ad5, D-026 items 1, 14) rates the new scenario S21 before safeguards only; the existing
  ratings keep their codes, and the texts that the changed fail positions, the I-511 / I-611
  ESD-1 condition and the SEQ-HOLD line-up no longer match are corrected in place. The revision
  for commit f5d925f6 (D-028) rates the new scenario S22 before safeguards only; the existing
  ratings keep their codes (the changes add safeguards, fail positions and closure order, and
  the causes the codes rest on remain), and the texts they touch are corrected in place. The
  revision for commit 79d5c7ad (D-030) rates the new scenarios S23 (an ESD-1 on the O2 high-high
  during a transfer sends vapour above 5 vol % O2 to the tanks) and S24 (a spurious 'not closed' of
  ZSC-2123 / ZSC-3123 stops the circulation and drain pumps in loading) before safeguards only;
  the existing codes are kept and the texts on the pump stops, the I-514 arming and the tank-end
  residual case are corrected in place. The revision for commit 709fcf20 (D-032) rates the new
  scenario S25 (the O2 reject at the berth switching the vapour return to the tanks during a
  de-inerting or gassing-up) before safeguards only; the existing codes are kept, and the texts on
  the transfer state, the O2 analysers and the D-026.1 bound, the I-205 / I-305 timer, the
  circulation pump on ESD-1 and the tank-area spill collection are corrected in place. The
  revision for commit aedd8dbd (D-034, D-035) rates the new scenarios S26 (the 30 min post-reset
  hold of I-n11 / I-n12 sending the gassing-up return to the tanks), S27 (the re-rated loading
  pumps' pressure against the 10 barg circulation pumps and the shut-off margin of the lines) and,
  in the new node N4 for the platform crossovers, S28 (XV-4107 closing during a loading), S29 (a
  leak at the platform end upstream of a shore ESD valve fed by the trestle line behind it) and S30
  (XV-4107 failing to close or XV-4103 open, so both lines feed it) before safeguards only; the
  existing codes are kept, and the texts on the pump rating, the platform crossover, the carrier
  return envelope, the berth analyser position and the tank-area spill basis are corrected in
  place. The revision for commit c257902c (D-036, D-037) adds the node N5 for the N2 stations and
  SEQ-LINE-EMPTY and rates its new scenarios S31 (N2 on a leaking line whose return path is not
  open, or the wrong line or station: the line pushed out through the leak), S32 (the gas
  breaking through to the crossover, the other line and the receiving tank at the end of the
  displacement) and S33 (LNG back into the N2 station or out of its bleed) before safeguards only;
  the existing codes are kept: S27 (the circulation pumps now at 15 barg answer the overpressure
  part, A24), S24 (the spray now fed from the loading header while the loading pumps run), S26
  (the hold ended on a measurement), S28 / S30 (ZSC-4107 / ZSO-4107) and S29 (the fewer leak sources
  and the drain-down bound) are re-described in place, with the actions they answer. The revision
  for commit ae718797 (D-038, D-039, D-040) rates the new scenarios S34 (the station regulator
  PCV-4159 / PCV-4160 failing open, closed or with a larger offset) and S35 (the leaking line held
  under N2 after an abort for longer than the ~0.45 h that keeps the PFP, or the sequence resumed
  at S2 instead of S1) before safeguards only; S31 (the regulator now limits a blocked line to its
  lock-up, and the hold after an abort is the design's), S32 (the end seen on the return flow) and
  S33 (the check valve on the line side of the inner block, the bleed locked closed, no abort on low
  N2, so the reverse flow during S2 rests on the check valve) are re-described in place with their
  codes kept; S29 and SG2 record the D-040 bottom takeoffs and the new ESD-1 cause and effect. The
  drawing-only changes of P-02 / P-03 / P-04 (D-038) touch no scenario.
