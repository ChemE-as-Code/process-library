  - id: N3
    title: Trestle loading lines LNG-4001 / LNG-4002 and vapour return lines BOG-4001 / BOG-4002
    design_intent: >-
      Carry 6,000 m3/h each (3.4 m/s, ~91 kPa over 2.45 km) from the tank-end control valves
      FV-4101 / FV-4102 (fail last) and ESD valves XV-4101 / XV-4102 to the berth headers; thermal
      relief PSV-4111 / PSV-4112 into the vapour return lines; return the carrier's vapour (up to
      45.6 t/h) through BOG-4001 / BOG-4002 to the tank vapour header (D-008, D-009). Since
      589c9ca7 the carrier's de-inerting and cool-down vapour is switched at the tank end to the
      storage and loading flare: AI-4133 (AI-4134) and I-511 (I-611) open XV-4131 (XV-4132) to
      BOG-4013 (BOG-4014) and only then close XV-4135 (XV-4136), make-before-break, so that the
      vapour return, the relief path of the jetty PSVs, is never closed at both valves (D-025
      item 3). Since fac0bbb5 (D-026 items 1, 7, 11) the switch is proven in both directions by
      the open-position switches ZSO-4131 / ZSO-4135 (ZSO-4132 / ZSO-4136): I-511 (I-611) opens
      the flare valve on off-specification vapour, I-512 (I-612) closes the tank-side valve only
      with the flare valve proven open and ESD-1 not tripped, I-513 (I-613) closes the flare valve
      only with the tank-side valve proven open, on on-specification vapour or on ESD-1; ESD-1
      (I-501 / I-601) opens the tank-side valve and does not act on the flare valve. Since
      886b0ad5 (D-026 items 1, 14; review 2026-11-05-basic-design-3#1, #2) the tank-side valves
      XV-4135 / XV-4136 fail open and the flare valves XV-4131 / XV-4132 fail closed, so on an
      instrument-air failure the return goes to the tanks and the tank vapour header is never
      opened to the flare through the switch; I-511 (I-611) does not open the flare valve while
      ESD-1 of its berth is tripped, so I-511 and I-513 never command it against each other; the
      position switches ZSO-4131 / 4132 / 4135 / 4136 sense their valves. Vapour goes to the flare
      only below 5 vol % O2 and to the tanks only below 1 vol % O2 and on hydrocarbon
      specification (ASSUMED, D-026 item 7); since 886b0ad5 I-514 (I-614) closes the vapour arm
      isolation XV-5122 (XV-6122) when AI-4133 (AI-4134) reads O2 above 5 vol % for 10 s (latching,
      analysed in H-03). The four trestle thermal relief outlets BOG-4011, BOG-4012, BOG-4015,
      BOG-4016 tie into BOG-4001 on the tank side of XV-4135. Since f5d925f6 (D-028 items 1, 4, 5,
      13; D-016): ESD-1 stops the loading pumps and trips the carrier through XS-5100 / XS-6100
      (now an effect of I-501 / I-601), then closes XV-4101 / XV-4102 in 25-30 s (ASSUMED); the
      tank-end ESD valves have a non-return valve and a local air accumulator on the actuator
      supply and a speed controller on the exhaust, so on an instrument-air failure they hold
      until the air-header trip I-804 has initiated ESD-1 and then close no faster than their set
      speed (UZ-4101 / UZ-4102); 'proven open' in I-512 / I-513 (I-612 / I-613) now also needs no
      standing discrepancy between the ZSO switch and its valve's command (a switch reading open
      while its valve has been commanded closed longer than the stroke time alarms and blocks the
      interlock, leaving the return open); I-514 / I-614 vote 2oo2 on two O2 cells of AI-4133 /
      AI-4134 and also close the hybrid vapour isolation XV-5125 / XV-6125; D-026 item 1 bounds the
      off-specification vapour an ESD-1 sends to the tanks (the line pack of the return, below
      0.15 vol % O2 in the tank vapour space, ASSUMED). Since 79d5c7ad (D-030 items 4, 7, 8, 9,
      10; D-016, D-023 (4)): I-514 / I-614 are armed on the plant state 'no liquid transfer at the
      berth' (shore ESD valve not commanded open, or both FIC-4101 and FIC-4102 below 50 m3/h,
      ASSUMED), not on SEQ-LOAD S1 to S3 as at f5d925f6; during a liquid transfer, the S3 cooldown
      included, the same 2oo2 O2 high-high trips ESD-1 (I-501 / I-601), which opens XV-4135 /
      XV-4136 and sends the return to the tanks; ESD-1 also takes the manual push buttons, the
      confirmed platform fire and gas and, during a transfer, the vapour arm isolation not proven
      open (ZSO-5122 / ZSO-6122), the loss of the ERS solenoid supply and the other berth's ESD-1,
      so an ESD-1 of either berth, which stops the shared loading pumps and closes the shared
      XV-4101 / XV-4102, also trips the carrier that is transferring; D-023 (4) names the closure
      of XV-4101 / XV-4102 at spring speed with the pumps running (non-return valve or
      accumulator failed) as a check case of the transient analysis, named in the relief cases of
      PSV-2141 / PSV-3141, which are DN 25 thermal relief and not credited for it (hold H-01).
      Since 709fcf20 (D-016, D-026.1 / .7 as corrected by D-032 items 1, 3, 4): the berth's liquid
      transfer state is its shore ESD valve not proven closed by ZSC-5101 / ZSC-6101 or held open by
      UZ-5101 / UZ-6101, no longer the shore ESD valve command and FIC-4101 / FIC-4102; the O2 trips
      (I-514 / I-614 and the ESD-1 transfer cause) act on the berth analysers AI-5126 / AI-6126 on
      BOG-5001 / BOG-6001 downstream of both vapour isolations, with AI-4133 / AI-4134 as backup;
      I-514 / I-614 also open XV-4135 / XV-4136, I-513 / I-613 then close the flare valve once the
      tank-side valve is proven open, and I-511 / I-512 (I-611 / I-612) do not act while I-514 /
      I-614 is tripped, so a reject switches the return to the tanks make-before-break (S25);
      D-026.1 now bounds what an ESD-1 or a reject sends to the tanks by the line pack at or below 5
      vol % O2 plus the slug that passes the berth before the vapour isolations close (~40 s, at
      most ~200 m3, up to air), together at most ~100 m3 of O2, below 0.25 vol % in more than
      40,000 m3 of tank vapour space (all ASSUMED), and the slug never reaches the flare; ESD-1 does
      not stop P-2102 / P-3102.
