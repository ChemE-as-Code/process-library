              rises toward the site N2 pressure, ~7 barg, against the ~2.5-2.7 barg the open return
              keeps at the platform; inside the 15 barg line design (no overpressure of the line),
              but the N2 then drives the line's LNG out at the leak, faster (agent estimate: a seal
              leak of ~1 kg/s at ~2.7 barg grows with the square root of the pressure, to ~1.5 kg/s)
              and for the whole line, up to ~1,030 m3, instead of to the tank: T-8102's 257 m3 below
              the inlet are exceeded, the sump overflows onto the deck and the water (rapid phase
              transition) and the header bay fire outlasts its 240 min PFP (S29). With the wrong
              line, the N2 pushes the healthy line through the crossover into the leaking one, or
              flows through its open tank-end valve straight into the tank (S32), while the leaking
              line keeps draining by gravity. Since ae718797 (D-039 item 3, D-039.9 (b), (d)) the
              regulator PCV-4159 (PCV-4160) limits a blocked line to its ~4.7 barg lock-up (7 barg
              only with the regulator failed open, S34), so the leak is driven at ~1.3 kg/s
              (~10 m3/h) rather than ~1.5 kg/s; the design's own abort now closes the crossover and
              the return with the N2 blocks left open, the same state, as a stated residual (up to
              ~1,030 m3 left if the abort comes early; the 240 min PFP reached ~3.5 h after the
