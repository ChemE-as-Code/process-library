  - id: N5
    title: Tank-end N2 stations N-4001 / N-4002 and SEQ-LINE-EMPTY (a leaking trestle line emptied back to a tank)
    design_intent: >-
      Added for c257902c (D-036 item 5 (b), 11 (b)-(d); P-04, line list N-4001..N-4004, instrument
      list PI-4155..PI-4158, C&E I-501 / I-601 bypass, SEQ-LINE-EMPTY). After an ESD-1 with a leak on
      the trestle side of a shore ESD valve (S29), SEQ-LINE-EMPTY empties the leaking loading line
      back to a tank. Permissives: ESD-1 complete (loading pumps stopped, XV-5101 / XV-6101 and,
      by ZSC-4107, XV-4107 proven closed, XV-4101 / XV-4102 closed); the leaking line identified;
      at least 1,100 m3 below the high-high level of the receiving tank (H-01 S26); site N2 at 6
      barg or more on PI-4155 (PI-4157); the I-n01 output override permitted. S1 (20 min, line A
      leaking shown): P-2102 / P-3102 stopped, XV-4106 closed, XV-4103 opened, the ESD-1 close
      output of XV-4102 overridden (one key-protected override per valve at the SIS station,
      alarmed and logged, permitted only with every loading pump proven stopped, XV-5101 / XV-6101
      proven closed and the carrier tripped; the pump stops stay latched; removed by the SIS at the
      end of S3, after 8 h or on the loss of a permissive), XV-4102 opened, FV-4102 fully open in
      manual, XV-4105 and XV-2123 opened (line B leaking: N-4002 into line B and the return up line
      A; XV-4107 the crossover if XV-4103 is the leaker). S2 (3 h): the bleed HV-4161 closed, HV-4152
      and HV-4151 opened, site N2 at 7 barg through the restriction orifice FO-4151 (choked, ~4,000
      Nm3/h, ~39 mm bore, ASSUMED) and the check valve CV-4151 into line A at the PR1 joint (tee T4A6,
      the trestle side of XV-4101 and the high end of the line), ~3.7 bar(a) at the line, ~450 m3/h
      of LNG returned through the bottom-of-line crossover, line B and the circulation return; the
      overrun liquid drains along the bottom of the ~0.16 % line ahead of the gas; the end is seen
      on the receiving tank level, the N2 totalised, PI-4156 and the strap-on TI-4103; XV-4103 is
      then closed. S3: XV-4105 / XV-2123 closed, the emptied line kept under N2 at ~2.7 barg
      (HV-4151 / HV-4152 open, making up what leaks), the overrides removed, the line later cooled
      and refilled from the tank end. Abort on I-201, PI-4155 below 5 barg or a high receiving-tank
      pressure: the N2 blocks closed and the bleed opened. Each station is austenitic stainless
      steel from a spec break at its battery-limit flange, DN 80, a double block HV-4152 (outer) /
      HV-4151 (inner) with CV-4151 and the bleed HV-4161 (N-4003, DN 25, to atmosphere) between them,
      open while the station is isolated; no blind (line B: HV-4154 / HV-4153, CV-4152, FO-4152,
      HV-4162 / N-4004, PI-4157 / PI-4158). From the layout (D-037.15 (g), not an analysed input):
      N-4001 / N-4002 run at 1.2 m beside the XV-4101 pit and the trough, the inner blocks over the
      collection, the bleeds venting at 2.5 m about 1.8 m away. Since ae718797 (D-039 items 3, 5,
      D-039.9 (a), (b), (d), (g), (j); P-04, instrument and line lists, SEQ-LINE-EMPTY, SEQ-ESD S2):
      each station runs, in the flow direction, outer block HV-4152, orifice FO-4151, self-acting
      regulator PCV-4159 (set 4.5 barg, ~0.5 bar offset at the design rate, lock-up ~4.7 barg, all
      ASSUMED; a sheet note, no regulator symbol in the library), the bleed HV-4161 locked closed
      (opened only under permit with a gas test before maintenance), inner block HV-4151, the check
      valve CV-4151 on the line side of the inner block, the tee (line B: HV-4154, FO-4152, PCV-4160,
      HV-4162, HV-4153, CV-4152). PI-4163 / PI-4164 beyond the check valve read the line at its tank
      end with no valve opened (SEQ-ESD S2, the permissive: S1 complete with PI-4163 below 4.0
      barg); PI-4155 / PI-4157 read the site N2 with the outer block open, PI-4156 / PI-4158 the
      regulator side of the inner block, and the passing-block check on rounds is made between the
      blocks. The section between the inner block and the check valve takes LNG only back through
      the check valve's seat and relieves forward through it into the line; the inner block's cavity
      is vented to the line side (vendor). S2: with the inner block closed the outer block
      pressurises the station to the regulator's lock-up, then the inner block is opened; the
      regulator is wide open in the displacement (~2.7 barg in the line, ~2.8 on PI-4156); the
      station flow is followed in the control room as the displaced LNG returning on FIC-4102
      (FIC-4101 for line B leaking; bidirectional ultrasonic meters, ASSUMED), ~450 m3/h at 4,000
      Nm3/h, ~390 m3/h at 3,500 Nm3/h; low site N2 is not an abort (the displacement continues at
      the reduced rate, the N2 back-up called; at least ~3,500 Nm3/h at 6 barg keeps the 240 min
      PFP and the 40 m3, hold H-07); timeout 5 h. S3: the emptied line held at ~4.5 barg, its dead
      legs pushed into the leak at up to ~1.3 times the displacement's rate (~0.6 h); left with the
      blocks closed with N2 in the station. Abort on I-201, a high receiving-tank pressure or no N2
      entering (the return flow below ~100 m3/h for 5 min before ~1,030 m3 have returned, the cause
      read at the station): the crossover in use and the return closed, the N2 blocks left open
      behind the check valve with the regulator limiting the line, the bleed locked closed, so the
      leaking line is held pressurised and isolated and the leak fed only by what is left in it
      (~1.3 kg/s, ~10 m3/h, at the lock-up after a tank-limit abort, falling after a no-N2 abort);
      the sequence is restarted from S1 as soon as the cause clears, within ~0.45 h of an early abort
      to keep the 240 min PFP (a longer hold a residual of H-07). From the layout (D-040, not an
      analysed input): the crossover tees are at the bottom of the low runs at 2.51 m, so XV-4103
      stays the first crossover and the drain-down bound holds.
