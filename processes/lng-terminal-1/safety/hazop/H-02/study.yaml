id: H-02
title: In-tank pumps, circulation and trestle lines
scope: >-
  Detail-stage HAZOP of the in-tank loading pumps P-2101A..D / P-3101A..D with their columns,
  check valves and minimum-flow returns, the circulation pumps P-2102 / P-3102 and the
  circulation header LNG-2002 / LNG-3002 (P-02, P-03), and the trestle lines on P-04: loading
  lines LNG-4001 / LNG-4002 (~2.45 km) with FV-4101/FV-4102 and the tank-end ESD valves
  XV-4101/XV-4102, the crossovers LNG-4006 (XV-4106) and LNG-4003 (XV-4103) and, since aedd8dbd,
  the DN 800 platform crossover LNG-4010 with its ESD valve XV-4107 (node N4), the circulation
  return LNG-4005 / LNG-4009 (XV-4105, XV-2123, XV-3123), the desuperheater spray take-off
  LNG-4008 and the vapour return lines BOG-4001 / BOG-4002 with, since 589c9ca7, their
  de-inerting switching to the flare (XV-4131 / XV-4135, XV-4132 / XV-4136, AI-4133 / AI-4134,
  I-511 / I-611, since fac0bbb5 also ZSO-4131 / ZSO-4132 / ZSO-4135 / ZSO-4136 with I-512 / I-513,
  I-612 / I-613, BOG-4013 / BOG-4014) and the thermal relief valves PSV-2141 / PSV-2142,
  PSV-3141 / PSV-3142, PSV-4113 / PSV-4114, and since c257902c the tank-end N2 stations
  N-4001 / N-4002 of SEQ-LINE-EMPTY (node N5). The berth headers, the shore ESD
  valves XV-5101/XV-6101 and the surge relief PSV-5131/PSV-6131 are in H-03; tank level and
  pressure in H-01. Not covered: trestle structure, expansion loops, supports, drip trays and
  low-point drains (not drawn at this revision, D-021).
modes:
  - {id: holding, title: Holding, description: "No carrier: P-2102 (or P-3102) circulates ~314 m3/h out on line A, through the DN 250 platform crossover XV-4103 and back on line B to the tanks (D-008, SEQ-HOLD); since aedd8dbd the DN 800 crossover XV-4107 is closed in holding (SEQ-HOLD S1, D-034)."}
  - {id: loading, title: Loading, description: "Four loading pumps of one tank (or any four) send 12,000 m3/h through both trestle lines (6,000 m3/h each, FIC-4101/FIC-4102) to one berth (D-011, SEQ-LOAD); since aedd8dbd line B reaches Berth 2 (line A Berth 1) through the DN 800 platform crossover XV-4107, XV-4103 closed, and the pumps are rated 3,000 m3/h at 191 m (D-034)."}
  - {id: cooldown, title: Cooldown, description: "Cooldown of the trestle lines from warm (commissioning, after a long outage) and of the arms and berth header at 500 m3/h (SEQ-LOAD S3)."}
  - {id: startup, title: Start-up and shutdown, description: "Pump start and stop, ramp-up and topping-off (SEQ-LOAD S4, S5), ESD-1 and its reset (SEQ-ESD), restart of the circulation (SEQ-HOLD)."}
