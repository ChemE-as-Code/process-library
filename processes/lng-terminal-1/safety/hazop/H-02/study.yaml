                - {category: environment, severity: "2", likelihood: C, status: proposed, by: agent, basis: "Flaring of the carrier's return; matrix 2 = minor release off site. C: analyser faults several times in the plant life.", evidence: [control/cause-effect.yaml], band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: 286f676bb8108832, inputs: {matrix: b6caa11838fe6bc7, category: environment, severity: '2', likelihood: C}}}
