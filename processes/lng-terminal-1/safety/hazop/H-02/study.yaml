# XV-4101 / XV-4102, the SEQ-LOAD S3 ESD-1 test in test mode; the core 1.7.0 regeneration in
# 54648679 changed the drawing only), then to those of commit f5d925f6 (DESIGN.md D-028: the
# instrument-air trip I-804 initiating ESD-1, non-return valves, accumulators and speed control
# on XV-4101 / XV-4102, XS-5100 as an effect of I-501 / I-601, XV-2123 / XV-3123 fail closed and
# I-201 / I-301 stopping the return sources, the ZSO command discrepancy in I-512 / I-513 /
# I-612 / I-613, I-514 / I-614 2oo2 and mode-armed, the repeated SEQ-LOAD S3 ESD-1 test; P-04 is
# unchanged), then to those of commit 79d5c7ad (DESIGN.md D-030 items 1, 4, 7, 8, 9, 10 and D-023
# (4), D-016, D-018 / D-031 for the trestle: I-201 / I-301 no longer stop the circulation and drain
# pumps, ZSC-2123 / ZSC-3123 with I-205 / I-305, ZSC-2123 / ZSC-3123 proven closed in SEQ-LOAD S0,
# I-514 / I-614 armed on 'no liquid transfer' with the O2 high-high an ESD-1 cause during a
# transfer, the new ESD-1 causes and the other berth's ESD-1, the tank-end residual surge case
# named in D-023 (4) and the PSV-2141 / PSV-3141 relief cases, no drip tray on the trestle; the
# P-04 change is a sheet note), then to those of commit 709fcf20 (DESIGN.md D-032, D-016, D-026.1 /
# .7: the berth transfer state on ZSC-n101 / UZ-n101 instead of FIC-4101 / FIC-4102; the berth O2
# analysers AI-5126 / AI-6126 for I-514 / I-614 and the ESD-1 transfer cause, I-n14 also opening
# XV-4135 / XV-4136 so that I-n13 closes the flare valve, I-n11 / I-n12 not acting while I-n14 is
# tripped, the D-026.1 bound restated; the I-205 / I-305 on-delay moved onto 'I-n01 tripped' with a
# command discrepancy alarm on ZSC-2123 / ZSC-3123; P-2102 / P-3102 left running on ESD-1 by stated
# reason; the idle-berth link mode; and, from the layout (D-033, not an analysed input), the trough
# starting at the PR6 joint, no PR2 trough, the enclosed channels removed, drip trays at XV-3123 and
# the trough-side thermal reliefs, the basin T-8101 moved and deepened). Every entry is a proposal for
# the team: status proposed.
schema: cheme/hazop-study/v1
kind: hazop-study
id: H-02
title: In-tank pumps, circulation and trestle lines
scope: >-
  Detail-stage HAZOP of the in-tank loading pumps P-2101A..D / P-3101A..D with their columns,
  check valves and minimum-flow returns, the circulation pumps P-2102 / P-3102 and the
  circulation header LNG-2002 / LNG-3002 (P-02, P-03), and the trestle lines on P-04: loading
  lines LNG-4001 / LNG-4002 (~2.45 km) with FV-4101/FV-4102 and the tank-end ESD valves
  XV-4101/XV-4102, the crossovers LNG-4006 (XV-4106) and LNG-4003 (XV-4103), the circulation
  return LNG-4005 / LNG-4009 (XV-4105, XV-2123, XV-3123), the desuperheater spray take-off
  LNG-4008 and the vapour return lines BOG-4001 / BOG-4002 with, since 589c9ca7, their
  de-inerting switching to the flare (XV-4131 / XV-4135, XV-4132 / XV-4136, AI-4133 / AI-4134,
  I-511 / I-611, since fac0bbb5 also ZSO-4131 / ZSO-4132 / ZSO-4135 / ZSO-4136 with I-512 / I-513,
  I-612 / I-613, BOG-4013 / BOG-4014) and the thermal relief valves PSV-2141 / PSV-2142,
  PSV-3141 / PSV-3142, PSV-4113 / PSV-4114. The berth headers, the shore ESD
  valves XV-5101/XV-6101 and the surge relief PSV-5131/PSV-6131 are in H-03; tank level and
  pressure in H-01. Not covered: trestle structure, expansion loops, supports, drip trays and
  low-point drains (not drawn at this revision, D-021).
modes:
  - {id: holding, title: Holding, description: "No carrier: P-2102 (or P-3102) circulates ~314 m3/h out on line A, through the platform crossover XV-4103 and back on line B to the tanks (D-008, SEQ-HOLD)."}
  - {id: loading, title: Loading, description: "Four loading pumps of one tank (or any four) send 12,000 m3/h through both trestle lines (6,000 m3/h each, FIC-4101/FIC-4102) to one berth (D-011, SEQ-LOAD)."}
  - {id: cooldown, title: Cooldown, description: "Cooldown of the trestle lines from warm (commissioning, after a long outage) and of the arms and berth header at 500 m3/h (SEQ-LOAD S3)."}
  - {id: startup, title: Start-up and shutdown, description: "Pump start and stop, ramp-up and topping-off (SEQ-LOAD S4, S5), ESD-1 and its reset (SEQ-ESD), restart of the circulation (SEQ-HOLD)."}
