  - {id: SG12, title: "Carrier cargo plan and ramp agreed through the ship-shore link (SEQ-LOAD S4, S5)", kind: procedural, refs: [XS-5100], status: proposed, by: agent}
  - {id: SG13, title: Impoundment sump T-8101 for tank-area and trestle spills, kind: mechanical, refs: [T-8101], status: proposed, by: agent, notes: "The collection from the trestle (drip trays) is not drawn. Since f5d925f6 (D-029 item 2) the basin is re-sited north of road R2 (area A8), fed by a trough of ~240 m under the PR6 centreline and under R2 in a culvert (layout, not an analysed input of this study; H-05 S26). Since 79d5c7ad (D-018, D-031 items 1, 5) the collector runs in open troughs under PR1, PR2's shore end, PR3's north-south leg and PR4, across R7 and R2 in culverts, and in an enclosed channel under PR5 / PR6 and the riser towers; the trestle run over the water has no drip tray, so this safeguard covers the tank area and the shore end of the trestle only (S14). Since 709fcf20 (D-018, D-033 items 1-3, 11): the open troughs (0.6 m, lined with cellular glass, 0.5 % fall) start at the PR6 joint (x 975) under PR1 and run under PR3 and PR4 to y 3237.5 and west into the basin, now at (990, 3237.5) and 10.5 m deep (the 1,000 m3 design spill 1.37 m below the inlet); PR2's trough and the enclosed channels under PR5 / PR6 are removed (welded runs only); the flanged LNG items off the trough's line have kerbed drip pads draining to it, and XV-3123, TV-7103 and the DN 25 thermal reliefs off the trough have drip trays at the item without a drain (H-05 S29); the trestle shore end has no collection. Since aedd8dbd (D-034 item 3, D-035 item 2; layout): sized for the governing tank-area release of D-034.3, one tank's loading pumps at run-out into one line at the loading valve station or XV-4105 (~14,400 m3/h, ASSUMED 1.2 x rated) for 10 min, 2,400 m3 (was 1,000 m3): 19.5 m deep, the design spill 1.79 m below the trough inlet, ~2,760 m3 below it (11.5 min of the run-out), the trough 2.92 m deep at 0.5 %; no automatic stop of the loading pumps on a tank-area release (D-034.3)."}
  - {id: SG14, title: "Thermal relief PSV-2141 / PSV-3141 (pump headers), PSV-2142 / PSV-3142 (circulation headers) into the tanks and PSV-4113 (tank-end crossover) into vapour return A", kind: relief, refs: [PSV-2141, PSV-2142, PSV-3141, PSV-3142, PSV-4113], status: proposed, by: agent, notes: "Added in 589c9ca7 (D-025 items 2, 3), 15.0 barg."}
  - {id: SG15, title: "Pump column vent and N2 purge HV-2161..HV-2165 (HV-3161..HV-3165) used before a start", kind: procedural, refs: [HV-2161, HV-2162, HV-2163, HV-2164, HV-2165], status: proposed, by: agent, notes: "Drawn since 589c9ca7; no written start procedure or permissive is in the files."}
  - {id: SG16, title: "Thermal relief PSV-4114 of the circulation return LNG-4005 / LNG-4009 into vapour return A on the tank side of XV-4135", kind: relief, refs: [PSV-4114, BOG-4016], status: proposed, by: agent, notes: "Added in 589c9ca7 (D-025 item 3), 15.0 barg; outlet BOG-4016 moved to BOG-4001 on the tank side of XV-4135 in fac0bbb5 (D-026 item 11), before into vapour return B."}
  - {id: SG17, title: "Interlocks I-511..I-513 (I-611..I-613): make-before-break vapour return switch proven by ZSO-4131 / ZSO-4135 (ZSO-4132 / ZSO-4136); ESD-1 opens the tank-side valve", kind: interlock, interlock: I-512, refs: [AI-4133, XV-4131, XV-4135, ZSO-4131, ZSO-4135], status: proposed, by: agent, notes: "Since fac0bbb5 (D-026 item 1): I-511 opens XV-4131 on off-specification vapour, I-512 closes XV-4135 only with ZSO-4131 proving XV-4131 open and ESD-1 not tripped, I-513 closes XV-4131 only with ZSO-4135 proving XV-4135 open; I-501 opens XV-4135. B alike with AI-4134, ZSO-4132 / ZSO-4136, I-611..I-613, I-601. Latching false, reset automatic, SIL null; a false position signal is part of the cause in S15 and S19. Since 886b0ad5 (D-026 items 1, 14): I-511 / I-611 do not act while I-501 / I-601 is tripped; XV-4135 / XV-4136 fail open, XV-4131 / XV-4132 fail closed (S21); the ZSO switches sense their valves. Since f5d925f6 (D-028 item 13) 'proven open' also needs no standing command discrepancy of the switch; a discrepancy alarms and blocks I-512 / I-513, which leaves the return open (S15, S16). Since 709fcf20 (D-032 item 3) I-511 / I-512 do not act while I-514 is tripped, and I-513 also closes XV-4131 on I-514 (which opens XV-4135), so the O2 reject switches the return to the tanks make-before-break (S25); B alike with I-614. Since aedd8dbd (D-034 item 4) I-511 / I-512 are also blocked for 30 min after a reset of I-514 and while AI-4133 reads O2 at or above 5 vol %, so the slug trapped downstream of XV-5122 is flushed to the tanks (S26). Since c257902c (D-036 item 8 #7) the post-reset hold ends when AI-4133 has seen the slug pass (O2 above 1 vol % and back below for 5 min, ASSUMED) or the operator releases it on the carrier's delivered return volume (1.5 return-line volumes, ~1,600 m3), no longer on a 30 min timer."}
  - {id: SG24, title: "Platform crossover ESD valve XV-4107: closure in 25-30 s by a speed controller on the actuator exhaust, with a non-return valve and a local air accumulator on the supply (UZ-4107)", kind: mechanical, refs: [XV-4107, UZ-4107], status: proposed, by: agent, notes: "Added in aedd8dbd (D-016, D-034 item 1; instrument list UZ-4107); closure and hold times ASSUMED; no position switch and no proof test in the files; its fast closure is a check case of the transient analysis (hold H-01, S28)."}
  - {id: SG25, title: "Interlocks I-501 / I-601: ESD-1 of either berth closes the DN 800 platform crossover XV-4107 with XV-4101 / XV-4102, so a leak upstream of a shore ESD valve is fed by one trestle line", kind: interlock, interlock: I-501, refs: [XV-4107, UZ-4107, XV-4101, XV-4102], status: proposed, by: agent, notes: "Added in aedd8dbd (D-034 items 1, 3; C&E I-501 / I-601 effects); with XV-4103 closed in loading (SEQ-LOAD S0); limits the inventory, does not stop the leak (S29); SIL null; its failure to close is S30."}
  - {id: SG26, title: "Platform header bay and jetty sump T-8102 (13.0 m deep, ~257 m3 below the inlet) with the low-temperature alarm TSL-8104", kind: mechanical, refs: [T-8102, TSL-8104], status: proposed, by: agent, notes: "Layout, not an analysed input (D-034.3, D-035 items 1, 8): the header bay (36 m2, recessed 3.4 m, 122 m3) drains through two open floor outlets into the catwalk collector and T-8102, a sealed caisson sized for the ~170 m3 platform spill with ~87 m3 left for rain; no fixed pump; TSL-8104 is in the sump only (S29, S30). Since c257902c (D-036 item 6, D-037.15 (a), .16, .17; P-08, C&E I-805..I-808): the sump is kept dry by the fixed dry-sump pump P-8103 on LZT-8106 (pocket level, LAH 0.50 m a transfer hold, LAHH 0.60 m I-805), locked out on LNG by TSL-8104 / TSL-8118 (1oo2, I-808), so 170 + 40 = 210 of the 257 m3 below the inlet hold the platform spill and the bounded drain-down of SEQ-LINE-EMPTY with no rain allowance (analysed in H-05 S13, S32, S33)."}
  - {id: SG27, title: "SEQ-LINE-EMPTY: the leaking trestle line emptied back to a tank with site N2 through N-4001 / N-4002 (FO-4151 / FO-4152, ~4,000 Nm3/h), the bottom-of-line platform crossover, the other loading line and the circulation return, after ESD-1 (D-036)", kind: procedural, refs: [N-4001, N-4002, FO-4151, FO-4152, XV-4103, XV-4105, XV-2123, XV-3123], status: proposed, by: agent, notes: "Added in c257902c (D-036 item 5 (b), 11 (b)-(d); control/sequences.yaml, C&E I-501 / I-601 bypass). An operator sequence with key-protected SIS output overrides of XV-4101 / XV-4102 / XV-4107; the bound of ~3.5 h and ~36 m3 into T-8102 rests on the N2 flowing within ~0.5 h, the site N2 rate (a hold of the trains' utility owner, with its liquid N2 back-up), one opening stroke of the crossover valve in the burning bay (actuator package qualified for at least 60 min of pool fire, D-037.15 (c), ASSUMED, not confirmed) and the two-phase displacement (a check case of hold H-01); not credited (S29, S31 to S33). Since ae718797 (D-039 item 3, D-039.9): the minimum rate keeping the bound is ~3,500 Nm3/h (6 barg site N2, hold H-07; ~3,400 Nm3/h with every bound at once, no margin), the regulators PCV-4159 / PCV-4160 limit the line to 4.5 barg, low N2 is no abort, the abort holds the line isolated and is followed by a restart from S1; still not credited (S34, S35)."}
  - {id: SG28, title: "Position switches ZSC-4107 / ZSO-4107 on the platform crossover XV-4107 with a discrepancy alarm against UZ-4107; 'proven open' completes SEQ-LOAD S0 / S3, 'proven closed' SEQ-HOLD S1 and SEQ-ESD S1", kind: alarm, refs: [ZSC-4107, ZSO-4107, XV-4107, UZ-4107], status: proposed, by: agent, notes: "Added in c257902c (D-036 item 8 #5; instrument list, sequences); no trip on 'not open' during a transfer (S28); a failure to close on ESD-1 is shown and the operator recloses from UZ-4107 (SEQ-ESD S2, S30)."}
  - {id: SG29, title: "N2 station double block and bleed: HV-4152 / HV-4161 / HV-4151 (HV-4154 / HV-4162 / HV-4153) with the check valve CV-4151 (CV-4152), the bleed N-4003 (N-4004) open while the station is isolated; austenitic stainless steel from the spec break at the battery-limit flange", kind: mechanical, refs: [HV-4151, HV-4152, HV-4161, CV-4151, N-4003, HV-4153, HV-4154, HV-4162, CV-4152, N-4004], status: proposed, by: agent, notes: "Added in c257902c (D-036 item 11 (c); P-04, line list); manual valves, no interlock; no blind; no proof test in the files (S31, S33). Since ae718797 (D-039 item 5, D-039.9 (a), (g)): the check valve CV-4151 (CV-4152) is on the line side of the inner block, the bleeds HV-4161 / HV-4162 are locked closed (LC on the sheet; opened under permit with a gas test before maintenance), so the bleed is no longer open while the station is isolated; the passing-block check is made on rounds between the blocks (PI-4155 / PI-4156, PI-4157 / PI-4158); the inner block's cavity is vented to the line side (vendor)."}
  - {id: SG31, title: "Self-acting regulators PCV-4159 / PCV-4160 (set 4.5 barg, lock-up ~4.7 barg, ASSUMED) between the orifice and the inner block of each N2 station, limiting an emptied, blocked or held line to below the site N2 pressure", kind: mechanical, refs: [PCV-4159, PCV-4160], status: proposed, by: agent, notes: "Added in ae718797 (D-039 item 3 (b), D-039.9 (b), (g); P-04 sheet note, SEQ-LINE-EMPTY); wide open in the displacement; failed open leaves 7 barg, inside the 15 barg design; offset and lock-up from the vendor; no proof test in the files; its failure is S34."}
  - {id: SG30, title: "SEQ-LINE-EMPTY line-up checks and abort: S1 completion (XV-4103, XV-4105, XV-4102 open, ZSC-2123 not closed, XV-4106 closed), the station gauges PI-4155..PI-4158 (choked flow: upstream at least ~1.9 times downstream, absolute), the receiving tank level, the abort on I-201, PI-4155 below 5 barg or a high receiving-tank pressure (since ae718797: the S1 completion with PI-4163 below 4.0 barg, the station flow read as the return on FIC-4102 / FIC-4101, the abort on I-201, a high receiving-tank pressure or no N2 entering, holding the line isolated, restart from S1)", kind: procedural, refs: [PI-4155, PI-4156, PI-4157, PI-4158, XV-4103, XV-4105, ZSC-2123, XV-4106, LT-2101, PI-4163, PI-4164, FIC-4101, FIC-4102], status: proposed, by: agent, notes: "Added in c257902c (D-036 item 11 (c); SEQ-LINE-EMPTY, instrument list); the PI are local gauges read by the operator at the station, XV-4103 / XV-4105 have no position switch, the completion is the operator's (S31 to S33). Since ae718797 (D-039 item 3, D-039.9 (b), (d), (j)): the PI-4155 abort below 5 barg is withdrawn (low N2 runs on at the reduced rate, timeout 5 h); the no-N2 abort is on the return flow (below ~100 m3/h for 5 min before ~1,030 m3 have returned), a control-room reading on FIC-4102 / FIC-4101 (bidirectional meters, ASSUMED); the abort closes the crossover and the return and keeps the N2 blocks open; still an operator sequence with no interlock (S31 to S35)."}
  - {id: SG18, title: "Interlocks I-204 / I-304: tank PALL stops the loading pumps and the BOG compressors", kind: interlock, interlock: I-204, refs: [PZT-2112, PZT-3112], status: proposed, by: agent, notes: "Does not close XV-4131 / XV-4132 (S16)."}
  - {id: SG19, title: "PIC-1111 / PV-1111 make-up from the trains' fuel gas FG-1001 (FO-1117)", kind: control, refs: [PIC-1111, PV-1111, FG-1001], status: proposed, by: agent, notes: "Regulatory, not credited in the C&E (H-01 SG19)."}
  - {id: SG20, title: "Tank vacuum relief valves PSV-2133A/B/C and PSV-3133A/B/C", kind: relief, refs: [PSV-2133A, PSV-2133B, PSV-2133C, PSV-3133A, PSV-3133B, PSV-3133C], status: proposed, by: agent, notes: "Admit air: protect the structure, create the O2 ingress consequence. Their locked-open inlet isolations HV-2135A/B/C (HV-3135A/B/C), mechanically interlocked two of three in service, are drawn since fac0bbb5 (D-026 item 11; analysed in H-01 S19)."}
  - {id: SG21, title: "Interlock I-804: instrument-air header low-low PZT-8123A/B/C (2oo3, 4.5 barg ASSUMED) initiates ESD-1 of both berths (loading pumps stopped, carriers tripped) before the fail-closed actuators stroke (~3.5 barg ASSUMED)", kind: interlock, interlock: I-804, refs: [PZT-8123A, PZT-8123B, PZT-8123C], status: proposed, by: agent, notes: "Added in f5d925f6 (D-028 item 1; P-08); latching, manual reset, SIL null; ahead of a valve only while the header falls slower than its margin allows (S22)."}
  - {id: SG22, title: "Tank-end ESD valves XV-4101 / XV-4102: closure in 25-30 s by a speed controller on the actuator exhaust, with a non-return valve and a local air accumulator on the supply", kind: mechanical, refs: [XV-4101, XV-4102, UZ-4101, UZ-4102], status: proposed, by: agent, notes: "Added in f5d925f6 (D-016, D-028; instrument list UZ-4101 / UZ-4102, C&E I-501 / I-601 notes); closure and hold times ASSUMED; no proof test in the files; its failure on an air loss is S22."}
  - {id: SG23, title: "Interlocks I-205 / I-305: I-201 / I-301 tripped and ZSC-2123 / ZSC-3123 not proving the return valve closed after 15 s stop P-2102 and P-3102 (until aedd8dbd also P-5101 and P-6101)", kind: interlock, interlock: I-205, refs: [ZSC-2123, ZSC-3123, XV-2123, XV-3123, P-2102, P-3102], status: proposed, by: agent, notes: "Added in 79d5c7ad (D-030 item 1); replaces the unconditional pump stops of I-201 / I-301 of f5d925f6; latching, manual reset, SIL null; analysed against the overfill in H-01 S25, its spurious action is S24. Since 709fcf20 (D-032 item 7, #3) the 15 s on-delay sits on 'I-201 / I-301 tripped', and ZSC-2123 / ZSC-3123 have a command discrepancy alarm. Since c257902c (D-036 item 5 (a)) the jetty drain pumps are no longer effects (they return into the berth headers downstream of XV-5101 / XV-6101)."}
actions:
  - {id: A1, status: proposed, by: agent, text: "C&E change: add a low-flow or low-motor-current trip of each in-tank pump independent of FIC-2111x, and order I-501 / I-601 so that the pumps are proven stopped before XV-4101 / XV-4102 close (delay or position permissive in the C&E).", response: "Partly answered by commit f5d925f6 (D-016, D-028): XV-4101 / XV-4102 close in 25-30 s after the pumps have been stopped (instrument list UZ-4101 / UZ-4102, I-501 / I-601 notes) and, on an air failure, hold on their accumulators until I-804 has stopped the pumps. Still open: a pump trip independent of FIC-2111x, and the order as a delay or a pump-stopped permissive in the C&E effects (it is in the notes only). Still proposed."}
  - {id: A2, status: proposed, by: agent, text: "P&ID P-02 / P-03 / P-04 change: thermal relief valves on the blocked-in pump headers LNG-2001 / LNG-3001 with LNG-4006 and LNG-2002 / LNG-3002 (upstream of FV-4101 / FV-4102 and XV-4105), and on LNG-4005 / LNG-4009 between XV-4105 and XV-2123 / XV-3123, discharging to the tank or the vapour system; list them in piping/special-items.yaml.", response: "Answered in the design by commit 589c9ca7 (D-025 items 2, 3): PSV-2141 / PSV-3141 on the pump headers LNG-2001 / LNG-3001 and PSV-2142 / PSV-3142 on the circulation headers LNG-2002 / LNG-3002 into the tanks (LNG-2031 / LNG-2032, LNG-3031 / LNG-3032), PSV-4113 on the tank-end crossover LNG-4006 (BOG-4015) and PSV-4114 on the circulation return LNG-4005 / LNG-4009 (BOG-4016), all 15.0 barg and in piping/special-items.yaml. For the team to verify and close; S3 and S8 re-rated. The spray line LNG-4008 behind TV-7103 is not named among the relief cases (S3 notes)."}
  - {id: A3, status: proposed, by: agent, text: "Confirm with the pump vendor the column vent, the cooldown and the start permissives of the in-tank pumps (column full and cold), and show the vent on P-02 / P-03 if it is a plant connection.", response: "Partly answered by commit 589c9ca7 (D-025 item 2): a column isolation valve HV-2151A..D / HV-2152 (HV-3151A..D / HV-3152) and a vent / N2 purge HV-2161..HV-2165 (HV-3161..HV-3165) per pump column are drawn, the check valves with a pressure-equalising hole (vendor). Still open: the vendor's confirmation and the start permissives (column full and cold) in the sequences."}
  - {id: A4, status: proposed, by: agent, text: "C&E / loops change: add a low circulation flow alarm (FIC-2112 / FIC-3112 measurement) and a high return temperature alarm on TI-4102, with automatic start of the standby circulation pump; state the response in SEQ-HOLD."}
  - {id: A5, status: proposed, by: agent, text: "Write the restart procedure for warm trestle lines (re-cooldown rate, vapour venting at the high points, TI-4103 / TI-4104 limits) and show the high-point vents and low-point drains of LNG-4001 / LNG-4002 on P-04 (omitted at basic, D-021).", response: "Partly answered by commit c257902c (D-036 item 11 (b); P-04 note, line list): the loading lines fall without a pocket from their tank end (the PR1 joint, where the N2 stations enter) to the bottom-of-line crossover tees at the platform, with no low-point drain or vent on the trestle (no leak source there); an emptied line is refilled from the tank end by P-2102 as at commissioning (SEQ-LINE-EMPTY S3). Still open: the written restart and re-cooldown procedure with its rate and TI-4103 / TI-4104 limits, and the venting of the high end during a refill. Still proposed."}
  - {id: A6, status: proposed, by: agent, text: "Sequence change: make XV-4106 closed a permissive of SEQ-HOLD S1 (position feedback), and add a temperature alarm at the platform end (TI-4103 / TI-4104) so that a warming trestle is seen whatever the line-up.", response: "Partly answered by commit fac0bbb5 (review 2026-11-05-basic-design-2#3): SEQ-HOLD S1 closes XV-4106 and its completion requires XV-4106 closed, and SEQ-LOAD S6 closes XV-4106 before SEQ-HOLD is run (control/sequences.yaml). Still open: no position switch on XV-4106 is drawn, so 'closed' is the command or the operator's check; no temperature alarm at the platform end (TI-4103 / TI-4104). Still proposed."}
  - {id: A7, status: proposed, by: agent, text: "Write the initial cooldown sequence of the trestle lines (it is not in control/sequences.yaml): rate limit, top-bottom temperature difference measurement on the DN 800 lines (not drawn), vapour routing and the BOG compressor and flare capacity it uses."}
  - {id: A8, status: proposed, by: agent, text: "Extend the surge analysis (D-023, transient analysis before construction) to the closure of the tank-end ESD valves XV-4101 / XV-4102 and their timing relative to XV-5101 / XV-6101 and the pump stop; record the closure times and delays in the C&E effects of I-501 / I-601.", response: "Partly answered by commit f5d925f6 (D-016, D-023 (4), D-028): the closure time of XV-4101 / XV-4102 is stated as 25-30 s after the pump stop (instrument list, ASSUMED), set by a speed controller, and the air-failure closure is made a commanded one behind I-804; D-028 hands the transient analysis of D-023 (1), (3), (4) to detail engineering. Still open: the analysis itself including the tank-end valves, their timing against XV-5101 / XV-6101, the delays as C&E effect parameters, and the fast closure with a failed non-return valve or accumulator, for which no surge relief is drawn at the tank end (S22). Commit 79d5c7ad (D-030 items 9, 10, 13; D-023 (4)) names the tank-end fast closure as a check case of the transient analysis (PSV-2141 / PSV-3141 relief cases, UZ-4101 / UZ-4102 notes) and registers the analysis as hold H-01 against the detail-engineering gate; an ESD-1 of the other berth now trips the transferring berth too. Still open: the analysis, the timing against XV-5101 / XV-6101 and the delays as C&E effect parameters. Commit aedd8dbd (D-034 items 1, 2) adds XV-4107 to the ESD-1 closures and to check case (4) (hold H-01) and rechecks D-023 (1) for both lines at 3.4 m/s (~8.5 barg peak in 25 s); the order of XV-4101 / XV-4102 / XV-4107 / XV-n101 is still not a C&E parameter. Still open as before. Still proposed."}
  - {id: A9, status: proposed, by: agent, text: "Consider a high-flow alarm on FIC-4101 / FIC-4102 independent of the controller, and the limit on the loading rate from the vapour arm capacity (D-023) in SEQ-LOAD S4."}
  - {id: A10, status: proposed, by: agent, text: "P&ID P-04 change: draw the trestle drip trays and the spill route to T-8101 (with its capacity basis, D-018), and define leak detection (low temperature or gas) along the trestle with its ESD action in the C&E.", response: "Partly answered by commit 79d5c7ad (D-018, D-031 item 5; layout): the design decides against drip trays along the welded trestle run over the water (not drainable on the real terrain, not vapour-tight); the shore end drains to the PR2 trough and T-8101, the platform to T-8102, and a rupture over the water is the marine transfer area case of the siting study. Still open: that siting case, the trestle leak detection and its ESD action in the C&E. Commit 709fcf20 (D-018, D-033 item 2; layout) removes the PR2 trough, so the trestle shore end has no collection either: the welded loading lines there carry no leak source and the vapour switch station is on the vapour returns only. Still open as before. Commit aedd8dbd (D-034 item 3, D-035 items 1, 6; layout and piping/pipe-specs.yaml) makes the welded-run requirement binding and gathers the platform-end flanged items in the header bay, and states the slow leak of a seal or tapping with the trestle line behind it as a residual for the siting study (S29). Still open: the trestle and header bay leak detection with its ESD action, and that siting case (A23). Commit c257902c (D-036 item 5 (a); P-04, instrument list) removes the platform-end tappings (clamp-on PI-4105 / PI-4106, strap-on TI-4103 / TI-4104) and moves the drain pump tie-ins downstream of XV-n101; SEQ-ESD S2 and SEQ-LINE-EMPTY name 'the header bay low-temperature and gas detection' with TSL-8104 and CCTV for locating a leak, but no header bay detector is drawn on P-04 / P-05 / P-06 or listed. Still open as before. Still proposed."}
  - {id: A11, status: proposed, by: agent, text: "Relief study: the thermal relief valves PSV-4111 / PSV-4112 are set at 15.5 barg (special items, ASSUMED) while D-023 gives 15 barg as the design pressure of the loading lines and arms; confirm the design pressure of LNG-4001 / LNG-4002 and set the valves at or below it.", response: "Answered in the design by commit 589c9ca7: PSV-4111 / PSV-4112 are set at 15.0 barg, the 15 barg design of the LNG lines and arms (piping/special-items.yaml, D-025 item 4: all relief valves at the line design). For the team to verify and close."}
  - {id: A12, status: proposed, by: agent, text: "C&E change for I-501 / I-601 and I-511 / I-611: never leave a vapour return closed at both switching valves - on ESD-1 keep XV-4131 (XV-4132) open or open XV-4135 (XV-4136) first; give XV-4131 / XV-4132 and XV-4135 / XV-4136 position switches for the make-before-break permissive, and record their fail positions in the instrument list.", response: "Answered in the design by commit fac0bbb5 (DESIGN.md D-026 item 1; review 2026-11-05-basic-design-2#1): I-501 / I-601 open the tank-side valve XV-4135 / XV-4136 and do not act on the flare valve; the switch is make-before-break in both directions with open-position switches ZSO-4131 / ZSO-4135 (ZSO-4132 / ZSO-4136): I-512 / I-612 close the tank-side valve only with the flare valve proven open, I-513 / I-613 close the flare valve only with the tank-side valve proven open; at fac0bbb5 all four valves failed open (instrument list HS-4131..HS-4136 of that commit; corrected below); the trestle thermal relief outlets tie in on the tank side of XV-4135. For the team to verify on P-04 and in the C&E and to close; S15 re-described, the new causes are S19 (switch signals) and S20 (ESD-1 during de-inerting). Commit 886b0ad5 (D-026 items 1, 14; review 2026-11-05-basic-design-3#1, #2) corrects the fail positions: only the tank-side XV-4135 / XV-4136 fail open, the flare valves XV-4131 / XV-4132 fail closed again (P-04 and its note, instrument list), so an air failure opens the return to the tanks and never opens the tank vapour header to the flare; I-511 / I-611 no longer act while ESD-1 is tripped; the position switches sense their valves. The fail-closed flare valve is the cause of S21. Still proposed."}
  - {id: A13, status: proposed, by: agent, text: "C&E change: close XV-4131 / XV-4132 when XV-4135 / XV-4136 does not prove closed within a set time after the switch to the flare, and on low tank pressure (I-204 / I-304); include the back-flow of tank vapour through BOG-4013 / BOG-4014 to the flare in the vacuum relief case of PSV-2133A/B/C / PSV-3133A/B/C (H-01 A13).", response: "Not answered by commit fac0bbb5: I-513 / I-613 now order the switch-back (the flare valve closes only after the tank-side valve is proven open), but only open-position switches are drawn, so nothing proves XV-4135 / XV-4136 closed after I-512 / I-612, no time-out closes the flare valve, I-204 / I-304 still do not act on XV-4131 / XV-4132, and the special items do not name the back-flow among the vacuum relief cases. Still open (S16, S19). Commit 886b0ad5 makes XV-4131 / XV-4132 fail closed (D-026 item 1), which removes the air failure as a cause of both valves open; the rest is unchanged at 54648679 (one open-position switch per valve kept, D-026 item 14; no time-out; I-204 / I-304 still do not act on XV-4131 / XV-4132; the vacuum relief cases of PSV-2133 / PSV-3133 in the special items still do not name the back-flow). Still open. Still proposed."}
  - {id: A14, status: proposed, by: agent, text: "Determine the required integrity of the switch-over I-511 / I-611 (single analyser AI-4133 / AI-4134, SIL null) and consider a second O2 measurement (or the H-04 A5 analyser upstream of D-7101) before the vapour is admitted to the tank vapour header; state the switch-over criterion (O2, N2, CH4 limits) and the analyser's response time in the instrument list; include the spurious switch to the flare in the flare load (H-05 A4).", response: "Partly answered by commit fac0bbb5 (DESIGN.md D-026 item 7): the criterion is stated, vapour to the flare only below 5 vol % O2 and to the tanks only below 1 vol % O2 and on hydrocarbon specification (ASSUMED, S-01 purge limit), above 5 % the berth does not take the vapour; AI-4133 / AI-4134 measure CH4, N2 and O2 (instrument list). Still open: the required integrity of I-511..I-513 / I-611..I-613 (single analyser, SIL null), a second O2 measurement before the tank vapour header, the analyser response time, and the spurious switch in the flare load (H-05 A4). Commit 886b0ad5 adds I-514 / I-614 (review 2026-11-05-basic-design-2#11): O2 above 5 vol % for 10 s on AI-4133 / AI-4134 closes the vapour arm isolation XV-5122 / XV-6122 (latching, manual reset), on the same single analyser. The integrity, the second O2 measurement, the response time and the flare load remain open. Commit f5d925f6 (D-028 item 5) gives the analyser two O2 cells voted 2oo2 for I-514 / I-614 (ASSUMED, analyser vendor; confirmed in the SIL screening), armed only in SEQ-LOAD S1 to S3; the switch-over I-511..I-513 still rests on the one analyser and its sample system. The integrity of I-511..I-513, an O2 measurement independent of the analyser before the tank vapour header, the response time and the flare load remain open. Commit 79d5c7ad (D-030 item 4) arms I-514 / I-614 on 'no liquid transfer' and makes the same O2 high-high a cause of ESD-1 during a transfer (S23); the voting of the O2 cells is in the SIL screening (hold H-06). The other items remain open. Partly answered by commit 709fcf20 (D-032 item 3): the berth analysers AI-5126 / AI-6126 (two cells, 2oo2, ASSUMED) are a second O2 measurement for the trips above 5 vol %, independent of AI-4133 / AI-4134, and the analyser response with the vote and closure (~40 s, ASSUMED) is stated in D-026.1. Still open: the integrity of the switch-over I-511..I-513 on the single tank-end analyser, an O2 measurement before the tank vapour header for vapour between 1 and 5 vol %, the analysers' response time from the vendor, and the spurious switch in the flare load (H-05 A4). Commit aedd8dbd (D-034 item 4) moves the berth analysers' sample point to the vapour arm side of XV-n122 and has AI-4133 / AI-4134 reading O2 at or above 5 vol % block I-511 / I-512 (the return held on the tanks); the switch-over between 1 and 5 vol % still rests on AI-4133 / AI-4134 alone. Still open as before. Still proposed."}
  - {id: A15, status: proposed, by: agent, text: "C&E change: add a discrepancy alarm and a time-out for each switching valve (command against ZSO-4131 / ZSO-4135 / ZSO-4132 / ZSO-4136 within the stroke time) with a defined safe state, consider closed-position switches on XV-4131 / XV-4135 (XV-4132 / XV-4136) so that the switch is proven by a second contact, and put the switches and their interlocks I-512 / I-513 (I-612 / I-613) in the proof test (S15, S19).", response: "Not answered by commit 886b0ad5: D-026 item 14 (review 2026-11-05-basic-design-3#4) keeps one open-position switch per switching valve because only the proven-open state is used, and ties each switch to its valve; no closed-position switch, discrepancy alarm, time-out or proof test is added. A false 'open' of one switch still closes the return at both valves (S15). For the team to decide. Partly answered by commit f5d925f6 (D-028 item 13; review 2026-11-05-basic-design-3#4 completed by review 4): I-512 / I-513 (I-612 / I-613) now require no standing discrepancy between each ZSO switch and its valve's command; a switch reading open while its valve has been commanded closed longer than the stroke time alarms and blocks the interlock, and a blocked I-513 leaves the return open (operator confirms locally). Still open: a time-out or alarm on a switch-over that does not complete (a switch failing to read open, S19), the closed-position switches (deferred to the SIL screening in detail engineering, D-028 item 13), the proof test, and a time limit on the both-open state of a blocked I-513 (S16). Still proposed."}
  - {id: A16, status: proposed, by: agent, text: "C&E / operating philosophy: decide the response of the vapour return switch to ESD-1 during a de-inerting, gassing-up or cool-down (S20): state how much off-specification vapour the tanks and the BOG compressors may receive (O2 and N2 limits against the compressor and trains' fuel gas tolerance), or keep XV-4131 open on ESD-1 while AI-4133 reads off-specification (both valves open, against the back-flow of S16), and include the ESD-1 test of SEQ-LOAD S3 in the decision.", response: "Partly answered by commit 886b0ad5 (D-026 item 1; review 2026-11-05-basic-design-3#2): the design decides for the tanks - I-511 / I-611 do not act while ESD-1 is tripped, so on ESD-1 (and on its S3 test, now in test mode) the return goes to the tanks, and an air failure does the same (S21). Still open: the O2 and N2 limits the tanks, the BOG compressors and the trains' fuel gas may receive, and the volume reaching them (S20, S21). Mostly answered by commit f5d925f6 (D-026 item 1, D-028 items 4, 8; review 2026-11-05-basic-design-4 #4): every ESD-1 trips the carrier through XS-5100 / XS-6100 (an effect of I-501 / I-601), so only the line pack of the vapour arm and the return reaches the tanks, at most ~1,100 m3 with at most 5 vol % O2, below 0.15 vol % O2 in the tank vapour space against the 1 vol % limit (ASSUMED), and the N2 it carries goes with the boil-off to the trains; the design accepts this. For the team to verify the estimate and the trains' tolerance of the N2 and to close. Commit 79d5c7ad (D-030 item 4) adds an ESD-1 cause the estimate does not cover: the O2 high-high during a transfer, whose line pack is above 5 vol % O2 by definition (S23, A19). Commit 709fcf20 (D-026.1 corrected by D-032 item 3) restates the bound with the O2 measured at the berth: the line pack at or below 5 vol % plus a slug of at most ~200 m3, together at most ~100 m3 of O2, below 0.25 vol % of the tank vapour space; the O2 reject also sends its slug to the tanks (S25). For the team to verify the estimate, the trains' tolerance of the N2 and the local O2-rich zone while it mixes, and to close. Commit aedd8dbd (D-034 item 4) adds the 30 min post-reset hold after an O2 reject, which sends about 1.5 line volumes of the carrier's off-specification return to the tanks on top of the D-026.1 bound (S26, agent estimate); D-026.1 does not state that volume (A25). Still proposed."}
  - {id: A17, status: proposed, by: agent, text: "C&E / operating philosophy: state the response to off-specification vapour admitted to the tanks on an instrument-air failure or a flare-valve fault during a de-inerting (S21) - for example stop the carrier's de-inerting through the ship-shore link and an alarm on ZSO-4131 / ZSO-4132 lost while AI-4133 / AI-4134 reads off-specification - and confirm with the valve vendor that XV-4135 / XV-4136 open at least as fast as XV-4131 / XV-4132 close on a common air failure, so that the vapour return is not closed at both valves for the stroke time (S15).", response: "Partly answered by commit f5d925f6 (D-028 items 1, 4): on an instrument-air failure the air-header trip I-804 initiates ESD-1 of both berths, which trips the carrier through XS-5100 / XS-6100 and so ends its de-inerting return; the vapour reaching the tanks is then the line pack of D-026 item 1. Still open: the response to a single solenoid or actuator failure of XV-4131 / XV-4132 during a de-inerting (no trip, no alarm on ZSO-4131 lost while AI-4133 reads off-specification), and the vendor's confirmation of the relative stroke times of XV-4135 and XV-4131 on a common air failure. Still proposed."}
  - {id: A18, status: proposed, by: agent, text: "Put the non-return valves, accumulators and speed controllers of XV-4101 / XV-4102 in the proof test (hold time of at least 5 min and closure time of 25-30 s, both ASSUMED) and on the maintenance setting list, and include their failure on an air loss in the D-023 transient analysis (case (4) names only the berth valves); if the surge at the tank end exceeds the line design, provide a surge relief or another layer there (S22).", response: "Partly answered by commit 79d5c7ad (D-030 items 10, 13; D-023 (4)): the tank-end case is in D-023 (4) as a check case of the transient analysis (hold H-01), named in the PSV-2141 / PSV-3141 relief cases and the UZ-4101 / UZ-4102 notes, with a pump header design pressure or a surge relief into the tank as the design change if it stays credible; the accumulator and hold-time sizing is hold H-03. Still open: the proof test and maintenance setting list of the non-return valves, accumulators and speed controllers, and the analysis itself. Still proposed."}
  - {id: A19, status: proposed, by: agent, text: "C&E / operating philosophy: extend the D-026 item 1 bound to an ESD-1 initiated by the O2 high-high during a transfer (vapour above 5 vol % O2, up to air), or keep that vapour out of the tank vapour header - for example close XV-5122 / XV-6122 once the loading pumps are proven stopped and the ERS and drum vent paths are confirmed open, or send it to the flare - and state the O2 the tanks, D-7101 and the BOG compressors may receive (S23).", response: "Answered in the design by commit 709fcf20 (D-026.1 corrected by D-032 item 3; review 2026-11-05-basic-design-6 adversarial check): the O2 trips act on the berth analysers AI-5126 / AI-6126, so the vapour above 5 vol % that reaches the tanks on an ESD-1 or a reject is the slug of the ~40 s response, vote and closure (at most ~200 m3, ASSUMED); with the line pack it is at most ~100 m3 of O2, below 0.25 vol % against the 1 vol % limit, and the slug never reaches the flare. For the team to verify the estimate (response time from the analyser vendor, A21) and close; the berth analyser failed low is H-03 S37. Still proposed."}
  - {id: A20, status: proposed, by: agent, text: "Consider confirming the 'not closed' of ZSC-2123 / ZSC-3123 against the valve command or a second switch before I-205 / I-305 stop the circulation pumps in loading, or a spray source for TV-7103 that does not depend on the circulation pump, so that a single switch fault at a tank high-high does not trip the BOG compressors during a loading (S24, H-04 S10); include the switches in the proof test (H-01 A23).", response: "Not answered by commit 709fcf20: D-032 item 7 (#3) moves the 15 s on-delay onto 'I-201 / I-301 tripped' and adds a command discrepancy alarm for a switch reading closed while its valve is commanded open (the false 'closed', H-01 S25); a false 'not closed' still stops the circulation and drain pumps on one switch, now also on a momentary one once the trip has stood 15 s, and no spray source independent of the circulation pump is added. Still proposed. Partly answered by commit c257902c (D-036 items 4, 5 (a); SEQ-LOAD S0, C&E I-201 / I-205 notes): in loading the spray is fed from the loading header back through LNG-2002, so while the loading pumps run it no longer depends on the circulation pump, and I-205 / I-305 no longer stop the drain pumps; the spray is still lost at the end of a loading if the circulation pump was stopped by a false 'not closed' (S24). Still open: the confirmation of the 'not closed' against the command or a second switch, and the proof test. Still proposed."}
  - {id: A21, status: proposed, by: agent, text: "Confirm with the analyser vendor the response and 2oo2 vote time of AI-5126 / AI-6126 and with the valve vendor the stroke of XV-n122 / XV-n125 that together set the ~40 s and the ~200 m3 slug of D-026.1, and the transit of the return against the stroke of XV-4135 / XV-4136 and I-513 / I-613 that keeps the slug off the flare; alarm a reject whose tank-side valve is not proven open within its stroke time (S25).", response: "Partly answered by commit aedd8dbd (D-034 item 4; C&E I-511 / I-512 / I-514): after a reset of I-514 / I-614 the return is held on the tanks for 30 min and while the tank-end analyser reads O2 at or above 5 vol %, so the slug trapped behind the closed vapour isolations no longer depends on the transit time to stay off the flare (S26). Still open: the analyser response and vote time, the valve strokes behind the ~40 s and ~200 m3, and the alarm on a reject whose tank-side valve is not proven open. Still proposed. Commit c257902c (D-036 item 8 #7) ends the hold when AI-4133 / AI-4134 has seen the slug pass or on the operator's release after the carrier's delivered return volume, instead of after 30 min (S26); the open items above are unchanged. Still proposed."}
  - {id: A22, status: proposed, by: agent, text: "Give XV-4107 an open- and a closed-position switch with a command discrepancy alarm, make 'XV-4107 proven open' the completion of SEQ-LOAD S0 / S3 and decide whether XV-4107 not open during a liquid transfer trips ESD-1 (as ZSO-5122) or only alarms, and whether XV-4103 needs a closed-position switch for the S0 completion; put the non-return valve, accumulator and speed controller of XV-4107 in the proof test and include its closure at set and at spring speed with the pumps running in the transient analysis (hold H-01) (S28, S30).", response: "Partly answered by commit c257902c (D-036 item 8 #5; P-04, instrument list, sequences): XV-4107 has ZSC-4107 / ZSO-4107 on the valve itself with a discrepancy alarm against UZ-4107; 'proven open' completes SEQ-LOAD S0 / S3, 'proven closed' SEQ-HOLD S1 and SEQ-ESD S1, and SEQ-ESD S2 recloses it from UZ-4107 if it is not proven closed. Decided: an alarm, not an ESD-1 trip, on XV-4107 not open during a transfer. Still open: a closed-position switch on XV-4103 (its closure in S0 is still the operator's), the proof test of the switches and of the non-return valve, accumulator and speed controller, and the closures in the transient analysis (hold H-01). Still proposed."}
  - {id: A23, status: proposed, by: agent, text: "Design owner / siting study: state how a trestle line leaking at the platform end after ESD-1 is emptied (N2 displacement back to the tanks, ASSUMED in D-035.14 (g)) and in what time, against the ~11 h (1 kg/s seal) and ~1 h (DN 80 tapping) to fill the ~87 m3 left in T-8102; add low-temperature or gas detection in the platform header bay with an alarm and the response (TSL-8104 is in the sump only), the T-8102 level indication with a high alarm of D-035.14 (j), and the escalation of a header bay fire to PR9 and the unisolable trestle inventory (~1,020 m3 per line, ~2,050 m3 in holding) in the siting study (S29, S30).", response: "Mostly answered in the design by commit c257902c (D-036 items 5, 6, 11 (b)-(d); D-037 items 2, 15 (a), (c), 16; P-04, P-08, C&E I-n01 bypass, I-805..I-808, SEQ-ESD S2, SEQ-LINE-EMPTY): the leaking line is emptied back to a tank with N2 from tank-end stations through the bottom-of-line crossover and the other line, the leak fed at ~1 kg/s for ~3.5 h at most, ~36 m3 into T-8102 within the 40 m3 kept; the DN 25 tappings and the drain pump tie-ins are no longer on the trestle side; T-8102 has LZT-8106 (LAH a transfer hold, LAHH I-805) and the dry-sump pump P-8103, so 170 + 40 = 210 of 257 m3 with no rain; the header bay takes 240 min PFP and fire-tested valves (layout). Still open: header bay low-temperature or gas detection with an alarm (named in SEQ-ESD S2, not drawn), the site N2 rate and its back-up (hold), the qualification of the crossover actuator package to stroke in the fire, the two-phase displacement in the transient analysis (hold H-01), the residual leak at XV-4107 / XV-4103 themselves and the escalation to the trestle inventory in the siting study; the failures of the new sequence are S31 to S33 (A26, A27). Still proposed. Commit ae718797 (D-039 item 3, D-039.9; D-040 layout) restates the bound against the N2 rate (~3,500 Nm3/h the minimum, the acceptance value of hold H-07), removes the low-N2 abort, holds the line isolated on an abort with a restart from S1, and carries rain on the T-8102 pool as SC-3 (H-05 S36). Still open as before (the header bay detection is still not drawn or listed); the new failures are S34, S35 (A28). Still proposed."}
  - {id: A24, status: proposed, by: agent, text: "Confirm the design pressure of the circulation pumps P-2102 / P-3102, their columns and the check valves CV2122 / CV3122 against the loading line pressure since D-034 (949.5 kPa(a) at the pump header, about 11 barg at the circulation pump depth and about 13 barg at the loading pumps' shut-off, agent estimates), or re-rate them as the loading pumps (15 barg); confirm the ASSUMED 1.25 x shut-off of the loading pumps with the vendor's curve and the surge margin of the 15 barg lines on top of it in the transient analysis (hold H-01) (S27).", response: "Answered in the design by commit c257902c (D-036 items 4, 11 (e); equipment list, datasheets P-2102 / P-3102): the circulation pumps, their columns, discharge heads and minimum-flow tees are designed for 15 barg, the loading system's class, against one shut-off basis of ~12.2 barg at the pump with a full tank (scripts/terminal_sizing.py), so a passing check valve is no overpressure case. For the team to verify and close; still open: the vendor's curve for the 1.25 x shut-off and the surge margin on top of it in the transient analysis (hold H-01). Still proposed."}
  - {id: A25, status: proposed, by: agent, text: "C&E / operating philosophy: state the volume and the O2 and N2 of the carrier's return the tanks receive during the 30 min post-reset hold of I-n11 / I-n12 (about 1.5 line volumes, ~1,650 m3, up to ~80 m3 of O2 at 5 vol %, agent estimate) and add it to the D-026.1 bound, or have the carrier hold its return for that time; and put the hold's timer and AI-4133 / AI-4134 condition in the proof test, since a lost hold sends the trapped slug to the flare (S26, H-05 S18).", response: "Partly answered by commit c257902c (D-036 item 8 #7; C&E I-511 / I-512 / I-514, SEQ-LOAD S1): the hold ends on AI-4133 / AI-4134 having seen the slug pass (O2 above 1 vol % and back below for 5 min) or on the operator's release after the carrier confirms 1.5 return-line volumes (~1,600 m3 of the ~1,060 m3 line) delivered, no longer on a timer; the reset condition of I-n14 is written in its notes and SEQ-LOAD S1. Still open: the volume and O2 / N2 the tanks receive during the hold added to the D-026.1 bound, the end of the hold on a partial slug (spread out in the 2.45 km line) and the proof test of the AI-4133 / AI-4134 condition. Still proposed."}
  - {id: A26, status: proposed, by: agent, text: "SEQ-LINE-EMPTY / P-04 / C&E: prove the return path open before the N2 blocks can be opened (closed- and open-position switches on XV-4103 / XV-4105, or a permissive in the sequence logic instead of an operator's completion), give PI-4156 / PI-4158 a remote high alarm (orifice no longer choked: return blocked) and the receiving tank level a 'not rising' alarm during S2, tag the station, the override key and the valves to the leaking line so the wrong line or station cannot be opened, and state what is done with an open N2 station when I-201 or the operator closes the return; detect a passing inner block HV-4151 / HV-4153 (low temperature or flow at the bleed) and route the bleeds N-4003 / N-4004 away from work positions; put CV-4151 / CV-4152 and the blocks in the proof test; confirm the site N2 pressure stays above the line pressure for the whole displacement, with the abort on PI-4155 / PI-4157 acted on in time (S31, S33; H-05 S34).", response: "Partly answered by commit ae718797 (D-039 items 3, 5, D-039.9 (a), (b), (d); P-04, SEQ-LINE-EMPTY, SEQ-ESD S2): a blocked return or no N2 entering is seen in the control room on the return flow (FIC-4102 / FIC-4101, the no-N2 abort), and PI-4163 / PI-4164 read the line beyond the check valve; what is done with an open station when the return closes is written (the abort holds the line isolated, blocks open behind the check valve, the regulator limiting it, restart from S1); the bleeds are locked closed, so a passing inner block no longer vents at the station (the check on rounds between the blocks); the check valve sits on the line side of the inner block; the low-N2 abort is withdrawn and the reduced-rate case written. Still open: position switches on XV-4103 / XV-4105 or a sequence permissive before the N2 blocks open, a remote alarm of the station (PI-4156 / PI-4163 are local), the tagging of station, key and valves to the leaking line, the proof test of CV-4151 / CV-4152