  - {id: SG2, title: "Interlock I-501 (I-601): ESD-1 stops the loading pumps and trips the carrier through XS-5100 (XS-6100)", kind: interlock, interlock: I-501, refs: [XS-5100, P-2101A, P-2101B, P-2101C, P-2101D], status: proposed, by: agent, notes: "Since f5d925f6 the carrier trip is an effect and the air-header trip I-804 is a cause (D-028 items 1, 4). Since 79d5c7ad (D-030 items 4, 7, 8, 9) the manual push buttons and the confirmed platform fire and gas are causes in the logic, and during a liquid transfer also ZSO-5122 not open, the 2oo2 O2 high-high of AI-4133, the loss of the ERS solenoid supply and the other berth's ESD-1 (I-601). Since 709fcf20 (D-032) the causes are tags (HS-5100, XS-5108), the transfer state is ZSC-5101 not closed or UZ-5101 energised, the O2 high-high is that of AI-5126 or AI-4133 and the supply causes are XA-5130A / B; P-2102 / P-3102 are not stopped (D-016). Since aedd8dbd (D-034 items 1, 5, 7, 9) the manual causes are one tag per station, HS-5100A / B / C (control room, jetty head, platform), each a normally closed, line-monitored input; XA-5130A / B also take the line monitoring of every solenoid circuit of their channel; the link's 'no carrier connected' mode ends by itself on a healthy link or an unstowed arm, after which XS-5100 not healthy trips; and the effects include the DN 800 platform crossover XV-4107. Since c257902c (D-036 items 6, 11 (d), (e); D-037.16) during a transfer the jetty sump high-high I-805 is also a cause, and after a trip the close outputs on XV-4101 / XV-4102 / XV-4107 may be overridden for SEQ-LINE-EMPTY only (bypass field: key per valve, permitted with every loading pump proven stopped and XV-5101 / XV-6101 proven closed, removed by the SIS). Since ae718797 (D-039 items 1, 5 #7; C&E I-501 / I-601) the tank-area sump high-high I-809 is also a transfer cause, and ESD-1 also stops the jetty drain pump P-5101 (P-6101), which would otherwise dead-head against the closed berth header."}
