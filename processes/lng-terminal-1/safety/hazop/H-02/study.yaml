risk_matrix: safety/risk-matrix.yaml
assessment_basis: >-
  Each scenario is rated per category before its safeguards (initial): severity is the credible
  worst outcome if every safeguard fails, likelihood that of the cause. The codes are agent
  proposals with their basis, for the team to accept or change. Residual ratings are proposed
  (by the agent, status proposed) only for the scenarios whose safeguards changed in commit
  589c9ca7 and where a new layer independent of the cause now exists as drawn: the severity is
  kept, the likelihood is lowered by one code per independent layer named in the basis, and
  nothing is credited whose capacity or integrity the files leave open. Crediting safeguards
  remains the team's judgement (and a LOPA's where needed). The matrix is the example matrix
  of cheme init (example: true), so the bands are illustrative. The revision for commit
  fac0bbb5 (D-026) rates the new scenarios S19 and S20 before safeguards only; S15 and S16 keep
  their ids and are re-described for the causes that remain. The revision for commit 54648679
  (886b0ad5, D-026 items 1, 14) rates the new scenario S21 before safeguards only; the existing
  ratings keep their codes, and the texts that the changed fail positions, the I-511 / I-611
  ESD-1 condition and the SEQ-HOLD line-up no longer match are corrected in place. The revision
  for commit f5d925f6 (D-028) rates the new scenario S22 before safeguards only; the existing
  ratings keep their codes (the changes add safeguards, fail positions and closure order, and
  the causes the codes rest on remain), and the texts they touch are corrected in place. The
  revision for commit 79d5c7ad (D-030) rates the new scenarios S23 (an ESD-1 on the O2 high-high
  during a transfer sends vapour above 5 vol % O2 to the tanks) and S24 (a spurious 'not closed' of
  ZSC-2123 / ZSC-3123 stops the circulation and drain pumps in loading) before safeguards only;
  the existing codes are kept and the texts on the pump stops, the I-514 arming and the tank-end
  residual case are corrected in place. The revision for commit 709fcf20 (D-032) rates the new
  scenario S25 (the O2 reject at the berth switching the vapour return to the tanks during a
  de-inerting or gassing-up) before safeguards only; the existing codes are kept, and the texts on
  the transfer state, the O2 analysers and the D-026.1 bound, the I-205 / I-305 timer, the
  circulation pump on ESD-1 and the tank-area spill collection are corrected in place.
team: []            # to be named by the project; no team has sat on this draft yet
notes: >-
  Drafted by an agent (skills hazop-study, hazop-equipment-causes, relief-scenarios,
  safeguard-crediting). T-3101 pumps are identical to T-2101's (D-019): scenarios name the
  T-2101 tags with the T-3101 tags in brackets. Surge figures quoted are the slow-closure
  estimate of DESIGN.md D-023 (ASSUMED wave speed; a transient analysis is still to confirm it).
nodes:
  - id: N1
    title: In-tank loading pumps P-2101A..D (P-3101A..D), columns and minimum-flow returns
    design_intent: >-
      Each submerged-motor pump delivers up to 3,000 m3/h at ~132 m (577 kPa differential)
      through its column and check valve CV2121A..D into the header LNG-2001 (LNG-3001), DN 800, to
      loading line A (B); FIC-2111A..D keep each pump above 900 m3/h by returning LNG through
      FV-2111A..D (fail open) and LNG-2021..2024 into the tank (D-011). Since 589c9ca7 each
      column has an isolation valve HV-2151A..D downstream of its check valve and a vent / N2
      purge HV-2161..HV-2164 (vendor to confirm), and the header LNG-2001 (LNG-3001) has its
      thermal relief PSV-2141 (PSV-3141) into the tank (D-025 item 2).
    members: [P-2101A, P-2101B, P-2101C, P-2101D, P-3101A, P-3101B, P-3101C, P-3101D, LNG-2001, LNG-2012, LNG-2013, LNG-2014, LNG-3001, FIC-2111A, FV-2111A, FIC-2111B, FIC-2111C, FIC-2111D, PI-2117, PI-3117, LNG-2021, HV-2151A, HV-2151B, HV-2151C, HV-2151D, HV-2161, HV-2162, HV-2163, HV-2164, PSV-2141, LNG-2031, PSV-3141, LNG-3031]
    status: proposed
    by: agent
    deviations:
      - id: N1-NF
        guide_word: "no"
        parameter: flow
        scenarios:
          - id: S1
            cause: >-
              Discharge blocked while a loading pump runs: XV-4101 (XV-4102) closed by I-501 /
              I-601 before the pumps have stopped, FV-4101 stuck closed, or the carrier's manifold
              valves closed; since f5d925f6 also XV-4101 closing on a loss of instrument air ahead
              of the I-804 pump stop with a failed non-return valve or accumulator (S22); and
              FV-2111A (minimum flow) fails to open or is stuck.
            consequence: >-
              The pump runs against a closed discharge; the LNG in the column heats and flashes;
              bearing and motor damage of the submerged-motor pump, vibration in the column.
            refs: [P-2101A, XV-4101, FV-4101, FV-2111A]
            modes: [loading, startup]
            safeguards: [SG1, SG2]
            actions: [A1]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: C, status: proposed, by: agent, basis: "In-tank pump damage, pump pulled through its column; matrix 3 = plant down for weeks (for that pump). C: blocked discharges occur several times in the plant life.", band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: 4255ea3f73fe5efe, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '3', likelihood: C}}}
      - id: N1-RF
        guide_word: reverse
        parameter: flow
        scenarios:
          - id: S2
            cause: A loading pump stops while the others keep the header LNG-2001 pressurised; its check valve CV2121A leaks or sticks open.
            consequence: Back flow through the stopped pump into the tank; reverse rotation; the pump cannot be restarted until the flow stops.
            refs: [P-2101A, LNG-2001, {sheet: P-02, object: CV2121A}]
            modes: [loading]
            safeguards: [SG3]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "2", likelihood: C, status: proposed, by: agent, basis: "Pump damage on restart; matrix 2 = plant down for days (one pump).", band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: b67377b30017f4a1, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '2', likelihood: C}}}
      - id: N1-HP
        guide_word: more
        parameter: pressure
        scenarios:
          - id: S3
            cause: >-
              After ESD-1 (I-501) the pumps stop and XV-4101/XV-4102 close: the headers LNG-2001
              and LNG-3001, the tank-end crossover LNG-4006, the circulation header LNG-2002 /
              LNG-3002 and the spray line LNG-4008 are blocked in between the pump check valves
              CV2121A..D, CV2122 (CV3121A..D, CV3122), FV-4101/XV-4101, XV-4105 and TV-7103 (fails
              closed), and warm up. The thermal relief valves PSV-4111/PSV-4112 are downstream of
              XV-4101/XV-4102 and do not reach this section; the minimum-flow returns branch off
              upstream of the check valves.
            consequence: Thermal expansion of trapped LNG overpressures the DN 800 headers on the tank roof and at the trestle start; flange leak, LNG release at height.
            refs: [LNG-2001, LNG-3001, LNG-4006, LNG-2002, XV-4101, XV-4102, {sheet: P-02, object: CV2121A}, PSV-2141, PSV-2142, PSV-3141, PSV-3142, PSV-4113]
            modes: [loading, startup]
            safeguards: [SG14]
            actions: [A2]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "3", likelihood: C, status: proposed, by: agent, basis: "LNG leak on the tank roof or tank-area rack; matrix 3 = lost-time injury. C: every ESD-1 blocks the section in.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: b6fe1208a949a698, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '3', likelihood: C}}}
              residual:
                - {category: people, severity: "3", likelihood: B, status: proposed, by: agent, basis: "Agent proposal for the team: one layer credited, the thermal relief valves added in 589c9ca7 whose relief case is this one: PSV-2141 / PSV-3141 on the pump headers and PSV-2142 / PSV-3142 on the circulation headers into the tanks, PSV-4113 on the tank-end crossover LNG-4006 into vapour return A, since fac0bbb5 on the tank side of XV-4135 (BOG-4015, D-026 item 11), so independent of the switch; all at the 15 barg line design.", evidence: [piping/special-items.yaml, DESIGN.md D-025], band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: aa86891dd127d418, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '3', likelihood: B}}}
            notes: >-
              Revised for 589c9ca7 (D-025 items 2, 3): the blocked-in sections now have thermal
              relief; this answers A2 for this scenario. The spray line LNG-4008 behind TV-7103 is
              not named among the new relief cases: the team to confirm it is covered.
      - id: N1-OT
        guide_word: other-than
        parameter: start-up condition
        scenarios:
          - id: S4
            cause: A loading pump is started with its column warm or not filled and vented (after maintenance or a long standstill).
            consequence: Vapour lock and cavitation at start; geysering of vapour and liquid in the column; pump and column damage.
            refs: [P-2101A, LNG-2001, HV-2161]
            modes: [startup, cooldown]
            safeguards: [SG1, SG15]
            actions: [A3]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "2", likelihood: C, status: proposed, by: agent, basis: "Pump damage; matrix 2 = plant down for days.", band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: b67377b30017f4a1, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '2', likelihood: C}}}
            notes: >-
              Since 589c9ca7 each column has a vent and N2 purge connection HV-2161..HV-2165
              (HV-3161..HV-3165) to the roof, blind-flanged, vendor to confirm (line list BOG-2011
              ff.); no start permissive (column full and cold) is in the sequences, so no residual
              is proposed.
  - id: N2
    title: Circulation P-2102 (P-3102), circulation header and return to the tanks
    design_intent: >-
      In holding, P-2102 (or P-3102) sends ~314 m3/h (rated 500 m3/h, minimum flow 150 m3/h by
      FIC-2112 / FV-2112) through LNG-2002 into loading line A, through the platform crossover
      LNG-4003 (XV-4103 open) and back on line B and LNG-4005 (XV-4105 open) to T-2101 (XV-2123) or
      T-3101 (XV-3123), with the return TI-4102 less than 3 K above the tank liquid; it also
      feeds the desuperheater spray LNG-4008 (D-008, D-010). Since 589c9ca7 the circulation
      header has thermal relief PSV-2142 (PSV-3142), the return LNG-4005 / LNG-4009 PSV-4114, and
      I-201 / I-301 close XV-2123 / XV-3123 on tank high-high level (D-025 items 2, 3). Since
      886b0ad5 SEQ-HOLD needs ESD-1 of both berths reset (I-501, I-601) as a permissive, its S1
      opens the tank-end ESD valves XV-4101 / XV-4102 and puts FIC-4101 / FIC-4102 in manual with
      FV-4101 / FV-4102 fully open (the circulation flow is set by P-2102), and completes only
      with XV-4101 / XV-4102 open (D-026 item 14). Since f5d925f6 (D-028 item 3) XV-2123 / XV-3123
      fail closed (were fail last); on an instrument-air failure the circulation stops, the pumps
      run on their fail-open minimum flow and PSV-4114 relieves the blocked return (HS-2123 /
      HS-3123 notes, F-AIR). At f5d925f6 I-201 / I-301 also stopped P-2102 / P-3102 and P-5101 /
      P-6101 on every high-high level; since 79d5c7ad (D-030 item 1) they close the fill and the
      return only, and the closed-position switch ZSC-2123 / ZSC-3123 on the valve with the trips
      I-205 / I-305 stops those pumps only while I-201 / I-301 has tripped and the switch does not
      read closed 15 s after the trip (ASSUMED); in loading XV-2123 / XV-3123 are closed and proven
      closed in SEQ-LOAD S0, so the circulation pump keeps the desuperheater spray LNG-4008 and the
      drain pumps keep emptying D-5101 / D-6101 on a tank high-high; in holding the circulation
      pump then runs on its minimum flow against the closed return and PSV-4114 relieves the
      blocked-in return (C&E I-205 / I-305 notes). Since 709fcf20 (D-016, D-032 items 6, 7): the
      15 s on-delay of I-205 / I-305 sits on 'I-201 / I-301 tripped', not on the switch, and
      ZSC-2123 / ZSC-3123 reading closed while the valve is commanded open longer than its stroke
      time raises a discrepancy alarm; ESD-1 does not stop P-2102 / P-3102 (the closure against
      500 m3/h gives ~150 kPa even if instant, the pump runs on its fail-open minimum flow, and it
      keeps the spray and the holding circulation); an idle berth no longer trips ESD-1 through its
      link or its stowed arms, so it does not stop holding (D-016).
    members: [P-2102, P-3102, FIC-2112, FV-2112, FIC-3112, LNG-2002, LNG-3002, LNG-4003, XV-4103, LNG-4005, LNG-4009, XV-4105, XV-2123, XV-3123, XV-4106, TI-4102, TI-4103, TI-4104, PSV-2142, LNG-2032, PSV-3142, PSV-4114, BOG-4016, HV-2152, HS-2123, HS-3123, ZSC-2123, ZSC-3123]
    modes: [holding]
    status: proposed
    by: agent
    deviations:
      - id: N2-NF
        guide_word: "no"
        parameter: flow
        scenarios:
          - id: S5
            cause: >-
              Circulation stops in holding: P-2102 trips (power, I-202) or is not restarted after a
              loading, or XV-4103 / XV-4105 / XV-2123 closed, or the tank-end ESD valves XV-4101 /
              XV-4102 left closed after an ESD-1. Since f5d925f6 also: a loss of instrument air
              closes XV-2123 / XV-3123 (fail closed) and, through I-804, ESD-1 closes XV-4101 /
              XV-4102. Since 79d5c7ad (D-030 item 1): I-201 or I-301 (1oo2, real or spurious)
              closes the return valve of its tank, which stops the circulation flow in holding (the
              pump on its minimum flow), and I-205 / I-305 stop both circulation pumps when the
              return is not proven closed after the trip, or on a ZSC-2123 / ZSC-3123 fault (S24);
              at f5d925f6 I-201 / I-301 stopped both pumps on every trip.
            consequence: >-
              The 2.45 km DN 800 lines warm up (~380 kW ingress, D-012); vapour pockets form at
              the high points and push liquid back (geysering into the tank and the vapour header,
              tank pressure surge); on restart the vapour collapses or is swept as slugs (hammer);
              top-to-bottom temperature differences bow the lines on the trestle; the next loading
              starts from warm lines (longer cooldown, large vapour to the BOG system).
            refs: [P-2102, LNG-4001, LNG-4002, XV-4103, XV-4105, TI-4102]
            safeguards: [SG4, SG5, SG6]
            actions: [A4, A5]
            status: proposed
            by: agent
            notes: >-
              Revised for 54648679 (886b0ad5, D-026 item 14): until then SEQ-HOLD did not open
              XV-4101 / XV-4102, which I-501 / I-601 close on every ESD-1, so holding could start
              against a closed loop; SEQ-HOLD S1 now opens both and completes only with them open,
              and the ESD-1 of both berths must be reset first. The remaining causes are the pump
              trip, a valve closed or failing closed in holding and a restart not made; the codes
              are kept. Revised for f5d925f6 (D-028 items 1, 3): a tank high-high trip and an air
              failure now also stop the circulation by design (pumps stopped, return valve fail
              closed); the restart after them is the same SEQ-HOLD. Codes kept. Revised for
              79d5c7ad (D-030 item 1): the tank high-high now stops the flow by closing the return
              valve, the pumps only through I-205 / I-305; the cause class is unchanged. Codes kept.
              Revised for 709fcf20 (D-016, D-032 items 1, 5): an ESD-1 of a berth closes the shared
              XV-4101 / XV-4102 and so stops holding; the idle berth's link in its 'no carrier
              connected' mode and its stowed arm switches are no longer causes of it, while a false
              'not closed' of ZSC-5101 / ZSC-6101 at an idle berth now is (H-03 S31). The cause class
              is unchanged. Codes kept.
            risk:
              initial:
