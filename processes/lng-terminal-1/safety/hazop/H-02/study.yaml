  - id: N4
    title: Platform end of the trestle lines - DN 800 crossover LNG-4010 (XV-4107) and DN 250 holding bypass LNG-4003 (XV-4103)
    design_intent: >-
      Added for aedd8dbd (D-034 items 1, 3; review 2026-11-05-basic-design-7 #1). In loading the
      DN 800 crossover LNG-4010 (tees T4A5 / T4B5) with its ESD valve XV-4107 (UZ-4107: fail
      closed, non-return valve and local air accumulator on the actuator supply, speed controller on
      the exhaust, 25-30 s, ASSUMED) is open, so line B reaches Berth 2 and line A Berth 1 at
      6,000 m3/h each (3.4 m/s, ~6 kPa across it); SEQ-LOAD S0 opens it and closes the DN 250 holding
      bypass XV-4103 (HS-4103), and its completion checks XV-4107 open and XV-4103 closed (no
      position switch on either valve is drawn); ESD-1 of either berth (I-501 / I-601) closes
      XV-4107 with XV-4101 / XV-4102 after the loading pumps have stopped, so after a trip a leak
      upstream of a shore ESD valve is fed by one trestle line; SEQ-LOAD S3 reopens it after the
      ESD-1 tests; SEQ-HOLD S1 closes it and opens XV-4103 (500 m3/h at 2.7 m/s), which at aedd8dbd
      also took the jetty drain pumps (no longer since c257902c). XV-4107, XV-4103 and their tees have butt-weld ends (ASSUMED) and,
      from the layout (D-035 item 1; not an analysed input), stand with the junction drops of
      XV-5101 / SR-5102 and XV-6101 / SR-6102 and PI-4105 / PI-4106 / TI-4103 / TI-4104 in the
      header bay at the platform's south end, which drains to T-8102; PR9 and the PR2 end carrying
      the loading lines take passive fire protection and the lines a fire-rated jacket for 60 min
      (ASSUMED, fire protection engineer). Governing platform spills (D-034.3): downstream of
      XV-n101 the berth header flow until ESD-1 closure, ~170 m3 per berth; upstream of XV-n101 the
      same flow until closure, ~140 m3, then the trestle line behind the leak, up to ~1,020 m3
      (line A) or ~1,030 m3 (line B), ~2,050 m3 with the crossovers open (holding). Since c257902c
      (D-036 items 5, 8 #5, 11 (b); P-04; C&E I-n01; SEQ-LOAD S0 / S3, SEQ-HOLD S1, SEQ-ESD S1 / S2):
      XV-4107 has a closed- and an open-position switch ZSC-4107 / ZSO-4107 on the valve itself,
      used in the completion of SEQ-LOAD S0 / S3 (open), SEQ-HOLD S1 and SEQ-ESD S1 (closed), with a
      discrepancy alarm against UZ-4107 (no trip on 'not open'); SEQ-ESD S2 has the operator close it
      again from UZ-4107 if it is not proven closed. On the trestle side of the shore ESD valves only
      the stem and bonnet seals of XV-n101, XV-4107 and XV-4103 remain as leak sources (butt-welded
      ends; PI-4105 / PI-4106 clamp-on, TI-4103 / TI-4104 strap-on; the drain pump returns enter the
      berth headers downstream of XV-n101, tees T4X5 / T4X6 removed). LNG-4003 (tees T4A4 / T4B4) and
      LNG-4010 (T4A5 / T4B5) leave the bottom of both loading lines at the low point of the trestle
      run, the lines falling to them without a pocket (the 3D model keeps them at the centreline, a
      cheme-as-code 1.7.0 limitation, D-037.16 (d)). A leak there after ESD-1 is ended by
      SEQ-LINE-EMPTY (N5): ~0.5 h to line up, ~2.3 h of displacement, the leak fed at ~1 kg/s for ~3.5
      h at most, ~36 m3 into T-8102 inside the 40 m3 kept (D-036.11 (b)). From the layout (D-037,
      not an analysed input): the header bay frame PR10 and the aisle S-HDR at 4.5 m give access to
      XV-n101 and SR-n102, XV-4107 / XV-4103 are maintained by exchange from a MEWP; PR10, PR9's south
      bay and every line, valve body, actuator and cable there take 240 min PFP; XV-n101 / XV-4107 /
      XV-4103 are fire-tested to API 607 or ISO 10497, and the crossover actuator packages are to
      stroke once after at least 60 min of pool fire (ASSUMED, valve vendor); T-8102 is kept dry by
