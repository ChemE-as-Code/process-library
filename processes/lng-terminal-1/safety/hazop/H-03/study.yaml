        description: Created by the closed-position switch ZSC-5101 (ZSC-6101) on the shore ESD valve and the SIS output UZ-5101 (UZ-6101) as the liquid transfer state of I-501 / I-514 (I-601 / I-614), added in 709fcf20 (D-032 item 1).
