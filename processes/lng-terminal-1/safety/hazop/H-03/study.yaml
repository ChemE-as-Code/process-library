            notes: >-
              New scenario for 709fcf20 (D-032 item 1; review 2026-11-05-basic-design-6 #1): the
              transfer state no longer rests on the loop transmitters FIC-4101 / FIC-4102, so a
              transmitter failing low cannot disarm ESD-1; the switch that replaces them fails
              toward the transfer state by design (the safe direction for the ESD-1 causes), which
              makes a false 'not closed' a trip at an idle berth and a disarmed reject in the
