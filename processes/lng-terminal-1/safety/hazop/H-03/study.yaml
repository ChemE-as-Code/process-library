  - {id: SG12, title: "ESD-2 of Berth 2: I-503 on the envelope switches trips ESD-1 (I-501) at once; I-507 closes the ERS valves XV-5131..XV-5134 / XV-5141..XV-5144 (and since aedd8dbd the arm isolations) 5 s after I-503; the couplers release by I-510 (at 709fcf20 by I-507)", kind: interlock, interlock: I-507, refs: [ZS-5151, XV-5131, XV-5141, XV-5101], status: proposed, by: agent, notes: "ESD-1 first and the 5 s delay since 589c9ca7 (D-025 item 4); since fac0bbb5 the ERS closure and release are the separate interlock I-507 (delay 5 s, latching, manual reset) and ESD-2 reaches ESD-1 as a cause of I-501 (D-026 item 2). SIL null. Since 79d5c7ad (D-016, D-030 item 3) each ERS valve trips on two line-monitored solenoids in series (2oo2) on the UPS, and the couplers release on positive command only after the ERS valves are proven closed; the fail-to-vent on demand is S28. Since 709fcf20 (D-016, D-032 item 2) the two channels are on UPS A / UPS B (XA-5130A / B), each solenoid is proven by the ERS function test of SEQ-LOAD S1 before every transfer, the coupler release is commanded 7 s after the ERS close command (ASSUMED), not on the proven-closed position (S35), and the manual ESD-2 is the push button HS-5107. Since aedd8dbd (D-034 items 6, 7, 9): I-507 also closes the arm isolations XV-5121 / XV-5123 / XV-5124 at their set speed and XV-5122 / XV-5125; the couplers UY-5135..UY-5138 are released by I-510 on both ERS valves of the arm proven closed or at 7.5 s; the ERS test is permitted by I-509; the manual ESD-2 push buttons are HS-5107A / B / C; each coupler has its own accumulator on the arm (layout D-035, ASSUMED)."}
  - {id: SG13, title: "Loading permissives: carrier moored and mooring loads within limits, wind below 30 kn, waves below 1.5 m (SEQ-LOAD, S-01)", kind: procedural, refs: [XS-5100], status: proposed, by: agent}
  - {id: SG14, title: "Link healthy as a loading permissive (SEQ-LOAD)", kind: procedural, refs: [XS-5100], status: proposed, by: agent, notes: "Since 709fcf20 SEQ-LOAD S1 switches the link from its 'no carrier connected' mode to the carrier's link once the cable is connected and healthy; whether the permissive distinguishes the mode is not stated (S36). Since aedd8dbd (D-034 item 5) S1 completes only with XS-5100 in carrier mode and healthy, the mode ends by itself, and I-508 (SG38) blocks the open command of XV-5101 otherwise."}
