# HAZOP study H-03: a DRAFT until the team has accepted every entry and a
# human review record covers it (cheme safety hazop check). Schema: cheme schema
# hazop-study; workflow: safety/README.md and the skill hazop-study.
# Drafted by an agent from the plant as drawn (P-05, P-06, P-04 rev A, C&E, loops,
# sequences, special items). Every entry is a proposal for the team: status proposed.
schema: cheme/hazop-study/v1
kind: hazop-study
id: H-03
title: Berths, loading arms and ERS
scope: >-
  Detail-stage HAZOP of Berth 2 (P-05) and Berth 1 (P-06): the berth liquid header LNG-5001 /
  LNG-6001 with the shore ESD valve XV-5101 / XV-6101, strainer SR-5102 / SR-6102 and surge relief
  PSV-5131 / PSV-6131; the four 16 inch arms per berth (liquid, vapour, hybrid, liquid) with
  their isolation valves, ERS ball valves and envelope monitoring; the vapour line BOG-5001 /
  BOG-6001; the jetty drain drum D-5101 / D-6101 and pump P-5101 / P-6101; the N2 connection
  N-8001 / N-8002 with HV-5151 / HV-6151; the ship-shore link XS-5100 / XS-6100 and the
  interlocks I-501..I-503, I-601..I-603. The trestle lines are in H-02, the BOG system in H-04,
  the jetty sump T-8102 and the N2 supply in H-05. Not covered: the carrier (its cargo system,
  ESD valves and return-gas compressor), mooring equipment and the arm hydraulics (vendor
  package), which appear only as causes.
modes:
  - {id: holding, title: Holding, description: "No carrier: arms stowed, berth header isolated by XV-5101 / XV-6101; the circulation passes the platform crossover LNG-4003 (H-02)."}
  - {id: loading, title: Loading, description: "One carrier at one berth: 3 liquid arms at ~4,000 m3/h each, vapour arm (and hybrid arm as spare vapour path), SEQ-LOAD S4 and S5."}
  - {id: cooldown, title: Cooldown, description: "Arms and carrier manifold cooled at 500 m3/h with ESD tests before and after (SEQ-LOAD S3)."}
  - {id: startup, title: Connection and disconnection, description: "Connect, N2 leak test and purge (SEQ-LOAD S1, S2); drain, purge and disconnect (S6); ESD response (SEQ-ESD)."}
analysed:
  - {path: pid/P-05.xml, revision: 'sha256:5fb5750b209ed62b738551d658ac3e357fd8925f3773c30aff5ecfb490832255', relation: analyses}
  - {path: pid/P-06.xml, revision: 'sha256:2f5d968daefd641688566b6e78432ea80238385087aecd07fd75d8f95f5329b8', relation: analyses}
  - {path: pid/P-04.xml, revision: 'sha256:f754f92f07fa025c16b8d4863aca70a1caa78b3ffb9590158a13742606ae6976', relation: analyses}
