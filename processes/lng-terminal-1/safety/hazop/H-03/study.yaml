              Pressure surge at the manifold, in the arms and the header; D-023 gives +1,753 kPa
              more for an instant closure, beyond the 15 barg design of the arms and lines:
              swivel or coupler failure, LNG spray on the carrier deck and the platform, LNG into
              the sea (rapid phase transition), cold embrittlement of deck and platform steel.
            refs: [LA-5101, LA-5103, LA-5104, LNG-5001, PZT-5103, PSV-5131]
            modes: [loading]
            safeguards: [SG1, SG2, SG3]
            actions: [A1]
            status: proposed
            by: agent
            risk:
