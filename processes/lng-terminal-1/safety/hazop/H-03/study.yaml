# (DESIGN.md D-034: one tag per manual ESD station HS-n100A / B / C and HS-n107A / B / C, each a
# normally closed input; the 'no carrier connected' link mode ending by itself and the new
# permissive I-n08 on the open command of XV-n101; I-n07 also closing the arm isolations and the
# new I-n10 releasing each coupler UY-n135..n138 on its ERS valves proven closed or at 7.5 s; the
# ERS test permissive I-n09 on HS-n109; the channel line monitoring folded into XA-n130A / B; the
# berth O2 analysers moved to the arm side of XV-n122 with the I-n14 reset on them; ESD-1 closing
