  - id: N3
    title: Berth 1 (P-06) - header, drain drum, arms and link (renumbered copy of Berth 2)
    design_intent: >-
      As N1 and N2 for Berth 1 with loading line B: XV-6101, PSV-6131, D-6101, P-6101 / LIC-6111,
      arms LA-6101..LA-6104 with ERS XV-6131..XV-6144, ZS-6151..ZS-6154, link XS-6100, interlocks
      I-601..I-603 (D-019); since 589c9ca7 also XV-6161 with LZT-6112 / I-606, CV-6116 and HV-6117
      on the P-6101 discharge, I-604 / I-605 on ZSC-6123 / ZSC-6125, PSV-6171 / 6173 / 6174, PSV-6118
      and the N2 double block and bleed HV-6151 / HV-6153 / HV-6152; since 886b0ad5 I-604 / I-605
      act on HS-6123 / HS-6125, ZSC-6123 / ZSC-6125 sense their valves, XV-6161 stays open for the
      purge, and I-614 closes XV-6122 on AI-4134 O2 above 5 vol % (as N2 for Berth 2: S14, S16,
      S23, S24). Since f5d925f6 as N1 and N2 for Berth 1: I-601 trips the carrier through XS-6100
      and is initiated by I-804; XV-6101 and the arm isolations hold on non-return valves and
