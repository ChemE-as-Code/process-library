                - {category: environment, severity: "3", likelihood: B, status: proposed, by: agent, basis: "LNG to sea (as S1); matrix 3 = reportable release.", evidence: [DESIGN.md D-023], band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: 92790e212f41fb89, inputs: {matrix: b6caa11838fe6bc7, category: environment, severity: '3', likelihood: B}}}
            notes: >-
              New scenario for f5d925f6 (D-016, D-023 (4), D-028 item 1; review
