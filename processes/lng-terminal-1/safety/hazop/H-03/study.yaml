# switches ZSO-5122 / ZSO-6122 on the vapour arm isolations, proven open in SEQ-LOAD and an ESD-1
# cause during a liquid transfer; the manual ESD-1 push buttons and the platform fire and gas in
# the I-501 / I-601 logic; each berth's ESD-1 a cause of the other's during a transfer; the ERS
# valves on two line-monitored solenoids in series (2oo2) on the UPS with the supply loss an
# ESD-1 cause, the couplers released on positive command after the ERS valves are proven closed;
