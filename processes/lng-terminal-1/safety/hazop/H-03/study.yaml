risk_matrix: safety/risk-matrix.yaml
assessment_basis: >-
  Each scenario is rated per category before its safeguards (initial): severity is the credible
  worst outcome if every safeguard fails, likelihood that of the cause. The codes are agent
  proposals with their basis, for the team to accept or change. Residual ratings are proposed
  (by the agent, status proposed) only for the scenarios whose safeguards changed in commit
  589c9ca7 and where a new layer independent of the cause now exists as drawn: the severity is
  kept, the likelihood is lowered by one code per independent layer named in the basis, and
  nothing is credited whose capacity or integrity the files leave open. Where 589c9ca7 removed
  the original cause (S3, S18: the undrained header drain), the scenario keeps its id and is
  re-rated for the cause that remains. Crediting safeguards remains the team's judgement (and a
  LOPA's where needed). The matrix is the example matrix of cheme init (example: true), so the
  bands are illustrative. The revision for commit 54648679 (886b0ad5) rates the new scenarios
  S23 and S24 before safeguards only; the existing ratings keep their codes and the texts are
  corrected in place. The revision for commit f5d925f6 (D-028) rates the new scenario S25 before
  safeguards only, re-describes S24 for the cause that remains after D-028 item 6 and re-rates
  its likelihood (the scenario keeps its id), and keeps every other code. The revision for commit
  79d5c7ad (D-030) rates the new scenarios S26 to S30 (the vapour-path proof ZSO-5122 failing
  either way, the 2oo2 ERS solenoids failing to vent on demand and both channels lost together,
  the cross-berth ESD-1) before safeguards only; the existing codes are kept, S14 and S5 are
  re-described for the causes the I-514 arming and the I-205 / I-305 change leave. The revision
  for commit 709fcf20 (D-032) rates the new scenarios S31 to S37 (the transfer-state switch
  ZSC-5101 failing either way, one ERS solenoid supply lost during a transfer, the ERS function
  test, the coupler released on its timer with an ERS valve not closed, the 'no carrier
  connected' link mode left on with a carrier connected, the berth O2 analyser failing low) before
  safeguards only; S29 is re-described for the cause that remains with the two independent
  supplies and its likelihood re-rated (B to A); every other code is kept, and the texts the
  changed transfer state, ERS supplies and coupler release, the berth analysers, the link mode,
  the leak-test boundary and the corrected 'spare vapour path' no longer match are corrected in
  place. The revision for commit aedd8dbd (D-034, D-035) adds no new scenario id but re-describes
  the scenarios the new interlocks answer or change: S36 (the link mode now ends by itself and
  I-508 blocks the open command, its likelihood re-rated B to A), S35 (the coupler release on the
  ERS proven closed or at 7.5 s), S34 (the test permissive I-509), S37 (the analyser on the arm
  side, its reset, and its fast loop isolated for the leak test), S30 (an arm unstowed at an idle
  berth now ends its link mode and trips it), S26 / S11 (a line fault of a normally closed push
  button input trips ESD-1 / ESD-2), S22 (the arm isolations closed on every ESD-2), S29 (the
  rechecked surge), and corrects the HS-n100 / HS-n107 tags and the texts the platform crossover,
  the pump re-rating, the header bay and the sump depth touch; the other codes are kept. The
  platform-end leak fed by the trestle line and XV-4107 are analysed in H-02 S28 to S30, the
  south-end occupancy rule and the release-point fire in H-05 S28, S31. The revision for commit
  c257902c (D-036, D-037) rates the new scenarios S38 (a carrier valve closing with no link signal
  while the new carrier manifold protection I-502 on PZT-5181 / PZT-5184 fails on demand), S39 (a
  spurious I-502) and S40 (D-5101 not emptied into the header in S3, so the next drain or relief
  finds it full) before safeguards only; the existing codes are kept: S1, S17 (I-502 now the
  carrier's protection, not a header trip), S4, S5, S18, S21 (the drain pump return downstream of
  XV-n101 and the drain held between transfers), S26 (the jetty sump high-high I-805 as a new
  ESD-1 cause) and S37 (the measured post-reset hold) are re-described in place. The revision for
  commit ae718797 (D-038, D-039, D-040) rates the new scenarios S41 (D-5101 receiving the relief of
  the section blocked in after ESD-1 through the arm reliefs now set at 8.0 barg, and its let-down
  through XV-5161, with the drum holding the previous drain) and S42 (the let-down after ESD-1 not
  made, so the section shared with the carrier stays at the relief set pressure, or made with the
  cause not cleared) before safeguards only; S22 (the reliefs' relief case now the section to the
  carrier's closed valve), S8 (permanent strainers with the PDI transmitted), S21 (the reliefs
  lifting on closure transients ~2.5 bar above the arm base), S26 (I-805 on LZT-8119 and the new
  ESD-1 cause I-809) and S40 (ESD-1 stopping P-5101, LIC-5111's permissive registered) are
  re-described in place with their codes kept. The drawing-only changes of D-038 touch no scenario.
