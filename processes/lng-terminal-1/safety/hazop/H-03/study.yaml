            cause: >-
              ZSC-5101 reads 'not closed' while XV-5101 is closed (switch unmade, cam slipped,
              wiring open circuit), or XV-5101 is left open with UZ-5101 energised when no carrier
              transfers: the berth is in the liquid transfer state without a transfer, so the
