  - id: N2
    title: Berth 2 loading arms LA-5101..LA-5104, ERS, vapour arm and ship-shore link
    design_intent: >-
      Transfer LNG (three liquid arms, ~4,000 m3/h each) and return vapour (LA-5102, ~23.5 t/h at
      40 m/s per arm, D-023; hybrid LA-5103 as spare vapour path through XV-5125) between the shore
      and the carrier manifold within the arm envelope; ESD-1 (I-501) from the link XS-5100, manual
      push buttons and the platform fire and gas; ESD-2 (I-503) from the envelope switches
      ZS-5151..ZS-5154, manual or the 35 kn disconnect closes the ERS valves XV-5131..XV-5134 /
      XV-5141..XV-5144 and releases the couplers (D-014, D-016). Since 589c9ca7 (D-025 item 4):
      ESD-2 initiates ESD-1 first and closes the ERS valves after 5 s (I-503); envelope stage 1
      initiates ESD-1 (I-501); the hybrid arm's XV-5123 and XV-5125 are mutually inhibited by
      ZSC-5123 / ZSC-5125 (I-504, I-505) and a key interlock (vendor); each liquid arm section has
      thermal relief PSV-5171 / PSV-5173 / PSV-5174 into D-5101. Since fac0bbb5 (D-026 items 2, 3,
      6): I-501 takes I-503 tripped as a cause, so ESD-2 trips ESD-1 at once (pumps, XV-5101,
      tank-end valves, the carrier's ESD), and I-507 closes the ERS valves and releases the
      couplers 5 s after I-503; I-504 / I-505 are start permissives on the open command and never
      close an open isolation; the arm line-up is chosen from the cargo plan, L-V-H-L with the
      hybrid as third liquid arm (return within one vapour arm) or the hybrid as second vapour arm
      on two liquid arms. Since 886b0ad5 (D-026 items 6, 7, 14): I-504 / I-505 act on the open
      commands HS-5123 / HS-5125 (effect 'trip' of the HS, the notes say never on the valve) and
      ZSC-5123 / ZSC-5125 sense their valves; SEQ-LOAD S4 carries the two line-ups as operator
      steps, (a) XV-5123 open with four pumps at 12,000 m3/h, (b) XV-5125 open with three pumps
      at 8,000 m3/h; the ESD-1 test of SEQ-LOAD S3 is made in test mode (the sequence abort on
      I-501 inhibited for the test only), then I-501 is reset and XV-4101 / XV-4102 reopened;
      I-514 closes XV-5122 when AI-4133 reads O2 above 5 vol % for 10 s (latching, manual reset),
      so that the berth takes no vapour above that limit while the drum vent BOG-5002 keeps the
      jetty relief path open downstream of XV-5122. Since f5d925f6 (D-016, D-028 items 1, 4, 5, 6,
      7): I-501 trips the carrier through XS-5100 as an effect, so ESD-1 from any cause (the link,
      envelope stage 1, ESD-2 through I-503, push buttons, fire and gas, the air-header trip I-804)
      reaches the carrier; the arm isolations XV-5121 / XV-5123 / XV-5124 hold on a non-return
      valve and a local air accumulator on an air failure and close no faster than their set
      speed (at least 25 s, ASSUMED); the ERS valves are hydraulic on the arm vendor's power unit
      with its accumulator, do not move on an air failure and close only on I-507,
      de-energise-to-trip, in a closure time set with the vendor (ASSUMED 5 s); the logic of I-504
      (I-505) now requires ZSC-5123 (ZSC-5125) to prove the valve itself closed, so it can act only
      on an opening; I-514 votes 2oo2 on two O2 cells of AI-4133 (ASSUMED), is armed only in
      SEQ-LOAD S1 to S3 (no liquid transfer; from S4 an alarm, the operator stops by ESD-1) and also
      closes the hybrid vapour isolation XV-5125; SEQ-LOAD S3 repeats the ESD-1 test after the
      cooldown, each test in a test mode that ends with the reset of I-501 or after 15 min
      (ASSUMED), then reopens XV-4101 / XV-4102 / XV-5101 / XV-5121 and checks the line-up in its
      completion; I-804 is an abort condition of SEQ-LOAD.
    members: [UZ-5131, UZ-5132, UZ-5133, UZ-5134, HS-5121, HS-5122, HS-5123, HS-5125,LA-5101, LA-5102, LA-5103, LA-5104, XV-5121, XV-5122, XV-5123, XV-5124, XV-5125, XV-5131, XV-5132, XV-5133, XV-5134, XV-5141, XV-5142, XV-5143, XV-5144, ZS-5151, ZS-5152, ZS-5153, ZS-5154, XS-5100, BOG-5001, BOG-5003, PI-5105, TI-5106, ZSC-5123, ZSC-5125, PSV-5171, PSV-5173, PSV-5174, DR-5003, DR-5004, DR-5005]
