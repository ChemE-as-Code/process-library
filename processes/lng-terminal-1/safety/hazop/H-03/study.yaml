  - {id: SG18, title: "Jetty sump T-8102 with low temperature alarm TSL-8104", kind: mechanical, refs: [T-8102, TSL-8104], status: proposed, by: agent, notes: "Since f5d925f6 (D-029 item 3) on its own piled sump deck between the bows of the two berthed carriers, reached from the platform drip trays by a covered trough under the deck and along the sump deck catwalk; sited by the pool-fire screening of D-018 (layout, not an analysed input; H-05 S13). Since 79d5c7ad (D-031 items 2-4) the drip trays under both berths' arms and manifolds drain into enclosed collectors under the deck slab along both faces and the south edge, vented at the catwalk, then an open 0.6 m trough on the catwalk S-CW-A9 (39 m) to T-8102, now re-centred between the hulls; the muster point is moved off the collector to the platform's north-west corner (H-05 S13, S27, S28). Since 709fcf20 (D-018, D-033 items 4, 5, 11; layout): the drip trays are kerbed bays of at most 36 m2 (14 m2 for the crossover bay under XV-4103) recessed 1.0-2.4 m, each holding the ~33 m3 design spill with its outlet blocked, draining by open floor outlets without liquid seals into enclosed collectors lined with cellular glass under the deck and the catwalk (Z-KC-CHANNEL-JETTY-W / -XO / -B1M / -E, -CW), whose only outlet is in the wall of T-8102; the catwalk trough and the platform-edge vent are removed; T-8102 is 6 m across and 9.5 m deep (~159 m3 below the inlet), kept pumped down; the muster point is on the B-JET deck A7 (Z-ESC-A4-MUSTER) with two ways off W1 / W2 (H-05 S13, S27, S28); a timed coupler release with an ERS valve open spills into the arm's bay (S35). Since aedd8dbd (D-034.3, D-035 items 1, 8, 14 (f), (g), (j); layout): the platform design spill is the header flow until ESD-1 closure, ~170 m3 per berth (was ~33 m3 of one arm); the bays pass it through two 1.5 x 1.5 m open floor outlets each into collectors 1.5 m wide, the header bay at the south end holds the flanged items of the loading lines; T-8102 is 13.0 m deep (~257 m3 below the inlet, ~87 m3 of it for rain), a sealed caisson with its bottom 7.7 m below extreme high water, checked dry before every transfer (SEQ-LOAD permissive), no fixed pump and no level instrument; a leak upstream of a shore ESD valve with the trestle line behind it can overfill it (H-02 S29). Since c257902c (D-036 items 5, 6; D-037.15 (a), .16, .17; P-08, C&E I-805..I-808): T-8102 is kept dry at the start of and during every transfer by the fixed dry-sump pump P-8103 on LZT-8106 in the floor pocket, locked out on LNG by TSL-8104 / TSL-8118 (1oo2); the LAH at the pocket rim is a transfer hold, the LAHH (I-805) blocks a start and trips ESD-1 of the transferring berth; 170 m3 platform spill + 40 m3 trestle drain-down (SEQ-LINE-EMPTY) = 210 of the 257 m3 below the inlet, no rain allowance (H-05 S13, S32, S33)."}
  - {id: SG19, title: "Drain to D-5101 and N2 purge to below 2 % hydrocarbons before disconnection (SEQ-LOAD S6)", kind: procedural, refs: [D-5101], status: proposed, by: agent, notes: "Since 886b0ad5 the purge runs with XV-5161 open, out through D-5101 and BOG-5002 into the vapour return (D-026 item 13); completion by text only."}
  - {id: SG20, title: "Interlock I-601: Berth 1 ESD-1", kind: interlock, interlock: I-601, refs: [XS-6100, XV-6101], status: proposed, by: agent, notes: "Since 79d5c7ad as SG1 for Berth 1 (ZSO-6122, AI-4134, the ERS supply, I-501 during a Berth 1 transfer; D-030). Since 709fcf20 as SG1 for Berth 1 (ZSC-6101 / UZ-6101, AI-6126 or AI-4134, XA-6130A / B, HS-6100, XS-6108; D-032). Since aedd8dbd as SG1 for Berth 1 (HS-6100A / B / C, the link not healthy, the per-circuit channel monitoring, XV-4107 closed; D-034)."}
  - {id: SG36, title: "Interlock I-501 (I-601) on ZSO-5122 (ZSO-6122): the vapour arm isolation XV-5122 (XV-6122) not proven open during a liquid transfer trips ESD-1 at the start of any closure", kind: interlock, interlock: I-501, refs: [ZSO-5122, XV-5122, ZSO-6122, XV-6122], status: proposed, by: agent, notes: "Added in 79d5c7ad (D-030 items 2, 8); XV-5122 / XV-6122 fail closed without an accumulator on purpose, so they are the first jetty valves to move on an air loss at the platform end; at 79d5c7ad proven open in SEQ-LOAD S0, S1, S3, S4, since 709fcf20 in S1 after the vapour arm leak test, S3 and S4 (D-032 item 7); since 709fcf20 the C&E bypass allows a maintenance override of a failed switch for the transfer in progress (permit, alarm, local check every hour, ASSUMED); SIL null; its spurious action is S26, a false 'open' or the override S27; voted platform-end transmitters remain hold H-04."}
  - {id: SG37, title: "Interlock I-514 (I-614): O2 above 5 vol % for 10 s on the berth analyser AI-5126 (AI-6126) or the tank-end backup AI-4133 (AI-4134), each 2oo2, with XV-5101 (XV-6101) proven closed and not held open, closes XV-5122 / XV-5125 (XV-6122 / XV-6125) and opens XV-4135 (XV-4136)", kind: interlock, interlock: I-514, refs: [AI-5126, AI-4133, XV-5122, XV-5125, XV-4135, AI-6126, AI-4134, XV-6122, XV-6125, XV-4136], status: proposed, by: agent, notes: "Added to this register in 709fcf20 (D-026.7, D-032 items 1, 3, 4); latching, manual reset, SIL null (voting in the SIL screening, hold H-06); the backup analyser has its own sample system at the tank end, so it is a candidate against a failed berth analyser (S37); I-n11 / I-n12 do not act while it is tripped and I-n13 closes the flare valve once the tank-side valve is proven open. Since aedd8dbd (D-034 item 4) the berth analyser samples the vapour arm side of XV-n122, I-n14 is reset once both its cells read below 5 vol %, and I-n11 / I-n12 stay blocked for 30 min after the reset and while the tank-end analyser reads O2 at or above 5 vol % (H-02 S26). Since c257902c (D-036 item 8 #7) the hold ends when the tank-end analyser has seen the slug pass (O2 above 1 vol % and back below for 5 min) or on the operator's release after the carrier's delivered return volume, and the reset condition is written in the I-n14 notes and SEQ-LOAD S1."}
  - {id: SG38, title: "Interlock I-508 (I-608): the open command of XV-5101 (XV-6101), UZ-5101 (UZ-6101), only with the ship-shore link XS-5100 (XS-6100) in carrier mode and healthy (permissive)", kind: interlock, interlock: I-508, refs: [XS-5100, UZ-5101, XV-5101, XS-6100, UZ-6101, XV-6101], status: proposed, by: agent, notes: "Added in aedd8dbd (D-034 item 5; review 2026-11-05-basic-design-7 #3); latching false, reset automatic, SIL null; a start permissive by its notes, while its logic as written also acts on a held open command (S36); with the self-ending mode it answers A29 in the design."}
  - {id: SG39, title: "Interlock I-509 (I-609): the ERS function test enabled by HS-5109 (HS-6109) only with XV-5101 (XV-6101) proven closed, UZ-5101 (UZ-6101) de-energised and every arm stowed (permissive)", kind: interlock, interlock: I-509, refs: [HS-5109, ZSC-5101, UZ-5101, ZS-5151, ZS-5152, ZS-5153, ZS-5154, HS-6109, ZSC-6101], status: proposed, by: agent, notes: "Added in aedd8dbd (D-034 item 7 (a); review 2026-11-05-basic-design-7 #5); hard-wired in the arm vendor panel (ASSUMED); latching false, reset automatic, SIL null; an enabled test ends when a condition is lost (S34)."}
  - {id: SG40, title: "Interlock I-510 (I-610): each coupler UY-5135..UY-5138 (UY-6135..UY-6138) released once both ERS valves of its arm are proven closed or 7.5 s after I-507 (I-607), never before the close commands", kind: interlock, interlock: I-510, refs: [UY-5135, UY-5136, UY-5137, UY-5138, UY-6135, UY-6136, UY-6137, UY-6138], status: proposed, by: agent, notes: "Added in aedd8dbd (D-034 item 6; review 2026-11-05-basic-design-7 #4; replaces the fixed 7 s of I-507); the ERS position switches are the vendor's (ASSUMED) and the timeout is 1.5 x the ASSUMED 5 s closure (H-02); energise-to-release, latching, manual reset, SIL null; each coupler on its own accumulator on the arm (layout D-035, ASSUMED) (S28, S35)."}
  - {id: SG21, title: "Interlock I-602: Berth 1 carrier manifold back-pressure high-high on PZT-6181 / PZT-6184 (1oo2, PAHH 5.0 barg) with PZT-6103 as an uncredited backstop (7.0 barg); trips the carrier through XS-6100", kind: interlock, interlock: I-602, refs: [PZT-6181, PZT-6184, PZT-6103, XS-6100], status: proposed, by: agent, notes: "As SG2 for Berth 1 since c257902c (D-036 items 1, 11 (a)); until aedd8dbd on PZT-6103 alone."}
  - {id: SG22, title: Surge relief PSV-6131 of the Berth 1 header into D-6101, kind: relief, refs: [PSV-6131], status: proposed, by: agent, notes: "As SG3; the air-failure closure is one of its relief cases since f5d925f6, the spurious ERS closure at full flow since 79d5c7ad (D-023 (5))."}
  - {id: SG23, title: "LIC-6111 D-6101 level: starts and stops P-6101, high-high alarm", kind: control, refs: [LIC-6111, P-6101], status: proposed, by: agent}
  - {id: SG24, title: "ESD-2 of Berth 1: I-603 trips ESD-1 (I-601) at once; I-607 closes the ERS valves XV-6131..XV-6144 (and since aedd8dbd the arm isolations) 5 s after I-603; the couplers release by I-610 (at 709fcf20 by I-607)", kind: interlock, interlock: I-607, refs: [ZS-6151, XV-6131], status: proposed, by: agent, notes: "As SG12 for Berth 1; ERS closure in I-607 since fac0bbb5 (D-026 item 2). SIL null. Since 709fcf20 as SG12 (UPS A / B with XA-6130A / B, the ERS function test, the coupler release timed after the ERS close command, HS-6107). Since aedd8dbd as SG12 (the arm isolations closed, I-610, I-609, HS-6107A / B / C; D-034)."}
  - {id: SG25, title: "Interlock I-506: independent D-5101 high-high level LZT-5112 closes the header drain XV-5161", kind: interlock, interlock: I-506, refs: [LZT-5112, XV-5161], status: proposed, by: agent, notes: "Added in 589c9ca7 (D-025 item 4); does not stop the relief inflow downstream of XV-5161 (S21); SIL null."}
  - {id: SG26, title: "Header drain XV-5161 fail closed, closed in cooldown and loading (SEQ-LOAD S0 completion) and by ESD-1 (I-501)", kind: procedural, refs: [XV-5161, HS-5161], status: proposed, by: agent, notes: "Added in 589c9ca7; prevents the S3 cause, opened only in SEQ-LOAD S6 (since 886b0ad5 for the drain and the N2 purge)."}
  - {id: SG27, title: "Check valve CV-5116 and isolation HV-5117 on the P-5101 discharge LNG-5006", kind: check-valve, refs: [CV-5116, HV-5117], status: proposed, by: agent, notes: "Added in 589c9ca7 (D-025 item 4). Since c257902c (D-036 item 5 (a)) LNG-5006 enters the berth header downstream of XV-5101, so CV-5116 holds the header pressure, not the crossover's."}
  - {id: SG41, title: "SEQ-LOAD S3: D-5101 (D-6101) emptied by P-5101 (P-6101) into the cooldown flow (LIC-5111 permitted only with XV-5101 open and the flow established), 'D-5101 emptied (LIC-5111 low level)' a completion condition before S4", kind: procedural, refs: [D-5101, P-5101, LIC-5111, XV-5101, D-6101, P-6101, LIC-6111], status: proposed, by: agent, notes: "Added in c257902c (D-036 item 5 (a); control/sequences.yaml); completion read on LIC-5111, the instrument whose failure is one cause of S40; no independent check of the drum level before S6."}
  - {id: SG28, title: "N2 tie-in double block and bleed HV-5151 / HV-5153 / HV-5152 with the bleed N-5001", kind: mechanical, refs: [HV-5151, HV-5152, HV-5153, N-5001], status: proposed, by: agent, notes: "Added in 589c9ca7 (D-025 item 4); manual valves, no interlock with the cooldown."}
  - {id: SG29, title: "Arm thermal relief PSV-5171 (LA-5101), PSV-5173 (LA-5103), PSV-5174 (LA-5104) into D-5101 (since ae718797 at 8.0 barg, the lowest-set relief of the section blocked in after ESD-1 with the carrier's manifold spool)", kind: relief, refs: [PSV-5171, PSV-5173, PSV-5174], status: proposed, by: agent, notes: "Added in 589c9ca7 (D-025 item 4), 15.0 barg; Berth 1 alike with PSV-6171 / 6173 / 6174. Since ae718797 (D-039 item 2; special items): set at 8.0 barg (ASSUMED), below the carrier's 10 barg manifold design and ~2.5 bar above the highest normal arm-base pressure, the relief case extended to the section from XV-n101 to the carrier's closed valve after ESD-1; DN 25; the ERS cavity relief still with the arm vendor."}
  - {id: SG30, title: "Interlocks I-504 / I-505: the open commands HS-5123 / HS-5125 of XV-5123 and XV-5125 mutually inhibited by ZSC-5125 / ZSC-5123", kind: interlock, interlock: I-504, refs: [ZSC-5123, ZSC-5125, XV-5123, XV-5125, HS-5123, HS-5125], status: proposed, by: agent, notes: "Added in 589c9ca7; I-505 is the reverse permissive; the vendor key interlock is not drawn. Since 886b0ad5 the effect trips HS-5123 / HS-5125 instead of closing the valve, and the switches sense their valves (D-026 item 14); since f5d925f6 the logic also requires the valve's own switch to read closed (ZSC-5123 in I-504, ZSC-5125 in I-505; D-028 item 6); see S24."}
  - {id: SG31, title: "Interlocks I-604 / I-605: the open commands HS-6123 / HS-6125 of XV-6123 and XV-6125 mutually inhibited by ZSC-6125 / ZSC-6123", kind: interlock, interlock: I-604, refs: [ZSC-6123, ZSC-6125, XV-6123, XV-6125, HS-6123, HS-6125], status: proposed, by: agent, notes: "Added in 589c9ca7; I-605 is the reverse permissive; since 886b0ad5 on HS-6123 / HS-6125; since f5d925f6 with the valve's own ZSC closed in the logic (D-028 item 6)."}
  - {id: SG34, title: "Interlock I-804: instrument-air header low-low PZT-8123A/B/C (2oo3, 4.5 barg ASSUMED) initiates ESD-1 of both berths (I-501 / I-601: loading pumps stopped, carriers tripped through XS-5100 / XS-6100) before the fail-closed actuators stroke (~3.5 barg ASSUMED)", kind: interlock, interlock: I-804, refs: [PZT-8123A, PZT-8123B, PZT-8123C, XS-5100, XS-6100], status: proposed, by: agent, notes: "Added in f5d925f6 (D-028 item 1; P-08, P-05 / P-06 notes); latching, manual reset, SIL null; ahead of a valve only while the header at the jetty falls slower than its margin allows (S25)."}
  - {id: SG35, title: "Shore ESD valves XV-5101 / XV-6101 and arm isolations XV-n121 / XV-n123 / XV-n124: non-return valve and local air accumulator on the actuator supply, speed controller on the exhaust (closure 25-30 s, at least 25 s for the arm isolations)", kind: mechanical, refs: [XV-5101, UZ-5101, XV-5121, HS-5121, XV-5123, XV-5124, XV-6101, UZ-6101, XV-6121, XV-6123, XV-6124], status: proposed, by: agent, notes: "Added in f5d925f6 (D-016, D-028 item 1; instrument list, P-05 / P-06 note); closure and hold times ASSUMED; no proof test in the files; their failure on an air loss is S25."}
  - {id: SG32, title: "Interlock I-606: independent D-6101 high-high level LZT-6112 closes the header drain XV-6161", kind: interlock, interlock: I-606, refs: [LZT-6112, XV-6161], status: proposed, by: agent, notes: "Added in 589c9ca7; SIL null."}
  - {id: SG33, title: "Check valve CV-6116 and isolation HV-6117 on the P-6101 discharge LNG-6006", kind: check-valve, refs: [CV-6116, HV-6117], status: proposed, by: agent, notes: "Added in 589c9ca7. Since c257902c LNG-6006 enters the Berth 1 header downstream of XV-6101 (D-036 item 5 (a))."}
actions:
  - {id: A1, status: proposed, by: agent, text: "Complete the transient surge analysis of D-023 for the carrier-side closure (the ship's ESD valve closure time from the carrier data, SIGTTO/OCIMF practice) and for the ERS valve closure, and confirm the capacity of PSV-5131 / PSV-6131 and of D-5101 / D-6101 for the relieved volume; agree the maximum closure rate with each carrier at the pre-transfer meeting.", response: "Not answered at f5d925f6: D-028 hands the transient analysis of D-023 (1), (3), (4) to detail engineering and adds a relief case to PSV-5131 / PSV-6131 (a closure on an air failure faster than commanded, S25); the carrier-side closure, the ERS closure (ASSUMED 5 s, vendor) and the PSV and drum capacities are still open. Commit 79d5c7ad (D-023 (5), D-030 items 3, 13) adds the spurious ERS closure at full flow (both solenoid channels or the UPS supply lost, S29) as case (5) and a relief case of PSV-5131 / PSV-6131, and registers the transient analysis of D-023 (1), (3), (4), (5) as hold H-01 and the ERS trip principle and closure time as technical query H-02 with the arm vendor, against the detail-engineering gate. Still open as before. Commit 709fcf20 (D-023 (5), D-032 item 2) puts the two ERS channels on independent supplies, so case (5) needs two independent faults within the ESD-1 response (S29 re-rated), and states the circulation pump closure in the S3 cooldown (~150 kPa, D-016); the analysis, the carrier-side closure, the ERS closure time and the PSV and drum capacities are still open (hold H-01, technical query H-02). Commit aedd8dbd (D-034 items 1, 2; special items PSV-5131 / PSV-6131) rechecks the estimates for both trestle lines at 3.4 m/s (D-023 (1) ~8.5 barg in 25 s; one arm's ERS in 5 s ~11 barg; every ERS valve ~22.6 barg, above the 15 barg design) and re-rates the loading pumps to 191 m, which raises the closed-header shut-off to about 11 barg (agent estimate, H-02 S27); the analysis itself, the carrier-side closure, the ERS closure time and the capacities are still open. Still proposed. Commit c257902c (D-036 items 1, 11 (a), (e)) states one shut-off basis (~12.1 barg at XV-n101, ~12.3 barg at the lowest carrier manifold), takes the carrier's manifold at a 10 barg design (ASSUMED) and protects it by I-502 / I-602 on the arms' outboard pressure (S38, S39), with the bound of ~8.3 barg a check case of the transient analysis (hold H-01) and the carrier's closure characteristic, manifold design and operating pressure for the ship-shore compatibility study (S-01). Still open as before. Still proposed."}
  - {id: A2, status: proposed, by: agent, text: "C&E change: record the XV-5101 / XV-6101 closure time (25-30 s, D-016) and the delay after the pump stop as effects parameters of I-501 / I-601 (and I-502 / I-602), and require a closure-time test at commissioning and in the proof test.", response: "Partly answered by commit 589c9ca7: the I-501 / I-601 notes state the order (loading pumps first, then XV-5101 / XV-6101 in 25 s) and that the closure time is a safety requirement (D-023). Still open: closure time and delay as effect parameters of I-501 / I-601 and I-502 / I-602 (the C&E has a delay field, not used there), and the closure-time test. Commit fac0bbb5 (D-026 item 2) uses the delay field for the ERS closure: I-507 / I-607 close the ERS valves 5 s after ESD-2 (I-503 / I-603), which now trips ESD-1 at once; the XV-5101 / XV-6101 closure time is still only in the I-501 / I-601 notes. Commit f5d925f6 (D-016, D-028) sets the closure time by a speed controller on the actuator exhaust (25-30 s, the same for a commanded closure and one on air loss; UZ-5101 / UZ-6101) and restates the order in the I-501 / I-601 notes (pumps and carrier first); the C&E effects still have no closure time or delay, and no closure-time test is named. Still proposed. Commit c257902c (D-036 item 11 (a); C&E I-502 / I-602) adds the carrier trip XS-n100 to the effects of I-502 / I-602 and states in their notes that the pumps stop (~1 s, ASSUMED) while the flow still runs and XV-n101 then closes in 25-30 s; still no closure time or delay as an effect parameter and no closure-time test. Still proposed."}
  - {id: A3, status: proposed, by: agent, text: "P&ID P-05 / P-06 change: add drain isolation on DR-5001 / DR-6001 (normally closed in cooldown and loading, double block where it opens to D-5101) with the PSV-5131 / PSV-6131 discharge tied in downstream of it, and state the drain line-up in SEQ-LOAD S6.", response: "Answered in the design by commit 589c9ca7 (D-025 item 4; review 2026-11-05 critical #1): header drain valve XV-5161 / XV-6161 (fail closed, HS-5161 / HS-6161), closed in SEQ-LOAD S0 and by I-501 / I-601 and I-506 / I-606, opened and closed again in SEQ-LOAD S6; PSV-5131 / PSV-6131 and the arm and pump relief valves join DR-5001 / DR-6001 downstream of it. A single valve, not a double block: for the team to judge, verify and close; S3, S18 re-rated, the relief inflow with the drum high is S21."}
  - {id: A4, status: proposed, by: agent, text: "P&ID P-05 / P-06 change: add a check valve and an isolation valve on the P-5101 / P-6101 discharge LNG-5006 / LNG-6006 before the tie-in to LNG-4003.", response: "Answered in the design by commit 589c9ca7 (D-025 item 4): check valve CV-5116 / CV-6116 and isolation HV-5117 / HV-6117 on LNG-5006 / LNG-6006, with suction isolation HV-5115 / HV-6115, minimum flow LNG-5007 / LNG-6007 through FO-5118 / FO-6118, vent HV-5119 / HV-6119 and thermal relief PSV-5118 / PSV-6118. For the team to verify and close; S4, S18 re-rated. Commit c257902c (D-036 item 5 (a)) moves the tie-in from LNG-4003 to the berth headers downstream of XV-5101 / XV-6101 (tees T50K / T60K), with the same check and isolation valves; the drain is then held in the drum until S3 of the next transfer (S40, A34). Still proposed."}
  - {id: A5, status: proposed, by: agent, text: "P&ID P-05 / P-06 and C&E change: add an independent high-high level switch on D-5101 / D-6101 with a defined action (stop the drain line-up, alarm) separate from LIC-5111 / LIC-6111.", response: "Answered in the design by commit 589c9ca7 (D-025 item 4): independent high-high level LZT-5112 / LZT-6112 on its own nozzle; I-506 / I-606 close the header drain XV-5161 / XV-6161. For the team to verify and close; S5, S18 re-rated."}
  - {id: A6, status: proposed, by: agent, text: "Provide a fixed O2 measurement (or a sample point on the arm vents drawn on P-05 / P-06) and make 'O2 below 1 %' and 'N2 header pressure healthy' (PI-8121) permissives of SEQ-LOAD S3 cooldown."}
  - {id: A7, status: proposed, by: agent, text: "P&ID P-05 / P-06 change: make the N2 connection a removable spool or double block and bleed with HV-5151 / HV-6151 interlocked closed before cooldown, and state the material and design temperature of N-8001 / N-8002 in the line list.", response: "Partly answered by commit 589c9ca7 (D-025 item 4; review #18): double block and bleed HV-5151 / HV-5153 / HV-5152 with the bleed N-5001 (Berth 1: HV-6151 / HV-6153 / HV-6152, N-6001). Still open: the interlock of the N2 tie-in closed before cooldown, and the material and design temperature of N-8001 / N-8002 (not in the line list). Commit fac0bbb5 writes the block and bleed line-up into SEQ-LOAD S2 and S6 (bleed HV-5153 closed while HV-5151 / HV-5152 are open for the leak test and purge, both blocks closed and the bleed opened after); still procedural, no interlock. Still proposed."}
  - {id: A8, status: proposed, by: agent, text: "State the arm cooldown rate limit (temperature change per hour from the arm vendor) and the TI-5104 / TI-6104 criterion in SEQ-LOAD S3."}
  - {id: A9, status: proposed, by: agent, text: "Show the mooring load monitoring (quick-release hooks, S-01) and the wind measurement as signals of the loading permissive and of a pre-alarm / ESD-1 in the C&E; they are named in SEQ-LOAD only as text."}
  - {id: A10, status: proposed, by: agent, text: "Ask the arm vendor for the envelope zones (pre-alarm, ESD-1, ESD-2) and their margins against the carrier drift speed; record them in the instrument list for ZS-5151..ZS-5154 / ZS-6151..ZS-6154.", response: "Partly answered by commit 589c9ca7: envelope stage 1 of ZS-5151..ZS-5154 (ZS-6151..ZS-6154) now initiates ESD-1 (I-501 / I-601) and stage 2 ESD-2 (I-503 / I-603). Still open: the vendor's zones and their margins against the drift speed in the instrument list."}
  - {id: A11, status: proposed, by: agent, text: "C&E change: make I-503 / I-603 initiate I-501 / I-601 (pumps stopped, XV-5101 closing) before the ERS valves close, with the ERS closure time and the delay as effect parameters; consider voting of the envelope switches for the release step. Also reconcile the instrument list, which says UZ-5131..UZ-5144 close on ESD-1 (I-501), with I-501, whose effects do not include them.", response: "Mostly answered by commit 589c9ca7 (D-025 item 4): I-503 / I-603 initiate ESD-1 first and close the ERS valves after a 5 s delay (C&E delay field); the instrument list now says UZ-5131 closes on ESD-2, not ESD-1. Still open for the team: the ERS closure time (vendor, D-023) and the voting of the envelope switches (logic any, unchanged). S11 re-rated. Commit fac0bbb5 (DESIGN.md D-026 item 2; review 2026-11-05-basic-design-2#4) restructures it as asked: I-501 / I-601 take I-503 / I-603 tripped as a cause, so ESD-2 trips ESD-1 with no delay, and the ERS closure and coupler release are the separate interlocks I-507 / I-607 with the 5 s delay after I-503 / I-603; SG12 / SG24 credit I-507 / I-607. The ERS closure time and the voting remain open. Commit f5d925f6 (D-016, D-028 item 1) makes the ERS valves hydraulic on the arm vendor's power unit with its accumulator, closing only on I-507 / I-607 (de-energise-to-trip) in a closure time set with the vendor, ASSUMED 5 s; the vendor value and the voting remain open. Commit 79d5c7ad (D-016, D-030 item 3) states the ERS trip principle (two line-monitored solenoids in series per ERS valve on the UPS, the supply loss an ESD-1 cause, the couplers energise-to-release after the ERS valves are proven closed) and keeps the ERS closure not interlocked behind a pump stop; the closure time and the principle are technical query H-02 with the arm vendor. The voting of the envelope switches is unchanged (logic any). Commit 709fcf20 (D-016, D-032 items 2, 7) puts the two channels on UPS A / UPS B with their trips XA-5130A / B, adds the ERS function test before every transfer, times the coupler release 7 s after the ERS close command and writes the manual ESD-2 as HS-5107; the ERS closure time and the voting of the envelope switches (logic any) are unchanged and open. Commit aedd8dbd (D-034 items 6, 9) closes the arm isolations in I-507, releases the couplers by I-510 on the ERS proven closed or at 7.5 s, and gives each manual ESD-2 station its own normally closed input (HS-5107A / B / C); the ERS closure time and the voting of the envelope switches remain open. Still proposed."}
  - {id: A12, status: proposed, by: agent, text: "C&E change: state that a fault of the ship-shore link XS-5100 / XS-6100 initiates ESD-1 (fail-safe) and give the link's power supply (UPS) in the files.", response: "Not answered at f5d925f6: D-028 item 4 makes XS-5100 / XS-6100 'trip' an effect of I-501 / I-601, so every shore ESD-1 is sent to the carrier; whether a link fault itself trips ESD-1 and the link's supply (UPS, ASSUMED in F-POWER) are still not in the C&E. Not answered at 79d5c7ad: F-POWER restates the link, the ESD logic and the ERS solenoids on uninterruptible supplies (ASSUMED) and the loss of the ERS solenoid supply is now an ESD-1 cause, but a fault of the link XS-5100 / XS-6100 itself is still not a stated cause of I-501 / I-601. Not answered at 709fcf20: D-016 and D-032 item 5 add the link's 'no carrier connected' mode for an idle berth (not a trip, not a bypass) and the order of SEQ-LOAD S1 / S6; a link fault during a transfer as an ESD-1 cause is still not stated, and the mode left on with a carrier connected is S36 (A29). Mostly answered by commit aedd8dbd (D-034 item 5; C&E I-501 / I-601 logic): XS-5100 / XS-6100 'trip' reads the link not healthy, so a link fault trips ESD-1, also once the idle-berth mode has ended; the link's UPS is in F-POWER (ASSUMED). For the team to verify and close. Still proposed."}
  - {id: A13, status: proposed, by: agent, text: "Interlock XV-5123 / XV-5125 (XV-6123 / XV-6125) so that the hybrid arm cannot be open to the liquid header and the vapour line at once (position feedback, C&E entry).", response: "Answered in the design by commit 589c9ca7 (D-025 item 4; review #3): position switches ZSC-5123 / ZSC-5125 (ZSC-6123 / ZSC-6125) and the permissives I-504 / I-505 (I-604 / I-605), plus a vendor key interlock at the arm. For the team to verify and close; S13, S20 re-rated. Commit 886b0ad5 (review 2026-11-05-basic-design-2#2, D-026 item 14) moves the effect from the valve to its open command (HS-5123 / HS-5125 'trip') and ties the switches to their valves; the logic still has no 'this valve closed' condition, so whether an isolation in service can be closed by a switch fault is S24 (A21). Still proposed."}
  - {id: A14, status: proposed, by: agent, text: "Add a high pressure alarm on PI-5105 / PI-6105 with the response (rate reduction, hybrid arm to vapour duty), and state in SEQ-LOAD S4 when the hybrid arm is switched to vapour service; confirm the carrier's return against the arm capacity (D-023).", response: "Partly answered by commit fac0bbb5 (DESIGN.md D-026 item 6; SEQ-LOAD S4 operator text): two arm line-ups chosen from the cargo plan, (a) L-V-H-L with the hybrid as third liquid arm at 12,000 m3/h and the return limited to one vapour arm (~23.5 t/h, the carrier burns the balance on board, S-01), (b) the hybrid as second vapour arm on two liquid arms at ~8,000 m3/h (ASSUMED) with up to ~47 t/h of return; to be checked against carrier data in detail engineering. Still open: the high pressure alarm on PI-5105 / PI-6105 with its response. Commit 886b0ad5 writes both line-ups into SEQ-LOAD S4 as operator steps and restates the return in D-026 item 6 (line-up (b) ~34 t/h on two vapour paths; the 45.6 t/h of D-009 kept as an envelope; ASSUMED until carrier data). The PI-5105 / PI-6105 alarm is still not in the files. Still proposed."}
  - {id: A15, status: proposed, by: agent, text: "P&ID P-05 / P-06 change: draw the drip trays under the arms and manifold and the spill route to T-8102, routed so that LNG cannot reach the sea water (rapid phase transition), and the cryogenic spill protection of the platform steel.", response: "Partly answered by commit 79d5c7ad in the layout (D-018, D-031 item 2; not an analysed input of this study): the drip trays under both berths' arms and manifolds drain into enclosed collectors under the deck slab along both faces and the south edge, vented at the catwalk, then an open 0.6 m trough on the catwalk S-CW-A9 (39 m) to T-8102; the muster point no longer stands over the collection. Still open: the drip trays and the spill route on P-05 / P-06 (not drawn), the cryogenic spill protection of the platform steel, and the vapour in the enclosed collectors (H-05 S27). Partly answered further by commit 709fcf20 in the layout (D-018, D-033 items 4, 5, 7, 11; not an analysed input): the drip trays are kerbed bays recessed into the deck, each holding the ~33 m3 design spill, draining by open floor outlets into lined enclosed collectors sized for the vapour, whose only outlet is in the wall of T-8102 (6 m, 9.5 m deep); the catwalk trough and the vent are removed; deluge for the arms, manifolds and drain drums is named as the fire protection engineer's (ASSUMED). Still open: the trays and the spill route on P-05 / P-06, the cryogenic spill protection of the platform steel, and the confined vapour of the collectors (H-05 S27). Commit aedd8dbd in the layout (D-034.3, D-035 items 1, 8, 14; not an analysed input): the platform design spill is the header flow until ESD-1 closure (~170 m3 per berth); the bays pass it through two 1.5 x 1.5 m outlets each, the flanged items of the loading lines stand in a header bay at the south end, T-8102 is 13.0 m deep (a sealed caisson), PR9 and the PR2 end take passive fire protection (ASSUMED). Still open as before, and the trestle line behind a platform-end leak (H-02 S29, A23). Still proposed."}
  - {id: A16, status: proposed, by: agent, text: "Make 'arm drained (D-5101 level steady) and hydrocarbons below 2 %' a measured permissive of the coupler release at disconnection (SEQ-LOAD S6), with the measuring point drawn."}
  - {id: A17, status: proposed, by: agent, text: "Confirm the D-5101 / D-6101 hold-up for the largest relieved volume (surge relief PSV-5131 / PSV-6131 and the arm thermal relief) with the drain XV-5161 / XV-6161 closed by I-506 / I-606, and give LZT-5112 / LZT-6112 a defined response for the relief case (alarm, P-5101 / P-6101 start, ESD-1 during loading), since the relief outlets join downstream of the drain valve.", response: "Not answered by commit c257902c, which makes the question larger: since D-036 the drain of a transfer stays in D-5101 / D-6101 until S3 of the next transfer, so the hold-up must cover the relieved volume with the drum not yet emptied in the cooldown (S21, S40). Still proposed. Not answered by commit ae718797, which adds to the volumes: the arm reliefs at 8.0 barg relieve the section shared with the carrier after every ESD-1 and lift on closure transients during a transfer, and SEQ-ESD S2 lets that section down into the drum through XV-5161 (S41, S42). Still proposed."}
  - {id: A18, status: proposed, by: agent, text: "Confirm with the arm vendor the cavity relief of the ERS ball valves and that PSV-5171 / PSV-5173 / PSV-5174 (PSV-6171 / 6173 / 6174) protect every blocked-in arm section after ESD-2, including the sections between the ERS ball valves; since f5d925f6 the ERS valves stay open on an air failure, so include the outboard arm blocked in up to the carrier's manifold valve (S22).", response: "Partly answered by commit ae718797 (D-039 item 2; special items, C&E I-501 / I-502 notes): the relief case of PSV-5171 / 5173 / 5174 (PSV-6171 / 6173 / 6174) includes the section blocked in after ESD-1 from XV-n101 through the open arm isolations and ERS valves to the carrier's closed manifold valve with its spool, and they are set at 8.0 barg below the carrier's 10 barg (ASSUMED); SEQ-ESD S2 lets the section down into D-n101 after the reset. Still open: the ERS ball valves' cavity relief and the sections between the ERS valves (arm vendor), the carrier's manifold design pressure and its own relief (compatibility study, S-01), and the relieved volume into the drum (A17). Still proposed."}
  - {id: A19, status: proposed, by: agent, text: "C&E / sequence change: define the test mode of the SEQ-LOAD S3 ESD-1 test (who sets it, that it inhibits only the sequence abort and only for an ESD-1 initiated from the test push button or the link test, that it ends automatically after a set time or at the I-501 reset), let any other I-501 cause abort SEQ-LOAD during the test, and make 'all I-501 causes clear' a condition of the I-501 reset (S23); Berth 1 alike.", response: "Partly answered by commit f5d925f6 (D-028 item 7; SEQ-LOAD S3): the test mode ends automatically with the reset of I-501 or 15 min after it was set (ASSUMED), the test is repeated after the cooldown in the same way, and S3 completes only with I-501 reset and the line-up reopened. Still open: who sets the test mode, that it excepts only an I-501 trip from the test (any I-501 cause is excepted now), and an 'all causes clear' condition of the I-501 reset. Partly answered by commit 709fcf20 (C&E I-501 / I-601 bypass, D-032 item 7): the ESD-1 tests of S3 inhibit only the sequence abort, never the trip. Still open: who sets the test mode, that only the test trip is excepted from the abort, and the 'all causes clear' reset condition. Still proposed."}
  - {id: A20, status: proposed, by: agent, text: "C&E / sequence change for I-514 / I-614: make the closure of XV-5122 / XV-6122 stop the SEQ-LOAD S3 cooldown flow (a hold or abort condition, the carrier informed through the link), state whether I-514 / I-614 may act during loading (its logic has no mode condition, so a spurious O2 high-high closes the only vapour arm of line-up (a), S14), and set its integrity with the single analyser AI-4133 / AI-4134 (H-02 A14).", response: "Partly answered by commit f5d925f6 (D-028 item 5; review 2026-11-05-basic-design-4 #2): I-514 / I-614 are armed only in SEQ-LOAD S1 to S3 (from S4 an alarm, the operator stops by ESD-1), vote 2oo2 on two O2 cells of the analyser (ASSUMED; confirmed in the SIL screening) and also close XV-5125 / XV-6125. Still open: a hold or abort of the S3 cooldown flow on I-514 / I-614 (not an abort condition of SEQ-LOAD), with the carrier informed through the link. Answered in the design by commit 79d5c7ad (D-030 items 4, 8; review 2026-11-05-basic-design-5 #4): I-514 / I-614 are armed on the plant state 'no liquid transfer at the berth', so they never close the vapour path while the S3 cooldown or the loading runs; during a transfer the 2oo2 O2 high-high trips ESD-1 (I-501 / I-601), which stops the flow and trips the carrier through the link, and ZSO-5122 / ZSO-6122 trip ESD-1 on any other closure of the vapour arm isolation. For the team to verify and close; the routing of the O2-bearing line pack to the tanks on that ESD-1 is H-02 S23. Commit 709fcf20 (D-032 items 1, 3, 4) arms I-514 / I-614 on XV-n101 proven closed by ZSC-n101 and not held open by UZ-n101 instead of the shared flows (so a loop transmitter failing low no longer disarms ESD-1 or arms the reject; the switch faults are S31, S32), moves the O2 input to the berth analysers AI-5126 / AI-6126 with AI-4133 / AI-4134 as backup (S37), has I-514 / I-614 open XV-4135 / XV-4136 and gates the reject after an ESD-1 on the proven-closed XV-n101; the integrity of the 2oo2 cells is in the SIL screening (hold H-06). Answered in the design; for the team to verify and close. Still proposed."}
  - {id: A21, status: proposed, by: agent, text: "C&E change: add 'ZSC-5123 closed' to I-504 and 'ZSC-5125 closed' to I-505 (Berth 1: ZSC-6123 / ZSC-6125 in I-604 / I-605), as review 2026-11-05-basic-design-2#2 proposed, so that the trip of HS-5123 / HS-5125 can only block the opening of a closed valve and never cancel the open command of an isolation in service; or state in the C&E that the trip blocks only a new open command (S24).", response: "Answered in the design by commit f5d925f6 (D-028 item 6; C&E I-504 / I-505 / I-604 / I-605 logic, HS-5125 / HS-6125 notes): each logic now requires the valve's own closed-position switch to read closed, so it can act only on an opening. For the team to verify and close; S24 re-described and re-rated. Still proposed."}
  - {id: A22, status: proposed, by: agent, text: "Put the non-return valves, accumulators and speed controllers of XV-5101 / XV-6101 and the arm isolations XV-n121 / XV-n123 / XV-n124 in the proof test (hold time of at least 5 min and closure time, both ASSUMED) and on the maintenance setting list; size PSV-5131 / PSV-6131 and D-5101 / D-6101 for the air-failure closure case of D-023 (4) together with A1; and decide with D-020 whether a second set of air-header transmitters at the platform end of the jetty air main is needed so that a loss of the jetty air main trips ESD-1 before the berth valves move (S2, S25).", response: "Partly answered by commit 79d5c7ad (D-030 items 2, 13): an air loss at the platform end of the jetty air main is detected at the berth during a transfer, because the vapour arm isolations XV-5122 / XV-6122 have no accumulator and move first, and ZSO-5122 / ZSO-6122 losing the open position trips ESD-1 while the liquid-path valves still hold; voted transmitters at the platform end remain hold H-04, the accumulator and hold-time sizing hold H-03 and the transient analysis hold H-01. Still open: the proof test and setting list, the PSV-5131 / PSV-6131 and drum sizing, and the detection outside a transfer or with ZSO-5122 failed 'open' (S27, A23). Not answered further by commit 709fcf20: its maintenance override of a failed ZSO-5122 (C&E bypass, D-032 item 7) adds an hour-long gap in the platform-end detection during the transfer it covers (S27). Still proposed."}
  - {id: A23, status: proposed, by: agent, text: "Put ZSO-5122 / ZSO-6122 with their I-501 / I-601 path in the proof test (made only by the fully open valve, broken by the start of a closure), and decide whether the vapour-path proof needs a second contact or the voted platform-end air transmitters of hold H-04 so that a single switch stuck 'open' does not leave a platform-end air loss and a closed vapour arm undetected (S27); state whether a short confirmation delay on ZSO-5122 not open fits within the hold of the liquid-path valves' accumulators, against spurious full-rate ESD-1 trips (S26).", response: "Partly answered by commit 709fcf20 (C&E I-501 / I-601 bypass, D-032 item 7, review 2026-11-05-basic-design-6 #4): a failed ZSO-5122 / ZSO-6122 may be overridden for the transfer in progress only, under a permit, alarmed, told to the carrier, with XV-n122 checked open locally at the start and every hour (ASSUMED), which bounds the repeated spurious trips of S26 but opens the gap of S27 for that transfer. Still open: the proof test, a second contact or the voted platform-end transmitters (hold H-04), and the confirmation delay. Still proposed."}
  - {id: A24, status: proposed, by: agent, text: "Arm vendor (technical query H-02) and SIL screening (hold H-06): show that the 2oo2-in-series solenoids of each ERS valve and the energise-to-release couplers meet the required integrity of the ESD-2 closure and release on demand (both solenoids must vent; the release needs the HPU accumulator and every ERS valve proven closed), with a proof test of each solenoid valve on its own and of the coupler release, and an alarm on a low HPU accumulator; and confirm with the transient analysis (hold H-01) the closure time of the ERS valves for the full-flow case of both channels lost (S28, S29).", response: "Partly answered by commit 709fcf20 (D-016, D-023 (5), D-032 item 2; C&E I-507 / I-607 notes, SEQ-LOAD S1): the two channels are fed from UPS A and UPS B on separate distribution (ASSUMED) with the trips XA-n130A / B, so one supply fault trips ESD-1 with the valves held open (S33) and the full-flow closure needs two independent faults (S29 re-rated); the ERS function test before every transfer vents each solenoid on its own, proven by the vendor's pressure switch (ASSUMED), then both, which is the proof test of each solenoid (S34); the coupler release no longer needs every ERS valve proven closed, it is commanded 7 s after the ERS close command (S35). Still open: the integrity on demand in the SIL screening (hold H-06), a low HPU accumulator alarm, a proof test of the coupler release, the shared cable routes of the two channels on the platform, and the ERS closure time with the transient analysis (holds H-01, H-02). Partly answered further by commit aedd8dbd (D-034 items 6, 7; layout D-035 item 5): the per-circuit line monitoring of each channel trips ESD-1 during a transfer, the channels are on separate SIS output modules, UPS A / UPS B are rooms in B-JET with separate feeders to the HPU control panel and the circuits fire-resistant cable, the release is I-510 on the ERS proven closed or at 7.5 s with its own accumulator on each arm (ASSUMED); D-034.2 gives ~22.6 barg for every ERS valve closing at full flow. Still open: the integrity on demand (hold H-06), the accumulator alarm, the release proof test, the solver's fault behaviour and the ERS closure time (holds H-01, H-02). Still proposed."}
  - {id: A25, status: proposed, by: agent, text: "C&E: base the per-berth 'liquid transfer' state of I-501 / I-601 and I-514 / I-614 on signals of that berth (its arm isolations proven open, or a flow at its own header) rather than on the shared FIC-4101 / FIC-4102 with the shore ESD valve command, or alarm and block a shore ESD valve of the idle berth commanded open during the other berth's transfer; state the reset order when both ESD-1 have latched (S30).", response: "Mostly answered by commit 709fcf20 (D-032 items 1, 5; review 2026-11-05-basic-design-6 #1, #5): the per-berth transfer state is the berth's own shore ESD valve not proven closed by ZSC-n101 or held open by UZ-n101, no longer the shared FIC-4101 / FIC-4102, and an idle berth's link is in its 'no carrier connected' mode with its stowed arms reading stowed, so neither trips. For the team to verify and close; still open: the reset order with both ESD-1 latched, and the faults of the new switch (S31, A26). Still proposed."}
  - {id: A26, status: proposed, by: agent, text: "Put ZSC-5101 / ZSC-6101 with the arming of I-501 / I-514 (I-601 / I-614) in the proof test (made only by the fully closed valve); alarm ZSC-n101 'not closed' while UZ-n101 is de-energised for longer than the stroke time, so a false 'not closed' that disarms the reject in the gassing-up is seen; decide in the SIL screening (hold H-06) whether one switch may arm the transfer causes, since a single false 'not closed' at an idle berth trips the shared pumps, holding and the other berth's transfer at once, and whether the arming of I-514 after an ESD-1 needs more than the one closed contact (S31, S32, S30)."}
  - {id: A27, status: proposed, by: agent, text: "Make the ERS function test of SEQ-LOAD S1 a recorded check (each solenoid's pressure-switch state and each valve's stroke logged by the control system, not a text completion), put the vendor's pressure switches in the proof test, interlock the vendor's test function against the liquid transfer state (ZSC-n101 closed, UZ-n101 de-energised) and connected arms, and state whether a restart from S3 after an ESD-1 repeats the test (S34, S28).", response: "Partly answered by commit aedd8dbd (D-034 item 7 (a); C&E I-509 / I-609): the test function is enabled through HS-n109 only with XV-n101 proven closed, UZ-n101 de-energised and every arm stowed, hard-wired in the vendor panel (ASSUMED). Still open: the recorded test (logged pressure-switch states and strokes instead of a text completion), the vendor pressure switches in the proof test, and whether a restart from S3 repeats the test. Still proposed."}
  - {id: A28, status: proposed, by: agent, text: "Arm vendor (technical query H-02): confirm that the fixed coupler release time of I-507 / I-607 (5 s closure plus 2 s, ASSUMED) exceeds the slowest ERS closure over the HPU accumulator range and at low temperature, alarm a low HPU accumulator, and state the spill of a release with one ERS valve open, including the ESD-1 run-down flow, against the drip tray bays of D-033.4 (S35).", response: "Mostly answered by commit aedd8dbd (D-034 items 3, 6; C&E I-510 / I-610; review 2026-11-05-basic-design-7 #4): the fixed time is replaced by the release on both ERS valves of the arm proven closed or at 1.5 x the vendor's confirmed closure time (7.5 s with the ASSUMED 5 s), I-507 closes the arm isolations at the same time, and the spill with one ERS valve failed open is stated (~15 m3, onto the water between ship and jetty first; carrier side ~1-2 m3). Still open: the vendor's closure time and position switches (technical query H-02), a low accumulator alarm for the couplers' own accumulators, and the drift-off pool on the water as a siting case (D-035.14 (d)). Still proposed."}
  - {id: A29, status: proposed, by: agent, text: "Sequence / C&E: make the link XS-5100 / XS-6100 in the carrier's mode (not 'no carrier connected') a completion condition of SEQ-LOAD S1 and a permissive of S2 and S3, end the mode automatically when an arm envelope switch ZS-n151..n154 leaves 'stowed', and state whether the mode also blocks the ESD-1 effect to the carrier (S36).", response: "Answered in the design by commit aedd8dbd (D-034 item 5; C&E I-501 / I-601, I-508 / I-608; SEQ-LOAD S1; review 2026-11-05-basic-design-7 #3): the mode ends by itself on a healthy carrier link or when any arm leaves its stowed position, ended with no healthy link the link reads trip and ESD-1 trips, S1 completes only with the link in carrier mode and healthy, and I-508 / I-608 block the opening of XV-n101 otherwise. For the team to verify and close; still unstated: whether the mode blocks the ESD-1 effect to the carrier, and whether I-508's 'not healthy' is the same state as I-501's 'trip'; the new idle-berth cause is S30 (A32). Still proposed."}
  - {id: A30, status: proposed, by: agent, text: "Put AI-5126 / AI-6126 (both cells and the sample system) in the proof test with a sample-flow alarm, state their response time with the 2oo2 vote against the ~40 s that bounds the slug of D-026.1, and alarm a deviation between AI-5126 and AI-4133 (AI-6126 and AI-4134) on the same vapour, so that a berth analyser failed low is seen before the tank-end backup is the only O2 trip; confirm in the SIL screening (hold H-06) (S37).", response: "Not answered by commit aedd8dbd: D-034 item 4 moves the sample point to the vapour arm side of XV-n122 and makes the reset of I-n14 rest on the berth analyser, which raises the weight of a failed-low reading (it also permits the reset); no sample-flow alarm, proof test, response time or deviation alarm against AI-4133 / AI-4134 is added. Still proposed."}
  - {id: A31, status: proposed, by: agent, text: "SEQ-LOAD S1 / analyser package: make 'AI-5126 (AI-6126) fast loop back in service with a sample flow, the test N2 vented from the sampled section' a completion condition of the vapour arm leak test before XV-n122 is opened, with a sample-flow alarm, and do not permit the reset of I-n14 on a reading taken without proven sample flow (S37).", response: "Partly answered by commit c257902c (D-036 item 8 #7; SEQ-LOAD S1, C&E I-514 notes): the fast loop's isolation valve (the analyser vendor's tag) proven closed by the package is a permissive of the leak test and the loop is reopened after it, and the reset condition of I-n14 (both cells below 5 vol %) is written. Still open: the loop back in service with a proven sample flow as a completion condition before XV-n122 opens, the sample-flow alarm, and no reset on a reading without sample flow. Still proposed."}
