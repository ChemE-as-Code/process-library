              reads it off-specification and before XV-4135 is proven open and I-513 has closed
              XV-4131, it also reaches the flare (H-05 S18); during a transfer ESD-1 on AI-4133
              sends the line pack to the tanks (H-02 S23).
            refs: [AI-5126, AI-4133, XV-5122, XV-5125, XV-4135, XV-4131, BOG-5001, BOG-4001, AI-6126, AI-4134, LA-5102]
            modes: [startup, cooldown, loading]
