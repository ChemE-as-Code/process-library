  - {id: SG17, title: "N2 leak test of the liquid arms at 5 bar and the vapour arm at 2.5 bar before cooldown (SEQ-LOAD S1, S2)", kind: procedural, refs: [LA-5101, LA-5102], status: proposed, by: agent}
  - {id: SG18, title: "Jetty sump T-8102 with low temperature alarm TSL-8104", kind: mechanical, refs: [T-8102, TSL-8104], status: proposed, by: agent, notes: "Since f5d925f6 (D-029 item 3) on its own piled sump deck between the bows of the two berthed carriers, reached from the platform drip trays by a covered trough under the deck and along the sump deck catwalk; sited by the pool-fire screening of D-018 (layout, not an analysed input; H-05 S13). Since 79d5c7ad (D-031 items 2-4) the drip trays under both berths' arms and manifolds drain into enclosed collectors under the deck slab along both faces and the south edge, vented at the catwalk, then an open 0.6 m trough on the catwalk S-CW-A9 (39 m) to T-8102, now re-centred between the hulls; the muster point is moved off the collector to the platform's north-west corner (H-05 S13, S27, S28)."}
  - {id: SG19, title: "Drain to D-5101 and N2 purge to below 2 % hydrocarbons before disconnection (SEQ-LOAD S6)", kind: procedural, refs: [D-5101], status: proposed, by: agent, notes: "Since 886b0ad5 the purge runs with XV-5161 open, out through D-5101 and BOG-5002 into the vapour return (D-026 item 13); completion by text only."}
  - {id: SG20, title: "Interlock I-601: Berth 1 ESD-1", kind: interlock, interlock: I-601, refs: [XS-6100, XV-6101], status: proposed, by: agent, notes: "Since 79d5c7ad as SG1 for Berth 1 (ZSO-6122, AI-4134, the ERS supply, I-501 during a Berth 1 transfer; D-030)."}
  - {id: SG36, title: "Interlock I-501 (I-601) on ZSO-5122 (ZSO-6122): the vapour arm isolation XV-5122 (XV-6122) not proven open during a liquid transfer trips ESD-1 at the start of any closure", kind: interlock, interlock: I-501, refs: [ZSO-5122, XV-5122, ZSO-6122, XV-6122], status: proposed, by: agent, notes: "Added in 79d5c7ad (D-030 items 2, 8); XV-5122 / XV-6122 fail closed without an accumulator on purpose, so they are the first jetty valves to move on an air loss at the platform end; also proven open in SEQ-LOAD S0, S1, S3, S4; SIL null; its spurious action is S26, a false 'open' S27; voted platform-end transmitters remain hold H-04."}
  - {id: SG21, title: "Interlock I-602: PZT-6103 back-pressure high-high", kind: interlock, interlock: I-602, refs: [PZT-6103], status: proposed, by: agent}
  - {id: SG22, title: Surge relief PSV-6131 of the Berth 1 header into D-6101, kind: relief, refs: [PSV-6131], status: proposed, by: agent, notes: "As SG3; the air-failure closure is one of its relief cases since f5d925f6, the spurious ERS closure at full flow since 79d5c7ad (D-023 (5))."}
  - {id: SG23, title: "LIC-6111 D-6101 level: starts and stops P-6101, high-high alarm", kind: control, refs: [LIC-6111, P-6101], status: proposed, by: agent}
  - {id: SG24, title: "ESD-2 of Berth 1: I-603 trips ESD-1 (I-601) at once; I-607 closes the ERS valves XV-6131..XV-6144 and releases the couplers 5 s after I-603", kind: interlock, interlock: I-607, refs: [ZS-6151, XV-6131], status: proposed, by: agent, notes: "As SG12 for Berth 1; ERS closure in I-607 since fac0bbb5 (D-026 item 2). SIL null."}
  - {id: SG25, title: "Interlock I-506: independent D-5101 high-high level LZT-5112 closes the header drain XV-5161", kind: interlock, interlock: I-506, refs: [LZT-5112, XV-5161], status: proposed, by: agent, notes: "Added in 589c9ca7 (D-025 item 4); does not stop the relief inflow downstream of XV-5161 (S21); SIL null."}
  - {id: SG26, title: "Header drain XV-5161 fail closed, closed in cooldown and loading (SEQ-LOAD S0 completion) and by ESD-1 (I-501)", kind: procedural, refs: [XV-5161, HS-5161], status: proposed, by: agent, notes: "Added in 589c9ca7; prevents the S3 cause, opened only in SEQ-LOAD S6 (since 886b0ad5 for the drain and the N2 purge)."}
  - {id: SG27, title: "Check valve CV-5116 and isolation HV-5117 on the P-5101 discharge LNG-5006", kind: check-valve, refs: [CV-5116, HV-5117], status: proposed, by: agent, notes: "Added in 589c9ca7 (D-025 item 4)."}
  - {id: SG28, title: "N2 tie-in double block and bleed HV-5151 / HV-5153 / HV-5152 with the bleed N-5001", kind: mechanical, refs: [HV-5151, HV-5152, HV-5153, N-5001], status: proposed, by: agent, notes: "Added in 589c9ca7 (D-025 item 4); manual valves, no interlock with the cooldown."}
  - {id: SG29, title: "Arm thermal relief PSV-5171 (LA-5101), PSV-5173 (LA-5103), PSV-5174 (LA-5104) into D-5101", kind: relief, refs: [PSV-5171, PSV-5173, PSV-5174], status: proposed, by: agent, notes: "Added in 589c9ca7 (D-025 item 4), 15.0 barg; Berth 1 alike with PSV-6171 / 6173 / 6174."}
  - {id: SG30, title: "Interlocks I-504 / I-505: the open commands HS-5123 / HS-5125 of XV-5123 and XV-5125 mutually inhibited by ZSC-5125 / ZSC-5123", kind: interlock, interlock: I-504, refs: [ZSC-5123, ZSC-5125, XV-5123, XV-5125, HS-5123, HS-5125], status: proposed, by: agent, notes: "Added in 589c9ca7; I-505 is the reverse permissive; the vendor key interlock is not drawn. Since 886b0ad5 the effect trips HS-5123 / HS-5125 instead of closing the valve, and the switches sense their valves (D-026 item 14); since f5d925f6 the logic also requires the valve's own switch to read closed (ZSC-5123 in I-504, ZSC-5125 in I-505; D-028 item 6); see S24."}
  - {id: SG31, title: "Interlocks I-604 / I-605: the open commands HS-6123 / HS-6125 of XV-6123 and XV-6125 mutually inhibited by ZSC-6125 / ZSC-6123", kind: interlock, interlock: I-604, refs: [ZSC-6123, ZSC-6125, XV-6123, XV-6125, HS-6123, HS-6125], status: proposed, by: agent, notes: "Added in 589c9ca7; I-605 is the reverse permissive; since 886b0ad5 on HS-6123 / HS-6125; since f5d925f6 with the valve's own ZSC closed in the logic (D-028 item 6)."}
  - {id: SG34, title: "Interlock I-804: instrument-air header low-low PZT-8123A/B/C (2oo3, 4.5 barg ASSUMED) initiates ESD-1 of both berths (I-501 / I-601: loading pumps stopped, carriers tripped through XS-5100 / XS-6100) before the fail-closed actuators stroke (~3.5 barg ASSUMED)", kind: interlock, interlock: I-804, refs: [PZT-8123A, PZT-8123B, PZT-8123C, XS-5100, XS-6100], status: proposed, by: agent, notes: "Added in f5d925f6 (D-028 item 1; P-08, P-05 / P-06 notes); latching, manual reset, SIL null; ahead of a valve only while the header at the jetty falls slower than its margin allows (S25)."}
  - {id: SG35, title: "Shore ESD valves XV-5101 / XV-6101 and arm isolations XV-n121 / XV-n123 / XV-n124: non-return valve and local air accumulator on the actuator supply, speed controller on the exhaust (closure 25-30 s, at least 25 s for the arm isolations)", kind: mechanical, refs: [XV-5101, UZ-5101, XV-5121, HS-5121, XV-5123, XV-5124, XV-6101, UZ-6101, XV-6121, XV-6123, XV-6124], status: proposed, by: agent, notes: "Added in f5d925f6 (D-016, D-028 item 1; instrument list, P-05 / P-06 note); closure and hold times ASSUMED; no proof test in the files; their failure on an air loss is S25."}
  - {id: SG32, title: "Interlock I-606: independent D-6101 high-high level LZT-6112 closes the header drain XV-6161", kind: interlock, interlock: I-606, refs: [LZT-6112, XV-6161], status: proposed, by: agent, notes: "Added in 589c9ca7; SIL null."}
  - {id: SG33, title: "Check valve CV-6116 and isolation HV-6117 on the P-6101 discharge LNG-6006", kind: check-valve, refs: [CV-6116, HV-6117], status: proposed, by: agent, notes: "Added in 589c9ca7."}
actions:
  - {id: A1, status: proposed, by: agent, text: "Complete the transient surge analysis of D-023 for the carrier-side closure (the ship's ESD valve closure time from the carrier data, SIGTTO/OCIMF practice) and for the ERS valve closure, and confirm the capacity of PSV-5131 / PSV-6131 and of D-5101 / D-6101 for the relieved volume; agree the maximum closure rate with each carrier at the pre-transfer meeting.", response: "Not answered at f5d925f6: D-028 hands the transient analysis of D-023 (1), (3), (4) to detail engineering and adds a relief case to PSV-5131 / PSV-6131 (a closure on an air failure faster than commanded, S25); the carrier-side closure, the ERS closure (ASSUMED 5 s, vendor) and the PSV and drum capacities are still open. Commit 79d5c7ad (D-023 (5), D-030 items 3, 13) adds the spurious ERS closure at full flow (both solenoid channels or the UPS supply lost, S29) as case (5) and a relief case of PSV-5131 / PSV-6131, and registers the transient analysis of D-023 (1), (3), (4), (5) as hold H-01 and the ERS trip principle and closure time as technical query H-02 with the arm vendor, against the detail-engineering gate. Still open as before. Still proposed."}
  - {id: A2, status: proposed, by: agent, text: "C&E change: record the XV-5101 / XV-6101 closure time (25-30 s, D-016) and the delay after the pump stop as effects parameters of I-501 / I-601 (and I-502 / I-602), and require a closure-time test at commissioning and in the proof test.", response: "Partly answered by commit 589c9ca7: the I-501 / I-601 notes state the order (loading pumps first, then XV-5101 / XV-6101 in 25 s) and that the closure time is a safety requirement (D-023). Still open: closure time and delay as effect parameters of I-501 / I-601 and I-502 / I-602 (the C&E has a delay field, not used there), and the closure-time test. Commit fac0bbb5 (D-026 item 2) uses the delay field for the ERS closure: I-507 / I-607 close the ERS valves 5 s after ESD-2 (I-503 / I-603), which now trips ESD-1 at once; the XV-5101 / XV-6101 closure time is still only in the I-501 / I-601 notes. Commit f5d925f6 (D-016, D-028) sets the closure time by a speed controller on the actuator exhaust (25-30 s, the same for a commanded closure and one on air loss; UZ-5101 / UZ-6101) and restates the order in the I-501 / I-601 notes (pumps and carrier first); the C&E effects still have no closure time or delay, and no closure-time test is named. Still proposed."}
  - {id: A3, status: proposed, by: agent, text: "P&ID P-05 / P-06 change: add drain isolation on DR-5001 / DR-6001 (normally closed in cooldown and loading, double block where it opens to D-5101) with the PSV-5131 / PSV-6131 discharge tied in downstream of it, and state the drain line-up in SEQ-LOAD S6.", response: "Answered in the design by commit 589c9ca7 (D-025 item 4; review 2026-11-05 critical #1): header drain valve XV-5161 / XV-6161 (fail closed, HS-5161 / HS-6161), closed in SEQ-LOAD S0 and by I-501 / I-601 and I-506 / I-606, opened and closed again in SEQ-LOAD S6; PSV-5131 / PSV-6131 and the arm and pump relief valves join DR-5001 / DR-6001 downstream of it. A single valve, not a double block: for the team to judge, verify and close; S3, S18 re-rated, the relief inflow with the drum high is S21."}
  - {id: A4, status: proposed, by: agent, text: "P&ID P-05 / P-06 change: add a check valve and an isolation valve on the P-5101 / P-6101 discharge LNG-5006 / LNG-6006 before the tie-in to LNG-4003.", response: "Answered in the design by commit 589c9ca7 (D-025 item 4): check valve CV-5116 / CV-6116 and isolation HV-5117 / HV-6117 on LNG-5006 / LNG-6006, with suction isolation HV-5115 / HV-6115, minimum flow LNG-5007 / LNG-6007 through FO-5118 / FO-6118, vent HV-5119 / HV-6119 and thermal relief PSV-5118 / PSV-6118. For the team to verify and close; S4, S18 re-rated."}
  - {id: A5, status: proposed, by: agent, text: "P&ID P-05 / P-06 and C&E change: add an independent high-high level switch on D-5101 / D-6101 with a defined action (stop the drain line-up, alarm) separate from LIC-5111 / LIC-6111.", response: "Answered in the design by commit 589c9ca7 (D-025 item 4): independent high-high level LZT-5112 / LZT-6112 on its own nozzle; I-506 / I-606 close the header drain XV-5161 / XV-6161. For the team to verify and close; S5, S18 re-rated."}
  - {id: A6, status: proposed, by: agent, text: "Provide a fixed O2 measurement (or a sample point on the arm vents drawn on P-05 / P-06) and make 'O2 below 1 %' and 'N2 header pressure healthy' (PI-8121) permissives of SEQ-LOAD S3 cooldown."}
  - {id: A7, status: proposed, by: agent, text: "P&ID P-05 / P-06 change: make the N2 connection a removable spool or double block and bleed with HV-5151 / HV-6151 interlocked closed before cooldown, and state the material and design temperature of N-8001 / N-8002 in the line list.", response: "Partly answered by commit 589c9ca7 (D-025 item 4; review #18): double block and bleed HV-5151 / HV-5153 / HV-5152 with the bleed N-5001 (Berth 1: HV-6151 / HV-6153 / HV-6152, N-6001). Still open: the interlock of the N2 tie-in closed before cooldown, and the material and design temperature of N-8001 / N-8002 (not in the line list). Commit fac0bbb5 writes the block and bleed line-up into SEQ-LOAD S2 and S6 (bleed HV-5153 closed while HV-5151 / HV-5152 are open for the leak test and purge, both blocks closed and the bleed opened after); still procedural, no interlock. Still proposed."}
  - {id: A8, status: proposed, by: agent, text: "State the arm cooldown rate limit (temperature change per hour from the arm vendor) and the TI-5104 / TI-6104 criterion in SEQ-LOAD S3."}
  - {id: A9, status: proposed, by: agent, text: "Show the mooring load monitoring (quick-release hooks, S-01) and the wind measurement as signals of the loading permissive and of a pre-alarm / ESD-1 in the C&E; they are named in SEQ-LOAD only as text."}
  - {id: A10, status: proposed, by: agent, text: "Ask the arm vendor for the envelope zones (pre-alarm, ESD-1, ESD-2) and their margins against the carrier drift speed; record them in the instrument list for ZS-5151..ZS-5154 / ZS-6151..ZS-6154.", response: "Partly answered by commit 589c9ca7: envelope stage 1 of ZS-5151..ZS-5154 (ZS-6151..ZS-6154) now initiates ESD-1 (I-501 / I-601) and stage 2 ESD-2 (I-503 / I-603). Still open: the vendor's zones and their margins against the drift speed in the instrument list."}
  - {id: A11, status: proposed, by: agent, text: "C&E change: make I-503 / I-603 initiate I-501 / I-601 (pumps stopped, XV-5101 closing) before the ERS valves close, with the ERS closure time and the delay as effect parameters; consider voting of the envelope switches for the release step. Also reconcile the instrument list, which says UZ-5131..UZ-5144 close on ESD-1 (I-501), with I-501, whose effects do not include them.", response: "Mostly answered by commit 589c9ca7 (D-025 item 4): I-503 / I-603 initiate ESD-1 first and close the ERS valves after a 5 s delay (C&E delay field); the instrument list now says UZ-5131 closes on ESD-2, not ESD-1. Still open for the team: the ERS closure time (vendor, D-023) and the voting of the envelope switches (logic any, unchanged). S11 re-rated. Commit fac0bbb5 (DESIGN.md D-026 item 2; review 2026-11-05-basic-design-2#4) restructures it as asked: I-501 / I-601 take I-503 / I-603 tripped as a cause, so ESD-2 trips ESD-1 with no delay, and the ERS closure and coupler release are the separate interlocks I-507 / I-607 with the 5 s delay after I-503 / I-603; SG12 / SG24 credit I-507 / I-607. The ERS closure time and the voting remain open. Commit f5d925f6 (D-016, D-028 item 1) makes the ERS valves hydraulic on the arm vendor's power unit with its accumulator, closing only on I-507 / I-607 (de-energise-to-trip) in a closure time set with the vendor, ASSUMED 5 s; the vendor value and the voting remain open. Commit 79d5c7ad (D-016, D-030 item 3) states the ERS trip principle (two line-monitored solenoids in series per ERS valve on the UPS, the supply loss an ESD-1 cause, the couplers energise-to-release after the ERS valves are proven closed) and keeps the ERS closure not interlocked behind a pump stop; the closure time and the principle are technical query H-02 with the arm vendor. The voting of the envelope switches is unchanged (logic any). Still proposed."}
  - {id: A12, status: proposed, by: agent, text: "C&E change: state that a fault of the ship-shore link XS-5100 / XS-6100 initiates ESD-1 (fail-safe) and give the link's power supply (UPS) in the files.", response: "Not answered at f5d925f6: D-028 item 4 makes XS-5100 / XS-6100 'trip' an effect of I-501 / I-601, so every shore ESD-1 is sent to the carrier; whether a link fault itself trips ESD-1 and the link's supply (UPS, ASSUMED in F-POWER) are still not in the C&E. Not answered at 79d5c7ad: F-POWER restates the link, the ESD logic and the ERS solenoids on uninterruptible supplies (ASSUMED) and the loss of the ERS solenoid supply is now an ESD-1 cause, but a fault of the link XS-5100 / XS-6100 itself is still not a stated cause of I-501 / I-601. Still proposed."}
  - {id: A13, status: proposed, by: agent, text: "Interlock XV-5123 / XV-5125 (XV-6123 / XV-6125) so that the hybrid arm cannot be open to the liquid header and the vapour line at once (position feedback, C&E entry).", response: "Answered in the design by commit 589c9ca7 (D-025 item 4; review #3): position switches ZSC-5123 / ZSC-5125 (ZSC-6123 / ZSC-6125) and the permissives I-504 / I-505 (I-604 / I-605), plus a vendor key interlock at the arm. For the team to verify and close; S13, S20 re-rated. Commit 886b0ad5 (review 2026-11-05-basic-design-2#2, D-026 item 14) moves the effect from the valve to its open command (HS-5123 / HS-5125 'trip') and ties the switches to their valves; the logic still has no 'this valve closed' condition, so whether an isolation in service can be closed by a switch fault is S24 (A21). Still proposed."}
  - {id: A14, status: proposed, by: agent, text: "Add a high pressure alarm on PI-5105 / PI-6105 with the response (rate reduction, hybrid arm to vapour duty), and state in SEQ-LOAD S4 when the hybrid arm is switched to vapour service; confirm the carrier's return against the arm capacity (D-023).", response: "Partly answered by commit fac0bbb5 (DESIGN.md D-026 item 6; SEQ-LOAD S4 operator text): two arm line-ups chosen from the cargo plan, (a) L-V-H-L with the hybrid as third liquid arm at 12,000 m3/h and the return limited to one vapour arm (~23.5 t/h, the carrier burns the balance on board, S-01), (b) the hybrid as second vapour arm on two liquid arms at ~8,000 m3/h (ASSUMED) with up to ~47 t/h of return; to be checked against carrier data in detail engineering. Still open: the high pressure alarm on PI-5105 / PI-6105 with its response. Commit 886b0ad5 writes both line-ups into SEQ-LOAD S4 as operator steps and restates the return in D-026 item 6 (line-up (b) ~34 t/h on two vapour paths; the 45.6 t/h of D-009 kept as an envelope; ASSUMED until carrier data). The PI-5105 / PI-6105 alarm is still not in the files. Still proposed."}
  - {id: A15, status: proposed, by: agent, text: "P&ID P-05 / P-06 change: draw the drip trays under the arms and manifold and the spill route to T-8102, routed so that LNG cannot reach the sea water (rapid phase transition), and the cryogenic spill protection of the platform steel.", response: "Partly answered by commit 79d5c7ad in the layout (D-018, D-031 item 2; not an analysed input of this study): the drip trays under both berths' arms and manifolds drain into enclosed collectors under the deck slab along both faces and the south edge, vented at the catwalk, then an open 0.6 m trough on the catwalk S-CW-A9 (39 m) to T-8102; the muster point no longer stands over the collection. Still open: the drip trays and the spill route on P-05 / P-06 (not drawn), the cryogenic spill protection of the platform steel, and the vapour in the enclosed collectors (H-05 S27). Still proposed."}
  - {id: A16, status: proposed, by: agent, text: "Make 'arm drained (D-5101 level steady) and hydrocarbons below 2 %' a measured permissive of the coupler release at disconnection (SEQ-LOAD S6), with the measuring point drawn."}
  - {id: A17, status: proposed, by: agent, text: "Confirm the D-5101 / D-6101 hold-up for the largest relieved volume (surge relief PSV-5131 / PSV-6131 and the arm thermal relief) with the drain XV-5161 / XV-6161 closed by I-506 / I-606, and give LZT-5112 / LZT-6112 a defined response for the relief case (alarm, P-5101 / P-6101 start, ESD-1 during loading), since the relief outlets join downstream of the drain valve."}
  - {id: A18, status: proposed, by: agent, text: "Confirm with the arm vendor the cavity relief of the ERS ball valves and that PSV-5171 / PSV-5173 / PSV-5174 (PSV-6171 / 6173 / 6174) protect every blocked-in arm section after ESD-2, including the sections between the ERS ball valves; since f5d925f6 the ERS valves stay open on an air failure, so include the outboard arm blocked in up to the carrier's manifold valve (S22)."}
  - {id: A19, status: proposed, by: agent, text: "C&E / sequence change: define the test mode of the SEQ-LOAD S3 ESD-1 test (who sets it, that it inhibits only the sequence abort and only for an ESD-1 initiated from the test push button or the link test, that it ends automatically after a set time or at the I-501 reset), let any other I-501 cause abort SEQ-LOAD during the test, and make 'all I-501 causes clear' a condition of the I-501 reset (S23); Berth 1 alike.", response: "Partly answered by commit f5d925f6 (D-028 item 7; SEQ-LOAD S3): the test mode ends automatically with the reset of I-501 or 15 min after it was set (ASSUMED), the test is repeated after the cooldown in the same way, and S3 completes only with I-501 reset and the line-up reopened. Still open: who sets the test mode, that it excepts only an I-501 trip from the test (any I-501 cause is excepted now), and an 'all causes clear' condition of the I-501 reset. Still proposed."}
  - {id: A20, status: proposed, by: agent, text: "C&E / sequence change for I-514 / I-614: make the closure of XV-5122 / XV-6122 stop the SEQ-LOAD S3 cooldown flow (a hold or abort condition, the carrier informed through the link), state whether I-514 / I-614 may act during loading (its logic has no mode condition, so a spurious O2 high-high closes the only vapour arm of line-up (a), S14), and set its integrity with the single analyser AI-4133 / AI-4134 (H-02 A14).", response: "Partly answered by commit f5d925f6 (D-028 item 5; review 2026-11-05-basic-design-4 #2): I-514 / I-614 are armed only in SEQ-LOAD S1 to S3 (from S4 an alarm, the operator stops by ESD-1), vote 2oo2 on two O2 cells of the analyser (ASSUMED; confirmed in the SIL screening) and also close XV-5125 / XV-6125. Still open: a hold or abort of the S3 cooldown flow on I-514 / I-614 (not an abort condition of SEQ-LOAD), with the carrier informed through the link. Answered in the design by commit 79d5c7ad (D-030 items 4, 8; review 2026-11-05-basic-design-5 #4): I-514 / I-614 are armed on the plant state 'no liquid transfer at the berth', so they never close the vapour path while the S3 cooldown or the loading runs; during a transfer the 2oo2 O2 high-high trips ESD-1 (I-501 / I-601), which stops the flow and trips the carrier through the link, and ZSO-5122 / ZSO-6122 trip ESD-1 on any other closure of the vapour arm isolation. For the team to verify and close; the routing of the O2-bearing line pack to the tanks on that ESD-1 is H-02 S23. Still proposed."}
  - {id: A21, status: proposed, by: agent, text: "C&E change: add 'ZSC-5123 closed' to I-504 and 'ZSC-5125 closed' to I-505 (Berth 1: ZSC-6123 / ZSC-6125 in I-604 / I-605), as review 2026-11-05-basic-design-2#2 proposed, so that the trip of HS-5123 / HS-5125 can only block the opening of a closed valve and never cancel the open command of an isolation in service; or state in the C&E that the trip blocks only a new open command (S24).", response: "Answered in the design by commit f5d925f6 (D-028 item 6; C&E I-504 / I-505 / I-604 / I-605 logic, HS-5125 / HS-6125 notes): each logic now requires the valve's own closed-position switch to read closed, so it can act only on an opening. For the team to verify and close; S24 re-described and re-rated. Still proposed."}
  - {id: A22, status: proposed, by: agent, text: "Put the non-return valves, accumulators and speed controllers of XV-5101 / XV-6101 and the arm isolations XV-n121 / XV-n123 / XV-n124 in the proof test (hold time of at least 5 min and closure time, both ASSUMED) and on the maintenance setting list; size PSV-5131 / PSV-6131 and D-5101 / D-6101 for the air-failure closure case of D-023 (4) together with A1; and decide with D-020 whether a second set of air-header transmitters at the platform end of the jetty air main is needed so that a loss of the jetty air main trips ESD-1 before the berth valves move (S2, S25).", response: "Partly answered by commit 79d5c7ad (D-030 items 2, 13): an air loss at the platform end of the jetty air main is detected at the berth during a transfer, because the vapour arm isolations XV-5122 / XV-6122 have no accumulator and move first, and ZSO-5122 / ZSO-6122 losing the open position trips ESD-1 while the liquid-path valves still hold; voted transmitters at the platform end remain hold H-04, the accumulator and hold-time sizing hold H-03 and the transient analysis hold H-01. Still open: the proof test and setting list, the PSV-5131 / PSV-6131 and drum sizing, and the detection outside a transfer or with ZSO-5122 failed 'open' (S27, A23). Still proposed."}
  - {id: A23, status: proposed, by: agent, text: "Put ZSO-5122 / ZSO-6122 with their I-501 / I-601 path in the proof test (made only by the fully open valve, broken by the start of a closure), and decide whether the vapour-path proof needs a second contact or the voted platform-end air transmitters of hold H-04 so that a single switch stuck 'open' does not leave a platform-end air loss and a closed vapour arm undetected (S27); state whether a short confirmation delay on ZSO-5122 not open fits within the hold of the liquid-path valves' accumulators, against spurious full-rate ESD-1 trips (S26)."}
  - {id: A24, status: proposed, by: agent, text: "Arm vendor (technical query H-02) and SIL screening (hold H-06): show that the 2oo2-in-series solenoids of each ERS valve and the energise-to-release couplers meet the required integrity of the ESD-2 closure and release on demand (both solenoids must vent; the release needs the HPU accumulator and every ERS valve proven closed), with a proof test of each solenoid valve on its own and of the coupler release, and an alarm on a low HPU accumulator; and confirm with the transient analysis (hold H-01) the closure time of the ERS valves for the full-flow case of both channels lost (S28, S29)."}
  - {id: A25, status: proposed, by: agent, text: "C&E: base the per-berth 'liquid transfer' state of I-501 / I-601 and I-514 / I-614 on signals of that berth (its arm isolations proven open, or a flow at its own header) rather than on the shared FIC-4101 / FIC-4102 with the shore ESD valve command, or alarm and block a shore ESD valve of the idle berth commanded open during the other berth's transfer; state the reset order when both ESD-1 have latched (S30)."}
