id: H-03
title: Berths, loading arms and ERS
scope: >-
  Detail-stage HAZOP of Berth 2 (P-05) and Berth 1 (P-06): the berth liquid header LNG-5001 /
  LNG-6001 with the shore ESD valve XV-5101 / XV-6101, strainer SR-5102 / SR-6102 and surge relief
  PSV-5131 / PSV-6131; the four 16 inch arms per berth (liquid, vapour, hybrid, liquid) with
  their isolation valves, ERS ball valves and envelope monitoring; the vapour line BOG-5001 /
  BOG-6001; the jetty drain drum D-5101 / D-6101 and pump P-5101 / P-6101; the N2 connection
  N-8001 / N-8002 with HV-5151 / HV-6151; the ship-shore link XS-5100 / XS-6100 and the
  interlocks I-501..I-503, I-601..I-603 and, since 589c9ca7, the valved header drain XV-5161 /
  XV-6161, the drain drum high-high I-506 / I-606, the hybrid arm permissives I-504 / I-505,
  I-604 / I-605, the arm thermal relief PSV-5171 / 5173 / 5174 (PSV-6171 / 6173 / 6174) and the N2
  double block and bleed, since fac0bbb5 the ERS closure I-507 / I-607, and since 886b0ad5 the
  carrier vapour rejection I-514 / I-614 on XV-5122 / XV-6122. The trestle lines and the de-inerting switch are in H-02, the BOG system in H-04,
  the jetty sump T-8102 and the N2 supply in H-05. Not covered: the carrier (its cargo system,
  ESD valves and return-gas compressor), mooring equipment and the arm hydraulics (vendor
  package), which appear only as causes.
modes:
  - {id: holding, title: Holding, description: "No carrier: arms stowed, berth header isolated by XV-5101 / XV-6101; the circulation passes the platform crossover LNG-4003 (H-02). Since 709fcf20 the link XS-5100 / XS-6100 is in its 'no carrier connected' mode and the stowed arms' envelope switches read stowed, so the idle berth trips nothing (D-016, D-032 item 5). Since aedd8dbd the mode ends by itself when an arm leaves its stowed position (or a carrier's link is connected and healthy), and ended with no healthy link it trips the berth's ESD-1 (D-034 item 5), so arm movements at an idle berth are made outside the other berth's transfers (ASSUMED operating rule)."}
  - {id: loading, title: Loading, description: "One carrier at one berth: line-up (a) 3 liquid arms at ~4,000 m3/h each with the vapour arm, or line-up (b) 2 liquid arms with the vapour arm and the hybrid arm as second vapour path, never instead of the vapour arm (D-023 (2), D-032 item 7), SEQ-LOAD S4 and S5."}
  - {id: cooldown, title: Cooldown, description: "Arms and carrier manifold cooled at 500 m3/h with ESD tests before and after (SEQ-LOAD S3)."}
  - {id: startup, title: Connection and disconnection, description: "ERS function test, link switched from its 'no carrier connected' mode, connect, N2 leak test and purge (SEQ-LOAD S1, S2, since 709fcf20 with the ERS test and XV-n122 opened after the vapour arm leak test; since aedd8dbd the ERS test enabled by HS-n109 under I-n09, the mode ending by itself on the carrier's healthy link, S1 completing only with the link in carrier mode and healthy, the N2 for the vapour arm test entering at the arm package's test connection with the AI-n126 fast loop isolated, and the jetty sump T-8102 checked dry as a SEQ-LOAD permissive); drain, purge, disconnect, stow and link mode set before the cable is disconnected (S6); ESD response (SEQ-ESD)."}
