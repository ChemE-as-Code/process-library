risk_matrix: safety/risk-matrix.yaml
assessment_basis: >-
  Each scenario is rated per category before its safeguards (initial): severity is the credible
  worst outcome if every safeguard fails, likelihood that of the cause. The codes are agent
  proposals with their basis, for the team to accept or change. Residual ratings are proposed
  (by the agent, status proposed) only for the scenarios whose safeguards changed in commit
  589c9ca7 and where a new layer independent of the cause now exists as drawn: the severity is
  kept, the likelihood is lowered by one code per independent layer named in the basis, and
  nothing is credited whose capacity or integrity the files leave open. Where 589c9ca7 removed
  the original cause (S3, S18: the undrained header drain), the scenario keeps its id and is
  re-rated for the cause that remains. Crediting safeguards remains the team's judgement (and a
  LOPA's where needed). The matrix is the example matrix of cheme init (example: true), so the
  bands are illustrative.
team: []            # to be named by the project; no team has sat on this draft yet
notes: >-
  Drafted by an agent (skills hazop-study, hazop-equipment-causes, relief-scenarios,
  safeguard-crediting). Berth 1 (P-06) is a renumbered copy of Berth 2 (D-015, D-019): node N3
  repeats only the findings whose tags differ. Surge figures are the slow-closure estimate of
  D-023 (ASSUMED wave speed); weather limits and the 35 kn disconnect are from S-01 via DESIGN.md.
nodes:
  - id: N1
    title: Berth 2 liquid header LNG-5001, shore ESD valve, surge relief and jetty drain drum
    design_intent: >-
      Deliver up to 12,000 m3/h from loading line A (and line B through the platform crossover)
      through XV-5101 and SR-5102 to the arm connections LNG-5002 / LNG-5003 / LNG-5001 S6-S7 at
      about 350 kPa(a) at the manifold (D-011); XV-5101 closes in 25-30 s on ESD-1 (I-501) or
      high back-pressure (I-502), PSV-5131 relieves surge and thermal expansion into D-5101
      (D-016, D-023); after loading the arms and header drain by DR-5001 to D-5101, emptied by
      P-5101 (LIC-5111) into the crossover LNG-4003. Since 589c9ca7 (D-025 item 4): the drain is
      valved by XV-5161 (fail closed, closed in cooldown and loading, opened in SEQ-LOAD S6,
      closed by I-501 and by the independent drum high-high LZT-5112 / I-506), the relief outlets
      join DR-5001 downstream of XV-5161; P-5101 has suction and discharge isolation HV-5115 /
      HV-5117, a check valve CV-5116, a minimum flow LNG-5007 through FO-5118, a vent HV-5119 and
      thermal relief PSV-5118; the N2 tie-in is a double block and bleed HV-5151 / HV-5153 /
      HV-5152 with the bleed N-5001.
