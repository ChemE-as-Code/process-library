nodes:
  - id: N1
    title: Berth 2 liquid header LNG-5001, shore ESD valve, surge relief and jetty drain drum
    design_intent: >-
      Deliver up to 12,000 m3/h from loading line A (and line B through the platform crossover, since
      aedd8dbd the DN 800 LNG-4010 / XV-4107 with the DN 250 XV-4103 closed, D-034) through XV-5101 and SR-5102 to the arm connections LNG-5002 / LNG-5003 / LNG-5001 S6-S7 at
      about 350 kPa(a) at the manifold (D-011); XV-5101 closes in 25-30 s on ESD-1 (I-501) or
      high back-pressure (I-502), PSV-5131 relieves surge and thermal expansion into D-5101
      (D-016, D-023); after loading the arms and header drain by DR-5001 to D-5101, emptied by
      P-5101 (LIC-5111) into the crossover LNG-4003. Since 589c9ca7 (D-025 item 4): the drain is
      valved by XV-5161 (fail closed, closed in cooldown and loading, opened in SEQ-LOAD S6,
      closed by I-501 and by the independent drum high-high LZT-5112 / I-506), the relief outlets
      join DR-5001 downstream of XV-5161; P-5101 has suction and discharge isolation HV-5115 /
      HV-5117, a check valve CV-5116, a minimum flow LNG-5007 through FO-5118, a vent HV-5119 and
      thermal relief PSV-5118; the N2 tie-in is a double block and bleed HV-5151 / HV-5153 /
      HV-5152 with the bleed N-5001. Since 886b0ad5 (D-026 item 13; review
      2026-11-05-basic-design-3#7) XV-5161 stays open during the after-loading N2 purge of SEQ-LOAD
      S6: the purge N2 leaves through XV-5161, D-5101 and its vent BOG-5002 into the vapour return
      (to the flare while AI-4133 reads off-specification), and XV-5161 closes after the purge.
      Since f5d925f6 (D-016, D-028 items 1, 3, 4): I-501 stops the loading pumps and trips the
      carrier through XS-5100 (now an effect) at once, then closes XV-5101 in 25-30 s; ESD-1 is
      also initiated by the air-header trip I-804 (PZT-8123A/B/C, P-08, 2oo3); XV-5101 has a
      non-return valve and a local air accumulator on the actuator supply (one stroke, at least
      5 min hold, ASSUMED) and a speed controller on the exhaust, so on an air failure it holds
      until I-804 has stopped the pumps and closes no faster than its set speed; the relief case of
      PSV-5131 includes a fast closure on an air failure (non-return valve or accumulator failed,
      header lost faster than I-804); I-502 acts only once the header pressure has risen and is
      not credited against surge (C&E notes); at f5d925f6 I-201 / I-301 stopped the drain pump
      P-5101 on every tank high-high level; since 79d5c7ad (D-030 item 1; I-506 notes) only I-205 /
      I-305 do, when the circulation return into the tripped tank is not proven closed by ZSC-2123 /
      ZSC-3123 after 15 s, so in loading (returns proven closed in SEQ-LOAD S0) P-5101 keeps
      emptying D-5101 on a tank high-high. Since 709fcf20 (D-032 items 1, 6, 7): the closed-position
      switch ZSC-5101 on XV-5101 itself with the SIS output UZ-5101 defines the liquid transfer
      state of the berth (XV-5101 not proven closed, or held open), which arms the transfer causes
      of I-501 and, as its complement, the O2 reject I-514 (S31, S32); SEQ-LOAD S0 proves XV-5101
      closed; ESD-1 does not stop the circulation pump P-2102 / P-3102, so in the S3 cooldown
      XV-5101 closes against its 500 m3/h (~150 kPa for an instant closure, D-016); the I-205 /
      I-305 on-delay of 15 s now sits on 'I-201 / I-301 tripped', not on the switch. Since aedd8dbd
      (D-034 items 1-3, 5; C&E I-501, I-508): both trestle lines run at 3.4 m/s to the loading berth
      and the header at 6.8 m/s; ESD-1 also closes the platform crossover XV-4107; the loading pumps
      are rated 191 m (shut-off about 11 barg at the header with no flow, agent estimate, H-02
      S27); the open command of XV-5101 (UZ-5101) is blocked unless XS-5100 is in carrier mode and
      healthy (I-508); the PSV-5131 relief case is rechecked for 3.4 m/s in both lines, one arm's
      ERS closing in 5 s ~11 barg peak, inside the 15 barg design, every ERS valve of the berth ~23
      barg, above it (D-034.2); the governing spill downstream of XV-5101 is the header flow until
      the ESD-1 closure, ~170 m3 per berth, upstream of it the trestle line behind the leak (D-034.3,
      H-02 S29); from the layout (D-035, not an analysed input) XV-5101 and SR-5102 stand in the
      platform header bay, the manifold and drum bays pass the spill to T-8102, now 13.0 m deep.
      Since c257902c (D-036 items 1, 5 (a), 8, 11 (a), (e); P-05, C&E I-502, I-506, I-205; SEQ-LOAD S3,
      S6): I-502 protects the carrier's manifold and cargo piping (taken at a 10 barg design,
      ASSUMED) against the shore shut-off (~12.1 barg at XV-5101, ~12.3 barg at the lowest carrier
      manifold with a full tank, scripts/terminal_sizing.py) when the link signal does not arrive:
      PZT-5181 / PZT-5184 at the outboard ends of LA-5101 / LA-5104, arm side of the inboard ERS
      valve (transmitters on the arms, arm vendor, ASSUMED), voted 1oo2 with a discrepancy alarm,
      PAHH 5.0 barg (normal there ~2.5-3.0 barg at 12,000 m3/h), stop the loading pumps, trip the
      carrier through XS-5100 and close XV-5101; bound 5.0 + 2.7-3.2 bar of carrier closure rise +
      ~0.1 bar = ~8.3 barg at the manifold for a carrier closure whose flow falls over its 25-30 s
      stroke (a check case of hold H-01); PZT-5103 on the header (normal ~5.2-5.5 barg) stays in
      the logic at 7.0 barg as an uncredited backstop; I-502 is not credited against a shore-side
      closure ahead of the pump stop (I-501, I-804). P-5101 discharges through LNG-5006 into the
      header downstream of XV-5101 (tee T50K), so the drain of a transfer stays in D-5101 (vent
      BOG-5002 open to the vapour return) until LIC-5111, permitted only with XV-5101 open and the
      cooldown flow established, empties it into the cooldown flow of the next transfer (SEQ-LOAD
      S3, completion 'D-5101 emptied'); I-205 / I-305 no longer stop P-5101. FO-5118 (minimum
      flow) is drawn as a restriction orifice. From the layout (D-037, not an analysed input): XV-5101
      and SR-5102 lie horizontal on the berth header in the header bay frame PR10, reached from the
      aisle S-HDR at 4.5 m, XV-5101 fire-tested (API 607 / ISO 10497) with 240 min PFP of the bay;
      the N2 tie-in T50N is on the header's turn north of the bay. Since ae718797 (D-039 items 2, 5
      #7, 6 (a), D-039.9 (h); P-05, C&E I-501 / I-502, loops LIC-5111, SEQ-ESD S2, instrument list,
      special items): ESD-1 also stops P-5101 (I-501), so it no longer dead-heads on its minimum flow
      against the closed XV-5101; LIC-5111 is registered as a loop, to auto only with ZSC-5101 not
      closed and the cooldown flow established, back to manual on ZSC-5101 closed or I-501 tripped.
      After ESD-1 the berth header from XV-5101, the arms (isolations and ERS valves open) and the
      carrier's manifold spool behind its closed ESD valve are one blocked-in liquid section; the arm
      thermal reliefs PSV-5171 / 5173 / 5174, now set at 8.0 barg (was 15.0; ~2.5 bar above the
      highest normal arm-base pressure, ~5.5 barg), are its lowest-set relief and relieve it into
      D-5101 as it warms, so the spool stays below ~9.7 barg against its 10 barg (ASSUMED); I-502 may
      re-trip on PZT-5181 / 5184 with no further effect; once the cause is cleared and I-501 reset
      (XV-5101 still proven closed, the reset reopening no valve), the operator lets the section down
      into D-5101 and its vent BOG-5002 through XV-5161 (LZT-5112 / I-506 closing it at high-high),
      resets I-502 below 5.0 barg, and the restart is from SEQ-LOAD S3. SR-5102 is a permanent T-type
      strainer with a top cover (DEXPI Strainer, was ConicalStrainer, temporary), its PDI-5102 a
