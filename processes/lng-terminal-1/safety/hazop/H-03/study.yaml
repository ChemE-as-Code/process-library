risk_matrix: safety/risk-matrix.yaml
assessment_basis: >-
  Each scenario is rated per category before its safeguards (initial): severity is the credible
  worst outcome if every safeguard fails, likelihood that of the cause. The codes are agent
  proposals with their basis, for the team to accept or change. No residual ratings are
  proposed: crediting safeguards is the team's judgement (and a LOPA's where needed). The matrix
  is the example matrix of cheme init (example: true), so the bands are illustrative.
team: []            # to be named by the project; no team has sat on this draft yet
notes: >-
  Drafted by an agent (skills hazop-study, hazop-equipment-causes, relief-scenarios,
  safeguard-crediting). Berth 1 (P-06) is a renumbered copy of Berth 2 (D-015, D-019): node N3
  repeats only the findings whose tags differ. Surge figures are the slow-closure estimate of
  D-023 (ASSUMED wave speed); weather limits and the 35 kn disconnect are from S-01 via DESIGN.md.
nodes:
  - id: N1
    title: Berth 2 liquid header LNG-5001, shore ESD valve, surge relief and jetty drain drum
    design_intent: >-
      Deliver up to 12,000 m3/h from loading line A (and line B through the platform crossover)
      through XV-5101 and SR-5102 to the arm connections LNG-5002 / LNG-5003 / LNG-5001 S6-S7 at
      about 350 kPa(a) at the manifold (D-011); XV-5101 closes in 25-30 s on ESD-1 (I-501) or
      high back-pressure (I-502), PSV-5131 relieves surge and thermal expansion into D-5101
      (D-016, D-023); after loading the arms and header drain by DR-5001 to D-5101, emptied by
      P-5101 (LIC-5111) into the crossover LNG-4003.
    members: [LNG-5001, XV-5101, UZ-5101, SR-5102, PDI-5102, PZT-5103, TI-5104, PSV-5131, DR-5001, DR-5002, D-5101, LIC-5111, P-5101, LNG-5005, LNG-5006, BOG-5002, N-8001, HV-5151]
    status: proposed
    by: agent
    deviations:
      - id: N1-HP
        guide_word: more
        parameter: pressure (surge)
        scenarios:
          - id: S1
            cause: >-
              The carrier's manifold or cargo valves close against the full loading rate (ship
              ESD, or a valve closed by the ship without the link), faster than the 25 s assumed
              for XV-5101 (D-023).
            consequence: >-
              Pressure surge at the manifold, in the arms and the header; D-023 gives +1,753 kPa
              more for an instant closure, beyond the 15 barg design of the arms and lines:
              swivel or coupler failure, LNG spray on the carrier deck and the platform, LNG into
              the sea (rapid phase transition), cold embrittlement of deck and platform steel.
            refs: [LA-5101, LA-5103, LA-5104, LNG-5001, PZT-5103, PSV-5131]
            modes: [loading]
            safeguards: [SG1, SG2, SG3]
            actions: [A1]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "4", likelihood: B, status: proposed, by: agent, basis: "LNG release at the manifold with people on deck and platform; matrix 4 = permanent injury or fatality. B: could happen once in the plant life.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: c7123d4b67bd5af0, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '4', likelihood: B}}}
                - {category: environment, severity: "3", likelihood: B, status: proposed, by: agent, basis: "LNG to sea; matrix 3 = reportable release.", band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: 92790e212f41fb89, inputs: {matrix: b6caa11838fe6bc7, category: environment, severity: '3', likelihood: B}}}
          - id: S2
            cause: >-
              ESD-1 (I-501) closes XV-5101 faster than its 25-30 s or before the loading pumps
              have stopped (actuator speed control lost, the closure time is not a C&E parameter).
            consequence: As S1, with the peak at XV-5101 and along the trestle line.
            refs: [XV-5101, UZ-5101, LNG-5001, LNG-4001]
            modes: [loading]
            safeguards: [SG3]
            actions: [A1, A2]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "4", likelihood: B, status: proposed, by: agent, basis: "As S1; matrix 4.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: c7123d4b67bd5af0, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '4', likelihood: B}}}
      - id: N1-HL
        guide_word: more
        parameter: level (D-5101)
        scenarios:
          - id: S3
            cause: >-
              DR-5001 is drawn with no valve between the header LNG-5001 and D-5101: during
              cooldown and loading the header is open to the drain drum.
            consequence: >-
              LNG flows continuously into D-5101 (~50 m3); the drum fills and LNG leaves by its
              vent BOG-5002 into the vapour line BOG-5001 and the vapour return to the tanks and
              D-7101 (liquid carry-over to the BOG compressors, H-04); the loading flow is
              short-circuited to the drain system.
            refs: [DR-5001, D-5101, BOG-5002, BOG-5001, LIC-5111]
            modes: [loading, cooldown]
            safeguards: [SG4]
            actions: [A3]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: D, status: proposed, by: agent, basis: "Liquid in the vapour return and the compressor suction; matrix 3 = plant down for weeks. D: as drawn it happens at every loading.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: d5ef0dbadb27cd72, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '3', likelihood: D}}}
                - {category: people, severity: "3", likelihood: C, status: proposed, by: agent, basis: "Two-phase slugging in the vapour line, flange leak; matrix 3 = lost-time injury.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: b6fe1208a949a698, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '3', likelihood: C}}}
            notes: Possibly a drafting omission (D-021 leaves low-point drains off); the team to confirm the intended drain isolation.
          - id: S4
            cause: >-
              P-5101 is stopped while the crossover LNG-4003 is pressurised by the circulation or
              the loading pumps: LNG-5006 has no check valve and no isolation valve drawn.
            consequence: Back flow through P-5101 into D-5101; reverse rotation; drum overfill and liquid into the vapour line as S3.
            refs: [P-5101, LNG-5006, LNG-4003, D-5101]
            modes: [holding, loading]
            safeguards: [SG4]
            actions: [A4]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: C, status: proposed, by: agent, basis: "Pump damage, liquid to the BOG system; matrix 3 = plant down for weeks.", band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: 4255ea3f73fe5efe, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '3', likelihood: C}}}
          - id: S5
            cause: LIC-5111 fails (level reads low) or P-5101 fails to start after the post-loading drain or after PSV-5131 has relieved.
            consequence: D-5101 overfills; LNG into the vapour line as S3.
            refs: [LIC-5111, P-5101, D-5101, PSV-5131]
            modes: [startup, loading]
            safeguards: [SG4]
            actions: [A5]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: C, status: proposed, by: agent, basis: "Liquid in the vapour return; matrix 3 = plant down for weeks.", band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: 4255ea3f73fe5efe, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '3', likelihood: C}}}
            notes: LIC-5111 is the only level instrument; its high-high alarm is on the same transmitter as the pump control.
      - id: N1-OC
        guide_word: other-than
        parameter: composition (O2 in the header and arms)
        scenarios:
          - id: S6
            cause: >-
              Purge to below 1 % O2 before cooldown not achieved (N2 supply low, PI-8121; purge
              cut short; arm vent sample taken at the wrong point), or air drawn in through a
              leaking coupler.
            consequence: >-
              Flammable mixture in the arms, the header and the vapour return when LNG is admitted;
              ignition by static or a falling-film spark: internal deflagration of the arm or the
              vapour line.
            refs: [HV-5151, N-8001, LA-5101, LA-5102, LNG-5001]
            modes: [startup, cooldown]
            safeguards: [SG5, SG6]
            actions: [A6]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "4", likelihood: B, status: proposed, by: agent, basis: "Internal explosion of an arm with people at the manifold; matrix 4. B: could happen once in the plant life.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: c7123d4b67bd5af0, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '4', likelihood: B}}}
      - id: N1-RF
        guide_word: reverse
        parameter: flow (into the N2 system)
        scenarios:
          - id: S7
            cause: >-
              HV-5151 left open after the leak test while the header is pressurised with LNG
              (5-9 barg at loading, D-023) above the 7 barg N2 header, and CV5151 leaks.
            consequence: LNG into the N2 header N-8001 (material not stated), cold embrittlement and rupture of the N2 line; N2 header contaminated toward Berth 1 and the users on P-08.
            refs: [HV-5151, N-8001, {sheet: P-05, object: CV5151}, LNG-5001]
            modes: [loading]
            safeguards: [SG7, SG8]
            actions: [A7]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "3", likelihood: B, status: proposed, by: agent, basis: "Rupture of a utility line with a cold release; matrix 3 = lost-time injury.", band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: aa86891dd127d418, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '3', likelihood: B}}}
      - id: N1-LF
        guide_word: less
        parameter: flow
        scenarios:
          - id: S8
            cause: SR-5102 blocked by construction debris or ice (first loadings, after maintenance).
            consequence: High differential pressure, reduced loading rate, pumps toward minimum flow; strainer collapse sends debris to the carrier's manifold and tanks.
            refs: [SR-5102, PDI-5102]
            modes: [loading, cooldown]
            safeguards: [SG9]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "2", likelihood: C, status: proposed, by: agent, basis: "Loading delay and strainer repair; matrix 2 = plant down for days.", band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: b67377b30017f4a1, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '2', likelihood: C}}}
      - id: N1-HT
        guide_word: less
        parameter: temperature (cooldown rate)
        scenarios:
          - id: S9
            cause: Arms and header cooled too fast (FIC-4101 cooldown setpoint 500 m3/h set higher, or liquid admitted to warm arms).
            consequence: Thermal shock of swivels and flanges, leaks at the arm joints; large flash vapour to the vapour arm.
            refs: [FIC-4101, LNG-5001, TI-5104, LA-5101]
            modes: [cooldown]
            safeguards: [SG10]
            actions: [A8]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "3", likelihood: C, status: proposed, by: agent, basis: "LNG spray from a swivel at the manifold; matrix 3 = lost-time injury.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: b6fe1208a949a698, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '3', likelihood: C}}}
            notes: The deviation is a faster temperature change than intended.
  - id: N2
    title: Berth 2 loading arms LA-5101..LA-5104, ERS, vapour arm and ship-shore link
    design_intent: >-
      Transfer LNG (three liquid arms, ~4,000 m3/h each) and return vapour (LA-5102, ~23.5 t/h at
      40 m/s per arm, D-023; hybrid LA-5103 as spare vapour path through XV-5125) between the shore
      and the carrier manifold within the arm envelope; ESD-1 (I-501) from the link XS-5100, manual
      push buttons and the platform fire and gas; ESD-2 (I-503) from the envelope switches
      ZS-5151..ZS-5154, manual or the 35 kn disconnect closes the ERS valves XV-5131..XV-5134 /
      XV-5141..XV-5144 and releases the couplers (D-014, D-016).
    members: [LA-5101, LA-5102, LA-5103, LA-5104, XV-5121, XV-5122, XV-5123, XV-5124, XV-5125, XV-5131, XV-5132, XV-5133, XV-5134, XV-5141, XV-5142, XV-5143, XV-5144, ZS-5151, ZS-5152, ZS-5153, ZS-5154, XS-5100, BOG-5001, BOG-5003, PI-5105, TI-5106]
    status: proposed
    by: agent
    deviations:
      - id: N2-OT
        guide_word: other-than
        parameter: position (arm envelope)
        scenarios:
          - id: S10
            cause: >-
              Carrier drift or surge along the berth: mooring line or hook failure, wind above the
              35 kn disconnect limit, passing-ship interaction, tidal range not followed by the
              mooring.
            consequence: >-
              The arms are dragged beyond their envelope; if ESD-2 does not act, arm structure or
              swivel failure with LNG spilling on the carrier deck, the platform and into the sea
              (rapid phase transition, cold embrittlement, pool or jet fire on ignition).
            refs: [LA-5101, LA-5102, LA-5103, LA-5104, ZS-5151, ZS-5154]
            modes: [loading, cooldown]
            safeguards: [SG11, SG12, SG13, SG2]
            actions: [A9, A10]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "4", likelihood: B, status: proposed, by: agent, basis: "Arm failure with LNG release at the manifold; matrix 4 = permanent injury or fatality. B: could happen once in the plant life.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: c7123d4b67bd5af0, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '4', likelihood: B}}}
                - {category: environment, severity: "3", likelihood: B, status: proposed, by: agent, basis: "LNG to sea; matrix 3 = reportable release.", band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: 92790e212f41fb89, inputs: {matrix: b6caa11838fe6bc7, category: environment, severity: '3', likelihood: B}}}
                - {category: asset, severity: "4", likelihood: B, status: proposed, by: agent, basis: "Arm and carrier manifold damage; matrix 4 = loss of the unit (berth).", band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: f33c22768a8b83e6, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '4', likelihood: B}}}
          - id: S11
            cause: >-
              ESD-2 initiated (ZS-5151 fault, spurious or justified envelope trip) while LNG is still
              flowing at the full rate: the I-503 effects close the ERS valves and XV-5101 but do
              not stop the loading pumps; the order 'after ESD-1' is only in the notes.
            consequence: >-
              The ERS ball valves close against ~4,000 m3/h per arm: surge in the arms and header
              (closure time of the ERS valves not in the files); the couplers release with a
              pressurised volume between the ball valves: LNG spill on deck and into the sea.
            refs: [XV-5131, XV-5141, ZS-5151, P-2101A]
            modes: [loading]
            safeguards: [SG3, SG1]
            actions: [A11]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "4", likelihood: B, status: proposed, by: agent, basis: "LNG release at the manifold; matrix 4.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: c7123d4b67bd5af0, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '4', likelihood: B}}}
            notes: I-503 is driven by any one of four position switches (logic any); a single switch fault gives a spurious release.
      - id: N2-NF
        guide_word: "no"
        parameter: signal (ship-shore link)
        scenarios:
          - id: S12
            cause: >-
              The ship-shore link XS-5100 fails during loading (fibre break, connector pulled at
              disconnection drift, loss of power on either side).
            consequence: >-
              An ESD on either side no longer reaches the other: the carrier may close its valves
              with the shore pumps running (surge, S1), or the shore may trip while the carrier's
              return-gas compressor runs (vapour back-pressure, S14).
            refs: [XS-5100]
            modes: [loading, cooldown]
            safeguards: [SG2, SG3, SG14]
            actions: [A12]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "4", likelihood: B, status: proposed, by: agent, basis: "As S1 with the link as the common cause; matrix 4.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: c7123d4b67bd5af0, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '4', likelihood: B}}}
            notes: The C&E cause of I-501 is XS-5100 'trip'; whether a link fault is itself a trip (fail-safe) is not stated.
      - id: N2-AW
        guide_word: as-well-as
        parameter: flow (liquid in the vapour line)
        scenarios:
          - id: S13
            cause: >-
              Hybrid arm LA-5103 lined up for liquid and vapour at once (XV-5123 and XV-5125 both
              open, HS-5123 / HS-5125 are independent operator switches).
            consequence: >-
              LNG from the header into BOG-5003 / BOG-5001 and the vapour return to the tanks and
              D-7101: liquid slugs in a vapour line, back-pressure on the carrier, liquid
              carry-over to the BOG compressors (H-04).
            refs: [XV-5123, XV-5125, HS-5123, HS-5125, BOG-5003, BOG-5001]
            modes: [loading, startup]
            actions: [A13]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: C, status: proposed, by: agent, basis: "Liquid in the BOG system; matrix 3 = plant down for weeks.", band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: 4255ea3f73fe5efe, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '3', likelihood: C}}}
                - {category: people, severity: "3", likelihood: C, status: proposed, by: agent, basis: "Slugging in the vapour line, flange leak; matrix 3.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: b6fe1208a949a698, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '3', likelihood: C}}}
      - id: N2-HP
        guide_word: more
        parameter: pressure (vapour return back-pressure)
        scenarios:
          - id: S14
            cause: >-
              Vapour return beyond the vapour arm's capacity: the carrier's return reaches up to
              45.6 t/h (D-009) while one 16 inch arm carries ~23.5 t/h at 40 m/s (D-023), the
              hybrid arm being used for liquid; or XV-5122 / the vapour arm ERS valves are closed;
              or the shore vapour header pressure is high (BOG compressors tripped, H-04).
            consequence: >-
              High back-pressure on the carrier's tanks: the carrier's return-gas compressor or its
              tank relief valves act (outside the terminal); high velocity and noise in LA-5102.
            refs: [LA-5102, XV-5122, XV-5132, XV-5142, PI-5105, BOG-5001]
            modes: [loading, cooldown]
            safeguards: [SG15, SG16]
            actions: [A14]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: environment, severity: "3", likelihood: C, status: proposed, by: agent, basis: "Venting from the carrier's tank relief valves; matrix 3 = reportable release. C: return above one arm's capacity is the design case.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: 1fb9317519cce7ee, inputs: {matrix: b6caa11838fe6bc7, category: environment, severity: '3', likelihood: C}}}
      - id: N2-OT2
        guide_word: other-than
        parameter: containment (connection)
        scenarios:
          - id: S15
            cause: >-
              Coupler not fully engaged or gasket damaged at the carrier manifold, swivel seal
              leak, or the N2 leak test (5 bar liquid / 2.5 bar vapour arm) skipped.
            consequence: >-
