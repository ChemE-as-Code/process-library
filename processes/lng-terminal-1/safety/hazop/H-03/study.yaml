            cause: >-
              AI-5126 reads low on both cells (sample line blocked or drawn from the wrong point, a
              common calibration or sample-system fault, the analyser out of service) while the
              carrier sends vapour above 5 vol % O2 (gassing-up from a gas-free tank, air drawn in on
              board, a leak at the vapour arm): the O2 trips at the berth do not act and AI-4133 at
              the tank end is the only O2 trip. Berth 1 alike (AI-6126, AI-4134). Since aedd8dbd
              (D-034 item 4; instrument list AI-5126, SEQ-LOAD S1) the sample point is on the vapour
              arm side of XV-5122 and the fast loop is isolated during the vapour arm N2 leak test
              of S1, whose N2 enters between LA-5102 and XV-5122: also the fast loop left isolated
              after the test (the cells then read the stagnant test N2, 0 vol % O2, or a stale
              sample), or N2 from the test connection still in the sampled section when XV-5122 is
              opened; the same low reading also permits the reset of a tripped I-514, which needs
              both cells below 5 vol %.
