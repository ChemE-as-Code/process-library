              residual:
                - {category: people, severity: "4", likelihood: A, status: proposed, by: agent, basis: "Agent proposal for the team: one layer credited, ESD-1 ahead of the ERS closure: since fac0bbb5 I-501, tripped at once by I-503, stops the loading pumps and starts the XV-5101 closure, and I-507 closes the ERS valves only 5 s after I-503 (D-026 item 2; before, the same actions sat inside I-503, 589c9ca7), which reduces the flow the ERS valves close against. Severity kept: the ERS closure time and the surge are not analysed yet (A1, D-025 not done at basic). Initiated by the same envelope switches as the cause; SIL null.", evidence: [control/cause-effect.yaml, DESIGN.md D-025, DESIGN.md D-026], band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: ddcedc61b5d20d1a, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '4', likelihood: A}}}
