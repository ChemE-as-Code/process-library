      - id: N2-OCO
        guide_word: other-than
        parameter: composition (O2 measured at the berth)
        description: Created by the berth O2 analyser AI-5126 (AI-6126) as the O2 input of I-514 (I-614) and of the transfer cause of I-501 (I-601), with AI-4133 (AI-4134) as backup, added in 709fcf20 (D-032 item 3).
