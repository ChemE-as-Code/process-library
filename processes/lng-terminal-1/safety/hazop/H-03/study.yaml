safeguards:
  - {id: SG1, title: "Interlock I-501: Berth 2 ESD-1 stops the loading pumps, closes XV-5101, XV-4101, XV-4102 and trips the carrier through the link", kind: interlock, interlock: I-501, refs: [XS-5100, XV-5101], status: proposed, by: agent, notes: "Since f5d925f6 the carrier trip XS-5100 is an effect, so every cause reaches the carrier, and the air-header trip I-804 is a cause (D-028 items 1, 4). Since 79d5c7ad (D-030 items 2, 4, 7, 8, 9) the manual push buttons and the confirmed platform fire and gas are written causes, and during a liquid transfer also ZSO-5122 not open, the 2oo2 O2 high-high of AI-4133, the ERS solenoid supply lost and ESD-1 of Berth 1 (I-601); their spurious actions are S26 and S30. Since 709fcf20 (D-032 items 1, 2, 3, 6, 7): the causes are tags (HS-5100, XS-5108), the transfer causes are armed by ZSC-5101 not closed or UZ-5101 energised, the O2 high-high is that of AI-5126 or AI-4133, the supply causes are XA-5130A / XA-5130B (either one), the only bypass is the maintenance override of a failed ZSO-5122; P-2102 / P-3102 are not stopped (D-016); the transfer-state faults are S31, S32, one supply lost S33. Since aedd8dbd (D-034 items 1, 5, 7, 9): the manual causes are HS-5100A / B / C (normally closed, line-monitored), XS-5100 'trip' is the link not healthy, also once the 'no carrier connected' mode has ended on an unstowed arm, XA-5130A / B take the per-circuit line monitoring of their channel, and the effects include XV-4107."}
  - {id: SG2, title: "Interlock I-502: carrier manifold back-pressure high-high on PZT-5181 / PZT-5184 at the outboard ends of LA-5101 / LA-5104 (1oo2, PAHH 5.0 barg, ASSUMED), with PZT-5103 on the header as an uncredited backstop (7.0 barg), stops the loading pumps, trips the carrier through XS-5100 and closes XV-5101", kind: interlock, interlock: I-502, refs: [PZT-5181, PZT-5184, PZT-5103, XS-5100, XV-5101], status: proposed, by: agent, notes: "Independent of the link; its response time against a fast carrier closure is not stated. Since f5d925f6 the C&E names it a late, non-preventive safeguard, not credited against surge (D-016, D-028 item 4). Since c257902c (D-036 items 1, 11 (a), (e); C&E I-502, instrument list) it is the credited, independent protection of the carrier's manifold and cargo piping (10 barg, ASSUMED) against the shore shut-off when the link signal is lost: measured where the normal pressure is lowest (~2.5-3.0 barg), with a discrepancy alarm between the two transmitters, bound ~8.3 barg at the manifold for a closure whose flow falls over its 25-30 s stroke (check case of hold H-01); not credited against a shore-side closure ahead of the pump stop; SIL target from the H-06 screening (sil null); until aedd8dbd on PZT-5103 alone. Its failure on demand is S38, its spurious action S39."}
  - {id: SG3, title: Surge relief PSV-5131 of the Berth 2 header into D-5101, kind: relief, refs: [PSV-5131], status: proposed, by: agent, notes: "Size from the surge analysis in detail engineering (special items); since 589c9ca7 set at 15.0 barg, the 15 barg design (D-023, D-025), discharging into DR-5001 downstream of XV-5161. Since f5d925f6 its relief case also names XV-5101 or an arm isolation closing on an air failure faster than commanded (D-023 (4), S25). Since 79d5c7ad also a spurious ERS closure at full flow with both solenoid channels or their UPS supply lost (D-023 (5), S29), and the special items say that if the surge analysis shows a spring PSV cannot answer the transient it is a design change, not a sizing item. Since 709fcf20 that case reads both channels of a valve or both of the two independent supplies lost within the ESD-1 response (D-032 item 2)."}
  - {id: SG4, title: "LIC-5111 D-5101 level: starts and stops P-5101, high-high alarm", kind: control, refs: [LIC-5111, P-5101], status: proposed, by: agent, notes: "Since ae718797 (D-039 item 5 #7; control/loops.yaml LIC-5111 / LIC-6111): registered as a loop, to auto only with ZSC-5101 not closed and the cooldown or loading flow established, back to manual on ZSC-5101 closed or I-501 (P-5101 stopped by ESD-1); its start and stop levels unresolved (D-5101 datasheet, NPSH)."}
