          - id: S32
            cause: >-
              ZSC-5101 reads 'closed' while XV-5101 is open or still closing (switch held made, cam
              set to make early, a short in the wiring). During the transfer UZ-5101 keeps the
              state on and the discrepancy with the energised output alarms after the stroke time
              (C&E I-501 notes). After an ESD-1 or a commanded closure (UZ-5101 de-energised) the
              state ends at the command instead of at the proven-closed position: I-514 is armed
              during the 25-30 s closure and the pump run-down (the gating of D-032 item 4 lost),
              the transfer causes of I-501 (ZSO-5122, the O2 high-high, XA-5130A / B) are disarmed
