# human review record covers it (cheme safety hazop check). Schema: cheme schema
# hazop-study; workflow: safety/README.md and the skill hazop-study.
# Drafted by an agent from the plant as drawn (P-05, P-06, P-04 rev A, C&E, loops,
# sequences, special items) and revised by an agent to the P&IDs, C&E and sequences of
# commit 589c9ca7 (DESIGN.md D-025), then to those of commit fac0bbb5 (DESIGN.md D-026: ESD-2
# trips ESD-1 at once and I-507 / I-607 close the ERS 5 s later, hybrid arm permissives on the
# open command, two arm line-ups, the arm purge steps), then to those of commit 54648679 (the
# response to review 2026-11-05-basic-design-3 in commit 886b0ad5, DESIGN.md D-026 items 6, 7, 13,
# 14: the hybrid-arm permissives act on the open commands HS-n123 / HS-n125, the position switches
# sense their valves, the N2 purge with XV-n161 open, the SEQ-LOAD S3 ESD-1 test in test mode with
# XV-4101 / XV-4102 reopened, the line-ups of SEQ-LOAD S4, I-514 / I-614 on O2 above 5 vol %; the
# core 1.7.0 regeneration in 54648679 changed the drawing only), then to those of commit f5d925f6
# (DESIGN.md D-016, D-028: the instrument-air trip I-804 initiating ESD-1, non-return valves,
# accumulators and speed control on XV-n101 and the arm isolations, hydraulic ERS valves, XS-n100
# as an effect of I-n01, I-n02 named a late safeguard, I-n04 / I-n05 on their own ZSC, I-n14 2oo2
# and mode-armed and also closing XV-n125, the repeated SEQ-LOAD S3 ESD-1 test, I-201 / I-301
# stopping the drain pumps, PSV-n131 relief case, the jetty sump T-8102 re-sited by D-029).
# Every entry is a proposal for the team.
schema: cheme/hazop-study/v1
kind: hazop-study
id: H-03
title: Berths, loading arms and ERS
scope: >-
  Detail-stage HAZOP of Berth 2 (P-05) and Berth 1 (P-06): the berth liquid header LNG-5001 /
  LNG-6001 with the shore ESD valve XV-5101 / XV-6101, strainer SR-5102 / SR-6102 and surge relief
  PSV-5131 / PSV-6131; the four 16 inch arms per berth (liquid, vapour, hybrid, liquid) with
  their isolation valves, ERS ball valves and envelope monitoring; the vapour line BOG-5001 /
  BOG-6001; the jetty drain drum D-5101 / D-6101 and pump P-5101 / P-6101; the N2 connection
  N-8001 / N-8002 with HV-5151 / HV-6151; the ship-shore link XS-5100 / XS-6100 and the
  interlocks I-501..I-503, I-601..I-603 and, since 589c9ca7, the valved header drain XV-5161 /
  XV-6161, the drain drum high-high I-506 / I-606, the hybrid arm permissives I-504 / I-505,
  I-604 / I-605, the arm thermal relief PSV-5171 / 5173 / 5174 (PSV-6171 / 6173 / 6174) and the N2
  double block and bleed, since fac0bbb5 the ERS closure I-507 / I-607, and since 886b0ad5 the
  carrier vapour rejection I-514 / I-614 on XV-5122 / XV-6122. The trestle lines and the de-inerting switch are in H-02, the BOG system in H-04,
  the jetty sump T-8102 and the N2 supply in H-05. Not covered: the carrier (its cargo system,
  ESD valves and return-gas compressor), mooring equipment and the arm hydraulics (vendor
  package), which appear only as causes.
modes:
  - {id: holding, title: Holding, description: "No carrier: arms stowed, berth header isolated by XV-5101 / XV-6101; the circulation passes the platform crossover LNG-4003 (H-02)."}
  - {id: loading, title: Loading, description: "One carrier at one berth: 3 liquid arms at ~4,000 m3/h each, vapour arm (and hybrid arm as spare vapour path), SEQ-LOAD S4 and S5."}
  - {id: cooldown, title: Cooldown, description: "Arms and carrier manifold cooled at 500 m3/h with ESD tests before and after (SEQ-LOAD S3)."}
  - {id: startup, title: Connection and disconnection, description: "Connect, N2 leak test and purge (SEQ-LOAD S1, S2); drain, purge and disconnect (S6); ESD response (SEQ-ESD)."}
