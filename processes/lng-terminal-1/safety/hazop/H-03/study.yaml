# transfer state on the new closed-position switch ZSC-5101 / ZSC-6101 or the SIS output UZ-5101 /
# UZ-6101 instead of FIC-4101 / FIC-4102; the ERS solenoid channels on two UPS A / B with the trips
# XA-n130A / B, the ERS function test of SEQ-LOAD S1 before every transfer and the coupler release
