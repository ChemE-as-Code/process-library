risk_matrix: safety/risk-matrix.yaml
assessment_basis: >-
  Each scenario is rated per category before its safeguards (initial): severity is the credible
  worst outcome if every safeguard fails, likelihood that of the cause. The codes written here
  are agent proposals with their basis, for the team to accept or change. Residual ratings are
  proposed (by the agent, status proposed) only for the scenarios whose safeguards changed in
  commit 589c9ca7 and where a new layer independent of the cause now exists as drawn: the
  severity is kept, the likelihood is lowered by one code per independent layer named in the
  basis, and nothing is credited whose capacity or integrity the files leave open (SIL null
  everywhere). Which safeguards are credited, and how far, remains the team's judgement (and a
  LOPA's where the band requires it). The matrix safety/risk-matrix.yaml is the example matrix
  written by cheme init (example: true); the bands are therefore illustrative until the
  company's matrix replaces it. No frequency is calculated and no safeguard is credited by a tool.
team: []            # to be named by the project; no team has sat on this draft yet
notes: >-
  Drafted by an agent (skills hazop-study, hazop-equipment-causes, relief-scenarios,
  safeguard-crediting). Tanks T-2101 and T-3101 are identical (D-019): scenarios name T-2101
  with the T-3101 tags in brackets; the team may split them. Setpoints, set pressures and
  closure times quoted are ASSUMED values from DESIGN.md and the control files.
nodes:
  - id: N1
    title: Rundown header LNG-1001 from the train battery limit to the tank fill valves
    design_intent: >-
      Receive up to 3,365 t/h (~7,560 m3/h) of subcooled LNG at -161.5 degC and 215 kPa(a) from
      four trains (LNG-1001, LNG-1012..LNG-1014, each with its BL ESD valve XV-1111..XV-1114 and
      check valve) and route it to T-2101 through XV-1102 or to T-3101 through XV-1103; top or
      bottom fill chosen by XV-1106/XV-1107 (T-2101) and XV-1108/XV-1109 (T-3101) from AI-1102
      against the tank density profile (D-005, D-007). Since 589c9ca7: I-102 closes the
      battery-limit valves when ZSC-1102 and ZSC-1103 show both fill ESD valves closed, and the
      fill branches have their own thermal relief PSV-1122 / PSV-1123 (D-025 item 1).
    members: [LNG-1001, LNG-1012, LNG-1013, LNG-1014, LNG-1002, LNG-1003, LNG-1004, XV-1111, XV-1112, XV-1113, XV-1114, XV-1102, XV-1103, XV-1106, XV-1107, XV-1108, XV-1109, FI-1111, AI-1102, TI-1103, PI-1104, PSV-1121, BOG-1004, ZSC-1102, ZSC-1103, PSV-1122, PSV-1123, BOG-1010, BOG-1011]
    status: proposed
    by: agent
    deviations:
      - id: N1-NF
        guide_word: "no"
        parameter: flow
        scenarios:
          - id: S1
            cause: >-
              XV-1102 closes (I-201 on T-2101 LAHH or I-203 on PAHH) while XV-1103 is already
              closed (I-301/I-303 on T-3101, T-3101 isolated for maintenance or in Phase 1, or
              closed by the operator). I-101 closes the battery-limit valves only when both
              LZT-2102 and LZT-3102 are at LAHH, so this combination leaves the rundown with no
              outlet and no trip.
            consequence: >-
              The rundown of up to four trains is deadheaded against closed valves; fast closure
              of a DN 900 ESD valve at 3.4 m/s gives a pressure surge in LNG-1001 and the trains'
              rundown lines; possible flange or gasket failure and an LNG release in the tank
              area; trains upset (outside the battery limit).
            refs: [XV-1102, XV-1103, LNG-1001, LZT-2102, LZT-3102, ZSC-1102, ZSC-1103]
            safeguards: [SG2, SG22]
            actions: [A1, A2]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "4", likelihood: B, status: proposed, by: agent, basis: "LNG release in the tank area with ignition possible; matrix 4 = permanent injury or fatality. B: needs two closures together, could happen once in the plant life.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: c7123d4b67bd5af0, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '4', likelihood: B}}}
                - {category: asset, severity: "3", likelihood: B, status: proposed, by: agent, basis: "Rundown header damage and trains shut in; matrix 3 = plant down for weeks.", band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: 579975b5e9fe3f0e, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '3', likelihood: B}}}
              residual:
                - {category: people, severity: "4", likelihood: A, status: proposed, by: agent, basis: "Agent proposal for the team: one independent layer credited, I-102 (589c9ca7), which acts on the closed-position switches ZSC-1102 / ZSC-1103, not on the level or pressure transmitters whose trips are the cause, and closes the battery-limit valves with the trains tripped through the BL interface. Severity kept: the surge of the battery-limit closure itself is not analysed yet (A2). SIL of I-102 null.", evidence: [control/cause-effect.yaml, DESIGN.md D-025], band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: ddcedc61b5d20d1a, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '4', likelihood: A}}}
                - {category: asset, severity: "3", likelihood: A, status: proposed, by: agent, basis: "As the people residual: I-102 credited as one layer.", evidence: [control/cause-effect.yaml], band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: f04923bf0bf2e0ec, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '3', likelihood: A}}}
            notes: >-
              PSV-1121 is sized for thermal expansion only (special items) and is not a
              safeguard against a blocked rundown. The trains' rundown pressure and their own
              protection are outside the battery limit: the team to say what they are. Revised
              for 589c9ca7: I-102 answers A1; its spurious action is S18.
      - id: N1-HP
        guide_word: more
        parameter: pressure
        scenarios:
          - id: S2
            cause: >-
              LNG blocked in LNG-1001 between XV-1111..XV-1114 (or the check valves CV1111..CV1114)
              and XV-1102/XV-1103 after I-101 or I-102, warmed by ambient heat ingress.
            consequence: Thermal expansion overpressures the blocked-in rundown header.
            refs: [LNG-1001, XV-1111, XV-1102, XV-1103, PSV-1121]
            safeguards: [SG3]
            actions: [A15]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "3", likelihood: C, status: proposed, by: agent, basis: "Flange leak of LNG in the tank area; matrix 3 = lost-time injury. C: every I-101 trip blocks the header in.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: b6fe1208a949a698, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '3', likelihood: C}}}
          - id: S3
            cause: >-
              LNG blocked in the fill branches between the ESD valve and the fill selection
              valves: LNG-1002/LNG-1004 between XV-1102 and XV-1106/XV-1107 when both selection
              valves are closed, and the LNG-1001 tail and LNG-1003 between XV-1103 and
              XV-1108/XV-1109 likewise. PSV-1121 is upstream of XV-1102 and XV-1103 and does not
              reach these sections.
            consequence: >-
              Thermal expansion of trapped LNG overpressures the DN 900 fill lines; flange or
              valve body leak on the tank roof, LNG release at height.
            refs: [LNG-1002, LNG-1004, LNG-1003, XV-1102, XV-1106, XV-1107, XV-1103, XV-1108, XV-1109, PSV-1122, PSV-1123]
            safeguards: [SG23]
            actions: [A3]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "3", likelihood: C, status: proposed, by: agent, basis: "LNG leak on the tank roof; matrix 3 = lost-time injury. C: a routine fill-switch line-up can leave a section blocked in.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: b6fe1208a949a698, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '3', likelihood: C}}}
              residual:
                - {category: people, severity: "3", likelihood: B, status: proposed, by: agent, basis: "Agent proposal for the team: one layer credited, the thermal relief valves PSV-1122 (T-2101 branch, BOG-1010) and PSV-1123 (T-3101 branch, BOG-1011) added in 589c9ca7, set at the 15 barg line design, discharging to the tank vapour header; their relief case is this one (special items).", evidence: [piping/special-items.yaml, DESIGN.md D-025], band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: aa86891dd127d418, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '3', likelihood: B}}}
            notes: Revised for 589c9ca7 (D-025 item 1); PSV-1122 / PSV-1123 answer A3.
      - id: N1-HT
        guide_word: more
        parameter: temperature
        scenarios:
          - id: S4
            cause: >-
              Train upset (end-flash or main cryogenic heat exchanger, outside the battery limit)
              sends warmer, less subcooled LNG; the subcooling of ~1.3 K (D-005) is lost.
            consequence: >-
              The rundown flashes in the fill line (two-phase flow, vibration of LNG-1002/LNG-1004)
              and adds flash vapour to the tank; tank pressure rises (see N3-HP).
            refs: [TI-1103, LNG-1001, T-2101]
            safeguards: [SG4]
            actions: [A4]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "2", likelihood: C, status: proposed, by: agent, basis: "Line vibration and flashing; matrix 2 = plant down for days. C: train upsets are expected several times in the plant life.", band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: b67377b30017f4a1, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '2', likelihood: C}}}
            notes: TI-1103 is an indication; no alarm is stated in the instrument list.
      - id: N1-RF
        guide_word: reverse
        parameter: flow
        scenarios:
          - id: S5
            cause: >-
              One train trips and its rundown pressure at the battery limit falls below the
              header pressure while the other trains continue.
            consequence: LNG flows back from the header into the tripped train's rundown line.
            refs: [LNG-1012, XV-1112, {sheet: P-01, object: CV1112}]
            safeguards: [SG1]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "1", likelihood: C, status: proposed, by: agent, basis: "Back flow into the train's rundown; repair within a shift (matrix 1).", band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: 85aab00e0badb4b2, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '1', likelihood: C}}}
      - id: N1-NF2
        guide_word: "no"
        parameter: flow (spurious trip of the rundown)
        description: Created by the I-102 interlock added in 589c9ca7.
        scenarios:
          - id: S18
            cause: >-
              Spurious I-102: ZSC-1102 or ZSC-1103 shows a valve closed that is open (switch or
              wiring fault, valve stem not made up), while the other fill ESD valve is closed. With
              one tank isolated for maintenance or in Phase 1 (XV-1103 held closed), a single fault
              of ZSC-1102 is enough.
            consequence: >-
              I-102 closes XV-1111..XV-1114 at the full rundown rate and trips the four trains
              through the BL interface: loss of production for the whole plant, a pressure surge
              in LNG-1001 and the trains' rundown lines on the closure (as S1, closure times not yet
              set, A2), LNG blocked in the header (S2).
            refs: [ZSC-1102, ZSC-1103, XV-1111, XV-1112, XV-1113, XV-1114, LNG-1001]
            modes: [holding, loading, startup]
            safeguards: [SG2, SG3]
            actions: [A2, A16]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "3", likelihood: B, status: proposed, by: agent, basis: "Flange leak from the closure surge in the tank area; matrix 3 = lost-time injury. B: needs a position switch fault, more likely while one tank is isolated; could happen once in the plant life.", evidence: [control/cause-effect.yaml], band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: aa86891dd127d418, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '3', likelihood: B}}}
                - {category: asset, severity: "2", likelihood: C, status: proposed, by: agent, basis: "All four trains tripped and restarted; matrix 2 = plant down for days. C: spurious trips of a single-switch function are possible several times in the plant life.", evidence: [control/cause-effect.yaml], band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: b67377b30017f4a1, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '2', likelihood: C}}}
            notes: >-
              New scenario for 589c9ca7 (D-025 item 1). The trains' response to the BL trip
              (turn-down before the valves close) is outside the battery limit; the team to say
              what it is.
  - id: N2
    title: LNG tanks T-2101 and T-3101 - liquid inventory, level and density
    design_intent: >-
      Store up to 225,000 m3 working LNG each (D-007) at about -160 degC between the low-low and
      high-high levels of the independent servo gauges LZT-2102 / LZT-3102 (radar LT-2101 / LT-3101
      for inventory and fill control); since 589c9ca7 a second independent high-high gauge
      LZT-2106 / LZT-3106 makes I-201 / I-301 1oo2, and the trip also closes the circulation
      return XV-2123 / XV-3123 (D-025 item 2); fill top or bottom so that the density profile
      (LTD-2103 / LTD-3103) stays mixed (rollover, D-007); supply the in-tank pumps (H-02).
    members: [T-2101, T-3101, LT-2101, LZT-2102, LZT-2106, LTD-2103, TI-2104, TI-2105, LT-3101, LZT-3102, LZT-3106, LTD-3103, TI-3104, TI-3105, HS-1106, HS-1107, HS-1108, HS-1109]
    status: proposed
    by: agent
    deviations:
      - id: N2-HL
        guide_word: more
        parameter: level
        scenarios:
          - id: S6
            cause: >-
              The rundown continues into T-2101 (T-3101) past its high level: LT-2101 reads low
              (radar fault) or the operator does not switch the fill to the other tank in holding.
            consequence: >-
              Overfill: LNG over the suspended deck into the roof space and the vapour outlet
              BOG-1001 (liquid to D-7101 and the compressors, H-04) and to the inlets of PSV-2131A/B,
              which would discharge LNG from elevated tailpipes to atmosphere; overload of the
              inner tank.
            refs: [T-2101, LT-2101, XV-1102, BOG-1001, PSV-2131A, PSV-2131B, PSV-2131C, LZT-2106]
            modes: [holding, loading]
            safeguards: [SG5, SG6, SG7]
            actions: [A5]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "4", likelihood: C, status: proposed, by: agent, basis: "Cold LNG and vapour released from the tank top, flammable cloud in the tank area; matrix 4 = permanent injury or fatality. C: fill control failures are possible several times in the plant life.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: ac0a4b03e3d8d0c2, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '4', likelihood: C}}}
                - {category: asset, severity: "4", likelihood: C, status: proposed, by: agent, basis: "Inner tank or roof damage; matrix 4 = loss of the unit.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: 93e154c44de9f515, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '4', likelihood: C}}}
              residual:
                - {category: people, severity: "4", likelihood: B, status: proposed, by: agent, basis: "Agent proposal for the team: one layer credited, I-201 (I-301), since 589c9ca7 1oo2 on two gauges LZT-2102 / LZT-2106 independent of the radar LT-2101 whose failure is the cause. I-101 is not credited (it acts only when both tanks are high). The band stays high: SIL of I-201 null and no LT-2101 high alarm in the files (A5).", evidence: [control/cause-effect.yaml, control/instrument-list.yaml, DESIGN.md D-025], band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: c7123d4b67bd5af0, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '4', likelihood: B}}}
                - {category: asset, severity: "4", likelihood: B, status: proposed, by: agent, basis: "As the people residual: I-201 (1oo2) credited as one layer.", evidence: [control/cause-effect.yaml], band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: f33c22768a8b83e6, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '4', likelihood: B}}}
            notes: >-
              Since 589c9ca7 I-201 rests on two independent gauges LZT-2102 and LZT-2106 (1oo2,
              own nozzles), both independent of LT-2101 (D-025 item 2); the 1oo2 voting also makes
              a spurious closure of XV-1102 and XV-2123 more likely (then I-102 trips the rundown
              if XV-1103 is closed, S18). Whether LT-2101 has a high alarm and with what time to
              act is not in the files.
      - id: N2-LL
        guide_word: less
        parameter: level
        scenarios:
          - id: S7
            cause: >-
              Withdrawal by the loading pumps (up to 12,000 m3/h from one tank, D-011) continues
              below the minimum submergence: LT-2101 reads high, or the loading is not switched to
              the other tank.
            consequence: Submerged-motor pumps P-2101A..D and P-2102 cavitate and run dry; motor and bearing damage; loading stops.
            refs: [T-2101, LT-2101, P-2101A, P-2101B, P-2101C, P-2101D, P-2102]
            modes: [loading]
            safeguards: [SG8]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: C, status: proposed, by: agent, basis: "In-tank pump damage; a pump is pulled through its column, weeks (matrix 3).", band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: 4255ea3f73fe5efe, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '3', likelihood: C}}}
      - id: N2-OC
        guide_word: other-than
        parameter: composition (density)
        scenarios:
          - id: S8
            cause: >-
              Stratification: the rundown differs in density from the tank heel (train off-spec
              or a different train mix, a weathered N2-depleted heel, D-009) and is filled at the
              wrong level (lighter LNG bottom-filled under heavier, or heavier top-filled without
              mixing); LTD-2103 trend not acted on.
            consequence: >-
              Rollover: the layers mix suddenly and release BOG at many times the normal rate,
              beyond the BOG compressors and PV-1110; the tank pressure reaches PSV-2131A/B, which
              vent cold methane-rich vapour to atmosphere; if relief is insufficient, damage to the
              tank roof or inner tank.
            refs: [T-2101, AI-1102, LTD-2103, XV-1106, XV-1107, PSV-2131A, PSV-2131B]
            safeguards: [SG9, SG10, SG11, SG12, SG13]
            actions: [A6, A7]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "4", likelihood: B, status: proposed, by: agent, basis: "Large venting of cold flammable vapour from the tank top; matrix 4 = permanent injury or fatality. B: rollover could happen once in the plant life without management.", band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: c7123d4b67bd5af0, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '4', likelihood: B}}}
                - {category: environment, severity: "3", likelihood: B, status: proposed, by: agent, basis: "Methane release to atmosphere; matrix 3 = reportable release.", band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: 92790e212f41fb89, inputs: {matrix: b6caa11838fe6bc7, category: environment, severity: '3', likelihood: B}}}
                - {category: asset, severity: "4", likelihood: B, status: proposed, by: agent, basis: "Tank roof or inner tank damage; matrix 4 = loss of the unit.", band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: f33c22768a8b83e6, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '4', likelihood: B}}}
            notes: >-
              PSV-2131A/B/C list rollover as a check case only (special items); the rollover
              relieving rate is not in the files. Since 589c9ca7 I-203 opens the SIS vent XV-1115
              instead of PV-1110, and a third relief valve PSV-2131C (PSV-3131C) is drawn (N+1);
              no residual rating is proposed because neither the vent nor the relief capacity is
              confirmed against the rollover rate (relief sizing not done at basic, D-025; A7).
