  - {id: SG3, title: PSV-1121 thermal relief of the rundown header to the BOG header, kind: relief, refs: [PSV-1121], status: proposed, by: agent, notes: "Since f5d925f6 its relief case says it is not a surge relief device: the surge of a rundown closure is limited by the closure order and the closure of at least 30 s (D-023 (3), D-028; S22). Since 79d5c7ad its entry also carries 'blocked outlet against the trains' rundown pumps' as an open relief case of the rundown header, not of this PSV, the header design pressure to be confirmed with the trains' shut-off head (hold H-05, D-030 item 5)."}
  - {id: SG4, title: TI-1103 rundown temperature indication, kind: other, refs: [TI-1103], status: proposed, by: agent}
