              A single switch fault still trips the plant. Codes kept.
          - id: S20
            cause: >-
              Spurious I-102 on PZT-1105 (added in fac0bbb5): the single transmitter on LNG-1001
              reads high-high (transmitter or impulse line fault, a frozen tapping, a calibration
