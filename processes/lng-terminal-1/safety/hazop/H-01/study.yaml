actions:
  - {id: A1, status: proposed, by: agent, text: "C&E change: extend I-101 so that the battery-limit valves XV-1111..XV-1114 close (and the trains are told to turn down) whenever no fill path is open - XV-1102 and XV-1103 both closed by any cause (I-201, I-203, I-301, I-303, operator) - using valve position feedback, not only on both LAHH."}
  - {id: A2, status: proposed, by: agent, text: "Surge analysis of the rundown header LNG-1001 for the closure of XV-1102, XV-1103 and XV-1111..XV-1114 at the full rundown rate; set the closure times in the C&E. DESIGN.md section 4 lists only the loading lines."}
  - {id: A3, status: proposed, by: agent, text: "P&ID P-01 change: thermal relief valves on LNG-1002/LNG-1004 between XV-1102 and XV-1106/XV-1107 and on LNG-1001/LNG-1003 between XV-1103 and XV-1108/XV-1109 (to the BOG header as PSV-1121), or an interlock that keeps one fill selection valve open while the ESD valve is closed; add the devices to piping/special-items.yaml."}
  - {id: A4, status: proposed, by: agent, text: "Consider a high temperature alarm on TI-1103 (rundown subcooling lost) with the response agreed with the trains."}
  - {id: A5, status: proposed, by: agent, text: "Confirm a high level alarm on LT-2101 / LT-3101 separate from the LZT-2102 / LZT-3102 trip point with time for the operator to switch the fill; determine the required integrity of I-201 / I-301 (SIL is null in the C&E)."}
  - {id: A6, status: proposed, by: agent, text: "Write a rollover management procedure: density difference limits between rundown (AI-1102) and the layers (LTD-2103 / LTD-3103), the fill-level rule, alarms on the LTD density difference and BOG rate, and the mixing measures available on the plant as drawn (tank-to-tank transfer by P-2102 / P-3102)."}
  - {id: A7, status: proposed, by: agent, text: "Relief study: confirm that PSV-2131A/B and PSV-3131A/B with PV-1110 cover the rollover boil-off rate, or show the rollover case as excluded by the management in A6."}
  - {id: A8, status: proposed, by: agent, text: "P&ID P-02 / P-03 change: draw the tank bottom heating system with its control from TI-2105 / TI-3105 and a low temperature alarm."}
  - {id: A9, status: proposed, by: agent, text: "C&E / P&ID P-01 change: give I-203 / I-303 a final element independent of PV-1110 (a second flare valve or an ESD vent valve to FL-8001), or show why the shared PV-1110 is acceptable; review the fail position of PV-1110 (fails closed in control/loops.yaml) against the loss-of-air case."}
  - {id: A10, status: proposed, by: agent, text: "C&E change: on PZT-2112 / PZT-3112 PAHH during loading also reduce or stop the loading (berth ESD-1 or a rate reduction), since the carrier's return is the largest BOG contributor (D-009)."}
  - {id: A11, status: proposed, by: agent, text: "Show the fire protection of the tank roof (roof and PSV area water spray or deluge, fire and gas detection) and its actuation; D-021 leaves fire and gas off the basic-stage P&IDs."}
  - {id: A12, status: proposed, by: agent, text: "Confirm that the make-up through PV-1111 is available after I-204 / I-304 has stopped the BOG compressors (make-up source BOG-7002 then depends on the trains' system); otherwise provide a make-up source independent of the compressors (see H-04)."}
  - {id: A13, status: proposed, by: agent, text: "Relief study: confirm the vacuum relief capacity of PSV-2133A/B and PSV-3133A/B for maximum withdrawal plus compressor draw plus barometric rise, and the procedure for inerting after air has been admitted."}
  - {id: A14, status: proposed, by: agent, text: "Consider adding a switch from top to bottom fill (or a fill-rate reduction) to the PIC-1111 low pressure response or to I-204 / I-304, since the subcooled top fill is itself a vacuum cause."}
  - {id: A15, status: proposed, by: agent, text: "Relief study: confirm the set pressure of PSV-1121 (15.5 barg, ASSUMED) against the design pressure of LNG-1001 (Class 150 at the design temperature) and that its liquid discharge into the BOG header (BOG-1004 to BOG-1001) is acceptable for D-7101 (H-04)."}
