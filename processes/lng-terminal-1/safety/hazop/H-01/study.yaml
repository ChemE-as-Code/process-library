            refs: [ZSC-1102, ZSC-1103, XV-1111, XV-1112, XV-1113, XV-1114, LNG-1001]
            modes: [holding, loading, startup]
            safeguards: [SG2, SG3]
            actions: [A2, A16]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "3", likelihood: B, status: proposed, by: agent, basis: "Flange leak from the closure surge in the tank area; matrix 3 = lost-time injury. B: needs a position switch fault, more likely while one tank is isolated; could happen once in the plant life.", evidence: [control/cause-effect.yaml], band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: aa86891dd127d418, inputs: {matrix: b6caa11838fe6bc7, category: people, severity: '3', likelihood: B}}}
                - {category: asset, severity: "2", likelihood: C, status: proposed, by: agent, basis: "All four trains tripped and restarted; matrix 2 = plant down for days. C: spurious trips of a single-switch function are possible several times in the plant life.", evidence: [control/cause-effect.yaml], band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: b67377b30017f4a1, inputs: {matrix: b6caa11838fe6bc7, category: asset, severity: '2', likelihood: C}}}
            notes: >-
              New scenario for 589c9ca7 (D-025 item 1). The trains' response to the BL trip
              (turn-down before the valves close) is outside the battery limit; the team to say
              what it is. Since 886b0ad5 the switch sensors are tied to XV-1102 / XV-1103 in the
