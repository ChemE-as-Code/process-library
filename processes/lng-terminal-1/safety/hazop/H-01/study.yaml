  - {id: SG27, title: "Permissive I-103: the close command of the last open fill selection valve of the only lined-up tank (HS-1106..HS-1109) is blocked; XV-1106..XV-1109 close in at least 30 s (speed controller)", kind: interlock, interlock: I-103, refs: [HS-1106, HS-1107, HS-1108, HS-1109, XV-1106, XV-1107, XV-1108, XV-1109, ZSC-1102, ZSC-1103], status: proposed, by: agent, notes: "Added in 79d5c7ad (D-030 item 6, D-023 (3), D-026.4); never moves a valve; 'open' is the open command held for the stroke time (about 35 s), the selection valves have no position switch at basic (S24); latching false, reset automatic, SIL null; position switches left to the SIL screening (hold H-06)."}
  - {id: SG28, title: "Interlocks I-205 (I-305): I-201 (I-301) tripped and ZSC-2123 (ZSC-3123) not proving XV-2123 (XV-3123) closed after 15 s stop P-2102 and P-3102 (until aedd8dbd also P-5101 and P-6101)", kind: interlock, interlock: I-205, refs: [ZSC-2123, ZSC-3123, XV-2123, XV-3123, P-2102, P-3102], status: proposed, by: agent, notes: "Added in 79d5c7ad (D-030 item 1; P-02 / P-03, instrument list); the switch is on the valve itself; latching, manual reset, SIL null; delay 15 s ASSUMED (stroke time plus margin); a switch failing to 'not closed' stops the pumps (H-02 S24), one failing to 'closed' is part of the cause of S25. Since 709fcf20 (D-032 item 7, #3) the delay sits on 'I-201 / I-301 tripped', and a command discrepancy alarm finds a switch reading closed while its valve is commanded open. Since c257902c (D-036 item 5 (a)) the jetty drain pumps are no longer effects: they return into the berth headers downstream of XV-5101 / XV-6101, not into the return."}
  - {id: SG29, title: "SEQ-LINE-EMPTY permissive and abort: at least 1,100 m3 below the high-high level of the receiving tank (LZT-2102 / LZT-3102) before the displacement; abort on I-201 (I-301) tripped or a high receiving-tank pressure (PIC-1110 output saturated)", kind: procedural, refs: [LZT-2102, LZT-3102, XV-2123, XV-3123, PIC-1110], status: proposed, by: agent, notes: "Added in c257902c (D-036 item 5 (b), control/sequences.yaml SEQ-LINE-EMPTY); an operator's check of the level against the ~1,030 m3 line, no interlock; the rundown into the same tank during the ~2.3 h displacement is not stated in the sequence (S26). Since ae718797 (D-039 item 3, D-039.9 (d), (j)) the abort closes the crossover and the return, holds the leaking line isolated under N2 and is followed by a restart from S1 into the other tank (XV-3123, LZT-3102 permissive); the no-N2 abort on the return flow is H-02's (S35)."}
  - {id: SG7, title: "Interlock I-101: both tanks LAHH trip the trains through XS-1100 and close the battery-limit valves XV-1111..XV-1114", kind: interlock, interlock: I-101, refs: [LZT-2102, LZT-3102, LZT-2106, LZT-3106, XV-1111, XV-1112, XV-1113, XV-1114, XS-1100], status: proposed, by: agent, notes: "XS-1100 effect since f5d925f6 (D-028 item 2)."}
