            refs: [PZT-1105, PI-1104, XV-1111, XV-1112, XV-1113, XV-1114, LNG-1001]
            modes: [holding, loading, startup]
            safeguards: [SG2, SG3]
            actions: [A2, A16, A18]
            status: proposed
            by: agent
