  - {id: SG21, title: "Vacuum relief valves PSV-2133A/B/C and PSV-3133A/B/C (-0.3 kPa(g), N+1)", kind: relief, refs: [PSV-2133A, PSV-2133B, PSV-2133C, PSV-3133A, PSV-3133B, PSV-3133C], status: proposed, by: agent, notes: "Admits air: protects the tank structure, creates the O2 ingress consequence. Third valve and the -0.3 kPa(g) set point since 589c9ca7; locked-open inlet isolations HV-2135A/B/C (HV-3135A/B/C) drawn since fac0bbb5 (S19)."}
  - {id: SG22, title: "Interlock I-102: ZSC-1102 and ZSC-1103 both closed, PZT-1105 PAHH on LNG-1001, a tank trip with the other fill valve closed, or the air-header trip I-804, trip the trains through XS-1100 and close XV-1111..XV-1114", kind: interlock, interlock: I-102, refs: [ZSC-1102, ZSC-1103, PZT-1105, XV-1111, XV-1112, XV-1113, XV-1114, XS-1100], status: proposed, by: agent, notes: "Added in 589c9ca7 (D-025 item 1); PZT-1105 added and ZSC-1102 / ZSC-1103 tied to their valves in fac0bbb5 (D-026 items 4, 11), their sensors sensing XV-1102 / XV-1103 themselves since 886b0ad5 (D-026 item 14); since f5d925f6 (D-028 items 1, 2) also on I-201 / I-203 with ZSC-1103 closed, I-301 / I-303 with ZSC-1102 closed and I-804, the trains tripped through XS-1100 as the closure starts; SIL null."}
  - {id: SG23, title: "Thermal relief PSV-1122 / PSV-1123 of the fill branches to the tank vapour header (15.0 barg)", kind: relief, refs: [PSV-1122, PSV-1123, BOG-1010, BOG-1011], status: proposed, by: agent, notes: "Added in 589c9ca7 (D-025 item 1). Thermal relief only; since f5d925f6 the relief case says a rundown closure is not one of its cases (D-028)."}
  - {id: SG25, title: "Interlock I-804: instrument-air header low-low PZT-8123A/B/C (2oo3, 4.5 barg ASSUMED) initiates the rundown trip I-102 (trains tripped through XS-1100, XV-1111..XV-1114 closed) and ESD-1 of both berths before the fail-closed actuators stroke (~3.5 barg ASSUMED)", kind: interlock, interlock: I-804, refs: [PZT-8123A, PZT-8123B, PZT-8123C, XS-1100], status: proposed, by: agent, notes: "Added in f5d925f6 (D-028 item 1; P-08); latching, manual reset, SIL null. Acts before a valve moves only while the header falls slower than the margin between the trip point and the stroke pressure allows; its spurious action is S21."}
  - {id: SG26, title: "Rundown valves XV-1102, XV-1103, XV-1111..XV-1114: closure in at least 30 s by a speed controller on the actuator exhaust, with a non-return valve and a local air accumulator on the actuator supply", kind: mechanical, refs: [XV-1102, XV-1103, XV-1111, XV-1112, XV-1113, XV-1114, UZ-1102, UZ-1103, UZ-1111, UZ-1112, UZ-1113, UZ-1114], status: proposed, by: agent, notes: "Added in f5d925f6 (D-023 (3), D-028 item 2; P-01 note, instrument list); closure and hold times ASSUMED; no proof test in the files; its failure on an air loss is S22."}
  - {id: SG24, title: "Locked-open inlet isolations HV-2134A/B/C, HV-2135A/B/C (HV-3134A/B/C, HV-3135A/B/C) with the mechanical interlock that keeps two of three relief or vacuum valves of each set in service", kind: mechanical, refs: [HV-2134A, HV-2134B, HV-2134C, HV-2135A, HV-2135B, HV-2135C, HV-3134A, HV-3134B, HV-3134C, HV-3135A, HV-3135B, HV-3135C], status: proposed, by: agent, notes: "Drawn in fac0bbb5 (D-026 item 11, special items); a mechanical device, no position indication drawn."}
actions:
  - {id: A1, status: proposed, by: agent, text: "C&E change: extend I-101 so that the battery-limit valves XV-1111..XV-1114 close (and the trains are told to turn down) whenever no fill path is open - XV-1102 and XV-1103 both closed by any cause (I-201, I-203, I-301, I-303, operator) - using valve position feedback, not only on both LAHH.", response: "Answered in the design by commit 589c9ca7 (DESIGN.md D-025 item 1): interlock I-102 on the closed-position switches ZSC-1102 / ZSC-1103 closes XV-1111..XV-1114 and trips the trains through the BL interface whenever XV-1102 and XV-1103 are both closed, by any cause. For the team to verify on P-01 and in the C&E and to close; S1 re-rated, the spurious trip is S18. Commit fac0bbb5 (D-026 items 4, 11) ties ZSC-1102 / ZSC-1103 to their valves on P-01 and adds PZT-1105 to I-102, which also covers a branch closed by its selection valves XV-1106..XV-1109 (S1); its spurious trip is S20. Commit f5d925f6 (D-028 item 2) makes I-102 also act on a tank trip with the other fill valve closed (I-201 / I-203 with ZSC-1103 closed, I-301 / I-303 with ZSC-1102 closed), so the trains are tripped through XS-1100 as the only open fill valve starts to close, and on the air-header trip I-804 (S21). Still proposed."}
  - {id: A2, status: proposed, by: agent, text: "Surge analysis of the rundown header LNG-1001 for the closure of XV-1102, XV-1103 and XV-1111..XV-1114 at the full rundown rate; set the closure times in the C&E. DESIGN.md section 4 lists only the loading lines.", response: "Partly answered by commit f5d925f6 (DESIGN.md D-023 (3), D-028 item 2): the terminal section is ~1,164 m (2L/a ~2 s); XV-1102, XV-1103 and XV-1111..1114 close in at least 30 s (ASSUMED, about 15 times 2L/a) set by a speed controller on each actuator exhaust (instrument list UZ-1102 / UZ-1103 / UZ-1111..1114, P-01 note), slow-closure estimate about +120 kPa over the operating header pressure; every closure that stops the whole rundown trips the trains through XS-1100 as it starts (I-101, I-102). Still open: the transient analysis with the real closure times and the trains' rundown lines upstream of the battery limit (detail engineering, D-028), the shut-off head of the trains' rundown pumps against the 15 barg design (battery-limit interface, ASSUMED), the closure time as a C&E effect parameter (it is in the notes and the instrument list), and the fast closure on an air failure with a failed non-return valve or accumulator, which has no surge relief on the rundown (S22, A19). Still proposed."}
  - {id: A3, status: proposed, by: agent, text: "P&ID P-01 change: thermal relief valves on LNG-1002/LNG-1004 between XV-1102 and XV-1106/XV-1107 and on LNG-1001/LNG-1003 between XV-1103 and XV-1108/XV-1109 (to the BOG header as PSV-1121), or an interlock that keeps one fill selection valve open while the ESD valve is closed; add the devices to piping/special-items.yaml.", response: "Answered in the design by commit 589c9ca7 (D-025 item 1): thermal relief valves PSV-1122 on the T-2101 fill branch LNG-1002 / LNG-1004 (outlet BOG-1010) and PSV-1123 on the T-3101 fill branch LNG-1001 / LNG-1003 (outlet BOG-1011), 15.0 barg, to the tank vapour header, listed in piping/special-items.yaml. For the team to verify and close; S3 re-rated."}
  - {id: A4, status: proposed, by: agent, text: "Consider a high temperature alarm on TI-1103 (rundown subcooling lost) with the response agreed with the trains."}
  - {id: A5, status: proposed, by: agent, text: "Confirm a high level alarm on LT-2101 / LT-3101 separate from the LZT-2102 / LZT-3102 trip point with time for the operator to switch the fill; determine the required integrity of I-201 / I-301 (SIL is null in the C&E).", response: "Partly answered by commit 589c9ca7 (D-025 item 2): a second independent high-high gauge LZT-2106 / LZT-3106 on its own nozzle, I-201 / I-301 now 1oo2. Still open: the LT-2101 / LT-3101 high alarm with the operator's time to act, and the required integrity of I-201 / I-301 (SIL still null)."}
  - {id: A6, status: proposed, by: agent, text: "Write a rollover management procedure: density difference limits between rundown (AI-1102) and the layers (LTD-2103 / LTD-3103), the fill-level rule, alarms on the LTD density difference and BOG rate, and the mixing measures available on the plant as drawn (tank-to-tank transfer by P-2102 / P-3102)."}
  - {id: A7, status: proposed, by: agent, text: "Relief study: confirm that PSV-2131A/B and PSV-3131A/B with PV-1110 cover the rollover boil-off rate, or show the rollover case as excluded by the management in A6.", response: "Not answered at 54648679: the relief cases of PSV-2131A/B/C / PSV-3131A/B/C now list the compressor loss at loading, fire, rollover as a check case, the FO-1117 blow-by (D-026 item 8) and fire on D-7101 and the BOG suction header (D-026 item 12), but no device is sized against them (D-025: relief sizing not done at basic). Still open."}
  - {id: A8, status: proposed, by: agent, text: "P&ID P-02 / P-03 change: draw the tank bottom heating system with its control from TI-2105 / TI-3105 and a low temperature alarm."}
  - {id: A9, status: proposed, by: agent, text: "C&E / P&ID P-01 change: give I-203 / I-303 a final element independent of PV-1110 (a second flare valve or an ESD vent valve to FL-8001), or show why the shared PV-1110 is acceptable; review the fail position of PV-1110 (fails closed in control/loops.yaml) against the loss-of-air case.", response: "Answered in the design by commit 589c9ca7 (D-025 item 1): I-203 / I-303 open the SIS vent XV-1115 in a bypass of PV-1110 (FL-1001) to the storage and loading flare, independent of PIC-1110 / PV-1110; XV-1115 fails closed and opens energise-to-trip from its own air accumulator; the loss-of-air response is restated in control/philosophy.md F-AIR (no vent opens on the failure, the PSVs remain the last protection). For the team to verify and close; S11, S12 re-rated; the spurious opening of XV-1115 is H-04 S20."}
  - {id: A10, status: proposed, by: agent, text: "C&E change: on PZT-2112 / PZT-3112 PAHH during loading also reduce or stop the loading (berth ESD-1 or a rate reduction), since the carrier's return is the largest BOG contributor (D-009)."}
  - {id: A11, status: proposed, by: agent, text: "Show the fire protection of the tank roof (roof and PSV area water spray or deluge, fire and gas detection) and its actuation; D-021 leaves fire and gas off the basic-stage P&IDs."}
  - {id: A12, status: proposed, by: agent, text: "Confirm that the make-up through PV-1111 is available after I-204 / I-304 has stopped the BOG compressors (make-up source BOG-7002 then depends on the trains' system); otherwise provide a make-up source independent of the compressors (see H-04).", response: "Answered in the design by commit 589c9ca7 (D-025 item 1): the make-up comes from the trains' fuel gas FG-1001 through the restriction orifice FO-1117 and PV-1111 (PIC-1111), independent of the BOG compressors; BOG-1009 is removed. The trains' fuel-gas capacity for the make-up is recorded as not done at basic (D-025) and is followed in H-04 A17. For the team to verify and close."}
  - {id: A13, status: proposed, by: agent, text: "Relief study: confirm the vacuum relief capacity of PSV-2133A/B and PSV-3133A/B for maximum withdrawal plus compressor draw plus barometric rise, and the procedure for inerting after air has been admitted.", response: "Partly answered by commit 589c9ca7 (D-025 item 2): a third vacuum valve per tank (PSV-2133C / PSV-3133C, N+1) and the set point -0.3 kPa(g) against the -0.5 kPa(g) design. Still open: the relief capacity (sizing not done at basic, D-025), now including the spurious opening of XV-1115 (H-04 S20), and the inerting procedure."}
  - {id: A14, status: proposed, by: agent, text: "Consider adding a switch from top to bottom fill (or a fill-rate reduction) to the PIC-1111 low pressure response or to I-204 / I-304, since the subcooled top fill is itself a vacuum cause."}
  - {id: A15, status: proposed, by: agent, text: "Relief study: confirm the set pressure of PSV-1121 (15.5 barg, ASSUMED) against the design pressure of LNG-1001 (Class 150 at the design temperature) and that its liquid discharge into the BOG header (BOG-1004 to BOG-1001) is acceptable for D-7101 (H-04).", response: "Partly answered by commit 589c9ca7: PSV-1121 is now set at 15.0 barg, the 15 barg design of the LNG lines (piping/special-items.yaml). Still open: the liquid discharge of PSV-1121, PSV-1122 and PSV-1123 into BOG-1001 and D-7101 (H-04 A15)."}
  - {id: A16, status: proposed, by: agent, text: "Agree with the trains the BL interface response to I-102 / I-101 (turn-down or recycle before XV-1111..XV-1114 close) and include the I-102 closure in the rundown surge analysis (A2); consider a confirmation of the closed position by a second signal (closed limit and the trip command of the valve) so that a single ZSC fault does not trip the four trains while one tank is isolated.", response: "Partly answered by commit fac0bbb5 (DESIGN.md D-026 items 4, 11): ZSC-1102 / ZSC-1103 are now tied to XV-1102 / XV-1103 on P-01, and I-102 also trips on PZT-1105 PAHH on LNG-1001 (own tapping, independent of PI-1104), a second, process signal that sees a dead-headed header whatever valve closed it. It is an additional trip path (logic any), not a confirmation of the ZSC signal: a single ZSC-1102 fault with XV-1103 closed still trips the four trains (S18), and PZT-1105 adds its own spurious trip (S20, A18). Still open: the BL interface response of the trains, the I-102 closure in the surge analysis (A2) and the second-signal confirmation of the ZSC path. Commit 886b0ad5 ties the ZSC-1102 / ZSC-1103 sensors to the valves themselves (D-026 item 14) and writes the fill-change rule into D-026 item 4; the open items are unchanged. Commit f5d925f6 (D-028 item 2) answers the terminal side of the BL interface: the hard-wired link XS-1100 trips the trains' rundown (pumps stopped or recycled inside the trains) at the instant XV-1111..1114 start to close, and the closure takes at least 30 s, so the trains are stopping before the valves throttle; the I-102 closure is part of the D-023 (3) estimate. Still open: the trains' confirmation of their response within the closure time (trains' scope), the transient analysis (A2) and the second-signal confirmation of the ZSC path, which now also feeds the tank-trip paths of I-102 (S18). Still proposed."}
  - {id: A17, status: proposed, by: agent, text: "Put the inlet isolations HV-2134A/B/C, HV-2135A/B/C, HV-3134A/B/C, HV-3135A/B/C on the locked-valve register with a position check after every relief or vacuum valve change; confirm with the tank contractor that the mechanical interlock cannot leave fewer than two devices of a set in service and that two (N) cover the governing relief and vacuum cases (relief sizing, D-025); consider position indication of the isolations in the DCS (S19)."}
  - {id: A18, status: proposed, by: agent, text: "C&E / instrument list: state the PZT-1105 trip point against the normal rundown pressure, the fill-change transient and the PSV-1121 set pressure, and consider a second header pressure transmitter voted 2oo2 or 1oo2 with discrepancy alarm (or PI-1104 as confirmation) so that one transmitter fault does not trip the four trains (S20); state the response time the dead-head case needs."}
  - {id: A19, status: proposed, by: agent, text: "Include the closure of a rundown valve (XV-1102, XV-1103, XV-1111..XV-1114) on an instrument-air failure with a failed non-return valve or accumulator, and a header lost faster than I-804 can act, in the D-023 transient analysis (case (4) names only the berths); if the surge exceeds the 15 barg design, provide a surge relief or another layer on the rundown; put the non-return valves, accumulators and speed controllers of these valves in the proof test (hold time of at least 5 min and closure time, both ASSUMED) and on the maintenance setting list (S22)."}
  - {id: A20, status: proposed, by: agent, text: "Tank contractor and C&E: state the volume between the LAHH trip points of LZT-2102 / LZT-2106 (LZT-3102 / LZT-3106) and the overfill point and check it against the rundown received while XV-1102 / XV-1103 close in at least 30 s with the trains running down (up to about 63 m3), and the displaced vapour on an I-203 / I-303 closure against the PSV-2131 / PSV-3131 relief cases; move the trip points if the margin is short (S23)."}
  - {id: A21, status: proposed, by: agent, text: "Agree with the trains and the site air system the trip point of I-804 (4.5 barg, ASSUMED) against the normal transients of the air header (compressor and dryer change-over), whether a short confirmation delay is acceptable within the margin to the ~3.5 barg stroke pressure, and the restart route of the trains after an I-804 rundown trip (reset of I-804 and I-102, rundown restart through XS-1100) (S21)."}
