                - {category: environment, severity: "3", likelihood: B, status: proposed, by: agent, basis: "As the people residual: XV-1115 credited as one layer; the vent goes to the flare instead of the atmosphere.", evidence: [control/cause-effect.yaml], band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: example-4x4 (safety/risk-matrix.yaml)', fingerprint: 92790e212f41fb89, inputs: {matrix: b6caa11838fe6bc7, category: environment, severity: '3', likelihood: B}}}
            notes: >-
