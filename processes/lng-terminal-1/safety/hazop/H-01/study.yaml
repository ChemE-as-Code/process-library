  - {path: pid/P-02.xml, revision: 'sha256:6e4eb2b55e5c59c38df8edaa6d0ab4afed1db41fdf72164f4f2a19fdec468598', relation: analyses}
  - {path: pid/P-03.xml, revision: 'sha256:c55c20d2d2ad228ecae950e3d2c93089b32eb7ed62cb072492539b2eb878b604', relation: analyses}
