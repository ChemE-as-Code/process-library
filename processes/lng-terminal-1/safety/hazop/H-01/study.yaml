# HAZOP study H-01: a DRAFT until the team has accepted every entry and a
# human review record covers it (cheme safety hazop check). Schema: cheme schema
# hazop-study; workflow: safety/README.md and the skill hazop-study.
# Drafted by an agent from the plant as drawn (P-01, P-02, P-03 rev A, C&E, loops,
# sequences, special items) and revised by an agent to the P&IDs, C&E and sequences of
# commit 589c9ca7 (DESIGN.md D-025), then to those of commit fac0bbb5 (DESIGN.md D-026: PZT-1105
# in I-102, ZSC-1102/1103 tied to their valves, tank relief inlet isolations HV-n134/n135), then
# to those of commit 54648679 (the response to review 2026-11-05-basic-design-3 in commit
# 886b0ad5: ZSC-1102/1103 sense their valves, fire on D-7101 and the BOG suction header in the
# PSV-2131/3131 relief cases, the fill-change rule of D-026 item 4, XV-4131/4132 fail closed;
# the core 1.7.0 regeneration in 54648679 changed the drawing only), then to those of commit
# f5d925f6 (DESIGN.md D-028, D-023 (3), (4): the rundown link XS-1100 tripping the trains as a
# closure starts, I-102 also on a tank trip with the other fill valve closed and on the
# instrument-air trip I-804, the rundown valves closing in at least 30 s with a non-return valve,
# an accumulator and a speed controller, XV-2123 / XV-3123 fail closed and I-201 / I-301 stopping
# the return sources, SEQ-FILL-CHANGE, PSV-1121..1123 restated as thermal relief only).
# Every entry is a proposal for the team: status proposed.
schema: cheme/hazop-study/v1
kind: hazop-study
id: H-01
title: Rundown and LNG storage tanks
scope: >-
  Detail-stage HAZOP of the LNG rundown header from the four trains' battery-limit ESD valves
  XV-1111..XV-1114 to the tank fill valves (P-01), and the two full-containment tanks T-2101
  (P-02) and T-3101 (P-03) with their level, pressure, relief and vacuum devices. The in-tank
  pumps and their headers are in H-02; the tank vapour header, PIC-1110/PIC-1111, the SIS vent
  XV-1115, the make-up from the trains' fuel gas FG-1001 and the BOG compressors in H-04 (the
  tank pressure deviations are analysed here, the control and compressor causes there); the
  flare in H-05. Not covered: the liquefaction trains and their
  end-flash system (outside the battery limit, D-001), fire and gas detection and the tank
  bottom heating system (not drawn at this revision, D-021).
modes:
  - {id: holding, title: Holding, description: "No carrier alongside: the rundown fills the tanks, one BOG compressor runs, one circulation pump keeps the trestle lines cold (flowsheet case holding, SEQ-HOLD)."}
  - {id: loading, title: Loading, description: "One carrier loaded at 12,000 m3/h from either tank while the rundown continues; two BOG compressors take tank BOG and the carrier's return (case loading, SEQ-LOAD)."}
  - {id: cooldown, title: Cooldown, description: "Cooldown of a warm tank, of the fill lines or of the transfer lines; first cooldown at commissioning and after maintenance."}
  - {id: startup, title: Start-up and shutdown, description: "Start and stop of the rundown, fill switching between tanks and between top and bottom fill, ESD and restart."}
analysed:
