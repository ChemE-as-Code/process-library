risk_matrix: safety/risk-matrix.yaml
assessment_basis: >-
  Each scenario is rated per category before its safeguards (initial): severity is the credible
  worst outcome if every safeguard fails, likelihood that of the cause. The codes written here
  are agent proposals with their basis, for the team to accept or change. Residual ratings are
  proposed (by the agent, status proposed) only for the scenarios whose safeguards changed in
  commit 589c9ca7 and where a new layer independent of the cause now exists as drawn: the
  severity is kept, the likelihood is lowered by one code per independent layer named in the
  basis, and nothing is credited whose capacity or integrity the files leave open (SIL null
  everywhere). Which safeguards are credited, and how far, remains the team's judgement (and a
  LOPA's where the band requires it). The matrix safety/risk-matrix.yaml is the example matrix
  written by cheme init (example: true); the bands are therefore illustrative until the
  company's matrix replaces it. No frequency is calculated and no safeguard is credited by a tool.
  The revision for commit fac0bbb5 (D-026) follows the same rule: the new scenarios S19 and S20
  are rated before safeguards only, and existing ratings keep their codes unless the cause they
  rest on changed. The revision for commit 54648679 (886b0ad5) adds no scenario and changes no
  code: it corrects the texts the changed position-switch sensing, relief cases and fill-change
  rule touch. The revision for commit f5d925f6 (D-028) rates the new scenarios S21 and S22
  before safeguards only and leaves S23 unrated (its basis is not in the files); the existing
  ratings keep their codes, since the changes add or describe safeguards and closure order
  rather than change a cause, and the texts and residual bases they touch are corrected in place.
  The revision for commit 79d5c7ad (D-030) rates the new scenarios S24 (the I-103 permissive
  resting on open commands) and S25 (the return into a tripped tank when XV-2123 / XV-3123 fails
  to close) before safeguards, and proposes a residual for S25 only, where I-205 / I-305 on the
  valve's own closed-position switch is a layer independent of the cause; existing codes are kept
  (I-103 and the slower selection valves act on causes the codes already rest on), and the texts
  that no longer match (the pump stops of I-201 / I-301, the selection valve closure) are corrected
  in place. The revision for commit 709fcf20 (D-032, D-033) adds no scenario and changes no code:
  the I-205 / I-305 timer and the ZSC-2123 / ZSC-3123 discrepancy alarm (S6, S25, SG28, A23) and the
  tank-area spill collection and its radiation screening (S13) are re-described in place; the
  spurious pump stop is H-02 S24. The revision for commit aedd8dbd (D-034, D-035) adds no scenario
  and changes no code: the loading BOG envelope (S11) and the tank-area spill basis, basin and
  muster point (S13) are re-described in place, and A18 records the PZT-1105 bad-signal question of
  D-035.5; the re-rated loading pumps against the circulation pumps are H-02 S27. The revision for
  commit c257902c (D-036, D-037) rates the new scenario S26 (the return of a leaking trestle line
  by SEQ-LINE-EMPTY into a receiving tank without the ullage its permissive asks for) before
  safeguards only; S25 and SG28 are corrected for the jetty drain pumps, which I-205 / I-305 no
  longer stop and which no longer feed the return, and S11 for the N2 that SEQ-LINE-EMPTY sends
  to a tank; codes kept. The N2 displacement itself is H-02 S31 to S33, its N2 in the BOG H-04
  S26, the XV-3123 tray detector TSL-3124 H-05 S29; the P-01 change (FO-1117 drawn as a restriction
  orifice) touches no scenario of this study. The revision for commit ae718797 (D-038, D-039) adds
  no scenario and changes no code: S26 and SG29 are re-described for the SEQ-LINE-EMPTY abort, which
  now closes the crossover and the return and holds the leaking line isolated under N2, and the
  restart from S1 into the other tank (A24 partly answered); the D-038 changes of P-01, P-02 and
  P-03 are drawing only (`cheme diff`: connector and label positions, the same items, lines and
  connections) and touch no scenario; the new loops (LIC-5111 / LIC-6111, LIC-8101, LC-8103,
  LC-8106) and the T-8101 / T-8102 / B-SUB trips are outside this study's nodes (H-03, H-05).
