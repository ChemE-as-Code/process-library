  - id: N2
    title: LNG tanks T-2101 and T-3101 - liquid inventory, level and density
    design_intent: >-
      Store up to 225,000 m3 working LNG each (D-007) at about -160 degC between the low-low and
      high-high levels of the independent servo gauges LZT-2102 / LZT-3102 (radar LT-2101 / LT-3101
      for inventory and fill control); since 589c9ca7 a second independent high-high gauge
      LZT-2106 / LZT-3106 makes I-201 / I-301 1oo2, and the trip also closes the circulation
      return XV-2123 / XV-3123 (D-025 item 2); fill top or bottom so that the density profile
      (LTD-2103 / LTD-3103) stays mixed (rollover, D-007); supply the in-tank pumps (H-02). Since
      f5d925f6 (D-028 item 3) XV-2123 / XV-3123 fail closed (were fail last) and I-201 / I-301 also
      stop the sources of the circulation return, the circulation pumps P-2102 / P-3102 and the
      jetty drain pumps P-5101 / P-6101; the fill ESD valve closes in at least 30 s (D-023 (3)),
      and with the other tank's fill valve closed I-102 trips the trains as it starts to close.
      Since 79d5c7ad (D-030 item 1; replaces the unconditional pump stops of D-028 item 3): I-201 /
      I-301 close the fill and the circulation return only; the closed-position switch ZSC-2123 /
      ZSC-3123 on XV-2123 / XV-3123 itself and the new trips I-205 / I-305 stop P-2102, P-3102,
      P-5101 and P-6101 only while I-201 / I-301 has tripped and the switch does not read closed
      15 s after the trip (ASSUMED, stroke time plus margin); in loading the returns are closed and
      proven closed in SEQ-LOAD S0, so a tank high-high level leaves the desuperheater spray and
      the drain pumps in service. Since 709fcf20 (D-032 item 7, #3): the 15 s on-delay sits on
      'I-201 / I-301 tripped', so the pumps stop once the trip has stood 15 s and the switch does
      not read closed (no longer a switch reading 'not closed' for 15 s), and ZSC-2123 / ZSC-3123
      reading closed while XV-2123 / XV-3123 is commanded open longer than its stroke time raises a
      discrepancy alarm (C&E I-205 / I-305 notes); ESD-1 does not stop the circulation pumps (D-016,
      D-032 item 6).
