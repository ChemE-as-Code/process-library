# Findings accepted for every gate and for `cheme validate`, which then reports them as info
# with the reason (an entry that names no finding is reported as cheme.accept-unused).
# Only warnings and infos can be accepted; an error stays an error (cheme.accept-error).
accept:
  - {id: "pid/P-07.xml#line-crossing:Line_BOG7001_S2_P1+Line_BOG7009_S1_P3", reason: "D-025: each machine path joins the suction and discharge headers; the K-7101B recycle must cross one header (topological minimum of two crossings on P-07)"}
  - {id: "pid/P-07.xml#line-crossing:Line_BOG7002_S5_P1+Line_FL7004_S2_P1", reason: "D-025: the K-7101B/C vent must cross the discharge header to reach the vent header (topological minimum of two crossings on P-07)"}
  - {id: "pid/P-04.xml#line-crossing:Line_BOG4011_S1_P2+Line_LNG4002_S3_P3", reason: "D-026.11: the PSV-4111 outlet BOG-4011 ties into BOG-4001 on the tank side of XV-4135; loading line B runs across the whole sheet between off-page connectors, so a relief from line A must cross it once (topological minimum)"}
  - {id: "pid/P-04.xml#line-crossing:Line_BOG4015_S1_P2+Line_LNG4002_S2_P1", reason: "D-026.11: the PSV-4113 outlet BOG-4015 from the tank-end crossover between lines A and B ties into BOG-4001 on the tank side of XV-4135 and must cross line B once (topological minimum)"}
  - {id: "pid/P-08.xml#line-crossing:Line_LNG8001_S1_P3+Inst_HS8101B_MeasuringLine", reason: "D-026.11: P-8101B lies inside the loops drum - pumps - minimum flow LNG-8005 / thermal relief LNG-8006, so the measuring line tying its motor control HS-8101B to the pump crosses the discharge header LNG-8001 once (topological minimum; LIC-8101 reaches HS-8101A and HS-8101B without a crossing)"}
  # The line number changes with the pipe size at these six sheet boundaries (D-021): the
  # off-page note names the line it continues as on the other sheet.
  - {id: "pid/P-02.xml#offpage-mismatch:Line_LNG2001_To:*", reason: "D-021: DN 450/800 pump header LNG-2001 continues as trestle line LNG-4001 (P-04)"}
  - {id: "pid/P-03.xml#offpage-mismatch:Line_LNG3001_To:*", reason: "D-021: pump header LNG-3001 continues as trestle line LNG-4002 (P-04)"}
  - {id: "pid/P-04.xml#offpage-mismatch:Line_LNG4001_*", reason: "D-021: trestle line LNG-4001 runs from header LNG-2001 (P-02) to the Berth 2 header LNG-5001 (P-05, DN 800/400)"}
  - {id: "pid/P-04.xml#offpage-mismatch:Line_LNG4002_*", reason: "D-021: trestle line LNG-4002 runs from header LNG-3001 (P-03) to the Berth 1 header LNG-6001 (P-06)"}
  - {id: "pid/P-04.xml#offpage-mismatch:Line_BOG400?_From:*", reason: "D-021: DN 400 berth vapour lines BOG-5001 / BOG-6001 continue as the DN 750 trestle vapour returns"}
  - {id: "pid/P-0[56].xml#offpage-mismatch:Line_LNG[56]001_From:*", reason: "D-021: the berth header continues the trestle loading line at a new number (DN 800/400 segments)"}
  - {id: "pid/P-0[56].xml#offpage-mismatch:Line_BOG[56]001_To:*", reason: "D-021: the DN 400 berth vapour line continues as the DN 750 trestle vapour return"}
  # ---- layout accepts after the layout reviews 2026-11-05-basic-layout (D-027) and
  # 2026-11-05-basic-layout-2 (D-029): each names its findings by id, or by a pattern limited
  # to named items, with the reason
  # ---- lifting study (cheme layout lifting)
  - {id: "layout/plant-model.yaml#layout-lifting:T-2101", reason: "Field-erected full-containment tank (D-007), never lifted as a whole. Its 12 t lift_weight is an in-tank pump lifted together with its cable reel, which the rule takes to the tank centre over the whole roof (72.6 m from the enlarged Z-PAD-T2101N, D-031); the real pump lifts are the P-2101A-D rows, from the same pad north of the tank (D-029). The erection cranes are the construction lifting plan's"}
  - {id: "layout/plant-model.yaml#layout-lifting:T-3101", reason: "As T-2101: the 12 t pump-and-reel lift is made at each column from Z-PAD-T3101N (rows P-3101A-D, D-029); the tank is field-erected"}
  - {id: "layout/plant-model.yaml#layout-laydown:laydown-T-2101", reason: "Field-erected tank, never laid down; a pulled pump and its cable reel go to the laydown Z-LAY-T2101N beside the crane pad (D-029)"}
  - {id: "layout/plant-model.yaml#layout-laydown:laydown-T-3101", reason: "As T-2101, laydown Z-LAY-T3101N (D-029)"}
  - {id: "layout/plant-model.yaml#layout-lifting:P-2101[A-D]", reason: "In-tank pump (6 t alone, 12 t with its cable reel): after its column head spool (LNG-2001 S1-S5 at the head) and column vent spool (BOG-2011..2014) are removed, the mobile crane on the enlarged Z-PAD-T2101N (61.1-74.7 m radius, 9.24 t needed for the pump; 18.5 t for pump and reel) pulls it vertically out of its column above the 60 m column-head piping and the deck handrail, then slews north to the laydown Z-LAY-T2101N. Hook ~70 m: the study's 65.8-66.5 m takes the 2 m head plate as the load, the ~6 m pump adds 4 m (D-031). The far pumps B / D are lifted over the live pump header LNG-2001 and the running pumps' column-head piping: lift path along the deck's north-south axis between the rows, no load over a running loading pump's head; the circulation pump P-2102 stands on that axis at (947, 3040), so it is stopped and its column-head isolations closed for the duration of the lift (holding circulation from P-3102, SEQ-HOLD), header kept in service under the lift permit (SIMOPS basis D-031; review 2026-11-05-basic-layout-4 #8, D-035.12). The lane rule counts every pipe above the head plate as a blocker, so the lane stays a finding (D-029, D-031, ASSUMED until the lift plan of the crane contractor and the pump vendor)"}
  - {id: "layout/plant-model.yaml#layout-lifting:P-3101[A-D]", reason: "As P-2101A-D, from Z-PAD-T3101N to Z-LAY-T3101N (D-029, ASSUMED)"}
  - {id: "layout/plant-model.yaml#layout-lifting:D-5101", reason: "Jetty drain drum (18 t) is inspected in place; a replacement lift is made after the flanged drain header spools at its inlet (DR-5001 / DR-5003) and the drain pump discharge spool (LNG-5006) in the lane are removed, from Z-PAD-A4W along the drum's west half, which keeps the lane west of the platform header rack PR9 (x 1151.35) that the model's lane box touches at its east edge, or with the crane on the south-west laydown Z-LAY-A4SW beside the drum (D-016, D-035.1, ASSUMED; the lift plan is the lifting contractor's)"}
  # ---- operability (layout-operability): valves that no floor reaches and whose declared
  # operator (piping/routing.yaml operators:) does not reach a floor within 6 m
  # actuated valves by where they are maintained (review 2026-11-05-basic-layout-2 #8)
  - {id: "layout/plant-model.yaml#layout-operability:P-01/XV110[23]", reason: "Rundown selection valves XV-1102 / XV-1103 on PR1: actuated, operated from the DCS / SIS (remote operator declared); maintained from the rack walkway or a mobile elevating work platform (D-027, ASSUMED)"}
  - {id: "layout/plant-model.yaml#layout-operability:P-01/XV111[1-5]", reason: "Rundown battery limit valves XV-1111..1114 on PR4 and the SIS vent valve XV-1115 at the PR6 / PR3 joint: actuated, operated from the DCS / SIS; maintained from the rack (D-027, ASSUMED)"}
  - {id: "layout/plant-model.yaml#layout-operability:P-04/XV41??", reason: "Loading line and vapour switch valves XV-4101..4106 on PR1 / at the platform and XV-4131..4136 on PR2: actuated ESD and switching valves, operated from the DCS / SIS; maintained from the rack (D-027, ASSUMED)"}
  - {id: "layout/plant-model.yaml#layout-operability:P-07/XV7121?", reason: "BOG compressor isolation valves XV-7121A-C: actuated, operated from the DCS / SIS; maintained from the crane pad Z-PAD-A2E with a mobile elevating work platform (ASSUMED)"}
  - {id: "layout/plant-model.yaml#layout-operability:P-0[56]/XV[56]1[34]?", reason: "Arm ERS valves XV-n13k / XV-n14k: part of the loading arm, they move with it (D-014, D-021 item 8); operated by the ERS hydraulics and maintained with the arm by the arm vendor's procedure"}
