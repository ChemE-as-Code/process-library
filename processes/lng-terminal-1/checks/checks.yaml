  - {id: "layout/plant-model.yaml#layout-lifting:D-6101", reason: "Jetty drain drum D-6101 (18 t) is inspected in place; a replacement lift is made after the flanged drain spools at its inlet (DR-6001 / DR-6003) and the drain pump discharge spool (LNG-6006) in the lane are removed, from the deck crane pad Z-PAD-A4SE south-east of the drum (since D-040): the drum is lifted at ~11 m radius over the east end of the header bay, where nothing stands above the berth headers' 5.5 m and the loading lines' 180 deg returns (x 1163.4, to 5.5 m), at a lift height of ~9 m, and set down on Z-LAY-A4SE; the model's lane box also takes in PR9 and the Berth 1 header's north leg west of the drum. Made with no transfer on either berth and the header bay lines out of service (D-016, D-035.1, D-040, ASSUMED; the lift plan is the lifting contractor's)"}
  # ---- tiers
  - {id: "layout/plant-model.yaml#layout-tier:P-0[56]/Line_DR[56]005_S1@PR9", reason: "DN 25 arm drains DR-5005 / DR-6005 along PR9 between its tiers for 7-9 m: clipped to the berth header on the 4.5 m tier (field-run small bore, D-037, ASSUMED)"}
  - {id: "layout/plant-model.yaml#layout-tier:P-01/Line_BOG1001_S[568]@PR6", reason: "Tank vapour header BOG-1001 (80 mm insulation) runs on PR6's top tier on 70 mm raised shoes (centreline 14.531 m) so the 150 mm insulated vapour returns BOG-4001 / BOG-4002 tee into it at their own resting centreline (D-012, D-027, ASSUMED)"}
  # ---- escape from the tank-top pump platforms (D-027): the ways off are the roof walkways
  # to the tank's spiral stair and to the north stair tower, which cheme-as-code cannot connect
  # to a structure level standing over a tank
  - {id: "layout/plant-model.yaml#layout-escape-ways:S-T[23]101-TOP/PP", reason: "Tank-top pump platform: its two ways down are the roof walkway south-west to the tank's spiral stair (Z-ESC-Tn-ROOF-S/-SE, overlapping the deck's south-west corner by 1 m) and the roof walkway north onto the 42.2 m landing of the stair tower S-ESC-Tn (Z-ESC-Tn-ROOF-N, overlapping the deck and the landing), on the dome (D-029); the model counts only stairs and ladders of the platform's own frame, whose corner columns are a modelling artefact, and cannot count an escape zone as a way down (D-027)"}
  - {id: "layout/plant-model.yaml#layout-escape-travel:S-T[23]101-TOP/PP", reason: "As the escape-ways finding: the platform's stairs are the tank's spiral stair and the north stair tower S-ESC-Tn, reached over the roof walkways, two ways remote from each other; the travel from the platform's far corner to either stair is longer than the 25 m structure criterion, as on any tank roof (ASSUMED acceptable for the tank roof, to be confirmed against the site standard, D-027)"}
  # ---- cable trays (gate electrical, skill electrical-cabling)
  - {id: "layout/plant-model.yaml#layout-tray-separation:PT-PR1-*+IT-PR[56]-1", reason: "At PR1's joints with the riser racks PR5 / PR6 the PR1 power trunk passes over the start of the riser rack's instrument tray on the same 17 m tray level: a steel cover plate (metal divider, EN 50174-2 practice) separates the two trays where they cross (ASSUMED); elsewhere power and instrument trays are 12 m apart"}
  - {id: "layout/plant-model.yaml#layout-tray-separation:PT-PR7-1+IT-PR3-2", reason: "At the joint of the B-SUB cable bridge PR7 with PR3 the PR7 power trunk crosses PR3's instrument tray on the same 15.5 m tray level: steel cover plate (metal divider, EN 50174-2 practice) at the crossing (ASSUMED, D-027)"}
  - {id: "layout/plant-model.yaml#layout-tray-zone:PT-M-P-[56]101+Z-HA-JETTY-DRAIN", reason: "The jetty drain pump motor stands in the zone 2 around its own seal (layout/zones.yaml Z-HA-JETTY-DRAIN): the last metres of its branch tray inside the zone carry an armoured cable with Ex-rated glands to the Ex motor terminal box (zone 2 equipment, ASSUMED; the area classification by a competent person confirms)"}
  - {id: "layout/plant-model.yaml#layout-clash-tray:PT-PR13-1+PR11/bent-1/col-0", reason: "Joint of the cable rack PR13 with PR11's south bent (D-040, review 2026-11-05-basic-layout-7 #5): the two racks' strips meet at y 856.9-857.0 so the rack network reaches A9, and PR13's power tray starts at PR11's south-east column; in reality it is carried past the column on a bracket off it (the model draws it through the column). The instrument tray is 1.0 m south of it (ASSUMED)"}
  - {id: "layout/plant-model.yaml#layout-clash-pipe-steel:P-05/Line_LNG5001_S1+PR10/bent-1/col-0", reason: "The Berth 2 header's north leg (x 1152.45) turns north at PR10's bent-1 (x 1152.45) and rests on its north stringer at the column head there (a support at the node, D-040, layout/site-plan.yaml PR10 comment): the leg's insulation bottom (4.50 m) touches the column head at the tier's top of steel, which the model reports as a clash; in reality that column head with the stringer is the leg's first support north of the turn (ASSUMED, stress and structural detail)"}
  - {id: "layout/plant-model.yaml#layout-rack-fill:PR10@1.9", reason: "PR10's 1.9 m tier carries only the two loading lines' low runs (2 x 1.21 m over insulation of its 5.0 m width, D-040); the fill counts the DN 800 and DN 250 crossovers, which hang below that tier between the lanes on the 0.61 m cradle beams and run across the frame north-south, as pipe along the crowded section. Nothing else rides on the tier (ASSUMED)"}
  - {id: "layout/plant-model.yaml#layout-tray-zone:PT-M-P-8101?+Z-HA-FLARE-KO",reason: "The flare KO drum pump motors stand in the zone 2 around their seals and the drum flanges (Z-HA-FLARE-KO): the branch tray's last metres inside the zone carry armoured cables with Ex-rated glands to the Ex motor terminal boxes (zone 2 equipment, ASSUMED)"}
  - {id: "layout/plant-model.yaml#layout-tray-zone:IT-JB-TR-N+Z-HA-PR2-VALVES", reason: "The instrument tray from PR2's tray tier down to JB-TR-N passes through the zone 2 envelope of the vapour switch valve station: armoured instrument cables with Ex glands, the junction box outside the zone and the analyser house zone (ASSUMED, D-027)"}
  - {id: "layout/plant-model.yaml#layout-tray-zone:PT-M-P-[23]10[12]*+Z-HA-T[23]101-COLHEADS", reason: "The in-tank pump cables end at the column head junction boxes inside the column-head zone 2 (Z-HA-Tn101-COLHEADS, D-029): armoured 6.6 kV / 400 V cables with Ex-rated glands and terminations at the head plate (zone 2 equipment, ASSUMED until the area classification)"}
