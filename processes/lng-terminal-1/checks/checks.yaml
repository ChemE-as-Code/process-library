    stage: basic
    kind: on-sheet
    tags: [PZT-1105, ZSC-1102, ZSC-1103, ZSO-4131, ZSO-4132, ZSO-4135, ZSO-4136,
           ZSC-5123, ZSC-5125, ZSC-6123, ZSC-6125, ZSO-7121A, ZSO-7121B, ZSO-7121C, PZT-7113,
           LZT-8105, HV-8108A, HV-8108B]
