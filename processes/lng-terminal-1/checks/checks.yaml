    stage: basic
    kind: on-sheet
    tags: [PSV-2131A, PSV-2131B, PSV-2131C, HV-2134A, HV-2134B, HV-2134C,
           PSV-2133A, PSV-2133B, PSV-2133C, HV-2135A, HV-2135B, HV-2135C,
           PSV-3131A, PSV-3131B, PSV-3131C, HV-3134A, HV-3134B, HV-3134C,
           PSV-3133A, PSV-3133B, PSV-3133C, HV-3135A, HV-3135B, HV-3135C]
