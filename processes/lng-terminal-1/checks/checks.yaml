    stage: basic
    kind: on-sheet
    tags: [LA-5101, LA-5102, LA-5103, LA-5104, XV-5101, XV-5131, XV-5141, XV-5134, XV-5144,
           LA-6101, LA-6102, LA-6103, LA-6104, XV-6101, XV-6131, XV-6141, XV-6134, XV-6144]
