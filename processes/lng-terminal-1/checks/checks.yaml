# Engineering-step gates. Schema: `cheme schema checks`. Run: `cheme check`.
schema: cheme/checks/v1
checks:
  - id: design-basis
    title: Design basis exists
    stage: concept
    kind: files
    files: [process/design-basis.yaml]
  - id: concept-lists
    title: Design decisions and the equipment, line and instrument lists exist
    stage: concept
    kind: files
    files: [DESIGN.md, equipment/equipment-list.yaml, piping/line-list.yaml, control/instrument-list.yaml]
  # Once plant.yaml declares the BFD ({id: BFD, kind: bfd}), add process/BFD.xml to files.
  - id: process-concept
    title: Materials and flowsheet exist (the BFD is generated by cheme process build)
    stage: concept
    kind: files
    files: [process/materials.yaml, process/flowsheet.yaml]
  - id: process-balances
    title: Every block balance is evaluable and clean, the BFD current
    stage: concept
    kind: validate
    fail_on: info
    rules: [cheme.process-balance*, cheme.process-schema, cheme.generated-*]
  # Links from blocks, steps and streams to equipment, lines, instruments and sheets: reported
  # at concept, required at basic.
  - id: process-links-concept
    title: Process links resolve (reported only)
    stage: concept
    kind: process-links
    level: warning
  # The concept gate accepts cheme.process-component-balance-not-evaluable (a component
  # balance without compositions); the basic gate requires component balances.
  - id: process-basic
    title: PFD generated for the design case, process rules clean, no stale calculated values
    stage: basic
    kind: validate
    generated: [pfd]                # fails until plant.yaml declares a kind: pfd sheet, built
    fail_on: info
    rules: [cheme.process-refine-pending, cheme.process-balance*,
            cheme.process-component-balance*, cheme.process-calculated-stale,
            cheme.generated-*]
  - id: process-links
    title: Every process link resolves against the lists and sheets
    stage: basic
    kind: process-links
    level: error
  - id: assumptions-marked
    title: Assumed values are marked ASSUMED in the design basis
    stage: concept
    kind: command
    command: grep -q ASSUMED process/design-basis.yaml
  # kind: validate fails on errors. `fail_on: warning` (or info) makes warnings fail too, `rules`
  # limits it to some rule ids (* matches any text), and `accept` lists findings the gate lets
  # pass, each by the id `cheme validate --json` gives it and with a reason (who, why).
  - id: pids-valid
    title: Every P&ID and list validates
    stage: basic
    kind: validate
  - id: drawing-clean
    title: No line through a label, crossing, overlapping or misplaced label left unaccepted
    stage: basic
    kind: validate
    fail_on: warning
    rules: [cheme.line-through-label, cheme.line-crossing, cheme.label-overlap,
            cheme.label-far-from-owner]
    # A sheet kept from the DEXPI reference P&ID (pyDEXPI's sample, e.g. as a worked example)
    # fails this gate by design: the reference has crossings and labels on its lines. Accept
    # its findings here, naming the sheet:
    #   accept:
    #     - {id: "pid/P-01.xml#*", reason: "DEXPI reference sheet, kept as drawn by DEXPI"}
    # Other findings are accepted one by one, by the id `cheme validate --json` gives them:
    # accept:
    #   - id: "pid/P-03.xml#line-crossing:Line_GOX3001_S1_P1+Line_LOX3001_S1_P1"
    #     reason: "D-023: no route around the GOX riser; J. Smith, design review 2026-10-20"
  - id: pids-exist
    title: At least one P&ID sheet
    stage: basic
    kind: files
    files: ["pid/*.xml"]
  - id: design-review
    title: A current, independent design review is recorded
    stage: basic
    kind: review                   # a record with front matter (reviews/README.md)
    topic: design
    require_kind: [human, agent]    # an author's self review does not pass
  # The 3D layout (layout/, skills layout-yaml, pipe-routing, structures-access,
  # area-classification, review). A kind: layout-model gate checks the layout files and the
  # generated layout/plant-model.yaml against each item of require (`cheme schema checks`).
  - id: layout-plot-plan
    title: Plot plan - site, areas, roads, racks, every item placed, separations declared
    stage: concept
    kind: layout-model
    require: [site, areas, roads, racks, placed, separations]
  - id: layout-3d
    title: 3D model current, nozzles resolved, elevated items mounted, process lines routed or skipped, no clashes, zones declared, plan and sections reviewed
    stage: basic
    kind: layout-model
    require: [model-current, nozzles, mounted, routed, clashes, zones, drawings]
    min_dn: 25                      # smaller lines are field-run at basic engineering
    # utilities are routed at detail engineering (gate layout-detail)
    exclude_fluids: [Cooling water, Cooling water return, Chilled water, Instrument air,
                     Plant air, Utility nitrogen, Steam, Condensate, Nitrogen, Fuel gas, Rainwater]
    sections: 2                     # the layout review cites the plot plan and two sections
    # A clash or headroom finding that stays is accepted here with a reason, by its id:
    # accept:
    #   - id: "layout/plant-model.yaml#layout-clash-pipe:P-01/Line_A_S1+P-01/Line_B_S1"
    #     reason: "insulated lines touch at the support only; J. Smith, layout review 2026-11-02"
  # The lifting study (cheme layout lifting, skill structures-access): every heavy item
  # (5 t or more, ASSUMED) has its crane, a clear lane and a laydown; with crane load charts in
  # layout/crane-chart.yaml, a chart that carries each lift. The study is written and current.
  - id: lifting-study
    title: Lifting study - every heavy item has a crane, a clear lane and a laydown
    stage: basic
    kind: layout-model
    require: [model-current, lifting, lifting-current]
  # The material take-off of the 3D model (estimate/, skill mto-estimate): rewritten after the
  # model's last change. Add rates (the project's own, not the example) and estimate-current
  # once the project prices it.
  - id: mto
    title: Material take-off current with the 3D model
    stage: basic
    kind: mto
    require: [mto-current]
  # The LCA of the operation (lca/): once lca/lca.yaml exists, uncomment; add factors once the
  # project's own replace the example.
  # - id: lca
  #   title: LCA mapped and current with the flowsheet
  #   stage: basic
  #   kind: lca
  #   require: [mapped, lca-current]
  # The techno-economic analysis (estimate/tea.yaml, skill tea): once the project prices its
  # plant, uncomment; add class-stage (the estimate class the stage expects) and decision (the
  # baseline meets the decision's threshold) before the stage's investment decision.
  # - id: tea
  #   title: TEA priced, of the project's own premises, and current
  #   stage: basic
  #   kind: tea
  #   require: [prices, no-example, tea-current]
  # Calculation maturity (cheme maturity, docs/framework/maturity.md): the level the evidence
  # supports reaches require (one of sourced, balanced, predictive, engineering); max_claim also
  # fails when process.yaml claims more than that. Engineering runs the whole validation (slow
  # on a large plant); a lower level skips it. Uncomment once the design basis is written.
  # - id: maturity-balanced
  #   title: The conceptual PFD is sourced and balanced
  #   stage: basic
  #   kind: maturity
  #   require: [balanced]
  #   max_claim: true
  - id: layout-review
    title: A current, independent layout review is recorded
    stage: basic
    kind: review
    topic: layout
    require_kind: [human, agent]
  - id: layout-detail
    title: Every line routed, including utilities and small bore, no clashes
    stage: detail
    kind: layout-model
    require: [model-current, nozzles, mounted, routed, clashes]
    min_dn: 0
  # Cables and trays (electrical/, skill electrical-cabling): every motor and instrument has a
  # cable routed in trays, no tray over its fill, power and instrument trays apart.
  - id: electrical
    title: A cable to every motor and instrument, routed in trays, fill and separation kept
    stage: detail
    kind: layout-model
    require: [model-current, cables, trays]
  # Ventilation (layout/hvac.yaml, skill hvac-ducts): every clad building ventilated, ducts
  # routed inside it within their velocity limits, units and louvres large enough.
  - id: hvac
    title: Clad buildings ventilated, ducts routed within their velocity limits
    stage: detail
    kind: layout-model
    require: [model-current, hvac]
  # Control records (control/loops.yaml, control/sequences.yaml, process/narrative.md,
  # control/philosophy.md; skills control-loops, control-sequences, control-narrative): at
  # concept and basic a draft may have gaps (cheme.control-incomplete and -unresolved are info);
  # at detail every loop and sequence is complete and every reference resolves. A plant without
  # control records passes. Left out on purpose: logic given as text, a loop sharing a tag with
  # an interlock, an alarm at a trip level (each to be judged, not removed) and a changed basis
  # (cheme.control-stale); a file that fails its schema is the pids-valid gate's.
  - id: control-complete
    title: Loops and sequences complete, every control reference resolved
    stage: detail
    kind: validate
    fail_on: info
    rules: [cheme.control-incomplete, cheme.control-unresolved, cheme.control-ref,
            cheme.control-unknown-tag, cheme.control-conflict, cheme.control-unit,
            cheme.control-case, cheme.control-cycle, cheme.control-duplicate,
            cheme.control-document, cheme.control-unreachable]
  - id: datasheets
    title: A datasheet for every equipment-list item
    stage: detail
    kind: datasheets               # equipment/datasheets/<TAG>.yaml, see its README
    # require: [dimensions, weights, nozzle-schedule, drawing-current]  # main dimensions,
    #   weights, a located nozzle schedule and current outline drawings (<TAG>.svg)
  # Prefer on-sheet over grep for what a P&ID must show: it finds printed tags in the model.
  # - id: relief-on-pid
  #   title: Relief devices drawn and connected
  #   stage: basic
  #   kind: on-sheet
  #   sheets: [P-01]            # or sheet: P-01; omitted: any sheet
  #   tags: [PSV-101]           # equipment, instrument (PICSA-101), valve or line tags
  #   classes: [SafetyValve]    # at least min_count (1) of each class
  #   connected: true           # piped, on a segment, with a measuring/signal line

  # Open items (plant.yaml issues:): every action, engineering hold, technical query and design
  # change labelled gate:<stage> (or an earlier stage) is closed out before the stage is signed
  # off, as an action tracker. n/a until plant.yaml declares issues; without a GitHub token the
  # gate fails as "not evaluated", it never passes unseen.
  - id: issues-concept
    title: No open item to close before the concept gate
    stage: concept
    kind: issues
  - id: issues-basic
    title: No open item to close before the basic engineering gate
    stage: basic
    kind: issues
  - id: issues-detail
    title: No open item to close before the detail engineering gate
    stage: detail
    kind: issues

  # ---- plant-specific content of the P&IDs (D-007, D-014, D-016, D-017)
  - id: tank-protection-on-pid
    title: Each tank has its independent level and pressure trips, PSVs and vacuum relief valves
    stage: basic
    kind: on-sheet
    tags: [LZT-2102, PZT-2112, PSV-2131A, PSV-2131B, PSV-2133A, PSV-2133B,
           LZT-3102, PZT-3112, PSV-3131A, PSV-3131B, PSV-3133A, PSV-3133B]
    connected: true
  - id: berth-arms-on-pid
    title: Each berth has its four arms (2 liquid, hybrid, vapour) with ERS valves and the shore ESD valve
    stage: basic
    kind: on-sheet
    tags: [LA-5101, LA-5102, LA-5103, LA-5104, XV-5101, XV-5131, XV-5141, XV-5134, XV-5144,
           LA-6101, LA-6102, LA-6103, LA-6104, XV-6101, XV-6131, XV-6141, XV-6134, XV-6144]
    connected: true
  - id: bog-compressors-on-pid
    title: The BOG compressors with anti-surge, the desuperheater and the suction drum
    stage: basic
    kind: on-sheet
    sheets: [P-07]
    tags: [K-7101A, K-7101B, K-7101C, UIC-7104A, UIC-7104B, UIC-7104C, TV-7103, D-7101]
    connected: true
  # ---- closures of the follow-up review 2026-11-05-basic-design-2 (D-026)
  - id: relief-inlet-isolation-on-pid
    title: Each tank PSV and vacuum valve has its locked-open inlet isolation drawn (D-026.11)
    stage: basic
    kind: on-sheet
    tags: [PSV-2131A, PSV-2131B, PSV-2131C, HV-2134A, HV-2134B, HV-2134C,
           PSV-2133A, PSV-2133B, PSV-2133C, HV-2135A, HV-2135B, HV-2135C,
           PSV-3131A, PSV-3131B, PSV-3131C, HV-3134A, HV-3134B, HV-3134C,
           PSV-3133A, PSV-3133B, PSV-3133C, HV-3135A, HV-3135B, HV-3135C]
    connected: true
  - id: trip-sensors-on-pid
    title: The D-026 trip and permissive sensors are drawn and tied to their valve or line
    stage: basic
    kind: on-sheet
    tags: [PZT-1105, ZSC-1102, ZSC-1103, ZSO-4131, ZSO-4132, ZSO-4135, ZSO-4136,
           ZSC-5123, ZSC-5125, ZSC-6123, ZSC-6125, ZSO-7121A, ZSO-7121B, ZSO-7121C, PZT-7113,
           LZT-8105, HV-8108A, HV-8108B]
    connected: true

# Findings accepted for every gate and for `cheme validate`, which then reports them as info
# with the reason (an entry that names no finding is reported as cheme.accept-unused).
# Only warnings and infos can be accepted; an error stays an error (cheme.accept-error).
accept:
  - {id: "pid/P-07.xml#line-crossing:Line_BOG7001_S2_P1+Line_BOG7009_S1_P3", reason: "D-025: each machine path joins the suction and discharge headers; the K-7101B recycle must cross one header (topological minimum of two crossings on P-07)"}
  - {id: "pid/P-07.xml#line-crossing:Line_BOG7002_S5_P1+Line_FL7004_S2_P1", reason: "D-025: the K-7101B/C vent must cross the discharge header to reach the vent header (topological minimum of two crossings on P-07)"}
  - {id: "pid/P-04.xml#line-crossing:Line_BOG4011_S1_P2+Line_LNG4002_S3_P3", reason: "D-026.11: the PSV-4111 outlet BOG-4011 ties into BOG-4001 on the tank side of XV-4135; loading line B runs across the whole sheet between off-page connectors, so a relief from line A must cross it once (topological minimum)"}
  - {id: "pid/P-04.xml#line-crossing:Line_BOG4015_S1_P2+Line_LNG4002_S2_P1", reason: "D-026.11: the PSV-4113 outlet BOG-4015 from the tank-end crossover between lines A and B ties into BOG-4001 on the tank side of XV-4135 and must cross line B once (topological minimum)"}
  - {id: "pid/P-08.xml#line-crossing:Line_LNG8001_S1_P3+Inst_HS8101B_MeasuringLine", reason: "D-026.11: P-8101B lies inside the loops drum - pumps - minimum flow LNG-8005 / thermal relief LNG-8006, so the measuring line tying its motor control HS-8101B to the pump crosses the discharge header LNG-8001 once (topological minimum; LIC-8101 reaches HS-8101A and HS-8101B without a crossing)"}
  # The line number changes with the pipe size at these six sheet boundaries (D-021): the
  # off-page note names the line it continues as on the other sheet.
  - {id: "pid/P-02.xml#offpage-mismatch:Line_LNG2001_To:*", reason: "D-021: DN 450/800 pump header LNG-2001 continues as trestle line LNG-4001 (P-04)"}
  - {id: "pid/P-03.xml#offpage-mismatch:Line_LNG3001_To:*", reason: "D-021: pump header LNG-3001 continues as trestle line LNG-4002 (P-04)"}
  - {id: "pid/P-04.xml#offpage-mismatch:Line_LNG4001_*", reason: "D-021: trestle line LNG-4001 runs from header LNG-2001 (P-02) to the Berth 2 header LNG-5001 (P-05, DN 800/400)"}
  - {id: "pid/P-04.xml#offpage-mismatch:Line_LNG4002_*", reason: "D-021: trestle line LNG-4002 runs from header LNG-3001 (P-03) to the Berth 1 header LNG-6001 (P-06)"}
  - {id: "pid/P-04.xml#offpage-mismatch:Line_BOG400?_From:*", reason: "D-021: DN 400 berth vapour lines BOG-5001 / BOG-6001 continue as the DN 750 trestle vapour returns"}
  - {id: "pid/P-0[56].xml#offpage-mismatch:Line_LNG[56]001_From:*", reason: "D-021: the berth header continues the trestle loading line at a new number (DN 800/400 segments)"}
  - {id: "pid/P-0[56].xml#offpage-mismatch:Line_BOG[56]001_To:*", reason: "D-021: the DN 400 berth vapour line continues as the DN 750 trestle vapour return"}
  # ---- layout accepts after the layout review 2026-11-05-basic-layout (D-027): each names its
  # findings by id or by a prefix limited to the reviewed objects, with the reason
  # ---- lifting study (cheme layout lifting): items with no mobile-crane lift of their own
  - {id: "layout/plant-model.yaml#layout-lifting:T-[23]101", reason: "Field-erected full-containment tank (concrete outer tank slip-formed, steel roof air-raised, 9 % Ni inner tank welded in place, D-007): never lifted as a whole; its 12 t lift_weight is the in-tank pump, lifted by the pump-removal gantry crane of the tank-top pump platform S-Tn101-TOP (D-027). The construction lifting plan sets the erection cranes"}
  - {id: "layout/plant-model.yaml#layout-laydown:laydown-T-[23]101", reason: "Field-erected tank, never laid down; the in-tank pumps are set down on the tank-top pump platform S-Tn101-TOP (D-027)"}
  - {id: "layout/plant-model.yaml#layout-lifting:P-[23]101?", reason: "In-tank pump (D-011): pulled out of its column with its power cable by the 10 t pump-removal gantry crane over the pump wells of the tank-top pump platform S-Tn101-TOP (tank supply, ASSUMED, D-027) after its column-head spool is removed, set down on the platform and lowered to grade with the same crane; no mobile crane pad at grade (a structure crane is not modelled by cheme-as-code, only a building's)"}
  - {id: "layout/plant-model.yaml#layout-laydown:laydown-P-[23]101?", reason: "In-tank pump set down on the tank-top pump platform S-Tn101-TOP (57.4 m) beside its column for the cable reel and cleaning, then lowered to grade by the platform crane (D-027); a laydown zone on a structure level counts as pad-overlap in the model, so none is declared there"}
  - {id: "layout/plant-model.yaml#layout-lifting:FL-8101", reason: "The flare stack is part of the site derrick (D-017): erected with the derrick, its tip changed with the derrick's own maintenance hoist (D-027, ASSUMED); no mobile crane lift of the stack"}
  - {id: "layout/plant-model.yaml#layout-lifting:D-5101", reason: "Jetty drain drum (18 t) is inspected in place; a replacement lift from Z-PAD-A4W is made after the flanged drain header spools at its inlet (DR-5001 / DR-5003 / DR-5007, the only lines in the lane) are removed (D-016, ASSUMED)"}
  # ---- operability (layout-operability): valves that no floor reaches and whose declared
  # operator (piping/routing.yaml operators:) does not reach a floor within 6 m
  - {id: "layout/plant-model.yaml#layout-operability:P-0?/XV*", reason: "Actuated on/off and ESD valves (incl. the arm ERS valves XV-n13k / XV-n14k, which move with the arm, and the tank-roof fill and circulation valves at the dome edge): operated from the DCS / SIS, no manual duty (remote operator declared); maintained from the rack, the platform or a mobile elevating work platform (D-027, ASSUMED)"}
  - {id: "layout/plant-model.yaml#layout-operability:P-0?/FV*", reason: "Actuated loading-line flow control valves FV-4101 / FV-4102 on PR1: operated from the DCS; maintained from the rack (D-027, ASSUMED)"}
  - {id: "layout/plant-model.yaml#layout-operability:P-0?/TV*", reason: "Actuated desuperheater spray valve TV-7103 on the PR6 east leg, operated from the DCS (ASSUMED)"}
  - {id: "layout/plant-model.yaml#layout-operability:P-01/PV1110", reason: "Actuated tank pressure control valve to the flare, operated from the DCS (ASSUMED)"}
  - {id: "layout/plant-model.yaml#layout-operability:P-01/PV1111", reason: "Actuated make-up gas pressure control valve, operated from the DCS (ASSUMED)"}
  - {id: "layout/plant-model.yaml#layout-operability:P-08/PV8132", reason: "PCV-8132 is a self-acting pilot gas regulator set at commissioning, no routine handwheel duty; reached from the flare derrick base / PR3 end ladder for maintenance (ASSUMED)"}
  - {id: "layout/plant-model.yaml#layout-operability:P-0?/FO*", reason: "FO tags are restriction orifices: no operator, nothing to work"}
  - {id: "layout/plant-model.yaml#layout-operability:P-0[56]/HV??1[57]", reason: "Jetty drain pump suction isolation HV-n115 (on the suction from the drum, below the deck level in the model) and P-5101's discharge isolation HV-5117 (7.2 m, beyond a 6 m spindle): at detail engineering they sit at the pump nozzles at deck level (the router places in-line items along the generated route; ASSUMED)"}
  - {id: "layout/plant-model.yaml#layout-operability:P-08/HV8106?", reason: "Flare KO drum pump suction isolation valves at the drum outlet, lever at deck/grade level, worked from grade (ASSUMED)"}
  # ---- line-route (layout-line-route): the validate estimate puts a line-to-line end on the
  # straight chord between the parent line's tank and berth ends, off the curved trestle
  - {id: "piping/line-list.yaml#layout-line-route:*", reason: "Line-to-line ends are estimated on the straight chord between the parent line's tank and berth ends, well off the trestle, which bends at its north end; the router carries each of these lines on PR2 (cheme layout report: routed)"}
  # ---- free spans (layout-free-span), one entry per finding (review #10); the span table
  # screens every line, LNG included, as gas (D-027: a limitation of cheme-as-code)
  - {id: "layout/plant-model.yaml#layout-free-span:P-01/Line_BOG1001_S7", reason: "Tank vapour header BOG-1001 (DN 750) round the PR6 corner from the north leg onto the east leg (14.0 m against 12.8 m): corner steel at the PR6 joint, detail support design (D-027)"}
  - {id: "layout/plant-model.yaml#layout-free-span:P-01/Line_BOG4002_S1", reason: "Vapour return B (DN 750) at the PR6 corner (13.0 m against 12.8 m): corner steel at the joint, detail support design (D-027)"}
  - {id: "layout/plant-model.yaml#layout-free-span:P-04/Line_LNG4002_S4", reason: "Loading line B (DN 800) turning from PR1 onto PR2 at the PR1 / PR2 / PR3 junction (19.1 m): the junction corner steel and the cold contraction anchors there are detail support and stress design (D-027)"}
  - {id: "layout/plant-model.yaml#layout-free-span:P-01/Line_BOG10[01]?_S1", reason: "DN 25 thermal relief tailpipes BOG-1004 / BOG-1011 on the racks (spans longer than the DN 25 table value): clipped to the larger lines and the intermediate rack steel, small-bore supports at detail engineering (D-027)"}
  - {id: "layout/plant-model.yaml#layout-free-span:P-01/Line_FG1001_S1", reason: "Make-up gas FG-1001 (DN 150) at its rise from PR3 onto the PR6 east leg (9.9 m): riser guide on the PR3 column, detail support design"}
  - {id: "layout/plant-model.yaml#layout-free-span:P-04/Line_LNG4008_S1", reason: "Desuperheater spray LNG-4008 (DN 80) at its rise up PR6 (5.6 m): guide on the PR6 column, detail support design"}
  - {id: "layout/plant-model.yaml#layout-free-span:P-0[78]/Line_DR7001_S1", reason: "D-7101 drain DR-7001 (DN 50): its rise beside the drum and its run from the PR3 east end to the KO drum D-8101 on posts in the flare area (A3, sterile, posts at detail engineering, ASSUMED)"}
  - {id: "layout/plant-model.yaml#layout-free-span:P-08/Line_BOG4013_S1", reason: "De-inerting line BOG-4013 (DN 300) at the PR3 corner onto the east leg (17.1 m): corner steel, detail support design"}
  - {id: "layout/plant-model.yaml#layout-free-span:P-08/Line_FL700[23]_S1", reason: "BOG compressor relief and vent lines FL-7002 / FL-7003 at the PR3 corner onto the east leg and their tees on the flare header: corner steel, detail support design"}
  - {id: "layout/plant-model.yaml#layout-free-span:P-08/Line_FG8002_S1", reason: "Fuel gas FG-8002 (DN 50) from the PR3 east end up the flare derrick to the pilots (58.6 m): clamped to the derrick (site derrick steel, D-001)"}
  - {id: "layout/plant-model.yaml#layout-free-span:P-08/Line_[IN]*8001_S1", reason: "Site instrument air and N2 mains IA-8001 / N-8001 at the PR3 rack end and its corner (9.1 m): rack-end and corner steel, detail support design"}
  - {id: "layout/plant-model.yaml#layout-free-span:P-08/Line_W8002_S1", reason: "Oily water W-8002 (DN 100) from the sump pump P-8102 up onto PR1 (15.5 m): riser guide on the PR1 column, detail support design"}
  # ---- lifting: the Berth 1 drain drum (as D-5101)
