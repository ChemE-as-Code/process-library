# Findings accepted for every gate and for `cheme validate`, which then reports them as info
# with the reason (an entry that names no finding is reported as cheme.accept-unused).
# Only warnings and infos can be accepted; an error stays an error (cheme.accept-error).
accept:
  - {id: "pid/P-07.xml#line-crossing:Line_BOG7001_S2_P1+Line_BOG7009_S1_P3", reason: "D-025: each machine path joins the suction and discharge headers; the K-7101B recycle must cross one header (topological minimum of two crossings on P-07)"}
  - {id: "pid/P-07.xml#line-crossing:Line_BOG7002_S5_P1+Line_FL7004_S2_P1", reason: "D-025: the K-7101B/C vent must cross the discharge header to reach the vent header (topological minimum of two crossings on P-07)"}
  - {id: "pid/P-04.xml#line-crossing:Line_BOG4011_S1_P2+Line_LNG4002_S3_P3", reason: "D-026.11: the PSV-4111 outlet BOG-4011 ties into BOG-4001 on the tank side of XV-4135; loading line B runs across the whole sheet between off-page connectors, so a relief from line A must cross it once (topological minimum)"}
  - {id: "pid/P-04.xml#line-crossing:Line_BOG4015_S1_P2+Line_LNG4002_S2_P1", reason: "D-026.11: the PSV-4113 outlet BOG-4015 from the tank-end crossover between lines A and B ties into BOG-4001 on the tank side of XV-4135 and must cross line B once (topological minimum)"}
  - {id: "pid/P-08.xml#line-crossing:Line_LNG8001_S1_P3+Inst_HS8101B_MeasuringLine", reason: "D-026.11: P-8101B lies inside the loops drum - pumps - minimum flow LNG-8005 / thermal relief LNG-8006, so the measuring line tying its motor control HS-8101B to the pump crosses the discharge header LNG-8001 once (topological minimum; LIC-8101 reaches HS-8101A and HS-8101B without a crossing)"}
  # The line number changes with the pipe size at these six sheet boundaries (D-021): the
  # off-page note names the line it continues as on the other sheet.
  - {id: "pid/P-02.xml#offpage-mismatch:Line_LNG2001_To:*", reason: "D-021: DN 450/800 pump header LNG-2001 continues as trestle line LNG-4001 (P-04)"}
  - {id: "pid/P-03.xml#offpage-mismatch:Line_LNG3001_To:*", reason: "D-021: pump header LNG-3001 continues as trestle line LNG-4002 (P-04)"}
  - {id: "pid/P-04.xml#offpage-mismatch:Line_LNG4001_*", reason: "D-021: trestle line LNG-4001 runs from header LNG-2001 (P-02) to the Berth 2 header LNG-5001 (P-05, DN 800/400)"}
  - {id: "pid/P-04.xml#offpage-mismatch:Line_LNG4002_*", reason: "D-021: trestle line LNG-4002 runs from header LNG-3001 (P-03) to the Berth 1 header LNG-6001 (P-06)"}
  - {id: "pid/P-04.xml#offpage-mismatch:Line_BOG400?_From:*", reason: "D-021: DN 400 berth vapour lines BOG-5001 / BOG-6001 continue as the DN 750 trestle vapour returns"}
  - {id: "pid/P-0[56].xml#offpage-mismatch:Line_LNG[56]001_From:*", reason: "D-021: the berth header continues the trestle loading line at a new number (DN 800/400 segments)"}
