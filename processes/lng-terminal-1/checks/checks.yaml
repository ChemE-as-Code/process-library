    stage: basic
    kind: on-sheet
    tags: [LZT-2102, PZT-2112, PSV-2131A, PSV-2131B, PSV-2133A, PSV-2133B,
           LZT-3102, PZT-3112, PSV-3131A, PSV-3131B, PSV-3133A, PSV-3133B]
