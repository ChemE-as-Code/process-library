# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
# Stream values are assumed with source scripts/terminal_sizing.py (DESIGN.md D-006: no
# property package of cheme covers LNG or BOG; the script uses the GERG-2008 reference EOS
# through CoolProp). The script writes them under the library's balance-output contract
# (docs/adr/0027); a change there changes this file in the same commit.
# Cases (D-009): `loading` one carrier at 12,000 m3/h while the rundown continues; `holding`
# no carrier, the rundown fills the tanks and one pump circulates the loading lines; `average`
# the time-weighted year (62.8 % loading) in which the tank inventory is steady: the default
# case, used for the LCA. The tank inventory change is a boundary stream (S11, S12).
schema: cheme/process/v1
kind: flowsheet
title: "LNG export marine terminal (lng-terminal-1)"
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: average, description: "Annual average: 62.8 % of the time loading one carrier, tank inventory steady (D-009)", default: true}
  - {id: loading, description: "Loading one carrier at 12,000 m3/h, rundown continuing, tanks drawn down (D-009)"}
  - {id: holding, description: "No carrier alongside: rundown fills the tanks, loading lines circulated (D-009)"}
tolerance: {abs: 1.0, rel: 0.005}
feeds:
  - {id: RUNDOWN, title: "LNG rundown from liquefaction trains 1-4", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: SHIPVAP, title: "Return vapour from the LNG carrier (ship's compressor)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: INVDRAW, title: "LNG drawn from the tank inventory", category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power (BC Hydro grid)
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: pumps, direction: out, kind: energy}
      - {id: comp, direction: out, kind: energy}
products:
  - {id: SHIP, title: "LNG loaded to carriers", category: product, ports: [{id: in, direction: in}]}
  - {id: BOGOUT, title: "Boil-off gas to the trains' end-flash / fuel gas system (600 kPa(a))", category: by_product, ports: [{id: in, direction: in}]}
  - {id: INVFILL, title: "LNG added to the tank inventory", category: product, ports: [{id: in, direction: in}]}
blocks:
  - id: STORAGE
    title: LNG storage and in-tank pumps
    class: StoringMaterial
    links:
      - {target: equipment, ref: T-2101}
      - {target: equipment, ref: T-3101}
    ports:
      - {id: rundown, direction: in}
      - {id: circ, direction: in}
      - {id: draw, direction: in}
      - {id: fill, direction: out}
      - {id: lng, direction: out}
      - {id: spray, direction: out}
      - {id: bog, direction: out}
      - {id: power, direction: in, kind: energy}
  - id: TRANSFER
    title: Loading and circulation lines (trestle)
    class: TransportingMaterial
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: circ, direction: out}
  - id: JETTY
    title: Berths 1 and 2, loading arms
    class: ProcessStep
    ports:
      - {id: lng, direction: in}
      - {id: vap_in, direction: in}
      - {id: ship, direction: out}
      - {id: vap_out, direction: out}
  - id: BOG
    title: Boil-off gas handling and compression
    class: Compressing
    ports:
      - {id: vap, direction: in}
      - {id: spray, direction: in}
      - {id: bog, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy}
steps:
  - id: TK
    block: STORAGE
    title: LNG tanks T-2101 / T-3101
    class: StoringMaterial
    links:
      - {target: equipment, ref: T-2101}
      - {target: equipment, ref: T-3101}
    ports:
      - {id: rundown, direction: in, delegates: rundown}
      - {id: circ, direction: in, delegates: circ}
      - {id: draw, direction: in, delegates: draw}
      - {id: fill, direction: out, delegates: fill}
      - {id: bog, direction: out, delegates: bog}
      - {id: liq, direction: out}
  - id: PUMPS
    block: STORAGE
    title: In-tank loading and circulation pumps
    class: Pumping
    links:
      - {target: equipment, ref: P-2101A}
      - {target: equipment, ref: P-2102}
      - {target: equipment, ref: P-3101A}
      - {target: equipment, ref: P-3102}
    ports:
      - {id: suction, direction: in}
      - {id: out, direction: out, delegates: lng}
      - {id: spray, direction: out, delegates: spray}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: TRL
    block: TRANSFER
    title: 2 x DN 800 loading lines and circulation (~2.45 km)
    class: TransportingMaterial
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: out, direction: out, delegates: out}
      - {id: circ, direction: out, delegates: circ}
  - id: ARMS
    block: JETTY
    title: Loading arms (3 liquid, 1 vapour per berth)
    class: ProcessStep
    links:
      - {target: equipment, ref: LA-5101}
      - {target: equipment, ref: LA-5102}
      - {target: equipment, ref: LA-6101}
      - {target: equipment, ref: LA-6102}
    ports:
      - {id: lng, direction: in, delegates: lng}
      - {id: vap_in, direction: in, delegates: vap_in}
      - {id: ship, direction: out, delegates: ship}
      - {id: vap_out, direction: out, delegates: vap_out}
  - id: DSH
    block: BOG
    title: Desuperheater and suction drum D-7101
    class: Mixing
    links:
      - {target: equipment, ref: D-7101}
    ports:
      - {id: vap, direction: in, delegates: vap}
      - {id: spray, direction: in, delegates: spray}
      - {id: bog, direction: in, delegates: bog}
      - {id: out, direction: out}
  - id: COMP
    block: BOG
    title: BOG compressors K-7101A/B/C
    class: Compressing
    links:
      - {target: equipment, ref: K-7101A}
      - {target: equipment, ref: K-7101B}
      - {target: equipment, ref: K-7101C}
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
      - {id: power, direction: in, kind: energy, delegates: power}
