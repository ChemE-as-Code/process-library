  # ---- P-08
  - {tag: PI-8112, service: Flare header pressure, sheet: P-08}
  - {tag: FI-8111, service: Flare header purge gas flow, sheet: P-08, notes: Purge set by the orifice FO-8111.}
  - {tag: HS-8101B, service: P-8101B motor start/stop (DCS), sheet: P-08, notes: 'Tied to P-8101B (run feedback). Standby pump in auto: started and stopped from LIC-8101 through HS-8101A when selected as the duty pump (signal line); I-802 starts both pumps at high-high level (whichever is not running) and yields to I-803, which stops both at low-low level (LZT-8105, D-026.14). Hand-off-auto selector at the MCC, local stop at the pump (D-026.11).'}
  - {tag: HS-8101A, service: P-8101A motor start/stop (DCS), sheet: P-08, notes: 'Tied to P-8101A (run feedback). Duty pump in auto: started and stopped by LIC-8101 on its level band (signal line); passes the start/stop command on to HS-8101B when P-8101B is selected as the duty pump (signal line); I-802 starts both pumps at high-high level (whichever is not running) and yields to I-803, which stops both at low-low level (LZT-8105, D-026.14). Hand-off-auto selector at the MCC, local stop at the pump (D-026.11).'}
  - {tag: LIC-8101, service: Flare knock-out drum level, sheet: P-08, notes: 'Starts and stops the duty pump on its level band (signal line to HS-8101A, on to HS-8101B); I-803 stops both at low-low level (LZT-8105); I-802 starts both at high-high (whichever is not running) and yields to I-803 (D-026.14).'}
  - {tag: LZT-8105, service: Flare knock-out drum level high-high and low-low (independent of LIC-8101), sheet: P-08, notes: 'Own nozzle N6 on D-8101, independent of LIC-8101: high-high (LAHH, C&E I-802) starts both pumps P-8101A/B (whichever is not running) and closes LV-7102 against liquid carry-over to FL-8101, non-latching and yielding to I-803; low-low (LALL, C&E I-803) stops P-8101A/B (D-026.14).'}
  - {tag: FI-8133, service: Flare flow (ultrasonic), sheet: P-08, notes: Monthly-average routine flow against the permit limit (S-02).}
  - {tag: TI-8131, service: Pilot flame temperature (thermocouples), sheet: P-08, notes: Pilot failure alarm.}
  - {tag: HS-8103, service: 'P-8102 motor start/stop and speed (DCS, VSD)', sheet: P-08, notes: 'Tied to P-8102 (run feedback). Started and stopped by LI-8103 on its level band in the pocket (signal line): start at 0.90 m, stop at 0.60 m above the pocket floor (ASSUMED; the stop keeps the ~0.5 m submergence of the submersible over its intake, vendor), its speed following the level in between through the VSD in MCC-1 (round-10 design check, D-039.9; as P-8103), loop LC-8103 (control/loops.yaml). Minimum speed ~85 % (ASSUMED), where the pump still delivers ~20 m3/h against its ~38 m fixed head (27.8 m static plus ~10.2 m at the oily water battery limit; no flow below ~80 %, D-039.9 (j)): at an inflow above that it runs on, below it it cycles at most ~9 times an hour (at ~9 m3/h of inflow, with the riser''s ~0.23 m3 drain-back), each start a VSD ramp, against ~22 direct-on-line starts an hour at the ~20 m3/h design rain with the 0.30 m band; vendor limit taken as 15 starts an hour, evenly spaced (ASSUMED, submersible motor of this size, vendor to confirm). The feeder trip I-801 (LNG) and the rate-of-rise inhibit I-810 act on the pump from the C&E and have priority. Hand-off-auto selector at the MCC.'}
  - {tag: TSL-8102, service: Tank-area sump low temperature in the P-8102 pocket (LNG in the sump), sheet: P-08, notes: 'T-8101 is kept dry (D-039): water only in its floor pocket (~1.5 x 1.5 m, 1.2 m deep, ~2.7 m3, ASSUMED; the pit floor laid to fall to it, civil), where the submersible P-8102 stands with its ~0.5 m submergence. Probe hung from the pit cover (N2) into the pocket beside P-8102, no wall penetration (D-034); its tip 1.0 m above the pocket floor (ASSUMED): above the pump''s start level (0.90 m), so in normal service it stands in air and sees LNG flowing into the pocket or lying on its water, never under standing water, and below the rim (1.2 m) (was at the pit floor under the water, review 2026-11-05-basic-design-9 #1). Trips at -60 degC (ASSUMED: below the -20 degC design ambient of an empty pocket, far above LNG). 1oo2 with TSL-8120 on the discharge, with the rim gas detection AT-8124 as a third cause: any of them opens P-8102''s motor feeder (latching, C&E I-801); the F&G system starts the T-8101 high-expansion foam on the same detections (D-018). Coverage (round-10 design check, D-039.9): it sees a large inflow, which raises the pocket to its tip or wets it as it falls in; a small inflow (a flange drip from the troughs) that keeps the pocket below 1.0 m is seen only by TSL-8120 once the pump draws it (1oo1; AT-8124 where its vapour reaches the rim, not credited), a residual for H-05 / H-06; no vapour cooling of the tip is credited.'}
  - {tag: LI-8103, service: 'Tank-area sump pocket level: P-8102 level control', sheet: P-08, notes: 'T-8101 is kept dry (D-039): water only in its floor pocket (~1.5 x 1.5 m, 1.2 m deep, ~2.7 m3, ASSUMED; the pit floor laid to fall to it, civil), where the submersible P-8102 stands with its ~0.5 m submergence. Radar through the pit cover (N1) aimed at the pocket, no wall penetration (D-034). Control only (D-039): starts P-8102 at 0.90 m and stops it at 0.60 m above the pocket floor through HS-8103 (signal line; loop LC-8103, ASSUMED), its VSD speed following the level in between (D-039.9). The alarms and trips are on the independent LZT-8113, with a deviation alarm between the two.'}
  - {tag: LZT-8113, service: 'Tank-area sump level, independent: high (pocket rim), high-high and rate of rise', sheet: P-08, notes: 'T-8101 is kept dry (D-039): water only in its floor pocket (~1.5 x 1.5 m, 1.2 m deep, ~2.7 m3, ASSUMED; the pit floor laid to fall to it, civil), where the submersible P-8102 stands with its ~0.5 m submergence. Own nozzle N3, a second radar through the pit cover aimed at the pocket, independent of LI-8103 (D-039; ASSUMED, vendor); levels from the pocket floor. LAH at 1.20 m, the pocket rim (water on the pit floor: P-8102 failed, W-8002 blocked or the inflow above its 50 m3/h): a transfer hold (SEQ-LOAD S0 / S4) and the call to restore P-8102 (from road R13, outside the transfer area) or to lower the portable spare pump; LAHH at 1.30 m, 0.1 m over the pit floor (~20 m3 with the pocket): C&E I-809 blocks the start of a transfer and during one trips ESD-1 of the transferring berth, since the governing tank-area spill is the loading pumps'' run-out (D-034.3). Rate of rise (C&E I-810): a rise faster than an inflow of ~250 m3/h (ASSUMED, ~10 x the design rain on the troughs and the pit; the DCS converts the level rate with the pocket and floor areas) inhibits P-8102: a spill raises the level metres in minutes, rain millimetres. Deviation alarm against LI-8103. Bad signal (round-10 design check, D-039.9; as LZT-8119, D-039.4): alarmed and taken as its LAH, a transfer hold (no transfer starts, a transfer in progress is paused, SEQ-LOAD S0 / S4), not as the I-809 trip; a PR8 cable burnt in a tank-area fire comes with that fire''s own confirmed fire and gas cause of ESD-1.'}
  - {tag: AT-8124, service: T-8101 pit rim flammable gas (F&G), sheet: P-08, notes: 'Flammable gas detection at the rim of the T-8101 pit (point IR heads round the rim at the cover, voted by the fire and gas system, ASSUMED, F&G vendor), drawn on its own nozzle N4: it is never under water. LNG in the pit boils off and its cold vapour fills the pit and spills over the rim, so it detects a spill without depending on a probe reaching the liquid; with TSL-8102 and TSL-8120 it starts the T-8101 high-expansion foam (F&G, D-018) and is a cause of C&E I-801 (P-8102''s feeder opened) (review 2026-11-05-basic-design-9 #1, D-039).'}
  - {tag: TSL-8120, service: P-8102 discharge low temperature (LNG drawn by the pit pump), sheet: P-08, notes: 'Second, independent LNG detection of P-8102, as TSL-8118 on P-8103 (D-037.17, D-039): a fast-response probe with its tip in the flow of W-8002 upstream of CV-8114 (ASSUMED, no thermowell), own SIS input and cable. Trips at -60 degC (ASSUMED; the riser is empty and at ambient between runs since CV-8114 drains back). 1oo2 with TSL-8102 in C&E I-801 (either opens P-8102''s feeder, latching), so LNG the pump draws from under water in the pocket stops it within seconds of reaching the riser, before it passes the check valve in any quantity (residual: those seconds of flow, H-05). For a small inflow that keeps the pocket below TSL-8102''s tip it is the only credited detection (1oo1, D-039.9), a residual for H-05 / H-06.'}
  - {tag: TSL-8104, service: Jetty sump low temperature (LNG in the sump), sheet: P-08, notes: 'Probe hung from the cover into the T-8102 floor pocket beside the P-8103 bowl, its tip 0.40 m above the pocket floor (ASSUMED): above the pump''s start level (0.35 m), so in normal service it stands in air and sees LNG flowing into the pocket or lying on its water, and below the rim (0.50 m). Trips at -60 degC (ASSUMED: below the -20 degC design ambient of an empty pocket in winter, far above LNG). Alarm and high-expansion foam on the platform (D-018); C&E I-808 locks the dry-sump pump P-8103 out (its feeder opened, latching), 1oo2 with TSL-8118 on the discharge head, and the portable pump may be used only while it reads no LNG (D-034, D-036, D-037.16, D-037.17).'}
  - {tag: TSL-8118, service: P-8103 discharge head low temperature (LNG drawn by the dry-sump pump), sheet: P-08, notes: 'Second, independent LNG detection of the dry-sump pump (D-037.17): a fast-response probe with its tip in the flow of the discharge head, upstream of CV-8116 (ASSUMED, no thermowell), own SIS input and cable. Trips at -60 degC (ASSUMED, as TSL-8104; the head is empty and at ambient between runs, D-037.17). Voted 1oo2 with TSL-8104 in C&E I-808 (either opens P-8103''s feeder, latching) and a start permissive of I-806, so a failure of TSL-8104 to see LNG in the pocket stops the pump within seconds of LNG reaching the head, before it passes the check valve in any quantity (residual: the seconds of flow, H-05).'}
  - {tag: LZT-8106, service: 'Jetty sump T-8102 pocket level: P-8103 start / stop (control)', sheet: P-08, notes: 'Guided-wave radar from the sump cover (N2, drawn on the shell for clarity), its probe in a stilling pipe from the cover bracket down to the floor of the pocket (~0.8 m across, 0.5 m deep, ~0.25 m3), so the P-8103 column and the TSL-8104 probe in the pocket give no false echo and the ~13.5 m drop needs no beam (D-037.17; ASSUMED, vendor), no wall penetration (D-036, D-037.15 (a), D-037.16). Levels from the pocket floor, ASSUMED: P-8103 starts at 0.35 m (C&E I-806) and stops at 0.10 m (C&E I-807, the bowl''s submergence), its speed following the level in between (VSD); loop LC-8106 (control/loops.yaml). Control only since D-039 (review 2026-11-05-basic-design-9 #4): the LAH transfer hold and the LAHH trip I-805 are on the independent LZT-8119, so a failure of this transmitter (P-8103 not started, the initiating event of water on the sump floor) no longer defeats the hold and the trip; a deviation between the two alarms.'}
  - {tag: LZT-8119, service: 'Jetty sump T-8102 level, independent: high (transfer hold) and high-high (I-805)', sheet: P-08, notes: 'Own nozzle N3, a second guided-wave radar in its own stilling pipe from the cover down to the pocket floor, independent of LZT-8106 (review 2026-11-05-basic-design-9 #4, D-039; ASSUMED, vendor), own SIS input and cable. Levels from the pocket floor, ASSUMED: LAH at 0.50 m, the pocket rim (water on the sump floor: P-8103 failed or the inflow above its ~20 m3/h), a transfer hold: no transfer starts (SEQ-LOAD S0) and a transfer in progress is paused (SEQ-LOAD S4) until the level is back below it, no one going to A9 during a transfer (S-CW-A9, D-037.3); LAHH at 0.60 m (0.1 m over the sump floor, ~3 m3 with the pocket): C&E I-805 inhibits the start of SEQ-LOAD and during a transfer trips ESD-1 of the transferring berth (I-501 / I-601: carrier tripped through its own link, D-016). So no LNG lands on standing water, and the 257 m3 below the inlet hold the ~170 m3 platform spill and the trestle drain-down of D-036 (~36 m3, 40 m3 kept) with no rain allowance (D-037.15 (a)). Deviation alarm against LZT-8106.'}
  - {tag: PI-8121, service: N2 header pressure, sheet: P-08}
  - {tag: PI-8122, service: Instrument-air header pressure, sheet: P-08, notes: 'Indication and low alarm only; the trip is PZT-8123A/B/C (C&E I-804, D-028).'}
  - {tag: PZT-8123A, service: 'Instrument-air header pressure low-low (I-804), transmitter A of 2oo3', sheet: P-08, notes: 'Own tapping on IA-8001, independent of PI-8122; 2oo3 with the other two: at 4.5 barg (ASSUMED; header 7 barg, the fail-closed spring-return actuators start to stroke below about 3.5 barg, ASSUMED) it initiates ESD-1 of both berths (pumps stopped, carriers tripped) and the rundown trip (trains tripped, battery-limit valves closed) before the valves move (C&E I-804, D-016, D-028).'}
  - {tag: PZT-8123B, service: 'Instrument-air header pressure low-low (I-804), transmitter B of 2oo3', sheet: P-08, notes: 'Own tapping on IA-8001, independent of PI-8122; 2oo3 with the other two: at 4.5 barg (ASSUMED; header 7 barg, the fail-closed spring-return actuators start to stroke below about 3.5 barg, ASSUMED) it initiates ESD-1 of both berths (pumps stopped, carriers tripped) and the rundown trip (trains tripped, battery-limit valves closed) before the valves move (C&E I-804, D-016, D-028).'}
  - {tag: PZT-8123C, service: 'Instrument-air header pressure low-low (I-804), transmitter C of 2oo3', sheet: P-08, notes: 'Own tapping on IA-8001, independent of PI-8122; 2oo3 with the other two: at 4.5 barg (ASSUMED; header 7 barg, the fail-closed spring-return actuators start to stroke below about 3.5 barg, ASSUMED) it initiates ESD-1 of both berths (pumps stopped, carriers tripped) and the rundown trip (trains tripped, battery-limit valves closed) before the valves move (C&E I-804, D-016, D-028).'}
  - {tag: AT-8141A, service: 'B-SUB AHU-1 outdoor-air intake LV1 flammable gas, detector A of 2oo3', sheet: P-08, notes: 'B-SUB is the temporary refuge (layout/building.yaml, D-037.5); its gas-tightness rests on this trip (layout/hvac.yaml AHU-1, D-035.10). Point IR detector in the LV1 intake duct downstream of the louvre (ASSUMED, F&G vendor), own input and cable to CR-1. Alarm at 10 % LFL (any one); trip at 25 % LFL, 2oo3 (ASSUMED), C&E I-811: AHU-1 stopped, the gas-tight dampers UZ-8142 (LV1) and UZ-8143 (LV2) closed, the building held on its stored overpressure. A detector fault alarms and counts as tripped (2oo3 degrades to 1oo2).'}
  - {tag: AT-8141B, service: 'B-SUB AHU-1 outdoor-air intake LV1 flammable gas, detector B of 2oo3', sheet: P-08, notes: 'B-SUB is the temporary refuge (layout/building.yaml, D-037.5); its gas-tightness rests on this trip (layout/hvac.yaml AHU-1, D-035.10). Point IR detector in the LV1 intake duct downstream of the louvre (ASSUMED, F&G vendor), own input and cable to CR-1. Alarm at 10 % LFL (any one); trip at 25 % LFL, 2oo3 (ASSUMED), C&E I-811: AHU-1 stopped, the gas-tight dampers UZ-8142 (LV1) and UZ-8143 (LV2) closed, the building held on its stored overpressure. A detector fault alarms and counts as tripped (2oo3 degrades to 1oo2).'}
  - {tag: AT-8141C, service: 'B-SUB AHU-1 outdoor-air intake LV1 flammable gas, detector C of 2oo3', sheet: P-08, notes: 'B-SUB is the temporary refuge (layout/building.yaml, D-037.5); its gas-tightness rests on this trip (layout/hvac.yaml AHU-1, D-035.10). Point IR detector in the LV1 intake duct downstream of the louvre (ASSUMED, F&G vendor), own input and cable to CR-1. Alarm at 10 % LFL (any one); trip at 25 % LFL, 2oo3 (ASSUMED), C&E I-811: AHU-1 stopped, the gas-tight dampers UZ-8142 (LV1) and UZ-8143 (LV2) closed, the building held on its stored overpressure. A detector fault alarms and counts as tripped (2oo3 degrades to 1oo2).'}
  - {tag: UZ-8142, service: 'B-SUB AHU-1 gas-tight damper, outdoor-air intake LV1 (east wall)', sheet: P-08, notes: 'B-SUB is the temporary refuge (layout/building.yaml, D-037.5); its gas-tightness rests on this trip (layout/hvac.yaml AHU-1, D-035.10). SIS output to the spring-return actuator of the gas-tight damper (fail closed on loss of power, ASSUMED, HVAC vendor), closed by C&E I-811 with AHU-1 stopped; reopened by hand after the reset, once the intake reads below the alarm.'}
  - {tag: UZ-8143, service: 'B-SUB AHU-1 gas-tight damper, exhaust LV2 (south wall)', sheet: P-08, notes: 'B-SUB is the temporary refuge (layout/building.yaml, D-037.5); its gas-tightness rests on this trip (layout/hvac.yaml AHU-1, D-035.10). SIS output to the spring-return actuator of the gas-tight damper (fail closed on loss of power, ASSUMED, HVAC vendor), closed by C&E I-811 with AHU-1 stopped; reopened by hand after the reset, once the intake reads below the alarm.'}
  - {tag: UZ-8144, service: B-SUB AHU-1 fan stop (SIS output to its starter), sheet: P-08, notes: 'B-SUB is the temporary refuge (layout/building.yaml, D-037.5); its gas-tightness rests on this trip (layout/hvac.yaml AHU-1, D-035.10). SIS output, de-energise-to-trip, to the AHU-1 fan starter in B-SUB (ASSUMED, HVAC vendor): C&E I-811 stops the fan before the dampers UZ-8142 / UZ-8143 have closed, so the fan does not draw against a closing intake; restarted by hand after the reset, once the dampers are open again.'}
