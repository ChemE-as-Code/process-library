  # ---- P-04
  - {tag: HS-4131, service: De-inerting vapour A to the flare XV-4131, sheet: P-04, notes: 'Flare valve of the make-before-break switch: I-511 opens it while AI-4133 reads off-specification vapour (not while ESD-1, I-501, is tripped); I-513 closes it only once ZSO-4135 proves XV-4135 open; fail closed: on an instrument-air failure the return goes to the tanks, never from the tank header to the flare (D-017; D-026.1, review 2026-11-05-basic-design-3#1).'}
  - {tag: HS-4132, service: De-inerting vapour B to the flare XV-4132, sheet: P-04, notes: 'As HS-4131, with AI-4134, ZSO-4136 and XV-4136 (C&E I-611, I-613); fail closed: on an instrument-air failure the return goes to the tanks, never from the tank header to the flare (D-026.1, review 2026-11-05-basic-design-3#1).'}
  - {tag: HS-4135, service: Vapour return A to the tank vapour header XV-4135, sheet: P-04, notes: 'Tank-side valve of the switch: I-512 closes it only while ZSO-4131 proves XV-4131 open; ESD-1 (I-501) opens it; fail open keeps the carrier vapour return (D-026).'}
  - {tag: HS-4136, service: Vapour return B to the tank vapour header XV-4136, sheet: P-04, notes: 'As HS-4135, with ZSO-4132 (C&E I-612) and ESD-1 of Berth 1 (I-601); fail open (D-026).'}
  - {tag: ZSO-4131, service: XV-4131 open position, sheet: P-04, notes: 'Position switch on the flare valve XV-4131: XV-4135 may close only with XV-4131 proven open (C&E I-512, D-026). Proven open means the switch reads open and has no standing discrepancy: a switch that reads open while its valve has been commanded closed for longer than the stroke time raises a discrepancy alarm and blocks the interlock, so a switch stuck open cannot fake the open state (review 2026-11-05-basic-design-3#4, D-028).'}
  - {tag: ZSO-4135, service: XV-4135 open position, sheet: P-04, notes: 'Position switch on the tank-side valve XV-4135: XV-4131 may close only with XV-4135 proven open (C&E I-513, D-026). Proven open means the switch reads open and has no standing discrepancy: a switch that reads open while its valve has been commanded closed for longer than the stroke time raises a discrepancy alarm and blocks the interlock, so a switch stuck open cannot fake the open state (review 2026-11-05-basic-design-3#4, D-028).'}
  - {tag: ZSO-4132, service: XV-4132 open position, sheet: P-04, notes: 'Position switch on the flare valve XV-4132: XV-4136 may close only with XV-4132 proven open (C&E I-612, D-026). Proven open means the switch reads open and has no standing discrepancy: a switch that reads open while its valve has been commanded closed for longer than the stroke time raises a discrepancy alarm and blocks the interlock, so a switch stuck open cannot fake the open state (review 2026-11-05-basic-design-3#4, D-028).'}
  - {tag: ZSO-4136, service: XV-4136 open position, sheet: P-04, notes: 'Position switch on the tank-side valve XV-4136: XV-4132 may close only with XV-4136 proven open (C&E I-613, D-026). Proven open means the switch reads open and has no standing discrepancy: a switch that reads open while its valve has been commanded closed for longer than the stroke time raises a discrepancy alarm and blocks the interlock, so a switch stuck open cannot fake the open state (review 2026-11-05-basic-design-3#4, D-028).'}
  - {tag: AI-4133, service: Vapour return A composition at the tank end (N2 / O2 / CH4), sheet: P-04, notes: 'Switches the carrier vapour make-before-break between the tank vapour header (XV-4135) and the flare (XV-4131) by C&E I-511..I-513: to the flare while N2 is high (de-inerting, gassing-up; to the flare only below 5 vol % O2), to the tanks once CH4 is on specification and O2 below 1 vol % (D-026). Two O2 cells (ASSUMED, analyser vendor), voted 2oo2 with a discrepancy alarm: above 5 vol % O2 the O2 reject C&E I-514 closes the Berth 2 vapour arm XV-5122 and the hybrid vapour isolation XV-5125 while no liquid is transferred at Berth 2 (a plant state, not a sequence step: gassing-up, also when run by hand); during a liquid transfer (cooldown and loading) it trips ESD-1, I-501, which stops the flow and trips the carrier (D-026.7, D-028, D-030).'}
  - {tag: AI-4134, service: Vapour return B composition at the tank end (N2 / O2 / CH4), sheet: P-04, notes: 'As AI-4133, with XV-4136 and XV-4132; its O2 reject is C&E I-614 on XV-6122 and XV-6125 with no liquid transfer at Berth 1, and ESD-1 I-601 during a transfer (D-028, D-030).'}
  - {tag: FIC-4101, service: Loading line A flow (loading rate), sheet: P-04, notes: Ramps the loading up and down to the carrier's cargo plan; FV-4101 butterfly (D-011).}
  - {tag: FIC-4102, service: Loading line B flow (loading rate), sheet: P-04, notes: As FIC-4101.}
  - {tag: UZ-4101, service: Loading line A tank-end ESD valve XV-4101, sheet: P-04, notes: 'ESD-1 closes it after the pumps have been stopped (C&E I-501, I-601), in 25-30 s (ASSUMED, D-023); non-return valve and local air accumulator on the actuator supply and a speed controller on its exhaust, so on an instrument-air failure it holds until the air-header trip I-804 has initiated ESD-1 and then closes no faster than its set speed (D-016, D-028). Residual case, the valve closing at spring speed with the pumps running because its non-return valve or accumulator failed: a rise in the pump header and a column separation in the trestle line, a check case of the transient analysis (D-023.4, D-030).'}
  - {tag: UZ-4102, service: Loading line B tank-end ESD valve XV-4102, sheet: P-04, notes: 'ESD-1 closes it after the pumps have been stopped (C&E I-501, I-601), in 25-30 s (ASSUMED, D-023); non-return valve and local air accumulator on the actuator supply and a speed controller on its exhaust, so on an instrument-air failure it holds until the air-header trip I-804 has initiated ESD-1 and then closes no faster than its set speed (D-016, D-028). Residual case, the valve closing at spring speed with the pumps running because its non-return valve or accumulator failed: a rise in the pump header and a column separation in the trestle line, a check case of the transient analysis (D-023.4, D-030).'}
  - {tag: HS-4103, service: Platform crossover XV-4103, sheet: P-04, notes: Open in holding (circulation) and while loading (D-008).}
  - {tag: HS-4106, service: Tank-end crossover XV-4106, sheet: P-04, notes: Operator selection (D-008).}
  - {tag: HS-4105, service: Circulation return XV-4105, sheet: P-04, notes: Open in holding (D-008).}
