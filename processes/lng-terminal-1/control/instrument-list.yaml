  - {tag: ZS-5153, service: LA-5103 envelope monitoring (position of the outboard arm), sheet: P-05, notes: 'Pre-alarm, ESD-1 at stage 1 (C&E I-501), ESD-2 at stage 2 (C&E I-503, ERS by I-507). With the arm stowed in its parking position (no carrier connected) it reads stowed, not a stage (ASSUMED, arm vendor''s envelope system, H-02), so an idle berth trips nothing; leaving the stowed position ends the link''s ''no carrier connected'' mode (review 2026-11-05-basic-design-6 #5, review 7 #3, D-016, D-034).'}
  - {tag: UZ-5132, service: LA-5102 ERS valve XV-5132, sheet: P-05, notes: 'Closes on ESD-2 by C&E I-507 (5 s after I-503), not on ESD-1; I-510 then releases the coupler (D-016, D-026, D-034). Hydraulic actuator on the arm vendor''s hydraulic power unit with its accumulator (ASSUMED, vendor): instrument air does not move it, so an air failure does not close it; it closes only on I-507, from the accumulator also on a loss of the power unit, in a closure time set with the arm vendor against the surge of the arm (ASSUMED 5 s, D-023, D-028). De-energise-to-trip on two solenoid valves (2oo2, each line-monitored, a discrepancy alarms): one coil, wire or output fault de-energises one solenoid only and does not move the valve; channel A is fed from UPS A, channel B from UPS B (separate distribution, ASSUMED), each monitored (XA-5130A / XA-5130B), and the loss of either, or of one channel of any ERS valve (line monitoring of its solenoid circuit), during a liquid transfer trips ESD-1 at once (I-501); the two channels are on separate SIS output modules (ASSUMED, H-06). A solenoid stuck energised is found by the ERS function test of SEQ-LOAD S1 before every transfer (HS-5109, permitted only with no transfer and every arm stowed, C&E I-509). The coupler release UY-5136 is energise-to-release, commanded by I-510 when both ERS valves of the arm are proven closed or, if one fails to close, at a timeout from the vendor''s confirmed closure time with margin (ASSUMED 1.5 x, H-02), whichever comes first, never before the ERS close command and the closure of the arm isolations by I-507; no circuit or supply fault releases it (review 2026-11-05-basic-design-5 #3, review 6 #2, review 7 #4 / #5, D-016, D-032, D-034).'}
  - {tag: UZ-5142, service: LA-5102 ERS valve XV-5142, sheet: P-05, notes: 'Closes on ESD-2 by C&E I-507 (5 s after I-503), not on ESD-1; I-510 then releases the coupler (D-016, D-026, D-034). Hydraulic actuator on the arm vendor''s hydraulic power unit with its accumulator (ASSUMED, vendor): instrument air does not move it, so an air failure does not close it; it closes only on I-507, from the accumulator also on a loss of the power unit, in a closure time set with the arm vendor against the surge of the arm (ASSUMED 5 s, D-023, D-028). De-energise-to-trip on two solenoid valves (2oo2, each line-monitored, a discrepancy alarms): one coil, wire or output fault de-energises one solenoid only and does not move the valve; channel A is fed from UPS A, channel B from UPS B (separate distribution, ASSUMED), each monitored (XA-5130A / XA-5130B), and the loss of either, or of one channel of any ERS valve (line monitoring of its solenoid circuit), during a liquid transfer trips ESD-1 at once (I-501); the two channels are on separate SIS output modules (ASSUMED, H-06). A solenoid stuck energised is found by the ERS function test of SEQ-LOAD S1 before every transfer (HS-5109, permitted only with no transfer and every arm stowed, C&E I-509). The coupler release UY-5136 is energise-to-release, commanded by I-510 when both ERS valves of the arm are proven closed or, if one fails to close, at a timeout from the vendor''s confirmed closure time with margin (ASSUMED 1.5 x, H-02), whichever comes first, never before the ERS close command and the closure of the arm isolations by I-507; no circuit or supply fault releases it (review 2026-11-05-basic-design-5 #3, review 6 #2, review 7 #4 / #5, D-016, D-032, D-034).'}
  - {tag: ZS-5152, service: LA-5102 envelope monitoring (position of the outboard arm), sheet: P-05, notes: 'Pre-alarm, ESD-1 at stage 1 (C&E I-501), ESD-2 at stage 2 (C&E I-503, ERS by I-507). With the arm stowed in its parking position (no carrier connected) it reads stowed, not a stage (ASSUMED, arm vendor''s envelope system, H-02), so an idle berth trips nothing; leaving the stowed position ends the link''s ''no carrier connected'' mode (review 2026-11-05-basic-design-6 #5, review 7 #3, D-016, D-034).'}
  - {tag: UZ-5101, service: Berth 2 shore ESD valve XV-5101, sheet: P-05, notes: 'ESD-1 closes it in 25-30 s (ASSUMED, D-023) after the pumps have been stopped (C&E I-501, D-016); non-return valve and local air accumulator on the actuator supply (one closing stroke and a hold of at least 5 min after a loss of the air header, ASSUMED) and a speed controller on the actuator exhaust that sets the same closure time for a commanded closure and for one on air loss; on an instrument-air failure the valve holds until the air-header trip I-804 has stopped the pumps and tripped the carrier through ESD-1; it closes afterwards, on its command or as the accumulator decays, never faster than its set speed (D-016, D-028). Its SIS output holding the valve open is, with ZSC-5101, the liquid transfer state of Berth 2 (C&E I-501, I-514; D-032).'}
  - {tag: ZSC-5101, service: XV-5101 closed position, sheet: P-05, notes: 'Closed-position switch on the shore ESD valve XV-5101: XV-5101 not proven closed, or held open by UZ-5101, is the liquid transfer state of Berth 2 that arms the transfer causes of ESD-1 (I-501); proven closed and not held open arms the O2 reject I-514 (C&E; review 2026-11-05-basic-design-6 #1, D-032). Safety-system inputs only, so no loop transmitter or DCS command disarms ESD-1. Reading closed while UZ-5101 holds the valve open for longer than its stroke time raises a discrepancy alarm.'}
  - {tag: PDI-5102, service: 'Strainer SR-5102 differential pressure, indicated and alarmed (PDAH) in the control room', sheet: P-05, notes: 'The tag names the control-room function, as for the plant''s other transmitted indications (LI-8103, PI-4105): a differential pressure transmitter on the strainer (round-10 design check, D-039.9), its PDAH a DCS alarm of the same loop, no local indicator. Differential pressure across the permanent T-type strainer SR-5102 (D-039), transmitted to the control room with a PDAH (ASSUMED ~0.2 bar at 12,000 m3/h: the loss coefficient 2.0 the D-034 hydraulics take for the strainer at its PDI alarm, on ~10 kPa of velocity head at 6.8 m/s in DN 800) so the strainer is watched without anyone at the header bay during a transfer (south-end occupancy rule, D-035.14 (e); layout review 2026-11-05-basic-layout-6 #14); the basket is cleaned with no transfer on the berth.'}
  - {tag: PZT-5103, service: Berth 2 header pressure (high back-pressure), sheet: P-05, notes: 'Berth header pressure downstream of XV-5101: indication, the PAH, and in C&E I-502 an uncredited backstop at PAHH 7.0 barg (ASSUMED). Normal ~5.2-5.5 barg at 12,000 m3/h (S3, 647.9 kPa(a) at XV-5101, less the strainer). Corrected after the checker of D-036: on the header no set point fits between that normal pressure and the carrier''s 10 barg (ASSUMED) once the closure rise of a carrier ESD valve (2.7-3.2 bar, not ~0.3 bar) is allowed for; the carrier''s manifold is protected by PZT-5181 / PZT-5184 at the arms'' outboard ends, where the normal pressure is lowest (1oo2, PAHH 5.0 barg, D-036). Shore shut-off with a full tank ~12.1 barg here (scripts/terminal_sizing.py).'}
  - {tag: TI-5104, service: Berth 2 header temperature (cooldown), sheet: P-05}
  - {tag: HS-5121, service: LA-5101 isolation XV-5121, sheet: P-05, notes: 'Fail closed; closure time at least 25 s (ASSUMED, D-023) with the non-return valve and local air accumulator on the actuator supply (one closing stroke and a hold of at least 5 min after a loss of the air header, ASSUMED) and a speed controller on the actuator exhaust that sets the same closure time for a commanded closure and for one on air loss; on an instrument-air failure it holds until the air-header trip I-804 has stopped the pumps and tripped the carrier through ESD-1; it closes afterwards, on its command or as the accumulator decays, never faster than its set speed (D-016, D-028).'}
  - {tag: HS-5124, service: LA-5104 isolation XV-5124, sheet: P-05, notes: 'Fail closed; closure time at least 25 s (ASSUMED, D-023) with the non-return valve and local air accumulator on the actuator supply (one closing stroke and a hold of at least 5 min after a loss of the air header, ASSUMED) and a speed controller on the actuator exhaust that sets the same closure time for a commanded closure and for one on air loss; on an instrument-air failure it holds until the air-header trip I-804 has stopped the pumps and tripped the carrier through ESD-1; it closes afterwards, on its command or as the accumulator decays, never faster than its set speed (D-016, D-028).'}
  - {tag: HS-5123, service: LA-5103 liquid isolation XV-5123, sheet: P-05, notes: 'Open command blocked by C&E I-504 unless the other isolation XV-5125 is proven closed (ZSC-5125) and XV-5123 itself is proven closed (ZSC-5123); an open valve is never closed by it (D-026.3, D-026.14, D-028). Fail closed; closure time at least 25 s (ASSUMED, D-023) with the non-return valve and local air accumulator on the actuator supply (one closing stroke and a hold of at least 5 min after a loss of the air header, ASSUMED) and a speed controller on the actuator exhaust that sets the same closure time for a commanded closure and for one on air loss; on an instrument-air failure it holds until the air-header trip I-804 has stopped the pumps and tripped the carrier through ESD-1; it closes afterwards, on its command or as the accumulator decays, never faster than its set speed (D-016, D-028).'}
  - {tag: HS-5125, service: LA-5103 vapour isolation XV-5125 (hybrid as vapour arm), sheet: P-05, notes: 'Open command blocked by C&E I-505 unless the other isolation XV-5123 is proven closed (ZSC-5123) and XV-5125 itself is proven closed (ZSC-5125); an open valve is never closed by it (D-026.3, D-026.14, D-028). The O2 reject I-514 closes it with XV-5122 while XV-5101 is proven closed (gassing-up; D-028, D-030, D-032). Fail closed without an accumulator (opening it on an air failure could join the liquid and vapour paths of the hybrid arm); in line-up (b) its closure leaves the vapour arm XV-5122, proven open by ZSO-5122, as the return.'}
  - {tag: ZSC-5123, service: XV-5123 closed position, sheet: P-05, notes: 'Closed-position switch of the hybrid arm liquid isolation: start permissive of the other isolation, XV-5125 may open only with XV-5123 proven closed (C&E I-505); never trips an open valve (review #3, H-03 A13, D-026).'}
  - {tag: ZSC-5125, service: XV-5125 closed position, sheet: P-05, notes: 'Closed-position switch of the hybrid arm vapour isolation: start permissive of the other isolation, XV-5123 may open only with XV-5125 proven closed (C&E I-504); never trips an open valve (review #3, H-03 A13, D-026).'}
  - {tag: HS-5122, service: LA-5102 vapour arm isolation XV-5122, sheet: P-05, notes: 'Fail closed, without an accumulator. Closed, latching, with XV-5125 by the O2 reject I-514 when AI-5126 (or AI-4133) reads above 5 vol % O2 while XV-5101 is proven closed (gassing-up); during a liquid transfer (cooldown and loading) the O2 high-high trips ESD-1, I-501 (D-026.7, D-028, D-030, D-032). Proven open by ZSO-5122: not open during a liquid transfer trips ESD-1 at the start of any closure (spurious command, solenoid or output fault, air loss at the platform end of the air main), before the liquid-path valves, which hold on their accumulators, move (review 2026-11-05-basic-design-5 #2 and adversarial check, D-030). The drum vent BOG-5002 joins downstream of it, so the jetty relief path stays open.'}
  - {tag: ZSO-5122, service: XV-5122 open position, sheet: P-05, notes: 'Open-position switch on the vapour arm isolation XV-5122: not open during a liquid transfer at Berth 2 trips ESD-1 (C&E I-501) at the start of the closure; proves the vapour path open in SEQ-LOAD S1, S3 and S4 (D-030, D-032). A switch failing to not-open trips ESD-1 (safe); one stuck open is found by the command discrepancy alarm. A failed switch may be overridden for the transfer in progress only, under a permit with XV-5122 checked open locally (C&E I-501 bypass, review 2026-11-05-basic-design-6 #4); the vapour arm is needed for every transfer.'}
  - {tag: AI-5126, service: Berth 2 vapour O2 (two cells), sheet: P-05, notes: 'O2 of the carrier vapour at the berth, on the vapour arm side of XV-5122 (sample point and cells ASSUMED, analyser vendor), so it measures the carrier''s vapour whether XV-5122 is open or closed; the hybrid vapour path of line-up (b) comes from the same carrier vapour header and is only ever open beside the vapour arm (D-032), so the one point serves both. Sample fast loop returned into BOG-5001 downstream of XV-5122 (~1 Nm3/h, ASSUMED, analyser package), isolated during the vapour arm leak test of SEQ-LOAD S1 by the analyser package''s fast-loop isolation valve (vendor tag), proven closed by the package as a permissive of the leak test (review 2026-11-05-basic-design-8 #7, D-036). Two O2 cells voted 2oo2 with a discrepancy alarm: above 5 vol % O2 the reject C&E I-514 closes XV-5122 / XV-5125 and sends the return to the tanks while XV-5101 is proven closed (gassing-up), and I-514 is reset only once it reads below 5 vol %; during a liquid transfer it trips ESD-1 (I-501). AI-4133 at the tank end is the backup (D-026.7, D-032, D-034).'}
  - {tag: HS-5161, service: Header drain isolation XV-5161 to D-5101, sheet: P-05, notes: 'Opened for the header and arm drain and for the N2 purge after loading (SEQ-LOAD S6, D-026.13); fail closed (review #1, H-03 A3).'}
  - {tag: XS-5100, service: Berth 2 ship-shore ESD link, sheet: P-05, notes: 'Fibre-optic link (S-01): ESD-1 both ways: a carrier ESD trips I-501 (cause), and I-501, also when initiated by ESD-2 (I-503) or the air-header trip (I-804), trips the carrier''s ESD through it (effect; D-028). With no carrier connected the link is in its own ''no carrier connected'' mode, selectable only with every arm stowed and XV-5101 proven closed (ZSC-5101): not a trip and not a bypass, so an idle berth does not trip I-501, the shared pumps or holding; a departing carrier''s link is set to it after the arms are stowed and before the cable is disconnected (SEQ-LOAD S6; review 2026-11-05-basic-design-6 #5, D-016). The mode ends by itself when a carrier''s link cable is connected and healthy or when any arm leaves its stowed position (ZS-5151..5154); ended with no healthy link it reads trip (I-501). The open command of XV-5101 is permitted only with the link in carrier mode and healthy (C&E I-508), and the mode is alarmed whenever an arm is not stowed (review 2026-11-05-basic-design-7 #3, D-034).'}
  - {tag: HS-5100A, service: 'Berth 2 manual ESD-1 push button, control room', sheet: P-05, notes: 'Hard-wired ESD-1 push button in the control room, on its own SIS input with a normally closed contact (de-energise-to-trip, the input line-monitored), so a broken wire trips or alarms and the SOE names the station: a cause of C&E I-501 (review 2026-11-05-basic-design-7 #7, D-034).'}
  - {tag: HS-5100B, service: 'Berth 2 manual ESD-1 push button, jetty head', sheet: P-05, notes: 'Hard-wired ESD-1 push button in the jetty head, on its own SIS input with a normally closed contact (de-energise-to-trip, the input line-monitored), so a broken wire trips or alarms and the SOE names the station: a cause of C&E I-501 (review 2026-11-05-basic-design-7 #7, D-034).'}
  - {tag: HS-5100C, service: 'Berth 2 manual ESD-1 push button, loading platform', sheet: P-05, notes: 'Hard-wired ESD-1 push button in the loading platform, on its own SIS input with a normally closed contact (de-energise-to-trip, the input line-monitored), so a broken wire trips or alarms and the SOE names the station: a cause of C&E I-501 (review 2026-11-05-basic-design-7 #7, D-034).'}
  - {tag: HS-5107A, service: 'Berth 2 manual ESD-2 push button, control room', sheet: P-05, notes: 'Hard-wired ESD-2 push button in the control room, own normally closed SIS input as HS-5100A: a cause of C&E I-503 (ESD-1 at once, ERS by I-507; review 7 #7, D-034).'}
  - {tag: HS-5107B, service: 'Berth 2 manual ESD-2 push button, jetty head', sheet: P-05, notes: 'Hard-wired ESD-2 push button in the jetty head, own normally closed SIS input as HS-5100B: a cause of C&E I-503 (ESD-1 at once, ERS by I-507; review 7 #7, D-034).'}
  - {tag: HS-5107C, service: 'Berth 2 manual ESD-2 push button, loading platform', sheet: P-05, notes: 'Hard-wired ESD-2 push button in the loading platform, own normally closed SIS input as HS-5100C: a cause of C&E I-503 (ESD-1 at once, ERS by I-507; review 7 #7, D-034).'}
  - {tag: XS-5108, service: Berth 2 platform fire and gas confirmed, sheet: P-05, notes: 'Voted output of the fire and gas system for the loading platform (voting ASSUMED, F&G vendor): a cause of C&E I-501.'}
  - {tag: XA-5130A, service: Berth 2 ERS solenoid channel A, sheet: P-05, notes: 'Monitoring of channel A of the ERS solenoids: the UPS A supply (separate distribution, ASSUMED) and the line monitoring of every channel A solenoid circuit; a loss of either during a liquid transfer trips ESD-1, C&E I-501 (review 2026-11-05-basic-design-6 #2, review 7 #5, D-016, D-034).'}
  - {tag: XA-5130B, service: Berth 2 ERS solenoid channel B, sheet: P-05, notes: As XA-5130A for channel B (UPS B).}
  - {tag: UY-5135, service: LA-5101 emergency release coupler release, sheet: P-05, notes: 'Energise-to-release from the arm vendor''s HPU accumulator (vendor package): commanded by C&E I-510 when both ERS valves of LA-5101 are proven closed (vendor position switches, ASSUMED) or at the timeout (vendor closure time x 1.5, ASSUMED, H-02), whichever comes first; I-507 closes the arm isolations at the same time (review 2026-11-05-basic-design-7 #4, D-016, D-034).'}
  - {tag: UY-5136, service: LA-5102 emergency release coupler release, sheet: P-05, notes: 'Energise-to-release from the arm vendor''s HPU accumulator (vendor package): commanded by C&E I-510 when both ERS valves of LA-5102 are proven closed (vendor position switches, ASSUMED) or at the timeout (vendor closure time x 1.5, ASSUMED, H-02), whichever comes first; I-507 closes the arm isolations at the same time (review 2026-11-05-basic-design-7 #4, D-016, D-034).'}
  - {tag: UY-5137, service: LA-5103 emergency release coupler release, sheet: P-05, notes: 'Energise-to-release from the arm vendor''s HPU accumulator (vendor package): commanded by C&E I-510 when both ERS valves of LA-5103 are proven closed (vendor position switches, ASSUMED) or at the timeout (vendor closure time x 1.5, ASSUMED, H-02), whichever comes first; I-507 closes the arm isolations at the same time (review 2026-11-05-basic-design-7 #4, D-016, D-034).'}
  - {tag: UY-5138, service: LA-5104 emergency release coupler release, sheet: P-05, notes: 'Energise-to-release from the arm vendor''s HPU accumulator (vendor package): commanded by C&E I-510 when both ERS valves of LA-5104 are proven closed (vendor position switches, ASSUMED) or at the timeout (vendor closure time x 1.5, ASSUMED, H-02), whichever comes first; I-507 closes the arm isolations at the same time (review 2026-11-05-basic-design-7 #4, D-016, D-034).'}
  - {tag: HS-5109, service: Berth 2 ERS function test enable (arm vendor panel), sheet: P-05, notes: 'Enables the arm vendor''s ERS test function of SEQ-LOAD S1; permitted only with XV-5101 proven closed (ZSC-5101), UZ-5101 de-energised and every arm stowed (ZS-5151..5154), C&E I-509, so the test can never close an ERS valve during a transfer (review 2026-11-05-basic-design-7 #5, D-034).'}
  - {tag: PI-5105, service: Berth 2 vapour line pressure, sheet: P-05}
  - {tag: TI-5106, service: Berth 2 vapour line temperature, sheet: P-05}
  - {tag: LIC-5111, service: Jetty drain drum D-5101 level, sheet: P-05, notes: 'Starts and stops P-5101 (level control, D-016); the high-high level is the independent LZT-5112. Since D-036 P-5101 returns into the berth header downstream of XV-5101, so its start is permitted only with XV-5101 open and the cooldown or loading flow established (SEQ-LOAD S3 / S4): the drum is emptied into the flow to the arms and the carrier at the start of the next transfer, never against the closed header. Since D-039 (review 2026-11-05-basic-design-9 #7) the permissive is in the loop register (LIC-5111, auto only with ZSC-5101 not closed and FIC-410x at its cooldown or loading rate, back to manual and P-5101 stopped when ZSC-5101 reads closed) and ESD-1 (I-501) stops P-5101, so it no longer dead-heads on its minimum flow.'}
  - {tag: LZT-5112, service: Jetty drain drum D-5101 independent high-high level, sheet: P-05, notes: 'Own nozzle, independent of LIC-5111: stops the drain (closes XV-5161) and alarms (C&E; review #21, H-03 A5).'}
  # ---- P-06
  - {tag: PZT-6181, service: LA-6101 outboard pressure at the carrier manifold (high back-pressure), sheet: P-06, notes: 'Carrier manifold protection (checker of D-036, D-016, D-023 (6)): pressure at the outboard end of the liquid arm, on the arm side of the inboard ERS valve XV-6131 (ASSUMED ~2 m above the carrier''s manifold flange, so ~0.1 bar of static between them; transmitter, cable and seal on the arm in the arm vendor''s package, ASSUMED, H-02). PAHH 5.0 barg (ASSUMED), 1oo2 with PZT-6184, a discrepancy between the two alarms: C&E I-602 stops the loading pumps, trips the carrier through the link and closes XV-6101. The normal pressure here is the carrier''s manifold pressure, ~2.5-3.0 barg at 12,000 m3/h (350 kPa(a) of the pump rating, D-011, with the ERS and coupler losses; the highest a carrier asks for is confirmed in the ship-shore compatibility study), against ~5.2-5.5 barg on the berth header at PZT-6103 (S3, 647.9 kPa(a) at XV-6101), so a set point 2 bar above normal leaves room for the closure rise of a carrier ESD valve below the carrier''s 10 barg (ASSUMED): 5.0 + 2.7-3.2 bar (2 rho L v / t over the trestle line and the berth header for a 30-25 s closure) + ~0.1 bar = ~8.3 barg at most (D-036). Both liquid arms LA-6101 / LA-6104 carry liquid in every transfer (the hybrid may be in vapour service), so the 1oo2 never rests on an arm that is not flowing; an arm not connected reads ~0 and leaves the other as 1oo1, alarmed.'}
  - {tag: UZ-6131, service: LA-6101 ERS valve XV-6131, sheet: P-06, notes: 'Closes on ESD-2 by C&E I-607 (5 s after I-603), not on ESD-1; I-610 then releases the coupler (D-016, D-026, D-034). Hydraulic actuator on the arm vendor''s hydraulic power unit with its accumulator (ASSUMED, vendor): instrument air does not move it, so an air failure does not close it; it closes only on I-607, from the accumulator also on a loss of the power unit, in a closure time set with the arm vendor against the surge of the arm (ASSUMED 5 s, D-023, D-028). De-energise-to-trip on two solenoid valves (2oo2, each line-monitored, a discrepancy alarms): one coil, wire or output fault de-energises one solenoid only and does not move the valve; channel A is fed from UPS A, channel B from UPS B (separate distribution, ASSUMED), each monitored (XA-6130A / XA-6130B), and the loss of either, or of one channel of any ERS valve (line monitoring of its solenoid circuit), during a liquid transfer trips ESD-1 at once (I-601); the two channels are on separate SIS output modules (ASSUMED, H-06). A solenoid stuck energised is found by the ERS function test of SEQ-LOAD S1 before every transfer (HS-6109, permitted only with no transfer and every arm stowed, C&E I-609). The coupler release UY-6135 is energise-to-release, commanded by I-610 when both ERS valves of the arm are proven closed or, if one fails to close, at a timeout from the vendor''s confirmed closure time with margin (ASSUMED 1.5 x, H-02), whichever comes first, never before the ERS close command and the closure of the arm isolations by I-607; no circuit or supply fault releases it (review 2026-11-05-basic-design-5 #3, review 6 #2, review 7 #4 / #5, D-016, D-032, D-034).'}
  - {tag: UZ-6141, service: LA-6101 ERS valve XV-6141, sheet: P-06, notes: 'Closes on ESD-2 by C&E I-607 (5 s after I-603), not on ESD-1; I-610 then releases the coupler (D-016, D-026, D-034). Hydraulic actuator on the arm vendor''s hydraulic power unit with its accumulator (ASSUMED, vendor): instrument air does not move it, so an air failure does not close it; it closes only on I-607, from the accumulator also on a loss of the power unit, in a closure time set with the arm vendor against the surge of the arm (ASSUMED 5 s, D-023, D-028). De-energise-to-trip on two solenoid valves (2oo2, each line-monitored, a discrepancy alarms): one coil, wire or output fault de-energises one solenoid only and does not move the valve; channel A is fed from UPS A, channel B from UPS B (separate distribution, ASSUMED), each monitored (XA-6130A / XA-6130B), and the loss of either, or of one channel of any ERS valve (line monitoring of its solenoid circuit), during a liquid transfer trips ESD-1 at once (I-601); the two channels are on separate SIS output modules (ASSUMED, H-06). A solenoid stuck energised is found by the ERS function test of SEQ-LOAD S1 before every transfer (HS-6109, permitted only with no transfer and every arm stowed, C&E I-609). The coupler release UY-6135 is energise-to-release, commanded by I-610 when both ERS valves of the arm are proven closed or, if one fails to close, at a timeout from the vendor''s confirmed closure time with margin (ASSUMED 1.5 x, H-02), whichever comes first, never before the ERS close command and the closure of the arm isolations by I-607; no circuit or supply fault releases it (review 2026-11-05-basic-design-5 #3, review 6 #2, review 7 #4 / #5, D-016, D-032, D-034).'}
  - {tag: ZS-6151, service: LA-6101 envelope monitoring (position of the outboard arm), sheet: P-06, notes: 'Pre-alarm, ESD-1 at stage 1 (C&E I-601), ESD-2 at stage 2 (C&E I-603, ERS by I-607). With the arm stowed in its parking position (no carrier connected) it reads stowed, not a stage (ASSUMED, arm vendor''s envelope system, H-02), so an idle berth trips nothing; leaving the stowed position ends the link''s ''no carrier connected'' mode (review 2026-11-05-basic-design-6 #5, review 7 #3, D-016, D-034).'}
  - {tag: PZT-6184, service: LA-6104 outboard pressure at the carrier manifold (high back-pressure), sheet: P-06, notes: 'Carrier manifold protection (checker of D-036, D-016, D-023 (6)): pressure at the outboard end of the liquid arm, on the arm side of the inboard ERS valve XV-6134 (ASSUMED ~2 m above the carrier''s manifold flange, so ~0.1 bar of static between them; transmitter, cable and seal on the arm in the arm vendor''s package, ASSUMED, H-02). PAHH 5.0 barg (ASSUMED), 1oo2 with PZT-6181, a discrepancy between the two alarms: C&E I-602 stops the loading pumps, trips the carrier through the link and closes XV-6101. The normal pressure here is the carrier''s manifold pressure, ~2.5-3.0 barg at 12,000 m3/h (350 kPa(a) of the pump rating, D-011, with the ERS and coupler losses; the highest a carrier asks for is confirmed in the ship-shore compatibility study), against ~5.2-5.5 barg on the berth header at PZT-6103 (S3, 647.9 kPa(a) at XV-6101), so a set point 2 bar above normal leaves room for the closure rise of a carrier ESD valve below the carrier''s 10 barg (ASSUMED): 5.0 + 2.7-3.2 bar (2 rho L v / t over the trestle line and the berth header for a 30-25 s closure) + ~0.1 bar = ~8.3 barg at most (D-036). Both liquid arms LA-6101 / LA-6104 carry liquid in every transfer (the hybrid may be in vapour service), so the 1oo2 never rests on an arm that is not flowing; an arm not connected reads ~0 and leaves the other as 1oo1, alarmed.'}
  - {tag: UZ-6134, service: LA-6104 ERS valve XV-6134, sheet: P-06, notes: 'Closes on ESD-2 by C&E I-607 (5 s after I-603), not on ESD-1; I-610 then releases the coupler (D-016, D-026, D-034). Hydraulic actuator on the arm vendor''s hydraulic power unit with its accumulator (ASSUMED, vendor): instrument air does not move it, so an air failure does not close it; it closes only on I-607, from the accumulator also on a loss of the power unit, in a closure time set with the arm vendor against the surge of the arm (ASSUMED 5 s, D-023, D-028). De-energise-to-trip on two solenoid valves (2oo2, each line-monitored, a discrepancy alarms): one coil, wire or output fault de-energises one solenoid only and does not move the valve; channel A is fed from UPS A, channel B from UPS B (separate distribution, ASSUMED), each monitored (XA-6130A / XA-6130B), and the loss of either, or of one channel of any ERS valve (line monitoring of its solenoid circuit), during a liquid transfer trips ESD-1 at once (I-601); the two channels are on separate SIS output modules (ASSUMED, H-06). A solenoid stuck energised is found by the ERS function test of SEQ-LOAD S1 before every transfer (HS-6109, permitted only with no transfer and every arm stowed, C&E I-609). The coupler release UY-6138 is energise-to-release, commanded by I-610 when both ERS valves of the arm are proven closed or, if one fails to close, at a timeout from the vendor''s confirmed closure time with margin (ASSUMED 1.5 x, H-02), whichever comes first, never before the ERS close command and the closure of the arm isolations by I-607; no circuit or supply fault releases it (review 2026-11-05-basic-design-5 #3, review 6 #2, review 7 #4 / #5, D-016, D-032, D-034).'}
  - {tag: UZ-6144, service: LA-6104 ERS valve XV-6144, sheet: P-06, notes: 'Closes on ESD-2 by C&E I-607 (5 s after I-603), not on ESD-1; I-610 then releases the coupler (D-016, D-026, D-034). Hydraulic actuator on the arm vendor''s hydraulic power unit with its accumulator (ASSUMED, vendor): instrument air does not move it, so an air failure does not close it; it closes only on I-607, from the accumulator also on a loss of the power unit, in a closure time set with the arm vendor against the surge of the arm (ASSUMED 5 s, D-023, D-028). De-energise-to-trip on two solenoid valves (2oo2, each line-monitored, a discrepancy alarms): one coil, wire or output fault de-energises one solenoid only and does not move the valve; channel A is fed from UPS A, channel B from UPS B (separate distribution, ASSUMED), each monitored (XA-6130A / XA-6130B), and the loss of either, or of one channel of any ERS valve (line monitoring of its solenoid circuit), during a liquid transfer trips ESD-1 at once (I-601); the two channels are on separate SIS output modules (ASSUMED, H-06). A solenoid stuck energised is found by the ERS function test of SEQ-LOAD S1 before every transfer (HS-6109, permitted only with no transfer and every arm stowed, C&E I-609). The coupler release UY-6138 is energise-to-release, commanded by I-610 when both ERS valves of the arm are proven closed or, if one fails to close, at a timeout from the vendor''s confirmed closure time with margin (ASSUMED 1.5 x, H-02), whichever comes first, never before the ERS close command and the closure of the arm isolations by I-607; no circuit or supply fault releases it (review 2026-11-05-basic-design-5 #3, review 6 #2, review 7 #4 / #5, D-016, D-032, D-034).'}
