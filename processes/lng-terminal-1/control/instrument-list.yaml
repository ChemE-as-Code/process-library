  - {tag: UZ-6142, service: LA-6102 ERS valve XV-6142, sheet: P-06, notes: 'Closes on ESD-2 by C&E I-607 (5 s after I-603), not on ESD-1; I-610 then releases the coupler (D-016, D-026, D-034). Hydraulic actuator on the arm vendor''s hydraulic power unit with its accumulator (ASSUMED, vendor): instrument air does not move it, so an air failure does not close it; it closes only on I-607, from the accumulator also on a loss of the power unit, in a closure time set with the arm vendor against the surge of the arm (ASSUMED 5 s, D-023, D-028). De-energise-to-trip on two solenoid valves (2oo2, each line-monitored, a discrepancy alarms): one coil, wire or output fault de-energises one solenoid only and does not move the valve; channel A is fed from UPS A, channel B from UPS B (separate distribution, ASSUMED), each monitored (XA-6130A / XA-6130B), and the loss of either, or of one channel of any ERS valve (line monitoring of its solenoid circuit), during a liquid transfer trips ESD-1 at once (I-601); the two channels are on separate SIS output modules (ASSUMED, H-06). A solenoid stuck energised is found by the ERS function test of SEQ-LOAD S1 before every transfer (HS-6109, permitted only with no transfer and every arm stowed, C&E I-609). The coupler release UY-6136 is energise-to-release, commanded by I-610 when both ERS valves of the arm are proven closed or, if one fails to close, at a timeout from the vendor''s confirmed closure time with margin (ASSUMED 1.5 x, H-02), whichever comes first, never before the ERS close command and the closure of the arm isolations by I-607; no circuit or supply fault releases it (review 2026-11-05-basic-design-5 #3, review 6 #2, review 7 #4 / #5, D-016, D-032, D-034).'}
  - {tag: ZS-6152, service: LA-6102 envelope monitoring (position of the outboard arm), sheet: P-06, notes: 'Pre-alarm, ESD-1 at stage 1 (C&E I-601), ESD-2 at stage 2 (C&E I-603, ERS by I-607). With the arm stowed in its parking position (no carrier connected) it reads stowed, not a stage (ASSUMED, arm vendor''s envelope system, H-02), so an idle berth trips nothing; leaving the stowed position ends the link''s ''no carrier connected'' mode (review 2026-11-05-basic-design-6 #5, review 7 #3, D-016, D-034).'}
  - {tag: UZ-6101, service: Berth 1 shore ESD valve XV-6101, sheet: P-06, notes: 'ESD-1 closes it in 25-30 s (ASSUMED, D-023) after the pumps have been stopped (C&E I-601, D-016); non-return valve and local air accumulator on the actuator supply (one closing stroke and a hold of at least 5 min after a loss of the air header, ASSUMED) and a speed controller on the actuator exhaust that sets the same closure time for a commanded closure and for one on air loss; on an instrument-air failure the valve holds until the air-header trip I-804 has stopped the pumps and tripped the carrier through ESD-1; it closes afterwards, on its command or as the accumulator decays, never faster than its set speed (D-016, D-028). Its SIS output holding the valve open is, with ZSC-6101, the liquid transfer state of Berth 1 (C&E I-601, I-614; D-032).'}
  - {tag: ZSC-6101, service: XV-6101 closed position, sheet: P-06, notes: 'Closed-position switch on the shore ESD valve XV-6101: XV-6101 not proven closed, or held open by UZ-6101, is the liquid transfer state of Berth 1 that arms the transfer causes of ESD-1 (I-601); proven closed and not held open arms the O2 reject I-614 (C&E; review 2026-11-05-basic-design-6 #1, D-032). Safety-system inputs only, so no loop transmitter or DCS command disarms ESD-1. Reading closed while UZ-6101 holds the valve open for longer than its stroke time raises a discrepancy alarm.'}
  - {tag: PDI-6102, service: 'Strainer SR-6102 differential pressure, indicated and alarmed (PDAH) in the control room', sheet: P-06, notes: 'The tag names the control-room function, as for the plant''s other transmitted indications (LI-8103, PI-4105): a differential pressure transmitter on the strainer (round-10 design check, D-039.9), its PDAH a DCS alarm of the same loop, no local indicator. Differential pressure across the permanent T-type strainer SR-6102 (D-039), transmitted to the control room with a PDAH (ASSUMED ~0.2 bar at 12,000 m3/h: the loss coefficient 2.0 the D-034 hydraulics take for the strainer at its PDI alarm, on ~10 kPa of velocity head at 6.8 m/s in DN 800) so the strainer is watched without anyone at the header bay during a transfer (south-end occupancy rule, D-035.14 (e); layout review 2026-11-05-basic-layout-6 #14); the basket is cleaned with no transfer on the berth.'}
  - {tag: PZT-6103, service: Berth 1 header pressure (high back-pressure), sheet: P-06, notes: 'Berth header pressure downstream of XV-6101: indication, the PAH, and in C&E I-602 an uncredited backstop at PAHH 7.0 barg (ASSUMED). Normal ~5.2-5.5 barg at 12,000 m3/h (S3, 647.9 kPa(a) at XV-6101, less the strainer). Corrected after the checker of D-036: on the header no set point fits between that normal pressure and the carrier''s 10 barg (ASSUMED) once the closure rise of a carrier ESD valve (2.7-3.2 bar, not ~0.3 bar) is allowed for; the carrier''s manifold is protected by PZT-6181 / PZT-6184 at the arms'' outboard ends, where the normal pressure is lowest (1oo2, PAHH 5.0 barg, D-036). Shore shut-off with a full tank ~12.1 barg here (scripts/terminal_sizing.py).'}
  - {tag: TI-6104, service: Berth 1 header temperature (cooldown), sheet: P-06}
  - {tag: HS-6121, service: LA-6101 isolation XV-6121, sheet: P-06, notes: 'Fail closed; closure time at least 25 s (ASSUMED, D-023) with the non-return valve and local air accumulator on the actuator supply (one closing stroke and a hold of at least 5 min after a loss of the air header, ASSUMED) and a speed controller on the actuator exhaust that sets the same closure time for a commanded closure and for one on air loss; on an instrument-air failure it holds until the air-header trip I-804 has stopped the pumps and tripped the carrier through ESD-1; it closes afterwards, on its command or as the accumulator decays, never faster than its set speed (D-016, D-028).'}
  - {tag: HS-6124, service: LA-6104 isolation XV-6124, sheet: P-06, notes: 'Fail closed; closure time at least 25 s (ASSUMED, D-023) with the non-return valve and local air accumulator on the actuator supply (one closing stroke and a hold of at least 5 min after a loss of the air header, ASSUMED) and a speed controller on the actuator exhaust that sets the same closure time for a commanded closure and for one on air loss; on an instrument-air failure it holds until the air-header trip I-804 has stopped the pumps and tripped the carrier through ESD-1; it closes afterwards, on its command or as the accumulator decays, never faster than its set speed (D-016, D-028).'}
  - {tag: HS-6123, service: LA-6103 liquid isolation XV-6123, sheet: P-06, notes: 'Open command blocked by C&E I-604 unless the other isolation XV-6125 is proven closed (ZSC-6125) and XV-6123 itself is proven closed (ZSC-6123); an open valve is never closed by it (D-026.3, D-026.14, D-028). Fail closed; closure time at least 25 s (ASSUMED, D-023) with the non-return valve and local air accumulator on the actuator supply (one closing stroke and a hold of at least 5 min after a loss of the air header, ASSUMED) and a speed controller on the actuator exhaust that sets the same closure time for a commanded closure and for one on air loss; on an instrument-air failure it holds until the air-header trip I-804 has stopped the pumps and tripped the carrier through ESD-1; it closes afterwards, on its command or as the accumulator decays, never faster than its set speed (D-016, D-028).'}
  - {tag: HS-6125, service: LA-6103 vapour isolation XV-6125 (hybrid as vapour arm), sheet: P-06, notes: 'Open command blocked by C&E I-605 unless the other isolation XV-6123 is proven closed (ZSC-6123) and XV-6125 itself is proven closed (ZSC-6125); an open valve is never closed by it (D-026.3, D-026.14, D-028). The O2 reject I-614 closes it with XV-6122 while XV-6101 is proven closed (gassing-up; D-028, D-030, D-032). Fail closed without an accumulator (opening it on an air failure could join the liquid and vapour paths of the hybrid arm); in line-up (b) its closure leaves the vapour arm XV-6122, proven open by ZSO-6122, as the return.'}
  - {tag: ZSC-6123, service: XV-6123 closed position, sheet: P-06, notes: 'Closed-position switch of the hybrid arm liquid isolation: start permissive of the other isolation, XV-6125 may open only with XV-6123 proven closed (C&E I-605); never trips an open valve (review #3, H-03 A13, D-026).'}
  - {tag: ZSC-6125, service: XV-6125 closed position, sheet: P-06, notes: 'Closed-position switch of the hybrid arm vapour isolation: start permissive of the other isolation, XV-6123 may open only with XV-6125 proven closed (C&E I-604); never trips an open valve (review #3, H-03 A13, D-026).'}
  - {tag: HS-6122, service: LA-6102 vapour arm isolation XV-6122, sheet: P-06, notes: 'Fail closed, without an accumulator. Closed, latching, with XV-6125 by the O2 reject I-614 when AI-6126 (or AI-4134) reads above 5 vol % O2 while XV-6101 is proven closed (gassing-up); during a liquid transfer (cooldown and loading) the O2 high-high trips ESD-1, I-601 (D-026.7, D-028, D-030, D-032). Proven open by ZSO-6122: not open during a liquid transfer trips ESD-1 at the start of any closure (spurious command, solenoid or output fault, air loss at the platform end of the air main), before the liquid-path valves, which hold on their accumulators, move (review 2026-11-05-basic-design-5 #2 and adversarial check, D-030). The drum vent BOG-6002 joins downstream of it, so the jetty relief path stays open.'}
  - {tag: ZSO-6122, service: XV-6122 open position, sheet: P-06, notes: 'Open-position switch on the vapour arm isolation XV-6122: not open during a liquid transfer at Berth 1 trips ESD-1 (C&E I-601) at the start of the closure; proves the vapour path open in SEQ-LOAD S1, S3 and S4 (D-030, D-032). A switch failing to not-open trips ESD-1 (safe); one stuck open is found by the command discrepancy alarm. A failed switch may be overridden for the transfer in progress only, under a permit with XV-6122 checked open locally (C&E I-601 bypass, review 2026-11-05-basic-design-6 #4); the vapour arm is needed for every transfer.'}
  - {tag: AI-6126, service: Berth 1 vapour O2 (two cells), sheet: P-06, notes: 'O2 of the carrier vapour at the berth, on the vapour arm side of XV-6122 (sample point and cells ASSUMED, analyser vendor), so it measures the carrier''s vapour whether XV-6122 is open or closed; the hybrid vapour path of line-up (b) comes from the same carrier vapour header and is only ever open beside the vapour arm (D-032), so the one point serves both. Sample fast loop returned into BOG-6001 downstream of XV-6122 (~1 Nm3/h, ASSUMED, analyser package), isolated during the vapour arm leak test of SEQ-LOAD S1 by the analyser package''s fast-loop isolation valve (vendor tag), proven closed by the package as a permissive of the leak test (review 2026-11-05-basic-design-8 #7, D-036). Two O2 cells voted 2oo2 with a discrepancy alarm: above 5 vol % O2 the reject C&E I-614 closes XV-6122 / XV-6125 and sends the return to the tanks while XV-6101 is proven closed (gassing-up), and I-614 is reset only once it reads below 5 vol %; during a liquid transfer it trips ESD-1 (I-601). AI-4134 at the tank end is the backup (D-026.7, D-032, D-034).'}
  - {tag: HS-6161, service: Header drain isolation XV-6161 to D-6101, sheet: P-06, notes: 'Opened for the header and arm drain and for the N2 purge after loading (SEQ-LOAD S6, D-026.13); fail closed (review #1, H-03 A3).'}
  - {tag: XS-6100, service: Berth 1 ship-shore ESD link, sheet: P-06, notes: 'Fibre-optic link (S-01): ESD-1 both ways: a carrier ESD trips I-601 (cause), and I-601, also when initiated by ESD-2 (I-603) or the air-header trip (I-804), trips the carrier''s ESD through it (effect; D-028). With no carrier connected the link is in its own ''no carrier connected'' mode, selectable only with every arm stowed and XV-6101 proven closed (ZSC-6101): not a trip and not a bypass, so an idle berth does not trip I-601, the shared pumps or holding; a departing carrier''s link is set to it after the arms are stowed and before the cable is disconnected (SEQ-LOAD S6; review 2026-11-05-basic-design-6 #5, D-016). The mode ends by itself when a carrier''s link cable is connected and healthy or when any arm leaves its stowed position (ZS-6151..6154); ended with no healthy link it reads trip (I-601). The open command of XV-6101 is permitted only with the link in carrier mode and healthy (C&E I-608), and the mode is alarmed whenever an arm is not stowed (review 2026-11-05-basic-design-7 #3, D-034).'}
  - {tag: HS-6100A, service: 'Berth 1 manual ESD-1 push button, control room', sheet: P-06, notes: 'Hard-wired ESD-1 push button in the control room, on its own SIS input with a normally closed contact (de-energise-to-trip, the input line-monitored), so a broken wire trips or alarms and the SOE names the station: a cause of C&E I-601 (review 2026-11-05-basic-design-7 #7, D-034).'}
  - {tag: HS-6100B, service: 'Berth 1 manual ESD-1 push button, jetty head', sheet: P-06, notes: 'Hard-wired ESD-1 push button in the jetty head, on its own SIS input with a normally closed contact (de-energise-to-trip, the input line-monitored), so a broken wire trips or alarms and the SOE names the station: a cause of C&E I-601 (review 2026-11-05-basic-design-7 #7, D-034).'}
  - {tag: HS-6100C, service: 'Berth 1 manual ESD-1 push button, loading platform', sheet: P-06, notes: 'Hard-wired ESD-1 push button in the loading platform, on its own SIS input with a normally closed contact (de-energise-to-trip, the input line-monitored), so a broken wire trips or alarms and the SOE names the station: a cause of C&E I-601 (review 2026-11-05-basic-design-7 #7, D-034).'}
  - {tag: HS-6107A, service: 'Berth 1 manual ESD-2 push button, control room', sheet: P-06, notes: 'Hard-wired ESD-2 push button in the control room, own normally closed SIS input as HS-6100A: a cause of C&E I-603 (ESD-1 at once, ERS by I-607; review 7 #7, D-034).'}
  - {tag: HS-6107B, service: 'Berth 1 manual ESD-2 push button, jetty head', sheet: P-06, notes: 'Hard-wired ESD-2 push button in the jetty head, own normally closed SIS input as HS-6100B: a cause of C&E I-603 (ESD-1 at once, ERS by I-607; review 7 #7, D-034).'}
  - {tag: HS-6107C, service: 'Berth 1 manual ESD-2 push button, loading platform', sheet: P-06, notes: 'Hard-wired ESD-2 push button in the loading platform, own normally closed SIS input as HS-6100C: a cause of C&E I-603 (ESD-1 at once, ERS by I-607; review 7 #7, D-034).'}
  - {tag: XS-6108, service: Berth 1 platform fire and gas confirmed, sheet: P-06, notes: 'Voted output of the fire and gas system for the loading platform (voting ASSUMED, F&G vendor): a cause of C&E I-601.'}
  - {tag: XA-6130A, service: Berth 1 ERS solenoid channel A, sheet: P-06, notes: 'Monitoring of channel A of the ERS solenoids: the UPS A supply (separate distribution, ASSUMED) and the line monitoring of every channel A solenoid circuit; a loss of either during a liquid transfer trips ESD-1, C&E I-601 (review 2026-11-05-basic-design-6 #2, review 7 #5, D-016, D-034).'}
  - {tag: XA-6130B, service: Berth 1 ERS solenoid channel B, sheet: P-06, notes: As XA-6130A for channel B (UPS B).}
  - {tag: UY-6135, service: LA-6101 emergency release coupler release, sheet: P-06, notes: 'Energise-to-release from the arm vendor''s HPU accumulator (vendor package): commanded by C&E I-610 when both ERS valves of LA-6101 are proven closed (vendor position switches, ASSUMED) or at the timeout (vendor closure time x 1.5, ASSUMED, H-02), whichever comes first; I-607 closes the arm isolations at the same time (review 2026-11-05-basic-design-7 #4, D-016, D-034).'}
  - {tag: UY-6136, service: LA-6102 emergency release coupler release, sheet: P-06, notes: 'Energise-to-release from the arm vendor''s HPU accumulator (vendor package): commanded by C&E I-610 when both ERS valves of LA-6102 are proven closed (vendor position switches, ASSUMED) or at the timeout (vendor closure time x 1.5, ASSUMED, H-02), whichever comes first; I-607 closes the arm isolations at the same time (review 2026-11-05-basic-design-7 #4, D-016, D-034).'}
  - {tag: UY-6137, service: LA-6103 emergency release coupler release, sheet: P-06, notes: 'Energise-to-release from the arm vendor''s HPU accumulator (vendor package): commanded by C&E I-610 when both ERS valves of LA-6103 are proven closed (vendor position switches, ASSUMED) or at the timeout (vendor closure time x 1.5, ASSUMED, H-02), whichever comes first; I-607 closes the arm isolations at the same time (review 2026-11-05-basic-design-7 #4, D-016, D-034).'}
  - {tag: UY-6138, service: LA-6104 emergency release coupler release, sheet: P-06, notes: 'Energise-to-release from the arm vendor''s HPU accumulator (vendor package): commanded by C&E I-610 when both ERS valves of LA-6104 are proven closed (vendor position switches, ASSUMED) or at the timeout (vendor closure time x 1.5, ASSUMED, H-02), whichever comes first; I-607 closes the arm isolations at the same time (review 2026-11-05-basic-design-7 #4, D-016, D-034).'}
  - {tag: HS-6109, service: Berth 1 ERS function test enable (arm vendor panel), sheet: P-06, notes: 'Enables the arm vendor''s ERS test function of SEQ-LOAD S1; permitted only with XV-6101 proven closed (ZSC-6101), UZ-6101 de-energised and every arm stowed (ZS-6151..6154), C&E I-609, so the test can never close an ERS valve during a transfer (review 2026-11-05-basic-design-7 #5, D-034).'}
  - {tag: PI-6105, service: Berth 1 vapour line pressure, sheet: P-06}
  - {tag: TI-6106, service: Berth 1 vapour line temperature, sheet: P-06}
  - {tag: LIC-6111, service: Jetty drain drum D-6101 level, sheet: P-06, notes: 'Starts and stops P-6101 (level control, D-016); the high-high level is the independent LZT-6112. Since D-036 P-6101 returns into the berth header downstream of XV-6101, so its start is permitted only with XV-6101 open and the cooldown or loading flow established (SEQ-LOAD S3 / S4): the drum is emptied into the flow to the arms and the carrier at the start of the next transfer, never against the closed header. Since D-039 (review 2026-11-05-basic-design-9 #7) the permissive is in the loop register (LIC-6111, auto only with ZSC-6101 not closed and FIC-410x at its cooldown or loading rate, back to manual and P-6101 stopped when ZSC-6101 reads closed) and ESD-1 (I-601) stops P-6101, so it no longer dead-heads on its minimum flow.'}
  - {tag: LZT-6112, service: Jetty drain drum D-6101 independent high-high level, sheet: P-06, notes: 'Own nozzle, independent of LIC-6111: stops the drain (closes XV-6161) and alarms (C&E; review #21, H-03 A5).'}
  # ---- P-07
  - {tag: TIC-7103, service: BOG temperature after the desuperheater, sheet: P-07, notes: 'LNG spray TV-7103 to -140 degC at the drum inlet, also quenching the anti-surge recycles BOG-7012 and BOG-7008 (D-010).'}
  - {tag: TSL-7115, service: TV-7103 drip tray low temperature (LNG in the tray), sheet: P-07, notes: 'Low-temperature detector in the drip tray under the desuperheater spray valve TV-7103 (Z-HA-TRAY-TV7103, 2.4 m3, 18.5 min of the 3.5 t/h spray at LNG density, D-035.7): alarm in the control room, so the operator isolates the spray within the 10 min of the tray concept (ASSUMED), before the tray overflows (layout review 2026-11-05-basic-layout-6 #9, D-036). Cabled to JB-A2-2 (layout).'}
  - {tag: PIC-7101, service: BOG suction header pressure, sheet: P-07, notes: Acts on the inlet guide vanes of K-7101A/B/C; setpoint from PIC-1110 (P-01) (D-010).}
  - {tag: PZT-7113, service: BOG compressor suction header pressure low-low (I-705A-C), sheet: P-07, notes: 'Own tapping on the common suction header BOG-7001 between D-7101 and the machines, independent of PIC-7101: at low-low suction pressure a running machine stops (C&E I-705A/B/C, D-026.5).'}
  - {tag: LIC-7102, service: D-7101 level, sheet: P-07, notes: Drains carry-over to D-8101 by LV-7102.}
  - {tag: LZT-7106, service: D-7101 level high-high, sheet: P-07, notes: Trips the BOG compressors (C&E I-701).}
  - {tag: UIC-7104A, service: K-7101A anti-surge control, sheet: P-07, notes: Vendor anti-surge system; opens UV on the recycle (D-010).}
  - {tag: UZ-7125A, service: K-7101A recycle isolation valve XV-7125A, sheet: P-07, notes: 'Fail open and open in operation and on a trip: the recycle keeps the tripped machine open to the tank system (its relief path) and the anti-surge path open on a utility failure; closed by the operator (HS) only to isolate K-7101A for maintenance (D-025).'}
  - {tag: UZ-7121A, service: K-7101A suction ESD valve XV-7121A, sheet: P-07, notes: 'Closes on a compressor trip (C&E I-701, I-702) and on every compressor stop (H-04 A9).'}
  - {tag: ZSO-7121A, service: XV-7121A open position, sheet: P-07, notes: 'C&E I-705A: a running machine stops when its suction valve leaves the open position.'}
  - {tag: UZ-7123A, service: K-7101A discharge isolation valve XV-7123A, sheet: P-07, notes: 'Fail closed; closes with XV-7121A on a compressor trip or stop, isolates the machine from the discharge header (review #11, H-04 A8/A9).'}
  - {tag: VZ-7110A, service: K-7101A vibration and bearing monitoring, sheet: P-07, notes: 'Vendor unit control panel trips of K-7101A (C&E I-702): vibration and bearings, dry gas seal, lube oil, motor protection, discharge pressure high-high below PSV-7111 (D-026.5; to be confirmed with the vendor).'}
  - {tag: UIC-7104B, service: K-7101B anti-surge control, sheet: P-07, notes: Vendor anti-surge system; opens UV on the recycle (D-010).}
  - {tag: UZ-7125B, service: K-7101B recycle isolation valve XV-7125B, sheet: P-07, notes: 'Fail open and open in operation and on a trip: the recycle keeps the tripped machine open to the tank system (its relief path) and the anti-surge path open on a utility failure; closed by the operator (HS) only to isolate K-7101B for maintenance (D-025).'}
  - {tag: UZ-7121B, service: K-7101B suction ESD valve XV-7121B, sheet: P-07, notes: 'Closes on a compressor trip (C&E I-701, I-702) and on every compressor stop (H-04 A9).'}
