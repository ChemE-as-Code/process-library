  - {tag: UZ-1102, service: T-2101 fill ESD valve XV-1102, sheet: P-01, notes: 'Closes on T-2101 high-high level or pressure (C&E I-201, I-203); closure time at least 30 s (ASSUMED, about 15 times 2L/a of the rundown, D-023.3), set by a speed controller on the actuator exhaust, with a non-return valve and a local air accumulator on the supply, so a closure on an instrument-air failure is no faster than the commanded one; with XV-1103 closed (ZSC-1103) I-102 trips the trains through XS-1100 as the closure starts, before the rundown is stopped (D-028).'}
  - {tag: UZ-1103, service: T-3101 fill ESD valve XV-1103, sheet: P-01, notes: 'Closes on T-3101 high-high level or pressure (C&E I-301, I-303); closure time at least 30 s (ASSUMED, about 15 times 2L/a of the rundown, D-023.3), set by a speed controller on the actuator exhaust, with a non-return valve and a local air accumulator on the supply, so a closure on an instrument-air failure is no faster than the commanded one; with XV-1102 closed (ZSC-1102) I-102 trips the trains through XS-1100 as the closure starts, before the rundown is stopped (D-028).'}
  - {tag: XS-1100, service: Rundown battery-limit ESD link to the trains (hard-wired), sheet: P-01, notes: 'Trip signal between the terminal SIS and the trains'' SIS at the battery limit (D-001): it trips the trains'' rundown (rundown pumps stopped or recycled inside the trains) at the instant the terminal starts to close XV-1111..1114, or XV-1102 / XV-1103 with the other tank''s fill valve closed (C&E I-101, I-102; D-023.3, D-028).'}
  - {tag: ZSC-1102, service: XV-1102 closed position, sheet: P-01, notes: 'Position switch on the T-2101 fill ESD valve XV-1102; with ZSC-1103 both closed: no tank can take the rundown (C&E I-102).'}
  - {tag: ZSC-1103, service: XV-1103 closed position, sheet: P-01, notes: 'Position switch on the T-3101 fill ESD valve XV-1103; with ZSC-1102 both closed: no tank can take the rundown (C&E I-102).'}
  - {tag: HS-1106, service: Fill selection valve XV-1106, sheet: P-01, notes: 'Operator selection (DCS), top or bottom fill (SEQ-FILL-CHANGE, make-before-break). Fail last; closure time at least 30 s (ASSUMED, D-023.3), set by a speed controller on the actuator exhaust, like the fill ESD valves, because closing the last open fill branch stops the whole rundown. Its close command is blocked by C&E I-103 while it would close the last open fill branch of the only lined-up tank (the other selection valve of the tank not commanded open for its stroke time and the other tank not taking the rundown); a closure that still runs (logic fault, bypass) is slow, and PZT-1105 trips I-102 (review 2026-11-05-basic-design-5 adversarial check, D-026.4, D-030).'}
  - {tag: HS-1107, service: Fill selection valve XV-1107, sheet: P-01, notes: 'Operator selection (DCS), top or bottom fill (SEQ-FILL-CHANGE, make-before-break). Fail last; closure time at least 30 s (ASSUMED, D-023.3), set by a speed controller on the actuator exhaust, like the fill ESD valves, because closing the last open fill branch stops the whole rundown. Its close command is blocked by C&E I-103 while it would close the last open fill branch of the only lined-up tank (the other selection valve of the tank not commanded open for its stroke time and the other tank not taking the rundown); a closure that still runs (logic fault, bypass) is slow, and PZT-1105 trips I-102 (review 2026-11-05-basic-design-5 adversarial check, D-026.4, D-030).'}
