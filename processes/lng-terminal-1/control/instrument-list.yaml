  # ---- P-04
  - {tag: PI-4155, service: 'N2 to loading line A, site N2 pressure upstream of FO-4151', sheet: P-04, notes: 'Local pressure gauge of the SEQ-LINE-EMPTY N2 station (checker of D-036), between its blocks: site N2 pressure upstream of FO-4151. In S2 PI-4155 (outer block open) reads the site N2, at 6 barg or more the ~3,500 Nm3/h minimum rate (D-039); PI-4156 reads ~2.8 barg at the design rate, ~0.1 bar above the line at PI-4163, and the orifice FO-4151 is choked while PI-4155 is at least ~1.9 times its outlet (~0.1 bar above PI-4156) in absolute terms; PI-4156 at the regulator''s lock-up (~4.7 barg) with the inner block closed shows the regulator PCV-4159 holding (D-039.9). With the station isolated both are read on rounds: a rising reading shows a passing block (the bleed is locked closed; D-039, D-039.9).'}
  - {tag: PI-4156, service: 'N2 to loading line A, injection pressure downstream of FO-4151 and PCV-4159', sheet: P-04, notes: 'Local pressure gauge of the SEQ-LINE-EMPTY N2 station (checker of D-036), between its blocks: injection pressure downstream of FO-4151 and PCV-4159. In S2 PI-4155 (outer block open) reads the site N2, at 6 barg or more the ~3,500 Nm3/h minimum rate (D-039); PI-4156 reads ~2.8 barg at the design rate, ~0.1 bar above the line at PI-4163, and the orifice FO-4151 is choked while PI-4155 is at least ~1.9 times its outlet (~0.1 bar above PI-4156) in absolute terms; PI-4156 at the regulator''s lock-up (~4.7 barg) with the inner block closed shows the regulator PCV-4159 holding (D-039.9). With the station isolated both are read on rounds: a rising reading shows a passing block (the bleed is locked closed; D-039, D-039.9).'}
  - {tag: PI-4157, service: 'N2 to loading line B, site N2 pressure upstream of FO-4152', sheet: P-04, notes: 'Local pressure gauge of the SEQ-LINE-EMPTY N2 station (checker of D-036), between its blocks: site N2 pressure upstream of FO-4152. In S2 PI-4157 (outer block open) reads the site N2, at 6 barg or more the ~3,500 Nm3/h minimum rate (D-039); PI-4158 reads ~2.8 barg at the design rate, ~0.1 bar above the line at PI-4164, and the orifice FO-4152 is choked while PI-4157 is at least ~1.9 times its outlet (~0.1 bar above PI-4158) in absolute terms; PI-4158 at the regulator''s lock-up (~4.7 barg) with the inner block closed shows the regulator PCV-4160 holding (D-039.9). With the station isolated both are read on rounds: a rising reading shows a passing block (the bleed is locked closed; D-039, D-039.9).'}
  - {tag: PI-4158, service: 'N2 to loading line B, injection pressure downstream of FO-4152 and PCV-4160', sheet: P-04, notes: 'Local pressure gauge of the SEQ-LINE-EMPTY N2 station (checker of D-036), between its blocks: injection pressure downstream of FO-4152 and PCV-4160. In S2 PI-4157 (outer block open) reads the site N2, at 6 barg or more the ~3,500 Nm3/h minimum rate (D-039); PI-4158 reads ~2.8 barg at the design rate, ~0.1 bar above the line at PI-4164, and the orifice FO-4152 is choked while PI-4157 is at least ~1.9 times its outlet (~0.1 bar above PI-4158) in absolute terms; PI-4158 at the regulator''s lock-up (~4.7 barg) with the inner block closed shows the regulator PCV-4160 holding (D-039.9). With the station isolated both are read on rounds: a rising reading shows a passing block (the bleed is locked closed; D-039, D-039.9).'}
  - {tag: PI-4163, service: 'N2 to loading line A, loading line pressure at its tank end (line side of CV-4151)', sheet: P-04, notes: 'Local pressure gauge of the N2 station of loading line A on the line side of the check valve CV-4151 (round-10 design check, D-039.9; was between the blocks), at the PR1 joint over the trough collection: it reads the loading line at its tank end at all times, with no valve to open, for SEQ-ESD S2 and the SEQ-LINE-EMPTY permissive and S2 (the line below the regulator''s ~4.0 barg delivered pressure at the design rate, ~2.7 barg in the displacement). Wetted by LNG at -160 degC: Class 150 austenitic stainless with its root valve inside the cold insulation of the stub (ASSUMED).'}
  - {tag: PI-4164, service: 'N2 to loading line B, loading line pressure at its tank end (line side of CV-4152)', sheet: P-04, notes: 'Local pressure gauge of the N2 station of loading line B on the line side of the check valve CV-4152 (round-10 design check, D-039.9; was between the blocks), at the PR1 joint over the trough collection: it reads the loading line at its tank end at all times, with no valve to open, for SEQ-ESD S2 and the SEQ-LINE-EMPTY permissive and S2 (the line below the regulator''s ~4.0 barg delivered pressure at the design rate, ~2.7 barg in the displacement). Wetted by LNG at -160 degC: Class 150 austenitic stainless with its root valve inside the cold insulation of the stub (ASSUMED).'}
  - {tag: HS-4131, service: De-inerting vapour A to the flare XV-4131, sheet: P-04, notes: 'Flare valve of the make-before-break switch: I-511 opens it while AI-4133 reads off-specification vapour (not while ESD-1, I-501, or the O2 reject, I-514, is tripped); I-513 closes it only once ZSO-4135 proves XV-4135 open; fail closed: on an instrument-air failure the return goes to the tanks, never from the tank header to the flare (D-017; D-026.1, review 2026-11-05-basic-design-3#1).'}
  - {tag: HS-4132, service: De-inerting vapour B to the flare XV-4132, sheet: P-04, notes: 'As HS-4131, with AI-4134, ZSO-4136 and XV-4136 (C&E I-611, I-613); fail closed: on an instrument-air failure the return goes to the tanks, never from the tank header to the flare (D-026.1, review 2026-11-05-basic-design-3#1).'}
  - {tag: HS-4135, service: Vapour return A to the tank vapour header XV-4135, sheet: P-04, notes: 'Tank-side valve of the switch: I-512 closes it only while ZSO-4131 proves XV-4131 open; ESD-1 (I-501) and the O2 reject (I-514, D-032) open it; fail open keeps the carrier vapour return (D-026).'}
  - {tag: HS-4136, service: Vapour return B to the tank vapour header XV-4136, sheet: P-04, notes: 'As HS-4135, with ZSO-4132 (C&E I-612) and ESD-1 of Berth 1 (I-601); fail open (D-026).'}
  - {tag: ZSO-4131, service: XV-4131 open position, sheet: P-04, notes: 'Position switch on the flare valve XV-4131: XV-4135 may close only with XV-4131 proven open (C&E I-512, D-026). Proven open means the switch reads open and has no standing discrepancy: a switch that reads open while its valve has been commanded closed for longer than the stroke time raises a discrepancy alarm and blocks the interlock, so a switch stuck open cannot fake the open state (review 2026-11-05-basic-design-3#4, D-028).'}
  - {tag: ZSO-4135, service: XV-4135 open position, sheet: P-04, notes: 'Position switch on the tank-side valve XV-4135: XV-4131 may close only with XV-4135 proven open (C&E I-513, D-026). Proven open means the switch reads open and has no standing discrepancy: a switch that reads open while its valve has been commanded closed for longer than the stroke time raises a discrepancy alarm and blocks the interlock, so a switch stuck open cannot fake the open state (review 2026-11-05-basic-design-3#4, D-028).'}
  - {tag: ZSO-4132, service: XV-4132 open position, sheet: P-04, notes: 'Position switch on the flare valve XV-4132: XV-4136 may close only with XV-4132 proven open (C&E I-612, D-026). Proven open means the switch reads open and has no standing discrepancy: a switch that reads open while its valve has been commanded closed for longer than the stroke time raises a discrepancy alarm and blocks the interlock, so a switch stuck open cannot fake the open state (review 2026-11-05-basic-design-3#4, D-028).'}
  - {tag: ZSO-4136, service: XV-4136 open position, sheet: P-04, notes: 'Position switch on the tank-side valve XV-4136: XV-4132 may close only with XV-4136 proven open (C&E I-613, D-026). Proven open means the switch reads open and has no standing discrepancy: a switch that reads open while its valve has been commanded closed for longer than the stroke time raises a discrepancy alarm and blocks the interlock, so a switch stuck open cannot fake the open state (review 2026-11-05-basic-design-3#4, D-028).'}
  - {tag: AI-4133, service: Vapour return A composition at the tank end (N2 / O2 / CH4), sheet: P-04, notes: 'Switches the carrier vapour make-before-break between the tank vapour header (XV-4135) and the flare (XV-4131) by C&E I-511..I-513: to the flare while N2 is high (de-inerting, gassing-up; to the flare only below 5 vol % O2), to the tanks once CH4 is on specification and O2 below 1 vol % (D-026). Two O2 cells (ASSUMED, analyser vendor), voted 2oo2 with a discrepancy alarm. The O2 reject is measured at the berth by AI-5126 (P-05), ahead of the 2.45 km transport delay to this analyser; AI-4133 is its backup: above 5 vol % O2 the O2 reject C&E I-514 closes the Berth 2 vapour arm XV-5122 and the hybrid vapour isolation XV-5125 and sends the return to the tanks (XV-4135 opens, I-513 closes XV-4131), so an O2-rich slug never goes to the flare, while XV-5101 is proven closed (ZSC-5101, gassing-up); during a liquid transfer (cooldown and loading) it trips ESD-1, I-501, which stops the flow and trips the carrier (D-026.7, D-028, D-030, D-032).'}
  - {tag: AI-4134, service: Vapour return B composition at the tank end (N2 / O2 / CH4), sheet: P-04, notes: 'As AI-4133, with XV-4136 and XV-4132; backup of the berth analyser AI-6126 (P-06); its O2 reject is C&E I-614 on XV-6122 and XV-6125 with XV-4136 opened, while XV-6101 is proven closed (ZSC-6101), and ESD-1 I-601 during a transfer (D-028, D-030, D-032).'}
  - {tag: FIC-4101, service: Loading line A flow (loading rate), sheet: P-04, notes: 'Ramps the loading up and down to the carrier''s cargo plan; FV-4101 butterfly (D-011). Its meter, on the trestle side of XV-4101, also reads the reverse flow (multipath ultrasonic, bidirectional, ASSUMED, instrument vendor): in SEQ-LINE-EMPTY with line B leaking it measures the LNG the N2 displaces back to the tank, ~450 m3/h at 4,000 Nm3/h (~390 m3/h at the 3,500 Nm3/h minimum), the N2 station flow seen from the control room; below ~100 m3/h for 5 min before the line is displaced, no N2 is entering (the abort, D-039.9). FIC-4102 the same for line A leaking.'}
  - {tag: FIC-4102, service: Loading line B flow (loading rate), sheet: P-04, notes: As FIC-4101; with line A leaking it reads the displaced LNG returning up line B in SEQ-LINE-EMPTY (D-039.9).}
  - {tag: UZ-4101, service: Loading line A tank-end ESD valve XV-4101, sheet: P-04, notes: 'ESD-1 closes it after the pumps have been stopped (C&E I-501, I-601), in 25-30 s (ASSUMED, D-023); non-return valve and local air accumulator on the actuator supply and a speed controller on its exhaust, so on an instrument-air failure it holds until the air-header trip I-804 has initiated ESD-1 and then closes no faster than its set speed (D-016, D-028). Residual case, the valve closing at spring speed with the pumps running because its non-return valve or accumulator failed: a rise in the pump header and a column separation in the trestle line, a check case of the transient analysis (D-023.4, D-030).'}
  - {tag: UZ-4102, service: Loading line B tank-end ESD valve XV-4102, sheet: P-04, notes: 'ESD-1 closes it after the pumps have been stopped (C&E I-501, I-601), in 25-30 s (ASSUMED, D-023); non-return valve and local air accumulator on the actuator supply and a speed controller on its exhaust, so on an instrument-air failure it holds until the air-header trip I-804 has initiated ESD-1 and then closes no faster than its set speed (D-016, D-028). Residual case, the valve closing at spring speed with the pumps running because its non-return valve or accumulator failed: a rise in the pump header and a column separation in the trestle line, a check case of the transient analysis (D-023.4, D-030).'}
  - {tag: UZ-4107, service: Platform crossover ESD valve XV-4107 (DN 800), sheet: P-04, notes: 'Opened in SEQ-LOAD S0, so line B reaches Berth 2 (line A Berth 1) at 6,000 m3/h; closed in holding (SEQ-HOLD). ESD-1 of either berth closes it after the pumps have been stopped (C&E I-501, I-601), so after an ESD the two trestle lines are separated at the platform and a leak upstream of a shore ESD valve is fed by one line only, in 25-30 s (ASSUMED, D-023); non-return valve and local air accumulator on the actuator supply and a speed controller on its exhaust, so on an instrument-air failure it holds until the air-header trip I-804 has initiated ESD-1 and then closes no faster than its set speed (D-016, D-028). Residual case, the valve closing at spring speed with the pumps running because its non-return valve or accumulator failed: a rise in the trestle line upstream of it and a down-surge in the berth header, which loses half its flow, a check case of the transient analysis (D-023.4, D-030). Review 2026-11-05-basic-design-7 #1, D-034. Its position is proven by ZSC-4107 / ZSO-4107 on the valve (review 2026-11-05-basic-design-8 #5, D-036): a discrepancy between UZ-4107''s command and the switches after the stroke time alarms, so a failure to close on ESD-1 (both trestle lines then feed a platform-end leak) is revealed at once.'}
  - {tag: ZSC-4107, service: XV-4107 closed position, sheet: P-04, notes: 'Position switch on the DN 800 platform crossover XV-4107 itself (review 2026-11-05-basic-design-8 #5, D-036): the complete conditions of SEQ-LOAD S0 / S3 (open) and SEQ-HOLD S1 / SEQ-ESD (closed) use it; reading otherwise than UZ-4107 commands for longer than the stroke time raises a discrepancy alarm, so a failure to close on ESD-1 or a spurious closure in loading is revealed. Closed: the two trestle lines are separated at the platform (the one-line inventory of a platform-end leak, D-034.3, D-036).'}
  - {tag: ZSO-4107, service: XV-4107 open position, sheet: P-04, notes: 'Position switch on the DN 800 platform crossover XV-4107 itself (review 2026-11-05-basic-design-8 #5, D-036): the complete conditions of SEQ-LOAD S0 / S3 (open) and SEQ-HOLD S1 / SEQ-ESD (closed) use it; reading otherwise than UZ-4107 commands for longer than the stroke time raises a discrepancy alarm, so a failure to close on ESD-1 or a spurious closure in loading is revealed. Open: both lines reach the loading berth (S0, S3).'}
  - {tag: HS-4103, service: 'Platform crossover XV-4103 (DN 250, holding bypass)', sheet: P-04, notes: 'Open in holding (circulation); closed in loading, when the DN 800 crossover XV-4107 carries the second line to the loading berth (D-008, D-034).'}
  - {tag: HS-4106, service: Tank-end crossover XV-4106, sheet: P-04, notes: Operator selection (D-008).}
  - {tag: HS-4105, service: Circulation return XV-4105, sheet: P-04, notes: Open in holding (D-008).}
  - {tag: TI-4102, service: Circulation return temperature at the tanks, sheet: P-04, notes: 'Holding: the loop is cold when the rise is under 3 K (D-008).'}
  - {tag: PI-4105, service: Loading line A pressure at the platform, sheet: P-04, notes: 'Non-intrusive pressure indication: clamp-on strain sensor on the pipe wall under the cold insulation, no process tapping (ASSUMED, instrument vendor), so no leak source is left on the trestle side of the shore ESD valve (layout review 2026-11-05-basic-layout-6 #2, D-036); indication only, the berth header pressure PZT-5103 (downstream of XV-5101) is the measured value. Should no qualified clamp-on sensor exist for -160 degC, the instrument is deleted, never tapped.'}
  - {tag: TI-4103, service: Loading line A temperature at the platform (cooldown), sheet: P-04, notes: 'Strap-on surface temperature sensor under the cold insulation, no process tapping or thermowell (layout review 2026-11-05-basic-layout-6 #2, D-036): the cooldown of the line''s platform end and the passage of the gas front in SEQ-LINE-EMPTY (D-036).'}
  - {tag: PI-4106, service: Loading line B pressure at the platform, sheet: P-04, notes: 'Non-intrusive pressure indication: clamp-on strain sensor on the pipe wall under the cold insulation, no process tapping (ASSUMED, instrument vendor), so no leak source is left on the trestle side of the shore ESD valve (layout review 2026-11-05-basic-layout-6 #2, D-036); indication only, the berth header pressure PZT-6103 (downstream of XV-6101) is the measured value. Should no qualified clamp-on sensor exist for -160 degC, the instrument is deleted, never tapped.'}
  - {tag: TI-4104, service: Loading line B temperature at the platform (cooldown), sheet: P-04, notes: 'Strap-on surface temperature sensor under the cold insulation, no process tapping or thermowell (layout review 2026-11-05-basic-layout-6 #2, D-036): the cooldown of the line''s platform end and the passage of the gas front in SEQ-LINE-EMPTY (D-036).'}
  - {tag: PI-4121, service: Vapour return A pressure at the platform, sheet: P-04}
  - {tag: TI-4122, service: Vapour return A temperature at the platform, sheet: P-04}
  - {tag: PI-4123, service: Vapour return B pressure at the platform, sheet: P-04}
  - {tag: TI-4124, service: Vapour return B temperature at the platform, sheet: P-04}
  # ---- P-05
  - {tag: PZT-5181, service: LA-5101 outboard pressure at the carrier manifold (high back-pressure), sheet: P-05, notes: 'Carrier manifold protection (checker of D-036, D-016, D-023 (6)): pressure at the outboard end of the liquid arm, on the arm side of the inboard ERS valve XV-5131 (ASSUMED ~2 m above the carrier''s manifold flange, so ~0.1 bar of static between them; transmitter, cable and seal on the arm in the arm vendor''s package, ASSUMED, H-02). PAHH 5.0 barg (ASSUMED), 1oo2 with PZT-5184, a discrepancy between the two alarms: C&E I-502 stops the loading pumps, trips the carrier through the link and closes XV-5101. The normal pressure here is the carrier''s manifold pressure, ~2.5-3.0 barg at 12,000 m3/h (350 kPa(a) of the pump rating, D-011, with the ERS and coupler losses; the highest a carrier asks for is confirmed in the ship-shore compatibility study), against ~5.2-5.5 barg on the berth header at PZT-5103 (S3, 647.9 kPa(a) at XV-5101), so a set point 2 bar above normal leaves room for the closure rise of a carrier ESD valve below the carrier''s 10 barg (ASSUMED): 5.0 + 2.7-3.2 bar (2 rho L v / t over the trestle line and the berth header for a 30-25 s closure) + ~0.1 bar = ~8.3 barg at most (D-036). Both liquid arms LA-5101 / LA-5104 carry liquid in every transfer (the hybrid may be in vapour service), so the 1oo2 never rests on an arm that is not flowing; an arm not connected reads ~0 and leaves the other as 1oo1, alarmed.'}
  - {tag: UZ-5131, service: LA-5101 ERS valve XV-5131, sheet: P-05, notes: 'Closes on ESD-2 by C&E I-507 (5 s after I-503), not on ESD-1; I-510 then releases the coupler (D-016, D-026, D-034). Hydraulic actuator on the arm vendor''s hydraulic power unit with its accumulator (ASSUMED, vendor): instrument air does not move it, so an air failure does not close it; it closes only on I-507, from the accumulator also on a loss of the power unit, in a closure time set with the arm vendor against the surge of the arm (ASSUMED 5 s, D-023, D-028). De-energise-to-trip on two solenoid valves (2oo2, each line-monitored, a discrepancy alarms): one coil, wire or output fault de-energises one solenoid only and does not move the valve; channel A is fed from UPS A, channel B from UPS B (separate distribution, ASSUMED), each monitored (XA-5130A / XA-5130B), and the loss of either, or of one channel of any ERS valve (line monitoring of its solenoid circuit), during a liquid transfer trips ESD-1 at once (I-501); the two channels are on separate SIS output modules (ASSUMED, H-06). A solenoid stuck energised is found by the ERS function test of SEQ-LOAD S1 before every transfer (HS-5109, permitted only with no transfer and every arm stowed, C&E I-509). The coupler release UY-5135 is energise-to-release, commanded by I-510 when both ERS valves of the arm are proven closed or, if one fails to close, at a timeout from the vendor''s confirmed closure time with margin (ASSUMED 1.5 x, H-02), whichever comes first, never before the ERS close command and the closure of the arm isolations by I-507; no circuit or supply fault releases it (review 2026-11-05-basic-design-5 #3, review 6 #2, review 7 #4 / #5, D-016, D-032, D-034).'}
  - {tag: UZ-5141, service: LA-5101 ERS valve XV-5141, sheet: P-05, notes: 'Closes on ESD-2 by C&E I-507 (5 s after I-503), not on ESD-1; I-510 then releases the coupler (D-016, D-026, D-034). Hydraulic actuator on the arm vendor''s hydraulic power unit with its accumulator (ASSUMED, vendor): instrument air does not move it, so an air failure does not close it; it closes only on I-507, from the accumulator also on a loss of the power unit, in a closure time set with the arm vendor against the surge of the arm (ASSUMED 5 s, D-023, D-028). De-energise-to-trip on two solenoid valves (2oo2, each line-monitored, a discrepancy alarms): one coil, wire or output fault de-energises one solenoid only and does not move the valve; channel A is fed from UPS A, channel B from UPS B (separate distribution, ASSUMED), each monitored (XA-5130A / XA-5130B), and the loss of either, or of one channel of any ERS valve (line monitoring of its solenoid circuit), during a liquid transfer trips ESD-1 at once (I-501); the two channels are on separate SIS output modules (ASSUMED, H-06). A solenoid stuck energised is found by the ERS function test of SEQ-LOAD S1 before every transfer (HS-5109, permitted only with no transfer and every arm stowed, C&E I-509). The coupler release UY-5135 is energise-to-release, commanded by I-510 when both ERS valves of the arm are proven closed or, if one fails to close, at a timeout from the vendor''s confirmed closure time with margin (ASSUMED 1.5 x, H-02), whichever comes first, never before the ERS close command and the closure of the arm isolations by I-507; no circuit or supply fault releases it (review 2026-11-05-basic-design-5 #3, review 6 #2, review 7 #4 / #5, D-016, D-032, D-034).'}
  - {tag: ZS-5151, service: LA-5101 envelope monitoring (position of the outboard arm), sheet: P-05, notes: 'Pre-alarm, ESD-1 at stage 1 (C&E I-501), ESD-2 at stage 2 (C&E I-503, ERS by I-507). With the arm stowed in its parking position (no carrier connected) it reads stowed, not a stage (ASSUMED, arm vendor''s envelope system, H-02), so an idle berth trips nothing; leaving the stowed position ends the link''s ''no carrier connected'' mode (review 2026-11-05-basic-design-6 #5, review 7 #3, D-016, D-034).'}
