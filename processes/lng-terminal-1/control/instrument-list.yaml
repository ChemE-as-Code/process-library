  - {tag: HS-2123, service: T-2101 circulation return valve XV-2123, sheet: P-02, notes: 'Opened by the operator for the tank that receives the circulation (D-008). Fail closed, and closed by the T-2101 high-high level trip I-201 as its final element with the fill ESD valve. Only if ZSC-2123 does not prove it closed after its stroke time does I-205 stop the source of the return, the circulation pumps P-2102 / P-3102 (the jetty drain pumps no longer feed it, D-036); with the return proven closed they keep running, so the circulation pump stays on its minimum flow in loading, ready to take the desuperheater spray when the loading pumps stop (in loading the spray comes from the loading header, review 2026-11-05-basic-design-8, D-036; review 2026-11-05-basic-design-5 #1, D-030). On an instrument-air failure the circulation stops: the pumps run on their fail-open minimum flow and PSV-4114 relieves the return.'}
  - {tag: ZSC-2123, service: XV-2123 closed position, sheet: P-02, notes: 'Closed-position switch on the circulation return valve XV-2123: with I-201 tripped for 15 s (its stroke time plus margin, the delay on the trip) and XV-2123 not proven closed, I-205 stops the circulation and jetty drain pumps (C&E I-205, D-030); proven closed, they keep running (spray, drum emptying). Reading closed while XV-2123 is commanded open for longer than its stroke time raises a discrepancy alarm, so a switch stuck closed is not a dormant failure (review 2026-11-05-basic-design-6 #3, D-032).'}
