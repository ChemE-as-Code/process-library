  - {tag: ZS-5152, service: LA-5102 envelope monitoring (position of the outboard arm), sheet: P-05, notes: 'Pre-alarm, ESD-1 at stage 1 (C&E I-501), ESD-2 at stage 2 (C&E I-503, ERS by I-507).'}
  - {tag: UZ-5101, service: Berth 2 shore ESD valve XV-5101, sheet: P-05, notes: 'ESD-1 closes it in 25-30 s (ASSUMED, D-023) after the pumps have been stopped (C&E I-501, D-016); non-return valve and local air accumulator on the actuator supply (one closing stroke and a hold of at least 5 min after a loss of the air header, ASSUMED) and a speed controller on the actuator exhaust that sets the same closure time for a commanded closure and for one on air loss; on an instrument-air failure the valve holds until the air-header trip I-804 has stopped the pumps and tripped the carrier through ESD-1; it closes afterwards, on its command or as the accumulator decays, never faster than its set speed (D-016, D-028).'}
  - {tag: PDI-5102, service: Strainer SR-5102 differential pressure, sheet: P-05}
  - {tag: PZT-5103, service: Berth 2 header pressure (high back-pressure), sheet: P-05, notes: High-high back-pressure at the shore manifold stops the loading (S-01; C&E I-502).}
  - {tag: TI-5104, service: Berth 2 header temperature (cooldown), sheet: P-05}
  - {tag: HS-5121, service: LA-5101 isolation XV-5121, sheet: P-05, notes: 'Fail closed; closure time at least 25 s (ASSUMED, D-023) with the non-return valve and local air accumulator on the actuator supply (one closing stroke and a hold of at least 5 min after a loss of the air header, ASSUMED) and a speed controller on the actuator exhaust that sets the same closure time for a commanded closure and for one on air loss; on an instrument-air failure it holds until the air-header trip I-804 has stopped the pumps and tripped the carrier through ESD-1; it closes afterwards, on its command or as the accumulator decays, never faster than its set speed (D-016, D-028).'}
  - {tag: HS-5124, service: LA-5104 isolation XV-5124, sheet: P-05, notes: 'Fail closed; closure time at least 25 s (ASSUMED, D-023) with the non-return valve and local air accumulator on the actuator supply (one closing stroke and a hold of at least 5 min after a loss of the air header, ASSUMED) and a speed controller on the actuator exhaust that sets the same closure time for a commanded closure and for one on air loss; on an instrument-air failure it holds until the air-header trip I-804 has stopped the pumps and tripped the carrier through ESD-1; it closes afterwards, on its command or as the accumulator decays, never faster than its set speed (D-016, D-028).'}
  - {tag: HS-5123, service: LA-5103 liquid isolation XV-5123, sheet: P-05, notes: 'Open command blocked by C&E I-504 unless the other isolation XV-5125 is proven closed (ZSC-5125) and XV-5123 itself is proven closed (ZSC-5123); an open valve is never closed by it (D-026.3, D-026.14, D-028). Fail closed; closure time at least 25 s (ASSUMED, D-023) with the non-return valve and local air accumulator on the actuator supply (one closing stroke and a hold of at least 5 min after a loss of the air header, ASSUMED) and a speed controller on the actuator exhaust that sets the same closure time for a commanded closure and for one on air loss; on an instrument-air failure it holds until the air-header trip I-804 has stopped the pumps and tripped the carrier through ESD-1; it closes afterwards, on its command or as the accumulator decays, never faster than its set speed (D-016, D-028).'}
  - {tag: HS-5125, service: LA-5103 vapour isolation XV-5125 (hybrid as vapour arm), sheet: P-05, notes: 'Open command blocked by C&E I-505 unless the other isolation XV-5123 is proven closed (ZSC-5123) and XV-5125 itself is proven closed (ZSC-5125); an open valve is never closed by it (D-026.3, D-026.14, D-028). The O2 reject I-514 closes it with XV-5122 while no liquid is transferred (gassing-up; D-028, D-030). Fail closed without an accumulator (opening it on an air failure could join the liquid and vapour paths of the hybrid arm); in line-up (b) its closure leaves the vapour arm XV-5122, proven open by ZSO-5122, as the return.'}
  - {tag: ZSC-5123, service: XV-5123 closed position, sheet: P-05, notes: 'Closed-position switch of the hybrid arm liquid isolation: start permissive of the other isolation, XV-5125 may open only with XV-5123 proven closed (C&E I-505); never trips an open valve (review #3, H-03 A13, D-026).'}
  - {tag: ZSC-5125, service: XV-5125 closed position, sheet: P-05, notes: 'Closed-position switch of the hybrid arm vapour isolation: start permissive of the other isolation, XV-5123 may open only with XV-5125 proven closed (C&E I-504); never trips an open valve (review #3, H-03 A13, D-026).'}
  - {tag: HS-5122, service: LA-5102 vapour arm isolation XV-5122, sheet: P-05, notes: 'Fail closed, without an accumulator. Closed, latching, with XV-5125 by the O2 reject I-514 when AI-4133 reads above 5 vol % O2 while no liquid is transferred (gassing-up); during a liquid transfer (cooldown and loading) the O2 high-high trips ESD-1, I-501 (D-026.7, D-028, D-030). Proven open by ZSO-5122: not open during a liquid transfer trips ESD-1 at the start of any closure (spurious command, solenoid or output fault, air loss at the platform end of the air main), before the liquid-path valves, which hold on their accumulators, move (review 2026-11-05-basic-design-5 #2 and adversarial check, D-030). The drum vent BOG-5002 joins downstream of it, so the jetty relief path stays open.'}
  - {tag: ZSO-5122, service: XV-5122 open position, sheet: P-05, notes: 'Open-position switch on the vapour arm isolation XV-5122: not open during a liquid transfer at Berth 2 trips ESD-1 (C&E I-501) at the start of the closure; proves the vapour path open in SEQ-LOAD S0, S1, S3 and S4 (D-030). A switch failing to not-open trips ESD-1 (safe); one stuck open is found by the command discrepancy alarm.'}
  - {tag: HS-5161, service: Header drain isolation XV-5161 to D-5101, sheet: P-05, notes: 'Opened for the header and arm drain and for the N2 purge after loading (SEQ-LOAD S6, D-026.13); fail closed (review #1, H-03 A3).'}
  - {tag: XS-5100, service: Berth 2 ship-shore ESD link, sheet: P-05, notes: 'Fibre-optic link (S-01): ESD-1 both ways: a carrier ESD trips I-501 (cause), and I-501, also when initiated by ESD-2 (I-503) or the air-header trip (I-804), trips the carrier''s ESD through it (effect; D-028).'}
  - {tag: PI-5105, service: Berth 2 vapour line pressure, sheet: P-05}
  - {tag: TI-5106, service: Berth 2 vapour line temperature, sheet: P-05}
  - {tag: LIC-5111, service: Jetty drain drum D-5101 level, sheet: P-05, notes: 'Starts and stops P-5101 (level control, D-016); the high-high level is the independent LZT-5112.'}
  - {tag: LZT-5112, service: Jetty drain drum D-5101 independent high-high level, sheet: P-05, notes: 'Own nozzle, independent of LIC-5111: stops the drain (closes XV-5161) and alarms (C&E; review #21, H-03 A5).'}
  # ---- P-06
  - {tag: UZ-6131, service: LA-6101 ERS valve XV-6131, sheet: P-06, notes: 'Closes on ESD-2 by C&E I-607 (5 s after I-603), not on ESD-1; I-607 also releases the coupler (D-016, D-026). Hydraulic actuator on the arm vendor''s hydraulic power unit with its accumulator (ASSUMED, vendor): instrument air does not move it, so an air failure does not close it; it closes only on I-607, from the accumulator also on a loss of the power unit, in a closure time set with the arm vendor against the surge of the arm (ASSUMED 5 s, D-023, D-028). De-energise-to-trip on two solenoid valves in series (2oo2, each line-monitored, a discrepancy alarms): one coil, wire or output fault de-energises one solenoid only and does not move the valve; the solenoid supply is on the UPS and its loss trips ESD-1 at once (I-601); the coupler release is energise-to-release, after the ERS valves are proven closed (vendor), so no circuit or supply fault releases it (review 2026-11-05-basic-design-5 #3, D-016, D-030).'}
