  - {tag: PIC-1110, service: 'Tank vapour header pressure, high split: BOG compressors then PV-1110 to the flare', sheet: P-01, notes: 'Output 1 sets the BOG compressor load (PIC-7101, P-07); output 2 opens PV-1110 (D-017).'}
