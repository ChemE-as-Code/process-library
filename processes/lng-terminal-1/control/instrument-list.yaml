  - {tag: UZ-5144, service: LA-5104 ERS valve XV-5144, sheet: P-05, notes: 'Closes on ESD-2 by C&E I-507 (5 s after I-503), not on ESD-1; I-510 then releases the coupler (D-016, D-026, D-034). Hydraulic actuator on the arm vendor''s hydraulic power unit with its accumulator (ASSUMED, vendor): instrument air does not move it, so an air failure does not close it; it closes only on I-507, from the accumulator also on a loss of the power unit, in a closure time set with the arm vendor against the surge of the arm (ASSUMED 5 s, D-023, D-028). De-energise-to-trip on two solenoid valves (2oo2, each line-monitored, a discrepancy alarms): one coil, wire or output fault de-energises one solenoid only and does not move the valve; channel A is fed from UPS A, channel B from UPS B (separate distribution, ASSUMED), each monitored (XA-5130A / XA-5130B), and the loss of either, or of one channel of any ERS valve (line monitoring of its solenoid circuit), during a liquid transfer trips ESD-1 at once (I-501); the two channels are on separate SIS output modules (ASSUMED, H-06). A solenoid stuck energised is found by the ERS function test of SEQ-LOAD S1 before every transfer (HS-5109, permitted only with no transfer and every arm stowed, C&E I-509). The coupler release UY-5138 is energise-to-release, commanded by I-510 when both ERS valves of the arm are proven closed or, if one fails to close, at a timeout from the vendor''s confirmed closure time with margin (ASSUMED 1.5 x, H-02), whichever comes first, never before the ERS close command and the closure of the arm isolations by I-507; no circuit or supply fault releases it (review 2026-11-05-basic-design-5 #3, review 6 #2, review 7 #4 / #5, D-016, D-032, D-034).'}
  - {tag: ZS-5154, service: LA-5104 envelope monitoring (position of the outboard arm), sheet: P-05, notes: 'Pre-alarm, ESD-1 at stage 1 (C&E I-501), ESD-2 at stage 2 (C&E I-503, ERS by I-507). With the arm stowed in its parking position (no carrier connected) it reads stowed, not a stage (ASSUMED, arm vendor''s envelope system, H-02), so an idle berth trips nothing; leaving the stowed position ends the link''s ''no carrier connected'' mode (review 2026-11-05-basic-design-6 #5, review 7 #3, D-016, D-034).'}
