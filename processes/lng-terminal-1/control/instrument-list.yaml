  - {tag: VZ-7110B, service: K-7101B vibration and bearing monitoring, sheet: P-07, notes: 'Vendor unit control panel trips of K-7101B (C&E I-702B): vibration and bearings, dry gas seal, lube oil, motor protection, discharge pressure high-high below PSV-7111 (D-026.5; to be confirmed with the vendor).'}
  - {tag: UIC-7104C, service: K-7101C anti-surge control, sheet: P-07, notes: Vendor anti-surge system; opens UV on the recycle (D-010).}
  - {tag: UZ-7125C, service: K-7101C recycle isolation valve XV-7125C, sheet: P-07, notes: 'Fail open and open in operation and on a trip: the recycle keeps the tripped machine open to the tank system (its relief path) and the anti-surge path open on a utility failure; closed by the operator (HS) only to isolate K-7101C for maintenance (D-025).'}
  - {tag: UZ-7121C, service: K-7101C suction ESD valve XV-7121C, sheet: P-07, notes: 'Closes on a compressor trip (C&E I-701, I-702) and on every compressor stop (H-04 A9).'}
  - {tag: ZSO-7121C, service: XV-7121C open position, sheet: P-07, notes: 'C&E I-705C: a running machine stops when its suction valve leaves the open position.'}
  - {tag: UZ-7123C, service: K-7101C discharge isolation valve XV-7123C, sheet: P-07, notes: 'Fail closed; closes with XV-7121C on a compressor trip or stop, isolates the machine from the discharge header (review #11, H-04 A8/A9).'}
  - {tag: VZ-7110C, service: K-7101C vibration and bearing monitoring, sheet: P-07, notes: 'Vendor unit control panel trips of K-7101C (C&E I-702C): vibration and bearings, dry gas seal, lube oil, motor protection, discharge pressure high-high below PSV-7111 (D-026.5; to be confirmed with the vendor).'}
  - {tag: TZT-7112A, service: K-7101A discharge temperature high-high, sheet: P-07, notes: 'Trips K-7101A on high discharge temperature (review #9, H-04 A11; C&E I-703A/B/C).'}
  - {tag: TZT-7112B, service: K-7101B discharge temperature high-high, sheet: P-07, notes: 'Trips K-7101B on high discharge temperature (review #9, H-04 A11; C&E I-703A/B/C).'}
  - {tag: TZT-7112C, service: K-7101C discharge temperature high-high, sheet: P-07, notes: 'Trips K-7101C on high discharge temperature (review #9, H-04 A11; C&E I-703A/B/C).'}
