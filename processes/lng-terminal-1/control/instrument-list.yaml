# Instrument list. Schema: `cheme schema instruments`.
# Key loops and trips at stage concept; tags per DESIGN.md D-015 (ISA 5.1 letters +
# <sheet digit><nnn>). The P&IDs add the rest.
schema: cheme/instruments/v1
instruments:
  # ---- P-01
  - {tag: FI-1101, service: LNG rundown flow from the trains, sheet: P-01, notes: "Ultrasonic, for the tank inventory balance."}
  - {tag: AI-1102, service: LNG rundown density / composition, sheet: P-01, notes: "Sets top or bottom fill against the tank's density profile (rollover, D-007)."}
  # ---- P-02 (P-03 the same with 3xxx)
  - {tag: LT-2101, service: "T-2101 level (radar, primary)", sheet: P-02}
  - {tag: LZT-2102, service: "T-2101 level (independent, high-high and low-low)", sheet: P-02, notes: "C&E I-201, I-202."}
  - {tag: LTD-2103, service: T-2101 level-temperature-density profile, sheet: P-02, notes: "Rollover warning: stratification by density (D-007)."}
  - {tag: PIC-2111, service: T-2101 pressure to the BOG compressors and the flare, sheet: P-02, notes: "Split range: K-7101 load, then PV-2111 to the flare (D-017)."}
  - {tag: PZT-2112, service: "T-2101 pressure (high-high, low-low)", sheet: P-02, notes: "C&E I-203, I-204."}
  - {tag: LT-3101, service: "T-3101 level (radar, primary)", sheet: P-03}
  - {tag: LZT-3102, service: "T-3101 level (independent, high-high and low-low)", sheet: P-03}
  - {tag: PIC-3111, service: T-3101 pressure to the BOG compressors and the flare, sheet: P-03}
  # ---- P-04
  - {tag: FIC-4101, service: Loading rate (loading line A + B), sheet: P-04, notes: "Ramp-up and topping-off; set by the carrier's cargo plan."}
  - {tag: TI-4102, service: Circulation return temperature at the tank, sheet: P-04, notes: "Holding: lines cold (D-008)."}
  # ---- P-05 / P-06
  - {tag: XS-5101, service: Berth 2 ship-shore ESD link, sheet: P-05, notes: "Fibre-optic link (S-01); ESD-1 both ways, C&E I-501."}
  - {tag: ZS-5102, service: Berth 2 arm envelope monitoring (each arm), sheet: P-05, notes: "Pre-alarm, ESD-1, ESD-2 (ERS release), C&E I-502, I-503."}
  - {tag: XS-6101, service: Berth 1 ship-shore ESD link, sheet: P-06}
  # ---- P-07
  - {tag: PIC-7101, service: BOG suction header pressure, sheet: P-07, notes: "Inlet guide vanes of K-7101A/B/C."}
  - {tag: TIC-7103, service: BOG suction temperature (desuperheater), sheet: P-07, notes: "LNG spray TV-7103 to -140 degC (D-010)."}
  - {tag: UIC-7104A, service: K-7101A anti-surge, sheet: P-07}
  # ---- P-08
  - {tag: LIC-8101, service: Flare KO drum level, sheet: P-08, notes: "Starts P-8101A/B to the liquid burner."}
  - {tag: TSL-8102, service: Impoundment sump low temperature (LNG in the sump), sheet: P-08, notes: "Stops the rainwater pump P-8102, starts foam (C&E I-801)."}
