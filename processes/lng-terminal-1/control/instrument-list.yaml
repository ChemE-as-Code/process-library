  - {tag: HS-6123, service: LA-6103 liquid isolation XV-6123, sheet: P-06, notes: 'Open command blocked by C&E I-604 unless the other isolation XV-6125 is proven closed (ZSC-6125) and XV-6123 itself is proven closed (ZSC-6123); an open valve is never closed by it (D-026.3, D-026.14, D-028). Fail closed; closure time at least 25 s (ASSUMED, D-023) with the non-return valve and local air accumulator on the actuator supply (one closing stroke and a hold of at least 5 min after a loss of the air header, ASSUMED) and a speed controller on the actuator exhaust that sets the same closure time for a commanded closure and for one on air loss; on an instrument-air failure it holds until the air-header trip I-804 has stopped the pumps and tripped the carrier through ESD-1; it closes afterwards, on its command or as the accumulator decays, never faster than its set speed (D-016, D-028).'}
  - {tag: HS-6125, service: LA-6103 vapour isolation XV-6125 (hybrid as vapour arm), sheet: P-06, notes: 'Open command blocked by C&E I-605 unless the other isolation XV-6123 is proven closed (ZSC-6123) and XV-6125 itself is proven closed (ZSC-6125); an open valve is never closed by it (D-026.3, D-026.14, D-028). The O2 reject I-614 closes it with XV-6122 while no liquid is transferred (gassing-up; D-028, D-030). Fail closed without an accumulator (opening it on an air failure could join the liquid and vapour paths of the hybrid arm); in line-up (b) its closure leaves the vapour arm XV-6122, proven open by ZSO-6122, as the return.'}
  - {tag: ZSC-6123, service: XV-6123 closed position, sheet: P-06, notes: 'Closed-position switch of the hybrid arm liquid isolation: start permissive of the other isolation, XV-6125 may open only with XV-6123 proven closed (C&E I-605); never trips an open valve (review #3, H-03 A13, D-026).'}
  - {tag: ZSC-6125, service: XV-6125 closed position, sheet: P-06, notes: 'Closed-position switch of the hybrid arm vapour isolation: start permissive of the other isolation, XV-6123 may open only with XV-6125 proven closed (C&E I-604); never trips an open valve (review #3, H-03 A13, D-026).'}
  - {tag: HS-6122, service: LA-6102 vapour arm isolation XV-6122, sheet: P-06, notes: 'Fail closed, without an accumulator. Closed, latching, with XV-6125 by the O2 reject I-614 when AI-4134 reads above 5 vol % O2 while no liquid is transferred (gassing-up); during a liquid transfer (cooldown and loading) the O2 high-high trips ESD-1, I-601 (D-026.7, D-028, D-030). Proven open by ZSO-6122: not open during a liquid transfer trips ESD-1 at the start of any closure (spurious command, solenoid or output fault, air loss at the platform end of the air main), before the liquid-path valves, which hold on their accumulators, move (review 2026-11-05-basic-design-5 #2 and adversarial check, D-030). The drum vent BOG-6002 joins downstream of it, so the jetty relief path stays open.'}
  - {tag: ZSO-6122, service: XV-6122 open position, sheet: P-06, notes: 'Open-position switch on the vapour arm isolation XV-6122: not open during a liquid transfer at Berth 1 trips ESD-1 (C&E I-601) at the start of the closure; proves the vapour path open in SEQ-LOAD S0, S1, S3 and S4 (D-030). A switch failing to not-open trips ESD-1 (safe); one stuck open is found by the command discrepancy alarm.'}
  - {tag: HS-6161, service: Header drain isolation XV-6161 to D-6101, sheet: P-06, notes: 'Opened for the header and arm drain and for the N2 purge after loading (SEQ-LOAD S6, D-026.13); fail closed (review #1, H-03 A3).'}
  - {tag: XS-6100, service: Berth 1 ship-shore ESD link, sheet: P-06, notes: 'Fibre-optic link (S-01): ESD-1 both ways: a carrier ESD trips I-601 (cause), and I-601, also when initiated by ESD-2 (I-603) or the air-header trip (I-804), trips the carrier''s ESD through it (effect; D-028).'}
  - {tag: PI-6105, service: Berth 1 vapour line pressure, sheet: P-06}
  - {tag: TI-6106, service: Berth 1 vapour line temperature, sheet: P-06}
  - {tag: LIC-6111, service: Jetty drain drum D-6101 level, sheet: P-06, notes: 'Starts and stops P-6101 (level control, D-016); the high-high level is the independent LZT-6112.'}
  - {tag: LZT-6112, service: Jetty drain drum D-6101 independent high-high level, sheet: P-06, notes: 'Own nozzle, independent of LIC-6111: stops the drain (closes XV-6161) and alarms (C&E; review #21, H-03 A5).'}
