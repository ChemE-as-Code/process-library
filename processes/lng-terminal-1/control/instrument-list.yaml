  - {tag: PZT-8123A, service: 'Instrument-air header pressure low-low (I-804), transmitter A of 2oo3', sheet: P-08, notes: 'Own tapping on IA-8001, independent of PI-8122; 2oo3 with the other two: at 4.5 barg (ASSUMED; header 7 barg, the fail-closed spring-return actuators start to stroke below about 3.5 barg, ASSUMED) it initiates ESD-1 of both berths (pumps stopped, carriers tripped) and the rundown trip (trains tripped, battery-limit valves closed) before the valves move (C&E I-804, D-016, D-028).'}
  - {tag: PZT-8123B, service: 'Instrument-air header pressure low-low (I-804), transmitter B of 2oo3', sheet: P-08, notes: 'Own tapping on IA-8001, independent of PI-8122; 2oo3 with the other two: at 4.5 barg (ASSUMED; header 7 barg, the fail-closed spring-return actuators start to stroke below about 3.5 barg, ASSUMED) it initiates ESD-1 of both berths (pumps stopped, carriers tripped) and the rundown trip (trains tripped, battery-limit valves closed) before the valves move (C&E I-804, D-016, D-028).'}
