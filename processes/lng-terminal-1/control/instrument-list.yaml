  # ---- P-05
  - {tag: UZ-5131, service: LA-5101 ERS valve XV-5131, sheet: P-05, notes: 'Closes on ESD-2 by C&E I-507 (5 s after I-503), not on ESD-1; I-507 also releases the coupler (D-016, D-026). Hydraulic actuator on the arm vendor''s hydraulic power unit with its accumulator (ASSUMED, vendor): instrument air does not move it, so an air failure does not close it; it closes only on I-507, from the accumulator also on a loss of the power unit, in a closure time set with the arm vendor against the surge of the arm (ASSUMED 5 s, D-023, D-028). De-energise-to-trip on two solenoid valves in series (2oo2, each line-monitored, a discrepancy alarms): one coil, wire or output fault de-energises one solenoid only and does not move the valve; the solenoid supply is on the UPS and its loss trips ESD-1 at once (I-501); the coupler release is energise-to-release, after the ERS valves are proven closed (vendor), so no circuit or supply fault releases it (review 2026-11-05-basic-design-5 #3, D-016, D-030).'}
  - {tag: UZ-5141, service: LA-5101 ERS valve XV-5141, sheet: P-05, notes: 'Closes on ESD-2 by C&E I-507 (5 s after I-503), not on ESD-1; I-507 also releases the coupler (D-016, D-026). Hydraulic actuator on the arm vendor''s hydraulic power unit with its accumulator (ASSUMED, vendor): instrument air does not move it, so an air failure does not close it; it closes only on I-507, from the accumulator also on a loss of the power unit, in a closure time set with the arm vendor against the surge of the arm (ASSUMED 5 s, D-023, D-028). De-energise-to-trip on two solenoid valves in series (2oo2, each line-monitored, a discrepancy alarms): one coil, wire or output fault de-energises one solenoid only and does not move the valve; the solenoid supply is on the UPS and its loss trips ESD-1 at once (I-501); the coupler release is energise-to-release, after the ERS valves are proven closed (vendor), so no circuit or supply fault releases it (review 2026-11-05-basic-design-5 #3, D-016, D-030).'}
