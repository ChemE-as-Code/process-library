  - {tag: PI-8112, service: Flare header pressure, sheet: P-08}
  - {tag: FI-8111, service: Flare header purge gas flow, sheet: P-08, notes: Purge set by the orifice FO-8111.}
  - {tag: HS-8101B, service: P-8101B motor start/stop (DCS), sheet: P-08, notes: 'Tied to P-8101B (run feedback). Standby pump in auto: started and stopped from LIC-8101 through HS-8101A when selected as the duty pump (signal line); I-802 starts both pumps at high-high level (whichever is not running) and yields to I-803, which stops both at low-low level (LZT-8105, D-026.14). Hand-off-auto selector at the MCC, local stop at the pump (D-026.11).'}
  - {tag: HS-8101A, service: P-8101A motor start/stop (DCS), sheet: P-08, notes: 'Tied to P-8101A (run feedback). Duty pump in auto: started and stopped by LIC-8101 on its level band (signal line); passes the start/stop command on to HS-8101B when P-8101B is selected as the duty pump (signal line); I-802 starts both pumps at high-high level (whichever is not running) and yields to I-803, which stops both at low-low level (LZT-8105, D-026.14). Hand-off-auto selector at the MCC, local stop at the pump (D-026.11).'}
  - {tag: LIC-8101, service: Flare knock-out drum level, sheet: P-08, notes: 'Starts and stops the duty pump on its level band (signal line to HS-8101A, on to HS-8101B); I-803 stops both at low-low level (LZT-8105); I-802 starts both at high-high (whichever is not running) and yields to I-803 (D-026.14).'}
  - {tag: LZT-8105, service: Flare knock-out drum level high-high and low-low (independent of LIC-8101), sheet: P-08, notes: 'Own nozzle N6 on D-8101, independent of LIC-8101: high-high (LAHH, C&E I-802) starts both pumps P-8101A/B (whichever is not running) and closes LV-7102 against liquid carry-over to FL-8101, non-latching and yielding to I-803; low-low (LALL, C&E I-803) stops P-8101A/B (D-026.14).'}
