- id: PIC-7101
  title: BOG compressor suction pressure
  purpose: Hold the suction header pressure by the inlet guide vanes of the running BOG compressors; set point from
    PIC-1110.
  section: BOG
  cases:
  - average
  - loading
  - holding
  variable: pressure
  measurement:
  - tag: PIC-7101
  controller: PIC-7101
  action: direct
  final_elements:
  - tag: K-7101A
    kind: drive
    actuator: electric
    fail: last
  targets:
  - kind: setpoint
    value: 108
    unit: kPa(a)
    provenance: assumed
    source: 'D-010: suction 108 kPa(a), ASSUMED'
  modes:
  - manual
  - auto
  normal_mode: auto
  alarms:
  - tag: PIC-7101
    condition: PAH
    response: 'Start the next compressor (holding: one, loading: two).'
  interlocks:
  - I-701
  rationale: The guide vanes of each machine take the common output; the operator starts machines by case (holding
    one, loading two, the third the spare).
- id: TIC-7103
  title: BOG temperature after the desuperheater
  purpose: Cool the return vapour to -140 degC at the suction drum inlet with an LNG spray.
  section: BOG
  cases:
  - average
  - loading
  - holding
  variable: temperature
  measurement:
  - tag: TIC-7103
  controller: TIC-7103
  action: direct
  final_elements:
  - tag: TV-7103
    kind: valve
    actuator: pneumatic
    fail: closed
  targets:
  - kind: setpoint
    value: -140
    unit: °C
    provenance: assumed
    source: 'D-010: compressor suction -140 degC, ASSUMED'
  modes:
  - manual
  - auto
  normal_mode: auto
  alarms:
  - tag: TIC-7103
    condition: TAH
    response: Check the spray supply LNG-4008 and that a circulation pump runs; warm suction raises the compressor
      power.
  interlocks:
  - I-701
  rationale: Spray rate on the vapour temperature; TV fails closed so that a failure cannot flood the drum (high-high
    I-701 trips the machines).
- id: LIC-7102
  title: D-7101 level
  purpose: Drain spray carry-over from the suction drum to the flare knock-out drum.
  section: BOG
  cases:
  - average
  - loading
  - holding
  variable: level
  measurement:
