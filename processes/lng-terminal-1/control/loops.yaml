# Control loop register: the regulatory loops. Schema: `cheme schema loops`.
# PROPOSED control intent, not approved for implementation; the review status comes from reviews/.
# Trips are not loops: they go in control/cause-effect.yaml, which `interlocks` refers to.
# Basic stage: one entry per controller drawn on P-01 to P-08. Setpoints ASSUMED (D-007 to
# D-011); fail positions as drawn on the P&IDs, for the HAZOP to confirm.
schema: cheme/loops/v1
loops:
- id: PIC-1110
  title: Tank vapour header pressure, high split (BOG compressors, then the flare)
  purpose: Hold the tank pressure by setting the BOG compressor load (PIC-7101) and, above its range, by venting
    the header to the storage and loading flare through PV-1110.
  section: BOG
  cases:
  - average
  - loading
  - holding
  variable: pressure
  measurement:
  - tag: PIC-1110
  controller: PIC-1110
  action: direct
  final_elements:
  - tag: PV-1110
    kind: valve
    actuator: pneumatic
    fail: closed
  targets:
  - kind: setpoint
    value: 14
    unit: kPa(g)
    provenance: assumed
    source: 'D-007: tank operating pressure 115 kPa(a) ~ 14 kPa(g), ASSUMED'
  modes:
  - manual
  - auto
  normal_mode: auto
  alarms:
  - tag: PIC-1110
    condition: PAH
    response: Check that the BOG compressors are loaded (PIC-7101, K-7101A/B/C running); reduce the loading rate
      FIC-4101/4102 if the return vapour exceeds the machines; PV-1110 opens to the flare above the split.
  interlocks:
  - I-203
  - I-303
  rationale: 'One header pressure for both tanks: output 0-50 % raises the compressor load set point, 50-100 % opens
    PV-1110 (split range), so the flare only takes what the compressors cannot. PV-1110 fails closed: the tank PSVs
    and the high-high trips I-203 / I-303 remain.'
- id: PIC-1111
  title: Tank vapour header pressure, low split (make-up gas)
  purpose: Hold the tanks above their vacuum set point by admitting compressed BOG through PV-1111 when the pressure
    falls (fast withdrawal at loading, barometric rise).
  section: BOG
  cases:
  - average
  - loading
  - holding
  variable: pressure
  measurement:
  - tag: PIC-1111
  controller: PIC-1111
  action: reverse
  final_elements:
  - tag: PV-1111
    kind: valve
    actuator: pneumatic
    fail: closed
  targets:
  - kind: setpoint
    value: 6
    unit: kPa(g)
    provenance: assumed
    source: 'D-017: make-up below ~6 kPa(g), well above the vacuum relief at -0.5 kPa(g), ASSUMED'
  modes:
  - manual
  - auto
  normal_mode: auto
  alarms:
  - tag: PIC-1111
    condition: PAL
    response: Check the compressor discharge pressure (make-up source) and PV-1111; reduce the loading rate; the
      low-low trips I-204 / I-304 stop the withdrawal.
  interlocks:
  - I-204
  - I-304
  rationale: Make-up from the compressor discharge closes the vacuum gap without admitting air; PV-1111 fails closed
    (no gas into a tank on a failure) and the low-low trips and the vacuum relief valves stay.
- id: FIC-2111A
  title: P-2101A minimum flow
  purpose: Keep P-2101A above its minimum continuous flow by returning LNG to T-2101.
  section: STORAGE
  cases:
  - average
  - loading
  - holding
  variable: flow
  measurement:
  - tag: FIC-2111A
  controller: FIC-2111A
  action: reverse
  final_elements:
  - tag: FV-2111A
    kind: valve
    actuator: pneumatic
    fail: open
  targets:
  - kind: setpoint
    value: 900
    unit: m3/h
    provenance: assumed
    source: 'D-011: ~30 % of the 3,000 m3/h rated flow, ASSUMED (vendor minimum)'
  modes:
  - manual
  - auto
  normal_mode: auto
  alarms:
  - tag: FIC-2111A
    condition: FAL
    response: Check FV-2111A is open; stop P-2101A if the flow cannot be restored.
  interlocks:
  - I-202
  rationale: Each in-tank pump has its own minimum-flow return; FV fails open, so a failure protects the pump at
    the cost of some recirculation heat.
