    kind: drive
    actuator: electric
    fail: last
  targets:
  - kind: setpoint
    value: 108
    unit: kPa(a)
    provenance: assumed
    source: 'D-010: suction 108 kPa(a), ASSUMED'
  modes:
  - manual
  - auto
  normal_mode: auto
  alarms:
  - tag: PIC-7101
    condition: PAH
    response: 'Start the next compressor (holding: one, loading: two).'
  interlocks:
  - I-701
  rationale: The guide vanes of each machine take the common output; the operator starts machines by case (holding
    one, loading two, the third the spare).
