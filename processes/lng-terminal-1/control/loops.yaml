    fail: closed
  targets:
  - kind: setpoint
    value: 20
    unit: '%'
    provenance: assumed
    source: 'D-010: low level in a knock-out drum, ASSUMED'
  modes:
  - manual
  - auto
  normal_mode: auto
  alarms:
  - tag: LIC-7102
    condition: LAH
    response: Check LV-7102 and the spray rate TIC-7103.
  interlocks:
  - I-701
  rationale: Normally dry; LV fails closed (no gas blow-by to D-8101), with the high-high trip as the protection.
