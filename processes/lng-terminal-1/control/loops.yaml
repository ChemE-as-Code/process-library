- id: FIC-4101
  title: Loading line A flow
  purpose: Ramp the loading rate up and down to the carrier's cargo plan on loading line A (half of the up to 12,000
    m3/h each).
  section: TRANSFER
  cases:
  - average
  - loading
  variable: flow
  measurement:
  - tag: FIC-4101
  controller: FIC-4101
  action: reverse
  final_elements:
  - tag: FV-4101
    kind: valve
    actuator: pneumatic
    fail: last
  targets:
  - kind: setpoint
    value: 6000
    unit: m3/h
    provenance: assumed
    source: 'D-008, D-011: 12,000 m3/h maximum loading rate (EA application 2014 §2) split over both lines'
  modes:
  - manual
  - auto
  normal_mode: auto
  alarms:
  - tag: FIC-4101
    condition: FAH
    response: Reduce the rate; check the number of loading pumps running against the cargo plan.
  interlocks:
  - I-501
  - I-601
  rationale: Butterfly control valve at the tank end; fails in its last position, so a failure neither surges the
    line nor stops the carrier's cargo plan; the ESD valves XV-4101/4102 and the berth ESD stop it.
  operator: Ramps up after the cooldown of the arms and the carrier's manifold (SEQ-LOAD), tops off at the end on
    the carrier's request.
