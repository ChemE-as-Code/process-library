- id: LIC-5111
  title: D-5101 jetty drain drum level (P-5101 start / stop)
  purpose: Empty the Berth 2 jetty drain drum D-5101 with P-5101 into the berth header downstream of XV-5101, into
    the cooldown or loading flow of the next transfer.
  section: JETTY
  cases:
  - loading
  variable: level
  measurement:
  - tag: LIC-5111
  controller: LIC-5111
  action: direct
  final_elements:
  - tag: P-5101
    kind: drive
    actuator: electric
    fail: stop
  targets:
  - kind: high
    unresolved: drum start level from the D-n101 datasheet (detail)
  - kind: low
    unresolved: drum stop level above the pump's NPSH required (vendor)
  modes:
  - manual
  - auto
  normal_mode: auto
  transitions:
  - from: manual
    to: auto
    by: operator
    condition:
      all:
      - tag: ZSC-5101
        state: not closed
      - text: cooldown or loading flow established through XV-5101 (FIC-4101 / FIC-4102 at its rate)
  - from: auto
    to: manual
    by: automatic
    condition:
      any:
      - tag: ZSC-5101
        state: closed
      - interlock: I-501
        state: tripped
    notes: P-5101 stopped with it
  alarms:
  - tag: LIC-5111
    condition: LAH
    response: 'Drum filling with no transfer to empty it into: hold the header drain (XV-5161 closed); the independent
      LZT-5112 closes XV-5161 at high-high (I-506).'
  interlocks:
  - I-501
  - I-506
  rationale: 'Since D-036 P-5101 returns into the berth header downstream of XV-5101, so it can run only into a
    flow that leaves the platform: the loop goes to auto only with XV-5101 open and the flow established (permissive
    below), and P-5101 is stopped by ESD-1 (I-501, D-039), so it never dead-heads against the closed header.'
  operator: 'SEQ-LOAD S3: put LIC-5111 in auto once the cooldown flow runs through XV-5101; D-5101 below its low
    level before S4.'
