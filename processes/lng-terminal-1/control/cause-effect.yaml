# Cause and effect list: interlocks and trips. Schema: `cheme schema interlocks`.
# On a sheet, refer to an interlock ("see C&E I-201") instead of spelling out what it trips.
# Revised after the design review 2026-11-05-basic-design and the HAZOP H-01..H-05 (D-025).
# SIL from the screening in detail engineering (null until then).
schema: cheme/interlocks/v1
interlocks:
- id: I-101
  title: Both tanks high-high level - rundown stopped at the battery limit
  cause:
    tag: LZT-2102
    condition: LAHH
  logic:
    any:
    - all:
      - tag: LZT-2102
        state: LAHH
      - tag: LZT-3102
        state: LAHH
    - all:
      - tag: LZT-2106
        state: LAHH
