  logic:
    any:
    - tag: TSL-8102
      state: TSL (-60 degC)
    - tag: TSL-8120
      state: TSL (-60 degC)
    - tag: AT-8124
      state: gas at the pit rim (F&G voted, ASSUMED)
  effects:
  - tag: P-8102
    action: stop
  sheet: P-08
  sil: null
  latching: true
  reset: manual
  notes: 'T-8101 kept dry (review 2026-11-05-basic-design-9 #1 and its adversarial check, D-039): the pit floor falls to a
    floor pocket (~1.5 x 1.5 m, 1.2 m deep, ~2.7 m3, ASSUMED) in which the submersible P-8102 stands with its ~0.5 m submergence,
    started at 0.90 m and stopped at 0.60 m by LI-8103 through HS-8103 (loop LC-8103); the alarms and trips are on the independent
    LZT-8113; levels from the pocket floor. D-035''s 100 m3 (0.5 m) of rain allowed on the pit floor is withdrawn, so the
    2,761 m3 below the trough inlet hold the 2,400 m3 design spill with no rain. Keeps LNG out of the oily water system. The
    stop is the opening of P-8102''s motor feeder breaker by the SIS, latching, not a control stop through the MCC start circuit,
    so the submersible motor (Ex-certified, zone 1 taken for it) is de-energised before LNG or its vapour reaches it (D-036).
    Detection that sees LNG in a wet pocket (review 2026-11-05-basic-design-9 #1; D-036 had the tip at the pit floor, under
    the water the pump''s submergence keeps): TSL-8102''s tip 1.0 m above the pocket floor, above the pump''s start level,
    so in normal service it stands in air and sees LNG flowing into the pocket or lying on its water; TSL-8120, a fast-response
    probe in the P-8102 discharge upstream of CV-8114, sees LNG the pump has drawn from under the water within seconds, before
    it passes the check valve in any quantity; both at -60 degC (ASSUMED), on their own SIS inputs, voted 1oo2 (either trips).
    The rim gas detection AT-8124 (F&G voted output, ASSUMED) is a third cause, never under water. The fire and gas system
    starts the T-8101 high-expansion foam on any of the three (D-018), so the foam start no longer waits for a probe under
    water. Residual: the water in the pocket up to the start level (~2 m3 at most) is the first standing water a spill meets
    after falling ~13 m from the trough inlet (rapid phase transition and boil-off at that small mass in the open pit, for
    the siting study and the HAZOP restamp, H-05). Reset by hand only once all three read normal and the pit is confirmed
    free of LNG. The check valve CV-8114 with HV-8115 on the riser keeps the oily water system from flowing back. A burnt
    PR8 cable de-energises the pump too (D-035.4).'
