  notes: 'Dry-sump pump of T-8102 (D-037.15 (a), D-037.16): P-8103, a vertical line-shaft pump with its bowl in the floor
    pocket (~0.8 m across, 0.5 m deep, ~0.25 m3, ASSUMED) and its motor on the sump cover (no motor in the sump), 20 m3/h
    (ASSUMED) against the ~10.5 m3/h of the ASSUMED design rain; levels of LZT-8106 from the pocket floor. LNG reaching the
    sump is not to be pumped to the jetty drain. Two independent detections, voted 1oo2 (either trips): TSL-8104 in the pocket
    beside the P-8103 bowl, its tip 0.40 m above the pocket floor, above the pump''s start level, so in normal service it
    stands in air and sees LNG flowing into the pocket or lying on its water before the bowl can draw it; and TSL-8118, a
    fast-response probe in the flow of the discharge head upstream of CV-8116, which sees LNG the pump has drawn if TSL-8104
    fails to detect (D-037.17, checker of D-037.16). Both at -60 degC (ASSUMED: below the -20 degC design ambient of the empty
    pocket and head, far above LNG), on their own SIS inputs and cables. Either opens P-8103''s motor feeder through the SIS,
    latching, not a control stop; TSL-8104 also starts the high-expansion foam (D-018). With both healthy the pump is locked
    out before it can draw LNG; with TSL-8104 failed, TSL-8118 stops it within seconds of LNG reaching the head, a residual
    of those seconds of flow to the open drain (for the HAZOP restamp, H-05). Its SIL target, with I-805''s on LZT-8119, from
    the SIL screening (H-06); sil stays null until then. Reset by hand only once both read normal again and the sump is confirmed
    free of LNG (boiled off, ASSUMED). A burnt cable on the catwalk de-energises the pump too (fail safe).'
