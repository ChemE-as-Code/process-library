- id: I-611
  title: 'Vapour return B: off-specification vapour - flare valve XV-4132 opens'
  cause:
    tag: AI-4134
    condition: AAH
  logic:
    all:
    - tag: AI-4134
      state: AAH
    - interlock: I-601
      state: not tripped
    - interlock: I-614
      state: not tripped
    - tag: AI-4134
      state: O2 below 5 vol % (both cells)
    - text: 'I-614 not reset within the last 30 min (post-reset hold, ASSUMED: 1.5 line volumes of the ~1,100 m3 return at
        a gassing-up return of at least ~0.9 m3/s, agreed with the carrier)'
  effects:
  - tag: XV-4132
    action: open
  sheet: P-04
  sil: null
  latching: false
  reset: automatic
  notes: 'Carrier de-inerting and cool-down vapour (high N2, low CH4) goes to the storage and loading flare through BOG-4014
    (review #19, D-017); first half of the make-before-break switch, the tank side closes by I-612. Not while ESD-1 of the
    berth is tripped: then the return goes to the tanks (I-601 opens XV-4136, I-613 closes XV-4132), so the two never command
    XV-4132 against each other (review 2026-11-05-basic-design-3#2). Vapour above the O2 limit is rejected by I-614, and while
    I-614 is tripped XV-4132 is not opened either (the return goes to the tanks, review 2026-11-05-basic-design-6 adversarial
    check, D-032). Post-reset hold (review 2026-11-05-basic-design-7 #2, D-034): after a reset of I-614 the slug that passed
    the berth before XV-6122 closed is still in BOG-6001 / the return line; for 30 min after the reset (ASSUMED, 1.5 line
    volumes at the minimum gassing-up return agreed with the carrier) and whenever AI-4134 itself reads O2 at or above 5 vol
    %, XV-4132 is not opened, so the slug is flushed to the tanks (bounded in D-026.1), never to the flare.'
- id: I-612
  title: 'Vapour return B: tank-side valve XV-4136 closes only with XV-4132 proven open'
  cause:
    tag: ZSO-4132
    condition: open
  logic:
    all:
    - tag: AI-4134
      state: AAH
    - tag: ZSO-4132
      state: open
    - text: 'no ZSO-4132 discrepancy: ZSO-4132 did not read open while XV-4132 was commanded closed for longer than its stroke
        time'
    - interlock: I-601
      state: not tripped
    - interlock: I-614
      state: not tripped
    - tag: AI-4134
      state: O2 below 5 vol % (both cells)
    - text: I-614 not reset within the last 30 min (post-reset hold of I-611, D-034)
  effects:
  - tag: XV-4136
    action: close
  sheet: P-04
  sil: null
  latching: false
  reset: automatic
  notes: 'Make-before-break to the flare (review 2026-11-05-basic-design-2#1, D-026): XV-4136 closes only while AI-4134 reads
    off-specification, ZSO-4132 proves XV-4132 open and neither ESD-1 of the berth nor the O2 reject I-614 is tripped; any
    other state leaves XV-4136 open (fail open). Proven open: ZSO-4132 reads open and has no standing discrepancy with the
    command of XV-4132 (a switch reading open while XV-4132 has been commanded closed for longer than its stroke time raises
    an alarm and blocks this interlock), so a switch stuck open cannot fake the open flare valve (review 2026-11-05-basic-design-3#4,
    D-028).'
- id: I-613
  title: 'Vapour return B: flare valve XV-4132 closes only with XV-4136 proven open'
  cause:
    tag: ZSO-4136
    condition: open
  logic:
    all:
    - tag: ZSO-4136
      state: open
    - text: 'no ZSO-4136 discrepancy: ZSO-4136 did not read open while XV-4136 was commanded closed for longer than its stroke
        time'
    - any:
      - tag: AI-4134
        state: normal
      - interlock: I-601
        state: tripped
      - interlock: I-614
        state: tripped
  effects:
  - tag: XV-4132
    action: close
  sheet: P-04
  sil: null
  latching: false
  reset: automatic
  notes: 'Make-before-break back to the tanks (review 2026-11-05-basic-design-2#1, D-026): on on-specification vapour, on
    ESD-1 (I-601 opens XV-4136) or on the O2 reject (I-614 opens XV-4136; review 2026-11-05-basic-design-6 adversarial check,
    D-032), XV-4132 closes only once ZSO-4136 proves XV-4136 open. The vapour return is never closed at both valves. Proven
    open as in I-612: no standing discrepancy between ZSO-4136 and the command of XV-4136; while one stands, XV-4132 stays
    open with XV-4136 (the return stays open, an alarm calls the operator to confirm XV-4136 open locally before closing XV-4132
    by hand; review 2026-11-05-basic-design-3#4, D-028).'
- id: I-614
  title: 'Berth 1 vapour: oxygen above 5 vol % with no liquid transfer (gassing-up) - carrier vapour rejected at the berth,
    return to the tanks'
  cause:
    tag: AI-6126
    condition: O2 AHH (5 vol %)
  logic:
    all:
    - any:
      - vote:
          k: 2
          of:
          - tag: AI-6126
            state: O2 AHH (5 vol %), O2 cell 1
          - tag: AI-6126
            state: O2 AHH (5 vol %), O2 cell 2
        delay:
          value: 10
          unit: s
      - vote:
          k: 2
          of:
          - tag: AI-4134
            state: O2 AHH (5 vol %), O2 cell 1
          - tag: AI-4134
            state: O2 AHH (5 vol %), O2 cell 2
        delay:
          value: 10
          unit: s
    - all:
      - tag: ZSC-6101
        state: closed
      - tag: UZ-6101
        state: de-energised (close)
  effects:
  - tag: XV-6122
    action: close
  - tag: XV-6125
    action: close
  - tag: XV-4136
    action: open
  sheet: P-06
  sil: null
  latching: true
  reset: manual
  notes: 'Review 2026-11-05-basic-design-2#11, D-026.7: vapour above 5 vol % O2 is taken neither by the flare nor by the tanks;
    the vapour arm isolation XV-6122 and the hybrid vapour isolation XV-6125 (line-up (b), which joins BOG-6001 downstream
    of XV-6122) close, and the carrier vents on board under the terminal rules (S-01). The jetty relief path stays open: the
    drain drum vent BOG-6002 joins BOG-6001 downstream of XV-6122. Measured at the berth (review 2026-11-05-basic-design-6
    adversarial check, D-032): AI-6126 samples the carrier vapour on the platform, so the reject acts before the vapour enters
    the 2.45 km return; AI-4134 at the tank end stays the backup. Since review 2026-11-05-basic-design-7 #2 (D-034) its sample
    point is on the vapour arm side of XV-6122 (BOG-6001 S1), so after the trip it still reads the carrier''s vapour, not
    the gas trapped behind the closed valves: the manual reset of I-614 is permitted once both AI-6126 cells read below 5
    vol % O2, and after the reset I-611 / I-612 hold the return on the tanks for 30 min (ASSUMED), so the slug trapped downstream
    is flushed to the tanks, not to the flare (D-026.1, D-026.7). The vapour that passes the berth before XV-6122 / XV-6125
    have closed (response, vote and closure ~40 s, ASSUMED) is a slug of at most ~200 m3; the trip also opens the tank-side
    valve XV-4136, and I-613 closes the flare valve XV-4132 once ZSO-4136 proves XV-4136 open, a stroke of well under a minute
    against a transit of several minutes through the return line, so the slug goes to the tanks (bounded in D-026.1), never
    to the flare, and the return is never closed at both valves. Armed on the plant state, not on a sequence step (review
    2026-11-05-basic-design-5 #4, review 6 #1, D-030, D-032): only while XV-6101 is proven closed by ZSC-6101 and not held
    open by UZ-6101 (the exact complement of the transfer state of I-601), i.e. gassing-up in SEQ-LOAD S1 / S2 or run by hand
    outside the sequence. During a liquid transfer, the cooldown of S3 included, the same O2 high-high trips ESD-1 (I-601)
    instead, which stops the flow, trips the carrier and keeps the return open to the tanks (D-026.1). After an ESD-1 the
    reject arms only once ZSC-6101 proves XV-6101 closed, after the pump run-down and the 25-30 s closure (review 6 adversarial
    check), so the vapour return is never shut while the carrier receives LNG. The two O2 cells of each analyser (ASSUMED,
    analyser vendor) vote 2oo2 with a discrepancy alarm, so a single cell failing high does not trip; the voting is confirmed
    in the SIL screening (H-06).'
