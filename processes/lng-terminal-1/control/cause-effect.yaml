  - tag: XV-5125
    action: close
  - tag: XV-4135
    action: open
  sheet: P-05
  sil: null
  latching: true
  reset: manual
  notes: 'Review 2026-11-05-basic-design-2#11, D-026.7: vapour above 5 vol % O2 is taken neither by the flare nor by the tanks;
    the vapour arm isolation XV-5122 and the hybrid vapour isolation XV-5125 (line-up (b), which joins BOG-5001 downstream
    of XV-5122) close, and the carrier vents on board under the terminal rules (S-01). The jetty relief path stays open: the
    drain drum vent BOG-5002 joins BOG-5001 downstream of XV-5122. Measured at the berth (review 2026-11-05-basic-design-6
    adversarial check, D-032): AI-5126 samples the carrier vapour on the platform, so the reject acts before the vapour enters
    the 2.45 km return; AI-4133 at the tank end stays the backup. Since review 2026-11-05-basic-design-7 #2 (D-034) its sample
    point is on the vapour arm side of XV-5122 (BOG-5001 S1), so after the trip it still reads the carrier''s vapour, not
    the gas trapped behind the closed valves: the manual reset of I-514 is permitted only once both AI-5126 cells read below
    5 vol % O2 (the reset condition; the C&E format has no reset-condition field, so it is stated here and in SEQ-LOAD S1,
    review 2026-11-05-basic-design-8 #7), and after the reset I-511 / I-512 hold the return on the tanks until AI-4133 has
    seen the trapped slug pass (or the operator releases the hold on the carrier''s delivered return volume; D-036), so the
    slug trapped downstream is flushed to the tanks, not to the flare (D-026.1, D-026.7). The vapour that passes the berth
    before XV-5122 / XV-5125 have closed (response, vote and closure ~40 s, ASSUMED) is a slug of at most ~200 m3; the trip
    also opens the tank-side valve XV-4135, and I-513 closes the flare valve XV-4131 once ZSO-4135 proves XV-4135 open, a
    stroke of well under a minute against a transit of several minutes through the return line, so the slug goes to the tanks
    (bounded in D-026.1), never to the flare, and the return is never closed at both valves. Armed on the plant state, not
    on a sequence step (review 2026-11-05-basic-design-5 #4, review 6 #1, D-030, D-032): only while XV-5101 is proven closed
    by ZSC-5101 and not held open by UZ-5101 (the exact complement of the transfer state of I-501), i.e. gassing-up in SEQ-LOAD
    S1 / S2 or run by hand outside the sequence. During a liquid transfer, the cooldown of S3 included, the same O2 high-high
    trips ESD-1 (I-501) instead, which stops the flow, trips the carrier and keeps the return open to the tanks (D-026.1).
    After an ESD-1 the reject arms only once ZSC-5101 proves XV-5101 closed, after the pump run-down and the 25-30 s closure
    (review 6 adversarial check), so the vapour return is never shut while the carrier receives LNG. The two O2 cells of each
    analyser (ASSUMED, analyser vendor) vote 2oo2 with a discrepancy alarm, so a single cell failing high does not trip; the
    voting is confirmed in the SIL screening (H-06).'
