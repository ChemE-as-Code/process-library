    action: close
  - tag: XV-1113
    action: close
  - tag: XV-1114
    action: close
  sheet: P-01
  sil: null
  latching: true
  reset: manual
  notes: 'Review 2026-11-05-basic-design#8, H-01 A1: with both XV-1102 and XV-1103 closed the rundown header would be dead-headed
    against the trains; the battery-limit valves close and the trains are tripped through the BL interface (D-025).'
