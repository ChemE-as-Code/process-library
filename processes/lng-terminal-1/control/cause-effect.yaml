    and TSL-8118 read no LNG and the lockout I-808 is reset; I-807 has priority. Between the start and the stop the pump''s
    speed follows the level (VSD, ASSUMED), so in steady rain it runs on. When it stops, the column, the discharge head and
    the riser drain back into the pocket (~0.08 m3, ~0.16 m of pocket level; the drain-back hole of CV-8116, D-037.17), so
    nothing above the cover can freeze; in light rain below the ~6 m3/h minimum flow (ASSUMED) the pump then cycles at most
