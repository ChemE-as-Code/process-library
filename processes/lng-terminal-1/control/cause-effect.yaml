    of XV-5101, into the cooldown or loading flow of the next transfer (D-036; it no longer feeds the circulation return,
    so I-205 / I-305 do not act on it).'
- id: I-511
  title: 'Vapour return A: off-specification vapour - flare valve XV-4131 opens'
  cause:
    tag: AI-4133
    condition: AAH
  logic:
    all:
    - tag: AI-4133
      state: AAH
    - interlock: I-501
      state: not tripped
    - interlock: I-514
      state: not tripped
    - tag: AI-4133
      state: O2 below 5 vol % (both cells)
    - text: 'post-reset hold ended: since the last reset of I-514, AI-4133 has read O2 above 1 vol % and then below 1 vol
        % for 5 min (the slug passed, ASSUMED), or the operator has released the hold after the carrier confirmed 1.5 return-line
        volumes delivered (D-036)'
  effects:
  - tag: XV-4131
    action: open
  sheet: P-04
  sil: null
  latching: false
  reset: automatic
  notes: 'Carrier de-inerting and cool-down vapour (high N2, low CH4) goes to the storage and loading flare through BOG-4013
    (review #19, D-017); first half of the make-before-break switch, the tank side closes by I-512. Not while ESD-1 of the
    berth is tripped: then the return goes to the tanks (I-501 opens XV-4135, I-513 closes XV-4131), so the two never command
    XV-4131 against each other (review 2026-11-05-basic-design-3#2). Vapour above the O2 limit is rejected by I-514, and while
    I-514 is tripped XV-4131 is not opened either (the return goes to the tanks, review 2026-11-05-basic-design-6 adversarial
    check, D-032). Post-reset hold (review 2026-11-05-basic-design-7 #2, D-034; ended on a measurement since review 2026-11-05-basic-design-8
    #7, D-036): after a reset of I-514 the slug that passed the berth before XV-5122 closed is still in BOG-5001 / the return
    line; XV-4131 is not opened until AI-4133 at the tank end has seen that slug pass, its O2 risen above 1 vol % and fallen
    back below 1 vol % for 5 min (ASSUMED), so the hold no longer rests on an assumed minimum return flow; if AI-4133 sees
    no rise (a slug too small to read), the hold stays until the operator releases it, after the carrier confirms that its
    return-gas compressor has delivered at least 1.5 return-line volumes (~1,600 m3 of the ~1,060 m3 DN 750 line, ASSUMED)
    since the reset. Whenever AI-4133 itself reads O2 at or above 5 vol %, XV-4131 is not opened either, so the slug is flushed
    to the tanks (bounded in D-026.1), never to the flare.'
- id: I-512
  title: 'Vapour return A: tank-side valve XV-4135 closes only with XV-4131 proven open'
  cause:
    tag: ZSO-4131
    condition: open
  logic:
    all:
    - tag: AI-4133
      state: AAH
    - tag: ZSO-4131
      state: open
    - text: 'no ZSO-4131 discrepancy: ZSO-4131 did not read open while XV-4131 was commanded closed for longer than its stroke
        time'
    - interlock: I-501
      state: not tripped
    - interlock: I-514
      state: not tripped
    - tag: AI-4133
      state: O2 below 5 vol % (both cells)
    - text: post-reset hold of I-511 ended (AI-4133 has seen the slug pass, or released by the operator, D-036)
  effects:
  - tag: XV-4135
    action: close
  sheet: P-04
  sil: null
  latching: false
  reset: automatic
  notes: 'Make-before-break to the flare (review 2026-11-05-basic-design-2#1, D-026): XV-4135 closes only while AI-4133 reads
    off-specification, ZSO-4131 proves XV-4131 open and neither ESD-1 of the berth nor the O2 reject I-514 is tripped; any
    other state leaves XV-4135 open (fail open). Proven open: ZSO-4131 reads open and has no standing discrepancy with the
    command of XV-4131 (a switch reading open while XV-4131 has been commanded closed for longer than its stroke time raises
    an alarm and blocks this interlock), so a switch stuck open cannot fake the open flare valve (review 2026-11-05-basic-design-3#4,
    D-028).'
- id: I-513
  title: 'Vapour return A: flare valve XV-4131 closes only with XV-4135 proven open'
  cause:
    tag: ZSO-4135
    condition: open
  logic:
    all:
    - tag: ZSO-4135
      state: open
    - text: 'no ZSO-4135 discrepancy: ZSO-4135 did not read open while XV-4135 was commanded closed for longer than its stroke
        time'
    - any:
      - tag: AI-4133
        state: normal
      - interlock: I-501
        state: tripped
      - interlock: I-514
        state: tripped
  effects:
  - tag: XV-4131
    action: close
  sheet: P-04
  sil: null
