- id: I-501
  title: Berth 2 ESD-1 (ship-shore link, arm envelope stage 1, ESD-2, instrument-air header low-low, manual, fire and gas,
    vapour path, O2, ERS supply, other berth's ESD-1)
  cause:
    tag: XS-5100
    condition: trip
  logic:
    any:
    - tag: XS-5100
      state: trip (link not healthy, also once its 'no carrier connected' mode has ended because an arm left its stowed position)
    - interlock: I-503
      state: tripped
    - interlock: I-804
      state: tripped
    - tag: ZS-5151
      state: ZAH (stage 1)
    - tag: ZS-5152
      state: ZAH (stage 1)
    - tag: ZS-5153
      state: ZAH (stage 1)
    - tag: ZS-5154
      state: ZAH (stage 1)
    - tag: HS-5100A
      state: pressed (control room; normally closed contact open or input line fault)
    - tag: HS-5100B
      state: pressed (jetty head; normally closed contact open or input line fault)
    - tag: HS-5100C
      state: pressed (loading platform; normally closed contact open or input line fault)
    - tag: XS-5108
      state: fire and gas confirmed (voted output of the fire and gas system, ASSUMED, F&G vendor)
    - all:
      - any:
        - tag: ZSC-5101
          state: not closed
        - tag: UZ-5101
          state: energised (open)
      - any:
        - tag: ZSO-5122
          state: not open
        - any:
          - vote:
              k: 2
              of:
              - tag: AI-5126
                state: O2 AHH (5 vol %), O2 cell 1
              - tag: AI-5126
                state: O2 AHH (5 vol %), O2 cell 2
            delay:
              value: 10
              unit: s
          - vote:
              k: 2
              of:
              - tag: AI-4133
                state: O2 AHH (5 vol %), O2 cell 1
              - tag: AI-4133
                state: O2 AHH (5 vol %), O2 cell 2
            delay:
              value: 10
              unit: s
        - tag: XA-5130A
          state: ERS solenoid channel A lost (UPS A supply, or the line monitoring of any channel A solenoid circuit)
        - tag: XA-5130B
          state: ERS solenoid channel B lost (UPS B supply, or the line monitoring of any channel B solenoid circuit)
        - interlock: I-601
          state: tripped
  effects:
  - tag: P-2101A
    action: stop
  - tag: P-2101B
    action: stop
  - tag: P-2101C
    action: stop
  - tag: P-2101D
    action: stop
  - tag: P-3101A
    action: stop
  - tag: P-3101B
    action: stop
  - tag: P-3101C
    action: stop
  - tag: P-3101D
    action: stop
  - tag: XS-5100
    action: trip
  - tag: XV-5101
    action: close
  - tag: XV-4101
    action: close
  - tag: XV-4102
    action: close
  - tag: XV-4107
    action: close
  - tag: XV-5161
    action: close
  - tag: XV-4135
    action: open
  sheet: P-05
  sil: null
  latching: true
  reset: manual
  bypass: 'No bypass of any cause except the maintenance override of a failed ZSO-5122 (review 2026-11-05-basic-design-6 #4,
    D-032): under a permit, for the transfer in progress only (it ends by itself when ZSC-5101 proves XV-5101 closed), alarmed
    in the control room and told to the carrier, with XV-5122 confirmed open locally at the start and every hour (ASSUMED);
    not for running without the vapour arm, which every transfer needs. The ESD-1 tests of SEQ-LOAD S3 inhibit only the sequence
    abort, never this trip.'
  notes: 'Stops the loading pumps and trips the carrier''s ESD through the ship-shore link XS-5100 (effect; the link works
    both ways, S-01) at once, then closes the shore ESD valve XV-5101 in 25-30 s (surge, D-023), the tank-end XV-4101/4102
    and the DN 800 platform crossover XV-4107 (review 2026-11-05-basic-design-7 #1, D-034: after the trip the two trestle
    lines are separated at the platform, so a release upstream of a shore ESD valve is fed by one line; same closure time,
    accumulator and speed controller); the manual ESD-1 push buttons HS-5100A/B/C (control room, jetty head, platform, each
    its own normally closed input, review 7 #7), the confirmed platform fire and gas, ESD-2 (I-503, review #4) and the instrument-air
    header low-low trip I-804 (review 2026-11-05-basic-design-4 #1, D-028) also initiate it, so all of them reach the carrier.
    Since review 2026-11-05-basic-design-5 (D-030) the logic also trips during a liquid transfer at Berth 2 on: the vapour
    path not proven open (ZSO-5122, the vapour arm isolation XV-5122, at the start of any closure, which also detects an air
    loss at the platform end of the air main, XV-5122 having no accumulator); the O2 high-high of the berth analyser AI-5126
    or of AI-4133 (the O2 reject I-514 acts only with no liquid transfer); the loss of either ERS solenoid channel (XA-5130A
    or XA-5130B: its UPS supply, D-016, or since review 7 #5 the line monitoring of any one solenoid circuit of that channel
    on any ERS valve, D-034, so a transfer never runs on one channel of any valve); and ESD-1 of the other berth (I-601),
    which stops the shared pumps and closes the shared tank-end valves, so the transferring carrier is tripped through its
    own link and its return is kept open to the tanks. Liquid transfer (review 2026-11-05-basic-design-6 #1, D-032) is a state
    of safety-system inputs only: XV-5101 not proven closed by its own closed-position switch ZSC-5101, or held open by the
    SIS output UZ-5101; liquid reaches the berth only through XV-5101, so the S3 cooldown and loading are both in it, and
    no loop transmitter (FIC-4101 / FIC-4102) or DCS command can disarm these causes. A ZSC-5101 stuck closed leaves the state
    on through UZ-5101, and reading closed while UZ-5101 holds the valve open raises a discrepancy alarm. Idle berth (review
    6 #5 and adversarial check, D-016): with no carrier connected the ship-shore link is in its own ''no carrier connected''
    mode (not a bypass: selectable only with every arm stowed and XV-5101 proven closed) and the stowed arms'' envelope switches
    ZS-5151..5154 read stowed, so XS-5100 and ZS-515x are not trip causes and an idle berth never trips I-501, the shared
    pumps or holding; a carrier leaving disconnects the link only after its arms are stowed and the link is set to that mode
    (SEQ-LOAD S6). The mode ends by itself (review 2026-11-05-basic-design-7 #3, D-034): when a carrier''s link cable is connected
    and healthy (normal connection, SEQ-LOAD S1) or when any arm leaves its stowed position (ZS-5151..5154 not stowed); ended
    with no healthy link, XS-5100 reads trip and trips this ESD-1, so no carrier can be connected and loaded with the link
    in that mode. The open command of XV-5101 is also blocked unless the link is in carrier mode and healthy (I-508). Unstowing
    an arm at an idle berth without a carrier''s link therefore stops the shared pumps (safe, a production stop; arm movements
    at an idle berth are made outside the other berth''s transfers, ASSUMED operating rule). The circulation pump P-2102 /
    P-3102 is not stopped (review 6 adversarial check, D-016): in the S3 cooldown it feeds line A at 500 m3/h (~0.3 m/s in
    DN 800, so even an instant closure gives rho a v ~150 kPa, far inside the 15 barg design), it runs safely on its fail-open
    minimum flow against the closed XV-5101 / XV-4101, and it keeps the desuperheater spray and the holding circulation; the
    stop-first order of D-016 is that of the loading pumps. On an instrument-air failure the shore and tank-end ESD valves
    and the arm isolations hold on their accumulators until this trip has stopped the pumps, and then close no faster than
    their set speed; the ERS valves are hydraulic and do not move (D-016, D-028). It opens the tank-side vapour return valve
    XV-4135 and does not act on the flare valve XV-4131: the vapour return, the relief path of the berth, stays open at least
    to the tanks (review 2026-11-05-basic-design-2#1, D-026); XV-4131 then closes by I-513 once ZSO-4135 proves XV-4135 open.'
