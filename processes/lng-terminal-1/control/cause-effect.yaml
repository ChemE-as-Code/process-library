# Cause and effect list: interlocks and trips. Schema: `cheme schema interlocks`.
# On a sheet, refer to an interlock ("see C&E I-201") instead of spelling out what it trips.
# Revised after the design review 2026-11-05-basic-design and the HAZOP H-01..H-05 (D-025), and the
# follow-up reviews (D-026, D-028, D-030, D-032, D-034). Written by build/gen_ce.py.
# SIL from the screening in detail engineering (null until then).
schema: cheme/interlocks/v1
interlocks:
- id: I-101
  title: Both tanks high-high level - trains tripped, rundown stopped at the battery limit
  cause:
    tag: LZT-2102
    condition: LAHH
  logic:
    any:
    - all:
      - tag: LZT-2102
        state: LAHH
      - tag: LZT-3102
        state: LAHH
    - all:
      - tag: LZT-2106
        state: LAHH
      - tag: LZT-3106
        state: LAHH
  effects:
  - tag: XS-1100
    action: trip
  - tag: XV-1111
    action: close
  - tag: XV-1112
    action: close
  - tag: XV-1113
    action: close
  - tag: XV-1114
    action: close
  sheet: P-01
  sil: null
  latching: true
  reset: manual
  notes: 'The trains turn down or recycle on the trip signal (outside the battery limit, D-001). Closure order against the
    rundown surge (review 2026-11-05-basic-design-4, adversarial check; D-023.3, D-028): XS-1100 trips the trains'' rundown
    at the same instant as the closure starts, and XV-1111..1114 take at least 30 s to close (speed controller, about 15 times
    2L/a), so the trains'' rundown pumps are stopping or recycling before the valves throttle the flow.'
- id: I-102
  title: No tank can take the rundown (fill ESD valves closed or closing, rundown header high-high, air-header trip) - trains
    tripped, battery limit closed
  cause:
    tag: ZSC-1102
    condition: closed
  logic:
    any:
    - all:
      - tag: ZSC-1102
        state: closed
      - tag: ZSC-1103
        state: closed
    - tag: PZT-1105
      state: PAHH
    - all:
      - any:
        - interlock: I-201
          state: tripped
        - interlock: I-203
          state: tripped
      - tag: ZSC-1103
        state: closed
    - all:
      - any:
        - interlock: I-301
          state: tripped
        - interlock: I-303
          state: tripped
      - tag: ZSC-1102
        state: closed
    - interlock: I-804
      state: tripped
  effects:
  - tag: XS-1100
    action: trip
  - tag: XV-1111
    action: close
  - tag: XV-1112
    action: close
  - tag: XV-1113
    action: close
  - tag: XV-1114
    action: close
  sheet: P-01
  sil: null
  latching: true
  reset: manual
  notes: 'Review 2026-11-05-basic-design#8, H-01 A1: with both XV-1102 and XV-1103 closed the rundown header would be dead-headed
    against the trains; the trains are tripped through XS-1100 and the battery-limit valves close (D-025). PZT-1105 on LNG-1001
    also catches a branch closed by its selection valves XV-1106..1109, which the ESD valve position switches do not see (review
    2026-11-05-basic-design-2#4, D-026); the close command of the last open selection valve is blocked by I-103 and the selection
    valves close in at least 30 s (D-030). A tank trip that starts to close the only open fill valve (I-201 / I-203 with XV-1103
    closed, I-301 / I-303 with XV-1102 closed; Phase 1 with one tank, D-019) trips the trains at once, while that valve is
    still closing over its 30 s, not only once both valves are closed; the air-header trip I-804 trips the trains before any
    valve moves. Closure order against the rundown surge (review 2026-11-05-basic-design-4, adversarial check; D-023.3, D-028):
    XS-1100 trips the trains'' rundown at the same instant as the closure starts, and XV-1111..1114 take at least 30 s to
    close (speed controller, about 15 times 2L/a), so the trains'' rundown pumps are stopping or recycling before the valves
    throttle the flow.'
- id: I-103
  title: 'Fill selection: the close command of the last open fill branch is blocked (permissive)'
  cause:
    tag: HS-1106
    condition: close command
  logic:
    any:
    - all:
      - tag: XV-1106
        state: close command
      - text: XV-1107 not commanded open for its stroke time
      - any:
        - tag: ZSC-1103
          state: closed
        - text: neither XV-1108 nor XV-1109 commanded open for its stroke time
    - all:
      - tag: XV-1107
        state: close command
      - text: XV-1106 not commanded open for its stroke time
      - any:
        - tag: ZSC-1103
          state: closed
        - text: neither XV-1108 nor XV-1109 commanded open for its stroke time
    - all:
      - tag: XV-1108
        state: close command
      - text: XV-1109 not commanded open for its stroke time
      - any:
        - tag: ZSC-1102
          state: closed
        - text: neither XV-1106 nor XV-1107 commanded open for its stroke time
    - all:
      - tag: XV-1109
        state: close command
      - text: XV-1108 not commanded open for its stroke time
      - any:
        - tag: ZSC-1102
          state: closed
        - text: neither XV-1106 nor XV-1107 commanded open for its stroke time
  effects:
  - tag: HS-1106
    action: trip
  - tag: HS-1107
    action: trip
  - tag: HS-1108
    action: trip
  - tag: HS-1109
    action: trip
  sheet: P-01
  sil: null
  latching: false
  reset: automatic
  notes: 'Review 2026-11-05-basic-design-5, adversarial check (D-023.3, D-026.4, D-030): closing the last open fill selection
    valve of the only lined-up tank (always in Phase 1, and in Phase 2 when the other tank''s fill ESD valve is kept closed,
    SEQ-FILL-CHANGE) would stop the whole rundown with no train trip at the start of the closure. Permissive on the close
    command, not a trip: the effect blocks the close command of that HS (HS-1106..1109) and never moves a valve. The selection
    valves fail last and have no position switch at basic, so ''open'' is the open command held for at least the stroke time
    (ASSUMED 30 s closure, so about 35 s), as in SEQ-FILL-CHANGE S1; the other tank takes the rundown while its fill ESD valve
    is not proven closed and one of its selection valves is open. A closure that runs all the same (logic fault, bypass, an
    output fault on the fail-last actuator) is no faster than 30 s (speed controller, D-023.3) and PZT-1105 trips I-102 (XS-1100)
    on the rising header pressure; position switches on the selection valves are left to the SIL screening (D-030).'
- id: I-201
  title: T-2101 level high-high (1oo2)
  cause:
    tag: LZT-2102
    condition: LAHH
  logic:
    any:
    - tag: LZT-2102
      state: LAHH
    - tag: LZT-2106
      state: LAHH
  effects:
  - tag: XV-1102
    action: close
  - tag: XV-2123
    action: close
  sheet: P-02
  sil: null
  latching: true
  reset: manual
  notes: 'Either independent gauge trips (1oo2, review #16, H-01 A5); closes the fill XV-1102 (closure at least 30 s, D-023.3)
    and the circulation return XV-2123 into T-2101 (D-007, D-025). XV-2123 fails closed (D-028). The sources of the circulation
    return are stopped only by I-205, if ZSC-2123 does not prove XV-2123 closed after its stroke time, so the circulation
    pump keeps the desuperheater spray in loading and the jetty drain pumps can empty D-5101 / D-6101 (review 2026-11-05-basic-design-5
    #1, D-030). With the other tank''s fill valve closed, I-102 trips the trains as XV-1102 starts to close.'
- id: I-205
  title: T-2101 high-high level and circulation return XV-2123 not proven closed - sources of the return stopped
  cause:
    tag: ZSC-2123
    condition: not closed
  logic:
    all:
    - interlock: I-201
      state: tripped
      delay:
        value: 15
        unit: s
    - tag: ZSC-2123
      state: not closed
  effects:
  - tag: P-2102
    action: stop
  - tag: P-3102
    action: stop
  - tag: P-5101
    action: stop
  - tag: P-6101
    action: stop
  sheet: P-02
  sil: null
  latching: true
  reset: manual
  notes: 'Review 2026-11-05-basic-design-5 #1 (replaces the unconditional pump stops of D-028.3 in I-201): only while I-201
    has been tripped for 15 s (ASSUMED, the stroke time plus margin; the on-delay sits on the trip, not on the switch, review
    2026-11-05-basic-design-6 #3, D-032) and the closed-position switch ZSC-2123 on XV-2123 itself does not read closed are
    the circulation pumps P-2102 / P-3102 and the jetty drain pumps P-5101 / P-6101, which feed the circulation return, stopped,
    so the return cannot keep filling T-2101 through a valve that failed to close. In loading XV-2123 is already closed (SEQ-LOAD
    S0), ZSC-2123 proves it, and the spray of TV-7103 (LNG-4008 from the circulation header) and the drain pumps keep running;
    in holding the circulation pump then runs on its minimum flow against the closed return, PSV-4114 relieves the blocked-in
    return (D-030). A switch failing to not-closed stops the pumps (safe; the spray is lost and the desuperheater outlet temperature
    trips the compressors by I-703x, a production loss). A switch stuck closed would defeat this trip unseen: ZSC-2123 reading
    closed while XV-2123 is commanded open for longer than its stroke time raises a discrepancy alarm (review 6 #3).'
