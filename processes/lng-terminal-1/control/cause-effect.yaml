          state: not open
        - vote:
            k: 2
            of:
            - tag: AI-4134
              state: O2 AHH (5 vol %), O2 cell 1
            - tag: AI-4134
              state: O2 AHH (5 vol %), O2 cell 2
          delay:
            value: 10
            unit: s
        - text: ERS solenoid supply of Berth 1 lost (both channels, supply monitoring of the arm vendor's HPU)
        - interlock: I-501
          state: tripped
  effects:
  - tag: P-2101A
    action: stop
  - tag: P-2101B
    action: stop
  - tag: P-2101C
    action: stop
  - tag: P-2101D
    action: stop
  - tag: P-3101A
    action: stop
  - tag: P-3101B
    action: stop
  - tag: P-3101C
    action: stop
  - tag: P-3101D
    action: stop
  - tag: XS-6100
    action: trip
  - tag: XV-6101
    action: close
  - tag: XV-4101
    action: close
  - tag: XV-4102
    action: close
  - tag: XV-6161
    action: close
  - tag: XV-4136
    action: open
  sheet: P-06
  sil: null
  latching: true
  reset: manual
  notes: 'Stops the loading pumps and trips the carrier''s ESD through the ship-shore link XS-6100 (effect; the link works
    both ways, S-01) at once, then closes the shore ESD valve XV-6101 in 25-30 s (surge, D-023) and the tank-end XV-4101/4102;
    the manual ESD-1 push buttons (control room, jetty, platform), the confirmed platform fire and gas, ESD-2 (I-603, review
    #4) and the instrument-air header low-low trip I-804 (review 2026-11-05-basic-design-4 #1, D-028) also initiate it, so
    all of them reach the carrier. Since review 2026-11-05-basic-design-5 (D-030) the logic also trips during a liquid transfer
    at Berth 1 (XV-6101 commanded open and a loading line flow above 50 m3/h, ASSUMED; cooldown and loading) on: the vapour
    path not proven open (ZSO-6122, the vapour arm isolation XV-6122, at the start of any closure, which also detects an air
    loss at the platform end of the air main, XV-6122 having no accumulator); the O2 high-high of AI-4134 (the O2 reject I-614
    acts only with no liquid transfer); the loss of the ERS solenoid supply (both channels, D-016); and ESD-1 of the other
    berth (I-501), which stops the shared pumps and closes the shared tank-end valves, so the transferring carrier is tripped
    through its own link and its return is kept open to the tanks. On an instrument-air failure the shore and tank-end ESD
    valves and the arm isolations hold on their accumulators until this trip has stopped the pumps, and then close no faster
    than their set speed; the ERS valves are hydraulic and do not move (D-016, D-028). It opens the tank-side vapour return
    valve XV-4136 and does not act on the flare valve XV-4132: the vapour return, the relief path of the berth, stays open
    at least to the tanks (review 2026-11-05-basic-design-2#1, D-026); XV-4132 then closes by I-613 once ZSO-4136 proves XV-4136
    open.'
