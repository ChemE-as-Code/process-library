  - tag: P-6101
    action: stop
  sheet: P-02
  sil: null
  latching: true
  reset: manual
  notes: 'Review 2026-11-05-basic-design-5 #1 (replaces the unconditional pump stops of D-028.3 in I-201): only while I-201
    has tripped and the closed-position switch ZSC-2123 on XV-2123 itself does not read closed 15 s (ASSUMED, the stroke time
    plus margin) after the trip are the circulation pumps P-2102 / P-3102 and the jetty drain pumps P-5101 / P-6101, which
    feed the circulation return, stopped, so the return cannot keep filling T-2101 through a valve that failed to close. In
    loading XV-2123 is already closed (SEQ-LOAD S0), ZSC-2123 proves it, and the spray of TV-7103 (LNG-4008 from the circulation
    header) and the drain pumps keep running; in holding the circulation pump then runs on its minimum flow against the closed
