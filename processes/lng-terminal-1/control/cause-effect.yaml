    action: stop
  - tag: XV-5101
    action: close
  - tag: XV-4101
    action: close
  - tag: XV-4102
    action: close
  - tag: XV-5161
    action: close
  - tag: XV-4135
    action: open
  sheet: P-05
  sil: null
  latching: true
  reset: manual
  notes: 'Stops the loading pumps first, then closes the shore ESD valve XV-5101 in 25 s (surge, D-023) and the tank-end XV-4101/4102;
    trips the carrier''s ESD through the link both ways (S-01); manual push buttons, the platform fire and gas and ESD-2 (I-503)
