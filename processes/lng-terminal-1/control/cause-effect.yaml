- id: I-501
  title: Berth 2 ESD-1 (ship-shore link, arm envelope stage 1, ESD-2, instrument-air header low-low, manual, fire and gas,
    vapour path, O2, ERS supply, other berth's ESD-1)
  cause:
    tag: XS-5100
    condition: trip
  logic:
    any:
    - tag: XS-5100
      state: trip
    - interlock: I-503
      state: tripped
    - interlock: I-804
      state: tripped
    - tag: ZS-5151
      state: ZAH (stage 1)
    - tag: ZS-5152
      state: ZAH (stage 1)
    - tag: ZS-5153
      state: ZAH (stage 1)
    - tag: ZS-5154
      state: ZAH (stage 1)
    - text: manual ESD-1 push button (control room, jetty, platform)
    - text: platform fire and gas confirmed (voted detection of the fire and gas system, ASSUMED, F&G vendor)
    - all:
      - all:
        - tag: XV-5101
          state: open command
        - any:
          - tag: FIC-4101
            state: '> 50 m3/h (ASSUMED)'
          - tag: FIC-4102
            state: '> 50 m3/h (ASSUMED)'
      - any:
        - tag: ZSO-5122
          state: not open
        - vote:
            k: 2
            of:
            - tag: AI-4133
              state: O2 AHH (5 vol %), O2 cell 1
            - tag: AI-4133
              state: O2 AHH (5 vol %), O2 cell 2
          delay:
            value: 10
            unit: s
        - text: ERS solenoid supply of Berth 2 lost (both channels, supply monitoring of the arm vendor's HPU)
        - interlock: I-601
          state: tripped
  effects:
  - tag: P-2101A
    action: stop
  - tag: P-2101B
    action: stop
  - tag: P-2101C
    action: stop
  - tag: P-2101D
    action: stop
  - tag: P-3101A
    action: stop
  - tag: P-3101B
    action: stop
  - tag: P-3101C
    action: stop
  - tag: P-3101D
    action: stop
  - tag: XS-5100
    action: trip
  - tag: XV-5101
    action: close
  - tag: XV-4101
    action: close
  - tag: XV-4102
    action: close
  - tag: XV-5161
    action: close
  - tag: XV-4135
    action: open
  sheet: P-05
  sil: null
  latching: true
  reset: manual
  notes: 'Stops the loading pumps and trips the carrier''s ESD through the ship-shore link XS-5100 (effect; the link works
    both ways, S-01) at once, then closes the shore ESD valve XV-5101 in 25-30 s (surge, D-023) and the tank-end XV-4101/4102;
    the manual ESD-1 push buttons (control room, jetty, platform), the confirmed platform fire and gas, ESD-2 (I-503, review
    #4) and the instrument-air header low-low trip I-804 (review 2026-11-05-basic-design-4 #1, D-028) also initiate it, so
    all of them reach the carrier. Since review 2026-11-05-basic-design-5 (D-030) the logic also trips during a liquid transfer
    at Berth 2 (XV-5101 commanded open and a loading line flow above 50 m3/h, ASSUMED; cooldown and loading) on: the vapour
    path not proven open (ZSO-5122, the vapour arm isolation XV-5122, at the start of any closure, which also detects an air
    loss at the platform end of the air main, XV-5122 having no accumulator); the O2 high-high of AI-4133 (the O2 reject I-514
    acts only with no liquid transfer); the loss of the ERS solenoid supply (both channels, D-016); and ESD-1 of the other
    berth (I-601), which stops the shared pumps and closes the shared tank-end valves, so the transferring carrier is tripped
    through its own link and its return is kept open to the tanks. On an instrument-air failure the shore and tank-end ESD
    valves and the arm isolations hold on their accumulators until this trip has stopped the pumps, and then close no faster
    than their set speed; the ERS valves are hydraulic and do not move (D-016, D-028). It opens the tank-side vapour return
    valve XV-4135 and does not act on the flare valve XV-4131: the vapour return, the relief path of the berth, stays open
    at least to the tanks (review 2026-11-05-basic-design-2#1, D-026); XV-4131 then closes by I-513 once ZSO-4135 proves XV-4135
    open.'
