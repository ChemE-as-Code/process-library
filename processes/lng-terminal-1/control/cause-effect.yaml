        - tag: AI-4133
          state: O2 AHH (5 vol %), O2 cell 2
      delay:
        value: 10
        unit: s
    - text: 'no liquid transfer at Berth 2: XV-5101 not commanded open, or FIC-4101 and FIC-4102 both below 50 m3/h (ASSUMED)'
  effects:
  - tag: XV-5122
    action: close
  - tag: XV-5125
    action: close
  sheet: P-05
  sil: null
  latching: true
  reset: manual
  notes: 'Review 2026-11-05-basic-design-2#11, D-026.7: vapour above 5 vol % O2 is taken neither by the flare nor by the tanks;
    the vapour arm isolation XV-5122 and the hybrid vapour isolation XV-5125 (line-up (b), which joins BOG-5001 downstream
    of XV-5122) close, and the carrier vents on board under the terminal rules (S-01). The jetty relief path stays open: the
    drain drum vent BOG-5002 joins BOG-5001 downstream of XV-5122. Armed on the plant state, not on a sequence step (review
    2026-11-05-basic-design-5 #4, D-030): only while no liquid is transferred at Berth 2 (XV-5101 not commanded open, or both
    loading line flows below 50 m3/h, ASSUMED), i.e. gassing-up in SEQ-LOAD S1 / S2 or run by hand outside the sequence. During
    a liquid transfer, the cooldown of S3 included, the same 2oo2 O2 high-high trips ESD-1 (I-501) instead, which stops the
    flow and trips the carrier and keeps the return open to the tanks (D-026.1), so the vapour return is never shut while
    the carrier receives LNG. The two O2 cells of AI-4133 (ASSUMED, analyser vendor) vote 2oo2 with a discrepancy alarm, so
    a single cell failing high does not trip; the voting is confirmed in the SIL screening.'
- id: I-601
  title: Berth 1 ESD-1 (ship-shore link, arm envelope stage 1, ESD-2, instrument-air header low-low, manual, fire and gas,
    vapour path, O2, ERS supply, other berth's ESD-1)
  cause:
    tag: XS-6100
    condition: trip
  logic:
    any:
    - tag: XS-6100
      state: trip
    - interlock: I-603
      state: tripped
    - interlock: I-804
      state: tripped
    - tag: ZS-6151
      state: ZAH (stage 1)
    - tag: ZS-6152
      state: ZAH (stage 1)
    - tag: ZS-6153
      state: ZAH (stage 1)
    - tag: ZS-6154
      state: ZAH (stage 1)
