- id: I-802
  title: Flare knock-out drum level high-high
  cause:
    tag: LZT-8105
    condition: LAHH
  effects:
  - tag: P-8101A
    action: start
  - tag: P-8101B
    action: start
  - tag: LV-7102
    action: close
  sheet: P-08
  sil: null
  latching: false
  reset: automatic
  notes: 'Independent of LIC-8101 (review #20, H-05 A1): starts both pumps (whichever is not running starts, whichever is
    duty), and stops the D-7101 drain into the drum; carry-over to FL-8101 is the hazard. Non-latching: it clears when the
    level falls below high-high, and I-803 (low-low stop) has priority, so the pumps never cycle at low level.'
- id: I-803
  title: Flare knock-out drum level low-low - KO drum pumps stop
  cause:
    tag: LZT-8105
    condition: LALL
  effects:
  - tag: P-8101A
    action: stop
  - tag: P-8101B
    action: stop
  sheet: P-08
  sil: null
  latching: false
  reset: automatic
  notes: Dry-running protection of P-8101A/B, priority over I-802 and LIC-8101, independent of LIC-8101, which starts and
    stops the duty pump on its own level band (signal lines on P-08; review 2026-11-05-basic-design#20, H-05 A2, D-026).
- id: I-804
  title: Instrument-air header pressure low-low (2oo3) - ESD-1 of both berths and the rundown trip before the valves move
  cause:
    tag: PZT-8123A
    condition: PALL (2oo3)
  logic:
    vote:
      k: 2
      of:
      - tag: PZT-8123A
        state: PALL
      - tag: PZT-8123B
        state: PALL
      - tag: PZT-8123C
        state: PALL
  effects:
  - tag: P-2101A
    action: stop
  - tag: P-2101B
    action: stop
  - tag: P-2101C
    action: stop
  - tag: P-2101D
    action: stop
  - tag: P-3101A
    action: stop
  - tag: P-3101B
    action: stop
  - tag: P-3101C
    action: stop
  - tag: P-3101D
    action: stop
  - tag: XS-5100
    action: trip
  - tag: XS-6100
    action: trip
  - tag: XS-1100
    action: trip
  sheet: P-08
  sil: null
  latching: true
  reset: manual
  notes: 'Review 2026-11-05-basic-design-4 #1, D-016, D-028: a loss of instrument air would close every fail-closed ESD, ERS
    and arm valve while the loading pumps run, against the stop-the-pumps-first order of D-023. PZT-8123A/B/C on IA-8001 (2oo3)
    trip at 4.5 barg (ASSUMED), above the ~3.5 barg (ASSUMED) at which the spring-return actuators start to stroke: the trip
    stops the loading pumps and trips both carriers (XS-5100 / XS-6100) and the trains'' rundown (XS-1100) at once, and initiates
    ESD-1 of both berths (I-501 / I-601) and the rundown trip I-102, whose valve closures follow at their set speed. The liquid-path
    ESD valves and arm isolations hold on a non-return valve and a local air accumulator meanwhile, so a fast header loss
    cannot move them first; the ERS valves are hydraulic. The BOG compressors trip on their suction valves (I-705A-C), the
    tank pressure goes to XV-1115 (own accumulator, I-203 / I-303) and the PSVs (control philosophy F-AIR). I-502 / I-602
    are late, non-preventive safeguards and are not credited. Not on a single transmitter; a transmitter fault alarms. Latching,
    manual reset once the header is back above its normal pressure. An air loss at the platform end of the ~2.45 km jetty
    air main need not pull IA-8001 below the trip: it is detected at the berth by ZSO-5122 / ZSO-6122, because the vapour
    arm isolations XV-5122 / XV-6122 have no accumulator and are the first jetty valves to move, and their loss of the open
    position during a liquid transfer trips ESD-1 (I-501 / I-601) while the liquid-path valves still hold on their accumulators
    (review 2026-11-05-basic-design-5 #2, D-030); voted transmitters at the platform end stay a detail-engineering hold.'
