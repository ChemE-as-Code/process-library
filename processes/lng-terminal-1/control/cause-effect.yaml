- id: I-511
  title: 'Vapour return A: off-specification vapour - flare valve XV-4131 opens'
  cause:
    tag: AI-4133
    condition: AAH
  logic:
    all:
    - tag: AI-4133
      state: AAH
    - interlock: I-501
      state: not tripped
  effects:
  - tag: XV-4131
    action: open
  sheet: P-04
  sil: null
  latching: false
  reset: automatic
  notes: 'Carrier de-inerting and cool-down vapour (high N2, low CH4) goes to the storage and loading flare through BOG-4013
    (review #19, D-017); first half of the make-before-break switch, the tank side closes by I-512. Not while ESD-1 of the
    berth is tripped: then the return goes to the tanks (I-501 opens XV-4135, I-513 closes XV-4131), so the two never command
    XV-4131 against each other (review 2026-11-05-basic-design-3#2). Vapour above the O2 limit is rejected by I-514.'
- id: I-512
  title: 'Vapour return A: tank-side valve XV-4135 closes only with XV-4131 proven open'
  cause:
    tag: ZSO-4131
    condition: open
  logic:
    all:
    - tag: AI-4133
      state: AAH
    - tag: ZSO-4131
      state: open
    - interlock: I-501
      state: not tripped
  effects:
  - tag: XV-4135
    action: close
  sheet: P-04
  sil: null
  latching: false
  reset: automatic
  notes: 'Make-before-break to the flare (review 2026-11-05-basic-design-2#1, D-026): XV-4135 closes only while AI-4133 reads
    off-specification, ZSO-4131 proves XV-4131 open and ESD-1 of the berth is not tripped; any other state leaves XV-4135
    open (fail open).'
- id: I-513
  title: 'Vapour return A: flare valve XV-4131 closes only with XV-4135 proven open'
  cause:
    tag: ZSO-4135
    condition: open
  logic:
    all:
    - tag: ZSO-4135
      state: open
    - any:
      - tag: AI-4133
        state: normal
      - interlock: I-501
        state: tripped
  effects:
  - tag: XV-4131
    action: close
  sheet: P-04
  sil: null
  latching: false
  reset: automatic
  notes: 'Make-before-break back to the tanks (review 2026-11-05-basic-design-2#1, D-026): on on-specification vapour, or
    on ESD-1 (I-501 opens XV-4135), XV-4131 closes only once ZSO-4135 proves XV-4135 open. The vapour return is never closed
    at both valves.'
- id: I-514
  title: 'Vapour return A: oxygen above 5 vol % - carrier vapour rejected'
  cause:
    tag: AI-4133
    condition: O2 AHH (5 vol %)
  logic:
    tag: AI-4133
    state: O2 AHH (5 vol %)
    delay:
      value: 10
      unit: s
  effects:
  - tag: XV-5122
    action: close
  sheet: P-05
  sil: null
  latching: true
  reset: manual
  notes: 'Review 2026-11-05-basic-design-2#11, D-026.7: vapour above 5 vol % O2 is taken neither by the flare nor by the tanks;
    the vapour arm isolation XV-5122 closes and the carrier vents on board under the terminal rules (S-01). The jetty relief
    path stays open: the drain drum vent BOG-5002 joins BOG-5001 downstream of XV-5122. Only during gassing-up and cool-down;
    loading does not start until the oxygen is below 1 vol %.'
