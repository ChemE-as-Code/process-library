    action: close
  - tag: XV-1112
    action: close
  - tag: XV-1113
    action: close
  - tag: XV-1114
    action: close
  sheet: P-01
  sil: null
  latching: true
  reset: manual
  notes: The trains turn down or recycle on the closure (outside the battery limit, D-001); the trains get the trip signal
    through the BL interface (D-025).
- id: I-102
  title: No tank can take the rundown (both fill ESD valves closed)
