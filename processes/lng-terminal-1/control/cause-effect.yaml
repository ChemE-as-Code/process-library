  notes: 'Adversarial check of layout review 2026-11-05-basic-layout-6 (missed high), review 2026-11-05-basic-design-8 #9
    (D-036) and the independent check of D-037 (D-037.15 (a), D-037.16): the binding basis is no LNG on standing water (rapid
    phase transition in the closed caisson), so T-8102 is dry at the start of and during every transfer, its ~257 m3 below
    the inlet holding the ~170 m3 platform spill of D-034.3 and the trestle drain-down bounded by SEQ-LINE-EMPTY (~36 m3,
    40 m3 kept, D-036) with no rain allowance. Rain collects in the ~0.25 m3 floor pocket and the dry-sump pump P-8103 takes
    it out (I-806 / I-807, locked out on LNG by I-808), so no one goes to A9 during a transfer (S-CW-A9, D-037.3). The high
    alarm of LZT-8119 at the pocket rim (0.50 m, water on the sump floor: P-8103 failed or the inflow above its ~20 m3/h)
    is a transfer hold: a start permissive of SEQ-LOAD (S0) and, during a transfer, the pause of SEQ-LOAD S4 (rate to zero
    with the carrier, loading pumps stopped, XV-5101 / XV-6101 closed) until the level is back below it. At high-high, 0.1
    m over the floor (~15 min after the LAH at the ~10.5 m3/h of the ASSUMED design rain with P-8103 stopped), before a transfer
    it blocks the start of SEQ-LOAD; during a transfer it is a transfer cause of ESD-1 of the transferring berth (I-501 /
    I-601, checker of D-036): the pumps stop and the carrier is tripped through its own link, so its return-gas compressor
    never runs against a stopped transfer (D-016). Reset once the level is back below the high alarm. D-036''s LAH 0.7 m (~20
    m3) and LAHH 1.6 m (~45 m3) with their rain allowance are withdrawn (D-037.15 (a)). Own transmitter since D-039 (review
    2026-11-05-basic-design-9 #4): the LAH hold and this trip are on LZT-8119, a second guided-wave radar in its own stilling
    pipe with its own SIS input, independent of LZT-8106, which drives P-8103 (I-806 / I-807) and is now the control alone;
    so LZT-8106 failing low or frozen (P-8103 never started, the initiating event of water on the floor) no longer also silences
    the hold and this trip. A deviation between the two alarms. Bad signal of LZT-8119 (layout review 2026-11-05-basic-layout-7
    #5, D-039): alarmed and taken as its LAH, a transfer hold (no transfer starts, a transfer in progress is paused, SEQ-LOAD
    S0 / S4), not as a trip: a spurious ESD-1 with the carrier trip on a transmitter fault is not taken; a cable burnt by
    a fire at the header bay comes with the confirmed fire and gas cause of ESD-1 (XS-5108 / XS-6108) itself. Its SIL target
    from the screening (H-06).'
