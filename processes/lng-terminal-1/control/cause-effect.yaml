- id: I-607
  title: Berth 1 ERS closure and arm release, 5 s after ESD-2
  cause:
    tag: ZS-6151
    condition: ZAHH
  logic:
    interlock: I-603
    state: tripped
  effects:
  - tag: XV-6131
    action: close
  - tag: XV-6132
    action: close
  - tag: XV-6133
    action: close
  - tag: XV-6134
    action: close
  - tag: XV-6141
    action: close
  - tag: XV-6142
    action: close
  - tag: XV-6143
    action: close
  - tag: XV-6144
    action: close
  sheet: P-06
  sil: null
  delay:
    value: 5
    unit: s
  latching: true
  reset: manual
  notes: 'The eight ERS ball valves close and the powered emergency release couplers release once I-603 has held for 5 s,
    so the pumps are already stopping (review #4). The ERS closure time is set with the arm vendor so the surge stays inside
    the arm design (D-023, relief case of PSV-6131). Trip principle (review 2026-11-05-basic-design-5 #3, D-016, D-030): each
    ERS valve is de-energise-to-trip on two solenoid valves in series (2oo2, line-monitored, discrepancy alarm), so one coil,
    wire or output fault cannot close it ahead of the pump stop; the solenoid supply is on the UPS and its loss trips ESD-1
    (I-601) at once. The ERS closure is not interlocked behind a confirmed pump stop: on a real arm envelope stage 2 it must
    close in its time whatever the pumps do. The couplers are energise-to-release from the HPU accumulator, and release only
    after the ERS valves are proven closed (vendor), so no circuit or supply fault releases an arm under flow. Residual: both
    channels or the supply lost together close the ERS valves in 5 s at full flow, case (5) of D-023 and a relief case of
    PSV-6131.'
