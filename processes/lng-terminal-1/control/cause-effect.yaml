  latching: true
  reset: manual
  notes: 'Either independent gauge trips (1oo2, review #16, H-01 A5); closes the fill XV-1102 (closure at least 30 s, D-023.3)
    and the circulation return XV-2123 into T-2101 (D-007, D-025). XV-2123 fails closed (D-028). The sources of the circulation
    return are stopped only by I-205, if ZSC-2123 does not prove XV-2123 closed after its stroke time, so the circulation
    pump keeps the desuperheater spray in loading and the jetty drain pumps can empty D-5101 / D-6101 (review 2026-11-05-basic-design-5
    #1, D-030). With the other tank''s fill valve closed, I-102 trips the trains as XV-1102 starts to close.'
