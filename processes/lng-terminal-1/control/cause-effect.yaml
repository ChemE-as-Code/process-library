    - interlock: I-607
      state: tripped
    - any:
      - text: both ERS valves of the arm proven closed (vendor position switches, ASSUMED)
      - interlock: I-607
        state: tripped
        delay:
          value: 7.5
          unit: s
  effects:
  - tag: UY-6135
    action: trip
  - tag: UY-6136
    action: trip
  - tag: UY-6137
    action: trip
  - tag: UY-6138
    action: trip
  sheet: P-06
  sil: null
  latching: true
  reset: manual
  notes: 'Review 2026-11-05-basic-design-7 #4 (D-034; replaces the fixed ''closure plus 2 s'' of D-032.2): each arm''s coupler
    release UY-6135..6138 (energise-to-release from the HPU accumulator, ''trip'' = release) is commanded when both ERS valves
    of that arm are proven closed (the vendor''s position switches, ASSUMED), or, if one fails to close, at a timeout of 1.5
    times the vendor''s confirmed ERS closure time (7.5 s with the ASSUMED 5 s; H-02), whichever comes first; never before
    the ERS close command and the arm isolation close command of I-607. So a drift-off releases the arm even with a stuck
    ERS valve, and a slow but closing valve is no longer released early. Spill with one ERS valve failed open (ASSUMED estimate,
    D-034): inboard valve failed, the shore side drains from the coupler at the arm''s outboard end, over the water between
    ship and jetty first, the arm inventory (~5 m3) and the flow through the closing arm isolation until it shuts (up to the
    arm''s 4,000 m3/h falling to zero over the rest of its 25 s closure, ~10 m3), ~15 m3; outboard valve failed, the carrier''s
    manifold piping up to its ESD valve (~1-2 m3, carrier''s). No circuit or supply fault releases an arm, since the release
    needs power.'
- id: I-608
  title: 'Berth 1 shore ESD valve: open command only with the ship-shore link in carrier mode and healthy (permissive)'
  cause:
    tag: XS-6100
    condition: not in carrier mode and healthy
  logic:
    all:
    - tag: UZ-6101
      state: open command
    - any:
      - tag: XS-6100
        state: '''no carrier connected'' mode'
      - tag: XS-6100
        state: not healthy
  effects:
  - tag: UZ-6101
    action: trip
  sheet: P-06
  sil: null
  latching: false
  reset: automatic
  notes: 'Review 2026-11-05-basic-design-7 #3 (D-034): a start permissive on the open command of XV-6101, not a trip of a
    transfer in progress (that is I-601 on the link): the effect keeps UZ-6101 de-energised (XV-6101 closed) while XS-6100
    is in its ''no carrier connected'' mode or not healthy, so no liquid can be sent to a berth whose link to the carrier
    is not made. With the mode ending by itself on a healthy link or an unstowed arm (I-601), the link cannot be left in that
    mode with a carrier connected.'
- id: I-609
  title: Berth 1 ERS function test permitted only with no liquid transfer and every arm stowed (permissive)
  cause:
    tag: HS-6109
    condition: test enable requested
  logic:
    all:
    - tag: HS-6109
      state: test enable requested
    - any:
      - any:
        - tag: ZSC-6101
          state: not closed
        - tag: UZ-6101
          state: energised (open)
      - tag: ZS-6151
        state: not stowed
      - tag: ZS-6152
        state: not stowed
      - tag: ZS-6153
        state: not stowed
      - tag: ZS-6154
        state: not stowed
  effects:
  - tag: HS-6109
    action: trip
  sheet: P-06
  sil: null
  latching: false
  reset: automatic
  notes: 'Review 2026-11-05-basic-design-7 #5 (D-034): the arm vendor''s ERS test function (SEQ-LOAD S1) vents ERS solenoid
    channels outside I-607; it is enabled through HS-6109 only while XV-6101 is proven closed (ZSC-6101) and not held open
    (UZ-6101 de-energised) and every arm reads stowed (ZS-6151..6154), and an enabled test ends when any of these is lost,
    so one operator action or one vendor-panel fault can never close an ERS valve at full flow. Hard-wired into the vendor
    panel (ASSUMED, arm vendor, H-02).'
- id: I-604
  title: 'Berth 1 hybrid arm: liquid isolation may open only with the vapour isolation proven closed'
  cause:
    tag: ZSC-6125
    condition: not closed
  logic:
    all:
    - tag: XV-6123
      state: open command
    - tag: ZSC-6123
      state: closed
    - tag: ZSC-6125
      state: not closed
  effects:
  - tag: HS-6123
    action: trip
  sheet: P-06
  sil: null
  latching: false
  reset: automatic
  notes: 'Start permissive on the open command, not a trip: the effect blocks the open command of HS-6123 and never acts on
    the valve itself (review #3, H-03 A13, review 2026-11-05-basic-design-2#2): the open command of XV-6123 is blocked while
    ZSC-6125 does not prove XV-6125 closed. The logic holds only while ZSC-6123 proves XV-6123 itself still closed, so it
    acts on an opening and never on an XV-6123 already open: a failed ZSC-6125 signal cannot close the arm in service (review
    2026-11-05-basic-design-2#2, D-028). Also key-interlocked at the arm (vendor).'
- id: I-605
  title: 'Berth 1 hybrid arm: vapour isolation may open only with the liquid isolation proven closed'
  cause:
    tag: ZSC-6123
    condition: not closed
  logic:
    all:
    - tag: XV-6125
      state: open command
    - tag: ZSC-6125
      state: closed
    - tag: ZSC-6123
      state: not closed
  effects:
  - tag: HS-6125
    action: trip
  sheet: P-06
  sil: null
  latching: false
  reset: automatic
  notes: 'Start permissive on the open command, the effect blocks the open command of HS-6125 and never acts on the valve
    itself (review #3, review 2026-11-05-basic-design-2#2): the open command of XV-6125 is blocked while ZSC-6123 does not
    prove XV-6123 closed. The logic holds only while ZSC-6125 proves XV-6125 itself still closed, so an open XV-6125 is never
    closed by it (D-028).'
- id: I-606
  title: D-6101 jetty drain drum level high-high
  cause:
    tag: LZT-6112
    condition: LAHH
  effects:
  - tag: XV-6161
    action: close
  sheet: P-06
  sil: null
  latching: true
  reset: manual
  notes: 'Stops the header drain into the drum (review #21, H-03 A5); P-6101 empties it (LIC-6111) into the berth header downstream
    of XV-6101, into the cooldown or loading flow of the next transfer (D-036; it no longer feeds the circulation return,
    so I-205 / I-305 do not act on it).'
- id: I-611
  title: 'Vapour return B: off-specification vapour - flare valve XV-4132 opens'
  cause:
    tag: AI-4134
    condition: AAH
  logic:
    all:
    - tag: AI-4134
      state: AAH
    - interlock: I-601
      state: not tripped
    - interlock: I-614
      state: not tripped
    - tag: AI-4134
      state: O2 below 5 vol % (both cells)
    - text: 'post-reset hold ended: since the last reset of I-614, AI-4134 has read O2 above 1 vol % and then below 1 vol
        % for 5 min (the slug passed, ASSUMED), or the operator has released the hold after the carrier confirmed 1.5 return-line
        volumes delivered (D-036)'
  effects:
  - tag: XV-4132
    action: open
  sheet: P-04
  sil: null
  latching: false
  reset: automatic
  notes: 'Carrier de-inerting and cool-down vapour (high N2, low CH4) goes to the storage and loading flare through BOG-4014
    (review #19, D-017); first half of the make-before-break switch, the tank side closes by I-612. Not while ESD-1 of the
    berth is tripped: then the return goes to the tanks (I-601 opens XV-4136, I-613 closes XV-4132), so the two never command
    XV-4132 against each other (review 2026-11-05-basic-design-3#2). Vapour above the O2 limit is rejected by I-614, and while
    I-614 is tripped XV-4132 is not opened either (the return goes to the tanks, review 2026-11-05-basic-design-6 adversarial
    check, D-032). Post-reset hold (review 2026-11-05-basic-design-7 #2, D-034; ended on a measurement since review 2026-11-05-basic-design-8
    #7, D-036): after a reset of I-614 the slug that passed the berth before XV-6122 closed is still in BOG-6001 / the return
    line; XV-4132 is not opened until AI-4134 at the tank end has seen that slug pass, its O2 risen above 1 vol % and fallen
    back below 1 vol % for 5 min (ASSUMED), so the hold no longer rests on an assumed minimum return flow; if AI-4134 sees
    no rise (a slug too small to read), the hold stays until the operator releases it, after the carrier confirms that its
    return-gas compressor has delivered at least 1.5 return-line volumes (~1,600 m3 of the ~1,060 m3 DN 750 line, ASSUMED)
    since the reset. Whenever AI-4134 itself reads O2 at or above 5 vol %, XV-4132 is not opened either, so the slug is flushed
    to the tanks (bounded in D-026.1), never to the flare.'
- id: I-612
  title: 'Vapour return B: tank-side valve XV-4136 closes only with XV-4132 proven open'
  cause:
    tag: ZSO-4132
    condition: open
  logic:
    all:
    - tag: AI-4134
      state: AAH
    - tag: ZSO-4132
      state: open
    - text: 'no ZSO-4132 discrepancy: ZSO-4132 did not read open while XV-4132 was commanded closed for longer than its stroke
        time'
    - interlock: I-601
      state: not tripped
    - interlock: I-614
      state: not tripped
    - tag: AI-4134
      state: O2 below 5 vol % (both cells)
    - text: post-reset hold of I-611 ended (AI-4134 has seen the slug pass, or released by the operator, D-036)
  effects:
  - tag: XV-4136
    action: close
  sheet: P-04
  sil: null
  latching: false
  reset: automatic
  notes: 'Make-before-break to the flare (review 2026-11-05-basic-design-2#1, D-026): XV-4136 closes only while AI-4134 reads
    off-specification, ZSO-4132 proves XV-4132 open and neither ESD-1 of the berth nor the O2 reject I-614 is tripped; any
    other state leaves XV-4136 open (fail open). Proven open: ZSO-4132 reads open and has no standing discrepancy with the
    command of XV-4132 (a switch reading open while XV-4132 has been commanded closed for longer than its stroke time raises
    an alarm and blocks this interlock), so a switch stuck open cannot fake the open flare valve (review 2026-11-05-basic-design-3#4,
    D-028).'
- id: I-613
  title: 'Vapour return B: flare valve XV-4132 closes only with XV-4136 proven open'
  cause:
    tag: ZSO-4136
    condition: open
  logic:
    all:
    - tag: ZSO-4136
      state: open
    - text: 'no ZSO-4136 discrepancy: ZSO-4136 did not read open while XV-4136 was commanded closed for longer than its stroke
        time'
    - any:
      - tag: AI-4134
        state: normal
      - interlock: I-601
        state: tripped
      - interlock: I-614
        state: tripped
  effects:
  - tag: XV-4132
    action: close
  sheet: P-04
  sil: null
  latching: false
  reset: automatic
  notes: 'Make-before-break back to the tanks (review 2026-11-05-basic-design-2#1, D-026): on on-specification vapour, on
    ESD-1 (I-601 opens XV-4136) or on the O2 reject (I-614 opens XV-4136; review 2026-11-05-basic-design-6 adversarial check,
    D-032), XV-4132 closes only once ZSO-4136 proves XV-4136 open. The vapour return is never closed at both valves. Proven
    open as in I-612: no standing discrepancy between ZSO-4136 and the command of XV-4136; while one stands, XV-4132 stays
    open with XV-4136 (the return stays open, an alarm calls the operator to confirm XV-4136 open locally before closing XV-4132
    by hand; review 2026-11-05-basic-design-3#4, D-028).'
- id: I-614
  title: 'Berth 1 vapour: oxygen above 5 vol % with no liquid transfer (gassing-up) - carrier vapour rejected at the berth,
    return to the tanks'
  cause:
    tag: AI-6126
    condition: O2 AHH (5 vol %)
  logic:
    all:
    - any:
      - vote:
          k: 2
          of:
          - tag: AI-6126
            state: O2 AHH (5 vol %), O2 cell 1
          - tag: AI-6126
            state: O2 AHH (5 vol %), O2 cell 2
        delay:
          value: 10
          unit: s
      - vote:
          k: 2
          of:
          - tag: AI-4134
            state: O2 AHH (5 vol %), O2 cell 1
          - tag: AI-4134
            state: O2 AHH (5 vol %), O2 cell 2
        delay:
          value: 10
          unit: s
    - all:
      - tag: ZSC-6101
        state: closed
      - tag: UZ-6101
        state: de-energised (close)
  effects:
  - tag: XV-6122
    action: close
  - tag: XV-6125
    action: close
  - tag: XV-4136
    action: open
  sheet: P-06
  sil: null
  latching: true
  reset: manual
  notes: 'Review 2026-11-05-basic-design-2#11, D-026.7: vapour above 5 vol % O2 is taken neither by the flare nor by the tanks;
    the vapour arm isolation XV-6122 and the hybrid vapour isolation XV-6125 (line-up (b), which joins BOG-6001 downstream
    of XV-6122) close, and the carrier vents on board under the terminal rules (S-01). The jetty relief path stays open: the
    drain drum vent BOG-6002 joins BOG-6001 downstream of XV-6122. Measured at the berth (review 2026-11-05-basic-design-6
    adversarial check, D-032): AI-6126 samples the carrier vapour on the platform, so the reject acts before the vapour enters
    the 2.45 km return; AI-4134 at the tank end stays the backup. Since review 2026-11-05-basic-design-7 #2 (D-034) its sample
    point is on the vapour arm side of XV-6122 (BOG-6001 S1), so after the trip it still reads the carrier''s vapour, not
    the gas trapped behind the closed valves: the manual reset of I-614 is permitted only once both AI-6126 cells read below
    5 vol % O2 (the reset condition; the C&E format has no reset-condition field, so it is stated here and in SEQ-LOAD S1,
    review 2026-11-05-basic-design-8 #7), and after the reset I-611 / I-612 hold the return on the tanks until AI-4134 has
    seen the trapped slug pass (or the operator releases the hold on the carrier''s delivered return volume; D-036), so the
    slug trapped downstream is flushed to the tanks, not to the flare (D-026.1, D-026.7). The vapour that passes the berth
    before XV-6122 / XV-6125 have closed (response, vote and closure ~40 s, ASSUMED) is a slug of at most ~200 m3; the trip
    also opens the tank-side valve XV-4136, and I-613 closes the flare valve XV-4132 once ZSO-4136 proves XV-4136 open, a
    stroke of well under a minute against a transit of several minutes through the return line, so the slug goes to the tanks
    (bounded in D-026.1), never to the flare, and the return is never closed at both valves. Armed on the plant state, not
    on a sequence step (review 2026-11-05-basic-design-5 #4, review 6 #1, D-030, D-032): only while XV-6101 is proven closed
    by ZSC-6101 and not held open by UZ-6101 (the exact complement of the transfer state of I-601), i.e. gassing-up in SEQ-LOAD
    S1 / S2 or run by hand outside the sequence. During a liquid transfer, the cooldown of S3 included, the same O2 high-high
    trips ESD-1 (I-601) instead, which stops the flow, trips the carrier and keeps the return open to the tanks (D-026.1).
    After an ESD-1 the reject arms only once ZSC-6101 proves XV-6101 closed, after the pump run-down and the 25-30 s closure
    (review 6 adversarial check), so the vapour return is never shut while the carrier receives LNG. The two O2 cells of each
    analyser (ASSUMED, analyser vendor) vote 2oo2 with a discrepancy alarm, so a single cell failing high does not trip; the
    voting is confirmed in the SIL screening (H-06).'
