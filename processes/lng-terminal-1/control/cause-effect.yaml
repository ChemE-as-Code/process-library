    itself (review #3, review 2026-11-05-basic-design-2#2): the open command of XV-6125 is blocked while ZSC-6123 does not
    prove XV-6123 closed; an open XV-6125 is never closed by it.'
- id: I-606
  title: D-6101 jetty drain drum level high-high
  cause:
    tag: LZT-6112
    condition: LAHH
  effects:
  - tag: XV-6161
    action: close
  sheet: P-06
  sil: null
  latching: true
  reset: manual
  notes: 'Stops the header drain into the drum (review #21, H-03 A5); P-6101 empties it (LIC-6111).'
- id: I-611
  title: 'Vapour return B: off-specification vapour - flare valve XV-4132 opens'
  cause:
    tag: AI-4134
    condition: AAH
  logic:
    all:
    - tag: AI-4134
      state: AAH
    - interlock: I-601
      state: not tripped
  effects:
  - tag: XV-4132
    action: open
  sheet: P-04
  sil: null
  latching: false
  reset: automatic
  notes: 'Carrier de-inerting and cool-down vapour (high N2, low CH4) goes to the storage and loading flare through BOG-4014
    (review #19, D-017); first half of the make-before-break switch, the tank side closes by I-612. Not while ESD-1 of the
    berth is tripped: then the return goes to the tanks (I-601 opens XV-4136, I-613 closes XV-4132), so the two never command
    XV-4132 against each other (review 2026-11-05-basic-design-3#2). Vapour above the O2 limit is rejected by I-614.'
- id: I-612
  title: 'Vapour return B: tank-side valve XV-4136 closes only with XV-4132 proven open'
  cause:
    tag: ZSO-4132
    condition: open
  logic:
    all:
    - tag: AI-4134
      state: AAH
    - tag: ZSO-4132
      state: open
    - interlock: I-601
      state: not tripped
  effects:
  - tag: XV-4136
    action: close
  sheet: P-04
  sil: null
  latching: false
  reset: automatic
  notes: 'Make-before-break to the flare (review 2026-11-05-basic-design-2#1, D-026): XV-4136 closes only while AI-4134 reads
    off-specification, ZSO-4132 proves XV-4132 open and ESD-1 of the berth is not tripped; any other state leaves XV-4136
    open (fail open).'
- id: I-613
  title: 'Vapour return B: flare valve XV-4132 closes only with XV-4136 proven open'
  cause:
    tag: ZSO-4136
    condition: open
  logic:
    all:
    - tag: ZSO-4136
      state: open
    - any:
      - tag: AI-4134
        state: normal
      - interlock: I-601
        state: tripped
  effects:
  - tag: XV-4132
    action: close
  sheet: P-04
  sil: null
  latching: false
  reset: automatic
  notes: 'Make-before-break back to the tanks (review 2026-11-05-basic-design-2#1, D-026): on on-specification vapour, or
    on ESD-1 (I-601 opens XV-4136), XV-4132 closes only once ZSO-4136 proves XV-4136 open. The vapour return is never closed
    at both valves.'
- id: I-614
  title: 'Vapour return B: oxygen above 5 vol % - carrier vapour rejected'
  cause:
    tag: AI-4134
    condition: O2 AHH (5 vol %)
  logic:
    tag: AI-4134
    state: O2 AHH (5 vol %)
    delay:
      value: 10
      unit: s
  effects:
  - tag: XV-6122
    action: close
  sheet: P-06
  sil: null
  latching: true
  reset: manual
  notes: 'Review 2026-11-05-basic-design-2#11, D-026.7: vapour above 5 vol % O2 is taken neither by the flare nor by the tanks;
    the vapour arm isolation XV-6122 closes and the carrier vents on board under the terminal rules (S-01). The jetty relief
    path stays open: the drain drum vent BOG-6002 joins BOG-6001 downstream of XV-6122. Only during gassing-up and cool-down;
    loading does not start until the oxygen is below 1 vol %.'
- id: I-701
  title: BOG suction drum level high-high
  cause:
    tag: LZT-7106
    condition: LAHH
  effects:
  - tag: K-7101A
    action: stop
  - tag: K-7101B
    action: stop
  - tag: K-7101C
    action: stop
  - tag: XV-7121A
    action: close
  - tag: XV-7121B
    action: close
  - tag: XV-7121C
    action: close
  - tag: XV-7123A
    action: close
  - tag: XV-7123B
    action: close
  - tag: XV-7123C
    action: close
  sheet: P-07
  sil: null
  latching: true
  reset: manual
  notes: Liquid carry-over (spray failure) would damage the machines; tank pressure then goes to the flare by PV-1110 / XV-1115
    (D-010, D-017). The recycle XV-7125x stays open (D-025).
- id: I-702
  title: K-7101A machine protection (vendor unit control panel)
  cause:
    tag: VZ-7110A
    condition: trip
  logic:
    text: 'any vendor UCP trip: vibration, bearings, seal gas, lube oil, motor, discharge pressure high-high'
  effects:
  - tag: K-7101A
    action: stop
  - tag: XV-7121A
    action: close
  - tag: XV-7123A
    action: close
  sheet: P-07
  sil: null
  latching: true
  reset: manual
  notes: 'Vendor package trips, summarised as VZ-7110x (review #12, D-026): vibration and bearing temperature (API 670), dry
    gas seal leakage and seal gas low differential pressure, lube oil pressure low-low, motor protection (winding temperature,
    overcurrent, earth fault), discharge pressure high-high below the PSV-7111 set point; the trip list is confirmed with
    the vendor in detail engineering. Suction and discharge isolated; the recycle XV-7125x stays open so the machine keeps
    its relief path to the tank system (D-025).'
- id: I-705A
  title: K-7101A suction ESD valve not open or suction low-low - machine stops
  cause:
    tag: ZSO-7121A
    condition: not open
  logic:
    all:
    - tag: K-7101A
      state: running
    - any:
      - tag: ZSO-7121A
        state: not open
      - tag: PZT-7113
        state: PALL
        delay:
          value: 5
          unit: s
  effects:
  - tag: K-7101A
    action: stop
  - tag: XV-7123A
    action: close
  sheet: P-07
  sil: null
  latching: true
  reset: manual
  notes: 'Review #12, D-026: a running machine stops when ZSO-7121A loses the open position of its fail-closed suction valve
    (instrument air failure, spurious closure) or PZT-7113 reads the common suction header low-low; the recycle XV-7125A stays
    open. A machine that is not running is not tripped (the logic includes K-7101A running), so no start bypass is needed.
    PZT-7113 is a single transmitter on the common header (1oo1, 5 s on-delay): a spurious trip stops all three machines and
    sends the BOG to the flare through PV-1110, a production loss and not a hazard; its voting is set in the SIL screening
    (review 2026-11-05-basic-design-3#6).'
- id: I-703A
  title: K-7101A discharge temperature high-high
  cause:
    tag: TZT-7112A
