# Cause and effect list: interlocks and trips. Schema: `cheme schema interlocks`.
# On a sheet, refer to an interlock ("see C&E I-201") instead of spelling out what it trips.
# Revised after the design review 2026-11-05-basic-design and the HAZOP H-01..H-05 (D-025).
# SIL from the screening in detail engineering (null until then).
schema: cheme/interlocks/v1
interlocks:
- id: I-101
  title: Both tanks high-high level - rundown stopped at the battery limit
  cause:
    tag: LZT-2102
    condition: LAHH
  logic:
    any:
    - all:
      - tag: LZT-2102
        state: LAHH
      - tag: LZT-3102
        state: LAHH
    - all:
      - tag: LZT-2106
        state: LAHH
      - tag: LZT-3106
        state: LAHH
  effects:
  - tag: XV-1111
    action: close
  - tag: XV-1112
    action: close
  - tag: XV-1113
    action: close
  - tag: XV-1114
    action: close
  sheet: P-01
  sil: null
  latching: true
  reset: manual
  notes: The trains turn down or recycle on the closure (outside the battery limit, D-001); the trains get the trip signal
    through the BL interface (D-025).
- id: I-102
  title: No tank can take the rundown (both fill ESD valves closed or the rundown header high-high)
  cause:
    tag: ZSC-1102
    condition: closed
  logic:
    any:
    - all:
      - tag: ZSC-1102
        state: closed
      - tag: ZSC-1103
        state: closed
    - tag: PZT-1105
      state: PAHH
  effects:
  - tag: XV-1111
    action: close
  - tag: XV-1112
    action: close
  - tag: XV-1113
    action: close
  - tag: XV-1114
    action: close
  sheet: P-01
  sil: null
  latching: true
  reset: manual
  notes: 'Review 2026-11-05-basic-design#8, H-01 A1: with both XV-1102 and XV-1103 closed the rundown header would be dead-headed
    against the trains; the battery-limit valves close and the trains are tripped through the BL interface (D-025). PZT-1105
    on LNG-1001 also catches a branch closed by its selection valves XV-1106..1109, which the ESD valve position switches
    do not see (review 2026-11-05-basic-design-2#4, D-026).'
- id: I-201
  title: T-2101 level high-high (1oo2)
