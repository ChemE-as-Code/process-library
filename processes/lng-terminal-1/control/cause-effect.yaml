- id: I-607
  title: Berth 1 ERS closure and arm isolations closed, 5 s after ESD-2
  cause:
    tag: ZS-6151
    condition: ZAHH
  logic:
    interlock: I-603
    state: tripped
  effects:
  - tag: XV-6131
    action: close
  - tag: XV-6132
    action: close
  - tag: XV-6133
    action: close
  - tag: XV-6134
    action: close
  - tag: XV-6141
    action: close
  - tag: XV-6142
    action: close
