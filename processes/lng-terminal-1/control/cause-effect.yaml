  sheet: P-06
  sil: null
  latching: true
  reset: manual
  bypass: 'No bypass of any cause except the maintenance override of a failed ZSO-6122 (review 2026-11-05-basic-design-6 #4,
    D-032): under a permit, for the transfer in progress only (it ends by itself when ZSC-6101 proves XV-6101 closed), alarmed
    in the control room and told to the carrier, with XV-6122 confirmed open locally at the start and every hour (ASSUMED);
    not for running without the vapour arm, which every transfer needs. The ESD-1 tests of SEQ-LOAD S3 inhibit only the sequence
    abort, never this trip. Output override for SEQ-LINE-EMPTY (checker of D-036): with this trip latched (a cause such as
    XS-6108 stays active while the leak burns), the close outputs on XV-4101, XV-4102 and XV-4107 only may be overridden,
    one key-protected override per valve at the SIS operator station, so that the return path of the leaking trestle line
    can be opened; permitted only while every loading pump P-2101A-D / P-3101A-D is proven stopped (their stop outputs stay
    latched and cannot be overridden), XV-5101 and XV-6101 are proven closed (ZSC-5101, ZSC-6101) and the carrier trip has
    been sent; alarmed and logged in the control room, and removed by the SIS, the valve closing again at its set speed, when
    SEQ-LINE-EMPTY S3 is complete, after 8 h (ASSUMED) or as soon as any of those conditions is lost. Opening these valves
    with the pumps stopped adds no source: the tank cannot drain into the line through a stopped pump and its roof-level discharge
    (the LNG is at its bubble point, a siphon over the roof flashes). Part of the HAZOP restamp (D-036).'
  notes: 'Stops the loading pumps and trips the carrier''s ESD through the ship-shore link XS-6100 (effect; the link works
    both ways, S-01) at once, then closes the shore ESD valve XV-6101 in 25-30 s (surge, D-023), the tank-end XV-4101/4102
    and the DN 800 platform crossover XV-4107 (review 2026-11-05-basic-design-7 #1, D-034: after the trip the two trestle
    lines are separated at the platform, so a release upstream of a shore ESD valve is fed by one line; same closure time,
    accumulator and speed controller); the manual ESD-1 push buttons HS-6100A/B/C (control room, jetty head, platform, each
    its own normally closed input, review 7 #7), the confirmed platform fire and gas, ESD-2 (I-603, review #4) and the instrument-air
    header low-low trip I-804 (review 2026-11-05-basic-design-4 #1, D-028) also initiate it, so all of them reach the carrier.
    Since review 2026-11-05-basic-design-5 (D-030) the logic also trips during a liquid transfer at Berth 1 on: the vapour
    path not proven open (ZSO-6122, the vapour arm isolation XV-6122, at the start of any closure, which also detects an air
    loss at the platform end of the air main, XV-6122 having no accumulator); the O2 high-high of the berth analyser AI-6126
    or of AI-4134 (the O2 reject I-614 acts only with no liquid transfer); the loss of either ERS solenoid channel (XA-6130A
    or XA-6130B: its UPS supply, D-016, or since review 7 #5 the line monitoring of any one solenoid circuit of that channel
    on any ERS valve, D-034, so a transfer never runs on one channel of any valve); and ESD-1 of the other berth (I-501),
    which stops the shared pumps and closes the shared tank-end valves, so the transferring carrier is tripped through its
    own link and its return is kept open to the tanks. Liquid transfer (review 2026-11-05-basic-design-6 #1, D-032) is a state
    of safety-system inputs only: XV-6101 not proven closed by its own closed-position switch ZSC-6101, or held open by the
    SIS output UZ-6101; liquid reaches the berth only through XV-6101, so the S3 cooldown and loading are both in it, and
    no loop transmitter (FIC-4101 / FIC-4102) or DCS command can disarm these causes. A ZSC-6101 stuck closed leaves the state
    on through UZ-6101, and reading closed while UZ-6101 holds the valve open raises a discrepancy alarm. Idle berth (review
    6 #5 and adversarial check, D-016): with no carrier connected the ship-shore link is in its own ''no carrier connected''
    mode (not a bypass: selectable only with every arm stowed and XV-6101 proven closed) and the stowed arms'' envelope switches
    ZS-6151..6154 read stowed, so XS-6100 and ZS-615x are not trip causes and an idle berth never trips I-601, the shared
    pumps or holding; a carrier leaving disconnects the link only after its arms are stowed and the link is set to that mode
    (SEQ-LOAD S6). The mode ends by itself (review 2026-11-05-basic-design-7 #3, D-034): when a carrier''s link cable is connected
    and healthy (normal connection, SEQ-LOAD S1) or when any arm leaves its stowed position (ZS-6151..6154 not stowed); ended
    with no healthy link, XS-6100 reads trip and trips this ESD-1, so no carrier can be connected and loaded with the link
    in that mode. The open command of XV-6101 is also blocked unless the link is in carrier mode and healthy (I-608). Unstowing
    an arm at an idle berth without a carrier''s link therefore stops the shared pumps (safe, a production stop; arm movements
    at an idle berth are made outside the other berth''s transfers, ASSUMED operating rule). The circulation pump P-2102 /
    P-3102 is not stopped (review 6 adversarial check, D-016): in the S3 cooldown it feeds line A at 500 m3/h (~0.3 m/s in
    DN 800, so even an instant closure gives rho a v ~150 kPa, far inside the 15 barg design), it runs safely on its fail-open
    minimum flow against the closed XV-6101 / XV-4101, and once the loading pumps have stopped it is again the source of the
    desuperheater spray (fed from the loading header while they run, D-036) and of the holding circulation; since D-036 its
    design pressure is the 15 barg of the loading system, so a passing check valve CV-2122 / CV-3122 under the loading header
    is no overpressure case. The stop-first order of D-016 is that of the loading pumps. On an instrument-air failure the
    shore and tank-end ESD valves and the arm isolations hold on their accumulators until this trip has stopped the pumps,
    and then close no faster than their set speed; the ERS valves are hydraulic and do not move (D-016, D-028). It opens the
    tank-side vapour return valve XV-4136 and does not act on the flare valve XV-4132: the vapour return, the relief path
    of the berth, stays open at least to the tanks (review 2026-11-05-basic-design-2#1, D-026); XV-4132 then closes by I-613
    once ZSO-4136 proves XV-4136 open. The jetty sump high-high I-805 is a transfer cause since the checker of D-036, so a
    sump filling with rain ends the transfer with the carrier tripped through its own link, as D-016 asks of every stop of
    the shared pumps during a transfer; the tank-area sump high-high I-809 (T-8101 kept dry, review 2026-11-05-basic-design-9
    #1, D-039) is one in the same way, since the governing tank-area spill is the loading pumps'' run-out (D-034.3). The drain
    pump P-6101 is stopped too (review 2026-11-05-basic-design-9 #7, D-039): it returns into the header downstream of XV-6101
    and would otherwise dead-head on its minimum flow once XV-6101 has closed. After ESD-1 the berth header and the arms stay
    open, through the arm isolations and the ERS valves, to the carrier''s manifold spool behind its closed ESD valve; that
    shared section warms, and its lowest-set relief is the arm thermal reliefs PSV-6171 / 6173 / 6174 at 8.0 barg into D-6101,
    below the carrier''s 10 barg (ASSUMED, D-016, D-039; was 15.0 barg, review 2026-11-05-basic-design-9 #2). After the trip
    the close outputs on XV-4101 / XV-4102 / XV-4107 may be overridden for SEQ-LINE-EMPTY only (bypass field).'
- id: I-602
  title: Berth 1 carrier manifold back-pressure high-high (arm outboard 5.0 barg, 1oo2) - carrier piping protected against
    the shore shut-off
  cause:
    tag: PZT-6181
    condition: PAHH (5.0 barg, ASSUMED; 1oo2 with PZT-6184)
  logic:
    any:
    - tag: PZT-6181
      state: PAHH (5.0 barg)
    - tag: PZT-6184
      state: PAHH (5.0 barg)
    - tag: PZT-6103
      state: PAHH (7.0 barg, backstop, not credited)
  effects:
  - tag: P-2101A
    action: stop
  - tag: P-2101B
    action: stop
  - tag: P-2101C
    action: stop
  - tag: P-2101D
    action: stop
  - tag: P-3101A
    action: stop
  - tag: P-3101B
    action: stop
  - tag: P-3101C
    action: stop
  - tag: P-3101D
    action: stop
  - tag: XS-6100
    action: trip
  - tag: XV-6101
    action: close
  sheet: P-06
  sil: null
  latching: true
  reset: manual
  notes: 'Carrier interface (review 2026-11-05-basic-design-8 #1 and its checker, D-016, D-023 (6), D-036). The shore shut-off
    with a full tank is ~12.2 barg at the pump, ~12.1 barg at XV-6101 and ~12.3 barg at the lowest carrier manifold (one basis,
    scripts/terminal_sizing.py), above the carrier''s manifold and cargo piping design pressure, taken as 10 barg (ASSUMED;
    the OCIMF and SIGTTO ship-shore manifold and ESD guidance, cited by name only, and the terminal information guide S-01
    / the ship-shore compatibility study confirm it). A carrier ESD valve closing is answered first by the link (XS-6100,
    I-601, the pumps stopped at the start of its closure); this function is the credited, independent protection of the carrier''s
    piping against the shut-off when the link signal does not arrive (SIL target from the H-06 screening; sil stays null until
    then). It is not credited against a closure that runs ahead of the pump stop on the shore side (a valve closing on an
    air failure), which rests on I-601 and the air-header trip I-804 (D-023, D-028). Measured where the normal pressure is
    lowest: PZT-6181 / PZT-6184 at the outboard ends of the two liquid arms that every transfer uses (LA-6101 / LA-6104, arm
    side of the inboard ERS valves), voted 1oo2 with a discrepancy alarm, so one transmitter failed low does not leave the
    carrier unprotected. Normal there ~2.5-3.0 barg at 12,000 m3/h (the carrier''s manifold pressure, 350 kPa(a) in the pump
    rating), against ~5.2-5.5 barg on the berth header (S3, 647.9 kPa(a) at XV-6101): on the header no set point fits, because
    the closure rise of the carrier valve, 2 rho L v / t over the trestle line and the berth header (2 x 445 x (2,160 x 3.4
    + 250 x 6.8) / t), is ~2.7 bar for a 30 s closure and ~3.2 bar for 25 s (the earlier text took 0.27-0.32 MPa as ~0.3 bar).
    Bound: PAHH 5.0 barg + at most ~3.2 bar of closure rise + ~0.1 bar of static from the transmitter down to the manifold
    flange = ~8.3 barg at most, ~1.7 bar below 10 barg; the loading pumps stop (response ~1 s, ASSUMED) while the flow still
    runs, the carrier is tripped through the link (an effect, in case only its signal to shore was lost), and XV-6101 then
    closes in 25-30 s against a flow near zero, adding no surge. The bound holds for a carrier closure whose flow falls over
    its 25-30 s stroke; a valve that throttles only in its last seconds raises any closure, link or not, and is the carrier''s
    closure characteristic for the compatibility study; the transient analysis (hold H-01, the pumps'' run-down H-02) checks
    this bound, it is not the fallback of the design. PZT-6103 on the berth header stays in the logic at PAHH 7.0 barg as
    an uncredited backstop (e.g. a closure at the hybrid arm alone, where the header rises with two arms still flowing). After
    an ESD-1 (review 2026-11-05-basic-design-9 #2, D-039): the section from XV-6101 to the carrier''s closed valve stays blocked
    in and warms; the arm thermal reliefs PSV-6171 / 6173 / 6174 at 8.0 barg into D-6101 keep it below the carrier''s 10 barg,
    and PZT-6181 / 6184 may then trip this function again: with the pumps stopped, the carrier tripped and XV-6101 closed
    it has no further effect. It is reset only once both read below 5.0 barg: after the reset of I-601 the operator vents
    the section into D-6101 through XV-6161 before the restart from SEQ-LOAD S3, or drains the arms and the header as in SEQ-LOAD
    S6 if the transfer will not resume (SEQ-ESD S2).'
