    one, and is not credited against surge: the stop-first order rests on I-601 and the air-header trip I-804 (review 2026-11-05-basic-design-4,
    adversarial check; D-023, D-028).'
- id: I-603
  title: Berth 1 ESD-2 (arm envelope stage 2, 35 kn disconnect)
