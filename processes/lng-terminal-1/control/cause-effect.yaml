    - tag: LZT-2106
      state: LAHH
  effects:
  - tag: XV-1102
    action: close
  - tag: XV-2123
    action: close
  sheet: P-02
  sil: null
  latching: true
  reset: manual
  notes: 'Either independent gauge trips (1oo2, review #16, H-01 A5); closes the fill and the circulation return into T-2101
    (D-007, D-025).'
