# Cause and effect list: interlocks and trips. Schema: `cheme schema interlocks`.
# On a sheet, refer to an interlock ("see C&E I-201") instead of spelling out what it trips.
# Basic stage: the trips drawn on P-01 to P-08 (D-007, D-010, D-016, D-017). SIL from the
# screening in detail engineering (null until then).
schema: cheme/interlocks/v1
interlocks:
  # ---- rundown (P-01)
  - id: I-101
    title: Both tanks high-high level - rundown stopped at the battery limit
    cause: {tag: LZT-2102, condition: LAHH}
    logic: {all: [{tag: LZT-2102, state: LAHH}, {tag: LZT-3102, state: LAHH}]}
    latching: true
    reset: manual
    effects:
      - {tag: XV-1111, action: close}
      - {tag: XV-1112, action: close}
      - {tag: XV-1113, action: close}
      - {tag: XV-1114, action: close}
    sheet: P-01
    sil: null
    notes: "The trains turn down or recycle on the closure (outside the battery limit, D-001)."
  # ---- T-2101 (P-02)
  - id: I-201
    title: T-2101 level high-high
    cause: {tag: LZT-2102, condition: LAHH}
    effects:
      - {tag: XV-1102, action: close}
    sheet: P-02
    sil: null
    notes: "Closes the T-2101 fill; the rundown goes to T-3101 (D-007)."
  - id: I-202
    title: T-2101 level low-low
    cause: {tag: LZT-2102, condition: LALL}
    effects:
      - {tag: P-2101A, action: stop}
      - {tag: P-2101B, action: stop}
      - {tag: P-2101C, action: stop}
      - {tag: P-2101D, action: stop}
      - {tag: P-2102, action: stop}
    sheet: P-02
    sil: null
    notes: "Minimum submergence of the submerged-motor pumps (D-011)."
  - id: I-203
    title: T-2101 pressure high-high
    cause: {tag: PZT-2112, condition: PAHH}
    effects:
      - {tag: XV-1102, action: close}
      - {tag: PV-1110, action: open}
    sheet: P-02
    sil: null
    notes: "Stops the fill and opens the vapour header to the flare ahead of PSV-2131A/B (D-017)."
  - id: I-204
    title: T-2101 pressure low-low
    cause: {tag: PZT-2112, condition: PALL}
    effects:
      - {tag: P-2101A, action: stop}
      - {tag: P-2101B, action: stop}
      - {tag: P-2101C, action: stop}
      - {tag: P-2101D, action: stop}
      - {tag: K-7101A, action: stop}
      - {tag: K-7101B, action: stop}
      - {tag: K-7101C, action: stop}
      - {tag: PV-1111, action: open}
    sheet: P-02
    sil: null
    notes: "Vacuum protection ahead of the vacuum relief valves PSV-2133A/B: stops the withdrawal and the BOG compressors, opens the make-up gas (D-017)."
  # ---- T-3101 (P-03)
  - id: I-301
    title: T-3101 level high-high
    cause: {tag: LZT-3102, condition: LAHH}
    effects:
      - {tag: XV-1103, action: close}
    sheet: P-03
    sil: null
    notes: "As I-201."
  - id: I-302
    title: T-3101 level low-low
    cause: {tag: LZT-3102, condition: LALL}
    effects:
      - {tag: P-3101A, action: stop}
      - {tag: P-3101B, action: stop}
      - {tag: P-3101C, action: stop}
      - {tag: P-3101D, action: stop}
      - {tag: P-3102, action: stop}
    sheet: P-03
    sil: null
    notes: "As I-202."
  - id: I-303
    title: T-3101 pressure high-high
    cause: {tag: PZT-3112, condition: PAHH}
    effects:
      - {tag: XV-1103, action: close}
      - {tag: PV-1110, action: open}
    sheet: P-03
    sil: null
    notes: "As I-203."
  - id: I-304
    title: T-3101 pressure low-low
    cause: {tag: PZT-3112, condition: PALL}
    effects:
      - {tag: P-3101A, action: stop}
      - {tag: P-3101B, action: stop}
      - {tag: P-3101C, action: stop}
      - {tag: P-3101D, action: stop}
      - {tag: K-7101A, action: stop}
      - {tag: K-7101B, action: stop}
      - {tag: K-7101C, action: stop}
      - {tag: PV-1111, action: open}
    sheet: P-03
    sil: null
    notes: "As I-204."
  # ---- Berth 2 (P-05) and Berth 1 (P-06)
  - id: I-501
    title: Berth 2 ESD-1 (ship-shore link, manual, fire and gas)
    cause: {tag: XS-5100, condition: trip}
    effects:
      - {tag: P-2101A, action: stop}
      - {tag: P-2101B, action: stop}
      - {tag: P-2101C, action: stop}
      - {tag: P-2101D, action: stop}
      - {tag: P-3101A, action: stop}
      - {tag: P-3101B, action: stop}
      - {tag: P-3101C, action: stop}
      - {tag: P-3101D, action: stop}
      - {tag: XV-5101, action: close}
      - {tag: XV-4101, action: close}
      - {tag: XV-4102, action: close}
    sheet: P-05
    sil: null
    latching: true
    reset: manual
    notes: "Stops the loading and trips the carrier's ESD through the link both ways (S-01, D-016); pumps stopped first, XV-5101 closing in 25-30 s against surge (ASSUMED, D-016). Manual push buttons and the platform fire and gas detection also initiate it."
  - id: I-502
    title: Berth 2 header back-pressure high-high
    cause: {tag: PZT-5103, condition: PAHH}
    effects:
      - {tag: P-2101A, action: stop}
      - {tag: P-2101B, action: stop}
      - {tag: P-2101C, action: stop}
      - {tag: P-2101D, action: stop}
      - {tag: P-3101A, action: stop}
      - {tag: P-3101B, action: stop}
      - {tag: P-3101C, action: stop}
      - {tag: P-3101D, action: stop}
      - {tag: XV-5101, action: close}
    sheet: P-05
    sil: null
    notes: "Rising back-pressure at the shore manifold stops the loading (S-01): carrier valves closing against the flow."
  - id: I-503
    title: Berth 2 ESD-2 (arm envelope limit, 35 kn disconnect)
    cause: {tag: ZS-5151, condition: ZAHH}
    logic: {any: [{tag: ZS-5151, state: ZAHH}, {tag: ZS-5152, state: ZAHH}, {tag: ZS-5153, state: ZAHH}, {tag: ZS-5154, state: ZAHH}, {text: "manual ESD-2 push button"}]}
    latching: true
    reset: manual
    effects:
      - {tag: XV-5101, action: close}
      - {tag: XV-5131, action: close}
      - {tag: XV-5132, action: close}
      - {tag: XV-5133, action: close}
      - {tag: XV-5134, action: close}
      - {tag: XV-5141, action: close}
      - {tag: XV-5142, action: close}
      - {tag: XV-5143, action: close}
      - {tag: XV-5144, action: close}
    sheet: P-05
    sil: null
    notes: "After ESD-1 (I-501): closes both ball valves of every ERS, then releases the emergency release couplers (dry break) (D-014, D-016); 35 kn disconnect limit (S-01)."
  - id: I-601
    title: Berth 1 ESD-1 (ship-shore link, manual, fire and gas)
    cause: {tag: XS-6100, condition: trip}
    effects:
      - {tag: P-2101A, action: stop}
      - {tag: P-2101B, action: stop}
      - {tag: P-2101C, action: stop}
      - {tag: P-2101D, action: stop}
      - {tag: P-3101A, action: stop}
      - {tag: P-3101B, action: stop}
      - {tag: P-3101C, action: stop}
      - {tag: P-3101D, action: stop}
      - {tag: XV-6101, action: close}
      - {tag: XV-4101, action: close}
      - {tag: XV-4102, action: close}
    sheet: P-06
    sil: null
    notes: "As I-501 for Berth 1."
  - id: I-602
    title: Berth 1 header back-pressure high-high
    cause: {tag: PZT-6103, condition: PAHH}
    effects:
      - {tag: P-2101A, action: stop}
      - {tag: P-2101B, action: stop}
      - {tag: P-2101C, action: stop}
      - {tag: P-2101D, action: stop}
      - {tag: P-3101A, action: stop}
      - {tag: P-3101B, action: stop}
      - {tag: P-3101C, action: stop}
      - {tag: P-3101D, action: stop}
      - {tag: XV-6101, action: close}
    sheet: P-06
    sil: null
    notes: "As I-502."
  - id: I-603
    title: Berth 1 ESD-2 (arm envelope limit, 35 kn disconnect)
    cause: {tag: ZS-6151, condition: ZAHH}
    logic: {any: [{tag: ZS-6151, state: ZAHH}, {tag: ZS-6152, state: ZAHH}, {tag: ZS-6153, state: ZAHH}, {tag: ZS-6154, state: ZAHH}, {text: "manual ESD-2 push button"}]}
    latching: true
    reset: manual
    effects:
      - {tag: XV-6101, action: close}
      - {tag: XV-6131, action: close}
      - {tag: XV-6132, action: close}
      - {tag: XV-6133, action: close}
      - {tag: XV-6134, action: close}
      - {tag: XV-6141, action: close}
      - {tag: XV-6142, action: close}
      - {tag: XV-6143, action: close}
      - {tag: XV-6144, action: close}
    sheet: P-06
    sil: null
    notes: "As I-503."
  # ---- BOG compressors (P-07)
  - id: I-701
    title: BOG suction drum level high-high
    cause: {tag: LZT-7106, condition: LAHH}
    effects:
      - {tag: K-7101A, action: stop}
      - {tag: K-7101B, action: stop}
      - {tag: K-7101C, action: stop}
      - {tag: XV-7121A, action: close}
      - {tag: XV-7121B, action: close}
      - {tag: XV-7121C, action: close}
    sheet: P-07
    sil: null
    notes: "Liquid carry-over (spray failure) would damage the machines; tank pressure then goes to the flare by PV-1110 (D-010, D-017)."
  - id: I-702
    title: K-7101A machine protection (vibration, bearings)
    cause: {tag: VZ-7110A, condition: trip}
    effects:
      - {tag: K-7101A, action: stop}
      - {tag: XV-7121A, action: close}
    sheet: P-07
    sil: null
    notes: "Vendor API 670 system; K-7101B and C alike with VZ-7110B/C, XV-7121B/C (D-010)."
  # ---- impoundment (P-08)
  - id: I-801
    title: Tank-area sump low temperature (LNG in the sump)
    cause: {tag: TSL-8102, condition: TSL}
    effects:
      - {tag: P-8102, action: stop}
    sheet: P-08
    sil: null
    notes: "Keeps LNG out of the oily water system; starts the high-expansion foam (D-018)."
