  notes: 'B-SUB, the substation and control building, is the temporary refuge (layout/building.yaml, D-037.5) and its gas-tightness
    rests on this trip (layout/hvac.yaml AHU-1 notes, D-035.10; layout review 2026-11-05-basic-layout-5 #6 and the adversarial
    check of layout review 7, D-039): flammable gas detectors AT-8141A/B/C in the LV1 intake duct (point IR, ASSUMED, F&G
