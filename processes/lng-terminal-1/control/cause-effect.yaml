- id: I-801
  title: Tank-area sump LNG detected (TSL-8102 in the pocket, TSL-8120 on the P-8102 discharge, gas at the pit rim AT-8124;
    any) - P-8102 feeder isolated
  cause:
    tag: TSL-8102
