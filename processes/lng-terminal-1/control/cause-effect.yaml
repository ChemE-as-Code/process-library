  notes: 'Dry-sump pump of T-8102 (D-037.15 (a), D-037.16): P-8103, a vertical line-shaft pump with its bowl in the floor
    pocket (~0.8 m across, 0.5 m deep, ~0.25 m3, ASSUMED) and its motor on the sump cover (no motor in the sump), 20 m3/h
    (ASSUMED) against the ~10.5 m3/h of the ASSUMED design rain; levels of LZT-8106 from the pocket floor. LZT-8106 is the
