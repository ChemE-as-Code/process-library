    unit: s
  latching: true
  reset: manual
  notes: 'The eight ERS ball valves close and the powered emergency release couplers release once I-503 has held for 5 s,
    so the pumps are already stopping (review #4). The ERS closure time is set with the arm vendor so the surge stays inside
    the arm design (D-023, relief case of PSV-5131).'
- id: I-504
  title: 'Berth 2 hybrid arm: liquid isolation may open only with the vapour isolation proven closed'
  cause:
    tag: ZSC-5125
    condition: not closed
  logic:
    all:
    - tag: XV-5123
      state: open command
    - tag: ZSC-5125
      state: not closed
  effects:
  - tag: HS-5123
    action: trip
  sheet: P-05
  sil: null
  latching: false
  reset: automatic
  notes: 'Start permissive on the open command, not a trip: the effect blocks the open command of HS-5123 and never acts on
    the valve itself (review #3, H-03 A13, review 2026-11-05-basic-design-2#2): the open command of XV-5123 is blocked while
    ZSC-5125 does not prove XV-5125 closed; an XV-5123 already open is never closed by it, so a failed ZSC-5125 signal cannot
    close the arm in service. Also key-interlocked at the arm (vendor).'
