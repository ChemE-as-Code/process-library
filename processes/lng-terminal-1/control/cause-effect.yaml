  effects:
  - tag: K-7101A
    action: stop
  - tag: XV-7121A
    action: close
  - tag: XV-7123A
    action: close
  sheet: P-07
  sil: null
  latching: true
  reset: manual
  notes: 'Warm recycle or loss of the desuperheater (review #9, D-010).'
