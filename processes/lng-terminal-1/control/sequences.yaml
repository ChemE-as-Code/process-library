# Operating sequences. Schema: `cheme schema sequences` (skill control-sequences).
# PROPOSED, not approved for implementation. Trips by C&E id; setpoints ASSUMED. The loading
# sequence follows the order of the LNG Canada Terminal Information Guide (S-01): vapour arm
# connected first, N2 leak test, purge, cooldown, ramp-up, topping-off, drain and purge,
# disconnect. Berth 2 shown; Berth 1 runs the same with the 6xxx tags.
schema: cheme/sequences/v1
sequences:
  - id: SEQ-LOAD
    title: Load a carrier at Berth 2
    mode: normal
    section: JETTY
    cases: [loading]
    equipment: [LA-5101, LA-5102, LA-5103, LA-5104, P-2101A, P-2101B, P-2101C, P-2101D, K-7101A, K-7101B]
    permissives:
      - {tag: XS-5100, state: healthy}
      - {text: "carrier moored and the mooring loads within limits; wind below 30 kn sustained, waves below 1.5 m (S-01)"}
      - {tag: LZT-2102, state: above the low-low trip}
      - {loop: PIC-1110, state: in auto}
      - {tag: K-7101A, state: running}
    interlocks: [I-501, I-502, I-503, I-507, I-504, I-505, I-511, I-512, I-513, I-514, I-202, I-204, I-804]
    steps:
      - id: S0
        title: Line up from holding
        actions:
          - {tag: XV-4105, action: close, by: operator}
          - {tag: XV-2123, action: close, by: operator}
          - {tag: XV-3123, action: close, by: operator}
          - {tag: XV-4106, action: open, by: operator}
          - {tag: XV-4103, action: open, by: operator}
          - {tag: XV-5122, action: open, by: operator}
          - {tag: XV-5161, action: close, by: operator}
          - {tag: P-2102, action: start, by: operator}
        complete: {all: [{tag: XV-4105, state: closed}, {tag: XV-5125, state: closed}, {tag: XV-5161, state: closed}, {tag: P-2102, state: running}]}
        timeout: {value: 30, unit: min}
        on_timeout: abort
        operator: "Review 2026-11-05-basic-design#22: the circulation return closes so line B carries LNG to the berth; the tank-end and platform crossovers open; the hybrid vapour isolation XV-5125 stays closed (I-504, I-505); the circulation pump keeps the desuperheater spray."
      - id: S1
        title: Connect the vapour arm and leak test it
        actions:
          - {text: "connect LA-5102 to the carrier's vapour manifold", by: operator}
          - {text: "N2 leak test of the vapour arm at 2.5 bar (S-01)", by: operator}
          - {text: "AI-4133 selects the vapour return path make-before-break (I-511, I-512, I-513): de-inerting and gassing-up vapour to the flare through XV-4131, on-specification vapour to the tanks through XV-4135 (D-026)", by: automatic}
        complete: {all: [{tag: XV-5132, state: open}, {tag: XV-5142, state: open}, {any: [{tag: ZSO-4131, state: open}, {tag: ZSO-4135, state: open}]}]}
        timeout: {value: 1, unit: h}
        on_timeout: abort
        operator: "The vapour arm first and disconnected last (S-01); the carrier's return then runs free to the tank vapour header."
      - id: S2
        title: Connect the liquid arms, leak test and purge
        actions:
          - {text: "connect LA-5101, LA-5103, LA-5104", by: operator}
          - {tag: HV-5153, action: close, by: operator}
          - {tag: HV-5151, action: open, by: operator}
          - {tag: HV-5152, action: open, by: operator}
          - {text: "N2 leak test of the liquid arms at 5 bar, then purge to below 1 % O2 (S-01)", by: operator}
          - {tag: HV-5152, action: close, by: operator}
          - {tag: HV-5151, action: close, by: operator}
          - {tag: HV-5153, action: open, by: operator}
        complete: {text: "O2 below 1 % at the arm vents"}
        timeout: {value: 2, unit: h}
        on_timeout: abort
      - id: S3
        title: ESD test, cooldown of the arms and the carrier manifold, ESD test repeated
        actions:
          - {text: "first ESD-1 test through the ship-shore link before cooldown (S-01), in test mode: the sequence abort on I-501 is inhibited for the test only; the test mode ends automatically with the reset of I-501 or 15 min after it was set (ASSUMED), whichever comes first", by: operator}
          - {text: "reset I-501 once the test is complete and the link is healthy (this ends the test mode)", by: operator}
          - {tag: XV-4101, action: open, by: operator}
          - {tag: XV-4102, action: open, by: operator}
          - {tag: XV-5101, action: open, by: operator}
          - {tag: XV-5121, action: open, by: operator}
          - {loop: FIC-4101, action: setpoint, setpoint: {kind: setpoint, value: 500, unit: m3/h, provenance: assumed, source: "D-016: cooldown rate, ASSUMED"}, by: operator}
          - {loop: FIC-4101, action: auto, by: operator}
          - {text: "cool the arms and the carrier manifold to LNG temperature", by: operator}
          - {text: "second ESD-1 test after cooldown (S-01), in test mode as for the first test (ends with the reset of I-501 or after 15 min)", by: operator}
          - {text: "reset I-501 once the repeated test is complete and the link is healthy (this ends the test mode)", by: operator}
          - {tag: XV-4101, action: open, by: operator}
          - {tag: XV-4102, action: open, by: operator}
          - {tag: XV-5101, action: open, by: operator}
          - {tag: XV-5121, action: open, by: operator}
          - {loop: FIC-4101, action: auto, by: operator}
        complete: {all: [{text: "arm and manifold temperatures at LNG temperature"}, {text: "ESD-1 test repeated after cooldown (S-01)"}, {interlock: I-501, state: reset}, {tag: XV-4101, state: open}, {tag: XV-4102, state: open}, {tag: XV-5101, state: open}, {loop: FIC-4101, state: in auto}]}
        timeout: {value: 2, unit: h}
        on_timeout: abort
        operator: "Cool slowly to avoid thermal shock on the arms; the circulation pump P-2102 (500 m3/h, D-008) gives the cooldown flow through line A. The cooldown vapour returns through the vapour arm, to the flare while AI-4133 reads off-specification. Each ESD-1 test opens XV-4135 (I-501) and XV-4131 closes only once XV-4135 is proven open (I-513), so the test never closes the vapour return (review 2026-11-05-basic-design-2#1); with off-specification vapour only the residual line pack of the return reaches the tanks, which D-026.1 shows to stay well below their 1 vol % O2 limit (review 2026-11-05-basic-design-4 #4). After each test the reset of I-501 and the reopening of XV-4101 / XV-4102 / XV-5101 / XV-5121 restore the line-up, so S4 starts against open valves (review 2026-11-05-basic-design-4 #3, D-028)."
      - id: S4
        title: Ramp up to the full loading rate (arm line-up from the cargo plan, D-026.6)
        actions:
          - {tag: XV-5124, action: open, by: operator}
          - {text: "line-up (a), the normal one: open XV-5123 (the hybrid arm as the third liquid arm; I-504 permits it with XV-5125 proven closed), start P-2101A/B/C/D, FIC-4101 and FIC-4102 to 6,000 m3/h each (12,000 m3/h)", by: operator}
          - {text: "line-up (b), a carrier that needs more return: open XV-5125 (the hybrid arm as the second vapour arm; I-505 permits it with XV-5123 proven closed), start P-2101A/B/C, FIC-4101 and FIC-4102 to 4,000 m3/h each (8,000 m3/h)", by: operator}
          - {tag: K-7101B, action: start, by: operator}
        complete: {all: [{loop: FIC-4101, state: at setpoint}, {loop: FIC-4102, state: at setpoint}]}
        timeout: {value: 2, unit: h}
        on_timeout: abort
        operator: "Ramp in steps on the carrier's request; the carrier ramps its return-gas compressor over at least 1 h (S-01); start the second BOG compressor before the return reaches one machine's capacity. Four pumps make the 12,000 m3/h (D-011). In line-up (a) the carrier keeps its return within one vapour arm (~23.5 t/h) and burns the balance on board; line-up (b) gives two vapour paths at 8,000 m3/h (D-026.6)."
      - id: S5
        title: Topping off and stop
        actions:
          - {text: "reduce the rate on the carrier's request for topping off", by: operator}
          - {tag: P-2101D, action: stop, by: operator}
          - {tag: P-2101C, action: stop, by: operator}
          - {tag: P-2101B, action: stop, by: operator}
          - {tag: P-2101A, action: stop, by: operator}
          - {tag: XV-5101, action: close, by: operator}
        complete: {text: "carrier reports the cargo loaded"}
      - id: S6
        title: Drain, purge and disconnect
        actions:
          - {tag: XV-5161, action: open, by: operator}
          - {text: "drain the arms and the header to D-5101; P-5101 returns it to the platform crossover", by: operator}
          - {text: "N2 purge to below 2 % hydrocarbons (S-01) through HV-5151 and HV-5152 with the bleed HV-5153 closed; the purge N2 leaves through XV-5161, D-5101 and its vent BOG-5002 into the vapour return (D-026.13); then both blocks closed and the bleed opened", by: operator}
          - {tag: XV-5161, action: close, by: operator}
          - {text: "disconnect the liquid arms, then the vapour arm", by: operator}
          - {tag: XV-4106, action: close, by: operator}
          - {sequence: SEQ-HOLD, action: run, by: operator}
        complete: {text: "arms stowed"}
    abort:
      condition: {any: [{all: [{interlock: I-501, state: tripped}, {text: "not one of the two ESD-1 tests of S3 (test mode, ended by the reset of I-501 or after 15 min)"}]}, {interlock: I-503, state: tripped}, {interlock: I-804, state: tripped}]}
      actions:
        - {sequence: SEQ-ESD, action: run, by: automatic}
      notes: "Any ESD ends the loading; ESD-2 also releases the arms."
    reset: {latching: true, manual: true}

  - id: SEQ-HOLD
    title: Holding - circulate the loading lines
    mode: normal
    section: TRANSFER
    cases: [holding]
    equipment: [P-2102, XV-4101, XV-4102, XV-4103, XV-4105, XV-4106]
    permissives:
      - {tag: LZT-2102, state: above the low-low trip}
      - {all: [{interlock: I-501, state: reset}, {interlock: I-601, state: reset}]}
    interlocks: [I-202]
    steps:
      - id: S1
        title: Open the loop and start the circulation pump
        actions:
          - {tag: XV-4106, action: close, by: operator}
          - {tag: XV-4101, action: open, by: operator}
          - {tag: XV-4102, action: open, by: operator}
          - {loop: FIC-4101, action: manual, by: operator}
          - {loop: FIC-4102, action: manual, by: operator}
          - {text: "FV-4101 and FV-4102 fully open in manual (the circulation flow is set by P-2102)", by: operator}
          - {tag: XV-4103, action: open, by: operator}
          - {tag: XV-4105, action: open, by: operator}
          - {tag: XV-2123, action: open, by: operator}
          - {tag: P-2102, action: start, by: operator}
        complete: {all: [{tag: XV-4106, state: closed}, {tag: XV-4101, state: open}, {tag: XV-4102, state: open}, {tag: TI-4102, state: "< 3 K above the tank liquid"}]}
        timeout: {value: 4, unit: h}
        on_timeout: abort
        operator: "Circulation out on line A, back on line B (D-008); the tank-end crossover XV-4106 closed so the flow runs the whole trestle loop (review 2026-11-05-basic-design-2#3); the vapour return lines stay cold through the tank vapour."
    abort:
      condition: {interlock: I-202, state: tripped}
      actions:
        - {tag: P-2102, action: stop, by: automatic}
    reset: {latching: true, manual: true, condition: {tag: LZT-2102, state: above the low-low trip}, restart: {text: "operator restarts SEQ-HOLD from S1"}}

  - id: SEQ-BOG-START
    title: Start a BOG compressor (run per machine; K-7101A shown, K-7101B and K-7101C the same with their tags)
    mode: startup
    section: BOG
    cases: [holding, loading]
    equipment: [K-7101A, XV-7121A, XV-7123A, XV-7130]
    permissives:
      - {tag: LZT-7106, state: below the high-high trip}
      - {loop: TIC-7103, state: in auto}
      - {loop: UIC-7104A, state: in auto}
    interlocks: [I-701, I-702, I-703A, I-705A, I-704]
    steps:
      - id: S1
        title: Open the suction and start on full recycle
        actions:
          - {text: "XV-7125A (recycle isolation) proven open", by: operator}
          - {tag: XV-7121A, action: open, by: operator}
          - {tag: K-7101A, action: start, by: operator}
        complete: {tag: K-7101A, state: running}
        timeout: {value: 30, unit: min}
        on_timeout: abort
      - id: S2
        title: Open the discharge and the battery limit, then load the machine
        actions:
          - {tag: XV-7123A, action: open, by: operator}
          - {text: "XV-7123A proven open (the position feedback of its actuator, vendor; no position switch drawn at basic): after any trip it was closed, latching, by I-701, I-702, I-703A or I-705A", by: operator}
          - {tag: XV-7130, action: open, by: operator}
          - {text: "XV-7130 proven open: I-704 has reset by itself now that K-7101A runs, but the valve stays closed until opened here", by: operator}
          - {loop: PIC-7101, action: auto, by: operator}
        complete: {all: [{tag: XV-7123A, state: open}, {tag: XV-7130, state: open}, {loop: PIC-7101, state: in auto}]}
        timeout: {value: 30, unit: min}
        on_timeout: abort
        operator: "Review 2026-11-05-basic-design-4 #6: without the discharge isolation open the restarted machine would stay on full recycle and PIC-7101 could not load it."
    abort:
      condition: {any: [{interlock: I-701, state: tripped}, {interlock: I-702, state: tripped}, {interlock: I-703A, state: tripped}, {interlock: I-705A, state: tripped}]}
      actions:
        - {tag: K-7101A, action: stop, by: automatic}
    reset: {latching: true, manual: true, condition: {tag: LZT-7106, state: below the high-high trip}, restart: {text: "operator restarts SEQ-BOG-START from S1"}}

  - id: SEQ-ESD
    title: Berth ESD-1 / ESD-2 response
    mode: abnormal
    section: JETTY
    cases: [loading]
    equipment: [XV-5101, XV-4101, XV-4102]
    interlocks: [I-501, I-503, I-507, I-513, I-804]
    steps:
      - id: S1
        title: Loading stopped and the line isolated
        actions:
          - {text: "I-501 (directly, through I-503 on ESD-2, or through the air-header trip I-804) stops the loading pumps and trips the carrier's ESD through XS-5100, then closes XV-5101 (25-30 s) and XV-4101/4102, and opens XV-4135 so the vapour return stays open to the tanks (I-513 then closes XV-4131); on ESD-2, I-507 closes the ERS valves 5 s later; on an air failure the ESD valves hold on their accumulators until the pumps are stopped and close at their set speed (D-028)", by: automatic}
        complete: {all: [{tag: XV-5101, state: closed}]}
      - id: S2
        title: Pressure the isolated header is under
        actions:
          - {text: "watch PZT-5103; PSV-5131 relieves surge or thermal expansion into D-5101", by: operator}
          - {loop: PIC-1110, action: auto, by: operator}
        complete: {text: "the cause found and cleared; the carrier informed"}
        operator: "After ESD-2 the arms are released 5 s after I-503 (I-507; I-607 on Berth 1): the outboard ERS valves stay on the carrier side; recover the arms before any restart."
    abort:
      condition: {text: "none: the ESD response runs to the end"}
      actions:
        - {text: "no abort: the trips latch until reset", by: automatic}
      notes: "The ESD response itself cannot be aborted."
    reset: {latching: true, manual: true, condition: {text: "cause cleared, ship-shore link healthy, arms recovered after ESD-2"}, restart: {text: "the loading restarts from SEQ-LOAD S3 (cooldown) after ESD-1, from S1 after ESD-2"}}

  - id: SEQ-FILL-CHANGE
    title: Change the fill of a tank between top and bottom fill (make-before-break)
    mode: normal
    section: STORAGE
    cases: [holding, loading, average]
    equipment: [XV-1106, XV-1107, XV-1108, XV-1109]
    permissives:
      - {text: "AI-1102 against LTD-2103 / LTD-3103 calls for the other fill point (rollover, D-007)"}
      - {tag: PZT-1105, state: below the high-high trip}
    interlocks: [I-102, I-201, I-301]
    steps:
      - id: S1
        title: Open the new fill selection valve first
        actions:
          - {text: "open the selection valve of the new fill point (T-2101: XV-1106 top / XV-1107 bottom; T-3101: XV-1108 top / XV-1109 bottom) from its HS", by: operator}
        complete: {all: [{text: "the new selection valve open for at least its stroke time (fail last, no position switch: proven by the open command held for the stroke time and a local check)"}, {tag: PI-1104, state: "steady, not rising"}]}
        timeout: {value: 10, unit: min}
        on_timeout: abort
      - id: S2
        title: Close the old fill selection valve
        actions:
          - {text: "close the selection valve of the old fill point", by: operator}
        complete: {all: [{tag: PI-1104, state: "steady, not rising"}, {tag: PZT-1105, state: below the high-high trip}]}
        operator: "Review 2026-11-05-basic-design-3#8, D-026.4: make-before-break, the new branch is open before the old one closes, so the rundown always has a way into the tank. A change that closes both trips I-102 through PZT-1105 (trains tripped, battery limit closed). The fill ESD valve XV-1102 / XV-1103 of a tank that is not lined up is kept closed, so ZSC-1102 / ZSC-1103 show which tank can take the rundown (I-102, D-028)."
    abort:
      condition: {tag: PZT-1105, state: rising towards the high-high trip}
      actions:
        - {text: "reopen the old selection valve (or keep it open) and stop the change", by: operator}
      notes: "I-102 acts on its own at high-high header pressure."
    reset: {latching: false, manual: true, restart: {text: "operator restarts SEQ-FILL-CHANGE from S1"}}
