  - {tag: JB-A3-1, point: [1464.5, 3082.5, 1.2], capacity: 24, instruments: [LIC-8101, LZT-8105, HS-8101A, HS-8101B, FI-8133, TI-8131, "*-813?"], notes: "Flare KO drum, the start / stop of its pumps from LIC-8101 (HS-8101A/B, D-026.11) and the flare's pilot and purge gas, between the drum and its laydown"}
