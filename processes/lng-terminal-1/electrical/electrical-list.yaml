notes: >-
  Every power, voltage and room is ASSUMED (see the header). The trestle (2.1 km) is served by
  a jetty substation SS-2 (B-JET, outside the 200 m radius of the arms) with two 6.6 kV
  feeders from SWG-1, not by 400 V cables from the shore (ASSUMED); its 400 V feeders to the
  platform loads are ~220-240 m. Cable sizes are the package table's and size the trays only; load flow,
  voltage drop (the 2.2 km 6.6 kV feeders and the ~450 m 400 V feeders to the flare pumps
  P-8101A/B), short circuit, motor starting of the 1.85 MW compressors and the 1.05 MW in-tank
  pumps (the motor powers of this list since D-036; reduced-voltage or soft start, ASSUMED) and hazardous-area cable glands are the
  electrical engineer's. Fire-resistant cable (IEC 60331, cited by number only, ASSUMED,
  D-033.7, D-035.5): the ESD and fire and gas circuits from B-SUB on PR7 / PR3 over the trough,
  the rundown trip circuits from JB-PR1 (XV-1102 / 1103, ZSC-1102 / 1103, PZT-1105, XV-4101 /
  4102 / 4105 / 4106) and the platform ESD / ERS / ERC circuits from JB-A4-1 / -2. The basin's
  PR8 circuits (JB-A8-1) each have a defined state on a burnt cable (D-035.4; the design owner's
  C&E since D-039.9): the P-8102 feeder, LI-8103 and HS-8103 stop the pump, which is not needed
  in a spill; TSL-8102 and TSL-8120 (de-energise to trip, ASSUMED) trip I-801, which opens the
  feeder; AT-8124 reports a fault to the F&G system; a bad LZT-8113 signal is taken as its LAH, a
  transfer hold, not the I-809 trip (C&E I-809 notes, SEQ-LOAD S0 / S4). B-SUB intake gas
  detection (D-035.10, C&E I-811 since D-039): the detectors AT-8141A/B/C in the LV1 intake duct
  and the damper actuators UZ-8142 (LV1) / UZ-8143 (LV2) and the AHU-1 fan stop UZ-8144 are cabled
  to the junction box JB-SUB beside LV1 inside the building, with its multipair to CR-1
  (D-039.9, ASSUMED; layout/hvac.yaml AHU-1 notes).
