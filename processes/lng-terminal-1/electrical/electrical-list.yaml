  - {tag: F-SS2-B, point: [1129.6, 1110.0, 4.0], power_kw: 400, voltage_v: 6600, power_factor: 0.85, room: SWG-1, assumed: true, source: "ASSUMED, the second 100 % feeder", notes: "6.6 kV, as F-SS2-A"}
