# Electrical list. Schema: `cheme schema electrical`. Skill electrical-cabling.
# Electrical philosophy at this stage, every value ASSUMED until the electrical engineer's load
# list and single-line diagram (D-020: electric drives throughout, grid supply; 6.6 kV for the
# in-tank pumps and the BOG compressors, 400 V otherwise):
# - supply: two 69 kV incomers from the LNG Canada site grid substation (ASSUMED) into the
#   terminal substation SS-1 in B-SUB (layout/building.yaml), two 69 / 6.6 kV transformers
#   (N+1), 6.6 kV switchgear SWG-1 for the eight in-tank loading pumps and the three BOG
#   compressors, two 6.6 / 0.4 kV transformers for the 400 V MCC-1;
# - the loading platform is 2.1 km from SS-1 along the trestle: a 400 V supply over that
#   distance is not practical (voltage drop, cable size), so the jetty has its own
#   substation SS-2 in B-JET (ASSUMED): two 6.6 kV feeders from SWG-1 along the PR2 trestle
#   tray to a 6.6 / 0.4 kV transformer and the 400 V MCC-2 for the jetty drain pumps and the
#   loading-arm hydraulic power units; B-JET stands on a piled deck west of the trestle road
#   208 m north of the nearest arm, outside the 200 m ignition-free radius and the vapour-arm
#   safety zone of both berths (D-018, D-027), so the platform loads have ~220-240 m 400 V
#   feeders along the trestle tray; the platform's instrument junction boxes home to the
#   rack room RR-2 in B-JET, linked to the control room CR-1 by fibre-optic cable (not
#   modelled);
# - instrument cables to junction boxes, multipair home runs to CR-1 (or RR-2) in trays.
substations:
  - {id: SS-1, title: "Terminal substation in B-SUB", building: B-SUB, incoming_kv: 69, notes: "ASSUMED: two 69 kV incomers from the LNG Canada site grid substation (D-020); the supply voltage is the utility's and the site's choice"}
  - {id: SS-2, title: "Jetty substation in B-JET", building: B-JET, incoming_kv: 6.6, notes: "ASSUMED: fed by two 6.6 kV feeders F-SS2-A / F-SS2-B from SWG-1 over the trestle (PR2 power tray); outside the 200 m radius of every arm (D-027)"}
transformers:
  - {tag: TR-1, substation: SS-1, rating_kva: 10000, primary_kv: 69, secondary_v: 6600, feeds: [SWG-1], notes: "ASSUMED, one of two (N+1): running load at loading ~7.5 MW (4 of 8 in-tank pumps 3.71 MW since D-034, 2 of 3 BOG compressors 2.85 MW, circulation 0.06 MW, LV and platform ~0.8 MW) at pf 0.9 / efficiency 0.95 ~8.7 MVA"}
  - {tag: TR-2, substation: SS-1, rating_kva: 10000, primary_kv: 69, secondary_v: 6600, feeds: [SWG-1], notes: "ASSUMED, the second of the N+1 pair. TR-1 / TR-2 are oil-filled outdoor units in bays with fire walls and oil pits south of B-SUB beside the 69 kV incomer bay, away from the AHU-1 intake on the east wall (zone Z-KC-TX-BAYS, D-029, D-031); the substation is B-SUB in this list because the schema places a transformer in its substation's building"}
  - {tag: TR-3, substation: SS-1, rating_kva: 1600, primary_kv: 6.6, secondary_v: 400, feeds: [MCC-1], notes: "ASSUMED, one of two: circulation pumps, KO drum and sump pumps, lighting, HVAC, heat tracing, UPS, small power"}
  - {tag: TR-4, substation: SS-1, rating_kva: 1600, primary_kv: 6.6, secondary_v: 400, feeds: [MCC-1], notes: "ASSUMED, the second of the pair"}
  - {tag: TR-5, substation: SS-2, rating_kva: 630, primary_kv: 6.6, secondary_v: 400, feeds: [MCC-2], notes: "ASSUMED: two arm hydraulic power units 2 x 75 kW, two jetty drain pumps 2 x 11.2 kW, the jetty sump dry-sump pump P-8103 3 kW (D-037.16), platform lighting, gangway and fire pumps' controls, ~0.3 MW"}
rooms:
  # the B-SUB cables leave its west wall (SWG-1 at the middle of the wall, the build's default
  # exit) onto the cable bridge PR7 to PR3 (D-027)
  - {id: SWG-1, kind: switchgear, title: "6.6 kV switchgear", building: B-SUB, substation: SS-1, voltage_v: 6600}
  - {id: MCC-1, kind: mcc, title: "400 V motor control centre", building: B-SUB, substation: SS-1, voltage_v: 400, point: [1164.5, 2969.0, 3.0]}
  - {id: CR-1, kind: control, title: "Control room with the DCS and SIS marshalling", building: B-SUB, point: [1164.5, 2961.0, 3.0]}
  # the jetty rooms' cables leave B-JET through its east wall, cross the trestle road R5 high
  # and climb onto the PR2 tray (D-027)
  - {id: MCC-2, kind: mcc, title: "Jetty 400 V motor control centre (platform loads)", building: B-JET, substation: SS-2, voltage_v: 400, point: [1129.6, 1106.0, 4.0]}
  - {id: RR-2, kind: rack_room, title: "Jetty instrument rack room (remote I/O, fibre to CR-1)", building: B-JET, point: [1129.6, 1114.0, 4.0]}
  # the two UPS of D-032.2 (review 2026-11-05-basic-layout-5 #8), each with its own battery and
  # distribution board in B-JET (ASSUMED; modelled as LV boards, the schema has no UPS kind)
  - {id: UPS-A, kind: mcc, title: "UPS A and its distribution board (ERS solenoid channel A, ESD / F&G field power)", building: B-JET, substation: SS-2, voltage_v: 230, point: [1129.6, 1107.5, 4.0], notes: "ASSUMED: fed from MCC-2 with its own battery; channel A of every ERS valve (D-016, D-032.2)"}
  - {id: UPS-B, kind: mcc, title: "UPS B and its distribution board (ERS solenoid channel B)", building: B-JET, substation: SS-2, voltage_v: 230, point: [1129.6, 1112.0, 4.0], notes: "ASSUMED: fed from MCC-2 with its own battery, separate from UPS A (D-032.2)"}
defaults: {lv_room: MCC-1, mv_room: SWG-1, control_room: CR-1, lv_voltage_v: 400, mv_voltage_v: 6600, mv_above_kw: 200, jb_capacity: 24, spare_pairs: 0.2}
