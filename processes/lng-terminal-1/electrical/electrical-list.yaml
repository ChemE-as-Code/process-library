feeders:
  # loading-arm hydraulic power units (arm manoeuvring, ERS and coupler hydraulics), one per
  # berth beside its arms at the platform deck (vendor package, D-014)
  # D-035.5 (review 2026-11-05-basic-layout-5 #5 and the missed medium of its adversarial
  # check): the HPUs stood 4-7 m from the crossover tray and their own manifold bays (20-80
  # kW/m2 from one bay fire). They move to the platform's north-west / north-east corners,
  # outside every bay's 8 kW/m2 band (bay fire with its drained part, D-018 method, D-035.9),
  # and each arm's emergency release coupler takes its own accumulator on the arm (arm vendor,
  # ASSUMED), so the release does not depend on the HPU or its hoses surviving a tray fire
  - {tag: HPU-5100, point: [1132.0, 923.5, 1.0], power_kw: 75, voltage_v: 400, power_factor: 0.78, room: MCC-2, assumed: true, source: "ASSUMED 75 kW per berth (task basis; the arm vendor's HPU rating replaces it); power factor 0.78 = motor pf 0.85 x efficiency 0.92 (ASSUMED)", notes: "Berth 2 arm HPU at the platform's north-west corner, west of R9 and north of the laydown Z-LAY-A4NW, outside every bay's 8 kW/m2 band (D-035.5, D-035.9); hoses to the arms along the west edge (vendor)"}
  - {tag: HPU-6100, point: [1178.0, 923.5, 1.0], power_kw: 75, voltage_v: 400, power_factor: 0.78, room: MCC-2, assumed: true, source: "ASSUMED 75 kW per berth, as HPU-5100", notes: "Berth 1 arm HPU at the platform's north-east corner, north of the laydown Z-LAY-A4NE, outside every bay's 8 kW/m2 band (D-035.5, D-035.9)"}
  # ERS solenoid supplies (D-016, D-032.2; review 2026-11-05-basic-layout-5 #8): channel A of
  # every ERS valve of a berth from UPS A, channel B from UPS B, on separate feeders.
  # D-037 (review 2026-11-05-basic-layout-6 #10): a requirement of D-032.2, not a choice left
  # open: channel A and channel B run in separate power trays along PR2 (PR2 has two LV power
  # trays, electrical/tray-rules.yaml, and the build puts the A and B feeders of a berth in
  # different ones) and in separate fire-resistant cables on the platform, and end at separate
  # terminations: channel A in the HPU control panel, channel B in its own ERS channel B
  # termination box 2.5 m south of it (so one tray fire, one panel fault or one mechanical
  # impact cannot take both); where the two trays cannot be 0.3 m apart (the B-JET wall exit,
  # the PR2 / platform transition), a fire barrier between them (ASSUMED, electrical engineer)
  - {tag: F-ERS-5100A, point: [1132.0, 924.3, 1.0], power_kw: 1.0, voltage_v: 230, power_factor: 0.9, room: UPS-A, assumed: true, source: "ASSUMED: ERS solenoid channel A of Berth 2 (8 solenoids, D-016)", notes: "UPS A to the Berth 2 HPU control panel, channel A of the ERS solenoids (D-032.2)"}
  - {tag: F-ERS-5100B, point: [1131.0, 921.0, 1.0], power_kw: 1.0, voltage_v: 230, power_factor: 0.9, room: UPS-B, assumed: true, source: "ASSUMED: ERS solenoid channel B of Berth 2", notes: "UPS B to the Berth 2 HPU control panel, channel B (D-032.2)"}
  - {tag: F-ERS-6100A, point: [1178.0, 924.3, 1.0], power_kw: 1.0, voltage_v: 230, power_factor: 0.9, room: UPS-A, assumed: true, source: "ASSUMED: ERS solenoid channel A of Berth 1", notes: "UPS A to the Berth 1 HPU control panel, channel A (D-032.2)"}
  - {tag: F-ERS-6100B, point: [1179.0, 921.0, 1.0], power_kw: 1.0, voltage_v: 230, power_factor: 0.9, room: UPS-B, assumed: true, source: "ASSUMED: ERS solenoid channel B of Berth 1", notes: "UPS B to the Berth 1 HPU control panel, channel B (D-032.2)"}
  # the jetty substation's two 6.6 kV incomers from SWG-1 over the trestle, ending at the
  # B-JET cable entry (the transformer TR-5 inside)
  - {tag: F-SS2-A, point: [1129.6, 1109.0, 4.0], power_kw: 400, voltage_v: 6600, power_factor: 0.85, room: SWG-1, assumed: true, source: "ASSUMED: platform load ~0.3 MW (TR-5 notes) with margin, one of two 100 % feeders", notes: "6.6 kV, ~1.9 km along the PR2 trestle power tray, into B-JET through its east wall"}
