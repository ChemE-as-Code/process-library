  - {tag: AI-4134, point: [1105.5, 2889.5, 1.5], notes: "In the analyser house B-ANA, sample from vapour return B (ASSUMED)"}
notes: >-
  Every power, voltage and room is ASSUMED (see the header). The trestle (2.1 km) is served by
  a jetty substation SS-2 (B-JET, outside the 200 m radius of the arms) with two 6.6 kV
  feeders from SWG-1, not by 400 V cables from the shore (ASSUMED); its 400 V feeders to the
  platform loads are ~220-240 m. Cable sizes are the package table's and size the trays only; load flow,
  voltage drop (the 2.2 km 6.6 kV feeders and the ~450 m 400 V feeders to the flare pumps
  P-8101A/B), short circuit, motor starting of the 1.4 MW compressors and the 0.64 MW in-tank
  pumps (reduced-voltage or soft start, ASSUMED) and hazardous-area cable glands are the
  electrical engineer's.
