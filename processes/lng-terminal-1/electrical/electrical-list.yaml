  # suction header (x 1040) and the recycle risers (x 1042.5 / 1043.5), 1 m up; the cable runs
  # from there in a conduit along the skid to the motor terminal box at the east end (~15 m)
  - {driven: K-7101A, power_kw: 1426, voltage_v: 6600, room: SWG-1, assumed: true, source: "datasheet K-7101A shaft_power_kw 1,426 (27 t/h, 108 -> 600 kPa(a), polytropic 0.78, D-010, D-022)", cable_entry: {point: [1041.0, 3021.0], elevation_m: 1.0}}
  - {driven: K-7101B, power_kw: 1426, voltage_v: 6600, room: SWG-1, assumed: true, source: "datasheet K-7101B shaft_power_kw 1,426 (D-022)", cable_entry: {point: [1041.0, 3006.0], elevation_m: 1.0}}
  - {driven: K-7101C, power_kw: 1426, voltage_v: 6600, room: SWG-1, assumed: true, source: "datasheet K-7101C shaft_power_kw 1,426 (D-022)", cable_entry: {point: [1041.0, 2991.0], elevation_m: 1.0}}
  # flare KO drum pumps: the tray ends west of P-8101A, out of D-8101's crane lane from Z-PAD-A3
  - {driven: P-8101A, power_kw: 6.7, voltage_v: 400, room: MCC-1, assumed: true, source: "datasheet P-8101A shaft_power_kw 6.7 (D-017, D-022)", cable_entry: {point: [1436.4, 3065.0], elevation_m: 1.0}}
  - {driven: P-8101B, power_kw: 6.7, voltage_v: 400, room: MCC-1, assumed: true, source: "datasheet P-8101B shaft_power_kw 6.7 (D-022)", cable_entry: {point: [1436.4, 3066.0], elevation_m: 1.0}}
  - {driven: P-8102, power_kw: 6.8, voltage_v: 400, room: MCC-1, assumed: true, source: "datasheet P-8102 shaft_power_kw 6.8 (D-018, D-022)", cable_entry: {side: south}, notes: "Tray from the north end of the basin services rack PR8 (D-029)"}
  - {driven: P-5101, power_kw: 11.2, voltage_v: 400, room: MCC-2, assumed: true, source: "datasheet P-5101 shaft_power_kw 11.2 (D-016, D-022)"}
  - {driven: P-6101, power_kw: 11.2, voltage_v: 400, room: MCC-2, assumed: true, source: "datasheet P-6101 shaft_power_kw 11.2 (D-022)"}
