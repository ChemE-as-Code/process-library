  - {tag: HPU-6100, point: [1161.5, 901.0, 1.0], power_kw: 75, voltage_v: 400, power_factor: 0.78, room: MCC-2, assumed: true, source: "ASSUMED 75 kW per berth, as HPU-5100", notes: "Berth 1 arm HPU, north-west of the Berth 1 crane strip"}
