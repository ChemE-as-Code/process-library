  - {driven: P-2101D, power_kw: 1050, voltage_v: 6600, room: SWG-1, assumed: true, source: "datasheet P-2101D motor_rating_kw 1,050 (D-022, D-036)", cable_entry: {side: south, elevation_m: 56.8}}
  - {driven: P-3101A, power_kw: 1050, voltage_v: 6600, room: SWG-1, assumed: true, source: "datasheet P-3101A motor_rating_kw 1,050 (D-022, D-036)", cable_entry: {side: north, elevation_m: 56.8}}
  - {driven: P-3101B, power_kw: 1050, voltage_v: 6600, room: SWG-1, assumed: true, source: "datasheet P-3101B motor_rating_kw 1,050 (D-022, D-036)", cable_entry: {side: south, elevation_m: 56.8}}
  - {driven: P-3101C, power_kw: 1050, voltage_v: 6600, room: SWG-1, assumed: true, source: "datasheet P-3101C motor_rating_kw 1,050 (D-022, D-036)", cable_entry: {side: south, elevation_m: 56.8}, notes: "As P-2101C (D-029)"}
  - {driven: P-3101D, power_kw: 1050, voltage_v: 6600, room: SWG-1, assumed: true, source: "datasheet P-3101D motor_rating_kw 1,050 (D-022, D-036)", cable_entry: {side: south, elevation_m: 56.8}}
  - {driven: P-2102, power_kw: 60.6, voltage_v: 400, room: MCC-1, assumed: true, source: "datasheet P-2102 shaft_power_kw 60.6 (500 m3/h rated, D-011, D-022)", cable_entry: {side: north, elevation_m: 56.8}}
  - {driven: P-3102, power_kw: 60.6, voltage_v: 400, room: MCC-1, assumed: true, source: "datasheet P-3102 shaft_power_kw 60.6 (D-022)", cable_entry: {side: north, elevation_m: 56.8}}
