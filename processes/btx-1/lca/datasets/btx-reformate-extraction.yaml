# Tier 1 form, a manifest-only entry as process-library#317. Every amount is the formula of its parameters;
# core's validator re-checks each. Written from the LVOC BREF and the DOE profile (facts in our own form).
# The lumped formulas of reformate and raffinate in generation.formulas follow the parameters: recompute them
# whenever a composition or recovery parameter changes (provenance.notes).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: btx-reformate-extraction
title: Benzene, toluene and mixed xylenes by solvent extraction of catalytic reformate
description: Per 1 t of benzene, toluene and mixed xylenes together, gate-to-gate. Reformate split, sulfolane-type
  extraction, clay treatment and benzene, toluene and xylene columns. Raffinate and C9+ aromatics are co-products.
  Feed slate from one typical US reformate, utilities as midpoints of the EU LVOC BREF ranges for BTX extraction
  units.
basis: 1000 kg of benzene, toluene and mixed xylenes together
boundary: 'gate-to-gate: reformate splitting (mass balance only), aromatics extraction with solvent recovery,
  clay treatment, benzene, toluene and xylene fractionation; steam, fuel heat and power from outside'
technology: liquid-liquid or extractive-distillation extraction with sulfolane-type solvent, clay treatment,
  distillation; para-xylene recovery, isomerisation, toluene conversion and pygas feed are not modelled
geography:
  description: 'Utilities: EU plants of the LVOC BREF data collection. Feed slate: a typical US reformate (DOE
    2000). No single site.'
classification:
  isic: '2011'
system_boundary:
  included:
  - reformate feed and its split into products, raffinate and C9+ aromatics
  - electricity, gross steam, fired heat
  - clay make-up, spent clay, solvent-regenerator sludge
  - water drained from the benzene column
  excluded:
  - 'TODO energy of the reformate splitter (C9+ removal), usually a refinery column: not in the BREF''s BTX
    extraction figures (Table 4.3)'
  - 'TODO extraction solvent make-up (sulfolane or another): the BREF gives no consumption (4.3.3)'
  - 'TODO fugitive and vent VOC (benzene among them) and SO2 from sulfolane degradation: not quantified in
    the BREF for extraction units (4.3.1.2); sent to shared refinery abatement'
  - 'TODO steam-ejector and clay steaming-out condensates, and BTX and solvent in the effluent: not quantified'
  - 'TODO heat integration with other units and heat recovery: no credit in the cut-off model'
  - storage emissions
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: included
  non_routine: excluded
location: RER
year: 2012
valid_until: 2017
time:
  start: 1999
  description: 'Utilities: LVOC BREF data collection 2012. Feed slate: DOE profile of 2000 citing 1992 to 1999
    sources. valid_until is the reference year + 5 (system-model section 6), so it has already lapsed.'
modelling:
  principle: attributional
  multifunctionality: 'unallocated multi-output dataset; default allocation mass: benzene, toluene, mixed xylenes,
    raffinate and C9+ aromatics are all co-products (no subdivision: one extraction and fractionation train
    makes them). No sourced prices, so the WBCSD price ratio cannot be computed; mass is the preliminary choice
    (see allocation).'
allocation:
  method: mass
  coproducts:
  - benzene
  - toluene
  - xylenes
  - raffinate
  - c9-aromatics
  deviation: No sourced prices, so the WBCSD price ratio of the five co-products cannot be computed. Raffinate
    and C9+ aromatics are gasoline components, but the aromatics have energy content too, so an energy rule
    is not clearly the physical relationship. Mass is the preliminary choice.
