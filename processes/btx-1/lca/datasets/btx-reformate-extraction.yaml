- name: clay
  value: 0.377
  unit: kg
  description: 'Spent clay per t product: midpoint of 0.104 to 0.65 kg/t (BB2).'
  source: EU JRC (2017) LVOC BREF, EUR 28882 EN, doi:10.2760/77304, Table 4.5, p. 219; the midpoint, and fresh
