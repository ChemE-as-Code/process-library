- name: sludge
  value: 0.0265
  unit: kg
  description: 'Solvent-regenerator sludge per t product: midpoint of 0.003 to 0.05 kg/t.'
  source: EU JRC (2017) LVOC BREF, EUR 28882 EN, doi:10.2760/77304, section 4.3.6.4, p. 219 (one example of
    the data collection); the midpoint is our choice
- name: ww
  value: 0.3
  unit: kg
  description: Water drained from the benzene column water boot per t aromatics extract.
  source: EU JRC (2017) LVOC BREF, EUR 28882 EN, doi:10.2760/77304, section 4.3.2.2, p. 215 ('a few hundred
