- name: w_X
  value: 0.261
  unit: kg/kg
  description: Mixed xylenes (with ethylbenzene) in the reformate, mass fraction.
  source: US DOE OIT (2000) Energy and Environmental Profile of the U.S. Chemical Industry, chapter 4, Table
    4-1, p. 108 (26.1 %; the text says the xylene stream also holds ethylbenzene); wt% reading ASSUMED as for
    w_B
- name: w_A
  value: 0.743
  unit: kg/kg
  description: Total aromatics in the reformate, mass fraction; the part above benzene, toluene and xylenes
    is taken as the C9+ aromatics.
  source: 'US DOE OIT (2000) Energy and Environmental Profile of the U.S. Chemical Industry, chapter 4, Table
    4-1, p. 108 (74.3 % total aromatics); wt% reading and that the difference is C9+ aromatics are ASSUMED.
    The rest (25.7 %) is taken as non-aromatics. Compare REF BREF (2015) section 2.6, p. 58: CCR reformates
    above 70 % v/v aromatics'
- name: r_B
  value: 0.995
  unit: kg/kg
  description: Benzene recovered of the benzene fed.
  source: 'Honeywell UOP, Aromatics recovery web page (ED Sulfolane), accessed 2026-11-05 (manufacturer): benzene
    and toluene recovery greater than 99.5 % for extractive distillation (ED Sulfolane); taking the bound,
    and for a liquid-liquid unit, is ASSUMED'
- name: r_T
  value: 0.995
  unit: kg/kg
  description: Toluene recovered of the toluene fed.
  source: Honeywell UOP, Aromatics recovery web page (ED Sulfolane), accessed 2026-11-05 (manufacturer), as
    r_B; ASSUMED as for r_B
- name: r_X
  value: 0.98
  unit: kg/kg
  description: Mixed xylenes recovered of the xylenes fed.
  source: 'ASSUMED: no open source read for the xylene recovery of a sulfolane unit; set lower than r_B and
    r_T as a judgement (heavier aromatics are held less by the solvent). TODO a sourced value'
- name: elec
  value: 41.5
  unit: kWh
  description: 'Electricity per t product: midpoint of 11 to 72 kWh/t (BB2, BTX extraction).'
  source: EU JRC (2017) LVOC BREF, EUR 28882 EN, doi:10.2760/77304, Table 4.3, p. 217 (data collection 2012);
    the midpoint and reading 'per tonne of product' as per t of benzene, toluene and xylenes are our choices
- name: steam
  value: 576.5
  unit: kWh
  description: 'Steam per t product: midpoint of 531 to 622 kWh/t (BB2).'
