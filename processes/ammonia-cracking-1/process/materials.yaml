    cas: 7440-37-1
    molar_mass: 39.948
    normal_boiling_point: 87.30
    critical: {Tc: 150.687, Pc: 4863, omega: -0.00219, provenance: given, source: "chemicals 1.5.2: Tc HEOS, Pc HEOS, omega HEOS"}
    ideal_gas: {dHf_298: 0.0, S_298: 154.8, cp_R: [2.50001], temperature_range: [298.15, 1500], provenance: given, source: "chemicals 1.5.2: dHf_298 ATCT_G, S_298 CRC; monatomic ideal gas (thermo 0.6.1 HEOS_FIT, 0.00% deviation)"}
templates:
  - id: ammonia
    title: Ammonia feed (liquid and vapour)
    components: [NH3]
  - id: cracked
    title: Cracked gas, PSA product and tail gas (hydrogen, nitrogen, ammonia)
    components: [H2, N2, NH3]
  - id: air
    title: Combustion air
    components: [N2, O2, AR]
  - id: flue
    title: Burner feed and flue gas
    components: [H2, N2, NH3, O2, H2O, AR]
# property_method is a placeholder: the vapour streams are computed on the ideal-gas basis of
# the data above (D-008); the liquid ammonia feed is outside core's packages (L-2).
property_method:
  adapter: thermo
  status: placeholder
