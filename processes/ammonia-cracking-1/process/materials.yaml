    critical: {Tc: 126.192, Pc: 3395.8, omega: 0.0372, provenance: given, source: "chemicals 1.5.2: Tc HEOS, Pc HEOS, omega HEOS"}
    ideal_gas: {dHf_298: 0.0, S_298: 191.6, cp_R: [3.79935, -0.00209702, 4.57541e-06, -3.03024e-09, 6.85763e-13], temperature_range: [298.15, 1500], provenance: given, source: "chemicals 1.5.2: dHf_298 ATCT_G, S_298 CRC, cp_R fitted to thermo 0.6.1 HEOS_FIT 298.15-1500 K (max deviation 0.09%)"}
