# Components and templates of ammonia-cracking-1. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol (IUPAC conventional
# atomic weights applied to the formula), normal_boiling_point in K at 101.325 kPa.
#
# Property sources (DESIGN.md source register SRC-5): printed by `cheme chemistry thermo NAME
# --fit 298.15,1500` with cheme-as-code 1.13.0 (chemicals 1.5.2, thermo 0.6.1):
# - ideal_gas: dHf_298 ATcT (chemicals' ATCT_G), S_298 the CRC Handbook's values as packaged in
#   chemicals; cp_R a quartic fitted by core to thermo's TRCIG (NH3, H2) or HEOS_FIT (N2, O2,
#   H2O, Ar) ideal-gas heat capacity over 298.15-1500 K (deviation printed in each source). The
#   fit runs to 1500 K because the furnace's combustion products pass that range on their way
#   to the stack (D-008). Single facts with the package named, not open data (library ADR 0037);
#   no table copied.
# - critical constants: the HEOS reference equations as packaged in chemicals.
# - The ideal-gas data give the heat of 2 NH3 -> N2 + 3 H2 as 2 x 45.558 = 91.12 kJ/mol at
#   298.15 K (53.04 kJ per mol NH3 at 773.15 K) and its equilibrium constant: at 1100 kPa(a) and
#   773.15 K 97.42 % of the ammonia is cracked (reactions.yaml header). R101's outlet, which
#   `cheme process propagate` writes, and its duty Q1, which scripts/balance.py gives (core's
#   equilibrium reactor writes no duty, DESIGN.md L-1), rest on these data.
# - Liquid ammonia (the feed) is only in the vaporiser E-101's cold side: its heat of
#   vaporization and liquid heat capacity are taken by scripts/balance.py from thermo 0.6.1
#   (D-008), not from this file.
# Argon stands for argon and the other minor gases of air (CO2, neon) (D-006).
schema: cheme/process/v1
kind: materials
components:
  - id: NH3
    name: Ammonia
    formula: NH3
    cas: 7664-41-7
    molar_mass: 17.031
    normal_boiling_point: 239.82
    critical: {Tc: 405.56, Pc: 11363.4, omega: 0.256, provenance: given, source: "chemicals 1.5.2: Tc HEOS, Pc HEOS, omega HEOS"}
    ideal_gas: {dHf_298: -45558.0, S_298: 192.8, cp_R: [3.17207, 0.00327594, 1.90313e-06, -2.08027e-09, 5.26428e-13], temperature_range: [298.15, 1500], provenance: given, source: "chemicals 1.5.2: dHf_298 ATCT_G, S_298 CRC, cp_R fitted to thermo 0.6.1 TRCIG 298.15-1500 K (max deviation 0.48%)"}
  - id: H2
    name: Hydrogen
    formula: H2
    cas: 1333-74-0
    molar_mass: 2.016
    normal_boiling_point: 20.27
    critical: {Tc: 33.145, Pc: 1296.4, omega: -0.219, provenance: given, source: "chemicals 1.5.2: Tc HEOS, Pc HEOS, omega HEOS"}
    ideal_gas: {dHf_298: 0.0, S_298: 130.7, cp_R: [3.29621, 0.00115759, -2.3324e-06, 2.10906e-09, -5.98313e-13], temperature_range: [298.15, 1500], provenance: given, source: "chemicals 1.5.2: dHf_298 ATCT_G, S_298 CRC, cp_R fitted to thermo 0.6.1 TRCIG 298.15-1500 K (max deviation 0.50%)"}
  - id: N2
