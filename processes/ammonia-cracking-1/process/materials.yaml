    ideal_gas: {dHf_298: 0.0, S_298: 205.2, cp_R: [3.33121, 3.73673e-05, 2.68405e-06, -2.58548e-09, 7.32021e-13], temperature_range: [298.15, 1500], provenance: given, source: "chemicals 1.5.2: dHf_298 ATCT_G, S_298 CRC, cp_R fitted to thermo 0.6.1 HEOS_FIT 298.15-1500 K (max deviation 0.42%)"}
