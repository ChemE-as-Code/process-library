id: hydrogen-by-catalytic-ammonia-cracking-with-psa-purification-200-t-d
title: Hydrogen by catalytic ammonia cracking with PSA purification (200 t/d)
description: Unallocated foreground LCI of Hydrogen by catalytic ammonia cracking with PSA purification
  (200 t/d), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Catalytic ammonia cracking: pressurised liquid ammonia vaporised against the cracked gas,
  superheated to 723 K in the convection section and cracked over a nickel catalyst in fired tubes to
  equilibrium at 773 K and 1100 kPa(a) (97.4 % of the ammonia cracked); cracked gas cooled to 313 K, hydrogen
  purified by PSA (79.4 % hydrogen recovery) to 99.99 mol%; the PSA tail gas (hydrogen, nitrogen, ammonia)
  is the furnace''s only fuel, burnt with 2 mol% excess oxygen; 200 t/d of hydrogen in 8000 h (EP 4 337
  600 A1 reference example 2)'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:burner-nox-and-slip
  title: combustion emissions of H-101
  direction: output
  reason: 'NOT ESTIMATED, open point of D-006 and L-3: the burners fire a tail gas with 3.2 mol% ammonia,
    part of which forms NO (fuel NOx) and some of which may slip unburnt; N2O may form too. The flowsheet
    burns it completely to N2 and water. No open source read here gives a NOx, N2O or slip factor for
    ammonia-bearing tail gas at this scale, nor the low-NOx burners or the SCR that would keep them within
    a permit; the zeros in the inventory are not data.'
  source: DESIGN.md D-006, D-010, L-3
- key: emission-excluded:fugitive-losses
  title: equipment-leaks emissions of the plant
  direction: output
  reason: 'No P&ID yet: fugitive ammonia and hydrogen from flanges, seals and valves, and the PSA''s depressurisation
    losses beyond the tail gas, are not estimated at the concept stage (D-010).'
