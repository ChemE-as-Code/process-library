[project]
name = "wwtp-a2o-example"
version = "0.1.0"
description = "Local ChemE-as-Code A2/O example with direct QSDsan execution"
requires-python = ">=3.12"
# Numerical versions remain in requirements.lock.txt; this file configures local development.
dependencies = ["typer==0.27.3"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.16.10"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "runs", "process/simulation-runs", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "BLE", "C4", "PIE", "RUF012", "RUF100", "PLW1510"]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.isort]
known-first-party = ["chemeascode", "wwtp_a2o"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
