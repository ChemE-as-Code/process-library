schema: cheme/simulation/v1
kind: simulation
simulator: qsdsan
qsdsan:
  model: wwtp-a2o
  worker: wwtp_a2o.interfaces.cli.cheme
  input: inputs/baseline.json
  files:
    - licenses/EXPOsan-LICENSE.txt
    - licenses/QSDsan-LICENSE.txt
    - process/case-inputs.json
    - process/flowsheet.yaml
    - process/materials.yaml
    - pyproject.toml
    - requirements.lock.txt
    - wwtp_a2o/__init__.py
    - wwtp_a2o/domains/__init__.py
    - wwtp_a2o/domains/process/__init__.py
    - wwtp_a2o/domains/process/diagrams.py
    - wwtp_a2o/domains/process/model.py
    - wwtp_a2o/domains/process/simulation.py
    - wwtp_a2o/integrations/__init__.py
    - wwtp_a2o/integrations/clarifier.py
    - wwtp_a2o/integrations/plotting.py
    - wwtp_a2o/integrations/qsdsan.py
    - wwtp_a2o/interfaces/__init__.py
    - wwtp_a2o/interfaces/cli/__init__.py
    - wwtp_a2o/interfaces/cli/cheme.py
    - wwtp_a2o/interfaces/report.py
    - wwtp_a2o/interfaces/templates/report.html
    - wwtp_a2o/project/__init__.py
    - wwtp_a2o/project/artifacts.py
    - wwtp_a2o/project/design_review.py
  timeout_s: 300
