schema: cheme-as-code/process/v1
id: wwtp-a2o
title: A2/O wastewater waterline with direct QSDsan simulation
summary: >-
  Generic seven-reactor ASM2d waterline, secondary clarifier and recycles.
  Run locally in Python and inspect inputs, wastewater results and numerical
  checks alongside ChemE-as-Code diagrams.
families: [wastewater-treatment]
keywords: [A2O, ASM2d, wastewater, QSDsan, EXPOsan, nitrogen, phosphorus]
maturity: concept
repository: {url: "https://github.com/ChemE-as-Code/process-library", path: processes/wwtp-a2o, access: public}
publication: {status: public, license: CC-BY-4.0}
lca: {source: none, notes: "Dynamic waterline example; no LCI dataset or environmental footprint is claimed."}
validation:
  status: unreviewed
  notes: >-
    Software example only. Integration and adapter checks are distinct from
    elemental balance, steady-state proof, plant validation and design approval.
chemistry:
  inputs:
    - {chemical: wastewater, role: feedstock, note: "ASM2d fractions with explicit COD/N/P measurement bases; not a molecular composition."}
  outputs:
    - {chemical: wastewater, role: main-product, note: "Treated effluent; sludge discharge is recorded separately in the simulation evidence."}
basis:
  capacity: "18446 m3/day example influent; 7999 m3 biological volume"
references:
  - {title: "EXPOsan 1.5.3: exposan/bsm1/system.py, ASM2d CSTR branch"}
  - {title: "QSDsan: An integrated platform for quantitative sustainable design of sanitation and resource recovery systems", doi: "10.1039/d2ew00455k"}
