technology: 'Batch plant: adipic acid slurried in demineralised water, molten hexamethylenediamine dosed
  into it at 338 K to a 52 wt% AH salt solution with a 0.52 % diamine excess; the solution concentrated
  to 70 wt% in the autoclave at about 383 K, heated on hot oil to 548 K with the steam bled at 1750 kPa(a),
  depressurised, finished at atmospheric pressure, extruded with nitrogen, water-quenched and cut to pellets;
  the vapours condensed to the wastewater treatment; 5303.03 kg per batch, 1508.6 batches a year on a
  dedicated train'
