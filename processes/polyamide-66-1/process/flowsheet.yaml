# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Polyamide 66 by batch melt polycondensation of AH salt in an autoclave (EU POL BREF 2006,
# section 9.2.2.3; DESIGN.md D-001), a batch plant: adipic acid is slurried in demineralised
# water (M101) and warmed to 338 K (E101) in the salt dissolver R-101; molten hexamethylenediamine
# is dosed into it (R101, a semi-batch neutralisation) to a 52 wt% AH salt solution with a small
# diamine excess. The autoclave R-201 takes one batch of the solution: it first evaporates water
# to 70 wt% salt at about 383 K (X201), then heats the mass to 548 K at a steam-bleed pressure
# of 1750 kPa(a) while the salt polycondenses (R201), is depressurised to atmospheric and
# finished, all water but 0.2 wt% and the free diamine leaving as steam (X202). The melt is
# extruded as strands, water-quenched and cut to pellets (E301). The autoclave's vapours are
# condensed (M201, E201) and go to the site wastewater treatment.
# The flows are the year averages of the batch recipe (process/recipe.yaml, `cheme process
# recipe`, D-003).
# Where the values come from:
# - conditions: EU POL BREF section 9.2.2 (SRC-1) and the design basis, else ASSUMED (D-002 to
#   D-009);
# - the feeds: one design specification (core ADR 0070): the adipic acid S1 for 8000 t/a of
#   pellets, the water S2 and the diamine S4 following it at fixed ratios (52 wt% salt, SRC-1;
#   the diamine's excess the loss to the steam, D-004);
# - R101: cheme's semi-batch model (the rate law of NEUT, D-005); R201: a conversion step
#   (POLY, D-006); X201, X202: component separators with a specified split (core ADR 0070);
#   M101, M201: mixers; E101, E201, E301: pass-through steps; all calculated by `cheme process
#   propagate --fill`, with the duties core's models give (R101's and R201's, core ADR 0059);
# - the duties core does not write (E101's warming, the evaporation heats of X201 and X202,
#   the condenser E-201 and the strand quench E301): scripts/balance.py (library ADR 0027,
#   D-009); the drives' power: ASSUMED year averages (D-009).
schema: cheme/process/v1
kind: flowsheet
title: Polyamide 66 by batch autoclave polycondensation of AH salt (8000 t/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 8000 t/a polyamide 66 pellets, year averages of the batch recipe in 7920 h (D-002, D-003)", default: true}
tolerance: {abs: 0.05, rel: 0.002}   # balances: |in - out| <= abs + rel * max(in, out), kg/h
specs:
  - id: rate
    vary:
      stream: S1
      initial: 650.0
      with: {S2: 1.652875, S4: 0.799344}
    target: {stream: S11, quantity: annual, value: 8000, unit: t}
    provenance: assumed
    source: "8000 t/a of polyamide 66 pellets, ASSUMED (D-002); per kg of adipic acid: water 1.652875 kg, so that the salt solution S5 holds 52.0 wt% AH salt (SRC-1: 52 to 53 %), and hexamethylenediamine 0.799344 kg, 1.005247 mol per mol of acid: the 0.5247 % excess is the diamine stripped with the steam, 2.69 kg per t of pellets (D-004, D-010)"

feeds:
  - {id: AAF, title: Adipic acid (adipic-acid-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: HMDAF, title: "Hexamethylenediamine, molten (bought in)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: DW, title: Demineralised water (salt solution), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: r201, direction: out, kind: energy}
      - {id: e301, direction: out, kind: energy}
  - id: LPS
    title: LP steam 350 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 350, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 412.0, provenance: given, source: "saturation at 350 kPa(a), IAPWS-95 (chemicals 1.5.2 iapws95_Tsat: 412.01 K)"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: e101, direction: out, kind: energy}
  - id: HOTOIL
    title: Hot oil 593/573 K (natural-gas-fired heater)
    category: utility
    utility:
      kind: hot_oil
      level: hot-oil circuit 593/573 K
      supply_temperature: {value: 593.15, provenance: assumed, source: "D-009: hot oil 320 C supply, 45 K above the mass's final 548.15 K (SRC-1: about 275 C); the heater fired on natural gas (SRC-1, section 9.3.3.4: the diathermic oil heaters' combustion fumes)"}
      return_temperature: {value: 573.15, provenance: assumed, source: D-009}
      min_approach: {value: 20, provenance: assumed, source: D-009}
    ports:
      - {id: x201, direction: out, kind: energy}
      - {id: r201, direction: out, kind: energy}
      - {id: x202, direction: out, kind: energy}
products:
  - {id: PA66, title: Polyamide 66 pellets to the silos, category: product, ports: [{id: in, direction: in}]}
  - {id: COND, title: "Process condensate (water with the stripped diamine), to wastewater treatment", category: wastewater, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: e201, direction: in, kind: energy}
      - {id: e301, direction: in, kind: energy}

blocks:
  - id: SALT
    title: Salt preparation (AH salt solution)
    class: ReactingChemicals
    ports:
      - {id: acid, direction: in}
      - {id: water, direction: in}
      - {id: hmda, direction: in}
      - {id: out, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: q, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: POLY
    title: Polycondensation (batch autoclave)
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cond, direction: out}
      - {id: oil1, direction: in, kind: energy}
      - {id: oil2, direction: in, kind: energy}
      - {id: oil3, direction: in, kind: energy}
      - {id: q_cond, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: FINISH
    title: Extrusion, strand quench and pelletising
    class: Cooling
    ports:
      - {id: in, direction: in}
      - {id: product, direction: out}
      - {id: q, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}

steps:
  - id: M101
    block: SALT
    title: Adipic acid slurried in the water charge (R-101)
    class: Mixing
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: acid, direction: in, delegates: acid}
      - {id: water, direction: in, delegates: water}
      - {id: out, direction: out}
  - id: E101
    block: SALT
    title: Slurry warmed to 338 K on the jacket (LP steam)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
  - id: R101
    block: SALT
    title: Neutraliser (molten diamine dosed into the acid slurry at 338 K)
    class: ReactingChemicals
    reactions: [NEUT]
    reactor: semibatch
    energy_port: q
    batch:
      dosing: [{stream: S4, time: 7200}]
      target: {key: AA, conversion: 0.99999}
      heat: isothermal
      provenance: assumed
      source: "molten hexamethylenediamine dosed at a constant rate over 2 h into the adipic acid slurry at 338.15 K (SRC-1: the salt solution kept at 65 C) and held until 0.99999 of the acid is neutralised; the dosing time ASSUMED (D-005)"
    hazard:
      mtt: 373.15
      provenance: assumed
      source: "MTT: the normal boiling point of water, a lower bound of the bubble point of the salt solution (the dissolved salt raises it); R-101 is vented to atmosphere through the salt tank's nitrogen blanket, so the mass boils there (D-011)"
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: charge, direction: in}
      - {id: hmda, direction: in, delegates: hmda}
      - {id: out, direction: out, delegates: out}
      - {id: q, direction: out, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: X201
    block: POLY
    title: Concentration to 70 wt% salt in the autoclave (about 383 K)
    class: SeparatingByThermalProcess
    recovery:
      outlets: {vap: {H2O: 0.537072}}
      provenance: assumed
      source: "SRC-1 section 9.2.2.3: the autoclave's cycle first evaporates part of the solution's water, e.g. to 70 %; the share of S5's water that leaves the 52 wt% solution for 70.0 wt% salt, the diamine bound as salt kept (ASSUMED); at about 383 K (SRC-1 section 9.2.2.2: the continuous concentrator at about 110 C) (D-006)"
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: vap, direction: out}
      - {id: out, direction: out}
      - {id: oil, direction: in, kind: energy, delegates: oil1}
  - id: R201
    block: POLY
    title: Polycondensation (heated to 548 K, steam bled at 1750 kPa(a))
    class: ReactingChemicals
    reactions: [POLY]
    reactor: conversion
    energy_port: oil
    hazard:
      mtt: 573.15
      provenance: assumed
      source: "MTT ASSUMED at 300 C, the autoclave's design temperature, 20 K below the hot oil's supply: the water boils off by design at the bleed pressure, so the boiling point bounds nothing here; above it the melt degrades (SRC-2: Steppan's degradation forms ammonia, CO2 and cross-links) (D-011)"
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: oil, direction: in, kind: energy, delegates: oil2}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: X202
    block: POLY
    title: Steam bleed, depressurisation and finishing (to 0.2 wt% water)
    class: SeparatingByThermalProcess
    recovery:
      outlets: {vap: {H2O: 0.996926, HMDA: 1.0}}
      provenance: assumed
      source: "SRC-1 section 9.2.2.3: the water bled off as steam at constant pressure, the mass depressurised to atmospheric and finished; the share of R201's water that leaves for a melt with 0.2 wt% water (ASSUMED; no open residual water of the batch melt read) and all the free diamine, stripped with the steam (SRC-1 sections 9.2.2.2 and 9.3.3.3: the steam carries diamine) (D-006, D-010)"
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: in, direction: in}
      - {id: vap, direction: out}
      - {id: out, direction: out, delegates: out}
      - {id: oil, direction: in, kind: energy, delegates: oil3}
  - id: M201
    block: POLY
    title: Autoclave vapours collected (concentration and steam bleed)
    class: Mixing
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: a, direction: in}
      - {id: b, direction: in}
      - {id: out, direction: out}
  - id: E201
    block: POLY
    title: Vapour condenser E-201 (to 313 K, cooling water)
    class: Cooling
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: cond}
      - {id: q, direction: out, kind: energy, delegates: q_cond}
  - id: E301
    block: FINISH
    title: Strand extrusion, water quench and cutting to pellets (to 323 K)
    class: Cooling
    links: [{target: equipment, ref: X-301}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: out, direction: out, delegates: product}
      - {id: q, direction: out, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}

