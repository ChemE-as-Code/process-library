# The batch recipe of polyamide-66-1 (schema cheme/recipe/v1, `cheme process recipe`, DESIGN.md
# D-003). One batch makes the pellets of stream S11 from one autoclave charge; the flowsheet's
# rates are the year averages: batch x batches per year / 7920 h.
# - R-101, the salt dissolver, is one vessel over M101 (the acid and water charged), E101 (the
#   slurry warmed) and R101 (the diamine dosed, the semi-batch neutralisation); the dosing and
#   post-reaction take their times from R101's model (from: R101).
# - R-201, the autoclave, is one vessel over X201 (the concentration), R201 (the heating and
#   polycondensation under the steam bleed) and X202 (the depressurisation and finishing). It is
#   the bottleneck. Its phase durations are ASSUMED: the BREF names the phases and the final
#   temperature but no times (SRC-1, D-003). Its volume is given by hand from the 52 wt% charge
#   (core sizes a vessel over separators and a conversion step from no model).
# - X-301, the strand die, quench bath and cutter, runs while the autoclave is extruded.
# - The condenser E-201 runs while the autoclave vents and is no batch unit.
# `cheme process recipe --svg build/gantt.svg` draws one batch.
schema: cheme/recipe/v1
kind: recipe
title: Polyamide 66 by batch autoclave polycondensation
batch_size: {value: 5303.03, unit: kg, stream: S11, provenance: assumed, source: "one autoclave batch of pellets: 8000 t/a over the batches the 5.25 h cycle of R-201 allows (D-002, D-003): 1010.10 kg/h x 5.25 h"}
hours_per_year: {value: 7920, provenance: assumed, source: "330 days of 24 h (D-002)"}
unit_procedures:
  - id: DISSOLVE
    units: [M101, E101, R101]
    title: AH salt solution (R-101)
    vessel: {fill_fraction: 0.8, aspect_ratio: 1.2, provenance: assumed, source: "usual fill and proportions of a stirred vessel (D-003)"}
    operations:
      - {id: charge, kind: charge, title: Charge the water and the adipic acid (M101), duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: heat, kind: heat, title: Warm the slurry to 338 K on LP steam (E101), duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: dose, kind: dose, title: Dose the molten diamine at 338 K (R101), from: R101}
      - {id: react, kind: react, title: Post-reaction to 0.99999 of the acid (R101), from: R101}
      - {id: transfer, kind: transfer, title: "Adjust and sample, transfer to the salt tank under nitrogen", duration: {value: 0.5, provenance: assumed, source: "D-003, D-005: the salt's pH checked before the transfer (SRC-1: the salt is kept under nitrogen)"}}
  - id: AUTOCLAVE
    units: [X201, R201, X202]
    title: Concentration, polycondensation and finishing in the autoclave (R-201)
    operations:
      - {id: charge, kind: charge, title: Charge the salt solution from the salt tank, duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: concentrate, kind: other, title: "Evaporate to 70 wt% salt at about 383 K (X201)", duration: {value: 1.0, provenance: assumed, source: "D-003, D-006: SRC-1's first phase of the cycle"}}
      - {id: react, kind: react, title: "Heat to 548 K, steam bled at 1750 kPa(a) (R201)", duration: {value: 1.5, provenance: assumed, source: "D-003, D-006: SRC-1's polycondensation at constant pressure"}}
      - {id: depressurise, kind: other, title: "Let down to atmospheric pressure (X202)", duration: {value: 1.0, provenance: assumed, source: "D-003, D-006: SRC-1 names the depressurisation rate a critical parameter under software control"}}
      - {id: finish, kind: hold, title: "Finish at 548 K and atmospheric pressure (X202)", duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: extrude, kind: transfer, title: "Pressurise with nitrogen and extrude the melt as strands (E301)", duration: {value: 0.75, provenance: assumed, source: "D-003, D-007: SRC-1, the autoclave pressurised and the melt extruded through a die"}}
  - id: PELLETISE
    unit: E301
    title: Strand quench and cutting (X-301)
    operations:
      - {id: cut, kind: other, title: "Quench the strands in water and cut to pellets", duration: {value: 0.75, provenance: assumed, source: "D-003, D-007: while R-201 extrudes"}}
