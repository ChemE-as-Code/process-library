# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# One-step DMF synthesis from dimethylamine and CO with sodium methoxide in methanol (D-001).
# Where the values come from:
# - feeds, the separator and column outlets and every duty: the concept balance
#   scripts/dmf_balance.py (D-006), given here as ASSUMED: no qualified property package covers
#   the polar, salt-bearing liquid, so flashes, distillation splits and enthalpies
#   are design choices and short-cut estimates;
# - the reactor outlet S7 is calculated by cheme from the sourced conversions (D-005, D-007);
# - the mixer, pump, compressor, filter and splitter outlets are calculated by
#   `cheme process propagate --fill`.
schema: cheme/process/v1
kind: flowsheet
title: "N,N-Dimethylformamide by DMA carbonylation (50 kt/a)"
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 6250 kg/h DMF (50 kt/a at 8000 h/a, D-002)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: DMA, title: "Dimethylamine, anhydrous (from methylamines-1)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: CO, title: Carbon monoxide 99.5 mol% (from a syngas CO separation unit), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: CAT, title: "Sodium methoxide 30 wt% in methanol (catalyst)", category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: k101, direction: out, kind: energy}
      - {id: p101, direction: out, kind: energy}
      - {id: r101, direction: out, kind: energy}
      - {id: c201, direction: out, kind: energy}
      - {id: c202, direction: out, kind: energy}
  - id: MPS
    title: MP steam 1100 kPa(a)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1100, provenance: assumed, source: "design basis, D-010"}
      supply_temperature: {value: 457.6, provenance: assumed, source: "saturation at 1100 kPa(a), D-010"}
      min_approach: {value: 10, provenance: assumed, source: D-010}
    ports: [{id: c201, direction: out, kind: energy}]
  - id: LPS
    title: LP steam 450 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis, D-010"}
      supply_temperature: {value: 420.8, provenance: assumed, source: "saturation at 450 kPa(a), D-010"}
      min_approach: {value: 10, provenance: assumed, source: D-010}
    ports: [{id: c202, direction: out, kind: energy}]
products:
  - {id: DMFP, title: DMF product to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: VENT, title: Reactor vent gas to thermal oxidiser, category: off_gas, ports: [{id: in, direction: in}]}
  - {id: CAKE, title: Sodium formate filter cake to disposal, category: solid_waste, ports: [{id: in, direction: in}]}
  - {id: PURGE, title: Methanol purge (with DMA) to recovery or incineration, category: by_product, ports: [{id: in, direction: in}]}
  - {id: RESID, title: Heavy residue of the DMF column to incineration, category: solid_waste, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-010"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-010"}
      min_approach: {value: 5, provenance: assumed, source: D-010}
    ports:
      - {id: k101, direction: in, kind: energy}
      - {id: r101, direction: in, kind: energy}
      - {id: c201, direction: in, kind: energy}
      - {id: c202, direction: in, kind: energy}

blocks:
  - id: RXN
    title: Feed preparation and carbonylation
    class: ReactingChemicals
    ports:
      - {id: dma, direction: in}
      - {id: co, direction: in}
      - {id: cat, direction: in}
      - {id: rec, direction: in}
      - {id: vent, direction: out}
      - {id: crude, direction: out}
      - {id: power1, direction: in, kind: energy}
      - {id: power2, direction: in, kind: energy}
      - {id: power3, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
  - id: CATR
    title: Catalyst residue removal
    class: SeparatingMechanically
    ports:
      - {id: crude, direction: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out}
  - id: PUR
    title: Methanol recovery and DMF distillation
    class: Distilling
    ports:
      - {id: feed, direction: in}
      - {id: rec, direction: out}
      - {id: purge, direction: out}
      - {id: product, direction: out}
      - {id: residue, direction: out}
      - {id: steam1, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: power1, direction: in, kind: energy}
      - {id: power2, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}

steps:
  - id: K101
    block: RXN
    title: CO compressor (two stages, intercooled)
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in, delegates: co}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power1}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: M101
    block: RXN
    title: Reactor feed drum (DMA, catalyst, recycle)
    class: Mixing
    symbol: VESSEL_DISHED_ENDS_SHAPE
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: dma, direction: in, delegates: dma}
      - {id: cat, direction: in, delegates: cat}
      - {id: rec, direction: in, delegates: rec}
      - {id: out, direction: out}
  - id: P101
    block: RXN
    title: Reactor feed pump
    # GeneratingFlow (the parent of Pumping): a Pumping step stops `cheme process build` in
    # cheme 0.8.0 on Python 3.15 (step_method iterates the Union of its method annotation), D-011
    class: GeneratingFlow
    links: [{target: equipment, ref: P-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power2}
  # D-005, D-007: liquid-phase loop reactor with external circulation cooler (US 4,098,820),
  # 363.15 K, 2200 kPa(a); finishing section under CO deactivates the catalyst (US 4,354,041).
  - id: R101
    block: RXN
    title: Carbonylation loop reactor with circulation cooler
    class: ReactingChemicals
    reactions: [DMF_SYN, CAT_DEACT]
    reactor: conversion
    links: [{target: equipment, ref: R-101}, {target: equipment, ref: E-101}, {target: equipment, ref: P-102}]
    ports:
      - {id: liq, direction: in}
      - {id: gas, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power3}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  - id: V102
    block: RXN
    title: Reactor gas-liquid separator
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-102}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out, delegates: vent}
      - {id: liq, direction: out, delegates: crude}
  # D-008: sodium formate is insoluble in the reaction mass and is filtered (US 4,354,041).
  - id: F101
    block: CATR
    title: Sodium formate filter
    class: Filtering
    solid_separation:
      solid_recovery: 0.99
      cake_liquid: {value: 0.25, basis: mass_fraction}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "D-008: 99 % of the salt retained, wet cake 25 wt% liquor, ASSUMED"
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in, delegates: crude}
      - {id: cake, direction: out, delegates: cake}
      - {id: filtrate, direction: out, delegates: filtrate}
  - id: C201
    block: PUR
    title: Methanol/DMA recovery column (atmospheric)
    class: Distilling
    links: [{target: equipment, ref: C-201}, {target: equipment, ref: E-201}, {target: equipment, ref: E-202}, {target: equipment, ref: P-201}]
    ports:
      - {id: feed, direction: in, delegates: feed}
      - {id: top, direction: out}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: steam1}
      - {id: cond, direction: out, kind: energy, delegates: cw1}
      - {id: power, direction: in, kind: energy, delegates: power1}
  # D-009: the purge fraction that closes the methanol balance (scripts/dmf_balance.py).
  - id: SPL
    block: PUR
    title: Methanol purge take-off
    class: SplittingMaterial
    split: {purge: 0.026151038}
    ports:
      - {id: in, direction: in}
      - {id: purge, direction: out, delegates: purge}
      - {id: rec, direction: out, delegates: rec}
  - id: C202
    block: PUR
    title: DMF finishing column (vacuum)
    class: Distilling
    links: [{target: equipment, ref: C-202}, {target: equipment, ref: E-203}, {target: equipment, ref: E-204}, {target: equipment, ref: P-202}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out, delegates: product}
      - {id: bot, direction: out, delegates: residue}
      - {id: reb, direction: in, kind: energy, delegates: steam2}
      - {id: cond, direction: out, kind: energy, delegates: cw2}
      - {id: power, direction: in, kind: energy, delegates: power2}

streams:
  - id: S1
    title: Fresh dimethylamine
    from: DMA.out
    to: M101.dma
    template: dmf_process
    state:
      design:
        pressure: {value: 500, provenance: assumed, source: "design basis, D-004"}
        temperature: {value: 298.15, provenance: assumed, source: "design basis, D-004"}
        flow: {value: 3902.36, basis: mass, provenance: assumed, source: "scripts/dmf_balance.py: the DMA that gives 6250 kg/h DMF (D-006)"}
        composition: {basis: mole_fraction, values: {DMA: 1.0}, provenance: assumed, source: "design basis, D-004: anhydrous DMA"}
  - id: S2
    title: Carbon monoxide feed
