        flow: {value: 2545.95, basis: mass, provenance: assumed, source: "scripts/dmf_balance.py: 95 mol% CO yield, US 4,098,820 Ex. 1 (D-005, D-006)"}
        composition: {basis: mole_fraction, values: {CO: 0.995, N2: 0.003, H2: 0.002}, provenance: assumed, source: "design basis, D-004: CO purity of the patent examples, impurities ASSUMED"}
        calculated:
          molar_mass: {value: 27.9581, unit: kg/kmol, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR, package syngas-pr-vapor', fingerprint: 626689dfce5beeca, origin: correlation}
          density: {value: 3.33265, unit: kg/m3, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR, package syngas-pr-vapor', fingerprint: 626689dfce5beeca, origin: correlation}
          exergy: {value: 276802.0, unit: kJ/kmol, provenance: calculated, source: 'cheme process props: chemical (Szargut 1988, model II) + physical, dead state 298.15 K, 101.325 kPa', fingerprint: 626689dfce5beeca, origin: correlation}
          enthalpy: {value: 120.784, unit: kJ/kmol, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR, package syngas-pr-vapor', fingerprint: 626689dfce5beeca, origin: correlation}
        phase: {value: vapor, vapor_fraction: 1.0, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR, package syngas-pr-vapor', fingerprint: 626689dfce5beeca}
