        flow: {value: 2545.95, basis: mass, provenance: calculated, source: 'cheme process propagate: pass-through K101 from S2', fingerprint: 3b489e6a919be3b7}
        composition: {basis: mole_fraction, values: {CO: 0.995, N2: 0.003, H2: 0.002}, provenance: calculated, source: 'cheme process propagate: pass-through K101 from S2', fingerprint: 3b489e6a919be3b7}
        calculated:
          molar_mass: {value: 27.9581, unit: kg/kmol, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR, package syngas-pr-vapor', fingerprint: 12c5cae9d93aafc3, origin: correlation}
          density: {value: 24.8886, unit: kg/m3, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR, package syngas-pr-vapor', fingerprint: 12c5cae9d93aafc3, origin: correlation}
          exergy: {value: 281835.0, unit: kJ/kmol, provenance: calculated, source: 'cheme process props: chemical (Szargut 1988, model II) + physical, dead state 298.15 K, 101.325 kPa', fingerprint: 12c5cae9d93aafc3, origin: correlation}
          enthalpy: {value: 264.453, unit: kJ/kmol, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR, package syngas-pr-vapor', fingerprint: 12c5cae9d93aafc3, origin: correlation}
        phase: {value: vapor, vapor_fraction: 1.0, provenance: calculated, source: 'cheme process props: thermo 0.6.1, PR, package syngas-pr-vapor', fingerprint: 12c5cae9d93aafc3}
  - id: S5
