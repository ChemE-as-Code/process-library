# Components and templates of the process. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
# Molar masses from the formulas (IUPAC atomic weights); boiling points from the NIST WebBook
# (DMF: 426 K, average of 8 values listed by NIST, SRD 69, CAS 68-12-2); the others are
# NIST WebBook phase-change values. Sodium methoxide and sodium formate have no normal
# boiling point (salts).
schema: cheme/process/v1
kind: materials
components:
  - {id: CO, name: Carbon monoxide, formula: CO, cas: 630-08-0, molar_mass: 28.010, normal_boiling_point: 81.6}
  - {id: N2, name: Nitrogen, formula: N2, cas: 7727-37-9, molar_mass: 28.014, normal_boiling_point: 77.36}
  - {id: H2, name: Hydrogen, formula: H2, cas: 1333-74-0, molar_mass: 2.016, normal_boiling_point: 20.37}
  - {id: DMA, name: Dimethylamine, formula: C2H7N, cas: 124-40-3, molar_mass: 45.085, normal_boiling_point: 280.0}
  - {id: MEOH, name: Methanol, formula: CH4O, cas: 67-56-1, molar_mass: 32.042, normal_boiling_point: 337.8}
  - {id: DMF, name: "N,N-Dimethylformamide", formula: C3H7NO, cas: 68-12-2, molar_mass: 73.095, normal_boiling_point: 426.0}
  - {id: NAOME, name: Sodium methoxide, formula: CH3NaO, cas: 124-41-4, molar_mass: 54.024}
  - {id: NAFORM, name: Sodium formate, formula: CHNaO2, cas: 141-53-7, molar_mass: 68.007, phase: solid}
  - {id: DME, name: Dimethyl ether, formula: C2H6O, cas: 115-10-6, molar_mass: 46.069, normal_boiling_point: 248.3}
templates:
  - {id: co_gas, title: Carbon monoxide feed gas, components: [CO, N2, H2]}
  - {id: dmf_process, title: DMF synthesis and purification streams, components: [CO, N2, H2, DMA, MEOH, DMF, NAOME, NAFORM, DME]}
# property_method, recorded by `cheme process props --fill`: syngas-pr-vapor covers only the CO
# feed gas (S2, S4). No benchmarked package covers the polar, salt-bearing liquid (DMF,
# methanol, DMA, sodium salts); those streams are refused (DESIGN.md D-006).
property_method:
  adapter: thermo
  status: configured
  package: syngas-pr-vapor
  phase_models:
    phase: Peng-Robinson flash; vapour only (a single-phase state on the only EOS root above the pseudo-critical
      temperature counts as vapour)
    vapor_density: Peng-Robinson
    enthalpy: Peng-Robinson departure + ideal-gas heat capacities; ideal gas 298.15 K, 101.325 kPa = 0
  eos: Peng-Robinson (thermo PRMIX)
  binary_interaction: ChemSep PR kij (thermo IPDB 'ChemSep PR')
  application_range:
    temperature:
    - 250.0
    - 1000.0
    pressure:
    - 100.0
    - 30000.0
