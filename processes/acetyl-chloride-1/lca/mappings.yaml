# acetyl-chloride-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# The preliminary LCI leaves most backgrounds unmapped (DESIGN.md D-012): the build reports each
# as a gap (lci/gaps.json). Linked here: the acetic acid to acetic-acid-1 (glacial acid by
# methanol carbonylation), the nitrogen consumable to asu-1's gaseous nitrogen, and the LP steam
# counted as heat delivered (kWh), as benzoyl-chloride-1 does. Phosphorus trichloride stays a
# gap: no library process exports it (phosphorus-oxychloride-1 makes it only as an internal
# intermediate, block PCL3), and a proxy is recorded in lca.yaml and DESIGN.md D-012, not linked
# (CONTRIBUTING, "Gaps").
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:HAC": {dataset: {path: processes/acetic-acid-1/lca/dataset.yaml, product: "product:HAC"}, source: "the Atlas producer acetic-acid-1, glacial acetic acid by methanol carbonylation (691 ppm water), the grade this feed takes (D-004)"}
  "consumable:nitrogen": {dataset: {path: processes/asu-1/lca/dataset.yaml, product: "product:GANP"}, source: "the Atlas producer asu-1, gaseous nitrogen to the battery limit (99.97 mol% N2, 9 bar(a)); the purges and blankets need only a few hundred kPa"}
  "feed:LPS": {use: steam-heat, source: "LP steam 350 kPa(a) to R-101's tempered-water loop (Q1) and the still's jacket (Q3, the reboiler from core's still model with its column, the reflux and the charge's heat-up included), counted as heat delivered (kWh), D-009"}
