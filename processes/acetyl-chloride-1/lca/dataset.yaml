location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Batch plant: phosphorus trichloride dosed over 2 h into acetic acid at 313 K (semi-batch,
  1 mol per 3 mol), held to 0.95 conversion of the PCl3, the HCl of the acid''s water vented through a
  brine condenser to a water scrubber; the lower phase (crude phosphorous acid) settled off, the upper
  phase distilled at atmospheric pressure in a batch still with a short column; 1459.9 kg per batch, 1370
  batches a year on a dedicated train'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:scrubber-tail-gas
  title: storage-tank emissions of R-101, E-103, A-101
  direction: output
  reason: 'No P&ID yet: R-101 vents only through the vent condenser E-103 and the scrubber A-101, so its
    emissions are the scrubber''s tail gas (the nitrogen of the purges, 0.062 kmol/h, with HCl traces
    and the PCl3 vapour that passes E-103, about 0.001 kmol/h, 0.14 kg/h, which the water hydrolyses)
    goes to air; the balance hydrolyses only the acetyl chloride and absorbs all HCl (D-010, L-2); not
    estimated (open for basic engineering).'
- key: emission-excluded:storage-breathing
  title: storage-tank emissions of T-101, T-102
  direction: output
  reason: The breathing of the acetic acid, PCl3, acetyl chloride and crude phosphorous acid tanks (nitrogen-blanketed,
    vented to E-103) is not estimated (D-010).
