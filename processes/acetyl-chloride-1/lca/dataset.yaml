    for the LCA practitioner to confirm): the crude phosphorous acid (lower phase, 87.5 wt% H3PO3 with
    acetic acid and acetyl chloride; 0.406 kg per kg of acetyl chloride) is a co-product of fixed stoichiometry
    (one H3PO3 per three acetyl chloride) that CS 272 248 B2 uses as it is, diluted, as the phosphorus
    source of a phosphonomethylation. The library hierarchy (docs/system-model.md) has no physical relationship
