        temperature: {value: 313.15, provenance: assumed, source: "settled at R101's temperature, drained to its tank (D-006)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 102.5358, provenance: assumed, source: "scripts/balance.py: D101's specified split of S4 to the lower phase: 99.5 % of the phosphorous acid, 95 % of the acetic acid, 5 % of the PCl3 and 0.8 % of the acetyl chloride, calibrated to the lower phase of CS 272 248 B2, Example 1 (D-006)"}
        composition: {basis: mass_fraction, values: {ACOH: 0.101057444, PCL3: 0.00387561, ACCL: 0.020111662, H3PO3: 0.874955283}, provenance: assumed, source: "scripts/balance.py: D101's specified split of S4 (D-006)"}
