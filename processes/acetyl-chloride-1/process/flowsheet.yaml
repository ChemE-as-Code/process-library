        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 159.1133, provenance: assumed, source: "scripts/balance.py: the PCl3 that makes 2000 t/a of S10 (the balance is linear in the feeds; D-002, D-004)"}
