# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Acetyl chloride from acetic acid and phosphorus trichloride (DESIGN.md D-001), a batch plant:
# acetic acid is charged to R-101 and warmed to 313 K, phosphorus trichloride is dosed into it
# (a semi-batch, reactor: semibatch), the HCl the acid's water gives leaves by the vent
# (batch.vent) through a vent condenser to a water scrubber; the mixture settles in R-101 into
# an upper acetyl chloride phase and a lower phosphorous acid phase (the decanter D101, a
# specified split), the lower phase leaves as crude phosphorous acid, the upper is distilled at
# atmospheric pressure in a batch still with a column on top.
# The flows are the year averages of the batch recipe (process/recipe.yaml, `cheme process
# recipe`, D-003).
# Where the values come from:
# - feeds, temperatures, ratios: design basis and D-002..D-004, ASSUMED or from CS 272 248 B2,
#   Example 1;
# - R101: cheme's semi-batch model with a vent (core ADRs 0050, 0054), from the ASSUMED rate
#   laws, to 0.95 conversion of the PCl3 (D-005);
# - D101 (the phase split) and K101 (the column's rectification on the still): specified
#   splits in scripts/balance.py, D101 calibrated to the source's lower phase (D-006), K101 with
#   the phosphorus share of US 4 209 460 A, Example 1 (D-008); core has no liquid-liquid model
#   for these liquids and no batch rectification with reflux (core#173);
# - ST101: cheme's batch (Rayleigh) still, one stage, Raoult's law with NIST Antoine constants
#   (core ADR 0055, D-007);
# - E101, E102, E103 (pass-through) and M102, A101 (mixers): `cheme process propagate --fill`;
# - the feeds for 2000 t/a, the scrubber water, every duty and the temperatures of mixed
#   streams: scripts/balance.py (D-006, D-009, D-010).
schema: cheme/process/v1
kind: flowsheet
title: Acetyl chloride by semi-batch reaction of acetic acid with PCl3, phase split and batch distillation (2000 t/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 2000 t/a distilled acetyl chloride, year averages of the batch recipe in 7920 h (D-002, D-003)", default: true}
tolerance: {abs: 0.05, rel: 0.002}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: HAC, title: Acetic acid (acetic-acid-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PCL3, title: Phosphorus trichloride (no library process), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PW, title: Process water (vent scrubber), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: st101, direction: out, kind: energy}
      - {id: a101, direction: out, kind: energy}
  - id: LPS
    title: LP steam 350 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 350, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 412.0, provenance: given, source: "saturation at 350 kPa(a), IAPWS-IF97 (411.5 K)"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: e101, direction: out, kind: energy}
      - {id: st101, direction: out, kind: energy}
products:
  - {id: ACCL, title: Acetyl chloride to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: H3PO3P, title: Crude phosphorous acid (lower phase; co-product), category: by_product, ports: [{id: in, direction: in}]}
  - {id: RES, title: Still residue (PCl3 and acetyl chloride) to hazardous-waste incineration, category: by_product, ports: [{id: in, direction: in}]}
  - {id: SCRL, title: Scrubber liquor (dilute hydrochloric acid) to neutralisation, category: wastewater, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: k101, direction: in, kind: energy}
      - {id: e102, direction: in, kind: energy}
  - id: BRINE
    title: Chilled brine return (263 K)
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 258.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 263.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: e103, direction: in, kind: energy}

blocks:
  - id: REACT
    title: Semi-batch reaction and phase split (R-101)
    class: ReactingChemicals
    ports:
      - {id: hac, direction: in}
      - {id: pcl3, direction: in}
      - {id: upper, direction: out}
      - {id: lower, direction: out}
      - {id: vent, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: q, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: PURIFY
    title: Batch distillation at atmospheric pressure (C-101, K-101)
    class: Distilling
    ports:
      - {id: in, direction: in}
      - {id: product, direction: out}
      - {id: residue, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: q, direction: out, kind: energy}
      - {id: qres, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: SCRUB
    title: Vent condenser and HCl water scrubber
    class: Absorbing
    ports:
      - {id: gas, direction: in}
      - {id: water, direction: in}
      - {id: liquor, direction: out}
      - {id: q, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}

steps:
  - id: E101
    block: REACT
    title: Acetic acid charge warmed to 313 K (R-101 jacket)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in, delegates: hac}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: steam}
  - id: R101
    block: REACT
    title: Reactor (PCl3 dosed into acetic acid at 313 K, HCl vented)
    class: ReactingChemicals
    reactions: [ACCL, HYD]
    reactor: semibatch
    batch:
      dosing: [{stream: S3, time: 7200}]
      target: {key: PCL3, conversion: 0.95}
      heat: isothermal
      vent: {stream: S5, components: [HCL, ACCL], fraction: {ACCL: 0.00213}}
      provenance: assumed
      source: "PCl3 dosed at a constant rate over 2 h into the acetic acid at 313 K (CS 272 248 B2, Example 1: below 40 C; the plant's dosing time ASSUMED, D-003), then the post-reaction to 0.95 conversion of the PCl3 (calibrated to the source's lower phase, D-005, D-006); the HCl leaves as gas as it forms, none taken as dissolved (D-005); 0.213 % of the acetyl chloride formed leaves with it past the vent condenser E103, the vapour the HCl and the nitrogen carry at E103's 268 K (scripts/balance.py prints the estimate, D-010)"
    hazard:
      mtt: 324.15
      provenance: given
      source: "the normal boiling point of acetyl chloride (CRC via chemicals 1.5.2; NIST WebBook 325 +/- 2 K), the product, which becomes the liquid's main component as the PCl3 is dosed: R101 runs at atmospheric pressure with its vent open; core's default, the lowest boiling point of the charge and the dose (PCl3, 349.15 K), lies above it (D-011)"
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: charge, direction: in}
      - {id: dose, direction: in, delegates: pcl3}
      - {id: out, direction: out}
      - {id: gas, direction: out, delegates: vent}
      - {id: q, direction: out, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: D101
    block: REACT
    title: Phase split in R-101 (upper acetyl chloride, lower phosphorous acid; specified split)
    class: SeparatingByGravity
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: upper, direction: out, delegates: upper}
      - {id: lower, direction: out, delegates: lower}
  - id: ST101
    block: PURIFY
    title: Batch still at 101 kPa(a) (one stage, Rayleigh)
    class: Distilling
    still:
      pressure: 101.325
      volatility: {model: raoult, provenance: assumed, source: "ideal liquid, NIST WebBook Antoine constants (materials.yaml); acetyl chloride and PCl3 are not shown to form an ideal liquid with each other or with acetic acid: ASSUMED (D-007)"}
      nonvolatile: [H3PO3]
      boilup: {value: 75, unit: kW, provenance: assumed, source: "the net boil-up that leaves as distillate: a 150 kW reboiler at a reflux ratio of 1 in the column K101 (D-007, D-008)"}
      end: {residue: {key: ACCL, mole_fraction: 0.5}}
      outlets: {distillate: top, residue: bottom}
      provenance: assumed
      source: "distil until acetyl chloride is 50 mol% of the residue, which keeps the still's last bubble point within about 10 K of the end of acetyl chloride's Antoine fit (D-007)"
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: top, direction: out}
      - {id: bottom, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: K101
    block: PURIFY
    title: Column on the still (rectification, specified split)
    class: Distilling
    links: [{target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out, delegates: product}
      - {id: bottoms, direction: out}
      - {id: q, direction: out, kind: energy, delegates: q}
  - id: M102
    block: PURIFY
    title: Still residue (with what the column returns to the pot)
    class: Mixing
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: res, direction: in}
      - {id: ret, direction: in}
      - {id: out, direction: out}
  - id: E102
    block: PURIFY
    title: Residue cooled to 303 K in the still (C-101 jacket)
    class: Cooling
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: residue}
      - {id: q, direction: out, kind: energy, delegates: qres}
  - id: E103
    block: SCRUB
    title: Vent condenser on brine (acetyl chloride vapour back to R-101)
    class: Cooling
    links: [{target: equipment, ref: E-103}]
    ports:
      - {id: in, direction: in, delegates: gas}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: q}
  - id: A101
    block: SCRUB
    title: HCl water scrubber (packed column, bleed; the acetyl chloride vapour hydrolysed)
    class: ReactingChemicals
    reactions: [AHYD]
    reactor: conversion
    links: [{target: equipment, ref: A-101}]
    ports:
      - {id: gas, direction: in}
      - {id: water, direction: in, delegates: water}
      - {id: liquor, direction: out, delegates: liquor}
      - {id: power, direction: in, kind: energy, delegates: power}

streams:
  - id: S1
    title: Acetic acid
    from: HAC.out
    to: E101.in
    template: organics
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "from storage (design basis)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 208.8858, provenance: assumed, source: "scripts/balance.py: 3 mol acetic acid per mol of PCl3 in S3 (CS 272 248 B2, Example 1: 3 mol on 1.0 mol; D-004), with its water"}
        composition: {basis: mass_fraction, values: {ACOH: 0.999309, H2O: 0.000691}, provenance: assumed, source: "acetic-acid-1's glacial acid (its product S21: 691 ppm water by mass; its 50 ppm propionic acid counted as acetic acid; D-004)"}
  - id: S2
    title: Acetic acid charge (313 K)
    from: E101.out
