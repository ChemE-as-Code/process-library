        temperature: {value: 323.99, provenance: assumed, source: "scripts/balance.py: the bubble point of the distillate's mean composition at 101.325 kPa(a), as it leaves K-101's total condenser (D-015)"}
        pressure: {value: 101.325, provenance: assumed, source: "still pressure (D-007)"}
        flow: {value: 252.524, provenance: calculated, source: 'cheme process propagate: still ST101 from S6', fingerprint: eabc2c5c811c999b}
        composition: {basis: mole_fraction, values: {ACOH: 2.71836e-06, PCL3: 0.00328462, ACCL: 0.996713, H3PO3: 0.0}, provenance: calculated, source: 'cheme process propagate: still ST101 from S6', fingerprint: eabc2c5c811c999b}
