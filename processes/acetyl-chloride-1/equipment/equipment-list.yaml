# The equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes per batch from the recipe (D-003) and the models; design pressures, temperatures and
# materials are not set yet (basic engineering); materials named are usual choices for acetyl
# chloride, PCl3 and wet HCl, to be confirmed (open input). All values ASSUMED.
schema: cheme/equipment/v1
equipment:
  - {tag: R-101, type: StirredTankReactor, service: "Reactor: PCl3 dosed into acetic acid at 313 K, HCl vented; the two liquid phases settle in it and are drained",
     notes: "2.5 m3 enamelled (glass-lined) steel (R10 preferred size, 71 % full with 1.78 m3 at the end of the dosing), as the recipe sizes it from R101's model (core ADR 0052); jacket 4.90 m2 at the charge on cooling water (log-mean equivalent 304.05 K) removes 13.37 kW against R101's peak 9.85 kW (cheme process recipe); warmed on a tempered-water loop at 322/318 K, below acetyl chloride's 324 K boiling point; PCl3 dosing over 2 h interlocked with the temperature, the agitator, the jacket in cooling mode and the scrubber's water flow; bottom outlet with a sight glass or conductivity probe for the phase cut (lower phase to T-102); vent through E-103, peak 31 m3/h at the start of the dosing; vent line, E-103 and A-101 sized for 50 m3/h of gas at 101.3 kPa(a) (hazard.vent_capacity, D-014): the normal peak plus CS 272 248 B2's HCl over the dosing, 44.4 m3/h, rounded up; a cooling failure releases 0.41 m3/h at the MTSR and at most 31.2 m3/h over the batch (37.9 m3/h at k/100); the vent line from R-101 to E-103 for about 53 m3/h with the liquid's vapour (for example DN50); open (D-014): the boiling cases (a failed warming loop, about 410 m3/h of acetyl chloride vapour; k/100 above the MTT) and water ingress beyond about 13 to 35 kg/h of water exceed it, so a relief device for the blocked-vent case and the PCl3 dosing interlocked on R-101's pressure are to be assessed; kept dry (no water rinse; D-003, D-005, D-006, D-011). A jacket leak lets cooling water into PCl3 and acetyl chloride: jacket-leak detection, or a non-aqueous heat-transfer fluid, to be assessed (D-011)."}
  - {tag: C-101, type: Vessel, service: "Batch still: the upper phase distilled at atmospheric pressure, the residue cooled and drained",
     notes: "About 2.5 m3 (one batch's 1.53 t of upper phase, 1.39 m3, with room to boil), enamelled steel, jacket on LP steam (412 K, below the 473 K at which phosphorous acid disproportionates to phosphine and phosphoric acid; the still holds only 0.17 wt% of it) for a 150 kW reboiler duty (year averages: the net boil-up Q3 27.6 kW from the still's model, the reflux share Q7 27.6 kW and the heat-up Q8 1.2 kW, D-009), then on cooling water for the residue; not sized by core (its still has no vessel, L-4); D-007, D-009."}
  - {tag: K-101, type: Column, service: "Packed column on the still with a total condenser, reflux ratio 1, product cooler",
     notes: "About 10 theoretical stages, reflux ratio 1 (US 4 209 460 A: a 2 m packed column at 1:1), condenser on cooling water for 150 kW while distilling (acetyl chloride condenses at 324 K, 16 to 26 K above the cooling water), product cooled to 303 K; a specified split in the model (D-008); vent to E-103."}
  - {tag: T-101, type: Tank, service: "Acetyl chloride receiver and storage under nitrogen",
     notes: "Two batches, about 3 m3, nitrogen-blanketed, vented to E-103; kept dry (D-008)."}
  - {tag: T-102, type: Tank, service: "Crude phosphorous acid tank (lower phase of R-101)",
     notes: "About 2 m3 (a few batches of 0.59 t), enamelled or PTFE-lined, traced above about 313 K: the lower phase is a concentrated phosphorous acid with about 10 wt% acetic acid (phosphorous acid melts at 346.8 K); vented to E-103, as it still holds acetyl chloride and PCl3 (D-006)."}
  - {tag: E-103, type: HeatExchanger, service: "Vent condenser on brine: acetyl chloride vapour from R-101, C-101/K-101 and the tanks returned to R-101",
     notes: "Shell and tube or plate condenser on brine at 258/263 K, gas out at 268 K; 0.35 kW year average (D-010, D-014), its load per source (1.28 kW with all the inert saturated at 313 K, the basis until core 1.9.0); open (D-014): at k/100 the acetyl chloride a cooling failure boils off above the MTT is up to 0.65 kmol/h, about 5.5 kW to condense, 15.6 times that; loss of brine sends acetyl chloride vapour (about 69 kPa at 313 K) to the scrubber, where it hydrolyses to HCl and acetic acid: brine flow and gas-outlet temperature alarms interlocked with the PCl3 dosing (D-011)."}
  - {tag: A-101, type: Column, service: "Vent scrubber: packed column with circulating water and a bleed of 1 wt% HCl",
     notes: "Per batch 4.9 kg of vent from R-101 (1.69 kg HCl, 3.18 kg acetyl chloride vapour, cheme process recipe), 0.31 m3 of process water a batch to a 1 wt% HCl bleed at 305 K; peak 31 m3/h of HCl at the start of the dosing; sized with R-101's vent line for 50 m3/h (D-014) and for the upset cases of D-011 (water ingress into R-101, the source's dissolved HCl), not for the normal load; anti-suck-back protection on the vent line from R-101 (a nitrogen-padded seal pot or a vacuum breaker on nitrogen): HCl absorption in water pulls a vacuum that could draw scrubber water back into PCl3 (D-010, D-011)."}
