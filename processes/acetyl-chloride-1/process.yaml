# Process Atlas manifest of acetyl-chloride-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: acetyl-chloride-1
title: Acetyl chloride by semi-batch reaction of acetic acid with PCl3, phase split and batch distillation (2000 t/a)
summary: >-
  A batch plant: PCl3 is dosed over 2 h into acetic acid at 313 K, the mixture settles into an
  upper acetyl chloride and a lower crude phosphorous acid phase, and the upper phase is
  distilled. Concept stage, 1460 kg per batch every 5.78 h on a dedicated train, thermal
  screening with a rate-constant sensitivity, preliminary gate-to-gate LCI.
description: |
  Glacial acetic acid (acetic-acid-1, 691 ppm water) is charged to an enamelled reactor and
  warmed to 313 K; phosphorus trichloride (1 mol per 3 mol of acid) is dosed into it over 2 h and
  held 0.5 h, 3 CH3COOH + PCl3 -> 3 CH3COCl + H3PO3, the batch route of CS 272 248 B2 (Nitrokemia,
  Example 1: below 40 C, then 30 min at 40-50 C). The water of the acid hydrolyses some PCl3; its
  HCl leaves by the vent through a brine condenser, which returns the acetyl chloride vapour, to
  a water scrubber. The mixture settles: the lower phase, 87.5 wt% phosphorous acid with acetic
  acid and acetyl chloride, leaves as a crude phosphorous acid co-product (0.41 kg per kg); the
  upper phase is distilled in a batch still with a column of about 10 stages at reflux 1. Product
  99.43 wt% acetyl chloride with 0.57 wt% PCl3 (specification at least 99.0 wt%), which a column
  hardly separates (US 4 209 460 A); the PCl3-rich still residue (46 g per kg) goes to
  incineration. Yield 92.1 % of theory on the acetic acid and the PCl3: a model result, not a
  sourced one (no open source states a yield for this route).

  The batch is modelled with cheme-as-code's semi-batch reactor with a gas vent (reactor:
  semibatch, batch.vent, core ADRs 0050 and 0054), its batch still with a rectifying column
  (still: with column, ADRs 0055 and 0061) and the batch recipe (process/recipe.yaml with units over several steps, ADRs 0051,
  0052, 0057): the dosing, post-reaction, warming and distillation times come from the models,
  the reactor is the bottleneck (cycle 5.78 h, 1370 batches a year), the recipe sizes the
  reactor (2.5 m3) and checks its jacket, and the flowsheet's flows are the recipe's year
  averages. The semi-batch and the still write their own duties (ADR 0059), the still's
  reboiler with its reflux and charge's heat-up and its column's condenser (ADRs 0061, 0063),
  and the screening compares the gas a cooling failure releases with R-101's vent (ADR 0058).
  The phase split is a specified split until core has a liquid-liquid model for these liquids. The
  conversion and the phase split are calibrated to the source's lower phase; the kinetics are
  ASSUMED: the PCl3 accumulates to 11.7 % at the end of the dosing and the cooling-failure
  temperature stays 8.4 K below the boiling point of acetyl chloride; a 100 times slower reaction
  would exceed it. The vent, sized for 50 m3/h, passes every cooling failure the screening
  covers, but not the boiling and water-ingress cases, which need a relief study. See DESIGN.md
  for every assumption.
families: [chlorinated-organics]
keywords: [acetyl chloride, acetic acid, phosphorus trichloride, PCl3, phosphorous acid, acid chloride, semi-batch, batch, dosing, HCl vent, vent condenser, phase separation, decanter, batch distillation, thermal screening, fine chemicals]
facets:
  feedstock_basis: [fossil, mineral, electricity]
  product_classes: [chemicals]
  unit_operations: [reaction, separation, distillation, absorption]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, kinetics, the phase
# split's calibration, the still's ideal liquid and the column's stages and reflux are assumed; ratios and
# conditions from the patent's example (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept batch PFD with closed mass, component and element balances (cheme validate, cheme
    process streams: 3 blocks and 8 steps within tolerance). The semi-batch R101 with its vent
    (from its ASSUMED rate laws), the batch still ST101 with its column (10 theoretical stages at
    a reflux ratio of 1, Diwekar's shortcut on Raoult's law with NIST Antoine constants, the
    ideal liquid ASSUMED; 99.43 wt% acetyl chloride at 98.19 % recovery, 19.2 % of the charge's
    PCl3 overhead), the scrubber's hydrolysis and the coolers are calculated by cheme process
    propagate; scripts/balance.py gives the feeds for 2000 t/a, the phase split D101 (calibrated
    to CS 272 248 B2), the scrubber water, the still's stream temperatures and the duties (no
    property package of core covers these liquids, no liquid-liquid model applies), except
    R101's duty and the still's reboiler and condenser, which core's models write (ADRs 0059,
    0061, 0063). The vent's acetyl chloride and E-103's load stay script estimates: core
    1.10.0's vent vapour carries only the HCl's (DESIGN.md D-015). The recipe's year-average rate of
    the product agrees with the flowsheet (no cheme.recipe-basis finding); the recipe sizes R-101
    (2.5 m3), its jacket check passes against the log-mean cooling-water temperature, and the
    still's distillation time comes from its boil-up. Thermal screening (cheme process
    reactor-hazards): dT_ad 21.4 K, accumulation 11.7 %, MTSR 315.8 K against an MTT of 324.15 K
    (hazard.mtt: the boiling point of acetyl chloride); no criticality class without a TD24
    (1 or 2 if the TD24 lies above the MTSR, 5 if below). With k/10 the MTSR is 321.1 K, with
    k/100 330.5 K, above the MTT (DESIGN.md D-011). At the MTSR a cooling failure releases 0.41
    m3/h of gas, at most 31.2 m3/h over the batch (37.9 m3/h at k/100), within R-101's vent
    capacity of 50 m3/h (ASSUMED); the boiling cases (k/100 above the MTT, a failed warming loop)
    and water ingress are a design finding for the relief study (DESIGN.md D-014). The heat of reaction's sign is uncertain
    (D-005). Preliminary gate-to-gate LCI with the per-batch nitrogen, mass allocation to the
    crude phosphorous acid; the acetic acid linked to acetic-acid-1 and the nitrogen to asu-1,
    the PCl3 a gap with a recorded proxy, the other backgrounds gaps. cheme maturity reaches no
    level (assumed feeds, kinetics and separations); the claim `maturity: concept` is the lowest
    value of the schema, not an evidenced level. Not reviewed. Needs cheme-as-code 1.10.0.
