modelling:
  principle: attributional
  multifunctionality: 'unallocated multi-output dataset; default allocation mass: D-011 (agent proposal,
    for the LCA practitioner to confirm): the three nitriles come from one reactor whose split the catalyst
    fixes; no physical relationship separates their burdens (docs/system-model.md), and no prices are
    sourced at the concept stage, so mass allocation of the library''s hierarchy is used. HCN and acetonitrile
    together are 7.0 % of the nitrile mass. The exported HP steam is not allocated: it stays a gap with
    its avoided-steam background open (D-011).'
