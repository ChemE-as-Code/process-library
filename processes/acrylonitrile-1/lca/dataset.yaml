kind: lci_dataset
id: acrylonitrile-sohio-propylene-ammoxidation-15-t-h
title: Acrylonitrile (SOHIO propylene ammoxidation), 15 t/h
description: Unallocated foreground LCI of Acrylonitrile (SOHIO propylene ammoxidation), 15 t/h, case
  design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: Fluid-bed ammoxidation of propylene over a multicomponent bismuth molybdate catalyst at 713
  K and 200 kPa(a) (propylene/ammonia/air 1/1.2/9.8 mol, 97.5 % propylene conversion), reaction heat and
  effluent heat to HP steam, sulfuric-acid quench to ammonium sulfate liquor, water absorption, extractive
  recovery column, acetonitrile stripper and pressure-swing purification, HCN column, drying and product
  column, thermal oxidiser with waste-heat boiler; 15 t/h acrylonitrile
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:startup-vent
  title: storage-tank emissions of R-101, C-101
  direction: output
  reason: 'Start-up venting of the reactor effluent before it leaves the explosive range: EPA-450/4-84-007a
    (p. 20) reports up to 4500 kg/h of acrylonitrile from one reactor for about four one-hour start-ups
    a year; not in the steady-state balance (D-008).'
- key: emission-excluded:column-vents
  title: storage-tank emissions of C-201, C-202, C-301, C-302
  direction: output
  reason: Column purge vents to a flare (EPA-450/4-84-007a p. 20) are not estimated; the lumped columns
    carry no non-condensables (D-007).
- key: emission-excluded:oxidiser-nox
  title: storage-tank emissions of H-401
  direction: output
  reason: 'The thermal oxidiser''s NOx (fuel nitrogen of the HCN, nitriles and ammonia traces it burns,
    and thermal NOx) is not estimated: the model sends that nitrogen to N2 (D-008, L-5); EPA-450/4-84-007a
    (p. 20) names the NOx of burning nitrile-rich streams as the reason start-up gas is not incinerated.'
- key: emission-excluded:storage-breathing
  title: storage-tank emissions of C-302
  direction: output
  reason: Breathing of the crude, run-down and product tanks (water scrubbers or floating roofs, EPA-450/4-84-007a
    p. 21) is not estimated (D-008).
