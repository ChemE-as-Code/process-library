# The process templates carry every component: propagate writes the zero flows of the
# components a stream does not carry, and a template must name them (DESIGN.md L-3).
templates:
  - {id: propylene, title: Propylene (chemical grade), components: [C3H6]}
  - {id: ammonia, title: Ammonia vapour, components: [NH3]}
  - {id: air, title: Dry air, components: [N2, O2, AR]}
  - {id: reactor_gas, title: Reactor feed and effluent gas, components: [C3H6, NH3, O2, N2, AR, H2O, ACN, HCN, MECN, ACRO, AA, CO, CO2, CH4, H2SO4, AS]}
  - {id: quench_gas, title: Quenched gas, components: [C3H6, NH3, O2, N2, AR, H2O, ACN, HCN, MECN, ACRO, AA, CO, CO2, CH4, H2SO4, AS]}
  - {id: offgas, title: Absorber off-gas, components: [C3H6, NH3, O2, N2, AR, H2O, ACN, HCN, MECN, ACRO, AA, CO, CO2, CH4, H2SO4, AS]}
  - {id: acid, title: Sulfuric acid, components: [H2SO4, H2O]}
  - {id: quench_liquor, title: Quench liquor (ammonium sulfate solution), components: [C3H6, NH3, O2, N2, AR, H2O, ACN, HCN, MECN, ACRO, AA, CO, CO2, CH4, H2SO4, AS]}
  - {id: aqueous, title: Aqueous process streams (rich and lean water), components: [C3H6, NH3, O2, N2, AR, H2O, ACN, HCN, MECN, ACRO, AA, CO, CO2, CH4, H2SO4, AS]}
  - {id: organic, title: Crude acrylonitrile and product cuts, components: [C3H6, NH3, O2, N2, AR, H2O, ACN, HCN, MECN, ACRO, AA, CO, CO2, CH4, H2SO4, AS]}
  - {id: fuel, title: Natural gas (as methane), components: [CH4]}
  - {id: flue_gas, title: Incinerator flue gas, components: [C3H6, NH3, O2, N2, AR, H2O, ACN, HCN, MECN, ACRO, AA, CO, CO2, CH4, H2SO4, AS]}
# property_method is a placeholder: no benchmarked package of cheme covers the nitrile/water
# liquids or the ammonium sulfate solution (DESIGN.md D-009, L-2).
property_method:
  adapter: thermo
  status: placeholder
