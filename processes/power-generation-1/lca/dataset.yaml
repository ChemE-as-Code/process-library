- key: emission-excluded:blowdown-effluent
  title: effluent emissions of product:BLOWDOWN
  direction: output
  reason: the blowdown's dissolved solids, treatment chemicals and biocide are not modelled; it goes to
    treatment (gap above)
  source: D-009
