  - {id: fuel, title: Pipeline natural gas, components: [CH4, C2H6, C3H8, C4H10, CO2, N2]}
  - {id: flue, title: Turbine exhaust and stack gas (the fuels burnt out), components: [N2, O2, Ar, CO2, H2O, CH4, C2H6, C3H8, C4H10]}
  - {id: water, title: "Water and steam (feedwater, steam, condensate, cooling water make-up and blowdown)", components: [H2O]}
# property_method is a placeholder: no benchmarked package of core covers the hot flue gas with
# water vapour or the water/steam loop (`cheme process props --coverage`); stream properties are
# not filled (D-005, D-006).
property_method:
  adapter: thermo
  status: placeholder
