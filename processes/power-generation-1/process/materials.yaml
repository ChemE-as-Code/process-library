# Components and templates of power-generation-1. Schema cheme/process/v1 (`cheme schema
# process-materials`). molar_mass in kg/kmol, normal_boiling_point in K at 101.325 kPa.
# ideal_gas: formation enthalpy (ATcT), entropy (CRC; n-butane Yaws) and cp/R polynomial (Poling
# 5th ed., 50 to 1000 K; n-butane 200 to 1000 K) as printed by `cheme chemistry thermo` (the
# `chemicals` package 1.5.2, single values with their source, library ADR 0037). They are what
# core's conversion-step model R101 (the gas turbine) uses for its outlet and its duty (D-005);
# the turbine exhaust at 898.15 K is inside every range. The water/steam loop is not given
# enthalpies here: its states are NETL's stream table (D-006, scripts/ngcc_balance.py).
schema: cheme/process/v1
kind: materials
components:
