parameters:
- name: hi
  value: 1000.0
  unit: kg
  description: Anhydrous hydrogen iodide delivered (the basis).
  source: basis
- name: M_HI
  value: 127.908
  unit: g/mol
  description: Molar mass of hydrogen iodide.
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573),
    applied to the formula
- name: M_I2
  value: 253.8
  unit: g/mol
  description: Molar mass of iodine.
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573),
    applied to the formula
- name: M_H2
  value: 2.016
  unit: g/mol
  description: Molar mass of hydrogen.
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573),
    applied to the formula
- name: y
  value: 0.979
  unit: dimensionless
  description: 'Efficiency over the scheme, applied to both reactants: the iodine conversion and HI yield
    after 100 hours of continuous operation, 97.9 % (98.0 % at the start).'
  source: 'US 8 268 284 B2 (Nippoh Chemicals), Example 1, catalytic reduction step: hydrogen 450 ml/min
    with iodine vapour 75 ml/min over 1 g/L platinum on 3 mm alumina spheres at 350 degC, laboratory
    scale. Reading it as the overall iodine efficiency (no recycle of the unconverted iodine) is ASSUMED.
    Applying it to hydrogen as well is ASSUMED (Hischier et al. 2005 apply one efficiency to the whole
    scheme) and implies that the excess hydrogen is recovered and recycled: the example feeds hydrogen
    at 6 mol per mol of iodine (450 against 75 ml/min) and US 11 554 956 B2 at 2.4 to 2.9 mol/mol, and
    US 11 554 956 B2 recovers it by compression and flash cooling'
- name: f_air
  value: 0.002
  unit: dimensionless
  description: Share of the input of a reactant emitted to air.
  source: 'cheme tier-defaults 1.0.0: loss-air: Hischier et al. 2005, section 2.3: emissions to air estimated
    as 0.2 % of the input materials'
- name: elec
  value: 333.3
  unit: kWh
  description: 'Electricity per t HI: core''s Tier 0 default, 0.3333 kWh/kg.'
  source: 'ASSUMED: cheme tier-defaults 1.0.0: electricity [ASSUMED]: 1.2 MJ (0.333 kWh) per kg of product,
    attributed to the Gendorf (2000) site average that the ecoinvent v2-era chemicals proxies used. ASSUMED,
    not read in either source: Hischier et al. 2005 (p. 61) names the Gendorf (2000) average as the default
    but prints no value, and the number could not be confirmed in an open copy of Althaus et al. 2007
    (ecoinvent report No. 8). Dated: newer ecoinvent proxies rest on later Gendorf reports, so this value
    may be low for a present-day process. Neither patent gives a utility figure. TODO source'
- name: heat
  value: 555.6
  unit: kWh
  description: 'Heat per t HI: core''s Tier 0 default, 0.5556 kWh/kg, heat generated from fossil fuel.'
  source: 'ASSUMED: cheme tier-defaults 1.0.0: heat [ASSUMED]: 2.0 MJ (0.556 kWh) of heat per kg of product,
    generated from fossil fuel (the carrier is a heat flow, not a fuel input), attributed to the Gendorf
    (2000) site average that the ecoinvent v2-era chemicals proxies used. ASSUMED, not read in either
    source (see electricity); dated, and possibly low against newer ecoinvent proxies. Neither patent gives
    a utility figure. TODO source'
