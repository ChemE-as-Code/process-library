# Tier 0 form, a manifest-only entry as in process-library#313/#317. Every amount is the formula of
# its parameters; core's validator re-checks each. The yield is one patent example, the losses and
# energy are core's screening defaults, each marked as such.
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: hydrogen-iodide-catalytic-gas-phase
title: Anhydrous hydrogen iodide by gas-phase catalytic synthesis from hydrogen and iodine
description: Tier 0 screening estimate per 1 t of anhydrous hydrogen iodide, gate-to-gate. Stoichiometry
  H2 + I2 -> 2 HI at the iodine conversion of a continuous 100-hour patent run (platinum on alumina,
  350 degC), the unconverted feed lost by the Hischier et al. (2005) rule, electricity and heat from
  core's Tier 0 defaults. The energy defaults are Gendorf 2000 site averages (ASSUMED, older than the
  10-year limit for secondary data); valid_until follows the reference year and does not endorse them.
basis: 1000 kg of hydrogen iodide
boundary: 'gate-to-gate: iodine melting and vaporisation, mixing with hydrogen, catalytic reactor, removal
  of unreacted iodine, condensation and purification of HI; power and heat from outside'
technology: continuous gas-phase reaction of hydrogen with iodine vapour over a supported metal catalyst
  (platinum or nickel on alumina in the sources), about 300 to 350 degC near atmospheric pressure; the
  hydrazine, hydrogen sulfide, red phosphorus and aqueous (hydriodic acid) routes are not modelled
geography:
  description: 'Generic: patent examples from Japan (2008) and the USA (2019), laboratory scale; no plant
    or site.'
classification:
  isic: '2011'
system_boundary:
  included:
  - iodine and hydrogen
  - unconverted hydrogen to air and unconverted iodine to air and to wastewater treatment (screening rule)
  - electricity and heat (core's Tier 0 defaults)
  excluded:
  - 'TODO catalyst make-up and spent catalyst: platinum on alumina (1 g Pt per litre of support, US
    8 268 284 B2, Example 1) or nickel on alumina (US 11 554 956 B2); neither source gives a life or a
    charge per t. A platinum-group catalyst is never cut (system-model section 4): it is unquantified,
    not cut'
  - 'TODO recycle of the unconverted iodine (US 11 554 956 B2 describes it): not credited; the conversion
    is a once-through figure, so the iodine loss is an upper view. The excess hydrogen is the other way
    round: applying y to hydrogen takes its recycle for granted, with no energy for its recompression
    counted; once-through hydrogen at 2.7 mol/mol would be about 22 kg/t fed and 14 kg/t vented'
  - 'TODO fate of the iodine scrubbing liquor (saturated aqueous HI that takes up the unreacted iodine
    in US 8 268 284 B2) and of the purge streams (US 11 554 956 B2): not quantified; the screening rule
    sends the unconverted iodine to wastewater treatment instead'
  - 'TODO HI losses in vents and purges beyond the stoichiometric efficiency: not quantified'
  - 'TODO refrigeration, compression and cooling water for the iodine traps and the HI condensation
    (HI boils near -35 degC; US 11 554 956 B2 compresses to 600 to 1000 kPag before flash cooling):
    not quantified; the electricity default is a site average, not this duty'
  - 'TODO inert gas pressurising the iodine liquefier and desiccant for drying the HI (both named in US
    11 554 956 B2, not quantified)'
  - transport of the inputs and infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: GLO
year: 2008
valid_until: 2013
time:
  start: 2008
  description: The yield is from a patent example of 2008 (priority date); the second patent (priority
    2019) gives the process layout and is the KPI reference. valid_until is the reference year + 5 (system-model
    section 6), so it has already lapsed.
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation'
