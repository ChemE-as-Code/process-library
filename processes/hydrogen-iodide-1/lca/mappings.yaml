# hydrogen-iodide-1's own exchange overrides for the Atlas LCI build (ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Both feeds link to their Atlas producers.
# output:iodine-loss (iodine to wastewater treatment, by mass of iodine) stays a reported gap: the
# shared `wastewater` entry counts the water, not a dissolved load, and no entry treats an iodine
# load. The heat and electricity link by their `link.factor` ids (heat-natural-gas, electricity).
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:iodine": {dataset: {path: processes/iodine-1/lca/dataset.yaml, product: "product:IODINE"}, source: "the Atlas producer iodine-1, iodine flakes 99.8 wt% I2, by mass of the flakes (the 0.2 % water is not corrected)"}
  "feed:hydrogen": {dataset: {path: processes/hydrogen-1/lca/dataset.yaml, product: "product:H2"}, source: "the Atlas producer hydrogen-1, hydrogen 99.9 mol% (98.6 wt% H2, the rest N2), by mass of the product gas, as hydrogen-bromide-1 links it; the patents ask for dry hydrogen, which hydrogen-1's PSA product is taken to be (ASSUMED)"}
