- name: w_wz
  value: 60.0
  unit: kg/h
  description: Cold wash water to the washing zone in the example.
  source: EP 0 064 486 A1 (1982), Table 1, Example 1
- name: p2
  value: 40.5
  unit: kg/h
  description: Reagent-grade benzyl alcohol (Second Product) of the example.
  source: EP 0 064 486 A1 (1982), Table 1 (continued), Example 1
- name: q_r
  value: 153.0
