- name: elec
  value: 333.3
  unit: kWh
  description: 'Electricity per t benzyl alcohol: core''s Tier 0 default, 0.3333 kWh/kg.'
  source: 'ASSUMED: cheme tier-defaults 1.0.0: electricity [ASSUMED]: 1.2 MJ (0.333 kWh) per kg of product,
    attributed to the Gendorf (2000) site average that the ecoinvent v2-era chemicals proxies used, not read
    in an open copy. Dated and not specific to this process. EP 0 064 486 A1 states only that pumping energy
    is negligible, so the default is likely high for the pumps; vacuum and cooling are not covered by the
    patent. TODO source'
