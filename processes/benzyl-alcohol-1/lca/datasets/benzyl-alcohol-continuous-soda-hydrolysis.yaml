# Tier 0 form, manifest-only entry after the process-library#313 pilots (PR #317). Every amount is
# the formula of its parameters; core's validator re-checks each. The numbers are facts from the
# cited patents and the IPCC guidelines, in our own form; electricity is core's Tier 0 default.
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: benzyl-alcohol-continuous-soda-hydrolysis
title: Benzyl alcohol by continuous hydrolysis of benzyl chloride with aqueous sodium carbonate
description: Tier 0 screening estimate per 1 t of reagent-grade benzyl alcohol (at least 99.8 wt%), gate-to-gate.
  Continuous countercurrent hydrolysis with soda solution and toluene as inert solvent, extraction of the
  spent brine, vacuum distillation in two columns. Feeds, by-products, water and heat from the worked example
  of a 1982 patent (pilot scale), the rest by stoichiometry; electricity from core's Tier 0 default.
basis: 1000 kg of benzyl alcohol
boundary: 'gate-to-gate: reactor column (washing, hydrolysis and extraction zones), degassing, solvent column
  and product column; benzyl chloride, soda ash, water, steam and power from outside; brine to treatment'
technology: continuous countercurrent hydrolysis with aqueous sodium carbonate at 145 degC and 18 bar, toluene
  as inert solvent, two vacuum columns; batch stirred-tank hydrolysis, the water-only route without base
  (US 5,750,801) and benzaldehyde hydrogenation are not modelled
geography:
  description: Pilot-scale examples of a patent by a Swedish applicant (Eka AB, filed 1982); no plant and no
    site. Taken as a generic technology.
classification:
  isic: '2011'
system_boundary:
  included:
  - benzyl chloride, soda ash, process and wash water
  - steam to the reactor column and the two distillation columns
  - electricity (core's default)
  - dibenzyl ether bottoms and the remaining benzyl alcohol losses
  - spent brine (water, sodium chloride, excess soda) and the CO2 vented at degassing
  excluded:
  - 'TODO toluene make-up: the solvent is recycled and the patent gives no loss'
  - 'TODO cooling water of the washing zone and the column condensers: not stated'
  - 'TODO vacuum system (steam ejectors or pumps) and its off-gas: not stated'
  - 'TODO organics (toluene, benzyl alcohol, benzaldehyde) dissolved in the brine: the patent says the extraction
    zone purifies it but gives no residual; the dataset puts all benzyl alcohol losses into output:organic-residue'
  - 'TODO benzaldehyde and unconverted benzyl chloride: up to 0.03 wt% and 0.10 % of the feed, lumped into the
    residue as benzyl alcohol'
  - 'CO2 held back as bicarbonate by the excess soda: all CO2 of the reacted carbonate is counted as vented'
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: GLO
year: 1982
valid_until: 1987
time:
  start: 1982
  description: Patent examples of EP 0 064 486 A1 (filed 1982-04-19). valid_until is the reference year + 5
    (system-model section 6), so it has long lapsed; no newer open figure was found.
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation (the dibenzyl ether bottoms and the brine are residues,
    not products here)'
