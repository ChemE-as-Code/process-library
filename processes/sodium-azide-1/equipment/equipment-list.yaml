# Equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes per batch from the recipe (D-003) and the models; design pressures, temperatures and
# materials are not set yet (basic engineering); the materials named are usual choices, to be
# confirmed (open input). No copper, lead, brass or other heavy-metal parts on the azide side
# (heavy-metal azides, D-015). All values ASSUMED.
schema: cheme/equipment/v1
equipment:
  - {tag: R-101, type: StirredTankReactor, service: "Methyl nitrite generator: 98.5 % sulfuric acid dosed into aqueous sodium nitrite and methanol at 298 K; the methyl nitrite gas to R-102",
     notes: "4.5 m3 of liquor per batch; 6.3 m3 (R10 preferred size) as the recipe sizes it from R101's semi-batch model (core ADR 0052); glass-lined or stainless steel (acid sulfate liquor); jacket on chilled water at 278-283 K, U 400 W/(m2 K): 87 kW at the charge against the peak 21 kW; nitrogen blanket; the gas line to R-102's sparger with a flame arrester and a non-return device; acid dosing interlocked with R-102's absorption (D-005, D-010, D-015)."}
  - {tag: R-102, type: StirredTankReactor, service: "Azide reactor: methyl nitrite absorbed into hydrazine hydrate, caustic soda and the recycled mother liquor at 313 K",
     notes: "5.7 m3 of liquor per batch; 8 m3 (R10 preferred size) as the recipe sizes it from R102's semi-batch model; stainless steel (caustic hydrazine liquor, no copper alloys); gas sparger and gas-dispersing agitator; jacket on chilled water at 278-283 K, U 400 W/(m2 K): 163 kW at the charge against the peak 152 kW of the 10 h dosing; off-gas (N2O, NH3, unabsorbed methyl nitrite) to the thermal oxidiser (D-005, D-010, D-011, D-015)."}
  - {tag: C-101, type: ProcessColumn, service: "Batch vacuum still and crystallizer: methanol stripped, the liquor concentrated at 10 kPa(a), NaN3 precipitated at 303 K",
     notes: "Still pot with a short packed column (the effective relative volatility of D-007), condensers on chilled water (methanol cut) and cooling water (water cut), receivers, vacuum pump; jacket and coil on tempered (pressurised) hot water heated by LP steam, as F-101, at most about 390 K so that no wall sees the 412 K of the steam (the residue ends at about 360 K, D-007, D-015), 500 kW while boiling (4.5 h per batch; the area for 500 kW at that approach not checked); about 6 m3 of charge per batch, not sized by core (ADR 0055); stainless steel (D-007, D-008)."}
  - {tag: F-101, type: Filter, service: "Agitated Nutsche filter-dryer: filtration of the NaN3 slurry, methanol wash, vacuum drying at 333 K",
     notes: "1.5 m3 of slurry per batch; 2 m3 (R10) as the recipe sizes it from the slurry and the cake (core ADR 0057), heated area 4.4 m2; nitrogen pressure filtration at 200 kPa; jacket on hot water from LP steam; vacuum condenser on chilled water; closed discharge of the dry product (toxic dust) (D-009, D-015)."}
  - {tag: T-101, type: Tank, service: "Mother-liquor receiver: mother liquor, wash filtrate and dryer condensate held for the next batch; the purge drawn off",
     notes: "About 1.8 m3 per batch; stainless steel; kept alkaline (never acidified: HN3) (D-015, D-016)."}
