# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Sodium azide by the hydrazine / methyl nitrite route of US 5 208 002 A (Nippon Carbide; DESIGN.md
# D-001), a batch plant: in R-101 sulfuric acid is dosed into aqueous sodium nitrite and methanol,
# and the methyl nitrite gas formed (R101, vented as it forms: batch.vent, core ADR 0054) is passed
# straight into R-102, where aqueous hydrazine and caustic soda with the mother liquor of the
# previous batch absorb it (R102, a dosed gas: dosing.absorbed) and give sodium azide; nitrous
# oxide and ammonia from the side reaction leave by R-102's vent with the methyl nitrite that is
# not absorbed. The liquor is stripped of methanol and concentrated under vacuum in the batch still
# C-101 (ST101, core ADR 0055); the methanol cut goes back to R-101 and to the cake wash. NaN3
# precipitates from the concentrated caustic liquor (CR101, a crystallizer with spectator solutes,
# core ADR 0056) and is filtered, washed with methanol and vacuum-dried in the filter-dryer F-101
# (F101, W101, F102, D101; core ADR 0057). The mother liquor and the wash filtrate go back to R-102
# for the next batch, less a 5 % purge to azide destruction. The acid side (R-101) and the azide
# side never share a vessel or a liquor (D-015).
# The flows are the year averages of the batch recipe (process/recipe.yaml, `cheme process
# recipe`, D-003).
# Where the values come from:
# - feeds, ratios, temperatures and pressures: the design basis and D-002..D-010, ASSUMED or from
#   the patent's Examples 1 and 2 (the fresh feeds follow the charge ratios of D-004 at the
#   converged recycle);
# - calculated by `cheme process propagate --fill`: R101 and R102 (semi-batch models with their
#   vents, ASSUMED rate laws, D-005), ST101 (Rayleigh still, D-007), CR101 (precipitation from the
#   mother liquor, D-008), F101, F102 (specified filters) and D101 (dryer to a residual moisture,
#   D-009), the mixers and the remainders of the splitters;
# - S3 and S11, the two recycles (the recovered methanol to R-101 and the mother liquor to R-102),
#   are assumed tear streams: propagate does not converge recycles, so they were converged by
#   successive substitution over `cheme process propagate` until they equal what the models
#   calculate for them (D-006); X102 and X101 then balance within the tolerance;
# - the duties: from core's reports of the same models (`cheme process reactors`, `stills`,
#   `crystallizers`), year averages, given here as ASSUMED (D-012); power ASSUMED.
schema: cheme/process/v1
kind: flowsheet
title: Sodium azide by the hydrazine / methyl nitrite route, batch, with precipitation from the reaction liquor
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: dried NaN3, year averages of the batches in 7920 h on a dedicated train (D-002, D-003)", default: true}
tolerance: {abs: 0.02, rel: 0.001}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: NANO2, title: Sodium nitrite (sodium-nitrite-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PW1, title: Process water (nitrite generator), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: ACID, title: Sulfuric acid 98.5 wt% (sulfuric-acid-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: HH, title: Hydrazine hydrate 64 wt% N2H4 (hydrazine-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NAOH, title: Caustic soda 50 wt% (chlor-alkali-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PW2, title: Process water (azide reactor), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: MEOH, title: Methanol make-up (methanol-1), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: r102, direction: out, kind: energy}
      - {id: c101, direction: out, kind: energy}
      - {id: f101, direction: out, kind: energy}
  - id: LPS
    title: LP steam 350 kPa(a) (still and filter-dryer)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 350, provenance: assumed, source: "design basis (D-012)"}
      supply_temperature: {value: 412.0, provenance: given, source: "saturation at 350 kPa(a), IAPWS-IF97"}
      min_approach: {value: 10, provenance: assumed, source: "D-012"}
    ports:
      - {id: c101, direction: out, kind: energy}
      - {id: f101, direction: out, kind: energy}
products:
  - {id: NAN3P, title: Dried sodium azide to packing, category: product, ports: [{id: in, direction: in}]}
  - {id: SULF, title: Sodium sulfate liquor to wastewater treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - {id: COND, title: Evaporator condensate to wastewater treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - {id: PURGE, title: Mother-liquor purge to azide destruction and wastewater treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - {id: OFFGAS, title: Azide reactor off-gas to the thermal oxidiser, category: off_gas, ports: [{id: in, direction: in}]}
  - id: CHW
    title: Chilled water return (R-101, R-102 and the methanol condensers)
    category: utility
    utility:
      kind: refrigerant
      level: chilled water
      supply_temperature: {value: 278.15, provenance: assumed, source: "design basis (D-012)"}
      return_temperature: {value: 283.15, provenance: assumed, source: "design basis (D-012)"}
      min_approach: {value: 5, provenance: assumed, source: "D-012"}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: r102, direction: in, kind: energy}
      - {id: c101, direction: in, kind: energy}
      - {id: f101, direction: in, kind: energy}
  - id: CW
    title: Cooling water return (still's water condenser and crystallizer)
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis (D-012)"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis (D-012)"}
      min_approach: {value: 5, provenance: assumed, source: "D-012"}
    ports:
      - {id: c101, direction: in, kind: energy}
      - {id: cr101, direction: in, kind: energy}

blocks:
  - id: GEN
    title: Methyl nitrite generation
    class: ReactingChemicals
    ports:
      - {id: nano2, direction: in}
      - {id: pw, direction: in}
      - {id: meoh, direction: in}
      - {id: acid, direction: in}
      - {id: liquor, direction: out}
      - {id: meono, direction: out}
      - {id: q, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: AZIDE
    title: Azide reaction
    class: ReactingChemicals
    ports:
      - {id: hh, direction: in}
      - {id: naoh, direction: in}
      - {id: pw, direction: in}
      - {id: recycle, direction: in}
      - {id: meono, direction: in}
      - {id: out, direction: out}
      - {id: vent, direction: out}
      - {id: q, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: CONC
    title: Methanol strip, concentration and precipitation
    class: Crystallizing
    ports:
      - {id: in, direction: in}
      - {id: meoh, direction: out}
      - {id: wash, direction: out}
      - {id: cond, direction: out}
      - {id: slurry, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: qchw, direction: out, kind: energy}
      - {id: qcw, direction: out, kind: energy}
      - {id: qcr, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: ISOL
    title: Filter-dryer (filtration, methanol wash, vacuum drying) and the mother-liquor recycle
    class: SeparatingMechanically
    ports:
      - {id: slurry, direction: in}
      - {id: wash, direction: in}
      - {id: fresh, direction: in}
      - {id: product, direction: out}
      - {id: recycle, direction: out}
      - {id: purge, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: q, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}

steps:
  - id: M101
    block: GEN
    title: Nitrite solution charge (R-101)
    class: Mixing
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: nano2, direction: in, delegates: nano2}
      - {id: pw, direction: in, delegates: pw}
      - {id: meoh, direction: in, delegates: meoh}
      - {id: out, direction: out}
  - id: R101
    block: GEN
    title: Methyl nitrite generator (sulfuric acid dosed, the gas vented to R-102)
    class: ReactingChemicals
    reactions: [NTG]
    reactor: semibatch
    batch:
      dosing: [{stream: S5, time: 36000}]
      target: {key: NANO2, conversion: 0.999}
      heat: isothermal
      vent: {stream: S7, components: [MEONO]}
      provenance: assumed
      source: "acid dosed at a constant rate over the azide reactor's dosing time, 10 h (D-010), at 298 K (US 5 208 002 Example 1: 25 C), then the post-reaction to 0.999 conversion of the nitrite; methyl nitrite (bp 261 K) leaves as it forms (D-005)"
    hazard:
      mtt: 337.63
      provenance: assumed
      source: "the normal boiling point of methanol (chemicals), the lowest-boiling component left in the liquor: R-101 at atmospheric pressure under nitrogen, its vent open to R-102 (ASSUMED, no P&ID yet; D-011)"
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: acid, direction: in, delegates: acid}
      - {id: out, direction: out, delegates: liquor}
      - {id: vent, direction: out, delegates: meono}
      - {id: q, direction: out, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M102
    block: AZIDE
    title: Hydrazine and caustic charge with the recycled mother liquor (R-102)
    class: Mixing
    links: [{target: equipment, ref: R-102}]
    ports:
      - {id: hh, direction: in, delegates: hh}
      - {id: naoh, direction: in, delegates: naoh}
      - {id: pw, direction: in, delegates: pw}
      - {id: recycle, direction: in, delegates: recycle}
      - {id: out, direction: out}
  - id: R102
    block: AZIDE
    title: Azide reactor (methyl nitrite absorbed into hydrazine and caustic at 313 K)
    class: ReactingChemicals
    reactions: [AZ, SIDE]
    reactor: semibatch
    batch:
      dosing: [{stream: S7, time: 36000, absorbed: 0.918}]
      target: {key: MEONO, conversion: 0.999}
      heat: isothermal
      vent: {stream: S14, components: [N2O, NH3]}
      provenance: assumed
      source: "methyl nitrite from R-101 dosed over 10 h as it forms (D-010), 91.8 % absorbed: the share US 5 208 002 Example 1's balance accounts for (D-004); isothermal at 313 K (the patent's 20-50 C), post-reaction to 0.999 conversion of the dissolved methyl nitrite; N2O and NH3 leave as they form (D-005)"
    hazard:
      mtt: 337.63
      provenance: assumed
      source: "the normal boiling point of methanol (chemicals), which the reaction forms: the lowest-boiling component the liquor keeps; dissolved methyl nitrite (bp 261 K) would desorb as a gas, not boil the liquor, and is a gas-release and toxic-release hazard noted apart (ASSUMED; D-011, D-015)"
    links: [{target: equipment, ref: R-102}]
    ports:
      - {id: in, direction: in}
      - {id: meono, direction: in, delegates: meono}
      - {id: out, direction: out, delegates: out}
      - {id: vent, direction: out, delegates: vent}
      - {id: q, direction: out, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: ST101
    block: CONC
    title: Batch still at 10 kPa(a) (methanol cut, then water to concentrate)
    class: Distilling
    still:
      pressure: 10
      volatility: {model: constant, alpha: {MEOH: 150.0, H2O: 1.0}, provenance: assumed, source: "effective relative volatility of methanol to water, ASSUMED so that the first cut is about the 90 wt% methanol of US 5 208 002 Example 1: it stands for the short column on the still and the salting-out of methanol by the caustic liquor, which a one-stage ideal still (core ADR 0055) cannot give (D-007)"}
      nonvolatile: [N2H4, NAOH, NAN3, MEONO]
      boilup: {value: 500.0, unit: kW, provenance: assumed, source: "LP steam to C-101's jacket and coil (D-007, D-012)"}
      cuts:
        - {outlet: meoh, end: {residue: {key: MEOH, mole_fraction: 0.0005}}}
        - {outlet: cond, end: {distilled: 0.63, basis: mass}}
      outlets: {residue: residue}
      provenance: assumed
      source: "the methanol stripped to 0.05 mol% in the still, then water distilled until the mother liquor is about the composition of US 5 208 002 Example 1's filtrate, the basis of CR101's solubility (D-007, D-008); hydrazine and the salts taken as non-volatile (D-007)"
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: meoh, direction: out}
      - {id: cond, direction: out, delegates: cond}
      - {id: residue, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: qchw, direction: out, kind: energy, delegates: qchw}
      - {id: qcw, direction: out, kind: energy, delegates: qcw}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: X102
    block: CONC
    title: Recovered methanol, to the nitrite generator and to the cake wash
    class: SplittingMaterial
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: in, direction: in}
      - {id: gen, direction: out, delegates: meoh}
      - {id: wash, direction: out, delegates: wash}
  - id: CR101
    block: CONC
    title: Precipitation of NaN3 from the concentrated caustic liquor at 303 K
    class: Crystallizing
    crystallizer:
      solute: NAN3
      solvent: H2O
      crystal: NAN3S
      basis: solubility
      temperature: 303.15
      spectators: [N2H4, NAOH, MEOH, MEONO]
      solubility:
        unit: mass_fraction
        value: 0.1084
        measured_in: mother_liquor
        provenance: given
        source: "US 5 208 002 A Example 1, Table 1: the filtrate after concentration and centrifugation, 3.3 kg holding 5.5 mol NaN3 (0.358 kg), with 32.9 mol NaOH and 18.2 mol hydrazine: taken as the saturated mother liquor at the crystallizer's temperature (its temperature not stated, ASSUMED 303 K; D-008)"
      energy: {heat_capacity: 2.8, heat_of_crystallization: -200, provenance: assumed, source: "the liquor's heat capacity ASSUMED; the heat of crystallization about -13 kJ/mol NaN3, ASSUMED (no open value read; D-008, D-012)"}
      outlets: {slurry: slurry}
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: in, direction: in}
      - {id: slurry, direction: out, delegates: slurry}
      - {id: q, direction: out, kind: energy, delegates: qcr}
  - id: F101
    block: ISOL
    title: Filtration of the mother liquor (filter-dryer)
    class: Filtering
    solid_separation:
      solid_recovery: 0.998
      cake_liquid: {value: 0.05, basis: mass_fraction}
      outlets: {cake: cake, filtrate: filtrate}
      filtration: {specific_cake_resistance: 1.0e9, medium_resistance: 1.0e10, pressure_difference: 200, viscosity: 15, filtrate_density: 1500, provenance: assumed, source: "a granular salt cake, nitrogen pressure filtration at 200 kPa, the caustic liquor's viscosity and density ASSUMED (D-009)"}
      provenance: assumed
      source: "wet cake 5 wt% liquor, the 95 wt% of the centrifuged crystals of US 5 208 002 Example 1; 0.2 % of the crystals pass the cloth (ASSUMED, D-009)"
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in, delegates: slurry}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out}
  - id: W101
    block: ISOL
    title: Methanol wash of the cake (filter-dryer)
    class: Mixing
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: cake, direction: in}
      - {id: wash, direction: in, delegates: wash}
      - {id: fresh, direction: in, delegates: fresh}
      - {id: out, direction: out}
  - id: F102
    block: ISOL
    title: Filtration of the wash (filter-dryer)
    class: Filtering
    solid_separation:
      solid_recovery: 0.999
      cake_liquid: {value: 0.05, basis: mass_fraction}
      outlets: {cake: cake, filtrate: filtrate}
      filtration: {specific_cake_resistance: 1.0e9, medium_resistance: 1.0e10, pressure_difference: 200, viscosity: 0.7, filtrate_density: 830, provenance: assumed, source: "as F101, the aqueous methanol wash's viscosity and density ASSUMED (D-009)"}
      provenance: assumed
      source: "as F101: the methanol-wet cake 5 wt% liquid (ASSUMED, D-009)"
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out}
  - id: D101
    block: ISOL
    title: Vacuum drying at 333 K (filter-dryer)
    class: Drying
    dryer:
      volatiles: [H2O, MEOH]
      residual_moisture: {value: 0.001, basis: mass_fraction, provenance: assumed, source: "0.1 wt% water and methanol in the dried product (ASSUMED, D-009)"}
      temperature: 333.15
      energy: {heat_capacity: 1.3, latent_heat: {H2O: 2358, MEOH: 1132}, vessel_heat_capacity: 4000, efficiency: 0.7, port: steam, provenance: assumed, source: "the cake's heat capacity ASSUMED (NaN3 1.18 kJ/(kg K), CRC via thermo, with its liquid); latent heats at 333 K, water IAPWS-IF97, methanol thermo; the filter-dryer's steel 8 t x 0.5 kJ/(kg K) heated once a batch; 70 % of the heat to the cake (D-009)"}
      drying_rate: {value: 3.0, provenance: assumed, source: "a mean rate for an agitated vacuum filter-dryer (D-009)"}
      cake_density: {value: 1100, provenance: assumed, source: "the wet cake's bulk density, NaN3 crystals 1.846 g/cm3 (D-009)"}
      outlets: {product: product, vapour: vapour}
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: product, direction: out, delegates: product}
      - {id: vapour, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: q, direction: out, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M103
    block: ISOL
    title: Mother liquor, wash filtrate and dryer condensate receiver
    class: Mixing
    links: [{target: equipment, ref: T-101}]
    ports:
      - {id: filtrate, direction: in}
      - {id: wash, direction: in}
      - {id: vapour, direction: in}
      - {id: out, direction: out}
  - id: X101
    block: ISOL
    title: Mother liquor to the next batch, and the purge
    class: SplittingMaterial
    links: [{target: equipment, ref: T-101}]
    ports:
      - {id: in, direction: in}
      - {id: recycle, direction: out, delegates: recycle}
      - {id: purge, direction: out, delegates: purge}

streams:
  - id: S1
    title: Sodium nitrite
    from: NANO2.out
    to: M101.nano2
    template: generator
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "design basis"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 103.461, provenance: assumed, source: "0.769 mol NaNO2 per mol hydrazine in R-102's charge, US 5 208 002 Example 1's 47.5 mol on 61.8 mol (D-004)"}
        composition: {basis: mass_fraction, values: {NANO2: 1}, provenance: assumed, source: "dried NaNO2 of sodium-nitrite-1 (99.0 wt%), its impurities not modelled (D-004)"}
  - id: S2
    title: Process water to the nitrite charge
    from: PW1.out
    to: M101.pw
    template: generator
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "design basis"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 258.386, provenance: assumed, source: "the water of Example 1's 35 wt% nitrite solution and 50 wt% acid, 9.84 mol per mol NaNO2, less the water of S3 and S5 (D-004)"}
        composition: {basis: mass_fraction, values: {H2O: 1}, provenance: assumed, source: "design basis"}
  - id: S3
    title: Recovered methanol to the nitrite generator
    from: X102.gen
    to: M101.meoh
    template: generator
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "the receiver (D-007)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 54.458, provenance: assumed, source: "tear stream: 1.002 mol methanol per mol NaNO2 (Example 1's 47.6 on 47.5 mol), the methanol cut S15 at its calculated composition, converged over cheme process propagate (D-004, D-006)"}
        composition: {basis: mass_fraction, values: {H2O: 0.115929, MEOH: 0.884071}, provenance: assumed, source: "tear stream: the composition of S15 as cheme process propagate calculates it, converged (D-006)"}
  - id: S4
    title: Nitrite generator charge
    from: M101.out
    to: R101.in
    template: generator
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "the charge at 25 C, US 5 208 002 Example 1 (D-004)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 416.305, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S2 S3', fingerprint: 91d844a0440e7a45}
        composition: {basis: mole_fraction, values: {H2O: 0.830346, MEOH: 0.0849121, NANO2: 0.0847422, H2SO4: 0.0, NA2SO4: 0.0, MEONO: 0.0}, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S2 S3', fingerprint: 3636bcd7e909c3dc}
  - id: S5
    title: Sulfuric acid (dosed)
    from: ACID.out
    to: R101.acid
    template: generator
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "design basis"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 74.8056, provenance: assumed, source: "0.501 mol H2SO4 per mol NaNO2, US 5 208 002 Example 1's 23.8 mol on 47.5 mol, dosed as 98.5 wt% acid with the water of the patent's 50 wt% acid in the charge (D-004)"}
        composition: {basis: mass_fraction, values: {H2SO4: 0.985, H2O: 0.015}, provenance: assumed, source: "sulfuric-acid-1's 98.5 wt% acid"}
  - id: S6
    title: Sodium sulfate liquor
    from: R101.out
    to: SULF.in
    template: generator
    state:
      design:
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        temperature: {value: 298.15, provenance: calculated, source: 'cheme process propagate: reactor R101 from S4 S5', fingerprint: 0bc722f015ab285b}
        flow: {value: 399.67, provenance: calculated, source: 'cheme process propagate: reactor R101 from S4 S5', fingerprint: 0bc722f015ab285b}
        composition: {basis: mole_fraction, values: {H2O: 0.955483, MEOH: 0.000264888, NANO2: 8.8152e-05, H2SO4: 0.000132421, NA2SO4: 0.0440319, MEONO: 0.0}, provenance: calculated, source: 'cheme process propagate: reactor R101 from S4 S5', fingerprint: 0bc722f015ab285b}
  - id: S7
    title: Methyl nitrite gas to R-102 (dosed)
    from: R101.vent
    to: R102.meono
    template: meono
    state:
      design:
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
