id: sodium-azide-by-the-hydrazine-methyl-nitrite-route-batch-with-precipitation-from-the-reaction-liquor
title: Sodium azide by the hydrazine / methyl nitrite route, batch, with precipitation from the reaction
  liquor
description: Unallocated foreground LCI of Sodium azide by the hydrazine / methyl nitrite route, batch,
  with precipitation from the reaction liquor, case design, derived from the flowsheet by cheme assess
  lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Batch plant on a dedicated train: methyl nitrite generated from sodium nitrite, methanol
  and 98.5 % sulfuric acid at 298 K (R-101) and absorbed over 10 h into hydrazine hydrate and caustic
  soda with the recycled mother liquor at 313 K (R-102, semi-batch); methanol stripped and the liquor
  concentrated at 10 kPa(a) (C-101), NaN3 precipitated at 303 K, filtered, washed with methanol and vacuum-dried
  at 333 K (filter-dryer F-101); 1027.6 kg per batch, 652.6 batches a year'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:vacuum-vents
  title: equipment-leaks emissions of C-101, F-101
  direction: output
  reason: 'No P&ID yet: the vacuum pumps'' exhaust of C-101 and F-101 (nitrogen, air in-leakage, methanol
    and traces of methyl nitrite and hydrazine) goes to the thermal oxidiser and is not estimated (D-013,
    D-015).'
- key: emission-excluded:nitrogen-vents
  title: storage-tank emissions of R-101, R-102
  direction: output
  reason: The nitrogen of the purges leaves with R-102's off-gas to the thermal oxidiser; the off-gas
    itself is the treated product:OFFGAS. Not estimated separately (D-013).
- key: emission-excluded:liquor-receiver
  title: storage-tank emissions of T-101
  direction: output
  reason: The mother-liquor receiver T-101 breathes nitrogen with traces of methanol and hydrazine over
    a cold caustic liquor (303 K) to the thermal oxidiser; not estimated (no P&ID yet, D-013, D-016).
- key: emission-excluded:fugitive-leaks
  title: equipment-leaks emissions of the plant
  direction: output
  reason: 'Fugitive methanol, methyl nitrite and hydrazine from flanges, valves and pumps are not estimated:
    an estimate needs the P&ID component counts (D-013).'
