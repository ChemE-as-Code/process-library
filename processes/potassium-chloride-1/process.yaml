    - {chemical: methane, role: utility, inventory_key: "feed:FUEL", note: "Natural-gas firing of the dryer air (natural gas taken as methane), 0.0636 kWh/kg absorbed (core's dryer model)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "0.264 kWh/kg removed in the last two crystallizer stages' condensers"}
basis:
  capacity: "1.2 Mt/a potassium chloride crystal, 150 t/h (152.08 t/h of dried product) in 8000 h, one of the two trains of SRC-1, ASSUMED (DESIGN.md D-002)"
  operating_hours_per_year: 8000
  location: generic potash mine site, the plant beside the mine, not chosen
