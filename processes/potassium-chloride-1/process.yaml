# Process Atlas manifest of potassium-chloride-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: potassium-chloride-1
title: Potassium chloride by hot leaching of sylvinite and vacuum cooling crystallisation (1.2 Mt/a, concept)
summary: >-
  Muriate of potash from crushed sylvinite: KCl leached into hot mother liquor at about 90 C,
  tailings separated, the brine cooled to 45 C in seven vacuum stages, the crystals centrifuged
  and dried, the mother liquor reheated by the stages' vapour and steam. Concept stage, 4.0 t of
  ore and 1.80 GJ of steam per t, 90.8 % recovery, preliminary LCI.
description: |
  Sylvinite crushed below 4 mm (27.3 wt% KCl, 58.8 wt% NaCl, anhydrite and insolubles) is
  leached in two agitated stages with mother liquor at about 90 C: the brine, near saturation in
  NaCl, dissolves the sylvite and leaves the halite. Cyclones, a hot thickener and a filter send
  the salt tailings (3.2 t per t of product) to the pile, and the clarified hot brine, saturated in
  KCl, to a seven-stage vacuum cooling crystallizer. The water flashed in the stages is condensed
  and returned to the crystallizer feed with the make-up water, so that the NaCl stays dissolved
  while 27 % of the KCl crystallises between 90 and 45 C. Centrifuges give a 96 % solids cake,
  dried with natural-gas-fired air; the mother liquor, less a 0.5 % purge to deep-well injection,
  is preheated by the vapour of the first five stages, as far as the brine's boiling-point
  elevation allows, and heated with LP steam before it returns to the leach.

  cheme process propagate solves the whole flowsheet: the leach as a conversion of the sylvite and
  a little halite, the tailings separation as a solid separation, core's crystallizer and dryer,
  the loop torn at the mother liquor and the condensate, and two design specifications (the ore
  for 150 t/h of KCl crystal, the make-up water for the hot brine's KCl). The hot brine's KCl
  content and the crystallizer's yield are ASSUMED from an open cavern-brine analysis and a
  patent's statement on the temperature dependence of the KCl solubility: no open solubility
  data of the KCl-NaCl-water system were read. See DESIGN.md for every assumption.
families: [inorganic-chemicals, fertilizers]
keywords: [potassium chloride, KCl, muriate of potash, MOP, potash, sylvinite, sylvite, halite, hot leaching, crystallisation, vacuum cooling crystallizer, mother liquor, centrifuge, dryer, tailings, fertilizer]
facets:
  feedstock_basis: [mineral, water]
  product_classes: [fertilizers, chemicals]
  unit_operations: [leaching, crystallization, drying]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Ore grade, recovery and operating
# conditions from the Brazil Potash technical report summary, the Encanto PFS and US 4 412 838 A;
# the brine's KCl, the crystallizer yield and the duties' heat capacities are assumed (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD with closed mass, component and element balances (cheme validate, cheme process streams: 3
    blocks and 10 steps within tolerance; the loops converged at the tears S2 and S7 with the
    design specifications rate and liquor). The leach is a conversion of sylvite (DISK) and of
    halite (DISN), set so that the plant recovers the 90.8 % of SRC-1 and the brine holds its
    NaCl; the lumped insolubles are written as SiO2 so that the element balances evaluate (L-1).
    The crystallizer is core's model on an imposed per-pass yield of 0.2685, the equilibrium on
    the ASSUMED KCl solubility line, and an adiabatic flash of 7.97 % of its feed water; the dryer
    is core's model with ASSUMED parameters. Duties are hand balances on sensible heat with
    ASSUMED heat capacities and thermo's latent heats that close around the loop; the vapour heat
    recovery is limited by the brine's boiling-point elevation (core's Pitzer NaCl-H2O model, the
    KCl's share ASSUMED); heats of solution are left out (L-2). The mother liquor needs 368 K to
    hold the leach at 363 K, against the about 115 C of SRC-1 (D-008); the steam per t is about
    1.2 times SRC-1's hot-leach steam. Preliminary gate-to-gate LCI, one product, no allocation;
    the water, steam and fired heat linked to shared entries; the ore, electricity (in cheme
    assess lca; the Atlas build links it to the shared grid entry), cooling water (in cheme assess
    lca; the Atlas build links the shared cooling-tower utility), tailings and brine purge gaps. cheme maturity reaches no level; the claim
    `maturity: concept` is the lowest value of the schema, not an evidenced level. Not reviewed.
    Needs cheme-as-code 1.13.0.
chemistry:
  inputs:
    - {chemical: sylvinite, role: feedstock, inventory_key: "feed:ORE", note: "Crushed sylvinite ore (27.3 wt% KCl, below 4 mm), 3.996 kg/kg product; no library producer (gap)"}
    - {chemical: water, role: feedstock, inventory_key: "feed:PW", note: "Process make-up water, 0.308 kg/kg"}
  outputs:
    - {chemical: potassium-chloride, role: main-product, inventory_key: "product:KCLP", note: "Potassium chloride (MOP), dried (modelled 99.07 wt% KCl, 0.83 wt% NaCl, 0.1 wt% water), to compaction, screening and storage"}
    - {chemical: potash-tailings, role: waste, inventory_key: "product:TAIL", note: "Salt tailings (71 wt% halite, anhydrite, insolubles, 10 wt% brine) to the pile and backfill, 3.155 kg/kg; a gap (no disposal entry), not a sodium chloride product"}
    - {chemical: potash-brine-purge, role: waste, inventory_key: "product:BRINE", note: "Brine purge (10.7 wt% KCl, 20.3 wt% NaCl) to deep-well injection, 0.126 kg/kg; a gap (no injection entry), not wastewater for treatment"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "0.1413 kWh/kg, all drives lumped (ASSUMED from SRC-1's process load list per t)"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "LP steam 450 kPa(a) for the mother-liquor heater, 0.499 kWh/kg (1.80 GJ/t, counted as heat)"}
    - {chemical: methane, role: utility, inventory_key: "feed:FUEL", note: "Natural-gas firing of the dryer air (natural gas taken as methane), 0.0635 kWh/kg: the heat the drying air takes up from the direct-fired heater (core's dryer duty: 0.0381 kWh/kg to the cake over the dryer's ASSUMED efficiency of 0.6); the burner's losses in the background"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "0.433 kWh/kg removed in the crystallizer's surface condensers (the vapour the preheaters cannot take)"}
basis:
  capacity: "1.2 Mt/a potassium chloride crystal, 150 t/h (152.08 t/h of dried product) in 8000 h, one of the two trains of SRC-1, ASSUMED (DESIGN.md D-002)"
  operating_hours_per_year: 8000
  location: generic potash mine site, the plant beside the mine, not chosen
