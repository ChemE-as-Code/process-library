    - {chemical: sodium-chloride, role: waste, inventory_key: "product:TAIL", note: "Salt tailings (71 wt% halite, anhydrite, insolubles, 10 wt% brine) to the pile and backfill, 3.156 kg/kg"}
    - {chemical: wastewater, role: waste, inventory_key: "product:BRINE", note: "Brine purge (10.5 wt% KCl, 20.3 wt% NaCl) to deep-well injection, 0.121 kg/kg"}
  utilities:
