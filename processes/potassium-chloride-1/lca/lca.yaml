# Goal and scope of the potassium-chloride-1 LCI. Schema: `cheme schema lca`. Outputs: `cheme
# assess lca --write` (lca/inventory.csv, gaps.csv, dataset.yaml, manifest.json, results); never
# edit those by hand.
#
# Preliminary gate-to-gate foreground inventory (DESIGN.md D-010): every exchange of the plant per
# kg of dried potassium chloride, from the flowsheet's design case. The backgrounds are left
# unmapped (`missing:` with the activity each should connect to), except where lca/mappings.yaml
# links a shared entry: a gap, never zero, and no values from licensed databases. Flocculant,
# anti-caking agent and de-dusting oil are named by the sources without amounts and are left out
# (D-009, L-5).
schema: cheme/lca/v1
kind: lca
goal: >-
  Preliminary gate-to-gate life cycle inventory of potassium chloride (muriate of potash) made by
  hot leaching of crushed sylvinite ore and vacuum cooling crystallisation, at the concept stage:
  which ore, water, steam, fuel, electricity and wastes the plant exchanges per kg of product, as
  the foreground for a later cradle-to-gate study and for the potassium chloride that
  npk-fertilizers-1 records as a gap. Steam for the mother liquor and the 3.2 kg of salt tailings
  per kg dominate.
functional_unit: {product: KCLP, amount: 1, unit: kg, source: "1 kg of the dried product, stream S16 (modelled 98.6 wt% crystal, 0.4 wt% KCl and 0.8 wt% NaCl from the dried cake liquor, 0.1 wt% water) at the dryer outlet (D-002, D-007, D-010)"}
# The boundary key stays cradle-to-gate so that the purchased inputs remain open gaps instead of
# being mapped free (the schema's gate-to-gate maps every feed free), as other entries do.
boundary: cradle-to-gate
case: design
year: 2026
location: GLO
technology: "Continuous plant on a potash mine: crushed sylvinite (27.3 wt% KCl, below 4 mm) leached in two agitated stages at about 90 C with reheated mother liquor, tailings separated by cyclones, a hot thickener and a filter, the hot brine diluted with condensate and cooled to about 45 C in seven vacuum stages, the KCl centrifuged and dried in a gas-fired dryer, the mother liquor preheated with the first five stages' vapour and heated with LP steam; 150 t/h of KCl crystal (SRC-1 Brazil Potash TRS 2024, SRC-2 Encanto PFS 2017, SRC-3 US 4 412 838 A)"
rights: "CC-BY-4.0: the ChemE-as-Code process library's own concept design (LICENSE-DATA)"
system_model: cutoff
allocation:
  method: none
  source: "D-010: one product (potassium chloride); the salt tailings and the brine purge are wastes (no sale of the halite is assumed), not co-products"
flows:
  # raw materials
  - key: feed:ORE
    missing: "not mapped yet (D-010); no library process mines sylvinite. Connect to: sylvinite (potash ore) mined underground (conventional room-and-pillar or drum-cutter mining), hoisted and crushed below 4 mm, per kg as fed"
    source: "flowsheet stream S1, set by the design specification for 150 t/h of crystal (D-003)"
  - key: feed:PW
    missing: "linked to the shared water entry (lca/mappings.yaml): process water from wells (SRC-1)"
    source: "flowsheet stream S6, set by the design specification for the hot brine's 14.19 wt% KCl (D-005)"
  # utilities
  - key: feed:POWER
    missing: "not mapped yet in this folder (D-010; the Atlas build links it through the shared lci/mappings.yaml electricity entry): electricity, medium voltage, grid mix of the (undecided) site country"
    source: "flowsheet energy stream P1, 187.5 kWh per t of product (ASSUMED from SRC-4), D-008"
  - key: feed:LPS
    missing: "linked as heat from steam (lca/mappings.yaml); connect to: steam from a natural-gas-fired site boiler or CHP (e.g. processes/utility-steam-ng-boiler; SRC-1 raises steam with natural gas), per kWh of condensing heat"
    source: "flowsheet energy stream Q3 (the mother-liquor heater, hand balance), D-008"
  - key: feed:FUEL
    missing: "linked as heat from natural gas (lca/mappings.yaml): the dryer's direct-fired air heater, per kWh absorbed; combustion emissions in the background"
    source: "flowsheet energy stream Q4 (core's dryer model), D-008"
  - key: product:CW
    missing: "heat rejected to a recirculating cooling-water system (prefer_atlas: processes/utility-cooling-tower), per kWh removed"
    source: "flowsheet energy stream Q2: the surface condensers of the last two crystallizer stages, D-008"
  # wastes and emissions
  - key: product:TAIL
    treatment: {kind: waste, route: "salt tailings (halite with anhydrite, insolubles and brine) stacked on a tailings pile with a brine pond, part returned underground as backfill (SRC-1); the pile's brine to deep-well injection"}
    missing: "not mapped yet (D-010): disposal of potash salt tailings on a pile (with the long-term dissolution of the salt by rain), per kg"
    source: "flowsheet stream S4 (D-006)"
  - key: product:BRINE
    treatment: {kind: waste, route: "brine purge injected into a deep saline aquifer (SRC-1: 310-400 m; SRC-2: 1800 m)"}
    missing: "not mapped yet (D-010): deep-well injection of a KCl-NaCl brine, per kg"
    source: "flowsheet stream S12 (D-006)"
  - key: product:DRYV
    emission: true
    source: "flowsheet stream S17: the dryer's water vapour, with the combustion gas and air, after the cyclones and wet scrubbers (SRC-2) (D-008)"
  - {key: emission:H2O, free: true, source: "water vapour of the dryer exhaust"}
operation:
  hours_per_year: 8000
  life_years: 25
  source: "design basis operating_hours_per_year 8000 (ASSUMED); 25 a service life ASSUMED; no construction inventory at this stage (no take-off)"
emission_exclusions:
  - id: dryer-dust
    method: combustion
    equipment: [DR-301]
    exchange: product:DRYV
    reason: "KCl dust after the dryer's cyclones and wet scrubbers and the combustion products of the direct-fired air heater (CO2, NOx, CO) are not estimated at the concept stage; the combustion emissions belong to the background of the fired heat feed:FUEL (D-010)"
    source: "DESIGN.md D-010"
dataset:
  version: 0.1.0
  classification: {isic: "2012"}   # ISIC Rev.4 2012 Manufacture of fertilizers and nitrogen compounds
  modelling: {principle: attributional}
  geography: {description: "Generic potash mine site, country not chosen (GLO); one design case"}
  system_model: cutoff
  technology_level: current
  review: {type: none}
  data_generator: "ChemE-as-Code agent session (Claude Opus 5.5) for issue #514, unreviewed"
