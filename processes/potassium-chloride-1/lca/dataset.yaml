technology: 'Continuous plant on a potash mine: crushed sylvinite (27.3 wt% KCl, below 4 mm) leached in
  two agitated stages at about 90 C with reheated mother liquor, tailings separated by cyclones, a hot
  thickener and a filter, the hot brine diluted with condensate and cooled to about 45 C in seven vacuum
  stages, the KCl centrifuged and dried in a gas-fired dryer, the mother liquor preheated with the first
  five stages'' vapour and heated with LP steam; 150 t/h of KCl crystal (SRC-1 Brazil Potash TRS 2024,
  SRC-2 Encanto PFS 2017, SRC-3 US 4 412 838 A)'
