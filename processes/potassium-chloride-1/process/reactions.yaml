# Reactions of potassium-chloride-1. Schema cheme/reactions/v1 (`cheme schema reactions`).
#
# No chemical reaction takes place: the hot leach dissolves the ore's sylvite into a brine already
# near saturation in NaCl, and the cooling crystallizer brings it back out (SRC-1, the Brazil
# Potash technical report summary, section 1.10; SRC-3, US 4 412 838 A). The flowsheet books the
# two dissolutions in the leach tanks as conversions of the solid (DESIGN.md D-005):
#
# - DISK: sylvite to dissolved KCl, at a conversion that leaves the share of the ore's KCl that
#   the plant does not recover undissolved in the tailings (ASSUMED, D-005);
# - DISN: halite to dissolved NaCl, a small conversion set so that the brine's NaCl is held at its
#   target at steady state: the halite dissolved replaces the NaCl that leaves with the tailings'
#   brine, the product's cake liquor and the purge (D-005).
#
# The crystallisation of KCl is core's crystallizer model (process/flowsheet.yaml X201), not a
# reaction. Heats of solution are left out: no open value of the heat of solution of KCl or NaCl
# in these brines was read (L-2); the duties are hand balances on sensible heat (D-008).
schema: cheme/reactions/v1
kind: reactions
reactions:
  - id: DISK
    title: Dissolution of sylvite in the hot leach brine
    equation: KCl_s -> KCl
    stoichiometry: {KCl_s: -1, KCl: 1}
    phase: mixed
    conversion: {key: KCl_s, value: 0.96132, provenance: assumed, source: "D-005: 96.13 % of the ore's sylvite dissolved in the two leach stages, ASSUMED: set so that, with the KCl lost in the tailings' brine and the purge (D-006), the dried product holds 90.8 % of the ore's KCl, the plant recovery of SRC-1 (section 1.10)"}
    sources: ["SRC-1: Brazil Potash technical report summary (2024), section 1.10: hot leaching of the crushed ore in two cascaded agitated stages at about 90 C", "SRC-3: US 4 412 838 A: the sylvinite leached with hot brine at 95-100 C"]
  - id: DISN
    title: Dissolution of halite (make-up of the brine's NaCl)
    equation: NaCl_s -> NaCl
    stoichiometry: {NaCl_s: -1, NaCl: 1}
    phase: mixed
    conversion: {key: NaCl_s, value: 0.040966, provenance: assumed, source: "D-005: the halite that dissolves to replace the NaCl leaving with the tailings' brine, the product cake and the purge, set so that the hot brine S5 holds 0.2995 kg NaCl per kg water (19.78 wt%, D-004); found by successive substitution on the propagated flowsheet"}
    sources: ["SRC-3: US 4 412 838 A, background: the NaCl solubility in the KCl-NaCl-water system changes little between 20 and 110 C, so the brine stays near NaCl saturation through the loop"]
