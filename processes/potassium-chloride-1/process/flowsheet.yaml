        flow: {value: 480037.0, provenance: calculated, source: 'cheme process propagate: solid-separation S101 from S3', fingerprint: 910ca92bad01ffb7}
        composition: {basis: mole_fraction, values: {KCl_s: 0.00978877, NaCl_s: 0.656707, CaSO4_s: 0.0360728, INSOL: 0.072109, KCl: 0.0102261, NaCl: 0.0181831, H2O: 0.196913}, provenance: calculated, source: 'cheme process propagate: solid-separation S101 from S3', fingerprint: 910ca92bad01ffb7}
