        composition: {basis: mole_fraction, values: {KCl_s: 0.000522886, NaCl_s: 0.0350793, CaSO4_s: 0.0019269, INSOL: 0.00385184, H2O: 0.837754, KCl: 0.0435063, NaCl: 0.0773589}, provenance: calculated, source: 'cheme process propagate: reactor L101 from S1 S2', fingerprint: d32c7ccb34c5a503}
