        temperature: {value: 298.15, provenance: assumed, source: "design basis"}
        pressure: {value: 300, provenance: assumed, source: "design basis"}
        composition: {basis: mass_fraction, values: {H2O: 1.0}, provenance: assumed, source: "site process water"}
        flow: {value: 46873.4, provenance: calculated, source: 'cheme process propagate: spec liquor (S5 KCl mass fraction 0.1419)', fingerprint: 79ffa9ff50e19e0e}
  - id: S7
    title: Condensate (dilution water)
