# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Acetic acid by low-water iridium-catalysed methanol carbonylation (DESIGN.md D-001, D-003).
# Where the values come from:
# - the feeds' compositions: methanol = methanol-1 product S18 (D-005), CO gas ASSUMED (D-005);
# - temperatures and pressures: design choices inside the ranges of US 6,140,535 (D-003);
# - separator, column, decanter and scrubber outlets and every duty: the shortcut balance
#   scripts/balance.py (D-006, D-008), given here as `assumed`: no property package qualifies
#   this polar, associating mixture (core #315), so flashes, columns and enthalpies are not
#   calculated by cheme;
# - the mixer M101, the pumps and the reactor R101 (conversion model, process/reactions.yaml)
#   are calculated by `cheme process propagate --fill` and must reproduce the script.
schema: cheme/process/v1
kind: flowsheet
title: Acetic acid by methanol carbonylation (60 t/h glacial acetic acid, Ir/Ru low-water)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
cases:
  - {id: design, description: "Design case: 60 t/h glacial acetic acid from methanol (methanol-1 Grade AA) and CO gas, Ir/Ru catalyst at 463 K and 2900 kPa(a) (D-002, D-003)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: MEOH, title: "Methanol, Grade AA (from methanol-1)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: COGAS, title: Carbon monoxide gas (from a syngas cold box outside the boundary), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: MEI, title: Methyl iodide make-up (iodide promoter), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: p101, direction: out, kind: energy}
      - {id: p102, direction: out, kind: energy}
      - {id: c201, direction: out, kind: energy}
      - {id: c202, direction: out, kind: energy}
      - {id: c203, direction: out, kind: energy}
  - id: MPS
    title: MP steam 1100 kPa(a)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1100, provenance: assumed, source: "design basis, D-008"}
      supply_temperature: {value: 457.2, provenance: assumed, source: "saturation at 1100 kPa(a), D-008"}
      min_approach: {value: 10, provenance: assumed, source: D-008}
    ports:
      - {id: c201, direction: out, kind: energy}
      - {id: c202, direction: out, kind: energy}
      - {id: c203, direction: out, kind: energy}
products:
  - {id: HAC, title: Glacial acetic acid to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: OFFGAS, title: Scrubbed off-gas to the site flare / thermal oxidiser, category: off_gas, ports: [{id: in, direction: in}]}
  - {id: HEAVY, title: Heavy ends (propionic acid in acetic acid) to incineration, category: by_product, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-008"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-008"}
      min_approach: {value: 5, provenance: assumed, source: D-008}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: c201, direction: in, kind: energy}
      - {id: c202, direction: in, kind: energy}
      - {id: c203, direction: in, kind: energy}

blocks:
  - id: RXN
    title: Carbonylation reaction and flash
    class: ReactingChemicals
    ports:
      - {id: co, direction: in}
      - {id: mei, direction: in}
      - {id: scr, direction: in}
      - {id: leb, direction: in}
      - {id: hvy, direction: in}
      - {id: aq, direction: in}
      - {id: dry, direction: in}
      - {id: hpvent, direction: out}
      - {id: vap, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: SCR
    title: Off-gas scrubbing (methanol)
    class: Absorbing
    ports:
      - {id: meoh, direction: in}
      - {id: hpvent, direction: in}
      - {id: lpvent, direction: in}
      - {id: gas, direction: out}
      - {id: liq, direction: out}
      - {id: power, direction: in, kind: energy}
  - id: PUR
    title: Purification (light ends, drying, heavy ends)
    class: Distilling
    ports:
      - {id: vap, direction: in}
      - {id: leb, direction: out}
      - {id: hvy, direction: out}
      - {id: aq, direction: out}
      - {id: dry, direction: out}
      - {id: lpvent, direction: out}
      - {id: product, direction: out}
      - {id: heavy, direction: out}
      - {id: steam1, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: steam3, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: cw3, direction: out, kind: energy}
      - {id: power1, direction: in, kind: energy}
      - {id: power2, direction: in, kind: energy}
      - {id: power3, direction: in, kind: energy}

steps:
  # --- off-gas scrubbing: the fresh methanol is the scrubbing liquid (D-007) ---
  - id: P101
    block: SCR
    title: Methanol feed pump
    # TransportingFluids, not Pumping: cheme process build crashes on Pumping's method field
    # (a Union annotation, cheme-as-code issue to report; DESIGN.md D-012)
    class: TransportingFluids
    links: [{target: equipment, ref: P-101}]
    ports:
      - {id: in, direction: in, delegates: meoh}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: T101
    block: SCR
    title: Vent gas scrubber (HP and LP vents, lumped)
    class: Absorbing
    links: [{target: equipment, ref: T-101}]
    ports:
      - {id: solv, direction: in}
      - {id: hp, direction: in, delegates: hpvent}
      - {id: lp, direction: in, delegates: lpvent}
      - {id: gas, direction: out, delegates: gas}
      - {id: liq, direction: out, delegates: liq}
  # --- reaction ---
  - id: M101
    block: RXN
    title: Reactor feed junction (fresh feeds and recycles)
    class: Mixing
    ports:
      - {id: co, direction: in, delegates: co}
      - {id: mei, direction: in, delegates: mei}
      - {id: scr, direction: in, delegates: scr}
      - {id: cat, direction: in}
      - {id: leb, direction: in, delegates: leb}
      - {id: hvy, direction: in, delegates: hvy}
      - {id: aq, direction: in, delegates: aq}
      - {id: dry, direction: in, delegates: dry}
      - {id: out, direction: out}
  # D-003, D-004: liquid-phase CSTR; lumped conversion model from sourced by-product ratios
  - id: R101
    block: RXN
    title: Carbonylation reactor with external cooler and HP vent condenser
    class: ReactingChemicals
    reactions: [CARB, WGS, MEOH_CH4, PROP]
    reactor: conversion
    links: [{target: equipment, ref: R-101}, {target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: V101
    block: RXN
    title: Reactor HP vent knock-out (non-condensables off the reactor head)
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: in, direction: in}
      - {id: vap, direction: out, delegates: hpvent}
      - {id: liq, direction: out}
  - id: V102
    block: RXN
    title: Adiabatic flash (catalyst separation)
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-102}]
    ports:
      - {id: in, direction: in}
      - {id: vap, direction: out, delegates: vap}
      - {id: liq, direction: out}
  - id: P102
    block: RXN
    title: Catalyst recycle pump
    class: TransportingFluids
    links: [{target: equipment, ref: P-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  # --- purification ---
  - id: C201
    block: PUR
    title: Light-ends column (with overhead condenser; no reboiler duty beyond the feed vapour, D-008)
    class: Distilling
    links: [{target: equipment, ref: C-201}, {target: equipment, ref: E-201}, {target: equipment, ref: E-202}]
    ports:
      - {id: feed, direction: in, delegates: vap}
      - {id: top, direction: out}
      - {id: side, direction: out}
      - {id: bot, direction: out, delegates: leb}
      - {id: reb, direction: in, kind: energy, delegates: steam1}
      - {id: cond, direction: out, kind: energy, delegates: cw1}
      - {id: power, direction: in, kind: energy, delegates: power1}
  - id: V201
    block: PUR
    title: Light-ends decanter
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-201}]
    ports:
      - {id: in, direction: in}
      - {id: vent, direction: out, delegates: lpvent}
      - {id: heavy, direction: out, delegates: hvy}
      - {id: light, direction: out, delegates: aq}
  - id: C202
    block: PUR
    title: Drying column
    class: Distilling
    links: [{target: equipment, ref: C-202}, {target: equipment, ref: E-203}, {target: equipment, ref: E-204}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out, delegates: dry}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: steam2}
      - {id: cond, direction: out, kind: energy, delegates: cw2}
      - {id: power, direction: in, kind: energy, delegates: power2}
  - id: C203
    block: PUR
    title: Heavy-ends column (product overhead, with product cooler)
    class: Distilling
    links: [{target: equipment, ref: C-203}, {target: equipment, ref: E-205}, {target: equipment, ref: E-206}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out, delegates: product}
      - {id: bot, direction: out, delegates: heavy}
      - {id: reb, direction: in, kind: energy, delegates: steam3}
      - {id: cond, direction: out, kind: energy, delegates: cw3}
      - {id: power, direction: in, kind: energy, delegates: power3}

