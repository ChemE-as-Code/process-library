        temperature: {value: 313.15, provenance: assumed, source: "methanol-1 product delivery temperature, D-005"}
        flow: {value: 32342.2, basis: mass, provenance: assumed, source: "scripts/balance.py: carbonylation + methanation + scrubber slip (D-004, D-006)"}
        composition: {basis: mole_fraction, values: {CH3OH: 0.99911105, H2O: 0.00088895}, provenance: assumed, source: "methanol-1 stream S18 (Grade AA, water 0.05 wt% design target), D-005"}
  - id: S03
