# Tier 1 form, a manifest-only entry without a flowsheet (as process-library#317). Every amount is the
# formula of its parameters; core's validator re-checks each. Written from the US NETL study of
# industrial capture (2023), facts in our own form; the IPCC 2006 Guidelines set the boundary.
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: co2-conditioning-ammonia-stripper-vent
title: CO2 conditioning (compression, TEG drying, cooling) of an ammonia plant's CO2 stripper vent
description: Per 1 t of dense-phase CO2 at 15.3 MPa and 30 degC (99.95 mol% CO2), gate-to-gate, from the
  wet stripper vent of a natural-gas ammonia plant. Compression, drying and cooling only;
  the CO2 separation belongs to the ammonia plant, and the vent gas enters without burden (system-model
  section 2, step 4). After the NETL ammonia case of 2023.
basis: 1000 kg of dense-phase CO2, 15.3 MPa, 30 degC, 99.95 mol% CO2
boundary: 'gate-to-gate: inlet water knockout, five-stage reciprocating compression with intercooling,
  TEG drying within the train, aftercooling, and a stand-alone cooling-water system; from the stripper
  vent outlet to the pipeline inlet (IPCC 2006 V2 5.3: capture includes compression and dehydration)'
technology: reciprocating CO2 compression to 15.3 MPa with triethylene glycol dehydration and an evaporative
  cooling tower; no CO2 separation (the source is already 97 mol% CO2)
geography:
  description: 'US: the NETL representative ammonia plant (394 kt/a NH3, natural-gas feed); no single
    site.'
classification:
  isic: '2011'
system_boundary:
  included:
  - the raw vent gas (no burden, see modelling)
  - electricity of the compressor, the circulating-water pumps and the cooling-tower fans
  - TEG make-up and spent TEG
  - cooling-tower make-up, evaporation and blowdown
  - condensate knocked out of the gas
  excluded:
  - 'TODO fugitive CO2 of the compression plant: IPCC 2006 V2 5.4.1 places most fugitive emissions
    of a CCS chain at the capture and compression facilities but gives no default for them, and the
    NETL stream table conserves CO2 within its rounding; not quantified, not zero'
  - 'TODO CO2 dissolved in the condensate and released by the TEG regenerator vent: not stated by the
    source'
  - 'TODO heat of the TEG regenerator (reboiler): the NETL case lists no fuel or steam, so it is either
    inside the quoted compressor package or missing; not quantified'
  - 'TODO make-up and wastewater treatment chemicals, about 0.1 t/d in the NETL case: composition not
    stated'
  - transport and storage of the CO2 beyond the pipeline inlet
  - the CO2 separation (aMDEA or carbonate absorber and regenerator), which is part of the ammonia plant
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: US
year: 2023
valid_until: 2028
time:
  start: 2018
  description: NETL study published March 2023, cost base December 2018, plant data of 2019. valid_until
    is the reference year + 5 (system-model section 6).
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation. The raw vent gas is the CO2 co-product of the ammonia
    plant cut before conditioning (system-model section 2, step 4, rule co2-cutoff): it carries no burden
    of the ammonia plant, and this dataset is its separate, subdivided conditioning. Its carbon is fossil
    and leaves with the product; no capture or avoided-emission credit is given here.'
uuid: c3bc38ab-0a48-55ef-a218-10e2c6217b03
version: 0.1.0
methodology_version: 1.1.0
system_model: cutoff
technology_level: current
review: unreviewed
rights: CC-BY-4.0
data_generator: ChemE-as-Code process library
parameters:
- name: co2
  value: 1000.0
  unit: kg
  description: Conditioned CO2 delivered (the basis).
  source: basis
- name: M_CO2
  value: 44.009
  unit: g/mol
  description: Molar mass of carbon dioxide.
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573),
    applied to the formula
- name: M_H2O
  value: 18.015
  unit: g/mol
  description: Molar mass of water.
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573),
    applied to the formula
- name: x_c_f
  value: 0.9709
  unit: mol/mol
  description: CO2 mole fraction of the raw stripper-vent gas (the rest water), at 21 degC and 0.16 MPa.
  source: NETL (2023) Cost of Capturing CO2 from Industrial Sources, DOE/NETL-2023/3907, section 5.1.5,
    Exhibit 5-3 (ammonia stream table), stream 1
- name: x_w_f
  value: 0.0291
  unit: mol/mol
  description: Water mole fraction of the raw stripper-vent gas. It is above the saturation value at
    21 degC and 0.16 MPa (about 0.016, water vapour pressure 2.5 kPa), so part of it arrives as liquid
    and leaves at the inlet knockout.
  source: 'NETL (2023), DOE/NETL-2023/3907, section 5.1.5, Exhibit 5-3, stream 1. The same report''s
    design inputs (section 5.1.3) state 99 vol% CO2 and 1 vol% water instead; the stream table is used
    because it carries the flows, and the difference (about 8 kg/t less condensate at 1 vol%) is in
    the condensate uncertainty'
- name: x_c_p
  value: 0.9995
  unit: mol/mol
  description: CO2 mole fraction of the conditioned product at 15.3 MPa and 30 degC (the rest water).
  source: NETL (2023), DOE/NETL-2023/3907, section 5.1.5, Exhibit 5-3, stream 3
- name: x_w_p
  value: 0.0005
  unit: mol/mol
  description: Water mole fraction of the conditioned product (500 ppm, after the TEG dryer).
  source: NETL (2023), DOE/NETL-2023/3907, section 5.1.5, Exhibit 5-3, stream 3
- name: m_prod
  value: 55488.0
  unit: kg/h
  description: Product flow of the source's case, the denominator of its per-hour figures.
  source: NETL (2023), DOE/NETL-2023/3907, section 5.1.5, Exhibit 5-3, stream 3 (55,488 kg/h)
- name: P_comp
  value: 5770.0
  unit: kW
  description: Electric power of the five-stage reciprocating CO2 compressor, 0.16 to 15.3 MPa.
  source: NETL (2023), DOE/NETL-2023/3907, section 5.1.5, Exhibit 5-4 (performance summary); scaled
    by NETL from a vendor quote (section 4.1.1)
- name: P_cwp
  value: 60.0
  unit: kW
  description: Electric power of the circulating-water pumps.
  source: NETL (2023), DOE/NETL-2023/3907, section 5.1.5, Exhibit 5-4
- name: P_fan
  value: 30.0
  unit: kW
  description: Electric power of the cooling-tower fans.
  source: NETL (2023), DOE/NETL-2023/3907, section 5.1.5, Exhibit 5-4
- name: gal
  value: 0.003785411784
  unit: m3
  description: One US liquid gallon.
  source: 'definition: 231 cubic inches, with the inch of 25.4 mm exactly'
- name: V_mu
  value: 46.0
  unit: 1000 gal/d
  description: Water make-up per operating day at full rate, read as the cooling-tower make-up (the
    case has no other water user).
  source: 'NETL (2023), DOE/NETL-2023/3907, section 5.1.8, Exhibit 5-7 (O&M, consumables, water, per
    day); the per-day figure is at full rate: the annual cost divided by it gives 310 days, the 85 %
    capacity factor. Reading it as cooling-tower make-up is ASSUMED'
- name: rho_w
  value: 1000.0
  unit: kg/m3
  description: Density of the make-up water.
  source: 'ASSUMED: 1000 kg/m3 (within 0.3 % of liquid water at 5 to 30 degC)'
- name: cycles
  value: 4.0
  unit: '1'
  description: Cycles of concentration of the cooling tower; splits the make-up into evaporation and
    blowdown.
  source: 'ASSUMED: the placeholder of the library''s utility-cooling-tower dataset; the source does
    not state it. TODO source, or set per site'
- name: V_teg
  value: 312.0
  unit: gal/d
  description: TEG make-up per operating day at full rate; the same volume goes to waste disposal.
  source: NETL (2023), DOE/NETL-2023/3907, section 5.1.8, Exhibit 5-7 (consumables and waste disposal,
    triethylene glycol, per day); full rate as for V_mu (annual cost / price / per-day figure = 310 days)
- name: rho_teg
  value: 1125.0
  unit: kg/m3
  description: Density of liquid triethylene glycol at 20 degC.
  source: PubChem CID 8172 (triethylene glycol), section Density, 1.125 at 68 degF (CAMEO Chemicals, USCG
    1999); queried 2026-11-05
