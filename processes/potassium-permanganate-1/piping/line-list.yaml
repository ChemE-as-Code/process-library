# Line list. Schema: `cheme schema lines`.
# Concept stage: one line per piped material stream of the PFD (stream id in the notes), no
# P&ID yet. Nominal diameters are not sized: no property package gives densities of these
# KOH-manganate liquors and slurries (D-010). Solid streams go by conveyor and have no line
# (S1 ore, S5 oxidised cake, S7 lime, S12 residue, S18 wet crystals, S20 product). Sizes come at
# basic engineering.
lines:
