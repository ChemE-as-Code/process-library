# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Potassium permanganate from MnO2 ore by KOH roasting and electrolytic oxidation, 1250 kg/h
# technical-grade KMnO4 (D-001, D-002). Where the values come from:
# - every flow and composition is from the independent sequential balance
#   scripts/kmno4_balance.py (D-004 to D-008), given here as ASSUMED: it rests on ASSUMED design
#   parameters (conversions, current efficiency, mother-liquor composition, cake liquids,
#   purge) and a neutral-molecule basis for the liquors, because core cannot speciate
#   KOH-manganate electrolytes (core #364) and its crystalliser refuses several solutes (D-007);
# - reactor steps name their reactions (process/reactions.yaml), so cheme checks their balance
#   by elements; the cells are checked by `cheme process cell` (process/cells.yaml);
# - duties are from the same script (D-009), ASSUMED; no property package covers these streams.
schema: cheme/process/v1
kind: flowsheet
title: Potassium permanganate from MnO2 ore by KOH roasting and electrolytic oxidation (1250 kg/h)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - id: design
    description: "Design case: 1250 kg/h technical-grade KMnO4 (10 000 t/a at 8000 h/a, D-002)"
    default: true
    capacity: 1250 kg/h KMnO4 product
    provenance: assumed
    source: "D-002: a normalisation basis for the inventory, not a commercial plant claim"
tolerance: {abs: 0.5, rel: 0.002}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: ORE, title: Manganese ore (MnO2 concentrate) dried and ground, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: KOH, title: Potassium hydroxide make-up (50 wt% solution), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AIR, title: Roaster air, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: LIME, title: Hydrated lime, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PW, title: Process water, category: raw_material, ports: [{id: out, direction: out}]}
  - id: FUEL
    title: Fired heat (natural gas, indirect firing of the roaster)
    category: utility
    utility:
      kind: fired_heat
      level: natural gas firing
      supply_temperature: {value: 1100, provenance: assumed, source: "D-009: flue gas in the roaster firing jacket, a concept value"}
      min_approach: {value: 50, provenance: assumed, source: D-009}
    ports: [{id: r201, direction: out, kind: energy}]
  - id: LPS
    title: LP steam 450 kPa(a) (condensate returned)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis, D-009"}
      supply_temperature: {value: 420.8, provenance: assumed, source: "saturation at 450 kPa(a), D-009"}
      min_approach: {value: 10, provenance: assumed, source: D-009}
    ports:
      - {id: m301, direction: out, kind: energy}
      - {id: e601, direction: out, kind: energy}
      - {id: d501, direction: out, kind: energy}
  - id: POWER
    title: Electric power (AC, grid)
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: rect, direction: out, kind: energy}
      - {id: aux, direction: out, kind: energy}
products:
  - {id: KMNO4, title: Potassium permanganate (technical grade) to packing, category: product, ports: [{id: in, direction: in}]}
  - {id: RESIDUE, title: Washed leach residue to disposal, category: solid_waste, ports: [{id: in, direction: in}]}
  - {id: PURGE, title: Mother-liquor purge to effluent treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - {id: OFFGAS, title: Roaster off-gas to atmosphere (after the dust scrubber), category: off_gas, ports: [{id: in, direction: in}]}
  - {id: H2V, title: Cathode hydrogen to atmosphere (diluted vent), category: off_gas, ports: [{id: in, direction: in}]}
  - {id: O2V, title: Anode oxygen to atmosphere, category: off_gas, ports: [{id: in, direction: in}]}
  - {id: DRYV, title: Dryer exhaust vapour to atmosphere, category: off_gas, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-009"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-009"}
      min_approach: {value: 5, provenance: assumed, source: D-009}
    ports:
      - {id: t401, direction: in, kind: energy}
      - {id: el401, direction: in, kind: energy}
      - {id: x501, direction: in, kind: energy}
      - {id: e601, direction: in, kind: energy}

blocks:
  - id: OXD
    title: Ore oxidation (KOH roasting with air)
    class: ReactingChemicals
    ports:
      - {id: ore, direction: in}
      - {id: koh, direction: in}
      - {id: air, direction: in}
      - {id: conc, direction: in}
      - {id: cake, direction: out}
      - {id: gas, direction: out}
      - {id: heat, direction: in, kind: energy}
  - id: LCH
    title: Leaching, silicate removal and residue filtration
    class: ReactingChemicals
    ports:
      - {id: cake, direction: in}
      - {id: lime, direction: in}
      - {id: ml, direction: in}
      - {id: water, direction: in}
      - {id: wash, direction: in}
      - {id: residue, direction: out}
      - {id: liquor, direction: out}
      - {id: steam, direction: in, kind: energy}
  - id: ELY
    title: Electrolytic oxidation (rectifiers and cells)
    class: ReactingChemicals
    ports:
      - {id: feed, direction: in}
      - {id: liquor, direction: out}
      - {id: h2, direction: out}
      - {id: o2, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
  - id: CRY
    title: Crystallisation, centrifuging and drying
    class: Crystallizing
    ports:
      - {id: in, direction: in}
      - {id: prod, direction: out}
      - {id: vap, direction: out}
      - {id: ml, direction: out}
      - {id: cw, direction: out, kind: energy}
      - {id: steam, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: KRC
    title: Mother-liquor split, KOH evaporation and purge
    class: Evaporating
    ports:
      - {id: ml, direction: in}
      - {id: leach, direction: out}
      - {id: purge, direction: out}
      - {id: conc, direction: out}
      - {id: cond, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}

steps:
  # D-004: KOH roasting of the ore with air; recycled KMnO4 reverts to manganate in the melt
  - id: R201
    block: OXD
    title: Roaster (indirectly fired rotary kiln, KOH melt with air)
    class: ReactingChemicals
    reactions: [REDKM, OX, SIL]
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: ore, direction: in, delegates: ore}
      - {id: koh, direction: in, delegates: koh}
      - {id: air, direction: in, delegates: air}
      - {id: conc, direction: in, delegates: conc}
      - {id: cake, direction: out, delegates: cake}
      - {id: gas, direction: out, delegates: gas}
      - {id: heat, direction: in, kind: energy, delegates: heat}
  # D-005: leach with recycled mother liquor, silicate removal with lime
  - id: M301
    block: LCH
    title: Leach and lime treatment tanks (steam-heated)
    class: ReactingChemicals
    reactions: [LIME]
    links: [{target: equipment, ref: M-301}]
    ports:
      - {id: cake, direction: in, delegates: cake}
      - {id: lime, direction: in, delegates: lime}
      - {id: ml, direction: in, delegates: ml}
      - {id: water, direction: in, delegates: water}
      - {id: out, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
  - id: F301
    block: LCH
    title: Residue filter with condensate wash
    class: Filtering
    links: [{target: equipment, ref: F-301}]
    ports:
      - {id: in, direction: in}
      - {id: wash, direction: in, delegates: wash}
      - {id: residue, direction: out, delegates: residue}
      - {id: filtrate, direction: out, delegates: liquor}
  # D-006: rectifiers and divided cells (process/cells.yaml)
  - id: T401
    block: ELY
    title: Transformer-rectifiers
    class: ProcessStep
    links: [{target: equipment, ref: T-401}]
    ports:
      - {id: ac, direction: in, kind: energy, delegates: power}
      - {id: dc, direction: out, kind: energy}
      - {id: loss, direction: out, kind: energy, delegates: cw1}
  - id: EL401
    block: ELY
    title: Manganate cells (cation-exchange membrane, 60 in series)
    class: ReactingChemicals
    reactions: [ELEC, WATER_SPLIT]
    links: [{target: equipment, ref: EL-401}]
    ports:
      - {id: feed, direction: in, delegates: feed}
      - {id: dc, direction: in, kind: energy}
      - {id: liquor, direction: out, delegates: liquor}
      - {id: h2, direction: out, delegates: h2}
      - {id: o2, direction: out, delegates: o2}
      - {id: heat, direction: out, kind: energy, delegates: cw2}
  # D-007: cooling crystallisation, centrifuge, steam dryer
  - id: X501
    block: CRY
    title: Cooling crystalliser (KMnO4)
    class: Crystallizing
    links: [{target: equipment, ref: X-501}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: C501
    block: CRY
    title: Crystal centrifuge
    class: SeparatingMechanically
    links: [{target: equipment, ref: C-501}]
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out}
      - {id: ml, direction: out, delegates: ml}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: D501
    block: CRY
    title: Steam-heated product dryer
    class: Drying
    links: [{target: equipment, ref: DR-501}]
    ports:
      - {id: in, direction: in}
      - {id: prod, direction: out, delegates: prod}
      - {id: vap, direction: out, delegates: vap}
      - {id: steam, direction: in, kind: energy, delegates: steam}
  # D-008: mother-liquor split and KOH evaporator
  - id: S601
    block: KRC
    title: Mother-liquor splitter
    class: SplittingMaterial
    ports:
      - {id: in, direction: in, delegates: ml}
      - {id: leach, direction: out, delegates: leach}
      - {id: evap, direction: out}
      - {id: purge, direction: out, delegates: purge}
  - id: E601
    block: KRC
    title: Double-effect KOH evaporator
    class: Evaporating
    links: [{target: equipment, ref: E-601}]
    ports:
      - {id: in, direction: in}
      - {id: conc, direction: out, delegates: conc}
      - {id: cond, direction: out, delegates: cond}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: cw, direction: out, kind: energy, delegates: cw}

