# Process Atlas manifest of potassium-permanganate-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: potassium-permanganate-1
title: Potassium permanganate from MnO2 ore by KOH roasting and electrolysis (1250 kg/h, concept)
summary: >-
  Technical-grade KMnO4 from manganese ore: KOH roasting with air to potassium manganate,
  leaching, electrolytic oxidation in divided cells, crystallisation and drying, with the KOH
  recycled by evaporation. Concept stage, assumed basis, preliminary gate-to-gate inventory.
description: |
  Dried, ground MnO2 ore is roasted with concentrated KOH (recycled from the evaporator plus
  50 wt% make-up) and air in an indirectly gas-fired kiln at about 523 K, giving a potassium
  manganate cake. The cake is leached with recycled mother liquor at 333 K; lime precipitates
  the dissolved silicate, and the residue (unreacted MnO2, gangue, calcium silicate) is
  filtered and washed with the evaporator condensate. The manganate liquor is oxidised to
  permanganate in divided cells (cation-exchange membrane, 2.5 V, 1000 A/m2); hydrogen leaves
  the cathodes. KMnO4 crystallises on cooling to 303 K, is centrifuged and steam-dried. Most of
  the mother liquor returns to the leach; a share is concentrated to 50 wt% KOH for the roaster
  and 3 % is purged. Overall 2 MnO2 + 2 KOH + O2 -> 2 KMnO4 + H2.

  All flows are concept estimates from an independent sequential balance
  (scripts/kmno4_balance.py) on assumed design parameters (roaster conversion, current
  efficiency, cell voltage, mother-liquor composition, purge), anchored where possible to
  patent ranges (US 5660712, US 5011672). No electrolyte speciation or solid-liquid
  equilibrium is calculated. See DESIGN.md for every assumption and gated step.
families: [inorganic-chemicals]
keywords: [potassium permanganate, KMnO4, potassium manganate, manganese dioxide, pyrolusite, KOH roasting, electrolytic oxidation, membrane cell, crystallisation, potassium hydroxide recovery]
facets:
  feedstock_basis: [mineral, electricity]
  product_classes: [chemicals]
  unit_operations: [reaction, electrolysis, crystallization, filtration, evaporation, drying]
  region: generic
# Honest claim: concept is the lowest level of the manifest; every design parameter is assumed.
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept BFD/PFD with closed mass, component and element balances (cheme validate, cheme
    process streams: 5 blocks, 10 steps, reactive balances by extents) and a closed Faraday,
    charge and energy balance of the cells (cheme process cell). All flows and compositions
    are specified values of an independent balance (scripts/kmno4_balance.py) on assumed design
    parameters; the current efficiency (0.85) has no open source and the cell voltage (2.5 V)
    is only bracketed by a patent range. No electrolyte speciation (core #364) and no
    multi-solute crystalliser (the core crystalliser models one solute, core #365); no property
    package covers the liquors, melts and solids, so the duties are a lumped script estimate.
    The gate-to-gate LCI is preliminary, with every background unmapped. `cheme maturity`
    evaluates the calculation maturity to none and warns that the concept claim exceeds the
    evidence (cheme.maturity-claim-exceeds): concept is kept only because the manifest schema
    has no lower level; read it as "below concept: sourced screening on assumed parameters".
    Independently reviewed once (reviews/2026-10-28-pfd-lci-review.md); not signed off.
chemistry:
  inputs:
    - {chemical: water, role: feedstock, inventory_key: "feed:PW", note: "Demineralised process water to the leach. Manganese ore, KOH and hydrated lime have no registry entries yet"}
    - {chemical: air, role: feedstock, inventory_key: "feed:AIR", note: "Roaster oxidant"}
  outputs:
    - {chemical: wastewater, role: waste, inventory_key: "product:PURGE", note: "Mother-liquor purge (KOH, manganate, permanganate) to effluent treatment, ~0.70 kg/kg. The main product (potassium permanganate) has no registry entry yet"}
    - {chemical: hydrogen, role: emission, inventory_key: "product:H2V", note: "Cathode hydrogen vented, ~8 g/kg; recovery as fuel is an open option"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "DC for the cells through rectifiers (0.55 kWh/kg AC) and auxiliaries"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "LP steam 450 kPa(a): KOH evaporator, leach heating, dryer (counted as heat, kWh)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "25/35 C (ASSUMED)"}
