# Tier 1 form, process-library#313 pilot without a flowsheet. Every amount is the formula of its parameters;
# core's validator re-checks each. Written from the EU NFM BREF (2017) and the 2006 IPCC Guidelines
# (facts in our own form).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: aluminium-prebake-electrolysis
title: Primary aluminium by Hall-Heroult electrolysis with prebaked anodes (point feed)
description: Per 1 t of liquid primary aluminium tapped from the pots, gate-to-gate, EU point-feed prebake
  (PFPB) smelters of the NFM BREF data collection. Alumina, net anode, aluminium fluoride and electricity
  as midpoints of sourced ranges; process CO2 and SO2 from the anode by an IPCC Tier 2 type mass balance;
  CF4 and C2F6 by the IPCC Tier 2 slope method with the BREF's anode effect performance.
basis: 1000 kg of liquid primary aluminium
boundary: 'gate-to-gate: potline electrolysis (cells, rectifiers, auxiliaries) and the dry alumina scrubber
  of the cell gases, up to the tapped liquid metal; prebaked anodes, alumina and aluminium fluoride bought
  in; anode plant and casthouse outside'
technology: point-feed prebake cells (PFPB, about 90 % of EU capacity in the BREF); Soederberg cells and
  the anode baking plant are not modelled
geography:
  description: EU smelters of the BREF data collection, with IPCC global default coefficients; no single site.
classification:
  isic: '2420'
system_boundary:
  included:
  - alumina, net anode consumption, aluminium fluoride, electricity
  - oxygen from air that burns the anode carbon beyond the electrolysis reaction
  - process CO2 and SO2 from the anode, CF4 and C2F6 from anode effects
  - gaseous fluoride, dust and NOx to air (stack and roof)
  - spent pot lining, wastewater
  excluded:
  - 'TODO anode production (green anode forming and baking, with its fuel, pitch volatiles and packing
    coke): a separate process; the anode is an input. The IPCC Tier 1 prebake factor includes baking CO2,
    this dataset does not'
  - 'TODO casthouse (holding, treatment and casting): fuel 300 to 2500 MJ/t, dross 10 to 50 kg/t (BREF
    Table 4.10), not part of the tapped-metal basis'
  - 'TODO fluorine balance: aluminium fluoride make-up and fluoride emissions are counted, but the fluoride
    leaving as excess bath (sold) and in the spent lining is not stated per t; aluminium fluoride and
    the fluoride flows stay outside the element balance'
  - 'TODO cathode and lining materials (carbon blocks, refractories, steel bars) replaced every 5 to 8 years:
    no input per t in the source; their waste is counted as spent pot lining'
  - 'TODO particulate fluoride (the total fluoride less the gaseous part, about 0.06 to 0.3 kg F/t): no
    separate flow, it is part of the dust'
  - 'TODO CO before re-oxidation and COS: the source accounts them as CO2 and SO2, so does this dataset'
  - 'TODO freshwater make-up: the source gives the discharge (about 1 m3/t) but no intake for the electrolysis'
  - 'TODO other site wastes (7 to 15 kg/t hazardous, 12 to 14 kg/t non-hazardous, BREF Table 4.19): whole
    smelter, not attributable to the potline alone'
  - 'PAH and tar: negligible for prebake electrolysis with bought-in anodes (BREF 4.2.3.2.4)'
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: RER
year: 2012
valid_until: 2017
time:
  start: 2005
  description: 'BREF inputs from an industry submission of 2008 (Table 4.9) and dust and SO2 ranges from one
    of 2012 (Table 4.13); the gaseous fluoride, NOx and anode effect figures are cited in the BREF from references
    of 1997 and 1998; IPCC coefficients from measurements up to March 2005. valid_until is the reference year
    + 5 (system-model section 6), so it has already lapsed.'
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation (spent pot lining and the alumina residual are wastes)'
