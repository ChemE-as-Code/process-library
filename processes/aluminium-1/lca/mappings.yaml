# aluminium-1's own exchange overrides for the Atlas LCI build (ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Alumina links to the Atlas producer alumina-1.
# The anode, aluminium fluoride, the alumina residual, spent pot lining and the dust stay reported
# gaps: the shared vocabulary has no entry for them and no Atlas process makes or treats them.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:alumina": {dataset: {path: processes/alumina-1/lca/dataset.yaml, product: "product:ALU"}, source: "the Atlas producer alumina-1, smelter-grade alumina (Bayer process); it is a concept design of another region, not the BREF smelters' supply"}
  "feed:anode":
    atlas: false
    source: "Prebaked carbon anode (calcined petroleum coke, coal-tar pitch, recycled butts); no anode plant in the library yet. Link one explicitly once it exists."
  "feed:aluminium-fluoride":
    atlas: false
    source: "Aluminium fluoride (bath make-up); no supplier in the library or the shared vocabulary yet."
