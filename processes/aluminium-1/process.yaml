# Process Atlas manifest. Schema: schemas/process.schema.json. A manifest-only process: its LCI
# dataset is lca/datasets/*.yaml, Tier 1 form, so maturity stays at concept
# (core's cheme.lci-tier-maturity). See README.md.
schema: cheme-as-code/process/v1
id: aluminium-1
title: Primary aluminium by Hall-Heroult electrolysis with point-feed prebaked anodes
summary: >-
  Sourced conceptual inventory per tonne of liquid primary aluminium: alumina, net anode, aluminium
  fluoride and electricity as midpoints of EU NFM BREF ranges; anode CO2 and SO2 by mass balance,
  CF4 and C2F6 by the IPCC 2006 Tier 2 slope method. Anodes bought in, no casthouse. No flowsheet;
  not reviewed.
families: [aluminium]
keywords: [aluminium, aluminum, primary aluminium, Hall-Heroult, electrolysis, smelter, prebake, PFPB, alumina, carbon anode, PFC, CF4, C2F6, anode effect]
facets: {feedstock_basis: [mineral, fossil, electricity], product_classes: [materials], unit_operations: [electrolysis], region: EU}
maturity: concept
validation: {status: unreviewed}
chemistry:
  inputs:
    - {chemical: aluminium-oxide, role: feedstock, inventory_key: "feed:alumina", note: "smelter-grade alumina; linked to alumina-1 (lca/mappings.yaml)"}
    - {chemical: prebaked-anode, role: feedstock, inventory_key: "feed:anode", note: "net consumption; the anode plant is not modelled"}
    - {chemical: aluminium-fluoride, role: feedstock, inventory_key: "feed:aluminium-fluoride", note: "bath make-up"}
    - {chemical: air, role: feedstock, note: "free; its O2 that burns the anode carbon beyond the electrolysis is feed:O2"}
  outputs:
    - {chemical: aluminium, role: main-product, inventory_key: "product:aluminium", note: "liquid metal tapped from the pots, before casting"}
    - {chemical: carbon-dioxide, role: emission, inventory_key: "emission:CO2", note: "process CO2 from the anode carbon"}
    - {chemical: sulfur-dioxide, role: emission, inventory_key: "emission:SO2", note: "from the anode sulfur, no wet scrubber"}
    - {chemical: wastewater, role: waste, inventory_key: "output:wastewater"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:electricity", note: "potline total AC, rectifier losses and auxiliaries included"}
basis: {capacity: "per tonne of liquid primary aluminium (the dataset's basis); no plant size"}
publication: {status: public, license: CC-BY-4.0}
references:
  - {title: "Cusano, G. et al. (2017) Best Available Techniques (BAT) Reference Document for the Non-Ferrous Metals Industries. JRC Science for Policy Report EUR 28648 EN, sections 4.1.3 and 4.2.3", doi: 10.2760/8224}
  - {title: "IPCC (2006) 2006 IPCC Guidelines for National Greenhouse Gas Inventories, Vol. 3 Industrial Processes and Product Use, ch. 4 Metal Industry Emissions, section 4.4 Primary aluminium production", url: "https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/3_Volume3/V3_4_Ch4_Metal_Industry.pdf"}
  - {title: "International Aluminium Institute (2022) Life Cycle Inventory (LCI) Data and Environmental Metrics for the Primary Aluminium Industry, 2019 data: Technology Coverage (prebake share; route choice only, no value used)", url: "https://international-aluminium.org/resource/2019-life-cycle-inventory-lci-data-and-environmental-metrics/"}
  - {title: "US DOE Industrial Technologies Program (2007) U.S. Energy Requirements for Aluminum Production: Historical Perspective, Theoretical Limits and Current Practices, section 5.2 (benchmark only)", url: "https://www.energy.gov/sites/prod/files/2013/11/f4/al_theoretical.pdf"}
repository: {url: "https://github.com/ChemE-as-Code/process-library", path: processes/aluminium-1, access: public}
