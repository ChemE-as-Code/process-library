# Tier 1 form, a manifest-only entry as process-library#317. Every amount is the formula of its parameters;
# core's validator re-checks each. Written from CN105001073A, the MIDDEN PET/PTA report and US EPA
# AP-42 6.11 (facts in our own form).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: pta-px-air-oxidation
title: Purified terephthalic acid by liquid-phase air oxidation of p-xylene and hydropurification
description: Per 1 t of purified terephthalic acid (PTA), gate-to-gate. p-Xylene is oxidised with air in acetic
  acid over a cobalt-manganese-bromide catalyst; the crude acid is hydrogenated over palladium and recrystallised
  from water. Feeds from a patent's figures for conventional plants, utilities from one EU plant's estimate, vent
  emissions from US EPA AP-42.
basis: 1000 kg of purified terephthalic acid
boundary: 'gate-to-gate: oxidation, crystallisation, filtration and drying of crude TPA, solvent and catalyst recovery,
  hydropurification, PTA crystallisation and drying, thermal oxidation of the vents; steam and power from outside'
technology: continuous liquid-phase air oxidation in acetic acid with Co/Mn/Br catalyst (Amoco, Mid-Century type)
  and catalytic hydropurification; the DMT route and oxygen-based oxidation are not modelled
geography:
  description: 'no single site: feeds of a Chinese 1.2 Mt/a plant, utilities of a Dutch plant, US emission factors'
classification:
  isic: '2011'
system_boundary:
  included:
  - p-xylene, acetic acid make-up, oxygen from air, demineralised water
  - electricity and steam (as heat delivered)
  - cobalt and manganese catalyst make-up
  - CO2 from burnt p-xylene and acetic acid; CO, VOC and dust after control
  - organic residue and effluent
  excluded:
  - 'TODO hydrogen for the hydropurification: no open per-tonne figure was found (stoichiometric for the 4-CBA alone
    it is well under 1 kg/t)'
  - 'TODO palladium-on-carbon purification catalyst: a precious metal, so never cut; not quantified in the sources
    read'
  - 'TODO bromine promoter (hydrobromic acid or sodium bromide) make-up and methyl bromide in the off-gas: the LVOC
    BREF names methyl bromide but gives no amount'
  - TODO support fuel of the thermal oxidiser and caustic for the off-gas scrubber
  - 'TODO organic load (COD, about 12.5 kg/t in the patent) of the effluent and the cobalt and manganese leaving
    with residue and effluent: carried only as the effluent mass'
  - cooling water (251 kg per kg PTA circulated at Indorama Rotterdam, MIDDEN Table 5); not part of the mass basis
  - 'heat recovered from the oxidation as steam and power: not credited (cut-off)'
  - n-propyl acetate or other entrainer make-up of the azeotropic dehydration
  - storage emissions, infrastructure, transport
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: included (oxidation catalyst); the purification catalyst is a TODO
  non_routine: excluded
location: GLO
year: 2016
valid_until: 2021
time:
  start: 2015
  description: The patent describes plants of about 2015, the utilities are for 2016 (MIDDEN), the emission factors
    date from 1983. valid_until is the reference year + 5 (system-model section 6), so it has already lapsed.
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation'
