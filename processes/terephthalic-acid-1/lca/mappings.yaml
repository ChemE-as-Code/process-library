# terephthalic-acid-1's own exchange overrides for the Atlas LCI build (ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. p-Xylene stays a reported gap: no Atlas
# process makes it yet, and the shared vocabulary has no entry.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:acetic-acid": {dataset: {path: processes/acetic-acid-1/lca/dataset.yaml, product: "product:HAC"}, source: "the Atlas producer acetic-acid-1, glacial acetic acid by methanol carbonylation, the dominant route of the solvent make-up"}
  "feed:steam": {use: steam-heat, source: "steam counted as heat delivered (kWh), as hda-1 does; the source states no pressure"}
  "feed:p-xylene":
    atlas: false
    source: "No Atlas producer of p-xylene on main. Link the aromatics complex explicitly once one exists."
