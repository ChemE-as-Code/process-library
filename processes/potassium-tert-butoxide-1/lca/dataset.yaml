id: potassium-tert-butoxide-from-potassium-and-dry-tert-butanol-by-semi-batch-alcohol-strip-and-vacuum-drying
title: Potassium tert-butoxide from potassium and dry tert-butanol by semi-batch, alcohol strip and vacuum
  drying
description: Unallocated foreground LCI of Potassium tert-butoxide from potassium and dry tert-butanol
  by semi-batch, alcohol strip and vacuum drying, case design, derived from the flowsheet by cheme assess
  lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Batch plant: molten potassium dosed over 3 h into 8.6 mol of dry tert-butanol per mol at
  348 K (semi-batch), the hydrogen vented as it forms through a vent condenser at 308 K to the flare;
  the alkoxide solution stripped at atmospheric pressure in a batch still down to the 1:1 solvate and
  the paste vacuum-dried at 433 K in a paddle dryer on MP steam; the alcohol recycled (0.5 % purged);
  the make-up, tert-butanol of the azeotrope grade, dried on a vapour-phase 3A molecular sieve; 831.6
  kg per batch, 1202 batches a year on a dedicated train'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:flare-combustion
  title: combustion emissions of R-101, DR-101
  direction: output
  reason: The hydrogen and the tert-butanol of S23 are burnt in the site flare, a waste treatment outside
    the plant's boundary (product:FLARE); the flare's own emissions (about 0.10 kg of fossil CO2 from
    the 0.042 kg of tert-butanol per kg product, the hydrogen's water, unburnt traces) belong to that
    treatment's dataset, not estimated here (D-012).
- key: emission-excluded:reactor-vent
  title: storage-tank emissions of R-101, C-101
  direction: output
  reason: R-101's vent (the hydrogen with the tert-butanol past E-104) is the flowsheet's S11 to the flare
    (product:FLARE); its filling and C-101's breathing go through the nitrogen blanket to the same vent
    header; not estimated beyond S11 (no P&ID yet, D-006, D-010).
- key: emission-excluded:tank-breathing
  title: storage-tank emissions of T-101, T-201
  direction: output
  reason: Breathing and filling losses of the make-up and recycle tanks go through the nitrogen blanket
    to the vent header and the flare; not estimated (no P&ID yet, D-010).
- key: emission-excluded:kotbu-sublimate
  title: equipment-leaks emissions of DR-101
  direction: output
  reason: 'Potassium tert-butoxide sublimes at 493 K at 0.13 kPa and 413 K at 0.001 kPa (Wikipedia): at
    the dryer''s 433 K its vapour pressure is about 0.004 kPa by Clausius-Clapeyron between those points,
    so up to about 0.4 % of the dryer''s vapour at its final 1 kPa; it condenses with the alcohol in E-201
    and returns in the recycle, not lost; not modelled (D-008).'
