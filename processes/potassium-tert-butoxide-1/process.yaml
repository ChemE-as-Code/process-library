  inputs:
    - {chemical: potassium, role: feedstock, inventory_key: "feed:K", note: "feed:K: technical potassium metal (merchant), 0.348 kg/kg KOtBu, melted and dosed; no library process makes it (proxy KCl + Na recorded, D-012)"}
    - {chemical: tert-butanol, role: feedstock, inventory_key: "feed:TBAF", note: "feed:TBAF: the tert-butanol of the azeotrope grade (tert-butanol-1, kg of alcohol contained), 0.734 kg/kg KOtBu; dried on site past the azeotrope (A-001)"}
    - {chemical: water, role: feedstock, inventory_key: "feed:TBAW", note: "feed:TBAW: the azeotrope grade's 11.76 wt% water, 0.098 kg/kg KOtBu, removed by the sieve unit"}
    - {chemical: nitrogen, role: feedstock, inventory_key: "consumable:nitrogen", note: "Nitrogen (asu-1) for inerting, blankets, the potassium's pressing, the dryer's bleed and the vent header's purge, 95.7 kg per batch, 0.115 kg/kg KOtBu (ASSUMED)"}
  outputs:
    - {chemical: potassium-tert-butoxide, role: main-product, inventory_key: "product:KOTBU", note: "Dried potassium tert-butoxide powder to packing under nitrogen; modelled 99.47 wt% KOtBu, 0.23 wt% KOH, 0.30 wt% tert-butanol, an upper bound on the assay (the metal's sodium, handling moisture and decomposition not modelled)"}
    - {chemical: wastewater, role: waste, inventory_key: "product:WW", note: "Sieve regeneration condensate, 0.104 kg/kg KOtBu, water with about 7 wt% tert-butanol, to wastewater treatment"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "0.325 kWh/kg KOtBu: agitators of R-101 and C-101, the paddle dryer's drive and vacuum pump, and the sieve's regeneration heater and blower (0.154 kWh) (ASSUMED)"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "1.188 kWh (4.28 MJ)/kg KOtBu of LP steam: the still's reboiler (0.714 kWh, the charge's heat-up and the metal included), the sieve's evaporator (0.223 kWh), R-101's warm-up, the potassium melter and tank heating"}
    - {chemical: steam, role: utility, inventory_key: "feed:MPS", note: "0.357 kWh (1.29 MJ)/kg KOtBu of MP steam to the paddle dryer at 433 K (cheme's dryer model, the vessel's metal each batch included)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "1.774 kWh/kg KOtBu removed by cooling water: the heat of reaction and R-101's vent condenser (R101's model), the still's condenser, the dryer's vapour condenser and product cooling, the recycle cooler and the sieve's condensers"}
