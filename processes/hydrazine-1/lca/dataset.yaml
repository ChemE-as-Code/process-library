id: hydrazine-hydrate-by-the-peroxide-pcuk-methyl-ethyl-ketazine-process
title: Hydrazine hydrate by the peroxide (PCUK, methyl ethyl ketazine) process
description: Unallocated foreground LCI of Hydrazine hydrate by the peroxide (PCUK, methyl ethyl ketazine)
  process, case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: ammonia oxidation by hydrogen peroxide in the presence of methyl ethyl ketone in an activated
  (acetamide/ammonium acetate, phosphate) working solution at 323 K, azine decantation and distillation,
  working-solution regeneration by evaporation at 453 K with ammonia recovery, azine hydrolysis by reactive
  distillation at about 900 kPa(a), hydrate concentration; 16 kt/a hydrazine hydrate (10.2 kt/a N2H4),
  concept design
