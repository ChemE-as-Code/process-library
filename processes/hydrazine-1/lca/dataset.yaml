    an estimate needs the P&ID component counts; to become an emission_estimates entry with the P&IDs
    (D-014)'
  source: D-014
- key: emission-excluded:storage-tanks
  title: storage-tank emissions of the plant
  direction: output
  reason: ammonia, peroxide, MEK and hydrazine hydrate tanks are outside the battery limit (design basis);
    their breathing losses belong to storage (D-014)
  source: design basis
- key: emission-excluded:waste-incineration
  title: combustion emissions of the plant
