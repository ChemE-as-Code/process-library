# hydrocracking-1's own exchange overrides for the Atlas LCI build (ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Hydrogen links hydrogen-1 and vacuum gas oil
# refinery-distillation-1 explicitly. H2S and the catalyst stay reported gaps: the shared vocabulary
# has no entry for them, and the H2S to sulfur-recovery-1 waits for the cut-off rule of acid gas.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:hydrogen": {dataset: {path: processes/hydrogen-1/lca/dataset.yaml, product: "product:H2"}, source: "the Atlas producer hydrogen-1, SMR hydrogen 99.9 mol% at 2.85 MPa; the REF BREF (section 8.1.3) names a hydrogen plant as the supplier of a hydrocracker. Chosen over catalytic-reforming-1, whose net gas is impure (counted as pure H2), another grade. Compression to the reactor pressure is not counted"}
  "feed:vacuum-gas-oil": {dataset: {path: processes/refinery-distillation-1/lca/datasets/atmospheric-residue-vacuum-distillation.yaml, product: "product:vacuum-gas-oil"}, source: "the Atlas producer refinery-distillation-1, vacuum gas oil (360 to 560 degC) of the vacuum unit, the untreated VGO this feed names; the dataset takes its feed sulfur (1.0 % w/w) from the same crude assay, so the link carries one crude"}
  "feed:natural-gas":
    atlas: false
    source: "Pipeline natural gas: the only Atlas producer of the slug methane is hda-1's fuel gas, which is not natural gas (as styrene-1)."
  "output:H2S":
    atlas: false
    source: "To amine treating and sulfur recovery. sulfur-recovery-1 takes H2S as a feed, but whether refinery acid gas is a burden-free residue under cut-off is not decided; link it once that rule is."
