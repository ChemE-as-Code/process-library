# Tier 1 form, process-library#313 pilot without a flowsheet. Every amount is the formula of its parameters;
# core's validator re-checks each. Written from the REF BREF and IPCC 2006 defaults (facts in our own form).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: hydrocracking-vgo-single-stage-recycle
title: Hydrocracking of vacuum gas oil, single-stage recycle
description: Per 1 t of hydrocracked products (LPG to diesel range, unsplit), gate-to-gate, from the EU REF
  BREF ranges. Fresh vacuum gas oil and hydrogen on a fixed-bed catalyst at high pressure, with recycle of
  the unconverted oil to 97 to 98 % conversion. The C1-C2 gas and the unconverted-oil bleed are co-products.
basis: 1000 kg of hydrocracked products (LPG to diesel range, unsplit)
boundary: 'gate-to-gate: feed heater, reactors, HP and LP separators, fractionation; hydrogen, fuel and power
  from outside; amine treating, sulfur recovery and sour water stripping outside'
technology: high-pressure fixed-bed hydrocracking (100 to 200 barg, 340 to 425 degC, REF BREF Table 2.9), single-stage
  with recycle of the unconverted oil; once-through, two-stage, mild and residue hydrocracking are not modelled
geography:
  description: EU refineries of the REF BREF; no single site.
classification:
  isic: '1920'
system_boundary:
  included:
  - fresh vacuum gas oil and hydrogen (chemical consumption)
  - fuel to the heaters and its combustion (CO2, H2O, CH4, N2O)
  - electricity
  - wash water and sour water
  - catalyst make-up and spent catalyst
  - co-products C1-C2 gas and unconverted-oil bleed; H2S to sulfur recovery
  excluded:
  - 'TODO steam produced, 30 to 300 kg/t of feed (REF BREF Table 3.66): an exported co-product under cut-off,
    but its pressure is not stated, so it has no energy content for allocation; leaving it out gives the products
    all the burden'
  - 'TODO cooling water, 10 to 300 m3/t at a 17 K rise (REF BREF Table 3.66): a 30-fold range; not counted,
    so the inventory is low by its pumping and fan power'
  - 'TODO hydrogen make-up beyond the chemical consumption (solution and purge losses): not in the source'
  - TODO feed nitrogen and the NH3 it forms (to the sour water); H2S and NH3 in the sour water; heater NOx,
    SOx, CO and particulates (REF BREF section 3.13.2 names them, no figure for hydrocracking); fugitive and
    vacuum-ejector VOC; catalyst regeneration off site
  - 'TODO the split of the product into LPG, naphtha, kerosene and diesel: not in the source'
  - compression of the hydrogen to reactor pressure beyond the unit's own electricity
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: included
  non_routine: excluded
location: RER
year: 1999
valid_until: 2004
time:
  start: 1991
  description: The REF BREF (2015) gives the utility figures from Sema, Sofres 1991 and VROM 1999 and the hydrogen
    figures from Meyers 1997 and VROM 1999. valid_until is the reference year + 5 (system-model section 6),
    so it has long lapsed.
modelling:
  principle: attributional
  multifunctionality: energy (LHV) allocation between the hydrocracked products, the C1-C2 gas and the unconverted
    oil (see allocation)
allocation:
  method: energy
  coproducts:
  - hydrocracked-products
  - fuel-gas
  - unconverted-oil
  source: 'lci/mappings.yaml allocation.hydrocracking-1 (rule physical-energy): the three co-products are fuels
    and fuel blendstocks, so energy content (LHV) is the physical relationship, docs/system-model.md section
    2, step 2. The LHVs are IPCC defaults per cut, and the main product''s is ASSUMED for an unsplit mix (parameters
    lhv_hcp, lhv_gas, lhv_uco).'
