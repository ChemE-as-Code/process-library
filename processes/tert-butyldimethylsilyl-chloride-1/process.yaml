  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, kinetics, heats, jackets,
# the cake and the still's VLE are assumed; the route, catalyst and charge ratios are sourced
# (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept batch PFD with closed mass, component and element balances (cheme validate, cheme
    process streams). The semi-batches R101 (with its vent, the vent's vapour and condenser) and
    R102, the filters, the dryer, the rectifying still and the solvent recycle (converged at its
    tear S29) are calculated by cheme process propagate from ASSUMED rate laws; there is no balance
    script. The duties are year averages: R101's, its vent condenser's, R102's and the still's
    reboiler and condenser from the models (energy_port), the dryer's from core's dryer model,
    R-101's warm-up from the recipe, the others by hand (DESIGN.md D-009). The recipe's year-average
    rate of the product agrees with the flowsheet (no cheme.recipe-basis finding); it sizes R-101
    (6.3 m3), R-102, F-101 (8 m3) and C-101 (10 m3), and both reactors' jacket checks pass. Thermal
    screening (cheme process reactor-hazards): R101 dT_ad 202.5 K, accumulation 2.21 %, MTSR
    317.7 K; R102 dT_ad 91.1 K, MTSR 309.3 K; the default MTT is tert-butyl chloride's boiling
    point 324.1 K, conservative against the liquor's bubble point (about 340 K); no criticality
    class without a TD24 from calorimetry. R-101's vent capacity, 100 m3/h ASSUMED, passes the
    base case's gas release at the MTSR (80.1 m3/h with the liquid's vapour) but not that of a
    slower reaction (k/10: 109.8 m3/h of C4 gases, the content boiling), which the dosing
    interlocks and separate emergency reliefs must meet (D-011). The low accumulation rests on the
    assumed kinetics; the k/10, k/100 and uninitiated cases are in DESIGN.md D-011, with water
    ingress (HCl from the chlorosilanes) and the hydrogen from quenching the salt (D-006).
    Preliminary gate-to-gate LCI with the per-batch nitrogen and sodium thiocyanate; THF linked
    to thf-1 and nitrogen to asu-1, the other backgrounds gaps (magnesium, tert-butyl chloride,
    dichlorodimethylsilane, n-hexane and sodium thiocyanate have no library producer; their
    proxies are named, not linked). cheme maturity reaches no level (assumed kinetics and
    separations); the claim `maturity: concept` is the lowest value of the schema, not an
    evidenced level. Not reviewed. Needs cheme-as-code 1.11.
