# Process Atlas manifest of tert-butyldimethylsilyl-chloride-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: tert-butyldimethylsilyl-chloride-1
title: tert-Butyldimethylsilyl chloride (TBSCl) by a batch Grignard route, filtration, solvent recycle, rectification (580 t/a)
summary: >-
  A batch plant: tert-butylmagnesium chloride from magnesium and tert-butyl chloride in
  THF/n-hexane (5 % dosed first and held for the initiation, isobutene and isobutane vented) is
  dosed into dichlorodimethylsilane with a thiocyanate catalyst; the salt is filtered and dried,
  the solvent recycled, TBSCl rectified and flaked. Concept stage, 721.9 kg every 9.86 h,
  screened, preliminary LCI.
description: |
  Magnesium turnings (1 mol per mol of halide) are charged with recycled THF and n-hexane into a
  6.3 m3 reactor under nitrogen and warmed to 313 K. tert-Butyl chloride is dosed in: 5 % in 15
  min, a 30 min hold until the Grignard reaction has started, then the rest over 2.5 h, the rate
  set by the brine jacket; the isobutene and isobutane of the side reaction leave by the vent
  through a brine vent condenser. The Grignard solution is then dosed over 3 h into
  dichlorodimethylsilane, a heel of recovered solvent and 0.8 mol% sodium thiocyanate in a second
  reactor at 301 K, the catalyst and its amount of US 5 068 386 A (Example 3, 78 % isolated), the
  order of addition of US 5 872 274 A. The magnesium chloride is filtered off in an agitated
  filter-dryer, washed and dried under vacuum; the filtrates are rectified at ambient pressure in
  a batch still with a 10-stage column: the solvent with the excess silane goes back to the next
  batch (2 % purged), the TBSCl cut (modelled 99.58 wt%, an upper bound) is condensed above its
  melting point (358 K) and flaked.

  The batch is modelled with cheme-as-code's semi-batch reactors (R101 with a vent, the vent's
  vapour and a condenser; magnesium a solid reactant), filters with Ruth's filtration time, a
  dryer, a rectifying batch still on Diwekar's shortcut, the solvent recycle converged at its
  tear and the batch recipe (cycle 9.86 h, 803 batches a year). The kinetics are ASSUMED: the
  Grignard formation on the HZDR's calorimetry of an aryl bromide in THF (270 kJ/mol). At the
  base rates the cooling-failure temperature is 317.7 K in the Grignard step (2.2 % of the halide
  accumulated) and 309.3 K in the silylation, below the halide's boiling point, 324.1 K; ten times
  slower, both exceed it and the Grignard step boils (345 K); a hundred times slower, 441 K. Yield
  74.6 % on tert-butyl chloride (12 % goes to isobutene and isobutane with as much of the Grignard
  reagent). See DESIGN.md for every assumption.
