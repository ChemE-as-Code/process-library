id: tert-butyldimethylsilyl-chloride-by-a-batch-grignard-route-with-filtration-solvent-recovery-and-batch-rectification
title: tert-Butyldimethylsilyl chloride by a batch Grignard route with filtration, solvent recovery and
  batch rectification
description: Unallocated foreground LCI of tert-Butyldimethylsilyl chloride by a batch Grignard route
  with filtration, solvent recovery and batch rectification, case design, derived from the flowsheet by
  cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Batch plant: magnesium turnings in recycled THF/n-hexane at 313 K, tert-butyl chloride dosed
  over 3.25 h (5 % for the initiation, a 30 min hold, the rest), isobutene and isobutane vented through
  a brine vent condenser; the Grignard solution dosed over 3 h into dichlorodimethylsilane with sodium
  thiocyanate (0.8 mol%) at 301 K in a second reactor; the salt filtered, washed and vacuum-dried in an
  agitated filter-dryer; the filtrates rectified at ambient pressure (10 stages, reflux 2), the solvent
  with the excess silane recycled (2 % purged), the product cut flaked; 721.9 kg per batch, 803.3 batches
  a year on a dedicated train'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:oxidiser-combustion
  title: combustion emissions of R-101, F-101
  direction: output
  reason: The isobutene, isobutane, solvent and chlorosilane vapour of S31 are burnt in the site's thermal
    oxidiser, a waste treatment outside the plant's boundary (product:OXID); its CO2, HCl and silica belong
    to that treatment's dataset, not estimated here (D-012).
- key: emission-excluded:reactor-vents
  title: storage-tank emissions of R-101, R-102
  direction: output
  reason: R-101's vent (the isobutene and isobutane with the vapour past E-103) is the flowsheet's S8
    to the oxidiser (product:OXID); R-102 forms no gas, and its filling and emptying, like R-101's, go
    through the nitrogen blanket to the same vent header; not estimated beyond S8 (no P&ID yet, D-008).
- key: emission-excluded:tank-breathing
  title: storage-tank emissions of T-201, T-301, C-101
  direction: output
  reason: Breathing and filling losses of the still feed and recycle tanks and of the still go through
    the nitrogen blanket to the vent header and the oxidiser; not estimated (no P&ID yet, D-014).
- key: emission-excluded:flaker-dust
  title: equipment-leaks emissions of E-102
  direction: output
  reason: TBSCl vapour and dust at the enclosed flaker under nitrogen and at packing (3.4 kPa for the
    subcooled liquid at 308 K on its ASSUMED vapour-pressure line, less over the solid, D-007) are not
    estimated; the enclosure's nitrogen goes to the vent header.
