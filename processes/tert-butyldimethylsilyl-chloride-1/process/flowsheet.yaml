# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# tert-Butyldimethylsilyl chloride (TBSCl) by the Grignard route of US 5 068 386 A (DESIGN.md
# D-001), a batch plant: magnesium turnings in THF and n-hexane (the recovered solvent and its
# make-up) are warmed to 313 K in R-101; tert-butyl chloride is dosed into them (5 % first and a
# hold for the initiation, then the rest), the isobutene and isobutane of the side reaction leave
# by the vent with the solvent's vapour through a brine vent condenser; the Grignard solution is
# then dosed into R-102, where dichlorodimethylsilane, a heel of recovered solvent and sodium
# thiocyanate are charged (the catalyst of US 5 068 386 A, the order of addition of
# US 5 872 274 A, DESIGN.md D-004). The
# slurry is filtered in the agitated filter-dryer F-101, the cake reslurried in recovered
# solvent, filtered again and dried under vacuum; the filtrates go to the batch still C-101 with
# its column, which distils the solvent with the excess silane back to the recycle and then the
# product cut, condensed above TBSCl's melting point and flaked. The recovered solvent is
# recycled to the next charge and the cake wash (a recycle converged at its tear).
# The flows are the year averages of the batch recipe (process/recipe.yaml, `cheme process
# recipe`, D-003).
# Where the values come from:
# - feeds, temperatures, pressures, ratios: design basis and D-002..D-008, ASSUMED; the feeds are
#   scaled by hand to the recipe's batch (every outlet scales with them);
# - R101 and R102: cheme's semi-batch model (core ADR 0050), R101 with its vent, the vent's
#   vapour and its condenser (ADRs 0054, 0062), from the ASSUMED rate laws (D-005);
# - F101, F102: specified filters with Ruth's filtration time (core ADR 0057, D-006);
# - D101: core's dryer (ADR 0057, D-006);
# - ST101: cheme's batch still with a column on the shortcut (ADRs 0055, 0061, 0063), Raoult's
#   law with the NIST Antoine lines and TBSCl's ASSUMED line (D-007);
# - E101, E102, E201, E301 (pass-through), M101, M102, M103, M201, M301, M401 (mixers), SP201,
#   SP301, SP302 (splitters): `cheme process propagate --fill`; the recycle converges at its
#   tear S29 (D-014); the mixers' temperatures are given, from their inlets (D-009);
# - the duties: R101's Q1 and its vent condenser's Q2, R102's Q3, the still's reboiler Q5 and
#   condenser Q6 are written by `cheme process propagate --fill` from the models (core ADRs 0059,
#   0061, 0062, 0063); the dryer's Q8 is core's dryer model (`cheme process crystallizers`) and
#   R-101's warm-up Q4 the recipe's heat (`cheme process recipe`), copied at their precision;
#   the others are hand arithmetic from the stream table, given as ASSUMED with the arithmetic
#   in the source (D-009).
schema: cheme/process/v1
kind: flowsheet
title: tert-Butyldimethylsilyl chloride by a batch Grignard route with filtration, solvent recovery and batch rectification
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: TBSCl flakes, year averages of the batches in 7920 h on a dedicated train (D-002, D-003)", default: true}
tolerance: {abs: 0.05, rel: 0.002}   # balances: |in - out| <= abs + rel * max(in, out), kg/h
# The solvent loop (R-101, F-101, C-101, the recycle tank T-301) is torn at the recycle S29 and
# converged by `cheme process propagate` (Wegstein, core ADR 0060).
tears:
  - stream: S29
    initial: {flow: 474.2, unit: kg/h, basis: mass_fraction, composition: {THF: 0.7505, HEX: 0.1937, TBUCL: 0.0001, ME2SICL2: 0.0163, TBSCL: 0.0394}}
convergence: {method: wegstein, max_iterations: 1000, tolerance: {abs: 1.0e-5, rel: 1.0e-8}}

feeds:
  - {id: MGF, title: Magnesium turnings (merchant), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: THFF, title: "Tetrahydrofuran make-up, dry (thf-1)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: HEXF, title: "n-Hexane make-up, dry (merchant)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: TBUCLF, title: "tert-Butyl chloride (merchant)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: SILF, title: "Dichlorodimethylsilane (merchant)", category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: r102, direction: out, kind: energy}
      - {id: d101, direction: out, kind: energy}
      - {id: e102, direction: out, kind: energy}
  - id: LPS
    title: "LP steam 350 kPa(a) (the hot-water loops of R-101 and F-101, tracing of the product's receiver and lines)"
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 350, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 412.0, provenance: given, source: "saturation at 350 kPa(a): 412.0 K (IAPWS-IF97)"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: e101, direction: out, kind: energy}
      - {id: d101, direction: out, kind: energy}
      - {id: trace, direction: out, kind: energy}
  - id: MPS
    title: "MP steam 1000 kPa(a) (the still C-101)"
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1000, provenance: assumed, source: "design basis (D-007, D-009)"}
      supply_temperature: {value: 453.0, provenance: given, source: "saturation at 1000 kPa(a): 453.0 K (IAPWS-IF97)"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: st101, direction: out, kind: energy}
products:
  - {id: TBSCLP, title: "tert-Butyldimethylsilyl chloride flakes to packing under nitrogen", category: product, ports: [{id: in, direction: in}]}
  - {id: CAKE, title: "Dried salt cake (MgCl2, excess magnesium) to quench and hazardous-waste treatment", category: solid_waste, ports: [{id: in, direction: in}]}
  - {id: RESID, title: Still residue to incineration, category: solid_waste, ports: [{id: in, direction: in}]}
  - {id: WSOLV, title: Solvent purge to solvent incineration, category: solid_waste, ports: [{id: in, direction: in}]}
  - {id: OXID, title: "Vent gas (isobutene, isobutane, solvent vapour) to the thermal oxidiser", category: off_gas, ports: [{id: in, direction: in}]}
  - id: BRINE
    title: "Chilled brine return (the jackets of R-101 and R-102 with R-102's coil, their agitators' heat, R-101's vent condenser, the dryer's vapour condenser)"
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 263.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 268.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: r101v, direction: in, kind: energy}
      - {id: r102, direction: in, kind: energy}
      - {id: r101a, direction: in, kind: energy}
      - {id: r102a, direction: in, kind: energy}
      - {id: e201, direction: in, kind: energy}
  - id: TW
    title: "Tempered-water return (C-101's condenser: 303/313 K for the recovered cut, 368/373 K for the product cut)"
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 303.15, provenance: assumed, source: "design basis (D-007, D-009): the closed loop's cold supply for the recovered cut; for the product cut it is switched to its hot supply, 368.15 K, 10 K above TBSCl's melting point (358.1 K, D-007), so that no product freezes on the condenser; the loop is cooled by the site's cooling water"}
      return_temperature: {value: 313.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: st101, direction: in, kind: energy}
  - id: CW
    title: Cooling water return (the flaker and the recovered-solvent cooler)
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: e102, direction: in, kind: energy}
      - {id: e301, direction: in, kind: energy}

blocks:
  - id: REACT
    title: Grignard formation (R-101) and silylation (R-102)
    class: ReactingChemicals
    ports:
      - {id: mg, direction: in}
      - {id: thf, direction: in}
      - {id: hex, direction: in}
      - {id: rec, direction: in}
      - {id: heel, direction: in}
      - {id: tbucl, direction: in}
      - {id: sil, direction: in}
      - {id: slurry, direction: out}
      - {id: vent, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: brine, direction: out, kind: energy}
      - {id: brinev, direction: out, kind: energy}
      - {id: brine2, direction: out, kind: energy}
      - {id: brinea, direction: out, kind: energy}
      - {id: brine2a, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: power2, direction: in, kind: energy}
  - id: FILT
    title: Filtration, reslurry wash and vacuum drying of the salt (F-101)
    class: Filtering
    ports:
      - {id: in, direction: in}
      - {id: wash, direction: in}
      - {id: filtrate, direction: out}
      - {id: wfiltrate, direction: out}
      - {id: cake, direction: out}
      - {id: cond, direction: out}
      - {id: loss, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: brine, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: DIST
    title: Batch rectification (C-101) and flaking (E-102)
    class: Distilling
    ports:
      - {id: filtrate, direction: in}
      - {id: wfiltrate, direction: in}
      - {id: recovered, direction: out}
      - {id: product, direction: out}
      - {id: residue, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: tw, direction: out, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: trace, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: RECOV
    title: Solvent recycle (T-301), purge and the vent header
    class: Mixing
    ports:
      - {id: dist, direction: in}
      - {id: dcond, direction: in}
      - {id: rec, direction: out}
      - {id: wash, direction: out}
      - {id: heel, direction: out}
      - {id: purge, direction: out}
      - {id: vent, direction: in}
      - {id: loss, direction: in}
      - {id: oxid, direction: out}
      - {id: cw, direction: out, kind: energy}

steps:
  - id: M101
    block: REACT
    title: R-101 charge (magnesium, recycled solvent and make-up)
    class: Mixing
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: mg, direction: in, delegates: mg}
      - {id: thf, direction: in, delegates: thf}
      - {id: hex, direction: in, delegates: hex}
      - {id: rec, direction: in, delegates: rec}
      - {id: out, direction: out}
  - id: E101
    block: REACT
    title: Charge warmed to 313 K (R-101 jacket on hot water)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: steam}
  - id: R101
    block: REACT
    title: Grignard step (tert-butyl chloride dosed into magnesium at 313 K, C4 gases vented)
    class: ReactingChemicals
    reactions: [GRIG, DISP]
    reactor: semibatch
    batch:
      dosing:
        - {stream: S4, profile: [[900, 0.05], [1800, 0.0], [9000, 0.95]]}
      vent:
        stream: S8
        components: [IB, IBA]
        vapour: {components: [THF, HEX, TBUCL, ME2SICL2, TBSCL], source: "D-008: the C4 gases leave the liquid saturated with its volatile components at 313.15 K and 101.325 kPa(a) (Raoult, an ideal liquid, materials.yaml's Antoine lines; the dissolved Grignard reagent counted in the liquid)"}
        condenser: {temperature: 268.15, returns: vessel, energy_port: qv, provenance: assumed, source: "R-101's vent condenser E-103 on chilled brine 263/268 K, the gas out at 268.15 K (D-008): above the freezing points of every condensate it takes (tert-butyl chloride 247 K, dichlorodimethylsilane 199 K, THF 165 K, n-hexane 178 K, NIST WebBook); the little TBSCl the recycle brings stays dissolved in the condensing solvent; the condensate runs back into R-101"}
      target: {key: TBUCL, conversion: 0.999}
      heat: isothermal
      provenance: assumed
      source: "5 % of the tert-butyl chloride in 15 min, a 30 min hold for the initiation, the rest over 2.5 h, within R-101's jacket (D-004, D-010); post-reaction at 313 K to 0.999 conversion of the halide (D-005); the C4 gases leave as they form (D-008)"
    energy_port: q
    hazard:
      vent_capacity: 100.0
      provenance: assumed
      source: "R-101's vent line through its vent condenser E-103 to the thermal oxidiser's header, sized for about three times the normal peak of the isobutene and isobutane past E-103 (34.0 m3/h at 268 K, `cheme process recipe`) so that it also passes a cooling failure at the base rate with the liquid's vapour (80.1 m3/h at the MTSR); 100 m3/h, ASSUMED (D-011)"
    links: [{target: equipment, ref: R-101}, {target: equipment, ref: E-103}]
    ports:
      - {id: charge, direction: in}
      - {id: dose, direction: in, delegates: tbucl}
      - {id: out, direction: out}
      - {id: gas, direction: out, delegates: vent}
      - {id: q, direction: out, kind: energy, delegates: brine}
      - {id: qv, direction: out, kind: energy, delegates: brinev}
      - {id: qa, direction: out, kind: energy, delegates: brinea}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M103
    block: REACT
    title: R-102 charge (dichlorodimethylsilane and a heel of recovered solvent)
    class: Mixing
    links: [{target: equipment, ref: R-102}]
    ports:
      - {id: sil, direction: in, delegates: sil}
      - {id: heel, direction: in, delegates: heel}
      - {id: out, direction: out}
  - id: R102
    block: REACT
    title: Silylation in R-102 (the Grignard solution dosed into dichlorodimethylsilane at 301 K, sodium thiocyanate catalyst)
    class: ReactingChemicals
    reactions: [SIL]
    reactor: semibatch
    batch:
      dosing:
        - {stream: S7, time: 10800}
      target: {key: TBUMGCL, conversion: 0.999}
      heat: isothermal
      provenance: assumed
      source: "reverse addition (D-004): the dichlorodimethylsilane with a heel of recovered solvent charged and 0.8 mol% sodium thiocyanate on the tert-butyl chloride added (the catalyst and amount of US 5 068 386 A, Example 3; an LCA consumable, not a component), the Grignard solution from R-101 dosed at a constant rate over 3 h, the order of US 5 872 274 A, Examples 11-16, so that the silane is not set off all at once when the catalyst is in, within R-102's jacket (D-004, D-010); isothermal at the 301.3 K the charge mixes to (D-005), the post-reaction to 0.999 conversion of the Grignard reagent in place of the patent's 3 h at reflux"
    energy_port: q
    links: [{target: equipment, ref: R-102}]
    ports:
      - {id: charge, direction: in}
      - {id: dose, direction: in}
      - {id: out, direction: out, delegates: slurry}
      - {id: q, direction: out, kind: energy, delegates: brine2}
      - {id: qa, direction: out, kind: energy, delegates: brine2a}
      - {id: power, direction: in, kind: energy, delegates: power2}
  - id: F101
    block: FILT
    title: Filtration of the reaction slurry (filter-dryer)
    class: Filtering
    solid_separation:
      solid_recovery: 0.998
      cake_liquid: {value: 0.5, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "agitated filter-dryer under nitrogen, 0.5 kg of liquor per kg of salt in the cake, 0.2 % of the fine salt through the cloth (D-006)"
      filtration:
        specific_cake_resistance: 2.0e+10
        medium_resistance: 1.0e+10
        pressure_difference: 200
        viscosity: 0.6
        filtrate_density: 830
        provenance: assumed
        source: "ASSUMED (D-006): a fine, solvated salt, a cloth medium, 200 kPa of nitrogen on the cake; the liquor THF/n-hexane at 313 K (about 0.4 mPa s for the solvents, raised for the dissolved product) and about 0.83 g/cm3"
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out, delegates: filtrate}
  - id: M102
    block: FILT
    title: Reslurry wash of the cake with recovered solvent (filter-dryer)
    class: Mixing
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: cake, direction: in}
      - {id: wash, direction: in, delegates: wash}
      - {id: out, direction: out}
  - id: F102
    block: FILT
    title: Filtration of the wash (filter-dryer)
    class: Filtering
    solid_separation:
      solid_recovery: 0.999
      cake_liquid: {value: 0.5, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "as F101 (D-006)"
      filtration:
        specific_cake_resistance: 2.0e+10
        medium_resistance: 1.0e+10
        pressure_difference: 200
        viscosity: 0.5
        filtrate_density: 790
        provenance: assumed
        source: "as F101; the wash, mostly solvent (D-006)"
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out, delegates: wfiltrate}
  - id: D101
    block: FILT
    title: Vacuum drying of the salt cake at 343 K (filter-dryer)
    class: Drying
    dryer:
      volatiles: [THF, HEX, TBUCL, ME2SICL2, TBSCL]
      residual_moisture: {value: 0.02, basis: mass_fraction, provenance: assumed, source: "2 wt% solvent left in the dried salt, ASSUMED (D-006): the THF the MgCl2 solvate holds is not modelled"}
      temperature: 343.15
      energy:
        heat_capacity: 1.15
        inlet_temperature: 302.4
        latent_heat: {THF: 425.0, HEX: 350.0, TBUCL: 275.0, ME2SICL2: 230.0, TBSCL: 246.0}
        vessel_heat_capacity: 4000
        efficiency: 0.7
        port: steam
        provenance: assumed
        source: "ASSUMED (D-006, D-009): the wet cake enters at the reslurried cake's 302.4 K (S12); the wet cake, the salt (0.75 kJ/(kg K)) with 0.5 kg of liquor (about 1.95 kJ/(kg K)) per kg, 1.15 kJ/(kg K); latent heats at 343 K from thermo 0.6.1 (SRC-7): THF 30.6, n-hexane 30.2, tert-butyl chloride 25.5, Me2SiCl2 29.6 and TBSCl 37.1 kJ/mol; the filter-dryer's steel, about 8 t at 0.5 kJ/(kg K), heated each batch from the cake's temperature; 70 % of the heat to the cake"
      drying_rate: {value: 4.0, provenance: assumed, source: "ASSUMED mean rate of an agitated vacuum filter-dryer drying a solvent-wet salt at 343 K with hot water at 353 K (D-006), as methyltriphenylphosphonium-bromide-1's"}
      cake_density: {value: 1100, provenance: assumed, source: "ASSUMED bulk density of the solvent-wet salt cake (D-006)"}
      outlets: {product: product, vapour: vapour}
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: product, direction: out, delegates: cake}
      - {id: vapour, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E201
    block: FILT
    title: Dryer vapour condensed at 268 K after the dry vacuum pump (E-201, brine)
    class: Cooling
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: brine}
  - id: SP201
    block: FILT
    title: Dryer condensate and the solvent the nitrogen bleed carries to the oxidiser
    class: SplittingMaterial
    split: {loss: 0.01}
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in}
      - {id: cond, direction: out, delegates: cond}
      - {id: loss, direction: out, delegates: loss}
  - id: M201
    block: DIST
    title: Filtrate and wash filtrate in the still feed tank T-201
    class: Mixing
    links: [{target: equipment, ref: T-201}]
    ports:
      - {id: filtrate, direction: in, delegates: filtrate}
      - {id: wfiltrate, direction: in, delegates: wfiltrate}
      - {id: out, direction: out}
  - id: ST101
    block: DIST
    title: Batch still with its column at 101 kPa(a) (C-101), the solvent and the product cut
    class: Distilling
    energy_port: steam
    still:
      pressure: 101.325
      volatility: {model: raoult, provenance: assumed, source: "an ideal liquid, the NIST Antoine lines and TBSCl's ASSUMED line (materials.yaml); no VLE data of the pairs found, ASSUMED (D-007)"}
      # IB and IBA are 0 in the filtrate (R101 vents them whole as they form) and TBUMGCL 0.001
      # of its charge; they are listed so that the still asks no vapour pressure of them
      nonvolatile: [MG, MGCL2, TBUMGCL, IB, IBA]
      boilup: {value: 250, unit: kW, provenance: assumed, source: "C-101's jacket and internal coil on MP steam 1000 kPa(a) (D-007, D-009); with the column (R + 1) moles boil up per mole distilled (core ADR 0061)"}
      heat_up: true
      condenser_port: cond
      column: {stages: 10, reflux: constant, ratio: 2.0, provenance: assumed, source: "a packed column of about 10 theoretical stages (the still included) at a reflux ratio of 2, ASSUMED (D-007): US 5 068 386 A distilled at ambient pressure without stating a column"}
      cuts:
        - {outlet: rec, end: {residue: {key: ME2SICL2, mole_fraction: 1.0e-3}}}
        - {outlet: product, end: {residue: {key: TBSCL, mole_fraction: 0.5}}}
      outlets: {residue: bottom}
      provenance: assumed
      source: "the solvent with the excess silane and the unreacted halide distilled to the recycle until dichlorodimethylsilane is 0.1 mol% (1000 ppm) of the still, then the product cut until TBSCl is half of the residue's moles, the rest the salt fines (D-007)"
    links: [{target: equipment, ref: C-101}, {target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in}
      - {id: rec, direction: out, delegates: recovered}
      - {id: product, direction: out}
      - {id: bottom, direction: out, delegates: residue}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: cond, direction: out, kind: energy, delegates: tw}
  - id: E102
    block: DIST
    title: "Product cut solidified and cooled to 308 K on the flaker (E-102)"
    class: Cooling
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: product}
      - {id: q, direction: out, kind: energy, delegates: cw}
      - {id: trace, direction: in, kind: energy, delegates: trace}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M301
    block: RECOV
    title: Recovered solvent (still cut and dryer condensate) in T-301
    class: Mixing
    links: [{target: equipment, ref: T-301}]
