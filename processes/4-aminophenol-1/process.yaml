  outputs:
    - {chemical: 4-aminophenol, role: main-product, inventory_key: "product:PAPP", note: "Dried 4-aminophenol, modelled 99.6 wt% with 0.20 wt% ammonium sulfate and 0.2 wt% water; the source isolated 99.1 % material"}
    - {chemical: aniline, role: co-product, inventory_key: "product:ANP", note: "Crude aniline, 93 wt% with water, 0.159 kg/kg; mass allocation, 13.7 % of the burdens (D-012)"}
    - {chemical: ammonium-sulfate, role: waste, inventory_key: "product:WW", note: "Ammonium sulfate liquor (about 14 wt%) with 4-aminophenol and aniline traces, the wash filtrate and the dryer's condensate, 11.2 kg/kg, to an ammonium sulfate recovery outside the boundary (ASSUMED, D-008)"}
    - {chemical: hydrogen, role: emission, inventory_key: "product:VENT", note: "Excess hydrogen purged with nitrogen to the vent stack, 0.18 g/kg"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "0.478 kWh/kg: R-101's gas-inducing agitator (SRC-1's lower end), the agitators of R-102, R-103 and K-101, the centrifuge, the dryer (ASSUMED)"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "5.86 kWh/kg of LP steam 350 kPa(a): the charge's heating, the stills' heat-ups and boil-up (core's still models), the water preheater E-105 and the dryer"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "7.38 kWh/kg removed by cooling water: the heat of hydrogenation (core's semi-batch) and R-101's cool-down, the stills' condensers and the distillates' cooling, the neutralisation, the dryer's condenser"}
    - {chemical: chilled-water, role: utility, inventory_key: "product:CHW", note: "1.07 kWh/kg removed by chilled water at 278 K: the crop and K-101's metal cooled to 283 K"}
