# Process Atlas manifest of 4-aminophenol-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: 4-aminophenol-1
title: 4-Aminophenol by batch hydrogenation of nitrobenzene in dilute sulfuric acid with the Bamberger rearrangement (1000 t/a)
summary: >-
  A batch plant on Mallinckrodt's route: nitrobenzene hydrogenated over Pt/C in dilute sulfuric
  acid with the Bamberger rearrangement in situ, stopped at 88 % so that the nitrobenzene heel
  keeps the catalyst; strip, ammonia neutralisation, aniline still, one crop. Concept stage,
  1209.4 kg every 9.578 h, thermal screening, preliminary LCI; the feed of paracetamol-1.
description: |
  Water, 98 % sulfuric acid, the recycled distillates and fresh nitrobenzene are charged hot to
  R-101 on the nitrobenzene layer kept from the last batch, which holds the 5 % Pt/C catalyst
  and a surfactant; hydrogen is dosed at 358 K and about 104 kPa(a) over 5.5 h until 0.88 of the
  nitrobenzene is reduced (US 3 383 416 A, Benner, and US 4 307 249 A, Mallinckrodt). The
  nitrobenzene is reduced to N-phenylhydroxylamine, which rearranges in the acid to
  4-aminophenol (the Bamberger rearrangement, 0.84 of the nitrobenzene) or is reduced on to
  aniline (0.16): C6H5NO2 + 2 H2 -> C6H7NO + H2O. The mass is cooled to 333 K and settles under
  nitrogen; the nitrobenzene layer with the catalyst stays for the next batch. The acid aqueous
  layer is stripped of 15 % of its water with the dissolved nitrobenzene (back to the next
  charge), neutralised with ammonia, and the aniline is distilled off with water at pH about 6
  while process water is fed at constant level, so that the liquor keeps its water; the aniline
  separates as crude aniline (0.159 kg per kg, a co-product), its saturated water going back to
  the next charge. After a carbon treatment at pH 6 the liquor is filtered hot, brought to pH
  7.2 and cooled to 283 K; the crystals are washed with cold water on a centrifuge and
  vacuum-dried: 99.6 wt% 4-aminophenol, 79.4 % of the fresh nitrobenzene (the source isolated
  73 to 78 %; the model takes the 5.5 % the source leaves unaccounted as 4-aminophenol, an upper
  bound); the ammonium sulfate liquor (11.2 kg per kg) goes to an ammonium sulfate recovery.

  The batch is modelled with cheme-as-code's semi-batch with a dosed gas (reactor: semibatch,
  core ADRs 0050, 0054, 0063), the phase split and the aniline separator as component
  separators, two batch stills on constant relative volatilities (ADR 0055), a conversion step
  for the neutralisation, a cooling crystallizer with the liquor's solutes as spectators and a
  reslurry wash (ADR 0056), the dryer (ADR 0057), the three recycles converged at tears (ADR
  0060), design specifications for the capacity, the charge's water, the hydrogen that gives
  0.88 conversion and the water fed to the aniline still (ADR 0070), the batch recipe (ADRs
  0051, 0052) and every model's own duty (ADR 0059); the heats the models leave out (sensible
  heats, vessels' metal) come from a balance script, so that every heat flow is on an energy
  stream. R-101 is the bottleneck (cycle 9.578 h, 826.9 batches a year, 25 m3); the rate laws
  are ASSUMED and calibrated to the source's aniline. The screening gives an
  MTSR of 358.6 K against the MTT of 373.1 K for the dosed hydrogen, but the charge holds the
  heat of 130 K of adiabatic rise: hydrogen fed on demand after a cooling failure is the design
  case for the interlocks (DESIGN.md D-011).
families: [nitrogen-organics]
keywords: [4-aminophenol, p-aminophenol, PAP, nitrobenzene, hydrogenation, Bamberger rearrangement, N-phenylhydroxylamine, platinum on carbon, sulfuric acid, aniline, ammonium sulfate, semi-batch, batch, gas dosing, catalyst heel, batch distillation, cooling crystallisation, centrifuge, vacuum drying, thermal screening, paracetamol intermediate, fine chemicals]
facets:
  feedstock_basis: [fossil, electricity, water]
  product_classes: [chemicals]
  unit_operations: [reaction, distillation, crystallization, filtration, drying]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, kinetics, the stills'
# volatilities, the crystallisation's salting-out and the centrifuge are assumed; ratios,
# conditions and the selectivity from the patents' examples (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept batch PFD with closed mass, component and element balances (cheme validate, cheme
    process streams: 3 blocks and 11 steps within tolerance; the heel, the strip distillate and
    the aniline-saturated water converged at the tears S20, S21 and S22; the capacity, the
    charge's water, the hydrogen and the water fed to the aniline still solved by the design
    specifications CAP, WAT, CONV and ANL). The semi-batch R101 (from its ASSUMED rate laws,
    hydrogen dosed over 5.5 h), the stills ST101 and ST102 (constant relative volatilities from
    the solubilities and vapour pressures of nitrobenzene and aniline in water, ASSUMED; ST102
    with water fed at constant level), the neutralisation N101, the crystallizer CR101 and the
    wash W101 (the solubility of 4-aminophenol in water from The Merck Index via PubChem, no
    salting-out ASSUMED) and the dryer are calculated by cheme process propagate, which writes
    every model's duty but the dryer's (from cheme process crystallizers with the recipe); the
    heats the models leave out (the charge's heating with the acid's dilution, the stills'
    heat-ups and the distillates' cooling, R-101's cool-down before the settling, the vessels'
    metal, the dryer's condenser) and R-101's agitator come from scripts/balance.py, checked by
    the library's check_balance_scripts (DESIGN.md D-009). The recipe's year-average rate of the
    product agrees with the flowsheet (no cheme.recipe-basis finding); it sizes R-101, R-102 and
    R-103 (25 m3 each) and D-101 (3.15 m3), checks R-101's jacket (350 of 451 kW) and times its
    cool-down to 333 K; the stills' boil-up (390 and 600 kW), their heat-ups, the
    neutralisation on R-102's jacket and K-101's cool-down are checked by hand. Thermal
    screening (cheme process reactor-hazards): R101 dT_ad 129.7 K over the charge's
    nitrobenzene, accumulation of the dosed hydrogen 0.37 %, MTSR 358.6 K against an MTT of
    373.1 K (water's boiling point); k/10 2.8 % and 361.8 K, k/100 14 % and 376.5 K (above the
    MTT, a design finding); no criticality class without a TD24; the hydrogen fed on demand is
    the governing case (D-011). Preliminary gate-to-gate LCI with mass allocation to the crude
    aniline, the catalyst, surfactant, carbon and nitrogen per batch; the sulfuric acid linked
    to sulfuric-acid-1, the hydrogen to hydrogen-1, the ammonia to ammonia-1 and the nitrogen
    to asu-1; the nitrobenzene and the other backgrounds gaps. cheme maturity reaches no level
    (assumed feeds, kinetics and separations); the claim `maturity: concept` is the lowest value
    of the schema, not an evidenced level. Not reviewed. Needs cheme-as-code 1.12.0.
