schema: cheme/equipment/v1
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes per batch from the recipe (process/recipe.yaml, D-003: 1073.2 kg every 8.5 h, 931.8
# batches a year) and the flowsheet's year averages; design pressures, temperatures and
# materials are not set yet (basic engineering); the materials named are usual choices for hot
# dilute sulfuric acid, to be confirmed (open input). All values ASSUMED.
equipment:
  - {tag: R-101, type: StirredTankReactor, service: "Hydrogenator: charge on the nitrobenzene heel with the Pt/C catalyst, hydrogen dosed at 358 K and about 104 kPa(a), settled and decanted",
     notes: "13.1 m3 of batch in 20 m3 (preferred size, 65 % full, D 2.77 m) as the recipe sizes it from R101's semi-batch model (core ADR 0052); glass-lined, gas-inducing agitator (P1 15 kW); jacket on cooling water: peak 300 kW against 410 kW the jacket removes at the charge's 24.9 m2 (cheme process recipe); hydrogen on flow control interlocked with the temperature, the agitator and the cooling water; nitrogen purge before and after the hydrogen; vented through a condenser to the vent stack (D-003, D-005, D-011)."}
  - {tag: T-101, type: Tank, service: "Recycle water tank: strip distillate and aniline-saturated water for the next charge",
     notes: "About 6.4 m3 per batch (S21 and S22 x 8.5 h); 10 m3, stainless steel, nitrogen-blanketed (D-006, D-008)."}
  - {tag: R-102, type: StirredTankReactor, service: "Strip still: water with the dissolved nitrobenzene stripped, neutralisation with ammonia",
     notes: "13.0 m3 of batch in 20 m3 (preferred size, 65 % full, cheme process recipe); glass-lined, jacket on LP steam (boil-up 390 kW: U 400 W/(m2 K) ASSUMED x 25 m2 x 39 K, checked by hand, L-4) and on cooling water for the neutralisation (Q4); ammonia sparged below the liquid (D-007, D-009)."}
  - {tag: E-102, type: HeatExchanger, service: "R-102's overhead condenser (water with nitrobenzene)",
     notes: "390 kW while R-102 boils, on cooling water; year average Q3C; the condensate to T-101 (D-009)."}
  - {tag: R-103, type: StirredTankReactor, service: "Aniline still: aniline distilled with water at pH about 6, carbon treatment at 371 K",
     notes: "11.2 m3 of batch in 16 m3 (preferred size, 70 % full, cheme process recipe); glass-lined, jacket on LP steam (boil-up 390 kW as R-102, L-4); 6.9 h of distillation and 8.4 h in all a batch, near the cycle (D-003, D-007)."}
  - {tag: E-104, type: HeatExchanger, service: "R-103's overhead condenser (water with aniline)",
     notes: "390 kW while R-103 boils, on cooling water; year average Q6; the condensate cooled to 298 K into V-102 (D-008, D-009)."}
  - {tag: V-102, type: Vessel, service: "Aniline separator: crude aniline layer and aniline-saturated water at 298 K",
     notes: "About 4.4 m3 of distillate a batch; 6 m3, stainless steel; the aniline layer to the crude aniline tank, the water to T-101 (D-008)."}
  - {tag: F-101, type: Filter, service: "Hot polish filter: the spent activated carbon off the liquor at 371 K",
     notes: "Candle or bag filter; the spent carbon (0.052 kg per kg of product, SRC-1) to incineration; not in the balance (lca/lca.yaml consumable, D-008)."}
  - {tag: K-101, type: Vessel, service: "Cooling crystalliser: first crop at 283 K under nitrogen",
     notes: "About 7.9 m3 of liquor a batch; 10 m3, glass-lined, jacket on chilled water (Q7 75.8 kW year average, 129 kW mean over its 5 h cool-down, D-003, D-009)."}
  - {tag: K-102, type: Vessel, service: "Vacuum evaporator-crystalliser: second crop from the mother liquor at 283 K",
     notes: "About 6.3 m3 of mother liquor a batch, 0.4 of its water evaporated under vacuum (Q8 144 kW year average, hot-water loop); 10 m3, glass-lined (D-008, D-009)."}
  - {tag: C-101, type: Centrifuge, service: "Vertical peeler centrifuge: both crops spun off, washed with cold water, spun dry",
     notes: "About three loads a batch (1.07 t of crystals), 4 h a batch; 99.5 % of the crystals to the cake, 0.12 kg of liquor per kg of crystals; drive 8 kW year average; nitrogen-inerted (D-008, D-009)."}
  - {tag: D-101, type: Dryer, service: "Conical vacuum dryer at 333 K under nitrogen",
     notes: "1.6 m3 of wet cake a batch in 3.15 m3 (preferred size, 51 % full), 6.0 m2 heated; drying 5.1 h at an ASSUMED 4 kg/(m2 h) (core's dryer model, the recipe); jacket on a hot-water loop from LP steam, 22.5 kW year average (Q9) (D-003, D-009)."}
  - {tag: E-103, type: HeatExchanger, service: "Dryer vacuum condenser",
     notes: "Condenses about 120 kg of water a batch to T-102; on cooling water; its duty is not counted (small, D-009)."}
  - {tag: T-102, type: Tank, service: "Wastewater collection: final mother liquor (ammonium sulfate), wash filtrate and condensates",
     notes: "About 7.3 m3 a batch to the site's wastewater treatment; 10 m3, stainless steel (D-008)."}
