  multifunctionality: 'unallocated multi-output dataset; default allocation mass: D-012 (agent proposal,
    for the LCA practitioner to confirm): the plant makes, per kg of 4-aminophenol, about 0.16 kg of crude
    aniline (93 wt%), a co-product of the same hydrogenation that an aniline plant purifies. The library
    hierarchy (docs/system-model.md) finds no physical relationship that splits the hydrogenation between
    the two (both come from the same charge in a fixed ratio set by the selectivity); neither is a fuel.
    No prices are sourced at the concept stage; aniline and technical 4-aminophenol are both intermediate
    aromatic amines, ASSUMED within a price ratio of 5, so mass allocation: 126.26 and 20.03 kg/h give
    0.863 and 0.137.'
