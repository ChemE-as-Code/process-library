id: 4-aminophenol-by-batch-hydrogenation-of-nitrobenzene-in-dilute-sulfuric-acid-bamberger-route
title: 4-Aminophenol by batch hydrogenation of nitrobenzene in dilute sulfuric acid (Bamberger route)
description: Unallocated foreground LCI of 4-Aminophenol by batch hydrogenation of nitrobenzene in dilute
  sulfuric acid (Bamberger route), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Batch plant: nitrobenzene hydrogenated on a recycled nitrobenzene heel holding 5 % Pt/C in
  dilute sulfuric acid with a surfactant at 358 K and about 104 kPa(a), hydrogen dosed over 5.5 h to 0.88
  conversion; the aqueous layer stripped, neutralised with ammonia, the aniline distilled off with water
  fed at constant level and separated as crude aniline; carbon-treated at pH 6, 4-aminophenol crystallised
  at 283 K, centrifuged, washed and vacuum-dried; 1209.4 kg per batch, 826.9 batches a year on a dedicated
  train'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:reactor-vent
  title: storage-tank emissions of R-101, R-102, R-103
  direction: output
  reason: 'No P&ID yet: the nitrogen purges of R-101 and the vents of R-102 and R-103 carry nitrobenzene,
    aniline and water vapour at 333 to 373 K to the vent stack (R-102''s and R-103''s past their condensers
    E-102 and E-104); not estimated (open for basic engineering, D-011).'
- key: emission-excluded:storage-breathing
  title: storage-tank emissions of T-101, T-102, V-102
  direction: output
  reason: The breathing of the recycle water, liquor and aniline separator tanks (aqueous nitrobenzene
    and aniline at about 298 K, nitrogen-blanketed) is not estimated (D-011).
- key: emission-excluded:dryer-vent
  title: equipment-leaks emissions of the plant
  direction: output
  reason: 4-Aminophenol dust and water vapour in the dryer's vacuum pump exhaust after E-103 are not estimated
    (D-008, D-011).
