  direction: output
  reason: 'No P&ID yet: the nitrogen purges of R-101, the vents of R-102 and R-103 and the vacuum pump
    exhaust of K-102 carry nitrobenzene, aniline and water vapour at 333 to 373 K through their condensers
    to the vent stack; not estimated (open for basic engineering, D-011).'
- key: emission-excluded:storage-breathing
  title: storage-tank emissions of T-101, T-102, V-102
  direction: output
  reason: The breathing of the recycle water, wastewater and aniline separator tanks (aqueous nitrobenzene
    and aniline at about 298 K, nitrogen-blanketed) is not estimated (D-011).
- key: emission-excluded:dryer-vent
  title: equipment-leaks emissions of the plant
  direction: output
  reason: 4-Aminophenol dust and water vapour in the dryer's vacuum pump exhaust after E-103 are not estimated
    (D-008, D-011).
