# 4-aminophenol-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# Linked here (DESIGN.md D-012): the sulfuric acid to sulfuric-acid-1, the hydrogen to
# hydrogen-1 (pinned, since the slug hydrogen alone would pick the first producer), the ammonia
# to ammonia-1, the nitrogen to asu-1, and the LP steam counted as heat delivered (kWh). The
# nitrobenzene stays a gap: no library process exports it (CONTRIBUTING, "Gaps").
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:ACIDF": {dataset: {path: processes/sulfuric-acid-1/lca/dataset.yaml, product: "product:ACID"}, source: "the Atlas producer sulfuric-acid-1, sulfuric acid 98.5 wt% to storage, counted by mass of the acid; the charge's 98 wt% acid (D-004)"}
  "feed:H2F": {dataset: {path: processes/hydrogen-1/lca/dataset.yaml, product: "product:H2"}, source: "the Atlas producer hydrogen-1, hydrogen 99.9 mol% at 2850 kPa(a), let down to R-101's 104 kPa(a) (D-004)"}
  "feed:NH3F": {dataset: {path: processes/ammonia-1/lca/dataset.yaml, product: "product:NH3"}, source: "the Atlas producer ammonia-1, anhydrous ammonia, evaporated into R-102's liquor (D-004)"}
  "consumable:nitrogen": {dataset: {path: processes/asu-1/lca/dataset.yaml, product: "product:GANP"}, source: "the Atlas producer asu-1, gaseous nitrogen to the battery limit (99.97 mol% N2, 9 bar(a)); the purges and blankets need only a few hundred kPa"}
  "feed:LPS": {use: steam-heat, source: "LP steam 350 kPa(a) to the jackets of R-101 and R-102, K-102's hot-water loop and the dryer (Q1, Q3, Q5, Q8, Q9), counted as heat delivered (kWh), D-009"}
