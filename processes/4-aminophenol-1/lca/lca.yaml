# Goal and scope of the 4-aminophenol-1 LCI. Schema: `cheme schema lca`. Outputs: `cheme assess
# lca --inventory --write` and `--coverage` (lca/inventory.csv, gaps.csv, dataset.yaml,
# manifest.json); never edit those by hand.
#
# Preliminary gate-to-gate foreground inventory (DESIGN.md D-012): every exchange of the batch
# plant with its amount per kg of dried 4-aminophenol, from the flowsheet's year averages of the
# recipe (D-003), every heat flow on an energy stream (D-009). Per batch: multiply by 1209.4 kg.
# The sulfuric acid, hydrogen, ammonia and nitrogen are linked to the library's producers
# (lca/mappings.yaml); the other backgrounds are left unmapped (`missing:` with the activity each
# should connect to): a gap, never zero, and no values from licensed databases.
schema: cheme/lca/v1
kind: lca
goal: >-
  Preliminary gate-to-gate life cycle inventory of 4-aminophenol made by the batch
  hydrogenation of nitrobenzene in dilute sulfuric acid over Pt/C with the Bamberger
  rearrangement in situ, at the concept stage: which raw materials, utilities and wastes the
  batch plant exchanges per kg of dried 4-aminophenol, as the foreground for a later
  cradle-to-gate study and the feed of paracetamol-1. No impact results: the nitrobenzene and
  most utilities are not mapped yet (D-012).
functional_unit: {product: PAPP, amount: 1, unit: kg, source: "1 kg of dried 4-aminophenol (modelled 99.6 wt%, technical grade for paracetamol) at the plant gate to packing, stream S26 (D-002, D-012)"}
# The boundary key stays cradle-to-gate so that the purchased inputs remain open gaps instead of
# being mapped free (the schema's gate-to-gate maps every feed free), as paracetamol-1 does.
boundary: cradle-to-gate
case: design
year: 2026
location: GLO
technology: "Batch plant: nitrobenzene hydrogenated on a recycled nitrobenzene heel holding 5 % Pt/C in dilute sulfuric acid with a surfactant at 358 K and about 104 kPa(a), hydrogen dosed over 5.5 h to 0.88 conversion; the aqueous layer stripped, neutralised with ammonia, the aniline distilled off with water fed at constant level and separated as crude aniline; carbon-treated at pH 6, 4-aminophenol crystallised at 283 K, centrifuged, washed and vacuum-dried; 1209.4 kg per batch, 826.9 batches a year on a dedicated train"
rights: "CC-BY-4.0: the ChemE-as-Code process library's own concept design (LICENSE-DATA)"
system_model: cutoff
allocation:
  method: mass
  coproducts: [PAPP, ANP]
  source: >-
    D-012 (agent proposal, for the LCA practitioner to confirm): the plant makes, per kg of
    4-aminophenol, about 0.16 kg of crude aniline (93 wt%), a co-product of the same
    hydrogenation that an aniline plant purifies. The library hierarchy (docs/system-model.md)
    finds no physical relationship that splits the hydrogenation between the two (both come
    from the same charge in a fixed ratio set by the selectivity); neither is a fuel. No prices
    are sourced at the concept stage; aniline and technical 4-aminophenol are both
    intermediate aromatic amines, ASSUMED within a price ratio of 5, so mass allocation:
    126.26 and 20.03 kg/h give 0.863 and 0.137.
  deviation: >-
    Mass allocation rests on the ASSUMED price ratio. The conservative bound is all burdens to
    the 4-aminophenol (the crude aniline free, about 16 % more per kg); economic allocation at
    sourced prices replaces it.
flows:
  # raw materials
  - key: feed:NBF
    missing: "not mapped yet (D-012); no library process exports nitrobenzene (aniline-1 buys it too). Connect to: nitrobenzene by the mixed-acid nitration of benzene (benzene, nitric acid from nitric-acid-1, sulfuric acid reconcentrated), at plant; a library nitrobenzene process would close it"
    source: "flowsheet stream S2 (D-004)"
  - key: feed:ACIDF
    missing: "linked to processes/sulfuric-acid-1 (lca/mappings.yaml): sulfuric acid 98.5 wt%"
    source: "flowsheet stream S3 (D-004)"
  - key: feed:H2F
    missing: "linked to processes/hydrogen-1 (lca/mappings.yaml): hydrogen 99.9 mol% by steam methane reforming with PSA"
    source: "flowsheet stream S5 (D-004)"
  - key: feed:NH3F
    missing: "linked to processes/ammonia-1 (lca/mappings.yaml): anhydrous ammonia"
    source: "flowsheet stream S10 (D-004)"
  - key: feed:PW
    missing: "not mapped yet (D-012); connect to: process water from the site water treatment"
    source: "flowsheet streams S1 (the charge's make-up, D-004) and S29 (the water fed to R-103 during the aniline distillation, D-007)"
  - key: feed:WASHW
    missing: "not mapped yet (D-012); connect to: process water from the site water treatment, chilled"
    source: "flowsheet stream S23 (D-008)"
  # utilities
  - key: feed:POWER
    missing: "not mapped yet (D-012); connect to: electricity, medium voltage, grid mix of the (undecided) site country"
    source: "flowsheet energy streams P1 (R-101's agitator, scripts/balance.py), P2 (R-102's agitator), P3 (centrifuge), P4 (dryer), P5 (R-103's agitator) and P6 (K-101's agitator), D-009"
  - key: feed:LPS
    missing: "linked as heat from steam (lca/mappings.yaml); connect to: steam in the chemical industry, 350 kPa(a), from a natural-gas-fired site boiler (e.g. processes/utility-steam-ng-boiler), per kWh of condensing heat"
    source: "flowsheet energy streams Q1 (R-101's charge heating), Q3 and Q11 (R-102's boil-up, core's batch still ST101, and its heat-up), Q5 and Q13 (R-103's boil-up, core's batch still ST102, its heat-up and the water preheater E-105) and Q9 (the dryer, core's dryer model); Q1, Q11 and Q13 from scripts/balance.py, D-009"
  - key: product:CW
    missing: "not mapped yet (D-012); connect to: heat rejected to a recirculating cooling-water system with cooling tower (processes/utility-cooling-tower), per kWh removed"
    source: "flowsheet energy streams Q2 (R-101's heat of hydrogenation, core's semi-batch model), Q10 (R-101's cool-down to 333 K), Q3C and Q12 (R-102's condenser E-102 and the distillate's subcooling), Q4 and Q17 (R-102's neutralisation, core's conversion step, and its metal), Q6 and Q14 (R-103's condenser E-104 and the distillate cooled for V-102) and Q15 (the dryer's condenser E-103); Q10, Q12, Q14, Q15 and Q17 from scripts/balance.py, D-009"
  - key: product:CHW
    missing: "not mapped yet (D-012); connect to: refrigeration at 278 K (chilled water) from an electric vapour-compression unit (e.g. processes/utility-chiller), per kWh of heat removed"
    source: "flowsheet energy streams Q7 (the crop cooled to 283 K, core's crystallizer model) and Q16 (K-101's metal, scripts/balance.py), D-009"
  # wastes and emission (the crude aniline S14 is the co-product of allocation:)
  - key: product:WW
    treatment: {kind: waste, route: "ammonium sulfate liquor (about 14 wt% ammonium sulfate, 0.5 wt% 4-aminophenol, 0.2 wt% aniline; about 43 kg/h of ammonium nitrogen): ASSUMED to an ammonium sulfate recovery by evaporative crystallisation outside the boundary, its condensate to biological treatment and its organic purge to incineration, as acrylonitrile-1's quench liquor; not to a biological plant directly, which would have to remove the nitrogen (D-008)"}
    missing: "not mapped yet (D-012); connect to: recovery of ammonium sulfate from a process liquor by evaporative crystallisation (no library process; processes/ammonium-sulfate-1 makes the product another way), per kg of liquor, about 0.85 kg of water evaporated and 0.14 kg of ammonium sulfate recovered per kg; or a dedicated treatment with nitrification and denitrification"
    source: "flowsheet stream S28 (D-008)"
  - key: product:VENT
    missing: "not mapped yet (D-012): the excess hydrogen (0.18 g per kg) purged with nitrogen to the vent stack, an emission of hydrogen to air"
    source: "flowsheet stream S8 (D-006)"
# What the batch plant uses per batch and the flowsheet does not carry (library ADR 0035, core
# ADR 0053), converted with the recipe's batches per year (process/recipe.yaml).
consumables:
  - id: activated-carbon
    title: Activated carbon for the decolourisation of the hot liquor in R-103
    unit: kg
    per_batch: 62.83
    source: "SRC-1 Example 1(A): 8 g of carbon on 154 g of isolated product, 8 / 154 x 1209.4 kg per batch = 62.83 kg, used once (D-008, D-012)"
    missing: "not mapped yet (D-012); connect to: activated carbon, powdered, from coal or wood by steam activation"
    disposal:
      kind: waste
      route: "spent carbon with its liquor to hazardous-waste incineration (D-008)"
      source: "the spent carbon off F-101, its mass as charged (D-008)"
      missing: "not mapped yet (D-012); connect to: incineration of spent activated carbon in a hazardous-waste incinerator (e.g. processes/waste-incineration-1), per kg"
  - id: catalyst-pt-c
    title: 5 % Pt/C catalyst make-up
    unit: kg
    per_batch: 0.557
    source: "SRC-1 Examples 1 to 4: 1.4 g of fresh 5 % Pt/C on 271 g of nitrobenzene, reused for five batches and then 0.4 g added; ASSUMED a make-up of 0.4 g per 5 batches of about 246 g of fresh nitrobenzene, 0.325 g per kg of fresh nitrobenzene x 1711.6 kg per batch (178.70 kg/h x 9.578 h) = 0.557 kg (D-004, D-012); the spent catalyst to a precious-metal refiner, not modelled"
    missing: "not mapped yet (D-012); connect to: platinum on activated carbon catalyst, 5 wt% Pt (platinum from primary production), with the platinum's recovery by a refiner"
  - id: surfactant
    title: Amine oxide surfactant (dimethyldodecylamine oxide)
    unit: kg
    per_batch: 3.7
    source: "SRC-2 Example 1: 2 mL of a 30 to 35 % amine oxide solution in 650 mL of water, about 1.0 g of active per kg of water, ASSUMED; x 12.2 t of water in the charge a batch (1272.6 kg/h x 9.578 h) = 12.2 kg, of which ASSUMED 70 % comes back with the recycled water: 3.7 kg make-up a batch (D-004, D-012)"
    missing: "not mapped yet (D-012); connect to: N,N-dimethyldodecylamine N-oxide (a fatty amine oxide surfactant)"
  - id: nitrogen
    title: Nitrogen for R-101's purges before and after the hydrogen, the blankets and the dryer's vacuum break
    unit: kg
    per_batch: 80.0
    source: "ASSUMED: R-101's gas space purged three times before and after the hydrogen (about 10 m3 of head space over the 15.2 m3 batch in 25 m3, 6 volume changes at about 1.2 kg/m3, 70 kg) and the dryer's vacuum break and blankets (10 kg) (D-011, D-012)"
    missing: "linked to processes/asu-1 (lca/mappings.yaml): gaseous nitrogen"
operation:
  hours_per_year: 7920
  life_years: 20
  source: "design basis operating_hours_per_year 7920 (ASSUMED, the recipe's hours); 20 a service life ASSUMED"
emission_exclusions:
  - {id: reactor-vent, method: storage-tank, equipment: [R-101, R-102, R-103], reason: "No P&ID yet: the nitrogen purges of R-101 and the vents of R-102 and R-103 carry nitrobenzene, aniline and water vapour at 333 to 373 K to the vent stack (R-102's and R-103's past their condensers E-102 and E-104); not estimated (open for basic engineering, D-011)."}
  - {id: storage-breathing, method: storage-tank, equipment: [T-101, T-102, V-102], reason: "The breathing of the recycle water, liquor and aniline separator tanks (aqueous nitrobenzene and aniline at about 298 K, nitrogen-blanketed) is not estimated (D-011)."}
  - {id: dryer-vent, method: equipment-leaks, reason: "4-Aminophenol dust and water vapour in the dryer's vacuum pump exhaust after E-103 are not estimated (D-008, D-011)."}
dataset:
  version: 0.1.0
  classification: {isic: "2011"}   # ISIC Rev.4 2011 Manufacture of basic chemicals
  modelling: {principle: attributional}
  geography: {description: "Generic fine-chemicals site with hydrogen, sulfuric acid and ammonia supply and an ammonium sulfate recovery, not chosen (GLO); one design case"}
  system_model: cutoff
  technology_level: current
  review: {type: none}
  data_generator: "ChemE-as-Code agent session (Claude Opus 5.5) for issue #506, unreviewed"
