# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# 4-Aminophenol by the hydrogenation of nitrobenzene in dilute sulfuric acid over Pt/C with the
# Bamberger rearrangement in situ (DESIGN.md D-001), a batch plant on the route of
# US 3 383 416 A (SRC-1) and US 4 307 249 A (SRC-2):
# - R-101 is charged hot with water, 98 % sulfuric acid (its heat of dilution warms the charge),
#   the recycled distillates and fresh nitrobenzene on the nitrobenzene heel that holds the
#   Pt/C catalyst (M101); hydrogen is dosed at 358 K and near atmospheric pressure (R101, a
#   semi-batch) until 0.88 of the nitrobenzene is reduced (SRC-1: stopped short so that the
#   unreacted nitrobenzene keeps the catalyst);
# - the mass settles under nitrogen: the nitrobenzene layer with the catalyst stays in R-101 for
#   the next batch (V101, the tear S20), the excess hydrogen is purged to the vent, the acid
#   aqueous layer goes to the work-up still R-102;
# - R-102 strips water with the dissolved nitrobenzene (ST101, the distillate back to the next
#   charge, tear S21; SRC-1) and the liquor is neutralised with ammonia (N101); in R-103 the
#   aniline is distilled off with water (ST102); the distillate settles in V-102 into crude aniline (a
#   co-product) and a water layer saturated with aniline, back to the next charge (tear S22);
# - after a carbon treatment (lca/lca.yaml, per batch) the liquor is cooled to 283 K in K-101 to
#   crystallise 4-aminophenol (CR101); the mother liquor is concentrated under vacuum for a
#   second crop (CR102, SRC-1); both crops are washed with cold water on the centrifuge C-101
#   (W101) and dried under vacuum (D101); the liquors go to wastewater treatment (M103).
# The flows are the year averages of the batch recipe (process/recipe.yaml, `cheme process
# recipe`, D-003).
# Where the values come from:
# - feeds, temperatures, pressures, ratios: design basis and D-002..D-009, ASSUMED or from
#   SRC-1 and SRC-2;
# - R101: cheme's semi-batch model (the ASSUMED rate laws of HYDP and HYDA, D-005), hydrogen
#   dosed and taken up, to 0.88 conversion of the nitrobenzene; V101, V102: component
#   separators with specified recoveries (D-006, D-008); ST101, ST102: cheme's batch still on
#   constant relative volatilities (D-007); N101: a conversion step (NEU); CR101, CR102, W101:
#   core's crystallizer with the liquor's other solutes as spectators and the solubility of
#   4-aminophenol in water (SRC-4, D-008); D101: core's dryer; M101, M103: mixers (all by
#   `cheme process propagate --fill`, the recycles converged at the tears S20, S21 and S22,
#   core ADR 0060);
# - the duties of R101 (Q2), ST101 (Q3, Q3C), N101 (Q4), ST102 (Q5, Q6), CR101 (Q7), CR102
#   (Q8) and D101 (Q9) are written by `cheme process propagate --fill` from the models (core
#   ADRs 0059, 0063); the charge's heating Q1 is a hand calculation in DESIGN.md D-009 (no
#   property package of core covers the acid's heat of dilution).
schema: cheme/process/v1
kind: flowsheet
title: 4-Aminophenol by batch hydrogenation of nitrobenzene in dilute sulfuric acid (Bamberger route)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: dried 4-aminophenol, year averages of the batch recipe in 7920 h (D-002, D-003)", default: true}
tolerance: {abs: 0.05, rel: 0.002}   # balances: |in - out| <= abs + rel * max(in, out), kg/h
# Three recycles (core ADR 0060): the nitrobenzene heel with the catalyst (S20), the strip's
# distillate with the dissolved nitrobenzene (S21) and the aniline-saturated water from V-102
# (S22), each back into the next charge (D-006, D-007). Their tolerance is far tighter than the
# balances'.
tears:
  - stream: S20
    initial: {flow: 17.0, unit: kg/h, basis: mass_fraction, composition: {NB: 1.0}}
  - stream: S21
    initial: {flow: 234.0, unit: kg/h, basis: mass_fraction, composition: {H2O: 0.97, NB: 0.03}}
  - stream: S22
    initial: {flow: 450.0, unit: kg/h, basis: mass_fraction, composition: {H2O: 0.965, AN: 0.035}}
convergence: {method: wegstein, max_iterations: 500, tolerance: {abs: 1.0e-6, rel: 1.0e-8}}
# Design specifications (core ADR 0070), solved with the tears: the fresh nitrobenzene that
# makes the capacity, with the other charge feeds in fixed ratios to it (D-002, D-004), and the
# hydrogen that reduces 0.88 of the nitrobenzene charged (SRC-1; D-005).
specs:
  - id: CAP
    vary: {stream: S2, initial: 178.0, low: 50.0, high: 500.0, with: {S3: 0.85843, S10: 0.29208, S23: 0.73}}
    target: {stream: S26, quantity: annual, value: 1000, unit: t, hours: 7920}
    provenance: assumed
    source: "D-002: 1000 t/a of dried 4-aminophenol in 7920 h; the ratios: process water, 98 % acid, ammonia (2 mol per mol of the acid) and the cake wash per kg of fresh nitrobenzene (D-004, D-008)"
  - id: WAT
    vary: {stream: S1, initial: 600.0, low: 0.0, high: 3000.0}
    target: {stream: S4, component: H2O, quantity: ratio, per: {stream: S4, component: NB}, basis: mass, value: 6.27}
    provenance: given
    source: "SRC-1 Example 1(A): 1700 g of water on 271 g of nitrobenzene in the charge, 6.27 kg per kg (D-004); the make-up S1 is what the recycled distillates S21 and S22 leave to it"
  - id: CONV
    vary: {stream: S5, initial: 6.3, low: 1.0, high: 20.0}
    target: {stream: S6, component: NB, quantity: ratio, per: {stream: S4, component: NB}, basis: mass, value: 0.12}
    provenance: given
    source: "SRC-1 Example 1(A): 88 % of the nitrobenzene reduced, 33 g (12 %) left as the layer that holds the catalyst (D-005)"

feeds:
  - {id: PW, title: Process water (charge make-up), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NBF, title: Nitrobenzene (merchant; no library process), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: ACIDF, title: Sulfuric acid 98 % (sulfuric-acid-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: H2F, title: Hydrogen (hydrogen-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NH3F, title: Ammonia (ammonia-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: WASHW, title: Cold process water (cake wash), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: r102, direction: out, kind: energy}
      - {id: c101, direction: out, kind: energy}
      - {id: d101, direction: out, kind: energy}
  - id: LPS
    title: LP steam 350 kPa(a) (jackets, still heating, dryer)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 350, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 412.0, provenance: given, source: "saturation at 350 kPa(a), IAPWS-IF97"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: m101, direction: out, kind: energy}
      - {id: st101, direction: out, kind: energy}
      - {id: st102, direction: out, kind: energy}
      - {id: cr102, direction: out, kind: energy}
      - {id: d101, direction: out, kind: energy}
products:
  - {id: PAPP, title: 4-Aminophenol crystals to packing, category: product, ports: [{id: in, direction: in}]}
  - {id: ANP, title: "Crude wet aniline (co-product, to aniline purification)", category: product, ports: [{id: in, direction: in}]}
  - {id: VENT, title: Excess hydrogen purged with nitrogen to the vent stack, category: emission, ports: [{id: in, direction: in}]}
  - {id: WW, title: "Mother liquor, wash filtrate and condensates to wastewater treatment", category: wastewater, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: st101, direction: in, kind: energy}
      - {id: n101, direction: in, kind: energy}
      - {id: st102, direction: in, kind: energy}
  - id: CHW
    title: Chilled water return
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 278.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 283.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: cr101, direction: in, kind: energy}

blocks:
  - id: REACT
    title: Hydrogenation and phase split
    class: ReactingChemicals
    ports:
      - {id: pw, direction: in}
      - {id: nb, direction: in}
      - {id: acid, direction: in}
      - {id: h2, direction: in}
      - {id: rdist, direction: in}
      - {id: ranw, direction: in}
      - {id: aq, direction: out}
      - {id: vent, direction: out}
      - {id: qh, direction: in, kind: energy}
      - {id: q, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: WORKUP
    title: Strip, neutralisation and aniline distillation
    class: SeparatingByThermalProcess
    ports:
      - {id: in, direction: in}
      - {id: nh3, direction: in}
      - {id: rdist, direction: out}
      - {id: ranw, direction: out}
      - {id: aniline, direction: out}
      - {id: out, direction: out}
      - {id: qs1, direction: in, kind: energy}
      - {id: qc1, direction: out, kind: energy}
      - {id: qn, direction: out, kind: energy}
      - {id: qs2, direction: in, kind: energy}
      - {id: qc2, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: ISOL
    title: Crystallisation, second crop, centrifuging, washing and drying
    class: SeparatingMechanically
    ports:
      - {id: in, direction: in}
      - {id: wash, direction: in}
      - {id: product, direction: out}
      - {id: ww, direction: out}
      - {id: qcr, direction: out, kind: energy}
      - {id: qev, direction: in, kind: energy}
      - {id: steam, direction: in, kind: energy}
      - {id: power_c, direction: in, kind: energy}
      - {id: power_d, direction: in, kind: energy}

steps:
  - id: M101
    block: REACT
    title: Charge (water, acid, recycled distillates and nitrobenzene on the heel, 358 K)
    class: Mixing
    links: [{target: equipment, ref: R-101}, {target: equipment, ref: T-101}]
    ports:
      - {id: pw, direction: in, delegates: pw}
      - {id: nb, direction: in, delegates: nb}
      - {id: acid, direction: in, delegates: acid}
      - {id: heel, direction: in}
      - {id: rdist, direction: in, delegates: rdist}
      - {id: ranw, direction: in, delegates: ranw}
      - {id: out, direction: out}
      - {id: qh, direction: in, kind: energy, delegates: qh}
  - id: R101
    block: REACT
    title: Hydrogenation (hydrogen dosed into the charge at 358 K)
    class: ReactingChemicals
    reactions: [HYDP, HYDA]
    reactor: semibatch
    energy_port: q
    batch:
      dosing: [{stream: S5, time: 19800, absorbed: 1.0}]
      heat: isothermal
      provenance: assumed
      source: "hydrogen dosed at a constant rate over 5.5 h into the charge at 358.15 K and taken up (SRC-1 Example 1(A): 88 % reduced in about 5.5 h; SRC-2 Example 1: 85 C), the batch ending with the dose: the hydrogen dosed is what reduces 0.88 of the nitrobenzene charged (spec CONV; SRC-1: the run is stopped with at least 5 % of the nitrobenzene left so that its layer keeps the catalyst); the plant's hydrogen is fed on demand at constant pressure, modelled as a constant dose (D-004, D-005)"
    hazard:
      mtt: 373.12
      provenance: assumed
      source: "MTT: the normal boiling point of water, the lowest of the mass at about atmospheric pressure (R-101 runs at 103.8 kPa(a), SRC-2's 10 in. water gauge; the acid raises the bubble point a little, not counted); R-101 vents through its condenser to the stack, so the mass boils there (D-011)"
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: charge, direction: in}
      - {id: h2, direction: in, delegates: h2}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: V101
    block: REACT
    title: Phase split under nitrogen (heel with the catalyst kept in R-101, hydrogen purged)
    class: SeparatingByGravity
    recovery:
      outlets:
        heel: {NB: 0.6}
        vent: {H2: 1.0}
      provenance: assumed
      source: "D-006: the aqueous layer takes the 4-aminophenol, the aniline (as its salt) and the acid, and nitrobenzene to about 0.6 wt% of its water (solubility 0.19 wt% at 20 C and 0.8 wt% at 80 C, SRC-5, taken at about 0.6 wt% at the split's 333 K, ASSUMED), 0.4 of the nitrobenzene that reaches the split; the rest, 0.6, is the heel with the catalyst; the dissolved hydrogen is purged with nitrogen to the vent"
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: heel, direction: out}
      - {id: vent, direction: out, delegates: vent}
      - {id: aq, direction: out, delegates: aq}
  - id: ST101
    block: WORKUP
    title: Strip of water and dissolved nitrobenzene from the acid liquor (R-102)
    class: Distilling
    still:
      volatility:
        model: constant
        alpha: {H2O: 1.0, NB: 23.5}
        provenance: assumed
        source: "D-007: nitrobenzene dilute in water, alpha = gamma_inf x Psat(NB) / Psat(water) at 373.15 K, gamma_inf taken as 1/x at saturation (0.8 wt% at 80 C, SRC-5: x 1.18e-3, gamma 847), Psat 2.814 and 101.42 kPa (thermo 0.6.1, VDI_PPDS and IAPWS); 847 x 2.814 / 101.42 = 23.5"
      nonvolatile: [H2SO4, PAP, AN, H2]
      boilup: {value: 390, unit: kW, provenance: assumed, source: "R-102's jacket on LP steam: U 400 W/(m2 K) (glass-lined, ASSUMED) x 25 m2 wetted x (412 - 373) K = 390 kW (D-007, D-009)"}
      end: {distilled: 0.15, basis: mass}
      outlets: {distillate: dist, residue: res}
      condenser_port: qc
      provenance: assumed
      source: "SRC-1 Example 1(A): 300 cm3 of water distilled from the aqueous layer, about 0.15 of it, with the dissolved nitrobenzene, recycled to the next charge (Example 2); the aniline stays as its sulfate in the acid liquor (ASSUMED non-volatile)"
    energy_port: qs
    links: [{target: equipment, ref: R-102}, {target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: dist, direction: out, delegates: rdist}
      - {id: res, direction: out}
      - {id: qs, direction: in, kind: energy, delegates: qs1}
      - {id: qc, direction: out, kind: energy, delegates: qc1}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: N101
    block: WORKUP
    title: Neutralisation with ammonia (R-102)
    class: ReactingChemicals
    reactions: [NEU]
    reactor: conversion
    energy_port: q
    links: [{target: equipment, ref: R-102}]
    ports:
      - {id: in, direction: in}
      - {id: nh3, direction: in, delegates: nh3}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: qn}
  - id: ST102
    block: WORKUP
    title: Aniline distillation with water at pH about 6 (R-103)
    class: Distilling
    still:
      volatility:
        model: constant
        alpha: {H2O: 1.0, NB: 23.5, AN: 4.92}
        provenance: assumed
        source: "D-007: aniline dilute in water, alpha = gamma_inf x Psat(AN) / Psat(water) at 373.15 K, gamma_inf taken as 1/x at saturation (6.4 parts per 100 parts water at 90 C, SRC-5: x 0.01224, gamma 81.7), Psat 6.108 and 101.42 kPa (thermo 0.6.1, WAGNER_MCGARRY and IAPWS); 81.7 x 6.108 / 101.42 = 4.92; nitrobenzene as ST101"
      nonvolatile: [H2SO4, PAP, AS, NH3]
      boilup: {value: 390, unit: kW, provenance: assumed, source: "R-103's jacket on LP steam, as R-102 (D-007, D-009)"}
      end: {residue: {key: AN, mole_fraction: 0.0005}}
      outlets: {distillate: dist, residue: res}
      condenser_port: qc
      provenance: assumed
      source: "SRC-1 Example 1(A): the liquor brought to pH 6.0 and the aniline distilled; how far is not stated: ASSUMED until 0.0005 mole fraction of aniline is left in the liquor (D-007)"
    energy_port: qs
    links: [{target: equipment, ref: R-103}, {target: equipment, ref: E-104}, {target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: dist, direction: out}
      - {id: res, direction: out, delegates: out}
      - {id: qs, direction: in, kind: energy, delegates: qs2}
      - {id: qc, direction: out, kind: energy, delegates: qc2}
  - id: V102
    block: WORKUP
    title: Aniline separator (crude aniline layer and aniline-saturated water)
    class: SeparatingByGravity
    recovery:
      outlets:
        aniline: {AN: 0.535, H2O: 0.0022, NB: 1.0}
      provenance: assumed
      source: "D-008: the distillate cooled to 298 K separates into an aniline layer, taken with about 5 wt% water (ASSUMED), and water saturated with aniline (3.5 parts per 100 parts water at 25 C, SRC-5); the recoveries are set so that the water layer leaves at about that saturation at the converged recycle (DESIGN.md D-008); the nitrobenzene traces go with the aniline"
    links: [{target: equipment, ref: V-102}]
    ports:
      - {id: in, direction: in}
      - {id: aniline, direction: out, delegates: aniline}
      - {id: water, direction: out, delegates: ranw}
  - id: CR101
    block: ISOL
    title: Cooling crystallisation at 283 K, first crop (K-101, centrifuged on C-101)
    class: Crystallizing
    crystallizer:
      solute: PAP
      solvent: H2O
      crystal: PAP_S
      basis: solubility
      temperature: 283.15
      solubility:
        unit: kg/kg_solvent
        points: [[273.15, 0.003915], [297.15, 0.006543], [303.15, 0.008065]]
        provenance: given
        source: "4-aminophenol in water, 0.39 wt% at 0 C, 0.65 wt% at 24 C and 0.80 wt% at 30 C (The Merck Index via PubChem CID 403, SRC-4), converted to kg per kg water, w/(1-w); the liquor's ammonium sulfate taken as without effect (salting-out coefficients 0, ASSUMED, D-008)"
        salting_out:
          coefficients: {H2SO4: 0.0, NB: 0.0, AN: 0.0, NH3: 0.0, AS: 0.0}
          provenance: assumed
          source: "no open solubility of 4-aminophenol in ammonium sulfate liquor read; 0 (D-008)"
      separation:
        solid_recovery: 0.995
        cake_liquid: {value: 0.12, basis: per_kg_solid}
        provenance: assumed
        source: "a vertical peeler centrifuge, 99.5 % of the crystals to the cake, 0.12 kg of liquor per kg of crystals (D-008)"
      energy: {heat_capacity: 3.6, heat_of_crystallization: 0.0, provenance: assumed, source: "the feed's heat capacity about 3.6 kJ/(kg K) from the components' liquid heat capacities of process/materials.yaml (D-009); the heat of crystallisation is counted in HYDP's heat of reaction (the product taken as formed solid, D-005), so 0 here"}
      spectators: [H2SO4, NB, AN, NH3, AS]
      outlets: {cake: cake, mother_liquor: ml}
    energy_port: q
    links: [{target: equipment, ref: K-101}, {target: equipment, ref: C-101}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: cake, direction: out}
      - {id: ml, direction: out}
      - {id: q, direction: out, kind: energy, delegates: qcr}
  - id: CR102
    block: ISOL
    title: Second crop, mother liquor concentrated under vacuum and cooled to 283 K (K-102)
    class: Crystallizing
    crystallizer:
      solute: PAP
      solvent: H2O
      crystal: PAP_S
      basis: solubility
      temperature: 283.15
      solubility:
        unit: kg/kg_solvent
        points: [[273.15, 0.003915], [297.15, 0.006543], [303.15, 0.008065]]
        provenance: given
        source: "as CR101 (SRC-4, D-008)"
        salting_out:
          coefficients: {H2SO4: 0.0, NB: 0.0, AN: 0.0, NH3: 0.0, AS: 0.0}
          provenance: assumed
          source: "as CR101 (D-008)"
      evaporation:
        solvent_fraction: 0.4
        provenance: assumed
        source: "D-008: 0.4 of the mother liquor's water evaporated, keeping the ammonium sulfate below its solubility (70.6 g per 100 g water at 0 C, SRC-6) at 283 K; SRC-1 recovers a second crop from the filtrate, the method not stated"
      separation:
        solid_recovery: 0.995
        cake_liquid: {value: 0.12, basis: per_kg_solid}
        provenance: assumed
        source: "as CR101 (D-008)"
      energy: {heat_capacity: 3.3, heat_of_crystallization: 0.0, latent_heat: 2477.0, feed_temperature: 283.15, provenance: assumed, source: "the mother liquor's heat capacity about 3.3 kJ/(kg K) (D-009); water's latent heat at 283.15 K, 2477 kJ/kg (thermo 0.6.1, Chemical('water').Hvap, HEOS_FIT), the vacuum evaporation at the crystallizer's temperature"}
      spectators: [H2SO4, NB, AN, NH3, AS]
      outlets: {cake: cake, mother_liquor: ml, vapour: vap}
    energy_port: q
    links: [{target: equipment, ref: K-102}, {target: equipment, ref: C-101}]
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out}
      - {id: ml, direction: out}
      - {id: vap, direction: out}
      - {id: q, direction: in, kind: energy, delegates: qev}
  - id: W101
    block: ISOL
    title: Cake wash with cold water on the centrifuge (both crops)
    class: Crystallizing
    crystallizer:
      solute: PAP
      solvent: H2O
      crystal: PAP_S
      basis: solubility
      temperature: 283.15
      solubility:
        unit: kg/kg_solvent
        points: [[273.15, 0.003915], [297.15, 0.006543], [303.15, 0.008065]]
        provenance: given
        source: "as CR101 (SRC-4, D-008)"
        salting_out:
          coefficients: {H2SO4: 0.0, NB: 0.0, AN: 0.0, NH3: 0.0, AS: 0.0}
          provenance: assumed
          source: "as CR101 (D-008)"
      separation:
        solid_recovery: 0.995
        cake_liquid: {value: 0.12, basis: per_kg_solid}
        provenance: assumed
        source: "as CR101 (D-008)"
      spectators: [H2SO4, NB, AN, NH3, AS]
      outlets: {cake: cake, mother_liquor: filtrate}
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: cake1, direction: in}
      - {id: cake2, direction: in}
      - {id: wash, direction: in, delegates: wash}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power_c}
  - id: D101
    block: ISOL
    title: Vacuum drying at 333 K under nitrogen
    class: Drying
    dryer:
      volatiles: [H2O, NB, AN, NH3]
      residual_moisture: {value: 0.002, basis: mass_fraction, provenance: assumed, source: "0.2 wt% volatiles in the dried product (D-008)"}
      temperature: 333.15
