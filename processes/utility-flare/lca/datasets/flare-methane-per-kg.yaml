# Utility dataset of the process library (process-library#45), Tier 1 form.
# Every amount is the `formula` of its `parameters`; core's lci_dataset validator re-checks each.
# Physical properties and stoichiometry have their source; design parameters are ASSUMED with a
# TODO to source them. Property parameters were evaluated with CoolProp 8.0.0. Change a
# parameter and the amounts of its formulas together (core and tests/test_utilities.py check them).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: flare-methane-per-kg
title: Flaring of methane-rich waste gas, per kg
description: 'Per 1 kg of waste gas (taken as methane) burnt in an elevated flare at an ASSUMED combustion
  efficiency: CO2 and water of the burnt fraction, the unburnt methane.'
basis: 1 kg of gas flared
boundary: 'gate-to-gate: flare tip; pilot, purge and assist gas or steam are not counted'
technology: elevated flare
geography:
  description: Generic.
classification:
  isic: '3821'
system_boundary:
  included:
  - CO2 and water of the burnt fraction
  - unburnt methane
  excluded:
  - 'TODO pilot and purge gas, assist steam or air: per flare, not per kg; needs the flare''s design'
  - 'TODO CO, soot (black carbon), NOx: no open factor read yet'
  - 'gases other than methane: a composition-based variant is needed (TODO)'
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified (TODO)
  infrastructure: excluded
  non_routine: included
