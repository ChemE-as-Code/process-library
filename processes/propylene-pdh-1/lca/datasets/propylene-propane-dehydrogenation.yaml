# Tier 1 form, a manifest-only entry without a flowsheet (as process-library#313/#317). Every amount is
# the formula of its parameters; core's validator re-checks each. Written from one published design LCA
# and stoichiometry (facts in our own form, each with its locator in `parameters`).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: propylene-propane-dehydrogenation
title: Propylene by catalytic propane dehydrogenation, net gas burnt on site
description: Per 1 t of polymer-grade propylene, gate-to-gate, moving-bed platinum catalyst with continuous
  regeneration (Oleflex type). Propane, electricity and consumables from one published 2022 design; the
  hydrogen-rich net gas and light ends are burnt in the unit's fired heaters and the site boilers, as that
  design does, so propylene is the only product counted. Part of that heat leaves as steam to the polypropylene
  plant, an exported co-product the source does not quantify, so propylene carries all of the combustion CO2
  (an upper bound). Combustion CO2 from the carbon balance.
basis: 1000 kg of propylene
boundary: 'gate-to-gate: depropaniser, reactor section with fired heaters, continuous catalyst regeneration,
  effluent compression, cold-box product recovery, deethaniser and propane-propylene splitter, plus the
  combustion of the whole net gas; electricity from outside; site utilities and off-sites excluded'
technology: catalytic dehydrogenation of propane over a platinum catalyst in moving-bed reactors with continuous
  catalyst regeneration and interstage fired heaters; the cyclic fixed-bed (chromium oxide) route and the
  hydrogen-export variant are not modelled
geography:
  description: 'One design: a planned PDH-PP complex in Ceyhan, Turkey (preliminary design data of 2022).
    No plant data and no average over plants.'
classification:
  isic: '2011'
system_boundary:
  included:
  - propane, and the combustion oxygen (free)
  - electricity of the PDH unit
  - Oleflex catalyst, activated alumina, dimethyl disulfide, caustic soda, phosphate and chlorine of the PDH unit
  - spent alumina adsorbent
  - CO2 and water vapour of burning the net gas and light ends
  excluded:
  - 'TODO utilities and off-sites shared with the polypropylene plant (the source''s U&O unit: 269 kWh electricity,
    2.0 m3 raw water and water-treatment chemicals per t PP, Table 4.1), not split between PDH and PP'
  - 'TODO raw water of the PDH unit (6.613 m3 per t PP, Table 4.1, estimated): cooling and steam make-up;
    its fate (evaporation, blowdown, effluent) is not stated, and the library has no raw-water background'
  - 'TODO natural-gas make-up: 288.96 Nm3/h for the whole PDH-PP site in normal operation (section 3.1),
    none listed for the PDH unit in Table 4.1'
  - 'TODO NOx, CO, SO2 (from the injected sulfur), HCl (from the chloride of the regeneration) and VOC to
    air, and the spent caustic: named in the design''s BAT evaluation, not quantified per t'
  - 'TODO fugitive propane and propylene; flaring'
  - 'TODO steam that the site boilers raise from the burnt net gas for the polypropylene plant: an exported
    co-product (docs/system-model.md section 2), not quantified because the source splits neither the fuel gas
    between the PDH heaters and the utility boilers nor the steam between the PDH and PP units (section 3.1, p.
    13: fuel gas to the PDH heater, flare and utility boilers, with natural gas to meet any deficit). Left
    unallocated, so propylene carries all of the combustion CO2 and of the propane burnt as fuel: an upper
    bound for propylene'
  - 'hydrogen to the polypropylene plant for molecular-weight control: small, not stated, not counted'
  - 'spent platinum catalyst: sent to platinum recovery, which the cut-off model leaves to the recycler'
  - 'feed impurities (ethane, butanes in the C3 LPG): the feed is taken as pure propane'
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: included
  non_routine: excluded
location: GLO
year: 2022
valid_until: 2027
time:
  start: 2022
  description: Preliminary design data of an LCA report dated August to September 2022 (published 2023). valid_until
    is the reference year + 5 (system-model section 6).
modelling:
  principle: attributional
  multifunctionality: 'one product counted, no allocation. The hydrogen and light ends are burnt on site as
    the source design does, so no material co-product leaves the unit. The steam the site boilers raise from
    them for the polypropylene plant is an exported co-product that the source does not quantify (see
    system_boundary.excluded); it is not split off, so the whole burden stays with propylene, an upper bound.
    A design that exports hydrogen would be a multi-output dataset of its own.'
