# propylene-pdh-1's own exchange overrides for the Atlas LCI build (ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Propane, the catalyst, the adsorbent, DMDS and
# phosphate stay reported gaps: the shared vocabulary has no entry, and no Atlas process makes them.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:caustic-50": {dataset: {path: processes/chlor-alkali-1/lca/dataset.yaml, product: "product:NAOH"}, source: "the Atlas producer chlor-alkali-1, caustic soda 50 wt-%, per kg of solution as this exchange counts it"}
  "feed:chlorine": {dataset: {path: processes/chlor-alkali-1/lca/dataset.yaml, product: "product:CL2"}, source: "the Atlas producer chlor-alkali-1, dry chlorine gas 400 kPa(a); the design's chlorine is probably delivered liquid, whose liquefaction is not counted (screening)"}
