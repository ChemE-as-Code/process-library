  - id: S7
    title: POCl3 reactor outlet
    from: R201.out
    to: V201.in
    template: pocl3-reactor
    state:
      design:
        pressure: {value: 130.0, provenance: assumed, source: "D-010 (US5183649: about atmospheric, up to 10 atm)"}
        temperature: {value: 323.15, provenance: assumed, source: "D-005: lower zone of US4183905 30-50 C, upper zone up to 95 C"}
        phase: {value: two-phase, provenance: assumed, source: "liquid POCl3 with the excess O2 and argon"}
        flow: {value: 4079.51, provenance: calculated, source: 'cheme process propagate: reactor R201 from S6 S10', fingerprint: b232a6cc9c0612a0}
        composition: {basis: mole_fraction, values: {PCL3: 0.00459544, POCL3: 0.971154, O2: 0.0228619, AR: 0.00138912}, provenance: calculated, source: 'cheme process propagate: reactor R201 from S6 S10', fingerprint: 13fcfac2e03405c9}
  - id: S8
