  - id: S14
    title: POCl3 product
    from: E303.out
    to: POCL3.in
    template: pocl3
    state:
      design:
        pressure: {value: 300.0, provenance: assumed, source: "product pump P-302 (D-010)"}
        temperature: {value: 308.15, provenance: assumed, source: "D-002: product to storage at 35 C"}
        phase: {value: liquid, provenance: assumed, source: "liquid"}
        flow: {value: 4000.0, basis: mass, provenance: calculated, source: 'cheme process propagate: pass-through E303 from S13', fingerprint: fc0b85c81bd5f1f4}
