  - id: S9
    title: POCl3 reactor vent gas
    from: V201.gas
    to: T401.gas2
    template: vent
    state:
      design:
        pressure: {value: 110.0, provenance: assumed, source: "D-010"}
        temperature: {value: 283.15, provenance: assumed, source: "vent condenser E-202 outlet on chilled water, above the 274 K melting point of POCl3 (D-007)"}
        phase: {value: vapor, provenance: assumed, source: "gas"}
        flow: {value: 23.391, basis: mass, provenance: assumed, source: "scripts/balance.py: excess O2 and Ar saturated with PCl3/POCl3 at 283 K, Raoult (D-006)"}
        composition: {basis: mole_fraction, values: {O2: 0.9240754033, AR: 0.0561470927, PCL3: 0.0003450499, POCL3: 0.0194324541}, provenance: assumed, source: "scripts/balance.py (D-006)"}
  # --- distillation ----------------------------------------------------------------------------
  - id: S11
    title: PCl3-rich distillate recycled to the oxidation
    from: C301.top
    to: M201.rec
    template: chlorides
    state:
      design:
        pressure: {value: 300.0, provenance: assumed, source: "reflux pump P-301 (D-010)"}
        temperature: {value: 355.0, provenance: assumed, source: "D-008: about the bubble point of the 50/50 mol PCl3/POCl3 distillate at 120 kPa(a)"}
        phase: {value: liquid, provenance: assumed, source: "liquid"}
        flow: {value: 36.0, basis: mass, provenance: assumed, source: "scripts/balance.py: 99.5 % of the PCl3, distillate 50 mol% PCl3 (D-008)"}
        composition: {basis: mole_fraction, values: {PCL3: 0.5, POCL3: 0.5}, provenance: assumed, source: "D-008"}
  - id: S12
    title: Topped POCl3 to the product column
    from: C301.bot
    to: C302.in
    template: pocl3
    state:
      design:
        pressure: {value: 125.0, provenance: assumed, source: "D-010"}
        temperature: {value: 381.0, provenance: assumed, source: "D-008: bubble point of POCl3 at 125 kPa(a), about"}
