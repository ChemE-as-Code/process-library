# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Phosphorus oxychloride by chlorination of molten white phosphorus to PCl3 in a boiling
# reactor-still, oxidation of the liquid PCl3 with oxygen in a cooled loop reactor, and
# distillation (light-ends column with PCl3 recycle, product column with a residue purge); the
# vents of both reactors are scrubbed with caustic (DESIGN.md D-001). Where the values come from:
# - feeds, temperatures, pressures, conversions and column splits: design basis and decisions
#   D-002..D-010, ASSUMED, the ranges from the patents cited there;
# - the reactors R101 and R201 and the mixers M201 and M401 are solved by
#   `cheme process propagate --fill` (conversion model, calculated);
# - the vent condensers V101/V201 (Raoult's law with thermo vapour pressures), the columns C301
#   and C302 (specified splits), the scrubber T401 and every duty come from the independent
#   balance scripts/balance.py (D-006), given here as ASSUMED: core has no property package for
#   PCl3, POCl3, white phosphorus or the caustic liquor (core #315, #364), so it can neither
#   flash the condensers nor close the energy balance of the liquid-phase reactors.
schema: cheme/process/v1
kind: flowsheet
title: Phosphorus oxychloride from white phosphorus, chlorine and oxygen (4.0 t/h POCl3)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 4000 kg/h distilled POCl3 from molten white phosphorus, chlor-alkali-1 chlorine and asu-1 oxygen (D-002)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: P4, title: Molten white phosphorus (thermal phosphorus furnace outside the boundary), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: CL2, title: Dry chlorine gas (chlor-alkali-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: O2, title: Gaseous oxygen 99.7 mol% (asu-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NAOH, title: Caustic soda 50 wt% (chlor-alkali-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PW, title: Process water (dilution), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: r201, direction: out, kind: energy}
      - {id: frac, direction: out, kind: energy}
      - {id: t401, direction: out, kind: energy}
  - id: LPS
    title: LP steam 400 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 400, provenance: assumed, source: "design basis, D-008"}
      supply_temperature: {value: 416.77, provenance: given, source: "saturation at 400 kPa(a), IAPWS-IF97"}
      min_approach: {value: 10, provenance: assumed, source: D-008}
    ports:
      - {id: c301, direction: out, kind: energy}
      - {id: c302, direction: out, kind: energy}
products:
  - {id: POCL3, title: Phosphorus oxychloride (distilled) to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: RES, title: Distillation residue to hazardous-waste incineration, category: by_product, ports: [{id: in, direction: in}]}
  - {id: EFF, title: Spent scrubber liquor to wastewater treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - {id: STACK, title: Scrubbed vent gas to stack, category: off_gas, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis"}
      min_approach: {value: 5, provenance: assumed, source: "design basis"}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: r201, direction: in, kind: energy}
      - {id: c301, direction: in, kind: energy}
      - {id: c302, direction: in, kind: energy}
      - {id: e303, direction: in, kind: energy}
  - id: CHW
    title: Chilled water return (vent condensers)
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 278.15, provenance: assumed, source: "design basis, D-007"}
      return_temperature: {value: 283.15, provenance: assumed, source: "design basis, D-007"}
      min_approach: {value: 5, provenance: assumed, source: "D-007"}
    ports:
      - {id: v101, direction: in, kind: energy}
      - {id: v201, direction: in, kind: energy}

blocks:
  - id: PCL3
    title: PCl3 synthesis (chlorination of white phosphorus)
    class: ReactingChemicals
    ports:
      - {id: p4, direction: in}
      - {id: cl2, direction: in}
      - {id: pcl3, direction: out}
      - {id: vent, direction: out}
      - {id: cw, direction: out, kind: energy}
      - {id: chw, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: OXID
    title: PCl3 oxidation with oxygen
    class: ReactingChemicals
    ports:
      - {id: pcl3, direction: in}
      - {id: recycle, direction: in}
      - {id: o2, direction: in}
      - {id: crude, direction: out}
      - {id: vent, direction: out}
      - {id: cw, direction: out, kind: energy}
      - {id: chw, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: FRAC
    title: POCl3 distillation
    class: Distilling
    ports:
      - {id: crude, direction: in}
      - {id: recycle, direction: out}
      - {id: product, direction: out}
      - {id: residue, direction: out}
      - {id: steam1, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: cw3, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: SCRUB
    title: Vent gas scrubbing (caustic)
    class: Absorbing
    ports:
      - {id: vent1, direction: in}
      - {id: vent2, direction: in}
      - {id: naoh, direction: in}
      - {id: water, direction: in}
      - {id: gas, direction: out}
      - {id: liquor, direction: out}
      - {id: power, direction: in, kind: energy}

steps:
  # --- PCL3 ------------------------------------------------------------------------------------
  - id: R101
    block: PCL3
    title: PCl3 reactor-still with reflux condenser E-101 (white phosphorus chlorination)
    class: ReactingChemicals
    reactions: [P_CHLOR, PCL3_OX_R101]
    reactor: conversion
    links: [{target: equipment, ref: R-101}, {target: equipment, ref: E-101}]
    ports:
      - {id: p4, direction: in, delegates: p4}
      - {id: cl2, direction: in, delegates: cl2}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: cw}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: V101
    block: PCL3
    title: PCl3 receiver with vent condenser E-102 (chilled water)
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-101}, {target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in}
      - {id: liquid, direction: out, delegates: pcl3}
      - {id: gas, direction: out, delegates: vent}
      - {id: q, direction: out, kind: energy, delegates: chw}
  # --- OXID ------------------------------------------------------------------------------------
  - id: M201
    block: OXID
    title: PCl3 feed and recycle mixing
    class: Mixing
    ports:
      - {id: pcl3, direction: in, delegates: pcl3}
      - {id: rec, direction: in, delegates: recycle}
      - {id: out, direction: out}
  - id: R201
    block: OXID
    title: PCl3 oxidation loop reactor with circulation cooler E-201
    class: ReactingChemicals
    reactions: [PCL3_OX]
    reactor: conversion
    links: [{target: equipment, ref: R-201}, {target: equipment, ref: E-201}, {target: equipment, ref: P-201}]
    ports:
      - {id: in, direction: in}
      - {id: o2, direction: in, delegates: o2}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: cw}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: V201
    block: OXID
    title: POCl3 reactor gas separator with vent condenser E-202 (chilled water)
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-201}, {target: equipment, ref: E-202}]
    ports:
      - {id: in, direction: in}
      - {id: liquid, direction: out, delegates: crude}
      - {id: gas, direction: out, delegates: vent}
      - {id: q, direction: out, kind: energy, delegates: chw}
  # --- FRAC ------------------------------------------------------------------------------------
  - id: C301
    block: FRAC
    title: Light-ends column (PCl3 recycle)
    class: Distilling
    links: [{target: equipment, ref: C-301}]
    ports:
      - {id: in, direction: in, delegates: crude}
      - {id: top, direction: out, delegates: recycle}
      - {id: bot, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam1}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: C302
    block: FRAC
    title: POCl3 product column (residue purge)
    class: Distilling
    links: [{target: equipment, ref: C-302}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out}
      - {id: bot, direction: out, delegates: residue}
      - {id: steam, direction: in, kind: energy, delegates: steam2}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E303
    block: FRAC
    title: POCl3 product cooler
    class: Cooling
    links: [{target: equipment, ref: E-303}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: product}
      - {id: q, direction: out, kind: energy, delegates: cw3}
  # --- SCRUB -----------------------------------------------------------------------------------
  - id: M401
    block: SCRUB
    title: Caustic dilution
    class: Mixing
    ports:
      - {id: naoh, direction: in, delegates: naoh}
      - {id: water, direction: in, delegates: water}
      - {id: out, direction: out}
  - id: T401
    block: SCRUB
    title: Caustic vent scrubber
    class: Absorbing
    reactions: [PCL3_NAOH, POCL3_NAOH, CL2_NAOH]
    links: [{target: equipment, ref: T-401}, {target: equipment, ref: P-401}]
    ports:
      - {id: gas1, direction: in, delegates: vent1}
      - {id: gas2, direction: in, delegates: vent2}
      - {id: liq_in, direction: in}
      - {id: gas_out, direction: out, delegates: gas}
      - {id: liq_out, direction: out, delegates: liquor}
      - {id: power, direction: in, kind: energy, delegates: power}

streams:
  # --- PCl3 synthesis --------------------------------------------------------------------------
  - id: S1
    title: Molten white phosphorus
    from: P4.out
    to: R101.p4
    template: phosphorus
    state:
      design:
        pressure: {value: 400.0, provenance: assumed, source: "pumped from the water-sealed melt tank (CN115259114B: 0.4-0.6 MPa), D-003"}
        temperature: {value: 333.15, provenance: assumed, source: "molten under water at 55-60 C (CN115259114B, disclosure item 1), D-003"}
        phase: {value: liquid, provenance: assumed, source: "above the 317 K melting point"}
        flow: {value: 812.554, basis: mass, provenance: assumed, source: "scripts/balance.py: phosphorus for 4000 kg/h POCl3 product (D-002)"}
        composition: {basis: mole_fraction, values: {P4: 1.0}, provenance: assumed, source: "D-003: dry white phosphorus; water, arsenic and phosphorus mud not modelled"}
  - id: S2
    title: Dry chlorine gas
    from: CL2.out
    to: R101.cl2
    template: chlorine
    state:
      design:
        pressure: {value: 400.0, provenance: assumed, source: "chlor-alkali-1 chlorine product at 400 kPa(a) (its stream S42)"}
        temperature: {value: 313.15, provenance: assumed, source: "chlor-alkali-1 chlorine product (its stream S42)"}
        phase: {value: vapor, provenance: assumed, source: "gas"}
        flow: {value: 2814.428, basis: mass, provenance: assumed, source: "scripts/balance.py: 0.05 % molar Cl2 excess over the P4 (D-004)"}
        composition: {basis: mass_fraction, values: {CL2: 0.9918815, O2: 0.0081185}, provenance: assumed, source: "chlor-alkali-1 stream S42: Cl2 0.9918815, O2 0.008118535 (mass)"}
  - id: S3
    title: PCl3 reactor outlet after the reflux condenser
    from: R101.out
    to: V101.in
    template: pcl3-reactor
    state:
      design:
        pressure: {value: 115.0, provenance: assumed, source: "reactor-still near atmospheric pressure (D-010)"}
        temperature: {value: 308.15, provenance: assumed, source: "reflux condenser E-101 outlet on cooling water (CN115259114B condenser 30-35 C), D-007"}
        phase: {value: two-phase, provenance: assumed, source: "liquid PCl3 with the Cl2/O2 vent gas"}
        flow: {value: 3626.98, provenance: calculated, source: 'cheme process propagate: reactor R101 from S1 S2', fingerprint: 7001601e283ab492}
        composition: {basis: mole_fraction, values: {P4: 0.0, CL2: 0.000749754, O2: 0.000271911, PCL3: 0.94514, POCL3: 0.0538384}, provenance: calculated, source: 'cheme process propagate: reactor R101 from S1 S2', fingerprint: 24bbeeae179737ba}
  - id: S4
    title: Crude PCl3 to the oxidation
    from: V101.liquid
    to: M201.pcl3
    template: chlorides
    state:
      design:
        pressure: {value: 300.0, provenance: assumed, source: "transfer pump P-101 (D-010)"}
        temperature: {value: 308.15, provenance: assumed, source: "D-007"}
        phase: {value: liquid, provenance: assumed, source: "liquid"}
        flow: {value: 3625.086, basis: mass, provenance: assumed, source: "scripts/balance.py: R101 outlet less the vapour carried by the vent at 283 K (D-006)"}
        composition: {basis: mole_fraction, values: {PCL3: 0.9461032869, POCL3: 0.0538967131}, provenance: assumed, source: "scripts/balance.py (D-006)"}
  - id: S5
    title: PCl3 reactor vent gas
    from: V101.gas
    to: T401.gas1
    template: vent
    state:
      design:
        pressure: {value: 110.0, provenance: assumed, source: "D-010"}
        temperature: {value: 283.15, provenance: assumed, source: "vent condenser E-102 outlet on chilled water (D-007)"}
        phase: {value: vapor, provenance: assumed, source: "gas"}
        flow: {value: 1.903, basis: mass, provenance: assumed, source: "scripts/balance.py: unreacted Cl2 and O2 saturated with PCl3/POCl3 at 283 K, Raoult (D-006)"}
        composition: {basis: mole_fraction, values: {CL2: 0.6820880508, O2: 0.2475437622, PCL3: 0.0693159445, POCL3: 0.0010522425}, provenance: assumed, source: "scripts/balance.py (D-006)"}
  # --- oxidation -------------------------------------------------------------------------------
  - id: S6
    title: PCl3 feed to the oxidation reactor
    from: M201.out
    to: R201.in
    template: chlorides
    state:
      design:
        pressure: {value: 300.0, provenance: assumed, source: "D-010"}
        temperature: {value: 308.15, provenance: assumed, source: "D-005 (recycle small, mixing temperature not resolved)"}
        phase: {value: liquid, provenance: assumed, source: "liquid"}
        flow: {value: 3661.09, provenance: calculated, source: 'cheme process propagate: mixer M201 from S4 S11', fingerprint: f4bbf4fd2992b47b}
        composition: {basis: mole_fraction, values: {PCL3: 0.94193, POCL3: 0.0580699}, provenance: calculated, source: 'cheme process propagate: mixer M201 from S4 S11', fingerprint: 3fb259ed2a5111d7}
  - id: S10
    title: Gaseous oxygen
    from: O2.out
