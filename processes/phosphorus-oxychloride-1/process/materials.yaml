# Components and templates of phosphorus-oxychloride-1. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
#
# Gas data printed by `cheme chemistry thermo` (chemicals/thermo packages: CRC, ATcT, Poling 5th
# ed.; PCl3 and POCl3 Cp/R fitted to the NIST WebBook Shomate data 298.15-1000 K). White
# phosphorus has no ideal-gas record in chemicals (cheme chemistry thermo P4). The scrubber
# species (NaOH, NaCl, Na2HPO3, Na3PO4, NaOCl) are molecular pseudo-components of the aqueous
# liquor without ideal-gas data. No property package of core covers PCl3, POCl3, P4 or the
# caustic liquor (core #315, #364): the vent condensers, columns and scrubber come from
# scripts/balance.py (DESIGN.md D-006).
schema: cheme/process/v1
kind: materials
components:
  - id: P4
    name: White phosphorus (tetraphosphorus, molten)
    formula: P4
    cas: 12185-10-3
    molar_mass: 123.895
    normal_boiling_point: 553.65   # chemicals (CRC), white phosphorus 280.5 C; melting point 317.3 K
  - id: CL2
    name: Chlorine
    formula: Cl2
    cas: 7782-50-5
    molar_mass: 70.906
    normal_boiling_point: 239.11
    critical: {Tc: 416.865, Pc: 7642.4, omega: 0.07, source: "chemicals: Tc HEOS, Pc HEOS, omega HEOS"}
    ideal_gas: {dHf_298: 0.0, S_298: 223.1, cp_R: [3.056, 0.0053708, -8.098e-06, 5.693e-09, -1.5256e-12], temperature_range: [50, 1000], source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R Poling (5th ed.)"}
  - id: O2
    name: Oxygen
    formula: O2
    cas: 7782-44-7
    molar_mass: 31.999
    normal_boiling_point: 90.19
    critical: {Tc: 154.581, Pc: 5043.0, omega: 0.0222, source: "chemicals: Tc HEOS, Pc HEOS, omega HEOS"}
    ideal_gas: {dHf_298: 0.0, S_298: 205.2, cp_R: [3.63, -0.001794, 6.58e-06, -6.0e-09, 1.79e-12], temperature_range: [50, 1000], source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R Poling (5th ed.)"}
  - id: AR
    name: Argon
    formula: Ar
    cas: 7440-37-1
    molar_mass: 39.948
    normal_boiling_point: 87.30
    critical: {Tc: 150.687, Pc: 4863.0, omega: -0.00219, source: "chemicals: Tc HEOS, Pc HEOS, omega HEOS"}
    ideal_gas: {dHf_298: 0.0, S_298: 154.8, cp_R: [2.5, 0.0, 0.0, 0.0, 0.0], temperature_range: [50, 3000], source: "chemicals: dHf_298 ATCT_G, S_298 CRC; monatomic ideal gas"}
  - id: PCL3
    name: Phosphorus trichloride
    formula: PCl3
    cas: 7719-12-2
    molar_mass: 137.333
    normal_boiling_point: 349.15
    critical: {Tc: 563.0, Pc: 5670.0, omega: 0.2344, source: "chemicals: Tc MATTHEWS, Pc PINAMARTINES, omega YAWS"}
    ideal_gas: {dHf_298: -287000.0, S_298: 311.8, cp_R: [3.75911, 0.0286196, -5.39235e-05, 4.64811e-08, -1.51167e-11], temperature_range: [298.15, 1000], source: "chemicals: dHf_298 CRC, S_298 CRC, cp_R fitted to thermo WEBBOOK_SHOMATE 298.15-1000 K (max deviation 0.30 %)"}
  - id: POCL3
    name: Phosphoryl chloride (phosphorus oxychloride)
    formula: POCl3
    cas: 10025-87-3
    molar_mass: 153.332
    normal_boiling_point: 378.65   # chemicals (CRC); melting point 274.4 K (1.2 C)
    critical: {Tc: 601.0, Pc: 4960.0, omega: 0.0832, source: "chemicals: Tc WEBBOOK, Pc WEBBOOK, omega YAWS"}
    ideal_gas: {dHf_298: -558500.0, S_298: 325.5, cp_R: [4.79881, 0.0290793, -4.59712e-05, 3.51225e-08, -1.04897e-11], temperature_range: [298.15, 1000], source: "chemicals: dHf_298 CRC, S_298 CRC, cp_R fitted to thermo WEBBOOK_SHOMATE 298.15-1000 K (max deviation 0.18 %)"}
  - id: H2O
    name: Water
    formula: H2O
    cas: 7732-18-5
    molar_mass: 18.015
    normal_boiling_point: 373.12
    critical: {Tc: 647.096, Pc: 22064.0, omega: 0.3443, source: "chemicals: Tc HEOS, Pc HEOS, omega HEOS"}
    ideal_gas: {dHf_298: -241822.0, S_298: 188.8, cp_R: [3.95742, -0.000363702, 2.42862e-06, -1.27073e-09, 2.12761e-13], temperature_range: [298.15, 1500], source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R fitted to thermo HEOS_FIT 298.15-1500 K (max deviation 0.17 %)"}
  - id: NAOH
    name: Sodium hydroxide (dissolved)
    formula: NaOH
    cas: 1310-73-2
    molar_mass: 39.997
  - id: NACL
    name: Sodium chloride (dissolved)
    formula: NaCl
    cas: 7647-14-5
    molar_mass: 58.443
  - id: NA2HPO3
    name: Disodium phosphite (disodium phosphonate, dissolved)
    formula: Na2HPO3
    molar_mass: 125.958     # CAS not verified: left out (DESIGN.md D-013)
  - id: NA3PO4
    name: Trisodium phosphate (dissolved)
    formula: Na3PO4
    cas: 7601-54-9
    molar_mass: 163.941
  - id: NAOCL
    name: Sodium hypochlorite (dissolved)
    formula: NaOCl
    cas: 7681-52-9
    molar_mass: 74.442
templates:
  - {id: phosphorus, title: Molten white phosphorus, components: [P4]}
  - {id: chlorine, title: Dry chlorine gas (chlor-alkali-1), components: [CL2, O2]}
  - {id: oxygen, title: Gaseous oxygen (asu-1), components: [O2, AR]}
  - {id: pcl3-reactor, title: PCl3 reactor outlet (condensed PCl3 with vent gas), components: [P4, CL2, O2, PCL3, POCL3]}
  - {id: chlorides, title: Liquid phosphorus chlorides, components: [PCL3, POCL3]}
  - {id: pocl3-reactor, title: POCl3 reactor outlet (liquid with vent gas), components: [O2, AR, PCL3, POCL3]}
  - {id: pocl3, title: Phosphorus oxychloride, components: [PCL3, POCL3]}
  - {id: vent, title: Reactor vent gas, components: [CL2, O2, AR, PCL3, POCL3]}
  - {id: caustic, title: Caustic soda solution, components: [NAOH, H2O]}
  - {id: water, title: Process water, components: [H2O]}
  - {id: stack, title: Scrubbed vent gas, components: [CL2, O2, AR, PCL3, POCL3, H2O]}
  - {id: liquor, title: Spent scrubber liquor, components: [NAOH, NACL, NA2HPO3, NA3PO4, NAOCL, H2O]}
# No benchmarked property package covers PCl3, POCl3, white phosphorus or the caustic liquor
# (cheme process props --coverage; core #315, #364). Values are assumed from
# scripts/balance.py with their source.
property_method:
  adapter: thermo
  status: placeholder
