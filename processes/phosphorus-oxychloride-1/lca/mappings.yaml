# phosphorus-oxychloride-1's own exchange overrides for the Atlas LCI build (build_lci.py,
# ADR 0022). Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange
# keys (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml,
# gives the exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# None yet: phosphorus-oxychloride-1 is an internal process (publication.status: internal) and
# its preliminary LCI leaves every background unmapped on purpose (DESIGN.md D-012). The build
# reports each unmapped exchange as a gap (lci/gaps.json). The shared vocabulary has no entry
# yet for white phosphorus, chlorine, sodium hydroxide, chilled water, hazardous-waste
# incineration or phosphorus oxychloride, and no biosphere identity for Cl2, PCl3 or POCl3 to
# air: those belong to the consolidated shared-files PR (DESIGN.md D-013).
schema: cheme-as-code/lci-process-mappings/v1
exchanges: {}
