  - {title: "US4183905A (1980) Producing phosphorus oxyhalide (oxidation of PCl3 with oxygen in a two-zone column)", url: "https://patents.google.com/patent/US4183905"}
  - {title: "US5183649A (1993) Production of phosphorus compounds (PCl3 and POCl3 from phosphorus, chlorine and oxygen in a loop reactor)", url: "https://patents.google.com/patent/US5183649"}
  - {title: "CN115259114B (2023) Continuous production process of phosphorus trichloride (molten yellow phosphorus and chlorine)", url: "https://patents.google.com/patent/CN115259114B/en"}
  - {title: "PubChem CID 24813, phosphoryl chloride (identity)", url: "https://pubchem.ncbi.nlm.nih.gov/compound/24813"}
