    the formula
- name: y_oil
  value: 0.69
  unit: kg/kg
  description: 'Raw pyrolysis oil per kg of pyrolysis-ready mixed polyolefin waste: the central value of 0.67 to
    0.71.'
  source: 'Gaudillat, P., Marschinski, R., Saveyn, H. (2026) Economic viability of chemical recycling: current and
    future perspectives, JRC147061, EUR 40766, doi:10.2760/6105801, Annex A.5 ''Outputs and yield'', p. 99 (literature
    and stakeholder data converge on 67 to 71 %, 69 % central); Table 7, p. 48 gives 65, 71 and 85 % for its current,
    baseline and best-case scenarios'
- name: f_heat
  value: 0.1
  unit: MJ/MJ
  description: 'Process heat as a share of the calorific value of the plastic fed: the practical value for real
    reactors.'
  source: 'Gaudillat, P., Marschinski, R., Saveyn, H. (2026) Economic viability of chemical recycling: current and
    future perspectives, JRC147061, EUR 40766, doi:10.2760/6105801, Annex A.5 ''Opex'', p. 99, reporting Netsch
    et al. (2024): theoretical heat demand about 5 % (4 to 6 %) of the calorific value, in practice close to 10
    %. Netsch et al. (2024) itself was not read. Reading the 10 % as fuel fired (furnace losses included, no separate
    efficiency) is ASSUMED'
- name: cv_feed
  value: 43.69
  unit: MJ/kg
  description: 'Lower heating value of the feed as modelled, pure (CH2)n: the same feed definition as the element
    balance.'
  source: 'estimated by us with the HHV correlation of Channiwala, S.A., Parikh, P.P. (2002) A unified correlation
    for estimating HHV of solid, liquid and gaseous fuels, Fuel 81:1051-1063, doi:10.1016/S0016-2361(01)00131-4
    on the element composition of (CH2)n (85.63 % C, 14.37 % H, chemicals/chemicals.yaml polyethylene), less 2.4417
    MJ/kg for the water formed (enthalpy of vaporisation at 25 degC, IAPWS-95 via CoolProp 8.0.0); ASSUMED that
    the correlation holds for polyolefins. A real sorted feed with moisture and contaminants has less: Garcia-Gutierrez,
    P. et al. (2023) Environmental and economic assessment of plastic waste recycling, JRC132067, EUR 31423 EN,
    doi:10.2760/0472, sections 3.2.2.1.4, p. 59 (sorted large-format PE film waste about 34 GJ/t) and 3.2.2.1.3,
    p. 58 (sorted MPO flexible packaging waste about 28 GJ/t). That lower value is not used, because the feed is
    modelled without moisture or inerts and its products would then carry more energy than it'
- name: lhv_gas
  value: 46.4
  unit: MJ/kg
  description: Net calorific value of ethane, the model compound of the gas burnt.
  source: IPCC (2006) Guidelines for National Greenhouse Gas Inventories, Vol. 2 Energy, ch. 1, Table 1.2, p. 1.18
    (ethane 46.4 TJ/Gg, 95 % interval 44.9 to 48.8)
- name: e_purch
  value: 1775.0
  unit: MJ
  description: Purchased energy per t of total liquid product of five plastic-to-fuel companies (median aggregate).
  source: Benavides, P.T., Sun, P., Han, J., Dunn, J.B., Wang, M. (2017) Life-cycle analysis of fuels from post-use
    non-recycled plastics, Fuel 203:11-22, doi:10.1016/j.fuel.2017.04.070 (accepted manuscript, OSTI 1353191), Table
    1, p. 8 (covers pretreatment, conversion and on-site upgrading, US plants, survey of about 2016)
- name: s_el
  value: 0.87
  unit: MJ/MJ
  description: Electricity share of the purchased energy.
  source: Benavides, P.T., Sun, P., Han, J., Dunn, J.B., Wang, M. (2017) Life-cycle analysis of fuels from post-use
    non-recycled plastics, Fuel 203:11-22, doi:10.1016/j.fuel.2017.04.070 (accepted manuscript, OSTI 1353191), Table
    1, p. 8 and section 3.3, p. 10 (87 % electricity, 13 % natural gas)
- name: ef_ch4
  value: 1.0e-06
  unit: kg/MJ
  description: CH4 per MJ of refinery gas fired in manufacturing industries (1 kg/TJ).
  source: 'IPCC (2006) Guidelines for National Greenhouse Gas Inventories, Vol. 2 Energy, ch. 2, Table 2.3, p. 2.18
    (refinery gas: default 1, range 0.3 to 3 kg/TJ); taking the pyrolysis gas as refinery gas is ASSUMED'
- name: ef_n2o
  value: 1.0e-07
  unit: kg/MJ
  description: N2O per MJ of refinery gas fired in manufacturing industries (0.1 kg/TJ).
  source: 'IPCC (2006) Guidelines for National Greenhouse Gas Inventories, Vol. 2 Energy, ch. 2, Table 2.3, p. 2.18
    (refinery gas: default 0.1, range 0.03 to 0.3 kg/TJ); taking the pyrolysis gas as refinery gas is ASSUMED'
