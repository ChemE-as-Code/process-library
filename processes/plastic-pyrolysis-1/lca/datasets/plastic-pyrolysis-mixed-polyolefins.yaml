# Tier 1 form, a manifest-only entry without a flowsheet (as process-library#317). Every amount is the formula of
# its parameters; core's validator re-checks each. Written from open sources (facts in our own form).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: plastic-pyrolysis-mixed-polyolefins
title: Raw pyrolysis oil by continuous thermal pyrolysis of mixed polyolefin plastic waste
description: Per 1 t of raw (not upgraded) pyrolysis oil, gate-to-gate, from pyrolysis-ready mixed PE/PP waste.
  Yield and process heat from a JRC review of EU literature and stakeholder data (2026), electricity from a survey
  of US companies (2017), combustion CH4 and N2O from IPCC 2006. Part of the gas is fired for the process heat;
  the rest is a co-product. Char is a residue.
basis: 1000 kg of raw plastic pyrolysis oil
boundary: 'gate-to-gate: pyrolysis reactor with its gas-fired heating, condensation and gas handling; the waste
  enters sorted and pretreated, burden-free; upgrading (hydrotreating, fractionation) and the steam cracker are
  outside'
technology: non-catalytic (thermal) pyrolysis of mixed polyolefins at about 430 to 550 degC in continuously fed
  reactors (screw or rotary kiln, extruder-fed, fluidised bed); catalytic, hydrothermal and batch units are not
  modelled separately
geography:
  description: EU yield and heat basis; electricity from US plants; no single site.
classification:
  isic: '3830'
system_boundary:
  included:
  - pyrolysis-ready mixed polyolefin waste (burden-free)
  - electricity
  - 'firing of part of the pyrolysis gas for process heat: CO2, H2O, CH4, N2O'
  - exported pyrolysis gas (co-product), char (residue)
  excluded:
  - 'TODO natural gas: 13 % of the purchased energy in the same survey (Benavides et al. 2017), about 231 MJ/t of
    liquid; left out because it may overlap with the heat modelled from the own gas, and its use (start-up, upgrading)
    is not stated'
  - 'TODO NOx, CO, particulates and HCl from the gas firing and the char: no open source quantified them for this
    process'
  - TODO nitrogen for inerting and purging; cooling water; water and wastewater from feed moisture and washing
  - TODO the fate of the char (landfill or energy recovery); the treatment of the exported gas
  - TODO chlorine and other heteroatoms of real waste (PVC, PET, additives) and their fate in oil, char and flue
    gas
  - 'collection, transport, sorting and pretreatment of the waste: in the waste system under cut-off'
  - upgrading of the oil (hydrotreating, fractionation) and steam cracking
  - 'catalysts: thermal process; infrastructure'
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: RER
year: 2025
valid_until: 2030
time:
  start: 2016
  description: yield and heat share consolidated in a JRC report published in 2026 from data collected up to 2025;
    electricity from a survey of US companies published in 2017 (older than the 10-year limit for secondary data
    at the reference year). valid_until is the reference year + 5 (system-model section 6).
modelling:
  principle: attributional
  multifunctionality: energy (LHV) allocation between the raw oil and the exported pyrolysis gas, two co-produced
    fuels (see allocation); the char is a residue
allocation:
  method: energy
  coproducts:
  - plastic-pyrolysis-oil
  - plastic-pyrolysis-gas
  properties:
    plastic-pyrolysis-oil:
      energy: 44500.0
    plastic-pyrolysis-gas:
      energy: 46400.0
  source: 'lci/mappings.yaml allocation.plastic-pyrolysis-1 (rule physical-energy): the oil and the exported gas
    are co-produced fuels, so energy content (LHV) is the physical relationship, docs/system-model.md section 2,
    step 2. Lower heating values in kJ/kg (the MJ/kg defaults times 1000), IPCC (2006) Guidelines for National Greenhouse
    Gas Inventories, Vol. 2 Energy, ch. 1, Table 1.2, p. 1.18 defaults: naphtha 44.5 (95 % interval 41.8 to 46.5)
    for the raw oil, a naphtha substitute after upgrading, and ethane 46.4 for the gas, its model compound; the
    matching of the products to IPCC fuel types is ASSUMED. The two LHVs differ by 4 %, so energy and mass allocation
    give close shares.'
