# plastic-pyrolysis-1's own exchange overrides for the Atlas LCI build (ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json.
# - The waste feed is `free` in the dataset (burden-free under cut-off), so it needs no mapping.
# - Electricity links by the dataset's `link.factor`.
# - The char stays a reported gap: its fate (landfill or energy recovery) is not decided, and the
#   cut-off model treats the two differently (docs/system-model.md section 3).
# - No Atlas process consumes the oil yet: a naphtha cracker or an upgrading step would link to
#   product:plastic-pyrolysis-oil explicitly once one exists.
schema: cheme-as-code/lci-process-mappings/v1
exchanges: {}
