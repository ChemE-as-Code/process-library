# Zones of the pilot skids (#330, DESIGN.md D-019). Schema: `cheme schema zones`.
# Screening only, ASSUMED: the volumes from sources are sized by cheme-as-code's indicative
# radius table, not by an area classification. The cathode gas is about 56 mol% H2 with CO and
# CO2 (process/flowsheet.yaml), the PSA product is CO: both flammable (CO also toxic). The
# host site's classification (IEC 60079-10-1) replaces these, made or reviewed by a competent
# person (skill area-classification); the gas detection and the extract fan K-x41 of
# control/cause-effect.yaml are not credited here.
schema: cheme/zones/v1
zones:
  # ---- hydrogen and carbon monoxide, secondary grade sources: zone 2
  - id: Z-HAZ-A
    title: "Skid A cathode gas train: stacks, separator, compressor, PSA and tail-gas oxidiser"
    kind: hazardous
    zone: 2
    sources:
      - {item: E-101A, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: E-101B, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: E-101C, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: E-101D, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: V-121, release_grade: secondary, substance: hydrogen, source_kind: flange}
      # a diaphragm compressor has no shaft seal on the gas side: its flanges and valve heads
      - {item: K-131, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: X-131, release_grade: secondary, substance: carbon monoxide, source_kind: flange, substance_class: flammable_gas}
      - {item: X-132, release_grade: secondary, substance: hydrogen, source_kind: flange}
    basis: "Flanged and sealed parts of the H2-rich cathode gas and of the CO product leak only on failure (secondary grade); screening radius of the package table, ASSUMED (D-019)."
  - id: Z-HAZ-B
    title: "Skid B cathode gas train: stacks, separator, compressor, PSA and tail-gas oxidiser"
    kind: hazardous
    zone: 2
    sources:
      - {item: E-201A, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: E-201B, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: E-201C, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: E-201D, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: V-221, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: K-231, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: X-231, release_grade: secondary, substance: carbon monoxide, source_kind: flange, substance_class: flammable_gas}
      - {item: X-232, release_grade: secondary, substance: hydrogen, source_kind: flange}
    basis: "As Z-HAZ-A, for Skid B (D-019)."
  # ---- crane pads and laydown areas of the lifting study (DESIGN.md D-043), ASSUMED
  # The skids are set and removed as 20 ft units by a mobile crane standing on the access road
  # R-1, the only way in: the utility rack PR-1 (2.8 m tier) runs between the road and both skids
  # along the whole plot, so no vehicle reaches the skids' side of it. The pads' reach is the
  # package default (crane_reach_m 30 m, ASSUMED); outrigger spread and ground bearing are the
  # lifting plan's. A pad and the road laydown close the road while a lift is made.
  - {id: CP-A, title: "Crane pad on the road south of Skid A", kind: crane_pad, shape: box, box: [4.5, 0.0, 0.0, 12.5, 3.0, 0.3], basis: "ASSUMED: the mobile crane on the road R-1 opposite Skid A, lifting over PR-1 (D-043)."}
  - {id: CP-B, title: "Crane pad on the road south of Skid B", kind: crane_pad, shape: box, box: [19.5, 0.0, 0.0, 27.5, 3.0, 0.3], basis: "ASSUMED: the mobile crane on the road R-1 opposite Skid B, lifting over PR-1 (D-043)."}
  - {id: LD-R, title: "Laydown on the road between the pads (the trailer bed of a skid delivery)", kind: laydown, shape: box, box: [12.7, 0.0, 0.0, 19.3, 3.0, 0.3], basis: "ASSUMED: holds a 20 ft skid (6.06 x 2.44 m) on its trailer or on the road, within reach of both pads (D-043)."}
  - {id: LD-A1, title: "Laydown at grade west of Skid A (reservoir T-101 out and in)", kind: laydown, shape: box, box: [2.2, 7.6, 0.0, 5.3, 10.4, 0.3], basis: "ASSUMED: T-101 is drained and taken out over the frame's west end onto this area (hoist or forklift below heavy_lift_t); it holds the tank of the 10,000 h scenario too (D 2.31 m) (D-043)."}
