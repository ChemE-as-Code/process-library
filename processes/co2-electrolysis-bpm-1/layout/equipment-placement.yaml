  # deck: the tank drains by gravity down to it (D-043). The bottom outlet N11 (the capped camlock
# pump-out PO-201, D-055) at the floor, 0.02 m up, beside the drain
  - {tag: T-201, position: [22.40, 9.10, 0.15], rotation_deg: 270, mount: {structure: SKID-B, level: DECK},
