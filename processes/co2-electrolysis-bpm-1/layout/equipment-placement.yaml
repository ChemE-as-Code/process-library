# Equipment placement of the pilot skids (#330, DESIGN.md D-019, D-047). Schema: `cheme schema placement`.
# Every item but the tail-gas oxidisers stands on the deck of its skid frame
# (layout/structures.yaml, z 0.15 m). No item states a size here: shape and size come from the
# equipment list (the tool-written stacks and tanks of `cheme process stack --write`, the
# ASSUMED outlines of the others), so a regenerated tank is drawn at its new size without an
# edit here (the model's size_from: list).
# Skid A keeps its west end (frame x 0 to 2.44 m) for the reservoir T-101 alone: at 10,000 h
# the tank grows to D 2.31 m (D-009), which still fits the frame width, and no other item
# stands inside that circle.
# Arrangement (ASSUMED, D-047, after the layout review 2026-11-05-layout #1 to #3):
# - the four stacks stand in one row along the frame's SOUTH long side, 0.11 m in from its
#   edge, so that each is reached from grade at the frame edge (its connection end plate 0.29 m
#   from the edge, regen step 13's reach criterion of layout/layout-checks.yaml) and slides out
#   south at deck level onto a deck-height trolley, no hand lift (the deck has no guard rail,
#   D-047). Every stack connection is on its north end plate (anolyte in and out) or on its top
#   (the DN 15 CO2 inlet and cathode gas outlet), so nothing stands between the stack and the
#   person at the edge;
# - west of them on the same south edge the anolyte pump and the cooler (reached from grade, as
#   before), the anolyte headers between the stacks and the middle of the frame;
# - the flammable gas train behind them: separator in the middle, PSA and compressor on the
#   north side;
# - the ignition sources outside zone 2 with the zone radius plus a 0.5 m margin to every source
#   item's outline (regen step 13, layout/layout-checks.yaml): the rectifier U-x01 at the
#   frame's north-east corner, the tail-gas oxidiser X-x32 (an open flame) OFF the frame, on its
#   own plinth at grade east of it (no position on the frame meets that clearance beside the
#   stack row, D-047). The skid is open and naturally ventilated: no enclosure and no extract
#   fan (D-050; the fan K-x41 that stood between them is deleted).
schema: cheme/placement/v1
equipment:
  # -- Skid A (frame SKID-A, origin [5.5, 7.5]) --------------------------------------------
  # the fill (N3) and drain (N5) nozzles face north-west, to the hose connections at the
  # frame's west end and clear of the tank's ladder (at 200 degrees). The level (N6, LT-101 of
  # LIA-101) and pH (N7, AT-101 of AI-101) connections face north-east and south-east: their
  # transmitter stands, which the model puts 0.6 m out from the flange, stand apart (from the
  # P&ID side both stood on one spot), inside the frame, clear of X-131, P-101 and the pump
  # suction (D-040). The drain (N5) and the pump suction (N4, east to P-101) stand 0.15 m above
  # the tank floor, at the pump suction's 0.30 m: the suction and the drain line run level and
  # the drain empties by gravity to its hose coupling down to that level; what stays below it
  # is the heel of the drained lifts (D-043). The bottom outlet N11 (DN 15, the capped camlock
# pump-out PO-101 of P&ID revision B, D-055) stands at the floor, 0.03 m up, facing west-north-
# west beside the drain towards the hose station
  - {tag: T-101, position: [6.75, 8.72, 0.15], mount: {structure: SKID-A, level: DECK},
     nozzles: [{id: N3, angle_deg: 145, elevation: 1.174}, {id: N5, angle_deg: 145, elevation: 0.15},
               {id: N4, angle_deg: 0, elevation: 0.15},
               {id: N6, angle_deg: 40}, {id: N7, angle_deg: 320},
               {id: N11, angle_deg: 165, elevation: 0.03}]}
  - {tag: P-101, position: [7.93, 7.80, 0.15], mount: {structure: SKID-A, level: DECK}}
  # the anolyte enters the cooler at its upper west connection (N1) and leaves at its lower
  # east connection (N2) at the supply header's 0.225 m: no pipe of the supply rises above the
  # cooler (its top channel is the loop's high point: the capped vent N5, AV-111, on its top, P&ID
# revision B, D-055)
  - {tag: E-111, position: [8.53, 7.80, 0.15], mount: {structure: SKID-A, level: DECK},
     nozzles: [{id: N1, face: front, offset: [0, 0.15]}, {id: N2, face: back, offset: [0, -0.15]},
               {id: N5, face: top, offset: [0, 0]}]}
  - {tag: E-101A, position: [9.30, 7.70, 0.15], rotation_deg: 90, mount: {structure: SKID-A, level: DECK},
