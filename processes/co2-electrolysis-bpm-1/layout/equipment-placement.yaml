  - {tag: U-101, position: [11.20, 9.62, 0.15], mount: {structure: SKID-A, level: DECK}}
  # the tail-gas oxidiser, an open flame: off the frame on a 0.15 m plinth at grade east of it,
  # beyond the east access step ST-A2 and 3 m or more from every source item (D-047); its flue
  # leaves its top, straight up
