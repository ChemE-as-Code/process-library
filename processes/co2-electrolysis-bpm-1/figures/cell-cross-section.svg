<text x="315" y="76" font-size="11" text-anchor="middle" font-weight="normal" fill="#555">DC supply: electrons to the cathode</text>
<text x="321" y="142" font-size="11" text-anchor="middle" font-weight="normal" fill="#8a2e2e">junction: H2O -&gt; H+ + OH-</text>
<line x1="318" y1="205" x2="262" y2="205" stroke="#b03030" stroke-width="1.6" marker-end="url(#head-b03030)"/>
<text x="292" y="199" font-size="12" text-anchor="middle" font-weight="normal" fill="#b03030">H+</text>
<line x1="324" y1="233" x2="380" y2="233" stroke="#1f5f99" stroke-width="1.6" marker-end="url(#head-1f5f99)"/>
<text x="352" y="227" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f5f99">OH-</text>
<line x1="470" y1="290" x2="270" y2="290" stroke="#2e7d32" stroke-width="1.3" marker-end="url(#head-2e7d32)"/>
<text x="520" y="294" font-size="11" text-anchor="middle" font-weight="normal" fill="#2e7d32">K+</text>
<line x1="262" y1="320" x2="468" y2="320" stroke="#2e7d32" stroke-width="1.3" marker-end="url(#head-2e7d32)"/>
<text x="535" y="324" font-size="11" text-anchor="middle" font-weight="normal" fill="#2e7d32">HCO3- / CO3--</text>
<text x="535" y="346" font-size="10" text-anchor="middle" font-weight="normal" fill="#2e7d32">co-ion leaks</text>
<text x="105" y="210" font-size="11" text-anchor="middle" font-weight="bold" fill="black">cathode:</text>
<text x="105" y="226" font-size="10" text-anchor="middle" font-weight="normal" fill="black">CO2 + 2 H+ + 2 e-</text>
<text x="105" y="240" font-size="10" text-anchor="middle" font-weight="normal" fill="black">-&gt; CO + H2O</text>
<text x="105" y="258" font-size="10" text-anchor="middle" font-weight="normal" fill="black">2 H+ + 2 e- -&gt; H2</text>
<text x="535" y="210" font-size="11" text-anchor="middle" font-weight="bold" fill="black">anode:</text>
<text x="535" y="226" font-size="10" text-anchor="middle" font-weight="normal" fill="black">4 OH- -&gt; O2</text>
<text x="535" y="240" font-size="10" text-anchor="middle" font-weight="normal" fill="black">+ 2 H2O + 4 e-</text>
<path d="M170,448 L170,456 L268,456 L268,448" fill="none" stroke="#333"/>
<text x="219.0" y="472" font-size="12" text-anchor="middle" font-weight="bold" fill="black">gas-diffusion cathode</text>
<text x="219.0" y="486" font-size="11" text-anchor="middle" font-weight="normal" fill="#444">100 nm Ag sputtered on Sigracet 39BB</text>
<path d="M268,498 L268,506 L374,506 L374,498" fill="none" stroke="#333"/>
<text x="321.0" y="522" font-size="12" text-anchor="middle" font-weight="bold" fill="black">bipolar membrane, reverse bias</text>
<text x="321.0" y="536" font-size="11" text-anchor="middle" font-weight="normal" fill="#444">Fumasep FBM</text>
<line x1="105" y1="540" x2="105" y2="444" stroke="black" stroke-width="1.6" marker-end="url(#head-black)"/>
<text x="105" y="556" font-size="11" text-anchor="middle" font-weight="normal" fill="black">CO2 feed</text>
<text x="105" y="570" font-size="10" text-anchor="middle" font-weight="normal" fill="#444">humidified CO2, 50 sccm</text>
<line x1="105" y1="146" x2="105" y2="106" stroke="black" stroke-width="1.6" marker-end="url(#head-black)"/>
<text x="115" y="120" font-size="11" text-anchor="start" font-weight="normal" fill="black">CO, H2,</text>
<text x="115" y="134" font-size="11" text-anchor="start" font-weight="normal" fill="black">unreacted CO2</text>
<rect x="690" y="210" width="170" height="170" fill="#dfeef7" stroke="#333"/>
<text x="775.0" y="232" font-size="12" text-anchor="middle" font-weight="bold" fill="black">anolyte reservoir</text>
<text x="775.0" y="250" font-size="10" text-anchor="middle" font-weight="normal" fill="black">90 mL, KOH 0.1-3 M or CsOH 1 M</text>
<text x="775.0" y="266" font-size="10" text-anchor="middle" font-weight="normal" fill="black">recirculated 20 mL/min</text>
<text x="775.0" y="298" font-size="10" text-anchor="middle" font-weight="normal" fill="#444">OH- is consumed at the anode</text>
<text x="775.0" y="312" font-size="10" text-anchor="middle" font-weight="normal" fill="#444">and resupplied by the BPM at the</text>
<text x="775.0" y="326" font-size="10" text-anchor="middle" font-weight="normal" fill="#444">WDE; the shortfall (1 - WDE)</text>
<text x="775.0" y="340" font-size="10" text-anchor="middle" font-weight="normal" fill="#444">lowers the anolyte pH over time</text>
<path d="M535,150 L535,110 L775.0,110 L775.0,208" fill="none" stroke="black" stroke-width="1.2" marker-end="url(#head-black)"/>
<text x="620" y="104" font-size="11" text-anchor="middle" font-weight="normal" fill="black">anolyte + O2</text>
<path d="M775.0,380 L775.0,510 L535,510 L535,442" fill="none" stroke="black" stroke-width="1.2" marker-end="url(#head-black)"/>
<text x="620" y="526" font-size="11" text-anchor="middle" font-weight="normal" fill="black">anolyte return</text>
<text x="450.0" y="612" font-size="10" text-anchor="middle" font-weight="normal" fill="#555">Drawn by scripts/cell_section.py from process/design-basis.yaml. Configuration: Prats Vergel et al., Nat. Chem. Eng. (2025), Methods.</text>
<text x="450.0" y="626" font-size="10" text-anchor="middle" font-weight="normal" fill="#555">CEL / AEL: cation / anion exchange layer of the bipolar membrane.</text>
