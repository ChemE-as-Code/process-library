# Line list. Schema: `cheme schema lines`.
# The lines of the two pilot skids of #330 on P-01 (Skid A, 1xx) and P-02 (Skid B, 2xx), drawn
# by scripts/draft_P-01.py and draft_P-02.py (generated sheets). Each PFD stream of
# process/flowsheet.yaml is one line (its `links`); a manifold to the four stacks is one line to
# the last stack with a branch line to each of the others. Nominal diameters ASSUMED at the
# concept stage (D-017): the anolyte loop DN 25 (11.2 L/min, about 0.3 m/s), the gas and the
# small liquid lines DN 15, the vents DN 25. Revision B (the owner's decisions of 2026-11-06):
# the cooler on a tempered-water unit off the skid (TWS/TWR, D-052, D-056), the tail gas through
# its trip valve, check valve and detonation arrester (TG, D-054), and the drains, vent and
# pump-outs of the anolyte loop and the tanks (DR, AV, PO, D-055), each DN 15, valved and capped.
# Revision C (the design review 2026-11-06-design, D-060 to D-064): the cathode side's relief line
# RL-x01 to a safe location, DN 15; the condensate to a vented collection.
schema: cheme/lines/v1
