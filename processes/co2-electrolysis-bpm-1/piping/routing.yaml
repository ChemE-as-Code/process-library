  # The supply header runs low (0.20 m) 0.145 m south of the stack inlets (y 8.30), fed from
  # the cooler top over the header at 0.90 m and down at its west end; a short stub north to
  # each inlet. The return rises from each outlet to a header at 0.60 m above the outlets
  # (y 8.445), 0.14 m west of the supply stubs. Only the return's last segment, to the
  # reservoir top, is generated: the reservoir's size and nozzles change with the campaign
  # (D-009), so no pinned route ends on T-101 or T-201.
