# Routing intent of the pilot skids (#330, DESIGN.md D-019). Schema: `cheme schema routing`.
# The lines of DN 25 and above are routed (the anolyte loops, the KOH fill, the spent anolyte
# drain, the O2 vents, the oxidiser flues); the DN 15 lines (cathode gas, CO2 feed, cooling
# water, the small liquid lines of Skid B's dosing, make-up and bleed) are not routed at the
# concept stage: skid small bore, run by the skid fabricator (each skipped below with that
# reason). Every rule is ASSUMED (D-019).
schema: cheme/routing/v1
rules:
  # the skid pipe-way: local runs inside a skid 1.0 m above grade (0.85 m above the deck),
  # under the 2.35 m envelope top (ASSUMED)
  local_elevation_m: 1.0
  battery_limits:
    # the KOH fill (once per campaign) and the spent anolyte drain (at the end of the run) are
    # hose connections at the west end of each frame, beside the reservoir, for a road tanker
    # or IBCs on the access road (ASSUMED, D-019); not on the utility rack. The hose couplings
    # stand 0.15 m inside the frame's west edge (x 5.5 and 20.5), so that the hose valves
    # HV-102, HV-103 and HV-203 (0.11 m from their axis to the flange rim) stay inside the
    # frame in plan (D-040; the points stood 0.2 m outside the frame before). On Skid A both
    # couplings stand where the router leaves T-101's fill and drain nozzles (0.3 m out along
    # the nozzles' 145 degree axis, y 9.296), the drain at its nozzle's elevation and the fill
    # at the working height 1.0 m (D-047; it stood at the nozzle's 1.324 m, over the guard rail
    # the 0.15 m deck no longer has): the fill falls 0.32 m to it, the drain runs level at 0.30 m
    # (it rose 0.09 m to a coupling at 0.4 m, so the tank could not drain by gravity below
    # it). Skid B's drain coupling stands on the drain's level run at 0.25 m (it rose from 0.2
    # to 0.4 m). D-040, D-043, D-044
    - {id: BL-A-fill, lines: [KOH-101], point: [5.65, 9.296, 1.0]}
    - {id: BL-A-drain, lines: [SP-101], point: [5.65, 9.296, 0.3]}
    - {id: BL-B-fill, lines: [KOH-201], point: [20.65, 9.55, 0.9]}
    - {id: BL-B-drain, lines: [SP-201], point: [20.65, 8.876, 0.25]}
  vents:
    # the O2 vents of the reservoirs and the oxidiser flues rise until a 1 m sphere around the
    # outlet clears every walking level up to the headroom (ASSUMED radius, until the vent study)
    - {lines: ["O2V-*", "FG-*"], radius_m: 1.0}
lines:
  # -- anolyte manifolds at the stacks, laid out by hand (D-019, D-047, ASSUMED) ------------
  # The stacks stand along the frame's south edge with both anolyte connections on their north
  # end plate (nozzle ends at y 7.955 m). The supply header runs level at 0.225 m (the stack
  # inlets' and the cooler outlet's level) 0.145 m north of the inlets (y 8.10), fed from the
  # cooler's lower east connection at its west end (AN-x03 S1 never rises above the cooler,
  # finding 2026-11-05-layout#4); a short stub south to each inlet. Its east end (stack D's
  # stub) is the loop's low point: the low-point drain DR-x01 (DN 15, P&ID revision B, D-055)
  # leaves a tee on the level header 0.12 m before its turn to stack D (S4 ends at the tee, S5
  # runs on to the stack). The return rises from each outlet to a header at 0.60 m over the outlets (y 7.955)
  # and runs west, over the cooler and the pump, to the reservoir top; only its last segment
  # is generated: the reservoir's size and nozzles change with the campaign (D-009), so no
  # pinned route ends on T-101.
  # the pump discharge to the cooler's upper west connection (0.525 m): up 0.075 m from the
  # pump and one run with the 25 mm offset in it (a skew, the fabricator's single offset, D-044)
  - {line: AN-102, segment: Line_AN102_S1, route: [[7.822, 7.775, 0.45], [7.822, 7.775, 0.525], [8.238, 7.8, 0.525]]}
