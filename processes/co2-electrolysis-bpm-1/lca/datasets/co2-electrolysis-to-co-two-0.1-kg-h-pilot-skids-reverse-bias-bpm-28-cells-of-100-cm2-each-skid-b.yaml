  reason: 'not expressible per case in core 1.5.0 (construction entries select equipment by tag, not by
    case): an open item of #331, not a cut-off by mass; Skid A''s duty-sized reservoir against Skid B''s
    small reservoir and day tank (their volumes in lca/ranking.json) is one of the flows that distinguish
    the skids (DESIGN.md D-026, D-027)'
- key: emission-excluded:anolyte-tanks
  title: storage-tank emissions of T-101, T-201, T-202
  direction: output
