title: CO2 electrolysis to CO, two 0.1 kg/h pilot skids (reverse-bias BPM, 28 cells of 100 cm2 each),
  case skid-b
description: Unallocated foreground LCI of CO2 electrolysis to CO, two 0.1 kg/h pilot skids (reverse-bias
  BPM, 28 cells of 100 cm2 each), case skid-b, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: NL
year: 2026
boundary: gate-to-gate foreground of the plant
technology: CO2 electrolysis to CO in reverse-bias bipolar-membrane cells (Ag gas-diffusion cathode, Ni
  foam anode, KOH anolyte), 28 cells of 100 cm2 in four stacks on a 48 V DC bus at 200 mA/cm2, PSA gas
  conditioning with 0.95 CO2 recycle and tail-gas oxidation; Skid A one 1 M KOH fill per campaign, Skid
  B continuous 5 M KOH dosing, bleed and make-up
