# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# The two CO2-to-CO pilot skids of #330 (DESIGN.md D-007): train A (1xx, Skid A: one 1 M KOH
# fill per campaign, duty D-A) and train B (2xx, Skid B: continuous 5 M KOH dosing, bleed and
# make-up, duty D-B), each in its own case; the other train is idle (zero flow) there. The
# terminals are shared, with one port per train.
#
# Where the values come from:
# - flows, compositions and duties: scripts/skid_balance.py (library ADR 0027, contract
#   balance-output/1) from core's stack and duty results at the committed horizon, written here
#   by `cheme run scripts/regen.py --duration H` (step 9, targeted edits): provenance assumed,
#   source "scripts/skid_balance.py: ..."; never edit them by hand;
# - KOH-FILL and SPENT are the initial fill and the final inventory of the campaign, each over
#   the horizon (campaign-averaged streams, D-011); the anolyte loop is at the campaign's mean
#   state;
# - temperatures and pressures are design choices, ASSUMED (D-012);
# - the gas conditioning (V-x21, K-x31, PSA X-x31, oxidiser X-x32) is a black box (D-012).
# The cell is not linked to a stack step: the idle train's case has zero flow (D-007).
schema: cheme/process/v1
kind: flowsheet
title: "CO2 electrolysis to CO, two 0.1 kg/h pilot skids (reverse-bias BPM, 28 cells of 100 cm2 each)"
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - id: skid-a
    description: "Skid A runs: 4 x 7 cells at 200 mA/cm2 on one fill of 1 M KOH that lasts the campaign (duty D-A); train B idle"
    default: true
    capacity: "0.100 kg/h CO, >=99 mol% dry, 5.0 bar(a)"
    provenance: calculated
    applicability: {range: "200 mA/cm2, 25 C, fresh 1 M KOH", source: "the measured series, experiments/electrochemistry/rbpm-1m-koh.yaml", limitations: "5 to 100 cm2 scale-up and campaign duration extrapolated"}
    source: scripts/skid_balance.py
  - id: skid-b
    description: "Skid B runs: 4 x 7 cells at 200 mA/cm2 on 50 L held at 0.5 mol/L OH- by continuous 5 M KOH dosing, bleed and make-up (duty D-B); train A idle"
    capacity: "0.100 kg/h CO, >=99 mol% dry, 5.0 bar(a)"
    provenance: calculated
    applicability: {range: "200 mA/cm2, 25 C, fresh 1 M KOH", source: "the measured series, experiments/electrochemistry/rbpm-1m-koh.yaml", limitations: "5 to 100 cm2 scale-up and campaign duration extrapolated"}
    source: scripts/skid_balance.py
# balances: |in - out| <= abs + rel * max(in, out), kg/h. Tight: the default abs 1.0 kg/h would
# hide every flow of a 0.1 kg/h skid (library ADR 0027 check, D-012)
tolerance: {abs: 1.0e-5, rel: 1.0e-4}

feeds:
  - id: CO2
    title: "Liquefied CO2 (merchant, ASSUMED fossil by-product, D-016)"
    category: raw_material
    ports:
      - {id: a, direction: out}
      - {id: b, direction: out}
  - id: KOH-FILL
    title: "1 M KOH fill (campaign-averaged, D-011)"
    category: raw_material
    ports:
      - {id: a, direction: out}
      - {id: b, direction: out}
  - id: KOH-DOSE
    title: "5 M KOH solution (Skid B dosing)"
    category: raw_material
    ports:
      - {id: b, direction: out}
  - id: WATER
    title: "Demineralised water (humidification, make-up)"
    category: raw_material
    ports:
      - {id: hum_a, direction: out}
      - {id: hum_b, direction: out}
      - {id: makeup_b, direction: out}
  - id: AIR
    title: "Air to the tail-gas oxidiser"
    category: raw_material
    ports:
      - {id: a, direction: out}
      - {id: b, direction: out}
  - id: POWER
    title: "Electric power (AC, grid)"
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: stk_a, direction: out, kind: energy}
      - {id: p101, direction: out, kind: energy}
      - {id: k131, direction: out, kind: energy}
      - {id: x131, direction: out, kind: energy}
      - {id: stk_b, direction: out, kind: energy}
      - {id: p201, direction: out, kind: energy}
      - {id: k231, direction: out, kind: energy}
      - {id: x231, direction: out, kind: energy}
      - {id: p202, direction: out, kind: energy}
products:
  - id: CO
    title: "CO product, >=0.99 mol/mol dry, 5.0 bar(a)"
    category: product
    ports:
      - {id: a, direction: in}
      - {id: b, direction: in}
  - id: VENT
    title: "Oxidiser flue gas to air"
    category: emission
    ports:
      - {id: a, direction: in}
      - {id: b, direction: in}
  - id: O2VENT
    title: "Anode O2 vented from the reservoir"
    category: emission
    ports:
      - {id: a, direction: in}
      - {id: b, direction: in}
  - id: BLEED
    title: "Anolyte bleed to the site effluent (Skid B)"
    category: wastewater
    ports:
      - {id: b, direction: in}
  - id: SPENT
    title: "Spent anolyte at the end of the campaign (campaign-averaged, D-011)"
    category: wastewater
    ports:
      - {id: a, direction: in}
      - {id: b, direction: in}
  - id: CONDENSATE
    title: "Cathode condensate with carbonate to the site effluent"
    category: wastewater
    ports:
      - {id: a, direction: in}
      - {id: b, direction: in}
  - id: CW
    title: "Cooling water return"
    category: utility
    utility: {kind: cooling_water, supply_temperature: {value: 293.15, provenance: assumed, source: "ASSUMED site cooling water, D-012"}, return_temperature: {value: 298.15, provenance: assumed, source: "ASSUMED, D-012"}, min_approach: {value: 3, provenance: assumed, source: "ASSUMED plate exchanger, D-012"}}
    ports:
      - {id: e111, direction: in, kind: energy}
      - {id: e211, direction: in, kind: energy}
blocks:
  - id: ELA
    title: "Skid A: stacks and anolyte loop"
    class: ReactingChemicals
    ports:
      - {id: co2, direction: in}
      - {id: water, direction: in}
      - {id: recycle, direction: in}
      - {id: cathode, direction: out}
      - {id: o2, direction: out}
      - {id: fill, direction: in}
      - {id: spent, direction: out}
      - {id: power_stk, direction: in, kind: energy}
      - {id: power_pump, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: GCA
    title: "Skid A: cathode gas conditioning (black box, D-012)"
    class: Separating
    ports:
      - {id: gas, direction: in}
      - {id: recycle, direction: out}
      - {id: condensate, direction: out}
      - {id: product, direction: out}
      - {id: air, direction: in}
      - {id: flue, direction: out}
      - {id: power_k, direction: in, kind: energy}
      - {id: power_psa, direction: in, kind: energy}
  - id: ELB
    title: "Skid B: stacks and anolyte loop"
    class: ReactingChemicals
    ports:
      - {id: co2, direction: in}
      - {id: water, direction: in}
      - {id: recycle, direction: in}
      - {id: cathode, direction: out}
      - {id: o2, direction: out}
      - {id: fill, direction: in}
      - {id: spent, direction: out}
      - {id: dose, direction: in}
      - {id: makeup, direction: in}
      - {id: bleed, direction: out}
      - {id: power_stk, direction: in, kind: energy}
      - {id: power_pump, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: power_dose, direction: in, kind: energy}
  - id: GCB
    title: "Skid B: cathode gas conditioning (black box, D-012)"
    class: Separating
    ports:
      - {id: gas, direction: in}
      - {id: recycle, direction: out}
      - {id: condensate, direction: out}
      - {id: product, direction: out}
      - {id: air, direction: in}
      - {id: flue, direction: out}
      - {id: power_k, direction: in, kind: energy}
      - {id: power_psa, direction: in, kind: energy}
steps:
  # Skid A: stacks, anolyte loop
  - id: E101
    block: ELA
    title: "Skid A electrolysis stacks, 4 x 7 cells of 100 cm2 (CO2R, WS; co-ion leak as CARB)"
    class: ReactingChemicals
    reactions: [CO2R, WS, CARB]
    links: [{target: equipment, ref: E-101A}, {target: equipment, ref: E-101B}, {target: equipment, ref: E-101C}, {target: equipment, ref: E-101D}]
    ports:
      - {id: co2, direction: in, delegates: co2}
      - {id: recycle, direction: in, delegates: recycle}
      - {id: water, direction: in, delegates: water}
      - {id: anolyte_in, direction: in}
      - {id: anolyte_out, direction: out}
      - {id: cathode, direction: out, delegates: cathode}
      - {id: power, direction: in, kind: energy, delegates: power_stk}
  - id: T101
    block: ELA
    title: "Skid A anolyte reservoir (one fill per campaign)"
    class: StoringInTank
    links: [{target: equipment, ref: T-101}]
    ports:
      - {id: ret, direction: in}
      - {id: fill, direction: in, delegates: fill}
      - {id: out, direction: out}
      - {id: vent, direction: out, delegates: o2}
      - {id: spent, direction: out, delegates: spent}
  - id: P101
    block: ELA
    title: "Skid A anolyte recirculation pump"
    class: Pumping
    links: [{target: equipment, ref: P-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power_pump}
  - id: E111
    block: ELA
    title: "Skid A anolyte cooler"
    class: Cooling
    links: [{target: equipment, ref: E-111}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  # Skid A: cathode gas conditioning (D-012)
  - id: V121
    block: GCA
    title: "Skid A cathode gas separator"
    class: SeparatingByPhaseSeparation
    links: [{target: equipment, ref: V-121}]
    ports:
      - {id: in, direction: in, delegates: gas}
      - {id: gas, direction: out}
      - {id: liquid, direction: out, delegates: condensate}
  - id: K131
    block: GCA
    title: "Skid A cathode gas compressor to 6 bar(a)"
    class: Compressing
    links: [{target: equipment, ref: K-131}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power_k}
  - id: X131
    block: GCA
    title: "Skid A CO PSA (black box)"
    class: Adsorbing
    links: [{target: equipment, ref: X-131}]
    ports:
      - {id: in, direction: in}
      - {id: product, direction: out, delegates: product}
      - {id: recycle, direction: out, delegates: recycle}
      - {id: tail, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power_psa}
  - id: X132
    block: GCA
    title: "Skid A tail-gas oxidiser"
    class: ReactingChemicals
    reactions: [COX, HOX]
    links: [{target: equipment, ref: X-132}]
    ports:
      - {id: tail, direction: in}
      - {id: air, direction: in, delegates: air}
      - {id: flue, direction: out, delegates: flue}
  # Skid B: stacks, anolyte loop, dosing
  - id: E201
    block: ELB
    title: "Skid B electrolysis stacks, 4 x 7 cells of 100 cm2 (CO2R, WS; co-ion leak as CARB)"
    class: ReactingChemicals
    reactions: [CO2R, WS, CARB]
    links: [{target: equipment, ref: E-201A}, {target: equipment, ref: E-201B}, {target: equipment, ref: E-201C}, {target: equipment, ref: E-201D}]
    ports:
      - {id: co2, direction: in, delegates: co2}
      - {id: recycle, direction: in, delegates: recycle}
      - {id: water, direction: in, delegates: water}
      - {id: anolyte_in, direction: in}
      - {id: anolyte_out, direction: out}
      - {id: cathode, direction: out, delegates: cathode}
      - {id: power, direction: in, kind: energy, delegates: power_stk}
  - id: T201
    block: ELB
    title: "Skid B anolyte reservoir (dosed, bled)"
    class: StoringInTank
    links: [{target: equipment, ref: T-201}]
    ports:
      - {id: ret, direction: in}
      - {id: fill, direction: in, delegates: fill}
      - {id: out, direction: out}
      - {id: vent, direction: out, delegates: o2}
      - {id: spent, direction: out, delegates: spent}
      - {id: dose, direction: in}
      - {id: makeup, direction: in, delegates: makeup}
      - {id: bleed, direction: out, delegates: bleed}
  - id: P201
    block: ELB
    title: "Skid B anolyte recirculation pump"
    class: Pumping
    links: [{target: equipment, ref: P-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power_pump}
  - id: E211
    block: ELB
    title: "Skid B anolyte cooler"
    class: Cooling
    links: [{target: equipment, ref: E-211}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: T202
    block: ELB
    title: "Skid B 5 M KOH day tank"
    class: StoringInTank
    links: [{target: equipment, ref: T-202}]
    ports:
      - {id: in, direction: in, delegates: dose}
      - {id: out, direction: out}
  - id: P202
    block: ELB
    title: "Skid B KOH dosing pump"
    class: Pumping
    links: [{target: equipment, ref: P-202}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power_dose}
  # Skid B: cathode gas conditioning (D-012)
  - id: V221
    block: GCB
    title: "Skid B cathode gas separator"
    class: SeparatingByPhaseSeparation
    links: [{target: equipment, ref: V-221}]
    ports:
      - {id: in, direction: in, delegates: gas}
      - {id: gas, direction: out}
      - {id: liquid, direction: out, delegates: condensate}
  - id: K231
    block: GCB
    title: "Skid B cathode gas compressor to 6 bar(a)"
    class: Compressing
    links: [{target: equipment, ref: K-231}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power_k}
  - id: X231
    block: GCB
    title: "Skid B CO PSA (black box)"
    class: Adsorbing
    links: [{target: equipment, ref: X-231}]
    ports:
      - {id: in, direction: in}
      - {id: product, direction: out, delegates: product}
      - {id: recycle, direction: out, delegates: recycle}
      - {id: tail, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power_psa}
  - id: X232
    block: GCB
    title: "Skid B tail-gas oxidiser"
    class: ReactingChemicals
    reactions: [COX, HOX]
    links: [{target: equipment, ref: X-232}]
    ports:
      - {id: tail, direction: in}
      - {id: air, direction: in, delegates: air}
      - {id: flue, direction: out, delegates: flue}
streams:
  # -- train A ------------------------------------------------------------------------
  - id: S101
    links: [{target: line, ref: CO2-101, sheet: P-01}]
    title: "Fresh CO2 to the cathode"
    from: CO2.a
    to: E101.co2
    template: co2-feed
    state:
      skid-a: {pressure: {value: 120, provenance: assumed, source: "ASSUMED design condition (DESIGN.md D-012)"}, temperature: {value: 298.15, provenance: assumed, source: "ASSUMED design condition (DESIGN.md D-012)"}, flow: {value: 0.3563130156, basis: mass, provenance: assumed, source: "scripts/skid_balance.py: duty D-A (run 72329dd4b8605abe) at 7 x 4 over 1000 h: CO2 fed 74.9533 mol/h (10 sccm/cm2) less the recycle"}, composition: {basis: mass_fraction, values: {CO2: 1.0}, provenance: assumed, source: "scripts/skid_balance.py: duty D-A (run 72329dd4b8605abe) at 7 x 4 over 1000 h: CO2 fed 74.9533 mol/h (10 sccm/cm2) less the recycle"}}
      skid-b: {pressure: {value: 120, provenance: assumed, source: "ASSUMED design condition (DESIGN.md D-012)"}, temperature: {value: 298.15, provenance: assumed, source: "ASSUMED design condition (DESIGN.md D-012)"}, flow: {value: 0.0, basis: mass, provenance: assumed, source: "scripts/skid_balance.py: the train is idle in this case (D-007)"}, composition: {basis: mass_fraction, values: {CO2: 1.0}, provenance: assumed, source: "scripts/skid_balance.py: the train is idle in this case (D-007)"}}
  - id: S102
    links: [{target: line, ref: W-101, sheet: P-01}]
    title: "Humidification water to the cathode feed"
    from: WATER.hum_a
    to: E101.water
    template: water
    state:
      skid-a: {pressure: {value: 300, provenance: assumed, source: "ASSUMED design condition (DESIGN.md D-012)"}, temperature: {value: 298.15, provenance: assumed, source: "ASSUMED design condition (DESIGN.md D-012)"}, flow: {value: 0.2612151221, basis: mass, provenance: assumed, source: "scripts/skid_balance.py: duty D-A (run 72329dd4b8605abe) at 7 x 4 over 1000 h: water to the humidifier, ASSUMED to cover the cathode's (hydrogen evolution, saturation, condensate)"}, composition: {basis: mass_fraction, values: {H2O: 1.0}, provenance: assumed, source: "scripts/skid_balance.py: duty D-A (run 72329dd4b8605abe) at 7 x 4 over 1000 h: water to the humidifier, ASSUMED to cover the cathode's (hydrogen evolution, saturation, condensate)"}}
      skid-b: {pressure: {value: 300, provenance: assumed, source: "ASSUMED design condition (DESIGN.md D-012)"}, temperature: {value: 298.15, provenance: assumed, source: "ASSUMED design condition (DESIGN.md D-012)"}, flow: {value: 0.0, basis: mass, provenance: assumed, source: "scripts/skid_balance.py: the train is idle in this case (D-007)"}, composition: {basis: mass_fraction, values: {H2O: 1.0}, provenance: assumed, source: "scripts/skid_balance.py: the train is idle in this case (D-007)"}}
  - id: S103
    links: [{target: line, ref: CO2-102, sheet: P-01}]
    title: "CO2 recycle from the PSA"
    from: X131.recycle
    to: E101.recycle
    template: co2-feed
    state:
      skid-a: {pressure: {value: 120, provenance: assumed, source: "ASSUMED design condition (DESIGN.md D-012)"}, temperature: {value: 298.15, provenance: assumed, source: "ASSUMED design condition (DESIGN.md D-012)"}, flow: {value: 2.942304833, basis: mass, provenance: assumed, source: "scripts/skid_balance.py: duty D-A (run 72329dd4b8605abe) at 7 x 4 over 1000 h: 0.95 of the unreacted CO2 (ASSUMED, D-012)"}, composition: {basis: mass_fraction, values: {CO2: 1.0}, provenance: assumed, source: "scripts/skid_balance.py: duty D-A (run 72329dd4b8605abe) at 7 x 4 over 1000 h: 0.95 of the unreacted CO2 (ASSUMED, D-012)"}}
      skid-b: {pressure: {value: 120, provenance: assumed, source: "ASSUMED design condition (DESIGN.md D-012)"}, temperature: {value: 298.15, provenance: assumed, source: "ASSUMED design condition (DESIGN.md D-012)"}, flow: {value: 0.0, basis: mass, provenance: assumed, source: "scripts/skid_balance.py: the train is idle in this case (D-007)"}, composition: {basis: mass_fraction, values: {CO2: 1.0}, provenance: assumed, source: "scripts/skid_balance.py: the train is idle in this case (D-007)"}}
  - id: S104
    links: [{target: line, ref: CG-101, sheet: P-01}]
    title: "Cathode outlet (gas and condensate)"
    from: E101.cathode
    to: V121.in
    template: cathode-gas
    state:
      skid-a: {pressure: {value: 110, provenance: assumed, source: "ASSUMED design condition (DESIGN.md D-012)"}, temperature: {value: 298.15, provenance: assumed, source: "ASSUMED design condition (DESIGN.md D-012)"}, flow: {value: 3.394668404, basis: mass, provenance: assumed, source: "scripts/skid_balance.py: duty D-A (run 72329dd4b8605abe) at 7 x 4 over 1000 h: CO and H2 at the measured FE, CO2 less the CO, the carbon to the anolyte and the K+ carbonated"}, composition: {basis: mass_fraction, values: {CO: 0.03297218238, CO2: 0.9123609772, H2: 0.003474562131, H2O: 0.0465102226, K2CO3: 0.004682055723}, provenance: assumed, source: "scripts/skid_balance.py: duty D-A (run 72329dd4b8605abe) at 7 x 4 over 1000 h: CO and H2 at the measured FE, CO2 less the CO, the carbon to the anolyte and the K+ carbonated"}}
      skid-b: {pressure: {value: 110, provenance: assumed, source: "ASSUMED design condition (DESIGN.md D-012)"}, temperature: {value: 298.15, provenance: assumed, source: "ASSUMED design condition (DESIGN.md D-012)"}, flow: {value: 0.0, basis: mass, provenance: assumed, source: "scripts/skid_balance.py: the train is idle in this case (D-007)"}, composition: {basis: mass_fraction, values: {CO: 0.03297218238, CO2: 0.9123609772, H2: 0.003474562131, H2O: 0.0465102226, K2CO3: 0.004682055723}, provenance: assumed, source: "scripts/skid_balance.py: the train is idle in this case (D-007)"}}
  - id: S105
    links: [{target: line, ref: CD-101, sheet: P-01}]
    title: "Cathode condensate (carbonate)"
    from: V121.liquid
    to: CONDENSATE.a
    template: condensate
    state:
      skid-a: {pressure: {value: 110, provenance: assumed, source: "ASSUMED design condition (DESIGN.md D-012)"}, temperature: {value: 298.15, provenance: assumed, source: "ASSUMED design condition (DESIGN.md D-012)"}, flow: {value: 0.1308981266, basis: mass, provenance: assumed, source: "scripts/skid_balance.py: duty D-A (run 72329dd4b8605abe) at 7 x 4 over 1000 h: the K+ crossed as K2CO3 at 1 mol/kg (ASSUMED)"}, composition: {basis: mass_fraction, values: {H2O: 0.8785771268, K2CO3: 0.1214228732}, provenance: assumed, source: "scripts/skid_balance.py: duty D-A (run 72329dd4b8605abe) at 7 x 4 over 1000 h: the K+ crossed as K2CO3 at 1 mol/kg (ASSUMED)"}}
      skid-b: {pressure: {value: 110, provenance: assumed, source: "ASSUMED design condition (DESIGN.md D-012)"}, temperature: {value: 298.15, provenance: assumed, source: "ASSUMED design condition (DESIGN.md D-012)"}, flow: {value: 0.0, basis: mass, provenance: assumed, source: "scripts/skid_balance.py: the train is idle in this case (D-007)"}, composition: {basis: mass_fraction, values: {H2O: 0.8785771268, K2CO3: 0.1214228732}, provenance: assumed, source: "scripts/skid_balance.py: the train is idle in this case (D-007)"}}
  - id: S106
    links: [{target: line, ref: CG-102, sheet: P-01}]
    title: "Cathode gas, saturated"
    from: V121.gas
    to: K131.in
