# Simulation specs. Schema: `cheme schema process-simulation`.
# Not run: the flowsheet's values come from scripts/skid_balance.py (the duty results of core,
# DESIGN.md D-011, D-012); `cheme process simulate` is not used for the skids. The file records
# what is decided already: the tail-gas oxidisers X-132 and X-232 are adiabatic. They burn the
# PSA tail gas's CO and H2 with twice the stoichiometric air, and the heat of COX and HOX
# leaves with the flue gas to the vent: no utility serves them, so the LCA's inventory has no
# energy exchange for them (DESIGN.md D-024; the boundary check cheme.boundary-utility-unassigned
# asked for this or an energy stream).
schema: cheme/simulation/v1
kind: simulation
specs:
  X132: {mode: adiabatic}
  X232: {mode: adiabatic}
