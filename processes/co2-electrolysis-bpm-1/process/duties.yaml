# The dynamic duties of the pilot cell against its anolyte reservoir (#330). Schema
# cheme/electrolysis-duties/v1 (`cheme schema process-duties`); `cheme process duty` integrates
# them, `cheme process stack` runs D-A and D-B at the arrangement STK-A and STK-B are sized at.
#
# Values written by tools, never by hand:
# - D-A reservoir.volume: `cheme process stack --write` (reservoir.size: to_horizon, core ADR
#   0044 amendment): the exact volume that reaches the horizon at the pH threshold, rounded up
#   to 4 significant figures;
# - every horizon (D-A, D-B: the campaign H; the comparison duties: 3 H), the D-B dosing, bleed
#   and make-up rates, the comparison duties' reservoir volume and the D-A-PART points:
#   `cheme run scripts/regen.py --duration H` (targeted edits that refuse any other change).
# No YAML anchors: the values are repeated, and scripts/regen.py and the tests assert equality.
#
# The pH threshold is a stated design criterion on a concentration basis, the time to a
# specified pH threshold, not a corrosion onset (DESIGN.md D-003, core ADR 0043).
schema: cheme/electrolysis-duties/v1
kind: electrolysis_duties
duties:
  # Skid A (DESIGN.md D-009): one fill of fresh 1 M KOH that lasts the campaign. No dosing,
  # bleed, make-up or degassing, so the state moves along the charge and the volume that
  # reaches the horizon is exact (V proportional to the campaign, ADR 0043).
  - id: D-A
    title: Skid A, 200 mA/cm2 on one fill of 1 M KOH to the pH threshold
    cell: pilot-cell
    schedule: {kind: constant_current, current_density: {value: 200, unit: mA/cm2}}
    reservoir:
      volume: {value: 1166.0, unit: L, source: "cheme process stack: stack STK-A, duty D-A at 7 cells x 4 stacks: reservoir.size to_horizon: the volume that reaches the horizon 1000 h at the pH threshold 12 (exact 1165.15 L, rounded up to 4 significant figures)"}
      composition: {hydroxide: {value: 1, unit: mol/L}}
      cation: K+
      model: well-mixed-carbonate
      size: to_horizon
    dosing: {kind: none}
    threshold: {ph: 12, source: "process/design-basis.yaml capacity.pilot_skid.threshold (DESIGN.md D-003)"}
    horizon: {value: 1000, unit: h}
    operating_map: {wde: [0.95, 0.99], volume: [10, 20000], volume_unit: L}
    sources: ["DESIGN.md D-009"]
  # Skid B (DESIGN.md D-010): 50 L held at the ASSUMED setpoints 0.5 mol/L OH- and 0.25 mol/L
  # carbon by continuous 5 M KOH dosing, a bleed and make-up water; the rates follow from the
  # steady-state balance (scripts/regen.py). Dosing and bleed are open-loop in the model (the
  # AIC-201 trim is not simulated) and run while the current is on.
  - id: D-B
    title: Skid B, 200 mA/cm2 on 50 L, continuous 5 M KOH dosing, bleed and make-up
    cell: pilot-cell
    schedule: {kind: constant_current, current_density: {value: 200, unit: mA/cm2}}
    reservoir:
      # ASSUMED: about 4.5 min hold-up at the 11.2 L/min recirculation, for O2 disengagement
      volume: {value: 50, unit: L}
      composition: {hydroxide: {value: 1, unit: mol/L}}
      cation: K+
      model: well-mixed-carbonate
    dosing:
      kind: continuous
      concentration: {value: 5, unit: mol/L}
      rate: {value: 0.419178508, unit: L/h}
      density: {value: 1.22, unit: kg/L, source: "ASSUMED about 5 M KOH at 25 °C"}
    bleed: {rate: {value: 1.8660792, unit: L/h}}
    makeup_water: {rate: {value: 1.44690069, unit: L/h}}
    threshold: {ph: 12, source: "process/design-basis.yaml capacity.pilot_skid.threshold (DESIGN.md D-003)"}
    horizon: {value: 1000, unit: h}
    minimum_inventory: {volume: {value: 40, unit: L}}
    sources: ["DESIGN.md D-010"]
  # Comparison duties on Skid A's hardware (DESIGN.md D-013): they name STK-A and run at its
  # arrangement (core ADR 0044 amendment); their reservoir is D-A's volume and their horizon
  # 3 H, so that `cheme process duty --compare` reaches an equal CO target or reports the
  # threshold first.
  - id: D-A-ONOFF
    title: Skid A hardware, on/off 24 h period, half on, 200 mA/cm2 when on
    cell: pilot-cell
    stack: STK-A
    schedule: {kind: on_off, period: {value: 24, unit: h}, duty_fraction: 0.5, current_density: {value: 200, unit: mA/cm2}, start: "on"}
    reservoir:
      volume: {value: 1166.0, unit: L}
      composition: {hydroxide: {value: 1, unit: mol/L}}
      cation: K+
      model: well-mixed-carbonate
    dosing: {kind: none}
    threshold: {ph: 12, source: "process/design-basis.yaml capacity.pilot_skid.threshold (DESIGN.md D-003)"}
    horizon: {value: 3000, unit: h}
    sources: ["DESIGN.md D-013"]
