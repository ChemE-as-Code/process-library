# Process Atlas manifest of co2-electrolysis-bpm-1. Schema: schemas/process.schema.json (cheme-as-code/process/v1).
# plant.yaml stays the engineering manifest; sheets and results are derived from the
# ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: co2-electrolysis-bpm-1
title: CO2 electrolysis to CO in reverse-bias bipolar-membrane cells (measured bench cell, two pilot skids)
summary: >-
  CO2 electrolysis to CO on Ag in reverse-bias bipolar-membrane cells with a KOH anolyte,
  grounded in measured water dissociation efficiencies (Prats Vergel et al., 2025). Concept: the
  measured bench cell and two 0.1 kg/h CO pilot skids for 1,000 and 10,000 h campaigns, one
  KOH fill (too tall for its frame at 10,000 h) against continuous dosing (1.8 times the KOH).
description: |
  The case starts from the experiments of Prats Vergel, Vermaas, Burdyny and colleagues
  (Nature Chemical Engineering 2025; 4TU dataset v1, CC BY 4.0). A 5 cm2 membrane electrode
  assembly reduces humidified CO2 to CO and H2 at a silver gas-diffusion cathode. A Fumasep
  bipolar membrane in reverse bias supplies protons to the cathode and hydroxide to a Ni foam
  anode in a recirculated KOH anolyte. Co-ions leak through it: K+ to the cathode, carbonate
  to the anolyte. That leak, one minus the water dissociation efficiency (WDE), acidifies the
  anolyte over time.

  At this stage the folder holds:
  - the measured cell configuration;
  - the WDE series in 1 M KOH (25 to 250 mA/cm2), rebuilt from the raw titration sheets by
    scripts/adapt_4tu.py;
  - the measured series of the same 18 runs (cell voltage, CO and H2 Faradaic efficiency, WDE),
    rebuilt from the raw chronopotentiometry, flow-meter, GC and titration files
    (experiments/electrochemistry/rbpm-1m-koh.yaml);
  - the cell balance of the bench cell at 200 mA/cm2 on those measurements (process/cells.yaml);
  - a labelled cell cross-section;
  - two pilot skids of 0.100 kg/h CO (#330), each four stacks of seven 100 cm2 cells on a 48 V
    bus: Skid A on one fill of 1 M KOH sized to reach pH 12 at the end of the campaign, Skid B
    on 50 L held steady by continuous 5 M KOH dosing, bleed and make-up; their duties, stacks,
    flowsheet (two trains, two cases), P&IDs, lists, control, layout and the calculation
    records of the 1,000 h and 10,000 h scenarios, all regenerated by scripts/regen.py.

  Every skid number rests on ASSUMED inputs (product duty, recovery, envelope, setpoints) and on
  the 1 h measurements in fresh 1 M KOH held over the whole campaign by assumption.

  The independent reproduction of the published series and model is a separate, held-out
  benchmark (benchmarks/reproductions/vermaas-rbpm-wde, ADR 0030 and 0032). The LCI and a
  climate-change screening of both skids per kg CO delivered (#331, part of it; tracker core#136)
  are in lca/: the unallocated datasets of both designs, reconciled with the duty totals, and the
  gaps that leave the comparison of the skids open.
families: [electrolysis]
keywords: [CO2 electrolysis, CO2 reduction, carbon monoxide, bipolar membrane, reverse bias, water dissociation efficiency, MEA, gas diffusion electrode, silver catalyst, KOH anolyte, nickel anode, anolyte acidification]
facets:
  # The carbon basis: the CO2 of the pilot skids is merchant liquefied CO2 from a fossil
  # industrial by-product (ASSUMED, an owner decision: DESIGN.md D-016).
  feedstock_basis: [fossil, water, electricity]
  product_classes: [industrial-gases, chemicals]
  unit_operations: [electrolysis, adsorption]
  region: generic
# Honest claim: a measured bench cell and concept designs of two pilot skids on ASSUMED inputs.
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Measured data and a cell balance on them. The WDE series and the measured series (voltage,
    Faradaic efficiencies) are calculated from the pinned raw files with the paper's equations
    and SI Note 5 (DESIGN.md D-002, D-005) and are not compared with anything in this folder. A held-out reproduction in benchmarks/reproductions/vermaas-rbpm-wde/
    compares the series with the published values (ADR 0032); its result is not validation of
    this design. The bench cell's Faraday balance (process/cells.yaml, D-006) is bookkeeping on
    the measured values. The pilot skids (#330) are sized by core's stack and duty tools on those
    values; their results are compared with hand expectations frozen before the first run
    (results/expected.yaml, tests/test_co2_electrolysis_bpm_skids.py), not with plant data, and
    FE, WDE and U are held constant over campaigns 1,000 to 10,000 times longer than measured.
    Not reviewed.
chemistry:
  inputs:
    - {chemical: carbon-dioxide, role: feedstock, inventory_key: "feed:CO2", note: "humidified CO2 to the cathode at 10 sccm/cm2; pilot skids: merchant liquefied CO2, fossil by-product (ASSUMED, D-016), 0.95 of the unreacted CO2 recycled by the PSA: 3.54 kg fed per kg CO"}
    - {chemical: potassium-hydroxide, role: feedstock, inventory_key: "feed:KOH-FILL", note: "anolyte fill, counted as 1 M KOH solution (lca/mappings.yaml): Skid A one fill per campaign (0.65 kg KOH per kg CO), Skid B its 50 L (0.028 kg per kg CO at 1,000 h)"}
    - {chemical: potassium-hydroxide, role: feedstock, inventory_key: "feed:KOH-DOSE", note: "Skid B's continuous dosing, counted as 5 M KOH solution (lca/mappings.yaml): 1.17 kg KOH per kg CO"}
    - {chemical: water, role: feedstock, inventory_key: "feed:WATER", note: "humidification and Skid B's anolyte make-up"}
  outputs:
    - {chemical: carbon-monoxide, role: main-product, inventory_key: "product:CO", note: "0.100 kg/h at >= 0.99 mol/mol dry and 5.0 bar(a) at the skid boundary (ASSUMED pilot duty, D-008); the LCA's functional unit is 1 kg of the contained CO (D-024)"}
    - {chemical: hydrogen, role: co-product, note: "competing hydrogen evolution at the cathode; burnt with the PSA tail gas in the skids' oxidiser (D-012), so no product in the LCA (allocation none, D-024; recovering it is a sensitivity)"}
    - {chemical: oxygen, role: co-product, note: "anode product, vented from the anolyte reservoir: an emission without burden or credit in the LCA (D-024)"}
    - {chemical: wastewater, role: waste, inventory_key: "product:SPENT", note: "the spent anolyte at the end of a campaign (KOH and K2CO3), hazardous alkaline waste to neutralisation (D-024)"}
    - {chemical: wastewater, role: waste, inventory_key: "product:BLEED", note: "Skid B's anolyte bleed (KOH and K2CO3) to the site effluent after neutralisation (D-024)"}
    - {chemical: wastewater, role: waste, inventory_key: "product:CONDENSATE", note: "the cathode condensate with the K+ crossed as K2CO3 (D-024)"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "AC to the rectifiers (DC to the cells over 0.95) and the auxiliaries: 34.6 kWh per kg CO"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "the stack heat to the site cooling water (kWh)"}
references:
  - {title: "Prats Vergel, G., Mu, H., Kolobov, N., Biemolt, J., Vermaas, D.A., Burdyny, T. (2025) Water dissociation efficiencies control the viability of reverse-bias bipolar membranes for CO2 electrolysis. Nature Chemical Engineering", doi: 10.1038/s44286-025-00306-7}
  - {title: "Prats Vergel, G. et al. (2025) Data underlying the publication: Water Dissociation Efficiencies control the viability of reverse-bias bipolar membranes for CO2 electrolysis. 4TU.ResearchData, version 1 (CC BY 4.0)", doi: 10.4121/5c4fc325-a71b-4ca8-9c1b-01c0405936a2.v1}
lca:
  source: auto
  notes: >-
    #331: a partial screening carbon footprint (climate change only) of Skid A (lca/dataset.yaml)
    and Skid B (lca/datasets/, case skid-b) per kg CO delivered, on open profiles (Ember 2025 NL
    grid, DESNZ 2026 water); KOH (with its solutions' dilution water), CO2 supply, the anolyte
    wastes (their carbonate's fossil CO2, released when neutralised, included), the cooling water
    service, the stack parts (membrane, Ag, carbon paper, Ni foam) and construction are gaps, so
    the A against B ranking is not determined (DESIGN.md D-024 to D-027).
