# Process Atlas manifest of co2-electrolysis-bpm-1. Schema: schemas/process.schema.json (cheme-as-code/process/v1).
# plant.yaml stays the engineering manifest; sheets and results are derived from the
# ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: co2-electrolysis-bpm-1
title: CO2 electrolysis to CO in a reverse-bias bipolar-membrane cell (measured bench cell; pilot skid planned)
summary: >-
  CO2 electrolysis to carbon monoxide on Ag in a zero-gap cell with a reverse-bias bipolar
  membrane and a recirculated KOH anolyte, grounded in the measured water dissociation
  efficiencies of Prats Vergel et al. (2025). Concept stage: the measured bench cell and its WDE
  series; pilot-skid designs and LCA follow.
description: |
  The case starts from the experiments of Prats Vergel, Vermaas, Burdyny and colleagues
  (Nature Chemical Engineering 2025; 4TU dataset v1, CC BY 4.0). A 5 cm2 membrane electrode
  assembly reduces humidified CO2 to CO and H2 at a silver gas-diffusion cathode. A Fumasep
  bipolar membrane in reverse bias supplies protons to the cathode and hydroxide to a Ni foam
  anode in a recirculated KOH anolyte. Co-ions leak through it: K+ to the cathode, carbonate
  to the anolyte. That leak, one minus the water dissociation efficiency (WDE), acidifies the
  anolyte over time.

  At this stage the folder holds:
  - the measured cell configuration;
  - the WDE series in 1 M KOH (25 to 250 mA/cm2), rebuilt from the raw titration sheets by
    scripts/adapt_4tu.py;
  - a labelled cell cross-section.

  The independent reproduction of the published series and model is a separate, held-out
  benchmark (benchmarks/reproductions/vermaas-rbpm-wde, ADR 0030 and 0031). Faradaic
  efficiency, cell voltage and the cell balance follow with core#137. The intermittent duty,
  stack and two pilot skids follow with core#138, core#139 and #330, and the LCA with #331
  (tracker core#136).
families: [electrolysis]
keywords: [CO2 electrolysis, CO2 reduction, carbon monoxide, bipolar membrane, reverse bias, water dissociation efficiency, MEA, gas diffusion electrode, silver catalyst, KOH anolyte, nickel anode, anolyte acidification]
facets:
  # The carbon basis is left unclassified: the source of the CO2 is set with the pilot skid
  # (#330). Add fossil, biogenic or atmospheric then.
  feedstock_basis: [water, electricity]
  product_classes: [industrial-gases, chemicals]
  unit_operations: [electrolysis]
  region: generic
# Honest claim: a measured bench cell, no flowsheet and no balance yet.
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Measured data only. The WDE series is calculated from the pinned raw titration sheets
    with the paper's equations (DESIGN.md D-002) and is not yet compared with anything in
    this folder. A held-out reproduction in benchmarks/reproductions/vermaas-rbpm-wde/
    compares the series with the published values (ADR 0031); its result is not validation of
    this design. No cell balance, flowsheet, sizing or inventory yet; cheme maturity reaches
    no level.
    Not reviewed.
chemistry:
  inputs:
    - {chemical: carbon-dioxide, role: feedstock, note: "humidified CO2 to the cathode; source and purity of the pilot skid in #330"}
    - {chemical: potassium-hydroxide, role: feedstock, note: "anolyte (1 M KOH in the reference series); initial fill and make-up in #330"}
    - {chemical: water, role: feedstock, note: "humidification and anolyte make-up"}
  outputs:
    - {chemical: carbon-monoxide, role: main-product, note: "cathode product; delivery rate, purity and pressure at the skid boundary set in #330"}
    - {chemical: hydrogen, role: co-product, note: "competing hydrogen evolution at the cathode"}
    - {chemical: oxygen, role: co-product, note: "anode product; disposition (vent or use) set in #331"}
  utilities:
    - {chemical: electricity, role: utility, note: "DC to the cell"}
references:
  - {title: "Prats Vergel, G., Mu, H., Kolobov, N., Biemolt, J., Vermaas, D.A., Burdyny, T. (2025) Water dissociation efficiencies control the viability of reverse-bias bipolar membranes for CO2 electrolysis. Nature Chemical Engineering", doi: 10.1038/s44286-025-00306-7}
  - {title: "Prats Vergel, G. et al. (2025) Data underlying the publication: Water Dissociation Efficiencies control the viability of reverse-bias bipolar membranes for CO2 electrolysis. 4TU.ResearchData, version 1 (CC BY 4.0)", doi: 10.4121/5c4fc325-a71b-4ca8-9c1b-01c0405936a2.v1}
