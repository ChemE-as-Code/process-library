  # ---------------------------------------------------------------- N2 stacks and DC supply
  - id: H02-N2
    title: Stacks E-201A to D and their DC supply, rectifier U-201 (48 V bus)
    design_intent: "As H01-N2 for Skid B: four stacks of seven 100 cm2 bipolar-membrane cells (28 cells) at 200 mA/cm2: 80 A from U-201 under JIC-201 (4 x 20 A, 48 V DC bus, about 3 kW DC; the bus is not drawn), about 2.2 kW of heat to the anolyte; JIC-201 current off also stops the dosing and the bleed (I-207). U-201 is the final element of the trips I-201 to I-206 and stands outside zone Z-HAZ-B at the east end (non-Ex cabinet, D-019). Stack replacement every 4000 h (ASSUMED) by a vertical hand lift (D-023)."
    members: [U-201, JIC-201, E-201A, E-201B, E-201C, E-201D]
    modes: [startup, normal, dosing, stop, trip, utility-fail, maintenance]
    status: proposed
    by: agent
    notes: "The DC bus, its cabling, earthing, isolation and the stack voltage measurement are not drawn (D-017). The anolyte at Skid B is at pH 13.7 throughout, not drifting to 12 as on Skid A: the Ni anode sees a steadier electrolyte, but higher carbonate (0.25 mol/L) from the start."
    deviations:
      - id: H02-N2-D1
        guide_word: more
        parameter: current
        description: "Stack current above the 80 A setpoint."
        scenarios:
          - id: H02-S201
            cause: "JIC-201 or the regulation of U-201 fails and the rectifier delivers more than 80 A."
            consequence: "More stack heat than the 2.2 kW E-211 is set for and more gas than the PSA and the oxidiser expect: the anolyte heats, the membranes and GDEs age faster, the dose follows the current by feedforward."
            refs: [JIC-201, U-201, E-201A, E-201B, E-201C, E-201D, E-211]
            modes: [startup, normal, dosing]
            safeguards: [H02-SG-TIC211-TAH, H02-SG-I205]
            actions: []
            status: proposed
            by: agent
            notes: "No over-current alarm or trip of JIC-201 is in the C&E; the rectifier's own current limit is the vendor's and not drawn."
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: D, basis: "Stack damage by heat, 10-100 kEUR (matrix 3); a single control failure of JIC-201 or the rectifier's regulation (D, as H01-S201).", evidence: [JIC-201, U-201], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: co2-bpm-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 0897883ced07f447, inputs: {matrix: 0e87818000ffd702, category: asset, severity: '3', likelihood: D}}}
              residual:
