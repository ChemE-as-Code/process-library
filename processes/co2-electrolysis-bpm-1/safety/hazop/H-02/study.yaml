  # ---------------------------------------------------------------- N7 dosing, bleed, make-up
  - id: H02-N7
    title: KOH dosing, bleed and make-up - day tank T-202, metering pump P-202 (AIC-201), bleed BL-201 / FV-203, make-up W-202 / LV-201
    design_intent: "Hold the 50 L anolyte at its steady state (D-010) with the current on: dose 5 M KOH (1.22 kg/L ASSUMED; 0.511 kg/h, about 0.42 L/h at 80 A) from the PP day tank T-202 (84.5 L, refilled weekly by hand through KOH-202 / HV-205, level LIA-203 with LAL and low-low I-208) through KOH-203 with the diaphragm metering pump P-202 (about 4 bar(a) discharge, base rate fed forward from JIC-201, trimmed by AIC-201 around pH 13.7, AAL 13.5) and KOH-204 into the reservoir top; bleed the anolyte by gravity from the reservoir bottom through the BL-201 branch of SP-201 (upstream of HV-203) and FV-203 (fail closed) at about 1.87 L/h (1.96 kg/h, FIC-203) to the site effluent; make up demineralised water W-202 (3 bar(a)) on level through LV-201 (fail closed, LIC-201) at about 1.45 L/h. P-202 stops and FV-203 closes with the current off (I-207), on the reservoir low-low level (I-202) and P-202 on the day tank low-low (I-208)."
    members: [T-202, LIA-203, KOH-202, HV-205, KOH-203, P-202, KOH-204, AIC-201, JIC-201, BL-201, FV-203, FIC-203, SP-201, W-202, LV-201, LIC-201, LIA-202, T-201]
    modes: [startup, dosing, stop, trip, utility-fail, maintenance]
    status: proposed
    by: agent
    notes: "The pH probe reads activity pH; the setpoint 13.7, the alarm 13.5 and the trip 12.2 are concentration-basis values that need an offset or a calibration before use (control/philosophy.md). The gravity bleed of about 1.9 L/h through a control valve is at the edge of controllability; a metering pump is the alternative (D-017). The weekly refill of T-202 has no written sequence."
    deviations:
      - id: H02-N7-D1
        guide_word: less
        parameter: flow (5 M KOH dose)
        description: "Less or no dose: the anolyte pH falls."
        scenarios:
