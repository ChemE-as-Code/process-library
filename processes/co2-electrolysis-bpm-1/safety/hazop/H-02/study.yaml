                - {category: asset, severity: "3", likelihood: D, basis: "The membrane sets of the four stacks, about 10-100 kEUR or the campaign lost (matrix 3); a pump or drive stop is a single equipment failure, expected a few times in the pilot's life (D).", evidence: [P-201, D-010, D-018], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: co2-bpm-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 0897883ced07f447, inputs: {matrix: 0e87818000ffd702, category: asset, severity: '3', likelihood: D}}}
              residual:
                - {category: asset, severity: "3", likelihood: C, basis: "I-206 on FIC-201 low-low (5 s) trips U-201: the transmitter does not share the pump or valve cause, one letter (sil null, not SIL-screened). The FAL uses the same transmitter as the trip and is not counted again; TSHH-212 not credited without flow.", evidence: [I-206, FIC-201, control/cause-effect.yaml], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: co2-bpm-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 0a42b546bff60f53, inputs: {matrix: 0e87818000ffd702, category: asset, severity: '3', likelihood: C}}}
          - id: H02-S102
            cause: "FIC-201 transmitter fails reading high (or drifts high): the flow loop slows P-201 and the true anolyte flow falls well below 705.6 kg/h."
            consequence: "Low anolyte flow through the stacks at 80 A: heating and drying of the anodes and the membranes, stack damage; the FAL and the trip I-206 read the same failed transmitter and do not act."
