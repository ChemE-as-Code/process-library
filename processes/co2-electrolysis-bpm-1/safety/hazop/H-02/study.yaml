  - {id: H02-SG-LIC222-LAH, title: "LIC-222 high condensate level alarm in V-221 (operator checks LV-222: liquid must not reach K-231)", kind: alarm, refs: [LIC-222], status: proposed, by: agent}
  - {id: H02-SG-PIC231-PAL, title: "PIC-231 low CO product pressure alarm (operator checks X-231)", kind: alarm, refs: [PIC-231], status: proposed, by: agent}
  - {id: H02-SG-AIC201-AAL, title: "AIC-201 low pH alarm at 13.5 (operator checks P-202, T-202 and the probe)", kind: alarm, refs: [AIC-201], status: proposed, by: agent, notes: "Same probe as the dose trim and I-201."}
  - {id: H02-SG-LIA202-LAL, title: "LIA-202 low anolyte level alarm in T-201 (independent of LIC-201)", kind: alarm, refs: [LIA-202], status: proposed, by: agent, notes: "Same transmitter as I-202."}
  - {id: H02-SG-LIC201-LAL, title: "LIC-201 low anolyte level alarm in T-201 (make-up loop)", kind: alarm, refs: [LIC-201], status: proposed, by: agent}
  - {id: H02-SG-LIA203-LAL, title: "LIA-203 low 5 M KOH level alarm in T-202: refill (weekly, ASSUMED)", kind: alarm, refs: [LIA-203], status: proposed, by: agent, notes: "Same transmitter as I-208."}
  - {id: H02-SG-FIC203-FAL, title: "FIC-203 low bleed flow alarm (operator checks FV-203 and the bleed line)", kind: alarm, refs: [FIC-203], status: proposed, by: agent}
  - {id: H02-SG-CV231, title: "Check valve on the K-231 discharge CG-203 (against back-flow from X-231)", kind: check-valve, refs: [CG-203, K-231], status: proposed, by: agent, notes: "Untagged on P-02 (DEXPI object CV231, a node member as {sheet: P-02, object: CV231})."}
  - {id: H02-SG-FAIL-FV202, title: "FV-202 fails closed on loss of air or signal (no CO2 to the cathodes)", kind: mechanical, refs: [FV-202], status: proposed, by: agent, notes: "Fail position proposed in control/loops.yaml (D-018)."}
  - {id: H02-SG-FAIL-PV221, title: "PV-221 fails open on loss of air or signal (the cathode is not pressurised against the compressor)", kind: mechanical, refs: [PV-221], status: proposed, by: agent, notes: "Fail position proposed in control/loops.yaml (D-018)."}
  - {id: H02-SG-FAIL-TV211, title: "TV-211 fails open on loss of air or signal (full tempered water to E-211)", kind: mechanical, refs: [TV-211], status: proposed, by: agent, notes: "Fail position proposed in control/loops.yaml (D-018)."}
  - {id: H02-SG-FAIL-LV222, title: "LV-222 fails closed on loss of air or signal (no cathode gas to the effluent)", kind: mechanical, refs: [LV-222], status: proposed, by: agent, notes: "Fail position proposed in control/loops.yaml (D-018)."}
  - {id: H02-SG-FAIL-LV201, title: "LV-201 fails closed on loss of air or signal (no make-up water)", kind: mechanical, refs: [LV-201], status: proposed, by: agent, notes: "Fail position proposed in control/loops.yaml (D-018)."}
  - {id: H02-SG-FAIL-FV203, title: "FV-203 fails closed on loss of air or signal (no bleed)", kind: mechanical, refs: [FV-203], status: proposed, by: agent, notes: "Fail position proposed in control/loops.yaml (D-018)."}
  - {id: H02-SG-U201-OUTZONE, title: "Rectifier U-201 (non-Ex) off the frame on a plinth at grade north-east of it, outside zone Z-HAZ-B, 3.23 m or more from the zone sources with their flanges and 2 m or more from the stair feet", kind: mechanical, refs: [U-201], status: proposed, by: agent, notes: "Layout feature (D-019, revised D-057; regen step 13 checks it); the zones are a screening, not an area classification."}
  - {id: H02-SG-X232-OUTZONE, title: "Oxidiser X-232 off the frame on its own plinth south-east of it, outside every zone and 2 m or more from the east stair's foot; TG-201 all-welded from FA-233 to the burner", kind: mechanical, refs: [X-232, TG-201], status: proposed, by: agent, notes: "Layout feature (D-047, D-057; regen step 13 checks it). As H01-SG-X132-OUTZONE."}
  - {id: H02-SG-OPEN-SKID, title: "Open, naturally ventilated skid: no enclosure, at most a rain canopy over the rectifier and the junction boxes (H2 rises and disperses, a release does not collect under a roof)", kind: mechanical, refs: [E-201A, K-231, X-231], status: proposed, by: agent, notes: "The owner's decision D-050 (2026-11-06). Natural ventilation fails in still air and does not keep CO2 out of low points; any roof over the gas train is for the competent person (H02-A206). As H01-SG-OPEN-SKID."}
  - {id: H02-SG-EX-ZONE, title: "Electrical items inside Z-HAZ-B one category above zone 2: motors (P-201, K-231, P-202) II 2G Ex db eb IIC T3 Gb, transmitters, analysers and solenoids Ex ia IIC T4 Ga with barriers outside the zone, IIC gas detectors; non-electrical ignition of K-231 and the pumps to EN ISO 80079-36/-37", kind: mechanical, refs: [P-201, K-231, P-202, AIA-241, AIA-242], status: proposed, by: agent, notes: "The owner's decision D-051 (2026-11-06), written into the equipment, electrical and instrument lists: a specification until the area classification, the purchase and the Ex inspection confirm it. As H01-SG-EX-ZONE."}
  - {id: H02-SG-FA233, title: "In-line detonation arrester FA-233 on TG-201 at X-231's outlet inside Z-HAZ-B (EN ISO 16852, explosion group IIC, unstable detonation, unidirectional, protected side towards X-231)", kind: mechanical, refs: [FA-233, TG-201], status: proposed, by: agent, notes: "The owner's decision D-054; piping/special-items.yaml. Its EU-type examination for the actual tail gas is the vendor's and open."}
  - {id: H02-SG-CV233, title: "Check valve on TG-201 beside FA-233 (against combustion air drifting back towards X-231)", kind: check-valve, refs: [{sheet: P-02, object: CV233}, TG-201], status: proposed, by: agent, notes: "Untagged on P-02 (DEXPI object CV233), D-054."}
  - {id: H02-SG-N6-XV233-CLOSE, title: "SEQ-B-STOP S3 and SEQ-B-TRIP S2: the tail-gas trip valve XV-233 (fail closed) closed before X-232 stops; SEQ-B-START S3 and SEQ-B-GAS open it only once X-232 reports pre-purged and firing", kind: procedural, refs: [XV-233, X-232], status: proposed, by: agent, notes: "control/sequences.yaml (D-054)."}
  - {id: H02-SG-O2V201-OPEN, title: "Open reservoir vent O2V-201 (DN 25, no valve) to a safe location above the walking levels", kind: mechanical, refs: [O2V-201, T-201], status: proposed, by: agent, notes: "Keeps T-201 at atmospheric pressure; the vent outlet height (about 3.4 m) is a layout assumption (D-019); vent sizing open (D-017)."}
  - {id: H02-SG-SEQ-B-START-AIR, title: "SEQ-B-START S1: CO2 (and O2) checked at grade and the low points round the open skid with a portable meter, a personal CO monitor worn, before the start", kind: procedural, refs: [AIA-241], status: proposed, by: agent, notes: "control/sequences.yaml SEQ-B-START (D-050). Replaces H02-SG-SEQ-B-START-VENT (the extract fan K-241, deleted with the enclosure); that id is not reused."}
  - {id: H02-SG-SEQ-B-GAS, title: "SEQ-B-GAS: nobody approaches the skid until AIA-241 and AIA-242 are clear; leak found and isolated before reset; purge to X-232 with the oxidiser firing before XV-233 opens", kind: procedural, refs: [AIA-241, AIA-242, X-232, XV-233], status: proposed, by: agent, notes: "control/sequences.yaml."}
  - {id: H02-SG-SEQ-B-PURGE, title: "SEQ-B-STOP / SEQ-B-TRIP: CO2 purge of the cathodes to the oxidiser X-232 until the cathode gas is free of CO and H2 (sampled) before K-231, X-231 and X-232 stop", kind: procedural, refs: [FIC-202, X-232], status: proposed, by: agent, notes: "control/sequences.yaml; needs power and CO2 (F-POWER open point)."}
  - {id: H02-SG-N6-FG-HEIGHT, title: "The flue FG-201 discharges at about 3.4 m, above the walking levels (a 1 m sphere clear of every walking level, D-019)", kind: mechanical, refs: [FG-201, X-232], status: proposed, by: agent, notes: "Layout assumption (D-019, piping/routing.yaml); fitted at site. As H01-SG-N6-FG-HEIGHT."}
  - {id: H02-SG-SEQ-B-FILL-PERM, title: "SEQ-B-FILL permissives: drain HV-203 closed and U-201 off before the fill", kind: procedural, refs: [HV-203, U-201], status: proposed, by: agent, notes: "control/sequences.yaml."}
  # node safeguards
  - {id: H02-SG-N7-SEQ-STOP-P202, title: "SEQ-B-TRIP S1 and SEQ-B-GAS S1 (automatic) stop P-202 and close FV-203 directly, not only through I-207; SEQ-B-STOP S1 (operator) stops P-202 and puts FIC-203 in manual but does not close FV-203; every S1 completes only with I-207 tripped", kind: procedural, refs: [P-202, FV-203], status: proposed, by: agent, notes: "control/sequences.yaml SEQ-B-STOP, SEQ-B-TRIP, SEQ-B-GAS S1."}
  - {id: H02-SG-N8-DRAIN, title: "SEQ-B-DRAIN: P-201 stopped and LV-201 closed (S1), the loop vented at AV-211 / HV-207 (S2), T-201 drained through HV-203 (S3), the loop's low point through DR-201 / HV-206 (S4), the heels of T-201 and T-202 pumped out through PO-201 / HV-208 and PO-202 / HV-209 with the chemical protection of the refill (S5), the loop flushed with demineralised water (S6), closed and capped (S7)", kind: procedural, refs: [P-201, HV-203, HV-206, HV-207, HV-208, HV-209], status: proposed, by: agent, notes: "control/sequences.yaml SEQ-B-DRAIN, revised with the owner's draining decision D-055 (2026-11-06). As H01-SG-N2-DRAIN-PERM."}
  - {id: H02-SG-N8-SEQ-FILL-LEVEL, title: "SEQ-B-FILL S1 ends at the 50 L working volume on LIC-201 and S2 closes HV-202", kind: procedural, refs: [LIC-201, HV-202], status: proposed, by: agent, notes: "control/sequences.yaml; LIC-201 indicates, it has no high alarm. The same step fills T-202 through HV-205 and completes on 'LIA-203 full', which has no high alarm: not credited for T-202 (H02-S712)."}
actions:
  # N1 anolyte loop
  - {id: H02-A101, text: "Give the low-low flow trip I-206 its own measurement, independent of the FIC-201 loop transmitter (a second flow element, or a pump-running and differential-pressure signal of P-201), so that a FIC-201 failure does not defeat the trip.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H02-A102, text: "With the stack vendor, add per-stack monitoring that shows a starved, flooded or shorted stack at constant total current: the stack voltage (or cell-group voltages) and the current of each of E-201A to D, with alarms and a trip of U-201 on a voltage outside the band.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H02-A103, text: "Add a low temperature alarm on TIC-211 and decide whether Skid B needs an anolyte heater for winter start-up and low current (none is drawn; TIC-211 cools only). Proposed response (the owner's decision of 2026-11-06, D-052, D-056, for the team to confirm, as H01-A105): E-211 on a heating and cooling tempered-water unit off the skid (TWS-201 / TWR-201), a low-temperature alarm on TIC-211, the loop heated before the current and kept circulated and heated when idle. Still open: the unit's duty and frost-protection mode and the TAL value (vendor).", owner: process engineer, status: proposed, by: agent}
  - {id: H02-A104, text: "Carry out a SIL screening / LOPA of the trips I-201 to I-206, I-208, I-209 and I-210 (all sil null; I-209 and I-210 added with D-054), including the sharing of AIC-201 with I-201 and of FIC-201 with I-206, before any trip is credited beyond the one-letter convention of this draft.", owner: process safety / HSE, status: proposed, by: agent}
  # N2 stacks and DC supply
  - {id: H02-A201, text: "Specify with the stack and rectifier vendors the protection against reverse current at stop, trip and power loss (blocking diode, polarisation hold or controlled discharge of the stacks) and add the step to SEQ-B-STOP and SEQ-B-TRIP.", owner: electrical engineer, status: proposed, by: agent}
  - {id: H02-A202, text: "Design and draw the 48 V DC bus: over-current protection (fuses or a DC breaker) at U-201 and per stack, shrouded terminals, drip protection against anolyte above the bus, cable routing, and an arc-flash assessment.", owner: electrical engineer, status: proposed, by: agent}
  - {id: H02-A203, text: "Add insulation (earth-fault) monitoring on the DC bus and equipotential bonding of the frame, manifolds and SS316 items; check for stray-current corrosion through the anolyte.", owner: electrical engineer, status: proposed, by: agent}
  - {id: H02-A204, text: "Provide a lockable DC isolator and an earthing / discharge point for the stacks, and write the electrical isolation procedure (lock-out, prove dead, discharge) used for every terminal work and stack lift.", owner: electrical engineer, status: proposed, by: agent}
  - {id: H02-A205, text: "Get the stack weight from the vendor and make a manual handling assessment of the vertical hand lift with 0.3 m of hand room (D-019, D-023); provide a lifting aid or a two-person lift procedure.", owner: mechanical / package engineer, status: proposed, by: agent}
  - {id: H02-A206, text: "Have the area classification of Skid B made by a competent person (IEC 60079-10-1) to replace the screening zone Z-HAZ-B, and confirm that the non-Ex rectifier U-201 stands outside every zone; treat the oxidiser X-232 as a permanent ignition source (H02-S906). Proposed response in part (the owner's decisions of 2026-11-06, D-050, D-051, D-057, for the team to confirm, as H01-A204): the skid is open and naturally ventilated; U-201 and X-232 stand off the frame on plinths outside the zone; the gas trips open U-201's AC feeder at SDB-1; the Ex marking inside the zone is set (H02-A902). Cannot be settled by the owner or this study: the area classification itself, the explosion protection document (1999/92/EC), the initial and periodic Ex inspection (IEC 60079-14, -17) and the assessment of the stacks' terminals: the competent person's.", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H02-A207, text: "Remove the DC on every trip independently of the rectifier's regulation: a DC contactor or breaker in the U-201 output opened by I-201 to I-206 and by the stop, and an over-current alarm and trip on a current measurement independent of JIC-201; then I-205 can be credited against a regulation or output-stage fault of U-201 (H02-S201; as H01-A205). Decided in principle by the owner on 2026-11-06 (D-051, for the team to confirm): a lockable DC isolator or a DC contactor outside the zone, the DC never broken under load inside it; its design and drawing stay open with the DC bus.", owner: electrical engineer, status: proposed, by: agent}
  - {id: H02-A208, text: "As H01-A206: the stacks now stand along the frame's south edge, within 0.6 m of a person at grade, and are replaced by a slide at deck level onto a deck-height trolley, no lift (D-047, review 2026-11-05-layout#1); assess that handling in H02-A205 and drain and flush the loop first (H02-A802): the supply header's low point has no drain on P-02 yet (D-047). Proposed response to the drain (the owner's decision of 2026-11-06, D-055, P&ID revision B, for the team to confirm): the capped low-point drain DR-201 / HV-206 is drawn there and SEQ-B-DRAIN S4 drains it before a stack is opened; the handling assessment stays open (H02-A205).", owner: mechanical / package engineer, status: proposed, by: agent}
  # N3 cathode CO2 feed
  - {id: H02-A301, text: "Trip U-201 automatically on low-low fresh CO2 flow (FIC-202) and on low instrument air pressure, instead of relying on the operator's response to the FIC-202 FAL (F-AIR); measure the PSA recycle CO2-202 or the total cathode CO2 feed as well, since FIC-202 sees only the fresh CO2 and a loss of the 2.94 kg/h recycle goes unseen (H02-S301, H02-S510).", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H02-A302, text: "Define the CO2 supply interface: a pressure regulator and a high-pressure trip at the tie-in, and a relief device on CO2-201 upstream of the stacks. Governing scenario for the relief: H02-S303, the supply regulator failing open with FV-202 open (named only, not sized here).", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H02-A303, text: "Add check valves on the fresh CO2 tie-in CO2-201 and on the humidification water W-201, and a low supply pressure alarm, against back-flow of cathode gas with CO into the CO2 supply and the demineralised water network (H02-S305; as H01-A306).", owner: process engineer, status: proposed, by: agent}
  - {id: H02-A304, text: "Specify the CO2 vaporiser and its low-temperature protection at the battery limit, and add a low temperature alarm on CO2-201.", owner: process engineer, status: proposed, by: agent}
  - {id: H02-A305, text: "Replace the local rotameter FI-203 by a flow transmitter with low and high alarms, or write a per-shift check of the humidification water.", owner: process engineer, status: proposed, by: agent}
  - {id: H02-A307, text: "Give the start-up purge of SEQ-B-START S2 a flow path: start K-231 and X-232 before or with the purge (with the order of S3 reviewed against H02-S610), or draw a purge route from CG-202 to X-232 or a safe vent; state the regulated CO2 supply pressure against the anolyte pressure and the GDE window (#332); and correct the PV-221 rationale in control/loops.yaml, which a stopped K-231 defeats (H02-S309; as H01-A307).", owner: process engineer, status: proposed, by: agent}
  - {id: H02-A306, text: "Add CO2 and O2-depletion detection at low level at the open skid, with an alarm at the entry, and include CO2 in the enclosure entry procedure. Proposed response in part (the owner's decision of 2026-11-06, D-050, for the team to confirm, as H01-A305): the skid is open; SEQ-B-START S1 checks CO2 (and O2) at grade and the low points with a portable meter. Still open: whether a fixed CO2 detector at a low point is needed during the run (H02-A901), and keeping pits and trenches away from the skid.", owner: process safety / HSE, status: proposed, by: agent}
  # N4 cathode gas outlet
  - {id: H02-A401, text: "Measure the pressure difference across the GDE: an anolyte-side pressure transmitter at the stack inlet (AN-203) against the cathode (PIC-221), with alarms and a trip of U-201 at the window of benchmarks/reproductions/baumgartner-gde-pressure-window (#332) and the vendor's allowed difference.", owner: process engineer, status: proposed, by: agent}
  - {id: H02-A402, text: "Add a cathode pressure high-high trip independent of PIC-221 that trips U-201, and trip U-201 when K-231 stops; decide the relief of the cathode gas train. Governing scenario for that relief: H02-S401, the stacks making gas against a stopped K-231 (named only, not sized here).", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H02-A403, text: "With the compressor vendor, define the K-231 suction control and a low-low suction pressure trip of K-231 so that the stacks and the cathode gas train never go below atmospheric; consider an O2 measurement in the cathode gas.", owner: mechanical / package engineer, status: proposed, by: agent}
  - {id: H02-A404, text: "Add a high-high level switch on V-221, independent of LIC-222, that stops K-231.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H02-A405, text: "Add a low-low level on V-221, independent of LIC-222, that closes LV-222 (or a second shut-off valve), and a liquid seal or restriction orifice on CD-201; route the condensate receiver's vent to a safe location.", owner: process engineer, status: proposed, by: agent}
  - {id: H02-A406, text: "Provide an online or a scheduled analysis of the cathode gas (H2, CO, CO2) with criteria for GDE flooding and carbonate (a cathode wash or a stack exchange).", owner: process engineer, status: proposed, by: agent}
  - {id: H02-A407, text: "Write the procedure for opening the cathode gas train and the PSA: isolation, purge, gas-free test with a portable CO and H2 monitor, including after a power loss and after SEQ-B-GAS.", owner: operations, status: proposed, by: agent}
  # N5 gas conditioning
  - {id: H02-A501, text: "Add a relief device on the K-231 discharge CG-203 (or confirm and document the compressor's internal relief), a high-high pressure trip of K-231 and a trip of K-231 and U-201 on low instrument air pressure; decide the fail position of PV-231 with the PSA vendor. Governing scenario for the relief: H02-S501, blocked outlet downstream of K-231 at full compressor capacity (named only, not sized here).", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H02-A502, text: "Get from the PSA vendor the X-231 overpressure protection and the behaviour of its outlets when the oxidiser X-232 stops, and interlock K-231 with it.", owner: mechanical / package engineer, status: proposed, by: agent}
  - {id: H02-A503, text: "Add a CO purity analyser on CO-201 (or a sampling routine) and define what happens to off-spec product.", owner: process engineer, status: proposed, by: agent}
  - {id: H02-A504, text: "Get the PSA and compressor vendors' depressurisation and purge procedure for maintenance (the beds hold adsorbed CO) and decide the purge medium; only CO2 is drawn.", owner: mechanical / package engineer, status: proposed, by: agent}
  - {id: H02-A505, text: "Extend I-203 and I-204 to isolate the PSA X-231 (its package stop and PV-231 closed, or an isolation valve on CO-201), so that the CO inventory of the PSA is not left connected to a leak (H02-S506, as H01-A505).", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H02-A506, text: "Get from the K-231 vendor the diaphragm leak detection (to trip K-231), the discharge temperature protection and the route of the hydraulic-oil-side vent, and bring the trips into control/cause-effect.yaml (H02-S504, H02-S508; as H01-A503).", owner: mechanical / package engineer, status: proposed, by: agent}
  - {id: H02-A507, text: "Guard the PSA recycle CO2-202 (no valve on it today): a check valve and a tight shut-off valve on CO2-202 closed by I-203, I-204 and the stop of K-231, or the PSA vendor's recycle outlet isolation confirmed and interlocked; include CO2-202 in the isolation of SEQ-B-GAS and in the relief study of the cathode side (H02-S509; as H01-A507).", owner: process engineer, status: proposed, by: agent}
  # N6 tail gas and vents
  - {id: H02-A601, text: "Add an H2-in-O2 analyser on the reservoir vent O2V-201 with an alarm and a trip of U-201 at a fraction of the lower flammability limit (set point to be defined), and consider a sweep of the T-201 head space and a flame arrester on O2V-201.", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H02-A602, text: "With the oxidiser vendor, define the combustion monitoring of X-232 (flame or outlet temperature, combustion air flow AIR-201, high temperature) and its trip of the tail gas feed (K-231, X-231) and U-201; check FG-201 for CO; and require a burner or oxidiser management system with a pre-purge before every light-off or re-light (EN 746-2 or the equivalent) and a package HAZOP; size the air for the H2-rich tail gas after a CO2 loss and for the gas-trip purge of SEQ-B-GAS S3, or limit the purge rate (H02-S601, H02-S602, H02-S603, H02-S610; as H01-A601, H01-A602). Proposed response in part (the owner's decision of 2026-11-06, D-054, for the team to confirm): the vendor's burner management system to EN 746-2 with pre-purge and its own burner arrester are required as the second barrier behind FA-233; its trip is I-210 (XV-233 closed, K-231 stopped, U-201 tripped); the sequences open XV-233 only once X-232 reports pre-purged and firing. The vendor's system, the flue measurement, the air sizing and the package HAZOP stay open.", owner: mechanical / package engineer, status: proposed, by: agent}
  - {id: H02-A603, text: "Size the vents O2V-201 and KV-202 for the governing in- and out-breathing (the fills, the make-up LV-201 failing open, a cathode gas breakthrough, the gravity drain of T-201 with O2V-201 blocked, H02-S808), route KV-202 away from the refill point, and fit weather caps and screens.", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H02-A604, text: "Protect the tail gas TG-201 against flashback: a flame arrester and a check valve on TG-201 (or the X-232 vendor's confirmation of the burner's own), a stop of X-232 (or of its fuel) on a falling tail flow and with K-231, and the order of the stop steps of SEQ-B-STOP, -TRIP and -GAS reviewed with the vendor's burner management; and keep the cathode below the anolyte after a trip that stops P-201 (lower the PIC-221 setpoint for the purge of SEQ-B-TRIP S1, or a check valve on AN-202) (H02-S613, H02-S605; as H01-A605). Proposed response to the tail gas (the owner's decision of 2026-11-06, D-054, P&ID revision B, for the team to confirm): at X-231's outlet inside Z-HAZ-B the fail-closed trip valve XV-233, a check valve and the in-line detonation arrester FA-233 for unstable detonation (EN ISO 16852, IIC, unidirectional, protected side towards X-231), TSHH-233 on its unprotected side tripping XV-233 (I-209), the gas trips and the burner management trip (I-210) closing XV-233, the stop sequences closing it before X-232 stops; TG-201 all-welded, protected where it crosses grade and off the escape way (pinned, D-057); the vendor's burner arrester and burner management the second barrier. Cannot be settled here (vendor): the arrester's EU-type examination for the actual tail gas, its burning time and so TSHH-233's set point, and TG-201's detonation pressure rating (H02-S613, H02-S614). The cathode-below-anolyte part after a trip that stops P-201 stays open.", owner: mechanical / package engineer, status: proposed, by: agent}
  # N7 dosing, bleed and make-up
  - {id: H02-A701, text: "Give I-201 its own pH (or conductivity) measurement, separate from the AIC-201 trim probe, with low and high alarms, and add a routine titration check of the anolyte against the probe.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H02-A702, text: "Calibrate AIC-201 against titrated anolyte (hydroxide and carbonate) and set its setpoint, AAL and the I-201 trip value on the measured basis before start-up; record the offset (control/philosophy.md).", owner: process engineer, status: proposed, by: agent}
  - {id: H02-A703, text: "Add on KOH-204 a check valve or an anti-siphon back-pressure valve and a discharge relief valve for P-202 (or confirm the pump's internal relief), and confirm that KOH-204 enters above the liquid with an air break. Governing scenario for the relief: H02-S707, blocked KOH-204 at full stroke (named only).", owner: mechanical / package engineer, status: proposed, by: agent}
  - {id: H02-A704, text: "Limit the gravity bleed to a safe maximum (a restriction orifice on BL-201) and add a high bleed flow alarm on FIC-203, or take the metering pump alternative of D-017.", owner: process engineer, status: proposed, by: agent}
  - {id: H02-A705, text: "Add a high and a high-high level on LIA-202 (independent of LIC-201) that closes LV-201, and an overflow from T-201 to a safe drain, so that neither the make-up nor the fill can push anolyte up O2V-201.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H02-A706, text: "Provide an eyewash and safety shower at the west end of Skid B (T-202, P-202, the hose connections), spray shields on the KOH flanges and P-202, a bund or drip tray under T-202 and P-202, and the PPE for KOH work; none is drawn.", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H02-A707, text: "Write the weekly refill procedure of T-202 (it has no sequence): PPE, a check of the delivery certificate (5 M, not 45-50 wt%), a dedicated coupling at KOH-202, and a high level alarm on LIA-203 with a local horn or a metered fill volume.", owner: operations, status: proposed, by: agent}
  - {id: H02-A708, text: "Agree with the site that its effluent permit accepts the continuous bleed (about 1.9 L/h at pH 13.7) and the 50 L drain of each campaign, or collect and neutralise them.", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H02-A709, text: "Make P-202 maintainable: an isolation valve on KOH-203 at the T-202 outlet and a drain on T-202 (or on KOH-203 at its low point), and a written procedure for P-202 and KOH-203 / KOH-204 work (isolate, drain the line, PPE for 5 M KOH, the eyewash of H02-A706) (H02-S716).", owner: mechanical / package engineer, status: proposed, by: agent}
  - {id: H02-A710, text: "Write the AIC-201 probe handling and calibration procedure: AIC-201 and P-202 in manual at a fixed dose (or the current off) while the probe is out, a recorded and time-limited bypass of I-201 if one is needed, and a check against titration before AIC-201 goes back to automatic; or give I-201 its own probe (H02-A701) (H02-S717).", owner: instrument and control engineer, status: proposed, by: agent}
  # N8 fill and drain
  - {id: H02-A801, text: "Write the fill procedure for T-201: a check of the delivery certificate (1 M KOH), the hose connection and disconnection with PPE, and the fill volume.", owner: operations, status: proposed, by: agent}
  - {id: H02-A802, text: "Add low-point drains and flush connections on the anolyte loop (stack manifolds, P-201, E-211) and isolation valves at the stack connections, and add a flush step to SEQ-B-DRAIN before any item is opened. Proposed response (the owner's draining decision of 2026-11-06, D-055, P&ID revision B, for the team to confirm): the capped low-point drain DR-201 / HV-206 at the supply header's east end to a closed IBC, the capped vent AV-211 / HV-207 at E-211's anolyte outlet, bottom outlets with valves and capped camlock pump-outs on T-201 (PO-201 / HV-208) and T-202 (PO-202 / HV-209); SEQ-B-DRAIN vents, drains, pumps out the heels, flushes with demineralised water and caps (H02-S807, H02-S809). Still open: isolation valves at the stack connections and the check that a connection is empty before it is opened.", owner: process engineer, status: proposed, by: agent}
  - {id: H02-A803, text: "Lock or car-seal HV-203 closed for the campaign, opened only under SEQ-B-DRAIN (H02-S804; as H01-A804).", owner: operations, status: proposed, by: agent}
  # N9 open skid and gas detection
  - {id: H02-A901, text: "Make the gas detection study for Skid B: number and locations of the CO and H2 detectors (incl. near the vents and the CO product side), set points, voting (e.g. 1oo2), alarm beacons at the entry and their power supply; then confirm I-203 and I-204. Decided in part by the owner on 2026-11-06 (D-050, for the team to confirm, as H01-A902): the CO and H2 point detectors stay at the PSA and the compressor and high over the stack row, certified IIC (D-051); personal CO monitors are worn (SEQ-B-START S1); a CO2 check at grade and the low points. The study itself stays open.", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H02-A902, text: "Decide and specify the Ex rating of the electrical items in zone 2 of Skid B (K-241, P-201, K-231, P-202, instruments), an open owner decision of #330, together with the area classification of H02-A206; I-204 starts K-241 and leaves P-201 running inside a detected H2 cloud, so K-241 (motor out of the air stream) and P-201 need the rating whatever the owner decides for the rest, or I-204 must stop P-201 (H02-S902). Proposed response (decided by the owner on 2026-11-06, D-051, to be confirmed by the team, as H01-A903): inside the screening zone the motors P-201, K-231 and P-202 II 2G Ex db eb IIC T3 Gb (Ex eb acceptable), the transmitters, analysers and solenoids Ex ia IIC T4 Ga with their barriers or isolators outside the zone (JB-201, CR-1), certified IIC gas detectors; 3G / Gc the stated minimum; the non-electrical ignition of K-231 and the pumps to EN ISO 80079-36/-37; the PSA X-231 with the vendor's ATEX assembly assessment; T-201 and T-202 (PP) earthed and bonded (IEC TS 60079-32-1); the rectifier's AC isolated at SDB-1 on gas detection and the DC never broken under load inside the zone; the DC drops in armoured cable with IIC glands and shrouded IP-rated stack terminals. K-241 is deleted (D-050); P-201 left running is Gb. Cannot be settled here: the area classification, the explosion protection document, the Ex inspection and the stacks' terminals (the competent person, H02-A206).", owner: owner / electrical engineer, status: proposed, by: agent}
  - {id: H02-A903, text: "Size the enclosure ventilation (K-241) and add an air flow switch with an alarm and a start permissive, so that a stopped fan is seen. Proposed response (the owner's decision of 2026-11-06, D-050, for the team to confirm, as H01-A901): the skid is open and naturally ventilated; the enclosure and K-241 are deleted, at most a rain canopy over the rectifier and the junction boxes. Still open: the competent person's confirmation of the ventilation (H02-A206) and that no roof is put over the gas train (H02-S903).", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H02-A904, text: "Write the procedure for approaching the skid after a gas trip: portable CO, H2 and O2 monitors, a permit to work and a second person at a distance (the enclosure of the first draft is deleted, D-050).", owner: operations, status: proposed, by: agent}
  - {id: H02-A905, text: "Resolve F-POWER: a UPS for the gas detection and the control, and a defined purge of the cathode gas train after a power loss (control/philosophy.md open point); the fan is deleted with the enclosure (D-050).", owner: process engineer, status: proposed, by: agent}
  - {id: H02-A906, text: "Remove the oxidiser X-232 as an ignition source of the enclosure: stop X-232 and isolate the tail gas TG-201 (stop X-231) from I-203 and I-204 and in SEQ-B-GAS S1, or place X-232 outside the enclosure and outside zone Z-HAZ-B; have the area classification (H02-A206) treat X-232 as a permanent ignition source and get its surface temperatures from the vendor (H02-S906; as H01-A906). Proposed response (the owner's decisions of 2026-11-06, D-050, D-054, D-057, for the team to confirm): the skid has no enclosure; X-232 stands outside the zone on its plinth south-east of the frame, 2 m or more from the east stair's foot; I-203 and I-204 close XV-233. Still open: the area classification's treatment of X-232 and its surface temperatures (vendor).", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H02-A907, text: "As H01-A907: X-232 now stands off the frame on its own plinth east of Skid B, outside Z-HAZ-B and the enclosure (D-047); draw the flame arrester on TG-201 at X-231's outlet and the all-welded TG-201 on P-02, reassess H02-S906 and confirm by the area classification (H02-A206). Proposed response (the owner's decision of 2026-11-06, D-054, P&ID revision B, and D-057, for the team to confirm): drawn on P-02 at X-231's outlet inside Z-HAZ-B: XV-233, a check valve and the detonation arrester FA-233, TSHH-233; TG-201 all-welded, pinned at 0.30 m on sleeper posts off the escape way, to X-232 moved south-east; H02-S906 re-rated as a proposal. The area classification's confirmation stays open (H02-A206).", owner: process engineer, status: proposed, by: agent}
