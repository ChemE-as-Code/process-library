            consequence: "The four stacks lose the anolyte flow that carries off about 2.2 kW and the anode O2: local heating and drying of the anode and the bipolar membrane, membrane and MEA damage of all four stacks, more H2 crossover through a dry membrane."
            refs: [P-201, HV-201, AN-201, FIC-201, E-201A, E-201B, E-201C, E-201D, U-201]
            modes: [startup, normal, dosing]
            safeguards: [H02-SG-I206, H02-SG-FIC201-FAL, H02-SG-I205]
