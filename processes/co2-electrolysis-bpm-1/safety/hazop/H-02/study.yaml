kind: hazop-study
id: H-02
title: 'Skid B: KOH dosing, bleed and make-up'
scope: >-
  Sheet P-02 (pid/P-02.xml) as drawn, Skid B of #330 (2xx tags, case skid-b, DESIGN.md D-007,
  D-010): the anolyte loop T-201 / P-201 / E-211 with the supply and return manifolds
  AN-201 to AN-204C and the anode side of the four stacks E-201A to D; the stacks and their DC
  supply, the rectifier U-201 (the 48 V DC bus is not drawn); the cathode CO2 feed CO2-201 to
  CO2-201D with FV-202, the PSA recycle CO2-202 and the humidification water W-201 / HV-204;
  the cathode gas outlet CG-201 to CG-201D, the separator V-221 with its condensate CD-201 /
  LV-222 and the back-pressure valve PV-221 on CG-202; the gas conditioning, the diaphragm
  compressor K-231, CG-203 with its check valve, the CO PSA package X-231 and the CO product
  CO-201 / PV-231 to the battery limit; the tail-gas oxidiser X-232 (TG-201, AIR-201, FG-201),
  the anolyte reservoir vent O2V-201 and the day tank breather KV-202; Skid B's own dosing,
  bleed and make-up: the 5 M KOH day tank T-202 with its weekly refill KOH-202 / HV-205, the
  metering pump P-202 (KOH-203, KOH-204) under AIC-201, the bleed BL-201 / FV-203 (FIC-203)
  and the make-up water W-202 / LV-201 (LIC-201); the initial fill KOH-201 / HV-202 and the
  end-of-run drain SP-201 / HV-203; the skid enclosure with its extract fan K-241 and the gas
  detectors AIA-241 (CO) and AIA-242 (H2). The trips are those of control/cause-effect.yaml
  I-201 to I-208, the sequences SEQ-B-FILL, -START, -STOP, -TRIP, -GAS and -DRAIN of
  control/sequences.yaml. Battery limits: the CO2 supply (merchant liquefied CO2, D-016, not
  studied beyond the CO2-201 tie-in), the cooling water CWS-201 / CWR-201, the demineralised
  water W-201 and W-202, the combustion air AIR-201, the 1 M and 5 M KOH deliveries to the
  KOH-201 and KOH-202 connections, the receivers of the spent anolyte, the bleed, the
  condensate and the CO product, instrument air and power. Not covered: the internals of the
  black-box packages X-231 and X-232 (D-012), the stack vendor's internal design, the site's
  area classification (screening only, D-019), relief device sizing (only the governing
  scenario is named) and Skid A, which is H-01. Where Skid B's hardware and control are the
  same as Skid A's (nodes N2 to N6, N9: the same packages, compressor, separator, stacks and
  trips with 2xx tags), a scenario may refer to the H-01 analysis by its id (H01-S...) in its
  notes, but it is written here with Skid B's own tags; what differs on Skid B (the 50 L
  reservoir, the dosing, bleed and make-up, the 5 M KOH, I-201 at pH 12.2, I-207, I-208) is
  analysed in full.
modes:
  - {id: startup, title: 'Start-up: fill, purge, energise', description: "SEQ-B-FILL (fresh 1 M KOH through HV-202, circulate) and SEQ-B-START (ventilate K-241, cool TIC-211, purge and humidify the cathodes with CO2, start K-231, X-232 then X-231, ramp JIC-201 to 80 A, then P-202, AIC-201 and FIC-203 in automatic once I-207 is reset)."}
  - {id: normal, title: Normal steady operation, description: "Duty D-B: 200 mA/cm2 constant current (80 A, 4 x 20 A, 28 cells of 100 cm2, about 3 kW DC on the 48 V bus) on 50 L held at the steady state pH 13.7 (concentration basis), 0.5 mol/L OH- and 0.25 mol/L carbon."}
  - {id: dosing, title: 'KOH dosing, bleed and make-up', description: "Continuous with the current on (D-010): 5 M KOH dosed by P-202 at about 0.42 L/h (AIC-201 trim, feedforward from JIC-201), bleed by gravity through FV-203 at about 1.87 L/h (FIC-203), make-up water on level through LV-201 at about 1.45 L/h (LIC-201); the dose and the bleed are off with the current off (I-207); the day tank T-202 (84.5 L) is refilled weekly by hand through HV-205 (no sequence written)."}
  - {id: exchange, title: 'Anolyte drain and fresh fill at the end of the campaign', description: "SEQ-B-STOP or a trip, then SEQ-B-DRAIN (P-201 stopped, LV-201 closed, the 50 L drained through HV-203 to the site effluent) and a new SEQ-B-FILL."}
  - {id: stop, title: Normal stop, description: "SEQ-B-STOP at H: ramp the current down (I-207 stops the dose and the bleed), purge the cathodes with CO2 to the oxidiser, stop K-231, X-231, X-232."}
  - {id: trip, title: Trip and gas trip, description: "SEQ-B-TRIP after I-201, I-202, I-205 or I-206 (current off, dosing and bleed off, CO2 purge kept); SEQ-B-GAS after I-203 or I-204 (current off, FV-202 closed, K-231 stopped, K-241 started, the cathode gas train isolated with its CO and H2 until the leak is found, then purged to X-232)."}
  - {id: utility-fail, title: 'Loss of power, instrument air or cooling water', description: "control/philosophy.md F-POWER, F-AIR, F-CW: the pneumatic valves TV-211, FV-202, PV-221, LV-222, PV-231, LV-201, FV-203 go to their fail positions; on power loss the rectifier, pumps (P-201, P-202), compressor and fan stop."}
  - {id: maintenance, title: Maintenance, description: "Isolation, draining and opening of the anolyte, the 5 M KOH and the cathode gas lines, probe calibration of AIC-201, instrument work, and the replacement of a stack (4000 h interval, ASSUMED) by a vertical hand lift of the 0.18 m stack with 0.3 m of hand room (D-019, D-023)."}
