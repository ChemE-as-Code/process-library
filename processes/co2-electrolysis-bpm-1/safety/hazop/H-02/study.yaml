    status: proposed
    by: agent
    notes: "No heater is drawn (TIC-211 cools only). The 50 L reservoir is 1/23 of Skid A's: a loss of level or a dosing upset moves the anolyte within minutes to hours, not days. The dose, bleed and make-up themselves are node H02-N7, the fill and drain H02-N8, the vent O2V-201 H02-N6."
