            risk:
              initial:
                - {category: asset, severity: "3", likelihood: D, basis: "Anodes and membranes of the four stacks (matrix 3); a metering pump failure or a missed weekly refill a few times in the pilot's life (D).", evidence: [P-202, D-010, F-DOSE], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: co2-bpm-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 0897883ced07f447, inputs: {matrix: 0e87818000ffd702, category: asset, severity: '3', likelihood: D}}}
