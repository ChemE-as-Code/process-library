            safeguards: [H02-SG-I206, H02-SG-FIC201-FAL, H02-SG-I205]
            actions: [H02-A104]
            status: proposed
            by: agent
            notes: "As H01-N1 for Skid A. TSHH-212 on the common return sees little of the stack heat once the flow has stopped and is not credited here."
            risk:
