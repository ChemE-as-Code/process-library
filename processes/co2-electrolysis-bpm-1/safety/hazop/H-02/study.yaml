notes: >-
  Agent-prepared draft for a team session; it is not a HAZOP and no session has been held. The
  team (roles above) is not named yet: the owner names the facilitator, scribe and members.
  Every node, scenario, safeguard, rating and action is a proposal by an agent (status
  proposed, by agent). The plant is studied as drawn: the P&ID has no relief device, no H2-in-O2
  measurement on O2V-201, no pressure measurement on the anolyte side (no pressure difference
  across the GDE), no heater (TIC-211 cools only), no eyewash or safety shower at the 5 M KOH
  day tank or the bleed, no check valve on the dosing line KOH-204 and no detector at the vents;
  where the analysis needs one, it is an action, never a safeguard. The on/off and part-load
  duties are not a mode of Skid B: they run on Skid A's hardware only (D-013; dosing would run
  while off). H-01 and H-02 were drafted apart and then integrated (DESIGN.md D-030): the
  hardware the two skids share is examined alike and rated by one convention (a utility upset
  or a routine hose task E, a single failure D; the initial likelihood is that of the cause; an
  alarm seen only after the damage is not credited). H02-S111, S409, S410, S508, S610, S611,
  S612 and S808 mirror H-01's analysis; where the two studies still rate the same hazard
  differently, the design differs and the basis says why (safety/hazop/SESSION.md section
  3.4).
nodes:
  # ---------------------------------------------------------------- N1 anolyte loop
  - id: H02-N1
    title: Anolyte loop - reservoir T-201, pump P-201, cooler E-211 and the stack anode side (AN-201 to AN-204C)
    design_intent: "Circulate the anolyte, held by dosing, bleed and make-up at the steady state pH 13.7 (concentration basis), 0.5 mol/L OH-, 0.25 mol/L carbon, ionic strength about 1.25 mol/L (D-010), from the PP reservoir T-201 (50 L, D 0.376 x H 0.564 m, about 4.5 min hold-up for O2 disengagement; atmospheric, vented by O2V-201) through AN-201 / HV-201 to the sealless pump P-201 (FIC-201 speed, 705.6 kg/h, about 11.2 L/min, 1.51 bar(a) discharge), through the plate cooler E-211 (about 2.2 kW to cooling water by TV-211 under TIC-211, stack inlet about 22.1 degC) and the supply manifold AN-203 / AN-203A to C to the anode side of E-201A to D (1.41 bar(a)), and back with the anode O2 (about 0.16 kg/h) through AN-204A to C / AN-204 (TSHH-212, about 25 degC) to the reservoir top. Level controlled by LIC-201 (make-up, H02-N7) and protected by the independent LIA-202 (I-202); pH on AIC-201 (trip I-201 at 12.2)."
    members: [T-201, HV-201, AN-201, P-201, AN-202, FIC-201, E-211, TV-211, TIC-211, CWS-201, CWR-201, AN-203, AN-203A, AN-203B, AN-203C, E-201A, E-201B, E-201C, E-201D, AN-204A, AN-204B, AN-204C, AN-204, TSHH-212, LIC-201, LIA-202, AIC-201]
