      - id: H02-N2-D3
        guide_word: reverse
        parameter: current
        description: "Reverse current through the stacks when U-201 stops (stop, trip, power loss)."
        scenarios:
          - id: H02-S203
            cause: "U-201 is switched off by SEQ-B-STOP, a trip of I-201 to I-206 or a power loss, with H2 and CO still at the cathodes and O2 at the anodes: the stacks act as a cell and drive a reverse current through the bus and the rectifier, or between the parallel stacks."
            consequence: "Reverse polarisation of the Ni anodes and the cathode catalyst: anode dissolution and catalyst loss at every stop and trip, the stacks degrade over the campaign; the DC bus stays live after the trip."
