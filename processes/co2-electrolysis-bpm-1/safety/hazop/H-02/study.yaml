notes: >-
  Agent-prepared draft for a team session; it is not a HAZOP and no session has been held. The
  team (roles above) is not named yet: the owner names the facilitator, scribe and members.
  Every node, scenario, safeguard, rating and action is a proposal by an agent (status
  proposed, by agent). The plant is studied as drawn: the P&ID has no relief device, no H2-in-O2
  measurement on O2V-201, no pressure measurement on the anolyte side (no pressure difference
  across the GDE), no heater (TIC-211 cools only), no eyewash or safety shower at the 5 M KOH
  day tank or the bleed, no check valve on the dosing line KOH-204 and no detector at the vents;
  where the analysis needs one, it is an action, never a safeguard. The on/off and part-load
  duties are not a mode of Skid B: they run on Skid A's hardware only (D-013; dosing would run
  while off).
nodes:
  # ---------------------------------------------------------------- N1 anolyte loop
  - id: H02-N1
    title: Anolyte loop - reservoir T-201, pump P-201, cooler E-211 and the stack anode side (AN-201 to AN-204C)
    design_intent: "Circulate the anolyte, held by dosing, bleed and make-up at the steady state pH 13.7 (concentration basis), 0.5 mol/L OH-, 0.25 mol/L carbon, ionic strength about 1.25 mol/L (D-010), from the PP reservoir T-201 (50 L, D 0.376 x H 0.564 m, about 4.5 min hold-up for O2 disengagement; atmospheric, vented by O2V-201) through AN-201 / HV-201 to the sealless pump P-201 (FIC-201 speed, 705.6 kg/h, about 11.2 L/min, 1.51 bar(a) discharge), through the plate cooler E-211 (about 2.2 kW to cooling water by TV-211 under TIC-211, stack inlet about 22.1 degC) and the supply manifold AN-203 / AN-203A to C to the anode side of E-201A to D (1.41 bar(a)), and back with the anode O2 (about 0.16 kg/h) through AN-204A to C / AN-204 (TSHH-212, about 25 degC) to the reservoir top. Level controlled by LIC-201 (make-up, H02-N7) and protected by the independent LIA-202 (I-202); pH on AIC-201 (trip I-201 at 12.2)."
    members: [T-201, HV-201, AN-201, P-201, AN-202, FIC-201, E-211, TV-211, TIC-211, CWS-201, CWR-201, AN-203, AN-203A, AN-203B, AN-203C, E-201A, E-201B, E-201C, E-201D, AN-204A, AN-204B, AN-204C, AN-204, TSHH-212, LIC-201, LIA-202, AIC-201]
    modes: [startup, normal, dosing, stop, trip, utility-fail, maintenance]
    status: proposed
    by: agent
    notes: "No heater is drawn (TIC-211 cools only). The 50 L reservoir is 1/23 of Skid A's: a loss of level or a dosing upset moves the anolyte within minutes to hours, not days. The dose, bleed and make-up themselves are node H02-N7, the fill and drain H02-N8, the vent O2V-201 H02-N6."
  # ---------------------------------------------------------------- N2 stacks and DC supply
  - id: H02-N2
    title: Stacks E-201A to D and their DC supply, rectifier U-201 (48 V bus)
    design_intent: "As H01-N2 for Skid B: four stacks of seven 100 cm2 bipolar-membrane cells (28 cells) at 200 mA/cm2: 80 A from U-201 under JIC-201 (4 x 20 A, 48 V DC bus, about 3 kW DC; the bus is not drawn), about 2.2 kW of heat to the anolyte; JIC-201 current off also stops the dosing and the bleed (I-207). U-201 is the final element of the trips I-201 to I-206 and stands outside zone Z-HAZ-B at the east end (non-Ex cabinet, D-019). Stack replacement every 4000 h (ASSUMED) by a vertical hand lift (D-023)."
    members: [U-201, JIC-201, E-201A, E-201B, E-201C, E-201D]
    modes: [startup, normal, dosing, stop, trip, utility-fail, maintenance]
    status: proposed
    by: agent
    notes: "The DC bus, its cabling, earthing, isolation and the stack voltage measurement are not drawn (D-017). The anolyte at Skid B is at pH 13.7 throughout, not drifting to 12 as on Skid A: the Ni anode sees a steadier electrolyte, but higher carbonate (0.25 mol/L) from the start."
  # ---------------------------------------------------------------- N3 cathode CO2 feed
  - id: H02-N3
    title: Cathode CO2 feed - fresh CO2 FV-202, PSA recycle CO2-202, humidification W-201, the cathode side of E-201A to D
    design_intent: "As H01-N3 for Skid B: the fresh CO2 0.356 kg/h under FIC-202 / FV-202 (fail closed) at 1.2 bar(a) and 25 degC from the merchant liquefied CO2 supply (D-016), plus the PSA recycle CO2-202 (2.94 kg/h), humidified with 0.261 kg/h of demineralised water (W-201 at 3 bar(a), HV-204 / FI-203 by hand), through CO2-201 / CO2-201B to D to the four stacks at 10 sccm/cm2, the cathode held at about 1.1 bar(a) by PIC-221 (H02-N4)."
    members: [CO2-201, FV-202, FIC-202, W-201, HV-204, FI-203, CO2-201B, CO2-201C, CO2-201D, CO2-202, E-201A, E-201B, E-201C, E-201D]
    modes: [startup, normal, stop, trip, utility-fail, maintenance]
    status: proposed
    by: agent
  # ---------------------------------------------------------------- N4 cathode gas outlet
  - id: H02-N4
    title: Cathode gas outlet - manifold CG-201 to CG-201D, separator V-221, condensate CD-201 / LV-222, back-pressure PV-221
    design_intent: "As H01-N4 for Skid B: collect the cathode gas with its condensate (CG-201B to D into CG-201, 3.39 kg/h at 1.1 bar(a), 25 degC: CO2 about 85, H2 7.1, CO 4.8, H2O 2.9 mol% of the gas), separate in V-221 the condensate (0.131 kg/h with K2CO3, about 1 mol/kg ASSUMED) to the site effluent on level (LIC-222 / LV-222, fail closed), and pass the gas through CG-202 with the cathode back-pressure held by PIC-221 / PV-221 (direct, fail open) to K-231."
    members: [CG-201B, CG-201C, CG-201D, CG-201, V-221, LIC-222, LV-222, CD-201, CG-202, PIC-221, PV-221, E-201A, E-201B, E-201C, E-201D]
    modes: [startup, normal, stop, trip, utility-fail, maintenance]
    status: proposed
    by: agent
    notes: "The cathode sees the K+ crossover of an anolyte held at 0.5 mol/L OH- and 0.25 mol/L carbon (Skid A: 1 M falling to about 0.4 M carbonate): the carbonate precipitation and GDE flooding question is the same, the anolyte state behind it differs."
  # ---------------------------------------------------------------- N5 gas conditioning
  - id: H02-N5
    title: Gas conditioning - compressor K-231, CG-203 and its check valve, CO PSA X-231, CO product CO-201 / PV-231, CO2 recycle CO2-202
    design_intent: "As H01-N5 for Skid B: compress the cathode gas in the diaphragm compressor K-231 from about 1.1 to 6 bar(a) (40 degC) through CG-203 and its check valve to the PSA package X-231 (black box), which delivers 0.1008 kg/h CO at 0.99 mol/mol dry at 5.0 bar(a) through PV-231 under PIC-231 (fail closed, open point), returns 0.95 of the unreacted CO2 through CO2-202 and sends the tail gas to X-232 (H02-N6). K-231 is stopped by I-203 and I-204."
    members: [K-231, CG-203, {sheet: P-02, object: CV231}, X-231, CO-201, PV-231, PIC-231, CO2-202]
    modes: [startup, normal, stop, trip, utility-fail, maintenance]
    status: proposed
    by: agent
    notes: "No relief device is drawn on CG-203 or on the PSA (D-017)."
  # ---------------------------------------------------------------- N6 tail gas and vents
  - id: H02-N6
    title: Tail gas and vents - oxidiser X-232 (TG-201, AIR-201, FG-201), the reservoir vent O2V-201 and the day tank breather KV-202
    design_intent: "As H01-N6 for Skid B: burn the PSA tail gas TG-201 (0.221 kg/h, H2 about 48, CO2 29, H2O 20, CO 3.3 mol%) in X-232 with twice the stoichiometric air AIR-201 (0.854 kg/h), no CO or H2 vented, the flue gas FG-201 (about 150 degC) to atmosphere above the walking levels; vent the anode O2 (about 0.16 kg/h, and any H2 crossed) from the 50 L T-201 head space through the open vent O2V-201; and let the 5 M KOH day tank T-202 breathe through KV-202 (DN 15, air in on the continuous draw by P-202, air with caustic mist out on the weekly fill; the breather type is the vendor's, D-023)."
    members: [TG-201, X-232, AIR-201, FG-201, O2V-201, T-201, KV-202, T-202]
    modes: [startup, normal, dosing, stop, trip, utility-fail, maintenance]
    status: proposed
    by: agent
    notes: "The 50 L reservoir has a small head space: the H2 that crosses into the anolyte reaches O2V-201 with a shorter residence than in T-101 (H01-N6)."
  # ---------------------------------------------------------------- N7 dosing, bleed, make-up
  - id: H02-N7
    title: KOH dosing, bleed and make-up - day tank T-202, metering pump P-202 (AIC-201), bleed BL-201 / FV-203, make-up W-202 / LV-201
    design_intent: "Hold the 50 L anolyte at its steady state (D-010) with the current on: dose 5 M KOH (1.22 kg/L ASSUMED; 0.511 kg/h, about 0.42 L/h at 80 A) from the PP day tank T-202 (84.5 L, refilled weekly by hand through KOH-202 / HV-205, level LIA-203 with LAL and low-low I-208) through KOH-203 with the diaphragm metering pump P-202 (about 4 bar(a) discharge, base rate fed forward from JIC-201, trimmed by AIC-201 around pH 13.7, AAL 13.5) and KOH-204 into the reservoir top; bleed the anolyte by gravity from the reservoir bottom through the BL-201 branch of SP-201 (upstream of HV-203) and FV-203 (fail closed) at about 1.87 L/h (1.96 kg/h, FIC-203) to the site effluent; make up demineralised water W-202 (3 bar(a)) on level through LV-201 (fail closed, LIC-201) at about 1.45 L/h. P-202 stops and FV-203 closes with the current off (I-207), on the reservoir low-low level (I-202) and P-202 on the day tank low-low (I-208)."
    members: [T-202, LIA-203, KOH-202, HV-205, KOH-203, P-202, KOH-204, AIC-201, JIC-201, BL-201, FV-203, FIC-203, SP-201, W-202, LV-201, LIC-201, LIA-202, T-201]
    modes: [startup, dosing, stop, trip, utility-fail, maintenance]
    status: proposed
    by: agent
    notes: "The pH probe reads activity pH; the setpoint 13.7, the alarm 13.5 and the trip 12.2 are concentration-basis values that need an offset or a calibration before use (control/philosophy.md). The gravity bleed of about 1.9 L/h through a control valve is at the edge of controllability; a metering pump is the alternative (D-017). The weekly refill of T-202 has no written sequence."
  # ---------------------------------------------------------------- N8 fill and drain
  - id: H02-N8
    title: Anolyte fill and end-of-campaign drain - KOH-201 / HV-202 and SP-201 / HV-203 at T-201
    design_intent: "Fill T-201 with fresh 1 M KOH (50 L) through KOH-201 / HV-202 to the working level (SEQ-B-FILL, U-201 off, HV-203 closed); at the end of the campaign drain the anolyte at its steady state (pH about 13.7, 0.5 mol/L OH-, 0.25 mol/L carbon) by gravity through SP-201 / HV-203 to the site effluent with P-201 stopped and LV-201 closed (SEQ-B-DRAIN)."
    members: [KOH-201, HV-202, T-201, LIC-201, LIA-202, SP-201, HV-203]
    modes: [startup, exchange, maintenance]
    status: proposed
    by: agent
  # ---------------------------------------------------------------- N9 enclosure
  - id: H02-N9
    title: Skid B enclosure - extract fan K-241, gas detection AIA-241 (CO) and AIA-242 (H2), zone Z-HAZ-B
    design_intent: "As H01-N9 for Skid B: keep the (ASSUMED) enclosed Skid B free of CO, H2 and excess CO2: K-241 runs from start-up (SEQ-B-START S1) and is started by the gas trips; AIA-241 (CO, I-203) and AIA-242 (H2, I-204), at ASSUMED locations and set points, trip U-201, close FV-202, stop K-231 and start K-241 (SEQ-B-GAS). The release sources of zone 2 Z-HAZ-B are the flanges of E-201A to D, V-221, K-231, X-231 and X-232 (screening only); U-201 stands outside it (D-019). Skid B adds the 5 M KOH day tank T-202 and P-202 at the west end."
    members: [K-241, AIA-241, AIA-242, U-201, E-201A, E-201B, E-201C, E-201D, V-221, K-231, X-231, X-232, T-202, P-202]
    modes: [startup, normal, dosing, exchange, stop, trip, utility-fail, maintenance]
    status: proposed
    by: agent
    notes: "The enclosure is an assumption of the control (D-017, D-019), not drawn or sized. No CO2 or O2 detector is drawn."
# shared register of what P-02 and the C&E have (proposed); a node adds its own as H02-SG-N<k>-<name>
safeguards:
  - {id: H02-SG-I201, title: "I-201 anolyte pH low-low (AIC-201 AALL, pH 12.2 concentration basis) trips U-201", kind: interlock, interlock: I-201, refs: [AIC-201, U-201], status: proposed, by: agent, notes: "Shares its probe with the AIC-201 dose trim (a probe drift is both the cause and the defeat of the trip). sil: null."}
