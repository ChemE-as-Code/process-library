            consequence: "No hydroxide is added while the stacks consume it: the 50 L (about 25 mol OH-) fall below pH 12 within about a day (ASSUMED from D-010): Ni anode corrosion and bipolar membrane degradation, stack damage."
            refs: [P-202, T-202, LIA-203, KOH-203, KOH-204, AIC-201, T-201]
