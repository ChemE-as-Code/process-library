          - id: H02-S102
            cause: "FIC-201 transmitter fails reading high (or drifts high): the flow loop slows P-201 and the true anolyte flow falls well below 705.6 kg/h."
            consequence: "Low anolyte flow through the stacks at 80 A: heating and drying of the anodes and the membranes, stack damage; the FAL and the trip I-206 read the same failed transmitter and do not act."
            refs: [FIC-201, P-201, E-201A, E-201B, E-201C, E-201D, TSHH-212]
