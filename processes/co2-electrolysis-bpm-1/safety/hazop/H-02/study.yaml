risk_matrix: safety/risk-matrix.yaml
assessment_basis: >-
  As H-01: IEC 61882 guide words applied to the parameters of each node's design intent (flow,
  pressure, pressure difference across the gas diffusion electrode, temperature, level,
  composition incl. pH and carbonate, current and voltage), in every mode that applies. Each
  scenario (one cause, one consequence) is rated per category of safety/risk-matrix.yaml
  (people, environment, asset incl. production loss): initial with no safeguard credited
  (likelihood of the cause), residual with only the safeguards named in the scenario that exist
  in the files (an alarm with operator response, an interlock of control/cause-effect.yaml, a
  check valve on the P&ID, a fail position or another recorded mechanical design feature, a
  written sequence step); a regulatory loop of control/loops.yaml is never counted as a
  safeguard (control/philosophy.md), only its alarm with the operator's response. Ratings are proposed by an agent at the concept stage from the files
  and DESIGN.md, with basis and evidence, for the team to accept or change; no frequency is
  calculated and no LOPA credit is taken here. The matrix itself is a proposal (ASSUMED).
  Credit convention for the residual likelihood (one matrix letter is one order of magnitude;
  a proposal for the team, not a LOPA): a passive feature that removes the path (an open vent
  without a valve, an item placed outside its zone), up to two orders; an alarm with operator
  response (counted toward mitigation, not an independent layer: safeguard-crediting skill), a
  check valve, a fail position, a sequence step or procedure, a trip of the C&E whose SIL is not
  confirmed (every trip here, sil: null), one order each; nothing for a safeguard
  that shares a transmitter, valve or logic with the cause or that the cause defeats (e.g. I-201
  shares the AIC-201 probe with the dosing trim, I-206 shares FIC-201 with the flow loop), nor
  for a relief device, since none is drawn on P-02. I-207 is a permissive (latching false,
  automatic reset), not a safety trip: it is credited, if at all, as a control function.
