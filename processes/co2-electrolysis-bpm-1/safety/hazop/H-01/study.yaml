notes: >-
  Agent-prepared draft for a team session; it is not a HAZOP and no session has been held. The
  team (roles above) is not named yet: the owner names the facilitator, scribe and members.
  Every node, scenario, safeguard, rating and action is a proposal by an agent (status
  proposed, by agent). The plant is studied as drawn: the P&ID has no relief device, no H2-in-O2
  measurement on O2V-101, no pressure measurement on the anolyte side (no pressure difference
  across the GDE), no heater (TIC-111 cools only), no eyewash or safety shower and no
  detector at the vents; where the analysis needs one, it is an action, never a safeguard.
nodes:
  # ---------------------------------------------------------------- N1 anolyte loop
  - id: H01-N1
    title: Anolyte loop - reservoir T-101, pump P-101, cooler E-111 and the stack anode side (AN-101 to AN-104C)
    design_intent: "Circulate the anolyte (fresh 1 M KOH at the fill, drifting to pH 12.0 concentration basis, about 0.40 mol/L carbon and 0.80 mol/L K+ at H; D-009) from the PP reservoir T-101 (1166 L working volume at 1000 h, D 1.074 x H 1.611 m; 11,660 L, D 2.313 x H 3.470 m at 10,000 h; atmospheric, vented by O2V-101) through AN-101 / HV-101 to the sealless recirculation pump P-101 (FIC-101 speed, 705.6 kg/h, about 11.2 L/min, 1.51 bar(a) discharge), through the plate cooler E-111 (about 2.2 kW to cooling water by TV-111 under TIC-111, stack inlet about 22.1 degC) and the supply manifold AN-103 / AN-103A to C to the anode side of E-101A to D (1.41 bar(a)), and back with the anode O2 (about 0.16 kg/h) through the return manifold AN-104A to C / AN-104 (TSHH-112, about 25 degC) to the reservoir top, where the O2 disengages. Level on LIA-101, pH on AI-101 (AAL about 12.5, trip I-101 at 12.0); nothing is dosed during the run."
    members: [T-101, HV-101, AN-101, P-101, AN-102, FIC-101, E-111, TV-111, TIC-111, CWS-101, CWR-101, AN-103, AN-103A, AN-103B, AN-103C, E-101A, E-101B, E-101C, E-101D, AN-104A, AN-104B, AN-104C, AN-104, TSHH-112, LIA-101, AI-101]
    modes: [startup, normal, onoff-partload, stop, trip, utility-fail, maintenance]
    status: proposed
    by: agent
    notes: "No heater is drawn: TIC-111 can only cool, so the anolyte runs at ambient (the 25 degC of the measured series is ASSUMED, D-007). The reservoir's own fill and drain (KOH-101, SP-101) are node H01-N8; its vent O2V-101 is node H01-N6. The O2 that disengages in T-101 carries any H2 that crossed the bipolar membrane (control/philosophy.md unresolved)."
  # ---------------------------------------------------------------- N2 stacks and DC supply
  - id: H01-N2
    title: Stacks E-101A to D and their DC supply, rectifier U-101 (48 V bus)
    design_intent: "Electrolyse CO2 to CO in four stacks of seven 100 cm2 bipolar-membrane cells (reverse bias, Ag GDE cathode, Ni anode; 28 cells) at 200 mA/cm2 constant current: 80 A from the rectifier U-101 under JIC-101 (4 x 20 A, on a 48 V DC bus, about 3 kW DC, efficiency 0.95 ASSUMED; the bus is not drawn), with about 2.2 kW of heat to the anolyte, at the measured operating point (FE and voltage of the measured series, ASSUMED to transfer from 5 to 100 cm2, D-007, D-014). U-101 is the final element of every trip I-101 to I-106 and stands outside zone Z-HAZ-A at the east end (a non-Ex cabinet, D-019). A stack is replaced every 4000 h (ASSUMED) by a vertical hand lift (D-023)."
    members: [U-101, JIC-101, E-101A, E-101B, E-101C, E-101D]
    modes: [startup, normal, onoff-partload, stop, trip, utility-fail, maintenance]
    status: proposed
    by: agent
    notes: "The DC bus, its cabling, earthing, isolation and the stack voltage measurement are not drawn (D-017; electrical/README.md). The cell's internal parameters (pressure difference across the GDE, crossover through the membrane) are studied with the nodes that set them: the anolyte pressure in H01-N1, the cathode pressure in H01-N3 / H01-N4."
  # ---------------------------------------------------------------- N3 cathode CO2 feed
  - id: H01-N3
    title: Cathode CO2 feed - fresh CO2 FV-102, PSA recycle CO2-102, humidification W-101, the cathode side of E-101A to D
    design_intent: "Feed the cathodes with CO2 at the measured ratio of 10 sccm/cm2 (the fresh CO2 0.356 kg/h under FIC-102 / FV-102, fail closed, at 1.2 bar(a) and 25 degC from the merchant liquefied CO2 supply at the battery limit, D-016; plus the PSA recycle CO2-102, 2.94 kg/h), humidified with 0.261 kg/h of demineralised water (W-101 at 3 bar(a), set by hand on HV-104 / FI-103), through the feed manifold CO2-101 / CO2-101B to D to the four stacks, the cathode held at about 1.1 bar(a) by PIC-121 downstream (H01-N4)."
    members: [CO2-101, FV-102, FIC-102, W-101, HV-104, FI-103, CO2-101B, CO2-101C, CO2-101D, CO2-102, E-101A, E-101B, E-101C, E-101D]
    modes: [startup, normal, onoff-partload, stop, trip, utility-fail, maintenance]
    status: proposed
    by: agent
    notes: "The CO2 supply's storage, vaporiser and pressure reduction are beyond the battery limit and not drawn: a cold or liquid CO2 carry-over and the supply pressure are causes from outside the node; the team names the supply's own protection."
  # ---------------------------------------------------------------- N4 cathode gas outlet
  - id: H01-N4
    title: Cathode gas outlet - manifold CG-101 to CG-101D, separator V-121, condensate CD-101 / LV-122, back-pressure PV-121
    design_intent: "Collect the cathode gas with its condensate from the four stacks (CG-101B to D into CG-101, 3.39 kg/h at 1.1 bar(a) and 25 degC: CO2 about 85, H2 7.1, CO 4.8, H2O 2.9 mol% of the gas), separate in V-121 the condensate (0.131 kg/h, the K+ that crossed to the cathode as K2CO3 at about 1 mol/kg ASSUMED, D-012) to the site effluent on level (LIC-122 / LV-122, fail closed), and pass the saturated gas through CG-102 with the cathode back-pressure held by PIC-121 / PV-121 (direct acting, fail open, D-018) to the compressor suction."
    members: [CG-101B, CG-101C, CG-101D, CG-101, V-121, LIC-122, LV-122, CD-101, CG-102, PIC-121, PV-121, E-101A, E-101B, E-101C, E-101D]
    modes: [startup, normal, onoff-partload, stop, trip, utility-fail, maintenance]
    status: proposed
    by: agent
  # ---------------------------------------------------------------- N5 gas conditioning
  - id: H01-N5
    title: Gas conditioning - compressor K-131, CG-103 and its check valve, CO PSA X-131, CO product CO-101 / PV-131, CO2 recycle CO2-102
    design_intent: "Compress the cathode gas in the diaphragm compressor K-131 (positive displacement) from about 1.1 to 6 bar(a) (40 degC) through CG-103 and its check valve to the PSA package X-131 (black box, D-012), which delivers 0.1008 kg/h CO at 0.99 mol/mol dry (H2 the rest) at 5.0 bar(a) through PV-131 under PIC-131 (fail closed, open point) to the battery limit, returns 0.95 of the unreacted CO2 (2.94 kg/h) to the cathode feed through CO2-102, and sends the rest with the H2 and water as tail gas to X-132 (H01-N6). K-131 is stopped by I-103 and I-104."
    members: [K-131, CG-103, {sheet: P-01, object: CV131}, X-131, CO-101, PV-131, PIC-131, CO2-102]
    modes: [startup, normal, onoff-partload, stop, trip, utility-fail, maintenance]
    status: proposed
    by: agent
    notes: "No relief device is drawn on K-131's discharge CG-103 or on the PSA (D-017; control/philosophy.md unresolved): the governing relief scenario is named in the actions, not sized. The PSA's own pressure protection is the vendor's (open point)."
  # ---------------------------------------------------------------- N6 tail gas and vents
  - id: H01-N6
    title: Tail gas and vents - oxidiser X-132 (TG-101, AIR-101, FG-101) and the reservoir vent O2V-101
    design_intent: "Burn the PSA tail gas TG-101 (0.221 kg/h at 1.1 bar(a): H2 about 48, CO2 29, H2O 20, CO 3.3 mol%) completely in the oxidiser package X-132 with twice the stoichiometric air AIR-101 (0.854 kg/h), so that no CO or H2 is vented (D-012), and vent the flue gas FG-101 (about 150 degC, CO2, H2O, N2, 8 mol% O2) to atmosphere above the walking levels (about 3.4 m, D-019); vent the anode O2 (about 0.16 kg/h with water vapour, and any H2 crossed through the membrane) from the T-101 head space through the open DN 25 vent O2V-101 to a safe location at atmospheric pressure."
    members: [TG-101, X-132, AIR-101, FG-101, O2V-101, T-101]
    modes: [startup, normal, onoff-partload, stop, trip, utility-fail, maintenance]
    status: proposed
    by: agent
    notes: "X-132 is a black box (D-012): its flame or catalyst supervision, air flow and temperature protection are not drawn and are the vendor's. Skid A has no KOH day tank: the KV-202 breather is Skid B's (H02-N6)."
  # ---------------------------------------------------------------- N8 fill and drain
  - id: H01-N8
    title: Anolyte fill and end-of-campaign drain - KOH-101 / HV-102 and SP-101 / HV-103 at T-101
    design_intent: "Fill T-101 once per campaign with fresh 1 M KOH from a tanker or IBCs at the hose connection at the frame's west end through KOH-101 / HV-102 to the working level on LIA-101 (1166 L at 1000 h; 11,660 L at 10,000 h, D-009), with U-101 off and HV-103 closed (SEQ-A-FILL permissives); at the end of the campaign drain the spent anolyte (pH about 12, about 0.4 mol/L carbonate) by gravity through SP-101 / HV-103 to the site effluent, then rinse (SEQ-A-DRAIN), with U-101 off and P-101 stopped."
    members: [KOH-101, HV-102, T-101, LIA-101, SP-101, HV-103]
    modes: [startup, exchange, maintenance]
    status: proposed
    by: agent
  # ---------------------------------------------------------------- N9 enclosure
  - id: H01-N9
    title: Skid A enclosure - extract fan K-141, gas detection AIA-141 (CO) and AIA-142 (H2), zone Z-HAZ-A
    design_intent: "Keep the atmosphere of the (ASSUMED) enclosed Skid A free of CO, H2 and excess CO2: the extract fan K-141 runs from start-up (SEQ-A-START S1) and is started by the gas trips; the CO detector AIA-141 (I-103) and the H2 detector AIA-142 (I-104), at ASSUMED locations with set points from a gas detection study not yet made, trip U-101, close FV-102, stop K-131 and start K-141, isolating the cathode gas train (SEQ-A-GAS). The release sources of zone 2 Z-HAZ-A are the flanges of E-101A to D, V-121, K-131, X-131 and X-132 (layout/zones.yaml, screening only); the rectifier U-101, the main ignition source, stands outside it (D-019)."
    members: [K-141, AIA-141, AIA-142, U-101, E-101A, E-101B, E-101C, E-101D, V-121, K-131, X-131, X-132]
    modes: [startup, normal, onoff-partload, exchange, stop, trip, utility-fail, maintenance]
    status: proposed
    by: agent
    notes: "The enclosure itself is an assumption of the control (D-017, D-019): it is not drawn and its volume, air changes and the fan duty are not sized. No CO2 or O2 detector is drawn. The releases inside the frame are studied here from every node (the causes stay with their node, the detection and ventilation here)."
# shared register of what P-01 and the C&E have (proposed); a node adds its own as H01-SG-N<k>-<name>
safeguards:
  - {id: H01-SG-I101, title: "I-101 anolyte pH low-low (AI-101 AALL, pH 12.0 concentration basis) trips U-101", kind: interlock, interlock: I-101, refs: [AI-101, U-101], status: proposed, by: agent, notes: "At the threshold itself (D-009, D-018): it does not end a normal campaign and gives no margin below pH 12. Single probe shared with the AI-101 alarm; the activity / concentration pH offset is open (control/philosophy.md). sil: null."}
  - {id: H01-SG-I102, title: "I-102 anolyte level low-low (LIA-101 LALL) trips U-101 and stops P-101", kind: interlock, interlock: I-102, refs: [LIA-101, U-101, P-101], status: proposed, by: agent, notes: "LIA-101 is the only level instrument of T-101 (it also carries the LAL alarm). sil: null."}
  - {id: H01-SG-I103, title: "I-103 CO detected in the enclosure (AIA-141 AHH) trips U-101, closes FV-102, stops K-131, starts K-141", kind: interlock, interlock: I-103, refs: [AIA-141, U-101, FV-102, K-131, K-141], status: proposed, by: agent, notes: "One detector, location and set point ASSUMED (gas detection study not made). sil: null."}
  - {id: H01-SG-I104, title: "I-104 H2 detected in the enclosure (AIA-142 AHH) trips U-101, closes FV-102, stops K-131, starts K-141", kind: interlock, interlock: I-104, refs: [AIA-142, U-101, FV-102, K-131, K-141], status: proposed, by: agent, notes: "One detector, location and set point ASSUMED. sil: null."}
  - {id: H01-SG-I105, title: "I-105 anolyte temperature high-high at the stack outlet (TSHH-112) trips U-101", kind: interlock, interlock: I-105, refs: [TSHH-112, U-101], status: proposed, by: agent, notes: "TSHH-112 is a separate element from TIC-111 (stack inlet). Trip value ASSUMED. sil: null."}
  - {id: H01-SG-I106, title: "I-106 anolyte recirculation flow low-low (FIC-101 FALL, 5 s delay) trips U-101", kind: interlock, interlock: I-106, refs: [FIC-101, U-101], status: proposed, by: agent, notes: "Shares its transmitter with the flow loop FIC-101 (C&E note: HAZOP to judge): no credit against a FIC-101 transmitter fault. sil: null."}
  - {id: H01-SG-FIC101-FAL, title: "FIC-101 low anolyte flow alarm (operator checks P-101 and the manifold)", kind: alarm, refs: [FIC-101], status: proposed, by: agent, notes: "Same transmitter as the loop and I-106."}
  - {id: H01-SG-TIC111-TAH, title: "TIC-111 high anolyte temperature alarm at the stack inlet (operator checks the cooling water and TV-111)", kind: alarm, refs: [TIC-111], status: proposed, by: agent}
  - {id: H01-SG-FIC102-FAL, title: "FIC-102 low fresh CO2 flow alarm (operator reduces the current: without CO2 the stacks make H2 only)", kind: alarm, refs: [FIC-102], status: proposed, by: agent}
  - {id: H01-SG-PIC121-PAH, title: "PIC-121 high cathode back-pressure alarm (operator checks K-131 and PV-121; membrane pressure difference limited, vendor)", kind: alarm, refs: [PIC-121], status: proposed, by: agent}
