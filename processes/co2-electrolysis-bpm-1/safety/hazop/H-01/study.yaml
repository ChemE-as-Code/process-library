    title: Tail gas and vents - oxidiser X-132 (TG-101, AIR-101, FG-101) and the reservoir vent O2V-101
    design_intent: "Burn the PSA tail gas TG-101 (0.221 kg/h at 1.1 bar(a): H2 about 48, CO2 29, H2O 20, CO 3.3 mol%) completely in the oxidiser package X-132 with twice the stoichiometric air AIR-101 (0.854 kg/h), so that no CO or H2 is vented (D-012), and vent the flue gas FG-101 (about 150 degC, CO2, H2O, N2, 8 mol% O2) to atmosphere above the walking levels (about 3.4 m, D-019). TG-101 leaves X-131 inside Z-HAZ-A through the fail-closed trip valve XV-133, a check valve and the in-line detonation arrester FA-133 (EN ISO 16852, IIC, unstable detonation, unidirectional, protected side towards X-131), with TSHH-133 on the arrester's unprotected side tripping XV-133 (I-109); it is all-welded from there, overhead on posts (rising to 2.4 m just north of the frame and falling 1:100 to the drop at the oxidiser, 1.0 m from the flue riser), to X-132 on its plinth south-east of the frame, with a drip leg and a valved, capped drain at each of its two low points (DR-102 / HV-111 at the riser's foot, DR-103 / HV-112 before X-132), trace-heated and insulated (D-054, D-057, D-065, D-068). The gas trips I-103 and I-104 and the burner management trip I-110 close XV-133. Vent the anode O2 (about 0.16 kg/h with water vapour, and any H2 crossed through the membrane) from the T-101 head space through the open DN 25 vent O2V-101 to a safe location at atmospheric pressure."
    members: [TG-101, XV-133, {sheet: P-01, object: CV133}, FA-133, TSHH-133, X-132, AIR-101, FG-101, O2V-101, T-101, DR-102, HV-111, DR-103, HV-112]
