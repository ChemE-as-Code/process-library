notes: >-
  Agent-prepared draft for a team session; it is not a HAZOP and no session has been held. The
  team (roles above) is not named yet: the owner names the facilitator, scribe and members.
  Every node, scenario, safeguard, rating and action is a proposal by an agent (status
  proposed, by agent). The plant is studied as drawn: the P&ID has no relief device, no H2-in-O2
  measurement on O2V-101, no pressure measurement on the anolyte side (no pressure difference
  across the GDE), no heater (TIC-111 cools only), no eyewash or safety shower and no
  detector at the vents; where the analysis needs one, it is an action, never a safeguard.
  H-01 and H-02 were drafted apart and then integrated (DESIGN.md D-030): the hardware the two
  skids share is examined alike and rated by one convention (a utility upset or a routine
  hose task E, a single failure D; the initial likelihood is that of the cause; an alarm seen
  only after the damage is not credited). H01-S208, S410, S411, S507 and S508 mirror
  H-02's analysis; where the two studies still rate the same hazard differently, the design
  differs and the basis says why (safety/hazop/SESSION.md section 3.4). A review of the draft
  (DESIGN.md D-030) then added H01-S309 (the start-up purge with no outlet), S509 (back-flow
  through the recycle CO2-102), S510 (loss of the recycle), S610 (flashback along TG-101) and
  S906 (X-132 as an ignition source), each mirrored in H-02, and re-rated the residuals that
  credited a safeguard the cause defeats or counted one final element twice.
nodes:
