notes: >-
  Agent-prepared draft for a team session; it is not a HAZOP and no session has been held. The
  team (roles above) is not named yet: the owner names the facilitator, scribe and members.
  Every node, scenario, safeguard, rating and action is a proposal by an agent (status
  proposed, by agent). The plant is studied as drawn: up to P&ID revision B it had no relief
  device, no H2-in-O2 measurement on O2V-101 and no pressure measurement on the anolyte side;
  revision C draws them (D-060 to D-063); it still has no eyewash or safety shower and no
  detector at the vents; where the analysis needs one, it is an action, never a safeguard.
  H-01 and H-02 were drafted apart and then integrated (DESIGN.md D-030): the hardware the two
  skids share is examined alike and rated by one convention (a utility upset or a routine
  hose task E, a single failure D; the initial likelihood is that of the cause; an alarm seen
  only after the damage is not credited). H01-S208, S410, S411, S507 and S508 mirror
  H-02's analysis; where the two studies still rate the same hazard differently, the design
  differs and the basis says why (safety/hazop/SESSION.md section 3.4). A review of the draft
  (DESIGN.md D-030) then added H01-S309 (the start-up purge with no outlet), S509 (back-flow
  through the recycle CO2-102), S510 (loss of the recycle), S610 (flashback along TG-101) and
  S906 (X-132 as an ignition source), each mirrored in H-02, and re-rated the residuals that
  credited a safeguard the cause defeats or counted one final element twice. Revised by an
  agent on 2026-11-06 for the owner's decisions D-050 to D-058 (decided by the owner, to be
  confirmed by the team; every revised entry stays proposed): the open, naturally ventilated
  skid with no enclosure or extract fan K-141 (node N9 rewritten, "in the enclosure" read as
  "at the open skid" throughout, the fan's credits removed); the Ex marking in the zone
  (H01-S903, A903); the tail gas's trip valve XV-133, check valve, detonation arrester FA-133
  and the trips I-109 and I-110 (H01-S601, S602, S610, the new S611, A605, A907); the tempered
  water TWS/TWR (H01-S107, S109, S116, A105); the drains DR-101, AV-111 and PO-101 with the new
  SEQ-A-DRAIN (H01-S117, S804, A111, A206); the rectifier and the oxidiser on plinths off the
  frame (H01-S207, S906); I-101 at pH 12.2 with T-101 sized to it (H01-S113, S114, A108).
  Revised again by an agent on 2026-11-06 for P&ID revision C (the design review
  2026-11-06-design, D-060 to D-066; every revised entry proposed): the cathode's relief and
  pressure trip, the compressor's discharge trip, the compressor-stop and instrument-air trips,
  the H2-in-O2 analyser and the membrane's pressure difference, the total CO2 trip, the
  condensate level trips, the stack current trip, the check valves and the recycle's shut-off,
  the fill alarms, the start-up order and the depressurisation through the PSA, as new
  safeguards (H01-SG-I111 to I120, PSE101, K131-HYD, CV102, CV104, XV134, STACK-MON,
  LIA101-LAHH, SEQ-A-ORDER, SEQ-A-DEPRESS) of H01-S104, S105, S115, S201, S208, S301, S302,
  S305, S308, S309, S401 to S407, S411, S501, S502, S509, S510, S606, S801 and S905, re-rated,
  and the actions that asked for them carrying them as proposed responses.
  Revised again by an agent on 2026-11-07 for P&ID revision D (the agent reviews
  2026-11-06-design-r2 and 2026-11-06-layout-r4, D-067 to D-069; every revised or added entry
  proposed): the register's I-111 (PIA-116 beside the disc, XS-101), I-117 (each end of the
  stacks), I-118 and XV-134 (trip valves drawn with their actuators) and SEQ-A-DEPRESS (the
  feed closed first, the cathode drawn down to a residual pressure before K-131 stops); H01-S305
  as drawn, with I-111 no longer credited where FV-102 failing open is the cause; the tail
  gas's low points (the new H01-N6-D11 / S612, safeguard H01-SG-N6-TG-DRIP, action H01-A606);
  the responses of H01-A103 and H01-A303.
