# HAZOP study H-01: a DRAFT until the team has accepted every entry and a
# human review record covers it (cheme safety hazop check). Schema: cheme schema
# hazop-study; workflow: safety/README.md and the skill hazop-study.
#
# AGENT-PREPARED DRAFT for a team session (#330 pilot skids). No HAZOP session has been held:
# every node, scenario, safeguard, rating and action below is a proposal by an agent
# (status proposed, by agent) for the team to accept, change or reject.
#
# Id conventions (stable, never renumbered or reused; the list order is display order only):
#   nodes H01-N<k>; deviations H01-N<k>-D<j>; scenarios H01-S<k><nn> (node k, nn 01..99);
#   safeguards H01-SG-<tag or interlock, without the hyphen> for the shared register below,
#   H01-SG-N<k>-<name> for a node's own; actions H01-A<k><nn> (node k). N7 is Skid B's dosing
#   node (H-02): it is not used here, so a node number means the same part of the plant in both
#   studies.
schema: cheme/hazop-study/v1
kind: hazop-study
id: H-01
title: 'Skid A: one-fill anolyte reservoir'
scope: >-
  Sheet P-01 (pid/P-01.xml) as drawn, Skid A of #330 (1xx tags, case skid-a, DESIGN.md D-007,
  D-009): the anolyte loop T-101 / P-101 / E-111 with the supply and return manifolds
  AN-101 to AN-104C and the anode side of the four stacks E-101A to D; the stacks and their DC
  supply, the rectifier U-101 (the 48 V DC bus is not drawn); the cathode CO2 feed CO2-101 to
  CO2-101D with FV-102, the PSA recycle CO2-102 and the humidification water W-101 / HV-104;
  the cathode gas outlet CG-101 to CG-101D, the separator V-121 with its condensate CD-101 /
  LV-122 and the back-pressure valve PV-121 on CG-102; the gas conditioning, the diaphragm
  compressor K-131, CG-103 with its check valve, the CO PSA package X-131 and the CO product
  CO-101 / PV-131 to the battery limit; the tail-gas oxidiser X-132 (TG-101, AIR-101, FG-101)
  and the anolyte reservoir vent O2V-101; the one fill KOH-101 / HV-102 and the end-of-run
  drain SP-101 / HV-103; the skid enclosure with its extract fan K-141 and the gas detectors
  AIA-141 (CO) and AIA-142 (H2). The trips are those of control/cause-effect.yaml I-101 to
  I-106, the sequences SEQ-A-FILL, -START, -STOP, -TRIP, -GAS and -DRAIN of
  control/sequences.yaml. Battery limits: the CO2 supply (merchant liquefied CO2, D-016, its
  storage and vaporiser are not drawn and not studied beyond the CO2-101 tie-in), the cooling
  water CWS-101 / CWR-101, the demineralised water W-101, the combustion air AIR-101, the
  1 M KOH delivery to the KOH-101 hose connection, the spent anolyte, condensate and CO product
  receivers (site effluent, CO-101 consumer), instrument air and power. Not covered: the
  internals of the black-box packages X-131 and X-132 (D-012; the vendor's package HAZOP), the
  stack vendor's internal design beyond the drawn connections, the site's area classification
  (layout/zones.yaml is a screening only, D-019), relief device sizing (only the governing
  scenario is named) and Skid B, which is H-02.
modes:
  - {id: startup, title: 'Start-up: fill, purge, energise', description: "SEQ-A-FILL (fresh 1 M KOH through HV-102 to the working level, circulate) and SEQ-A-START (ventilate K-141, cool TIC-111, purge and humidify the cathodes with CO2, start K-131, X-132 then X-131, ramp JIC-101 to 80 A)."}
  - {id: normal, title: Normal steady operation, description: "Duty D-A: 200 mA/cm2 constant current (80 A, 4 x 20 A, 28 cells of 100 cm2, about 3 kW DC on the 48 V bus) on one fill, the anolyte drifting from fresh 1 M KOH to pH 12.0 (concentration basis) at the end of the campaign H (1000 h design, 10,000 h scenario)."}
  - {id: onoff-partload, title: On/off and part-load duties on the same hardware, description: "D-A-ONOFF (24 h period, half on, current switched off and on daily) and D-A-PART (12 h at 200 and 12 h at 100 mA/cm2, current steps) on STK-A and T-101 as for D-A (D-013): the same hardware, more current transitions."}
  - {id: exchange, title: 'Anolyte refill / exchange at the end of the campaign', description: "SEQ-A-STOP or a trip, then SEQ-A-DRAIN (P-101 stopped, the spent anolyte drained through HV-103 to the site effluent, rinse) and a new SEQ-A-FILL; the 1166 L (1000 h) or 11,660 L (10,000 h) of T-101 handled as hose transfers at the frame's west end (D-019)."}
  - {id: stop, title: Normal stop, description: "SEQ-A-STOP at H: ramp the current down, purge the cathodes with CO2 to the oxidiser, stop K-131, X-131, X-132."}
  - {id: trip, title: Trip and gas trip, description: "SEQ-A-TRIP after I-101, I-102, I-105 or I-106 (current off, CO2 purge kept, P-101 runs unless I-102 stopped it); SEQ-A-GAS after I-103 or I-104 (current off, FV-102 closed, K-131 stopped, K-141 started, the cathode gas train isolated with its CO and H2 until the leak is found, then purged to X-132)."}
  - {id: utility-fail, title: 'Loss of power, instrument air or cooling water', description: "control/philosophy.md F-POWER, F-AIR, F-CW: the pneumatic valves TV-111, FV-102, PV-121, LV-122, PV-131 go to their fail positions; on power loss the rectifier, pumps, compressor and fan stop."}
  - {id: maintenance, title: Maintenance, description: "Isolation, draining and opening of the anolyte and the cathode gas lines, instrument work, and the replacement of a stack (4000 h interval, ASSUMED): a vertical hand lift of the 0.18 m stack out of the frame once its connections are undone, with 0.3 m of hand room (D-019, D-023)."}
