# shared register of what P-01 and the C&E have (proposed); a node adds its own as H01-SG-N<k>-<name>
safeguards:
  - {id: H01-SG-I101, title: "I-101 anolyte pH low-low (AI-101 AALL, pH 12.0 concentration basis) trips U-101", kind: interlock, interlock: I-101, refs: [AI-101, U-101], status: proposed, by: agent, notes: "At the threshold itself (D-009, D-018): it does not end a normal campaign and gives no margin below pH 12. Single probe shared with the AI-101 alarm; the activity / concentration pH offset is open (control/philosophy.md). sil: null."}
  - {id: H01-SG-I102, title: "I-102 anolyte level low-low (LIA-101 LALL) trips U-101 and stops P-101", kind: interlock, interlock: I-102, refs: [LIA-101, U-101, P-101], status: proposed, by: agent, notes: "LIA-101 is the only level instrument of T-101 (it also carries the LAL alarm). sil: null."}
  - {id: H01-SG-I103, title: "I-103 CO detected in the enclosure (AIA-141 AHH) trips U-101, closes FV-102, stops K-131, starts K-141", kind: interlock, interlock: I-103, refs: [AIA-141, U-101, FV-102, K-131, K-141], status: proposed, by: agent, notes: "One detector, location and set point ASSUMED (gas detection study not made). sil: null."}
  - {id: H01-SG-I104, title: "I-104 H2 detected in the enclosure (AIA-142 AHH) trips U-101, closes FV-102, stops K-131, starts K-141", kind: interlock, interlock: I-104, refs: [AIA-142, U-101, FV-102, K-131, K-141], status: proposed, by: agent, notes: "One detector, location and set point ASSUMED. sil: null."}
  - {id: H01-SG-I105, title: "I-105 anolyte temperature high-high at the stack outlet (TSHH-112) trips U-101", kind: interlock, interlock: I-105, refs: [TSHH-112, U-101], status: proposed, by: agent, notes: "TSHH-112 is a separate element from TIC-111 (stack inlet). Trip value ASSUMED. sil: null."}
  - {id: H01-SG-I106, title: "I-106 anolyte recirculation flow low-low (FIC-101 FALL, 5 s delay) trips U-101", kind: interlock, interlock: I-106, refs: [FIC-101, U-101], status: proposed, by: agent, notes: "Shares its transmitter with the flow loop FIC-101 (C&E note: HAZOP to judge): no credit against a FIC-101 transmitter fault. sil: null."}
  - {id: H01-SG-FIC101-FAL, title: "FIC-101 low anolyte flow alarm (operator checks P-101 and the manifold)", kind: alarm, refs: [FIC-101], status: proposed, by: agent, notes: "Same transmitter as the loop and I-106."}
  - {id: H01-SG-TIC111-TAH, title: "TIC-111 high anolyte temperature alarm at the stack inlet (operator checks the cooling water and TV-111)", kind: alarm, refs: [TIC-111], status: proposed, by: agent}
  - {id: H01-SG-FIC102-FAL, title: "FIC-102 low fresh CO2 flow alarm (operator reduces the current: without CO2 the stacks make H2 only)", kind: alarm, refs: [FIC-102], status: proposed, by: agent}
  - {id: H01-SG-PIC121-PAH, title: "PIC-121 high cathode back-pressure alarm (operator checks K-131 and PV-121; membrane pressure difference limited, vendor)", kind: alarm, refs: [PIC-121], status: proposed, by: agent}
  - {id: H01-SG-LIC122-LAH, title: "LIC-122 high condensate level alarm in V-121 (operator checks LV-122: liquid must not reach K-131)", kind: alarm, refs: [LIC-122], status: proposed, by: agent}
  - {id: H01-SG-PIC131-PAL, title: "PIC-131 low CO product pressure alarm (operator checks X-131)", kind: alarm, refs: [PIC-131], status: proposed, by: agent}
  - {id: H01-SG-AI101-AAL, title: "AI-101 low pH alarm at 12.5 (about 27 h before H): notice to plan SEQ-A-STOP", kind: alarm, refs: [AI-101], status: proposed, by: agent, notes: "Same probe as I-101."}
  - {id: H01-SG-LIA101-LAL, title: "LIA-101 low anolyte level alarm in T-101", kind: alarm, refs: [LIA-101], status: proposed, by: agent, notes: "Same transmitter as I-102."}
  - {id: H01-SG-CV131, title: "Check valve on the K-131 discharge CG-103 (against back-flow from X-131)", kind: check-valve, refs: [CG-103, K-131], status: proposed, by: agent, notes: "Untagged on P-01 (DEXPI object CV131, a node member as {sheet: P-01, object: CV131})."}
  - {id: H01-SG-FAIL-FV102, title: "FV-102 fails closed on loss of air or signal (no CO2 to the cathodes)", kind: mechanical, refs: [FV-102], status: proposed, by: agent, notes: "Fail position proposed in control/loops.yaml (D-018)."}
  - {id: H01-SG-FAIL-PV121, title: "PV-121 fails open on loss of air or signal (the cathode is not pressurised against the compressor)", kind: mechanical, refs: [PV-121], status: proposed, by: agent, notes: "Fail position proposed in control/loops.yaml (D-018)."}
  - {id: H01-SG-FAIL-TV111, title: "TV-111 fails open on loss of air or signal (full cooling water to E-111)", kind: mechanical, refs: [TV-111], status: proposed, by: agent, notes: "Fail position proposed in control/loops.yaml (D-018)."}
  - {id: H01-SG-FAIL-LV122, title: "LV-122 fails closed on loss of air or signal (no cathode gas to the effluent)", kind: mechanical, refs: [LV-122], status: proposed, by: agent, notes: "Fail position proposed in control/loops.yaml (D-018)."}
  - {id: H01-SG-U101-OUTZONE, title: "Rectifier U-101 (non-Ex) placed outside zone Z-HAZ-A, more than 1 m from the zone sources X-132, E-101D and K-131", kind: mechanical, refs: [U-101], status: proposed, by: agent, notes: "Layout feature (D-019); the zones are a screening, not an area classification."}
  - {id: H01-SG-O2V101-OPEN, title: "Open reservoir vent O2V-101 (DN 25, no valve) to a safe location above the walking levels", kind: mechanical, refs: [O2V-101, T-101], status: proposed, by: agent, notes: "Keeps T-101 at atmospheric pressure; the vent outlet height (about 3.4 m) is a layout assumption (D-019); vent sizing open (D-017)."}
  - {id: H01-SG-SEQ-A-START-VENT, title: "SEQ-A-START S1: the extract fan K-141 runs before the cathodes are purged and the current is ramped", kind: procedural, refs: [K-141], status: proposed, by: agent, notes: "control/sequences.yaml SEQ-A-START."}
  - {id: H01-SG-SEQ-A-GAS, title: "SEQ-A-GAS: no entry to the enclosure until AIA-141 and AIA-142 are clear; leak found and isolated before reset; purge to X-132 with the oxidiser running first", kind: procedural, refs: [AIA-141, AIA-142, X-132], status: proposed, by: agent, notes: "control/sequences.yaml."}
  - {id: H01-SG-SEQ-A-PURGE, title: "SEQ-A-STOP / SEQ-A-TRIP: CO2 purge of the cathodes to the oxidiser X-132 until the cathode gas is free of CO and H2 (sampled) before K-131, X-131 and X-132 stop", kind: procedural, refs: [FIC-102, X-132], status: proposed, by: agent, notes: "control/sequences.yaml; needs power and CO2 (F-POWER open point)."}
  - {id: H01-SG-SEQ-A-FILL-PERM, title: "SEQ-A-FILL permissives: drain HV-103 closed and U-101 off before the fill", kind: procedural, refs: [HV-103, U-101], status: proposed, by: agent, notes: "control/sequences.yaml."}
  # node safeguards (H01-SG-N<k>-<name>): written sequence steps and layout features of the files
  - {id: H01-SG-N1-CIRC-PERM, title: "SEQ-A-FILL S3 and the SEQ-A-START permissive: HV-101 opened, P-101 started and FIC-101 held at its setpoint (10 min, leak check) before the cathodes are purged and the current ramped", kind: procedural, refs: [HV-101, P-101, FIC-101], status: proposed, by: agent, notes: "control/sequences.yaml SEQ-A-FILL S3, SEQ-A-START permissives."}
  - {id: H01-SG-N1-STOP-AT-H, title: "SEQ-A-STOP: the campaign is ended at H hours on stream (the hours and the charge recorded), independent of the AI-101 probe", kind: procedural, refs: [JIC-101, U-101], status: proposed, by: agent, notes: "control/sequences.yaml SEQ-A-STOP permissive and S1; D-009."}
  - {id: H01-SG-N2-DRAIN-PERM, title: "SEQ-A-DRAIN: U-101 off and P-101 stopped (S1), T-101 drained through HV-103 to LIA-101 empty (S2), HV-103 closed with a free-text note to rinse (S3)", kind: procedural, refs: [U-101, HV-103, P-101], status: proposed, by: agent, notes: "control/sequences.yaml SEQ-A-DRAIN. It drains the tank only: no step drains or flushes the stacks, the manifolds, P-101 or E-111, and no DC isolator, per-stack isolation or drain valve is drawn. Not credited for opening the loop (H01-S117) or for DC work (H01-S205)."}
  - {id: H01-SG-N6-FG-HEIGHT, title: "The flue FG-101 discharges at about 3.4 m, above the walking levels (a 1 m sphere clear of every walking level, D-019)", kind: mechanical, refs: [FG-101, X-132], status: proposed, by: agent, notes: "Layout assumption (D-019, piping/routing.yaml); fitted at site."}
  - {id: H01-SG-N8-FILL-LEVEL, title: "SEQ-A-FILL S1 and S2: the operator fills to the working level on LIA-101 and closes HV-102", kind: procedural, refs: [LIA-101, HV-102], status: proposed, by: agent, notes: "control/sequences.yaml SEQ-A-FILL. LIA-101 has a low alarm only."}
  - {id: H01-SG-N8-FILL-1M, title: "SEQ-A-FILL S1 operator instruction: fill with fresh 1 M KOH only and record the volume filled", kind: procedural, refs: [KOH-101, HV-102], status: proposed, by: agent, notes: "control/sequences.yaml SEQ-A-FILL S1; no check of the delivery is written."}
actions:
  # N1 anolyte loop
  - {id: H01-A101, text: "Give I-106 a flow measurement independent of the FIC-101 loop transmitter: a separate low-low flow element on AN-102 / AN-103, or a pressure difference across the stack supply and return manifolds; and confirm with the stack vendor that TSHH-112 in the common return AN-104 sees a stack overheating at low or no flow (H01-S102). Update control/cause-effect.yaml I-106 and the SIL screening.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H01-A102, text: "Add per-stack monitoring so that one starved stack is seen: the voltage of each stack E-101A to D (with the DC bus, H01-A202) and an anolyte outlet temperature on each return branch AN-104A to C and AN-104, with an alarm on a stack that deviates from the others, and the current of each stack for an uneven share on the parallel bus (H01-S104, H01-S208; as H02-A102).", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H01-A103, text: "Measure the anolyte pressure at the stack inlet (AN-103) and alarm, and trip U-101, on the pressure difference to the cathode (PIC-121) outside the GDE window; take the window from the stack vendor and from benchmarks/reproductions/baumgartner-gde-pressure-window (#332). Covers the anolyte over the cathode (flooding, H01-S105) and the cathode over the anolyte (breakthrough, H01-S403).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A104, text: "State the largest static head of T-101 the stacks accept on their anode side against the cathode's 1.1 bar(a) (the GDE window, #332, and the vendor), and make it a limit on the reservoir height; record that the 10,000 h reservoir (3.47 m, D-015) fails it as well as the envelope (H01-S106).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A105, text: "Add a low temperature alarm to TIC-111 and decide whether the anolyte needs a heater to hold the measured 25 degC in winter or after a loss of air (TV-111 fails open); none is drawn and TIC-111 can only cool (H01-S109).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A106, text: "Provide an eyewash and a safety shower (EN 15154) within reach of the KOH hose connections at the frame's west end and of the stack row, and a written PPE rule (face shield, gloves) for every task that opens the anolyte side or handles KOH; none is drawn (H01-S110, H01-S117, H01-S801, H01-S803).", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H01-A107, text: "Add a low-low level on T-101 independent of LIA-101 (as Skid B's LIA-202) for I-102, so that a failed or stuck LIA-101 does not defeat both the alarm and the trip (H01-S112).", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H01-A108, text: "Owner decision on the margin of I-101: keep the trip at pH 12.0 (the threshold itself, no margin, D-018) or set it above 12 with the reservoir sized to the trip value (about 1,176 L for pH 12.2), which changes the frozen sizing basis (H01-S113).", owner: owner / process engineer, status: proposed, by: agent}
  - {id: H01-A109, text: "Calibrate AI-101 against titrated anolyte (hydroxide and carbonate) and set the activity-to-concentration offset before any alarm or trip value is set (control/philosophy.md); take titrated grab samples at intervals during the campaign; consider an end-of-run on the charge passed (Ah) as a measure independent of the probe (H01-S114).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A110, text: "Add an H2-in-O2 analyser on the reservoir vent O2V-101 (or the T-101 head space) with an alarm and a trip of U-101, at limits the team sets well below the lower flammability limit of H2 in O2 (about 4 vol%); decide on a sweep or dilution of the T-101 head space; bond and earth T-101 and its vent against static. No H2-in-O2 measurement is drawn (H01-S115, H01-S403, H01-S606).", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H01-A111, text: "Write the procedure for opening the anolyte side (stack replacement, pump or cooler work) and add to SEQ-A-DRAIN a step that drains and flushes the loop itself, not only T-101 (its S2 empties the tank; the stacks, manifolds, P-101 and E-111 stay full): low-point drains and flush connections on the loop, isolation and drain valves per stack (none are drawn), then a check that the connection is empty before it is opened (H01-S117; as H02-A802).", owner: operations, status: proposed, by: agent}
  - {id: H01-A112, text: "Carry out a SIL screening / LOPA of the trips I-101 to I-106 (all sil null), including the sharing of FIC-101 with I-106 and of AI-101 and LIA-101 with their alarms, before any trip is credited beyond the one-letter convention of this draft (H01-S101, H01-S901; as H02-A104).", owner: process safety / HSE, status: proposed, by: agent}
  # N2 stacks and DC supply
  - {id: H01-A201, text: "Protect the stacks against reverse current at every switch-off (a blocking diode in the rectifier output, a protective minimum current, or a controlled discharge of the stacks, per the stack vendor), and write the switch-off procedure for the daily cycle of D-A-ONOFF and the current steps of D-A-PART (H01-S202).", owner: electrical engineer, status: proposed, by: agent}
  - {id: H01-A202, text: "Draw and design the 48 V DC bus (not drawn, D-017): a fuse or DC breaker per stack, shrouded stack terminals kept clear of KOH drips and condensate, an unearthed (IT) bus with insulation monitoring for earth faults, stray-current paths through the anolyte manifolds and E-111, and a DC isolator with lock-out and a check for residual stack voltage before stack work (H01-S203, H01-S204, H01-S205).", owner: electrical engineer, status: proposed, by: agent}
  - {id: H01-A203, text: "Make a manual-handling assessment of the stack lift with the stack mass from the vendor and the 0.3 m of hand room (D-023); provide a lifting aid if needed, and drain and rinse the stack before it is lifted (H01-S206).", owner: mechanical / package engineer, status: proposed, by: agent}
  - {id: H01-A204, text: "Have the area classification of the skid made by a competent person (IEC 60079-10-1), with the enclosure and its ventilation, to replace the zone screening; confirm the rectifier U-101's position outside the zone, and isolate the rectifier cabinet's own supply on gas detection or move it out of the enclosure (H01-S207, H01-S906).", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H01-A205, text: "Remove the DC on every trip independently of the rectifier's regulation: a DC contactor or breaker in the U-101 output opened by I-101 to I-106 and by the stop, and an over-current alarm and trip on a current measurement independent of JIC-101; then I-105 can be credited against a regulation or output-stage fault of U-101 (H01-S201; as H02-A207).", owner: electrical engineer, status: proposed, by: agent}
  # N3 cathode CO2 feed
  - {id: H01-A301, text: "Trip U-101 on a low-low CO2 feed flow measured independently of FIC-102 (or on the cathode feed pressure, or a CO2-to-current ratio), so that the stacks do not run on H2 evolution when the CO2 is lost; today the operator trips the current (F-AIR); measure the PSA recycle CO2-102 or the total cathode CO2 feed as well, since FIC-102 sees only the fresh CO2 and a loss of the 2.94 kg/h recycle goes unseen (H01-S301, H01-S302, H01-S510).", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H01-A302, text: "Manage the cathode water and salt: an alarm on the humidification water (or a controlled flow instead of the hand-set HV-104 / FI-103), a pressure measurement on the cathode feed upstream of the stacks to see a blocked flow field, and a salt rinse procedure with the vendor's limits on K+ crossover (H01-S303, H01-S304, H01-S408).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A303, text: "Relief of the cathode side (none drawn): the governing scenario to be checked by the relief study is the CO2 supply's pressure regulation failing open at the battery limit with FV-102 wide open (H01-S305; FV-102 stands wide open in the start-up purge, H01-S309), with PV-121 closed by a failed PIC-121 (H01-S402) as the other case; state the CO2 supply pressure. No sizing here.", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H01-A304, text: "Confirm the low-temperature protection of the merchant CO2 vaporiser at the battery limit, or add a low temperature trip on CO2-101 that closes FV-102 (H01-S306).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A305, text: "Add CO2 and O2-depletion detection in the enclosure (at low points) with an alarm and the fan start, and an entry rule; no CO2 or O2 detector is drawn and AIA-141 / AIA-142 do not see a CO2-only leak (H01-S307).", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H01-A306, text: "Add check valves on the CO2 feed CO2-101 downstream of FV-102 and on the humidification water W-101, and a low supply pressure alarm, so that cathode gas with CO cannot flow back into the supplies (H01-S308).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A307, text: "Give the start-up purge of SEQ-A-START S2 a flow path: start K-131 and X-132 before or with the purge (with the order of S3 reviewed against H01-S602), or draw a purge route from CG-102 to X-132 or a safe vent; state the regulated CO2 supply pressure against the anolyte pressure and the GDE window (#332); and correct the PV-121 rationale in control/loops.yaml, which a stopped K-131 defeats (H01-S309; as H02-A307).", owner: process engineer, status: proposed, by: agent}
  # N4 cathode gas outlet
  - {id: H01-A401, text: "Add a cathode pressure high-high on CG-101, independent of PIC-121, that trips U-101 and closes FV-102, and set the PIC-121 alarm and trip values from the stack vendor's allowed pressure, and trip U-101 when K-131 stops (H01-S401, H01-S402, H01-S411, H01-S503; as H02-A402).", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H01-A402, text: "Add a low pressure alarm to PIC-121 and stop K-131 on a low cathode pressure; review the fail-open PV-121 for the loss of instrument air with K-131 still running, against the GDE window (#332) (H01-S404); consider an O2 measurement in the cathode gas against air drawn in under vacuum (H01-S410, as H02-A403).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A403, text: "Add a high-high level in V-121 independent of LIC-122 that stops K-131, and review the fail-closed LV-122 on the loss of instrument air with K-131 running (H01-S405, H01-S406).", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H01-A404, text: "Protect the condensate drain against gas blow-by: a low level alarm and an independent low-low that closes a tight-shut valve on CD-101, or a liquid seal; route the condensate to a vented collection away from people (H01-S407).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A405, text: "Draw a sample point on the cathode gas train for the 'cathode gas free of CO and H2 (sampled)' steps of SEQ-A-STOP, -TRIP and -GAS, and write a gas-free test with a portable CO and H2 meter into a permit-to-work before the train is opened (H01-S409).", owner: operations, status: proposed, by: agent}
  # N5 gas conditioning
  - {id: H01-A501, text: "Relief of the K-131 discharge (none drawn): the governing scenario to be checked by the relief study is the blocked outlet with K-131 (positive displacement) at full stroke, by X-131 closing its feed (H01-S501) or PV-131 closing on loss of air (H01-S502); the device would sit on CG-103 upstream of the check valve. Also add a discharge pressure high-high that stops K-131, interlock K-131 with the X-131 package, and decide the PV-131 fail position with the PSA vendor. No sizing here.", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H01-A502, text: "Add a second protection against back-flow from X-131 when K-131 stops: a tight-shut valve on CG-103 closed with K-131's stop, or the PSA's own inlet isolation confirmed by the vendor; the check valve on CG-103 is the only one today (H01-S503).", owner: mechanical / package engineer, status: proposed, by: agent}
  - {id: H01-A503, text: "Get from the K-131 vendor the diaphragm leak detection (to trip K-131), the discharge temperature protection and the route of the hydraulic-oil-side vent, and bring the trips into control/cause-effect.yaml (H01-S504, H01-S508; as H02-A506).", owner: mechanical / package engineer, status: proposed, by: agent}
  - {id: H01-A504, text: "Add a CO product analyser (CO purity, H2) on CO-101 with an alarm and a diversion of off-specification product to X-132 (D-008) (H01-S505).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A505, text: "Extend I-103 and I-104 to isolate the PSA X-131 (its package stop and PV-131 closed, or an isolation valve on CO-101), so that the CO inventory of the PSA is not left connected to a leak (H01-S506).", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H01-A506, text: "Get the PSA and compressor vendors' depressurisation and purge procedure for maintenance (the beds of X-131 hold adsorbed CO) and decide the purge medium; only CO2 is drawn (H01-S507, as H02-A504).", owner: mechanical / package engineer, status: proposed, by: agent}
  - {id: H01-A507, text: "Guard the PSA recycle CO2-102 (no valve on it today): a check valve and a tight shut-off valve on CO2-102 closed by I-103, I-104 and the stop of K-131, or the PSA vendor's recycle outlet isolation confirmed and interlocked; include CO2-102 in the isolation of SEQ-A-GAS and in the relief study of the cathode side (H01-S509; as H02-A507).", owner: process engineer, status: proposed, by: agent}
  # N6 tail gas and vents
  - {id: H01-A601, text: "Bring the oxidiser's supervision into the C&E: flame or catalyst temperature low and combustion air flow low stop the tail gas (stop K-131 and X-131, or isolate TG-101), with a flue temperature or CO measurement on FG-101; size the air for the H2-rich tail gas after a CO2 loss and for the gas-trip purge (H01-S601, H01-S603, H01-S604).", owner: mechanical / package engineer, status: proposed, by: agent}
  - {id: H01-A602, text: "Require from the X-132 vendor a burner or oxidiser management system (pre-purge before every light-off or re-light, flame failure, air flow proving, EN 746-2 or the equivalent) and a package HAZOP; bring its trips into control/cause-effect.yaml (H01-S602).", owner: mechanical / package engineer, status: proposed, by: agent}
  - {id: H01-A603, text: "Decide on a flame arrester on O2V-101 and fix the vent outlet's location in the area classification (away from ignition sources and the flue FG-101), since the vent can carry H2 in O2 (H01-S606).", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H01-A604, text: "Pressure and vacuum protection of T-101 (none drawn beyond the open vent): the governing scenarios to be checked are the gravity drain with O2V-101 blocked (vacuum, H01-S806) and the blocked vent with the stacks running (H01-S608); add a weather and bird screen that cannot close the vent and an inspection of the outlet; the overfill at the fill, which stands liquid in the vent (H01-S801), is a third case. No sizing here.", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H01-A605, text: "Protect the tail gas TG-101 against flashback: a flame arrester and a check valve on TG-101 (or the X-132 vendor's confirmation of the burner's own), a stop of X-132 (or of its fuel) on a falling tail flow and with K-131, and the order of the stop steps of SEQ-A-STOP, -TRIP and -GAS reviewed with the vendor's burner management (H01-S610, with H01-A602; as H02-A604).", owner: mechanical / package engineer, status: proposed, by: agent}
  # N8 fill and drain
  - {id: H01-A801, text: "Add a high level alarm, and a high-high independent of LIA-101, on T-101 for the fill, and write the fill so that the operator at HV-102 can stop the delivery pump (H01-S801).", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H01-A802, text: "Check every KOH delivery before the transfer (certificate and a titration of a sample) and use a dedicated coupling for the 1 M KOH fill (H01-S802).", owner: operations, status: proposed, by: agent}
  - {id: H01-A803, text: "Write the hose transfer procedure for the fill and the drain: PPE, dry-break couplings, a drip tray or bund at the west-end hose connections, two people for the transfer (H01-S803).", owner: operations, status: proposed, by: agent}
  - {id: H01-A804, text: "Lock or car-seal HV-103 closed for the campaign, opened only under SEQ-A-DRAIN (H01-S804).", owner: operations, status: proposed, by: agent}
  - {id: H01-A805, text: "Confirm that the site effluent accepts the spent anolyte (pH, potassium, carbonate, nickel, volume and rate), or collect it in IBCs for off-site disposal or neutralise it first (H01-S805).", owner: process safety / HSE, status: proposed, by: agent}
  # N9 enclosure
  - {id: H01-A901, text: "Prove the extract fan K-141: a running or air flow signal with an alarm, and a permissive on U-101 and FV-102; size the enclosure ventilation (air changes) for the dilution of the largest credible leak (the enclosure and the fan are ASSUMED, D-017) (H01-S901).", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H01-A902, text: "Make the gas detection study for the skid: the number and location of CO and H2 detectors at each source cluster (stacks, V-121, K-131, X-131, X-132), their set points, the voting (one detector each today, no voting), detectors at the vents if needed, personal CO monitors for entry; then update I-103 and I-104 (H01-S506, H01-S902).", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H01-A903, text: "Owner decision of #330 on the Ex rating for zone 2 of the motors of K-141, P-101 and K-131 and of every other electrical item inside Z-HAZ-A (ASSUMED Ex-rated today), with the area classification (H01-A204) and AIA-142 at the high points of the enclosure; I-104 starts K-141 and leaves P-101 running inside a detected H2 cloud, so K-141 (motor out of the air stream) and P-101 need the rating whatever the owner decides for the rest, or I-104 must stop P-101 (H01-S903).", owner: owner / electrical engineer, status: proposed, by: agent}
  - {id: H01-A904, text: "Define the safe state on a loss of power (F-POWER, open): a UPS for the gas detectors, the fan K-141 and the alarms, a purge source and route that work without power (or a passive vent of the cathode gas train to a safe location), and an entry rule after a power loss (H01-S904).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A905, text: "Depressurise the isolated cathode gas train after a gas trip (to X-132 once it is safe, or to a safe vent), and write the leak search with breathing apparatus or a personal CO monitor (H01-S905).", owner: operations, status: proposed, by: agent}
  - {id: H01-A906, text: "Remove the oxidiser X-132 as an ignition source of the enclosure: stop X-132 and isolate the tail gas TG-101 (stop X-131) from I-103 and I-104 and in SEQ-A-GAS S1, or place X-132 outside the enclosure and outside zone Z-HAZ-A; have the area classification (H01-A204) treat X-132 as a permanent ignition source and get its surface temperatures from the vendor (H01-S906; as H02-A906).", owner: process safety / HSE, status: proposed, by: agent}
