actions:
  # N1 anolyte loop
  - {id: H01-A101, text: "Give I-106 a flow measurement independent of the FIC-101 loop transmitter: a separate low-low flow element on AN-102 / AN-103, or a pressure difference across the stack supply and return manifolds; and confirm with the stack vendor that TSHH-112 in the common return AN-104 sees a stack overheating at low or no flow (H01-S102). Update control/cause-effect.yaml I-106 and the SIL screening.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H01-A102, text: "Add per-stack monitoring so that one starved stack is seen: the voltage of each stack E-101A to D (with the DC bus, H01-A202) and an anolyte outlet temperature on each return branch AN-104A to C and AN-104, with an alarm on a stack that deviates from the others, and the current of each stack for an uneven share on the parallel bus (H01-S104, H01-S208; as H02-A102). Proposed response in part (D-063, for the team to confirm): each stack's voltage EIA-105A to D and current IIA-106A to D at the rectifier, alarmed on a deviation from the mean, a stack above 24 A tripping U-101 (I-120). Still open: an anolyte outlet temperature per return branch.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H01-A103, text: "Measure the anolyte pressure at the stack inlet (AN-103) and alarm, and trip U-101, on the pressure difference to the cathode (PIC-121) outside the GDE window; take the window from the stack vendor and from benchmarks/reproductions/baumgartner-gde-pressure-window (#332). Covers the anolyte over the cathode (flooding, H01-S105) and the cathode over the anolyte (breakthrough, H01-S403). Proposed response (D-061, P&ID revision C, for the team to confirm): PIA-113 on AN-103 at the stack inlet; with PIA-123 the difference alarms at 45 and 15 kPa and trips U-101 outside 0 to 60 kPa (I-117, about 31 kPa at the operating point). Still open: the window itself (stack vendor, #332), and that two points read a mean of a difference that changes sign along a stack. Revised response (2026-11-07, D-067, review 2026-11-06-design-r2#3, for the team to confirm): each end measured where it is, the inlet PIA-113 against the cathode inlet PIA-116, the outlet PIA-115 against PIA-123, alarmed at +45 / -15 kPa and tripped outside +60 / -20 kPa at either end (ASSUMED); the design point has the cathode about 9 kPa above the anolyte at the outlet end. Still open: whether the stack vendor accepts that, or the operating pressures must keep the anolyte above the cathode along the whole stack (an anolyte back-pressure on AN-104).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A104, text: "State the largest static head of T-101 the stacks accept on their anode side against the cathode's 1.1 bar(a) (the GDE window, #332, and the vendor), and make it a limit on the reservoir height; record that the 10,000 h reservoir (3.47 m, D-015) fails it as well as the envelope (H01-S106).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A105, text: "Add a low temperature alarm to TIC-111 and decide whether the anolyte needs a heater to hold the measured 25 degC in winter or after a loss of air (TV-111 fails open) (H01-S109). Proposed response (the owner's decision of 2026-11-06, D-052, D-056, for the team to confirm): E-111 is served by a tempered-water unit off the skid, outside the zone, that heats and cools (TWS-101 / TWR-101), TIC-111 has a low-temperature alarm, SEQ-A-START S1 heats the loop before the current and SEQ-A-STOP S3 keeps an idle filled skid circulated and heated. Still open: the unit's heating and cooling duty, its frost-protection mode and the TAL value (vendor), and whether a low-temperature trip of the current is needed.", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A106, text: "Provide an eyewash and a safety shower (EN 15154) within reach of the KOH hose connections at the frame's west end and of the stack row, and a written PPE rule (face shield, gloves) for every task that opens the anolyte side or handles KOH; none is drawn (H01-S110, H01-S117, H01-S801, H01-S803).", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H01-A107, text: "Add a low-low level on T-101 independent of LIA-101 (as Skid B's LIA-202) for I-102, so that a failed or stuck LIA-101 does not defeat both the alarm and the trip (H01-S112).", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H01-A108, text: "Owner decision on the margin of I-101: keep the trip at pH 12.0 (the threshold itself, no margin, D-018) or set it above 12 with the reservoir sized to the trip value (about 1,176 L for pH 12.2), which changes the frozen sizing basis (H01-S113). Proposed response (decided by the owner on 2026-11-06, D-058, to be confirmed by the team): I-101 trips at pH 12.2 and T-101 is sized to reach the trip value at H (1176 L written, D 1.077 x H 1.615 m); the criterion pH 12 stays the reported stability criterion; the frozen expectations stand with erratum X-2. The margin is ASSUMED: the team checks it against the probe's uncertainty once AI-101 is calibrated (H01-A109) and in the SIL screening (H01-A112).", owner: owner / process engineer, status: proposed, by: agent}
  - {id: H01-A109, text: "Calibrate AI-101 against titrated anolyte (hydroxide and carbonate) and set the activity-to-concentration offset before any alarm or trip value is set (control/philosophy.md); take titrated grab samples at intervals during the campaign; consider an end-of-run on the charge passed (Ah) as a measure independent of the probe (H01-S114).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A110, text: "Add an H2-in-O2 analyser on the reservoir vent O2V-101 (or the T-101 head space) with an alarm and a trip of U-101, at limits the team sets well below the lower flammability limit of H2 in O2 (about 4 vol%); decide on a sweep or dilution of the T-101 head space; bond and earth T-101 and its vent against static. No H2-in-O2 measurement is drawn (H01-S115, H01-S403, H01-S606). Proposed response (D-061, D-063, P&ID revision C, for the team to confirm): the analyser AIA-114 on O2V-101 alarms at 0.4 vol% and trips U-101 at 1.0 vol% H2 (I-116, 10 % and 25 % of the lower flammability limit, ASSUMED for the team); the KOH earthed through a metal element in contact with it and the metal fittings bonded (the PP wall assessed by the competent person). Still open: the analyser's sample point and response time (vendor), the team's limits, a sweep or dilution of the head space.", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H01-A111, text: "Write the procedure for opening the anolyte side (stack replacement, pump or cooler work) and add to SEQ-A-DRAIN a step that drains and flushes the loop itself, not only T-101 (its S2 empties the tank; the stacks, manifolds, P-101 and E-111 stay full): low-point drains and flush connections on the loop, isolation and drain valves per stack (none are drawn), then a check that the connection is empty before it is opened (H01-S117; as H02-A802). Proposed response (the owner's draining decision of 2026-11-06, D-055, P&ID revision B, for the team to confirm): the capped low-point drain DR-101 / HV-106 at the supply header's east end to a closed IBC, the capped vent AV-111 / HV-107 at E-111's anolyte outlet, the bottom outlet N11 with HV-108 and the capped camlock pump-out PO-101 on T-101; SEQ-A-DRAIN vents, drains the tank and the low point, pumps out the heel, flushes with demineralised water and caps. Still open: the opening procedure itself with the check that a connection is empty, and whether isolation and drain valves per stack are needed.", owner: operations, status: proposed, by: agent}
  - {id: H01-A112, text: "Carry out a SIL screening / LOPA of the trips I-101 to I-106, I-109 and I-110 (all sil null; I-109 and I-110 added with D-054, I-101 moved to pH 12.2 by D-058), including the sharing of FIC-101 with I-106 and of AI-101 and LIA-101 with their alarms, before any trip is credited beyond the one-letter convention of this draft (H01-S101, H01-S901; as H02-A104).", owner: process safety / HSE, status: proposed, by: agent}
  # N2 stacks and DC supply
  - {id: H01-A201, text: "Protect the stacks against reverse current at every switch-off (a blocking diode in the rectifier output, a protective minimum current, or a controlled discharge of the stacks, per the stack vendor), and write the switch-off procedure for the daily cycle of D-A-ONOFF and the current steps of D-A-PART (H01-S202).", owner: electrical engineer, status: proposed, by: agent}
  - {id: H01-A202, text: "Draw and design the 48 V DC bus (not drawn, D-017): a fuse or DC breaker per stack, shrouded stack terminals kept clear of KOH drips and condensate, an unearthed (IT) bus with insulation monitoring for earth faults, stray-current paths through the anolyte manifolds and E-111, and a DC isolator with lock-out and a check for residual stack voltage before stack work (H01-S203, H01-S204, H01-S205).", owner: electrical engineer, status: proposed, by: agent}
  - {id: H01-A203, text: "Make a manual-handling assessment of the stack lift with the stack mass from the vendor and the 0.3 m of hand room (D-023); provide a lifting aid if needed, and drain and rinse the stack before it is lifted (H01-S206).", owner: mechanical / package engineer, status: proposed, by: agent}
  - {id: H01-A204, text: "Have the area classification of the skid made by a competent person (IEC 60079-10-1), with the enclosure and its ventilation, to replace the zone screening; confirm the rectifier U-101's position outside the zone, and isolate the rectifier cabinet's own supply on gas detection or move it out of the enclosure (H01-S207, H01-S906). Proposed response in part (the owner's decisions of 2026-11-06, D-050, D-051, D-057, for the team to confirm): the skid is open and naturally ventilated (no enclosure); U-101 stands off the frame on a plinth at grade 3.23 m from the nearest zone source; the gas trips open its AC feeder at SDB-1, outside the zone; the Ex marking inside the zone is set (H01-A903). Cannot be settled by the owner or this study: the area classification itself, the explosion protection document (1999/92/EC; the Arbobesluit in the Netherlands), the initial and periodic Ex inspection (IEC 60079-14, -17) and the assessment of the stacks' terminals, which have no Ex certificate: the competent person's.", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H01-A205, text: "Remove the DC on every trip independently of the rectifier's regulation: a DC contactor or breaker in the U-101 output opened by I-101 to I-106 and by the stop, and an over-current alarm and trip on a current measurement independent of JIC-101; then I-105 can be credited against a regulation or output-stage fault of U-101 (H01-S201; as H02-A207). Decided in principle by the owner on 2026-11-06 (D-051, for the team to confirm): a lockable DC isolator or a DC contactor outside the zone, the DC never broken under load inside it; its design and drawing stay open with the DC bus (H01-A202).", owner: electrical engineer, status: proposed, by: agent}
  - {id: H01-A206, text: "The layout review 2026-11-05-layout (#1) found the stacks out of reach for the vertical hand lift of D-023; the layout now stands them along the frame's south edge with all their connections on the north end plate and the top, within 0.6 m of a person at grade, and replaces them by a slide at deck level onto a deck-height trolley, no lift (D-047). Assess that handling (push and pull force, the trolley, the stack mass from the vendor) in H01-A203, and drain and flush the loop first (H01-A111): the supply header's low point at the east end of the stack row has no drain on P-01 yet (D-047) (H01-S206, H01-S117). Proposed response to the drain (the owner's decision of 2026-11-06, D-055, P&ID revision B, for the team to confirm): the capped low-point drain DR-101 / HV-106 is drawn there and SEQ-A-DRAIN S4 drains it before a stack is opened; the handling assessment stays open (H01-A203).", owner: mechanical / package engineer, status: proposed, by: agent}
  # N3 cathode CO2 feed
  - {id: H01-A301, text: "Trip U-101 on a low-low CO2 feed flow measured independently of FIC-102 (or on the cathode feed pressure, or a CO2-to-current ratio), so that the stacks do not run on H2 evolution when the CO2 is lost; today the operator trips the current (F-AIR); measure the PSA recycle CO2-102 or the total cathode CO2 feed as well, since FIC-102 sees only the fresh CO2 and a loss of the 2.94 kg/h recycle goes unseen (H01-S301, H01-S302, H01-S510). Proposed response (D-062, for the team to confirm): FIC-104 measures the total cathode CO2 downstream of the recycle tee, is the master of FIC-102 and trips U-101 at 50 % of the total (I-115, 10 s). Still open: a trip independent of the master loop's transmitter (I-115 shares FIC-104), the SIL screening.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H01-A302, text: "Manage the cathode water and salt: an alarm on the humidification water (or a controlled flow instead of the hand-set HV-104 / FI-103), a pressure measurement on the cathode feed upstream of the stacks to see a blocked flow field, and a salt rinse procedure with the vendor's limits on K+ crossover (H01-S303, H01-S304, H01-S408).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A303, text: "Relief of the cathode side (none drawn): the governing scenario to be checked by the relief study is the CO2 supply's pressure regulation failing open at the battery limit with FV-102 wide open (H01-S305; FV-102 stands wide open in the start-up purge, H01-S309), with PV-121 closed by a failed PIC-121 (H01-S402) as the other case; state the CO2 supply pressure. No sizing here. Proposed response (the design revision of 2026-11-06 after review 2026-11-06-design #1, D-060, P&ID revision C, for the team to confirm): the CO2 supply delivers at up to 3 bar(g) from the supplier's regulator with its own relief at 4 bar(g) (ASSUMED); the bursting disc PSE-101 at 0.5 bar(g) on the feed header CO2-101 (RL-101 to a safe location, with a burst indicator) and the independent cathode pressure high-high PIA-123 at 0.35 bar(g) (I-111) protect the cathode side; the stacks and V-121 are designed for 1.0 bar(g) (ASSUMED). Still open (the competent person): the relief study's sizing, the outlet location, disc or reclosing valve, and the supplier's actual regulator and relief. Revised response (2026-11-07, D-067, D-068, for the team to confirm): the high-high also on the header beside the disc (PIA-116), 0.15 bar below the burst pressure; the burst indicator tagged XS-101; I-111 is not an independent layer where FV-102 failing open is the cause (H01-S305), for which an independent tight shut-off on CO2-101 at the battery limit is an option for the relief study; the outlet reserved west of the frame, 5.5 m above grade, with the condensate collection's vent (zone 1 within 3 m, Z-VENT-A, ASSUMED). Still open: as above, and RL-101's size and back-pressure.", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H01-A304, text: "Confirm the low-temperature protection of the merchant CO2 vaporiser at the battery limit, or add a low temperature trip on CO2-101 that closes FV-102 (H01-S306).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A305, text: "Add CO2 and O2-depletion detection at the skid's low points with an alarm and a rule for approaching; no fixed CO2 or O2 detector is drawn and AIA-141 / AIA-142 do not see a CO2-only leak (H01-S307). Proposed response in part (the owner's decision of 2026-11-06, D-050, for the team to confirm): the skid is open, so there is no enclosure to detect in or fan to start; SEQ-A-START S1 checks CO2 (and O2) at grade and the low points with a portable meter. Still open: whether a fixed CO2 detector at a low point is needed during the run (the gas detection study, H01-A902), and keeping pits and trenches away from the skid.", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H01-A306, text: "Add check valves on the CO2 feed CO2-101 downstream of FV-102 and on the humidification water W-101, and a low supply pressure alarm, so that cathode gas with CO cannot flow back into the supplies (H01-S308). Proposed response (D-062, for the team to confirm): check valves on CO2-101 downstream of FV-102 and on W-101 downstream of HV-104. Still open: a low supply pressure alarm, and the demineralised water tie-in's backflow preventer of the supplier's category (EN 1717, the site).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A307, text: "Give the start-up purge of SEQ-A-START S2 a flow path: start K-131 and X-132 before or with the purge (with the order of S3 reviewed against H01-S602), or draw a purge route from CG-102 to X-132 or a safe vent; state the regulated CO2 supply pressure against the anolyte pressure and the GDE window (#332); and correct the PV-121 rationale in control/loops.yaml, which a stopped K-131 defeats (H01-S309; as H02-A307). Proposed response (D-060, D-061, for the team to confirm): SEQ-A-START S2 starts the oxidiser, opens XV-133 and XV-134 and starts the PSA, S3 starts K-131 with the CO2 purge on the total feed FIC-104; the supply's 3 bar(g) is stated (D-060); the PV-121 rationale is corrected. Still open: the GDE window (#332).", owner: process engineer, status: proposed, by: agent}
  # N4 cathode gas outlet
  - {id: H01-A401, text: "Add a cathode pressure high-high on CG-101, independent of PIC-121, that trips U-101 and closes FV-102, and set the PIC-121 alarm and trip values from the stack vendor's allowed pressure, and trip U-101 when K-131 stops (H01-S401, H01-S402, H01-S411, H01-S503; as H02-A402). Proposed response (D-060, P&ID revision C, for the team to confirm): PIA-123 on CG-101, independent of PIC-121, trips U-101 and closes FV-102 at 0.35 bar(g) (I-111, with PSE-101's burst indicator); K-131 not running with the current on trips U-101 and closes FV-102 and XV-134 (I-113). Still open: the set points against the stack vendor's allowed pressure, the SIL screening.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H01-A402, text: "Add a low pressure alarm to PIC-121 and stop K-131 on a low cathode pressure; review the fail-open PV-121 for the loss of instrument air with K-131 still running, against the GDE window (#332) (H01-S404); consider an O2 measurement in the cathode gas against air drawn in under vacuum (H01-S410, as H02-A403). Proposed response in part (D-060, D-061, for the team to confirm): the instrument air low-low PSLL-151 stops K-131 and trips the current (I-114), and the pressure difference PIA-113 to PIA-123 below 0 kPa trips the current (I-117); PV-121's fail-open rationale is corrected (control/loops.yaml). Still open: a low cathode pressure stop of K-131 and the O2 measurement against air drawn in (H01-S410).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A403, text: "Add a high-high level in V-121 independent of LIC-122 that stops K-131, and review the fail-closed LV-122 on the loss of instrument air with K-131 running (H01-S405, H01-S406). Proposed response (D-060, D-061, for the team to confirm): LIA-124 on its own connection V-121 N5 stops K-131 at its high-high (I-119); on air loss I-114 stops K-131 at once.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H01-A404, text: "Protect the condensate drain against gas blow-by: a low level alarm and an independent low-low that closes a tight-shut valve on CD-101, or a liquid seal; route the condensate to a vented collection away from people (H01-S407). Proposed response (D-061, for the team to confirm): LIA-124's low-low closes the tight shut-off XV-125 (fail closed) on CD-101 (I-118); CD-101 goes to a vented condensate collection. Still open: the collection's design (the site).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A405, text: "Draw a sample point on the cathode gas train for the 'cathode gas free of CO and H2 (sampled)' steps of SEQ-A-STOP, -TRIP and -GAS, and write a gas-free test with a portable CO and H2 meter into a permit-to-work before the train is opened (H01-S409).", owner: operations, status: proposed, by: agent}
  # N5 gas conditioning
  - {id: H01-A501, text: "Relief of the K-131 discharge (none drawn): the governing scenario to be checked by the relief study is the blocked outlet with K-131 (positive displacement) at full stroke, by X-131 closing its feed (H01-S501) or PV-131 closing on loss of air (H01-S502); the device would sit on CG-103 upstream of the check valve. Also add a discharge pressure high-high that stops K-131, interlock K-131 with the X-131 package, and decide the PV-131 fail position with the PSA vendor. No sizing here. Proposed response (D-060, P&ID revision C, for the team to confirm): PIA-132's high-high at 5.8 bar(g) stops K-131, trips the current and closes FV-102 and XV-134 (I-112); K-131 is specified as a hydraulically driven diaphragm compressor whose own hydraulic relief limits the discharge to 6.5 bar(g), below the 7.0 bar(g) design of K-131, CG-103 and X-131, so no relief device is drawn on CG-103 (a device there would release CO and H2, or put the PSA's inventory into the suction side); the PSA vendor's relief protects its vessels. Still open (vendor, the relief study): K-131's hydraulic limit, the PSA's own devices, the PV-131 fail position.", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H01-A502, text: "Add a second protection against back-flow from X-131 when K-131 stops: a tight-shut valve on CG-103 closed with K-131's stop, or the PSA's own inlet isolation confirmed by the vendor; the check valve on CG-103 is the only one today (H01-S503).", owner: mechanical / package engineer, status: proposed, by: agent}
  - {id: H01-A503, text: "Get from the K-131 vendor the diaphragm leak detection (to trip K-131), the discharge temperature protection and the route of the hydraulic-oil-side vent, and bring the trips into control/cause-effect.yaml (H01-S504, H01-S508; as H02-A506).", owner: mechanical / package engineer, status: proposed, by: agent}
  - {id: H01-A504, text: "Add a CO product analyser (CO purity, H2) on CO-101 with an alarm and a diversion of off-specification product to X-132 (D-008) (H01-S505).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A505, text: "Extend I-103 and I-104 to isolate the PSA X-131 (its package stop and PV-131 closed, or an isolation valve on CO-101), so that the CO inventory of the PSA is not left connected to a leak (H01-S506).", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H01-A506, text: "Get the PSA and compressor vendors' depressurisation and purge procedure for maintenance (the beds of X-131 hold adsorbed CO) and decide the purge medium; only CO2 is drawn (H01-S507, as H02-A504).", owner: mechanical / package engineer, status: proposed, by: agent}
  - {id: H01-A507, text: "Guard the PSA recycle CO2-102 (no valve on it today): a check valve and a tight shut-off valve on CO2-102 closed by I-103, I-104 and the stop of K-131, or the PSA vendor's recycle outlet isolation confirmed and interlocked; include CO2-102 in the isolation of SEQ-A-GAS and in the relief study of the cathode side (H01-S509; as H02-A507). Proposed response (D-062, for the team to confirm): a check valve and the tight shut-off XV-134 (fail closed) on CO2-102, closed by every trip that stops K-131 (I-103, I-104, I-109, I-110, I-112, I-113, I-119) and at every stop, opened with the PSA at start-up; SEQ-A-GAS S1 completes on XV-134 closed. Still open: the PSA vendor's own recycle outlet isolation.", owner: process engineer, status: proposed, by: agent}
  # N6 tail gas and vents
  - {id: H01-A601, text: "Bring the oxidiser's supervision into the C&E: flame or catalyst temperature low and combustion air flow low stop the tail gas (stop K-131 and X-131, or isolate TG-101), with a flue temperature or CO measurement on FG-101; size the air for the H2-rich tail gas after a CO2 loss and for the gas-trip purge (H01-S601, H01-S603, H01-S604). Proposed response in part (D-054, for the team to confirm): the burner management system's trip is I-110 in control/cause-effect.yaml, closing XV-133 and stopping K-131; the flue measurement and the air sizing stay open (vendor).", owner: mechanical / package engineer, status: proposed, by: agent}
  - {id: H01-A602, text: "Require from the X-132 vendor a burner or oxidiser management system (pre-purge before every light-off or re-light, flame failure, air flow proving, EN 746-2 or the equivalent) and a package HAZOP; bring its trips into control/cause-effect.yaml (H01-S602). Proposed response in part (the owner's decision of 2026-11-06, D-054, for the team to confirm): the vendor's burner management system to EN 746-2 with pre-purge and its own burner arrester are required as the second barrier behind FA-133; its trip is I-110, and the sequences open XV-133 only once X-132 reports pre-purged and firing. The vendor's system and package HAZOP stay open.", owner: mechanical / package engineer, status: proposed, by: agent}
  - {id: H01-A603, text: "Decide on a flame arrester on O2V-101 and fix the vent outlet's location in the area classification (away from ignition sources and the flue FG-101), since the vent can carry H2 in O2 (H01-S606).", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H01-A604, text: "Pressure and vacuum protection of T-101 (none drawn beyond the open vent): the governing scenarios to be checked are the gravity drain with O2V-101 blocked (vacuum, H01-S806) and the blocked vent with the stacks running (H01-S608); add a weather and bird screen that cannot close the vent and an inspection of the outlet; the overfill at the fill, which stands liquid in the vent (H01-S801), is a third case. No sizing here.", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H01-A605, text: "Protect the tail gas TG-101 against flashback: a flame arrester and a check valve on TG-101 (or the X-132 vendor's confirmation of the burner's own), a stop of X-132 (or of its fuel) on a falling tail flow and with K-131, and the order of the stop steps of SEQ-A-STOP, -TRIP and -GAS reviewed with the vendor's burner management (H01-S610, with H01-A602; as H02-A604). Proposed response (the owner's decision of 2026-11-06, D-054, P&ID revision B, for the team to confirm): at X-131's outlet inside Z-HAZ-A the fail-closed trip valve XV-133, a check valve and the in-line detonation arrester FA-133 for unstable detonation (EN ISO 16852, IIC, unidirectional, protected side towards X-131), TSHH-133 on its unprotected side tripping XV-133 (I-109, burning-time protection), the gas trips and the oxidiser's burner management trip (I-110) closing XV-133, the stop sequences closing it before X-132 stops; TG-101 all-welded, protected where it crosses grade and off the escape way (pinned, D-057); the vendor's burner arrester and burner management (EN 746-2, pre-purge) the second barrier. Cannot be settled here (vendor): the arrester's EU-type examination for the actual tail gas at its temperature and pressure, its burning time and so TSHH-133's set point, and TG-101's detonation pressure rating (H01-S610, H01-S611).", owner: mechanical / package engineer, status: proposed, by: agent}
  - {id: H01-A606, text: "Keep the overhead tail gas TG-101 free of liquid and ice (H01-S612): obtain the tail gas's dew point and water load from the PSA vendor; specify the trace heating (self-regulating, certified for the zone) and the insulation of TG-101 and its drip legs DR-102 and DR-103; write the draining routine of HV-111 and HV-112 into the operating procedures (frequency from the water load, into a closed container, the gas content of the drained water); confirm with the arrester's vendor the orientation and drainage of FA-133 on the overhead run falling away from it. Proposed response already drawn (P&ID revision D, D-068): the drip legs, the slope and the arrester at the riser's top.", owner: process engineer, status: proposed, by: agent}
  # N8 fill and drain
  - {id: H01-A801, text: "Add a high level alarm, and a high-high independent of LIA-101, on T-101 for the fill, and write the fill so that the operator at HV-102 can stop the delivery pump (H01-S801). Proposed response in part (D-061, for the team to confirm): LIA-101 has LAH at the working volume and LAHH at 90 % with a horn and beacon at the fill connection, and SEQ-A-FILL checks the volume delivered first. Still open: a high-high independent of LIA-101.", owner: instrument and control engineer, status: proposed, by: agent}
  - {id: H01-A802, text: "Check every KOH delivery before the transfer (certificate and a titration of a sample) and use a dedicated coupling for the 1 M KOH fill (H01-S802).", owner: operations, status: proposed, by: agent}
  - {id: H01-A803, text: "Write the hose transfer procedure for the fill and the drain: PPE, dry-break couplings, a drip tray or bund at the west-end hose connections, two people for the transfer (H01-S803).", owner: operations, status: proposed, by: agent}
  - {id: H01-A804, text: "Lock or car-seal HV-103 closed for the campaign, opened only under SEQ-A-DRAIN (H01-S804).", owner: operations, status: proposed, by: agent}
  - {id: H01-A805, text: "Confirm that the site effluent accepts the spent anolyte (pH, potassium, carbonate, nickel, volume and rate), or collect it in IBCs for off-site disposal or neutralise it first (H01-S805).", owner: process safety / HSE, status: proposed, by: agent}
  # N9 open skid and gas detection
  - {id: H01-A901, text: "Prove the extract fan K-141: a running or air flow signal with an alarm, and a permissive on U-101 and FV-102; size the enclosure ventilation (air changes) for the dilution of the largest credible leak (the enclosure and the fan are ASSUMED, D-017) (H01-S901). Proposed response (the owner's decision of 2026-11-06, D-050, for the team to confirm): the skid is open and naturally ventilated; the enclosure and K-141 are deleted, so there is no fan to prove; at most a rain canopy over the rectifier and the junction boxes. Still open: the competent person's confirmation that the open skid is adequately ventilated (IEC 60079-10-1, H01-A204), and that no roof is put over the gas train.", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H01-A902, text: "Make the gas detection study for the skid: the number and location of CO and H2 detectors at each source cluster (stacks, V-121, K-131, X-131, X-132), their set points, the voting (one detector each today, no voting), detectors at the vents if needed, personal CO monitors for entry; then update I-103 and I-104 (H01-S506, H01-S902). Decided in part by the owner on 2026-11-06 (D-050, for the team to confirm): the CO and H2 point detectors stay at the PSA and the compressor (AIA-141) and high over the stack row (AIA-142), certified IIC (D-051); personal CO monitors are worn (SEQ-A-START S1); a CO2 check at grade and the low points. The study itself (numbers, places, set points, voting, when the personal monitor is worn) stays open.", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H01-A903, text: "Owner decision of #330 on the Ex rating for zone 2 of the motors of K-141, P-101 and K-131 and of every other electrical item inside Z-HAZ-A (ASSUMED Ex-rated today), with the area classification (H01-A204) and AIA-142 at the high points of the enclosure; I-104 starts K-141 and leaves P-101 running inside a detected H2 cloud, so K-141 (motor out of the air stream) and P-101 need the rating whatever the owner decides for the rest, or I-104 must stop P-101 (H01-S903). Proposed response (decided by the owner on 2026-11-06, D-051, to be confirmed by the team): inside the screening zone the motors P-101 and K-131 II 2G Ex db eb IIC T3 Gb (Ex eb acceptable), the transmitters, analysers and solenoids Ex ia IIC T4 Ga with their barriers or isolators outside the zone (JB-101, CR-1), certified IIC gas detectors; 3G / Gc the stated minimum; the non-electrical ignition of K-131 and P-101 to EN ISO 80079-36/-37; the PSA X-131 with the vendor's ATEX assembly assessment; T-101 (PP) earthed and bonded (IEC TS 60079-32-1); the rectifier's AC isolated at SDB-1 on gas detection and the DC never broken under load inside the zone; the DC drops in armoured cable with IIC glands and shrouded IP-rated stack terminals. K-141 is deleted (D-050), so I-104 no longer starts a motor in the cloud; P-101 left running is Gb. Cannot be settled here: the area classification, the explosion protection document, the Ex inspection and the stacks' terminals (the competent person, H01-A204).", owner: owner / electrical engineer, status: proposed, by: agent}
  - {id: H01-A904, text: "Define the safe state on a loss of power (F-POWER, open): a UPS for the gas detectors and the alarms, a purge source and route that work without power (or a passive vent of the cathode gas train to a safe location), and a rule for approaching the skid after a power loss (H01-S904). The fan K-141 is deleted with the enclosure (D-050).", owner: process engineer, status: proposed, by: agent}
  - {id: H01-A905, text: "Depressurise the isolated cathode gas train after a gas trip (to X-132 once it is safe, or to a safe vent), and write the leak search with breathing apparatus or a personal CO monitor (H01-S905). Proposed response in part (D-061, for the team to confirm): every stop, trip and gas sequence depressurises CG-103 and the PSA through the PSA's own stop into the tail gas while the oxidiser still fires (PIA-132 shows it), before XV-133 closes. Still open: a depressurisation when the oxidiser cannot fire, and the leak-search procedure.", owner: operations, status: proposed, by: agent}
  - {id: H01-A906, text: "Remove the oxidiser X-132 as an ignition source of the enclosure: stop X-132 and isolate the tail gas TG-101 (stop X-131) from I-103 and I-104 and in SEQ-A-GAS S1, or place X-132 outside the enclosure and outside zone Z-HAZ-A; have the area classification (H01-A204) treat X-132 as a permanent ignition source and get its surface temperatures from the vendor (H01-S906; as H02-A906). Proposed response (the owner's decisions of 2026-11-06, D-050, D-054, D-057, for the team to confirm): the skid has no enclosure; X-132 stands outside the zone on its plinth south-east of the frame, 2 m or more from the east stair's foot; I-103 and I-104 close XV-133, so the tail gas stops on gas detection. Still open: the area classification's treatment of X-132 as a permanent ignition source and its surface temperatures (vendor).", owner: process safety / HSE, status: proposed, by: agent}
  - {id: H01-A907, text: "The layout (D-047, review 2026-11-05-layout#2) now places X-132 off the frame on its own plinth east of Skid A, 3 m or more from every source of Z-HAZ-A and outside the enclosure, as the second option of H01-A906. Draw on P-01 what that position assumes: a flame arrester on TG-101 at X-131's outlet (inside X-131's zone) and TG-101 all-welded from there to the burner; then reassess H01-S906 with X-132 outside the zone and confirm the position and the tail-gas line's release points by the area classification (H01-A204). Proposed response (the owner's decision of 2026-11-06, D-054, P&ID revision B, and D-057, for the team to confirm): drawn on P-01 at X-131's outlet inside Z-HAZ-A: XV-133, a check valve and the detonation arrester FA-133 (EN ISO 16852, IIC, unstable detonation), TSHH-133; TG-101 all-welded from there, pinned at 0.30 m on sleeper posts, off the escape way, to X-132 moved south-east (D-057); H01-S906 re-rated as a proposal. The 3D model places the in-line items 1 m apart along TG-101, outside the zone, which is a limit of the model, not the design (D-057). The area classification's confirmation stays open (H01-A204).", owner: process engineer, status: proposed, by: agent}
