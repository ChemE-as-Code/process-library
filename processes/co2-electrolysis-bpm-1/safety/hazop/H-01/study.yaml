  # ---------------------------------------------------------------- N2 stacks and DC supply
  - id: H01-N2
    title: Stacks E-101A to D and their DC supply, rectifier U-101 (48 V bus)
    design_intent: "Electrolyse CO2 to CO in four stacks of seven 100 cm2 bipolar-membrane cells (reverse bias, Ag GDE cathode, Ni anode; 28 cells) at 200 mA/cm2 constant current: 80 A from the rectifier U-101 under JIC-101 (4 x 20 A, on a 48 V DC bus, about 3 kW DC, efficiency 0.95 ASSUMED; the bus is not drawn), with about 2.2 kW of heat to the anolyte, at the measured operating point (FE and voltage of the measured series, ASSUMED to transfer from 5 to 100 cm2, D-007, D-014). U-101 is the final element of every trip I-101 to I-106, I-109 and I-110 (its AC feeder opened at SDB-1, D-051) and stands off the frame on a plinth at grade beyond its north-east corner, outside zone Z-HAZ-A, 3.23 m from the nearest zone source with its flanges (a non-Ex cabinet, D-057). A stack is replaced every 4000 h (ASSUMED) by a slide at deck level onto a trolley (D-047)."
    members: [U-101, JIC-101, E-101A, E-101B, E-101C, E-101D]
    modes: [startup, normal, onoff-partload, stop, trip, utility-fail, maintenance]
    status: proposed
    by: agent
    notes: "The DC bus, its cabling, earthing, isolation and the stack voltage measurement are not drawn (D-017; electrical/README.md). The cell's internal parameters (pressure difference across the GDE, crossover through the membrane) are studied with the nodes that set them: the anolyte pressure in H01-N1, the cathode pressure in H01-N3 / H01-N4."
    deviations:
      - id: H01-N2-D1
        guide_word: more
        parameter: current
        description: "Stack current above the 80 A (200 mA/cm2) of the duty."
        scenarios:
          - id: H01-S201
            cause: "JIC-101 or the rectifier U-101's own regulation fails high: the current rises towards the rectifier's maximum."
            consequence: "More stack heat than the 2.2 kW E-111 is sized for, more H2 and O2 and more crossover: overheating and membrane damage in four stacks."
            refs: [JIC-101, U-101, E-101A, E-101B, E-101C, E-101D, TIC-111, TSHH-112]
            modes: [startup, normal, onoff-partload]
            safeguards: [H01-SG-TIC111-TAH, H01-SG-I105, H01-SG-I120]
            actions: [H01-A205]
            status: proposed
            by: agent
            notes: "The TIC-111 alarm and I-105 are listed because they act on this deviation; neither is credited, since both end at the failed regulation (assessment_basis: nothing for a safeguard the cause defeats). Nothing in control/ or electrical/ removes the DC other than through U-101: no contactor, DC breaker or isolator is drawn."
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: D, basis: "Four stacks damaged (matrix 3); a single control failure (D).", evidence: [JIC-101, U-101], status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: co2-bpm-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 0897883ced07f447, inputs: {matrix: 0e87818000ffd702, category: asset, severity: '3', likelihood: D}}}
              residual:
                - {category: asset, severity: "3", likelihood: C, basis: "Revised 2026-11-06 (D-063, proposed): the per-stack current sensors IIA-106A to D, independent of JIC-101, trip U-101 when the stacks share more than 96 A (I-120, one letter), though through the same rectifier: the DC contactor of H01-A205 is still open. Before: The operator answers the TIC-111 high alarm through JIC-101 and U-101, the failed devices (SEQ-A-STOP and -TRIP S1 also cut the current through JIC-101): not credited. I-105 on TSHH-112 trips U-101, the rectifier whose regulation or output stage is the cause, and nothing removes the DC independently of it: not credited until the trip is shown to (H01-A205). The rectifier's own current limit is the vendor's and is not credited. Nothing is credited.", evidence: [TIC-111, I-105, control/loops.yaml JIC-101, control/cause-effect.yaml], status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: co2-bpm-1-5x5-proposed (safety/risk-matrix.yaml)', fingerprint: 0a42b546bff60f53, inputs: {matrix: 0e87818000ffd702, category: asset, severity: '3', likelihood: C}}}
