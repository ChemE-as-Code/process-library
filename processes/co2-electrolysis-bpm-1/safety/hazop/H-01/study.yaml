id: H-01
title: 'Skid A: one-fill anolyte reservoir'
scope: >-
  Sheet P-01 (pid/P-01.xml) as drawn, Skid A of #330 (1xx tags, case skid-a, DESIGN.md D-007,
  D-009): the anolyte loop T-101 / P-101 / E-111 with the supply and return manifolds
  AN-101 to AN-104C and the anode side of the four stacks E-101A to D; the stacks and their DC
  supply, the rectifier U-101 (the 48 V DC bus is not drawn); the cathode CO2 feed CO2-101 to
  CO2-101D with FV-102, the PSA recycle CO2-102 and the humidification water W-101 / HV-104;
  the cathode gas outlet CG-101 to CG-101D, the separator V-121 with its condensate CD-101 /
  LV-122 and the back-pressure valve PV-121 on CG-102; the gas conditioning, the diaphragm
  compressor K-131, CG-103 with its check valve, the CO PSA package X-131 and the CO product
  CO-101 / PV-131 to the battery limit; the tail gas TG-101 through the fail-closed trip valve
  XV-133, a check valve and the detonation arrester FA-133 with TSHH-133 (D-054) to the
  tail-gas oxidiser X-132 (AIR-101, FG-101) and the anolyte reservoir vent O2V-101; the one
  fill KOH-101 / HV-102, the end-of-run drain SP-101 / HV-103, the pump-out PO-101, the loop's
  low-point drain DR-101 and the cooler vent AV-111 (D-055); the open, naturally ventilated
  skid (no enclosure, D-050) with the gas detectors AIA-141 (CO) and AIA-142 (H2); from P&ID
  revision C (D-060 to D-065) the bursting disc PSE-101 on CO2-101 (RL-101), PIA-113, AIA-114,
  FIC-104, EIA-105A to D, IIA-106A to D, PIA-123, LIA-124 with XV-125 on CD-101, PIA-132,
  PSLL-151, the check valves on CO2-101, W-101 and CO2-102 and XV-134; from P&ID revision D
  (D-067, D-068) XV-125 and XV-134 drawn as actuated trip valves with their safety I/O
  outputs XY-125 and XY-134, PIA-115 and PIA-116 (the membrane's pressure difference at each
  end, PIA-116 also I-111's high-high beside PSE-101), PSE-101's burst indicator XS-101,
  TG-101's drip legs DR-102 / HV-111 and DR-103 / HV-112, and the vent outlet of RL-101 and the
  condensate collection reserved west of the frame (layout/zones.yaml Z-VENT-A). The trips
  are those of control/cause-effect.yaml I-101 to I-106 and I-109 to I-120, the sequences
  SEQ-A-FILL, -START, -STOP, -TRIP, -GAS and -DRAIN of control/sequences.yaml. Battery
  limits: the CO2 supply (merchant liquefied CO2, D-016, its storage and vaporiser are not
  drawn and not studied beyond the CO2-101 tie-in), the tempered water TWS-101 / TWR-101
  from a heating and cooling unit off the skid (D-052, D-056), the demineralised water W-101, the combustion air AIR-101, the
  1 M KOH delivery to the KOH-101 hose connection, the spent anolyte, condensate and CO product
  receivers (site effluent, CO-101 consumer), instrument air and power. Not covered: the
  internals of the black-box packages X-131 and X-132 (D-012; the vendor's package HAZOP), the
  stack vendor's internal design beyond the drawn connections, the site's area classification
  (layout/zones.yaml is a screening only, D-019), relief device sizing (only the governing
  scenario is named) and Skid B, which is H-02.
modes:
  - {id: startup, title: 'Start-up: fill, purge, energise', description: "SEQ-A-FILL (fresh 1 M KOH through HV-102 to the working level, circulate) and SEQ-A-START (check the air at the skid, bring the loop to 25 degC on the tempered water under TIC-111, purge and humidify the cathodes with CO2, start K-131 and X-132, open XV-133 once X-132 fires, start X-131, ramp JIC-101 to 80 A)."}
  - {id: normal, title: Normal steady operation, description: "Duty D-A: 200 mA/cm2 constant current (80 A, 4 x 20 A, 28 cells of 100 cm2, about 3 kW DC on the 48 V bus) on one fill, the anolyte drifting from fresh 1 M KOH to the trip value pH 12.2 (concentration basis, 0.2 above the criterion pH 12, D-058) at the end of the campaign H (1000 h design, 10,000 h scenario)."}
  - {id: onoff-partload, title: On/off and part-load duties on the same hardware, description: "D-A-ONOFF (24 h period, half on, current switched off and on daily) and D-A-PART (12 h at 200 and 12 h at 100 mA/cm2, current steps) on STK-A and T-101 as for D-A (D-013): the same hardware, more current transitions."}
  - {id: exchange, title: 'Anolyte refill / exchange at the end of the campaign', description: "SEQ-A-STOP or a trip, then SEQ-A-DRAIN (P-101 stopped, the loop vented at AV-111, the spent anolyte drained through HV-103, the loop's low point through DR-101 and the heel pumped out through PO-101 to closed IBCs, the loop flushed with demineralised water, D-055) and a new SEQ-A-FILL; the 1176 L (1000 h) or 11,760 L (10,000 h) of T-101 handled as hose transfers at the frame's west end (D-019, D-058)."}
  - {id: stop, title: Normal stop, description: "SEQ-A-STOP at H: ramp the current down, purge the cathodes with CO2 to the oxidiser, stop K-131 and X-131, close XV-133, stop X-132; a skid left filled and idle keeps P-101 circulating and the tempered water heating (D-056)."}
  - {id: trip, title: Trip and gas trip, description: "SEQ-A-TRIP after I-101, I-102, I-105 or I-106 (current off, CO2 purge kept, P-101 runs unless I-102 stopped it); SEQ-A-GAS after I-103, I-104, I-109 or I-110 (current off with the rectifier's AC feeder at SDB-1, FV-102 and XV-133 closed, K-131 stopped, the cathode gas train isolated with its CO and H2 until the cause is found, then purged to X-132 once it fires)."}
  - {id: utility-fail, title: 'Loss of power, instrument air or tempered water', description: "control/philosophy.md F-POWER, F-AIR, F-CW: the pneumatic valves TV-111, FV-102, PV-121, LV-122, PV-131 and XV-133 go to their fail positions; on power loss the rectifier, pumps and compressor stop (no fan: the skid is open, D-050)."}
  - {id: maintenance, title: Maintenance, description: "Isolation, draining and opening of the anolyte and the cathode gas lines, instrument work, and the replacement of a stack (4000 h interval, ASSUMED): slid out at deck level onto a deck-height trolley from the frame's south edge once its connections are undone (D-047)."}
