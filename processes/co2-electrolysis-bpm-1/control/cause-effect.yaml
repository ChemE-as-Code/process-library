# Cause and effect list: interlocks and trips. Schema: `cheme schema interlocks`.
# On a sheet, refer to an interlock ("see C&E I-01") instead of spelling out what it trips.
#
# The trips of the two pilot skids of #330 (DESIGN.md D-018): I-1xx Skid A (P-01), I-2xx
# Skid B (P-02), the same numbering in both. PROPOSED, not approved: no SIL screening, no
# HAZOP yet (sil: null); every trip value is ASSUMED. The pH values are the duty model's
# concentration basis (D-003); the probe reads activity pH, so the trip value needs the offset
# of control/philosophy.md before it is set. A trip of the rectifier (U-x01) stops the current,
# and with it the CO, H2 and O2 production; the anolyte pump and the CO2 purge keep running
# unless the trip says otherwise (SEQ-x-TRIP in control/sequences.yaml). A gas detection trip
# (I-x03, I-x04) also closes the CO2 feed, stops the compressor and closes the tail-gas trip
# valve XV-x33: the cathode gas train stays isolated until the leak is found and the trip reset
# (SEQ-x-GAS). The tail-gas trips (D-054): the arrester temperature on its unprotected side
# (I-x09, burning-time protection) and the oxidiser's own supervision (I-x10, its burner
# management system) close XV-x33 and isolate the train in the same way. I-107, I-108 are not
# used (Skid B's I-207, I-208 have no Skid A counterpart), so both skids keep one numbering.
schema: cheme/interlocks/v1
interlocks:
  # -- Skid A (P-01) ----------------------------------------------------------------------
  - id: I-101
    title: Skid A anolyte pH low-low (the trip value reached before the end of the campaign)
    cause: {tag: AI-101, condition: "AALL: pH 12.2, concentration basis (0.2 above the pH 12 stability criterion of D-003, D-058; ASSUMED)"}
    effects:
      - {tag: U-101, action: trip}
    sheet: P-01
    sil: null
    latching: true
    reset: manual
    notes: "Owner decision of 2026-11-06 (D-058): the trip acts at pH 12.2 and the duty sizes T-101 (1,176 L) to reach the trip value at H, so the trip keeps 0.2 pH (about 9 h at the measured WDE) between itself and the criterion pH 12 that protects the Ni anode. At the measured WDE the anolyte is at the trip value at H, so the campaign ends normally by SEQ-A-STOP and the trip does not act; it stops the current if the WDE is lower than measured or the run overruns H. The margin is ASSUMED, the same as Skid B's I-201; it is to be set from the probe's uncertainty once the activity-to-concentration offset is calibrated against titrated anolyte (control/philosophy.md, H01-A109), which this decision does not settle. D-018, D-058."
  - id: I-102
    title: Skid A anolyte level low-low
    cause: {tag: LIA-101, condition: LALL}
    effects:
      - {tag: U-101, action: trip}
      - {tag: P-101, action: stop}
    sheet: P-01
    sil: null
    latching: true
    reset: manual
    notes: "Loss of anolyte (a leak, a drain left open): the stacks lose their anolyte and P-101 runs dry. D-018."
  - id: I-103
    title: Skid A CO detected at the gas train (open skid)
    cause: {tag: AIA-141, condition: "AHH: CO, ASSUMED set point by the gas detection study"}
    effects:
      - {tag: U-101, action: trip}
      - {tag: FV-102, action: close}
      - {tag: K-131, action: stop}
      - {tag: XV-133, action: close}
    sheet: P-01
    sil: null
    latching: true
    reset: manual
    notes: "CO is toxic: stop making it, stop the CO2 feed and the compressor, and close the tail gas to the oxidiser (no gas sent to a flame while the leak is open, D-054). The skid is open and naturally ventilated (D-050): no fan to start. The U-101 trip also opens the rectifier's AC feeder at SDB-1, outside the zone (D-051). D-018."
  - id: I-104
    title: Skid A H2 detected over the stack row (open skid)
    cause: {tag: AIA-142, condition: "AHH: H2, ASSUMED set point (a fraction of the lower flammability limit) by the gas detection study"}
    effects:
      - {tag: U-101, action: trip}
      - {tag: FV-102, action: close}
      - {tag: K-131, action: stop}
      - {tag: XV-133, action: close}
    sheet: P-01
    sil: null
    latching: true
    reset: manual
    notes: "H2 (about 1.46 mol per mol CO at the measured FE) is flammable; on the open skid it rises and disperses (D-050). The tail gas to the oxidiser is closed with the train (D-054). The U-101 trip also opens the rectifier's AC feeder at SDB-1, outside the zone (D-051). D-018."
  - id: I-105
    title: Skid A anolyte temperature high-high at the stack outlet
    cause: {tag: TSHH-112, condition: THH}
    effects:
      - {tag: U-101, action: trip}
    sheet: P-01
    sil: null
    latching: true
    reset: manual
    notes: "Loss of cooling: the stacks heat at about 2.2 kW; the measured series is at 25 degC only. Trip value ASSUMED (membrane and PP limits, vendor). D-018."
  - id: I-106
    title: Skid A anolyte recirculation flow low-low
    cause: {tag: FIC-101, condition: FALL}
    effects:
      - {tag: U-101, action: trip}
    sheet: P-01
    sil: null
    latching: true
    reset: manual
    delay: {value: 5, unit: s}
    notes: "The stacks without anolyte flow lose the anode's water and O2 removal. The trip shares its transmitter with FIC-101 (HAZOP to judge). D-018."
  - id: I-109
    title: Skid A tail-gas arrester temperature high-high (flame held on the arrester)
    cause: {tag: TSHH-133, condition: "THH: ASSUMED set point, within the arrester's certified burning time (vendor)"}
    effects:
      - {tag: XV-133, action: close}
      - {tag: U-101, action: trip}
      - {tag: K-131, action: stop}
      - {tag: FV-102, action: close}
    sheet: P-01
    sil: null
    latching: true
    reset: manual
    notes: "Burning-time protection of the detonation arrester FA-133 (EN ISO 16852): a flame that stabilises on the element's unprotected side at continuous flow would pass it once the certified burning time is exceeded, so the temperature closes XV-133 on the protected side and stops the gas that feeds it. With the tail gas closed the cathode gas train has no outlet: the current trips, the compressor stops and the CO2 feed closes, as on a gas trip (SEQ-A-GAS). D-054."
  - id: I-110
    title: Skid A oxidiser not firing (burner management trip of X-132)
    cause: {tag: X-132, condition: "flame failure, low air or the burner management system's own trip while firing (armed once X-132 reports firing; package signal, EN 746-2; vendor)"}
    effects:
      - {tag: XV-133, action: close}
      - {tag: U-101, action: trip}
      - {tag: K-131, action: stop}
      - {tag: FV-102, action: close}
    sheet: P-01
    sil: null
    latching: true
    reset: manual
    notes: "No tail gas to a burner that is not firing (it would leave unburnt CO and H2 at the flue) or that is pre-purging. The vendor's burner arrester and burner management system (pre-purge, flame supervision) are the second barrier behind FA-133. The train is isolated as on a gas trip (SEQ-A-GAS). D-054."
  # -- Skid B (P-02) ----------------------------------------------------------------------
  - id: I-201
    title: Skid B anolyte pH low-low
    cause: {tag: AIC-201, condition: "AALL: pH 12.2, concentration basis (ASSUMED: far below the 13.7 setpoint, above the pH 12 threshold)"}
    effects:
      - {tag: U-201, action: trip}
    sheet: P-02
    sil: null
    latching: true
    reset: manual
    notes: "Normal operation holds pH 13.7 (D-010); pH 12.2 means the dosing failed. The trip shares its probe with AIC-201 (HAZOP to judge). D-018."
  - id: I-202
    title: Skid B anolyte level low-low
    cause: {tag: LIA-202, condition: LALL}
    effects:
      - {tag: U-201, action: trip}
      - {tag: P-201, action: stop}
      - {tag: P-202, action: stop}
      - {tag: FV-203, action: close}
    sheet: P-02
    sil: null
    latching: true
    reset: manual
    notes: "LIA-202 is independent of the make-up control LIC-201. The 50 L reservoir holds about 4.5 min of the recirculation (D-010). D-018."
  - id: I-203
    title: Skid B CO detected at the gas train (open skid)
    cause: {tag: AIA-241, condition: "AHH: CO, ASSUMED set point by the gas detection study"}
    effects:
      - {tag: U-201, action: trip}
      - {tag: FV-202, action: close}
      - {tag: K-231, action: stop}
      - {tag: XV-233, action: close}
    sheet: P-02
    sil: null
    latching: true
    reset: manual
    notes: "As I-103. D-018."
  - id: I-204
    title: Skid B H2 detected over the stack row (open skid)
    cause: {tag: AIA-242, condition: "AHH: H2, ASSUMED set point (a fraction of the lower flammability limit) by the gas detection study"}
    effects:
      - {tag: U-201, action: trip}
      - {tag: FV-202, action: close}
      - {tag: K-231, action: stop}
      - {tag: XV-233, action: close}
    sheet: P-02
    sil: null
    latching: true
    reset: manual
    notes: "As I-104. D-018."
  - id: I-205
    title: Skid B anolyte temperature high-high at the stack outlet
    cause: {tag: TSHH-212, condition: THH}
    effects:
      - {tag: U-201, action: trip}
    sheet: P-02
    sil: null
    latching: true
    reset: manual
    notes: "As I-105. D-018."
  - id: I-206
    title: Skid B anolyte recirculation flow low-low
    cause: {tag: FIC-201, condition: FALL}
    effects:
      - {tag: U-201, action: trip}
    sheet: P-02
    sil: null
    latching: true
    reset: manual
    delay: {value: 5, unit: s}
    notes: "As I-106. D-018."
  - id: I-207
    title: Skid B dosing and bleed off with the current off
    cause: {tag: JIC-201, condition: "current off (below 5 % of the setpoint, ASSUMED)"}
    effects:
      - {tag: P-202, action: stop}
      - {tag: FV-203, action: close}
    sheet: P-02
    sil: null
    latching: false
    reset: automatic
    notes: "The dose and the bleed are sized for the current on (duty D-B, D-010); dosing or bleeding with the current off would drift the anolyte. A permissive, not a safety trip: it resets when the current is back."
  - id: I-208
    title: Skid B 5 M KOH day tank level low-low
    cause: {tag: LIA-203, condition: LALL}
    effects:
      - {tag: P-202, action: stop}
    sheet: P-02
    sil: null
    latching: true
    reset: manual
    notes: "Dry-run protection of the metering pump; the day tank is refilled weekly (refill_interval 168 h, D-010). AIC-201 then alarms as the pH falls."
  - id: I-209
    title: Skid B tail-gas arrester temperature high-high (flame held on the arrester)
    cause: {tag: TSHH-233, condition: "THH: ASSUMED set point, within the arrester's certified burning time (vendor)"}
    effects:
      - {tag: XV-233, action: close}
      - {tag: U-201, action: trip}
      - {tag: K-231, action: stop}
      - {tag: FV-202, action: close}
    sheet: P-02
    sil: null
    latching: true
    reset: manual
    notes: "As I-109 (SEQ-B-GAS). D-054."
  - id: I-210
    title: Skid B oxidiser not firing (burner management trip of X-232)
    cause: {tag: X-232, condition: "flame failure, low air or the burner management system's own trip while firing (armed once X-232 reports firing; package signal, EN 746-2; vendor)"}
    effects:
      - {tag: XV-233, action: close}
      - {tag: U-201, action: trip}
      - {tag: K-231, action: stop}
      - {tag: FV-202, action: close}
    sheet: P-02
    sil: null
    latching: true
    reset: manual
    notes: "As I-110 (SEQ-B-GAS). D-054."
