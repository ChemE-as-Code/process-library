# Instrument list. Schema: `cheme schema instruments`.
# The instruments of the two pilot skids of #330 (P-01 Skid A, P-02 Skid B), as printed on the
# generated sheets. What each one controls is in control/loops.yaml, what it trips in
# control/cause-effect.yaml (the notes here only refer to them). The pH is measured by a probe
# (activity basis); the duty model's threshold and setpoints are concentration-basis pH: see
# control/philosophy.md (calibration offset, open). Ex marking (D-051): every transmitter,
# analyser, positioner and solenoid in a skid's zone is intrinsically safe, Ex ia IIC T4 Ga,
# with its barrier or isolator outside the zone (JB-x01 or CR-1); the gas detectors are
# certified for gas group IIC. Revision C of the sheets (the design review 2026-11-06-design,
# DESIGN.md D-060 to D-064) adds per skid: the relief basis's independent pressures (PIA-x23,
# PIA-x32), the anolyte pressure PIA-x13 (the membrane's pressure difference with PIA-x23), the
# H2-in-O2 analyser AIA-x14, the total cathode CO2 FIC-x04, the per-stack voltages EIA-x05A to D
# and currents IIA-x06A to D, the independent condensate level LIA-x24 and the instrument air
# low-low PSLL-x51; the level alarms of the tanks gain LAH and LAHH (D-061). Every set point is
# ASSUMED, for the HAZOP team and the SIL screening.
schema: cheme/instruments/v1
instruments:
  # -- Skid A (P-01) ----------------------------------------------------------------------
  - {tag: FIC-101, service: "Anolyte recirculation flow to the stacks (P-101 speed)", sheet: P-01, notes: "loop FIC-101; low-low flow trip, see C&E I-106"}
  - {tag: TIC-111, service: "Anolyte temperature at the stack inlet (tempered water to E-111, TV-111)", sheet: P-01, notes: "loop TIC-111, its action switched with the tempered-water unit's heating or cooling mode (D-062); low-temperature alarm TAL (frost protection of the open skid, D-052, D-056)"}
  - {tag: TSHH-112, service: "Anolyte temperature at the stack outlet, high-high", sheet: P-01, notes: "see C&E I-105"}
  - {tag: JIC-101, service: "Stack current at the rectifier U-101", sheet: P-01, notes: "loop JIC-101 (J: the electrical quantity at the rectifier, as in the spec of #330); current-off signal to the Skid A permissives"}
  - {tag: FIC-102, service: "Fresh CO2 flow to the cathode feed (FV-102)", sheet: P-01, notes: "loop FIC-102, the slave of FIC-104 (cascade, D-062); specified in mass units (kg/h, control/loops.yaml); a thermal mass flow controller states its gas and reference conditions on its datasheet (D-052); FV-102 sized for the start-up purge's total feed (about 3.3 kg/h) as well as the 0.36 kg/h make-up"}
  - {tag: FIC-104, service: "Total cathode CO2 feed (fresh and PSA recycle) on CO2-101 downstream of the recycle tee, upstream of the humidification water", sheet: P-01, notes: "loop FIC-104, the master of FIC-102 (D-062); mass units, as FIC-102; low-low flow trip, see C&E I-115"}
  - {tag: FI-103, service: "Humidification water to the cathode feed (local rotameter)", sheet: P-01, notes: "set by hand with HV-104"}
  - {tag: PIC-121, service: "Cathode back-pressure upstream of K-131 (PV-121)", sheet: P-01, notes: "loop PIC-121"}
  - {tag: LIC-122, service: "Condensate level in V-121 (LV-122)", sheet: P-01, notes: "loop LIC-122"}
  - {tag: PIC-131, service: "CO product pressure at the battery limit (PV-131)", sheet: P-01, notes: "loop PIC-131"}
  - {tag: TSHH-133, service: "Temperature high-high on the unprotected side of the tail-gas detonation arrester FA-133 (TG-101), trips XV-133", sheet: P-01, notes: "burning-time protection: a flame held on the arrester element closes XV-133 within the arrester's certified burning time (vendor); see C&E I-109; Ex ia IIC T4 Ga (D-051, D-054)"}
  - {tag: AI-101, service: "Anolyte pH in T-101 (probe, activity basis)", sheet: P-01, notes: "alarm AAL; end-of-run trip, see C&E I-101"}
  - {tag: LIA-101, service: "Anolyte level in T-101", sheet: P-01, notes: "alarms LAL, LAH (the working volume reached, 1,176 L at 1,000 h) and LAHH (90 % of the tank, ASSUMED) with a horn and beacon at the fill connection, so that the operator at HV-102 stops the delivery (D-061); low-low trip, see C&E I-102"}
  - {tag: PIA-113, service: "Anolyte pressure at the stack inlet (AN-103)", sheet: P-01, notes: "alarms PAH, PAL; with PIA-123 the pressure difference across the membrane, alarm and trip outside the window, see C&E I-117 (window ASSUMED, the stack vendor's, D-061); Ex ia IIC T4 Ga"}
  - {tag: AIA-114, service: "H2 (and CO) in the anode O2 at the reservoir vent O2V-101 (the T-101 head space gas)", sheet: P-01, notes: "analyser for an O2-rich sample (vendor); alarm AH at 0.4 vol% H2 (10 % of the lower flammability limit of H2 in O2, about 4 vol%), trip AHH at 1.0 vol% (25 %), both ASSUMED for the team, see C&E I-116 (D-061); its sample point and response time are the vendor's"}
  - {tag: EIA-105A, service: "Stack E-101A voltage (on the DC bus at U-101)", sheet: P-01, notes: "alarm on a deviation from the mean of the four stacks (0.3 V, ASSUMED) and on high voltage (D-063)"}
  - {tag: EIA-105B, service: "Stack E-101B voltage (on the DC bus at U-101)", sheet: P-01, notes: "as EIA-105A"}
  - {tag: EIA-105C, service: "Stack E-101C voltage (on the DC bus at U-101)", sheet: P-01, notes: "as EIA-105A"}
  - {tag: EIA-105D, service: "Stack E-101D voltage (on the DC bus at U-101)", sheet: P-01, notes: "as EIA-105A"}
  - {tag: IIA-106A, service: "Stack E-101A current (DC current sensor on its cable at U-101)", sheet: P-01, notes: "alarm on a share outside 20 A plus or minus 10 % (ASSUMED); high-high 24 A (120 %, ASSUMED) trips U-101, see C&E I-120 (D-063); outside the zone"}
  - {tag: IIA-106B, service: "Stack E-101B current (DC current sensor on its cable at U-101)", sheet: P-01, notes: "as IIA-106A"}
  - {tag: IIA-106C, service: "Stack E-101C current (DC current sensor on its cable at U-101)", sheet: P-01, notes: "as IIA-106A"}
  - {tag: IIA-106D, service: "Stack E-101D current (DC current sensor on its cable at U-101)", sheet: P-01, notes: "as IIA-106A"}
  - {tag: PIA-123, service: "Cathode gas pressure at the stack outlet (CG-101), independent of PIC-121", sheet: P-01, notes: "alarm PAH; high-high trip, see C&E I-111 (D-060); with PIA-113 the membrane's pressure difference (I-117)"}
  - {tag: LIA-124, service: "Condensate level in V-121, independent of LIC-122 (its own connection N5)", sheet: P-01, notes: "low-low closes XV-125 (C&E I-118), high-high stops K-131 (C&E I-119) (D-061)"}
  - {tag: PIA-132, service: "K-131 discharge pressure (CG-103)", sheet: P-01, notes: "alarm PAH; high-high stops K-131 below PSE-132's bursting pressure, see C&E I-112 (D-060); shows the depressurisation of CG-103 and X-131 at a stop (D-061)"}
  - {tag: PSLL-151, service: "Instrument air pressure low-low at the Skid A air header (not drawn)", sheet: P-01, notes: "trips U-101 and stops K-131, see C&E I-114 (D-060); the air header and its supply are the site's"}
  - {tag: AIA-141, service: "CO detector at the Skid A gas train (open skid, D-050)", sheet: P-01, notes: "ASSUMED location at the compressor and PSA; certified for gas group IIC (D-051); see C&E I-103"}
  - {tag: AIA-142, service: "H2 detector at Skid A (open skid, D-050)", sheet: P-01, notes: "ASSUMED location high over the stack row and the PSA; certified for gas group IIC (D-051); see C&E I-104"}
  # -- Skid B (P-02) ----------------------------------------------------------------------
  - {tag: FIC-201, service: "Anolyte recirculation flow to the stacks (P-201 speed)", sheet: P-02, notes: "loop FIC-201; low-low flow trip, see C&E I-206"}
  - {tag: TIC-211, service: "Anolyte temperature at the stack inlet (tempered water to E-211, TV-211)", sheet: P-02, notes: "loop TIC-211, its action switched with the unit's mode as TIC-111 (D-062); low-temperature alarm TAL, as TIC-111"}
  - {tag: TSHH-212, service: "Anolyte temperature at the stack outlet, high-high", sheet: P-02, notes: "see C&E I-205"}
  - {tag: JIC-201, service: "Stack current at the rectifier U-201", sheet: P-02, notes: "loop JIC-201; current off stops the dosing and the bleed, see C&E I-207"}
  - {tag: FIC-202, service: "Fresh CO2 flow to the cathode feed (FV-202)", sheet: P-02, notes: "loop FIC-202, the slave of FIC-204 (cascade, D-062); specified in mass units (kg/h), as FIC-102 (D-052)"}
  - {tag: FIC-204, service: "Total cathode CO2 feed (fresh and PSA recycle) on CO2-201 downstream of the recycle tee", sheet: P-02, notes: "as FIC-104; low-low flow trip, see C&E I-215"}
  - {tag: FI-203, service: "Humidification water to the cathode feed (local rotameter)", sheet: P-02, notes: "set by hand with HV-204"}
  - {tag: PIC-221, service: "Cathode back-pressure upstream of K-231 (PV-221)", sheet: P-02, notes: "loop PIC-221"}
  - {tag: LIC-222, service: "Condensate level in V-221 (LV-222)", sheet: P-02, notes: "loop LIC-222"}
  - {tag: PIC-231, service: "CO product pressure at the battery limit (PV-231)", sheet: P-02, notes: "loop PIC-231"}
  - {tag: TSHH-233, service: "Temperature high-high on the unprotected side of the tail-gas detonation arrester FA-233 (TG-201), trips XV-233", sheet: P-02, notes: "as TSHH-133; see C&E I-209"}
  - {tag: AIC-201, service: "Anolyte pH in T-201 (probe, activity basis), trims the P-202 dose", sheet: P-02, notes: "loop AIC-201; alarm AAL; low-low pH trip, see C&E I-201"}
  - {tag: LIC-201, service: "Anolyte level in T-201 (make-up water, LV-201)", sheet: P-02, notes: "loop LIC-201"}
  - {tag: LIA-202, service: "Anolyte level in T-201, independent of LIC-201", sheet: P-02, notes: "alarms LAL, LAH; low-low trip, see C&E I-202; high-high (90 % of the tank, ASSUMED) closes the make-up LV-201, see C&E I-221, and sounds at the fill connection (D-061)"}
  - {tag: LIA-203, service: "5 M KOH level in the day tank T-202", sheet: P-02, notes: "alarms LAL: refill (weekly, ASSUMED), LAH and LAHH (90 %, ASSUMED) with a horn and beacon at the refill connection HV-205 (D-061); low-low stops P-202, see C&E I-208"}
  - {tag: PIA-213, service: "Anolyte pressure at the stack inlet (AN-203)", sheet: P-02, notes: "as PIA-113; see C&E I-217"}
  - {tag: AIA-214, service: "H2 (and CO) in the anode O2 at the reservoir vent O2V-201 (the T-201 head space gas)", sheet: P-02, notes: "as AIA-114; see C&E I-216"}
  - {tag: EIA-205A, service: "Stack E-201A voltage (on the DC bus at U-201)", sheet: P-02, notes: "as EIA-105A"}
  - {tag: EIA-205B, service: "Stack E-201B voltage (on the DC bus at U-201)", sheet: P-02, notes: "as EIA-105A"}
  - {tag: EIA-205C, service: "Stack E-201C voltage (on the DC bus at U-201)", sheet: P-02, notes: "as EIA-105A"}
  - {tag: EIA-205D, service: "Stack E-201D voltage (on the DC bus at U-201)", sheet: P-02, notes: "as EIA-105A"}
  - {tag: IIA-206A, service: "Stack E-201A current (DC current sensor on its cable at U-201)", sheet: P-02, notes: "as IIA-106A; see C&E I-220"}
  - {tag: IIA-206B, service: "Stack E-201B current (DC current sensor on its cable at U-201)", sheet: P-02, notes: "as IIA-206A"}
  - {tag: IIA-206C, service: "Stack E-201C current (DC current sensor on its cable at U-201)", sheet: P-02, notes: "as IIA-206A"}
  - {tag: IIA-206D, service: "Stack E-201D current (DC current sensor on its cable at U-201)", sheet: P-02, notes: "as IIA-206A"}
  - {tag: PIA-223, service: "Cathode gas pressure at the stack outlet (CG-201), independent of PIC-221", sheet: P-02, notes: "as PIA-123; see C&E I-211, I-217"}
  - {tag: LIA-224, service: "Condensate level in V-221, independent of LIC-222 (its own connection N5)", sheet: P-02, notes: "as LIA-124; see C&E I-218, I-219"}
  - {tag: PIA-232, service: "K-231 discharge pressure (CG-203)", sheet: P-02, notes: "as PIA-132; see C&E I-212"}
  - {tag: PSLL-251, service: "Instrument air pressure low-low at the Skid B air header (not drawn)", sheet: P-02, notes: "as PSLL-151; see C&E I-214"}
  - {tag: FIC-203, service: "Anolyte bleed flow (FV-203)", sheet: P-02, notes: "loop FIC-203; closed with the current off, see C&E I-207"}
  - {tag: AIA-241, service: "CO detector at the Skid B gas train (open skid, D-050)", sheet: P-02, notes: "ASSUMED location at the compressor and PSA; certified for gas group IIC (D-051); see C&E I-203"}
  - {tag: AIA-242, service: "H2 detector at Skid B (open skid, D-050)", sheet: P-02, notes: "ASSUMED location high over the stack row and the PSA; certified for gas group IIC (D-051); see C&E I-204"}
