# Control loop register: the regulatory loops. Schema: `cheme schema loops`.
# PROPOSED control intent, not approved for implementation; the review status comes from reviews/.
# Trips are not loops: they go in control/cause-effect.yaml, which `interlocks` refers to.
# Conventions (action, fail, travel, split range) and the checks: skill control-loops.
#
# The two pilot skids of #330 (DESIGN.md D-007, D-018): the 1xx loops run Skid A (case skid-a,
# sheet P-01), the 2xx loops Skid B (case skid-b, sheet P-02); each skid has the same loops,
# Skid B adds the pH trim of the dosing (AIC-201), the bleed (FIC-203) and the make-up on level
# (LIC-201). Setpoints that are a stream value of the case name it (`stream:`), so validate
# keeps them in step with process/flowsheet.yaml; scripts/regen.py (step 9) writes their values
# from the flowsheet, the stack currents (JIC-x01) from `cheme process stack` and the AIC-201
# pH setpoint from D-B, so a calculated setpoint is never a hand copy. The pH is measured on an activity basis; the
# duty model's pH is concentration-basis (control/philosophy.md): the pH values here are the
# model's and need the probe offset before use (open, `unresolved`). Fail positions and
# actions are proposals for the HAZOP (D-018).
schema: cheme/loops/v1
loops:
  # -- Skid A (P-01) ----------------------------------------------------------------------
  - id: FIC-101
    title: Skid A anolyte recirculation
    purpose: Hold the anolyte flow through the four stacks at the duty's flow per area.
    cases: [skid-a]
    variable: flow
    measurement: [{tag: FIC-101}]
    controller: FIC-101
    action: reverse
    final_elements:
      - {tag: P-101, kind: drive, actuator: electric, fail: stop}
    targets:
      - {kind: setpoint, value: 705.6, unit: kg/h, provenance: assumed, source: "process/cells.yaml STK-A recirculation_pump: 4 mL/(min cm2) (bench ratio, ASSUMED) at 1050 kg/m3 (cheme process stack)", cases: [skid-a], stream: S113, property: flow}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: FIC-101, condition: FAL, response: "check P-101 and the stack inlet manifold; the low-low flow trip I-106 stops the current"}
    interlocks: [I-106]
    rationale: "Speed control of the recirculation pump: most of the head is the stacks' pressure drop, so a speed drive saves the throttling valve (skill control-loops). The flow sets the anolyte residence time in the stacks and removes the O2."
    unresolved: ["the anolyte flow per area and the stack pressure drop are ASSUMED (no stack vendor)"]
  - id: TIC-111
    title: Skid A anolyte temperature at the stack inlet
    purpose: Hold the anolyte entering the stacks so that the stacks run at the 25 degC of the measured series.
    cases: [skid-a]
    variable: temperature
    measurement: [{tag: TIC-111}]
    controller: TIC-111
    action: direct
    final_elements:
      - {tag: TV-111, kind: valve, actuator: pneumatic, fail: open}
    targets:
      - {kind: setpoint, value: 295.2737589, unit: K, provenance: assumed, source: "process/flowsheet.yaml S114 (scripts/regen.py step 9): the cell temperature less the stack heat over the loop flow (scripts/skid_balance.py, cp ASSUMED, D-012)", cases: [skid-a], stream: S114, property: temperature}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: TIC-111, condition: TAH, response: "check the tempered-water unit and TV-111; the stack outlet high-high trip I-105 stops the current"}
      - {tag: TIC-111, condition: TAL, response: "the anolyte is cooling below the measured series' 25 degC (outdoors, idle or at start-up): check that the tempered-water unit is in its heating mode (TIC-111 then reverse acting) and supplying; on the idle skid keep P-101 circulating or drain the loop (SEQ-A-DRAIN) before it can freeze (D-052)"}
    interlocks: [I-105]
    rationale: "Sensor on the outlet of the target stream, valve on the utility (skill control-loops). The cooler removes the stack heat (about 2.2 kW, cheme process stack); the duty model is isothermal by assumption. The utility is a tempered-water unit off the skid, outside the zone, that heats and cools (D-052): in operation it cools at its own supply temperature (the flowsheet's 20 degC cooling water, ASSUMED), at start-up and when the skid stands idle it heats, so that the open skid outdoors holds 25 degC and does not freeze. The action follows the unit's mode (review 2026-11-06-design #5, D-062): direct in cooling (a warmer anolyte opens TV-111), reversed in heating (a colder anolyte opens TV-111), switched by the unit's heating/cooling mode signal, never by hand alone; the action given here is the cooling mode's. The fail-open TV-111 is safe in both: in cooling it gives full cooling with the current tripped by TSHH-112 if needed, in heating it brings the loop to the unit's supply temperature, which the unit limits to 30 degC (ASSUMED; its own high-temperature cut-out), below the 40 degC design of the PP tanks and the 50 degC of the stacks (D-060). The stack outlet's 25 degC is held through the inlet setpoint at the duty's stack heat; TSHH-112 measures the outlet."
    unresolved: ["the tempered-water unit's duty, its supply temperature control, its 30 degC heating limit and its frost-protection mode (vendor, D-052, D-062)"]
  - id: JIC-101
    title: Skid A stack current
    purpose: Hold the bus current of the four stacks at the duty's current density.
    cases: [skid-a]
    variable: other
    measurement: [{tag: JIC-101}]
    controller: JIC-101
    action: reverse
    final_elements:
      - {tag: U-101, kind: other, actuator: electric, fail: off}
    targets:
      - {kind: setpoint, value: 80, unit: A, provenance: calculated, source: "cheme process stack STK-A bus_current_a, written by scripts/regen.py step 9 (the stacks in parallel at 200 mA/cm2 on 100 cm2)", cases: [skid-a]}
    modes: [manual, auto]
    normal_mode: auto
    interlocks: [I-101, I-102, I-103, I-104, I-105, I-106, I-109, I-110, I-111, I-112, I-113, I-114, I-115, I-116, I-117, I-119, I-120]
    rationale: "The current sets the CO rate (Faraday); the rectifier runs constant current, its voltage follows the stacks (37.6 V at the measured point). The four stacks share the bus by their resistance: each stack's voltage EIA-105A to D and current IIA-106A to D are measured and alarmed on a deviation, and a stack's current high-high trips U-101 (I-120, D-063)."
    operator: "Ramp the current up only with the permissives of SEQ-A-START met; end the campaign at H with SEQ-A-STOP."
    notes: "J: the electrical quantity at the rectifier output, as the spec of #330 names it."
  - id: FIC-104
    title: Skid A total cathode CO2 feed
    purpose: Hold the total CO2 to the cathodes (fresh and PSA recycle) at the 10 sccm/cm2 the FE was measured at, by resetting the fresh CO2's setpoint.
    cases: [skid-a]
    variable: flow
    measurement: [{tag: FIC-104}]
    controller: FIC-104
    action: reverse
    targets:
      - {kind: setpoint, value: 3.298617849, unit: kg/h, provenance: calculated, source: "process/flowsheet.yaml S101 plus S103 (the fresh CO2 and the PSA recycle, the cathode feed of design basis co2_feed_per_area at 10 sccm/cm2), written by scripts/regen.py step 9", cases: [skid-a]}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: FIC-104, condition: FAL, response: "check the PSA recycle (XV-134, X-131) and the CO2 supply; the low-low I-115 trips the current"}
    interlocks: [I-115]
    rationale: "Review 2026-11-06-design #8 (D-062): FIC-102 sees only the 11 % of the cathode CO2 that is fresh; the performance and the sizing rest on the total. The flow element on CO2-101 downstream of the recycle tee and upstream of the humidification water measures the dry total; the start-up purge is set on it. Its output is the setpoint of FIC-102 (the cascade link is on the slave): the fresh CO2 makes up what the recycle does not return, from about 0.36 kg/h in operation to the whole 3.3 kg/h in the start-up purge with the PSA not yet recycling."
    unresolved: ["the PSA's own recycle control and how it shares the loop's CO2 inventory with the make-up (vendor)"]
  - id: FIC-102
    title: Skid A fresh CO2 feed
    purpose: Feed the fresh CO2 that, with the PSA recycle, gives the cathode its 10 sccm/cm2.
    cases: [skid-a]
    variable: flow
    measurement: [{tag: FIC-102}]
    controller: FIC-102
    action: reverse
    final_elements:
      - {tag: FV-102, kind: valve, actuator: pneumatic, fail: closed}
    targets:
      - {kind: setpoint, value: 0.3563130156, unit: kg/h, provenance: assumed, source: "process/flowsheet.yaml S101 (scripts/skid_balance.py: the cathode feed less the PSA recycle)", cases: [skid-a], stream: S101, property: flow}
    modes: [manual, auto, cascade]
    normal_mode: cascade
    links:
      - {type: cascade, loop: FIC-104, notes: "the slave of the total feed FIC-104 (D-062); in auto on its own setpoint only for tests"}
    alarms:
      - {tag: FIC-102, condition: FAL, response: "check the CO2 supply; without CO2 the stacks make H2 only: the total feed low-low I-115 trips the current"}
    interlocks: [I-103, I-104, I-109, I-110, I-111, I-112, I-113, I-119]
    rationale: "The flow element upstream of its valve on the fresh CO2, the slave of the total cathode feed FIC-104 (D-062): the measured FE holds at 10 sccm/cm2 of the total (D-012). FV-102 is sized for the start-up purge's whole feed as well as the make-up."
  - id: PIC-121
    title: Skid A cathode back-pressure
    purpose: Hold the cathode outlet pressure upstream of the compressor.
    cases: [skid-a]
    variable: pressure
    measurement: [{tag: PIC-121}]
    controller: PIC-121
    # back-pressure: a rising cathode pressure opens PV-121 (output rises with the measurement)
    action: direct
    final_elements:
      - {tag: PV-121, kind: valve, actuator: pneumatic, fail: open}
    targets:
      - {kind: setpoint, value: 110, unit: kPa(a), provenance: assumed, source: "process/flowsheet.yaml S106 (ASSUMED design condition, D-012)", cases: [skid-a], stream: S106, property: pressure}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: PIC-121, condition: PAH, response: "check K-131 and PV-121; the membrane's pressure difference is limited (vendor): the independent PIA-116 and PIA-123 high-high (I-111) and the pressure difference at each end of the stacks, PIA-113 to PIA-116 and PIA-115 to PIA-123 (I-117, D-067), trip the current"}
    rationale: "Back-pressure control (sensor upstream of the valve). Fail open (corrected after review 2026-11-06-design #2, D-060): with K-131 running on a loss of air, an open PV-121 keeps the cathode connected to the compressor's suction, so the cathode is not shut in against the stacks' own gas; with K-131 stopped it relieves nothing, since it is upstream of a stopped positive-displacement compressor: then the cathode is protected by the current trip on K-131 not running (I-113) and on air loss (I-114), the cathode pressure high-high I-111 and the bursting disc PSE-101 on the feed header."
    unresolved: ["the allowed cathode-anode pressure difference of the stack (vendor, #332)", "the suction control of K-131 (recycle or speed) is the package's"]
  - id: LIC-122
    title: Skid A cathode condensate level
    purpose: Drain the carbonate condensate from V-121 without blowing gas through to the effluent.
    cases: [skid-a]
    variable: level
    measurement: [{tag: LIC-122}]
    controller: LIC-122
    action: direct
    final_elements:
      - {tag: LV-122, kind: valve, actuator: pneumatic, fail: closed}
    targets:
      - {kind: setpoint, value: 50, unit: "%", provenance: assumed, source: "ASSUMED mid-range level, D-018"}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: LIC-122, condition: LAH, response: "check LV-122 and the condensate line; liquid must not reach K-131: the independent LIA-124 high-high stops K-131 (I-119)"}
      - {tag: LIC-122, condition: LAL, response: "check LV-122; the independent LIA-124 low-low closes XV-125 against gas blow-by (I-118)"}
    interlocks: [I-118, I-119]
    rationale: "The fail-closed drain keeps CO out of the condensate line; the independent level LIA-124 with the tight shut-off XV-125 and the stop of K-131 are the protection, not this loop (D-061). The condensate goes to a vented collection."
  - id: PIC-131
    title: Skid A CO product pressure
    purpose: Hold the CO product at the boundary pressure of the design basis.
    cases: [skid-a]
    variable: pressure
    measurement: [{tag: PIC-131}]
    controller: PIC-131
    action: direct
    final_elements:
      - {tag: PV-131, kind: valve, actuator: pneumatic, fail: closed}
    targets:
      - {kind: setpoint, value: 500, unit: kPa(a), provenance: assumed, source: "process/flowsheet.yaml S108 (process/design-basis.yaml capacity.pilot_skid, ASSUMED)", cases: [skid-a], stream: S108, property: pressure}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: PIC-131, condition: PAL, response: "check X-131; product below the boundary pressure"}
    rationale: "Back-pressure control of the PSA product (sensor upstream of the valve)."
    unresolved: ["fail position of PV-131 against the PSA package's own pressure protection (vendor): closed proposed"]
  - id: AI-101
    title: Skid A anolyte pH
    purpose: Show the anolyte pH against the end-of-campaign threshold.
    cases: [skid-a]
    variable: other
    measurement: [{tag: AI-101}]
    targets:
      - {kind: low, value: 12.5, unit: pH, provenance: assumed, source: "ASSUMED notice ahead of the pH 12.2 trip (D-058), concentration basis: about 19 h before H and the trip, 28 h before the pH 12 criterion (D-003), at the measured WDE (D-018)", cases: [skid-a]}
    modes: [manual]
    normal_mode: manual
    alarms:
      - {tag: AI-101, condition: AAL, response: "the campaign approaches its trip value: plan the end of run at H (SEQ-A-STOP, then SEQ-A-DRAIN); the low-low pH trip I-101 stops the current at pH 12.2, 0.2 above the criterion"}
    interlocks: [I-101]
    rationale: "Skid A has no dosing: nothing is manipulated on pH, the end of the run is the operator's (D-009). The duty runs to the trip value pH 12.2 and T-101 is sized to it (D-058); the criterion pH 12 is the design criterion, not a corrosion limit (D-003)."
    unresolved: ["indication with an alarm only: no controller action and no final element, since Skid A has nothing to manipulate on pH (D-009)", "probe (activity) pH against the model's concentration-basis pH: offset or calibration before the alarm and trip values are set"]
  # -- Skid B (P-02) ----------------------------------------------------------------------
  - id: FIC-201
    title: Skid B anolyte recirculation
    purpose: Hold the anolyte flow through the four stacks at the duty's flow per area.
    cases: [skid-b]
    variable: flow
    measurement: [{tag: FIC-201}]
    controller: FIC-201
    action: reverse
    final_elements:
      - {tag: P-201, kind: drive, actuator: electric, fail: stop}
    targets:
      - {kind: setpoint, value: 705.6, unit: kg/h, provenance: assumed, source: "process/cells.yaml STK-B recirculation_pump: 4 mL/(min cm2) (bench ratio, ASSUMED) at 1050 kg/m3 (cheme process stack)", cases: [skid-b], stream: S213, property: flow}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: FIC-201, condition: FAL, response: "check P-201 and the stack inlet manifold; the low-low flow trip I-206 stops the current"}
    interlocks: [I-206]
    rationale: "As FIC-101."
    unresolved: ["the anolyte flow per area and the stack pressure drop are ASSUMED (no stack vendor)"]
  - id: TIC-211
    title: Skid B anolyte temperature at the stack inlet
    purpose: Hold the anolyte entering the stacks so that the stacks run at the 25 degC of the measured series.
    cases: [skid-b]
    variable: temperature
    measurement: [{tag: TIC-211}]
    controller: TIC-211
    action: direct
    final_elements:
      - {tag: TV-211, kind: valve, actuator: pneumatic, fail: open}
    targets:
      - {kind: setpoint, value: 295.2737589, unit: K, provenance: assumed, source: "process/flowsheet.yaml S214 (scripts/regen.py step 9): the cell temperature less the stack heat over the loop flow (scripts/skid_balance.py, cp ASSUMED, D-012)", cases: [skid-b], stream: S214, property: temperature}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: TIC-211, condition: TAH, response: "check the tempered-water unit and TV-211; the stack outlet high-high trip I-205 stops the current"}
      - {tag: TIC-211, condition: TAL, response: "as TIC-111: tempered-water unit in its heating mode (TIC-211 reverse acting), P-201 circulating or the loop drained (SEQ-B-DRAIN) before it can freeze (D-052)"}
    interlocks: [I-205]
    rationale: "As TIC-111: the action follows the tempered-water unit's heating or cooling mode, the action given is the cooling mode's; fail open is safe in both modes with the unit's 30 degC heating limit (D-062)."
    unresolved: ["the tempered-water unit's duty, its supply temperature control, its 30 degC heating limit and its frost-protection mode (vendor, D-052, D-062)"]
  - id: JIC-201
    title: Skid B stack current
    purpose: Hold the bus current of the four stacks at the duty's current density.
    cases: [skid-b]
    variable: other
    measurement: [{tag: JIC-201}]
    controller: JIC-201
    action: reverse
    final_elements:
      - {tag: U-201, kind: other, actuator: electric, fail: off}
    targets:
      - {kind: setpoint, value: 80, unit: A, provenance: calculated, source: "cheme process stack STK-B bus_current_a, written by scripts/regen.py step 9 (the stacks in parallel at 200 mA/cm2 on 100 cm2)", cases: [skid-b]}
    modes: [manual, auto]
    normal_mode: auto
    interlocks: [I-201, I-202, I-203, I-204, I-205, I-206, I-207, I-209, I-210, I-211, I-212, I-213, I-214, I-215, I-216, I-217, I-219, I-220]
    rationale: "As JIC-101 (each stack's voltage EIA-205A to D and current IIA-206A to D, I-220). Its current-off signal stops the dosing and the bleed (I-207): the model doses and bleeds only while the current is on (D-010)."
    notes: "J: the electrical quantity at the rectifier output, as the spec of #330 names it."
  - id: FIC-204
    title: Skid B total cathode CO2 feed
    purpose: Hold the total CO2 to the cathodes (fresh and PSA recycle) at 10 sccm/cm2, by resetting the fresh CO2's setpoint.
    cases: [skid-b]
    variable: flow
    measurement: [{tag: FIC-204}]
    controller: FIC-204
    action: reverse
    targets:
      - {kind: setpoint, value: 3.298617849, unit: kg/h, provenance: calculated, source: "process/flowsheet.yaml S201 plus S203 (the fresh CO2 and the PSA recycle), written by scripts/regen.py step 9", cases: [skid-b]}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: FIC-204, condition: FAL, response: "check the PSA recycle (XV-234, X-231) and the CO2 supply; the low-low I-215 trips the current"}
    interlocks: [I-215]
    rationale: "As FIC-104 (D-062): its output is FIC-202's setpoint."
    unresolved: ["the PSA's own recycle control (vendor)"]
  - id: FIC-202
    title: Skid B fresh CO2 feed
    purpose: Feed the fresh CO2 that, with the PSA recycle, gives the cathode its 10 sccm/cm2.
    cases: [skid-b]
    variable: flow
    measurement: [{tag: FIC-202}]
    controller: FIC-202
    action: reverse
    final_elements:
      - {tag: FV-202, kind: valve, actuator: pneumatic, fail: closed}
    targets:
      - {kind: setpoint, value: 0.3563130156, unit: kg/h, provenance: assumed, source: "process/flowsheet.yaml S201 (scripts/skid_balance.py: the cathode feed less the PSA recycle)", cases: [skid-b], stream: S201, property: flow}
    modes: [manual, auto, cascade]
    normal_mode: cascade
    links:
      - {type: cascade, loop: FIC-204, notes: "the slave of the total feed FIC-204 (D-062)"}
    alarms:
      - {tag: FIC-202, condition: FAL, response: "check the CO2 supply; without CO2 the stacks make H2 only: the total feed low-low I-215 trips the current"}
    interlocks: [I-203, I-204, I-209, I-210, I-211, I-212, I-213, I-219]
    rationale: "As FIC-102."
  - id: PIC-221
    title: Skid B cathode back-pressure
    purpose: Hold the cathode outlet pressure upstream of the compressor.
    cases: [skid-b]
    variable: pressure
    measurement: [{tag: PIC-221}]
    controller: PIC-221
    # back-pressure: a rising cathode pressure opens PV-221 (output rises with the measurement)
    action: direct
    final_elements:
      - {tag: PV-221, kind: valve, actuator: pneumatic, fail: open}
    targets:
      - {kind: setpoint, value: 110, unit: kPa(a), provenance: assumed, source: "process/flowsheet.yaml S206 (ASSUMED design condition, D-012)", cases: [skid-b], stream: S206, property: pressure}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: PIC-221, condition: PAH, response: "check K-231 and PV-221; PIA-223's high-high (I-211) and the pressure difference PIA-213 to PIA-223 (I-217) trip the current"}
    rationale: "As PIC-121 (the corrected fail-open rationale, D-060)."
    unresolved: ["the allowed cathode-anode pressure difference of the stack (vendor, #332)", "the suction control of K-231 (recycle or speed) is the package's"]
  - id: LIC-222
    title: Skid B cathode condensate level
    purpose: Drain the carbonate condensate from V-221 without blowing gas through to the effluent.
    cases: [skid-b]
    variable: level
    measurement: [{tag: LIC-222}]
    controller: LIC-222
    action: direct
    final_elements:
      - {tag: LV-222, kind: valve, actuator: pneumatic, fail: closed}
    targets:
      - {kind: setpoint, value: 50, unit: "%", provenance: assumed, source: "ASSUMED mid-range level, D-018"}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: LIC-222, condition: LAH, response: "check LV-222 and the condensate line; liquid must not reach K-231: the independent LIA-224 high-high stops K-231 (I-219)"}
      - {tag: LIC-222, condition: LAL, response: "check LV-222; the independent LIA-224 low-low closes XV-225 (I-218)"}
    interlocks: [I-218, I-219]
    rationale: "As LIC-122 (D-061)."
  - id: PIC-231
    title: Skid B CO product pressure
    purpose: Hold the CO product at the boundary pressure of the design basis.
    cases: [skid-b]
    variable: pressure
    measurement: [{tag: PIC-231}]
    controller: PIC-231
    action: direct
    final_elements:
      - {tag: PV-231, kind: valve, actuator: pneumatic, fail: closed}
    targets:
      - {kind: setpoint, value: 500, unit: kPa(a), provenance: assumed, source: "process/flowsheet.yaml S208 (process/design-basis.yaml capacity.pilot_skid, ASSUMED)", cases: [skid-b], stream: S208, property: pressure}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: PIC-231, condition: PAL, response: "check X-231; product below the boundary pressure"}
    rationale: "As PIC-131."
    unresolved: ["fail position of PV-231 against the PSA package's own pressure protection (vendor): closed proposed"]
  - id: AIC-201
    title: Skid B anolyte pH trim of the KOH dose
    purpose: Trim the 5 M KOH dose of P-202 around the duty's continuous rate so that the anolyte stays at the hydroxide setpoint.
    cases: [skid-b]
    variable: other
    measurement: [{tag: AIC-201}]
    controller: AIC-201
    action: reverse
    final_elements:
      - {tag: P-202, kind: drive, actuator: electric, fail: stop}
    targets:
      - {kind: setpoint, value: 13.7, unit: pH, provenance: calculated, source: "duty D-B's pH at H at the ASSUMED setpoints of process/design-basis.yaml skid_b_setpoints, to 2 decimals, written by scripts/regen.py step 9 (concentration basis)", cases: [skid-b]}
      - {kind: low, value: 13.5, unit: pH, provenance: assumed, source: "ASSUMED alarm margin below the setpoint, concentration basis", cases: [skid-b]}
    modes: [manual, auto]
    normal_mode: auto
    links:
      - {type: feedforward, tag: JIC-201, notes: "the dose base rate is the duty's (process/duties.yaml D-B, about 0.42 L/h of 5 M at 80 A): it scales with the current; AIC-201 trims it"}
    alarms:
      - {tag: AIC-201, condition: AAL, response: "check P-202, the day tank T-202 and the probe; the low-low pH trip I-201 stops the current"}
    interlocks: [I-201, I-207, I-208]
    rationale: "A pH trim of a feedforward dose: the dosing is continuous in the model (no threshold dosing, D-010), and the trim corrects the drift of WDE and co-ion crossover the model holds constant. The trim is not simulated (design-risks: open-loop dosing in the model)."
    unresolved: ["probe (activity) pH against the model's concentration-basis pH: offset or calibration before the setpoint is set", "the trim range of P-202 (stroke or speed) around the base rate"]
  - id: FIC-203
    title: Skid B anolyte bleed
    purpose: Bleed the anolyte at the steady-state rate that carries out the carbon the membrane lets in.
    cases: [skid-b]
    variable: flow
    measurement: [{tag: FIC-203}]
    controller: FIC-203
    action: reverse
    final_elements:
