  temperature protection hold it, H01-A503; the flowsheet''s 40 degC is after the package''s cooling,
  D-060); Ex (inside Z-HAZ-x, D-051): motor II 2G Ex db eb IIC T3 Gb (Ex eb acceptable), non-electrical
