notes: 'design 7.0 bar(g) (ASSUMED: the 6 bar(a) discharge with margin) and 150 degC; a hydraulically
  driven diaphragm compressor whose own hydraulic relief limits the discharge to 6.5 bar(g) (specified,
  the vendor''s to confirm), with the discharge high-high at 5.8 bar(g) stopping it first (I-x12), so
  no relief device is drawn on its discharge; 150 degC with the diaphragm head cooled (an uncooled discharge
