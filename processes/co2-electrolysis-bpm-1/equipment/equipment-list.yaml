# Equipment list. Schema: `cheme schema equipment`.
# The two pilot skids of #330 (DESIGN.md D-007): train A (1xx tags, Skid A: one KOH fill per
# campaign, sheet P-01) and train B (2xx tags, Skid B: continuous KOH dosing and bleed, sheet
# P-02). The dimensions of the stacks (E-x01A to D), the reservoirs (T-101, T-201) and the dosing
# tank (T-202) are written by `cheme process stack --write` from process/cells.yaml and
# process/duties.yaml (their source starts "cheme process stack:"); never edit them by hand. Every
# item's dimensions.weight (t, empty) is written by scripts/regen.py step 21 from
# layout/lifting-basis.yaml (ASSUMED estimates, DESIGN.md D-043); change the basis, not the value. The
# gas conditioning (X-x31, X-x32) is a black-box package at the concept stage (D-012).
# `type` is the DEXPI class the P&ID draws: DEXPI 2.0.1 has no electrolyser and no package
# class, so the stacks, the packages and the rectifiers are ProcessEquipment (D-017).
# The skids are open and naturally ventilated (D-050): no enclosure and no extract fan (the
# fans K-141 and K-241 are deleted). The Ex marking of the items in the zones is decided in
# D-051 and stated in their notes (inside the screening zones Z-HAZ-A/B: motors II 2G Ex db eb
# IIC T3 Gb, at least 3G/Gc; no certification is claimed, the area classification is the
# competent person's). Every item has its design pressure and temperature (D-060, the design
# review 2026-11-06-design #10): ASSUMED for the purchase specification, each with its basis in
# its notes (the relief device or trip that bounds it, the shut-off head, the tempered water's
# heating limit); the vendors' ratings replace them.
