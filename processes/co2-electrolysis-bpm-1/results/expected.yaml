# Where the spec's hand values (design-spec_330 section 7) were re-derived from the measured
# P200 point and differ; the frozen value above is the re-derived one. Most spec values were
# rounded from WDE 0.967 (1 - WDE 0.033 instead of 0.03334, -1.0 %); the rest are rounding.
corrections:
  - "E1 area 0.2776 m2 -> 0.27795 m2 (28 cells either way)"
  - "E1 DC power 3.006 kW -> 3.0054 kW (28 x 5.36683 V x 20 A)"
  - "E1 CO formed 0.1121 kg/h -> 0.11193 kg/h, margin 0.9 % -> 0.74 %"
  - "E2 V_A at 1000 h 1154 L -> 1165.3 L exact (1166 L written); tank 1.443 m3 -> 1.4575 m3 (D 1.074 x H 1.611 m); at 10000 h 14.4 m3 -> 14.575 m3 (D 2.313 x H 3.470 m)"
  - "E2 the maximum duration in the 2.20 m envelope about 2580 h -> 2552 h"
  - "E2 rounding: core 1.5.0 reservoir.size: to_horizon writes 4 significant figures rounded up (1166 L, 11660 L), not ceil to 10 L; the ratio is 10 within rel 1e-3"
  - "E3 b 1.848 L/h -> 1.8667 L/h; dose 2.075 mol/h -> 2.0964 mol/h = 0.415 L/h -> 0.4193 L/h of 5 M; make-up 1.43 L/h -> 1.447 L/h; T-202 84 L -> 84.5 L"
  - "E4 Skid A 0.647 -> 0.649 kg/kg (per kg delivered by the arrangement; 0.654 per kg of the 0.100 kg/h duty); Skid B 1.16 -> 1.168 kg/kg; floor 0.577 -> 0.583 kg KOH/kg CO formed"
  - "E6 deficit ratio 1.48 -> 1.473 (within the spec's 5 %)"
