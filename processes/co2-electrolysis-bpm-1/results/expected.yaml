# Frozen hand expectations of the CO2 pilot skids (process-library#330), committed on their own
# before the first regeneration run (as ADR 0030 freezes tolerances): the regenerated results
# (scripts/regen.py at 1000 h and 10000 h) are compared with these values and tolerances by
# tests/test_co2_electrolysis_bpm_skids.py. The closed forms are tests/skid_formulas.py (no core,
# no regen import); tests/test_skid_formulas.py checks that they reproduce every value below from
# the measured series and core's ADR 0043 regression (322.30 h at 1 L, 1 A, WDE 0.95, Cx 0.66).
#
# Each expectation: `key` (the path in skid_formulas.hand_values()), `value`, `unit`, `formula`,
# `tolerance` for the regenerated result (`exact`, `rel` or `abs`; `direction` where only the sign
# of a difference is asserted), and `spec` where the design spec's rounded hand value was
# corrected when the values were re-derived from the measured point (see `corrections`). The run's
# values govern the figures in prose; these govern the test. The design inputs are ASSUMED (spec
# sections 2 to 4; their reasons go in the #330 decisions of DESIGN.md); a changed input needs a
# new frozen commit.
schema: process-library/skid-expectations/1
issue: 330
frozen: 2026-11-04
formulas: tests/skid_formulas.py
measurements:
  file: experiments/electrochemistry/rbpm-1m-koh.yaml
  sha256: dac88e65d553902ba60a61feea05ad73bd6a2f0889210624f954bf7adb2b3aff
  point: P200
  part_load_point: P100
  co_ion_split: "process/cells.yaml membrane.co_ion_crossover HCO3- 0.670 (the P200 titration mean 0.6698 rounded): the split the duties run with"
core: {version: 1.5.0, commit: a59e1a983348c98c6cee528d489fa030310876ff}

# The measured point P200 (means over the replicates; sd and n in skid_formulas.measured_point)
inputs:
  voltage_v: {key: inputs.voltage_v, value: 5.366833, unit: V, n: 3, sd: 0.1471}
  fe_co: {key: inputs.fe_co, value: 0.3825011, unit: "-", n: 2, sd: 0.0400}
  fe_h2: {key: inputs.fe_h2, value: 0.5600253, unit: "-", n: 2, sd: 0.0385}
  wde: {key: inputs.wde, value: 0.9666643, unit: "-", n: 3, sd: 0.00817}
  co_ion_carbon_fraction_measured: {key: inputs.co_ion_carbon_fraction_measured, value: 0.6697790, unit: "-", n: 3, sd: 0.0822}
  co_ion_carbon_fraction: {key: inputs.co_ion_carbon_fraction, value: 0.670, unit: "-", source: process/cells.yaml}
  charge_per_carbon_ph12:
    key: inputs.charge_per_carbon_ph12
    value: 1.979535
    unit: eq/mol
    formula: "g = (K1 h + 2 K1 K2) / (h^2 + K1 h + K1 K2), h = 1e-12, pK1 6.37, pK2 10.32"
  usable_hydroxide_mol_l:
    key: inputs.usable_hydroxide_mol_l
    value: 0.99
    unit: mol/L
    formula: "c0 - Kw / h + h at pH 12, c0 1 mol/L"

# The design inputs (ASSUMED, spec #330 sections 2 to 4)
design:
  co_delivered_kg_h: 0.100
  recovery: 0.90
  cell_area_cm2: 100
  cell_current_a: 20
  max_stack_voltage_v: 48
  rectifier_efficiency: 0.95
  envelope_per_cell_mm: {pitch: 8, end_plates: 120, frame_margin: 40}
  threshold_ph: 12
  koh_fill_mol_l: 1.0
  durations_h: [1000, 10000]
  reservoir: {margin: 0.25, aspect_ratio: 1.5}
  skid_envelope_m: {length: 6.06, width: 2.44, usable_height: 2.20}
  skid_b: {volume_l: 50, hydroxide_mol_l: 0.5, carbon_mol_l: 0.25, dose_mol_l: 5.0, dose_density_kg_l: 1.22}
  dosing_pump_margin: 0.5
  dosing_tank: {margin: 0.2, aspect_ratio: 1.2, refill_interval_h: 168}
  recirculation: {flow_per_area_ml_min_cm2: 4, density_kg_m3: 1050}
  on_off: {period_h: 24, duty_fraction: 0.5, start: "on"}
  part_load: {current_density_ma_cm2: [200, 100], step_h: [12, 12], interpolation: step}

# The 322.30 h regression of core ADR 0043 (asserted by tests/test_skid_formulas.py)
regression:
  formula: "t = V (c0 - [OH-] + [H+]) F / (N I (1 - WDE) ((1 - Cx) + Cx g)) at pH 12"
  cases:
    - {volume_l: 1, current_a: 1, wde: 0.95, cx: 0.66, c0_mol_l: 1, value_h: 322.30, tolerance: {abs: 0.005}}
    - {volume_l: 10, current_a: 1, wde: 0.95, cx: 0.66, c0_mol_l: 1, value_h: 3223.0, tolerance: {abs: 0.05}}

