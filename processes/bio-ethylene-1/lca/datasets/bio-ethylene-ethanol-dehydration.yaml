# Tier 1 form without a flowsheet, as ethylbenzene-1 (process-library#313, #317). Every amount is the formula
# of its parameters; core's validator re-checks each. Written from Arvidsson and Lundin (2011), facts in our own form.
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: bio-ethylene-ethanol-dehydration
title: Bio-ethylene by catalytic dehydration of ethanol (four-bed adiabatic, steam-diluted)
description: Per 1 t of polymer-grade ethylene, gate-to-gate, from bought hydrated bio-ethanol. Ethanol feed from a
  published simulation's ethanol and ethylene flows (its yield of 0.57 kg/kg), by-products from the stoichiometry of
  its conversion, selectivities and recovery; steam, fired heat, electricity and refrigeration from the same study
  (a stand-alone 200 kt/a plant).
basis: 1000 kg of ethylene
boundary: 'gate-to-gate: feed vaporisation, steam dilution, four adiabatic reactors with interheating, quench, compression,
  caustic wash, drying, C2 splitter and stripper; steam, fuel, power and refrigeration from outside'
technology: ethanol dehydration over alumina (SynDol type) in four adiabatic fixed beds in series at 450 degC inlet
  and 11.4 bar with steam dilution (Chematur / Halcon SD type), cryogenic purification; isothermal multitubular
  reactors are not modelled
geography:
  description: 'No single site: the energy figures are a Swedish case study''s (Stenungsund, 2011) of a stand-alone
    plant; industrial plants run in Brazil.'
classification:
  isic: '2011'
system_boundary:
  included:
  - ethanol (as ethanol) and its conversion by eight reactions to ethylene and by-products
  - dilution steam, fired heat from natural gas, electricity, refrigeration
  - firing of the C2-splitter bottoms in the reactor furnace (biogenic CO2 and water)
  - vented CO, CH4 and H2; caustic wash; effluent
  excluded:
  - 'TODO dehydration catalyst (alumina) make-up and its regeneration (coke burn-off): not quantified in the source'
  - 'TODO molecular-sieve adsorbent and its regeneration: the source leaves regeneration out'
  - 'TODO the electricity of the -25 degC refrigeration: the duty is feed:refrigeration, which has no background
    yet'
  - 'TODO cooling-water make-up, evaporation and chemicals: the source counts only the cooling-water pumps'' electricity
    (in feed:electricity); a cooling-water exchange would count that power twice'
  - 'TODO furnace NOx and CO, and unburnt by-products: not given in the source'
  - 'TODO wash water of the caustic tower and the water of the 50 wt% caustic: not given in the source'
  - 'TODO ethylene lost in the stripper vent: not quantified (all unrecovered ethylene taken as fired)'
  - 'the water of the hydrated ethanol feed (7 wt%): enters and leaves with the effluent, not counted'
  - 'LP steam the reactor effluent could raise (25.6 MW in the source): not used in the stand-alone case, no credit
    in the cut-off model'
  - ethylene storage and compression to pipeline pressure; infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: GLO
year: 2011
valid_until: 2016
time:
  start: 2010
  description: Simulation study completed in 2011 on literature of 1981 to 2010. valid_until is the reference year
    + 5 (system-model section 6), so it has already lapsed.
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation. The by-products are fired inside the plant and the effluent
    heat is not exported, so there is no co-product.'
