# Process Atlas manifest. Schema: schemas/process.schema.json. A manifest-only process: its LCI
# dataset is lca/datasets/*.yaml, Tier 0 form, so maturity stays at concept
# (core's cheme.lci-tier-maturity). See README.md.
schema: cheme-as-code/process/v1
id: tert-butanol-1
title: tert-Butanol by direct hydration of isobutene over an acidic ion-exchange resin
summary: >-
  Tier 0 screening per tonne of tert-butanol: stoichiometry with a patent's by-product rate,
  electricity and heat from core's defaults (no open energy figure found). No flowsheet; not reviewed.
families: [oxygenates]
keywords: [tert-butanol, tert-butyl alcohol, TBA, isobutene, isobutylene, hydration, ion-exchange resin, raffinate]
facets: {feedstock_basis: [fossil], product_classes: [chemicals], unit_operations: [reaction, distillation], region: generic}
maturity: concept
validation: {status: unreviewed}
chemistry:
  inputs:
    - {chemical: isobutene, role: feedstock, inventory_key: "feed:isobutene", note: "isobutene consumed; a raffinate feed's C4 inerts pass through and are not counted"}
    - {chemical: water, role: feedstock, inventory_key: "feed:water", note: "water of reaction only"}
  outputs:
    - {chemical: tert-butanol, role: main-product, inventory_key: "product:tert-butanol"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:electricity", note: "core's Tier 0 default (ASSUMED, dated); the dataset's feed:heat (core's default heat from fossil fuel, kWh) has no registry slug and is mapped in lca/mappings.yaml"}
basis: {capacity: "per tonne of tert-butanol (the dataset's basis); no plant size"}
publication: {status: public, license: CC-BY-4.0}
references:
  - {title: "Falcke, H. et al. (2017) Best Available Techniques (BAT) Reference Document for the Production of Large Volume Organic Chemicals. JRC Science for Policy Report EUR 28882 EN (JRC109279), section 2.1.2.1.8 (routes only, no figures)", doi: 10.2760/77304}
  - {title: "US 7,179,948 B2 (2007) Process for preparing tert-butanol (Oxeno Olefinchemie): continuous fixed-bed reactors in series over acidic ion-exchange resin, route and operating ranges", url: "https://patents.google.com/patent/US7179948B2/en"}
  - {title: "US 4,180,688 A (1979) Method for continuously producing tert-butyl alcohol (Nippon Oil): Example 4 (two plant-scale reactors in series), isobutylene dimer by-product rate", url: "https://patents.google.com/patent/US4180688A/en"}
  - {title: "US 4,307,257 A (1981) Process for production of tertiary butyl alcohol (Sumitomo Chemical): Table 2, selectivity of isobutylene to TBA (benchmark only)", url: "https://patents.google.com/patent/US4307257A/en"}
