parameters:
- name: tba
  value: 1000.0
  unit: kg
  description: tert-Butanol delivered (the basis), counted as TBA contained.
  source: basis
- name: M_TBA
  value: 74.123
  unit: g/mol
  description: Molar mass of tert-butanol (C4H10O).
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573),
    applied to the formula
- name: M_IB
  value: 56.108
  unit: g/mol
  description: Molar mass of isobutene (C4H8).
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573),
    applied to the formula
- name: M_W
  value: 18.015
  unit: g/mol
  description: Molar mass of water.
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573),
    applied to the formula
- name: r_dim
  value: 0.006875
  unit: kg/kg
  description: 'Isobutene dimer per kg TBA: 17.05 kg/h of dimer against 2.48 t/h of TBA, the total of
    two reactors in series.'
  source: 'US 4,180,688 A (Nippon Oil, 1979) Method for continuously producing tert-butyl alcohol, Example
    4 (two 15 m3 shell-and-tube reactors of sulfonated styrene-divinylbenzene resin in series, 90 and 85
    degC, 20 kg/cm2 G, butadiene-free steam-cracker C4 with 46.4 wt% isobutylene; total of both reactors).
    Chosen over the patent''s laboratory Examples 1 and 2 (0.46 and 1.9 g/kg, 15.7 l and 4.2 l reactors)
    because it is the plant-scale, multi-stage case; Example 3 (first reactor alone) gives 5.2 g/kg. The
    rate is ASSUMED to hold for a pure isobutene feed, where a higher isobutene concentration may give
    more dimer; the 49 kg/h sec-butanol from the linear butenes is left out'
- name: elec
  value: 333.3
  unit: kWh
  description: 'Electricity per t TBA: core''s Tier 0 default, 0.3333 kWh/kg.'
  source: 'ASSUMED: cheme tier-defaults 1.0.0: electricity [ASSUMED]: 1.2 MJ (0.333 kWh) per kg of product,
    attributed to the Gendorf (2000) site average that the ecoinvent v2-era chemicals proxies used; not read
    in Hischier et al. 2005 (p. 61) or Althaus et al. 2007. Dated and not specific to this process. No open
    tert-butanol figure was found (LVOC BREF 2.1.2.1.8 and the patents read give none). TODO source'
- name: heat
  value: 555.6
  unit: kWh
  description: 'Heat from fossil fuel per t TBA: core''s Tier 0 default, 0.5556 kWh/kg.'
  source: 'ASSUMED: cheme tier-defaults 1.0.0: heat [ASSUMED]: 2.0 MJ (0.556 kWh) of heat per kg of product,
    generated from fossil fuel, attributed to the Gendorf (2000) site average; not read in either source.
    Dated and not specific to this process; the work-up of a dilute aqueous TBA can need more. TODO source'
