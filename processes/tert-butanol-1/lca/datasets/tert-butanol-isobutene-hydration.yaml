# Tier 0 form, process-library#313 pilot without a flowsheet (issue #155). Every amount is the formula of its
# parameters; core's validator re-checks each. Stoichiometry with a patent's by-product rate; energy from core's
# Tier 0 defaults, because no open source with a tert-butanol energy figure was found.
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: tert-butanol-isobutene-hydration
title: tert-Butanol by direct hydration of isobutene over an acidic ion-exchange resin
description: Tier 0 screening estimate per 1 t of tert-butanol (TBA contained), gate-to-gate, continuous
  fixed-bed hydration of isobutene with water over a sulfonic-acid resin and distillative work-up. Stoichiometry
  with the by-product rate of a patent example; electricity and heat from core's Tier 0 defaults.
basis: 1000 kg of tert-butanol
boundary: 'gate-to-gate: fixed-bed hydration reactors, separation of the C4 overhead, work-up of the aqueous
  TBA; steam, heat and power from outside'
technology: liquid-phase hydration of isobutene on strongly acidic cation-exchange resin in continuous fixed-bed
  reactors in series (30 to 120 degC, preferably 35 to 70 degC, in US 7,179,948 B2; 85 to 90 degC in US 4,180,688
  A), with distillation; the PO/TBA co-product route and the sulfuric-acid
  route are not modelled
geography:
  description: 'No single site: the route is described in Japanese, US and German patents (1979 to 2007);
    the energy defaults are a German site average of 2000.'
classification:
  isic: '2011'
system_boundary:
  included:
  - isobutene consumed and the water of reaction
  - diisobutene by-product (C8 oligomer)
  - electricity and heat (core's Tier 0 defaults)
  excluded:
  - 'TODO isobutene losses to vents, flare and effluent: no open figure found'
  - 'TODO wastewater of the work-up: LVOC BREF 2.1.2.1.8 (p. 19) says it is treated biologically and
    finds no significant emission, but gives no amount'
  - TODO process water beyond the water of reaction (purges, regeneration of the TBA/water recycle)
  - 'TODO ion-exchange resin replacement: no consumption rate read'
  - TODO cooling water of the reactors and condensers
  - 'C4 inerts (butanes, linear butenes) of a raffinate feed: they pass through to the C4 overhead and
    are not counted; the basis is the isobutene consumed'
  - 'sec-butanol from linear butenes: not formed from a pure isobutene feed (US 4,180,688 reports it for
    a C4 raffinate)'
  - 'dehydration of TBA beyond the TBA/water azeotrope: the product is counted as TBA contained'
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: GLO
year: 2007
valid_until: 2012
time:
  start: 1979
  description: Patents of 1979 (by-product rate), 1981 (selectivity benchmark) and 2007 (route description);
    energy defaults dated 2000. valid_until is the reference year + 5 (system-model section 6), so it has
    already lapsed.
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation (the diisobutene is a residue to the fuel system)'
