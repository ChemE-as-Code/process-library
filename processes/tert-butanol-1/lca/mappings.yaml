# tert-butanol-1's own exchange overrides for the Atlas LCI build (ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. The diisobutene residue stays a reported gap:
# it has no registry slug and no shared entry, and its fate (site fuel) is ASSUMED.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:isobutene": {dataset: {path: processes/isobutene-1/lca/dataset.yaml, product: "product:IBP"}, source: "the Atlas producer isobutene-1, high-purity isobutene by MTBE cracking; the dataset's basis is a pure isobutene feed. A raffinate-based plant takes isobutene in a C4 mixture, whose burden differs: relink when a C4-raffinate producer exists"}
  "feed:heat": {use: heat-natural-gas, source: "core's Tier 0 default heat from fossil fuel, counted as heat in kWh; natural gas as the fuel is ASSUMED (the default names no fuel)"}
