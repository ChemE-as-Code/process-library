# The equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes are first estimates from the balance (DESIGN.md); design pressures, temperatures and
# materials are not set yet (basic engineering). All values ASSUMED unless a source is named.
schema: cheme/equipment/v1
equipment:
  - {tag: K-101, type: Compressor, service: "Process air blower: 60 000 Nm3/h from ambient to 159 kPa(a)",
     notes: "Single-stage centrifugal blower behind a filter, 1.17 MW electric (Q1, isentropic 0.80, motor 0.95; the discharge covers the bed pressure drop of US 4 036 783 A, D-010)."}
  - {tag: E-101, type: HeatExchanger, service: "Air preheater on HP steam: 349 to 470 K",
     notes: "2.63 MW (Q2), HP steam 6000 kPa(a) from the plant's own steam generator E-104 (D-006, D-008)."}
  - {tag: M-101, type: Vessel, service: "o-Xylene evaporator: the liquid sprayed through nozzles into the hot air, 80 g per Nm3",
     notes: "The mixture at 433 K is above the lower flammable limit of o-xylene in air; the evaporator, the reactor inlet hood and the ducts are designed for it (pressure-resistant or with bursting discs), the loading interlocked with the air flow (D-011)."}
  - {tag: R-101, type: TubularReactor, service: "Multitubular reactor: about 15 000 tubes of 25 mm inner diameter with V2O5/TiO2 coated rings in graded layers, molten salt on the shell side",
     notes: "Tubes of about 3.5 m with 2.5 to 3.5 m of catalyst (US 8 859 459 B2: fill height 250-350 cm; US 7 592 293 B2: 2.5-3.5 m; Jara et al. 2005: 13 500 tubes of 3.5 m for 4950 kg/h), 4 Nm3/h air per tube; salt bath (NaNO2/KNO3 eutectic, US 7 592 293 B2) at about 633 K, hot spot to stay below about 723 K (US 8 859 459 B2 keeps it below 450 C); 14.44 MW to the salt (Q3, core's conversion-step model) (D-005, D-011)."}
  - {tag: E-104, type: HeatExchanger, service: "Salt-bath cooler and steam generator: HP steam 6000 kPa(a) from the circulating salt",
     notes: "Raises 14.44 MW as saturated HP steam (about 22 t/h from boiler feed water at 378 K): 5.08 MW to the plant's own HP users (Q2, Q7, Q8, Q10), 9.36 MW exported (Q3, D-008); salt circulation pump 150 kW (Q4, ASSUMED)."}
  - {tag: E-102, type: HeatExchanger, service: "Gas cooler: the product gas from 643 to 443 K raising LP steam",
     notes: "5.04 MW (Q5), outlet kept above the PA dew point (419.6 K at its 1.56 kPa partial pressure) so nothing condenses ahead of the switch condensers (D-007)."}
  - {tag: E-103, type: HeatExchanger, service: "Switch condensers: finned-tube desublimers in parallel, switched between a cooling phase (oil at about 333 K) and a melt-out phase (hot oil at about 453 K)",
     notes: "Several units cycling in turn, 3-6 h per cycle (US 5 730 844 A); 97 % of the PA recovered as crude (D-007); cooling 4.05 MW to cooling water via the oil (Q6), melt-out 1.08 MW of HP steam via the oil (Q7); the crude melt to the crude tank."}
  - {tag: T-201, type: Tank, service: "Crude tank and thermal pre-treatment: the crude held at 523 K, phthalic acid dehydrated, the vapours to the off-gas oxidiser",
     notes: "Heated by HP steam coils (Q8, 254 kW), US 5 730 844 A: 250-280 C; residence time not set (D-009)."}
  - {tag: C-201, type: Column, service: "Light-ends column under vacuum (about 20 kPa(a) top): maleic anhydride and benzoic acid overhead",
     notes: "Reflux ratio 5 (ASSUMED), boil-up from the pre-treated feed's heat, condenser on tempered water above 404.6 K so PA does not freeze (Q9, 43 kW); stages not set (D-009)."}
  - {tag: C-202, type: Column, service: "Pure PA column under vacuum (10 kPa(a) top, PA boiling at 470 K): product overhead, residue at the bottom",
     notes: "Reflux ratio 1 (ASSUMED), reboiler 1.12 MW on HP steam (Q10), condenser raising LP steam 1.22 MW (Q11), product subcooled to 433 K; vacuum system and melt pumps 60 kW (Q12, ASSUMED) (D-009)."}
  - {tag: T-202, type: Tank, service: "Waste tank: light ends and residue kept molten for incineration",
     notes: "Heated, to an outside hazardous-waste incinerator (D-009)."}
  - {tag: X-301, type: Furnace, service: "Thermal oxidiser with a recuperative feed/effluent exchanger on the switch-condenser off-gas (77 t/h, about 1 vol% CO)",
     notes: "The recuperator heats the off-gas to within 161 K (its own combustibles' adiabatic rise) of a chamber at about 1033 K, an effectiveness of about 77 %, so it runs without support fuel (ASSUMED; start-up fuel excluded); 95 % destruction (AP-42 6.5); flue 494 K, a waste-heat boiler (about 1.16 MW of LP steam) an open option (D-009)."}
  - {tag: T-301, type: Tank, service: "Product tanks: PA melt at about 423-433 K under dry nitrogen",
     notes: "Outside the flowsheet; AP-42 6.5: liquid PA kept at 150 C and blanketed with dry nitrogen against fire and hydrolysis; flaking and bagging outside the boundary (D-002)."}
