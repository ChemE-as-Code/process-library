# Goal and scope of the phthalic-anhydride-1 LCI. Schema: `cheme schema lca`. Outputs: `cheme
# assess lca --write` (lca/inventory.csv, gaps.csv, dataset.yaml, manifest.json, results); never
# edit those by hand.
#
# Preliminary gate-to-gate foreground inventory (DESIGN.md D-012): every exchange of the plant
# with its amount per kg of phthalic anhydride, from the balanced flowsheet. The backgrounds are
# left unmapped (`missing:` with the activity each should connect to), except where
# lca/mappings.yaml links a shared entry: a gap, never zero, and no values from licensed
# databases. o-Xylene has no library producer (btx-1 exports mixed xylenes only): its gap names
# the proxy it should connect to (D-012). The plant's own emissions are elementary flows to air.
schema: cheme/lca/v1
kind: lca
goal: >-
  Preliminary gate-to-gate life cycle inventory of phthalic anhydride made by gas-phase
  oxidation of o-xylene with air over V2O5/TiO2 in a salt-cooled multitubular reactor, switch
  condensers and vacuum distillation, at the concept stage: which raw materials, utilities,
  steam exports, wastes and emissions the plant exchanges per kg of phthalic anhydride, as the
  foreground for a later cradle-to-gate study. No impact results: most backgrounds are not
  mapped yet (D-012).
functional_unit: {product: PAN, amount: 1, unit: kg, source: "1 kg of phthalic anhydride melt (modelled 99.99 wt%) at the plant gate to the product tanks, stream S13 (D-002, D-012)"}
# The boundary key stays cradle-to-gate so that the purchased inputs remain open gaps instead of
# being mapped free (the schema's gate-to-gate maps every feed free), as oxalyl-chloride-1 does.
boundary: cradle-to-gate
case: design
year: 2026
location: GLO
technology: "o-xylene evaporated into air at 80 g/Nm3 and oxidised over V2O5/TiO2 rings in one multitubular reactor of 15 000 tubes cooled by molten salt raising HP steam; gas cooler raising LP steam; switch condensers (desublimation and melt-out); thermal pre-treatment at 523 K; light-ends and pure-PA vacuum columns; regenerative thermal oxidiser on the off-gas; 5.06 t/h, about 40 kt/a"
rights: "CC-BY-4.0: the ChemE-as-Code process library's own concept design (LICENSE-DATA)"
system_model: cutoff
# The exported HP and LP steam are co-products (D-008, D-012). The dataset stays unallocated; the
# study and the library build give every burden to the phthalic anhydride (shares 1/0/0), as
# sulfuric-acid-1 and nitric-acid-1 do for their exported steam.
allocation:
  method: shares
  coproducts: [PAN, HPS, LPS]
  shares: {PAN: 1.0, HPS: 0.0, LPS: 0.0}
  source: >-
    D-012: the steam raised from the reaction heat leaves without a burden and without a credit
    (conservative for the phthalic anhydride). The plant takes part of its HP steam back
    (feed:STEAM); the gross export and the gross import are both kept in the inventory.
  deviation: >-
    The library hierarchy allocates exported steam by energy or exergy (docs/system-model.md).
    Energy allocation by heating value would put a share on the steam that rests on the steam's
    counting basis (kWh of heat above boiler feed water); no exergy of the phthalic anhydride
    melt is available from core (no property package, D-006). Shares 1/0/0 are the
    conservative choice until a substitution study credits the net export (3.08 kWh of HP
    and LP steam per kg, D-008).
  # substitution (system expansion), for comparison only: the avoided site steam is not mapped.
  substitution:
    HPS: {missing: "not mapped yet (D-012); should connect to the avoided HP steam 6000 kPa(a) from a natural-gas boiler (processes/utility-steam-ng-boiler), per kWh of heat above boiler feed water", source: "flowsheet energy stream Q3 (core's conversion-step model of R101), D-008"}
    LPS: {missing: "not mapped yet (D-012); should connect to the avoided LP steam 400 kPa(a) from a natural-gas boiler, per kWh", source: "flowsheet energy streams Q5 (gas cooler) and Q11 (PA column condenser), D-008"}
flows:
  # raw materials
  - key: feed:OX
    missing: "not mapped yet (D-012); no library process exports o-xylene. Connect to: o-xylene from the xylene splitter of an aromatics complex (superfractionation of the mixed C8 aromatics, whose burdens are those of processes/btx-1's mixed xylenes plus the splitter's reboiler heat); a recorded proxy, not linked"
    source: "flowsheet stream S4 (D-003)"
  - {key: feed:AIR, free: true, source: "ambient air: a resource taken from nature without burden (O2 consumed, N2 and Ar returned)"}
  # utilities
  - key: feed:POWER
    missing: "not mapped yet (D-012); connect to: electricity, medium voltage, grid mix of the (undecided) site country"
    source: "flowsheet energy streams Q1 (air blower), Q4 (salt pump) and Q12 (vacuum and melt pumps), D-010"
  - key: feed:STEAM
    missing: "linked as heat from steam (lca/mappings.yaml); the plant's own HP steam taken back from its header, counted as heat delivered (kWh)"
    source: "flowsheet energy streams Q2 (air preheater), Q7 (switch-condenser melt-out), Q8 (pre-treatment) and Q10 (PA column reboiler), D-006 to D-009"
  # HP and LP steam export (Q3; Q5, Q11) are co-products: allocation above (D-012)
  - key: product:CW
    missing: "not mapped yet (D-012); connect to: heat rejected to a recirculating cooling-water system with cooling tower (processes/utility-cooling-tower), per kWh removed"
    source: "flowsheet energy streams Q6 (switch condensers' oil cooler) and Q9 (light-ends condenser), D-007, D-009"
  # wastes
  - key: product:WASTE
    treatment: {kind: waste, route: "hazardous-waste incineration of the light ends and the distillation residue (phthalic and maleic anhydride, benzoic acid, tars not modelled) off site (D-009)"}
    missing: "not mapped yet (D-012); connect to: incineration of hazardous liquid organic waste, per kg (fossil carbon 0.62 kg/kg by the stream's composition)"
    source: "flowsheet stream S15 (D-009)"
  # stack gas
  - {key: product:STACK, emission: true, source: "flue gas of the regenerative thermal oxidiser to atmosphere through the stack (D-009), stream S16"}
  - {key: emission:N2, free: true, source: "atmospheric N2 returned to the atmosphere"}
  - {key: emission:O2, free: true, source: "atmospheric O2 returned (the unreacted excess)"}
  - {key: emission:AR, free: true, source: "atmospheric argon returned"}
  - {key: emission:H2O, free: true, source: "water vapour formed by the oxidation, returned to the atmosphere"}
  - key: emission:CO2
    elementary: {compartment: air, subcompartment: non-urban-high-stack, origin: fossil}
    source: "CO2 of the reactor's total oxidation and of the oxidiser, all from the fossil o-xylene, stream S16 (D-005, D-009)"
  - key: emission:CO
    elementary: {compartment: air, subcompartment: non-urban-high-stack, origin: fossil}
    source: "CO left after 95 % destruction in the oxidiser (AP-42 6.5), stream S16 (D-009)"
  - key: emission:OX
    elementary: {compartment: air, subcompartment: non-urban-high-stack}
    source: "unconverted o-xylene left after the oxidiser, stream S16 (D-005, D-009)"
  - key: emission:PA
    elementary: {compartment: air, subcompartment: non-urban-high-stack}
    source: "phthalic anhydride left after the oxidiser, stream S16 (D-007, D-009)"
  - key: emission:MA
    elementary: {compartment: air, subcompartment: non-urban-high-stack}
    source: "maleic anhydride left after the oxidiser, stream S16 (D-009)"
  - key: emission:BA
    elementary: {compartment: air, subcompartment: non-urban-high-stack}
    source: "benzoic acid left after the oxidiser, stream S16 (D-009)"
operation:
  hours_per_year: 8000
  life_years: 20
  source: "design basis operating_hours_per_year 8000 (ASSUMED); 20 a service life ASSUMED"
emission_exclusions:
  - {id: so2-dosing, method: combustion, reason: "AP-42 6.5 reports small SO2 additions to the reactor feed to keep the catalyst active and 4.7 kg SO2 per Mg of PA in the main vent; the promoted catalysts of US 8 859 459 B2 and US 7 592 293 B2 are run without it in their examples, so no SO2 is dosed in this design (D-005); a plant that doses SO2 adds that emission."}
  - {id: oxidiser-nox-startup, method: combustion, equipment: [X-301], reason: "Thermal NOx of the regenerative oxidiser and its start-up and support fuel are not estimated: no sourced factor read (D-009)."}
  - {id: purification-vents, method: storage-tank, equipment: [T-201, C-201, C-202, T-202, T-301], reason: "The pre-treatment vapours, the columns' vacuum-pump discharges and the tank breathing go to the oxidiser in the plant (AP-42 6.5: pre-treatment and distillation emissions are routed to the main control device); their flows are not in the balance (no P&ID yet, D-009). AP-42 6.5's uncontrolled factors, 6.4 and 45 kg/Mg, would add about 2.6 kg/Mg after 95 % destruction."}
  - {id: catalyst-change, method: equipment-leaks, equipment: [R-101], reason: "Catalyst replacement (V2O5/TiO2 rings every few years) and its disposal or vanadium recovery are not counted: no open catalyst life or mass read (D-012)."}
dataset:
  version: 0.1.0
  classification: {isic: "2011"}   # ISIC Rev.4 2011 Manufacture of basic chemicals
  modelling: {principle: attributional}
  geography: {description: "Generic site with an o-xylene supply, not chosen (GLO); one design case"}
  system_model: cutoff
  technology_level: current
  review: {type: none}
  data_generator: "ChemE-as-Code agent session (Claude Opus 5.5) for issue #480, unreviewed"
