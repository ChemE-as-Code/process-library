id: phthalic-anhydride-by-o-xylene-oxidation-over-v2o5-tio2-5.06-t-h-about-40-kt-a
title: Phthalic anhydride by o-xylene oxidation over V2O5/TiO2 (5.06 t/h, about 40 kt/a)
description: Unallocated foreground LCI of Phthalic anhydride by o-xylene oxidation over V2O5/TiO2 (5.06
  t/h, about 40 kt/a), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: o-xylene evaporated into air at 80 g/Nm3 and oxidised over V2O5/TiO2 rings in one multitubular
  reactor of 15 000 tubes cooled by molten salt raising HP steam; gas cooler raising LP steam; switch
  condensers (desublimation and melt-out); thermal pre-treatment at 523 K; light-ends and pure-PA vacuum
  columns; regenerative thermal oxidiser on the off-gas; 5.06 t/h, about 40 kt/a
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:so2-dosing
  title: combustion emissions of the plant
  direction: output
  reason: AP-42 6.5 reports small SO2 additions to the reactor feed to keep the catalyst active and 4.7
    kg SO2 per Mg of PA in the main vent; the promoted catalysts of US 8 859 459 B2 and US 7 592 293 B2
    are run without it in their examples, so no SO2 is dosed in this design (D-005); a plant that doses
    SO2 adds that emission.
- key: emission-excluded:oxidiser-nox-startup
  title: combustion emissions of X-301
  direction: output
  reason: 'Thermal NOx of the regenerative oxidiser and its start-up and support fuel are not estimated:
    no sourced factor read (D-009).'
- key: emission-excluded:purification-vents
  title: storage-tank emissions of T-201, C-201, C-202, T-202, T-301
  direction: output
  reason: 'The pre-treatment vapours, the columns'' vacuum-pump discharges and the tank breathing go to
    the oxidiser in the plant (AP-42 6.5: pre-treatment and distillation emissions are routed to the main
    control device); their flows are not in the balance (no P&ID yet, D-009). AP-42 6.5''s uncontrolled
    factors, 6.4 and 45 kg/Mg, would add about 2.6 kg/Mg after 95 % destruction.'
- key: emission-excluded:catalyst-change
  title: equipment-leaks emissions of R-101
  direction: output
  reason: 'Catalyst replacement (V2O5/TiO2 rings every few years) and its disposal or vanadium recovery
    are not counted: no open catalyst life or mass read (D-012).'
