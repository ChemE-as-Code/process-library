# phthalic-anhydride-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# The preliminary LCI leaves most backgrounds unmapped (DESIGN.md D-012): the build reports each
# as a gap (lci/gaps.json). Linked here: the HP steam the plant takes back from its header,
# counted as heat delivered (kWh), as oxalyl-chloride-1 does. o-Xylene stays a gap: no library
# process exports it (btx-1 makes mixed xylenes); its proxy is recorded in lca.yaml and D-012,
# not linked (CONTRIBUTING, "Gaps").
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:STEAM": {use: steam-heat, source: "HP steam 6000 kPa(a) to the air preheater (Q2), the switch condensers' melt-out (Q7), the pre-treatment (Q8) and the PA column's reboiler (Q10), counted as heat delivered (kWh), D-008"}
