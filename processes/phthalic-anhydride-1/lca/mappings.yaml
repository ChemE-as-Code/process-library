# phthalic-anhydride-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# No overrides (DESIGN.md D-012). The Atlas build links electricity (feed:POWER) and the heat to
# cooling water (product:CW) through the shared lci/mappings.yaml by their chemical slugs in
# process.yaml. No steam is bought: the HP steam the plant uses is the salt bath's own, netted in
# the flowsheet (D-008), so there is no steam import to link. o-Xylene (feed:OX) and the waste to
# incineration (product:WASTE) stay gaps (lci/gaps.json): no library process exports o-xylene
# (btx-1 makes mixed xylenes); its proxy is recorded in lca.yaml and D-012, not linked
# (CONTRIBUTING, "Gaps").
schema: cheme-as-code/lci-process-mappings/v1
exchanges: {}
