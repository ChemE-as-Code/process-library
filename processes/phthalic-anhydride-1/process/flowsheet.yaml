# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Phthalic anhydride by gas-phase oxidation of o-xylene with air over V2O5/TiO2 in a multitubular
# reactor cooled by molten salt that raises HP steam, recovery of the crude in switch condensers,
# thermal pre-treatment and vacuum distillation of the melt; the off-gas burnt in a regenerative
# thermal oxidiser (DESIGN.md D-001). Where the values come from:
# - feeds, temperatures, pressures, conversions, recoveries: design basis and decisions D-002 to
#   D-010, ASSUMED, the ranges from the open sources of the register where they exist;
# - the mixer, the reactor R101, the oxidiser X301 and the component separators (SC101, C201,
#   C202 by `recovery:`) are solved by `cheme process propagate --fill` (calculated); R101's duty
#   is core's conversion-step model (ideal gas, materials.yaml);
# - the other duties and powers are the hand calculation of DESIGN.md D-006 to D-010, given as
#   ASSUMED with their arithmetic: core has no property package for phthalic or maleic anhydride
#   and no desublimation model (L-1, L-2).
schema: cheme/process/v1
kind: flowsheet
title: Phthalic anhydride by o-xylene oxidation over V2O5/TiO2 (5.06 t/h, about 40 kt/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: one reactor of 15 000 tubes at 4 Nm3/h air and 80 g/Nm3 o-xylene each (D-002, D-004)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: OX, title: o-Xylene (bought in), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AIR, title: Process air, category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: k101, direction: out, kind: energy}
      - {id: r101, direction: out, kind: energy}
      - {id: c202, direction: out, kind: energy}
  - id: STEAM
    title: HP steam from the plant's own header (6000 kPa(a), saturated)
    category: utility
    utility:
      kind: steam
      level: HP
      pressure: {value: 6000, provenance: assumed, source: "design basis, D-008"}
      supply_temperature: {value: 548.7, provenance: assumed, source: "saturation at 6000 kPa(a) (IAPWS-97)"}
      min_approach: {value: 10, provenance: assumed, source: "design basis"}
    ports:
      - {id: e101, direction: out, kind: energy}
      - {id: sc101, direction: out, kind: energy}
      - {id: t201, direction: out, kind: energy}
      - {id: c202, direction: out, kind: energy}
products:
  - {id: PAN, title: Phthalic anhydride melt to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: WASTE, title: Light ends and distillation residue to incineration, category: by_product, ports: [{id: in, direction: in}]}
  - {id: STACK, title: Oxidiser flue gas to stack, category: off_gas, ports: [{id: in, direction: in}]}
  - id: HPS
    title: HP steam raised by the salt-bath cooler (6000 kPa(a), saturated)
    category: utility
    utility:
      kind: steam
      level: HP
      pressure: {value: 6000, provenance: assumed, source: "design basis, D-008"}
      supply_temperature: {value: 548.7, provenance: assumed, source: "saturation at 6000 kPa(a) (IAPWS-97)"}
      min_approach: {value: 20, provenance: assumed, source: "D-008"}
    ports: [{id: r101, direction: in, kind: energy}]
  - id: LPS
    title: LP steam raised in the gas cooler and the PA column's condenser (400 kPa(a), saturated)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 400, provenance: assumed, source: "design basis, D-008"}
      supply_temperature: {value: 416.8, provenance: assumed, source: "saturation at 400 kPa(a) (IAPWS-97)"}
      min_approach: {value: 15, provenance: assumed, source: "D-008"}
    ports: [{id: e102, direction: in, kind: energy}, {id: c202, direction: in, kind: energy}]
  - id: CW
    title: Cooling water return (via the condensers' heat-transfer oil and tempered water)
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis"}
      min_approach: {value: 10, provenance: assumed, source: "design basis"}
    ports: [{id: sc101, direction: in, kind: energy}, {id: c201, direction: in, kind: energy}]

blocks:
  - id: FEED
    title: Air supply and o-xylene evaporation
    class: ProcessStep
    ports:
      - {id: air, direction: in}
      - {id: ox, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: steam, direction: in, kind: energy}
  - id: REACT
    title: o-Xylene oxidation (multitubular, V2O5/TiO2, salt-cooled)
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: hps, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: RECOVER
    title: Gas cooling and switch condensers
    class: SeparatingByThermalProcess
    ports:
      - {id: in, direction: in}
      - {id: crude, direction: out}
      - {id: offgas, direction: out}
      - {id: lps, direction: out, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: steam, direction: in, kind: energy}
  - id: PURIFY
    title: Pre-treatment and vacuum distillation
    class: Distilling
    ports:
      - {id: crude, direction: in}
      - {id: product, direction: out}
      - {id: waste, direction: out}
      - {id: steam_t, direction: in, kind: energy}
      - {id: steam_c, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: lps, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: OFFGAS
    title: Off-gas treatment (regenerative thermal oxidiser)
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: flue, direction: out}

steps:
  # --- FEED ------------------------------------------------------------------------------------
  - id: K101
    block: FEED
    title: Process air blower
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in, delegates: air}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E101
    block: FEED
    title: Air preheater (HP steam)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: steam}
  - id: M101
    block: FEED
    title: o-Xylene evaporator (sprayed into the hot air)
    class: Mixing
    links: [{target: equipment, ref: M-101}]
    ports:
      - {id: air, direction: in}
      - {id: ox, direction: in, delegates: ox}
      - {id: out, direction: out, delegates: out}
  # --- REACT -----------------------------------------------------------------------------------
  - id: R101
    block: REACT
    title: Multitubular reactor (V2O5/TiO2 rings, molten-salt cooled, steam generator on the salt)
    class: ReactingChemicals
    reactions: [PA_FORM, MA_FORM, BA_FORM, OX_CO2, OX_CO]
    reactor: conversion
    energy_port: q
    links: [{target: equipment, ref: R-101}, {target: equipment, ref: E-104}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: out, direction: out, delegates: out}
      - {id: q, direction: out, kind: energy, delegates: hps}
      - {id: power, direction: in, kind: energy, delegates: power}
  # --- RECOVER ---------------------------------------------------------------------------------
  - id: E102
    block: RECOVER
    title: Gas cooler (LP steam)
    class: Cooling
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: lps}
  - id: SC101
    block: RECOVER
    title: Switch condensers (desublimation on oil-cooled finned tubes, melt-out on hot oil)
    class: SeparatingByThermalProcess
    links: [{target: equipment, ref: E-103}]
    recovery:
      outlets: {crude: {PA: 0.97, MA: 0.10, BA: 0.50}}
      provenance: assumed
      source: >-
        D-007: 97 % of the phthalic anhydride to the crude, within the "95 % plus" of EP 0 574 855
        A2 (background) and set so that the off-gas carries 62 kg PA, MA and benzoic acid per t of
        product against AP-42 6.5's uncontrolled 69 kg/Mg; maleic anhydride 10 % and benzoic acid
        50 % to the crude, ASSUMED (US 5 730 844 A: the impurities leave mostly with the gas)
    ports:
      - {id: in, direction: in}
      - {id: crude, direction: out, delegates: crude}
      - {id: offgas, direction: out, delegates: offgas}
      - {id: cool, direction: out, kind: energy, delegates: cw}
      - {id: melt, direction: in, kind: energy, delegates: steam}
  # --- PURIFY ----------------------------------------------------------------------------------
  - id: T201
    block: PURIFY
    title: Thermal pre-treatment (phthalic acid dehydrated, 523 K)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: T-201}]
    ports:
      - {id: in, direction: in, delegates: crude}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: steam_t}
  - id: C201
    block: PURIFY
    title: Light-ends column (vacuum)
    class: Distilling
    links: [{target: equipment, ref: C-201}]
    recovery:
      outlets: {top: {PA: 0.005, MA: 0.999, BA: 0.97}}
      provenance: assumed
      source: "D-009: maleic anhydride and benzoic acid taken overhead with 0.5 % of the phthalic anhydride, ASSUMED"
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out}
      - {id: bot, direction: out}
      - {id: cond, direction: out, kind: energy, delegates: cw}
  - id: C202
    block: PURIFY
    title: Pure PA column (vacuum, 10 kPa(a) top)
    class: Distilling
    links: [{target: equipment, ref: C-202}]
    recovery:
      outlets: {top: {PA: 0.99, MA: 1.0, BA: 1.0}}
      provenance: assumed
      source: "D-009: 99 % of the phthalic anhydride overhead as product, 1 % with the residue (tars, not modelled), ASSUMED"
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out, delegates: product}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: steam_c}
      - {id: cond, direction: out, kind: energy, delegates: lps}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M201
    block: PURIFY
    title: Waste collection (light ends and residue)
    class: Mixing
    links: [{target: equipment, ref: T-202}]
    ports:
      - {id: lights, direction: in}
      - {id: residue, direction: in}
      - {id: out, direction: out, delegates: waste}
  # --- OFFGAS ----------------------------------------------------------------------------------
  - id: X301
    block: OFFGAS
    title: Regenerative thermal oxidiser
    class: ReactingChemicals
    reactions: [CO_OX, PA_OX, MA_OX, BA_OX, OX_OX]
    reactor: conversion
    links: [{target: equipment, ref: X-301}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: out, direction: out, delegates: flue}

