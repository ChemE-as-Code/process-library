  # --- feeds -----------------------------------------------------------------------------------
  - id: S1
    title: Process air
    from: AIR.out
    to: K101.in
    template: air
    state:
      design:
        pressure: {value: 101.325, provenance: assumed, source: "ambient"}
        temperature: {value: 298.15, provenance: assumed, source: "design basis"}
        phase: {value: vapor, provenance: assumed, source: "gas"}
        flow: {value: 77520.5, basis: mass, provenance: assumed, source: "D-004: 60 000 Nm3/h (15 000 tubes x 4 Nm3/h, US 8 859 459 B2) = 2676.90 kmol/h at 22.414 Nm3/kmol x 28.959 kg/kmol (dry air)"}
        composition: {basis: mole_fraction, values: {N2: 0.7812, O2: 0.2095, AR: 0.0093}, provenance: assumed, source: "dry air, CO2 lumped into N2; humidity not counted (D-004)"}
