  # --- purification ----------------------------------------------------------------------------
  - id: S10
    title: Pre-treated crude
    from: T201.out
    to: C201.feed
    template: crude
    state:
      design:
        pressure: {value: 150.0, provenance: assumed, source: "D-009"}
