# Components and templates of phthalic-anhydride-1. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
#
# Gas data printed by `cheme chemistry thermo` (chemicals 1.5.2 and thermo 0.6.1, the versions
# core pins): formation enthalpies from ATcT (ATCT_G) or the CRC tables packaged in chemicals,
# entropies from the CRC, WebBook or Yaws tables packaged in chemicals, cp/R fitted to thermo's
# TRCIG or HEOS_FIT correlations. thermo has no ideal-gas heat capacity for phthalic and maleic
# anhydride: their cp/R is the Joback group contribution (Joback and Reid 1987) evaluated by
# thermo 0.6.1 (`thermo.group_contribution.Joback.Cpig_coeffs`) with the groups assigned by
# hand (ring =CH-, ring =C<, ring >C=O, ring -O-), because thermo's own SMARTS matching counts
# the anhydride ring as two esters (DESIGN.md SRC-8, L-2). Single values with their source,
# not open data (library ADR 0037).
schema: cheme/process/v1
kind: materials
