  - {id: crude, title: Crude and purified phthalic anhydride melt, components: [PA, MA, BA, OX, O2, N2, AR, H2O, CO, CO2]}
  - {id: flue, title: Oxidiser flue gas, components: [OX, PA, MA, BA, O2, N2, AR, H2O, CO, CO2]}
# No benchmarked property package of core covers phthalic or maleic anhydride: the condenser,
# column and melt values are the hand calculation of DESIGN.md (D-006 to D-009), given as
# ASSUMED with their arithmetic.
property_method:
  adapter: thermo
  status: placeholder
