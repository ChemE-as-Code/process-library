# Pipe routing intent of the basic 3D layout (S5, D-027). Schema: `cheme schema routing`.
# Router defaults apply where nothing is said here (local_max_m 15, spacing 0.1 m, road
# headroom 6 m: each an ASSUMED package value). The battery limit points are ASSUMED (D-027):
# the site's utilities (cooling water, steam, nitrogen, natural gas) and the make-up hydrogen
# come from the utility interface A-800 south of PR-1 and enter at the west end of PR-1; the
# flare header, the cooling water and condensate returns, the fuel gas, the products and the
# toluene feed from the tank interface A-300 (south-east) meet the site at its east end (the
# flare, the cooling water plant, the boiler house and the tank farm are site facilities
# outside the boundary, D-001, D-025). Each header runs along PR-1 between its battery limit
# and its dead end just past its last user, its tees where its branches leave.
schema: cheme/routing/v1
rules:
  # pipe-way 4.5 m (bottom of pipe) instead of the package's 3.5 m: the local runs then pass
  # 2.1 m or more over the lowest access platforms of the columns and vessels (at about 1.5 to
  # 2.4 m), and under the lower decks of the overhead structures (6 to 6.5 m); within the usual
  # 3.0 to 4.5 m (ASSUMED, D-027)
  local_elevation_m: 4.5
  tiers:
    # large lines on the lower tier, small utilities on the upper (ASSUMED, D-027)
    - {rack: PR-1, elevation: 6, lines: ["FL-701", "CWS-801", "CWR-802", "LS-803"]}
    - {rack: PR-1, elevation: 8, lines: ["N2-702", "NG-703", "MS-804", "HS-805", "CD-806"]}
  battery_limits:
    - {id: BL-west-utilities, lines: [CWS-801, N2-702, NG-703, LS-803, MS-804, HS-805, HG-104], rack: PR-1, rack_end: start}
    - {id: BL-east, lines: [FL-701, CWR-802, CD-806, TO-101, FG-119, BZ-121, DP-124, FG-128, NG-139], rack: PR-1, rack_end: end}
    # dead ends of the headers, just past their last tee and clear of the rack bents (every
    # 10 m from x 20) (ASSUMED, D-027)
    - {id: FL-dead-end, lines: [FL-701], point: [22, 50, 6.0]}
    - {id: CWS-dead-end, lines: [CWS-801], point: [158, 50, 6.0]}
    - {id: CWR-dead-end, lines: [CWR-802], point: [72, 50, 6.0]}
    - {id: N2-dead-end, lines: [N2-702], point: [125, 50, 8.1]}
    - {id: NG-dead-end, lines: [NG-703], point: [46, 50, 8.0]}
    - {id: LS-dead-end, lines: [LS-803], point: [142, 50, 6.0]}
    - {id: MS-dead-end, lines: [MS-804], point: [122, 50, 8.0]}
    - {id: HS-dead-end, lines: [HS-805], point: [158, 50, 8.1]}
    - {id: CD-dead-end, lines: [CD-806], point: [112, 50, 8.0]}
  # (S5 fix) the open ends of the cooling water vents of E-203 and E-205 rise clear of the deck
  # and stair beside them: a 1.5 m (CWS-644) or 2.0 m (CWR-547, which stands beside the S-202
  # upper deck) sphere round the outlet off every walking level (cooling water only: no zone
  # radius; both ASSUMED, D-027)
  vents:
    - {lines: [CWR-547], radius_m: 2.0, max_rise_m: 8}
    - {lines: [CWS-644], radius_m: 1.5, max_rise_m: 8}
lines:
  # equipment drains: each vessel and column drain goes down to a closed-drain hub at grade
  # beside its item; the underground closed-drain network (to the site's slop system) is a
  # civil and detail-engineering item, not a pipe route of this model (D-027)
  - {line: DR-138, skip: "V-100 drain to the closed-drain hub at grade beside V-100; the underground closed-drain network is designed at detail engineering (D-027)"}
  - {line: DR-240, skip: "V-101 drain to the closed-drain hub at grade beside V-101; the underground closed-drain network is designed at detail engineering (D-027)"}
  - {line: DR-445, skip: "C-201 drain to the closed-drain hub at grade beside C-201; the underground closed-drain network is designed at detail engineering (D-027)"}
  - {line: DR-446, skip: "V-201 drain down from S-201 to the closed-drain hub at grade; the underground closed-drain network is designed at detail engineering (D-027)"}
  - {line: DR-551, skip: "C-202 drain to the closed-drain hub at grade beside C-202; the underground closed-drain network is designed at detail engineering (D-027)"}
  - {line: DR-552, skip: "V-202 drain down from S-202 to the closed-drain hub at grade; the underground closed-drain network is designed at detail engineering (D-027)"}
  - {line: DR-651, skip: "C-203 drain to the closed-drain hub at grade beside C-203 (traced); the underground closed-drain network is designed at detail engineering (D-027)"}
  - {line: DR-652, skip: "V-203 drain down from S-203 to the closed-drain hub at grade; the underground closed-drain network is designed at detail engineering (D-027)"}
  # TO-122 (C-202 bottoms to C-203) south of the reboiler E-204, so that E-204's lift lane
  # from CP-203 (east) stays clear (D-027)
  # leaves the C-202 bottom east, through the gap of the 1.52 m platform's arc, before rising
  - {line: TO-122, segment: P-05/Line_TO122_S1, via: [[134.0, 100.0, 2.5], [134.0, 100.0, 4.5], [134.0, 92.0, 4.5], [148.7, 92.0, 4.5]]}
  # BZ-531 (E-203 condensate) drops through the upper deck and reaches the V-202 top nozzle
  # between the decks, 2.1 m or more over the lower deck
  - {line: BZ-531, via: [[122.0, 102.6, 8.8], [117.0, 102.6, 8.8], [117.0, 101.4, 8.8]]}
  # the E-201 cooling water drops through the lower deck of S-201 and runs under it
  - {line: CWS-440, elevation: 5.0}
  - {line: CWR-441, elevation: 5.0}
  # PG-430 (C-201 overhead) south at 13 m to E-201, over the S-201 top deck and stair with the
  # headroom, instead of round PR-2
  # (S5 fix) it drops onto the E-201 channel nozzle T1 on the top of the channel, outside the
  # bundle pull space south of E-201
  - {line: PG-430, via: [[107.5, 80.0, 13.0], [107.5, 63.3, 13.0], [103.0, 63.3, 13.0]]}
  # FG-119 (V-201 off-gas) straight up from the drum top to between the decks of S-201
  # (S5 fix) and reaches the battery limit past the end of PR-1, clear of the PR-1 end ladder
  - {line: FG-119, segment: P-04/Line_FG119_S1, via: [[103.0, 60.0, 8.4], [103.0, 54.6, 8.4], [123.5, 54.6, 8.4], [123.5, 55.6, 8.4], [159.6, 55.6, 8.4], [159.6, 50.0, 8.4]]}
  # HG-115 reaches the PSV-119 tee from the north in a straight run, apart from its drop to
  # the E-101 shell inlet
  - {line: HG-115, segment: P-01/Line_HG115_S2, via: [[64.0, 76.0, 4.7], [63.5, 76.0, 4.7]]}
  # the steam and condensate of the stabiliser reboiler E-202 run locally at the pipe-way from
  # their header tees on PR-1, not round the PR-1/PR-2 junction
  - {line: MS-439, elevation: 4.5}
  - {line: CD-444, elevation: 4.0}
  # NG-137 leaves its header tee north at the tier, clear of the bent at x 40, before it drops
  - {line: NG-137, segment: P-07/Line_NG137_S1, via: [[40.0, 54.6, 8.1]]}
  # overhead structures: lines over a deck run at least the 2.1 m headroom above it, or pass
  # between the decks (D-027)
  - {line: BZ-536, elevation: 9.5}
  # BZ-121 (benzene product from E-207 under S-202) leaves the frame south at low level and
  # rises outside it, not through the decks
  # (S5 fix) leaves from the E-207 back end north, clear of the bundle pull space south of E-207
  - {line: BZ-121, segment: P-05/Line_BZ121_S1, via: [[115.5, 102.8, 0.2], [115.5, 102.8, 4.5], [123.4, 102.8, 4.5], [123.4, 83.0, 4.5]]}
  - {line: FL-549, segment: P-05/Line_FL549_S1, elevation: 9.0}
  - {line: PG-647, via: [[144.0, 65.0, 8.2], [144.0, 61.0, 8.2]]}
  - {line: TO-123, segment: P-06/Line_TO123_S1, via: [[150.08, 71.2, 1.1], [153.9, 71.2, 1.1], [153.9, 71.2, 8.5], [153.9, 56.0, 8.5]]}
  # ---- S5 fix (review of PR #364, D-027) ------------------------------------------------
  # Pump suctions fall all the way from their vessel to the pump, with no high point where gas
  # could collect (saturated liquids: V-101 with dissolved H2/CH4, C-203 boiling biphenyl). Each
  # suction tee stands outside the access spaces of the pumps, so a spare pump's suction does not
  # cross the running pump's space; the discharges run under the suctions, low enough that the
  # block, check and control valves stand within reach of grade, and their tees stand outside
  # the access spaces too. The AR-116 take-off for the quench pumps P-102/P-102B is at low level
  # beside V-101; AR-116 rises to the rack only after the tee T235 and its valves XV-204 and
  # LV-202, west of the K-102 and PK-101 lift lanes.
  - {line: AR-116, segment: P-02/Line_AR116_S1, via: [[79.9, 80.0, 1.2], [79.9, 75.6, 1.2]]}
  - {line: AR-116, segment: P-02/Line_AR116_S2, via: [[82.6, 75.6, 1.2], [82.6, 75.6, 8.97], [82.6, 53.35, 8.97], [82.6, 53.35, 8.06], [108.99, 53.35, 8.06]]}
  # the PSA tail gas FG-330 leaves the rack 0.8 m west of the AR-116 riser
  - {line: FG-330, via: [[81.8, 53.6, 9.05], [81.8, 79.23, 9.05]]}
  - {line: AR-235, segment: S1, via: [[75.8, 75.6, 1.2]]}
  - {line: AR-235, segment: S2, via: [[75.8, 74.0, 1.2]]}
  - {line: AR-239, via: [[75.8, 72.0, 1.2]]}
  - {line: TO-102, segment: S1, via: [[30.8, 62.6, 1.7], [30.8, 61.0, 1.7], [37.6, 61.0, 1.7]]}
  - {line: TO-102, segment: S2, via: [[37.6, 62.0, 1.7]]}
  - {line: TO-130, via: [[37.6, 59.5, 1.7]]}
  # the toluene feed leaves the pumps low (FV-103, XV-120 within reach) before it rises to the pipe-way
  - {line: TO-103, segment: S3, via: [[45.5, 61.84, 1.25], [45.5, 61.84, 4.5]]}
  - {line: AR-432, segment: S1, via: [[102.5, 60.0, 1.2], [102.5, 70.3, 1.2], [101.2, 70.3, 1.2]]}
  - {line: AR-432, segment: S2, via: [[101.2, 72.0, 1.2]]}
  - {line: AR-433, via: [[101.2, 74.5, 1.2]]}
  - {line: BZ-532, segment: S1, via: [[117.0, 95.6, 1.7], [116.8, 95.6, 1.7], [116.8, 94.0, 1.7]]}
  - {line: BZ-532, segment: S2, via: [[117.4, 94.0, 1.7]]}
  - {line: BZ-533, via: [[116.8, 90.8, 1.7]]}
  - {line: TO-632, segment: S1, via: [[144.0, 69.5, 1.2], [141.9, 69.5, 1.2]]}
  - {line: TO-632, segment: S2, via: [[141.9, 72.0, 1.2]]}
  - {line: TO-633, via: [[141.9, 74.6, 1.2]]}
  - {line: DP-648, elevation: 1.7}
  - {line: DP-649, elevation: 1.7}
  # column overheads fall continuously from the column top to the condenser on the deck (no
  # liquid pocket in a condensing vapour line), each onto the channel nozzle on the top of the
  # channel, outside the bundle pull space: PG-630 (C-203, 30 kPa(a)) at 12.8 m over S-203,
  # 2.8 m over its upper deck; PG-530 (C-202) down beside the column, 2.8 m from its axis
  # outside the platforms, where clips and guides off the shell carry it, then across at 14.2 m
  # over the S-202 upper deck
  - {line: PG-630, via: [[152.0, 80.0, 17.3], [152.0, 76.0, 17.3], [152.0, 76.0, 12.8], [152.0, 65.0, 12.8], [148.05, 65.0, 12.8]]}
  - {line: PG-530, via: [[130.0, 100.0, 39.0], [130.0, 97.58, 39.0], [128.6, 97.58, 39.0], [128.6, 97.58, 14.2], [128.6, 97.3, 14.2], [122.3, 97.3, 14.2]]}
  # reflux and product stations at grade: each reflux line then rises beside its column, 2.5 m
  # or more from its axis and outside its platforms, and reaches the reflux nozzle from the side
  # where no platform is
  - {line: AR-434, segment: S3, via: [[108.6, 71.93, 0.95], [108.6, 71.93, 4.5], [110.97, 71.93, 4.5], [110.97, 77.5, 4.5], [110.97, 77.5, 11.2], [110.97, 80.0, 11.2]]}
  - {line: BZ-537, elevation: 1.2}
  - {line: BZ-534, segment: S4, via: [[131.62, 93.86, 1.2], [131.62, 97.0, 1.2], [131.62, 97.0, 34.06], [131.62, 100.0, 34.06]]}
  - {line: TO-634, segment: S4, via: [[153.18, 71.91, 0.95], [153.18, 71.91, 14.99], [153.18, 80.0, 14.99]]}
  # reboiler draws fall from the column to the reboiler's bottom inlet at low level (no high
  # point in the thermosiphon feed), each from a draw nozzle turned towards its reboiler
  - {line: AR-437, via: [[111.6, 80.0, 3.06], [111.6, 80.0, 0.43], [111.6, 81.02, 0.43]]}
  - {line: TO-538, via: [[131.91, 101.91, 7.79], [131.91, 101.91, 0.3], [136.0, 101.91, 0.3], [136.0, 99.44, 0.3]]}
  - {line: TO-638, via: [[154.6, 80.0, 5.98], [154.6, 80.0, 0.4], [154.6, 80.84, 0.4]]}
  # vapour returns, feeds and relief lines of the columns outside the platforms and the ladder
  # cages
  - {line: PG-539, via: [[137.0, 99.44, 4.75], [133.3, 99.44, 4.75], [133.3, 96.4, 4.75], [127.0, 96.4, 4.75], [127.0, 100.0, 4.75], [127.0, 100.0, 13.44]]}
  - {line: AR-120, segment: P-05/Line_AR120_S1, via: [[124.09, 93.5, 9.04], [123.0, 93.5, 9.04], [123.0, 97.6, 9.04], [127.58, 97.6, 9.04], [127.58, 101.4, 9.04], [127.58, 101.4, 28.13]]}
  - {line: TO-122, segment: P-06/Line_TO122_S1, via: [[151.56, 92.0, 4.5], [151.56, 92.0, 12.95], [151.56, 81.1, 12.95]]}
  - {line: FL-443, segment: P-04/Line_FL443_S1, via: [[108.3, 78.3, 11.38], [108.3, 78.3, 4.56]]}
  - {line: FL-443, segment: P-07/Line_FL443_S1, via: [[108.3, 62.0, 4.56]]}
  - {line: FL-548, segment: P-05/Line_FL548_S1, via: [[128.02, 98.02, 34.62], [128.02, 98.02, 10.05]]}
  - {line: FL-645, segment: P-06/Line_FL645_S1, via: [[152.89, 77.56, 15.18], [152.89, 77.56, 4.58], [150.6, 77.56, 4.58]]}
  - {line: FL-645, segment: P-07/Line_FL645_S1, via: [[150.6, 60.0, 4.58]]}
  # lines round V-101 pass 2.1 m or more over its platform, or outside it
  - {line: PG-111, via: [[80.9, 64.0, 1.35], [80.9, 64.0, 6.2], [80.9, 82.2, 6.2], [76.2, 82.2, 6.2], [76.2, 80.0, 6.2], [76.2, 80.0, 5.45]]}
  - {line: AR-237, via: [[80.2, 72.5, 2.6], [80.2, 80.0, 2.6], [80.2, 80.0, 5.0]]}
  - {line: FL-234, segment: P-02/Line_FL234_S1, via: [[79.45, 80.0, 7.49], [79.45, 82.0, 7.49], [81.6, 82.0, 7.49], [81.6, 82.0, 3.58]]}
notes: >-
  ASSUMED (D-027): battery limit points at the PR-1 ends, header dead ends just past the last
  user, tier allocation by size, pipe-way 4.5 m. Stress, drainage and the flare header's slope
  are not designed.
