# Line list. Schema: `cheme schema lines`.
# Concept stage: one line per material stream of the PFD (stream id in the notes), no P&ID yet.
# DN: first-pass size from velocity (D-012, ASSUMED): gas 15 m/s above 1000 kPa(a), 20 m/s
# below, two-phase 10 m/s, liquid 1.5 m/s, on the Peng-Robinson bulk density of
# scripts/hda_balance.py (line_sizes in its output); inside diameter taken as the DN, DN25 the
# smallest. Pressure classes come with the pipe specs.
