# Special piping items: relief devices. Schema: `cheme schema piping_items`.
# Drawn on the P&IDs in S3b (D-025). Set pressure = design pressure of the protected item
# (equipment list, D-012), ASSUMED until the MAWP is known; relief_case = the case that makes
# the device necessary, named here; the governing case, its load and the orifice come with the
# relief study (S8). Every PSV discharges to the flare header (P-07) unless it says otherwise.
schema: cheme/piping_items/v1
piping_items:
  # ---- P-01
  - {tag: PSV-118, type: SpringLoadedGlobeSafetyValve, line: FL-133, sheet: P-01, set_pressure_barg: 3.5,
     relief_case: "V-100: nitrogen blanket regulator PCV-105 failed open; external fire",
     notes: "Set ASSUMED = V-100 design pressure (D-012). Load open (S8)."}
  - {tag: PSV-119, type: SpringLoadedGlobeSafetyValve, line: FL-135, sheet: P-01, set_pressure_barg: 42,
     relief_case: "Reactor loop blocked downstream (no isolation valve from E-101 inlet to V-101): P-101 at shut-off and make-up hydrogen with the loop blocked; fire on E-101/R-101",
     notes: "Set ASSUMED = loop design pressure 42 barg (D-012). Protects E-101 (both sides), H-101 coil, R-101, E-102 process side; the hot sections relieve through the cold feed (D-025). Load open (S8)."}
  # ---- P-02
  - {tag: PSV-214, type: SpringLoadedGlobeSafetyValve, line: FL-234, sheet: P-02, set_pressure_barg: 42,
     relief_case: "V-101: external fire; gas outlet blocked (K-101 suction closed) with the make-up hydrogen and P-101 running; also protects the K-101 suction and casing, which have no isolation from V-101",
     notes: "Set ASSUMED = V-101 design pressure (D-012). K-101 has no PSV of its own on the discharge: HG-115 runs from K-101 through its check valve CV-115 to E-101 with no isolation valve, so PSV-119 on P-01 (set at the same 42 barg) protects the discharge against the shut-off case; the check valve opens in the relieving direction (D-025). Load open (S8)."}
  - {tag: PSV-215, type: SpringLoadedGlobeSafetyValve, line: CWR-238, sheet: P-02, set_pressure_barg: 6,
     relief_case: "E-102 cooling water side: tube rupture (loop gas at up to 42 barg into the CW side); blocked-in CW side with hot effluent flowing (thermal expansion)",
     notes: "Set ASSUMED = 6 barg CW-side design pressure (design basis gives no CW pressure; usual site CW systems run at 3-5 barg, ASSUMED). Discharges to atmosphere at a safe location (D-025). Whether a tube rupture needs a bursting disc instead is for S8."}
