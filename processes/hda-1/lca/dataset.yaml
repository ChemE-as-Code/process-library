allocation:
  method: energy
  coproducts:
  - BENZENE
  - DIPHENYL
  - FUELGAS
  properties:
    BENZENE:
      energy: 40580.0
      source: LHV of S21 (99.9 mol% benzene, 0.1 % toluene) from formation enthalpies, gas basis (D-013)
    DIPHENYL:
      energy: 39680.0
      source: 'LHV of S24 (95.2 mol% biphenyl, 4.8 % toluene, simulated, D-024: 39676 kJ/kg) from formation
        enthalpies, gas basis (D-013)'
    FUELGAS:
      energy: 50660.0
      source: 'LHV of S34 + S19 (PSA tail gas and stabiliser off-gas: H2, CH4, benzene, toluene; mass-weighted)
        from formation enthalpies, simulated streams of D-024 (D-013); 54230 before the PSA took out the
        hydrogen'
  substitution:
    FUELGAS:
      source: PSA tail gas and stabiliser off-gas burned in the site fuel gas header (D-009, D-024)
      missing: 'no background chosen yet: heat from natural gas in an industrial furnace, per MJ LHV of
        the fuel gas (site fuel system), market for the site''s region'
    DIPHENYL:
      source: biphenyl by-product sold or burned (D-009)
      missing: 'no background chosen yet: biphenyl production (e.g. from benzene dehydrocondensation)
        or, when it is burned, heavy fuel oil per MJ LHV'
  compare:
  - substitution
  - mass
  source: 'D-013 (agent proposal, for the LCA practitioner to confirm): energy (LHV) allocation as the
    exported default, because the library''s LCI export takes one activity per co-product and so only
    a proportional method; system expansion (ISO 14044''s preference: the fuel gas displaces natural gas
    firing at the site fuel header, the biphenyl displaces biphenyl made otherwise or fuel oil when burned)
    and mass allocation are computed for comparison. Both avoided productions have no background yet (gaps).'
  deviation: 'The WBCSD price-ratio rule cannot be applied: no co-product prices are set at the concept
    stage. Energy (LHV) is used because the fuel gas co-product is an energy carrier sold to the site
    fuel system and the products are all fuels or hydrocarbons with similar LHVs; mass would give the
    high-LHV fuel gas a smaller share than its energy content (D-013).'
