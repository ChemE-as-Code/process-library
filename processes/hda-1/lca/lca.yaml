# Goal and scope of the HDA-1 preliminary LCI. Schema: `cheme schema lca`. Outputs: `cheme
# assess lca --write` (lca/inventory.csv, results.csv, results.md, gaps.csv, dataset.yaml,
# manifest.json); never edit those by hand.
#
# A cradle-to-gate study with the foreground inventory only (DESIGN.md D-013): every
# exchange comes from the balanced flowsheet (process/flowsheet.yaml, design case). No
# background is linked yet: every feed, utility and avoided product is `missing:` with the
# activity it should connect to later, so the inventory carries them as gaps (never 0) and no
# impact result is claimed (process.yaml lca.source none keeps the generated all-gap total
# out of the catalog). Omissions known in DESIGN.md are declared below (emission_exclusions,
# cutoff). No values from licensed databases are used.
schema: cheme/lca/v1
kind: lca
goal: >-
  Preliminary cradle-to-gate life cycle inventory of benzene from thermal toluene
  hydrodealkylation at the concept stage (issue #302), foreground inventory only: the
  foreground exchanges per kg of benzene at the plant gate, with their provenance; the
  upstream (every background) is a gap until background datasets are chosen. Not an impact assessment: no background is
  linked (D-013).
functional_unit: {product: BENZENE, amount: 1, unit: kg}
boundary: cradle-to-gate
case: design
location: GLO
year: 2026
technology: "thermal toluene hydrodealkylation, adiabatic reactor 895-937 K / 3.4 MPa, H2 recycle with purge, stabiliser, benzene and vacuum toluene columns; 100 kt/a benzene, concept design"
rights: "CC-BY-4.0: the ChemE-as-Code process library's own concept design (LICENSE-DATA)"
# system_model unset (cut-off, the Atlas default): the exported dataset is allocated by energy;
# system expansion is computed as a comparison only (D-013).
allocation:
  method: energy
  coproducts: [BENZENE, DIPHENYL, FUELGAS]
  source: >-
    D-013 (agent proposal, for the LCA practitioner to confirm): energy (LHV) allocation as the
    exported default, because the library's LCI export takes one activity per co-product and
    so only a proportional method; system expansion (ISO 14044's preference: the fuel gas
    displaces natural gas firing at the site fuel header, the biphenyl displaces biphenyl made
    otherwise or fuel oil when burned) and mass allocation are computed for comparison. Both
    avoided productions have no background yet (gaps).
  deviation: >-
    The WBCSD price-ratio rule cannot be applied: no co-product prices are set at the concept
    stage. Energy (LHV) is used because the fuel gas co-product is an energy carrier sold to the site fuel system and the products are all fuels or
    hydrocarbons with similar LHVs; mass would give the high-LHV fuel gas a smaller share than its energy content (D-013).
  substitution:
    FUELGAS: {missing: "no background chosen yet: heat from natural gas in an industrial furnace, per MJ LHV of the fuel gas (site fuel system), market for the site's region", source: "purge and stabiliser off-gas burned in the site fuel gas header (D-009)"}
    DIPHENYL: {missing: "no background chosen yet: biphenyl production (e.g. from benzene dehydrocondensation) or, when it is burned, heavy fuel oil per MJ LHV", source: "biphenyl by-product sold or burned (D-009)"}
  compare: [substitution, mass]
  # LHV per kg, ideal gas at 298.15 K, from the formation enthalpies of process/materials.yaml
  # and CO2(g) -393.51, H2O(g) -241.826 kJ/mol (CODATA key values, Cox et al. 1989); the
  # mixtures by their flowsheet compositions (S21, S24, S13 + S19). Calculated, D-013.
  # Gas basis kept for the liquid products on purpose: benzene and biphenyl on the same
  # basis as the gaseous fuel gas, and a liquid basis (benzene ~40.1 MJ/kg) moves benzene's
  # energy share by well under 1 percentage point (review 2026-10-27-pfd-lci-review#8).
  properties:
    BENZENE: {energy: 40580, source: "LHV of S21 (99.9 mol% benzene, 0.1 % toluene) from formation enthalpies, gas basis (D-013)"}
    DIPHENYL: {energy: 39680, source: "LHV of S24 (95.1 mol% biphenyl, 4.9 % toluene, simulated, D-022) from formation enthalpies, gas basis (D-013)"}
    FUELGAS: {energy: 54230, source: "LHV of S13 + S19 (H2, CH4, benzene, toluene; mass-weighted) from formation enthalpies, simulated streams of D-022 (D-013)"}
flows:
  - {key: feed:TOLF, missing: "no background chosen yet: toluene, liquid, market for (aromatics extraction from catalytic reformate or pyrolysis gasoline at a refinery or steam cracker), delivered to the plant", source: "fresh toluene S1 (design basis D-003; composition from the BPCL toluene data sheet, D-020)"}
  - {key: feed:H2MU, missing: "no background chosen yet: hydrogen of PSA grade (99.9 mol%, the rest taken as methane) at 3.7 MPa, e.g. from steam methane reforming with PSA or a refinery hydrogen network; a two-component feed: link a hydrogen activity per kg H2 and count the CH4 with it, or split it", source: "make-up hydrogen S4 (D-003, D-020)"}
  - {key: feed:POWER, missing: "no background chosen yet: electricity, medium voltage, market for the site's grid (site not chosen)", source: "recycle compressor K-101, toluene pump P-101 and quench pump P-102 (Q1, Q2; D-010; Q12, D-022)"}
  - {key: feed:FUEL, missing: "no background chosen yet: heat, from natural gas, at an industrial furnace >100 kW (combustion emissions included in that activity), per MJ absorbed", source: "feed heater H-101 absorbed duty Q3 (D-009)"}
  - {key: feed:MPS, missing: "no background chosen yet: steam, in chemical industry, 1500 kPa(a) (site boiler on natural gas), per MJ of condensing heat", source: "stabiliser reboiler Q5 (D-010)"}
  - {key: feed:LPS, missing: "no background chosen yet: steam, in chemical industry, 450 kPa(a), per MJ of condensing heat", source: "benzene column reboiler Q7 (D-010)"}
  - {key: feed:HPS, missing: "no background chosen yet: steam, in chemical industry, 4200 kPa(a), per MJ of condensing heat", source: "toluene column reboiler Q9 (D-010)"}
  - {key: product:CW, missing: "no background chosen yet: cooling water circulation per MJ rejected (pump and fan electricity, make-up water withdrawal and evaporation, blowdown, treatment chemicals)", source: "heat to cooling water Q4, Q6, Q8, Q10 (D-010) and the product cooler E-207, Q11 (D-022)"}
emission_exclusions:
  - {id: heater-combustion, method: combustion, equipment: [H-101], reason: "the feed heater's combustion emissions (CO2, NOx, CO, CH4, N2O, PM) belong to the purchased-heat background of feed:FUEL (heat from natural gas at an industrial furnace), which is per MJ delivered and includes them; counting them here would double count (D-013)", source: "D-013"}
  - {id: storage-tanks, method: storage-tank, reason: "fresh toluene, benzene and biphenyl tanks are outside the battery limit (design basis): their breathing losses belong to the storage, not to this plant boundary (D-013)", source: "design basis"}
  - {id: fugitive-leaks, method: equipment-leaks, reason: "fugitive benzene, toluene, CH4 and H2 from flanges, seals, valves and the compressor are not estimated, not claimed negligible: an equipment-leak estimate needs the P&ID component counts, which do not exist at the concept stage; to become an emission_estimates entry once the P&IDs are drawn (DESIGN.md I-10, D-013)", source: "DESIGN.md I-10"}
  - {id: no-process-effluent, method: effluent, reason: "no process wastewater: water is neither fed nor formed, and the C-203 vacuum is taken as a dry vacuum pump (ASSUMED, D-008), which leaves no condensate; with steam ejectors instead, an aromatic-bearing ejector condensate would be a wastewater exchange to add (DESIGN.md I-08)", source: "D-008"}
cutoff:
  - {id: c203-vacuum-power, title: "C-203 vacuum system power", unit: kWh, per_year: 120000, reason: "dry vacuum pump on the C-203 overhead, about 15 kW x 8000 h/a (ASSUMED order of magnitude, not sized; D-008, I-08); not in the flowsheet's power feed", source: "D-008"}
  - {id: small-pumps-power, title: "reflux and distillate pumps power", unit: kWh, per_year: 120000, reason: "the reflux and distillate pumps of C-201, C-202 and C-203, each below about 5 kW, together about 15 kW x 8000 h/a (ASSUMED upper estimate; D-008, D-010); not in the flowsheet's power feed. The quench pump P-102 is no longer in this cut-off: since S2 it is a flowsheet step with its power Q12 in feed:POWER (D-022)", source: "D-008, D-010, D-022"}
operation:
  hours_per_year: 8000
  life_years: 25
  source: "design basis operating_hours_per_year 8000 (ASSUMED); 25 a service life ASSUMED; no construction inventory at this stage (D-013)"
dataset:
  version: 0.1.0
  geography: {description: "One concept design for a generic, not chosen site; no regional background"}
  system_model: cutoff   # energy-allocated, no avoided-burden credits in the exported dataset (D-013)
  technology_level: current
  classification: {isic: "2011", cpc: "34110"}
  modelling: {principle: attributional}
  review: unreviewed
  data_generator: "ChemE-as-Code process library, hda-1 concept run (agent-generated, unreviewed)"
