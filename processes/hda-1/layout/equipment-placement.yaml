# (D-018). Elevations (S5, D-027): the condensers and reflux drums are mounted on the column
# structures; items whose bottom outlet feeds a pump suction or whose bottom nozzles would
# otherwise lie below grade stand on concrete foundations (`plinth`, ASSUMED heights, review of
# PR #364): V-100 2.5 m, V-101 2.0 m, C-203 2.5 m (standing for a longer skirt), E-102 0.8 m,
# the reboilers E-202, E-204 and E-206 1.0 m. NPSH is not calculated: the heights give 2.2 to
# 5.8 m of static head over the pump suctions, ASSUMED until the pump datasheets (S7).
