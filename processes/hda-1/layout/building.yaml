# Buildings of the basic 3D layout (S5, D-027). Schema: `cheme schema building`.
# The substation and control building in the reserved area A-900 (D-018); its size, position
# and height are ASSUMED until the electrical and control room layouts. The compressors K-101
# and K-102 stand in the open (no compressor house, D-027): natural ventilation keeps hydrogen
# leaks from accumulating, so their hazardous zones stay zone 2 of limited extent; a closed
# house would need forced ventilation and gas detection and is no smaller to classify.
schema: cheme/building/v1
buildings:
  - id: ECB-1
    title: Substation and control building (MV switchgear, MCC, rack room, control room)
    use: substation
    origin: [26, 20]
    width: 28
    depth: 14
    levels:
      - {id: L0, title: Ground floor, elevation: 0.0, height: 5.0}
    walls: all
notes: >-
  ASSUMED (D-027): one single-storey building 28 x 14 x 5 m for the 10 kV and 400 V
  switchgear, the motor control centre, the instrument rack room and the control room, at the
  west end of A-900, the end farthest from the hydrogen machinery; blast rating and the
  occupied building assessment (API RP 752 type) are not done here.
