# Zones of the basic 3D layout (S5, D-027). Schema: `cheme schema zones`.
# Screening only: the hazardous volumes from sources are sized by cheme-as-code's indicative
# radius table (ASSUMED), not by an area classification. The site's classification (IEC
# 60079-10-1 or EI 15 for hydrogen, methane and the aromatics) must replace them, made or
# reviewed by a competent person; no Ex rating may rest on these volumes. Crane pads, laydown
# areas, their reach, the escape routes and the keep-clear areas are ASSUMED choices of this design for the lifting
# study and the layout review (no crane has been selected, no load chart is given: a 40 m
# working radius stands for a large mobile crane).
schema: cheme/zones/v1
zones:
  # ---- hazardous areas, secondary grade sources (release only on failure): zone 2
  - id: Z-HAZ-K101
    title: "Recycle gas compressor K-101 seals (hydrogen-rich recycle gas, 36 bar)"
    kind: hazardous
    zone: 2
    sources:
      - {item: K-101, release_grade: secondary, substance: hydrogen, source_kind: compressor_seal}
    basis: "Dry gas seals of a hydrogen-rich recycle compressor leak only on failure (secondary grade), D-027."
  - id: Z-HAZ-K102
    title: "Tail-gas compressor K-102 rod packings (methane-rich PSA tail gas)"
    kind: hazardous
    zone: 2
    sources:
      - {item: K-102, release_grade: secondary, substance: methane, source_kind: compressor_seal}
    basis: "Rod packings of a reciprocating machine vent to a closed distance piece; a leak to atmosphere only on failure (secondary), D-027. A packing vent to atmosphere would be primary grade: the packing vents go to the flare (P&ID, S8)."
  - id: Z-HAZ-PK101
    title: "Purge hydrogen PSA PK-101 switching valves"
    kind: hazardous
    zone: 2
    sources:
      - {item: PK-101, release_grade: secondary, substance: hydrogen, source_kind: valve}
    basis: "The PSA's switching valves cycle hydrogen-rich gas every few minutes; their stem seals leak only on failure (secondary), D-027. The vendor's own classification of the skid replaces this."
  - id: Z-HAZ-PK201
    title: "Toluene column vacuum package PK-201"
    kind: hazardous
    zone: 2
    sources:
      - {item: PK-201, release_grade: secondary, substance: toluene, source_kind: compressor_seal, substance_class: flammable_gas}
    basis: "The vacuum pump draws toluene vapour and inerts from V-203; its shaft seal leaks only on failure (secondary), D-027."
  - id: Z-HAZ-PUMPS-A100
    title: "Toluene feed and quench pump seals (P-101, P-101B, P-102, P-102B)"
    kind: hazardous
    zone: 2
    sources:
      - {item: P-101, release_grade: secondary, substance: toluene, source_kind: pump_seal}
      - {item: P-101B, release_grade: secondary, substance: toluene, source_kind: pump_seal}
      - {item: P-102, release_grade: secondary, substance: benzene, source_kind: pump_seal}
      - {item: P-102B, release_grade: secondary, substance: benzene, source_kind: pump_seal}
    basis: "Mechanical seals on toluene and crude aromatics (mostly benzene, with dissolved hydrogen and methane): secondary grade, D-027."
  - id: Z-HAZ-PUMPS-A200
    title: "Column pump seals (P-201A/B, P-202A/B, P-203A/B, P-204A/B)"
    kind: hazardous
    zone: 2
    sources:
      - {item: P-201A, release_grade: secondary, substance: benzene, source_kind: pump_seal}
      - {item: P-201B, release_grade: secondary, substance: benzene, source_kind: pump_seal}
      - {item: P-202A, release_grade: secondary, substance: benzene, source_kind: pump_seal}
      - {item: P-202B, release_grade: secondary, substance: benzene, source_kind: pump_seal}
      - {item: P-203A, release_grade: secondary, substance: toluene, source_kind: pump_seal}
      - {item: P-203B, release_grade: secondary, substance: toluene, source_kind: pump_seal}
      - {item: P-204A, release_grade: secondary, substance: biphenyl, source_kind: pump_seal, substance_class: flammable_liquid}
      - {item: P-204B, release_grade: secondary, substance: biphenyl, source_kind: pump_seal, substance_class: flammable_liquid}
    basis: "Seals on benzene, toluene and biphenyl; biphenyl is pumped at about 457 K, above its flash point, so it counts as a flammable liquid (D-027)."
  # ---- flanged joints in flammable service, secondary grade (S5 fix, review of PR #364): the
  # hot hydrogen loop and the column overheads. All-welded lines are not sources; the flanged
  # nozzles of these items are (Bottrill et al. 2005, 3.13, principles only). The coil
  # connections of the fired heater H-101 are left out: H-101 is the ignition source the
  # separations are measured from, and its coil flanges lie inside the heater's own boundary.
  - id: Z-HAZ-H2LOOP
    title: "Hot hydrogen loop flanges: E-101 shells, R-101 inlet and outlet, V-101 inlet and gas outlet (42 barg)"
    kind: hazardous
    zone: 2
    sources:
      - {item: E-101/T1, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: E-101/T2, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: E-101/S1, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: E-101/S2, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: R-101/N1, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: R-101/N2, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: V-101/N1, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: V-101/N2, release_grade: secondary, substance: hydrogen, source_kind: flange}
    basis: "Gasketed nozzle flanges of the hydrogen-rich reactor loop leak only on failure (secondary grade); D-018 names the E-101 flanges (42 barg hot hydrogen) as a leak concern. Radius from the indicative table (ASSUMED), S5 fix, D-027."
  - id: Z-HAZ-OVHD
    title: "Column overhead and condenser inlet flanges (C-201, C-202, C-203; E-201, E-203, E-205)"
    kind: hazardous
    zone: 2
    sources:
      - {item: C-201/N2, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: E-201/T1, release_grade: secondary, substance: methane, source_kind: flange}
      - {item: C-202/N2, release_grade: secondary, substance: benzene, source_kind: flange, substance_class: flammable_gas}
      - {item: E-203/T1, release_grade: secondary, substance: benzene, source_kind: flange, substance_class: flammable_gas}
      - {item: C-203/N2, release_grade: secondary, substance: toluene, source_kind: flange, substance_class: flammable_gas}
      - {item: E-205/T1, release_grade: secondary, substance: toluene, source_kind: flange, substance_class: flammable_gas}
    basis: "Overhead vapour flanges (stabiliser light ends with methane and hydrogen; benzene and toluene vapour) leak only on failure (secondary grade). C-203 runs under vacuum, where a leak draws air in rather than releasing vapour; it is kept as a source for upsets and start-up. Radius from the indicative table (ASSUMED), S5 fix, D-027."
  # ---- escape routes (S5 fix, review of PR #364): from the process areas and the foot of each
  # structure stair or second-way ladder to the nearest road, away from H-101, kept clear of
  # pipes and steel up to the 2.2 m walkway headroom (ASSUMED widths of 1.2 to 1.5 m; the owner
  # escape route standard confirms them, a question for the layout review S5r)
  - {id: Z-ESC-A100-N, title: "Escape route A-100 north: from the R-101/V-101/E-101 area to road R-2, east of R-101 and away from H-101", kind: escape, shape: box, box: [70, 84.5, 0, 71.5, 115, 2.2], basis: "ASSUMED route between CP-107 and K-101 (D-027)."}
  - {id: Z-ESC-A100-E, title: "Escape route A-100 east: from E-102, P-102 and K-102 to the access road R-5", kind: escape, shape: box, box: [80.5, 61.8, 0, 92, 63.2, 2.2], basis: "ASSUMED route south of E-103 (D-027)."}
  - {id: Z-ESC-S201, title: "Escape route from the S-201 second-way ladder foot (north-west corner) to road R-5", kind: escape, shape: box, box: [98, 68.4, 0, 100.3, 69.6, 2.2], basis: "ASSUMED; the main way down is the stair ST-1 on the east side, whose foot opens into A-200 (D-027)."}
  - {id: Z-ESC-S202, title: "Escape route from the S-202 stair ST-1 foot (north side) to road R-2", kind: escape, shape: box, box: [119.2, 104.2, 0, 120.7, 115, 2.2], basis: "ASSUMED, west of the stair foot (D-027)."}
  - {id: Z-ESC-S203, title: "Escape route from the S-203 stair ST-1 foot (south side) east to road R-4", kind: escape, shape: box, box: [141.9, 56.4, 0, 169, 57.9, 2.2], basis: "ASSUMED, between PR-1 and PK-201, away from H-101 (D-027)."}
  # ---- keep-clear areas (S5 fix, review of PR #364), ASSUMED
  - {id: KC-R5-FIRE, title: "Fire-fighting access strip beside road R-5 (hydrants, monitors) along PK-101, K-102 and E-103", kind: keep_clear, shape: box, box: [89.2, 60, 0, 91.6, 110, 2.5], basis: "ASSUMED: the 3 m between the purge hydrogen items and R-5 (D-024) kept free for fire-fighting equipment and hoses (D-027)."}
  - {id: KC-H101, title: "H-101 burner and air register access, west side (radiant tubes are replaced from above by crane from CP-101)", kind: keep_clear, shape: box, box: [31, 86, 0, 37, 97.5, 3], basis: "ASSUMED: a vertical cylindrical heater is fired from the floor; burner maintenance and tube work need the ground beside it free (D-027)."}
  - {id: KC-ECB1, title: "ECB-1 approach from road R-1 (fire brigade, transformer and switchgear exchange)", kind: keep_clear, shape: box, box: [26, 11.5, 0, 54, 19.5, 3], basis: "ASSUMED (D-027)."}
  # ---- bundle removal of the deck condensers (under the 5 t heavy-lift rule, not in the lifting
  # study): each bundle is pulled onto its deck with a portable puller and lifted off the deck by
  # the mobile crane from the pad named (within 40 m); the volume over the pulled bundle is
  # kept free of pipes (S5 fix, review of PR #364, D-027)
  - {id: MZ-E201, title: "E-201 bundle removal: pulled south onto the S-201 upper deck, lifted from CP-103", kind: maintenance, shape: box, box: [102.5, 59.4, 10.4, 103.5, 62.8, 25], basis: "ASSUMED (D-027)."}
  - {id: MZ-E203, title: "E-203 bundle removal: pulled south over the S-202 deck edge, lifted from CP-203", kind: maintenance, shape: box, box: [121.4, 91.8, 12.5, 122.6, 96.9, 25], basis: "ASSUMED (D-027)."}
  - {id: MZ-E205, title: "E-205 bundle removal: pulled west onto the S-203 upper deck, lifted from CP-202", kind: maintenance, shape: box, box: [143.8, 64.5, 10.7, 147.7, 65.5, 25], basis: "ASSUMED (D-027)."}
  # ---- crane pads (where the mobile crane stands) and laydown areas, ASSUMED (D-027)
  - {id: CP-101, title: "Crane pad A-100 north (H-101, R-101)", kind: crane_pad, shape: box, box: [45, 101, 0, 56, 111, 0.3], reach_m: 40, basis: "ASSUMED pad between the fired heater and the reactor, from the north road R-2 (D-027)."}
  - {id: CP-102, title: "Crane pad A-100 centre (E-101, E-102, V-101)", kind: crane_pad, shape: box, box: [47, 74, 0, 57, 84, 0.3], reach_m: 40, basis: "ASSUMED pad west of the exchanger row (D-027)."}
  - {id: CP-103, title: "Crane pad on road R-5 (PK-101, K-102, K-101)", kind: crane_pad, shape: box, box: [92, 70, 0, 98, 92, 0.3], reach_m: 40, basis: "ASSUMED: the crane stands on the access road R-5 beside the PSA and the tail-gas compressor; the road is closed for the lift (D-027)."}
  - {id: CP-104, title: "Crane pad A-100 north-east (K-101)", kind: crane_pad, shape: box, box: [76, 104, 0, 86, 112, 0.3], reach_m: 40, basis: "ASSUMED pad north of the recycle compressor, from R-2 (D-027)."}
  - {id: CP-201, title: "Crane pad A-200 north (C-202, E-204)", kind: crane_pad, shape: box, box: [127, 104.5, 0, 137, 112, 0.3], reach_m: 40, basis: "ASSUMED pad north of the benzene column, from R-2 (D-027)."}
  - {id: CP-202, title: "Crane pad A-200 east (C-203)", kind: crane_pad, shape: box, box: [155, 85, 0, 165, 93, 0.3], reach_m: 40, basis: "ASSUMED pad north-east of the toluene column, from R-4 (D-027)."}
  - {id: CP-203, title: "Crane pad E-204 (east of the benzene column reboiler)", kind: crane_pad, shape: box, box: [138.6, 94, 0, 146.6, 102, 0.3], reach_m: 40, basis: "ASSUMED pad east of E-204, its lane clear of TO-122 (found with scripts/pad_search.py, D-027)."}
  - {id: CP-105, title: "Crane pad E-101 (south of the feed/effluent exchanger)", kind: crane_pad, shape: box, box: [59.5, 56.5, 0, 68.5, 63.0, 0.3], reach_m: 40, basis: "ASSUMED pad between PR-1 and E-101 (D-027)."}
  - {id: CP-106, title: "Crane pad E-102 (south of the trim cooler)", kind: crane_pad, shape: box, box: [72, 56.5, 0, 80, 61.5, 0.3], reach_m: 40, basis: "ASSUMED pad between PR-1 and E-102 (D-027)."}
  - {id: CP-107, title: "Crane pad V-101 (west of the high-pressure separator)", kind: crane_pad, shape: box, box: [65.3, 76, 0, 72.3, 84, 0.3], reach_m: 40, basis: "ASSUMED pad west of V-101, its lane clear (found with scripts/pad_search.py, D-027)."}
  # lift lanes kept free of pipes by design: maintenance volumes from the pad over the
  # exchangers whose shells and bundles are lifted out, from just above their tops; the router
  # keeps pipes out of them (D-027)
  - {id: MZ-E101, title: "Lift lane CP-105 to the feed/effluent exchanger E-101 (both shells)", kind: maintenance, shape: box, box: [58.5, 63.0, 4.0, 69.5, 71.8, 25], basis: "ASSUMED: E-101 shells are lifted from CP-105 (D-027)."}
