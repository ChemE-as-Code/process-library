# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Thermal toluene hydrodealkylation (D-001). Where the values come from:
# - the feeds' compositions and all temperatures and pressures are design choices (design
#   basis, D-003, D-004, D-008), ASSUMED;
# - the feed flows S1 and S4 come from the independent balance scripts/hda_balance.py (D-006),
#   ASSUMED;
# - the other stream values and the duties are calculated: by `cheme process propagate --fill`
#   (mixers, splitters, pass-throughs, the conversion reactor with the D-005 selectivity) and by
#   `cheme process simulate --fill` (DWSIM, Peng-Robinson, D-014). Peng-Robinson is not
#   qualified by core for aromatics with hydrogen (core#315): the simulated values are a second
#   implementation's check of the script, not validated data;
# - left from the script: the stabiliser C-201's duties Q5 and Q6 (D-014).
schema: cheme/process/v1
kind: flowsheet
title: Toluene hydrodealkylation to benzene (100 kt/a, thermal HDA)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 12.5 t/h benzene, toluene conversion 0.75 per pass, H2/aromatics 5, purge 40 mol% H2 (D-002, D-005, D-007)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: TOLF, title: Fresh toluene, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: H2MU, title: Make-up hydrogen (95 mol% H2), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports: [{id: p101, direction: out, kind: energy}, {id: k101, direction: out, kind: energy}]
  - id: FUEL
    title: Fired heat from natural gas (feed heater)
    category: utility
    utility:
      kind: fired_heat
      level: natural gas firing
      supply_temperature: {value: 1200, provenance: assumed, source: "D-010: flue gas leaving the radiant section, a concept value"}
      min_approach: {value: 50, provenance: assumed, source: D-010}
    ports: [{id: h101, direction: out, kind: energy}]
  - id: MPS
    title: MP steam 1500 kPa(a)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1500, provenance: assumed, source: "design basis, D-010"}
      supply_temperature: {value: 471.4, provenance: assumed, source: "saturation at 1500 kPa(a), D-010"}
      min_approach: {value: 10, provenance: assumed, source: D-010}
    ports: [{id: c201, direction: out, kind: energy}]
  - id: LPS
    title: LP steam 450 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis, D-010"}
      supply_temperature: {value: 420.8, provenance: assumed, source: "saturation at 450 kPa(a), D-010"}
      min_approach: {value: 10, provenance: assumed, source: D-010}
    ports: [{id: c202, direction: out, kind: energy}]
  - id: HPS
    title: HP steam 4200 kPa(a)
    category: utility
    utility:
      kind: steam
      level: HP
      pressure: {value: 4200, provenance: assumed, source: "design basis, D-010"}
      supply_temperature: {value: 526.4, provenance: assumed, source: "saturation at 4200 kPa(a), D-010"}
      min_approach: {value: 10, provenance: assumed, source: D-010}
    ports: [{id: c203, direction: out, kind: energy}]
products:
  - {id: BENZENE, title: Benzene to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: DIPHENYL, title: Biphenyl (diphenyl) by-product, category: by_product, ports: [{id: in, direction: in}]}
  - id: FUELGAS
    title: Purge gas and stabiliser off-gas to the fuel gas header
    category: off_gas
    ports: [{id: purge, direction: in}, {id: stab, direction: in}]
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-010"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-010"}
      min_approach: {value: 5, provenance: assumed, source: D-010}
    ports:
      - {id: e102, direction: in, kind: energy}
      - {id: c201, direction: in, kind: energy}
      - {id: c202, direction: in, kind: energy}
      - {id: c203, direction: in, kind: energy}

blocks:
  - id: RXN
    title: Reaction, quench, separation and gas recycle
    class: ReactingChemicals
    ports:
      - {id: tol, direction: in}
      - {id: h2, direction: in}
      - {id: tolrec, direction: in}
      - {id: purge, direction: out}
      - {id: liquid, direction: out}
      - {id: power1, direction: in, kind: energy}
      - {id: power2, direction: in, kind: energy}
      - {id: fuel, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: SEP
    title: Stabilisation and benzene / toluene / biphenyl distillation
    class: Distilling
    ports:
      - {id: feed, direction: in}
      - {id: offgas, direction: out}
      - {id: benzene, direction: out}
      - {id: tolrec, direction: out}
      - {id: biph, direction: out}
      - {id: steam1, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: steam3, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: cw3, direction: out, kind: energy}

steps:
  - id: M100
    block: RXN
    title: Toluene feed drum (fresh + recycle)
    class: Mixing
    links: [{target: equipment, ref: V-100}]
    ports:
      - {id: fresh, direction: in, delegates: tol}
      - {id: rec, direction: in, delegates: tolrec}
      - {id: out, direction: out}
  - id: P101
    block: RXN
    title: Toluene feed pump
    # Pumping since core v1.4.1 builds it (the 0.8.0 build failure of D-011 is gone; D-016).
    class: Pumping
    links: [{target: equipment, ref: P-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power1}
  - id: M101
    block: RXN
    title: Feed / make-up hydrogen / recycle gas junction
    class: Mixing
    ports:
      - {id: tol, direction: in}
      - {id: h2, direction: in, delegates: h2}
      - {id: rec, direction: in}
      - {id: out, direction: out}
  - id: E101
    block: RXN
    title: Feed / effluent exchanger
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: cold_in, direction: in}
      - {id: cold_out, direction: out}
      - {id: hot_in, direction: in}
      - {id: hot_out, direction: out}
  - id: H101
    block: RXN
    title: Reactor feed heater (fired)
    # HeatingInFurnace: core v1.4.1 builds it (the 0.8.0 TypeError of D-011 is gone; D-016).
    class: HeatingInFurnace
    links: [{target: equipment, ref: H-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: fuel, direction: in, kind: energy, delegates: fuel}
  # D-004, D-005: adiabatic thermal reactor; toluene conversion 0.75 per pass (ASSUMED) and the
  # Douglas (1988) benzene selectivity S = 1 - 0.0036/(1 - 0.75)^1.544 = 0.9693886. D-014: given
  # as the toluene conversions of HDA (X * S) and HDABP (X * (1 - S)) in reactions.yaml, the same
  # extents as the selectivity, because DWSIM takes one conversion per reaction.
  - id: R101
    block: RXN
    title: HDA reactor (adiabatic, thermal)
    class: ReactingChemicals
    reactions: [HDA, HDABP]
    reactor: conversion
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: Q101
    block: RXN
    title: Effluent quench (separator liquid)
    class: Mixing
    ports:
      - {id: in, direction: in}
      - {id: quench, direction: in}
      - {id: out, direction: out}
  - id: E102
    block: RXN
    title: Effluent trim cooler
    class: Cooling
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: V101
    block: RXN
    title: High-pressure separator
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: in, direction: in}
      - {id: vap, direction: out}
      - {id: liq, direction: out}
  # D-007: the purge fraction that gives 40 mol% H2 in the purge at H2/aromatics 5 (scripts/hda_balance.py).
  - id: SPL1
    block: RXN
    title: Purge take-off
    class: SplittingMaterial
    split: {purge: 0.111359564}
    ports:
      - {id: in, direction: in}
      - {id: purge, direction: out, delegates: purge}
      - {id: recycle, direction: out}
  - id: K101
    block: RXN
    title: Recycle gas compressor
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power2}
  # D-004: the quench fraction of the separator liquid that cools the effluent to 893.15 K.
  - id: SPL2
    block: RXN
    title: Quench liquid take-off
    class: SplittingMaterial
    split: {quench: 0.233773864}
    links: [{target: equipment, ref: P-102}]
    ports:
      - {id: in, direction: in}
      - {id: quench, direction: out}
      - {id: net, direction: out, delegates: liquid}
  - id: C201
    block: SEP
    title: Stabiliser
    class: Distilling
    links: [{target: equipment, ref: C-201}, {target: equipment, ref: E-201}, {target: equipment, ref: E-202}]
    ports:
      - {id: feed, direction: in, delegates: feed}
      - {id: top, direction: out, delegates: offgas}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: steam1}
      - {id: cond, direction: out, kind: energy, delegates: cw1}
  - id: C202
    block: SEP
    title: Benzene column
    class: Distilling
    links: [{target: equipment, ref: C-202}, {target: equipment, ref: E-203}, {target: equipment, ref: E-204}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out, delegates: benzene}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: steam2}
      - {id: cond, direction: out, kind: energy, delegates: cw2}
  - id: C203
    block: SEP
    title: Toluene column (vacuum)
    class: Distilling
    links: [{target: equipment, ref: C-203}, {target: equipment, ref: E-205}, {target: equipment, ref: E-206}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out, delegates: tolrec}
      - {id: bot, direction: out, delegates: biph}
      - {id: reb, direction: in, kind: energy, delegates: steam3}
      - {id: cond, direction: out, kind: energy, delegates: cw3}

streams:
  - id: S1
    title: Fresh toluene
    from: TOLF.out
    to: M100.fresh
    template: mixture
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: "design basis, D-003"}
        temperature: {value: 303.15, provenance: assumed, source: "design basis, D-003"}
        flow: {value: 15518.29, basis: mass, provenance: assumed, source: "scripts/hda_balance.py: the fresh toluene that gives 12.5 t/h benzene (D-002, D-006)"}
