# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Thermal toluene hydrodealkylation (D-001). Where the values come from:
# - the feeds' compositions are given from published specifications (D-020: a commercial
#   toluene data sheet, a published PSA hydrogen purity); all temperatures and pressures are
#   design choices (design basis, D-003, D-004, D-008), ASSUMED;
# - the feed flows S1 and S4 follow from the design capacity through the independent balance
#   scripts/hda_balance.py (D-006, D-020), given with that source;
# - the other stream values and the duties are calculated: by `cheme process propagate --fill`
#   (mixers, splitters, pass-throughs, the conversion reactor R101 at the D-021 conversion) and by
#   `cheme process simulate --fill` (DWSIM, Peng-Robinson, D-014). Peng-Robinson is not
#   qualified by core for aromatics with hydrogen (core#315): the simulated values are a second
#   implementation's check of the script, not validated data;
# - left from the script: the stabiliser C-201's duties Q5 and Q6 (D-014).
schema: cheme/process/v1
kind: flowsheet
title: Toluene hydrodealkylation to benzene (100 kt/a, thermal HDA)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 12.5 t/h benzene, toluene conversion 0.75 per pass, H2/aromatics 5, purge 40 mol% H2 (D-002, D-021, D-007)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: TOLF, title: Fresh toluene, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: H2MU, title: "Make-up hydrogen (PSA grade, 99.9 mol% H2)", category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports: [{id: p101, direction: out, kind: energy}, {id: k101, direction: out, kind: energy}, {id: p102, direction: out, kind: energy}]
  - id: FUEL
    title: Fired heat from natural gas (feed heater)
    category: utility
    utility:
      kind: fired_heat
      level: natural gas firing
      supply_temperature: {value: 1200, provenance: assumed, source: "D-010: flue gas leaving the radiant section, a concept value"}
      min_approach: {value: 50, provenance: assumed, source: D-010}
    ports: [{id: h101, direction: out, kind: energy}]
  - id: MPS
    title: MP steam 1500 kPa(a)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1500, provenance: assumed, source: "design basis, D-010"}
      supply_temperature: {value: 471.4, provenance: assumed, source: "saturation at 1500 kPa(a), D-010"}
      min_approach: {value: 10, provenance: assumed, source: D-010}
    ports: [{id: c201, direction: out, kind: energy}]
  - id: LPS
    title: LP steam 450 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis, D-010"}
      supply_temperature: {value: 420.8, provenance: assumed, source: "saturation at 450 kPa(a), D-010"}
      min_approach: {value: 10, provenance: assumed, source: D-010}
    ports: [{id: c202, direction: out, kind: energy}]
  - id: HPS
    title: HP steam 4200 kPa(a)
    category: utility
    utility:
      kind: steam
      level: HP
      pressure: {value: 4200, provenance: assumed, source: "design basis, D-010"}
      supply_temperature: {value: 526.4, provenance: assumed, source: "saturation at 4200 kPa(a), D-010"}
      min_approach: {value: 10, provenance: assumed, source: D-010}
    ports: [{id: c203, direction: out, kind: energy}]
products:
  - {id: BENZENE, title: Benzene to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: DIPHENYL, title: Biphenyl (diphenyl) by-product, category: by_product, ports: [{id: in, direction: in}]}
  - id: FUELGAS
    title: Purge gas and stabiliser off-gas to the fuel gas header
    category: off_gas
    ports: [{id: purge, direction: in}, {id: stab, direction: in}]
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-010"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-010"}
      min_approach: {value: 5, provenance: assumed, source: D-010}
    ports:
      - {id: e102, direction: in, kind: energy}
      - {id: c201, direction: in, kind: energy}
      - {id: c202, direction: in, kind: energy}
      - {id: c203, direction: in, kind: energy}
      - {id: e207, direction: in, kind: energy}

blocks:
  - id: RXN
    title: Reaction, quench, separation and gas recycle
    class: ReactingChemicals
    ports:
      - {id: tol, direction: in}
      - {id: h2, direction: in}
      - {id: tolrec, direction: in}
      - {id: purge, direction: out}
      - {id: liquid, direction: out}
      - {id: power1, direction: in, kind: energy}
      - {id: power2, direction: in, kind: energy}
      - {id: power3, direction: in, kind: energy}
      - {id: fuel, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: SEP
    title: Stabilisation and benzene / toluene / biphenyl distillation
    class: Distilling
    ports:
      - {id: feed, direction: in}
      - {id: offgas, direction: out}
      - {id: benzene, direction: out}
      - {id: tolrec, direction: out}
      - {id: biph, direction: out}
      - {id: steam1, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: steam3, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: cw3, direction: out, kind: energy}
      - {id: cw4, direction: out, kind: energy}

steps:
  - id: M100
    block: RXN
    title: Toluene feed drum (fresh + recycle)
    class: Mixing
    links: [{target: equipment, ref: V-100}]
    ports:
      - {id: fresh, direction: in, delegates: tol}
      - {id: rec, direction: in, delegates: tolrec}
      - {id: out, direction: out}
  - id: P101
    block: RXN
    title: Toluene feed pump
    # Pumping since core v1.4.1 builds it (the 0.8.0 build failure of D-011 is gone; D-016).
    class: Pumping
    links: [{target: equipment, ref: P-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power1}
  - id: M101
    block: RXN
    title: Feed / make-up hydrogen / recycle gas junction
    class: Mixing
    ports:
      - {id: tol, direction: in}
      - {id: h2, direction: in, delegates: h2}
      - {id: rec, direction: in}
      - {id: out, direction: out}
  - id: E101
    block: RXN
    title: Feed / effluent exchanger
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: cold_in, direction: in}
      - {id: cold_out, direction: out}
      - {id: hot_in, direction: in}
      - {id: hot_out, direction: out}
  - id: H101
    block: RXN
    title: Reactor feed heater (fired)
    # HeatingInFurnace: core v1.4.1 builds it (the 0.8.0 TypeError of D-011 is gone; D-016).
    class: HeatingInFurnace
    links: [{target: equipment, ref: H-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: fuel, direction: in, kind: energy, delegates: fuel}
  # D-004, D-021: adiabatic thermal reactor R-101, modelled in two steps of the one vessel:
  # R101 runs HDA at the per-pass toluene conversion 0.75 of a published thermal HDA process
  # (reactions.yaml, US 3,291,849); R101B takes the biphenyl reaction BIPH to equilibrium at the
  # adiabatic outlet (formation data of materials.yaml), the most biphenyl the benzene can form.
  # Superseded: D-005's recalled Douglas selectivity and D-014's lumped HDABP reaction.
  - id: R101
    block: RXN
    title: "HDA reactor R-101 (adiabatic, thermal): toluene dealkylation"
    class: ReactingChemicals
    reactions: [HDA]
    reactor: conversion
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: R101B
    block: RXN
    title: "HDA reactor R-101 (same vessel): biphenyl equilibrium"
    class: ReactingChemicals
    reactions: [BIPH]
    reactor: equilibrium
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: Q101
    block: RXN
    title: Effluent quench (separator liquid)
    class: Mixing
    ports:
      - {id: in, direction: in}
      - {id: quench, direction: in}
      - {id: out, direction: out}
  - id: E102
    block: RXN
    title: Effluent trim cooler
    class: Cooling
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: V101
    block: RXN
    title: High-pressure separator
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: in, direction: in}
      - {id: vap, direction: out}
      - {id: liq, direction: out}
  # D-007: the purge fraction that gives 40 mol% H2 in the purge at H2/aromatics 5 (scripts/hda_balance.py, D-020/D-021 feeds and reactor).
  - id: SPL1
    block: RXN
    title: Purge take-off
    class: SplittingMaterial
    split: {purge: 0.1017477}
    ports:
      - {id: in, direction: in}
      - {id: purge, direction: out, delegates: purge}
      - {id: recycle, direction: out}
  - id: K101
    block: RXN
    title: Recycle gas compressor
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power2}
  # D-004: the quench fraction of the separator liquid that cools the effluent to 893.15 K.
  - id: SPL2
    block: RXN
    title: Quench liquid take-off
    class: SplittingMaterial
    split: {quench: 0.2336845}
    ports:
      - {id: in, direction: in}
      - {id: quench, direction: out}
      - {id: net, direction: out, delegates: liquid}
  # D-022: the quench pump as its own step (core v1.4.1 builds Pumping, D-016), so the quench
  # reaches Q101 at the pump discharge instead of the separator pressure (D-014 deviation).
  - id: P102
    block: RXN
    title: Quench pump
    class: Pumping
    links: [{target: equipment, ref: P-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power3}
  - id: C201
    block: SEP
    title: Stabiliser
    class: Distilling
    links: [{target: equipment, ref: C-201}, {target: equipment, ref: E-201}, {target: equipment, ref: E-202}]
    ports:
      - {id: feed, direction: in, delegates: feed}
      - {id: top, direction: out, delegates: offgas}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: steam1}
      - {id: cond, direction: out, kind: energy, delegates: cw1}
  - id: C202
    block: SEP
    title: Benzene column
    class: Distilling
    links: [{target: equipment, ref: C-202}, {target: equipment, ref: E-203}, {target: equipment, ref: E-204}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: steam2}
      - {id: cond, direction: out, kind: energy, delegates: cw2}
  # D-022 (I-12): the benzene product cooler E-207, distillate to 313.15 K against cooling water.
  - id: E207
    block: SEP
    title: Benzene product cooler
    class: Cooling
    links: [{target: equipment, ref: E-207}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: benzene}
      - {id: cw, direction: out, kind: energy, delegates: cw4}
  - id: C203
    block: SEP
    title: Toluene column (vacuum)
    class: Distilling
    links: [{target: equipment, ref: C-203}, {target: equipment, ref: E-205}, {target: equipment, ref: E-206}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out, delegates: tolrec}
      - {id: bot, direction: out, delegates: biph}
      - {id: reb, direction: in, kind: energy, delegates: steam3}
      - {id: cond, direction: out, kind: energy, delegates: cw3}

streams:
  - id: S1
    title: Fresh toluene
    from: TOLF.out
    to: M100.fresh
    template: mixture
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: "design basis, D-003: battery limit from the tank farm; no published value (D-020)"}
        temperature: {value: 303.15, provenance: assumed, source: "design basis, D-003: battery limit; no published value (D-020)"}
        flow: {value: 15432.33, basis: mass, provenance: given, source: "scripts/hda_balance.py: the fresh toluene that gives the design capacity of process/design-basis.yaml (100 kt/a benzene product, 12.5 t/h at 8000 h/a, D-002) with the D-020 feeds and the D-021 reactor model (D-006, D-020). The capacity and the operating hours are ASSUMED (open input I-04, D-002), and so are the loop specifications the script holds (H2/aromatics 5, purge 40 mol% H2, D-007): the flow is given only as far as these premises are"}
        composition: {basis: mole_fraction, values: {TOL: 0.99941027, BZ: 0.00058973}, provenance: given, source: "Bharat Petroleum Corporation Ltd, toluene data sheet (BPCL: TOLUENE, conforming to IS 537:2011), https://bharatpetroleum.in/images/files/Data-Sheet-Toluene.pdf, read 2026-11-03, table rows 1, 7, 8, 10, 13: toluene at least 99.8 % by mass, benzene at most 500 mg/kg, non-aromatics at most 0.1 % by mass, C8+ aromatics at most 1000 ppm, water at most 500 ppm. Modelled: benzene at its limit (0.05 % by mass = 0.000590 mol/mol); the other impurities (at most 0.2 % by mass together) are not components of the model and are counted as toluene, ASSUMED (D-020)"}
  - id: S2
    title: Toluene to feed pump
    from: M100.out
    to: P101.in
    template: mixture
    state:
      design:
        pressure: {value: 150, provenance: assumed, source: D-004}
        flow: {value: 20332.3, provenance: calculated, source: 'cheme process propagate: mixer M100 from S1 S23', fingerprint: 8cfd6cc69ac0c028}
        composition: {basis: mole_fraction, values: {H2: 9.01681e-46, CH4: 8.32658e-40, TOL: 0.995919, BZ: 0.00408103, BIPH: 9.75104e-10}, provenance: calculated, source: 'cheme process propagate: mixer M100 from S1 S23', fingerprint: 0d316480af09666a}
        temperature: {value: 313.859, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 993f093a29348611, origin: simulated}
  - id: S3
    title: Pumped toluene
    from: P101.out
    to: M101.tol
    template: mixture
    state:
      design:
        pressure: {value: 3600, provenance: assumed, source: D-004}
        flow: {value: 20332.3, provenance: calculated, source: 'cheme process propagate: pass-through P101 from S2', fingerprint: 1a8ae124051bd4a4}
        composition: {basis: mole_fraction, values: {H2: 9.01681e-46, CH4: 8.32658e-40, TOL: 0.995919, BZ: 0.00408103, BIPH: 9.75104e-10}, provenance: calculated, source: 'cheme process propagate: pass-through P101 from S2', fingerprint: 1a8ae124051bd4a4}
        temperature: {value: 315.954, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 993f093a29348611, origin: simulated}
  - id: S4
    title: Make-up hydrogen
    from: H2MU.out
    to: M101.h2
    template: mixture
    state:
      design:
        pressure: {value: 3700, provenance: assumed, source: "design basis, D-003: available above loop pressure, no make-up compressor; no published value (D-020)"}
        temperature: {value: 313.15, provenance: assumed, source: "design basis, D-003: battery limit; no published value (D-020)"}
        flow: {value: 556.58, basis: mass, provenance: given, source: "scripts/hda_balance.py: the make-up that holds H2/aromatics 5 at 40 mol% H2 in the purge (D-007) at the design capacity of process/design-basis.yaml (12.5 t/h benzene, D-002), D-020 feeds, D-021 reactor model. The capacity and the operating hours are ASSUMED (open input I-04, D-002), and so are the loop specifications (D-007): the flow is given only as far as these premises are"}
        composition: {basis: mole_fraction, values: {H2: 0.999, CH4: 0.001}, provenance: given, source: "PSA hydrogen purity 99.9 %: Matijasevic, L., Petric, M. (2016), Integration of hydrogen systems in petroleum refinery, Chem. Biochem. Eng. Q. 30(3) 291-304, doi:10.15255/CABEQ.2015.2337, read in the authors' manuscript (https://www.hatz.hr/wp-content/uploads/2018/05/Matija%C5%A1evi%C4%87Petri%C4%87-Integration-of-Hydrogen-Systems-in-Petroleum-Refinery.pdf, 2026-11-03), Table 1 (p. 3, after Patel et al. 2006: PSA product purity 99.9 %) and Fig. 3 (p. 8: the refinery's PSA product at 99.9 % v/v). The 0.1 % remainder is taken as methane, ASSUMED (the PSA's slip is not stated by the source) (D-020)"}
  - id: S5
    title: Combined reactor feed
    from: M101.out
    to: E101.cold_in
    template: mixture
    state:
      design:
        pressure: {value: 3600, provenance: assumed, source: D-004}
        flow: {value: 47081.9, provenance: calculated, source: 'cheme process propagate: mixer M101 from S3 S4 S15', fingerprint: f5df6416d3d789de}
        composition: {basis: mole_fraction, values: {H2: 0.426705, CH4: 0.487968, TOL: 0.0776829, BZ: 0.0076436, BIPH: 1.57707e-07}, provenance: calculated, source: 'cheme process propagate: mixer M101 from S3 S4 S15', fingerprint: a906dc465306eb99}
        temperature: {value: 321.995, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 993f093a29348611, origin: simulated}
  - id: S6
    title: Preheated feed
    from: E101.cold_out
    to: H101.in
    template: mixture
    state:
      design:
        pressure: {value: 3520, provenance: assumed, source: D-004}
        temperature: {value: 840.0, provenance: assumed, source: D-004}
        composition: {basis: mole_fraction, values: {H2: 0.426708, CH4: 0.487965, TOL: 0.0776836, BZ: 0.00764357, BIPH: 1.57703e-07}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 993f093a29348611, origin: simulated}
        flow: {value: 47081.9, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 993f093a29348611, origin: simulated}
  - id: S7
    title: Reactor feed
    from: H101.out
    to: R101.in
    template: mixture
    state:
      design:
        pressure: {value: 3450, provenance: assumed, source: D-004}
        temperature: {value: 895.15, provenance: assumed, source: D-004}
        flow: {value: 47081.9, provenance: calculated, source: 'cheme process propagate: pass-through H101 from S6', fingerprint: e150be3ce70d7b59}
        composition: {basis: mole_fraction, values: {H2: 0.426708, CH4: 0.487965, TOL: 0.0776836, BZ: 0.00764357, BIPH: 1.57703e-07}, provenance: calculated, source: 'cheme process propagate: pass-through H101 from S6', fingerprint: e150be3ce70d7b59}
  # S25: a model stream inside R-101 (D-021): the gas after the dealkylation step, before the
  # biphenyl equilibrium step; no line of its own.
  - id: S25
    title: R-101 gas after dealkylation (model stream inside the reactor)
    from: R101.out
    to: R101B.in
    template: mixture
    state:
      design:
        pressure: {value: 3380, provenance: assumed, source: "D-004: the reactor's pressure drop taken in the first model step"}
        flow: {value: 47081.9, provenance: calculated, source: 'cheme process propagate: reactor R101 from S7', fingerprint: 16f732ae72e0fa52}
        composition: {basis: mole_fraction, values: {H2: 0.368445, CH4: 0.546228, TOL: 0.0194209, BZ: 0.0659062, BIPH: 1.57703e-07}, provenance: calculated, source: 'cheme process propagate: reactor R101 from S7', fingerprint: 440e6ce3d0c00a44}
        temperature: {value: 938.208, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 993f093a29348611, origin: simulated}
  - id: S8
    title: Reactor effluent
    from: R101B.out
    to: Q101.in
    template: mixture
    state:
      design:
        pressure: {value: 3380, provenance: assumed, source: D-004}
        flow: {value: 47081.9, provenance: calculated, source: 'cheme process propagate: reactor R101B from S25', fingerprint: f6011e8396f0e794}
        composition: {basis: mole_fraction, values: {H2: 0.369219, CH4: 0.546228, TOL: 0.0194209, BZ: 0.0643589, BIPH: 0.000773807}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 993f093a29348611, origin: simulated}
        temperature: {value: 938.208, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 993f093a29348611, origin: simulated}
  - id: S9
    title: Quenched effluent
    from: Q101.out
    to: E101.hot_in
    template: mixture
    state:
      design:
        pressure: {value: 3380, provenance: assumed, source: D-004}
        temperature: {value: 893.15, provenance: assumed, source: D-004}
        flow: {value: 52547.1, provenance: calculated, source: 'cheme process propagate: mixer Q101 from S8 S27', fingerprint: 0fd47e249729ead7}
        composition: {basis: mole_fraction, values: {H2: 0.360716, CH4: 0.53427, TOL: 0.024453, BZ: 0.0795749, BIPH: 0.000985908}, provenance: calculated, source: 'cheme process propagate: mixer Q101 from S8 S27', fingerprint: 2636f4ec42d4ca1a}
  - id: S10
    title: Effluent after feed / effluent exchanger
    from: E101.hot_out
    to: E102.in
    template: mixture
    state:
      design:
        pressure: {value: 3310, provenance: assumed, source: D-004}
        composition: {basis: mole_fraction, values: {H2: 0.360717, CH4: 0.534269, TOL: 0.0244531, BZ: 0.0795751, BIPH: 0.000985905}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 993f093a29348611, origin: simulated}
        flow: {value: 52547.0, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 993f093a29348611, origin: simulated}
        temperature: {value: 394.282, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: 993f093a29348611, origin: simulated}
  - id: S11
    title: Cooled effluent to separator
    from: E102.out
    to: V101.in
