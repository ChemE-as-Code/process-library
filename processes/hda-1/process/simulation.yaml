# The DWSIM model of hda-1 (`cheme process simulate`; schema `cheme schema process-simulation`).
# Decision D-014 in DESIGN.md. Every spec repeats a design choice of DESIGN.md (source given)
# or is ASSUMED with its reason. The property package is not qualified by core for aromatics
# with hydrogen and methane (core methods.yml benchmarks; core#315): the results are a
# cross-check of scripts/hda_balance.py on a second implementation of Peng-Robinson, not a
# validated model.
schema: cheme/simulation/v1
kind: simulation
simulator: dwsim
property_package: Peng-Robinson (PR)
method_selection:
  facts:
    pressure_value: 37                # the highest pressure of the flowsheet: make-up hydrogen S4, 3700 kPa(a) (D-003)
    pressure_unit: bar(a)
    is_polar: false                   # H2, CH4, toluene, benzene, biphenyl: nonpolar
    is_electrolyte: false             # no ions
    has_pseudocomponents: false       # five pure compounds with CAS numbers (materials.yaml)
    interaction_parameters_available: false  # not checked which pairs DWSIM's PR set covers (H2 and CH4 with the aromatics); uncertain, so the conservative answer
    liquid_liquid_expected: false     # no water; the aromatics are fully miscible
    vapor_association_expected: false # no carboxylic acids or HF
specs:
  # ---- RXN (D-004, D-007, D-010)
  P101:
    unit: pump        # Pumping (D-016); kept explicit
    outlet_pressure: {value: 3600, provenance: assumed, source: D-004}
    efficiency: {value: 0.65, provenance: assumed, source: "D-010: pump efficiency"}
  E101:
    cold_outlet_temperature: {value: 840.0, provenance: assumed, source: "D-004: FEHE cold outlet"}
    cold_pressure_drop: {value: 80, unit: kPa, provenance: assumed, source: "D-004: S5 3600 to S6 3520 kPa(a)"}
    hot_pressure_drop: {value: 70, unit: kPa, provenance: assumed, source: "D-004: 70 kPa per exchanger side"}
  H101:
    unit: heater
    outlet_temperature: {value: 895.15, provenance: assumed, source: "D-004: reactor inlet"}
    pressure_drop: {value: 70, unit: kPa, provenance: assumed, source: "D-004: 70 kPa per heater side"}
  R101:
    mode: adiabatic
    pressure_drop: {value: 70, unit: kPa, provenance: assumed, source: "D-004: inlet 3450, outlet 3380 kPa(a)"}
  # D-021: the biphenyl equilibrium step of the same vessel; its pressure drop is in R101.
  # Isothermal at the R101 outlet: DWSIM 9.0.5's equilibrium reactor in adiabatic mode stops with
  # "TP Flash: One or more flash specification values are invalid" (tried with the old and the
  # converged tear values). The step's heat (about 17 kW absorbed, 2.2 kmol/h x 15 MJ/kmol of
  # endothermic BIPH plus DWSIM's sensible-heat differences) would cool the 47 t/h of gas by
  # about 0.4 K if adiabatic; the duty has no energy stream (D-022).
  R101B:
    mode: isothermal
    pressure_drop: {value: 0, unit: kPa, provenance: assumed, source: "D-021: model step inside R-101, the vessel's drop taken in R101"}
  E102:
    outlet_temperature: {value: 313.15, provenance: assumed, source: "D-004: trim cooler outlet"}
    pressure_drop: {value: 60, unit: kPa, provenance: assumed, source: "D-004: 60 kPa per cooler"}
  V101:
    temperature: {value: 313.15, provenance: assumed, source: "D-004: HP separator"}
    pressure: {value: 3250, provenance: assumed, source: "D-004: HP separator"}
    outlets: {vap: vapor, liq: liquid}
  P102:
    unit: pump        # D-022: the quench pump as its own step
    outlet_pressure: {value: 3450, provenance: assumed, source: "D-004: quench pump discharge"}
    efficiency: {value: 0.65, provenance: assumed, source: "D-010: pump efficiency"}
  K101:
    outlet_pressure: {value: 3600, provenance: assumed, source: "D-004: recycle compressor discharge"}
    efficiency: {value: 0.75, provenance: assumed, source: "D-010: compressor isentropic efficiency"}
  # ---- SEP (D-008): Fenske-Underwood-Gilliland shortcut columns. The key specs are the design
  # targets of D-002 and D-008; where the script puts none of a key in a product, a small value
  # is ASSUMED (the shortcut method needs a nonzero one).
  C201:
    unit: shortcut_column
    light_key: CH4
    heavy_key: BZ
    light_key_in_bottoms: 0.00001     # ASSUMED: D-008 sends all H2 and CH4 overhead
    heavy_key_in_distillate: 0.0270   # D-008: benzene in the off-gas in equilibrium with the reflux (scripts/hda_balance.py S19, 0.02699 with the D-020/D-021 basis)
    reflux_ratio: 1.0                 # D-008: L/D 1
    condenser: partial
    condenser_pressure: {value: 800, provenance: assumed, source: D-008}
    reboiler_pressure: {value: 800, provenance: assumed, source: "D-008 (column pressure drop not stated)"}
    outlets: {top: distillate, bot: bottoms}
  # D-022: kept a shortcut column; a rigorous trial (40 stages, feed 20, R 2.18, bottoms
  # 5252.7 kg/h) over-purified the distillate (13 ppm toluene) and stopped on DWSIM's mass-balance
  # tolerance for the hydrogen traces (relative error 0.0029 against 0.001).
  C202:
    unit: shortcut_column
    light_key: BZ
    heavy_key: TOL
    light_key_in_bottoms: 0.0144253   # D-008: 99.5 % benzene recovery (scripts/hda_balance.py S22 with the D-020/D-021 basis)
    heavy_key_in_distillate: 0.001    # D-002: 99.9 mol% benzene, toluene the only impurity
    reflux_ratio: 2.18                # D-008 rule 1.3 x Underwood minimum, on the minimum DWSIM finds at the arriving (partly flashed) feed, 1.674 (D-014)
    condenser: total
    condenser_pressure: {value: 150, provenance: assumed, source: D-008}
    reboiler_pressure: {value: 170, provenance: assumed, source: D-008}
    outlets: {top: distillate, bot: bottoms}
  # D-022 (I-12): product cooler; the implicit distillate pump (D-010) makes up its drop, so the
  # product leaves at the C-202 condenser pressure
  E207:
    outlet_temperature: {value: 313.15, provenance: assumed, source: "D-008: benzene product to storage at 313.15 K (design basis delivery)"}
    pressure_drop: {value: 0, unit: kPa, provenance: assumed, source: "D-022: the drop is made up by the distillate pump (implicit, D-010)"}
  # C203 rigorous (D-014): DWSIM's shortcut gave biphenyl bottoms whose mole fractions add up to
  # 1.004 (the light-key spec set directly, the rest by balance), so the column is solved stage
  # by stage. Stage count ASSUMED from DWSIM's own shortcut estimate (5.97 theoretical stages at
  # R 0.5, Underwood minimum 0.022) with margin.
  C203:
    stages: 10                        # ASSUMED: condenser and reboiler included
    feed_stage: 5                     # ASSUMED: mid-column
    condenser: total
    condenser_pressure: {value: 30, provenance: assumed, source: D-008}
    reboiler_pressure: {value: 45, provenance: assumed, source: D-008}
    condenser_spec: {reflux_ratio: 0.5}                # D-008: at least 0.5 (Underwood minimum 0.02)
    # D-008's 2 mol% toluene in the bottoms as a flow: the biphenyl make / 0.98 would be about
    # 345 kg/h at the simulated make of 2.21 kmol/h (D-021). DWSIM 9.0.5's column does not
    # converge below about 350 kg/h here (tried 341.9, 345.4 with 10 and 14 stages, 346 at R 0.5
    # and 1.0, 349, and a reboiler temperature of 473.4 K; a mole-fraction spec failed in D-014),
    # so the lowest flow that converges is used: 352 kg/h, about 5 mol% toluene (D-022 deviation).
    reboiler_spec: {flow: {value: 352.0, unit: kg/h, provenance: assumed, source: "D-008, D-022: the lowest bottoms flow DWSIM converges at, about 5 mol% toluene instead of 2 mol%"}}
    outlets: {top: distillate, bot: bottoms}
