# Screening techno-economic analysis of the concept (D-019). Schema: `cheme schema tea`.
# Every value has its status and source; ASSUMED values are choices of this design, stated as
# such. Prices are 2025 values in EUR unless the year says otherwise. Run: cheme assess tea [--write].
schema: cheme/tea/v1
kind: tea
currency: EUR
cost_year: 2025
decision:
  question: >-
    Proceed to basic engineering of the 100 kt/a thermal toluene hydrodealkylation plant in the
    Rotterdam area: is its levelised cost of producing benzene at or below the benzene price?
  metric: lcop
  threshold: 673.6
  confidence: 0.5
  # Threshold: the benzene price proxy of product:BENZENE below (2025 unit value of Dutch
  # benzene exports). The plant is worth taking further only if it makes benzene for no more
  # than benzene sells for.
basis:
  product: BENZENE
  unit: t
  specification: "benzene 99.9 mol% (99.88 wt%), toluene the only modelled impurity, liquid at the battery limit (D-002)"
  boundary: "fresh toluene, make-up hydrogen (95 mol% H2), electricity, fired heat, LP/MP/HP steam in; benzene, biphenyl, fuel gas (purge and stabiliser off-gas) and heat to cooling water out (route and boundary memo); storage, the site fuel gas system, utility generation and flare outside"
  scale: 100 kt/a (12.5 t/h at 8000 h/a)
  location: NL (Rotterdam area, notional, D-016 I-05)
case: design
capex:
  # Equipment-factored estimate: bare module costs of the 18 listed items, Turton et al. CAPCOST
  # correlations of the package at the concept sizes of D-017 (estimate/equipment-cost.md),
  # AACE class 5 (estimate/cost-basis.yaml). D-019.
  isbl:
    source: equipment
    exchange_rate: {value: 0.92481, source: "Eurostat ert_bil_eur_a, euro/ecu exchange rates, annual average 2023: 1.0813 USD per EUR, read 2026-11-03; 1 / 1.0813 EUR per USD", year: 2023}
    escalation: {value: 1.0520, source: "Eurostat sts_inppd_a, domestic producer prices, NL, NACE C28 (machinery and equipment), index 2021 = 100: 121.4 (2025) / 115.4 (2023), read 2026-11-03; a proxy for plant cost escalation from the CEPCI year 2023 to 2025, ASSUMED (the same proxy as processes/ammonia-1/estimate/tea.yaml)"}
    location_factor: {value: 1.0, status: ASSUMED, source: "no open location factor from the US Gulf Coast basis of the correlations to the Netherlands was found; 1.0 kept and the class 5 range applied (D-019)"}
    purchased_installation: {value: 2.5, status: ASSUMED, source: "installed cost of H-101 over its purchased cost: the package's fired-heater correlation has no bare module factor; a screening factor chosen in this design (D-019)"}
    uncovered_allowance: {value: 0.15, status: ASSUMED, source: "items the correlations leave out: column trays and internals of C-201/C-202/C-203 (82 trays at the D-017 sizes), the R-101 refractory lining, the C-203 vacuum pump, reflux and distillate pumps, spares, the benzene product cooler (I-12); a screening fraction chosen in this design (D-019)"}
  osbl: {value: 0.30, status: ASSUMED, source: "offsites and utility connections (rack to the site headers, tie-ins to the site's storage, fuel gas, flare and cooling water) as a fraction of ISBL, a screening value chosen in this design for a unit on an existing chemical site (D-019)"}
  owners_cost: {value: 0.07, status: ASSUMED, source: "IEAGHG Technical Report 2017-03, section 2.8.1: owner's cost 7 % of the total plant cost (an ammonia study, used here as an analogue, as in processes/ammonia-1/estimate/tea.yaml)"}
  contingency: {value: 0.20, status: ASSUMED, source: "IEAGHG Technical Report 2017-03, section 2.8.1: 20 % contingency (used here as an analogue); the class 5 range of the estimate is applied in the uncertainty"}
operation:
  hours_per_year: 8000
  life_years: 25
  utilisation: {value: 1.0, status: ASSUMED, source: "the 8000 h/a of D-002 already hold the downtime"}
  source: "D-002 (8000 h/a ASSUMED); 25-year life ASSUMED, the same as lca/lca.yaml (D-019)"
prices:
  - key: feed:TOLF
    value: 668.1
    unit: t
    status: ASSUMED
    source: "Eurostat Comext DS-045409, NL imports from all partners (WORLD), CN 2902 30 00 toluene, 2025: 98 521 296 EUR / 147 460 t = 668.1 EUR/t, read 2026-11-03 (dataset updated 2026-10-16); a trade unit value used as the price proxy of nitration-grade toluene delivered to Rotterdam, ASSUMED (D-019)"
    year: 2025
    swing: {low: 0.7, high: 1.4}
  - key: feed:H2MU
    component: H2
    value: 2781.2
    unit: t
    status: ASSUMED
    source: "European Hydrogen Observatory (Clean Hydrogen Partnership), 'Hydrogen production costs 2024.xlsx', Netherlands, SMR, 2024: CAPEX 0.2628 + natural gas 1.9327 + CO2 costs 0.4940 + other OPEX 0.0916 = 2.7812 EUR/kg, read 2026-11-03; 2024 is the latest year the Observatory publishes, not escalated to 2025; the levelised cost of grey hydrogen as the price of make-up hydrogen bought over the fence, ASSUMED (no hydrogen supplier, I-02, D-019)"
    year: 2024
    swing: {low: 0.7, high: 1.5}
  - key: feed:H2MU
    component: CH4
    value: 11.397
    unit: GJ
    conversion: {value: 0.055516, source: "gross calorific value of methane, own calculation: standard heat of combustion 890.63 kJ/mol (NIST Chemistry WebBook) / 16.0425 g/mol = 55.516 MJ/kg"}
    status: ASSUMED
    source: "the methane in the make-up gas valued at the natural-gas price of feed:FUEL (Eurostat nrg_pc_203, NL, band I6, excluding VAT and recoverable taxes, mean of 2025-S1 12.4122 and 2025-S2 10.3818 EUR/GJ GCV, read 2026-11-03), ASSUMED (D-019)"
    year: 2025
  - key: feed:POWER
    value: 100.65
    unit: MWh
    status: QUOTED
    source: "Eurostat nrg_pc_205, non-household electricity prices, NL, band IG (150,000 MWh or over), excluding VAT and recoverable taxes: mean of 2025-S1 0.1062 and 2025-S2 0.0951 EUR/kWh, read 2026-11-03"
    year: 2025
  - key: feed:FUEL
    value: 53.56
    unit: MWh
    status: ASSUMED
    source: "natural gas per MWh absorbed in H-101: 11.397 EUR/GJ GCV (Eurostat nrg_pc_203, NL, band I6, excluding VAT and recoverable taxes, mean of 2025-S1 12.4122 and 2025-S2 10.3818 EUR/GJ, both flagged estimated, read 2026-11-03) x 3.6 GJ/MWh / 0.766 (fired efficiency 0.85 on LHV, ASSUMED, x LHV/GCV of methane 802.6/890.63, own calculation from the NIST heat of combustion and 44.0 kJ/mol latent heat of water at 298 K) (D-019)"
    year: 2025
    swing: {low: 0.6, high: 1.6}
  - key: feed:MPS
    value: 45.59
    unit: MWh
    status: ASSUMED
    source: "steam heat valued as the gas a site boiler burns to raise it: 11.397 EUR/GJ GCV (feed:FUEL source) x 3.6 / boiler efficiency 0.90 on GCV (ASSUMED, as processes/ammonia-1/estimate/tea.yaml); the pressure level is not valued (D-019)"
    year: 2025
  - key: feed:LPS
    value: 45.59
    unit: MWh
    status: ASSUMED
    source: "as feed:MPS (D-019)"
    year: 2025
  - key: feed:HPS
    value: 45.59
    unit: MWh
    status: ASSUMED
    source: "as feed:MPS (D-019)"
    year: 2025
  - key: product:CW
    value: -2.85
    unit: MWh
    status: ASSUMED
    source: "operating cost of the site cooling tower per MWh of heat rejected at a 10 K rise (D-010: 298.15/308.15 K): pump and fan power at 100.65 EUR/MWh and evaporation make-up, the own calculation and premises of processes/ammonia-1/estimate/tea.yaml product:CW (same rise, same power price), 2.85 EUR/MWh as a cost, ASSUMED (D-019)"
    year: 2025
    swing: {low: 0.5, high: 2.0}
  - key: product:BENZENE
    value: 673.6
    unit: t
    status: ASSUMED
    source: "Eurostat Comext DS-045409, NL exports to all partners (WORLD), CN 2902 20 00 benzene, 2025: 668 799 789 EUR / 992 926 t = 673.6 EUR/t, read 2026-11-03 (dataset updated 2026-10-16); a trade unit value used as the price proxy of benzene sold from Rotterdam, ASSUMED (D-019)"
    year: 2025
    swing: {low: 0.7, high: 1.5}
  - key: product:FUELGAS
    value: 11.397
    unit: GJ
    conversion: {value: 0.05425, source: "LHV of the exported fuel gas, 54.25 MJ/kg (D-013, from the formation enthalpies of materials.yaml)"}
    status: ASSUMED
    source: "fuel gas credited at the natural-gas price it displaces in the site fuel system (feed:FUEL source, 11.397 EUR/GJ GCV) per GJ of its LHV: under-values it by the GCV/LHV ratio, conservative, ASSUMED (D-009, D-019)"
    year: 2025
  - key: product:DIPHENYL
    value: 11.397
    unit: GJ
    conversion: {value: 0.03965, source: "LHV of the biphenyl product, 39.65 MJ/kg (D-013)"}
    status: ASSUMED
    source: "biphenyl credited as fuel at the natural-gas price per GJ LHV (no open biphenyl price found; Comext CN 2902 90 30 gave no Dutch trade for 2024-2025), ASSUMED (D-009, D-019)"
    year: 2025
emissions:
  price: {value: 74, status: ASSUMED, source: "EU ETS allowance (EUA) annual average 2025, 74 EUR/t CO2e, ESMA annual report on EU carbon markets 2026 as reported by Lovguiden 2026-07-09 (secondary); the 2025 volume-weighted auction average 73.43 EUR/t (Instrat, EU ETS 2025 summary) agrees", year: 2025}
  sources:
    - id: h101-flue
      key: feed:FUEL
      factor: {value: 0.2376, source: "natural gas burned in H-101 per MWh absorbed: 3.6 GJ / 0.85 (fired efficiency on LHV, ASSUMED) x 56.1 t CO2/TJ (2006 IPCC Guidelines, Vol. 2, Ch. 1, Table 1.4, natural gas default 56 100 kg/TJ on the net calorific value)"}
      unit: MWh
  # The CO2 of the exported fuel gas and of the steam boilers is emitted outside the boundary
  # (site fuel system, utility plant) and is not charged here (D-019). No free allocation,
  # ASSUMED; scenario no-carbon-price shows the other end.
fixed_opex:
  maintenance: {value: 0.03, status: ASSUMED, source: "screening value chosen in this design, fraction of fixed capital per year (as processes/ammonia-1/estimate/tea.yaml)"}
  labour: {operators: {value: 25, status: ASSUMED, source: "screening value: five positions in five shifts (D-019)"}, cost_per_operator: {value: 80000, status: ASSUMED, source: "screening value, EUR per operator-year including overheads, NL (as processes/ammonia-1/estimate/tea.yaml)"}}
  insurance_tax: {value: 0.01, status: ASSUMED, source: "screening value, fraction of fixed capital per year (as processes/ammonia-1/estimate/tea.yaml)"}
finance:
  discount_rate: {value: 0.08, status: ASSUMED, source: "real discount rate chosen for the screening (as processes/ammonia-1/estimate/tea.yaml)"}
  tax_rate: {value: 0.258, source: "Dutch corporate income tax, top rate 25.8 % (Belastingdienst, rates since 2022)"}
  construction: [0.4, 0.6]
uncertainty: {iterations: 2000, seed: 1, defaults: {ASSUMED: {gsd2: 1.4}, QUOTED: {gsd2: 1.1}}}
sensitivity: {swing: {low: 0.8, high: 1.2}}
scenarios:
  - {id: prices-2024, prices: {product:BENZENE: 978.7, feed:TOLF: 818.5}, source: "Eurostat Comext DS-045409, 2024 unit values: NL benzene exports 1 060 526 806 EUR / 1 083 653 t = 978.7 EUR/t, NL toluene imports 112 341 889 EUR / 137 246 t = 818.5 EUR/t, read 2026-11-03"}
  - {id: no-carbon-price, prices: {carbon: 0}, source: "full free allocation or no carbon price: the lower bound of the carbon cost"}
  - {id: capex-class5-high, scale: {capex:isbl: 2.0}, source: "AACE 18R-97 class 5 upper bound +100 % on the ISBL"}
