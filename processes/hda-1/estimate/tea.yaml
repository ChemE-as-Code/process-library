# Screening techno-economic analysis of the concept (D-019). Schema: `cheme schema tea`.
# Every value has its status and source; ASSUMED values are choices of this design, stated as
# such. Prices are 2025 values in EUR unless the year says otherwise. Run: cheme assess tea [--write].
schema: cheme/tea/v1
kind: tea
currency: EUR
cost_year: 2025
decision:
  question: >-
    Proceed to basic engineering of the 100 kt/a thermal toluene hydrodealkylation plant in the
    Rotterdam area: is its levelised cost of producing benzene at or below the benzene price?
  metric: lcop
  threshold: 673.6
  confidence: 0.5
  # Threshold: the benzene price proxy of product:BENZENE below (2025 unit value of Dutch
  # benzene exports). The plant is worth taking further only if it makes benzene for no more
  # than benzene sells for. The threshold is a fixed number: the Monte Carlo samples the toluene
  # price (and every other price) independently and never moves the benzene price with it, so
  # P(meets) is the chance that toluene falls while benzene stays put, not the probability of a
  # benzene-toluene spread. It is not the decision result. The core (v1.4.1) cannot correlate two
  # price inputs, nor tie an lcop threshold to a price key. The evidence for the decision is the
  # spread series of the prices-20xx scenarios below (NPV against the same year's benzene price),
  # set against the break-even spread (D-019).
basis:
  product: BENZENE
  unit: t
  specification: "benzene 99.9 mol% (99.88 wt%), toluene the only modelled impurity, liquid at the battery limit (D-002)"
  boundary: "fresh toluene, make-up hydrogen (PSA grade, 99.9 mol% H2, D-020), electricity, fired heat, LP/MP/HP steam in; benzene, biphenyl, fuel gas (PSA tail gas and stabiliser off-gas, D-024) and heat to cooling water out (route and boundary memo); storage, the site fuel gas system, utility generation and flare outside"
  scale: 100 kt/a (12.5 t/h at 8000 h/a)
  location: NL (Rotterdam area, notional, D-016 I-05)
case: design
capex:
  # Equipment-factored estimate: bare module costs of the 21 listed items (18 + the purge
  # hydrogen recovery PK-101, K-102 and E-103 of D-024), Turton et al. CAPCOST
  # correlations of the package at the concept sizes of D-017 (estimate/equipment-cost.md),
  # AACE class 5 (estimate/cost-basis.yaml). D-019.
  isbl:
    source: equipment
    exchange_rate: {value: 0.92481, source: "Eurostat ert_bil_eur_a, euro/ecu exchange rates, annual average 2023: 1.0813 USD per EUR, read 2026-11-03; 1 / 1.0813 EUR per USD", year: 2023}
    escalation: {value: 1.0520, source: "Eurostat sts_inppd_a, domestic producer prices, NL, NACE C28 (machinery and equipment), index 2021 = 100: 121.4 (2025) / 115.4 (2023), read 2026-11-03; a proxy for plant cost escalation from the CEPCI year 2023 to 2025, ASSUMED (the same proxy as processes/ammonia-1/estimate/tea.yaml)"}
    location_factor: {value: 1.0, status: ASSUMED, source: "no open location factor from the US Gulf Coast basis of the correlations to the Netherlands was found; 1.0 kept and the class 5 range applied (D-019)"}
    purchased_installation: {value: 2.5, status: ASSUMED, source: "installed cost of H-101 over its purchased cost: the package's fired-heater correlation has no bare module, pressure or material factor (a core limit, D-019), and the printed Turton et al. Appendix A tables that hold them could not be read here; a screening factor chosen in this design, likely low for alloy tubes at 42 barg in hot hydrogen (D-019)"}
    uncovered_allowance: {value: 0.15, status: ASSUMED, source: "items the correlations leave out: column trays and internals of C-201/C-202/C-203 (82 trays at the D-017 sizes), the R-101 refractory lining, the C-203 vacuum pump, reflux and distillate pumps, spares, and the electric drives of K-101 and K-102 (explosion-proof motors of about 350 and 300 kW, ASSUMED: the 279 and 249 kW shaft powers with a margin, and their starters: the package's compressor correlation excludes the driver and holds no electric-drive correlation); a screening fraction chosen in this design (D-019); the benzene product cooler, in this list until S2, is now priced as E-207 and the fraction is kept (D-022); the fraction is also applied to the PSA package PK-101 (D-024), whose price already holds its internals: an upper estimate there"}
  osbl: {value: 0.30, status: ASSUMED, source: "offsites and utility connections (rack to the site headers, tie-ins to the site's storage, fuel gas, flare and cooling water) as a fraction of ISBL, a screening value chosen in this design for a unit on an existing chemical site (D-019)"}
  owners_cost: {value: 0.07, status: ASSUMED, source: "IEAGHG Technical Report 2017-03, section 2.8.1: owner's cost 7 % of the total plant cost (an ammonia study, used here as an analogue, as in processes/ammonia-1/estimate/tea.yaml)"}
  contingency: {value: 0.20, status: ASSUMED, source: "IEAGHG Technical Report 2017-03, section 2.8.1: 20 % contingency (used here as an analogue); the class 5 range of the estimate is applied in the uncertainty"}
operation:
  hours_per_year: 8000
  life_years: 25
  utilisation: {value: 1.0, status: ASSUMED, source: "the 8000 h/a of D-002 already hold the downtime"}
  source: "D-002 (8000 h/a ASSUMED); 25-year life ASSUMED, the same as lca/lca.yaml (D-019)"
prices:
  - key: feed:TOLF
    value: 668.1
    unit: t
    status: ASSUMED
    source: "Eurostat Comext DS-045409, NL imports from all partners (WORLD), CN 2902 30 00 toluene, 2025: 98 521 296 EUR / 147 460 t = 668.1 EUR/t, read 2026-11-03 (dataset updated 2026-10-16); a trade unit value used as the price proxy of nitration-grade toluene delivered to Rotterdam, ASSUMED (D-019)"
    year: 2025
    swing: {low: 0.7, high: 1.4}
  - key: feed:H2MU
    component: H2
    value: 2781.2
    unit: t
    status: ASSUMED
    source: "European Hydrogen Observatory (Clean Hydrogen Partnership), 'Hydrogen production costs 2024.xlsx', Netherlands, SMR, 2024: CAPEX 0.2628 + natural gas 1.9327 + CO2 costs 0.4940 + other OPEX 0.0916 = 2.7812 EUR/kg, read 2026-11-03; 2024 is the latest year the Observatory publishes, not escalated to 2025; the levelised cost of grey hydrogen as the price of make-up hydrogen bought over the fence, ASSUMED (no hydrogen supplier, I-02, D-019)"
    year: 2024
    swing: {low: 0.7, high: 1.5}
  - key: feed:H2MU
    component: CH4
    value: 11.397
    unit: GJ
    conversion: {value: 0.055521, source: "gross calorific value of methane, own calculation: standard heat of combustion of the gas 890.7 kJ/mol (NIST Chemistry WebBook, methane, ID C74828, gas phase thermochemistry, dcH gas -890.7 +/- 0.4 kJ/mol, Pittam and Pilcher 1972, read 2026-11-03) / 16.0425 g/mol = 55.521 MJ/kg"}
    status: ASSUMED
    source: "the methane in the make-up gas valued at the natural-gas price of feed:FUEL (Eurostat nrg_pc_203, NL, band I6, excluding VAT and recoverable taxes, mean of 2025-S1 12.4122 and 2025-S2 10.3818 EUR/GJ GCV, read 2026-11-03), ASSUMED (D-019)"
    year: 2025
  - key: feed:POWER
    value: 100.65
    unit: MWh
    status: ASSUMED
    source: "Eurostat nrg_pc_205, non-household electricity prices, NL, band IG (150,000 MWh or over), excluding VAT and recoverable taxes: mean of 2025-S1 0.1062 and 2025-S2 0.0951 EUR/kWh, read 2026-11-03; the unit alone uses about 2.1 GWh/a, so the band is the one of the existing chemical site's total consumption, through which the unit buys its power: a premise of this design, ASSUMED (D-019)"
    year: 2025
  - key: feed:FUEL
    value: 53.56
    unit: MWh
    status: ASSUMED
    source: "natural gas per MWh absorbed in H-101: 11.397 EUR/GJ GCV (Eurostat nrg_pc_203, NL, band I6, excluding VAT and recoverable taxes, mean of 2025-S1 12.4122 and 2025-S2 10.3818 EUR/GJ, both flagged estimated, read 2026-11-03) x 3.6 GJ/MWh / 0.766 (fired efficiency 0.85 on LHV, ASSUMED, x LHV/GCV of methane 802.7/890.7, own calculation from the NIST heat of combustion of feed:H2MU@CH4 and 2 x 44.0 kJ/mol latent heat of water at 298 K); band I6 (4 000 000 GJ or over) is the existing site's total gas use, through which the unit buys its gas, not the unit's own use of about 0.3 PJ/a GCV (band I4): a premise of this design, ASSUMED; the swing 0.6 to 1.6 covers the band difference (D-019)"
    year: 2025
    swing: {low: 0.6, high: 1.6}
  - key: feed:MPS
    value: 45.59
    unit: MWh
    status: ASSUMED
    source: "steam heat valued as the gas a site boiler burns to raise it: 11.397 EUR/GJ GCV (feed:FUEL source) x 3.6 / boiler efficiency 0.90 on GCV (ASSUMED, as processes/ammonia-1/estimate/tea.yaml); the pressure level is not valued (D-019)"
    year: 2025
  - key: feed:LPS
    value: 45.59
    unit: MWh
    status: ASSUMED
    source: "as feed:MPS (D-019)"
    year: 2025
  - key: feed:HPS
    value: 45.59
    unit: MWh
    status: ASSUMED
    source: "as feed:MPS (D-019)"
    year: 2025
  - key: product:CW
    value: -2.85
    unit: MWh
    status: ASSUMED
    source: "operating cost of the site cooling tower per MWh of heat rejected at a 10 K rise (D-010: 298.15/308.15 K): pump and fan power at 100.65 EUR/MWh and evaporation make-up, the own calculation and premises of processes/ammonia-1/estimate/tea.yaml product:CW (same rise, same power price), 2.85 EUR/MWh as a cost, ASSUMED (D-019)"
    year: 2025
    swing: {low: 0.5, high: 2.0}
  - key: product:BENZENE
    value: 673.6
    unit: t
    status: ASSUMED
    source: "Eurostat Comext DS-045409, NL exports to all partners (WORLD), CN 2902 20 00 benzene, 2025: 668 799 789 EUR / 992 926 t = 673.6 EUR/t, read 2026-11-03 (dataset updated 2026-10-16); a trade unit value used as the price proxy of benzene sold from Rotterdam, ASSUMED (D-019)"
    year: 2025
    swing: {low: 0.7, high: 1.5}
  - key: product:FUELGAS
    value: 11.397
    unit: GJ
    conversion: {value: 0.05066, source: "LHV of the exported fuel gas, 50.66 MJ/kg (D-013, from the formation enthalpies of materials.yaml; PSA tail gas S34 and stabiliser off-gas S19 of D-024; 54.23 MJ/kg before the PSA took out the hydrogen)"}
    status: ASSUMED
    source: "fuel gas credited at the natural-gas price it displaces in the site fuel system (feed:FUEL source, 11.397 EUR/GJ GCV) per GJ of its LHV: under-values it by the GCV/LHV ratio, conservative, ASSUMED (D-009, D-019)"
    year: 2025
  - key: product:DIPHENYL
    value: 11.397
    unit: GJ
    conversion: {value: 0.03968, source: "LHV of the biphenyl product, 39.68 MJ/kg (D-013; 4.9 mol% toluene, D-022)"}
    status: ASSUMED
    source: "biphenyl credited as fuel at the natural-gas price per GJ LHV (no open biphenyl price found; Comext CN 2902 90 30 gave no Dutch trade for 2024-2025), ASSUMED (D-009, D-019)"
    year: 2025
emissions:
  price: {value: 74, status: ASSUMED, source: "EU ETS allowance (EUA) annual average 2025, 74 EUR/t CO2e, ESMA annual report on EU carbon markets 2026 as reported by Lovguiden 2026-07-09 (secondary); the 2025 volume-weighted auction average 73.43 EUR/t (Instrat, EU ETS 2025 summary) agrees", year: 2025}
  sources:
    - id: h101-flue
      key: feed:FUEL
      factor: {value: 0.2376, source: "natural gas burned in H-101 per MWh absorbed: 3.6 GJ / 0.85 (fired efficiency on LHV, ASSUMED) x 56.1 t CO2/TJ (2006 IPCC Guidelines, Vol. 2, Ch. 1, Table 1.4, natural gas default 56 100 kg/TJ on the net calorific value)"}
      unit: MWh
    - id: steam-boiler
      key: feed:MPS
      factor: {value: 0.2022, source: "natural gas burned in the site boiler per MWh of steam heat: 3.6 GJ / 0.90 (boiler efficiency on GCV, ASSUMED, as feed:MPS) x 802.7/890.7 (LHV/GCV of methane, feed:FUEL) x 56.1 t CO2/TJ (2006 IPCC Guidelines, Vol. 2, Ch. 1, Table 1.4, natural gas default on the net calorific value); the site boiler is under the EU ETS like H-101, so the steam carries its CO2 as make-up hydrogen does (D-019)"}
      unit: MWh
    - {id: steam-boiler-lp, key: feed:LPS, factor: {value: 0.2022, source: "as steam-boiler (D-019)"}, unit: MWh}
    - {id: steam-boiler-hp, key: feed:HPS, factor: {value: 0.2022, source: "as steam-boiler (D-019)"}, unit: MWh}
  # The CO2 of the exported fuel gas and biphenyl is emitted where they are burned (site fuel
  # system) and is charged to the user, not here (D-019). No free allocation, ASSUMED; scenario
  # no-carbon-price shows the other end.
fixed_opex:
  maintenance: {value: 0.03, status: ASSUMED, source: "screening value chosen in this design, fraction of fixed capital per year (as processes/ammonia-1/estimate/tea.yaml)"}
  labour: {operators: {value: 25, status: ASSUMED, source: "screening value: five positions in five shifts (D-019)"}, cost_per_operator: {value: 80000, status: ASSUMED, source: "screening value, EUR per operator-year including overheads, NL (as processes/ammonia-1/estimate/tea.yaml)"}}
  insurance_tax: {value: 0.01, status: ASSUMED, source: "screening value, fraction of fixed capital per year (as processes/ammonia-1/estimate/tea.yaml)"}
finance:
  discount_rate: {value: 0.08, status: ASSUMED, source: "real discount rate chosen for the screening (as processes/ammonia-1/estimate/tea.yaml)"}
  tax_rate: {value: 0.258, source: "Dutch corporate income tax, top rate 25.8 % (Belastingdienst, rates since 2022)"}
  construction: [0.4, 0.6]
uncertainty: {iterations: 2000, seed: 1, defaults: {ASSUMED: {gsd2: 1.4}, QUOTED: {gsd2: 1.1}}}
sensitivity: {swing: {low: 0.8, high: 1.2}}
scenarios:
  # The benzene-toluene spread over seven years, from the same Comext flows as the baseline
  # (DS-045409, NL, partner WORLD, CN 2902 20 00 benzene exports and CN 2902 30 00 toluene
  # imports, annual, VALUE_IN_EUROS / QUANTITY_IN_100KG, read 2026-11-03, dataset updated
  # 2026-10-16). Only the two prices change; hydrogen, gas and power stay at their 2025 values.
  # The column to read is NPV (against that year's benzene price); 'meets' compares LCOP with
  # the fixed 2025 threshold and does not apply to other years. A unit-value difference between
  # an import and an export flow is not a traded spread (different delivery terms, grades and
  # partners); it is a proxy, ASSUMED (D-019).
  - {id: prices-2019, prices: {product:BENZENE: 624.8, feed:TOLF: 615.1}, source: "Comext DS-045409, 2019: NL benzene exports 300 433 803 EUR / 480 836 t = 624.8 EUR/t, NL toluene imports 119 321 457 EUR / 193 997 t = 615.1 EUR/t (spread 9.7 EUR/t)"}
  - {id: prices-2020, prices: {product:BENZENE: 522.3, feed:TOLF: 418.5}, source: "Comext DS-045409, 2020: NL benzene exports 266 914 645 EUR / 511 024 t = 522.3 EUR/t, NL toluene imports 95 704 450 EUR / 228 695 t = 418.5 EUR/t (spread 103.8 EUR/t)"}
  - {id: prices-2021, prices: {product:BENZENE: 897.7, feed:TOLF: 549.0}, source: "Comext DS-045409, 2021: NL benzene exports 472 718 192 EUR / 526 566 t = 897.7 EUR/t, NL toluene imports 76 789 234 EUR / 139 878 t = 549.0 EUR/t (spread 348.7 EUR/t)"}
  - {id: prices-2022, prices: {product:BENZENE: 1028.6, feed:TOLF: 942.5}, source: "Comext DS-045409, 2022: NL benzene exports 753 233 256 EUR / 732 308 t = 1028.6 EUR/t, NL toluene imports 169 211 730 EUR / 179 538 t = 942.5 EUR/t (spread 86.1 EUR/t)"}
  - {id: prices-2023, prices: {product:BENZENE: 865.0, feed:TOLF: 897.6}, source: "Comext DS-045409, 2023: NL benzene exports 780 608 793 EUR / 902 389 t = 865.0 EUR/t, NL toluene imports 84 626 411 EUR / 94 280 t = 897.6 EUR/t (spread -32.6 EUR/t)"}
  - {id: prices-2024, prices: {product:BENZENE: 978.7, feed:TOLF: 818.5}, source: "Eurostat Comext DS-045409, 2024 unit values: NL benzene exports 1 060 526 806 EUR / 1 083 654 t = 978.7 EUR/t, NL toluene imports 112 341 889 EUR / 137 247 t = 818.5 EUR/t, read 2026-11-03 (spread 160.2 EUR/t)"}
  - {id: prices-2025-imports, prices: {product:BENZENE: 706.7}, source: "Comext DS-045409, 2025, both prices from import flows: NL benzene imports 176 964 321 EUR / 250 423 t = 706.7 EUR/t, against the baseline toluene imports 668.1 EUR/t (spread 38.6 EUR/t)"}
  - {id: prices-2025-exports, prices: {feed:TOLF: 808.3}, source: "Comext DS-045409, 2025, both prices from export flows: NL toluene exports 47 756 669 EUR / 59 084 t = 808.3 EUR/t, against the baseline benzene exports 673.6 EUR/t (spread -134.7 EUR/t)"}
  - {id: no-carbon-price, prices: {carbon: 0}, source: "full free allocation or no carbon price: the lower bound of the carbon cost"}
  - {id: capex-class5-high, scale: {capex:isbl: 2.0}, source: "AACE 18R-97 class 5 upper bound +100 % on the ISBL"}
  # D-024: the PSA package's cost range as ISBL multipliers (the scenarios scale the whole ISBL,
  # so the PSA's own share is converted): PK-101 at 4 056 500 USD 2023 is 4 538 554 EUR of the
  # 16 390 151 EUR ISBL (x 0.97290 EUR 2025 per USD 2023, x 1.15 allowance). Own calculation.
  - {id: psa-capex-high, scale: {capex:isbl: 1.104455}, source: "PK-101 at 5 586 700 USD 2023 (the NETL PSA scaled on the adsorbed flow with exponent 0.5 instead of 0.6, D-024): ISBL + 1 712 041 EUR, ASSUMED"}
  - {id: psa-capex-low, scale: {capex:isbl: 0.887571}, source: "PK-101 at 2 409 500 USD 2023 (the NETL PSA scaled on the total feed flow, exponent 0.6, D-024): ISBL - 1 842 720 EUR, ASSUMED"}
  # Benzene selectivity (D-021, review of PR #326): the model's 0.9734 bounds only the biphenyl
  # make; heavier polyaromatics and hydrocracking are excluded, so it is optimistic. US 3,607,960
  # Example 1 reports 94.5 % for its primary reactors at 85 % conversion per pass
  # (process/reaction-evidence.yaml O2), a higher conversion than R-101's 75 %. Own calculation
  # on the DWSIM extents of the D-024 run (HDA 166.78, BIPH 2.217 kmol/h): net benzene formed
  # 162.35 kmol/h; at 0.945 the toluene converted is 162.35 / 0.945 = 171.80 kmol/h, 5.02 kmol/h
  # (462.1 kg/h) more, so fresh toluene x (15427.2 + 462.1) / 15427.2 = 1.030, and its
  # dealkylation takes 5.02 kmol/h (10.1 kg/h) more hydrogen, against the 389.5 kg/h of H2 in the
  # make-up S4 (392.63 kg/h at 99.9 mol% H2, D-024): x 1.026. Second-order effects (purge,
  # recycle, duties) are not rerun. ASSUMED screening scale factors, not a simulation.
  - {id: selectivity-0945, scale: {rate:feed:TOLF: 1.030, rate:feed:H2MU@H2: 1.026}, source: "benzene selectivity 0.945 (US 3,607,960 Example 1, primary reactors, 85 % conversion; reaction-evidence O2) instead of 0.9734: toluene and make-up hydrogen scaled by the own calculation above (D-024 run); the lost aromatics are not credited (upper bound of the cost), ASSUMED (D-021)"}
  - {id: selectivity-0945-credited, scale: {rate:feed:TOLF: 1.030, rate:feed:H2MU@H2: 1.026, rate:product:DIPHENYL: 2.113, rate:product:FUELGAS: 1.027}, source: "as selectivity-0945, with the loss credited as fuel: the 5.02 kmol/h of extra toluene leave as heavy aromatics (5.02 x 78.11 = 391.8 kg/h, credited at the biphenyl LHV: 352.0 -> 743.8 kg/h, x 2.113) and methane (80.5 kg/h into the 2968.1 kg/h of fuel gas of D-024, x 1.027); the heavy ends' real composition and LHV are not known (reaction-evidence O2 gaps), ASSUMED (D-021)"}
  # PSA hydrogen recovery (D-024, review of PR #327): 0.75 is the low end of the published 75-92 %
  # (Matijasevic and Petric 2016, Table 1, p. 3), whose feed limit (> 40 vol% H2) the purge just
  # meets (40.0 mol%), so a vendor may offer less. Own calculation: the PSA feed holds
  # 161.88 / 0.75 = 215.84 kg/h of H2 (scripts/hda_balance.py); each 0.05 of recovery lost is
  # 10.79 kg/h more make-up H2 (x 1.0277 on the 389.53 kg/h of H2 in S4) and the same hydrogen
  # more in the fuel gas, credited by its energy: 10.79 kg/h x 119.96 MJ/kg (LHV of H2 from the
  # formation enthalpy of H2O(g), -241.826 kJ/mol, CODATA, Cox et al. 1989, as lca/lca.yaml) =
  # 1294.6 MJ/h on 2968.1 kg/h x 50.66 MJ/kg = 150 364 MJ/h, x 1.00861 (the fuel gas is priced per
  # GJ at a fixed 50.66 MJ/kg). The loop is not solved again: less hydrogen through the recycle
  # dilutes it less (slightly less K-101 power and H-101 duty), so the scenarios are a little
  # pessimistic. ASSUMED screening scale factors, not a simulation.
  - {id: psa-recovery-070, scale: {rate:feed:H2MU@H2: 1.02770, rate:product:FUELGAS: 1.00861}, source: "PK-101 hydrogen recovery 0.70 instead of 0.75 (below the published range, for a feed at its 40 % limit): own calculation above, ASSUMED (D-024)"}
  - {id: psa-recovery-065, scale: {rate:feed:H2MU@H2: 1.05541, rate:product:FUELGAS: 1.01722}, source: "PK-101 hydrogen recovery 0.65 instead of 0.75: own calculation above, ASSUMED (D-024)"}
