# Equipment cost basis of the class 5 estimate (D-019). Schema: `cheme schema cost_basis`.
# `cheme assess equipment` prices each listed item with the Turton et al. (CAPCOST) correlations
# of the package (base CEPCI 397, 2001) and escalates them with the index below. Sizes are the
# concept sizes of scripts/concept_sizing.py (D-017), all ASSUMED; the datasheets replace them
# at basic engineering.
schema: cheme/cost_basis/v1
# AACE 18R-97 class 5: concept sizes (no datasheets), correlation costs; the estimate's range is
# the class 5 range (-20 % to -50 % low, +30 % to +100 % high).
estimate_class: 5
cost_index:
  value: 797.9
  year: 2023
  month: annual
  source: "Chemical Engineering, Economic Indicators, Sept. 2024 issue, p. 45 (CEPCI table, 'Annual Index: ... 2023 = 797.9'), https://www.chemengonline.com/wp-content/uploads/2024/08/19_CHE_0924_EconInd_p45.pdf; the latest annual average found in an openly readable source (the same index as ammonia-1's cost basis)"
notes: "Escalation 2001 -> 2023 by CEPCI 797.9 / 397. Currency USD (the correlations' currency); the conversion to EUR and the escalation to 2025 are in estimate/tea.yaml. Sizes ASSUMED (D-017)."
