# Instrument list. Schema: `cheme schema instruments`.
# Tags as printed on the P&IDs (S3b, D-025); numbers n01 and up on sheet P-0n. Loops,
# setpoints, alarms and fail positions belong in control/loops.yaml (S4); trips in
# control/cause-effect.yaml.
schema: cheme/instruments/v1
instruments:
  # ---- P-01 feed, heater and reactor
  - {tag: LIC-102, sheet: P-01, service: "V-100 level, fresh toluene make-up LV-102 (TO-101)"}
  - {tag: FIC-103, sheet: P-01, service: "Reactor toluene feed (TO-103), FV-103; sets the plant load"}
  - {tag: PIC-104, sheet: P-01, service: "V-100 pressure, vent PV-104 to the flare header; nitrogen through the self-acting PCV-105"}
  - {tag: FIC-106, sheet: P-01, service: "P-101/P-101B discharge flow, minimum flow FV-106 back to V-100"}
  - {tag: FIC-108, sheet: P-01, service: "Make-up hydrogen (HG-104), FV-108; set point from PIC-205 (loop pressure, P-02)"}
  - {tag: TI-109, sheet: P-01, service: E-101 cold side outlet (PG-106)}
  - {tag: FZ-110, sheet: P-01, service: "H-101 coil flow (PG-106), low-low trip of the firing (C&E I-101)"}
  - {tag: TIC-111, sheet: P-01, service: "H-101 outlet / R-101 inlet temperature (PG-107), fuel valve TV-111"}
  - {tag: US-112, sheet: P-01, service: "H-101 fuel trip logic, closes XV-112 (C&E I-101, I-102)"}
  - {tag: TZ-113, sheet: P-01, service: "R-101 outlet temperature, high-high trip of the firing (C&E I-102)"}
  - {tag: TIC-115, sheet: P-01, service: "Quenched effluent temperature (PG-108 after T117), quench valve TV-115 (AR-117)"}
  - {tag: TI-116, sheet: P-01, service: E-101 hot side outlet (PG-110)}
  # ---- P-02 HP separator and recycle gas
  - {tag: TI-201, sheet: P-02, service: E-102 process outlet / V-101 inlet temperature (PG-111)}
  - {tag: LIC-202, sheet: P-02, service: "V-101 level, let-down valve LV-202 on AR-116 to C-201"}
  - {tag: LZ-203, sheet: P-02, service: "V-101 level low-low, closes XV-204 (gas blow-by to C-201, C&E I-201)"}
  - {tag: PIC-205, sheet: P-02, service: "Loop pressure at the K-101 suction (HG-112); sets FIC-108 (make-up hydrogen, P-01)"}
  - {tag: LZ-206, sheet: P-02, service: "V-101 level high-high, stops K-101 (liquid carry-over, C&E I-202)"}
  - {tag: UIC-207, sheet: P-02, service: "K-101 anti-surge controller, recycle valve UV-207 (HG-232); flow and pressure inputs in the compressor package"}
  - {tag: HS-209, sheet: P-02, service: "Manual loop depressuring, opens XV-209 (FL-233)"}
  - {tag: AIC-210, sheet: P-02, service: "Hydrogen in the recycle gas (HG-115), sets the purge flow FIC-211"}
  - {tag: FIC-211, sheet: P-02, service: "Purge gas to the PSA (HG-113), FV-211"}
  # ---- P-03 purge PSA and tail gas
  - {tag: PIC-301, sheet: P-03, service: "PSA adsorption pressure, back-pressure valve PV-301 on the hydrogen product HG-125"}
  - {tag: AI-302, sheet: P-03, service: "Hydrogen purity of the PSA product (HG-125)"}
  - {tag: PIC-303, sheet: P-03, service: "Tail gas pressure at the K-102 suction (FG-126, PSA desorption pressure), spillback PV-303 on FG-330"}
  - {tag: TI-304, sheet: P-03, service: K-102 discharge temperature (FG-127)}
  - {tag: TI-305, sheet: P-03, service: E-103 outlet temperature (FG-128)}
  - {tag: FI-306, sheet: P-03, service: Tail gas to the fuel gas header (FG-128)}
