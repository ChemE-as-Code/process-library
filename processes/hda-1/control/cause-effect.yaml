# Cause and effect list: interlocks and trips. Schema: `cheme schema interlocks`.
# On a sheet, refer to an interlock ("see C&E I-01") instead of spelling out what it trips.
# S3b (D-025): the trips the P&IDs draw, PROPOSED; SIL, delays, resets and bypasses come with
# the control and safeguarding work (S4) and the HAZOP (S6).
schema: cheme/interlocks/v1
interlocks:
  - id: I-101
    title: H-101 coil flow low-low
    cause: {tag: FZ-110, condition: FALL}
    effects:
      - {tag: XV-112, action: close}
    sheet: P-01
    sil: null
    notes: "D-025. Loss of process flow through the fired coil overheats the tubes; the burner management system of the H-101 package also stops the burners. Logic US-112."
  - id: I-102
    title: R-101 outlet temperature high-high
    cause: {tag: TZ-113, condition: TAHH}
    effects:
      - {tag: XV-112, action: close}
    sheet: P-01
    sil: null
    notes: "D-025. Thermal HDA and the hydrocracking side reactions are exothermic: stopping the firing removes the heat input; the loop depressuring (HS-209/XV-209, P-02) is the operator's further action. Logic US-112."
  - id: I-201
    title: V-101 level low-low (gas blow-by to the stabiliser)
    cause: {tag: LZ-203, condition: LL}
    effects:
      - {tag: XV-204, action: close}
    sheet: P-02
    sil: null
    notes: "D-025. Losing the separator level would send loop gas at 32 barg into C-201 (design 9 barg) through LV-202; XV-204 is a separate shutdown valve, independent of the level loop LIC-202. PSV on C-201 (P-04) is the relief layer behind it; whether the blow-by is its governing case is for S8."
  - id: I-202
    title: V-101 level high-high (liquid carry-over to K-101)
    cause: {tag: LZ-206, condition: HH}
    effects:
      - {tag: K-101, action: stop}
    sheet: P-02
    sil: null
    notes: "D-025. Liquid slugs damage the recycle compressor. Stopping K-101 stops the recycle gas and with it the coil flow, so FZ-110 then trips the firing (I-101)."
  - id: I-401
    title: V-201 level low-low (reflux pumps running dry)
    cause: {tag: LZ-411, condition: LL}
    effects:
      - {tag: P-201A, action: stop}
      - {tag: P-201B, action: stop}
    sheet: P-04
    sil: null
    notes: "D-025. Machine protection of the reflux pumps, independent of the level loop LIC-405."
  - id: I-501
    title: V-202 level low-low (reflux and product pumps running dry)
    cause: {tag: LZ-512, condition: LL}
    effects:
      - {tag: P-202A, action: stop}
      - {tag: P-202B, action: stop}
    sheet: P-05
    sil: null
    notes: "D-025. Machine protection, independent of the level loop LIC-506. Losing the reflux upsets the benzene purity; the operator's response is in S4."
  - id: I-601
    title: V-203 level low-low (reflux and recycle pumps running dry)
    cause: {tag: LZ-612, condition: LL}
    effects:
      - {tag: P-203A, action: stop}
      - {tag: P-203B, action: stop}
    sheet: P-06
    sil: null
    notes: "D-025. Machine protection, independent of the level loop LIC-606; the suction is from a drum under vacuum, so NPSH is tight."
