# Process Atlas manifest of hda-1. Schema: schemas/process.schema.json (cheme-as-code/process/v1).
# plant.yaml stays the engineering manifest; sheets and results are derived from the
# ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: hda-1
title: Toluene hydrodealkylation to benzene (100 kt/a, thermal HDA)
summary: >-
  Thermal hydrodealkylation of toluene with hydrogen to benzene: adiabatic reactor, quench, HP
  separator, hydrogen recycle with purge and purge hydrogen recovery (PSA), stabiliser, benzene and toluene columns with toluene
  recycle and a biphenyl by-product. Concept stage, assumed basis, preliminary LCI (cradle-to-gate study, foreground inventory only).
description: |
  Fresh and recycled toluene are pumped, mixed with PSA-grade make-up hydrogen (99.9 mol%) and
  recycle gas at a hydrogen-to-aromatics ratio of 5, preheated against the reactor effluent and
  in a fired heater to 895 K, and react adiabatically at about 3.4 MPa (outlet 936 K). The
  reactor model takes 75 % toluene conversion per pass, the per-pass conversion of a published
  thermal HDA process (US 3,291,849), and the biphenyl reaction to equilibrium at the outlet. The
  effluent is quenched with separator liquid, cooled and separated at 313 K; a purge of the
  compressed recycle gas (40 mol% H2) removes the methane. A pressure swing adsorption unit
  recovers 75 % of the purge's hydrogen at 99.9 mol% into the recycle compressor suction, and
  its tail gas is compressed into the fuel gas header. The liquid is
  stabilised, benzene (99.9 mol%) is taken overhead in the benzene column and cooled to 313 K,
  and the vacuum toluene column returns toluene to the reactor and leaves biphenyl as bottoms.

  All values are concept estimates. The separator, column and duty values come from a DWSIM
  simulation of the whole plant (Peng-Robinson). ChemE-as-Code has not yet qualified that
  property package for this mixture, so the simulation is a cross-check of an independent
  balance script, not validated data; see DESIGN.md of the engineering files (D-014, D-020 to D-024) for every
  assumption and gated step. Designed independently: no flowsheet data of the IDAES HDA examples are used.
families: [aromatics]
keywords: [benzene, toluene, hydrodealkylation, HDA, hydrogen recycle, purge, PSA, biphenyl, diphenyl, distillation, aromatics]
facets:
  feedstock_basis: [fossil]
  product_classes: [chemicals]
  unit_operations: [reaction, heat-exchange, compression, flash, distillation, adsorption]
  region: generic
# Honest claim: concept is the lowest level of the manifest. cheme maturity reports calculation
# maturity balanced since S2 (gate maturity-balanced passes); predictive is not reached, see
# validation.notes and DESIGN.md D-021, D-022.
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD with closed mass, component and element balances (cheme validate, cheme process
    streams), simulated as a whole plant in DWSIM (Peng-Robinson, converged in 13 recycle
    iterations with the purge hydrogen PSA, D-024). The simulated plant's energy audit closes
    (residual 0.88 kW against a tolerance of 28.0 kW), but that closure includes 17.4 kW of heat
    to the isothermal biphenyl step that has no energy stream (a model artefact, D-021) and
    -4.39 kW stated by the PSA, a specified split (a DWSIM component separator whose recoveries
    come from a published range, not a prediction, D-024). cheme maturity reports
    calculation maturity balanced. The feeds are given from published specifications (D-020: a
    commercial toluene data sheet, BPCL/IS 537:2011, and a PSA hydrogen purity of 99.9 mol%,
    Matijasevic and Petric 2016). Their flows follow from the design capacity, which is itself
    ASSUMED (I-04). The reactor R-101 is modelled as a conversion step at the 75 % per-pass
    toluene conversion of a published thermal HDA reactor (US 3,291,849, adopted as the design
    value), followed by the biphenyl reaction at chemical equilibrium on the declared formation
    data (D-021). That equilibrium bounds the biphenyl make only, so the modelled benzene
    selectivity of 0.973 is optimistic: a published patent example reports 94.5 % at a higher
    conversion, and the TEA carries it as a scenario. Predictive fails on three requirements: model-basis (R101 is a
    specified conversion; no readable thermal HDA kinetics with units and range, and no
    homogeneous kinetic reactor in core), property-regime (core has not benchmarked
    Peng-Robinson for aromatics with hydrogen and methane) and formation-data (DWSIM's own
    formation data in the biphenyl equilibrium step). The stabiliser and the benzene column are
    DWSIM shortcut columns; their product fractions miss 1 by up to 1.7e-4 (core#130). The LCI
    is a cradle-to-gate study with the foreground inventory only, every background open
    (8 gaps): no impact result, and no LCA result passed to the catalog (lca.source none). Not
    reviewed. Main products and feeds are listed under chemistry with their chemicals registry
    entries (issue #251).
chemistry:
  inputs:
    - {chemical: toluene, role: feedstock, note: "feed:TOLF: fresh toluene, 1.23 kg/kg benzene"}
    - {chemical: hydrogen, role: feedstock, inventory_key: "feed:H2MU", note: "Make-up hydrogen of PSA grade, 99.9 mol% (D-020)"}
    - {chemical: methane, role: feedstock, inventory_key: "feed:H2MU", note: "0.1 mol% methane taken as the rest of the make-up hydrogen (ASSUMED), leaves with the PSA tail gas"}
  outputs:
    - {chemical: benzene, role: main-product, inventory_key: "product:BENZENE", note: "Benzene to storage"}
    - {chemical: biphenyl, role: co-product, inventory_key: "product:DIPHENYL", note: "Biphenyl (diphenyl) by-product"}
    - {chemical: hydrogen, role: co-product, inventory_key: "product:FUELGAS", note: "PSA tail gas and stabiliser off-gas (about 14 mol% H2, 84 % CH4, D-024) to the fuel gas header"}
    - {chemical: methane, role: co-product, inventory_key: "product:FUELGAS", note: "Methane formed by the reaction and with the make-up, in the fuel gas"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "Recycle compressor and toluene pump (ASSUMED electric drives)"}
    - {chemical: steam, role: utility, inventory_key: "feed:MPS", note: "MP steam 1500 kPa(a), stabiliser reboiler"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "LP steam 450 kPa(a), benzene column reboiler"}
    - {chemical: steam, role: utility, inventory_key: "feed:HPS", note: "HP steam 4200 kPa(a), toluene column reboiler"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "25/35 C (ASSUMED)"}
basis:
  capacity: "100 kt/a benzene (ASSUMED)"
  operating_hours_per_year: 8000
  location: generic (not chosen)
references:
  - {title: "King, C.C., Campagnolo, J.F., Lehman, L.M. (1966) Hydrodealkylation. US Patent 3,291,849 (Hydrocarbon Research, Inc.): per-pass toluene conversion of a thermal HDA reactor", url: "https://patents.google.com/patent/US3291849"}
  - {title: "Gulf Research & Development Co. (1971) Thermal hydrodealkylation process. US Patent 3,607,960: diphenyl in thermal HDA, primary-reactor benzene selectivity of Example 1", url: "https://patents.google.com/patent/US3607960A/en"}
  - {title: "Bharat Petroleum Corporation Ltd, toluene data sheet (IS 537:2011): fresh toluene specification", url: "https://bharatpetroleum.in/images/files/Data-Sheet-Toluene.pdf"}
  - {title: "Matijasevic, L., Petric, M. (2016) Integration of hydrogen systems in petroleum refinery. Chem. Biochem. Eng. Q. 30(3) 291-304, doi:10.15255/CABEQ.2015.2337 (PSA hydrogen purity, recovery and feed limit)"}
  - {title: "NETL (2022) Comparison of Commercial, State-of-the-Art, Fossil-Based Hydrogen Production Technologies, DOE/NETL-2022/3241: PSA pressures and the PSA package cost scaled for PK-101", url: "https://www.netl.doe.gov/projects/files/ComparisonofCommercialStateofArtFossilBasedHydrogenProductionTechnologies_041222.pdf"}
  - {title: "Speight, J.G. (2011) Handbook of Industrial Hydrocarbon Processes. Elsevier, Ch. 11 (hydrodealkylation conditions)"}
  - {title: "Cox, J.D., Wagman, D.D., Medvedev, V.A. (1989) CODATA Key Values for Thermodynamics. Hemisphere (CO2 and H2O formation enthalpies for the LHV)"}
  - {title: "IDAES HDA flowsheet examples (examples-pse v2.0.0 documentation): cited as a reference model of the route only; no data used", url: "https://idaes.github.io/examples-pse/latest/Tutorials/Basics/HDA_flowsheet_solution_doc.html"}
