     design_pressure_barg: 3.5, design_temperature_degc: 100, material: CS,
     dimensions: {diameter: 1.8, length: 3.6},
     notes: "150 kPa(a), 314 K, 20.5 t/h (S2). ASSUMED. Dimensions ASSUMED (D-017, scripts/concept_sizing.py)."}
  - {tag: P-101, type: CentrifugalPump, service: Toluene feed pump,
