     notes: "150 -> 3600 kPa(a), 20.5 t/h; ~37 kW at efficiency 0.65 counted from 30 kPa(a), i.e. incl. the C-203 distillate pump (D-010). A spare (P-101B) at basic engineering. ASSUMED. Dimensions ASSUMED (D-017, scripts/concept_sizing.py)."}
