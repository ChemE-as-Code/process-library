# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Acetic anhydride by the ketene route (D-001): acetic acid cracked to ketene and water at
# 700 C under vacuum with triethyl phosphate, ammonia quench, cracked gas condensed to -5 C
# (dilute acid out), ketene absorbed and reacted in acetic acid, crude anhydride distilled;
# the dilute acid is recovered and recycled; the vent is burned in the cracking furnace.
# Where the values come from:
# - the reactor outlets S7 (cracking coil, US 4,455,439 example conversion and selectivity),
#   S14 (absorber, ASSUMED) and S32 (firebox, complete combustion) are calculated by cheme;
#   mixers, the splitter and pass-through steps by `cheme process propagate --fill`;
# - feed flows, separator, column and acid-recovery outlets, the recycle streams S21 and S25,
#   all temperatures, pressures and duties come from the independent balance
#   scripts/ac2o_balance.py (D-006), given here as ASSUMED: core has no property package for
#   acetic acid / ketene / anhydride / water.
schema: cheme/process/v1
kind: flowsheet
title: Acetic anhydride by acetic acid cracking to ketene (50 kt/a, concept)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 6250 kg/h acetic anhydride 99.5 wt%, cracking conversion 0.84 and ketene selectivity 0.92 (US 4,455,439 example), D-002, D-005", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: AA, title: "Glacial acetic acid (boundary feed; e.g. methanol carbonylation, D-003)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: TEP, title: Triethyl phosphate (cracking catalyst), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NH3, title: Ammonia (catalyst neutraliser; ammonia-1 makes it), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NG, title: Natural gas to the furnace burners, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AIR, title: Combustion air, category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports: [{id: p301, direction: out, kind: energy}, {id: k301, direction: out, kind: energy}]
  - id: LPS
    title: LP steam 450 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis, D-011"}
      supply_temperature: {value: 420.8, provenance: assumed, source: "saturation at 450 kPa(a), D-011"}
      min_approach: {value: 10, provenance: assumed, source: D-011}
    ports: [{id: e101, direction: out, kind: energy}, {id: c401, direction: out, kind: energy}]
  - id: MPS
    title: MP steam 1500 kPa(a)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1500, provenance: assumed, source: "design basis, D-011"}
      supply_temperature: {value: 471.4, provenance: assumed, source: "saturation at 1500 kPa(a), D-011"}
      min_approach: {value: 10, provenance: assumed, source: D-011}
    ports: [{id: c201, direction: out, kind: energy}, {id: c202, direction: out, kind: energy}]
products:
  - {id: AC2O, title: Acetic anhydride 99.5 wt% to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: RESIDUE, title: "Distillation residue (heavy ends, liquid) to incineration", category: solid_waste, ports: [{id: in, direction: in}]}
  - {id: WW, title: Wastewater from dilute acid recovery, category: wastewater, ports: [{id: in, direction: in}]}
  - {id: STACK, title: Furnace flue gas to atmosphere, category: emission, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-011"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-011"}
      min_approach: {value: 5, provenance: assumed, source: D-011}
    ports:
      - {id: e102, direction: in, kind: energy}
      - {id: t301, direction: in, kind: energy}
      - {id: c201, direction: in, kind: energy}
      - {id: c202, direction: in, kind: energy}
      - {id: c401, direction: in, kind: energy}
  - id: BRINE
    title: Brine -10 C (refrigeration) return
    category: utility
    utility:
      kind: refrigerant
      level: brine -10 C
      supply_temperature: {value: 263.15, provenance: given, source: "US 4,455,439 Example: brine at -10 C on the last condensers"}
      return_temperature: {value: 266.15, provenance: assumed, source: D-011}
      min_approach: {value: 3, provenance: assumed, source: D-011}
    ports: [{id: e102, direction: in, kind: energy}]

blocks:
  - id: CRK
    title: Ketene generation (vaporiser, cracking furnace, quench and condensation)
    class: ReactingChemicals
    ports:
      - {id: aa, direction: in}
      - {id: tep, direction: in}
      - {id: nh3, direction: in}
      - {id: ng, direction: in}
      - {id: air, direction: in}
      - {id: vent, direction: in}
      - {id: rec, direction: in}
      - {id: acid_abs, direction: out}
      - {id: ketgas, direction: out}
      - {id: dilute, direction: out}
      - {id: flue, direction: out}
      - {id: lps, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: brine, direction: out, kind: energy}
  - id: ABS
    title: Ketene absorption in acetic acid and vent compression
    class: ReactingChemicals
    ports:
      - {id: acid, direction: in}
      - {id: ketgas, direction: in}
      - {id: rec, direction: in}
      - {id: vent, direction: out}
      - {id: crude, direction: out}
      - {id: cw, direction: out, kind: energy}
      - {id: power1, direction: in, kind: energy}
      - {id: power2, direction: in, kind: energy}
  - id: DST
    title: Crude anhydride distillation (acid and anhydride columns)
    class: Distilling
    ports:
      - {id: crude, direction: in}
      - {id: rec, direction: out}
      - {id: product, direction: out}
      - {id: residue, direction: out}
      - {id: steam1, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
  - id: ARU
    title: Dilute acid recovery (solvent extraction and azeotropic dehydration)
    class: SeparatingByThermalProcess
    ports:
      - {id: dilute, direction: in}
      - {id: acid, direction: out}
      - {id: ww, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}

steps:
  # --- CRK -----------------------------------------------------------------------------
  - id: SP101
    block: CRK
    title: Fresh acid split (cracker / absorber)
    class: SplittingMaterial
    split: {crk: 0.52421}   # D-006: fresh acid to the cracker, from scripts/ac2o_balance.py
    ports:
      - {id: in, direction: in, delegates: aa}
      - {id: crk, direction: out}
      - {id: abs, direction: out, delegates: acid_abs}
  - id: M101
    block: CRK
    title: Cracker feed (fresh + recovered acid + catalyst)
    class: Mixing
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: fresh, direction: in}
      - {id: rec, direction: in, delegates: rec}
      - {id: tep, direction: in, delegates: tep}
      - {id: out, direction: out}
  - id: E101
    block: CRK
    title: Acetic acid vaporiser
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: lps}
  - id: M103
    block: CRK
    title: Burners (natural gas, vent gas, air)
    class: Mixing
    ports:
      - {id: vent, direction: in, delegates: vent}
      - {id: ng, direction: in, delegates: ng}
      - {id: air, direction: in, delegates: air}
      - {id: out, direction: out}
  # D-010: firebox of the cracking furnace F-101, complete combustion with 15 % excess air.
  - id: H101
    block: CRK
    title: Cracking furnace firebox
    class: ReactingChemicals
    reactions: [COMB_CH4, COMB_CO, COMB_C2H4, COMB_KET]
    reactor: conversion   # conversions 1.0 of process/reactions.yaml (complete combustion)
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: flue}
      - {id: heat, direction: out, kind: energy}
  # D-005: acetic acid conversion 0.84 per pass and ketene 0.92 kmol per kmol acid converted
  # (US 4,455,439 example); the 8 % loss split equally (ASSUMED) between acid decomposition to
  # CH4 + CO2 (0.04) and ketene decomposition to ethylene + CO.
  - id: R101
    block: CRK
    title: Cracking coil (700 C, 36 kPa(a), TEP catalyst)
    class: ReactingChemicals
    reactions: [CRACK, DECARB, KETDEC]
    reactor: conversion
    selectivity: {key: ACOH, conversion: 0.84, products: {KET: 0.92, CH4: 0.04}, provenance: assumed, source: "D-005: conversion and ketene selectivity from US 4,455,439 example; CH4 share ASSUMED"}
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy}
  - id: M102
    block: CRK
    title: Ammonia injection at the coil outlet
    class: Mixing
    ports:
      - {id: in, direction: in}
      - {id: nh3, direction: in, delegates: nh3}
      - {id: out, direction: out}
  - id: E102
    block: CRK
    title: Cracked gas condenser train (cooling water, then -10 C brine)
    class: Cooling
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
      - {id: brine, direction: out, kind: energy, delegates: brine}
  - id: V102
    block: CRK
    title: Condensate separator (ketene gas / dilute acid)
    class: SeparatingByPhaseSeparation
    links: [{target: equipment, ref: V-102}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out, delegates: ketgas}
      - {id: liq, direction: out, delegates: dilute}
  # --- ABS -----------------------------------------------------------------------------
  - id: M301
    block: ABS
    title: Absorber inlets (ketene gas, fresh and recycled acid)
    class: Mixing
    ports:
      - {id: ket, direction: in, delegates: ketgas}
      - {id: acid, direction: in, delegates: acid}
      - {id: rec, direction: in, delegates: rec}
      - {id: out, direction: out}
  # D-007: 99 % of the ketene absorbed (1 % to the vent) and 99 % of it to anhydride, 1 % to
  # heavy ends (lumped as DHA); ASSUMED.
  - id: T301
    block: ABS
    title: Ketene absorbers (reactive absorption in circulating crude, 45 C)
    class: ReactingChemicals
    reactions: [ABSORB, OLIGO]
    reactor: conversion
    # Per-reaction conversions of the inlet ketene (RStoic-like) instead of a selectivity: a
    # second selectivity step trips a core bug in cheme 0.8.0 (D-012).
    conversion: {ABSORB: 0.9801, OLIGO: 0.0099}
    links: [{target: equipment, ref: T-301}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
      - {id: power, direction: in, kind: energy, delegates: power1}
  - id: V301
    block: ABS
    title: Absorber top (vent / crude anhydride)
    class: SeparatingByPhaseSeparation
    ports:
      - {id: in, direction: in}
      - {id: vent, direction: out}
      - {id: crude, direction: out, delegates: crude}
  - id: K301
    block: ABS
    title: Vent vacuum pump (liquid ring)
    class: Compressing
    links: [{target: equipment, ref: K-301}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: vent}
      - {id: power, direction: in, kind: energy, delegates: power2}
  # --- DST -----------------------------------------------------------------------------
  - id: C201
    block: DST
    title: Acid column (acetic acid overhead to the absorbers)
    class: Distilling
    links: [{target: equipment, ref: C-201}]
    ports:
      - {id: in, direction: in, delegates: crude}
      - {id: top, direction: out, delegates: rec}
      - {id: bot, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam1}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: C202
    block: DST
    title: Anhydride column (product overhead, residue bottoms)
    class: Distilling
    links: [{target: equipment, ref: C-202}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out, delegates: product}
      - {id: bot, direction: out, delegates: residue}
      - {id: steam, direction: in, kind: energy, delegates: steam2}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  # --- ARU -----------------------------------------------------------------------------
  - id: C401
    block: ARU
    title: Dilute acid recovery (extraction + azeotropic dehydration, lumped)
    class: SeparatingByThermalProcess
    links: [{target: equipment, ref: C-401}]
    ports:
      - {id: in, direction: in, delegates: dilute}
      - {id: acid, direction: out, delegates: acid}
      - {id: ww, direction: out, delegates: ww}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: cw, direction: out, kind: energy, delegates: cw}

streams:
  # --- boundary feeds ------------------------------------------------------------------
  - id: S1
    title: Fresh glacial acetic acid
    from: AA.out
    to: SP101.in
    template: process
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: D-003}
        temperature: {value: 303.15, provenance: assumed, source: D-003}
        flow: {value: 7786.11, basis: mass, provenance: assumed, source: "scripts/ac2o_balance.py (D-006): set by the product rate"}
        composition: {basis: mole_fraction, values: {ACOH: 1.0}, provenance: assumed, source: "D-003: glacial acid taken as pure"}
  - id: S4
    title: Triethyl phosphate
    from: TEP.out
    to: M101.tep
    template: process
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: D-005}
        temperature: {value: 303.15, provenance: assumed, source: D-005}
        flow: {value: 9.72, basis: mass, provenance: assumed, source: "D-005: 0.2 wt% of the cracker feed (US 8,653,303: 0.1-0.5 wt%); scripts/ac2o_balance.py"}
        composition: {basis: mole_fraction, values: {TEP: 1.0}, provenance: assumed, source: D-005}
  - id: S8
    title: Ammonia
    from: NH3.out
    to: M102.nh3
    template: process
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: D-005}
        temperature: {value: 298.15, provenance: assumed, source: D-005}
        flow: {value: 1.82, basis: mass, provenance: assumed, source: "D-005: 2 mol NH3 per mol P of the TEP; scripts/ac2o_balance.py"}
        composition: {basis: mole_fraction, values: {NH3: 1.0}, provenance: assumed, source: D-005}
  - id: S30
    title: Natural gas (as methane)
    from: NG.out
    to: M103.ng
    template: natural_gas
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: D-010}
        temperature: {value: 303.15, provenance: assumed, source: D-010}
        flow: {value: 250.40, basis: mass, provenance: assumed, source: "scripts/ac2o_balance.py (D-010): firebox energy balance"}
        composition: {basis: mole_fraction, values: {CH4: 1.0}, provenance: assumed, source: "D-010: natural gas taken as methane"}
  - id: S31
    title: Combustion air
    from: AIR.out
    to: M103.air
    template: air
    state:
      design:
        pressure: {value: 103, provenance: assumed, source: D-010}
        temperature: {value: 298.15, provenance: assumed, source: D-010}
        flow: {value: 6844.04, basis: mass, provenance: assumed, source: "scripts/ac2o_balance.py (D-010): 15 % excess O2"}
        composition: {basis: mole_fraction, values: {N2: 0.79, O2: 0.21}, provenance: assumed, source: "D-010: dry air without argon"}
  # --- CRK -----------------------------------------------------------------------------
  - id: S2
    title: Fresh acid to the cracker
    from: SP101.crk
    to: M101.fresh
    template: process
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: D-006}
        temperature: {value: 303.15, provenance: assumed, source: D-006}
        flow: {value: 4081.56, basis: mass, provenance: calculated, source: 'cheme process propagate: splitter SP101 from S1', fingerprint: 3a1d14ecc9ab2ad0}
        composition: {basis: mole_fraction, values: {ACOH: 1.0}, provenance: calculated, source: 'cheme process propagate: splitter SP101 from S1', fingerprint: dcff1f3f6e093818}
  - id: S3
    title: Fresh acid to the absorbers
    from: SP101.abs
    to: M301.acid
    template: process
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: D-006}
        temperature: {value: 303.15, provenance: assumed, source: D-006}
        flow: {value: 3704.55, provenance: calculated, source: 'cheme process propagate: splitter SP101 from S1 S2', fingerprint: c0b4b41f20c33885}
        composition: {basis: mole_fraction, values: {ACOH: 1.0}, provenance: calculated, source: 'cheme process propagate: splitter SP101 from S1', fingerprint: dcff1f3f6e093818}
  - id: S5
    title: Cracker feed
    from: M101.out
    to: E101.in
    template: process
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: D-006}
        temperature: {value: 303.15, provenance: assumed, source: "D-006: recovered acid cooled to the fresh acid's temperature"}
        flow: {value: 4861.02, provenance: calculated, source: 'cheme process propagate: mixer M101 from S4 S2 S21', fingerprint: 26a4a97ad717dd58}
        composition: {basis: mole_fraction, values: {ACOH: 0.998284, KET: 0.0, H2O: 0.00105635, CH4: 0.0, CO2: 0.0, CO: 0.0, C2H4: 0.0, AC2O: 0.0, DHA: 0.0, TEP: 0.000659609, NH3: 0.0}, provenance: calculated, source: 'cheme process propagate: mixer M101 from S4 S2 S21', fingerprint: 156ef89d32f8a32d}
  - id: S6
    title: Acetic acid vapour to the furnace
    from: E101.out
    to: R101.in
    template: process
    state:
      design:
        pressure: {value: 45, provenance: assumed, source: "D-005: coil inlet, about 9 kPa above the outlet"}
        temperature: {value: 367.0, provenance: assumed, source: "D-006: acetic acid saturation near 45 kPa(a) (thermo vapour pressure)"}
        flow: {value: 4861.02, provenance: calculated, source: 'cheme process propagate: pass-through E101 from S5', fingerprint: f10d7b870fa892f3}
        composition: {basis: mole_fraction, values: {ACOH: 0.998284, KET: 0.0, H2O: 0.00105635, CH4: 0.0, CO2: 0.0, CO: 0.0, C2H4: 0.0, AC2O: 0.0, DHA: 0.0, TEP: 0.000659609, NH3: 0.0}, provenance: calculated, source: 'cheme process propagate: pass-through E101 from S5', fingerprint: f10d7b870fa892f3}
  - id: S7
    title: Cracked gas
    from: R101.out
    to: M102.in
    template: process
    state:
      design:
        pressure: {value: 36, provenance: given, source: "US 4,455,439 Example: 358 mbar at the furnace outlet"}
        temperature: {value: 973.15, provenance: given, source: "US 4,455,439 Example: 700 C"}
        flow: {value: 4861.02, provenance: calculated, source: 'cheme process propagate: reactor R101 from S6', fingerprint: dd4c668887121f14}
        composition: {basis: mole_fraction, values: {ACOH: 0.0860901, KET: 0.415815, H2O: 0.434463, CH4: 0.0180789, CO2: 0.0180789, CO: 0.0180789, C2H4: 0.00903946, AC2O: 0.0, DHA: 0.0, TEP: 0.000355521, NH3: 0.0}, provenance: calculated, source: 'cheme process propagate: reactor R101 from S6', fingerprint: 5c693e39682d21d3}
  - id: S9
    title: Cracked gas after ammonia injection
    from: M102.out
    to: E102.in
    template: process
    state:
      design:
        pressure: {value: 35.8, provenance: assumed, source: D-006}
        temperature: {value: 960.0, provenance: assumed, source: "D-006: estimate, the condenser duty is counted from S7"}
        flow: {value: 4862.84, provenance: calculated, source: 'cheme process propagate: mixer M102 from S8 S7', fingerprint: dd81dd5db5baa29e}
        composition: {basis: mole_fraction, values: {ACOH: 0.0860289, KET: 0.415519, H2O: 0.434154, CH4: 0.018066, CO2: 0.018066, CO: 0.018066, C2H4: 0.00903303, AC2O: 0.0, DHA: 0.0, TEP: 0.000355268, NH3: 0.000711479}, provenance: calculated, source: 'cheme process propagate: mixer M102 from S8 S7', fingerprint: 5cc58abc9718f5b2}
  - id: S10
    title: Cooled cracked gas and condensate
    from: E102.out
    to: V102.in
    template: process
    state:
      design:
        pressure: {value: 27, provenance: given, source: "US 4,455,439 Example: 266 mbar at the condenser outlet"}
        temperature: {value: 268.15, provenance: given, source: "US 4,455,439 Example: crude ketene at -5 C"}
        flow: {value: 4862.84, provenance: calculated, source: 'cheme process propagate: pass-through E102 from S9', fingerprint: d7ea96f73f132473}
        composition: {basis: mole_fraction, values: {ACOH: 0.0860289, KET: 0.415519, H2O: 0.434154, CH4: 0.018066, CO2: 0.018066, CO: 0.018066, C2H4: 0.00903303, AC2O: 0.0, DHA: 0.0, TEP: 0.000355268, NH3: 0.000711479}, provenance: calculated, source: 'cheme process propagate: pass-through E102 from S9', fingerprint: d7ea96f73f132473}
  - id: S11
    title: Crude ketene gas
    from: V102.gas
    to: M301.ket
    template: process
    state:
      design:
        pressure: {value: 27, provenance: given, source: "US 4,455,439 Example: 266 mbar"}
        temperature: {value: 268.15, provenance: given, source: "US 4,455,439 Example: -5 C"}
        flow: {value: 2900.58, basis: mass, provenance: assumed, source: "scripts/ac2o_balance.py (D-006): all ketene and non-condensables, dry"}
        composition: {basis: mole_fraction, values: {KET: 0.867925, CH4: 0.037736, CO2: 0.037736, C2H4: 0.018868, CO: 0.037736}, provenance: assumed, source: "scripts/ac2o_balance.py (D-006)"}
  - id: S12
    title: Dilute acetic acid (condensate)
    from: V102.liq
    to: C401.in
    template: process
    state:
      design:
        pressure: {value: 27, provenance: assumed, source: D-006}
        temperature: {value: 268.15, provenance: assumed, source: D-006}
        flow: {value: 1962.25, basis: mass, provenance: assumed, source: "scripts/ac2o_balance.py (D-006): water, unconverted acid, catalyst residues (39.5 wt% acid; US 4,455,439 example 38 wt%)"}
        composition: {basis: mole_fraction, values: {ACOH: 0.165044, H2O: 0.832911, TEP: 0.000682, NH3: 0.001363}, provenance: assumed, source: "scripts/ac2o_balance.py (D-006)"}
  # --- ABS -----------------------------------------------------------------------------
  - id: S13
    title: Absorber feed
    from: M301.out
    to: T301.in
    template: process
