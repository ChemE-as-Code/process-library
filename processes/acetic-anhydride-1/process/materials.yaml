# Components and templates of the process. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
# Ideal-gas and critical data: `cheme chemistry thermo <names> --fit 298.15,1100` (the
# `chemicals` package: ATcT/CRC formation enthalpies, CRC/Yaws entropies, heat capacities fitted
# to thermo's TRC ideal-gas correlations); acetic anhydride without --fit (Poling 5th ed., 298 to
# 1000 K: it is never hotter than about 450 K in this process). Normal boiling points: the
# `chemicals` package (Tb). DHA (dehydroacetic acid) stands for the heavy ends (ketene
# oligomers, tars) as one lumped component (D-007); TEP (triethyl phosphate, the cracking
# catalyst) and NH3 (its neutraliser) are carried as inert components to the dilute acid and
# the wastewater (D-005), a lumped representation of the phosphoric acid and ammonium
# phosphates they form.
schema: cheme/process/v1
kind: materials
