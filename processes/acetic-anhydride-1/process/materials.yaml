# property_method is a placeholder until `cheme process props --fill` records the method: its
# benchmarked property package, package versions and application range. No packaged method
# covers acetic acid, ketene, acetic anhydride or water (D-006); the flowsheet's
# temperatures, phases and duties come from scripts/ac2o_balance.py.
property_method:
  adapter: thermo
  status: placeholder
