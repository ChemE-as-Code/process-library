cutoff:
- key: cutoff:small-pumps-power
  title: Feed, reflux, distillate and transfer pumps power
  amount: 25.0
  unit: kWh
  reason: feed pump, the reflux and distillate pumps of C-201, C-202 and C-401 and transfer pumps, each
    a few kW, together about 25 kW x 8000 h/a (ASSUMED upper estimate, D-011); not in the flowsheet's
    power feed
  source: D-011
- key: cutoff:entrainer-makeup
  title: Extraction/entrainer solvent make-up (e.g. butyl acetate) of the acid recovery
  amount: 1.0
  reason: 'solvent losses of the extraction and azeotropic dehydration, about 1 kg/h (ASSUMED order of
    magnitude, not designed: C-401 is a lumped unit, D-009)'
  source: D-009
- key: cutoff:decoking
  title: Furnace coil decoking (steam and air, burnt coke)
  amount: 0.625
  reason: coke burnt off the cracking coil during periodic decoking, as CO2; amount not known (ASSUMED
    order of magnitude), the coke yield is not in the conversion model (D-005)
  source: D-005
- key: emission-excluded:furnace-pollutants
  title: combustion emissions of F-101
  direction: output
  reason: 'NOx, CO, unburnt hydrocarbons and particulates of the cracking furnace are not estimated, not
    claimed negligible: the flowsheet assumes complete combustion and no sourced emission factor for this
    furnace has been chosen (e.g. EMEP/EEA guidebook or AP-42 natural gas combustion factors, to be added
    as an emission_estimates entry with its source; DESIGN.md I-05)'
  source: DESIGN.md D-014, I-05
- key: emission-excluded:fugitive-leaks
  title: equipment-leaks emissions of the plant
  direction: output
  reason: 'fugitive acetic acid, acetic anhydride and ketene from flanges, seals and valves are not estimated,
    not claimed negligible: an equipment-leak estimate needs P&ID component counts, which do not exist
    at the concept stage (DESIGN.md I-06)'
  source: DESIGN.md I-06
- key: emission-excluded:storage-tanks
  title: storage-tank emissions of the plant
  direction: output
  reason: 'acid feed, product and residue tanks are outside the battery limit (design basis): their breathing
    losses belong to the storage, not to this boundary'
  source: design basis
- key: emission-excluded:no-other-effluent
  title: effluent emissions of the plant
  direction: output
  reason: the only liquid effluent is the acid-recovery wastewater S22, in the inventory; the liquid-ring
    pump seal fluid is acetic acid/anhydride returned to the process (US 8,653,303 B2), not an effluent
  source: D-007, D-009
