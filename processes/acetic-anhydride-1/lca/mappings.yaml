# acetic-anhydride-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# None yet, on purpose (DESIGN.md D-014): the process's preliminary LCI
# leaves every background unmapped, so each exchange is a reported gap, not a guessed link.
# Candidates for the mapping step, all entries the shared file already has:
#   feed:LPS, feed:MPS -> steam-heat (steam counted as heat delivered, kWh)
#   feed:NH3           -> ammonia (no registry slug yet)
#   feed:NG            -> natural-gas (by mass, as methane)
#   product:WW         -> wastewater (by mass)
# and new shared entries needed first: acetic acid (feed:AA), triethyl phosphate (feed:TEP),
# refrigeration at -10 C (product:BRINE), hazardous liquid waste incineration (product:RESIDUE).
schema: cheme-as-code/lci-process-mappings/v1
exchanges: {}
