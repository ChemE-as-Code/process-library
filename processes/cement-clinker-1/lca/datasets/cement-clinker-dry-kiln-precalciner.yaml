# Tier 1 form, without a flowsheet. Every amount is the formula of its parameters; core's
# validator re-checks each. Written from the CLM BREF, IPCC 2006 and the CSI/ECRA papers (facts in our own form).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: cement-clinker-dry-kiln-precalciner
title: Portland cement clinker in a dry rotary kiln with cyclone preheater and precalciner
description: Per 1 t of grey clinker, gate-to-gate, EU technology of the CLM BREF. Raw meal and calcination CO2
  from IPCC default clinker chemistry, fuel energy and stack emissions from BREF ranges and BAT-AELs, petroleum
  coke as the only fuel (ASSUMED), electricity from the CSI/ECRA GNR-2014 reference plant.
basis: 1000 kg of cement clinker
boundary: 'gate-to-gate: raw meal grinding and homogenisation, fuel grinding, preheater, precalciner, rotary kiln,
  clinker cooler and kiln stack; quarrying in the raw-material backgrounds; cement grinding not included'
technology: dry process, rotary kiln with four to six cyclone stages, precalciner and grate cooler; kiln gas filtered
  (ESP or fabric filter); no carbon capture
geography:
  description: EU technology and emission levels (CLM BREF), IPCC default chemistry, electricity of a world-average
    reference plant; no single site.
classification:
  isic: '2394'
system_boundary:
  included:
  - carbonate and non-carbonate raw materials, as the oxides of the clinker
  - kiln fuel, electricity
  - calcination and fuel CO2, CH4 and N2O of fuel combustion
  - kiln stack NOx, SO2, CO, dust in three size classes, mercury
  - lost cement kiln dust
  excluded:
  - 'TODO combined water, organic carbon (1.5 to 6 g C/kg clinker, BREF 1.3.4.4.2) and sulfur of the raw materials:
    not modelled, so the raw meal is low (see benchmarks) and the organic CO2 is missing (up to about 22 kg/t)'
  - TODO a fuel mix with coal and waste fuels, and their biogenic share (BREF 1.3.3.3)
  - TODO SNCR reagent (ammonia or urea) and its NH3 slip (BAT-AEL <30 to 50 mg/Nm3, Table 4.3)
  - TODO TOC, HCl, HF, PCDD/F and metals other than mercury in the kiln gas (BREF Table 1.23)
  - TODO dust of the clinker cooler and mills stacks and diffuse dust
  - TODO refractory lining, grinding media, water for gas conditioning
  - raw material moisture evaporated in the raw mill
  - waste heat recovery or power generation from kiln gases (none credited)
  - cement grinding, gypsum and mineral additions (a cement process, not clinker)
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: RER
year: 2013
valid_until: 2018
time:
  start: 2004
  description: CLM BREF published 2013 with data of about 2004 to 2008 and BAT conclusions of 2013; IPCC 2006 defaults;
    electricity of the GNR-2014 reference plant. valid_until is the reference year + 5 (system-model section 6),
    so it has already lapsed.
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation (lost kiln dust is a waste)'
uuid: 9fe50b71-d72c-594e-b762-66a98b354de2
version: 0.1.0
methodology_version: 1.0.0
system_model: cutoff
technology_level: current
review: unreviewed
rights: CC-BY-4.0
data_generator: ChemE-as-Code process library
parameters:
- name: clk
  value: 1000.0
  unit: kg
  description: Clinker leaving the cooler (the basis).
  source: basis
- name: n_Ca
  value: 325.0
  unit: mol/mol
  description: 'Calcium atoms per formula unit of the model clinker Ca325Mg14Si109Al34Fe12O626: the clinker modelled
    as its five main oxides.'
  source: ASSUMED model formula, fitted with integer counts to 65 % CaO (IPCC default, IPCC (2006) Guidelines for
    National GHG Inventories, Vol. 3, ch. 2 (Mineral Industry), section 2.2.1.2, p. 2.11), 2 % MgO (typical, EU
    JRC (2013) CLM BREF, EUR 26129 EN, doi:10.2788/12850, Table 1.5, p. 7) and the rest as SiO2, Al2O3 and Fe2O3
    in the ratio of the typical phases of the same table (C3S 65, C2S 15, C3A 10, C4AF 10 %); it gives 65.02 % CaO,
    2.01 % MgO, 23.36 % SiO2, 6.18 % Al2O3, 3.42 % Fe2O3. Minor constituents (alkali sulfates, free lime split,
    fuel ash) are not modelled
- name: M_CLK
  value: 28029.787
  unit: g/mol
  description: Molar mass of the model clinker formula Ca325Mg14Si109Al34Fe12O626.
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573), applied to
    the formula
- name: M_COR
  value: 9804.762
  unit: g/mol
  description: Molar mass of the model non-carbonate raw materials Mg14Si109Al34Fe12O301 (the clinker's oxides other
    than CaO).
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573), applied to
    the formula
- name: M_CaCO3
  value: 100.086
  unit: g/mol
  description: Molar mass of calcium carbonate.
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573), applied to
    the formula
- name: M_CO2
  value: 44.009
  unit: g/mol
  description: Molar mass of carbon dioxide.
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573), applied to
    the formula
- name: cf_ckd
  value: 1.02
  unit: '1'
  description: 'Correction factor for cement kiln dust (CKD) not recycled to the kiln: the CO2 of lost, calcined
    dust added to that of the clinker.'
  source: IPCC (2006) Guidelines for National GHG Inventories, Vol. 3, ch. 2 (Mineral Industry), section 2.2.1.2,
    pp. 2.12-2.13 (default 1.02 in the absence of data; about 1.015 for a modern plant). Modelling the lost dust
    as 2 % of the clinker mass, fully calcined and of clinker composition, so that Equation 2.5 gives the same factor,
    is ASSUMED
- name: q_fuel
  value: 3500.0
  unit: MJ
  description: 'Kiln fuel per t clinker, net calorific value: midpoint of 3000 to under 4000 MJ/t for dry kilns
    with multistage cyclone preheaters and precalciner (EU, annual averages).'
  source: EU JRC (2013) CLM BREF, EUR 26129 EN, doi:10.2788/12850, section 1.3.3.1, Table 1.18, p. 47 (range); the
    midpoint is our choice. The same section names about 3000 to more than 3800 MJ/t in practice; 2900 to 3300 MJ/t
    is reached under optimised conditions (section 1.4.2.1.1, p. 100)
- name: ncv_pc
  value: 32.5
  unit: MJ/kg
  description: Net calorific value of petroleum coke.
  source: IPCC (2006) Guidelines for National GHG Inventories, Vol. 2, ch. 1 (Introduction), Table 1.2, p. 1.18
    (default 32.5 TJ/Gg, 95 % interval 29.7 to 41.9). The fuel being 100 % petroleum coke is ASSUMED, as in the
    CEMBUREAU mass balance example of EU JRC (2013) CLM BREF, EUR 26129 EN, doi:10.2788/12850, Figure 1.19, p. 44;
    EU kilns burn coal, petroleum coke and waste fuels (section 1.3.3.3). TODO a fuel mix
- name: ef_co2
  value: 97500.0
  unit: kg/TJ
  description: CO2 per TJ of petroleum coke burnt (NCV basis), oxidation factor 1.
  source: IPCC (2006) Guidelines for National GHG Inventories, Vol. 2, ch. 2 (Stationary Combustion), Table 2.3,
    p. 2.18 (manufacturing industries; 95 % interval 82 900 to 115 000), equal to IPCC (2006) Guidelines for National
    GHG Inventories, Vol. 2, ch. 1 (Introduction), Table 1.4
- name: ef_ch4
  value: 3.0
  unit: kg/TJ
  description: CH4 per TJ of petroleum coke burnt.
  source: IPCC (2006) Guidelines for National GHG Inventories, Vol. 2, ch. 2 (Stationary Combustion), Table 2.3,
    p. 2.18 (manufacturing industries; range 1 to 10)
- name: ef_n2o
  value: 0.6
  unit: kg/TJ
  description: N2O per TJ of petroleum coke burnt.
  source: IPCC (2006) Guidelines for National GHG Inventories, Vol. 2, ch. 2 (Stationary Combustion), Table 2.3,
    p. 2.18 (manufacturing industries; range 0.2 to 2)
- name: elec
  value: 70.0
  unit: kWh
  description: 'Electricity per t clinker for clinker production: raw meal preparation, fuel grinding and the kiln
    line, 51 % of the reference plant''s electricity.'
  source: 'CSI/ECRA (2017) Development of State of the Art Techniques in Cement Manufacturing: Trying to Look Ahead,
    revision 2017 (WBCSD Cement Sustainability Initiative and ECRA), Annex II, p. 168 (reference plant of the GNR-2014
    world average, 70 kWh/t clinker, stated as 51 % of 104 kWh/t cement at a clinker factor of 75.2 %); the source
    does not say which steps the 51 % covers. Reading it as raw material preparation, fuel grinding and clinker
    production is ASSUMED: the source''s split of the plant''s electricity (Paper No. 2, p. 11) gives 25, 3 and 25 %
    for them, 53 % together, close to but not equal to the 51 %; quarrying (2 %) is in the limestone background'
- name: v_fg
  value: 2300.0
  unit: Nm3
  description: Kiln exhaust gas per t clinker, dry, 273 K, 101.3 kPa, for suspension preheater and precalciner kilns.
  source: EU JRC (2013) CLM BREF, EUR 26129 EN, doi:10.2788/12850, section 1.3.4, p. 55 (the volume the source uses
    to turn concentrations into kg/t)
- name: c_nox
  value: 325.0
  unit: mg/Nm3
  description: 'NOx (as NO2) in the kiln stack: midpoint of the BAT-AEL <200 to 450 mg/Nm3 for preheater kilns (daily
    average).'
  source: EU JRC (2013) CLM BREF, EUR 26129 EN, doi:10.2788/12850, BAT 19, Table 4.2, p. 349; the midpoint is our
    choice, and that an EU kiln operates within the BAT-AEL (with SNCR where needed) is ASSUMED
- name: c_so2
  value: 225.0
  unit: mg/Nm3
  description: 'SOx (as SO2) in the kiln stack: midpoint of the BAT-AEL <50 to 400 mg/Nm3, which depends on the
    sulfur in the raw materials.'
  source: EU JRC (2013) CLM BREF, EUR 26129 EN, doi:10.2788/12850, BAT 21, Table 4.4, p. 351; the midpoint is our
    choice
- name: c_dust
  value: 15.0
  unit: mg/Nm3
  description: 'Dust in the kiln stack: midpoint of the BAT-AEL <10 to 20 mg/Nm3.'
  source: EU JRC (2013) CLM BREF, EUR 26129 EN, doi:10.2788/12850, BAT 17, p. 348; the midpoint is our choice
- name: f_pm25
  value: 0.5
