# cement-clinker-1's own exchange overrides for the Atlas LCI build (ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. feed:limestone links through its registry slug
# (the shared `limestone` entry). feed:clay and feed:petroleum-coke stay reported gaps: the shared
# vocabulary has no entry for them, and the fuel is counted in kWh, which needs a unit proxy.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "output:ckd":
    use: inert-waste-landfill
    source: "Lost cement kiln dust to landfill as a mineral, non-hazardous solid (ASSUMED inert; its alkali content may call for another landfill type). Dust reused in other products would be cut off instead."
