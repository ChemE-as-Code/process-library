  - {title: "Meessen, J.H. Urea. Ullmann's Encyclopedia of Industrial Chemistry (identity verified; not numerically audited)", doi: 10.1002/14356007.a27_333.pub2}
  - {title: "Meessen, J.H. (2014) Urea synthesis. Chemie Ingenieur Technik 86:2180-2189 (abstract only; not numerically audited)", doi: 10.1002/cite.201400064}
