# Equipment list. Schema: `cheme schema equipment`.
# Concept stage: the items the PFD (process/flowsheet.yaml) needs, no P&ID yet (no sheet).
# Design pressure and temperature are ASSUMED concept values (DESIGN.md D-012): one design
# pressure per pressure level (HP loop 160 barg, LP section 6 barg, vacuum section full vacuum
# / 3.5 barg), design temperature the highest operating value + about 25 K. Duties and flows
# from scripts/urea_balance.py (D-006, D-010). Materials of the carbamate service are a
# corrosion-governed choice (urea-grade austenitic or duplex stainless steel with passivation
# air) and an open input for the licensor/materials engineer (D-012). Sizes, dimensions and
# weights come at basic engineering (datasheets).
schema: cheme/equipment/v1
equipment:
  # ---- HP synthesis loop (block SYN)
  - {tag: P-101, type: CentrifugalPump, service: HP ammonia pump,
     design_pressure_barg: 175, design_temperature_degc: 50, material: CS,
     notes: "2200 -> 15000 kPa(a), 47.1 t/h liquid NH3; ~0.42 MW shaft at efficiency 0.65 (D-010, ASSUMED). Multistage centrifugal or plunger type is a basic-engineering choice; drives the HP ejector of the carbamate recycle in the usual arrangement."}
  - {tag: K-101, type: CentrifugalCompressor, service: CO2 compressor,
     design_pressure_barg: 160, design_temperature_degc: 150, material: "CS / stainless (wet CO2 stages)",
     notes: "160 -> 14500 kPa(a), 62.7 t/h CO2 with passivation air; 4 intercooled stages ASSUMED, ~6.9 MW shaft at isentropic efficiency 0.78 (D-010). Electric drive (D-010); a steam turbine is the usual alternative and changes the steam/power split (BREF LVIC-AAF Tables 8.5, 8.6)."}
  - {tag: R-101, type: Vessel, service: Urea reactor,
     design_pressure_barg: 160, design_temperature_degc: 210, material: "urea-grade stainless liner in a CS pressure shell (open input, D-012)",
     notes: "180 C, 14000 kPa(a), N/C 2.8 at the inlet (BREF LVIC-AAF Table 8.14); 239.5 t/h; CO2 conversion 0.58 per pass ASSUMED (D-005). Residence time 20-30 min typical (BREF Table 8.2); volume not sized."}
  - {tag: E-101, type: TubularHeatExchanger, service: HP CO2 stripper (falling film),
     design_pressure_barg: 160, design_temperature_degc: 215, material: "tubes urea-grade stainless or duplex; shell CS (MP steam 25 barg)",
     notes: "Reactor effluent stripped with the feed CO2; ~30.4 MW from MP steam 2400 kPa(a) (D-010, the BREF total less E-302 and R-401). Stripping efficiency ASSUMED (D-006)."}
  - {tag: E-102, type: TubularHeatExchanger, service: HP carbamate condenser (raises LP steam),
     design_pressure_barg: 160, design_temperature_degc: 200, material: "process side urea-grade stainless; steam side CS (LP steam 450 kPa(a))",
     notes: "Condenses the stripper gas with the fresh NH3 and the scrubber carbamate; raises ~35.2 MW LP steam used in C-201, E-301 and C-402 (D-010, net LP export zero ASSUMED)."}
  - {tag: V-103, type: Vessel, service: HP scrubber,
     design_pressure_barg: 160, design_temperature_degc: 190, material: urea-grade stainless (open input),
     notes: "Absorbs NH3/CO2 from the inerts with the LP carbamate solution; inerts to the LP absorber (D-006)."}
  # ---- LP recirculation (block REC)
  - {tag: C-201, type: ProcessColumn, service: LP rectifying column with heater,
     design_pressure_barg: 6, design_temperature_degc: 165, material: stainless (open input),
     notes: "300 kPa(a) (BREF Table 8.14: 3 bar); ~12.1 MW LP steam heater (D-010). Stages not calculated."}
  - {tag: E-201, type: TubularHeatExchanger, service: LP carbamate condenser,
     design_pressure_barg: 6, design_temperature_degc: 165, material: stainless (open input),
     notes: "~16.0 MW to cooling water (D-010)."}
  - {tag: C-202, type: ProcessColumn, service: LP carbamate vessel and absorber,
     design_pressure_barg: 6, design_temperature_degc: 90, material: stainless (open input),
     notes: "Vent to atmosphere with 70 g NH3 per t urea (BREF Table 8.10, CO2 stripping LP scrubber; D-009)."}
  - {tag: P-102, type: CentrifugalPump, service: HP carbamate pump,
     design_pressure_barg: 160, design_temperature_degc: 90, material: urea-grade stainless (open input),
     notes: "300 -> 14200 kPa(a), 36.4 t/h; ~0.21 MW shaft at efficiency 0.60 (D-010). Plunger pump usual: basic-engineering choice."}
  # ---- evaporation (block EVA)
  - {tag: E-301, type: TubularHeatExchanger, service: 1st evaporator,
     design_pressure_barg: 3.5, design_temperature_degc: 165, material: stainless (open input),
     notes: "33 kPa(a), 403 K, to 95 wt% urea; ~19.0 MW LP steam (D-010). Full vacuum design."}
  - {tag: E-302, type: TubularHeatExchanger, service: 2nd evaporator,
     design_pressure_barg: 3.5, design_temperature_degc: 230, material: stainless (open input),
     notes: "3 kPa(a), 413 K, melt 99.6 wt% solids; ~2.6 MW MP steam (D-010); biuret forms here (lumped, D-007). Full vacuum design."}
  - {tag: E-303, type: TubularHeatExchanger, service: Evaporator vacuum condensers,
     design_pressure_barg: 3.5, design_temperature_degc: 165, material: stainless (open input),
     notes: "~21.5 MW to cooling water (D-010); the vacuum system (ejectors or pumps) is not in the concept balance."}
  # ---- process condensate treatment (block PCT)
  - {tag: C-401, type: ProcessColumn, service: Desorber 1,
     design_pressure_barg: 6, design_temperature_degc: 165, material: stainless (open input),
     notes: "300 kPa(a); heated by the overhead of C-402 (D-006)."}
  - {tag: R-401, type: Vessel, service: Hydrolyser,
     design_pressure_barg: 22, design_temperature_degc: 230, material: stainless (open input),
     notes: "1900 kPa(a), 473 K; urea hydrolysed to 1 ppm(wt) in the treated water (BREF Table 8.20); ~1.0 MW net MP steam after feed/effluent exchange (ASSUMED, D-010)."}
  - {tag: C-402, type: ProcessColumn, service: Desorber 2,
     design_pressure_barg: 6, design_temperature_degc: 165, material: stainless (open input),
     notes: "300 kPa(a); ~4.2 MW LP steam reboiler (D-010; live steam is the usual alternative)."}
  # ---- finishing (block FIN)
  - {tag: T-501, type: ProcessColumn, service: Prilling tower (forced draft),
     design_pressure_barg: 0.1, design_temperature_degc: 160, material: concrete / CS (open input),
     notes: "Melt 83.5 t/h at 413 K, air 706.5 t/h (554 kNm3/h) 303 -> 343 K from the heat balance (D-007); fan ~0.52 MW (D-010). Tower height and prill size not designed."}
  - {tag: C-501, type: ProcessColumn, service: Prilling exhaust wet scrubber,
     design_pressure_barg: 0.1, design_temperature_degc: 90, material: stainless (open input),
     notes: "Water scrubbing to dust 35 and NH3 30 mg/Nm3 (within the BAT levels of BREF section 8.5, D-009); liquor 45 wt% urea to E-301."}
