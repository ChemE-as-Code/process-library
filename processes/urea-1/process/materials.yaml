# Components and templates of the process. Schema cheme/process/v1 (`cheme schema
# process-materials`). molar_mass in kg/kmol, normal_boiling_point in K at 101.325 kPa.
#
# Ammonium carbamate (NH2COONH4) is NOT a component: the balance carries unconverted carbamate
# as its NH3 + CO2 equivalent (DESIGN.md D-005), as concept mass balances of urea plants do.
# Argon of the air is lumped into N2 (D-004). Urea and biuret decompose before boiling: no
# normal boiling point; CO2 sublimes at 101.325 kPa: none given.
schema: cheme/process/v1
kind: materials
components:
  - {id: NH3, name: Ammonia, formula: NH3, cas: 7664-41-7, chebi: "CHEBI:16134", molar_mass: 17.031, normal_boiling_point: 239.82}
  - {id: CO2, name: Carbon dioxide, formula: CO2, cas: 124-38-9, chebi: "CHEBI:16526", molar_mass: 44.0095}
  - {id: H2O, name: Water, formula: H2O, cas: 7732-18-5, chebi: "CHEBI:15377", molar_mass: 18.0153, normal_boiling_point: 373.12}
  - {id: UREA, name: Urea, formula: CH4N2O, cas: 57-13-6, chebi: "CHEBI:16199", molar_mass: 60.0553}
  - {id: BIURET, name: Biuret, formula: C2H5N3O2, cas: 108-19-0, chebi: "CHEBI:18138", molar_mass: 103.0798}
  - {id: N2, name: Nitrogen, formula: N2, cas: 7727-37-9, chebi: "CHEBI:17997", molar_mass: 28.0134, normal_boiling_point: 77.36}
  - {id: O2, name: Oxygen, formula: O2, cas: 7782-44-7, chebi: "CHEBI:15379", molar_mass: 31.9988, normal_boiling_point: 90.19}
templates:
  - {id: urea-process, title: "Urea process streams (carbamate as NH3 + CO2)", components: [NH3, CO2, H2O, UREA, BIURET, N2, O2]}
# No benchmarked property package covers aqueous NH3-CO2-urea-carbamate (electrolyte, reactive,
# solids in the finishing): `cheme process props` is not applicable (D-008, core #315/#364).
property_method:
  adapter: thermo
  status: placeholder
