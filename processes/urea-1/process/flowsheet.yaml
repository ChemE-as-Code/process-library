# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Urea by CO2 stripping with total recycle, 2000 t/d prilled urea (DESIGN.md D-001..D-010).
# Where the values come from:
# - feeds, product grade, temperatures and pressures: design choices (design basis), ASSUMED,
#   with the synthesis conditions from BREF LVIC-AAF (2007) Table 8.14 (140 bar, 180 C, N/C 2.8);
# - R-101 (conversion of UREA_SYN, process/reactions.yaml) and R-401 (HYDROLYSIS) outlets and
#   the pass-through outlets of pumps, compressor and mixer: `cheme process propagate --fill`;
# - separator outlets (stripper, rectifier, absorbers, evaporators, desorbers, prilling) and all
#   duties: the provenance script scripts/urea_balance.py (specified split fractions and
#   compositions, hand-estimated heats), given here as ASSUMED: no property package in core is
#   qualified for the aqueous NH3-CO2-urea-carbamate system (D-008; core #315, #364).
# Unconverted ammonium carbamate is carried as its NH3 + CO2 equivalent (D-005).
schema: cheme/process/v1
kind: flowsheet
title: Urea by CO2 stripping, total recycle, prilling (2000 t/d)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 2000 t/d prilled urea, electric CO2 compressor (D-002, D-010)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: NH3, title: Liquid ammonia from the ammonia plant, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: CO2, title: CO2 from the ammonia plant CO2 removal, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PAIR, title: Passivation air (ambient), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AIR, title: Prilling air (ambient), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: k101, direction: out, kind: energy}
      - {id: p101, direction: out, kind: energy}
      - {id: p102, direction: out, kind: energy}
      - {id: t501, direction: out, kind: energy}
  - id: MPS
    title: MP steam 2400 kPa(a)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 2400, provenance: assumed, source: "design basis; 24 bar level of BREF LVIC-AAF Table 8.5 (D-010)"}
      supply_temperature: {value: 494.9, provenance: assumed, source: "saturation at 2400 kPa(a) (D-010)"}
      min_approach: {value: 10, provenance: assumed, source: D-010}
    ports:
      - {id: e101, direction: out, kind: energy}
      - {id: e302, direction: out, kind: energy}
      - {id: r401, direction: out, kind: energy}
products:
  - {id: UREA, title: Prilled urea to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: VENT, title: LP absorber vent to atmosphere, category: off_gas, ports: [{id: in, direction: in}]}
  - {id: EXHAUST, title: Scrubbed prilling tower exhaust to atmosphere, category: off_gas, ports: [{id: in, direction: in}]}
  - {id: WATER, title: Treated process condensate to battery limit, category: wastewater, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-010"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-010"}
      min_approach: {value: 5, provenance: assumed, source: D-010}
    ports:
      - {id: k101, direction: in, kind: energy}
      - {id: e201, direction: in, kind: energy}
      - {id: e303, direction: in, kind: energy}

blocks:
  - id: SYN
    title: HP synthesis loop (CO2 stripping, 14 MPa)
    class: ReactingChemicals
    ports:
      - {id: nh3, direction: in}
      - {id: co2, direction: in}
      - {id: air, direction: in}
      - {id: carb, direction: in}
      - {id: liq, direction: out}
      - {id: vent, direction: out}
      - {id: power1, direction: in, kind: energy}
      - {id: power2, direction: in, kind: energy}
      - {id: steam, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: lps1, direction: out, kind: energy}
      - {id: lps2, direction: out, kind: energy}
      - {id: lps3, direction: out, kind: energy}
  - id: REC
    title: LP recirculation (0.3 MPa)
    class: SeparatingByThermalProcess
    ports:
      - {id: feed, direction: in}
      - {id: gas, direction: in}
      - {id: des, direction: in}
      - {id: water, direction: in}
      - {id: liq, direction: out}
      - {id: vent, direction: out}
      - {id: carb, direction: out}
      - {id: heat, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: EVA
    title: Vacuum evaporation to melt
    class: Evaporating
    ports:
      - {id: feed, direction: in}
      - {id: liquor, direction: in}
      - {id: melt, direction: out}
      - {id: cond, direction: out}
      - {id: heat, direction: in, kind: energy}
      - {id: steam, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: PCT
    title: Process condensate treatment (desorption, hydrolysis)
    class: SeparatingByThermalProcess
    ports:
      - {id: feed, direction: in}
      - {id: vap, direction: out}
      - {id: abs, direction: out}
      - {id: scrub, direction: out}
      - {id: bl, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: heat, direction: in, kind: energy}
  - id: FIN
    title: Prilling and exhaust scrubbing
    class: ProcessStep
    ports:
      - {id: melt, direction: in}
      - {id: air, direction: in}
      - {id: water, direction: in}
      - {id: prills, direction: out}
      - {id: exhaust, direction: out}
      - {id: liquor, direction: out}
      - {id: power, direction: in, kind: energy}

steps:
  # ---- SYN --------------------------------------------------------------------------------
  - id: P101
    block: SYN
    title: HP ammonia pump
    # GeneratingFlow, the parent of Pumping: `cheme process build` 0.8.0 fails on Pumping (its
    # method field is a Union that core's step_method cannot iterate); core issue to open
    class: GeneratingFlow
    links: [{target: equipment, ref: P-101}]
    ports:
      - {id: in, direction: in, delegates: nh3}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power2}
  - id: M101
    block: SYN
    title: Passivation air addition
    class: Mixing
    ports:
      - {id: co2, direction: in, delegates: co2}
      - {id: air, direction: in, delegates: air}
      - {id: out, direction: out}
  - id: K101
    block: SYN
    title: CO2 compressor (electric drive, intercooled)
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power1}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  # D-005: conversion model of the urea reactor; carbamate as NH3 + CO2
  - id: R101
    block: SYN
    title: Urea reactor
    class: ReactingChemicals
    reactions: [UREA_SYN]
    reactor: conversion
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: E101
    block: SYN
    title: HP CO2 stripper (falling film, MP steam)
    class: SeparatingByThermalProcess
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: liq_in, direction: in}
      - {id: co2, direction: in}
      - {id: gas, direction: out}
      - {id: liq, direction: out, delegates: liq}
      - {id: steam, direction: in, kind: energy, delegates: steam}
  # D-010: E-102 raises the LP steam of the LP rectifier, 1st evaporator and desorbers
  - id: E102
    block: SYN
    title: HP carbamate condenser (raises LP steam)
    class: RemovingThermalEnergy
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: gas, direction: in}
      - {id: nh3, direction: in}
      - {id: carb, direction: in}
      - {id: out, direction: out}
      - {id: vent, direction: out}
      - {id: lps1, direction: out, kind: energy, delegates: lps1}
      - {id: lps2, direction: out, kind: energy, delegates: lps2}
      - {id: lps3, direction: out, kind: energy, delegates: lps3}
  - id: V103
    block: SYN
    title: HP scrubber
    class: Absorbing
    links: [{target: equipment, ref: V-103}]
    ports:
      - {id: gas, direction: in}
      - {id: carb, direction: in, delegates: carb}
      - {id: liq, direction: out}
      - {id: vent, direction: out, delegates: vent}
  # ---- REC --------------------------------------------------------------------------------
  - id: C201
    block: REC
    title: LP rectifying column with heater
    class: SeparatingByThermalProcess
    links: [{target: equipment, ref: C-201}]
    ports:
      - {id: feed, direction: in, delegates: feed}
      - {id: gas, direction: out}
      - {id: liq, direction: out, delegates: liq}
      - {id: heat, direction: in, kind: energy, delegates: heat}
  - id: E201
    block: REC
    title: LP carbamate condenser
    class: Cooling
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: gas, direction: in}
      - {id: des, direction: in, delegates: des}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: C202
    block: REC
    title: LP carbamate vessel and absorber
    class: Absorbing
    links: [{target: equipment, ref: C-202}]
    ports:
      - {id: liq, direction: in}
      - {id: gas, direction: in, delegates: gas}
      - {id: water, direction: in, delegates: water}
      - {id: vent, direction: out, delegates: vent}
      - {id: liq_out, direction: out}
  - id: P102
    block: REC
    title: HP carbamate pump
    class: GeneratingFlow     # not Pumping: see P101
    links: [{target: equipment, ref: P-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: carb}
      - {id: power, direction: in, kind: energy, delegates: power}
  # ---- EVA --------------------------------------------------------------------------------
  - id: E301
    block: EVA
    title: 1st evaporator (LP steam)
    class: Evaporating
    links: [{target: equipment, ref: E-301}]
    ports:
      - {id: feed, direction: in, delegates: feed}
      - {id: liquor, direction: in, delegates: liquor}
      - {id: liq, direction: out}
      - {id: vap, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: heat}
  # D-007: biuret formation lumped into the 2nd evaporator
  - id: E302
    block: EVA
    title: 2nd evaporator (MP steam)
    class: Evaporating
    reactions: [BIURET]
    links: [{target: equipment, ref: E-302}]
    ports:
      - {id: feed, direction: in}
      - {id: liq, direction: out, delegates: melt}
      - {id: vap, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
  - id: E303
    block: EVA
    title: Evaporator vacuum condensers
    class: Cooling
    links: [{target: equipment, ref: E-303}]
    ports:
      - {id: v1, direction: in}
      - {id: v2, direction: in}
      - {id: out, direction: out, delegates: cond}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  # ---- PCT --------------------------------------------------------------------------------
  - id: C401
    block: PCT
    title: Desorber 1
    class: Distilling
    links: [{target: equipment, ref: C-401}]
    ports:
      - {id: feed, direction: in, delegates: feed}
      - {id: vap_in, direction: in}
      - {id: vap, direction: out, delegates: vap}
      - {id: liq, direction: out}
  - id: R401
    block: PCT
    title: Hydrolyser
    class: ReactingChemicals
    reactions: [HYDROLYSIS]
    reactor: conversion
    links: [{target: equipment, ref: R-401}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
  - id: C402
    block: PCT
    title: Desorber 2 (reboiled with LP steam)
    class: Distilling
    links: [{target: equipment, ref: C-402}]
    ports:
      - {id: feed, direction: in}
      - {id: vap, direction: out}
      - {id: liq, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: heat}
  - id: SPL401
    block: PCT
    title: Treated condensate distribution
    class: SplittingMaterial
    split: {abs: 0.11018587, scrub: 0.21789934}
    ports:
      - {id: in, direction: in}
      - {id: abs, direction: out, delegates: abs}
      - {id: scrub, direction: out, delegates: scrub}
      - {id: bl, direction: out, delegates: bl}
  # ---- FIN --------------------------------------------------------------------------------
  - id: T501
    block: FIN
    title: Prilling tower (forced draft)
    class: ProcessStep
    links: [{target: equipment, ref: T-501}]
    ports:
      - {id: melt, direction: in, delegates: melt}
      - {id: air, direction: in, delegates: air}
      - {id: prills, direction: out, delegates: prills}
      - {id: exhaust, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: C501
    block: FIN
    title: Prilling exhaust wet scrubber
    class: SeparatingByContact
    links: [{target: equipment, ref: C-501}]
    ports:
      - {id: gas, direction: in}
      - {id: water, direction: in, delegates: water}
      - {id: gas_out, direction: out, delegates: exhaust}
      - {id: liq, direction: out, delegates: liquor}

streams:
  - id: S1
    title: Liquid ammonia from the ammonia plant
    from: NH3.out
    to: P101.in
    template: urea-process
    state:
      design:
        pressure: {value: 2200, provenance: assumed, source: D-006}
        temperature: {value: 293.15, provenance: assumed, source: D-006}
        flow: {value: 47108.8, basis: mass, provenance: assumed, source: "scripts/urea_balance.py (D-006)"}
        composition: {basis: mole_fraction, values: {NH3: 1}, provenance: assumed, source: "scripts/urea_balance.py (D-006)"}
  - id: S2
    title: HP ammonia to the HP carbamate condenser
    from: P101.out
