        flow: {value: 239458, basis: mass, provenance: assumed, source: "scripts/urea_balance.py (D-006)"}
        composition: {basis: mole_fraction, values: {NH3: 0.65882353, CO2: 0.23529412, H2O: 0.10588235}, provenance: assumed, source: "scripts/urea_balance.py: N/C 2.8 (BREF Table 8.14), H2O/CO2 0.45 ASSUMED (D-005)"}
  - id: S11
    title: Reactor effluent to the HP stripper
    from: R101.out
    to: E101.liq_in
    template: urea-process
    state:
      design:
        pressure: {value: 14000, provenance: assumed, source: D-005}
        temperature: {value: 453.15, provenance: assumed, source: "180 C, BREF LVIC-AAF Table 8.14 (D-005)"}
        flow: {value: 239458.0, provenance: calculated, source: 'cheme process propagate: reactor R101 from S15', fingerprint: 3aa05b0020b90b37}
        composition: {basis: mole_fraction, values: {NH3: 0.446866, CO2: 0.114441, H2O: 0.280654, UREA: 0.158038, BIURET: 0.0, N2: 0.0, O2: 0.0}, provenance: calculated, source: 'cheme process propagate: reactor R101 from S15', fingerprint: 6121b724144ce21a}
