parameters:
- name: p
  value: 1000.0
  unit: kg
  description: Desulfurised gas oil delivered (the basis).
  source: basis
- name: M_F
  value: 6532.014
  unit: g/mol
  description: Molar mass of the model feed C470H848S (one formula unit of straight-run gas oil).
  source: 'ASSUMED model formula: its sulfur is 0.491 wt-% (see s_feed), and its hydrogen (13.09 wt-%) follows from
    the product formula and nu_H2; masses from IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022,
    Pure Appl. Chem. 94:573), applied to the formula'
- name: M_P
  value: 6549.346
  unit: g/mol
  description: Molar mass of the model product C470H897 (desulfurised gas oil, sulfur-free in the model).
  source: 'ASSUMED model formula: 13.81 wt-% H, PRELIM''s hydrogen content of hydrotreated diesel (Abella, J.P.,
    Motazedi, K., Bergerson, J.A. (2015) PRELIM v1.0 user guide and technical documentation, University of Calgary,
    Table 8, p. 53 (hydrotreated diesel 13.8 wt% H, 11 ppm S)); its carbon fraction 0.862 kg/kg lies within IPCC''s
    gas/diesel oil carbon content (20.2 kg C/GJ at 43.0 GJ/t is 0.869 kg/kg; the 95 % limits 19.8 to 20.4 kg C/GJ
    give 0.851 to 0.877), IPCC (2006) Guidelines for National Greenhouse Gas Inventories, Vol. 2, chapter 1, Tables
    1.2 and 1.3; masses from IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem.
    94:573), applied to the formula'
- name: s_feed
  value: 0.49
  unit: wt-%
  description: 'Sulfur in the feed: 0.49 wt-% (the formula''s integer atoms give 0.491 %); not used in a formula.'
  source: TotalEnergies crude oil data sheet Johan Sverdrup (assay of 01-Apr-2021, sheet Jul-21, manufacturer literature;
    the sheet gives no guarantee of accuracy), properties of TBP cuts, gas oil cut 230 to 375 degC (0.49 wt% S;
    the 175 to 400 and 230 to 400 degC cuts give 0.44 and 0.54). The linked producer, refinery-distillation-1, cuts
    this crude's gas oil at 240 to 360 degC, so the 230 to 375 degC cut is the nearest the sheet gives (ASSUMED).
    The REF BREF's 0.05 to 1.8 % w/w (Table 2.3, p. 80) belongs to its vacuum gas oil feedstock group and is not
    used
- name: nu_H2
  value: 25.5
  unit: mol/mol
  description: 'Hydrogen taken up per formula unit of feed: 1 mol for the S as H2S, 24.5 mol to raise the liquid
    to the product''s hydrogen content.'
  source: 'realises 7.87 kg H2 per t feed with these formulas, the make-up hydrogen of one operating diesel hydrotreater
    to 40 mg/kg S, 87.8 Nm3/t or 7.9 kg/t at 2.016/22.414 kg/Nm3 (our arithmetic; Tian, R., Xu, W., Li, Y., Tian,
    J., Wu, L. (2022) Processes 10(10), 2055, doi:10.3390/pr10102055 (CC BY 4.0), Table 2 (make-up H2, actuals:
    33,443 Nm3/h) and Table 3 (feeds, actuals: 380.9 t/h in all)). Transferring it to straight-run gas oil is ASSUMED:
    that unit''s main feed carries 1.49 wt% S and it also treats a 2.6 wt% S stream and naphtha-range feed, so for
    this 0.49 % S feed it is an upper view. All make-up hydrogen is counted as consumed (purge and solution losses
    not separated, ASSUMED). The REF BREF''s typical 0.3 % H2 on feed for distillates (section 3.13.1, p. 192, data
    of 1991 and 1999) is a lower view for 10 mg/kg diesel; its Table 3.62 (p. 192) gives 44 Nm3/t for high-sulfur
    gas oil to 0.2 % S and 200 Nm3/t to 0.05 % S (only its H2 column is read: the order of its two sulfur columns
    does not fit their values). TODO a source for deep HDS of straight-run gas oil, and a sourced consumed/purge
    split'
- name: nu_S
  value: 1.0
  unit: mol/mol
  description: 'H2S formed per formula unit of feed: all feed sulfur, the product counted sulfur-free.'
  source: stoichiometry of the model formulas; product sulfur of about 10 mg/kg (EU JRC (2015) REF BREF, EUR 27140
    EN, doi:10.2791/010758, section 2.13, Table 2.6 and the hydrofining text, pp. 82-83) is about 0.2 % of the feed
    sulfur and is neglected (ASSUMED)
- name: M_H2
  value: 2.016
  unit: g/mol
  description: Molar mass of hydrogen.
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573), applied to
