- name: fuel
  value: 300.0
  unit: MJ/t
  description: 'Heater fuel per t feed, distillate: the lower bound of 300 to 500 MJ/t.'
  source: 'EU JRC (2015) REF BREF, EUR 27140 EN, doi:10.2791/010758, section 3.13.1, Table 3.63, p. 192 (range;
    Sema/Sofres 1991, VROM 1999). The lower bound is our choice: the two middle-distillate units of Table 3.65,
    p. 194, burn about 275 and 247 MJ/t (fuel GWh/yr over throughput, our arithmetic), below the whole range.
    The 247 MJ/t unit (TOTAL Mitteldeutschland) shows the same fuel and loads as that site''s naphtha hydrotreater
    row, so it may be a repeated row'
- name: lhv_ng
