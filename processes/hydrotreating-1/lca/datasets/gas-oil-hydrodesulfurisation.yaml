  unit: kWh/t
  description: 'Heat rejected to cooling water per t feed: 2.5 m3/t (midpoint of 2 to 3) at a 10 K rise.'
  source: 'EU JRC (2015) REF BREF, EUR 27140 EN, doi:10.2791/010758, section 3.13.1, Table 3.63, p. 192 (2 to 3
