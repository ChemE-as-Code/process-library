# Tier 1 form, without a flowsheet (as ethylbenzene-1). Every amount is the formula of its parameters;
# core's validator re-checks each. Written from the REF BREF and IPCC 2006 (facts in our own form).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: gas-oil-hydrodesulfurisation
title: Gas oil hydrodesulfurisation to ultra-low-sulfur diesel blendstock
description: Per 1 t of desulfurised gas oil, gate-to-gate, EU refinery hydrotreaters of the REF BREF. Feed, hydrogen
  and H2S from model formulas fitted to the sourced feed sulfur, hydrogen use and product carbon content; utilities
  and heater emissions from sourced ranges and two installations.
basis: 1000 kg of desulfurised gas oil
boundary: 'gate-to-gate: feed heater, fixed-bed reactor, high- and low-pressure separators, recycle gas, stripper
  and drier; hydrogen, steam and power from outside; sour gas and sour water leave for treatment'
technology: fixed-bed CoMo/alumina hydrodesulfurisation of straight-run gas oil at about 40 to 70 barg and 330 to
  390 degC with recycle gas, stripping and drying (REF BREF 2.13)
geography:
  description: EU refineries of the REF BREF data collection; no single site.
classification:
  isic: '1920'
system_boundary:
  included:
  - feed, hydrogen make-up, wash water
  - heater fuel and its combustion (CO2, H2O, NOx, SO2, CO)
  - electricity, steam and cooling water
  - H2S to sour gas treatment, sour water to treatment
  - CoMo catalyst make-up and spent catalyst
  excluded:
  - 'TODO light ends and wild naphtha from cracking (off-gas to refinery fuel gas, stripper naphtha to the crude
    unit): not quantified in the source; the model gives the whole feed carbon to the product'
  - 'TODO hydrogen purge and solution losses to fuel gas: the source''s hydrogen figure is counted as consumed'
  - 'TODO nitrogen of the feed and the NH3 it forms (to sour water): not quantified in the source'
  - TODO H2S, NH3, phenols and hydrocarbons dissolved in the sour water
  - TODO fugitive hydrocarbon and sulfur emissions from valves, flanges, seals and sour lines
  - TODO molecular sieve or vacuum drier adsorbents
  - amine treatment and sulfur recovery (downstream units that take the H2S)
  - catalyst regeneration, done off site
  - product sulfur (about 10 mg/kg, 0.1 % of the feed sulfur, see parameter nu_S)
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: included
  non_routine: excluded
location: RER
year: 2010
valid_until: 2015
time:
  start: 1991
  description: 'REF BREF (2015): utility ranges from 1991 and 1999 sources (Table 3.63), installation emissions
    of 2007 updated 2010 (Table 3.65). valid_until is the reference year + 5 (system-model section 6), so it has
    already lapsed.'
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation (H2S and sour water leave as outputs to treatment)'
