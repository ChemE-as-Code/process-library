parameters:
- name: p
  value: 1000.0
  unit: kg
  description: Desulfurised gas oil delivered (the basis).
  source: basis
- name: M_F
  value: 13948.6
  unit: g/mol
  description: Molar mass of the model feed C1000H1795S4 (one formula unit of straight-run gas oil).
  source: ASSUMED model formula, chosen so that its sulfur is 0.919 wt-% (see s_feed) and the product's carbon content
    matches IPCC's gas/diesel oil (see M_P); masses from IUPAC 2021 abridged standard atomic weights (Prohaska et
    al. 2022, Pure Appl. Chem. 94:573), applied to the formula
- name: M_P
  value: 13854.632
  unit: g/mol
  description: Molar mass of the model product C1000H1829 (desulfurised gas oil, sulfur-free in the model).
  source: 'ASSUMED model formula: its carbon fraction 0.867 kg/kg lies within IPCC''s gas/diesel oil carbon content
    (20.2 kg C/GJ at 43.0 GJ/t is 0.869 kg/kg; the 95 % limits 19.8 to 20.4 kg C/GJ give 0.851 to 0.877), IPCC (2006)
    Guidelines for National Greenhouse Gas Inventories, Vol. 2, chapter 1, Tables 1.2 and 1.3; its hydrogen follows
    from nu_H2. Masses from IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem.
    94:573), applied to the formula'
- name: s_feed
  value: 0.919
  unit: wt-%
  description: Sulfur in the feed as the model formula realises it (4 S per formula unit); not used in a formula.
  source: 'EU JRC (2015) REF BREF, EUR 27140 EN, doi:10.2791/010758, section 2.13, Table 2.3, p. 80: 0.05 to 1.8
    % w/w S is given for the kerosene/jet and diesel products of the vacuum gas oil feedstock group; the atmospheric
    gas oil rows carry no sulfur range. Reading it as the feed sulfur of straight-run (atmospheric) gas oil is ASSUMED;
    so is the midpoint 0.925 %, our choice (the formula''s integer atoms give 0.919 %). Table 3.62, p. 192, lists
    0.1 to 0.35 % S for its gas oil HDS rows under a column layout we could not interpret, so it is not used'
- name: nu_H2
  value: 21.0
  unit: mol/mol
  description: 'Hydrogen consumed per formula unit of feed: 8 mol for the 4 S, 13 mol for saturation.'
  source: 'realises the source''s distillate hydrogen use of 0.3 % H2 on feed (EU JRC (2015) REF BREF, EUR 27140
    EN, doi:10.2791/010758, section 3.13.1, p. 192; Table 3.63 range 1 to 15 kg/t): 3.035 kg/t feed with these formulas.
    All make-up hydrogen counted as consumed (purge and solution losses not separated, ASSUMED). Probably low for
    10 mg/kg: the 0.3 % rests on 1991 and 1999 data, Table 3.62 (p. 192) lists 44 Nm3/t (about 4 kg/t) for high-sulfur
    gas oil to 0.2 % S, and an operating diesel hydrotreater to 40 mg/kg takes 7.9 kg/t feed of make-up gas (Tian
    et al. 2022, Processes 10:2055, Tables 2 and 3, mixed feed; benchmarks/refining.yaml). TODO a source for deep
    HDS of straight-run gas oil, and a sourced consumed/purge split'
- name: nu_S
  value: 4.0
  unit: mol/mol
  description: 'H2S formed per formula unit of feed: all feed sulfur, the product counted sulfur-free.'
  source: stoichiometry of the model formulas; product sulfur of about 10 mg/kg (EU JRC (2015) REF BREF, EUR 27140
    EN, doi:10.2791/010758, section 2.13, Table 2.6 and the hydrofining text, pp. 82-83) is about 0.1 % of the feed
    sulfur and is neglected (ASSUMED)
- name: M_H2
  value: 2.016
  unit: g/mol
  description: Molar mass of hydrogen.
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573), applied to
    the formula
- name: M_H2S
