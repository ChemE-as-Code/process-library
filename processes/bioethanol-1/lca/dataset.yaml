schema: cheme/lci_dataset/v2
kind: lci_dataset
id: fuel-ethanol-from-corn-by-dry-grind-633-dry-t-d-of-corn-71-300-t-a-anhydrous-ethanol
title: Fuel ethanol from corn by dry grind (633 dry t/d of corn, 71 300 t/a anhydrous ethanol)
description: Unallocated foreground LCI of Fuel ethanol from corn by dry grind (633 dry t/d of corn, 71
  300 t/a anhydrous ethanol), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Dry-grind corn ethanol plant of SRC-1 (NREL/TP-580-28893, the USDA-ARS model of a 25 million
  US gal/a dry mill): 633 dry short tons of corn a day hammer-milled, liquefied at 88 C with alpha-amylase,
  cooked at 110 C and saccharified at 60 C with glucoamylase, fermented by yeast in four continuous cascade
  fermentors (46 h, 32-34 C) to a 9 wt% beer, CO2 water-scrubbed and vented; beer column to 45 wt%, rectifier
  to 91 wt%, vapour-phase molecular sieves to 99.5 wt%; whole stillage to a decanter, thin stillage partly
  back as backset and the rest evaporated to a 55 wt% syrup, wet cake and syrup dried with natural gas
  to DDGS at 9 wt% moisture; zero liquid discharge; 7920 h/a'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:dryer-voc-particulates
  title: combustion emissions of D-601
  direction: output
  reason: The DDGS dryer's other VOC (aldehydes, organic acids besides acetic acid), particulates, CO
    and NOx are not estimated; a real plant passes the exhaust through a thermal oxidiser or a regenerative
    oxidiser, not modelled (D-011)
  source: DESIGN.md D-011
- key: emission-excluded:fermentation-trace-voc
  title: storage-tank emissions of R-301, A-301
  direction: output
  reason: Acetaldehyde and other trace volatiles of the fermentation off-gas are not components of the
    flowsheet; only the ethanol slip is counted (D-011)
  source: DESIGN.md D-011
- key: emission-excluded:mash-tanks
  title: storage-tank emissions of T-201, R-201, R-202
  direction: output
  reason: The slurry, liquefaction and saccharification tanks hold no ethanol but the recycled condensate's
    traces (below 0.1 wt%); their vents (water vapour at 60 to 88 C) are not estimated (D-011)
  source: DESIGN.md D-011
- key: emission-excluded:storage-breathing
  title: storage-tank emissions of E-402
  direction: output
  reason: The breathing of the ethanol storage tanks (12 days, SRC-1 p. 7) is not estimated; outside the
    flowsheet (D-011)
  source: DESIGN.md D-011
uuid: 345a079e-855c-5fb8-8174-095a3ed4599e
version: 0.1.0
geography:
  description: Generic US Midwest-type dry mill (SRC-1 assumed Minnesota), site not chosen (GLO); one
    design case
time:
  start: 2026
valid_until: 2031
system_model: cutoff
technology_level: current
production_volume:
  amount: 71272951.2
  unit: kg/a
  source: product:ETOH per hour x operation.hours_per_year (7920 h/a)
classification:
  isic: '2011'
modelling:
  principle: attributional
  multifunctionality: 'unallocated multi-output dataset; default allocation mass: D-012: the library hierarchy
    (docs/system-model.md). No physical relationship applies: DDGS is an animal feed, not a fuel, so the
    energy rule for co-produced fuels does not; the WBCSD rule then compares the prices per kg. SRC-1
    gives DDG at $0.045/lb and says it provides about 20 % of the plant''s sales income (p. 19): with
    the modelled 8999 kg/h of ethanol and 8823 kg/h of DDGS, ethanol''s price per kg is about 3.9 times
    the DDGS''s, below 5, so the rule gives mass allocation (about 0.505 / 0.495).'
review:
- type: none
data_generator: 'ChemE-as-Code agent session (Claude Opus 5.5) for issue #468, unreviewed'
