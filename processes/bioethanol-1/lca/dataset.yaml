allocation:
  coproducts:
  - ETOH
  - DDGS
  source: 'D-012: the library hierarchy (docs/system-model.md). No physical relationship applies: DDGS
    is an animal feed, not a fuel, so the energy rule for co-produced fuels does not; the WBCSD rule then
    compares the prices per kg. SRC-1 gives DDG at $0.045/lb and says it provides about 20 % of the plant''s
    sales income (p. 19): with the modelled 8999 kg/h of ethanol and 8823 kg/h of DDGS, ethanol''s price
    per kg is about 3.9 times the DDGS''s, below 5, so the rule gives mass allocation (about 0.505 / 0.495).'
  deviation: 'None from the hierarchy. For comparison: economic allocation at SRC-1''s income split would
    give 0.80 / 0.20; the EU''s Renewable Energy Directive (2018/2001, Annex V) allocates biofuel co-products
    by energy content, which would need the DDGS''s heating value (not sourced here).'
