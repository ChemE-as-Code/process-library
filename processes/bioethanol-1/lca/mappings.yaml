# bioethanol-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# Preliminary LCI (DESIGN.md D-012). Linked here: the natural gas by mass (the shared unit proxy,
# as kraft-pulp-1), the MP steam as heat delivered (kWh, as oxalyl-chloride-1), the power to the
# shared electricity entry, the scrubber's make-up water to the shared deionised water (a
# conservative proxy), and SRC-1's caustic, sulfuric acid, lime and urea to their Atlas producers.
# The corn, the enzymes, the yeast and the trash's disposal stay gaps: no library process makes
# them (CONTRIBUTING, "Gaps").
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:NG": {use: natural-gas, atlas: false, source: "natural gas by mass, taken as methane (the shared unit proxy); not linked to an Atlas producer of the slug methane, which is hda-1's fuel gas (as kraft-pulp-1)"}
  "feed:MPS": {use: steam-heat, source: "MP steam 150 psig (1135.5 kPa(a)) to the liquefaction (Q1), the jet cooker (Q1B) and to distillation, evaporation and the sieve's superheater (Q2), counted as heat delivered (kWh), D-009"}
  "feed:POWER": {use: electricity, source: "grid electricity at medium voltage, the library default for a plant whose supply voltage is not stated; SRC-1's 2090 kW (D-009)"}
  "feed:WATER": {use: water, source: "process water for the CO2 scrubber, linked to the shared entry `water` (deionised water) as a conservative proxy until a process-water entry exists: deionisation overstates a scrubber's make-up (D-012)"}
  "consumable:caustic": {dataset: {path: processes/chlor-alkali-1/lca/dataset.yaml, product: "product:NAOH"}, source: "the Atlas producer chlor-alkali-1, caustic soda 50 wt-%, per kg of solution as this exchange counts SRC-1's caustic (strength not stated, ASSUMED, D-012)"}
  "consumable:sulfuric-acid": {dataset: {path: processes/sulfuric-acid-1/lca/dataset.yaml, product: "product:ACID"}, source: "the Atlas producer sulfuric-acid-1, sulfuric acid 98.5 wt%, kg for kg (SRC-1's strength not stated, ASSUMED, D-012)"}
  "consumable:lime": {dataset: {path: processes/lime-1/lca/datasets/quicklime-pfrk-natural-gas.yaml, product: "product:quicklime"}, source: "the Atlas producer lime-1, quicklime kg for kg (SRC-1 says lime; quick or hydrated not stated, ASSUMED, D-012)"}
  "consumable:urea": {dataset: {path: processes/urea-1/lca/dataset.yaml, product: "product:UREA"}, source: "the Atlas producer urea-1, prilled urea, kg for kg (D-012)"}
