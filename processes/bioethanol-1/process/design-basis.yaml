# What the plant must do. Schema: `cheme schema design_basis`.
# Fuel ethanol from corn by the dry-grind process, on the basis of SRC-1 (NREL/TP-580-28893,
# McAloon et al. 2000, the USDA-ARS dry-mill model), issue ChemE-as-Code/process-library#468.
# Values marked ASSUMED are engineering choices of this concept study, not client or licensor
# data; every decision is in DESIGN.md.
schema: cheme/design_basis/v1
capacity:
  basis: anhydrous ethanol (at least 99.5 wt%, undenatured) to storage at the battery limit
  corn_dry_short_tons_per_day: 633          # SRC-1 Table 3 (D-002)
  ethanol_t_per_year: 71800                 # the flowsheet's S22 x 7920 h; SRC-1's 25 MMgal/a of fuel ethanol (95 vol% ethanol, 5 vol% gasoline) less the denaturant
  operating_hours_per_year: 7920            # SRC-1 Table 3: 330 days on stream
  yield_gal_per_dry_short_ton: 114          # SRC-1 p. 2 (2.71 gal/bu), the calibration target of the fermentation (D-005)
feeds:
  - name: Shelled corn, 15 wt% moisture
    source_of_values: "SRC-1 Table 3 and p. 2: 633 dry short tons a day; 70 % starch, 18 % suspended and 12 % dissolved non-fermentables on a dry basis (D-002, D-004)"
    composition: "starch 59.5, suspended non-fermentables 15.3, dissolved non-fermentables 10.2, water 15.0 wt%"
    conditions: {temperature_K: 298.15, pressure_kPa_a: 101.325}
  - name: Natural gas for the DDGS dryer
    source_of_values: "SRC-1 Table 8, derived from its cost per gallon (D-009); as methane (ASSUMED)"
  - name: Scrubber make-up water
    source_of_values: "solved by the beer specification (9 wt% ethanol, SRC-1 p. 7) and the zero-discharge water balance (D-006)"
  - name: Enzymes, yeast, urea, lime, sulfuric acid, caustic
    source_of_values: "named by SRC-1 pp. 6-7 without amounts; not in the flowsheet or the LCI (D-004, D-012)"
products:
  - name: Anhydrous ethanol
    purity: "at least 99.5 wt% (SRC-2 p. 46; SRC-1 p. 7: more than 99 wt%); modelled 99.55 wt%, the rest water; denatured with 5 vol% gasoline at the load-out, outside the boundary (D-003)"
    delivery: {temperature_K: 308.15, pressure_kPa_a: 101.325, battery_limit: storage}
  - name: DDGS (distillers' dried grains with solubles)
    note: "9 wt% moisture (SRC-1 p. 7, Table 2), animal feed co-product"
  - name: Scrubbed fermentation CO2 to atmosphere
    note: "SRC-1 p. 7; not sold in this design (SRC-1 p. 19)"
  - name: Dryer exhaust to atmosphere
    note: "the burner's flue gas with the water evaporated from the DDGS (D-008, D-011)"
utilities:
  - {name: Electric power, use: "SRC-1's 2090 kW (p. 24) by its area shares (D-009)"}
  - {name: LP steam, pressure_kPa_a: 450, use: "liquefaction, jet cooker, beer column, evaporator, sieve superheater: SRC-1's steam (Table 8) (D-009)", note: "pressure ASSUMED"}
  - {name: Cooling water, supply_K: 298.15, return_K: 308.15, use: "fermentor coolers, product condenser (D-009)", note: ASSUMED}
site:
  location: "ASSUMED generic US Midwest-type corn-belt site (SRC-1 assumed Minnesota), not chosen"
  design_ambient_K: 298.15            # ASSUMED
  atmospheric_pressure_kPa: 101.325
assumptions:
  - "Dry-grind corn route of SRC-1 (Delta-T's flowsheet as described there): continuous liquefaction, cooking and saccharification, four continuous cascade fermentors, beer column, rectifier and stripper, molecular sieves, decanter, evaporator and natural-gas dryer (D-001)."
  - "Corn as SRC-1's simplified three-part composition, lumped as hexosan units (D-004); yeast growth, urea, enzymes and the minor chemicals not represented (L-3)."
  - "ASSUMED conversions: 99 % of the starch hydrolysed, 95.02 % of the glucose fermented to ethanol (calibrated to SRC-1's 114 gal per dry ton) and 3 % to glycerol and acetate (D-005)."
  - "Separators as ASSUMED component recoveries chosen for SRC-1's stated compositions; no rigorous VLE (D-007, L-1)."
  - "All flows are year averages over 7920 h; steam, natural gas and power are SRC-1's, split between the users by ASSUMED shares (D-009); accuracy +/-30 % not demonstrated."
