  - id: Q1
    title: Steam to liquefaction and cooking
    kind: energy
    from: MPS.r201
    to: R201.steam
    state:
      design:
        duty: {value: 2013, provenance: assumed, source: "52.5 % of the cooking steam (the liquefaction's 28 K rise from about 60 C against the cooker's 22 K on 15 % more mass, ASSUMED) of 25 % (ASSUMED) of SRC-1's steam: 27 681 kg/h of 150 psi steam (appendix operating-cost sheet, PDF p. 41) x 1994.5 kJ/kg (latent heat at 1135.5 kPa(a), IAPWS-95) = 15 336 kW in all (D-009)"}
  - id: Q1B
    title: Steam to the jet cooker
    kind: energy
    from: MPS.r202
    to: R202.steam
    state:
      design:
        duty: {value: 1821, provenance: assumed, source: "the other 47.5 % of the cooking steam (Q1, D-009)"}
  - id: Q2
    title: Steam to distillation, evaporation and the sieve's superheater
    kind: energy
    from: MPS.c401
    to: C401.steam
    state:
      design:
        duty: {value: 11502, provenance: assumed, source: "the other 75 % of SRC-1's 15 336 kW of steam; SRC-1 p. 24: distillation is the main steam user (D-009)"}
