# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Fuel ethanol from corn by the dry-grind process (D-001), on the design basis of SRC-1 (NREL/TP-
# 580-28893, the USDA-ARS dry-mill model of 25 million US gal/a of fuel ethanol). Where the
# values come from:
# - the corn feed S1 (633 dry short tons a day, SRC-1 Table 3), its simplified composition
#   (SRC-1 p. 2), the trash removed (SRC-1 p. 6), the natural gas, the steam, the power and the
#   cooling water are SRC-1's, given; the natural gas, the steam and the cooling water as stated
#   in SRC-1's appendix operating-cost sheet (PDF p. 41), the power from p. 24 (D-009);
# - the reactor outlets are calculated by cheme from the conversions of process/reactions.yaml;
# - the separators' outlets are calculated by cheme from their `recovery:` (ASSUMED shares,
#   chosen per separator for SRC-1's stated compositions: 45 and 91 wt% ethanol, 35 wt% solids
#   in the wet cake, 55 wt% in the syrup; D-006, D-007, D-008);
# - the dryer's outlets by cheme's dryer model to SRC-1's 9 wt% moisture (D-008);
# - the scrubber's make-up water and the backset split are solved by design specifications for
#   SRC-1's 9 wt% ethanol in the beer and 15 % backset (D-006);
# - the four recycles (backset, evaporator condensate, stripper bottoms, sieve regenerate) are
#   converged by cheme at the tears (D-010).
# Duties: the fermentation's and the burner's from their heats of reaction (the burner's checked
# by cheme); steam, power, the product condenser and the other cooling water given or ASSUMED
# (D-009). Year-average flows, 7920 h/a.
schema: cheme/process/v1
kind: flowsheet
title: Fuel ethanol from corn by dry grind (633 dry t/d of corn, 71 300 t/a anhydrous ethanol)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: SRC-1's dry mill, 633 dry short tons of corn a day, 114 gal of ethanol per dry ton, 9 wt% ethanol in the beer (D-002, D-005)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

tears:
  - stream: S25
    initial: {flow: 16000, unit: kg/h, basis: mass_fraction, composition: {H2O: 0.94, NFD: 0.045, NFS: 0.005, GLY: 0.005, GLC: 0.004, HAC: 0.001}}
  - stream: S27
    initial: {flow: 45000, unit: kg/h, basis: mass_fraction, composition: {H2O: 0.998, ETOH: 0.001, HAC: 0.001}}
  - stream: S20
    initial: {flow: 12000, unit: kg/h, basis: mass_fraction, composition: {H2O: 0.999, ETOH: 0.001}}
  - stream: S18
    initial: {flow: 3400, unit: kg/h, basis: mass_fraction, composition: {ETOH: 0.72, H2O: 0.28}}
convergence: {method: wegstein, max_iterations: 300, tolerance: {abs: 0.001, rel: 1.0e-6}}

specs:
  - id: beer
    vary: {stream: S12, initial: 5000}
    target: {stream: S11, component: ETOH, quantity: fraction, basis: mass, value: 0.09}
    provenance: given
    source: "SRC-1 p. 7: 9 wt% (12 vol%) ethanol in the whole beer leaving the fermentors; the plant's only water make-up besides the cooling tower is the CO2 scrubber's (SRC-1 p. 7), so its flow closes the water balance (D-006)"
  - id: backset
    vary: {node: X502, port: backset, initial: 0.25}
    target: {stream: S25, quantity: ratio, per: {stream: S7}, basis: mass, value: 0.15}
    provenance: given
    source: "SRC-1 p. 6: backset (recycled thin stillage) 15 % by volume of the final mash; taken as 15 % by mass (ASSUMED: thin stillage and mash of similar density, D-006)"

feeds:
  - {id: CORN, title: Shelled corn (15 wt% moisture), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: WATER, title: Make-up water to the CO2 scrubber, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NG, title: Natural gas to the dryer's burner, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AIR, title: Combustion air, category: raw_material, ports: [{id: out, direction: out}]}
  - id: MPS
    title: MP steam 150 psig (1135.5 kPa(a))
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1135.5, provenance: given, source: "SRC-1 appendix operating-cost sheet (PDF p. 41): 'Steam - 150 PSI'; read as gauge pressure (ASSUMED), 150 psi = 1034.2 kPa plus 101.3 kPa, D-009"}
      supply_temperature: {value: 458.63, provenance: assumed, source: "saturation at 1135.5 kPa(a) (IAPWS-95, thermo 0.6.1 FlashPureVLS, DESIGN.md SRC-3), D-009"}
      min_approach: {value: 10, provenance: assumed, source: D-009}
    ports: [{id: r201, direction: out, kind: energy}, {id: r202, direction: out, kind: energy}, {id: c401, direction: out, kind: energy}]
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: z101, direction: out, kind: energy}
      - {id: r301, direction: out, kind: energy}
      - {id: s501, direction: out, kind: energy}
      - {id: c401, direction: out, kind: energy}
products:
  - {id: ETOH, title: Anhydrous ethanol to storage (undenatured), category: product, ports: [{id: in, direction: in}]}
  - {id: DDGS, title: Distillers' dried grains with solubles (DDGS), category: by_product, ports: [{id: in, direction: in}]}
  - {id: VENT, title: Scrubbed fermentation CO2 to atmosphere, category: emission, ports: [{id: in, direction: in}]}
  - {id: STACK, title: Dryer exhaust to atmosphere, category: emission, ports: [{id: in, direction: in}]}
  - {id: TRASH, title: "Grain-cleaning trash (tramp metal, stones, fines)", category: solid_waste, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-009"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-009"}
      min_approach: {value: 5, provenance: assumed, source: D-009}
    ports: [{id: r301, direction: in, kind: energy}, {id: e402, direction: in, kind: energy}, {id: e501, direction: in, kind: energy}]

blocks:
  - id: GRN
    title: Grain receiving, cleaning and milling
    class: Grinding
    ports:
      - {id: corn, direction: in}
      - {id: trash, direction: out}
      - {id: meal, direction: out}
      - {id: power, direction: in, kind: energy}
  - id: CNV
    title: Liquefaction, cooking and saccharification
    class: ReactingChemicals
    ports:
      - {id: meal, direction: in}
      - {id: cond, direction: in}
      - {id: strip, direction: in}
      - {id: backset, direction: in}
      - {id: mash, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
  - id: FER
    title: Fermentation and CO2 scrubbing
    class: ReactingChemicals
    ports:
      - {id: mash, direction: in}
      - {id: water, direction: in}
      - {id: beer, direction: out}
      - {id: scrub, direction: out}
      - {id: vent, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: DIS
    title: Distillation and molecular-sieve dehydration
    class: Distilling
    ports:
      - {id: beer, direction: in}
      - {id: scrub, direction: in}
      - {id: product, direction: out}
      - {id: stillage, direction: out}
      - {id: strip, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: cond, direction: out, kind: energy}
  - id: COP
    title: Stillage separation, evaporation and DDGS drying
    class: Drying
    ports:
      - {id: stillage, direction: in}
      - {id: ng, direction: in}
      - {id: air, direction: in}
      - {id: backset, direction: out}
      - {id: cond, direction: out}
      - {id: ddgs, direction: out}
      - {id: stack, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: heat, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}

steps:
  # ---- GRN
  - id: X101
    block: GRN
    title: Grain cleaning (scalper and screens)
    class: SplittingMaterial
    split: {trash: 0.003}
    links: [{target: equipment, ref: X-101}]
    ports:
      - {id: in, direction: in, delegates: corn}
      - {id: trash, direction: out, delegates: trash}
      - {id: out, direction: out}
  - id: Z101
    block: GRN
    title: Hammer mills
    class: TransportingMaterial
    links: [{target: equipment, ref: Z-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: meal}
      - {id: power, direction: in, kind: energy, delegates: power}
  # ---- CNV
  - id: M201
    block: CNV
    title: Slurry tank (meal with evaporator condensate and stripper bottoms)
    class: Mixing
    links: [{target: equipment, ref: T-201}]
    ports:
      - {id: meal, direction: in, delegates: meal}
      - {id: cond, direction: in, delegates: cond}
      - {id: strip, direction: in, delegates: strip}
      - {id: out, direction: out}
  - id: R201
    block: CNV
    title: Liquefaction tank (88 C, alpha-amylase) and steam heating
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
  - id: M202
    block: CNV
    title: Backset addition
    class: Mixing
    ports:
      - {id: liq, direction: in}
      - {id: backset, direction: in, delegates: backset}
      - {id: out, direction: out}
  - id: R202
    block: CNV
    title: Cooker (110 C, 20 min) and continuous saccharification tank (60 C, 6 h, glucoamylase)
    class: ReactingChemicals
    reactor: conversion
    reactions: [HYD]
    links: [{target: equipment, ref: R-202}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: mash}
      - {id: steam, direction: in, kind: energy, delegates: steam2}
  # ---- FER
  - id: R301
    block: FER
    title: Four continuous cascade fermentors (32-34 C, 46 h in total)
    class: ReactingChemicals
    reactor: conversion
    reactions: [FERM, GLYC]
    energy_port: cw
    links: [{target: equipment, ref: R-301}]
    ports:
      - {id: in, direction: in, delegates: mash}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: V301
    block: FER
    title: Beer well and degasser (fermentor off-gas and the beer's dissolved CO2)
    class: SeparatingByPhaseSeparation
    recovery:
      outlets:
        gas: {CO2B: 1.0, ETOH: 0.024, H2O: 0.00225}
      provenance: assumed
      source: "all CO2 to the off-gas (SRC-1 p. 7: the whole beer is degassed); the gas saturated with the beer's ethanol and water vapour at 307 K, about 2.3 and 5.1 kPa partial pressure, ASSUMED (D-006)"
    links: [{target: equipment, ref: V-301}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out}
      - {id: beer, direction: out, delegates: beer}
  - id: A301
    block: FER
    title: CO2 scrubber (water, ethanol recovered to the beer)
    class: Absorbing
    recovery:
      outlets:
        vent: {CO2B: 1.0, ETOH: 0.01, H2O: 0.0185}
      provenance: assumed
      source: "99 % of the vented ethanol recovered (SRC-2 p. 46, the same duty in NREL's lignocellulosic design); the vent leaves saturated with water at 305.15 K (4.76 kPa, IAPWS-95, SRC-3), y(H2O) 0.047 at 101.325 kPa, 1.85 % of the water in, ASSUMED (D-006)"
    links: [{target: equipment, ref: A-301}]
    ports:
      - {id: gas, direction: in}
      - {id: water, direction: in, delegates: water}
      - {id: vent, direction: out, delegates: vent}
      - {id: liq, direction: out, delegates: scrub}
  # ---- DIS
  - id: M401
    block: DIS
    title: Beer and scrubber liquor to the beer column
    class: Mixing
    ports:
      - {id: beer, direction: in, delegates: beer}
      - {id: scrub, direction: in, delegates: scrub}
      - {id: out, direction: out}
  - id: C401
    block: DIS
    title: Beer column (whole stillage below 0.1 wt% ethanol)
    class: Distilling
    recovery:
      outlets:
        ovhd: {ETOH: 0.995, H2O: 0.1215}
      provenance: assumed
      source: "the overhead vapour at about 45 wt% ethanol and the whole stillage below 0.1 wt% (SRC-1 p. 7); shares ASSUMED for these (D-007)"
    links: [{target: equipment, ref: C-401}]
    ports:
      - {id: in, direction: in}
      - {id: ovhd, direction: out}
      - {id: btm, direction: out, delegates: stillage}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: C402
    block: DIS
    title: Rectifier and stripper (to 91 wt% ethanol)
    class: Distilling
    recovery:
      outlets:
        top: {ETOH: 0.9993, H2O: 0.0960}
      provenance: assumed
      source: "the rectifier's vapour at about 91 wt% ethanol, the stripper's bottoms below 0.1 wt% (SRC-1 p. 7); shares ASSUMED for these (D-007)"
    links: [{target: equipment, ref: C-402}]
    ports:
      - {id: feed, direction: in}
      - {id: regen, direction: in}
      - {id: top, direction: out}
      - {id: btm, direction: out, delegates: strip}
      - {id: cond, direction: out, kind: energy, delegates: cond}
  - id: D401
    block: DIS
    title: Molecular sieve dehydration (two beds, vapour phase, one regenerating)
    class: Adsorbing
    recovery:
      outlets:
        prod: {ETOH: 0.756, H2O: 0.035}
      provenance: assumed
      source: "96.5 % of the water adsorbed and the regenerate about 72 wt% ethanol (as SRC-2 p. 46: 95 % and 72 wt%), giving about 99.5 wt% ethanol (SRC-2 p. 46; SRC-1 p. 7: more than 99 wt%); ASSUMED (D-007)"
    links: [{target: equipment, ref: D-401}]
    ports:
      - {id: in, direction: in}
      - {id: prod, direction: out}
      - {id: regen, direction: out}
  - id: E402
    block: DIS
    title: Product condenser and cooler
    class: Cooling
    links: [{target: equipment, ref: E-402}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: product}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  # ---- COP
  - id: S501
    block: COP
    title: Decanter centrifuges (wet cake 35 wt% solids)
    class: SeparatingMechanically
    recovery:
      outlets:
        cake: {NFS: 0.95, STARCH: 0.95, H2O: 0.113, NFD: 0.113, GLC: 0.113, GLY: 0.113, HAC: 0.113, ETOH: 0.113}
      provenance: assumed
      source: "95 % of the suspended solids to the cake, the liquid split alike for all its solutes, ASSUMED so the wet cake is about 35 wt% solids (SRC-1 p. 7, D-008)"
    links: [{target: equipment, ref: S-501}]
    ports:
      - {id: in, direction: in, delegates: stillage}
      - {id: cake, direction: out}
      - {id: thin, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: X502
    block: COP
    title: Thin stillage split (backset to the mash, the rest to the evaporator)
    class: SplittingMaterial
    ports:
      - {id: in, direction: in}
      - {id: backset, direction: out, delegates: backset}
      - {id: evap, direction: out}
  - id: E501
    block: COP
    title: Multiple-effect evaporator (syrup 55 wt% solids)
    class: Evaporating
    recovery:
      outlets:
        cond: {H2O: 0.953, ETOH: 1.0, HAC: 0.5}
      provenance: assumed
      source: "the water's share ASSUMED so the syrup is about 55 wt% solids (SRC-1 p. 7); the ethanol all and half the acetic acid to the condensate, ASSUMED (D-008)"
    links: [{target: equipment, ref: E-501}]
    ports:
      - {id: in, direction: in}
      - {id: cond, direction: out, delegates: cond}
      - {id: syrup, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: heat}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: M601
    block: COP
    title: Wet cake and syrup mixer
    class: Mixing
    ports:
      - {id: cake, direction: in}
      - {id: syrup, direction: in}
      - {id: out, direction: out}
  - id: R601
    block: COP
    title: Dryer burner (natural gas)
    class: ReactingChemicals
    reactor: conversion
    reactions: [COMB]
    energy_port: heat
    links: [{target: equipment, ref: D-601}]
    ports:
      - {id: ng, direction: in, delegates: ng}
      - {id: air, direction: in, delegates: air}
      - {id: out, direction: out}
      - {id: heat, direction: out, kind: energy}
  - id: D601
    block: COP
    title: Rotary dryer (DDGS at 9 wt% moisture)
    class: Drying
    dryer:
      volatiles: [H2O, ETOH, HAC]
      residual_moisture: {value: 0.09, basis: mass_fraction, provenance: given, source: "SRC-1 p. 7 and Table 2: DDG at 9 wt% moisture"}
      temperature: 373.15
      outlets: {product: prod, vapour: vap}
    links: [{target: equipment, ref: D-601}]
    ports:
      - {id: in, direction: in}
      - {id: prod, direction: out, delegates: ddgs}
      - {id: vap, direction: out}
      - {id: heat, direction: in, kind: energy}
  - id: M602
    block: COP
    title: Dryer exhaust (flue gas with the evaporated water)
    class: Mixing
    ports:
      - {id: vap, direction: in}
      - {id: flue, direction: in}
      - {id: out, direction: out, delegates: stack}

streams:
  - id: S1
    title: Shelled corn
    from: CORN.out
    to: X101.in
    template: corn
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "ambient, D-002"}
        pressure: {value: 101.325, provenance: assumed, source: "atmospheric, D-002"}
        flow: {value: 28150.0, basis: mass, provenance: given, source: "SRC-1 Table 3: 633 dry short tons a day (x 907.185 kg / 24 h = 23 927.5 kg/h dry) at 15 wt% moisture (SRC-1 p. 2, Table 1), D-002"}
        composition: {basis: mass_fraction, values: {H2O: 0.15, STARCH: 0.595, NFS: 0.153, NFD: 0.102}, provenance: given, source: "SRC-1 p. 2: on a dry basis 70 % starch, 18 % suspended and 12 % dissolved non-fermentables; 15 wt% moisture"}
  - id: S2
    title: Grain-cleaning trash
    from: X101.trash
    to: TRASH.in
    template: corn
    state:
      design:
        composition: {basis: mass_fraction, values: {H2O: 0.15, STARCH: 0.595, NFS: 0.153, NFD: 0.102}, provenance: calculated, source: 'cheme process propagate: splitter X101 from S1', fingerprint: 43f8dc5e2f25a0e8}
        flow: {value: 84.45, basis: mass, provenance: calculated, source: 'cheme process propagate: splitter X101 from S1', fingerprint: 3d05aba4b33dc65c}
  - id: S3
    title: Cleaned corn
    from: X101.out
    to: Z101.in
    template: corn
    state:
      design:
        composition: {basis: mass_fraction, values: {H2O: 0.15, STARCH: 0.595, NFS: 0.153, NFD: 0.102}, provenance: calculated, source: 'cheme process propagate: splitter X101 from S1', fingerprint: 43f8dc5e2f25a0e8}
        flow: {value: 28065.5, provenance: calculated, source: 'cheme process propagate: splitter X101 from S1 S2', fingerprint: 330486c094d86977}
  - id: S4
    title: Corn meal
    from: Z101.out
    to: M201.meal
    template: corn
    state:
      design:
        composition: {basis: mass_fraction, values: {H2O: 0.15, STARCH: 0.595, NFS: 0.153, NFD: 0.102}, provenance: calculated, source: 'cheme process propagate: pass-through Z101 from S3', fingerprint: c49595600a3ae01d}
        flow: {value: 28065.5, provenance: calculated, source: 'cheme process propagate: pass-through Z101 from S3', fingerprint: c49595600a3ae01d}
  - id: S5
    title: Slurry
    from: M201.out
    to: R201.in
    template: mash
    state:
      design:
        composition: {basis: mole_fraction, values: {H2O: 0.961334, STARCH: 0.0266995, NFS: 0.00686559, NFD: 0.00457706, GLC: 0.0, ETOH: 0.000222814, GLY: 0.0, HAC: 0.000300818, CO2B: 0.0}, provenance: calculated, source: 'cheme process propagate: mixer M201 from S4 S20 S27', fingerprint: 2caf294b709ea6e7}
        flow: {value: 90768.9, provenance: calculated, source: 'cheme process propagate: mixer M201 from S4 S20 S27', fingerprint: 4450d259d1c4103a}
  - id: S6
    title: Liquefied mash
    from: R201.out
    to: M202.liq
    template: mash
    state:
      design:
        temperature: {value: 361.15, provenance: given, source: "SRC-1 p. 6: liquefaction at 88 C"}
        flow: {value: 90768.9, provenance: calculated, source: 'cheme process propagate: pass-through R201 from S5', fingerprint: 8b56f0c29ddce1b1}
        composition: {basis: mole_fraction, values: {H2O: 0.961334, STARCH: 0.0266995, NFS: 0.00686559, NFD: 0.00457706, GLC: 0.0, ETOH: 0.000222814, GLY: 0.0, HAC: 0.000300818, CO2B: 0.0}, provenance: calculated, source: 'cheme process propagate: pass-through R201 from S5', fingerprint: 8b56f0c29ddce1b1}
  - id: S7
    title: Mash with backset
    from: M202.out
    to: R202.in
    template: mash
    state:
      design:
        composition: {basis: mole_fraction, values: {H2O: 0.966858, STARCH: 0.0219125, NFS: 0.00569584, NFD: 0.00465156, GLC: 0.000119266, ETOH: 0.000222907, GLY: 0.000156023, HAC: 0.000383726, CO2B: 0.0}, provenance: calculated, source: 'cheme process propagate: mixer M202 from S6 S25', fingerprint: 67f0de2df9f3e086}
        flow: {value: 106787.0, provenance: calculated, source: 'cheme process propagate: mixer M202 from S6 S25', fingerprint: 6157721232b9ddc2}
  - id: S8
    title: Saccharified mash, cooled
    from: R202.out
    to: R301.in
    template: mash
    state:
      design:
        temperature: {value: 305.15, provenance: given, source: "SRC-1 p. 7: cooled to 32 C before fermentation"}
        flow: {value: 106787.0, provenance: calculated, source: 'cheme process propagate: reactor R202 from S7', fingerprint: 9aa1b258c4850e02}
        composition: {basis: mole_fraction, values: {H2O: 0.966123, STARCH: 0.000223984, NFS: 0.00582214, NFD: 0.00475471, GLC: 0.0222963, ETOH: 0.00022785, GLY: 0.000159483, HAC: 0.000392235, CO2B: 0.0}, provenance: calculated, source: 'cheme process propagate: reactor R202 from S7', fingerprint: c20ee7ff5f972403}
  - id: S9
    title: Fermented beer with CO2
    from: R301.out
    to: V301.in
    template: mash
