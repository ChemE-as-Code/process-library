# Reactions of methylmagnesium-bromide-1. Schema cheme/reactions/v1 (`cheme schema
# process-reactions`).
#
# GRIG: magnesium and methyl bromide to methylmagnesium bromide in 2-MeTHF (HSDB via PubChem CID
# 6349, Methods of Manufacturing: "reaction of magnesium and methyl bromide"; the product of the
# Albemarle TDS 10000303). Methyl bromide is dosed as a gas (D-004), so the heat of reaction is
# written with gaseous methyl bromide (core ADR 0054: a dissolving dose adds no heat of
# absorption or condensation): Holm (1981), via the NIST WebBook, gives -267.8 +/- 4.4 kJ/mol for
# Mg(cr) + CH3Br(l) -> CH3MgBr in diethyl ether; less methyl bromide's heat of vaporisation at
# 298 K, 23.3 kJ/mol (thermo): -291.1 kJ/mol (D-005). The solvent is 2-MeTHF, not diethyl ether:
# the heat of solution of the Grignard reagent in the two ethers is taken as equal (ASSUMED).
# WURTZ: the Wurtz coupling of the Grignard reagent with methyl bromide to ethane and MgBr2, the
# side reaction of the Fraunhofer IMM flyer (2020, p. 1). Its heat is derived from the two NIST
# reactions of Holm (1981): HBr(g) + CH3MgBr -> CH4 + MgBr2 (-274.5 kJ/mol) gives
# Hf(MgBr2) - Hf(CH3MgBr) = -274.5 + Hf(HBr, g) - Hf(CH4, g) = -235.8 kJ/mol (thermo's gas
# formation enthalpies, -35.85 and -74.53; methane's heat of solution neglected); with ethane
# (-83.78) and methyl bromide (-36.38), both gas (thermo): -283.2 kJ/mol (my arithmetic, D-005).
# Kinetics: no open rate law (searched 2026-11-05). Both rate laws are effective homogeneous
# ones, ASSUMED (D-005): GRIG first order in dissolved methyl bromide and of order 2/3 in the
# magnesium's pseudo-concentration (the turnings' surface shrinking with their mass), WURTZ
# first order in each of its reactants; core has no surface-area rate or induction period.
schema: cheme/reactions/v1
kind: reactions
reactions:
  - id: GRIG
    title: Grignard formation from magnesium and methyl bromide
    equation: Mg + CH3Br -> CH3MgBr
    stoichiometry: {MG: -1, MEBR: -1, MEMGBR: 1}
    phase: liquid
    heat_of_reaction: {value: -291100, provenance: given, source: "Holm (1981), J. Chem. Soc. Perkin Trans. 2, 464, via the NIST WebBook (CID C75161, reaction thermochemistry): -267.8 +/- 4.4 kJ/mol for Mg(cr) + CH3Br(l) in diethyl ether, less the heat of vaporisation of methyl bromide at 298 K, 23.3 kJ/mol (thermo): the dosed gas's basis (D-005)"}
    rate:
      form: power_law
      basis: volume
      driving: concentration
      # k = 0.02 (m3/kmol)^(2/3)/s at 318.15 K (Ea 40 kJ/mol): A = 0.02 x exp(40000 / (8.314 x
      # 318.15)) = 7.389e4
      k: {A: 7.389e4, Ea: 40000}
      orders: {MEBR: 1, MG: 0.6667}
      temperature_range: [298.15, 338.15]
      provenance: assumed
      source: "ASSUMED fast effective rate of the initiated reaction (D-005): no open kinetics found (2026-11-05); to be replaced by reaction calorimetry (heat flow and in-situ IR during the dosing)"
    sources: ["HSDB via PubChem CID 6349 (Methods of Manufacturing)", "Holm 1981 via the NIST WebBook (heat of reaction)"]
  - id: WURTZ
    title: Wurtz coupling of the Grignard reagent with methyl bromide
    equation: CH3MgBr + CH3Br -> C2H6 + MgBr2
    stoichiometry: {MEMGBR: -1, MEBR: -1, C2H6: 1, MGBR2: 1}
    phase: liquid
    heat_of_reaction: {value: -283200, provenance: assumed, source: "derived from Holm (1981) via the NIST WebBook and thermo's gas formation enthalpies, gaseous methyl bromide and ethane (my arithmetic, D-005); to be measured"}
    rate:
      form: power_law
      basis: volume
      driving: concentration
      # k = 1e-4 m3/(kmol s) at 318.15 K (Ea 40 kJ/mol): A = 1e-4 x exp(40000 / (8.314 x 318.15)) = 369.4
      k: {A: 369.4, Ea: 40000}
      orders: {MEMGBR: 1, MEBR: 1}
      temperature_range: [298.15, 338.15]
      provenance: assumed
      source: "ASSUMED (D-005): set so that about 1 % of the methyl bromide couples at the base rate; no open selectivity for methyl bromide found"
    sources: ["Fraunhofer IMM (2020), Scalable continuous Grignard reagent formation, flyer p. 1 (Wurtz coupling as the side reaction)"]
