# Process Atlas manifest of methylmagnesium-bromide-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: methylmagnesium-bromide-1
title: Methylmagnesium bromide in 2-MeTHF by semi-batch Grignard reaction with methyl bromide gas dosing (4400 t/a)
summary: >-
  A batch plant: methyl bromide gas is dosed into magnesium in dry 2-MeTHF at 318 K, 5 % first
  and a hold for the initiation; ethane and unabsorbed methyl bromide leave by the vent, and the
  35 wt% solution is filtered from the excess magnesium. Concept stage, 5000 kg every 9.0 h on a
  dedicated train, initiation and accumulation screened, preliminary LCI.
description: |
  Magnesium turnings (5 % above the methyl bromide) and dry 2-MeTHF are charged into a 6.3 m3
  stainless-steel reactor under nitrogen, activated with a little iodine and warmed to 318 K.
  Methyl bromide, evaporated from its liquefied store, is dosed below the surface as a gas: 5 %
  in 15 min, a 30 min hold until the reaction has started, then the rest over 5 h, the rate set by
  the reactor's brine jacket. The product is the titrated solution, 35 wt% methylmagnesium bromide
  in 2-MeTHF (about 3.2 M), the grade of the Albemarle data sheet 10000303; it is filtered from
  the excess magnesium in a pressure Nutsche and filled under nitrogen. No isolation.

  The batch is modelled with cheme-as-code's semi-batch reactor with a vent and a partly absorbed
  gas dose (reactor: semibatch, batch.vent, dosing.absorbed; core ADRs 0050 and 0054), magnesium
  as a solid reactant of the liquid model, and the batch recipe (process/recipe.yaml, core ADRs
  0051, 0052 and 0057: one vessel over the charge and reaction steps, the warm-up from the jacket,
  the filtration time from Ruth's equation). The reaction releases 291 kJ per mol on the gas basis
  (Holm 1981 via the NIST WebBook), an adiabatic rise of the whole batch of 548 K against the
  solvent's boiling point of 351 K. With the ASSUMED fast rate the accumulated methyl bromide stays
  at 0.6 % and the cooling-failure temperature at 321.5 K; a reaction 10 times slower gives 4.3 %
  and 341.5 K, 100 times slower (a sluggish initiation) 21 % and 434 K, far above the boiling
  point. An uninitiated 5 % charge alone would take the charge to 349.5 K, just below it. Yield
  96.7 % on methyl bromide (1 % passes through the liquid, 1.7 % couples to ethane). See
  DESIGN.md for every assumption.
families: [inorganic-chemicals]
keywords: [methylmagnesium bromide, MeMgBr, Grignard reagent, organomagnesium, methyl bromide, bromomethane, magnesium, 2-methyltetrahydrofuran, 2-MeTHF, semi-batch, batch, gas dosing, vent, initiation, accumulation, Wurtz coupling, thermal screening]
facets:
  feedstock_basis: [fossil, mineral, biogenic]
  product_classes: [chemicals]
  unit_operations: [reaction, filtration]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, kinetics, jacket, gas
# uptake and the filter are assumed; the heat of reaction and the product grade are sourced
# (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept batch PFD with closed mass, component and element balances (cheme validate, cheme
    process streams: 2 blocks and 4 steps within tolerance). The charge mixer M101, the semi-batch
    R101 with its vent (from its ASSUMED rate laws, magnesium a solid reactant), the vaporiser
    E101 and the specified filter F101 are calculated by cheme process propagate; there is no
    balance script. The duties are year averages from R101's extents and hand calculations
    (DESIGN.md D-009). The recipe's year-average rate of the product agrees with the flowsheet
    (no cheme.recipe-basis finding); the recipe sizes R-101 (6.3 m3) and its jacket check passes
    at the 5 h main dosing. Thermal screening (cheme process reactor-hazards): dT_ad 548 K,
    accumulation 0.615 %, MTSR 321.5 K against an MTT of 351.15 K (hazard.mtt: the boiling point
    of 2-MeTHF); no criticality class without a TD24 from calorimetry. The low accumulation rests
    on the assumed kinetics; the k/10 and k/100 sensitivities are in DESIGN.md D-011.
    Preliminary gate-to-gate LCI with the per-batch nitrogen and iodine; both linked to asu-1 and
    iodine-1, the other backgrounds gaps (magnesium, methyl bromide and 2-MeTHF have no library
    producer; their proxies are named, not linked). cheme maturity reaches no level (assumed
    feeds, kinetics and separations); the claim `maturity: concept` is the lowest value of the
    schema, not an evidenced level. Not reviewed. Needs cheme-as-code after 1.7.0 (core main,
    to be released as 1.8.0: batch.vent, dosing.absorbed, recipe units, filtration).
