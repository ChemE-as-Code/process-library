# Equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes per batch from the recipe (D-003) and R101's model; design pressures, temperatures and
# materials are not set yet (basic engineering); the materials named are usual choices for a
# Grignard reagent in an ether, to be confirmed (open input). All values ASSUMED.
schema: cheme/equipment/v1
equipment:
  - {tag: R-101, type: StirredTankReactor, service: "Grignard reactor: magnesium turnings and 2-MeTHF charged, methyl bromide gas dosed below the surface at 318 K (5 % for the initiation, a hold, the rest)",
     notes: "4.56 m3 of slurry per batch at the end of the dosing; 6.3 m3 (R10 preferred size, 72 % full, D 1.88 m) as the recipe sizes it from R101's semi-batch model (core ADR 0052); stainless steel with a half-pipe jacket on chilled brine at 263 K, U 400 W/(m2 K): it removes 249 kW at the charge against the peak 242 kW of the 5 h main dosing, and on hot water at 353 K for the warm-up; agitator 5 kW year average; reflux condenser and nitrogen blanket, vent to the thermal oxidiser (not in the boundary); dosing interlocked with the temperature, the cooling, the agitator and an initiation signal (D-005, D-010, D-011)."}
  - {tag: E-101, type: HeatExchanger, service: "Methyl bromide vaporiser: liquefied methyl bromide evaporated and warmed to 298 K on hot water",
     notes: "11.1 kW year average, about 15 kW over the dosing (11.1 kW x 9.0 h / 6.75 h); the dosed gas metered by a mass-flow controller (D-004, D-009)."}
  - {tag: F-101, type: Filter, service: "Pressure Nutsche filter under nitrogen: the excess magnesium filtered from the Grignard solution",
     notes: "1 m2 sintered-metal plate, 2 bar of nitrogen; 0.93 h per batch from Ruth's equation with an ASSUMED cake resistance (recipe, core ADR 0057); the magnesium cake is blown with nitrogen and discharged wet into a quench drum (D-007)."}
