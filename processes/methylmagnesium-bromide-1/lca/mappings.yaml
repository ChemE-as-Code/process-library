# methylmagnesium-bromide-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR
# 0022). Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# The preliminary LCI leaves most backgrounds unmapped (DESIGN.md D-012): the build reports each
# as a gap (lci/gaps.json). Linked here: the nitrogen consumable to asu-1's gaseous nitrogen, the
# iodine activator to iodine-1, and the LP steam counted as heat delivered (kWh), as
# n-bromosuccinimide-1 does. The library has no producer of magnesium, methyl bromide or
# 2-MeTHF; their cited proxies are named in lca/lca.yaml and not linked.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "consumable:nitrogen": {dataset: {path: processes/asu-1/lca/dataset.yaml, product: "product:GANP"}, source: "the Atlas producer asu-1, gaseous nitrogen to the battery limit (99.97 mol% N2, 9 bar(a)); inerting and pressing need only a few hundred kPa"}
  "consumable:iodine": {dataset: {path: processes/iodine-1/lca/dataset.yaml, product: "product:IODINE"}, source: "the Atlas producer iodine-1, iodine from natural brine, the activator of the magnesium"}
  "feed:LPS": {use: steam-heat, source: "LP steam 350 kPa(a) to R-101's hot-water loop (Q2) and the vaporiser E-101 (Q3), counted as heat delivered (kWh), D-009"}
