cutoff:
- key: cutoff:catalyst
  title: R-101 cracking catalyst (silica-alumina type)
  amount: 0.375
  reason: catalyst charge of roughly 4-11 t (WHSV 1-3 1/h of US 8,633,345 B2 for 11.2 t/h feed) replaced
    every few years, about 3 t/a (ASSUMED order of magnitude, life not sourced; D-005, I-03); no catalyst
    inventory at this stage
  source: D-005
- key: emission-excluded:heater-combustion
  title: combustion emissions of H-101
  direction: output
  reason: the fired heater's combustion emissions (CO2, NOx, CO, CH4, N2O, PM) belong to the purchased-heat
    background of feed:FUEL (heat from natural gas at an industrial furnace), which is per MJ delivered
    and includes them; counting them here would double count (D-011)
  source: D-011
- key: emission-excluded:storage-tanks
  title: storage-tank emissions of the plant
  direction: output
  reason: 'MTBE, isobutene and methanol tanks are outside the battery limit (design basis): their breathing
    and pressure-storage losses belong to the storage, not to this plant boundary (D-011)'
  source: design basis
- key: emission-excluded:fugitive-leaks
  title: equipment-leaks emissions of the plant
  direction: output
  reason: 'fugitive isobutene, MTBE, methanol and DME from flanges, seals and valves are not estimated,
    not claimed negligible: an equipment-leak estimate needs the P&ID component counts, which do not exist
    at the concept stage (DESIGN.md I-05, D-011)'
  source: DESIGN.md I-05
- key: emission-excluded:vents-to-fuel
  title: combustion emissions of the plant
  direction: output
  reason: the DME-rich vents and the heavy ends leave the boundary as co-products to the site fuel systems
    (FUELGAS, HEAVIES); their combustion emissions belong to the user of the fuel, not to this plant (D-008,
    D-011)
  source: D-008
