modelling:
  principle: attributional
  multifunctionality: 'unallocated multi-output dataset; default allocation mass: D-011 (agent proposal,
    for the LCA practitioner to confirm): mass allocation as the exported default. The cracking splits
    the MTBE molecule into isobutene and methanol, which both leave as chemical feedstocks, so mass follows
    the physical relation of the split (ISO 14044 4.3.4.2, step 2); the heavy ends and the DME-rich vents
    (1.5 % of the output mass) are kept as co-products sent to the site fuel systems. Energy (LHV) and
    system expansion (the methanol displaces methanol from synthesis gas, e.g. the library''s methanol-1;
    the heavy ends displace fuel oil, the vents natural gas) are computed for comparison.'
