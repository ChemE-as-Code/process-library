# Components and templates of the process. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
# Ideal-gas and critical data: `cheme chemistry thermo 1634-04-4 115-11-7 67-56-1 115-10-6
# 7732-18-5 107-39-1 --fit 298.15,700` (the `chemicals` package: ATcT/CRC formation enthalpies,
# CRC/NIST WebBook/Yaws entropies, heat capacities fitted to thermo's TRC ideal-gas
# correlations, HEOS/IUPAC critical constants). Normal boiling points: `chemicals` (Tb).
# DIB stands for the C8 dimers of isobutene ("diisobutene", mainly 2,4,4-trimethylpentenes,
# US 8,633,345 B2): represented by 2,4,4-trimethyl-1-pentene (ASSUMED lumping, D-005); its
# heat capacity is a Joback estimate.
schema: cheme/process/v1
kind: materials
components:
  - id: MTBE
    name: Methyl tert-butyl ether
    formula: C5H12O
    cas: 1634-04-4
    molar_mass: 88.148
    normal_boiling_point: 328.25
    critical: {Tc: 497.1, Pc: 3430, omega: 0.267, provenance: given, source: "chemicals: Tc IUPAC, Pc IUPAC, omega PSRK"}
    ideal_gas: {dHf_298: -283700.0, S_298: 357.8, cp_R: [9.18733, -0.00698804, 0.000157748, -2.15719e-07, 9.34807e-11], temperature_range: [298.15, 700], provenance: given, source: "chemicals: dHf_298 CRC, S_298 WEBBOOK, cp_R fitted to thermo TRCIG 298.15-700 K (max deviation 0.04%)"}
  - id: IB
    name: Isobutene (2-methylpropene)
    formula: C4H8
    cas: 115-11-7
    molar_mass: 56.106
    normal_boiling_point: 266.15
    critical: {Tc: 418.09, Pc: 4009.8, omega: 0.193, provenance: given, source: "chemicals: Tc HEOS, Pc HEOS, omega HEOS"}
    ideal_gas: {dHf_298: -17600.0, S_298: 293.59, cp_R: [3.38712, 0.0179196, 3.76558e-05, -6.48818e-08, 3.03488e-11], temperature_range: [298.15, 700], provenance: given, source: "chemicals: dHf_298 ATCT_G, S_298 WEBBOOK, cp_R fitted to thermo TRCIG 298.15-700 K (max deviation 0.02%)"}
  - id: MEOH
