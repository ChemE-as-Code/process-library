    ideal_gas: {dHf_298: -200700.0, S_298: 239.9, cp_R: [5.50344, -0.0151027, 7.0746e-05, -8.59838e-08, 3.65802e-11], temperature_range: [298.15, 700], provenance: given, source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R fitted to thermo TRCIG 298.15-700 K (max deviation 0.04%)"}
  - id: DME
