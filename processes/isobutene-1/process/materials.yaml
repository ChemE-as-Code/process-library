templates:
  - {id: mixture, title: MTBE cracking process mixture, components: [MTBE, IB, MEOH, DME, H2O, DIB]}
# property_method is a placeholder until `cheme process props --fill` records the method. No
# packaged property package covers MTBE / methanol / water / C4 (polar, azeotropic, two liquid
# phases; core #315): the stream values come from scripts/ib_balance.py (specified splits and
# shortcut duties, D-006), given as ASSUMED.
property_method:
  adapter: thermo
  status: placeholder
