    critical: {Tc: 400.378, Pc: 5336.8, omega: 0.196, provenance: given, source: "chemicals: Tc HEOS, Pc HEOS, omega HEOS"}
    ideal_gas: {dHf_298: -184020.0, S_298: 266.4, cp_R: [4.95853, 0.000138109, 4.94792e-05, -6.52517e-08, 2.78177e-11], temperature_range: [298.15, 700], provenance: given, source: "chemicals: dHf_298 ATCT_G, S_298 CRC, cp_R fitted to thermo TRCIG 298.15-700 K (max deviation 0.02%)"}
  - id: H2O
