    formula: H2O
    cas: 7732-18-5
    molar_mass: 18.015
    normal_boiling_point: 373.12
    critical: {Tc: 647.096, Pc: 22064, omega: 0.3443, provenance: given, source: "chemicals: Tc HEOS, Pc HEOS, omega HEOS"}
