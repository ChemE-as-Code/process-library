    cas: 107-39-1
    molar_mass: 112.21
    normal_boiling_point: 374.45
    critical: {Tc: 550, Pc: 2680, omega: 0.301, provenance: given, source: "chemicals: Tc PINAMARTINES, Pc PINAMARTINES, omega YAWS"}
