        flow: {value: 11222.4, provenance: calculated, source: 'cheme process propagate: pass-through P101 from S2', fingerprint: 866be2a50bc0e114}
        composition: {basis: mole_fraction, values: {MTBE: 0.953851, IB: 0.00171399, MEOH: 0.0435784, DME: 0.0, H2O: 0.0, DIB: 0.000856993}, provenance: calculated, source: 'cheme process propagate: pass-through P101 from S2', fingerprint: 866be2a50bc0e114}
  - id: S4
    title: MTBE column overhead vapour (reactor feed)
    from: C101.top
    to: E101.cold_in
    template: mixture
    state:
      design:
        pressure: {value: 1000, provenance: assumed, source: D-004}
        temperature: {value: 420.2, provenance: assumed, source: "scripts/ib_balance.py: ideal bubble point at 1000 kPa(a) (D-006)"}
        flow: {value: 11190.9561, basis: mass, provenance: assumed, source: "scripts/ib_balance.py, C-101 split (D-006, D-007)"}
        composition: {basis: mole_fraction, values: {MTBE: 0.954594396, IB: 0.00171827, MEOH: 0.043687334}, provenance: assumed, source: "scripts/ib_balance.py, C-101 split (D-007)"}
  - id: S5
    title: Heavy ends (MTBE column bottoms)
    from: C101.bot
    to: HEAVIES.in
    template: mixture
    state:
      design:
        pressure: {value: 1010, provenance: assumed, source: D-004}
        temperature: {value: 435.9, provenance: assumed, source: "scripts/ib_balance.py: ideal bubble point (D-006)"}
        flow: {value: 31.4930, basis: mass, provenance: assumed, source: "scripts/ib_balance.py: all C8 with MTBE at 60 wt% (D-007)"}
        composition: {basis: mole_fraction, values: {MTBE: 0.6562935, DIB: 0.3437065}, provenance: assumed, source: "scripts/ib_balance.py (D-007)"}
  - id: S6
    title: Preheated reactor feed
    from: E101.cold_out
    to: H101.in
    template: mixture
    state:
      design:
        pressure: {value: 950, provenance: assumed, source: D-004}
        temperature: {value: 523.15, provenance: assumed, source: "D-004: 30 K approach to the reactor outlet"}
        flow: {value: 11190.9561, basis: mass, provenance: assumed, source: "scripts/ib_balance.py (D-006): S4 through the cold side of E-101"}
        composition: {basis: mole_fraction, values: {MTBE: 0.954594396, IB: 0.00171827, MEOH: 0.043687334}, provenance: assumed, source: "scripts/ib_balance.py (D-006); must equal S4"}
  - id: S7
    title: Reactor feed
    from: H101.out
    to: R101.in
    template: mixture
    state:
      design:
        pressure: {value: 900, provenance: assumed, source: D-004}
        temperature: {value: 553.15, provenance: assumed, source: D-004}
        flow: {value: 11190.9561, basis: mass, provenance: calculated, source: 'cheme process propagate: pass-through H101 from S6', fingerprint: cee4b414594e940c}
        composition: {basis: mole_fraction, values: {MTBE: 0.954594396, IB: 0.00171827, MEOH: 0.043687334}, provenance: calculated, source: 'cheme process propagate: pass-through H101 from S6', fingerprint: cee4b414594e940c}
  - id: S8
    title: Reactor effluent
    from: R101.out
    to: E101.hot_in
    template: mixture
    state:
      design:
        pressure: {value: 750, provenance: assumed, source: D-004}
        temperature: {value: 553.15, provenance: assumed, source: "D-004: heated reactor, outlet held at the inlet temperature"}
        flow: {value: 11191.0, provenance: calculated, source: 'cheme process propagate: reactor R101 from S7', fingerprint: 281c100c95cee1a9}
        composition: {basis: mole_fraction, values: {MTBE: 0.0513699, IB: 0.462329, MEOH: 0.476592, DME: 0.00462329, H2O: 0.00462329, DIB: 0.000462329}, provenance: calculated, source: 'cheme process propagate: reactor R101 from S7', fingerprint: e2ee12811e47defa}
  - id: S9
    title: Effluent after feed / effluent exchanger
    from: E101.hot_out
    to: E102.in
    template: mixture
    state:
      design:
        pressure: {value: 720, provenance: assumed, source: D-004}
