  - id: S13
    title: MTBE / methanol recycle
    from: C301.top
    to: M101.rec
    template: mixture
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: D-004}
        temperature: {value: 328.8, provenance: assumed, source: "scripts/ib_balance.py: ideal bubble point at 100 kPa(a) (D-006)"}
        flow: {value: 1306.5572, basis: mass, provenance: assumed, source: "scripts/ib_balance.py, C-301 split (D-007)"}
        composition: {basis: mole_fraction, values: {MTBE: 0.673337873, IB: 0.012132214, MEOH: 0.308463806, DIB: 0.006066107}, provenance: assumed, source: "scripts/ib_balance.py, C-301 split: 14 wt% methanol, near the MTBE / methanol azeotrope (D-007)"}
  - id: S14
    title: Methanol (C-301 bottoms)
    from: C301.bot
    to: M301.c301
    template: mixture
    state:
      design:
