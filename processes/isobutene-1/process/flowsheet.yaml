# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Isobutene by gas-phase MTBE cracking (D-001). Where the values come from:
# - all temperatures and pressures are design choices (design basis, D-004, D-007), ASSUMED;
# - the reactor outlet S8 is calculated by cheme (conversion reactor with the D-005
#   selectivities);
# - flows and compositions through mixers, splitters, the pump and the exchangers are
#   calculated by `cheme process propagate --fill`;
# - the fresh MTBE and make-up water flows, every column and wash outlet and all duties come
#   from the independent balance scripts/ib_balance.py (D-006), given here as ASSUMED: they
#   rest on specified component splits (D-007) and shortcut duties, because core cannot yet
#   qualify the polar, azeotropic MTBE / methanol / water / C4 system.
schema: cheme/process/v1
kind: flowsheet
title: Isobutene by MTBE cracking (50 kt/a, gas-phase cleavage)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 6.25 t/h isobutene, MTBE conversion 0.90 per pass at 553 K, unconverted MTBE recycled (D-002, D-004, D-005)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: MTBEF, title: Fresh MTBE (boundary feed from an MTBE unit or terminal), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: DMW, title: Demineralised make-up water (wash-water loop), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports: [{id: p101, direction: out, kind: energy}, {id: h101, direction: out, kind: energy}]
  - id: FUEL
    title: Fired heat from natural gas (superheater and reactor heating)
    category: utility
    utility:
      kind: fired_heat
      level: natural gas firing
      supply_temperature: {value: 900, provenance: assumed, source: "D-009: flue gas or hot-oil supply, a concept value"}
      min_approach: {value: 50, provenance: assumed, source: D-009}
    ports: [{id: h101, direction: out, kind: energy}, {id: r101, direction: out, kind: energy}]
  - id: MPS
    title: MP steam 1500 kPa(a)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1500, provenance: assumed, source: "design basis, D-009"}
      supply_temperature: {value: 471.4, provenance: assumed, source: "saturation at 1500 kPa(a), D-009"}
      min_approach: {value: 10, provenance: assumed, source: D-009}
    ports: [{id: c101, direction: out, kind: energy}]
  - id: LPS
    title: LP steam 450 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis, D-009"}
      supply_temperature: {value: 420.8, provenance: assumed, source: "saturation at 450 kPa(a), D-009"}
      min_approach: {value: 10, provenance: assumed, source: D-009}
    ports: [{id: c201, direction: out, kind: energy}, {id: c301, direction: out, kind: energy}, {id: c402, direction: out, kind: energy}, {id: c403, direction: out, kind: energy}]
products:
  - {id: IBP, title: High-purity isobutene to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: MEOHP, title: "Recovered methanol (co-product, back to MTBE synthesis or sale)", category: by_product, ports: [{id: in, direction: in}]}
  - {id: HEAVIES, title: Heavy ends (C8 and MTBE) to the site fuel oil system, category: by_product, ports: [{id: in, direction: in}]}
  - id: FUELGAS
    title: DME-rich vents to the site fuel gas header
    category: off_gas
    ports: [{id: c402, direction: in}, {id: c403, direction: in}]
  - {id: WW, title: Wash-water purge to the site wastewater treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-009"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-009"}
      min_approach: {value: 5, provenance: assumed, source: D-009}
    ports:
      - {id: c101, direction: in, kind: energy}
      - {id: e102, direction: in, kind: energy}
      - {id: c201, direction: in, kind: energy}
      - {id: c403, direction: in, kind: energy}
      - {id: e403, direction: in, kind: energy}
      - {id: c301, direction: in, kind: energy}
      - {id: c402, direction: in, kind: energy}
      - {id: e401, direction: in, kind: energy}
      - {id: e301, direction: in, kind: energy}

blocks:
  - id: RXN
    title: MTBE purification and cracking
    class: ReactingChemicals
    ports:
      - {id: mtbe, direction: in}
      - {id: rec, direction: in}
      - {id: heavies, direction: out}
      - {id: effluent, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: power2, direction: in, kind: energy}
      - {id: mps1, direction: in, kind: energy}
      - {id: fuel1, direction: in, kind: energy}
      - {id: fuel2, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
  - id: IBPUR
    title: Isobutene recovery, water wash and drying
    class: Distilling
    ports:
      - {id: feed, direction: in}
      - {id: water, direction: in}
      - {id: bottoms, direction: out}
      - {id: extract, direction: out}
      - {id: decant, direction: out}
      - {id: vent, direction: out}
      - {id: product, direction: out}
      - {id: lps4, direction: in, kind: energy}
      - {id: lps3, direction: in, kind: energy}
      - {id: cw3, direction: out, kind: energy}
      - {id: cw4, direction: out, kind: energy}
      - {id: cw5, direction: out, kind: energy}
  - id: MEOHREC
    title: Methanol recovery, MTBE recycle and wash-water loop
    class: Distilling
    ports:
      - {id: feed, direction: in}
      - {id: extract, direction: in}
      - {id: decant, direction: in}
      - {id: makeup, direction: in}
      - {id: rec, direction: out}
      - {id: wash, direction: out}
      - {id: vent, direction: out}
      - {id: purge, direction: out}
      - {id: methanol, direction: out}
      - {id: lps1, direction: in, kind: energy}
      - {id: lps2, direction: in, kind: energy}
      - {id: cw6, direction: out, kind: energy}
      - {id: cw7, direction: out, kind: energy}
      - {id: cw8, direction: out, kind: energy}
      - {id: cw9, direction: out, kind: energy}

steps:
  - id: M101
    block: RXN
    title: MTBE feed drum (fresh + recycle)
    class: Mixing
    symbol: VESSEL_DISHED_ENDS_SHAPE
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: fresh, direction: in, delegates: mtbe}
      - {id: rec, direction: in, delegates: rec}
      - {id: out, direction: out}
  - id: P101
    block: RXN
    title: MTBE feed pump (power of all pumps lumped here, D-009)
    class: GeneratingFlow
    links: [{target: equipment, ref: P-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  # D-007: all C8 to the bottoms with MTBE at 60 wt%; the vapour distillate feeds the reactor.
  - id: C101
    block: RXN
    title: MTBE column (heavy-ends removal, vapour overhead to the reactor)
    class: Distilling
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out}
      - {id: bot, direction: out, delegates: heavies}
      - {id: reb, direction: in, kind: energy, delegates: mps1}
      - {id: cond, direction: out, kind: energy, delegates: cw1}
  - id: E101
    block: RXN
    title: Feed / effluent exchanger
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: cold_in, direction: in}
      - {id: cold_out, direction: out}
      - {id: hot_in, direction: in}
      - {id: hot_out, direction: out}
  - id: H101
    block: RXN
    title: Feed superheater (fired / hot oil)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: H-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: fuel, direction: in, kind: energy, delegates: fuel1}
      - {id: aux, direction: in, kind: energy, delegates: power2}
  # D-004, D-005: heated multitubular reactor, 553 K outlet; MTBE conversion 0.90 per pass,
  # per kmol MTBE converted 0.010 kmol DME and 0.001 kmol C8 (isobutene 0.998).
  - id: R101
    block: RXN
    title: MTBE cracking reactor (gas phase, heated tubes)
    class: ReactingChemicals
    reactions: [CRACK, DMEF, DIM]
    reactor: conversion
    selectivity: {key: MTBE, conversion: 0.90, products: {DME: 0.010, DIB: 0.001}, provenance: assumed, source: "D-005: conversion inside the preferred 85-95 % of US 8,633,345 B2; DME and C8 per kmol MTBE converted ASSUMED, of the order of the patent's Example 2 effluent (Table 11)"}
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: fuel2}
  - id: E102
    block: RXN
    title: Effluent condenser
    class: Cooling
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: effluent}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  - id: C201
    block: IBPUR
    title: Isobutene column (cleavage products split)
    class: Distilling
    links: [{target: equipment, ref: C-201}]
    ports:
      - {id: feed, direction: in, delegates: feed}
      - {id: top, direction: out}
      - {id: bot, direction: out, delegates: bottoms}
      - {id: reb, direction: in, kind: energy, delegates: lps4}
      - {id: cond, direction: out, kind: energy, delegates: cw3}
  - id: C401
    block: IBPUR
    title: Methanol extraction with water (wash column)
    class: SeparatingByContact
    links: [{target: equipment, ref: C-401}]
    ports:
      - {id: feed, direction: in}
      - {id: water, direction: in, delegates: water}
      - {id: raf, direction: out}
      - {id: ext, direction: out, delegates: extract}
  - id: C403
    block: IBPUR
    title: Drying and DME column (isobutene product bottoms)
    class: Distilling
    links: [{target: equipment, ref: C-403}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out, delegates: vent}
      - {id: water, direction: out, delegates: decant}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: lps3}
      - {id: cond, direction: out, kind: energy, delegates: cw4}
  - id: E403
    block: IBPUR
    title: Isobutene product cooler
    class: Cooling
    links: [{target: equipment, ref: E-403}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: product}
      - {id: cw, direction: out, kind: energy, delegates: cw5}
  - id: C301
    block: MEOHREC
    title: Methanol column (MTBE / methanol azeotrope overhead to recycle)
    class: Distilling
    links: [{target: equipment, ref: C-301}]
    ports:
      - {id: feed, direction: in, delegates: feed}
      - {id: top, direction: out, delegates: rec}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: lps1}
      - {id: cond, direction: out, kind: energy, delegates: cw6}
  - id: C402
    block: MEOHREC
    title: Methanol / water column (extract regeneration)
    class: Distilling
    links: [{target: equipment, ref: C-402}]
    ports:
      - {id: feed, direction: in, delegates: extract}
      - {id: top, direction: out}
      - {id: vent, direction: out, delegates: vent}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: lps2}
      - {id: cond, direction: out, kind: energy, delegates: cw7}
  # D-007: 5 % of the regenerated water purged to keep the loop free of build-up.
  - id: SPL401
    block: MEOHREC
    title: Wash-water purge
    class: SplittingMaterial
    split: {purge: 0.05}
    ports:
      - {id: in, direction: in}
      - {id: purge, direction: out, delegates: purge}
      - {id: rec, direction: out}
  - id: E401
    block: MEOHREC
    title: Wash-water cooler
    class: Cooling
    links: [{target: equipment, ref: E-401}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw8}
  - id: M401
    block: MEOHREC
    title: Wash-water tank (recycle, decanted water, make-up)
    class: Mixing
    symbol: TANK_CONE_ROOF_SHAPE
    links: [{target: equipment, ref: T-401}]
    ports:
      - {id: rec, direction: in}
      - {id: dec, direction: in, delegates: decant}
      - {id: mu, direction: in, delegates: makeup}
      - {id: out, direction: out, delegates: wash}
  - id: M301
    block: MEOHREC
    title: Methanol product junction
    class: Mixing
    ports:
      - {id: c301, direction: in}
      - {id: c402, direction: in}
      - {id: out, direction: out}
  - id: E301
    block: MEOHREC
    title: Methanol product cooler
    class: Cooling
    links: [{target: equipment, ref: E-301}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: methanol}
      - {id: cw, direction: out, kind: energy, delegates: cw9}

streams:
  - id: S1
    title: Fresh MTBE
    from: MTBEF.out
    to: M101.fresh
    template: mixture
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: "design basis, D-003"}
        temperature: {value: 303.15, provenance: assumed, source: "design basis, D-003"}
        flow: {value: 9915.8919, basis: mass, provenance: assumed, source: "scripts/ib_balance.py: the fresh MTBE that gives 6250 kg/h isobutene product (D-002, D-006)"}
        composition: {basis: mole_fraction, values: {MTBE: 1.0}, provenance: assumed, source: "design basis, D-003: pure MTBE (technical-grade impurities not modelled)"}
  - id: S2
    title: MTBE column feed
    from: M101.out
    to: P101.in
    template: mixture
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: D-004}
        temperature: {value: 308.15, provenance: assumed, source: "D-004: fresh MTBE and recycle mixed"}
        flow: {value: 11222.4, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S13', fingerprint: bb00a896ce17fba0}
        composition: {basis: mole_fraction, values: {MTBE: 0.953851, IB: 0.00171399, MEOH: 0.0435784, DME: 0.0, H2O: 0.0, DIB: 0.000856993}, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S13', fingerprint: f1cea7b1e08be5e0}
  - id: S3
    title: Pumped MTBE column feed
    from: P101.out
    to: C101.feed
    template: mixture
    state:
      design:
        pressure: {value: 1100, provenance: assumed, source: D-004}
