  - id: S12
    title: C-201 bottoms (methanol, MTBE)
    from: C201.bot
    to: C301.feed
    template: mixture
    state:
      design:
        pressure: {value: 660, provenance: assumed, source: D-004}
        temperature: {value: 394.0, provenance: assumed, source: "scripts/ib_balance.py: ideal bubble point (D-006)"}
