- key: emission-excluded:adsorber-outlet
  title: storage-tank emissions of R-101, E-101, E-102, X-106, V-102, A-103, C-104, K-104, T-107
  direction: output
  reason: 'No P&ID yet: every vent of the train goes through E-102 and the activated-carbon adsorber X-106,
    whose outlet (the nitrogen with the iodomethane the carbon lets pass) goes to air; the balance gives
    all the iodomethane past E-102 (5.5 kg a batch, D-012) to the carbon; its breakthrough is not estimated
    (open for basic engineering).'
- key: emission-excluded:wash-liquor-stripping
  title: equipment-leaks emissions of V-102
  direction: output
  reason: The iodomethane dissolved in the wash liquors (about 0.88 % of the iodine fed, D-013) is not
    stripped in the balance; its fate in the wastewater treatment (volatilisation to air) is not estimated
    (D-008).
