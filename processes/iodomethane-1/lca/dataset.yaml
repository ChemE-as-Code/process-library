id: iodomethane-from-methanol-red-phosphorus-and-iodine-batch-reflux-reaction-and-batch-distillation-500-t-a
title: Iodomethane from methanol, red phosphorus and iodine, batch reflux reaction and batch distillation
  (500 t/a)
description: Unallocated foreground LCI of Iodomethane from methanol, red phosphorus and iodine, batch
  reflux reaction and batch distillation (500 t/a), case design, derived from the flowsheet by cheme assess
  lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Batch plant: red phosphorus slurried in methanol, iodine dosed over 10 h at 313 K under a
  reflux condenser, post-reaction to 0.995 conversion of the iodine, the crude distilled off the phosphorous
  acid residue in the same vessel into sodium thiosulfate solution, washed twice with thiosulfate and
  twice with water, dried over calcium chloride and a 4A sieve, distilled in a still with a short column;
  one product on a dedicated train'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
