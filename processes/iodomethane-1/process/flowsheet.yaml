# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Iodomethane from methanol, red phosphorus and iodine (DESIGN.md D-001), a batch plant after
# CN 114195616 B: methanol and red phosphorus are charged to R-101 and warmed to 313 K; the
# iodine is dosed into the slurry (a semi-batch, reactor: semibatch) at 313 K, the source's
# measured temperature at total reflux, under the reflux condenser E-101; the crude iodomethane is then
# distilled off the phosphorous acid residue in R-101 (a batch still) through E-101 into a sodium
# thiosulfate solution in V-102, washed with the thiosulfate and with water, dried over calcium
# chloride and a 4A molecular sieve (A-103) and distilled in C-104 (a batch still).
# The flows are the year averages of the batch recipe (process/recipe.yaml, `cheme process
# recipe`, D-003).
# Where the values come from:
# - feeds, temperatures, ratios: design basis and D-002..D-004, ASSUMED or from CN 114195616 B,
#   Example 1;
# - R101: cheme's semi-batch model (core ADR 0050) with a vent (ADR 0054: the iodomethane that
#   passes the vent condenser E-102), from the ASSUMED rate law, to 0.995 conversion of the iodine
#   (D-005);
# - ST101: cheme's batch (Rayleigh) still, one stage, a constant relative volatility (core ADR
#   0055, D-007); ST102: cheme's batch rectification, the still with its column K-104 (core ADR
#   0061, Diwekar's shortcut, 5 theoretical stages at a reflux ratio of 2, ASSUMED), Raoult's law
#   with NIST Antoine constants, the charge heated to its bubble point (`still.heat_up`, ADR 0063)
#   (D-010, D-016);
# - W101 (the thiosulfate's reduction of the iodine): a conversion step (D-008);
# - D102, D103 (the washes' phase splits) and X101 (the drying): specified splits in
#   scripts/balance.py (D-008, D-009); core has no liquid-liquid model with sourced pairs for
#   these liquids and no drying of a liquid over a desiccant;
# - M101 (mixer), H101, H102, H103, E101, E102, E104, E105 (pass-through): `cheme process
#   propagate --fill`;
# - the duties: R101's Q2 (the heat of its reaction less the iodine warmed, on its energy port q)
#   and ST101's net boil-up Q3 (its distillate's latent heat) are written by `cheme process
#   propagate --fill` from the models (core 1.9.0, ADR 0059), and so are ST102's reboiler Q8 (the
#   boil-up at the reflux and the charge's heat-up) and its condenser Q10 (core 1.10.0, ADRs 0061,
#   0063); the charge's warming Q1, ST101's heat-up Q4, the condensers and coolers Q5, Q6, Q7,
#   Q11, Q12 and Q14 come from scripts/balance.py (no property package of core covers these
#   liquids, D-011);
# - the feeds for 500 t/a, the wash liquids, the vent fraction and the temperatures of mixed
#   streams: scripts/balance.py (D-002, D-008, D-011, D-012).
schema: cheme/process/v1
kind: flowsheet
title: Iodomethane from methanol, red phosphorus and iodine, batch reflux reaction and batch distillation (500 t/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 500 t/a distilled iodomethane, year averages of the batch recipe in 7920 h (D-002, D-003)", default: true}
tolerance: {abs: 0.02, rel: 0.002}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: MEOH, title: Methanol (methanol-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: REDP, title: Red phosphorus (no library process), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: IOD, title: Iodine (iodine-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: THIO, title: Sodium thiosulfate solution (5 wt%; no library process), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PW, title: Process water (wash), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: v102, direction: out, kind: energy}
      - {id: c104, direction: out, kind: energy}
  - id: LPS
    title: LP steam 350 kPa(a) (to the hot-water loops)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 350, provenance: assumed, source: "design basis (D-011)"}
      supply_temperature: {value: 412.0, provenance: given, source: "saturation at 350 kPa(a), IAPWS-IF97 (411.5 K)"}
      min_approach: {value: 10, provenance: assumed, source: "D-011"}
    ports:
      - {id: h101, direction: out, kind: energy}
      - {id: st101, direction: out, kind: energy}
      - {id: st101_heatup, direction: out, kind: energy}
      - {id: st102, direction: out, kind: energy}
products:
  - {id: MEI, title: Iodomethane to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: RES, title: "Phosphorous acid residue (with methanol and red phosphorus) to treatment", category: by_product, ports: [{id: in, direction: in}]}
  - {id: RES2, title: Final still residue to hazardous-waste incineration, category: by_product, ports: [{id: in, direction: in}]}
  - {id: WW, title: Wash liquors (thiosulfate and water washes) to wastewater treatment, category: wastewater, ports: [{id: in1, direction: in}, {id: in2, direction: in}]}
  - {id: SPENT, title: Water taken up by the spent calcium chloride and sieve, category: solid_waste, ports: [{id: in, direction: in}]}
  - {id: VENT, title: Vent gas (nitrogen with iodomethane vapour) to the activated-carbon adsorber, category: off_gas, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis (D-011)"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis (D-011)"}
      min_approach: {value: 5, provenance: assumed, source: "D-011"}
    ports:
      - {id: e101, direction: in, kind: energy}
      - {id: h102, direction: in, kind: energy}
      - {id: k104, direction: in, kind: energy}
      - {id: e104, direction: in, kind: energy}
      - {id: h103, direction: in, kind: energy}
  - id: CHW
    title: Chilled water return (283 K)
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 278.15, provenance: assumed, source: "design basis (D-011)"}
      return_temperature: {value: 283.15, provenance: assumed, source: "design basis (D-011)"}
      min_approach: {value: 5, provenance: assumed, source: "D-011"}
    ports:
      - {id: r101, direction: in, kind: energy}
  - id: BRINE
    title: Chilled brine return (263 K)
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 258.15, provenance: assumed, source: "design basis (D-011)"}
      return_temperature: {value: 263.15, provenance: assumed, source: "design basis (D-011)"}
      min_approach: {value: 5, provenance: assumed, source: "D-011"}
    ports:
      - {id: e102, direction: in, kind: energy}
      - {id: e105, direction: in, kind: energy}

blocks:
  - id: REACT
    title: Semi-batch reaction under reflux and distillation of the crude off the residue (R-101, E-101)
    class: ReactingChemicals
    ports:
      - {id: meoh, direction: in}
      - {id: p, direction: in}
      - {id: iodine, direction: in}
      - {id: crude, direction: out}
      - {id: residue, direction: out}
      - {id: vent, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: still_steam, direction: in, kind: energy}
      - {id: still_heatup, direction: in, kind: energy}
      - {id: q, direction: out, kind: energy}
      - {id: q_cond, direction: out, kind: energy}
      - {id: q_res, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: WASH
    title: Thiosulfate and water washes (V-102)
    class: SeparatingByContact
    ports:
      - {id: crude, direction: in}
      - {id: thio, direction: in}
      - {id: water, direction: in}
      - {id: washed, direction: out}
      - {id: aq1, direction: out}
      - {id: aq2, direction: out}
      - {id: power, direction: in, kind: energy}
  - id: DRY
    title: Drying over calcium chloride and a 4A molecular sieve (A-103)
    class: Adsorbing
    ports:
      - {id: in, direction: in}
      - {id: dry, direction: out}
      - {id: water, direction: out}
  - id: PURIFY
    title: Batch distillation of the dried crude (C-104)
    class: Distilling
    ports:
      - {id: in, direction: in}
      - {id: product, direction: out}
      - {id: residue, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: q, direction: out, kind: energy}
      - {id: q_cool, direction: out, kind: energy}
      - {id: q_sub, direction: out, kind: energy}
      - {id: q_res, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: VENTS
    title: Vent condenser on brine (E-102)
    class: Cooling
    ports:
      - {id: gas, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy}

steps:
  - id: M101
    block: REACT
    title: Methanol and red phosphorus charged to R-101 (through the phosphorus tank)
    class: Mixing
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: meoh, direction: in, delegates: meoh}
      - {id: p, direction: in, delegates: p}
      - {id: out, direction: out}
  - id: H101
    block: REACT
    title: Charge warmed to 313 K (R-101 jacket, hot-water loop)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: steam}
  - id: R101
    block: REACT
    title: Reactor (iodine dosed into the methanol and red phosphorus at 313 K, under reflux)
    class: ReactingChemicals
    reactions: [MEI]
    reactor: semibatch
    # the semi-batch model's duty (its reaction's heat less the iodine warmed, ADR 0059) goes on
    # Q2, removed by R-101's jacket on chilled water (D-011)
    energy_port: q
    batch:
      dosing: [{stream: S5, time: 36000}]
      target: {key: I2, conversion: 0.995}
      heat: isothermal
      vent: {stream: S7, components: [MEI], fraction: {MEI: 0.003586}}
      provenance: assumed
      source: "the iodine dosed at a constant rate over 10 h (ASSUMED: CN 114195616 B gives no time for its first stage; the jacket on chilled water removes the model's peak, D-003), then the post-reaction to 0.995 conversion of the iodine (the patent reacts until the reflux runs colourless, D-005); isothermal at 313.15 K, the source's measured temperature at total reflux (Example 1: 39-40 C, D-005, D-006); 0.3586 % of the iodomethane formed leaves past the vent condenser E-102: the iodomethane the batch's wet nitrogen carries at 268 K (the work-up's blanket, which fills the head spaces its liquids displace, and the purge nitrogen R-101's rise displaces, each counted once), R-101's and the work-up's vents lumped on R101 (scripts/balance.py prints it, D-012)"
    hazard:
      mtt: 313.15
      vent_capacity: 20.0
      provenance: assumed
      source: "mtt: the measured temperature of the end mass at total reflux, CN 114195616 B, Example 1, stage 2 at total reflux at 39-40 C (Examples 2 and 3, with less methanol: 42-45 C): R101 runs at it, as the source does; the ideal-liquid bubble point of the end mass S6 (Raoult's law, scripts/balance.py) is 16 K higher (329.53 K): the ideal liquid leaves out the positive deviation that ST101's relative volatility of 6 represents, and a possible azeotrope with methanol (an open input, D-006, D-007); core's default, the lowest boiling point of the charge and the dose (methanol, 337.8 K; the vented iodomethane left out), lies 24.7 K above it (D-006, L-5). vent_capacity: ASSUMED design of R-101's vent line through E-101 and E-102 to the adsorber (D-006): the nitrogen purge of R-101 and the phosphorus tank, 5 Nm3 in 0.5 h (11.5 m3/h at 313 K), with room; against core's gas release at the MTSR (0.19 m3/h) and the vent's normal peak (0.10 m3/h, cheme process recipe); the iodomethane a cooling failure boils off at the MTT (84 to 172 m3/h) is for E-101 to condense, not for the vent: a design finding (D-006). No TD24 (never estimated)"
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: charge, direction: in}
      - {id: dose, direction: in, delegates: iodine}
      - {id: out, direction: out}
      - {id: gas, direction: out, delegates: vent}
      - {id: q, direction: out, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: ST101
    block: REACT
    title: Crude distilled off the phosphorous acid residue in R-101 (one stage, Rayleigh)
    class: Distilling
    energy_port: steam
    still:
      pressure: 101.325
      volatility: {model: constant, alpha: {MEOH: 1.0, MEI: 6.0, H2O: 0.25, I2: 0.009}, provenance: assumed, source: "constant relative volatilities to methanol, ASSUMED (D-007): iodomethane 6, about three times its ideal ratio (2.13 at 330 K, 1.70 at 350 K by the NIST Antoine constants), for its positive deviation from an ideal liquid in the polar residue of phosphorous acid and methanol (not measured); water and iodine at their ideal ratios at 340 K (0.25, 0.009); an ideal liquid (Raoult) would leave 13 % of the iodomethane in the residue at 353 K, which the source's 95-96 % yield rules out (L-2)"}
      nonvolatile: [H3PO3, P]
      boilup: {value: 14.36, unit: kW, provenance: assumed, source: "the net boil-up: the mean heat R-101's jacket gives on the hot-water loop (360.65 K mean), about 36 kW at the start (300 W/(m2 K) x 3.82 m2 x 31 K) and a few kW at the end, ASSUMED 15 kW, less the residue's sensible heat as its bubble point rises (Q4's second part), which the still does not hold (L-4): 15 kW x Q3 / (Q3 + that part), scripts/balance.py prints it; the distillation takes 8.55 h (the patent: 8-12 h) (D-007)"}
      end: {residue: {key: MEI, mole_fraction: 0.012}}
      outlets: {distillate: top, residue: bottom}
      provenance: assumed
      source: "distil until iodomethane is 1.2 mol% of the residue (ASSUMED), whose bubble point by Raoult's law is then 357.1 K, below the hot-water loop's 363.15 K supply, the patent's kettle limit of 90 C (D-007)"
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out}
      - {id: bottom, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: still_steam}
      - {id: heatup, direction: in, kind: energy, delegates: still_heatup}
  - id: E101
    block: REACT
    title: Overhead condenser of R-101 on cooling water (the crude to V-102)
    class: Cooling
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: crude}
      - {id: q, direction: out, kind: energy, delegates: q_cond}
  - id: H102
    block: REACT
    title: Residue cooled to 313 K in R-101 (jacket on cooling water)
    class: Cooling
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: residue}
      - {id: q, direction: out, kind: energy, delegates: q_res}
  - id: W101
    block: WASH
    title: Thiosulfate wash, twice (the iodine reduced; V-102)
    class: ReactingChemicals
    reactions: [THIO]
    reactor: conversion
    links: [{target: equipment, ref: V-102}]
    ports:
      - {id: crude, direction: in, delegates: crude}
      - {id: thio, direction: in, delegates: thio}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: D102
    block: WASH
    title: Phase split after the thiosulfate washes (specified split)
    class: SeparatingByGravity
    links: [{target: equipment, ref: V-102}]
    ports:
      - {id: in, direction: in}
      - {id: org, direction: out}
      - {id: aq, direction: out, delegates: aq1}
  - id: D103
    block: WASH
    title: Water wash, twice, and phase split (specified split)
    class: SeparatingByGravity
    links: [{target: equipment, ref: V-102}]
    ports:
      - {id: org, direction: in}
      - {id: water, direction: in, delegates: water}
      - {id: out, direction: out, delegates: washed}
      - {id: aq, direction: out, delegates: aq2}
  - id: X101
    block: DRY
    title: Drying over calcium chloride and the 4A sieve column (specified split)
    class: Adsorbing
    links: [{target: equipment, ref: A-103}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: dry, direction: out, delegates: dry}
      - {id: water, direction: out, delegates: water}
  - id: ST102
    block: PURIFY
    title: Batch rectification at 101 kPa(a) in C-104 with its column K-104 (5 theoretical stages, reflux ratio 2)
    class: Distilling
    # the reboiler's duty (the boil-up at the reflux and the charge's heat-up, ADRs 0061, 0063)
    # goes on Q8 and the total condenser's (the boil-up's latent heat) on Q10 (D-016)
    energy_port: steam
    still:
      pressure: 101.325
      volatility: {model: raoult, provenance: assumed, source: "ideal liquid, NIST WebBook Antoine constants (materials.yaml); ASSUMED (D-010)"}
      boilup: {value: 36, unit: kW, provenance: assumed, source: "the reboiler: C-104's jacket on the hot-water loop, about 300 W/(m2 K) x 3 m2 x 40 K, ASSUMED (D-010); (R + 1) = 3 moles boil up per mole distilled (core ADR 0061)"}
      column: {stages: 5, reflux: constant, ratio: 2, provenance: assumed, source: "K-104, a short packed column on C-104 (CN 114195616 B's 4A molecular sieve rectifying column, its height not given): 5 theoretical stages with the still, ASSUMED, at the reflux ratio 2 of the first version, ASSUMED (the patent gives none); Diwekar's shortcut on Fenske-Underwood-Gilliland, conservative against a rigorous column on an ideal liquid (core ADR 0061, D-016)"}
      heat_up: true
      condenser_port: condenser
      end: {residue: {key: MEI, mole_fraction: 0.5}}
      outlets: {distillate: top, residue: bottom}
      provenance: assumed
      source: "distil until iodomethane is 50 mol% of the residue (ASSUMED, unchanged from the one-stage still), the rest methanol and water (D-010, D-016)"
    links: [{target: equipment, ref: C-104}, {target: equipment, ref: K-104}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: top, direction: out}
      - {id: bottom, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: condenser, direction: out, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E104
    block: PURIFY
    title: Condensate cooled to 303 K in K-104's condenser (cooling water)
    class: Cooling
    links: [{target: equipment, ref: K-104}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: q_cool}
  - id: E105
    block: PURIFY
    title: Product subcooler on brine (to 283 K)
    class: Cooling
    links: [{target: equipment, ref: E-105}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: product}
      - {id: q, direction: out, kind: energy, delegates: q_sub}
  - id: H103
    block: PURIFY
    title: Final still residue cooled to 303 K (C-104 jacket)
    class: Cooling
    links: [{target: equipment, ref: C-104}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: residue}
      - {id: q, direction: out, kind: energy, delegates: q_res}
  - id: E102
    block: VENTS
    title: Vent condenser on brine (the iodomethane vapour of the vents returned)
    class: Cooling
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in, delegates: gas}
      - {id: out, direction: out, delegates: out}
      - {id: q, direction: out, kind: energy, delegates: q}

streams:
  - id: S1
    title: Methanol
    from: MEOH.out
    to: M101.meoh
    template: liquor
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "from storage (design basis)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 24.8675, provenance: assumed, source: "scripts/balance.py: the methanol at 3.319 mol per mol of iodine (CN 114195616 B, Example 1: 144 kg of 99.5 % methanol on 360 kg of 95 % iodine), with its water (D-004)"}
        composition: {basis: mass_fraction, values: {MEOH: 0.9995, H2O: 0.0005}, provenance: assumed, source: "methanol-1's product (0.999111 mol CH3OH, 0.000889 mol water: 500 ppm water by mass; D-004)"}
  - id: S2
    title: Red phosphorus
    from: REDP.out
    to: M101.p
    template: liquor
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "from storage (design basis)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 6.1512, provenance: assumed, source: "scripts/balance.py: red phosphorus at 0.8496 mol per mol of iodine (CN 114195616 B, Example 1: 36 kg of 98.5 % red phosphorus on 360 kg of 95 % iodine; 27 % above the 2/3 mol the reaction takes) (D-004)"}
        composition: {basis: mass_fraction, values: {P: 1.0}, provenance: assumed, source: "red phosphorus 100 % (the patent's 98.5 to 99 % grade; its impurities not modelled; D-004)"}
  - id: S3
    title: Methanol and red phosphorus slurry
    from: M101.out
    to: H101.in
    template: liquor
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "both at 298.15 K; a solid suspended in methanol adds no heat of mixing (D-011)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 31.0187, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S2', fingerprint: 2e90349374e850a4}
        composition: {basis: mole_fraction, values: {MEOH: 0.795605, P: 0.203688, I2: 0.0, MEI: 0.0, H3PO3: 0.0, H2O: 0.000707897}, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S2', fingerprint: d5c1eb75788d23e4}
  - id: S4
    title: Charge (313 K)
    from: H101.out
    to: R101.charge
    template: liquor
    state:
      design:
        temperature: {value: 313.15, provenance: assumed, source: "warmed to R101's temperature (D-005)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 31.0187, provenance: calculated, source: 'cheme process propagate: pass-through H101 from S3', fingerprint: fce4d7a0a95bc2f1}
        composition: {basis: mole_fraction, values: {MEOH: 0.795605, P: 0.203688, I2: 0.0, MEI: 0.0, H3PO3: 0.0, H2O: 0.000707897}, provenance: calculated, source: 'cheme process propagate: pass-through H101 from S3', fingerprint: fce4d7a0a95bc2f1}
  - id: S5
    title: Iodine (dosed)
    from: IOD.out
    to: R101.dose
    template: liquor
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "from the iodine store (D-004)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 59.4457, provenance: assumed, source: "scripts/balance.py: the iodine that makes 500 t/a of S25 (the balance is linear in the feeds; D-002, D-004)"}
        composition: {basis: mass_fraction, values: {I2: 0.998, H2O: 0.002}, provenance: assumed, source: "iodine-1's product (99.8 wt% I2, 0.2 wt% water; D-004)"}
  - id: S6
    title: Reaction mass
    from: R101.out
    to: ST101.in
    template: liquor
