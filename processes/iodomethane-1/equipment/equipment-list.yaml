# The equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes per batch from the recipe (D-003) and the models; design pressures, temperatures and
# materials are not set yet (basic engineering); materials named are usual choices for iodine,
# iodomethane and phosphorous acid, to be confirmed (open input). All values ASSUMED.
schema: cheme/equipment/v1
equipment:
  - {tag: R-101, type: StirredTankReactor, service: "Reactor and first still: methanol and red phosphorus charged, iodine dosed at 313 K under reflux, the crude iodomethane distilled off the phosphorous acid residue",
     notes: "1.6 m3 enamelled (glass-lined) steel (R10 preferred size, 72 % full with 1.15 m3 at the end of the dosing), as the recipe sizes it from R101's model (core ADR 0052); jacket 3.76 m2 at the charge on chilled water (log-mean equivalent 280.71 K) removes 36.6 kW against R101's peak 26.2 kW (cheme process recipe); warmed and distilled on a pressurised hot-water loop at 363.15/358.15 K, its supply at the patent's kettle limit of 90 C; iodine dosed over 10 h through a closed solids feeder with a nitrogen lock, interlocked with the temperature, the agitator running (speed or power; no restart on an accumulated dose, D-006 (g)), the jacket in cooling mode and the overhead condenser's cooling water; red phosphorus charged as a methanol slurry through an inerted phosphorus tank (CN 114195616 B: static ignition); overhead condenser E-101 for reflux and distillate; vent through E-101 and E-102 to the adsorber, sized for 20 m3/h (hazard.vent_capacity, D-006); open (D-006): a cooling failure boils off 82 m3/h of iodomethane vapour with the dosing stopped (169 m3/h if it goes on), for E-101 to condense; a relief device for the blocked vent and the patent's 120 kPa(a) pressure interlock to be assessed; kept dry (D-003, D-005, D-007)."}
  - {tag: E-101, type: HeatExchanger, service: "Overhead (reflux) condenser of R-101 on cooling water: the reflux during the reaction, the distillate to V-102",
     notes: "Graphite or glass-lined shell and tube (the patent uses graphite condensers); 5.7 kW year average, about 35 kW at the start of the distillation (R-101's jacket at 31 K driving force); ASSUMED design 55 kW: it is the evaporative barrier of R-101, which a jacket cooling failure loads with 25 kW (dose stopped) to 52 kW (dose going on) of iodomethane vapour (D-006); its cooling water independent of R-101's chilled water; condensate at 303 K."}
  - {tag: E-102, type: HeatExchanger, service: "Vent condenser on brine: iodomethane vapour of R-101, V-102, A-103, C-104 and the tanks returned",
     notes: "Brine at 258/263 K, gas out at 268 K (iodomethane 14.7 kPa there, 64.7 kPa at 303 K); 0.13 kW year average (D-012); to the activated-carbon adsorber X-106; brine flow and gas-outlet temperature alarms interlocked with the iodine dosing."}
  - {tag: V-102, type: Vessel, service: "Wash vessel: the crude received into sodium thiosulfate solution, two thiosulfate washes and two water washes, phase splits",
     notes: "About 2.5 m3 (one batch's 1.60 t of crude, 0.81 m3, received while R-101 distils it, with 0.32 t of thiosulfate solution and 0.64 t of water per batch; occupied 21.0 h of the 23.0 h cycle), enamelled or stainless steel with an agitator, a sight glass for the phase cut (iodomethane, 2.28 g/cm3, is the lower phase); nitrogen-blanketed, vented to E-102 (D-008)."}
  - {tag: A-103, type: Vessel, service: "Dryer: a calcium chloride bed and a 4A molecular sieve column for the washed crude",
     notes: "Calcium chloride bed (the patent: 40 kg for 360 kg of iodine) and a 4A sieve column, replaced when spent (lca.yaml consumables per batch); vented to E-102 (D-009)."}
  - {tag: C-104, type: Vessel, service: "Batch still for the dried crude, the residue cooled and drained",
     notes: "About 1.6 m3 (one batch's 1.48 t of dried crude, 0.65 m3, with room to boil), enamelled or stainless steel, jacket on the hot-water loop for a 36 kW reboiler (the net boil-up Q8 3.7 kW year average from the still's model, the reflux share Q13 7.3 kW, the heat-up Q9 0.2 kW, D-010, D-011); not sized by core (its still has no vessel, L-4)."}
  - {tag: K-104, type: Column, service: "Packed column on C-104 with a total condenser on cooling water, reflux ratio 2",
     notes: "Reflux ratio 2, stages to be set with VLE data (the patent: a 4A molecular sieve rectifying column); condenser on cooling water (iodomethane condenses at 316 K, 8 to 18 K above the cooling water); a specified split in the model, calibrated to the patent's 99.6 % (D-010)."}
  - {tag: E-105, type: HeatExchanger, service: "Product subcooler on brine (to 283 K)", notes: "0.31 kW year average; the product to storage at 10 C (the patent's condensers at 0-10 C) (D-010)."}
  - {tag: X-106, type: Vessel, service: "Activated-carbon adsorber on the vent gas after E-102", notes: "Takes the iodomethane that passes E-102 (5.5 kg a batch, D-012); the carbon replaced per batch (lca.yaml consumable) or regenerated; its outlet to atmosphere is an emission exclusion (lca.yaml)."}
  - {tag: T-107, type: Tank, service: "Iodomethane storage under nitrogen", notes: "Two batches, about 1.6 m3, nitrogen-blanketed, dark (iodomethane turns brown in light, HSDB), vented to E-102 (D-010)."}
