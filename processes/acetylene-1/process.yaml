# Process Atlas manifest of acetylene-1. Schema: schemas/process.schema.json (cheme-as-code/process/v1).
# plant.yaml stays the engineering manifest; sheets and results are derived from the
# ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: acetylene-1
title: Acetylene by partial oxidation of natural gas with NMP recovery (6.25 t/h, synthesis-gas co-product)
summary: >-
  Natural gas and oxygen, preheated to 600 C, react in a BASF-type burner; the cracked gas is
  water-quenched, freed of soot, compressed and washed with N-methylpyrrolidone, which yields
  99.5 % acetylene and leaves a hydrogen-rich synthesis gas as co-product. Concept stage, assumed
  basis, preliminary gate-to-gate LCI.
description: |
  Natural gas (98 % methane) and 99.5 % oxygen are preheated separately to 873 K in a fired
  heater, premixed and burnt in a BASF (Sachsse-Bartholome) burner at an O2/natural-gas ratio
  of 0.60 (vol); the flame reaches about 1970 K and is quenched with water to 353 K. A cooling
  column and a wet electrostatic precipitator remove the soot; the quench water runs in a closed
  circuit with vacuum degassing (the dissolved hydrocarbons go to the fired heater), soot
  separation and a purge. The cracked gas (7.5 % acetylene) is compressed to 11 bar(a) and
  washed with NMP; a degasser recycles the co-absorbed gases to the compressor, the acetylene
  stripper delivers the product and a hot stripper removes the higher acetylenes and water,
  which are burnt in the fired heater. The unabsorbed gas is synthesis gas (H2/CO 2.15).

  The burner is a sourced outlet-composition model (the typical cracked gas of US8975460B2 and
  the soot ratio of US5824834A), not kinetics; the O2/natural-gas ratio and the 1970 K flame
  follow from the element and energy balances and agree with the patents. Separators, the
  NMP section and the duties come from an independent script (scripts/balance.py) because no
  property package of core covers soot, the quench water or NMP. See DESIGN.md for every
  assumption and gated step.
families: [olefins, syngas]
keywords: [acetylene, ethyne, partial oxidation, Sachsse-Bartholome, BASF process, natural gas, oxygen, quench, soot, carbon black, N-methylpyrrolidone, NMP, absorption, synthesis gas, diacetylene]
facets:
  feedstock_basis: [fossil, atmospheric, electricity]
  product_classes: [chemicals, industrial-gases]
  unit_operations: [reaction, quench, compression, absorption, stripping]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, feeds, recovery splits
# and utility allowances are assumed (DESIGN.md D-002..D-012).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD with closed mass, component and element balances (cheme validate, cheme process
    streams: every block and step ok). The burner R101 and the fired heater F101 are calculated
    by cheme (conversion model); the burner's conversions are fixed by a published cracked-gas
    composition and soot ratio, and the resulting O2/natural-gas ratio (0.602) and adiabatic
    flame temperature (1970 K, from scripts/balance.py) agree with US5824834A (0.58-0.75) and
    US8975460B2 (about 1700 C). The quench-water purge (2.72 kg/kg acetylene) matches the
    process water of US5824834A comparative example 2 (2.67 m3/t). Core cannot evaluate the
    burner energy balance (no data for soot; C4H2/C6H6 fitted to 1000 K only) nor the quench,
    the circuit water or the NMP section (core #315); their values are specified from
    scripts/balance.py. Core's fired-heater duty (25.8 MW to a 433 K stack) is consistent with
    the 23.0 MW used plus 10 % casing loss. Capacity, natural-gas and oxygen purity, NMP splits
    and loss, compression pressure and utility allowances are assumed. Preliminary gate-to-gate
    LCI with every background unmapped (gaps). Not reviewed. Main products and feeds are listed
    under chemistry with their chemicals registry entries (issue #251).
chemistry:
  # natural gas is taken as methane; soot (carbon black) has no registry entry yet (D-014)
  inputs:
    - {chemical: methane, role: feedstock, note: "feed:NG: pipeline natural gas to the partial oxidation, taken as methane, 1.28 kg/kg acetylene (unallocated)"}
    - {chemical: methane, role: feedstock, note: "feed:FUELNG: natural-gas support fuel of the fired preheater, taken as methane"}
    - {chemical: n-methyl-2-pyrrolidone, role: feedstock, note: "feed:NMP: NMP solvent make-up, 0.54 g/kg"}
    - {chemical: oxygen, role: feedstock, inventory_key: "feed:OXY", note: "99.5 mol% O2 by pipeline from an air separation unit (e.g. asu-1), 5.58 kg/kg acetylene (unallocated)"}
    - {chemical: air, role: feedstock, inventory_key: "feed:AIR", note: "Combustion air of the fired preheater, 5.32 kg/kg acetylene"}
  outputs:
    - {chemical: acetylene, role: main-product, inventory_key: "product:ACETYLENE", note: "Acetylene gas (99.55 mol%, 1.2 bar(a)) to the consumers"}
    - {chemical: synthesis-gas, role: co-product, inventory_key: "product:SYNGAS", note: "Synthesis gas (H2/CO) to the consumers, 5.76 kg/kg acetylene"}
    - {chemical: carbon-dioxide, role: emission, inventory_key: "emission:CO2", note: "1.19 kg/kg acetylene (unallocated), fossil, from burning the plant's off-gas and support fuel in the fired preheater"}
    - {chemical: wastewater, role: waste, inventory_key: "product:WW", note: "Quench-water purge, 2.70 kg/kg acetylene, after vacuum degassing; the soot sludge (product:SLUDGE, 0.46 kg/kg, 10 wt% carbon) and the NMP residue (product:RESIDUE) go to incineration"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "1.52 kWh/kg acetylene (unallocated): cracked-gas compressor 8.8 MW, pumps, ESP, vacuum pump, air fan"}
    - {chemical: steam, role: utility, inventory_key: "feed:STEAM", note: "MP steam 12 bar(a), 1.10 kWh/kg acetylene: acetylene stripper and hot-stripper reboiler"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "17.7 kWh/kg acetylene, 82 % of it the quench heat removed from the circulating water (25/35 C, ASSUMED)"}
basis:
  capacity: "6250 kg/h acetylene (50 kt/a at 8000 h), ASSUMED; 36.2 t/h synthesis gas co-product"
  operating_hours_per_year: 8000
  location: generic (not chosen)
