# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Acetylene by partial oxidation of natural gas with oxygen (BASF / Sachsse-Bartholome type):
# separate preheating of natural gas and oxygen in a fired heater, burner with water quench,
# cooling column and wet electrostatic precipitator for the soot, a closed quench-water circuit
# with vacuum degassing and soot separation, three-stage compression, acetylene recovery with
# N-methylpyrrolidone (absorber, degasser with gas recycle, acetylene stripper, hot stripper for
# the higher acetylenes), synthesis gas as co-product (DESIGN.md D-001). Where values come from:
# - feeds, temperatures, pressures, splits and duties: design basis and decisions D-002..D-012,
#   ASSUMED, with the ranges and data of the open sources named there;
# - the burner R101 and the fired heater F101 (conversion models), the mixers, the splitter
#   SP101 and the pass-through steps are solved by `cheme process propagate --fill`;
# - the separator outlets (quench, cooling column, ESP, flash, soot separator, knock-out drum,
#   absorber, degasser, strippers), the exchanger E301 and every duty come from the independent
#   balance scripts/balance.py, given here as ASSUMED: core has no property package for the
#   cracked gas with soot, the quench water or the NMP solvent (core #315).
schema: cheme/process/v1
kind: flowsheet
title: Acetylene by partial oxidation of natural gas with NMP recovery (6.25 t/h acetylene, synthesis-gas co-product)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 6250 kg/h acetylene (50 kt/a at 8000 h) from natural gas and 99.5 % oxygen, cracked gas of US8975460B2 (D-002, D-005)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: NG, title: Natural gas (pipeline), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: OXY, title: "Oxygen 99.5 mol% (air separation unit, e.g. asu-1)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: FUELNG, title: Natural-gas support fuel, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AIR, title: Combustion air, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NMP, title: NMP make-up, category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: k201, direction: out, kind: energy}
      - {id: t301, direction: out, kind: energy}
      - {id: sp101, direction: out, kind: energy}
      - {id: x101, direction: out, kind: energy}
      - {id: v102, direction: out, kind: energy}
      - {id: k401, direction: out, kind: energy}
  - id: STEAM
    title: MP steam 1200 kPa(a)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1200.0, provenance: assumed, source: "design basis, D-012"}
      supply_temperature: {value: 461.1, provenance: assumed, source: "saturation at 1200 kPa(a) (IAPWS-IF97), D-012"}
    ports:
      - {id: t303, direction: out, kind: energy}
      - {id: t304, direction: out, kind: energy}
products:
  - {id: ACETYLENE, title: Acetylene to the consumers (1.2 bar(a)), category: product, ports: [{id: in, direction: in}]}
  - {id: SYNGAS, title: Synthesis gas (H2/CO) to the consumers, category: by_product, ports: [{id: in, direction: in}]}
  - {id: WW, title: Quench-water purge to wastewater treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - {id: SLUDGE, title: Soot sludge to incineration, category: solid_waste, ports: [{id: in, direction: in}]}
  - {id: RESIDUE, title: Solvent regeneration residue to incineration, category: solid_waste, ports: [{id: in, direction: in}]}
  - {id: STACK, title: Fired-heater flue gas to stack, category: off_gas, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis"}
      min_approach: {value: 5, provenance: assumed, source: "design basis"}
    ports:
      - {id: e101, direction: in, kind: energy}
      - {id: k201, direction: in, kind: energy}
      - {id: e201, direction: in, kind: energy}
      - {id: e302, direction: in, kind: energy}

blocks:
  - id: PRE
    title: Feed preheating and off-gas firing
    class: ExchangingThermalEnergy
    ports:
      - {id: ng, direction: in}
      - {id: oxy, direction: in}
      - {id: offgas, direction: in}
      - {id: flash, direction: in}
      - {id: fuel, direction: in}
      - {id: air, direction: in}
      - {id: ng_hot, direction: out}
      - {id: oxy_hot, direction: out}
      - {id: flue, direction: out}
      - {id: heat, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: REACT
    title: Partial oxidation burner and water quench
    class: ReactingChemicals
    ports:
      - {id: ng, direction: in}
      - {id: oxy, direction: in}
      - {id: qw, direction: in}
      - {id: gas, direction: out}
      - {id: water, direction: out}
  - id: SOOT
    title: Cracked-gas cooling, soot removal and water circuit
    class: SeparatingMechanically
    ports:
      - {id: gas, direction: in}
      - {id: water, direction: in}
      - {id: cond, direction: in}
      - {id: qw, direction: out}
      - {id: gas_out, direction: out}
      - {id: flash, direction: out}
      - {id: sludge, direction: out}
      - {id: purge, direction: out}
      - {id: p_pump, direction: in, kind: energy}
      - {id: p_esp, direction: in, kind: energy}
      - {id: p_vac, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: COMP
    title: Cracked-gas compression
    class: Compressing
    ports:
      - {id: gas, direction: in}
      - {id: rec, direction: in}
      - {id: gas_out, direction: out}
      - {id: cond, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
  - id: REC
    title: Acetylene recovery with NMP
    class: Absorbing
    ports:
      - {id: gas, direction: in}
      - {id: mu, direction: in}
      - {id: syngas, direction: out}
      - {id: product, direction: out}
      - {id: rec, direction: out}
      - {id: offgas, direction: out}
      - {id: residue, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: steam1, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: heat, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}

steps:
  # --- PRE ---------------------------------------------------------------------------------
  - id: H101
    block: PRE
    title: Natural-gas preheater coil (fired)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: H-101}]
    ports:
      - {id: in, direction: in, delegates: ng}
      - {id: out, direction: out, delegates: ng_hot}
      - {id: q, direction: in, kind: energy}
  - id: H102
    block: PRE
    title: Oxygen preheater coil (fired)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: H-101}]
    ports:
      - {id: in, direction: in, delegates: oxy}
      - {id: out, direction: out, delegates: oxy_hot}
      - {id: q, direction: in, kind: energy}
  - id: M401
    block: PRE
    title: Fuel-gas mixer
    class: Mixing
    links: [{target: equipment, ref: H-101}]
    ports:
      - {id: offgas, direction: in, delegates: offgas}
      - {id: flash, direction: in, delegates: flash}
      - {id: ng, direction: in, delegates: fuel}
      - {id: out, direction: out}
  - id: K401
    block: PRE
    title: Combustion air fan
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-401}]
    ports:
      - {id: in, direction: in, delegates: air}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: F101
    block: PRE
    title: Fired-heater firebox (off-gas, flash gas and support fuel)
    class: ReactingChemicals
    reactions: [FB_CH4, FB_C2H2, FB_C4H2, FB_C6H6, FB_CO, FB_NMP]
    reactor: conversion
    links: [{target: equipment, ref: H-101}]
    ports:
      - {id: fuel, direction: in}
      - {id: air, direction: in}
      - {id: out, direction: out, delegates: flue}
      - {id: h101, direction: out, kind: energy}
      - {id: h102, direction: out, kind: energy}
      - {id: steam, direction: out, kind: energy, delegates: heat}
  # --- REACT -------------------------------------------------------------------------------
  - id: M101
    block: REACT
    title: Mixing diffuser (natural gas and oxygen)
    class: Mixing
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: ng, direction: in, delegates: ng}
      - {id: oxy, direction: in, delegates: oxy}
      - {id: out, direction: out}
  - id: R101
    block: REACT
    title: Burner (partial oxidation and pyrolysis)
    class: ReactingChemicals
    reactions: [C2H2_PYR, CH4_POX, CH4_COMB, H2_COMB, SOOT, C4H2_FORM, C6H6_FORM]
    reactor: conversion
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: Q101
    block: REACT
    title: Water quench
    class: Cooling
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: gas_in, direction: in}
      - {id: water_in, direction: in, delegates: qw}
      - {id: gas_out, direction: out, delegates: gas}
      - {id: water_out, direction: out, delegates: water}
  # --- SOOT --------------------------------------------------------------------------------
  - id: T101
    block: SOOT
    title: Cooling column (direct water contact)
    class: Cooling
    links: [{target: equipment, ref: T-101}]
    ports:
      - {id: gas_in, direction: in, delegates: gas}
      - {id: water_in, direction: in}
      - {id: gas_out, direction: out}
      - {id: water_out, direction: out}
  - id: X101
    block: SOOT
    title: Wet electrostatic precipitator
    class: SeparatingMechanically
    links: [{target: equipment, ref: X-101}]
    ports:
      - {id: gas_in, direction: in}
      - {id: water_in, direction: in}
      - {id: gas_out, direction: out, delegates: gas_out}
      - {id: drain, direction: out}
      - {id: power, direction: in, kind: energy, delegates: p_esp}
  - id: M102
    block: SOOT
    title: Circuit-water collection
    class: Mixing
    links: [{target: equipment, ref: V-102}]
    ports:
      - {id: q, direction: in, delegates: water}
      - {id: c, direction: in}
      - {id: e, direction: in}
      - {id: k, direction: in, delegates: cond}
      - {id: out, direction: out}
  - id: V102
    block: SOOT
    title: Vacuum degassing of the circuit water (400 mbar(a))
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-102}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out, delegates: flash}
      - {id: water, direction: out}
      - {id: power, direction: in, kind: energy, delegates: p_vac}
  - id: V101
    block: SOOT
    title: Soot separator (flotation and thickening)
    class: SeparatingMechanically
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: in, direction: in}
      - {id: sludge, direction: out, delegates: sludge}
      - {id: water, direction: out}
  - id: E101
    block: SOOT
    title: Circuit-water cooler
    class: Cooling
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: cw}
  - id: SP101
    block: SOOT
    title: Circuit-water distribution and purge
    class: SplittingMaterial
    split: {w1: 0.673661834, w2: 0.310463538, w10: 0.005880211, purge: 0.009994417}
    links: [{target: equipment, ref: P-101}]
    ports:
      - {id: in, direction: in}
      - {id: w1, direction: out, delegates: qw}
      - {id: w2, direction: out}
      - {id: w10, direction: out}
      - {id: purge, direction: out, delegates: purge}
      - {id: power, direction: in, kind: energy, delegates: p_pump}
  # --- COMP --------------------------------------------------------------------------------
  - id: M201
    block: COMP
    title: Compressor suction (cracked gas and recycle gas)
    class: Mixing
    links: [{target: equipment, ref: K-201}]
    ports:
      - {id: gas, direction: in, delegates: gas}
      - {id: rec, direction: in, delegates: rec}
      - {id: out, direction: out}
  - id: K201
    block: COMP
    title: Cracked-gas compressor (three stages, intercooled)
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: E201
    block: COMP
    title: Compressor aftercooler
    class: Cooling
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: cw2}
  - id: V201
    block: COMP
    title: Knock-out drum
    class: SeparatingByPhaseSeparation
    links: [{target: equipment, ref: V-201}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out, delegates: gas_out}
      - {id: liquid, direction: out, delegates: cond}
  # --- REC ---------------------------------------------------------------------------------
  - id: T301
    block: REC
    title: Absorber (NMP pre-wash and main wash)
    class: Absorbing
    links: [{target: equipment, ref: T-301}]
    ports:
      - {id: gas_in, direction: in, delegates: gas}
      - {id: liq_in, direction: in}
      - {id: gas_out, direction: out, delegates: syngas}
      - {id: liq_out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: T302
    block: REC
    title: Degasser (pressure let-down, recycle gas)
    class: SeparatingByFlash
    links: [{target: equipment, ref: T-302}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out, delegates: rec}
      - {id: liq, direction: out}
  - id: E301
    block: REC
    title: Lean/rich solvent interchanger
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-301}]
    ports:
      - {id: rich_in, direction: in}
      - {id: rich_out, direction: out}
      - {id: lean_in, direction: in}
      - {id: lean_out, direction: out}
  - id: T303
    block: REC
    title: Acetylene stripper
    class: SeparatingByThermalProcess
    links: [{target: equipment, ref: T-303}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out, delegates: product}
      - {id: liq, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam1}
  - id: T304
    block: REC
    title: Hot stripper (higher acetylenes, water, solvent regeneration)
    class: SeparatingByThermalProcess
    links: [{target: equipment, ref: T-304}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out, delegates: offgas}
      - {id: liq, direction: out}
      - {id: residue, direction: out, delegates: residue}
      - {id: steam, direction: in, kind: energy, delegates: steam2}
      - {id: fired, direction: in, kind: energy, delegates: heat}
  - id: E302
    block: REC
    title: Lean solvent cooler
    class: Cooling
    links: [{target: equipment, ref: E-302}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: cw}
  - id: M301
    block: REC
    title: NMP make-up
    class: Mixing
    links: [{target: equipment, ref: P-301}]
    ports:
      - {id: lean, direction: in}
      - {id: mu, direction: in, delegates: mu}
      - {id: out, direction: out}

streams:
  # --- feeds and preheating ------------------------------------------------------------------
  - {id: S1, title: Natural gas feed, from: NG.out, to: H101.in, template: ng, state: {design: {pressure: {value: 400.0, provenance: assumed, source: "battery limit (D-003)"}, temperature: {value: 303.15, provenance: assumed, source: "battery limit (D-003)"}, phase: {value: vapor, provenance: assumed, source: "gas"}, flow: {value: 29747.083, basis: mass, provenance: assumed, source: "scripts/balance.py: methane for the D-005 cracked gas by element balance"}, composition: {basis: mole_fraction, values: {CH4: 0.98, CO2: 0.005, N2: 0.015}, provenance: assumed, source: "D-003: lean pipeline gas, ASSUMED"}}}}
  - {id: S3, title: Oxygen feed, from: OXY.out, to: H102.in, template: oxygen, state: {design: {pressure: {value: 400.0, provenance: assumed, source: "battery limit (D-003)"}, temperature: {value: 303.15, provenance: assumed, source: "battery limit (D-003)"}, phase: {value: vapor, provenance: assumed, source: "gas"}, flow: {value: 35047.962, basis: mass, provenance: assumed, source: "scripts/balance.py: oxygen for the D-005 cracked gas by element balance (O2/NG 0.602 vol/vol)"}, composition: {basis: mole_fraction, values: {O2: 0.995, AR: 0.005}, provenance: assumed, source: "D-003: 99.5 mol% O2, rest Ar, ASSUMED"}}}}
  - id: S2
    title: Preheated natural gas
    from: H101.out
    to: M101.ng
    template: ng
    state:
      design:
        pressure: {value: 160.0, provenance: assumed, source: "D-010"}
        temperature: {value: 873.15, provenance: assumed, source: "D-004: 600 C (US5824834A examples; US8975460B2; US11459281B2)"}
        phase: {value: vapor, provenance: assumed, source: "gas"}
        flow: {value: 29747.083, basis: mass, provenance: assumed, source: "= S1 (heating only)"}
        composition: {basis: mole_fraction, values: {CH4: 0.98, CO2: 0.005, N2: 0.015}, provenance: assumed, source: "= S1"}
  - id: S4
    title: Preheated oxygen
    from: H102.out
    to: M101.oxy
    template: oxygen
    state:
      design:
        pressure: {value: 160.0, provenance: assumed, source: "D-010"}
        temperature: {value: 873.15, provenance: assumed, source: "D-004: 600 C (US5824834A examples)"}
        phase: {value: vapor, provenance: assumed, source: "gas"}
        flow: {value: 35047.962, basis: mass, provenance: assumed, source: "= S3 (heating only)"}
        composition: {basis: mole_fraction, values: {O2: 0.995, AR: 0.005}, provenance: assumed, source: "= S3"}
  # --- burner and quench ---------------------------------------------------------------------
  - id: S5
    title: Mixed feed to the burner
    from: M101.out
    to: R101.in
    template: crackedgas
    state:
      design:
        pressure: {value: 150.0, provenance: assumed, source: "D-010"}
        temperature: {value: 873.15, provenance: assumed, source: "D-004"}
        phase: {value: vapor, provenance: assumed, source: "gas"}
        flow: {value: 64795.0, provenance: calculated, source: 'cheme process propagate: mixer M101 from S2 S4', fingerprint: 82ba23c5a2bb4f2f}
        composition: {basis: mole_fraction, values: {CH4: 0.611845, CO2: 0.00312166, N2: 0.00936497, O2: 0.37379, AR: 0.00187834}, provenance: calculated, source: 'cheme process propagate: mixer M101 from S2 S4', fingerprint: 22fb79cdb0ce652f}
  - id: S6
    title: Hot cracked gas
    from: R101.out
    to: Q101.gas_in
    template: crackedgas
    state:
      design:
        pressure: {value: 130.0, provenance: assumed, source: "D-010"}
        temperature: {value: 1969.84, provenance: assumed, source: "scripts/balance.py: adiabatic temperature on ideal-gas data, soot as graphite (D-005); US8975460B2: about 1700 C"}
        flow: {value: 64795.0, provenance: calculated, source: 'cheme process propagate: reactor R101 from S5', fingerprint: 8bb1c11f414b69b1}
        composition: {basis: mole_fraction, values: {CH4: 0.037075, C2H2: 0.055612, H2: 0.415236, CO: 0.192788, CO2: 0.0259522, H2O: 0.252266, N2: 0.0061923, AR: 0.00124199, O2: 0.000742262, C4H2: 0.00519045, C6H6: 0.00222448, NMP: 0.0, C: 0.00547994}, provenance: calculated, source: 'cheme process propagate: reactor R101 from S5', fingerprint: 681dca750093f07c}
  - {id: S7, title: Quenched cracked gas, from: Q101.gas_out, to: T101.gas_in, template: crackedgas, state: {design: {pressure: {value: 120.0, provenance: assumed, source: "D-010"}, temperature: {value: 353.15, provenance: assumed, source: "US11459281B2 claim 1: quench to 80-90 C"}, flow: {value: 82927.271, basis: mass, provenance: assumed, source: "scripts/balance.py: saturated at 353 K (NIST Antoine), 70 % of the soot to the quench water (D-006)"}, composition: {basis: mole_fraction, values: {C2H2: 0.0450657, H2: 0.338293, CO: 0.157032, CO2: 0.0211433, CH4: 0.0301932, C4H2: 0.00422866, C6H6: 0.00181026, N2: 0.00504487, AR: 0.00101186, O2: 0.000604715, H2O: 0.394233, C: 0.00133935}, provenance: assumed, source: "scripts/balance.py (D-006)"}}}}
  - {id: W3, title: Quench water with soot, from: Q101.water_out, to: M102.q, template: water, state: {design: {pressure: {value: 120.0, provenance: assumed, source: "D-010"}, temperature: {value: 353.15, provenance: assumed, source: "D-006"}, phase: {value: liquid, provenance: assumed, source: "water with suspended soot"}, flow: {value: 1127509.246, basis: mass, provenance: assumed, source: "scripts/balance.py: quench water less evaporation, soot and dissolved hydrocarbons (D-006)"}, composition: {basis: mole_fraction, values: {H2O: 0.999705, C: 0.000269891, C2H2: 2.09502e-05, CO: 2.80657e-06, CH4: 1.0061e-06, C6H6: 1.7602e-07}, provenance: assumed, source: "scripts/balance.py (D-006)"}}}}
