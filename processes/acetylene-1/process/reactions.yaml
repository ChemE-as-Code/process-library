    reversible: false
    conversion: {key: C4H2, value: 0.9995, provenance: assumed, source: "D-011, ASSUMED"}
    heat_of_reaction: {value: -2276088.0, provenance: calculated, source: "ideal-gas formation enthalpies of materials.yaml, 298.15 K"}
  - id: FB_C6H6
    equation: C6H6 + 15/2 O2 -> 6 CO2 + 3 H2O
    stoichiometry: {C6H6: -1.0, O2: -7.5, CO2: 6.0, H2O: 3.0}
    reversible: false
    conversion: {key: C6H6, value: 0.9995, provenance: assumed, source: "D-011, ASSUMED"}
    heat_of_reaction: {value: -3169490.0, provenance: calculated, source: "ideal-gas formation enthalpies of materials.yaml, 298.15 K"}
  - id: FB_CO
    equation: CO + 1/2 O2 -> CO2
    stoichiometry: {CO: -1.0, O2: -0.5, CO2: 1.0}
    reversible: false
    conversion: {key: CO, value: 0.9995, provenance: assumed, source: "D-011, ASSUMED"}
    heat_of_reaction: {value: -282949.0, provenance: calculated, source: "ideal-gas formation enthalpies of materials.yaml (ATcT), 298.15 K"}
  - id: FB_NMP
    equation: C5H9NO + 27/4 O2 -> 5 CO2 + 9/2 H2O + 1/2 N2
    stoichiometry: {NMP: -1.0, O2: -6.75, CO2: 5.0, H2O: 4.5, N2: 0.5}
    reversible: false
    conversion: {key: NMP, value: 0.9995, provenance: assumed, source: "D-011, ASSUMED; fuel nitrogen to N2 (NOx not estimated)"}
