templates:
  - {id: ng, title: Natural gas, components: [CH4, CO2, N2]}
  - {id: oxygen, title: Oxygen, components: [O2, AR]}
  - {id: air, title: Dry air, components: [N2, O2, AR]}
  - {id: crackedgas, title: "Cracked gas, synthesis gas, acetylene and off-gases", components: [CH4, C2H2, H2, CO, CO2, H2O, N2, AR, O2, C4H2, C6H6, NMP, C]}
  - {id: water, title: Quench and process water with soot and dissolved hydrocarbons, components: [H2O, C, C2H2, CO, CH4, C6H6]}
  - {id: solvent, title: NMP solvent with dissolved gases, components: [NMP, H2O, C2H2, H2, CO, CO2, CH4, C4H2, C6H6, N2, AR, O2]}
