  - {id: flue, title: Fired-heater flue gas, components: [N2, O2, AR, CO2, H2O, CO, CH4, C2H2, C4H2, C6H6, NMP]}
# No benchmarked property package covers the cracked gas with acetylene, soot or NMP (cheme
# process props --coverage). Values are assumed from scripts/balance.py with source.
property_method:
  adapter: thermo
  status: placeholder
