# Components and templates of acetylene-1. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
#
# Gas data printed by `cheme chemistry thermo` (chemicals/thermo packages: ATcT, CRC, Yaws,
# Poling 5th ed.); fitted to 2000 K where thermo covers it (the burner runs at about 1970 K),
# otherwise to 1000 K. Higher acetylenes are lumped as diacetylene (C4H2) and aromatics as
# benzene (C6H6) (DESIGN.md D-005). Soot is a solid pseudo-component (carbon) without
# ideal-gas data: no property package of core covers it, so the burner energy balance is
# computed in scripts/balance.py with graphite (D-005). NMP is the absorption solvent; no
# benchmarked property package covers it either (D-009).
schema: cheme/process/v1
kind: materials
components:
