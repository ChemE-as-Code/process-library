# Simulation settings. Schema: `cheme schema process-simulation`.
# Not run: no property package of the DWSIM route is qualified for the cracked gas with soot,
# the quench water or the NMP solvent (DESIGN.md D-005, D-009).
# This file only records the energy mode of the burner and of the direct-contact coolers
# (D-005, D-006): the burner R101 is adiabatic (its outlet temperature, 1970 K, is the adiabatic
# temperature of scripts/balance.py on ideal-gas data with soot as graphite); the water quench
# Q101 and the cooling column T101 exchange heat only with the circulating water, whose heat
# leaves through the circuit-water cooler E101 (Q30) to cooling water.
schema: cheme/simulation/v1
kind: simulation
specs:
  R101: {mode: adiabatic}
  Q101: {mode: adiabatic}
  T101: {mode: adiabatic}
