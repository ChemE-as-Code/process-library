# Process Atlas manifest of a library utility (process-library#45). Schema:
# schemas/process.schema.json. A manifest-only process: its LCI dataset is lca/datasets/*.yaml,
# written from parameters with sources or ASSUMED (see README.md). Tier 1 form (core#182), so
# maturity stays at concept (core's cheme.lci-tier-maturity).
schema: cheme-as-code/process/v1
id: utility-wwtp
title: "Wastewater treatment, activated sludge"
summary: >-
  Utility dataset: biological treatment of industrial wastewater at an ASSUMED design COD, per m3: aeration and pumping power, CO2 of the oxidised organics, residual COD, excess sludge; from COD and biomass stoichiometry with ASSUMED design parameters.
families: [wastewater-treatment]
keywords: [utility, wastewater, activated sludge, COD, aeration]
facets: {unit_operations: [reaction], region: generic}
maturity: concept
validation: {status: unreviewed}
chemistry:
  inputs:
    - {chemical: wastewater, role: feedstock, note: "the consumer's wastewater, free"}
  outputs:
    - {chemical: wastewater, role: main-product, inventory_key: "product:wastewater", note: "the treatment service, per kg (1 m3 = 1000 kg)"}
    - {chemical: carbon-dioxide, role: emission, inventory_key: "emission:CO2"}
    - {chemical: water, role: emission, inventory_key: "emission:H2O", note: "treated effluent"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:electricity"}
basis: {capacity: "per unit of the utility delivered (the dataset's basis); no plant size"}
references:
  - {title: "Prohaska, T. et al. (2022) Standard atomic weights of the elements 2021 (IUPAC Technical Report), Pure Appl. Chem. 94:573"}
repository: {url: "https://github.com/ChemE-as-Code/process-library", path: processes/utility-wwtp, access: private}
