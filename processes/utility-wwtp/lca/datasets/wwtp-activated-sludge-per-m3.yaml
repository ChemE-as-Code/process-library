- key: feed:electricity
  title: Aeration blowers and pumps
  type: input
  amount: 0.39081113740740747
  unit: kWh
  formula: (ww / 1000 * cod_in * removal - ww / 1000 * cod_in * removal * yield_obs * cod_bio) / sae +
    ww * g * head / eta_pump / 3600000
  provenance: assumed
  origin: estimate
  link:
    factor: electricity
    source: grid electricity, medium voltage
  carrier:
    kind: electricity
  source: oxygen demand / aeration efficiency, plus m g H / eta; mixing, sludge handling and buildings
    not counted
