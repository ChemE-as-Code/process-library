- name: dcp
  value: 150.0
  unit: kg
  description: '1,2-Dichloropropane formed per t PO: midpoint of 0.1 to 0.2 t/t. All propylene and chlorine not
    converted to PO is counted as DCP (the chloro ethers are not split off, ASSUMED).'
  source: Nielsen, K.A. (Union Carbide), US patent 4,560,451 (1985), description of the prior art (range, the conventional
    lime process); the midpoint and counting the ethers as DCP are our choices. The older figures of ANL (1980)
    imply far more by-product, see README
- name: lime
  value: 1090.0
  unit: kg
  description: 'Lime per t PO: 1.09 lb per lb of PO, read as quicklime CaO, slaked to milk of lime on site. It is
    1.13 times the stoichiometric 1 mol CaO per mol PO; the excess leaves unreacted.'
  source: Gaines, L.L. and Shen, S.Y. (1980) Energy and materials flows in the production of olefins and their derivatives,
    Argonne National Laboratory ANL/CNSV-9 (US DOE, OSTI 7013430), Fig. 4.58, p. 154 (whose source is Brownstein
    1976); reading 'lime' as CaO is ASSUMED (as Ca(OH)2 it would be less than stoichiometric for neutralising both
    the chlorohydrin and the HCl)
- name: ww
  value: 40000.0
  unit: kg
  description: 'Waste water per t PO: about 40 t, carrying the chloride salts (counted separately as CaCl2).'
  source: EU JRC (2017) LVOC BREF, EUR 28882 EN, doi:10.2760/77304, section 2.1.2.8, p. 29 (about 40 t of waste
    water and 2 t of chloride salts per t PO); Nielsen, K.A. (Union Carbide), US patent 4,560,451 (1985), description
    of the prior art gives 43 t with 2 t CaCl2 (benchmarks/oxygenates.yaml)
- name: elec
  value: 333.3
  unit: kWh
  description: 'Electricity per t PO: core''s Tier 0 default, 0.3333 kWh/kg.'
  source: 'ASSUMED: cheme tier-defaults 1.0.0: electricity [ASSUMED]: 1.2 MJ (0.333 kWh) per kg of product, attributed
    to the Gendorf (2000) site average that the ecoinvent v2-era chemicals proxies used. ASSUMED, not read in either
    source: Hischier et al. 2005 (p. 61) names the Gendorf (2000) average as the default but prints no value, and
    the number could not be confirmed in an open copy of Althaus et al. 2007 (ecoinvent report No. 8). Dated: newer
    ecoinvent proxies rest on later Gendorf reports, so this value may be low for a present-day process. The only
    open chlorohydrin figure read, ANL/CNSV-9 Fig. 4.58 (p. 154), labels its single process-energy input 18,700
    Btu per lb PO "(ELEC)", primary energy at the report''s 33 % generating efficiency (p. 71), so about 3,990 kWh/t
    delivered if read literally. The figure shows no separate steam input although the process is steam-heated
    and steam-stripped (p. 151), so the label is taken to cover all utilities and the value is not used
    (benchmarks/oxygenates.yaml, out of range, explained). TODO source'
- name: cp_w
  value: 4.18
  unit: kJ/(kg*K)
  description: Specific heat of the dilute brine, taken as water.
  source: 'ASSUMED: water at 50 to 100 degC (about 4.18 to 4.22 kJ/(kg K)); the 5 wt-% salt is ignored'
- name: T_r
  value: 50.0
  unit: degC
  description: Temperature of the chlorohydrin solution leaving the hypochlorination tower.
  source: Gaines, L.L. and Shen, S.Y. (1980) Energy and materials flows in the production of olefins and their derivatives,
    Argonne National Laboratory ANL/CNSV-9 (US DOE, OSTI 7013430), section 4.3.2.2, p. 150 (about 120 degF, 50 degC)
- name: T_s
  value: 100.0
  unit: degC
  description: 'Temperature to which the brine is heated: the saponifier is steam-heated and the brine is steam-stripped
    of PO and organics, taken at atmospheric boiling.'
  source: 'ASSUMED: atmospheric steam stripping; Nielsen, K.A. (Union Carbide), US patent 4,560,451 (1985), description
    of the prior art, states complete steam stripping of the brine (for the variant with NaCl brine recycle, at
    an energy cost it calls very large), and the steam-heated saponification is stated in Gaines, L.L. and Shen, S.Y. (1980) Energy and materials flows in the production of olefins and their derivatives,
    Argonne National Laboratory ANL/CNSV-9 (US DOE, OSTI 7013430), p. 151'
