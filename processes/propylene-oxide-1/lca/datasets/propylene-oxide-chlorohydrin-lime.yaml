# Tier 0 form, process-library#313 pilot without a flowsheet. Every amount is the formula of its parameters;
# core's validator re-checks each. Written from the LVOC BREF, ANL/CNSV-9 and US 4,560,451 (facts in our own form).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: propylene-oxide-chlorohydrin-lime
title: Propylene oxide by the chlorohydrin process with lime
description: 'Tier 0 screening estimate per 1 t of propylene oxide, gate-to-gate: hypochlorination of propylene,
  saponification of the chlorohydrin with milk of lime, steam stripping and distillation. Stoichiometry with a sourced
  dichloropropane by-product and lime use, effluent from the LVOC BREF, electricity from core''s Tier 0 default
  and heat as an ASSUMED lower-bound estimate.'
basis: 1000 kg of propylene oxide
boundary: 'gate-to-gate: hypochlorination tower, saponifier and stripper, PO distillation; chlorine, lime, steam
  and power from outside; brine to the site''s wastewater treatment'
technology: chlorohydrin process with lime (calcium chloride brine); the caustic (cell liquor) variant with brine
  recycle to chlor-alkali, HPPO, PO/SM and PO/TBA are not modelled
geography:
  description: 'Mixed: US process figures of 1976 to 1985 and an EU BREF statement of 2017; no single site.'
classification:
  isic: '2011'
system_boundary:
  included:
  - propylene, chlorine and lime
  - process water
  - electricity (default) and steam heat (lower-bound estimate)
  - 1,2-dichloropropane by-product
  - calcium chloride to water
  - unreacted lime
  - effluent to treatment
  excluded:
  - 'TODO COD and AOX of the effluent: the BREF gives only classes (above 10 kg COD/t, above 100 g AOX/t before
    biological treatment, Table 2.5), lower bounds, not counted'
  - 'TODO vent gas: unreacted propylene and its inerts are scrubbed with caustic and recycled (ANL 1980, p. 151),
    the purge is not quantified; caustic for the scrubber not counted'
  - 'TODO fugitive and vent emissions of propylene, PO and chlorinated organics to air: no open figure read'
  - 'TODO dichloro-diisopropyl ether as its own by-product: counted as DCP'
  - TODO PO distillation steam and heat losses beyond the sensible heat of the brine
  - 'fate of the DCP (sale as solvent or feedstock, or incineration): not stated by the sources, left as an output'
  - lime grit and sludge handling
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: GLO
year: 1985
valid_until: 1990
time:
  start: 1976
  description: Lime and the older feed figures are US data of 1976 (via ANL 1980), the DCP range a US patent of
    1985, the effluent an EU BREF statement of 2017. valid_until is the reference year + 5 (system-model section
    6), so it has long lapsed.
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation. The dichloropropane is listed as an output whose fate is not
    stated, not as a co-product; all burdens stay on PO.'
