- name: dcp
  value: 150.0
  unit: kg
  description: '1,2-Dichloropropane formed per t PO: midpoint of 0.1 to 0.2 t/t. All propylene and chlorine not
    converted to PO is counted as DCP (the chloro ethers are not split off, ASSUMED).'
  source: Nielsen, K.A. (Union Carbide), US patent 4,560,451 (1985), description of the prior art (range, the conventional
    lime process); the midpoint and counting the ethers as DCP are our choices. The older figures of ANL (1980)
    imply far more by-product, see README
- name: lime
  value: 1090.0
  unit: kg
  description: 'Lime per t PO: 1.09 lb per lb of PO, read as quicklime CaO, slaked to milk of lime on site. It is
    1.13 times the stoichiometric 1 mol CaO per mol PO; the excess leaves unreacted.'
  source: Gaines, L.L. and Shen, S.Y. (1980) Energy and materials flows in the production of olefins and their derivatives,
    Argonne National Laboratory ANL/CNSV-9 (US DOE, OSTI 7013430), Fig. 4.58, p. 154 (whose source is Brownstein
    1976); reading 'lime' as CaO is ASSUMED (as Ca(OH)2 it would be less than stoichiometric for neutralising both
    the chlorohydrin and the HCl)
- name: ww
  value: 40000.0
  unit: kg
  description: 'Waste water per t PO: about 40 t, carrying the chloride salts (counted separately as CaCl2).'
  source: EU JRC (2017) LVOC BREF, EUR 28882 EN, doi:10.2760/77304, section 2.1.2.8, p. 29 (about 40 t of waste
    water and 2 t of chloride salts per t PO); Nielsen, K.A. (Union Carbide), US patent 4,560,451 (1985), description
    of the prior art gives 43 t with 2 t CaCl2 (benchmarks/oxygenates.yaml)
- name: elec_gj
  value: 1.0
  unit: GJ
  description: Electricity per t PO, final energy (Western European average for propylene oxide).
  source: 'Saygin, D., Patel, M.K., Tam, C., Gielen, D.J. (2009) Chemical and Petrochemical Sector: Potential of
    best practice technology and other measures for improving energy efficiency. IEA Information Paper, OECD/IEA,
    Table 13, p. 51 (propylene oxide, 1.0 GJ/t of electricity, "industrial sources"); its best practice, 0.8 GJ/t
    (Table 1, p. 15), is estimated as 20 % below the average (footnote 2). The paper does not name the route, and
    the LVOC BREF (2017, section 2.1.2.8) names co-production with styrene, the chlorohydrin process (in one
    Member State) and epoxidation with hydrogen peroxide, so applying it to the chlorohydrin process is ASSUMED.
    The only open chlorohydrin figure read, ANL/CNSV-9 Fig. 4.58
    (p. 154), labels its single process-energy input 18,700 Btu per lb PO "(ELEC)", primary energy at the
    report''s 33 % generating efficiency (p. 71), about 3,990 kWh/t delivered if read literally; it shows no
    steam input although the process is steam-heated and steam-stripped (p. 151), so it is taken to cover all
    utilities and is not used (benchmarks/oxygenates.yaml, out of range, explained)'
- name: steam_gj
  value: 18.0
  unit: GJ
  description: Steam per t PO, final energy (heat delivered; Western European average for propylene oxide).
  source: 'Saygin, D., Patel, M.K., Tam, C., Gielen, D.J. (2009) Chemical and Petrochemical Sector: Potential of
    best practice technology and other measures for improving energy efficiency. IEA Information Paper, OECD/IEA,
    Table 13, p. 51 (propylene oxide, 18.0 GJ/t of steam, "industrial sources"); best practice 14.2 GJ/t (Table 1,
    p. 15, estimated as 20 % below the average, footnote 2). Route not named; applying it to the chlorohydrin
    process is ASSUMED. A first-principles lower bound for this process supports the order of magnitude: heating
    the 40 t of brine (LVOC BREF) from the hypochlorination tower''s 50 degC (ANL/CNSV-9, p. 150) to atmospheric
    stripping at 100 degC takes 40 t x 4.18 kJ/(kg K) x 50 K = 8.4 GJ/t, before PO distillation and losses'
