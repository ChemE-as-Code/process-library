# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# BHET by glycolysis of washed post-consumer PET flake with ethylene glycol and zinc acetate at
# atmospheric reflux, with BHET recovered by crystallisation from water (EP 0 723 951 A1,
# method B, Example 2; DESIGN.md D-001), a batch plant: the flake, fresh and recovered glycol,
# the catalyst and the recycled oligomers are charged to R-101 and held 2 h at the glycol's
# boiling point (R101); the hot glycolysate is filtered of the non-PET solids (F101) and
# quenched with the second mother liquor to 343 K, where the oligomers precipitate (CR201) and
# are filtered off (F201), 90 % of them back to the next charge (SP201); the filtrate is cooled
# to 288 K for the crude BHET (CR202, F202), which is redissolved in hot water at 353 K (CR203),
# recrystallised at 288 K (CR204), centrifuged (F204) and vacuum-dried at 343 K (D201). The
# second mother liquor quenches the next batch; the first, with the dryer's condensate, is
# distilled (X301): the water back to the redissolution (SP302, M302), the glycol with the BHET
# and catalyst it holds back to the charge (SP301). The flows are the year averages of the batch
# recipe (process/recipe.yaml, `cheme process recipe`, D-003).
# Where the values come from:
# - ratios and conditions: EP 0 723 951 A1 (SRC-3) and the design basis, else ASSUMED (D-002 to
#   D-009);
# - the feeds: four design specifications (core ADR 0070): the flake S1 for 5000 t/a of dried
#   BHET, the fresh glycol S2 for the charge's 2 kg of glycol per kg PET, the catalyst S3 for
#   its 1.5 g per kg PET and the make-up water S31 for 6 kg of water per kg of crude BHET in the
#   redissolution;
# - R101: a conversion step (GLY, OLF, DEP, DSO, DEG; D-005); CR201 to CR204: core's
#   crystallizer (an imposed yield for the oligomers and the first crop, the water solubility of
#   BHET for the redissolution and the second crop); F101 to F204: specified filters; X301: a
#   component separator; D201: core's dryer; the four recycles converged at the tears S19, S20,
#   S21 and S29 (core ADR 0060): all calculated by `cheme process propagate --fill`, with the
#   duties the models give (core ADRs 0059, 0063);
# - the distillation's and the condensers' duties, the dryer's heat and the drives' power:
#   ASSUMED year averages with their arithmetic in each source (D-009).
schema: cheme/process/v1
kind: flowsheet
title: BHET by batch glycolysis of PET flake with crystallisation from water (5000 t/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 5000 t/a dried BHET, year averages of the batch recipe in 7920 h (D-002, D-003)", default: true}
tolerance: {abs: 0.05, rel: 0.002}   # balances: |in - out| <= abs + rel * max(in, out), kg/h
# Four recycles (core ADR 0060): the second mother liquor S19 to the quench, the recovered glycol
# S20 and the oligomers S21 to the charge, the distilled water S29 to the redissolution.
tears:
  - stream: S19
    initial: {flow: 4000.0, unit: kg/h, basis: mass_fraction, composition: {H2O: 0.99, BHET: 0.005, EG: 0.005}}
  - stream: S20
    initial: {flow: 1000.0, unit: kg/h, basis: mass_fraction, composition: {EG: 0.85, BHET: 0.1, H2O: 0.01, DEG: 0.03, ZNAC: 0.01}}
  - stream: S21
    initial: {flow: 160.0, unit: kg/h, basis: mass_fraction, composition: {OLIG_S: 0.5, H2O: 0.35, EG: 0.12, BHET: 0.03}}
  - stream: S29
    initial: {flow: 3700.0, unit: kg/h, basis: mass_fraction, composition: {H2O: 0.998, EG: 0.002}}
convergence: {method: wegstein, max_iterations: 500, tolerance: {abs: 1.0e-6, rel: 1.0e-8}}
specs:
  - id: rate
    vary: {stream: S1, initial: 530.0}
    target: {stream: S22, quantity: annual, value: 5000, unit: t}
    provenance: assumed
    source: "5000 t/a of dried BHET, ASSUMED (D-002)"
  - id: glycol
    vary: {stream: S2, initial: 200.0}
    target: {stream: S4, component: EG, quantity: ratio, basis: mass, per: {stream: S4, component: PET}, value: 2.0}
    provenance: given
    source: "EP 0 723 951 A1: EG to PET 1 to 5 by mass, preferably 2 to 3; Examples 1 to 3: 600 g EG per 300 g PET; the recovered glycol S20 counts in the charge (D-004)"
  - id: catalyst
    vary: {stream: S3, initial: 0.5}
    target: {stream: S4, component: ZNAC, quantity: ratio, basis: mass, per: {stream: S4, component: PET}, value: 0.0015}
    provenance: given
    source: "EP 0 723 951 A1 Example 1: 0.45 g ZnAc2 per 300 g PET (0.5 g per kg of PET and EG, the preferred concentration); the catalyst returned with the recovered glycol S20 counts in the charge (D-004)"
  - id: water
    vary: {stream: S31, initial: 300.0}
    target: {stream: S15, component: H2O, quantity: ratio, basis: mass, per: {stream: S13, component: BHET_S}, value: 6.0}
    provenance: given
    source: "EP 0 723 951 A1: in the second crystallisation 4 to 10, preferably 6 to 8, kg of water per kg of BHET; 6 taken, the low end of the preferred range, which keeps the solution at 353 K below the 0.18 kg/kg bound of SRC-3 Example 4 (D-007)"

feeds:
  - {id: PETF, title: Washed PET flake (post-consumer bottles), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: EGF, title: Ethylene glycol (ethylene-glycol-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: CATF, title: Zinc acetate (catalyst make-up), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: WATF, title: Process water (make-up), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: f201, direction: out, kind: energy}
      - {id: f202, direction: out, kind: energy}
      - {id: f204, direction: out, kind: energy}
      - {id: d201, direction: out, kind: energy}
      - {id: x301, direction: out, kind: energy}
  - id: HPS
    title: HP steam 4100 kPa(a)
    category: utility
    utility:
      kind: steam
      level: HP
      pressure: {value: 4100, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 525.0, provenance: given, source: "saturation at 4100 kPa(a), IAPWS-95 (chemicals 1.5.2 iapws95_Tsat: 524.97 K)"}
      min_approach: {value: 20, provenance: assumed, source: "D-009"}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: x301, direction: out, kind: energy}
  - id: LPS
    title: LP steam 350 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 350, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 412.0, provenance: given, source: "saturation at 350 kPa(a), IAPWS-95 (chemicals 1.5.2 iapws95_Tsat: 412.01 K)"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: cr201, direction: out, kind: energy}
      - {id: cr203, direction: out, kind: energy}
      - {id: d201, direction: out, kind: energy}
products:
  - {id: BHET, title: BHET crystals to packing, category: product, ports: [{id: in, direction: in}]}
  - {id: RES, title: "Hot-filter residue (non-PET solids with glycolysate), to incineration", category: solid_waste, ports: [{id: in, direction: in}]}
  - {id: OPURGE, title: "Oligomer purge, to incineration", category: solid_waste, ports: [{id: in, direction: in}]}
  - {id: GPURGE, title: "Glycol residue purge (DEG, catalyst, heavies; a liquid), to incineration", category: solid_waste, ports: [{id: in, direction: in}]}
  - {id: WW, title: "Distillate purge, to wastewater treatment", category: wastewater, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: e201, direction: in, kind: energy}
      - {id: x301, direction: in, kind: energy}
  - id: CHW
    title: Chilled water return (278 K)
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 278.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 283.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: cr202, direction: in, kind: energy}
      - {id: cr204, direction: in, kind: energy}

blocks:
  - id: GLYC
    title: Glycolysis and hot filtration
    class: ReactingChemicals
    ports:
      - {id: pet, direction: in}
      - {id: eg, direction: in}
      - {id: cat, direction: in}
      - {id: glycol, direction: in}
      - {id: olig, direction: in}
      - {id: glyc, direction: out}
      - {id: residue, direction: out}
      - {id: heat, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: OLIGO
    title: Quench with water and oligomer removal
    class: SeparatingMechanically
    ports:
      - {id: glyc, direction: in}
      - {id: water, direction: in}
      - {id: olig, direction: out}
      - {id: purge, direction: out}
      - {id: ml, direction: out}
      - {id: q, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: CRYST
    title: BHET crystallisation and recrystallisation from water
    class: Crystallizing
    ports:
      - {id: ml, direction: in}
      - {id: water, direction: in}
      - {id: makeup, direction: in}
      - {id: ml1, direction: out}
      - {id: ml2, direction: out}
      - {id: cake, direction: out}
      - {id: q1, direction: out, kind: energy}
      - {id: q2, direction: in, kind: energy}
      - {id: q3, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: power2, direction: in, kind: energy}
  - id: DRY
    title: Vacuum drying
    class: Drying
    ports:
      - {id: cake, direction: in}
      - {id: product, direction: out}
      - {id: cond, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: q, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: RECOV
    title: Water and glycol recovery
    class: Distilling
    ports:
      - {id: ml1, direction: in}
      - {id: cond, direction: in}
      - {id: glycol, direction: out}
      - {id: gpurge, direction: out}
      - {id: water, direction: out}
      - {id: wwpurge, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: q, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}

steps:
  - id: M101
    block: GLYC
    title: Charge (flake, fresh and recovered glycol, catalyst, recycled oligomers)
    class: Mixing
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: pet, direction: in, delegates: pet}
      - {id: eg, direction: in, delegates: eg}
      - {id: cat, direction: in, delegates: cat}
      - {id: glycol, direction: in, delegates: glycol}
      - {id: olig, direction: in, delegates: olig}
      - {id: out, direction: out}
  - id: R101
    block: GLYC
    title: Glycolysis at the glycol's reflux (470 K, 2 h)
    class: ReactingChemicals
    reactions: [GLY, OLF, DEP, DSO, DEG]
    reactor: conversion
    energy_port: q
    hazard:
      mtt: 470.31
      provenance: assumed
      source: "MTT: the normal boiling point of ethylene glycol (chemicals 1.5.2), the reflux temperature R-101 runs at (SRC-3); the 4 wt% of water the recovered glycol brings boils off through the reflux condenser during the heat-up, so the default (water's boiling point) does not bound the batch at 470 K (D-011)"
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: charge, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: heat}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: F101
    block: GLYC
    title: Hot filtration of the non-PET solids
    class: Filtering
    solid_separation:
      solid_recovery: 1.0
      cake_liquid: {value: 0.5, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "a hot candle or bag filter on the glycolysate (SRC-3: the reaction mix hot-filtered of coarse impurities), all of the non-PET solids taken off with 0.5 kg of glycolysate per kg, ASSUMED (D-008)"
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out, delegates: residue}
      - {id: filtrate, direction: out, delegates: glyc}
  - id: CR201
    block: OLIGO
    title: Quench with the second mother liquor to 343 K (the oligomers precipitate)
    class: Crystallizing
    crystallizer:
      solute: OLIG
      solvent: H2O
      crystal: OLIG_S
      basis: yield
      temperature: 343.15
      yield: {value: 0.98, provenance: assumed, source: "SRC-3 Example 4: the higher oligomers stay insoluble in water near its boiling point, dimers and trimers dissolve above 80 to 90 C and precipitate below, BHET stays dissolved above 60 C; 98 % of the lumped oligomers taken to precipitate at 70 C, ASSUMED (D-006)"}
      energy: {heat_capacity: 3.6, heat_of_crystallization: 0.0, provenance: assumed, source: "the mixed liquor about 3.6 kJ/(kg K): about one part of glycolysate at 2.6 to two parts of water at 4.2 kJ/(kg K), ASSUMED; heat of precipitation not counted (no open value, D-009)"}
      spectators: [EG, DEG, ZNAC, BHET]
      outlets: {slurry: out}
    energy_port: q
    links: [{target: equipment, ref: V-201}]
    ports:
      - {id: glyc, direction: in, delegates: glyc}
      - {id: water, direction: in, delegates: water}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: q}
  - id: F201
    block: OLIGO
    title: Oligomer filtration at 343 K
    class: Filtering
    solid_separation:
      solid_recovery: 1.0
      cake_liquid: {value: 1.0, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "a pressure filter at 343 K, all the precipitated oligomers to the cake with 1.0 kg of liquor per kg (SRC-3 Example 2: 45 g of a solid mainly of oligomers per 300 g PET), ASSUMED (D-006)"
    links: [{target: equipment, ref: F-201}]
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out, delegates: ml}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: SP201
    block: OLIGO
    title: Oligomer cake to the next charge, a purge to incineration
    class: SplittingMaterial
    split: {purge: 0.1}
    links: [{target: equipment, ref: F-201}]
    ports:
      - {id: in, direction: in}
      - {id: rec, direction: out, delegates: olig}
      - {id: purge, direction: out, delegates: purge}
  - id: CR202
    block: CRYST
    title: First crop (crude BHET crystallises at 288 K)
    class: Crystallizing
    crystallizer:
      solute: BHET
      solvent: H2O
      crystal: BHET_S
      basis: yield
      temperature: 288.15
      yield: {value: 0.90, provenance: assumed, source: "SRC-3 Example 2: about 305 g of BHET recovered at 15 C (the 295 g of the second crystallisation and its losses) of about 338 g dissolved (the PET less its oligomers), so 0.90; the glycol-rich liquor keeps more BHET dissolved than water does (D-007)"}
      energy: {heat_capacity: 3.6, heat_of_crystallization: 0.0, provenance: assumed, source: "as CR201; the heat of crystallisation of BHET not counted (no open value, D-009)"}
      spectators: [EG, DEG, ZNAC, OLIG]
      outlets: {slurry: out}
    energy_port: q
    links: [{target: equipment, ref: V-202}]
    ports:
      - {id: in, direction: in, delegates: ml}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: q1}
  - id: F202
    block: CRYST
    title: Centrifuging the crude BHET
    class: Filtering
    solid_separation:
      solid_recovery: 1.0
      cake_liquid: {value: 0.6, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "a peeler centrifuge, all the crystals to the cake with 0.6 kg of liquor per kg (SRC-3 Example 2: a 485 g residue of BHET, water and EG holding about 305 g of BHET), ASSUMED (D-008)"
    links: [{target: equipment, ref: C-202}]
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out, delegates: ml1}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M302
    block: CRYST
    title: Hot-water tank (distilled water and make-up)
    class: Mixing
    links: [{target: equipment, ref: T-302}]
    ports:
      - {id: rec, direction: in, delegates: water}
      - {id: makeup, direction: in, delegates: makeup}
      - {id: out, direction: out}
  - id: CR203
    block: CRYST
    title: Redissolution of the crude BHET in hot water at 353 K
    class: Crystallizing
    crystallizer:
      solute: BHET
      solvent: H2O
      crystal: BHET_S
      basis: solubility
      temperature: 353.15
      solubility:
        unit: kg/kg_solvent
        value: 0.18
        provenance: assumed
        source: "a lower bound: SRC-3 Example 4 dissolves 180 g of BHET (200 g of a 90 % solid) in 1000 g of water above 60 C; at 353 K the solubility is higher (SRC-3 Example 2 dissolves about 0.2 kg/kg at 80 C); the bound is enough, the solution at 6 kg of water per kg stays undersaturated (D-007)"
        salting_out:
          coefficients: {EG: 0.0, DEG: 0.0, ZNAC: 0.0, OLIG: 0.0}
          provenance: assumed
          source: "no open data on the effect of the glycol in the cake liquor; no correction taken (D-007, L-3)"
      energy: {heat_capacity: 3.9, heat_of_crystallization: 0.0, provenance: assumed, source: "the cake and the water about 3.9 kJ/(kg K), ASSUMED; the heat of solution of BHET not counted (no open value, D-009)"}
      spectators: [EG, DEG, ZNAC, OLIG]
      outlets: {slurry: out}
    energy_port: q
    links: [{target: equipment, ref: V-203}]
    ports:
      - {id: cake, direction: in}
      - {id: water, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: q2}
  - id: CR204
    block: CRYST
    title: Second crop (BHET recrystallises at 288 K)
    class: Crystallizing
    crystallizer:
      solute: BHET
      solvent: H2O
      crystal: BHET_S
      basis: solubility
      temperature: 288.15
      solubility:
        unit: kg/kg_solvent
        value: 0.005
        provenance: assumed
        source: "CN 110 590 551 A: 0.5 % (w/v) in water at 20 C, taken as 0.005 kg per kg of water and used at 15 C, an upper bound since the solubility falls with the temperature (SRC-5, D-007)"
        salting_out:
          coefficients: {EG: 0.0, DEG: 0.0, ZNAC: 0.0, OLIG: 0.0}
          provenance: assumed
          source: "as CR203 (D-007, L-3)"
      energy: {heat_capacity: 4.0, heat_of_crystallization: 0.0, provenance: assumed, source: "the dilute solution about 4.0 kJ/(kg K), ASSUMED; heat of crystallisation not counted (D-009)"}
      spectators: [EG, DEG, ZNAC, OLIG]
      outlets: {slurry: out}
    energy_port: q
    links: [{target: equipment, ref: V-203}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: q3}
  - id: F204
    block: CRYST
    title: Centrifuging the pure BHET
    class: Filtering
    solid_separation:
      solid_recovery: 1.0
      cake_liquid: {value: 0.15, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "a peeler centrifuge, the needle crystals of SRC-3 in a nearly pure water liquor spun to 0.15 kg of water per kg (as salicylic-acid-1's), ASSUMED (D-008)"
    links: [{target: equipment, ref: C-204}]
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out, delegates: cake}
      - {id: filtrate, direction: out, delegates: ml2}
      - {id: power, direction: in, kind: energy, delegates: power2}
  - id: D201
    block: DRY
    title: Vacuum drying at 343 K
    class: Drying
    dryer:
      volatiles: [H2O, EG]
      residual_moisture: {value: 0.002, basis: mass_fraction, provenance: assumed, source: "0.2 wt% water and glycol left in the dried BHET (D-008)"}
      temperature: 343.15
      pressure: 10.0
      energy:
        heat_capacity: 1.9
        latent_heat: {H2O: 2333.0, EG: 1015.0}
        vessel_heat_capacity: 4000
        efficiency: 0.7
        port: steam
        provenance: assumed
        source: "the wet cake about 1.9 kJ/(kg K), ASSUMED; latent heats at 343.15 K: water 2333.0 and ethylene glycol 1015.0 kJ/kg (thermo 0.6.1, method HEOS_FIT; SRC-7); the dryer's metal, about 8 t of steel at 0.5 kJ/(kg K) heated from 298 K each batch, ASSUMED; 70 % efficiency (D-008, D-009). Dried at 343 K, well below BHET's melting point of 109.5 C (CRC via chemicals 1.5.2; SRC-2: 106 to 110 C)"
      drying_rate: {value: 8.0, provenance: assumed, source: "ASSUMED mean rate of a horizontal paddle vacuum dryer with a heated agitator: a wall flux of about 5.2 kW/m2 over 2333 kJ/kg (D-008)"}
      cake_density: {value: 700, provenance: assumed, source: "ASSUMED bulk density of the wet needle crystals (SRC-3: aciculiform) with 0.15 kg of water per kg (D-008)"}
      outlets: {product: product, vapour: vapour}
    links: [{target: equipment, ref: D-201}]
    ports:
      - {id: in, direction: in, delegates: cake}
      - {id: product, direction: out, delegates: product}
      - {id: vapour, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E201
    block: DRY
    title: Vacuum condenser of the dryer (cooling water)
    class: Cooling
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: cond}
      - {id: q, direction: out, kind: energy, delegates: q}
  - id: M301
    block: RECOV
    title: Liquor collection (first mother liquor and the dryer's condensate)
    class: Mixing
    links: [{target: equipment, ref: T-301}]
    ports:
      - {id: ml, direction: in, delegates: ml1}
      - {id: cond, direction: in, delegates: cond}
      - {id: out, direction: out}
  - id: X301
    block: RECOV
    title: Dewatering column (water overhead, glycol with the dissolved BHET and catalyst as bottoms)
    class: Distilling
    recovery:
      outlets: {water: {H2O: 0.995, EG: 0.002}}
      provenance: assumed
