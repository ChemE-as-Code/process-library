# What the plant must do. Schema: `cheme schema design_basis`.
# BHET by glycolysis of post-consumer PET flake with ethylene glycol and zinc acetate, with
# crystallisation from water, a batch plant, issue ChemE-as-Code/process-library#516. Values
# marked ASSUMED are engineering choices of this concept study, not client or licensor data;
# every decision is in DESIGN.md.
schema: cheme/design_basis/v1
capacity:
  basis: dried BHET crystals to packing at the battery limit
  bhet_t_per_year: 5000                  # ASSUMED (D-002): a regional chemical-recycling train
  operating_hours_per_year: 7920          # ASSUMED (D-002): 330 days of 24 h, batch operation
  batches: "from the recipe (process/recipe.yaml, D-003); the dryer D-201 and the reactor R-101 set the cycle"
feeds:
  - name: Washed PET flake (post-consumer bottles)
    source_of_values: ASSUMED (D-004)
    composition: "PET 99.5 wt%, non-PET solids (cap and label fragments) 0.5 wt%, dry (ASSUMED)"
    conditions: {temperature_K: 298.15, pressure_kPa_a: 101.325}
  - name: Ethylene glycol (ethylene-glycol-1)
    source_of_values: "EP 0 723 951 A1: 1 to 5 kg of EG per kg PET, preferably 2 to 3; 2 taken in the charge with the recovered glycol (D-004)"
    composition: "MEG, fibre grade"
  - name: Zinc acetate (catalyst)
    source_of_values: "EP 0 723 951 A1 Example 1: 0.45 g per 300 g PET, 1.5 g per kg PET in the charge, mostly returned with the recovered glycol (D-004)"
  - name: Process water (make-up to the redissolution)
    source_of_values: ASSUMED demineralised (D-004)
products:
  - name: BHET
    purity: "the model's product is 99.8 wt% BHET with 0.2 wt% water and traces of the liquor (D-008); SRC-3 reports a white product melting at 116 C with Zn 6 ppm for its method A; colour, acid value, DEG and metal limits of a polymer grade not modelled (ASSUMED)"
    delivery: {temperature_K: 303.15, pressure_kPa_a: 101.325, battery_limit: packing (big bags; not in the boundary)}
  - name: Wastes to incineration
    note: "the hot-filter residue (non-PET solids with glycolysate), the oligomer purge and the glycol residue purge (DEG, catalyst, heavies) (D-010)"
  - name: Distillate purge to wastewater treatment
    note: "5 % of the column's distilled water with traces of glycol (D-010)"
utilities:
  - {name: Electric power, use: "agitators, filters, centrifuges, the dryer's drive and vacuum pump, column pumps (D-009)"}
  - {name: HP steam, pressure_kPa_a: 4100, use: "R-101's jacket (the charge to 470 K) and the column's reboiler (D-009)", note: ASSUMED}
  - {name: LP steam, pressure_kPa_a: 350, use: "the quench vessel, the redissolution at 353 K and the dryer (D-009)", note: ASSUMED}
  - {name: Cooling water, supply_K: 298.15, return_K: 308.15, use: "the dryer's condenser and the column's condenser", note: ASSUMED}
  - {name: Chilled water, supply_K: 278.15, return_K: 283.15, use: "both crystallisations to 288 K", note: "ASSUMED; from a refrigeration unit outside the boundary"}
site:
  location: ASSUMED generic chemical-recycling site near a PET bottle sorting and washing plant, not chosen
  design_ambient_K: 298.15            # ASSUMED
  atmospheric_pressure_kPa: 101.325
assumptions:
  - "Route: zinc-acetate-catalysed glycolysis of PET at the glycol's atmospheric reflux and recovery of BHET by crystallisation from water, EP 0 723 951 A1 method B, Example 2 (D-001)."
  - "Charge: 2 kg of glycol and 1.5 g of zinc acetate per kg of PET, counting the recovered glycol and catalyst; 2 h at 470 K (SRC-3; D-004, D-005)."
  - "ASSUMED conversion split from SRC-3 Example 2: 87 % of the repeat units to BHET, 13 % left as oligomers (lumped as the dimer); the recycled oligomers glycolysed to the same share; 0.06 % of the glycol to DEG a batch; every heat of reaction 0 (D-005)."
  - "ASSUMED crystallisation from SRC-3 and CN 110 590 551 A: oligomers 98 % precipitated at 343 K; first crop 90 % of the BHET at 288 K from the glycol-water liquor; redissolution in 6 kg of water per kg at 353 K; second crop at 288 K to BHET's water solubility of 0.005 kg/kg (D-006, D-007)."
  - "ASSUMED filters and centrifuges: all solids to the cake; cake liquor 0.5, 1.0, 0.6 and 0.15 kg per kg; dried to 0.2 wt% (D-008)."
  - "ASSUMED recycles: 90 % of the oligomer cake to the charge, 95 % of the column bottoms to the charge, 95 % of the distilled water to the redissolution; the column takes 99.5 % of the water overhead with 0.2 % of the glycol (D-008)."
  - "All flows are year averages of the recipe (D-003); duties from core's models, the column and condenser duties by hand (D-009); accuracy +/-30 % not demonstrated."
