# Equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes per batch from the recipe (D-003: 3944.66 kg of BHET every 6.248 h, 1268 batches a year)
# and the models; design pressures, temperatures and materials are not set yet (basic
# engineering); the materials named are usual choices for hot glycol, the aqueous liquors and
# zinc acetate, to be confirmed (open input). All values ASSUMED.
schema: cheme/equipment/v1
equipment:
  - {tag: R-101, type: StirredTankReactor, service: "Glycolysis reactor: flake, glycol, catalyst and recycled oligomers held 2 h at the glycol's reflux at 470 K (M101, R101)",
     notes: "16 m3 (R10 preferred size), sized by hand: about 10.6 t a batch (1694.5 kg/h x 6.248 h) at about 1100 kg/m3 is 9.6 m3, 60 % full (core sizes no vessel from a conversion step, L-5; D-003); jacket or half-pipe coil on HP steam, 150.4 kW year average (Q1, core's conversion duty: the charge to 470 K), about 0.63 MW while it heats for 1.5 h; reflux condenser returning the glycol, nitrogen blanket (SRC-2); flake charged by screw feeder into the warm glycol (D-004); stainless steel."}
  - {tag: F-101, type: Filter, service: "Hot filter: the non-PET solids taken off the glycolysate at 470 K (F101)",
     notes: "Candle or bag filter, about 15 kg of cap and label fragments a batch with 0.5 kg of glycolysate per kg (D-008); residue to incineration; stainless steel, steam-traced."}
  - {tag: V-201, type: Vessel, service: "Quench vessel: the glycolysate run into the second mother liquor at 343 K, the oligomers precipitate (CR201)",
     notes: "50 m3 (R10 preferred size), about 36 t of slurry a batch, 72 % full; agitated; jacket on LP steam hot water, 15.1 kW year average (Q2: the cold second mother liquor outweighs the glycolysate's heat, core's crystallizer duty); stainless steel."}
  - {tag: F-201, type: Filter, service: "Oligomer filter at 343 K (F201), 90 % of the cake back to R-101 (SP201)",
     notes: "Pressure leaf or candle filter, about 1.04 t of cake a batch (half oligomers, half liquor, ASSUMED, D-006); 10 % of it purged to incineration; stainless steel."}
  - {tag: V-202, type: Vessel, service: "First-crop crystalliser: the oligomer-free liquor cooled from 343 to 288 K on chilled water (CR202)",
     notes: "50 m3, about 35.6 t a batch, 71 % full; agitated, jacket or external cooler on chilled water, 313.7 kW year average (Q3, core's crystallizer duty) over 3 h a batch, about 0.65 MW; stainless steel."}
  - {tag: C-202, type: Centrifuge, service: "Peeler centrifuge for the crude BHET (F202)",
     notes: "About 6.4 t of cake a batch with 0.6 kg of liquor per kg (D-008); 2 h a batch; stainless steel."}
  - {tag: V-203, type: Vessel, service: "Recrystalliser: the crude BHET dissolved in hot water at 353 K (CR203) and cooled to 288 K (CR204)",
     notes: "40 m3, about 30.6 t a batch, 77 % full; agitated, jacket on LP steam (Q4 249.5 kW year average) and on chilled water (Q5 354.1 kW year average) (core's crystallizer duties); stainless steel."}
  - {tag: C-204, type: Centrifuge, service: "Peeler centrifuge for the pure BHET (F204)",
     notes: "About 4.5 t of cake a batch with 0.15 kg of water per kg (D-008); 2 h a batch; stainless steel."}
  - {tag: D-201, type: Dryer, service: "Horizontal paddle vacuum dryer: the pure BHET dried at 343 K and 10 kPa(a) (D201)",
     notes: "12.5 m3 (R10 preferred size, 52 % full with 6.46 m3 of wet cake) as the recipe sizes it (core ADR 0057), 15.2 m2 heated; 4.75 h of drying a batch from D201's rate (recipe), the bottleneck by a little (cycle 6.248 h); hot water from LP steam, 129.0 kW year average (Q6, core's dryer model); below BHET's melting point of 109.5 C; dust filter and the vacuum condenser E-201 (D-008); stainless steel."}
  - {tag: E-201, type: HeatExchanger, service: "Vacuum condenser of the dryer (E201)",
     notes: "Condenses 92.7 kg/h year average of water with 1.6 wt% glycol to T-301; cooling water, 62.8 kW year average (Q7, D-009); stainless steel."}
  - {tag: T-301, type: Tank, service: "Liquor tank: the first mother liquor and the dryer's condensate (M301)",
     notes: "40 m3, a batch and a little more of liquor (about 29.8 t), the column's feed buffer; stainless steel."}
  - {tag: C-301, type: Column, service: "Dewatering column: water overhead, the glycol with the BHET, DEG and catalyst as bottoms (X301, a specified split)",
     notes: "Packed column at atmospheric pressure, continuous from T-301, 4764.8 kg/h of feed; reboiler on HP steam 4.24 MW (Q8), condenser on cooling water 3.90 MW (Q9), reflux ratio 0.5 and a feed-bottoms interchanger E-301 (ASSUMED, D-009); stages to be set at basic engineering (open input); stainless steel."}
  - {tag: T-302, type: Tank, service: "Hot-water tank: distilled water and make-up to the redissolution (SP302, M302)",
     notes: "40 m3, one batch's 24.2 t of water; 5 % of the distillate purged to the wastewater treatment (D-008); stainless steel."}
  - {tag: T-303, type: Tank, service: "Recovered glycol tank: the column bottoms to the next charge (SP301)",
     notes: "10 m3, about 5.6 t a batch; 5 % purged to incineration to bound the DEG, the catalyst and the heavies (D-008); stainless steel."}
