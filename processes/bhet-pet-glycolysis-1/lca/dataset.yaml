id: bhet-by-batch-glycolysis-of-pet-flake-with-crystallisation-from-water-5000-t-a
title: BHET by batch glycolysis of PET flake with crystallisation from water (5000 t/a)
description: Unallocated foreground LCI of BHET by batch glycolysis of PET flake with crystallisation
  from water (5000 t/a), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Batch plant: washed PET flake glycolysed with ethylene glycol (2 kg per kg PET) and zinc
  acetate (1.5 g per kg PET) for 2 h at the glycol''s reflux at 470 K, hot-filtered, quenched with the
  second mother liquor to 343 K and filtered of the oligomers (90 % recycled), crude BHET crystallised
  at 288 K and centrifuged, redissolved in 6 kg of water per kg at 353 K, recrystallised at 288 K, centrifuged
  and vacuum-dried at 343 K; the first mother liquor distilled, the water (95 %) and the glycol with its
  BHET and catalyst (95 %) recycled; 3944.66 kg per batch, 1268 batches a year on a dedicated train'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:glycol-vents
  title: storage-tank emissions of R-101, T-303
  direction: output
  reason: 'No P&ID yet: the nitrogen purge of R-101''s reflux condenser and the breathing of the glycol
    tank carry glycol vapour (low at ambient temperature); vented through the site''s scrubber, not estimated
    (D-010, D-011).'
- key: emission-excluded:dryer-dust
  title: equipment-leaks emissions of the plant
  direction: output
  reason: BHET dust in the dryer's vacuum vent and in packing is not estimated (D-008, D-010).
- key: emission-excluded:column-vent
  title: storage-tank emissions of T-301, T-302
  direction: output
  reason: The column's and the liquor tanks' vents carry water vapour with traces of glycol and of the
    acetic acid the catalyst may release; not estimated (D-010).
