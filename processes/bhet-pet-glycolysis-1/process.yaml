    - {chemical: polyethylene-terephthalate, role: waste, inventory_key: "product:OPURGE", note: "Oligomer purge to incineration, 0.026 kg/kg: PET oligomers (lumped as the BHET dimer) wetted with water and glycol"}
    - {chemical: polyethylene, role: waste, inventory_key: "product:RES", note: "Hot-filter residue to incineration, 0.006 kg/kg: the flake's non-PET solids (lumped as polyolefin) with glycolysate"}
    - {chemical: wastewater, role: waste, inventory_key: "product:WW", note: "Distillate purge to wastewater treatment, 0.306 kg/kg, water with about 0.04 wt% glycol"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "0.059 kWh/kg: agitators, filters, centrifuges, the dryer's drive and vacuum pump, column pumps (ASSUMED)"}
    - {chemical: steam, role: utility, inventory_key: "feed:HPS", note: "6.96 kWh/kg of HP steam 4100 kPa(a): R-101 (0.24, core's conversion duty) and the column's reboiler (6.72, by hand)"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "0.62 kWh/kg of LP steam 350 kPa(a): the quench, the redissolution (core's crystallizer duties) and the dryer (core's dryer model)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "6.28 kWh/kg removed: the column's and the dryer's condensers (by hand)"}
    - {chemical: chilled-water, role: utility, inventory_key: "product:CHW", note: "1.06 kWh/kg removed at 278 K: both crystallisations to 288 K (core's crystallizer duties)"}
