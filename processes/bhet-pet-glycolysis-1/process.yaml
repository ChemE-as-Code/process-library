schema: cheme-as-code/process/v1
id: bhet-pet-glycolysis-1
title: BHET by batch glycolysis of PET flake with ethylene glycol and zinc acetate, crystallisation from water (5000 t/a)
summary: >-
  Washed PET flake is glycolysed with ethylene glycol and zinc acetate for 2 h at the glycol's
  atmospheric reflux; the glycolysate is quenched with water, the oligomers filtered off and
  recycled, and BHET crystallised, recrystallised from water and dried; water and glycol are
  distilled and recycled. Concept stage, 3944.7 kg per batch every 6.25 h, preliminary
  gate-to-gate LCI.
description: |
  Washed post-consumer PET flake, fresh and recovered ethylene glycol (2 kg per kg PET), zinc
  acetate (1.5 g per kg PET) and the recycled oligomer cake are held 2 h at the glycol's reflux
  at 470 K and atmospheric pressure: method B of EP 0 723 951 A1 (Pilati et al., Example 2).
  The hot glycolysate is filtered of the non-PET solids and run into the last batch's second
  mother liquor at 343 K, where the oligomers precipitate and are filtered off, 90 % of them back
  to the next charge. The liquor is cooled to 288 K for the crude BHET (90 % of the dissolved
  BHET, from Example 2), which is centrifuged, redissolved in 6 kg of hot water per kg at 353 K,
  recrystallised at 288 K to its water solubility, centrifuged and vacuum-dried at 343 K. The
  first mother liquor and the dryer's condensate are distilled: 95 % of the water returns to the
  redissolution, 95 % of the glycol bottoms with their BHET and catalyst to the charge, the rest
  of each is purged. Model yield 97.8 % of the PET repeat units to dried BHET of 99.8 wt%.

  The batch is modelled with cheme-as-code: a conversion step for the glycolysis with the split
  of Example 2 (87 % of the repeat units to BHET, 13 % to oligomers lumped as the dimer, the
  recycled oligomers glycolysed alike, a little DEG), core's crystallizer for the oligomers and
  both crops (imposed yields and BHET's water solubility, ADR 0056), specified filters and
  centrifuges, core's dryer (ADR 0057), a component separator for the dewatering column, four
  design specifications that size the flake, the fresh glycol, the catalyst and the make-up
  water (ADR 0070), four recycles converged at tears (ADR 0060) and the batch recipe (ADRs 0051,
  0052, 0057): the dryer and the reactor set a cycle of 6.248 h, 1268 batches a year. The
  water route's distillation takes 6.7 of the 7.6 kWh of heat per kg BHET (SRC-1 finds the same
  for its water-antisolvent case). Every heat of reaction is ASSUMED 0 (an ester interchange);
  the thermal screening finds no exotherm, the reactor runs at its MTT. See DESIGN.md for every
  assumption.
families: [chemical-recycling, polymers]
keywords: [BHET, bis(2-hydroxyethyl) terephthalate, PET, polyethylene terephthalate, chemical recycling, depolymerisation, glycolysis, ethylene glycol, zinc acetate, oligomers, crystallisation, recrystallisation, centrifuge, vacuum drying, water and glycol recovery, distillation, batch, circular economy, polyester monomer]
facets:
  feedstock_basis: [recycled, fossil]
  product_classes: [polymers, chemicals]
  unit_operations: [reaction, filtration, crystallization, drying, distillation]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, the conversion split, the
# crystallisation yields, the filters, the drying rate and the column's split and duty are
# assumed; ratios and conditions from EP 0 723 951 A1 (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept batch PFD with closed mass, component and element balances (cheme validate, cheme
    process streams: 5 blocks and 18 steps within tolerance; the second mother liquor, the
    recovered glycol, the oligomer cake and the distilled water converged at the tears S19, S20,
    S21 and S29). Four design specifications size the flake for 5000 t/a of dried BHET, the fresh
    glycol for 2 kg of glycol per kg PET in the charge, the zinc acetate for 1.5 g per kg PET and
    the make-up water for 6 kg of water per kg of crude BHET in the redissolution (EP 0 723 951
    A1). The glycolysis R101 is a conversion step with Example 2's split; the crystallizers
    CR201 to CR204, the filters and the dryer D201 are core's models, the dewatering column X301
    a specified split; cheme process propagate writes the reactor's and the crystallizers'
    duties (Q1 to Q5); the dryer's duty Q6 is core's dryer model as reported by cheme process
    crystallizers; the condensers' and the column's duties (Q7 to Q9) are by hand with their
    arithmetic in each source. The recipe's rate agrees with the flowsheet (no
    cheme.recipe-basis finding); it sizes D-201 (12.5 m3); R-101 (16 m3) and the crystallisers
    are sized by hand. Thermal screening (cheme process reactor-hazards): R101 dT_ad 0 K (every
    heat of reaction ASSUMED 0), MTSR 470.1 K against an MTT of 470.31 K (the glycol's boiling
    point); no TD24, no criticality class. Preliminary gate-to-gate LCI: the glycol linked to
    ethylene-glycol-1, the make-up water to demineralised-water-1, the steam as heat; the
    washed flake (its sorting and washing; burden-free as waste under cut-off), the catalyst,
    power, cooling, chilled water and the waste treatments are gaps. cheme maturity reaches no
    level (assumed conversion split and separations); the claim `maturity: concept` is the
    lowest value of the schema, not an evidenced level. Not reviewed. Needs cheme-as-code 1.13.0.
