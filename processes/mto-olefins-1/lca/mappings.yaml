# mto-olefins-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml or names
# an Atlas producer (`dataset`).
#
# The preliminary LCI leaves most backgrounds unmapped (DESIGN.md D-012): the build reports each
# as a gap (lci/gaps.json). Linked here: the methanol to methanol-1 (Grade AA methanol, the
# grade this feed takes) and the steam exchanges, which the dataset counts as heat in kWh while
# their registry slug `steam` is counted by mass, to the shared `steam-heat` entry, as
# ethylene-1 does. The 10 wt% caustic stays a gap: chlor-alkali-1 exports 50 wt% caustic per kg
# of solution, and a kg-for-kg link would count five times the NaOH (lca.yaml).
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:MEOH": {dataset: {path: processes/methanol-1/lca/dataset.yaml, product: "product:MEOH"}, source: "the Atlas producer methanol-1, Grade AA methanol; US 7 138 557 B2 feeds 99.85 wt% methanol (D-003)"}
  "feed:MPS": {use: steam-heat, source: "MP steam 1800 kPa(a) to the feed vaporiser, counted as heat delivered (kWh), D-011"}
  "feed:LPS": {use: steam-heat, source: "LP steam 450 kPa(a) to the oxygenate stripper and the column reboilers, counted as heat delivered (kWh), D-011"}
  "product:HPS": {use: steam-heat, source: "HP steam 4000 kPa(a) raised in the catalyst coolers and the flue gas cooler and exported, counted as heat (kWh); without a burden in the mass allocation (D-007, D-012)"}
