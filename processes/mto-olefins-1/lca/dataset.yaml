schema: cheme/lci_dataset/v2
kind: lci_dataset
id: ethylene-and-propylene-from-methanol-mto-1800-kt-a-methanol
title: Ethylene and propylene from methanol (MTO), 1800 kt/a methanol
description: Unallocated foreground LCI of Ethylene and propylene from methanol (MTO), 1800 kt/a methanol,
  case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'UOP/Hydro-type MTO: methanol vapour over SAPO-34 in a fluidised bed at 475 C and 239 kPa(a)
  (99.5 % conversion, yields of US 7 138 557 B2), coke burnt off in a fluidised-bed regenerator at 650
  C, steam raised in the catalyst coolers; quench, oxygenate recovery and recycle, five-stage compression
  with caustic wash and drying, deethaniser, demethaniser, C2 splitter, depropaniser, C3 splitter and
  debutaniser; 1800 kt/a methanol, 266 kt/a ethylene and 350 kt/a propylene'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:regenerator-co-nox
  title: combustion emissions of R-201
  direction: output
  reason: 'The regenerator burns the coke completely to CO2 in the model (D-007); its CO, NOx and dust
    (catalyst fines past the cyclones) are not estimated: no open source with an MTO regenerator''s flue-gas
    concentrations was read (open item, D-012).'
- key: emission-excluded:catalyst-fines
  title: non-routine emissions of R-101, R-201
  direction: output
  reason: 'Catalyst attrition, make-up and the fines in the flue gas and the quench water are not quantified
    (no open make-up rate read, D-007): the catalyst make-up is excluded here, not counted as zero, an
    open item of the inventory (a consumable needs a rate).'
- key: emission-excluded:fugitives
  title: equipment-leaks emissions of the plant
  direction: output
  reason: No P&ID take-off at concept stage to count components; diffuse and fugitive VOC of the recovery
    train are an open item for basic engineering (D-012).
- key: emission-excluded:flare
  title: flare emissions of the plant
  direction: output
  reason: No continuous flaring in normal operation; start-up, shutdown and upset flaring is non-routine
    and not quantified (D-012).
- key: emission-excluded:water-effluent
  title: effluent emissions of product:WATER
  direction: output
  reason: The organic acids, ketones and aldehydes of the reaction water are not modelled (US 6 403 854
    B1 names organic acids neutralised in the quench); the water goes to treatment outside the boundary
    (D-008).
- key: emission-excluded:spent-caustic-effluent
  title: effluent emissions of product:SPENT
  direction: output
  reason: Goes to treatment outside the boundary; red oil and dissolved hydrocarbons not modelled (D-009).
