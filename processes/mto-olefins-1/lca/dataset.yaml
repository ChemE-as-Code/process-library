allocation:
  coproducts:
  - ETHYLENE
  - PROPYLENE
  - C4
  - C5PLUS
  - FUELGAS
  source: 'D-012: mass allocation among the hydrocarbon products, as ethylene-1 does for the steam-cracker
    outputs: all are hydrocarbons from the same methanol carbon, and ethylene and propylene, 80 % of the
    product mass, have similar prices per kg. The tail gas is a fuel and small (4.2 t/h of 96.4 t/h);
    it is allocated by mass with the rest. The exported HP steam (product:HPS) is an energy output kept
    as its own exchange, outside the allocation and without a burden: the methanol and electricity that
    raise it stay with the hydrocarbon products, so the figures per kg are gross. Substitution and economic
    allocation are to be compared once backgrounds and prices exist.'
  deviation: 'D-012: the WBCSD price-ratio test cannot be applied at concept stage because no co-product
    prices are sourced; mass allocation is kept as the physical relationship among co-products that are
    all hydrocarbons, to be re-tested once prices exist.'
