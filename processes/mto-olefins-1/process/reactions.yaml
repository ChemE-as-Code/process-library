# Reactions of the methanol-to-olefins unit. Schema: `cheme schema process-reactions`.
#
# Reactor R101 is a lumped yield model, NOT kinetics (DESIGN.md D-005): one formation reaction
# per product from methanol, each balanced in its elements, whose extents follow from the
# step's `selectivity:` (flowsheet.yaml): the per-pass methanol conversion and the yield
# structure of a UOP MTO fluidised bed on SAPO-34 (US 7 138 557 B2, Table 1, SRC-1), read as
# shares of the methanol's carbon. Paraffins take the hydrogen that coke, dienes, CO and CO2
# formation release; the hydrogen left over leaves with the product gas. Lumps: 1-butene for
# the butylenes, 1,3-butadiene for the dienes, 1-pentene for C5+, carbon for the coke (D-005).
#
# DME_HYD (step R100) is a modelling device: the dimethyl ether recycled from the oxygenate
# stripper is counted as the two methanol molecules it is made of before R101, i.e. recycled
# DME is ASSUMED to give the same yields per carbon as methanol (D-006). REGEN burns the coke
# in the regenerator R201 (complete combustion ASSUMED, D-007). CAUSTIC removes the CO2 in the
# caustic tower T310 (D-009).
