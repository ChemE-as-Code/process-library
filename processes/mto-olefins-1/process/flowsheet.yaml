# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Ethylene and propylene from methanol (MTO) in a fluidised bed with continuous catalyst
# regeneration, 1800 kt/a methanol (DESIGN.md D-001, D-002). Where the values come from:
# - the reactor outlet S5 (R101: the per-pass conversion and yield structure of US 7 138 557 B2,
#   Table 1, as a `selectivity:`, D-005), the regenerator flue gas S10, the caustic tower
#   outlet S17 and every mixer and component separator outlet are calculated by `cheme process
#   propagate --fill`; the separators' outlets from their specified recoveries (`recovery:`,
#   ASSUMED, D-008 to D-010);
# - the reactor and regenerator duties Q2 and Q3 (steam raised in the catalyst coolers and the
#   flue gas cooler) are core's conversion-step duties, written by propagate (D-007);
# - the feeds of air and caustic and every other duty come from the balance script
#   scripts/balance.py (D-011), given here as ASSUMED: shortcut estimates on ideal-gas
#   enthalpies and the `chemicals` package's heats of vaporisation, because no property
#   package of core covers this mixture (L-1);
# - temperatures and pressures are design choices (D-004, D-008 to D-010), ASSUMED.
schema: cheme/process/v1
kind: flowsheet
title: Ethylene and propylene from methanol (MTO), 1800 kt/a methanol
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 225 t/h methanol (1800 kt/a at 8000 h/a) to polymer-grade ethylene and propylene, oxygenates recycled (D-002)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h
tears:
  - stream: S37
    initial: {flow: 4500.0, unit: kg/h, basis: mass_fraction, composition: {MEOH: 0.25, DME: 0.40, H2O: 0.35}}
convergence: {method: wegstein, max_iterations: 200, tolerance: {abs: 1.0e-6, rel: 1.0e-8}}

feeds:
  - {id: MEOH, title: Methanol Grade AA (from methanol-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AIR, title: Regeneration air, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: CAUSTIC, title: Fresh caustic soda solution 10 wt%, category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power (machine drives, D-011)
    category: utility
    utility: {kind: electricity}
    ports: [{id: k201, direction: out, kind: energy}, {id: k301, direction: out, kind: energy}, {id: k302, direction: out, kind: energy}, {id: k701, direction: out, kind: energy}]
  - id: MPS
    title: MP steam 1800 kPa(a) to the feed vaporiser
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1800, provenance: assumed, source: "D-011"}
      supply_temperature: {value: 480.3, provenance: assumed, source: "saturation at 1800 kPa(a), D-011"}
      min_approach: {value: 7, provenance: assumed, source: "D-011"}
    ports: [{id: e101, direction: out, kind: energy}]
  - id: LPS
    title: LP steam 450 kPa(a) to the reboilers
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "D-011"}
      supply_temperature: {value: 420.8, provenance: assumed, source: "saturation at 450 kPa(a), D-011"}
      min_approach: {value: 10, provenance: assumed, source: "D-011"}
    ports: [{id: t202, direction: out, kind: energy}, {id: t401, direction: out, kind: energy}, {id: t501, direction: out, kind: energy}, {id: t502, direction: out, kind: energy}, {id: t503, direction: out, kind: energy}]
products:
  - {id: ETHYLENE, title: Polymer-grade ethylene, category: product, ports: [{id: in, direction: in}]}
  - {id: PROPYLENE, title: Polymer-grade propylene, category: by_product, ports: [{id: in, direction: in}]}
  - {id: C4, title: C4 olefin cut (butenes), category: by_product, ports: [{id: in, direction: in}]}
  - {id: C5PLUS, title: C5+ cut, category: by_product, ports: [{id: in, direction: in}]}
  - {id: FUELGAS, title: "Tail gas (methane, hydrogen, CO, ethane, propane) to the site fuel gas header", category: by_product, ports: [{id: in, direction: in}]}
  - {id: FLUE, title: Regenerator flue gas to atmosphere, category: emission, ports: [{id: in, direction: in}]}
  - {id: WATER, title: Process water (reaction water) to wastewater treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - {id: SPENT, title: Spent caustic to treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - id: HPS
    title: HP steam 4000 kPa(a) raised in the catalyst coolers and the flue gas cooler (export)
    category: utility
    utility:
      kind: steam
      level: HP
      pressure: {value: 4000, provenance: assumed, source: "D-007"}
      supply_temperature: {value: 523.6, provenance: assumed, source: "saturation at 4000 kPa(a), D-007"}
      min_approach: {value: 20, provenance: assumed, source: "D-007"}
    ports: [{id: r101, direction: in, kind: energy}, {id: r201, direction: in, kind: energy}]
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "D-011"}
      return_temperature: {value: 308.15, provenance: assumed, source: "D-011"}
      min_approach: {value: 5, provenance: assumed, source: "D-011"}
    ports:
      - {id: t201, direction: in, kind: energy}
      - {id: t202, direction: in, kind: energy}
      - {id: k301, direction: in, kind: energy}
      - {id: k302, direction: in, kind: energy}
      - {id: t501, direction: in, kind: energy}
      - {id: t502, direction: in, kind: energy}
      - {id: t503, direction: in, kind: energy}
      - {id: k701, direction: in, kind: energy}

blocks:
  - id: RXN
    title: MTO reactor, catalyst regenerator and feed vaporiser
    class: ReactingChemicals
    ports:
      - {id: fresh, direction: in}
      - {id: rec, direction: in}
      - {id: air, direction: in}
      - {id: gas, direction: out}
      - {id: flue, direction: out}
      - {id: mps, direction: in, kind: energy}
      - {id: hps1, direction: out, kind: energy}
      - {id: hps2, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: QW
    title: Quench, oxygenate scrubbing and oxygenate stripper
    class: SeparatingByThermalProcess
    ports:
      - {id: gas_in, direction: in}
      - {id: ko1, direction: in}
      - {id: ko2, direction: in}
      - {id: gas_out, direction: out}
      - {id: rec, direction: out}
      - {id: water, direction: out}
      - {id: cw1, direction: out, kind: energy}
      - {id: lps, direction: in, kind: energy}
      - {id: cw2, direction: out, kind: energy}
  - id: CGC
    title: Product gas compression, caustic wash and drying
    class: Compressing
    ports:
      - {id: gas_in, direction: in}
      - {id: caustic, direction: in}
      - {id: ko1, direction: out}
      - {id: ko2, direction: out}
      - {id: spent, direction: out}
      - {id: gas_out, direction: out}
      - {id: power1, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: power2, direction: in, kind: energy}
      - {id: cw2, direction: out, kind: energy}
  - id: REC
    title: Olefin recovery train and refrigeration
    class: Distilling
    ports:
      - {id: feed, direction: in}
      - {id: ethylene, direction: out}
      - {id: propylene, direction: out}
      - {id: c4, direction: out}
      - {id: c5, direction: out}
      - {id: fuel, direction: out}
      - {id: lps1, direction: in, kind: energy}
      - {id: lps2, direction: in, kind: energy}
      - {id: lps3, direction: in, kind: energy}
      - {id: lps4, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: cw3, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: cw4, direction: out, kind: energy}

steps:
  # --- RXN
  - id: M101
    block: RXN
    title: Methanol feed and oxygenate recycle
    class: Mixing
    ports:
      - {id: fresh, direction: in, delegates: fresh}
      - {id: rec, direction: in, delegates: rec}
      - {id: out, direction: out}
  - id: E101
    block: RXN
    title: Methanol feed vaporiser and superheater
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: mps}
  - id: R100
    block: RXN
    title: Recycled DME counted as methanol equivalents (model step of R-101)
    class: ReactingChemicals
    reactor: conversion
    reactions: [DME_HYD]
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: R101
    block: RXN
    title: MTO fluidised-bed reactor (SAPO-34, 748 K, 239 kPa(a)) with catalyst cooler
    class: ReactingChemicals
    reactor: conversion
    reactions: [MTO_C2H4, MTO_C3H6, MTO_C4H8, MTO_C5H10, MTO_C4H6, MTO_CH4, MTO_C2H6, MTO_C3H8, MTO_C4H10, MTO_COKE, MTO_DME, MTO_CO, MTO_CO2]
    selectivity:
      key: MEOH
      conversion: 0.995
      products: {C2H4: 0.168341709, C3H6: 0.149078727, C4H8: 0.023869347, C5H10: 0.010050251, C4H6: 0.001482412, CH4: 0.008542714, C2H6: 0.003266332, C3H8: 0.001005025, C4H10: 0.000025126, COKE: 0.028643216, DME: 0.005276382, CO: 0.004522613, CO2: 0.002512563}
      provenance: given
      source: "US 7 138 557 B2 (UOP), Table 1: 99.5 % methanol conversion and the yield structure in mass-% of methanol equivalent, read as shares of the converted methanol's carbon; 'others' (1.29) split ASSUMED into CO 0.45, CO2 0.25, butadiene 0.59 (D-005)"
    energy_port: steam
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: steam, direction: out, kind: energy, delegates: hps1}
  - id: X101
    block: RXN
    title: Reactor cyclones and spent catalyst stripper
    class: SeparatingByPhysicalProcess
    recovery:
      outlets: {coke: {COKE: 1.0}}
      provenance: assumed
      source: "D-007: all coke leaves with the spent catalyst to the regenerator; the product gas leaves the cyclones free of catalyst (fines not modelled), ASSUMED"
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out, delegates: gas}
      - {id: coke, direction: out}
  - id: K201
    block: RXN
    title: Regeneration air blower
    class: Compressing
    links: [{target: equipment, ref: K-201}]
    ports:
      - {id: in, direction: in, delegates: air}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: R201
    block: RXN
    title: Catalyst regenerator (fluidised bed, 923 K) with catalyst cooler and flue gas cooler
    class: ReactingChemicals
    reactor: conversion
    reactions: [REGEN]
    energy_port: steam
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: coke, direction: in}
      - {id: air, direction: in}
      - {id: out, direction: out, delegates: flue}
      - {id: steam, direction: out, kind: energy, delegates: hps2}
  # --- QW
  - id: T201
    block: QW
    title: Quench tower and oxygenate (DME) scrubber
    class: SeparatingByThermalProcess
    recovery:
      outlets: {water: {H2O: 0.986, MEOH: 0.999, DME: 0.99}}
      provenance: assumed
      source: "D-008: water condensed down to saturation at 313 K and 200 kPa(a) (scripts/balance.py), methanol and DME scrubbed out of the gas (US 7 138 557 B2: quench to 40 C, DME absorption), ASSUMED"
    links: [{target: equipment, ref: T-201}, {target: equipment, ref: T-202}]
    ports:
      - {id: in, direction: in, delegates: gas_in}
      - {id: gas, direction: out, delegates: gas_out}
      - {id: water, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: M201
    block: QW
    title: Process water collection
    class: Mixing
    ports:
      - {id: a, direction: in}
      - {id: b, direction: in, delegates: ko1}
      - {id: c, direction: in, delegates: ko2}
      - {id: out, direction: out}
  - id: T202
    block: QW
    title: Oxygenate stripper (methanol and DME recycled to the reactor)
    class: Distilling
    recovery:
      outlets: {ovhd: {MEOH: 0.999, DME: 1.0, H2O: 0.01}}
      provenance: assumed
      source: "D-008: the oxygenates stripped from the reaction water with 1 % of the water, and recycled (US 7 138 557 B2: oxygenate recovery and recycle to the MTO reactor), ASSUMED"
    links: [{target: equipment, ref: T-203}]
    ports:
      - {id: in, direction: in}
      - {id: ovhd, direction: out, delegates: rec}
      - {id: bot, direction: out, delegates: water}
      - {id: reb, direction: in, kind: energy, delegates: lps}
      - {id: cond, direction: out, kind: energy, delegates: cw2}
  # --- CGC
  - id: K301
    block: CGC
    title: Product gas compressor stages 1-3 with intercoolers
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-301}]
    ports:
      - {id: in, direction: in, delegates: gas_in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power1}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: V301
    block: CGC
    title: Stage 3 discharge drum
    class: SeparatingByPhaseSeparation
    recovery:
      outlets: {water: {H2O: 0.79}}
      provenance: assumed
      source: "D-009: water condensed down to saturation at 313 K and 900 kPa(a) (scripts/balance.py); no hydrocarbon condensate (ASSUMED)"
    links: [{target: equipment, ref: V-301}]
    ports:
      - {id: in, direction: in}
      - {id: water, direction: out, delegates: ko1}
      - {id: gas, direction: out}
  - id: R310
    block: CGC
    title: Caustic tower (CO2 neutralised)
    class: ReactingChemicals
    reactor: conversion
    reactions: [CAUSTIC]
    links: [{target: equipment, ref: T-310}]
    ports:
      - {id: gas, direction: in}
      - {id: caustic, direction: in, delegates: caustic}
      - {id: out, direction: out}
  - id: V310
    block: CGC
    title: Caustic tower liquor draw-off
    class: SeparatingByPhaseSeparation
    recovery:
      outlets: {spent: {NAOH: 1.0, NA2CO3: 1.0, H2O: 0.98}}
      provenance: assumed
      source: "D-009: the liquor leaves with all sodium salts; the gas leaves near saturation (ASSUMED)"
    links: [{target: equipment, ref: T-310}]
    ports:
      - {id: in, direction: in}
      - {id: spent, direction: out, delegates: spent}
      - {id: gas, direction: out}
  - id: K302
    block: CGC
    title: Product gas compressor stages 4-5 with aftercooler
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-301}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power2}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  - id: D320
    block: CGC
    title: Product gas dryers (molecular sieve)
    class: Adsorbing
    recovery:
      outlets: {water: {H2O: 1.0}}
      provenance: assumed
      source: "D-009: dried to a ppm residue, ASSUMED"
    links: [{target: equipment, ref: D-320}]
    ports:
      - {id: in, direction: in}
      - {id: water, direction: out, delegates: ko2}
      - {id: out, direction: out, delegates: gas_out}
  # --- REC
  - id: T401
    block: REC
    title: Deethaniser (front end)
    class: Distilling
    recovery:
      outlets: {ovhd: {H2: 1.0, CO: 1.0, CO2: 1.0, CH4: 1.0, C2H4: 0.999, C2H6: 0.995, C3H6: 0.001}}
      provenance: assumed
      source: "D-010: sharp C2/C3 split, ASSUMED"
    links: [{target: equipment, ref: T-401}]
    ports:
      - {id: in, direction: in, delegates: feed}
      - {id: ovhd, direction: out}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: lps1}
      - {id: cond, direction: out, kind: energy}
  - id: T402
    block: REC
    title: Demethaniser
    class: Distilling
    recovery:
      outlets: {ovhd: {H2: 1.0, CO: 1.0, CO2: 1.0, CH4: 0.995, C2H4: 0.002}}
      provenance: assumed
      source: "D-010: 0.2 % of the ethylene lost to the tail gas, ASSUMED"
    links: [{target: equipment, ref: T-402}]
    ports:
      - {id: in, direction: in}
      - {id: ovhd, direction: out}
      - {id: bot, direction: out}
      - {id: cond, direction: out, kind: energy}
  - id: T403
    block: REC
    title: C2 splitter
    class: Distilling
    recovery:
      outlets: {top: {CH4: 1.0, C2H4: 0.997, C2H6: 0.002}}
      provenance: assumed
      source: "D-010: polymer-grade ethylene overhead, ethane bottoms to fuel, ASSUMED"
    links: [{target: equipment, ref: T-403}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out, delegates: ethylene}
      - {id: bot, direction: out}
      - {id: cond, direction: out, kind: energy}
  - id: T501
    block: REC
    title: Depropaniser
    class: Distilling
    recovery:
      outlets: {ovhd: {C2H4: 1.0, C2H6: 1.0, C3H6: 0.998, C3H8: 0.99, DME: 0.9, C4H8: 0.002, C4H6: 0.001}}
      provenance: assumed
      source: "D-010: C3/C4 split; the residual DME mostly overhead (it boils between propane and the butenes), ASSUMED"
    links: [{target: equipment, ref: T-501}]
    ports:
      - {id: in, direction: in}
      - {id: ovhd, direction: out}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: lps2}
      - {id: cond, direction: out, kind: energy, delegates: cw1}
  - id: T502
    block: REC
    title: C3 splitter
    class: Distilling
    recovery:
      outlets: {top: {C2H4: 1.0, C2H6: 1.0, C3H6: 0.985, C3H8: 0.05}}
      provenance: assumed
      source: "D-010: polymer-grade propylene overhead; propane, DME and 1.5 % of the propylene in the bottoms to fuel, ASSUMED"
    links: [{target: equipment, ref: T-502}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out, delegates: propylene}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: lps3}
      - {id: cond, direction: out, kind: energy, delegates: cw2}
  - id: T503
    block: REC
    title: Debutaniser
    class: Distilling
    recovery:
      outlets: {top: {C3H6: 1.0, C3H8: 1.0, DME: 1.0, C4H8: 0.99, C4H6: 0.99, C4H10: 0.99, C5H10: 0.02}}
      provenance: assumed
      source: "D-010: C4 cut overhead, C5+ bottoms, ASSUMED"
    links: [{target: equipment, ref: T-503}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out, delegates: c4}
      - {id: bot, direction: out, delegates: c5}
      - {id: reb, direction: in, kind: energy, delegates: lps4}
      - {id: cond, direction: out, kind: energy, delegates: cw3}
  - id: M401
    block: REC
    title: Tail gas header
    class: Mixing
    ports:
      - {id: a, direction: in}
      - {id: b, direction: in}
      - {id: c, direction: in}
      - {id: out, direction: out, delegates: fuel}
  - id: K701
    block: REC
    title: Propylene and ethylene refrigeration compressors
    class: Compressing
    links: [{target: equipment, ref: K-701}]
    ports:
      - {id: r401, direction: in, kind: energy}
      - {id: r402, direction: in, kind: energy}
      - {id: r403, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: cw, direction: out, kind: energy, delegates: cw4}

streams:
  # ---------------------------------------------------------------- reaction and regeneration
  - id: S1
    title: Fresh methanol
    from: MEOH.out
    to: M101.fresh
    template: feed
    state:
      design:
        temperature: {value: 313.15, provenance: assumed, source: D-003}
        pressure: {value: 500, provenance: assumed, source: D-003}
        flow: {value: 225000.0, provenance: assumed, source: "1800 kt/a methanol at 8000 h/a (D-002)"}
        composition: {basis: mass_fraction, values: {MEOH: 0.9985, DME: 0.0, H2O: 0.0015}, provenance: given, source: "US 7 138 557 B2, examples: the MTO feed 99.85 wt-% methanol in water (D-003)"}
  - id: S2
    title: Reactor feed (fresh methanol and oxygenate recycle)
    from: M101.out
    to: E101.in
    template: feed
    state:
      design:
        temperature: {value: 313.15, provenance: assumed, source: D-004}
        pressure: {value: 500, provenance: assumed, source: D-004}
        flow: {value: 229111.0, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S37', fingerprint: 60f13385c67aee90}
        composition: {basis: mole_fraction, values: {MEOH: 0.982423, DME: 0.00515978, H2O: 0.0124176}, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S37', fingerprint: e2289a1a95eba4ff}
  - id: S3
    title: Superheated methanol vapour
    from: E101.out
    to: R100.in
    template: feed
    state:
      design:
        temperature: {value: 473.15, provenance: assumed, source: "vapour feed at 200 C, D-004"}
        pressure: {value: 350, provenance: assumed, source: D-004}
        flow: {value: 229111.0, provenance: calculated, source: 'cheme process propagate: pass-through E101 from S2', fingerprint: 38592b4c5b03a038}
        composition: {basis: mole_fraction, values: {MEOH: 0.982423, DME: 0.00515978, H2O: 0.0124176}, provenance: calculated, source: 'cheme process propagate: pass-through E101 from S2', fingerprint: 38592b4c5b03a038}
  - id: S4
    title: Reactor feed, recycled DME as methanol equivalents
    from: R100.out
    to: R101.in
    template: feed
    state:
      design:
        temperature: {value: 473.15, provenance: assumed, source: D-006}
