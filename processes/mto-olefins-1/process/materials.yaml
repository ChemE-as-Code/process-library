  - {id: flue, title: Regenerator flue gas, components: [N2, O2, CO2, H2O, MEOH, DME, H2, CO, CH4, C2H4, C2H6, C3H6, C3H8, C4H6, C4H8, C4H10, C5H10, COKE]}
  - {id: caustic, title: Caustic wash liquor, components: [MEOH, DME, H2O, H2, CO, CO2, CH4, C2H4, C2H6, C3H6, C3H8, C4H6, C4H8, C4H10, C5H10, COKE, NAOH, NA2CO3]}
# property_method is a placeholder: no benchmarked property package of core covers the C2+
# hydrocarbons with methanol, DME and water (DESIGN.md L-1); nothing is filled.
property_method:
  adapter: thermo
  status: placeholder
