# Components and templates of the process. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
#
# Ideal-gas formation data and critical constants: copied from processes/ethylene-1 and
# processes/methanol-1 (the same `chemicals` 1.5.2 / `thermo` 0.6.1 values, sources on each
# entry), and `cheme chemistry thermo NAME --fit 298.15,1000` for dimethyl ether and 1-pentene.
# Package values are single facts with their source, not open data (library ADR 0037,
# DESIGN.md SRC-6).
#
# Lumped representatives (DESIGN.md D-005): C4H8 (1-butene) stands for all butylenes, C4H6
# (1,3-butadiene) for the dienes, C5H10 (1-pentene) for the C5+ fraction of the reactor
# product, COKE (carbon) for the coke laid down on the catalyst and burnt off in the
# regenerator. NaOH and Na2CO3 occur only dissolved in the caustic wash liquor.
schema: cheme/process/v1
kind: materials
