cutoff:
- key: emission-excluded:furnace-combustion
  title: combustion emissions of the plant
  direction: output
  reason: 'R101 burns hydrogen in chlorine: no air and no carbon enter the flame (chlor-alkali-1''s chlorine
    carries O2 only), so no NOx, CO, CO2, CH4, N2O or particulates form; its products are all in the balance
    (S3). Real cell chlorine carries traces of N2 and CO2, not modelled (D-003)'
  source: D-013
- key: emission-excluded:non-routine
  title: non-routine emissions of the plant
  direction: output
  reason: start-up (purging, ignition with excess hydrogen), shutdown and burner trips send hydrogen and
    HCl/Cl2-bearing gas to the scrubber and vent; not estimated at the concept stage (D-013)
  source: D-013
- key: emission-excluded:tanks
  title: storage-tank emissions of the plant
  direction: output
  reason: acid storage is outside the boundary (D-001); its breathing is normally scrubbed (ASSUMED)
