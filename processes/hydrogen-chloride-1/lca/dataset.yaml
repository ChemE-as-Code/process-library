allocation:
  method: shares
  coproducts:
  - HCLACID
  - STEAM
  shares:
    HCLACID: 1.0
    STEAM: 0.0
  substitution:
    STEAM:
      source: Q1, D-007, D-013
      missing: 'not linked yet: heat from steam at 1000 kPa(a) from a natural-gas boiler at the site (the
        displaced supply), per kWh of steam heat'
  source: 'D-013: the exported steam (Q1, 2 195 kW = 0.665 kWh per kg HCl) is the only co-product. All
    burdens are given to the acid; the steam leaves without a burden and without a credit (conservative
    for the acid), as nitric-acid-1 does for its exported steam (its DESIGN.md, decision 14).'
  deviation: 'The library hierarchy allocates exported steam by energy or exergy. Neither applies here:
    the acid has no energy content, so energy allocation would put every burden on the steam, and no property
    package covers HCl-water, so the acid''s exergy cannot be calculated; the steam is counted in kWh,
    so the WBCSD price ratio does not apply either. Shares 1/0 until the exergy of both products is available
    (DESIGN.md D-013).'
