# Goal and scope of the hydrogen-chloride-1 LCI. Schema: `cheme schema lca`. Outputs: `cheme
# assess lca --inventory --write` (lca/inventory.csv, dataset.yaml, gaps.csv, manifest.json);
# never edit those by hand.
#
# A preliminary gate-to-gate inventory (DESIGN.md D-013): every foreground exchange of the
# balanced flowsheet per kg of HCl (100 %) contained in 33 wt-% hydrochloric acid. No
# background is linked yet: every feed, utility and the steam credit is declared `missing:`
# with the activity it should connect to later, so it is a gap in every category, never 0. No
# values from licensed databases are used.
schema: cheme/lca/v1
kind: lca
goal: >-
  Preliminary gate-to-gate life cycle inventory of hydrochloric acid (33 wt-%) by direct
  synthesis from chlorine and hydrogen with steam recovery, for the concept stage: the
  foreground exchanges of the balanced flowsheet (D-006) per kg of contained HCl, ready to be
  linked to background datasets (chlor-alkali-1's chlorine and hydrogen first). No impact
  assessment is claimed.
# 1 kg of contained HCl: the product S9 is 10 000 kg/h of acid holding 3 300 kg/h HCl
functional_unit: {product: HCLACID, amount: 1, unit: kg, kg_per_unit: 3.030303, source: "S9: 10 000 kg/h acid at 33.0 wt-% HCl holds 3 300 kg/h HCl (1 / 0.33 kg acid per kg HCl)"}
boundary: gate-to-gate
year: 2026
location: GLO
technology: "HCl synthesis burner with steam-raising furnace (1000 kPa(a)), graphite falling-film absorber and water tail gas scrubber; 26.4 kt/a HCl as 33 wt-% acid; chlorine and hydrogen from an adjacent membrane-cell chlor-alkali plant"
rights: "CC-BY-4.0: the ChemE-as-Code process library's own concept design (LICENSE-DATA)"
case: design
system_model: cutoff   # D-013: the exported steam is allocated (shares), never credited
allocation:
  method: shares
  coproducts: [HCLACID, STEAM]
  shares: {HCLACID: 1.0, STEAM: 0.0}
  source: >-
    D-013: the exported steam (Q1, 2 195 kW = 0.665 kWh per kg HCl) is the only co-product.
    All burdens are given to the acid; the steam leaves without a burden and without a credit
    (conservative for the acid), as nitric-acid-1 does for its exported steam (D-014 there).
  deviation: >-
    The library hierarchy allocates exported steam by energy or exergy. Neither applies here:
    the acid has no energy content, so energy allocation would put every burden on the steam,
    and no property package covers HCl-water (core#364), so the acid's exergy cannot be
    calculated; the steam is counted in kWh, so the WBCSD price ratio does not apply either.
    Shares 1/0 until the exergy of both products is available (DESIGN.md D-013).
  # substitution (system expansion), for comparison only: the avoided site steam is not mapped.
  substitution:
    STEAM: {missing: "not linked yet: heat from steam at 1000 kPa(a) from a natural-gas boiler at the site (the displaced supply), per kWh of steam heat", source: "Q1, D-007, D-013"}
flows:
  # raw materials (boundary feeds made by other library processes, D-003)
  - {key: feed:CL2, missing: "not linked yet: dry chlorine gas from membrane-cell chlor-alkali electrolysis at the plant gate; link processes/chlor-alkali-1 lca/dataset.yaml (product CL2, its allocation D-013 there) or a market for chlorine, gaseous", source: "S1, D-003"}
  - {key: feed:H2, missing: "not linked yet: wet hydrogen, co-product of membrane-cell chlor-alkali electrolysis at the plant gate; link processes/chlor-alkali-1 lca/dataset.yaml (product H2) or hydrogen-1 / a market for hydrogen; the water it carries is part of the feed", source: "S2, D-003"}
  - {key: feed:DMW, missing: "not linked yet: demineralised (deionised) water production by ion exchange or reverse osmosis", source: "S7, D-008"}
  # utilities
  - {key: feed:POWER, missing: "not linked yet: grid electricity, medium voltage, for the site's market (site not decided, D-002); the packaged open profile desnz-ghg-2026 is available for a later screening", source: "Q2, Q4; D-011"}
  - {key: product:CW, missing: "not linked yet: heat rejection to a recirculating cooling-water circuit with cooling tower (pump and fan electricity, make-up water, treatment chemicals) per kWh removed", source: "Q3; D-010"}
  # emissions: the vent S8 goes to air
  - {key: product:VENT, emission: true, source: "S8: tail gas scrubber vent, excess hydrogen with water vapour and HCl traces, to air (D-008)"}
  - {key: emission:H2, elementary: {compartment: air}, source: "S8: excess hydrogen of the burner (10 mol-%, D-004) vented to air; an indirect greenhouse gas without a characterisation in most methods"}
  - {key: emission:HCl, elementary: {compartment: air}, source: "S8: hydrogen chloride after the tail gas scrubber, 10 mg/Nm3 ASSUMED (D-008)"}
  - {key: emission:H2O, free: true, source: "S8: water vapour of the vent"}
  # components of the vent that are absent (0 kg) in this balance
  - {key: emission:Cl2, free: true, source: "0 kg: Cl2 fully converted in R101 (D-005); free chlorine in the vent at upsets is excluded below (non-routine)"}
  - {key: emission:O2, free: true, source: "0 kg: the O2 of the chlorine burns to water in R101 (D-005)"}
operation: {hours_per_year: 8000, life_years: 20, source: "design basis, D-002; life ASSUMED"}
emission_exclusions:
  - {id: furnace-combustion, method: combustion, reason: "R101 burns hydrogen in chlorine: no air and no carbon enter the flame (chlor-alkali-1's chlorine carries O2 only), so no NOx, CO, CO2, CH4, N2O or particulates form; its products are all in the balance (S3). Real cell chlorine carries traces of N2 and CO2, not modelled (D-003)", source: "D-013"}
  - {id: non-routine, method: non-routine, reason: "start-up (purging, ignition with excess hydrogen), shutdown and burner trips send hydrogen and HCl/Cl2-bearing gas to the scrubber and vent; not estimated at the concept stage (D-013)", source: "D-013"}
  - {id: tanks, method: storage-tank, reason: "acid storage is outside the boundary (D-001); its breathing is normally scrubbed (ASSUMED)", source: "D-013"}
  - {id: leaks, method: equipment-leaks, reason: "fugitive Cl2, H2 and HCl from flanges and seals are not estimated at the concept stage; to be added with the P&IDs", source: "D-013"}
dataset:
  version: 0.1.0
  geography: {description: "One concept design for an undecided site next to a chlor-alkali plant; no site-specific supply", site: "generic industrial site adjacent to chlor-alkali-1"}
  system_model: cutoff
  technology_level: current
  classification: {isic: "2011"}
  modelling: {principle: attributional}
  review: unreviewed
  data_generator: "ChemE-as-Code process library, hydrogen-chloride-1 concept design (agent run, unreviewed)"
