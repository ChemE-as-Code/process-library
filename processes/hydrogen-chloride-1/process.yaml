# Process Atlas manifest of hydrogen-chloride-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: hydrogen-chloride-1
title: Hydrogen chloride synthesis burner and absorption (33 wt-% hydrochloric acid, steam recovery)
summary: >-
  Chlorine burnt in a 10 % excess of hydrogen in a steam-raising synthesis furnace, the HCl gas
  absorbed in a water-cooled graphite falling-film absorber to 33 wt-% hydrochloric acid and the
  tail gas scrubbed with the absorption water; chlorine and hydrogen from chlor-alkali-1.
  Concept stage, 26.4 kt/a HCl, assumed basis.
description: |
  Dry chlorine and wet hydrogen from the adjacent membrane-cell chlor-alkali plant
  (chlor-alkali-1) burn in the synthesis furnace; the hydrogen excess consumes all chlorine and
  the oxygen the chlorine carries. The furnace raises steam at 1000 kPa(a) from the reaction
  heat and sends the HCl gas at about 250 degC to an isothermal falling-film absorber, where it
  dissolves in weak acid from the tail gas scrubber to 33 wt-% acid. All absorption water
  passes the scrubber first; the excess hydrogen leaves through the vent.

  All values are concept estimates. The furnace outlet and duty are calculated by cheme
  (complete conversion at the equilibrium limit); the absorber and scrubber are specified
  values from an independent balance script, and the acid's enthalpy rests on an assumed heat
  of solution because no ChemE-as-Code property method covers HCl-water yet.
  See DESIGN.md of the engineering files for every assumption and gated step.
families: [chlor-alkali]
keywords: [hydrogen chloride, hydrochloric acid, HCl synthesis, burner, graphite absorber, falling-film absorption, tail gas scrubber, steam recovery, chlorine, hydrogen]
facets:
  feedstock_basis: [electricity, mineral]
  product_classes: [chemicals]
  unit_operations: [reaction, absorption, heat-exchange]
  region: generic
# Honest claim: concept is the lowest level of the manifest; cheme maturity reports level none
# (feed states taken over from chlor-alkali-1, where they are assumed; absorber and scrubber
# specified values), see validation.notes and DESIGN.md D-006.
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD with closed mass, component and element balances (cheme validate, cheme process
    streams). The furnace outlet is calculated by cheme (conversion reactor, complete Cl2 and O2
    conversion justified by K = 2.6e19 at 523 K) and cheme's reactor duty (2 268 kW released)
    equals the independent script's; the steam export follows from it with an assumed 3 % heat
    loss. cheme maturity reaches no level yet: the feeds are chlor-alkali-1's assumed product
    states, the absorber and scrubber are specified values, and energy closure is not evaluable
    in core (no property package covers Cl2/HCl gas or HCl-water). The preliminary gate-to-gate
    LCI closes in mass and elements; every background is a gap. Not reviewed. Main products and
    feeds are listed under chemistry with their chemicals registry entries (issue #251).
chemistry:
  inputs:
    - {chemical: chlorine, role: feedstock, note: "feed:CL2, dry chlorine gas from chlor-alkali-1, 0.980 kg per kg HCl"}
    # no inventory_key on the two feeds: the Atlas build would link them by their registry slug,
    # and feed:H2 is wet gas (0.679 kg H2 per kg) and feed:DMW demineralised, not raw, water;
    # both stay gaps until the shared vocabulary has fitting entries (lca/mappings.yaml, D-013)
    - {chemical: hydrogen, role: feedstock, note: "Wet hydrogen from chlor-alkali-1 (feed:H2: 0.0464 kg wet gas = 0.0315 kg H2 per kg HCl), 10 mol-% excess"}
    - {chemical: water, role: feedstock, note: "Demineralised water for the absorption (feed:DMW), 2.0 kg per kg HCl"}
  outputs:
    - {chemical: hydrogen-chloride, role: main-product, inventory_key: "product:HCLACID", note: "Hydrochloric acid 33 wt-% to storage, counted by mass of the acid (3.03 kg per kg HCl)"}
    - {chemical: steam, role: co-product, inventory_key: "product:STEAM", note: "Steam 1000 kPa(a) raised in the synthesis furnace, about 1.0 t per t HCl (0.665 kWh/kg HCl); allocation share 0 (D-013)"}
    - {chemical: hydrogen, role: emission, inventory_key: "emission:H2", note: "Excess hydrogen vented after the tail gas scrubber, 2.9 g per kg HCl"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "Pumps, instruments and analysers (ASSUMED)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "25/35 C (ASSUMED), absorber cooling"}
basis:
  capacity: "10 t/h hydrochloric acid 33 wt-% = 26.4 kt/a HCl (100 %) (ASSUMED)"
  operating_hours_per_year: 8000
  location: generic (not chosen), adjacent to a chlor-alkali plant
references:
  - {title: "Hydrochloric Acid. Ullmann's Encyclopedia of Industrial Chemistry, Wiley-VCH (route identity from issue #137; full text not read)", doi: 10.1002/14356007.a13_283}
  - {title: "Chase, M. W. (1998) NIST-JANAF Thermochemical Tables, 4th ed., J. Phys. Chem. Ref. Data Monograph 9 (tables Cl-026 HCl, H-064 H2O)", url: "https://janaf.nist.gov/tables/Cl-026.html"}
  - {title: "US 9 415 364 B2: Facility and reactor for directly synthesizing hydrochloric acid from hydrogen and chlorine with heat recovery", url: "https://patents.google.com/patent/US9415364B2/en"}
  - {title: "US 2004/0175323 A1: Process and apparatus for preparing hydrogen chloride (cites EP 0 362 666 B1 on the hydrogen excess)", url: "https://patents.google.com/patent/US20040175323A1/en"}
lca:
