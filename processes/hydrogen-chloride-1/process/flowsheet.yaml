# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Hydrogen chloride synthesis burner with steam recovery and graphite absorption to 33 wt-%
# hydrochloric acid, chlorine and hydrogen from chlor-alkali-1 (DESIGN.md D-001..D-003).
# Where the values come from:
# - feeds: the states of chlor-alkali-1's chlorine (S42) and hydrogen (S44) products (D-003);
# - the furnace outlet S3 is calculated by cheme (equilibrium reactor R101, D-005) from the
#   feeds and its assumed outlet temperature;
# - the absorption streams, the vent and the duties come from the independent balance
#   scripts/balance.py (D-006), run with `cheme run scripts/balance.py`, given as ASSUMED; its
#   inputs are sourced or ASSUMED in DESIGN.md;
# - the acid is an electrolyte: its enthalpy is not calculated by cheme; the
#   absorber duty rests on a heat of solution in scripts/balance.py (D-009).
schema: cheme/process/v1
kind: flowsheet
title: Hydrogen chloride synthesis and absorption (10 t/h hydrochloric acid 33 wt-%)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 10 000 kg/h hydrochloric acid 33 wt-% (3 300 kg/h HCl) at the gate, 8000 h/a, 10 mol-% hydrogen excess (D-002, D-004)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: CL2, title: "Dry chlorine gas from chlor-alkali-1 (S42 there, 400 kPa(a))", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: H2, title: "Wet hydrogen from chlor-alkali-1 (S44 there, 140 kPa(a))", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: DMW, title: Demineralised water for absorption, category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power (AC, grid)
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: p201, direction: out, kind: energy}
products:
  - {id: HCLACID, title: Hydrochloric acid 33 wt-% to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: VENT, title: Tail gas scrubber vent to atmosphere (excess hydrogen), category: emission, ports: [{id: in, direction: in}]}
  - id: STEAM
    title: Steam 1000 kPa(a) raised in the synthesis furnace (export)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1000, provenance: assumed, source: "D-007: inside the 7-16 bar range of US 9 415 364 B2 (Background); matches chlor-alkali-1's MP steam level"}
      supply_temperature: {value: 453.0, provenance: assumed, source: "saturation at 1000 kPa(a) (IAPWS-IF97), D-007"}
      min_approach: {value: 10, provenance: assumed, source: D-007}
    ports: [{id: r101, direction: in, kind: energy}]
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: D-010}
      return_temperature: {value: 308.15, provenance: assumed, source: D-010}
      min_approach: {value: 5, provenance: assumed, source: D-010}
    ports: [{id: c201, direction: in, kind: energy}]

blocks:
  - id: SYN
    title: HCl synthesis and steam recovery
    class: ReactingChemicals
    ports:
      - {id: cl2, direction: in}
      - {id: h2, direction: in}
      - {id: gas, direction: out}
      - {id: steam, direction: out, kind: energy}
      - {id: aux, direction: in, kind: energy}
  - id: ABS
    title: Absorption and tail gas scrubbing
    class: Absorbing
    ports:
      - {id: gas, direction: in}
      - {id: dmw, direction: in}
      - {id: acid, direction: out}
      - {id: vent, direction: out}
      - {id: cw, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}

steps:
  # SYN: burner, combustion chamber and steam-raising tube register in one unit (D-005, D-007)
  - id: R101
    block: SYN
    title: HCl synthesis burner and furnace with steam generation
    class: ReactingChemicals
    reactions: [HCL_SYN, H2_OX]
    # complete conversion of Cl2 and O2: the equilibrium limit at the outlet (D-005); the
    # equilibrium reactor itself does not converge with K of order 1e19 and 1e40
    reactor: conversion
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: cl2, direction: in, delegates: cl2}
      - {id: h2, direction: in, delegates: h2}
      - {id: out, direction: out, delegates: gas}
      - {id: steam, direction: out, kind: energy, delegates: steam}
      - {id: aux, direction: in, kind: energy, delegates: aux}
  # ABS: isothermal falling-film absorber, tail gas scrubber, product pump (D-008)
  - id: C201
    block: ABS
    title: Falling-film absorber (graphite, water-cooled)
    class: Absorbing
    links: [{target: equipment, ref: C-201}]
    ports:
      - {id: gas, direction: in, delegates: gas}
      - {id: weak, direction: in}
      - {id: acid, direction: out}
      - {id: tail, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: C202
    block: ABS
    title: Tail gas scrubber (packed, demineralised water)
    class: Absorbing
    links: [{target: equipment, ref: C-202}]
    ports:
      - {id: tail, direction: in}
      - {id: dmw, direction: in, delegates: dmw}
      - {id: weak, direction: out}
      - {id: vent, direction: out, delegates: vent}
  - id: P201
    block: ABS
    title: Product acid pump
    class: GeneratingFlow
    links: [{target: equipment, ref: P-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: acid}
      - {id: power, direction: in, kind: energy, delegates: power}

# Material streams: flow (kg/h) and composition (mass fractions) from scripts/balance.py
# (D-006) unless calculated by cheme; temperatures and pressures are design choices (D-007,
# D-008), ASSUMED.
streams:
  - {id: S1, title: Chlorine feed, from: CL2.out, to: R101.cl2, template: gas, state: {design: {temperature: {value: 313.15, provenance: assumed, source: "chlor-alkali-1 S42 delivery, D-003"}, pressure: {value: 400.0, provenance: assumed, source: "chlor-alkali-1 S42 delivery, D-003"}, flow: {value: 3235.03, basis: mass, provenance: assumed, source: "scripts/balance.py: Cl2 for 3 300 kg/h HCl in the acid plus the vent loss (D-002, D-006)"}, composition: {basis: mass_fraction, values: {Cl2: 0.9918815, O2: 0.0081185}, provenance: assumed, source: "chlor-alkali-1 S42 composition (dry Cl2 with 1.8 vol-% O2), D-003"}}}}
  - {id: S2, title: Hydrogen feed, from: H2.out, to: R101.h2, template: gas, state: {design: {temperature: {value: 337.19, provenance: assumed, source: "chlor-alkali-1 S44 delivery, D-003"}, pressure: {value: 140.0, provenance: assumed, source: "chlor-alkali-1 S44 delivery, D-003"}, flow: {value: 153.17, basis: mass, provenance: assumed, source: "scripts/balance.py: 10 mol-% H2 excess over Cl2 + 2 O2 (D-004)"}, composition: {basis: mass_fraction, values: {H2: 0.6789415, H2O: 0.3210585}, provenance: assumed, source: "chlor-alkali-1 S44 composition (wet hydrogen), D-003"}}}}
  - id: S3
    title: Furnace gas to the absorber
    from: R101.out
    to: C201.gas
    template: gas
    state:
      design:
        temperature: {value: 523.15, provenance: assumed, source: "D-007: gas leaving the steam-raising tube register, about 250 degC (US 9 415 364 B2, Description)"}
        pressure: {value: 130.0, provenance: assumed, source: D-007}
        flow: {value: 3388.2, provenance: calculated, source: 'cheme process propagate: reactor R101 from S1 S2', fingerprint: 50464d96d9a43dfc}
        composition: {basis: mole_fraction, values: {Cl2: 0.0, O2: 0.0, H2: 0.0470904, H2O: 0.0439031, HCl: 0.909006}, provenance: calculated, source: 'cheme process propagate: reactor R101 from S1 S2', fingerprint: cb20873e1ba1f98c}
  - {id: S4, title: Acid from the absorber, from: C201.acid, to: P201.in, template: aqueous, state: {design: {temperature: {value: 313.15, provenance: assumed, source: D-008}, pressure: {value: 120.0, provenance: assumed, source: D-008}, flow: {value: 10000.0, basis: mass, provenance: assumed, source: "design basis, D-002"}, composition: {basis: mass_fraction, values: {HCl: 0.33, H2O: 0.67}, provenance: assumed, source: "design basis, D-002"}}}}
  - {id: S5, title: Absorber tail gas, from: C201.tail, to: C202.tail, template: gas, state: {design: {temperature: {value: 313.15, provenance: assumed, source: D-008}, pressure: {value: 120.0, provenance: assumed, source: D-008}, flow: {value: 31.49, basis: mass, provenance: assumed, source: "scripts/balance.py: 0.5 % of the HCl unabsorbed, water-saturated at 40 degC (D-008)"}, composition: {basis: mass_fraction, values: {HCl: 0.5239055, H2: 0.3001856, H2O: 0.1759089}, provenance: assumed, source: scripts/balance.py}}}}
  - {id: S6, title: Weak acid to the absorber, from: C202.weak, to: C201.weak, template: aqueous, state: {design: {temperature: {value: 303.15, provenance: assumed, source: D-008}, pressure: {value: 130.0, provenance: assumed, source: D-008}, flow: {value: 6643.29, basis: mass, provenance: assumed, source: scripts/balance.py}, composition: {basis: mass_fraction, values: {HCl: 0.0024835, H2O: 0.9975165}, provenance: assumed, source: scripts/balance.py}}}}
  - {id: S7, title: Demineralised water, from: DMW.out, to: C202.dmw, template: aqueous, state: {design: {temperature: {value: 298.15, provenance: assumed, source: D-008}, pressure: {value: 300.0, provenance: assumed, source: D-008}, flow: {value: 6624.81, basis: mass, provenance: assumed, source: "scripts/balance.py: water of the acid and the vent less the feed and reaction water (D-006)"}, composition: {basis: mass_fraction, values: {H2O: 1.0}, provenance: assumed, source: D-008}}}}
  - {id: S8, title: Vent to atmosphere, from: C202.vent, to: VENT.in, template: gas, state: {design: {temperature: {value: 303.15, provenance: assumed, source: D-008}, pressure: {value: 105.0, provenance: assumed, source: D-008}, flow: {value: 13.02, basis: mass, provenance: assumed, source: "scripts/balance.py: excess H2, water-saturated at 30 degC, 10 mg HCl/Nm3 (D-008)"}, composition: {basis: mass_fraction, values: {HCl: 0.0000842, H2: 0.7263262, H2O: 0.2735896}, provenance: assumed, source: scripts/balance.py}}}}
  - {id: S9, title: Hydrochloric acid 33 wt-% product, from: P201.out, to: HCLACID.in, template: aqueous, state: {design: {temperature: {value: 313.15, provenance: assumed, source: D-008}, pressure: {value: 250.0, provenance: assumed, source: D-008}, flow: {value: 10000.0, basis: mass, provenance: assumed, source: "design basis, D-002"}, composition: {basis: mass_fraction, values: {HCl: 0.33, H2O: 0.67}, provenance: assumed, source: "design basis, D-002"}}}}
  # Energy streams (duties from scripts/balance.py, D-006, D-007, D-010, D-011)
  - {id: Q1, title: Steam raised in the furnace, kind: energy, from: R101.steam, to: STEAM.r101, state: {design: {duty: {value: 2195.1, provenance: assumed, source: "scripts/balance.py: heat released less outlet sensible heat and 3 % loss; 3 383 kg/h steam 1000 kPa(a) from BFW at 378 K (D-007)"}}}}
  - {id: Q2, title: "Boiler feed water pump, burner management and analysers", kind: energy, from: POWER.r101, to: R101.aux, state: {design: {duty: {value: 4.98, provenance: assumed, source: "scripts/balance.py: BFW pump eta 0.5 plus 3 kW ASSUMED (D-011)"}}}}
  - {id: Q3, title: Absorber cooling water duty, kind: energy, from: C201.cw, to: CW.c201, state: {design: {duty: {value: 1671.6, provenance: assumed, source: "scripts/balance.py: gas cooling, condensation and heat of solution -61.4 kJ/mol HCl (D-009)"}}}}
  - {id: Q4, title: Product acid pump power, kind: energy, from: POWER.p201, to: P201.power, state: {design: {duty: {value: 0.62, provenance: assumed, source: "scripts/balance.py: 130 kPa, eta 0.5 (D-011)"}}}}
layout: {bfd: {}, pfd: {}}
