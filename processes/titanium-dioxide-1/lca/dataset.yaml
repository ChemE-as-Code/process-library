schema: cheme/lci_dataset/v2
kind: lci_dataset
id: titanium-dioxide-by-the-chloride-process-100-kt-a-raw-rutile-tio2
title: Titanium dioxide by the chloride process (100 kt/a raw rutile TiO2)
description: Unallocated foreground LCI of Titanium dioxide by the chloride process (100 kt/a raw rutile
  TiO2), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Chloride process: fluidised-bed carbochlorination at 1273 K of an 88 wt% TiO2 slag and synthetic
  rutile blend with calcined petroleum coke, quench and cyclone for the blow-over and metal chlorides,
  TiCl4 condensation (cooling water, brine) and distillation, TiCl4 oxidation with 15 % excess oxygen
  preheated in fired heaters (adiabatic outlet about 2000 K), bag filter and direct chlorine recycle;
  off-gas scrubbed with water and caustic and its CO burnt in a thermal oxidiser; blow-over, still sludge
  and scrubber liquor neutralised with lime and filtered; 100 kt/a raw TiO2 at 8000 h'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:cos-so2
  title: combustion emissions of R-101, X-301
  direction: output
  reason: 'The coke''s sulfur (0.8-1.8 wt%, BREF LVIC-S 3.2.3.4.2) leaves as COS, burnt to SO2 in the
    thermal oxidiser: not modelled (the coke is carried as carbon only, L-3). BREF LVIC-S Table 3.19 reports
    2.39 kg COS and 1.14 kg SO2 per t from chlorination (1999 averages): open for the next stage.'
- key: emission-excluded:oxidiser-nox
  title: combustion emissions of X-301, E-202, E-203
  direction: output
  reason: 'NOx of the thermal oxidiser and of the fired preheaters not estimated (BREF LVIC-S Table 3.19:
    0.10 kg NOx per t from chlorination, 1999 average); the fired heaters'' combustion emissions are in
    the background of the fired-heat entry.'
- key: emission-excluded:dust
  title: equipment-leaks emissions of F-201, S-101
  direction: output
  reason: 'Dust from raw material handling and from the pigment filters (BREF LVIC-S Tables 3.18 and 3.23:
    0.002 and 0.158 kg per t, 1999 averages) not in the balance: no P&ID or abatement design yet.'
- key: emission-excluded:waste-tanks
  title: storage-tank emissions of M-401, R-401
  direction: output
  reason: 'The lime slaker and the neutralisation tank are open aqueous tanks at 313-323 K holding no
    volatile component in the balance (the TiCl4 and HCl are neutralised); their vapour is water: negligible.'
- key: emission-excluded:fugitive-chlorine
  title: equipment-leaks emissions of the plant
  direction: output
  reason: 'No P&ID yet: fugitive chlorine, TiCl4 and CO from flanges, valves and seals cannot be counted;
    the black end is totally enclosed (BREF LVIC-S 3.2.2.1). Open for basic engineering.'
