# T-301 (step R301) is taken as adiabatic (the heat of the traces it neutralises is negligible).
schema: cheme/simulation/v1
kind: simulation
specs:
  R201: {mode: adiabatic}
  R301: {mode: adiabatic}
  X301: {mode: adiabatic}
