# Components and templates of titanium-dioxide-1. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
#
# Chloride route (DESIGN.md D-001). Gas data printed by `cheme chemistry thermo --fit
# 298.15,1800` (chemicals 1.5.2 / thermo 0.6.1: formation data ATcT and CRC, Cp fitted to the
# packages' TRCIG, JANAF and HEOS sets), single facts with their package and method (library ADR
# 0037). Solids are separate components (`phase: solid`) without ideal-gas data: core has no
# condensed-phase enthalpy in a flowsheet step, so the duties come from scripts/energy_balance.py
# (DESIGN.md L-1). Lumps (D-003): FeO stands for every chlorinatable oxide impurity of the
# feedstock (Fe, Mn, Mg, Al, V oxides), SiO2 for the non-chlorinating inerts (silica, zircon),
# C for the fixed carbon of the calcined petroleum coke (its sulfur, ash and volatiles are not
# modelled). The scrubber and neutraliser species are dissolved pseudo-components.
schema: cheme/process/v1
kind: materials
components:
