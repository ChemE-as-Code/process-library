# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Titanium dioxide by the chloride route (DESIGN.md D-001): chloride-grade feedstock and calcined
# petroleum coke chlorinated in a fluidised bed, the blow-over solids and metal chlorides
# separated after a quench, TiCl4 condensed and distilled, oxidised with preheated oxygen, the
# TiO2 collected in a bag filter and the chlorine recycled directly to the chlorinator; the
# condenser off-gas scrubbed (water and caustic) and its CO burnt; the solid wastes neutralised
# with lime and filtered. Where the values come from:
# - feeds, temperatures, pressures, conversions and recoveries: the design basis and DESIGN.md
#   D-002..D-011, ASSUMED where no open source gives them, with the BREF LVIC-S ranges cited;
# - every flow and composition except the combustion air: `cheme process propagate --fill`, which
#   converges the chlorine recycle (tear S4) together with the design specifications (specs:
#   the feedstock flow for the product rate, the coke, chlorine, oxygen, caustic and lime for
#   their ratios);
# - the mixer and oxidiser temperatures, the combustion air and every heat duty:
#   scripts/energy_balance.py (balance-output contract, library ADR 0027), because core has no
#   condensed-phase enthalpy for the solids and liquid TiCl4 in a flowsheet step (DESIGN.md L-1);
# - the electric power: the BREF LVIC-S site averages per t of TiO2 (Table 3.16).
schema: cheme/process/v1
kind: flowsheet
title: Titanium dioxide by the chloride process (100 kt/a raw rutile TiO2)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 12 500 kg/h raw TiO2 (100 kt/a at 8000 h) from an 88 wt% TiO2 feedstock blend, direct chlorine recycle (D-002, D-003)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

# The chlorine loop: the oxidiser's chlorine and oxygen excess return to the chlorinator through
# the bag filter (BREF LVIC-S 3.2.2.12, direct recycle). Torn at the recycle gas S4.
tears:
  - stream: S4
    initial: {flow: 23000.0, unit: kg/h, basis: mass_fraction, composition: {CL2: 0.967, O2: 0.032, AR: 0.001}}
convergence: {method: wegstein, max_iterations: 500, tolerance: {abs: 1.0e-6, rel: 1.0e-8}}

specs:
  - id: product-rate
    vary: {stream: S1, initial: 15000.0, low: 1000.0, high: 40000.0}
    target: {stream: S21, component: TIO2, quantity: flow, value: 12500.0}
    provenance: assumed
    source: "D-002: 100 kt/a raw TiO2 at 8000 h, within the 55-150 kt/a of the five EU chloride sites (BREF LVIC-S Table 3.5)"
  - id: coke-excess
    vary: {stream: S2, initial: 4000.0, low: 100.0, high: 20000.0}
    target: {stream: S6, component: C, quantity: ratio, basis: mole, per: {stream: S2, component: C}, value: 0.15}
    provenance: assumed
    source: "D-005: 15 % of the coke carbon leaves the bed unreacted with the blow-over (elutriation; BREF LVIC-S 3.2.3.2.1: higher fluidisation velocities blow over ore and coke)"
  - id: chlorine-slip
    vary: {stream: S3, initial: 2500.0, low: 10.0, high: 20000.0}
    target: {stream: S6, component: CL2, quantity: ratio, basis: mole, per: {stream: S5, component: CL2}, value: 0.002}
    provenance: assumed
    source: "D-006: 0.2 % of the chlorine fed to the bed leaves it unreacted (to the off-gas scrubber); the make-up then replaces the chlorine leaving as metal chlorides, slip and losses"
  - id: oxygen-excess
    vary: {stream: S17, initial: 6000.0, low: 100.0, high: 30000.0}
    target: {stream: S19, component: O2, quantity: ratio, basis: mole, per: {stream: S19, component: TIO2}, value: 0.15}
    provenance: assumed
    source: "D-007: 15 % oxygen excess over the TiO2 formed, consistent with the BREF LVIC-S mean of 467 kg O2/t against a stoichiometric 401 kg/t (Table 3.13)"
  - id: caustic-excess
    vary: {stream: S30, initial: 6000.0, low: 0.1, high: 20000.0, with: {S31: 2.0}}
    target: {stream: S32, component: NAOH, quantity: ratio, basis: mole, per: {stream: S30, component: NAOH}, value: 0.3333}
    provenance: assumed
    source: "D-008: caustic at 1.5 times what the chlorine and HCl consume; the 50 wt% caustic diluted with twice its mass of water (about 17 wt% NaOH)"
  - id: lime-excess
    vary: {stream: S40, initial: 3000.0, low: 1.0, high: 10000.0, with: {S41: 4.0}}
    target: {stream: S43, component: CAO, quantity: ratio, basis: mole, per: {stream: S40, component: CAO}, value: 0.0909}
    provenance: assumed
    source: "D-010: lime at 1.1 times what the metal chlorides and the acid consume, slaked to a 20 wt% slurry"

feeds:
  - {id: ORE, title: "Chloride-grade titanium feedstock (slag and synthetic rutile blend, 88 wt% TiO2)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: COKE, title: Calcined petroleum coke, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: CL2, title: Make-up chlorine (chlor-alkali-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: OXY, title: Gaseous oxygen (asu-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NAOH, title: Caustic soda 50 wt% (chlor-alkali-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PW, title: Process water to the scrubber, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: LIME, title: Quicklime (lime-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PWL, title: Process water to the lime slaker, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AIR, title: Combustion air, category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: r401, direction: out, kind: energy}
      - {id: k301, direction: out, kind: energy}
  - id: HPS
    title: High-pressure steam (4000 kPa(a), saturated)
    category: utility
    utility:
      kind: steam
      level: HP
      pressure: {value: 4000.0, provenance: assumed, source: "design basis (D-011)"}
      supply_temperature: {value: 523.5, provenance: assumed, source: "saturation at 4000 kPa(a) (D-011)"}
    ports:
      - {id: t101, direction: out, kind: energy}
      - {id: e201, direction: out, kind: energy}
  - id: FUEL
    title: Fired heat (natural gas)
    category: utility
    utility: {kind: fired_heat}
    ports:
      - {id: e202, direction: out, kind: energy}
      - {id: e203, direction: out, kind: energy}
products:
  - {id: TIO2P, title: Raw TiO2 (rutile) to finishing, category: product, ports: [{id: in, direction: in}]}
  - {id: CAKE, title: Neutralised filter cake to landfill, category: solid_waste, ports: [{id: in, direction: in}]}
  - {id: EFF, title: Neutralised filtrate to the effluent outfall, category: wastewater, ports: [{id: in, direction: in}]}
  - {id: STACK, title: Thermal oxidiser flue gas to stack, category: off_gas, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis"}
      min_approach: {value: 5, provenance: assumed, source: "design basis"}
    ports:
      - {id: e102, direction: in, kind: energy}
      - {id: t101, direction: in, kind: energy}
      - {id: e204, direction: in, kind: energy}
      - {id: r401, direction: in, kind: energy}
  - id: BRINE
    title: Refrigerated brine return (248 K)
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 243.15, provenance: assumed, source: "design basis (D-006)"}
      return_temperature: {value: 248.15, provenance: assumed, source: "design basis (D-006)"}
      min_approach: {value: 5, provenance: assumed, source: "design basis (D-006)"}
    ports: [{id: e103, direction: in, kind: energy}]
  - id: AMB
    title: Heat lost to ambient (chlorinator shell)
    category: utility
    utility: {kind: other}
    ports: [{id: r101, direction: in, kind: energy}]

blocks:
  - id: CHLOR
    title: Carbochlorination (fluidised bed) and solids separation
    class: ReactingChemicals
    ports:
      - {id: ore, direction: in}
      - {id: coke, direction: in}
      - {id: cl2, direction: in}
      - {id: rec, direction: in}
      - {id: gas, direction: out}
      - {id: solids, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: amb, direction: out, kind: energy}
  - id: COND
    title: TiCl4 condensation
    class: SeparatingByThermalProcess
    ports:
      - {id: in, direction: in}
      - {id: crude, direction: out}
      - {id: offgas, direction: out}
      - {id: cw, direction: out, kind: energy}
      - {id: brine, direction: out, kind: energy}
  - id: PURIF
    title: TiCl4 purification (distillation)
    class: SeparatingByThermalProcess
    ports:
      - {id: in, direction: in}
      - {id: pure, direction: out}
      - {id: sludge, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: OXID
    title: TiCl4 oxidation and pigment separation
    class: ReactingChemicals
    ports:
      - {id: ticl4, direction: in}
      - {id: o2, direction: in}
      - {id: product, direction: out}
      - {id: rec, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: fuel1, direction: in, kind: energy}
      - {id: fuel2, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: OFFGAS
    title: Off-gas scrubbing and thermal oxidation
    class: Absorbing
    ports:
      - {id: gas, direction: in}
      - {id: naoh, direction: in}
      - {id: water, direction: in}
      - {id: air, direction: in}
      - {id: liquor, direction: out}
      - {id: flue, direction: out}
      - {id: power, direction: in, kind: energy}
  - id: WASTE
    title: Neutralisation of the solid wastes with lime and filtration
    class: ReactingChemicals
    ports:
      - {id: solids, direction: in}
      - {id: sludge, direction: in}
      - {id: liquor, direction: in}
      - {id: lime, direction: in}
      - {id: water, direction: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}

steps:
  # --- CHLOR -----------------------------------------------------------------------------------
  - id: M101
    block: CHLOR
    title: Make-up and recycle chlorine mixer
    class: Mixing
    symbol: STATIC_MIXER_SHAPE
    links: [{target: equipment, ref: M-101}]
    ports:
      - {id: cl2, direction: in, delegates: cl2}
      - {id: rec, direction: in, delegates: rec}
      - {id: out, direction: out}
  - id: R101
    block: CHLOR
    title: Fluidised-bed chlorinator (1273 K)
    class: ReactingChemicals
    reactions: [CHLOR, FECL, CBURN]
    reactor: conversion
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: ore, direction: in, delegates: ore}
      - {id: coke, direction: in, delegates: coke}
      - {id: gas, direction: in}
      - {id: out, direction: out}
      - {id: amb, direction: out, kind: energy, delegates: amb}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E101
    block: CHLOR
    title: Chlorinator gas quench (spray of cold crude TiCl4, evaporated; its heat leaves in E102)
    class: Cooling
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: S101
    block: CHLOR
    title: Blow-over and metal chloride cyclone
    class: SeparatingByCentrifugalForce
    recovery:
      outlets:
        solids: {TIO2: 0.995, FEO: 0.995, SIO2: 0.995, C: 0.995, FECL2: 0.995, TICL4: 0.002}
      provenance: assumed
      source: "D-006: 99.5 % of the solids separated (the fines pass on with the TiCl4 and end in the still bottoms); 0.2 % of the TiCl4 adheres to the solids (BREF LVIC-S 3.2.2.3)"
    links: [{target: equipment, ref: S-101}]
    ports:
      - {id: in, direction: in}
      - {id: solids, direction: out, delegates: solids}
      - {id: gas, direction: out, delegates: gas}
  # --- COND ------------------------------------------------------------------------------------
  - id: E102
    block: COND
    title: TiCl4 condenser (cooling water)
    class: Cooling
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: cw}
  - id: E103
    block: COND
    title: TiCl4 after-condenser (brine) and cold TiCl4 jet scrubber
    class: Cooling
    links: [{target: equipment, ref: E-103}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: brine}
  - id: V101
    block: COND
    title: Crude TiCl4 separator
    class: SeparatingByFlash
    recovery:
      outlets:
        liquid: {TICL4: 0.997, TIO2: 1.0, FEO: 1.0, SIO2: 1.0, C: 1.0, FECL2: 1.0}
      provenance: assumed
      source: "D-006: 99.7 % of the TiCl4 condensed at 263 K, the equilibrium of Raoult's law over pure TiCl4 with the permanent gases insoluble (scripts/energy_balance.py prints it as a cross-check; the cold TiCl4 jet scrubber of BREF LVIC-S 3.2.2.5 is not credited); CO, CO2, Cl2, O2 and Ar not dissolved (L-3)"
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: in, direction: in}
      - {id: liquid, direction: out, delegates: crude}
      - {id: gas, direction: out, delegates: offgas}
  # --- PURIF -----------------------------------------------------------------------------------
  - id: T101
    block: PURIF
    title: TiCl4 still (with oil for the vanadium)
    class: SeparatingByThermalProcess
    recovery:
      outlets:
        top: {TICL4: 0.99}
      provenance: assumed
      source: "D-006: 99 % of the TiCl4 distilled; the bottoms (the fines, the metal chlorides and 1 % of the TiCl4 as a sludge) go to the neutraliser (BREF LVIC-S 3.2.2.7, 3.2.2.8)"
    links: [{target: equipment, ref: T-101}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: top, direction: out, delegates: pure}
      - {id: bottoms, direction: out, delegates: sludge}
      - {id: reb, direction: in, kind: energy, delegates: steam}
      - {id: cond, direction: out, kind: energy, delegates: cw}
  # --- OXID ------------------------------------------------------------------------------------
  - id: E201
    block: OXID
    title: TiCl4 vaporiser (HP steam)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in, delegates: ticl4}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: steam}
  - id: E202
    block: OXID
    title: TiCl4 superheater (fired)
    class: HeatingInFurnace
    links: [{target: equipment, ref: E-202}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: fuel1}
  - id: E203
    block: OXID
    title: Oxygen preheater (fired)
    class: HeatingInFurnace
    links: [{target: equipment, ref: E-203}]
    ports:
      - {id: in, direction: in, delegates: o2}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: fuel2}
  - id: R201
    block: OXID
    title: TiCl4 oxidiser (adiabatic)
    class: ReactingChemicals
    reactions: [OXID]
    reactor: conversion
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: ticl4, direction: in}
      - {id: o2, direction: in}
      - {id: out, direction: out}
  - id: E204
    block: OXID
    title: Oxidiser product cooler (water-cooled flue, scoured)
    class: Cooling
    links: [{target: equipment, ref: E-204}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: cw}
  - id: F201
    block: OXID
    title: Pigment bag filter
    class: SeparatingMechanically
    recovery:
      outlets:
        solid: {TIO2: 0.9999}
      provenance: assumed
      source: "D-007: 99.99 % of the TiO2 collected; the rest returns with the chlorine to the chlorinator (BREF LVIC-S 3.2.2.9: collected in bag filters, the chlorine recycled)"
    links: [{target: equipment, ref: F-201}]
    ports:
      - {id: in, direction: in}
      - {id: solid, direction: out, delegates: product}
      - {id: gas, direction: out, delegates: rec}
  # --- OFFGAS ----------------------------------------------------------------------------------
  - id: R301
    block: OFFGAS
    title: Off-gas scrubber (water and caustic stages, lumped)
    class: Absorbing
    reactions: [HYD_NAOH, CL2_NAOH, HCL_NAOH]
    reactor: conversion
    links: [{target: equipment, ref: T-301}]
    ports:
      - {id: gas, direction: in, delegates: gas}
      - {id: naoh, direction: in, delegates: naoh}
      - {id: water, direction: in, delegates: water}
      - {id: out, direction: out}
  - id: V301
    block: OFFGAS
    title: Scrubber gas-liquid separation
    class: SeparatingByFlash
    recovery:
      outlets:
        gas: {CO: 1.0, CO2: 1.0, O2: 1.0, AR: 1.0, CL2: 1.0, HCL: 1.0}
      provenance: assumed
      source: "D-008: the permanent gases and the residual Cl2 and HCl leave with the gas; water saturation of the gas not modelled (L-3)"
    links: [{target: equipment, ref: T-301}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out}
      - {id: liquid, direction: out, delegates: liquor}
  - id: K301
    block: OFFGAS
    title: Combustion air fan
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-301}]
    ports:
      - {id: in, direction: in, delegates: air}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: X301
    block: OFFGAS
    title: Thermal oxidiser (CO to CO2)
    class: ReactingChemicals
    reactions: [CO_COMB]
    reactor: conversion
    links: [{target: equipment, ref: X-301}]
    ports:
      - {id: vent, direction: in}
      - {id: air, direction: in}
      - {id: out, direction: out, delegates: flue}
  # --- WASTE -----------------------------------------------------------------------------------
  - id: M401
    block: WASTE
    title: Lime slaker
    class: Mixing
    links: [{target: equipment, ref: M-401}]
    ports:
      - {id: lime, direction: in, delegates: lime}
      - {id: water, direction: in, delegates: water}
      - {id: out, direction: out}
  - id: R401
    block: WASTE
    title: Neutralisation tank
    class: ReactingChemicals
    reactions: [HYD_LIME, FECL_LIME, HCL_LIME]
    reactor: conversion
    links: [{target: equipment, ref: R-401}]
    ports:
      - {id: solids, direction: in, delegates: solids}
      - {id: sludge, direction: in, delegates: sludge}
      - {id: liquor, direction: in, delegates: liquor}
      - {id: lime, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: q, direction: out, kind: energy, delegates: cw}
  - id: F401
    block: WASTE
    title: Filter press
    class: SeparatingMechanically
    recovery:
      outlets:
        cake: {TIO2: 1.0, SIO2: 1.0, C: 1.0, FEOH2: 1.0, CAO: 1.0, H2O: 0.15, CACL2: 0.15, NACL: 0.15, NAOCL: 0.15, NAOH: 0.15}
      provenance: assumed
      source: "D-010: every solid to the cake; 15 % of the liquor retained with it (BREF LVIC-S 3.2.2.15: the filter cake landfilled, the filtrate discharged)"
    links: [{target: equipment, ref: F-401}]
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out, delegates: cake}
      - {id: filtrate, direction: out, delegates: filtrate}

streams:
  # --- feeds and chlorination ------------------------------------------------------------------
  - id: S1
    title: Titanium feedstock
    from: ORE.out
    to: R101.ore
    template: ore
    state:
      design:
        pressure: {value: 250.0, provenance: assumed, source: "pneumatic injection into the bed (D-011)"}
        temperature: {value: 298.15, provenance: assumed, source: "dry feedstock from closed storage (BREF LVIC-S 3.2.2.1: no drying needed)"}
        composition: {basis: mass_fraction, values: {TIO2: 0.88, FEO: 0.08, SIO2: 0.04}, provenance: assumed, source: "D-003: a slag and synthetic rutile blend, 88 wt% TiO2 (BREF LVIC-S Table 3.7: slag 86-87, synthetic rutile 90-93 wt%); impurities lumped"}
        flow: {value: 15179.5, provenance: calculated, source: 'cheme process propagate: spec product-rate (S21 TIO2 flow kg/h 12500)', fingerprint: a686a2f87b2db230}
  - id: S2
    title: Calcined petroleum coke
    from: COKE.out
    to: R101.coke
    template: coke
    state:
      design:
        pressure: {value: 250.0, provenance: assumed, source: "pneumatic injection (D-011)"}
        temperature: {value: 298.15, provenance: assumed, source: "ambient storage"}
        composition: {basis: mass_fraction, values: {C: 1.0}, provenance: assumed, source: "D-005: fixed carbon only; sulfur, ash and volatiles not modelled (L-3)"}
        flow: {value: 3944.56, provenance: calculated, source: 'cheme process propagate: spec coke-excess (S6 C per S2 C (mole) 0.15)', fingerprint: a686a2f87b2db230}
  - id: S3
    title: Make-up chlorine
    from: CL2.out
    to: M101.cl2
    template: chlorine
    state:
      design:
        pressure: {value: 400.0, provenance: assumed, source: "chlor-alkali-1 chlorine product (its stream S42)"}
        temperature: {value: 313.15, provenance: assumed, source: "chlor-alkali-1 chlorine product (its stream S42)"}
        phase: {value: vapor, provenance: assumed, source: "gas"}
        composition: {basis: mass_fraction, values: {CL2: 0.9918815, O2: 0.008118535}, provenance: assumed, source: "chlor-alkali-1 dry chlorine gas (its stream S42)"}
        flow: {value: 1596.41, provenance: calculated, source: 'cheme process propagate: spec chlorine-slip (S6 CL2 per S5 CL2 (mole) 0.002)', fingerprint: a686a2f87b2db230}
  - id: S4
    title: Recycle chlorine (from the bag filter)
    from: F201.gas
    to: M101.rec
    template: recycle
    state:
      design:
        pressure: {value: 200.0, provenance: assumed, source: "oxidiser train above the chlorinator pressure for the direct recycle (BREF LVIC-S 3.2.2.12; D-011)"}
