# The batch recipe of ibuprofen-1 (schema cheme/recipe/v1, `cheme process recipe`, DESIGN.md
# D-003). One batch makes the dried ibuprofen of stream S33; the flowsheet's rates are the year
# averages: the batch x the batches a year / 7920 h. The acylation's dosing and post-reaction
# take their times from R101's semi-batch model (from: R101) and the drying from D401's drying
# rate; the reaction times of the hydrogenation and the carbonylation are SRC-1's (Examples 3A
# and 100), the crystallisation's cooling SRC-2's 0.3 K/min; every other duration is ASSUMED
# (D-003). R-101's and D-401's vessels are sized from one batch's content (core ADRs 0052,
# 0057); the conversion steps' vessels R-201 and R-301 have no batch content the recipe can
# size from (L-2), their volumes are hand estimates in the equipment list.
# `cheme process recipe --svg build/gantt.svg` draws one batch.
schema: cheme/recipe/v1
kind: recipe
title: Ibuprofen by the BHC route (HF acylation, hydrogenation, Pd carbonylation)
batch_size: {value: 3977.01, unit: kg, stream: S33, provenance: assumed, source: "one batch of dried ibuprofen: 3500 t/a over the batches the bottleneck's cycle allows, batch = rate x cycle (441.89 kg/h x 9.0 h of STRIP and PURIFY, D-002, D-003)"}
hours_per_year: {value: 7920, provenance: assumed, source: "330 days of 24 h (D-002)"}
unit_procedures:
  - id: ACYLATE
    units: [M101, M102, R101]
    title: Charge IBB and HF, dose the anhydride at 353 K, post-reaction (R-101)
    vessel:
      fill_fraction: 0.7
      aspect_ratio: 1.5
      provenance: assumed
      source: "an HF autoclave (Hastelloy C or Monel, SRC-1 uses Hastelloy C) filled to 70 % to leave head space for the HF's vapour at 353 K (D-003, D-011)"
    operations:
      - {id: charge, kind: charge, title: "IBB, then the chilled HF from T-101", duration: {value: 1.0, provenance: assumed, source: D-003}}
      - {id: heat, kind: heat, title: Heat to 353 K, duration: {value: 1.0, provenance: assumed, source: "D-003: 236.5 kW year average of the charge's heat-up (Q2) over the 9.0 h cycle is about 2.1 MWh a batch, 2.1 MW for 1 h on MP steam, ASSUMED"}}
      - {id: dose, kind: dose, title: Dose the anhydride and recycled IBB from V-101 (R101), from: R101}
      - {id: react, kind: react, title: Post-reaction to 85 % conversion (R101), from: R101}
      - {id: transfer, kind: transfer, title: Let down into the HF stripper C-101, duration: {value: 0.5, provenance: assumed, source: D-003}}
  - id: STRIP
    units: [C101, C102]
    title: Strip and recover the HF, cut acetic acid, recycle and crude IBAP (C-101, C-102)
    operations:
      - {id: strip, kind: other, title: HF stripped overhead and condensed on brine, duration: {value: 3.0, provenance: assumed, source: D-003}}
      - {id: cuts, kind: other, title: "Acetic acid, IBB/anhydride recycle, crude IBAP, residue", duration: {value: 6.0, provenance: assumed, source: D-003}}
  - id: HYDROGENATE
    units: [R201, V201]
    title: Hydrogenate neat IBAP over Raney nickel at 343 K (R-201)
    operations:
      - {id: charge, kind: charge, title: Crude IBAP and the recycled catalyst, duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: react, kind: react, title: Under hydrogen until the uptake stops, duration: {value: 3.0, provenance: given, source: "SRC-1 Example 3A: about 3 h at 70 C"}}
      - {id: vent, kind: other, title: "Vent the hydrogen, filter the catalyst off (F-201)", duration: {value: 1.5, provenance: assumed, source: D-003}}
  - id: CARBONYLATE
    units: [M301, R301, V301, SP301]
    title: Carbonylate IBPE with CO at 16.6 MPa and 403 K, let down and decant (R-301, V-301)
    operations:
      - {id: charge, kind: charge, title: "IBPE, aqueous HCl and the Pd catalyst", duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: heat, kind: heat, title: Pressurise with CO and heat to 403 K, duration: {value: 1.0, provenance: assumed, source: D-003}}
      - {id: react, kind: react, title: Carbonylation, duration: {value: 2.6, provenance: given, source: "SRC-1 Example 100: 2 h 35 min at 130 C and 2400 psig"}}
      - {id: cool, kind: cool, title: "Cool (Q18), vent the head space's CO to the thermal oxidiser", duration: {value: 1.0, provenance: assumed, source: D-003}}
      - {id: decant, kind: other, title: "Decant the aqueous acid to T-301, the crude to V-401", duration: {value: 1.0, provenance: assumed, source: D-003}}
  - id: PURIFY
    units: [V401, C401]
    title: Water washes of the melt, vacuum distillation (V-401, C-401)
    operations:
      - {id: wash, kind: other, title: Two washes at 353 K to pH 2.9 (SRC-2), duration: {value: 3.0, provenance: assumed, source: D-003}}
      - {id: distil, kind: other, title: "Lights (water first at about 15 kPa), ibuprofen cut at 403 to 407 K and 40 to 93 Pa, residue", duration: {value: 6.0, provenance: assumed, source: D-003}}
  - id: CRYSTALLISE
    units: [M402, CR401, F401]
    title: Dissolve in hexane at 333 K, cool to 278 K, filter (CR-401, F-401)
    operations:
      - {id: dissolve, kind: charge, title: The cut in hexane at 333 K (25 wt%), duration: {value: 1.0, provenance: assumed, source: D-003}}
      - {id: cool, kind: cool, title: Cool 333 to 278 K at 0.3 K/min with a hold at 298 K, duration: {value: 4.1, provenance: assumed, source: "SRC-2 Example 1: 0.3 C/min to 25 C, 1 h hold, 0.3 C/min to 5 C: 55 K / 0.3 K/min = 3.06 h + 1 h"}}
      - {id: filter, kind: filter, title: Cold filtration at 278 K (F-401), duration: {value: 2.0, provenance: assumed, source: D-003}}
  - id: DRY
    units: [D401]
    title: Vacuum drying at 323 K (D-401)
    vessel: {fill_fraction: 0.6, aspect_ratio: 1.0, provenance: assumed, source: "an agitated vacuum dryer filled to 60 % (D-009)"}
    operations:
      - {id: receive, kind: charge, title: Receive the wet cake, duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: dry, kind: dry, title: Vacuum drying at 323 K (D401), from: D401}
      - {id: discharge, kind: transfer, title: "Cool, break the vacuum with nitrogen, discharge to packing", duration: {value: 1.0, provenance: assumed, source: D-003}}
  - id: RECOVER
    units: [C402, M403, SP402]
    title: Hexane recovery from the mother liquor (C-402)
    operations:
      - {id: distil, kind: other, title: "Hexane distilled off to T-402, residue to T-403", duration: {value: 6.0, provenance: assumed, source: D-003}}
