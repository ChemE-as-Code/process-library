  - {id: all, title: Every component of the plant (each stream carries its own), components: [IBB, AC2O, HOAC, HF, IBAP, ISO, H2, IBPE, IBPET, CO, HCL, H2O, IBU, IBU_S, IPPA, HE, HEX]}
