# Components and templates of ibuprofen-1. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol (IUPAC 2021
# abridged standard atomic weights applied to the formula), normal_boiling_point in K at
# 101.325 kPa.
#
# The liquids are carried as molecular pseudo-components, an inventory basis, not a speciation:
# the ketone's HF complex in R-101, the Pd complex and the triphenylphosphine of R-301 and
# the Raney nickel of R-201 are not resolved (DESIGN.md D-006). The ibuprofen crystals are a
# separate solid component, IBU_S (phase: solid). Two lumps stand for by-products the sources
# give only as percentages (D-005):
# - ISO: the 19 % of the converted isobutylbenzene that US 4 981 995 A Example 1 does not
#   report as 4-isobutylacetophenone, taken as its isomers (C12H16O, ASSUMED);
# - HE: the "heavy ends" of the carbonylation (US 4 981 995 A Example 100), taken as the ether
#   of two IBPE (C24H34O, ASSUMED).
# Liquid data the semi-batch R101 needs (D-006), all at 298.15 K from thermo 0.6.1,
# Chemical(...), its default methods (package values, ADR 0037 of the library; DESIGN.md SRC-6):
# - liquid_molar_volume, m3/kmol (Vml): isobutylbenzene 0.16276 and 4-isobutylacetophenone
#   0.19559 (MMSNM0, an estimation method); acetic anhydride 0.09495, acetic acid 0.05763 and
#   hydrogen fluoride 0.02125 (DIPPR_PERRY_8E, Perry's 8th ed. drawing on DIPPR 801, not read);
#   hexane 0.13157 and water 0.01807 (HEOS_FIT); ibuprofen 0.20727 (MMSNM0);
# - liquid_heat_capacity, kJ/(kmol K) (Cplm): isobutylbenzene 242.84 (ZABRANSKY_SPLINE_SAT),
#   acetic anhydride 152.37 and 4-isobutylacetophenone 315.32 (DADGOSTAR_SHAW, an estimation
#   method), acetic acid 131.95 and hydrogen fluoride 61.53 (VDI_TABULAR, the VDI Heat Atlas,
#   not read), ibuprofen 283.47 (ZABRANSKY_SPLINE_C), hexane 195.84 and water 75.33
#   (HEOS_FIT);
# - ISO, IBPE and IBPET take 4-isobutylacetophenone's volume and heat capacity, IPPA
#   ibuprofen's and HE twice 4-isobutylacetophenone's (ASSUMED analogues: thermo 0.6.1 has no
#   data for IBPE, IBPET or 3-IPPA);
# - normal boiling points from chemicals 1.5.2, Tb, its default method (isobutylbenzene
#   445.85, acetic anhydride 412.65, acetic acid 391.05, hydrogen fluoride 293.15, hexane
#   341.87, water 373.12, hydrogen 20.37, carbon monoxide 81.64, hydrogen chloride 188.17 K);
#   the aromatics of the later steps have none here (their vapour pressures are not used);
# - H2, CO and HCl carry their ideal-gas heat capacities at 298.15 K in liquid_heat_capacity
#   (thermo 0.6.1, Cpgm, HEOS_FIT: 28.83, 29.14 and 29.13 kJ/(kmol K)), standing for the gas and
#   the dissolved acid in the conversion steps' duties (ASSUMED; the HCl's heat of solution not
#   counted, D-009).
schema: cheme/process/v1
kind: materials
components:
