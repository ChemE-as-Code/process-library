# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Ibuprofen by the BHC three-step route (DESIGN.md D-001), a batch plant on the examples of
# US 4 981 995 A (SRC-1) and US 5 151 551 A (SRC-2):
# 1. Acylation: isobutylbenzene charged with anhydrous HF (49.5 mol per mol of the IBB in the
#    batch) into R-101, acetic anhydride (2 mol per mol, with the recycled IBB and anhydride)
#    dosed at 353 K (a semi-batch, reactor: semibatch) to 85 % conversion; HF stripped off and
#    recycled (C-101, >99.9 %), the acetic acid co-product, the IBB and anhydride recycle, the
#    by-product residue and the crude IBAP cut in C-102.
# 2. Hydrogenation: neat IBAP over Raney nickel at 343 K (R-201, a conversion step), hydrogen
#    5 % in excess, vented.
# 3. Carbonylation: IBPE with aqueous HCl (0.75 mol per mol) and CO at 403 K and 16.6 MPa
#    (R-301, a conversion step; Pd catalyst recycled outside the balance), the CO left in the
#    head space vented on let-down; the aqueous acid decanted (V-301) and recycled, a tenth purged.
# 4. Purification (SRC-2 Example 2's sequence): water washes of the melt (V-401), vacuum
#    distillation (C-401: lights, product cut, residue), cooling crystallisation from hexane at
#    278 K (CR-401, 25 wt% feed), filtration (F-401), vacuum drying (D-401); the hexane is
#    recovered (C-402) and recycled, the mother liquor's residue partly recycled.
# The flows are the year averages of the batch recipe (process/recipe.yaml, D-003).
# Where the values come from:
# - feeds, temperatures, pressures, ratios: design basis, D-002..D-010, ASSUMED or from SRC-1/2;
# - R101: cheme's semi-batch model (the ASSUMED rate laws of ACYL and ACYL_ISO, D-005), to 0.85
#   conversion of the IBB; R201, R301: conversion steps with SRC-1's selectivities; C101, C102,
#   V201, V301, V401, C401, C402: component separators with ASSUMED recoveries (D-007, D-008);
#   CR401: core's crystallizer with an ASSUMED yield (no open solubility read, L-4); F401:
#   specified splits; D401: core's dryer; mixers and splitters; all calculated by `cheme
#   process propagate --fill` with the five recycles converged at their tears and the feeds
#   set by the design specifications below (core ADRs 0060, 0070);
# - R101's duty (Q1, with the charge's heat-up on Q2), R201's (Q7) and R301's (Q9, both with
#   the step's power P2, P3) and CR401's (Q12) are written by `cheme process propagate --fill`
#   from the models, D401's (Q13) by core's dryer model; the separators' duties and the
#   sensible heats of the dose (Q20), the let-down (Q18), the washes (Q17) and the dissolver
#   (Q19) are hand arithmetic from the stream table (D-009), given as ASSUMED.
schema: cheme/process/v1
kind: flowsheet
title: Ibuprofen by the BHC route, HF acylation, hydrogenation and Pd carbonylation (3500 t/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 3500 t/a of dried ibuprofen, year averages of the batch recipe in 7920 h (D-002, D-003)", default: true}
tolerance: {abs: 0.05, rel: 0.002}   # balances: |in - out| <= abs + rel * max(in, out), kg/h
# Five recycles (core ADR 0060): the HF (S7), the IBB and anhydride (S9), the aqueous HCl
# (S22), the hexane (S36) and the mother liquor's residue (S34).
tears:
  - stream: S7
    initial: {flow: 4000.0, unit: kg/h, basis: mass_fraction, composition: {HF: 1.0}}
  - stream: S9
    initial: {flow: 560.0, unit: kg/h, basis: mass_fraction, composition: {IBB: 0.15, AC2O: 0.84, HOAC: 0.01}}
  - stream: S22
    initial: {flow: 300.0, unit: kg/h, basis: mass_fraction, composition: {HCL: 0.33, H2O: 0.67}}
  - stream: S36
    initial: {flow: 1300.0, unit: kg/h, basis: mass_fraction, composition: {HEX: 1.0}}
  - stream: S34
    initial: {flow: 100.0, unit: kg/h, basis: mass_fraction, composition: {IBU: 0.8, IPPA: 0.1, HEX: 0.1}}
convergence: {method: wegstein, max_iterations: 5000, tolerance: {abs: 1.0e-5, rel: 1.0e-8}}
# The feeds that follow from the design (core ADR 0070), solved with the tears.
specs:
  - id: capacity
    vary: {stream: S1, initial: 470.0, low: 100, high: 2000}
    target: {stream: S31, component: IBU_S, quantity: annual, value: 3420.0, unit: t, hours: 7920}
    tolerance: 1.0e-6
    provenance: assumed
    source: "3500 t/a of dried product (D-002; SRC-3's Bishop plant, 7.7 Mlb/a, about 3490 t/a): 3420 t/a of crystals in the cake S31 make 3500 t/a of S33 with the cake liquor's dissolved ibuprofen and impurities (97.7 wt% crystals)"
  - id: anhydride
    vary: {stream: S2, initial: 371.0, low: 10, high: 3000}
    target: {stream: S4, component: AC2O, quantity: ratio, value: 13.3333, basis: mole, per: {stream: S5, component: IBB}}
    tolerance: 1.0e-6
    provenance: assumed
    source: "2 mol of acetic anhydride per mol of IBB in the batch (SRC-1 Example 1: 3.8 mol on 1.9 mol): with 85 % conversion the IBB left is 0.15 of it, so 2 / 0.15 mol of anhydride dosed per mol of IBB left (D-004)"
  - id: hf
    vary: {stream: S6, initial: 4.08, low: 0.01, high: 100}
    target: {stream: S3, component: HF, quantity: ratio, value: 330.0, basis: mole, per: {stream: S5, component: IBB}}
    tolerance: 1.0e-6
    provenance: assumed
    source: "49.5 mol of HF per mol of IBB in the batch (SRC-1 Example 1: 94 mol on 1.9 mol), 49.5 / 0.15 per mol of IBB left (D-004); the make-up S6 replaces the 0.1 % C-101 does not recover (SRC-3: >99.9 %)"
  - id: hydrogen
    vary: {stream: S13, initial: 6.5, low: 0.1, high: 100}
    target: {stream: S15, component: H2, quantity: ratio, value: 0.05075, basis: mole, per: {stream: S12, component: IBAP}}
    tolerance: 1.0e-6
    provenance: assumed
    source: "hydrogen 5 % above its use, 0.995 x (0.98 + 2 x 0.02) = 1.015 mol per mol of IBAP (0.995 conversion ASSUMED within SRC-1 Example 3A's >99 %), the excess vented (D-004)"
  - id: co
    vary: {stream: S18, initial: 95.0, low: 1, high: 1000}
    target: {stream: S21, component: CO, quantity: ratio, value: 0.3847, basis: mole, per: {stream: S19, component: IBPE}}
    tolerance: 1.0e-6
    provenance: assumed
    source: "the CO left in R-301's head space at the end of the reaction, vented when R-301 is let down (D-004): an 8 m3 autoclave (ASSUMED) holding the 6.2 m3 of liquor a batch (S20 x 9.0 h at the molar volumes of process/materials.yaml) leaves about 1.8 m3 of gas at 16.65 MPa and 403.15 K, n = P V / (Z R T) = 16650 x 1.8 / (1.05 x 8.314 x 403.15) = 8.52 kmol a batch (Z of CO from thermo 0.6.1's Peng-Robinson equation of state), over the 22.14 kmol of IBPE a batch: 0.3847 mol per mol, on top of the 0.9662 used; the CO dissolved in the liquor not counted, the let-down gas not recovered (ASSUMED)"
  - id: hcl
    vary: {stream: S17, initial: 30.0, low: 1, high: 2000}
    target: {stream: S19, component: HCL, quantity: ratio, value: 0.75, basis: mole, per: {stream: S19, component: IBPE}}
    tolerance: 1.0e-6
    provenance: assumed
    source: "0.75 mol of HCl per mol of IBPE in the charge (SRC-1 Example 100: H+/IBPE 0.75), made up with 33 wt% hydrochloric acid (D-004); the spec sets the HCl, not the water: the charge S19 is 31 wt% HCl with 3.3 mol of water per mol of IBPE, against Example 100's 775 mL of 26 % HCl on 8.43 mol (H3O+/H2O 0.173, about 4.3 mol of water per mol); the example's conversion and selectivities applied to the stronger acid unchanged (ASSUMED, D-004)"
  - id: wash
    vary: {stream: S25, initial: 1800.0, low: 10, high: 10000}
    target: {stream: S25, quantity: ratio, value: 3.0, basis: mass, per: {stream: S24}}
    tolerance: 1.0e-6
    provenance: assumed
    source: "two washes of 1.5 kg of water per kg of crude (SRC-2 Example 1: about 1050 mL per 700 g, two to three times), ASSUMED (D-007)"
  - id: hexane
    vary: {stream: S35, initial: 5.0, low: 0.01, high: 500}
    target: {stream: S29, component: IBU, quantity: fraction, value: 0.25, basis: mass}
    tolerance: 1.0e-6
    provenance: assumed
    source: "25 wt% ibuprofen in the crystalliser feed (SRC-2 Example 2: 25 wt% in heptane; Example 1: 30 wt% in hexane), D-008; the make-up replaces the hexane lost"

feeds:
  - {id: IBBF, title: Isobutylbenzene (merchant; no library process), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AC2OF, title: Acetic anhydride (acetic-anhydride-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: HFF, title: Anhydrous hydrogen fluoride make-up, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: H2F, title: Hydrogen (hydrogen-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: HCLF, title: Hydrochloric acid 33 wt% make-up (hydrogen-chloride-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: COF, title: Carbon monoxide (merchant; no library process), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: WASHW, title: Process water (melt washes), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: HEXF, title: n-Hexane make-up, category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: acyl, direction: out, kind: energy}
      - {id: hydr, direction: out, kind: energy}
      - {id: carb, direction: out, kind: energy}
      - {id: purif, direction: out, kind: energy}
  - id: MPS
    title: MP steam 1100 kPa(a)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1100, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 457.0, provenance: given, source: "saturation at 1100 kPa(a), IAPWS-IF97"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: c101, direction: out, kind: energy}
      - {id: c102, direction: out, kind: energy}
      - {id: c401, direction: out, kind: energy}
      - {id: c402, direction: out, kind: energy}
      - {id: d401, direction: out, kind: energy}
      - {id: v101, direction: out, kind: energy}
      - {id: v401, direction: out, kind: energy}
      - {id: m402, direction: out, kind: energy}
products:
  - {id: IBU, title: Ibuprofen crystals to packing, category: product, ports: [{id: in, direction: in}]}
  - {id: HOAC, title: Acetic acid co-product (to acetic acid recovery), category: by_product, ports: [{id: in, direction: in}]}
  - {id: HFS, title: HF not recovered to the caustic scrubber, category: off_gas, ports: [{id: in, direction: in}]}
  - {id: VENT, title: Hydrogen and CO vent to the thermal oxidiser, category: off_gas, ports: [{id: in, direction: in}]}
  - {id: WW, title: Acid purge and wash water to neutralisation and wastewater treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - {id: RES, title: "Organic residues (liquid) to incineration", category: solid_waste, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: c102, direction: in, kind: energy}
      - {id: r201, direction: in, kind: energy}
      - {id: r301, direction: in, kind: energy}
      - {id: c401, direction: in, kind: energy}
      - {id: c402, direction: in, kind: energy}
      - {id: v301, direction: in, kind: energy}
  - id: BRINE
    title: Brine return (refrigeration at 263 K)
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 263.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 268.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: c101, direction: in, kind: energy}
      - {id: cr401, direction: in, kind: energy}
      - {id: d401, direction: in, kind: energy}

blocks:
  - id: ACYL
    title: HF acylation, HF recovery and acid cut
    class: ReactingChemicals
    ports:
      - {id: ibb, direction: in}
      - {id: ac2o, direction: in}
      - {id: hf, direction: in}
      - {id: ibap, direction: out}
      - {id: acid, direction: out}
      - {id: hfs, direction: out}
      - {id: res, direction: out}
      - {id: qr, direction: out, kind: energy}
      - {id: qh, direction: in, kind: energy}
      - {id: qs1, direction: in, kind: energy}
      - {id: qc1, direction: out, kind: energy}
      - {id: qs2, direction: in, kind: energy}
      - {id: qc2, direction: out, kind: energy}
      - {id: qd, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: HYDR
    title: Hydrogenation
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: h2, direction: in}
      - {id: out, direction: out}
      - {id: vent, direction: out}
      - {id: q, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: CARB
    title: Carbonylation and acid decanting
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: hcl, direction: in}
      - {id: co, direction: in}
      - {id: out, direction: out}
      - {id: vent, direction: out}
      - {id: purge, direction: out}
      - {id: q, direction: out, kind: energy}
      - {id: qc, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: PURIF
    title: Washing, vacuum distillation, crystallisation and drying
    class: SeparatingMechanically
    ports:
      - {id: in, direction: in}
      - {id: wash, direction: in}
      - {id: hex, direction: in}
      - {id: product, direction: out}
      - {id: ww, direction: out}
      - {id: res, direction: out}
      - {id: ares, direction: in}
      - {id: qs1, direction: in, kind: energy}
      - {id: qc1, direction: out, kind: energy}
      - {id: qcr, direction: out, kind: energy}
      - {id: qd, direction: in, kind: energy}
      - {id: qdc, direction: out, kind: energy}
      - {id: qs2, direction: in, kind: energy}
      - {id: qc2, direction: out, kind: energy}
      - {id: qw, direction: in, kind: energy}
      - {id: qm, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: VENTS
    title: Vent and liquid waste collection
    class: Mixing
    ports:
      - {id: h2, direction: in}
      - {id: co, direction: in}
      - {id: vent, direction: out}
      - {id: aq, direction: in}
      - {id: wash, direction: in}
      - {id: ww, direction: out}

steps:
  # --- ACYL
  - id: M101
    block: ACYL
    title: Charge of R-101 (isobutylbenzene and recycled HF)
    class: Mixing
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: ibb, direction: in, delegates: ibb}
      - {id: hf, direction: in}
      - {id: hfm, direction: in, delegates: hf}
      - {id: out, direction: out}
  - id: M102
    block: ACYL
    title: Dosing vessel V-101 (fresh and recycled anhydride with the recycled IBB)
    class: Mixing
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: ac2o, direction: in, delegates: ac2o}
      - {id: rec, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: qd}
  - id: R101
    block: ACYL
    title: Acylator (acetic anhydride dosed into IBB in HF at 353 K)
    class: ReactingChemicals
    reactions: [ACYL, ACYL_ISO]
    reactor: semibatch
    batch:
      dosing: [{stream: S4, time: 5400}]
      target: {key: IBB, conversion: 0.85}
      heat: isothermal
      heat_up: true
      heat_up_port: qh
      provenance: assumed
      source: "the anhydride with the recycled IBB dosed at a constant rate over 1.5 h into the IBB in HF at 353.15 K, then held to 0.85 conversion of the IBB (SRC-1 Example 1: 80 C, 3 h, 85 %, all charged at once into the cooled autoclave; dosing instead, D-005, D-011); the charge heated from 283.15 K on steam (heat_up_port), the reaction's heat to cooling water"
    hazard:
      mtt: 365.8
      provenance: assumed
      source: "MTT: the temperature at which R-101's pressure reaches its ASSUMED relief set pressure of 950 kPa(g), 1051 kPa(a): HF's vapour pressure (thermo 0.6.1, Chemical('7664-39-3').Psat, method 'Fit 2023', a correlation fitted by the package's authors: 631.8 kPa at 353.15 K) plus the nitrogen pad, 800 - 631.8 = 168.2 kPa at 353.15 K, compressed with the temperature in a fixed head space (168.2 x T / 353.15); the total reaches 1051 kPa(a) at 365.8 K (pure HF's vapour pressure taken, the lower of the two bases: with Raoult's law on S5's 0.943 mole fraction of HF 366.4 K); the pad not vented before relief, no control action credited; the liquor's other components are far less volatile (D-011)"
    energy_port: q
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: charge, direction: in}
      - {id: dose, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: qr}
      - {id: qh, direction: in, kind: energy, delegates: qh}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: C101
    block: ACYL
    title: HF stripper (HF overhead to the recycle, its loss to the scrubber)
    class: Distilling
    recovery:
      outlets:
        hf: {HF: 0.999}
        loss: {HF: 0.001}
      provenance: assumed
      source: "HF recovered and recycled at more than 99.9 % (SRC-3); the HF taken as stripped sharply, the organics none to the overhead (D-007)"
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: in, direction: in}
      - {id: hf, direction: out}
      - {id: loss, direction: out, delegates: hfs}
      - {id: bottoms, direction: out}
      - {id: qs, direction: in, kind: energy, delegates: qs1}
      - {id: qc, direction: out, kind: energy, delegates: qc1}
  - id: C102
    block: ACYL
    title: Acid and recycle column train (acetic acid, IBB and anhydride, crude IBAP, residue)
    class: Distilling
    recovery:
      outlets:
        acid: {HOAC: 0.99, AC2O: 0.02}
        rec: {IBB: 0.99, AC2O: 0.975, HOAC: 0.01}
        res: {IBAP: 0.02, ISO: 0.90}
      provenance: assumed
      source: "ASSUMED cuts of two columns (D-007): acetic acid (Tb 391 K) overhead with 2 % of the anhydride; the anhydride (412.65 K) and IBB (445.85 K) as the recycle; the IBAP as the crude cut, 98 % of it, the by-product lump ISO 90 % to the residue (no open data on their separation, L-5); the rest of the IBB and anhydride goes on with the IBAP"
    links: [{target: equipment, ref: C-102}]
    ports:
      - {id: in, direction: in}
      - {id: acid, direction: out, delegates: acid}
      - {id: rec, direction: out}
      - {id: res, direction: out, delegates: res}
      - {id: ibap, direction: out, delegates: ibap}
      - {id: qs, direction: in, kind: energy, delegates: qs2}
      - {id: qc, direction: out, kind: energy, delegates: qc2}
  # --- HYDR
  - id: R201
    block: HYDR
    title: Hydrogenator (neat IBAP over Raney nickel, 343 K)
    class: ReactingChemicals
    reactions: [HYD, HYD_OVER]
    reactor: conversion
    energy_port: q
    # the conversions of HYD and HYD_OVER (process/reactions.yaml): 0.995 of the IBAP, 0.98 of it to
    # IBPE and 0.02 to IBPET (SRC-1 Example 3A, D-005); not a selectivity: block, since core 1.13.0
    # validates only the first selectivity reactor of a flowsheet (L-6)
    conversion: {HYD: 0.975, HYD_OVER: 0.0199}
    links: [{target: equipment, ref: R-201}, {target: equipment, ref: F-201}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: h2, direction: in, delegates: h2}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: V201
    block: HYDR
    title: Hydrogen let down and vented (gas off the liquid)
    class: Separating
    recovery:
      outlets:
        gas: {H2: 1.0}
      provenance: assumed
      source: "the hydrogen left in R-201's head space vented when the batch is let down; none dissolved (D-007)"
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out, delegates: vent}
      - {id: liq, direction: out, delegates: out}
  # --- CARB
  - id: M301
    block: CARB
    title: Charge of R-301 (IBPE, recycled and fresh hydrochloric acid)
    class: Mixing
    links: [{target: equipment, ref: R-301}]
    ports:
      - {id: ibpe, direction: in, delegates: in}
      - {id: aq, direction: in}
      - {id: hcl, direction: in, delegates: hcl}
      - {id: out, direction: out}
  - id: R301
    block: CARB
    title: Carbonylation autoclave (CO at 16.6 MPa, 403 K, Pd catalyst)
    class: ReactingChemicals
    reactions: [CARBO, CARBO_LIN, ETHER]
    reactor: conversion
    energy_port: q
    selectivity:
      key: IBPE
      conversion: 0.99
      products: {IBU: 0.966, IPPA: 0.010, HE: 0.012}
      provenance: assumed
      source: "SRC-1 Example 100: 99 % conversion, 96.6 % ibuprofen, 1.0 % 3-IPPA; the 0.8 % heavy ends and the 1.6 % not accounted for taken as the ether of two IBPE, 0.012 mol per mol (ASSUMED, D-005)"
    links: [{target: equipment, ref: R-301}]
    ports:
      - {id: in, direction: in}
      - {id: co, direction: in, delegates: co}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: V301
    block: CARB
    title: Let-down and decanter (CO off, aqueous acid separated)
    class: Separating
    recovery:
      outlets:
        gas: {CO: 1.0}
        aq: {HCL: 0.97, H2O: 0.97}
      provenance: assumed
      source: "the CO vented on let-down; 97 % of the acid and water decanted from the organic phase (ASSUMED, D-007); the rest goes to the washes"
    links: [{target: equipment, ref: V-301}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out, delegates: vent}
      - {id: aq, direction: out}
      - {id: org, direction: out, delegates: out}
