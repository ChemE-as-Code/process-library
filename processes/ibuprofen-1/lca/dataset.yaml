  source: 'D-010 (agent proposal, for the LCA practitioner to confirm): the plant makes 0.456 kg of acetic
    acid (95.6 wt%, with acetic anhydride) per kg of ibuprofen, recovered as SRC-3 says the BHC process
    does. No physical relationship applies (none is a fuel), and the price ratio of an active pharmaceutical
    ingredient to a bulk acid is far above 5, so the WBCSD rule of docs/system-model.md gives economic
    allocation. No prices are sourced at the concept stage: the relative prices per kg 1 : 0.05 are ASSUMED.'
  deviation: The shares rest on ASSUMED relative prices. The conservative bound is all burdens to the
    ibuprofen; mass allocation would leave it 69 %. Sourced prices replace the ratio.
