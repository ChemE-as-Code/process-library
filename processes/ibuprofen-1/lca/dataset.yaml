schema: cheme/lci_dataset/v2
kind: lci_dataset
id: ibuprofen-by-the-bhc-route-hf-acylation-hydrogenation-and-pd-carbonylation-3500-t-a
title: Ibuprofen by the BHC route, HF acylation, hydrogenation and Pd carbonylation (3500 t/a)
description: Unallocated foreground LCI of Ibuprofen by the BHC route, HF acylation, hydrogenation and
  Pd carbonylation (3500 t/a), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Batch plant on the BHC route: isobutylbenzene acetylated in anhydrous HF at 353 K (acetic
  anhydride dosed, semi-batch), HF stripped and recycled, acetic acid cut as a co-product; IBAP hydrogenated
  neat over Raney nickel at 343 K; IBPE carbonylated with CO in aqueous HCl over a Pd(II) phosphine catalyst
  at 403 K and 16.6 MPa; the melt washed, vacuum-distilled and crystallised from hexane at 278 K, filtered
  and vacuum-dried; 3977 kg per batch, 880 batches a year on a dedicated train'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:reactor-vent
  title: storage-tank emissions of R-101, C-101, T-101, V-101
  direction: output
  reason: 'No P&ID yet: the nitrogen pad of R-101 and T-101 and the inerts displaced while charging carry
    HF vapour to the caustic scrubber; not estimated beyond the 0.1 % HF loss of S10 (open for basic engineering,
    D-011).'
- key: emission-excluded:gas-reactors
  title: storage-tank emissions of R-201, R-301
  direction: output
  reason: The hydrogen and CO the reactors give off are carried (S15, S21, to the thermal oxidiser S47);
    the organics' vapour in them, and the purges before opening, are not estimated (D-011).
- key: emission-excluded:acid-and-residue-tanks
  title: storage-tank emissions of T-301, T-403, T-404
  direction: output
  reason: The breathing of the aqueous HCl tank (HCl vapour to a water scrubber) and of the residue tanks
    is not estimated (D-011).
- key: emission-excluded:hexane-breathing
  title: storage-tank emissions of CR-401, F-401, D-401, T-402
  direction: output
  reason: Hexane vapour from the crystalliser, filter, dryer vacuum pump and tank breathing (nitrogen-blanketed,
    to a vent condenser) not estimated; the make-up S35 covers the losses the balance counts (D-008, D-011).
