# The batch recipe of paracetamol-1 (schema cheme/recipe/v1, `cheme process recipe`, DESIGN.md
# D-003). One batch makes the dried paracetamol of stream S15; the flowsheet's rates are the
# year averages: the batch x the batches a year / 7920 h = 252.53 kg/h. The dosing and
# post-reaction take their times from R101's semi-batch model and the digestion from R102's
# batch model (from: R101, R102); the heat-up to 358 K and the cooling crystallisation to 293 K
# take theirs from R-101's jacket (temperatures:), the drying from D101's drying rate on the
# area the cake wets; every other duration is ASSUMED (D-003). R-101 is the bottleneck; the
# dissolver, the centrifuge and the dryer take each batch within its cycle. R-101's, M-101's
# and D-101's vessels are sized from one batch's content (core ADRs 0052, 0057).
# `cheme process recipe --svg build/gantt.svg` draws one batch.
schema: cheme/recipe/v1
kind: recipe
title: Paracetamol by semi-batch acetylation of 4-aminophenol in water
batch_size: {value: 2516.47, unit: kg, stream: S15, provenance: assumed, source: "one batch of dried paracetamol: 2000 t/a over the batches R-101's cycle allows (D-002, D-003)"}
hours_per_year: {value: 7920, provenance: assumed, source: "330 days of 24 h (D-002)"}
unit_procedures:
  - id: DISSOLVE
    unit: M101
    title: Dissolve the aminophenol at 358 K, carbon treatment, polish filtration, cool to 313 K (M-101, F-100)
    operations:
      - {id: charge, kind: charge, title: "Water, recycled mother liquor and 4-aminophenol", duration: {value: 1.0, provenance: assumed, source: D-003}}
      - {id: heat, kind: heat, title: Heat to 358 K on the hot-water loop, duration: {value: 1.5, provenance: assumed, source: "D-003: Q1, about 0.71 GJ a batch, about 130 kW over 1.5 h"}}
      - {id: carbon, kind: hold, title: "Activated carbon, stir at 358 K (SRC-1)", duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: polish, kind: transfer, title: "Through the polish filter F-100 back to M-101", duration: {value: 1.0, provenance: assumed, source: D-003}}
      - {id: cool, kind: cool, title: Cool to 313 K on cooling water, duration: {value: 2.0, provenance: assumed, source: "D-003: Q2, about 0.51 GJ a batch, about 70 kW over 2 h"}}
      - {id: transfer, kind: transfer, title: Charge R-101, duration: {value: 0.5, provenance: assumed, source: D-003}}
  - id: REACT
    units: [R101, CR101]
    title: Dose the anhydride at 313 K, digest at 358 K, cool to 293 K to crystallise (R-101)
    vessel:
      fill_fraction: 0.8
      aspect_ratio: 1.2
      jacket: {u: 300, coolant_temperature: 280.71, heating_temperature: 383.15, provenance: assumed, source: "glass-lined steel, U 300 W/(m2 K) ASSUMED; chilled water enters the jacket at 278.15 K and leaves at 283.15 K (design basis, D-009), so the mass at 313.15 K sees a log-mean driving force of (35 - 30) / ln(35/30) = 32.44 K: core takes the coolant temperature as constant, so the equivalent 313.15 - 32.44 = 280.71 K is entered; for the crystallisation's cool-down to 293.15 K this is optimistic at its end (D-009). Heating on a pressurised hot-water loop at 383.15 K from LP steam, above the MTT 373.15 K: a failed temperature control boils the mass into R-101's condenser (D-011)"}
      metal_heat_capacity: 7000
      provenance: assumed
      source: "usual fill and proportions of a glass-lined stirred vessel (D-003); its metal, about 14 t of glass-lined steel with the jacket, agitator and nozzles, at 0.5 kJ/(kg K) = 7000 kJ/K, ASSUMED (no vessel mass sourced, D-009): in the heat-up and cool-down times and in CR101's duty Q5 (core ADR 0063)"
    operations:
      - {id: receive, kind: charge, title: Receive the charge from M-101, duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: dose, kind: dose, title: Dose the acetic anhydride from V-101 (R101), from: R101}
      - {id: react, kind: react, title: Post-reaction (R101), from: R101}
      - {id: heat, kind: heat, title: Heat to 358 K (R102), temperatures: [313.15, 358.15]}
      - {id: digest, kind: react, title: Digest at 358 K (R102), from: R102}
      - {id: cool, kind: cool, title: Cool to 293 K to crystallise (CR101), temperatures: [358.15, 293.15]}
      - {id: hold, kind: hold, title: Crystallisation hold at 293 K (CR101), duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: transfer, kind: transfer, title: Slurry to the centrifuge feed tank T-103, duration: {value: 0.5, provenance: assumed, source: D-003}}
  - id: ISOLATE
    units: [F101, SP101, W101, F102]
    title: Centrifuge, wash with cold water and spin dry (C-101, in loads from T-103)
    operations:
      - {id: spin, kind: other, title: "Load, spin off the mother liquor (F101), split it to T-101 and T-102 (SP101)", duration: {value: 3.0, provenance: assumed, source: "D-003: about six loads of a vertical peeler centrifuge a batch"}}
      - {id: wash, kind: other, title: Wash the cake with cold water (W101) and spin dry (F102), duration: {value: 2.0, provenance: assumed, source: D-003}}
      - {id: discharge, kind: transfer, title: Peel the cakes into D-101, duration: {value: 1.0, provenance: assumed, source: D-003}}
  - id: DRY
    units: [D101]
    title: Vacuum drying at 343 K (D-101)
    vessel: {fill_fraction: 0.6, aspect_ratio: 1.0, provenance: assumed, source: "a conical vacuum dryer filled to 60 % (D-009)"}
    operations:
      - {id: receive, kind: charge, title: Receive the wet cake, duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: dry, kind: dry, title: Vacuum drying at 343 K (D101), from: D101}
      - {id: discharge, kind: transfer, title: "Cool, break the vacuum with nitrogen, discharge to packing", duration: {value: 1.0, provenance: assumed, source: D-003}}
