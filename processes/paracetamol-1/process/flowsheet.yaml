# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Paracetamol by the acetylation of 4-aminophenol in aqueous acetic acid (DESIGN.md D-001), a
# batch plant on the route of US 3 917 695 A (SRC-1): the aminophenol is dissolved at 358 K in
# water and half of the last batch's mother liquor, treated with activated carbon, polished and
# cooled to 313 K; acetic anhydride (1.15 mol per mol) is dosed into it (a semi-batch, reactor:
# semibatch), the mass is digested at 358 K (the anhydride's excess hydrolysed), cooled to
# 293 K to crystallise the paracetamol, centrifuged, washed with cold water and vacuum-dried at
# 343 K. Half of the mother liquor goes back into the next charge (SRC-1, Example 4), the other
# half, the wash filtrate and the dryer's condensate to wastewater treatment.
# The flows are the year averages of the batch recipe (process/recipe.yaml, `cheme process
# recipe`, D-003).
# Where the values come from:
# - feeds, temperatures, pressures, ratios: design basis and D-002..D-009, ASSUMED or from SRC-1;
# - R101: cheme's semi-batch model (the rate laws of ACET and HYD, D-005), to 0.998 conversion
#   of the aminophenol; R102: cheme's batch model, the digestion to 0.9999 conversion of the
#   anhydride; CR101 and W101: core's crystallizer with the liquor's other solutes as
#   spectators, the solubility of paracetamol in water (SRC-3) and a salting-in coefficient of
#   the acetic acid calibrated to SRC-1 Example 1 (D-007); F101, F102: the centrifuge's
#   specified splits; D101: core's dryer to a residual moisture; SP101: the recycle split; M101,
#   M102: mixers (all calculated by `cheme process propagate --fill`, the recycle converged at
#   the tear S16, core ADR 0060);
# - the duties of R101 (Q3), R102 (Q4, with the heat-up), CR101 (Q5, with R-101's metal) and
#   D101 (Q6): written by `cheme process propagate --fill` from the models (core ADRs 0059,
#   0063);
# - the feeds that make 2000 t/a, the dissolver's duties Q1 and Q2 and the temperature of S18:
#   the independent balance scripts/balance.py (D-006, ADR 0027 of the library), given here as
#   ASSUMED: no property package of core is qualified for this liquor, and core does not size
#   feeds to a product rate.
schema: cheme/process/v1
kind: flowsheet
title: Paracetamol by semi-batch acetylation of 4-aminophenol in aqueous acetic acid (2000 t/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 2000 t/a dried paracetamol, year averages of the batch recipe in 7920 h (D-002, D-003)", default: true}
tolerance: {abs: 0.05, rel: 0.002}   # balances: |in - out| <= abs + rel * max(in, out), kg/h
# One recycle (core ADR 0060): half of the mother liquor S9 back into the next charge, torn at
# S16 (D-008). Its tolerance is far tighter than the balances'.
tears:
  - stream: S16
    initial: {flow: 762.7, unit: kg/h, basis: mass_fraction, composition: {H2O: 0.733, HOAC: 0.200, APAP: 0.066, APAP_S: 0.0008, PAP: 0.0002}}
convergence: {method: wegstein, max_iterations: 500, tolerance: {abs: 1.0e-6, rel: 1.0e-8}}

feeds:
  - {id: PW, title: Process water (charge make-up), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PAPF, title: 4-Aminophenol (merchant; no library process), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AC2OF, title: Acetic anhydride (acetic-anhydride-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: WASHW, title: Cold process water (cake wash), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: m101, direction: out, kind: energy}
      - {id: r101, direction: out, kind: energy}
      - {id: c101, direction: out, kind: energy}
      - {id: d101, direction: out, kind: energy}
  - id: LPS
    title: LP steam 350 kPa(a) (to the hot-water loops and the dryer's jacket)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 350, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 412.0, provenance: given, source: "saturation at 350 kPa(a), IAPWS-IF97"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: m101, direction: out, kind: energy}
      - {id: r102, direction: out, kind: energy}
      - {id: d101, direction: out, kind: energy}
products:
  - {id: APAP, title: Paracetamol crystals to packing, category: product, ports: [{id: in, direction: in}]}
  - {id: WW, title: "Mother liquor purge, wash filtrate and dryer condensate to wastewater treatment", category: wastewater, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: m101, direction: in, kind: energy}
  - id: CHW
    title: Chilled water return
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 278.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 283.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: cr101, direction: in, kind: energy}

blocks:
  - id: PREP
    title: Dissolution and carbon treatment
    class: Mixing
    ports:
      - {id: pw, direction: in}
      - {id: pap, direction: in}
      - {id: ml, direction: in}
      - {id: out, direction: out}
      - {id: qh, direction: in, kind: energy}
      - {id: qc, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: REACT
    title: Acetylation, digestion and crystallisation
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: ac2o, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy}
      - {id: qh, direction: in, kind: energy}
      - {id: qcr, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: ISOL
    title: Centrifuging, washing, drying and mother-liquor split
    class: SeparatingMechanically
    ports:
      - {id: in, direction: in}
      - {id: wash, direction: in}
      - {id: product, direction: out}
      - {id: recycle, direction: out}
      - {id: ww, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: power_c, direction: in, kind: energy}
      - {id: power_d, direction: in, kind: energy}

steps:
  - id: M101
    block: PREP
    title: Dissolver (aminophenol in water and mother liquor at 358 K, carbon, cooled to 313 K)
    class: Mixing
    links: [{target: equipment, ref: M-101}, {target: equipment, ref: F-100}]
    ports:
      - {id: pw, direction: in, delegates: pw}
      - {id: pap, direction: in, delegates: pap}
      - {id: ml, direction: in, delegates: ml}
      - {id: out, direction: out, delegates: out}
      - {id: qh, direction: in, kind: energy, delegates: qh}
      - {id: qc, direction: out, kind: energy, delegates: qc}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: R101
    block: REACT
    title: Acetylator (acetic anhydride dosed into the 313 K charge)
    class: ReactingChemicals
    reactions: [ACET, HYD]
    reactor: semibatch
    batch:
      dosing: [{stream: S4, time: 9000}]
      target: {key: PAP, conversion: 0.998}
      heat: isothermal
      provenance: assumed
      source: "acetic anhydride dosed at a constant rate over 2.5 h into the charge at 313.15 K (SRC-1: added at 35 to 40 C; over 5 min in the laboratory examples, here over the time R-101's jacket on chilled water needs, D-005), held to 0.998 conversion of the aminophenol"
    hazard:
      mtt: 373.15
      provenance: assumed
      source: "MTT: the normal boiling point of water, a lower bound of the reaction mass's bubble point at 101.325 kPa(a) (acetic acid, 17 wt% at the end, is less volatile than water and forms no azeotrope with it; the solutes have no vapour pressure); R-101 is vented through its condenser, so the mass boils there (D-011)"
    links: [{target: equipment, ref: R-101}, {target: equipment, ref: V-101}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: ac2o, direction: in, delegates: ac2o}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: R102
    block: REACT
    title: Digestion at 358 K (the anhydride's excess hydrolysed)
    class: ReactingChemicals
    reactions: [ACET, HYD]
    reactor: batch
    batch:
      target: {key: AC2O, conversion: 0.9999}
      heat: isothermal
      heat_up: true
      provenance: assumed
      source: "the mass heated from 313.15 to 358.15 K and held until 0.9999 of the anhydride left is converted (SRC-1 Example 1: heated to 85 C after the acetylation; D-005); the heat-up counted in the duty (core ADR 0063)"
    hazard:
      mtt: 373.15
      provenance: assumed
      source: "as R101 (D-011)"
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: qh}
  - id: CR101
    block: REACT
    title: Cooling crystallisation to 293 K
    class: Crystallizing
    crystallizer:
      solute: APAP
      solvent: H2O
      crystal: APAP_S
      basis: solubility
      temperature: 293.15
      solubility:
        unit: kg/kg_solvent
        points: [[293.15, 0.012774], [298.15, 0.015552], [303.15, 0.017574], [308.15, 0.021536], [313.15, 0.026515]]
        provenance: given
        source: "Jimenez and Martinez (2006), J. Braz. Chem. Soc. 17(1), 125-134, the mole-fraction solubility of acetaminophen in pure water at 20.0 to 40.0 C (0 % propylene glycol), converted here to kg per kg water, x/(1-x) x 151.165/18.015 (SRC-3, D-007); 293.15 K is the lowest point: core does not extrapolate, so the crystallisation ends at 20 C, not the 10 to 15 C of SRC-1 (L-3)"
        salting_out:
          coefficients: {HOAC: -0.1865, PAP: 0.0, AC2O: 0.0}
          provenance: assumed
          source: "HOAC (salting in): calibrated so that the crystallizer reproduces SRC-1 Example 1, 110 g of product from 109 g of 4-aminophenol, the 41 g of paracetamol not isolated taken as dissolved in the mother liquor's water with 4.01 mol/kg of acetic acid (scripts/balance.py calibration(), D-007); no open solubility data of paracetamol in aqueous acetic acid read; PAP and AC2O, traces: 0"
      energy: {heat_capacity: 3.244, heat_of_crystallization: 0.0, provenance: assumed, source: "the feed S6's heat capacity from the components' liquid heat capacities of process/materials.yaml (scripts/balance.py composition, 3.244 kJ/(kg K)); the heat of crystallisation is counted in ACET's heat of reaction (the product taken as formed solid, D-005), so 0 here"}
      spectators: [HOAC, PAP, AC2O]
      outlets: {slurry: out}
    # the crystallizer's lumped duty (the slurry's cool-down from 358 to 293 K) and R-101's metal
    # cooled with it (the REACT vessel's metal_heat_capacity, core ADR 0063) go on Q5 (D-009)
    energy_port: q
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
      - {id: q, direction: out, kind: energy, delegates: qcr}
  - id: F101
    block: ISOL
    title: Centrifuging the mother liquor off
    class: Filtering
    solid_separation:
      solid_recovery: 0.995
      cake_liquid: {value: 0.15, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "a vertical peeler centrifuge (SRC-1: centrifuge filtration), 99.5 % of the crystals to the cake, the cake spun to 0.15 kg of liquor per kg of crystals (D-007)"
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power_c}
  - id: SP101
    block: ISOL
    title: Mother liquor split (half back to the next charge)
    class: SplittingMaterial
    split: {recycle: 0.5}
    links: [{target: equipment, ref: T-101}]
    ports:
      - {id: in, direction: in}
      - {id: recycle, direction: out, delegates: recycle}
      - {id: purge, direction: out}
  - id: W101
    block: ISOL
    title: Cake wash with cold water (paracetamol dissolves to saturation)
    class: Crystallizing
    crystallizer:
      solute: APAP
      solvent: H2O
      crystal: APAP_S
      basis: solubility
      temperature: 293.15
      solubility:
        unit: kg/kg_solvent
        points: [[293.15, 0.012774], [298.15, 0.015552], [303.15, 0.017574], [308.15, 0.021536], [313.15, 0.026515]]
        provenance: given
        source: "as CR101 (SRC-3, D-007)"
        salting_out:
          coefficients: {HOAC: -0.1865, PAP: 0.0, AC2O: 0.0}
          provenance: assumed
          source: "as CR101 (D-007)"
      spectators: [HOAC, PAP, AC2O]
      outlets: {slurry: out}
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: cake, direction: in}
      - {id: wash, direction: in, delegates: wash}
      - {id: out, direction: out}
  - id: F102
    block: ISOL
    title: Spinning the washed cake
    class: Filtering
    solid_separation:
      solid_recovery: 0.995
      cake_liquid: {value: 0.15, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "as F101 (D-007)"
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out}
  - id: D101
    block: ISOL
    title: Vacuum drying at 343 K
    class: Drying
    dryer:
      volatiles: [H2O, HOAC, AC2O]
      residual_moisture: {value: 0.002, basis: mass_fraction, provenance: assumed, source: "0.2 wt% volatiles in the dried product (D-008)"}
      temperature: 343.15
      energy:
        heat_capacity: 1.4
        latent_heat: {H2O: 2333.0, HOAC: 393.3, AC2O: 446.0}
        vessel_heat_capacity: 2000
        efficiency: 0.7
        port: steam
        provenance: assumed
        source: "wet cake 1.4 kJ/(kg K) (paracetamol 1.17 with 0.15 kg of water per kg), 70 % efficiency (D-009); latent heats at 343.15 K: water 2333.0, acetic acid 393.3 and acetic anhydride 446.0 kJ/kg (thermo 0.6.1, Chemical(...).Hvap, its default methods); the dryer's metal, about 4 t of steel at 0.5 kJ/(kg K), heated from 293 K each batch, ASSUMED (D-009)"
      drying_rate: {value: 4.0, provenance: assumed, source: "ASSUMED mean rate of a jacketed conical vacuum dryer: a wall flux of about 2.6 kW/m2 over 2333 kJ/kg (D-009)"}
      cake_density: {value: 750, provenance: assumed, source: "ASSUMED bulk density of the wet cake: paracetamol crystals 1.293 g/cm3 (PubChem CID 1983) with 0.15 kg of water per kg and about 45 % voids (D-009)"}
      outlets: {product: product, vapour: vapour}
    links: [{target: equipment, ref: D-101}, {target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: product, direction: out, delegates: product}
      - {id: vapour, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: power, direction: in, kind: energy, delegates: power_d}
  - id: M102
    block: ISOL
    title: Liquor collection to wastewater
    class: Mixing
    links: [{target: equipment, ref: T-102}]
    ports:
      - {id: ml, direction: in}
      - {id: wf, direction: in}
      - {id: cond, direction: in}
      - {id: out, direction: out, delegates: ww}

streams:
  - id: S1
    title: Process water
    from: PW.out
    to: M101.pw
    template: liquor
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "design basis"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 591.5398, provenance: assumed, source: "scripts/balance.py: the charge's liquid 5.87 kg per kg of fresh aminophenol (SRC-1 Example 1), less the recycled mother liquor's (D-004)"}
        composition: {basis: mass_fraction, values: {H2O: 1.0}, provenance: given, source: "pure water"}
  - id: S2
    title: 4-Aminophenol
    from: PAPF.out
    to: M101.pap
    template: liquor
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "design basis"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 221.7832, provenance: assumed, source: "scripts/balance.py: the aminophenol that makes 2000 t/a (D-002)"}
        composition: {basis: mass_fraction, values: {PAP: 1.0}, provenance: assumed, source: "technical 4-aminophenol, impurities not modelled (D-004)"}
  - id: S16
    title: Recycled mother liquor
    from: SP101.recycle
    to: M101.ml
    template: liquor
    state:
      design:
        temperature: {value: 293.15, provenance: assumed, source: "the mother liquor from C-101 (D-008)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 761.103, provenance: calculated, source: 'cheme process propagate: recycle SP101 from S9 (tear, wegstein)', fingerprint: f1911ab4ddda4359}
        composition: {basis: mole_fraction, values: {H2O: 0.915188, PAP: 2.23012e-10, AC2O: 7.35732e-08, HOAC: 0.0748887, APAP: 0.0097983, APAP_S: 0.000124685}, provenance: calculated, source: 'cheme process propagate: recycle SP101 from S9 (tear, wegstein)', fingerprint: f1911ab4ddda4359}
  - id: S3
    title: Charge (aminophenol solution, 313 K)
    from: M101.out
    to: R101.in
    template: liquor
    state:
      design:
        temperature: {value: 313.15, provenance: assumed, source: "dissolved at 358 K, carbon-treated and cooled to 313 K in M-101 (SRC-1; D-005)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 1574.43, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S2 S16', fingerprint: f704d5f037e59899}
        composition: {basis: mole_fraction, values: {H2O: 0.928648, PAP: 0.0295745, AC2O: 3.62417e-08, HOAC: 0.0368897, APAP: 0.00482658, APAP_S: 6.1419e-05}, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S2 S16', fingerprint: a2c28b07f2f02c81}
  - id: S4
    title: Acetic anhydride (dosed)
    from: AC2OF.out
    to: R101.ac2o
    template: liquor
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "storage (D-005)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 239.7983, provenance: assumed, source: "scripts/balance.py: 1.15 mol per mol of fresh aminophenol (SRC-1 Example 6, D-004)"}
        composition: {basis: mass_fraction, values: {AC2O: 0.995, HOAC: 0.005}, provenance: assumed, source: "acetic anhydride 99.5 wt% of acetic-anhydride-1, the rest taken as acetic acid (D-004)"}
  - id: S5
    title: Acetylated mass
    from: R101.out
    to: R102.in
    template: liquor
    state:
      design:
        composition: {basis: mole_fraction, values: {H2O: 0.89428, PAP: 9.3846e-09, AC2O: 0.000718344, HOAC: 0.0716823, APAP: 0.0332602, APAP_S: 5.93821e-05}, provenance: calculated, source: 'cheme process propagate: reactor R101 from S3 S4', fingerprint: 0619cd9c546c5157}
        flow: {value: 1814.23, provenance: calculated, source: 'cheme process propagate: reactor R101 from S3 S4', fingerprint: 09b68f45ab1e7cf8}
        temperature: {value: 313.15, provenance: calculated, source: 'cheme process propagate: reactor R101 from S3 S4', fingerprint: 0619cd9c546c5157}
        pressure: {value: 101.325, provenance: calculated, source: 'cheme process propagate: reactor R101 from S3 S4', fingerprint: 0619cd9c546c5157}
  - id: S6
    title: Digested mass (358 K)
    from: R102.out
    to: CR101.in
    template: liquor
    state:
      design:
        temperature: {value: 358.15, provenance: assumed, source: "digestion at 85 C (SRC-1 Example 1, D-005)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 1814.23, provenance: calculated, source: 'cheme process propagate: reactor R102 from S5', fingerprint: 1eb7126d6bceb7bc}
        composition: {basis: mole_fraction, values: {H2O: 0.893562, PAP: 2.17781e-10, AC2O: 7.18344e-08, HOAC: 0.0731188, APAP: 0.0332602, APAP_S: 5.93821e-05}, provenance: calculated, source: 'cheme process propagate: reactor R102 from S5', fingerprint: b4f960cc98a584e4}
  - id: S7
    title: Paracetamol slurry
    from: CR101.out
    to: F101.in
    template: liquor
    state:
      design:
        temperature: {value: 293.15, provenance: assumed, source: "cooled to 293 K (D-007)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 1814.23, provenance: calculated, source: 'cheme process propagate: crystallizer CR101 from S6', fingerprint: c9b28c1a01eb40ca}
        composition: {basis: mole_fraction, values: {APAP: 0.0095667, H2O: 0.893562, APAP_S: 0.0237529, HOAC: 0.0731188, PAP: 2.17781e-10, AC2O: 7.18344e-08}, provenance: calculated, source: 'cheme process propagate: crystallizer CR101 from S6', fingerprint: c9b28c1a01eb40ca}
