# paracetamol-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# The preliminary LCI leaves most backgrounds unmapped (DESIGN.md D-012): the build reports each
# as a gap (lci/gaps.json). Linked here: the acetic anhydride to acetic-anhydride-1, and the LP
# steam counted as heat delivered (kWh), as n-bromosuccinimide-1 does. The 4-aminophenol stays a
# gap: no library process exports it or nitrobenzene; its proxy is recorded in lca.yaml and
# DESIGN.md D-012, not linked (CONTRIBUTING, "Gaps").
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:AC2OF": {dataset: {path: processes/acetic-anhydride-1/lca/dataset.yaml, product: "product:AC2O"}, source: "the Atlas producer acetic-anhydride-1, acetic anhydride 99.5 wt-% to storage; kg for kg (D-004)"}
  "feed:LPS": {use: steam-heat, source: "LP steam 350 kPa(a) to the hot-water loops of M-101 and R-101 (Q1, Q4) and the dryer's jacket (Q6), counted as heat delivered (kWh), D-009"}
