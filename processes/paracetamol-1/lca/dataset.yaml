technology: 'Batch plant: 4-aminophenol dissolved in water and recycled mother liquor at 358 K and carbon-treated,
  acetic anhydride dosed over 2.5 h at 313 K (semi-batch), digested at 358 K, crystallised by cooling
  to 293 K, centrifuged, washed with cold water and vacuum-dried at 343 K; half of the mother liquor recycled;
  2602.10 kg per batch, 769 batches a year on a dedicated train'
