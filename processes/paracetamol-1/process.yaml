schema: cheme-as-code/process/v1
id: paracetamol-1
title: Paracetamol by semi-batch acetylation of 4-aminophenol in aqueous acetic acid (2000 t/a)
summary: >-
  A batch plant on Mallinckrodt's aqueous route: 4-aminophenol dissolved in water and recycled
  mother liquor, carbon-treated, acetic anhydride (acetic-anhydride-1) dosed at 313 K, digested at
  358 K, crystallised by cooling, centrifuged, washed and vacuum-dried; half of the mother liquor
  recycled. Concept stage, 2516 kg per batch every 9.97 h, thermal screening with a rate-constant
  sensitivity, preliminary gate-to-gate LCI.
description: |
  4-Aminophenol is dissolved at 358 K in water and half of the last batch's mother liquor (5.87
  kg of liquid per kg), treated with activated carbon, polish-filtered and cooled to 313 K; acetic
  anhydride, 1.15 mol per mol, is dosed over 2.5 h: C6H7NO + C4H6O3 -> C8H9NO2 + C2H4O2, the
  excess hydrolysed to acetic acid. The mass is digested at 358 K, cooled to 293 K, and the
  crystals are centrifuged, washed with cold water and dried at 343 K under vacuum (the route of
  US 3 917 695 A, Mallinckrodt, Examples 1, 4 and 6). Half of the mother liquor goes back into the
  next charge; the other half, the wash filtrate and the dryer's condensate (3.97 kg per kg, 16 wt%
  acetic acid, 5.5 wt% paracetamol) go to wastewater treatment. The product is 99.8 wt%
  paracetamol, the dried crude before a pharmacopoeial recrystallisation (outside the boundary);
  the yield is 82.0 % of theory on the aminophenol (the patent's Example 4, half the filtrate
  recycled once: 84.8 %).

  The batch is modelled with cheme-as-code's semi-batch and batch reactors, crystallizers with
  spectators and a Setschenow correction, a specified centrifuge, the dryer, a tear on the
  mother-liquor recycle and the batch recipe (core ADRs 0050 to 0063, 0070): the dryer is the
  bottleneck (cycle 9.965 h, 795 batches a year on a dedicated train), the recipe sizes R-101 (25
  m3) and checks its chilled-water jacket against the dosing (254 of 265 kW), and every model
  writes its own duty. The solubility of paracetamol in water is open data (Jimenez and Martinez
  2006); the acetic acid's salting in is calibrated to the patent's Example 1. The kinetics are
  ASSUMED; the screening gives an MTSR of 313.6 K (2.2 % accumulation) against an MTT of 373.15 K,
  and with 100 times slower reactions 317.1 K: even all the anhydride at once only takes the mass
  35 K up, but not from the digestion's 358 K, so the dosing needs a temperature permissive. See
  DESIGN.md for every assumption.
families: [nitrogen-organics]
keywords: [paracetamol, acetaminophen, APAP, N-acetyl-4-aminophenol, 4-aminophenol, acetic anhydride, acetic acid, acetylation, semi-batch, batch, dosing, cooling crystallisation, centrifuge, vacuum drying, mother liquor recycle, activated carbon, thermal screening, pharmaceuticals, active pharmaceutical ingredient]
facets:
  feedstock_basis: [fossil, electricity, water]
  product_classes: [chemicals]
  unit_operations: [reaction, crystallization, filtration, drying]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, kinetics, the heat of
# acetylation, the salting-in calibration, the centrifuge and the dryer are assumed; ratios,
# temperatures and the work-up from the patent's examples (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept batch PFD with closed mass, component and element balances (cheme validate, cheme
    process streams: 3 blocks and 10 steps within tolerance; the mother-liquor recycle converged
    at the tear S16 in 10 Wegstein iterations). The semi-batch R101 and the digestion R102 (from
    their ASSUMED rate laws), the cooling crystallisation CR101 and the wash W101 (crystallizers
    with the solubility of paracetamol in water at 293 to 313 K from Jimenez and Martinez 2006 and
    a Setschenow coefficient of the acetic acid, -0.1865 kg/mol, calibrated to US 3 917 695 A
    Example 1), the centrifuge's specified splits, the dryer D101 and the recycle split are
    calculated by cheme process propagate, which writes the duties of R101, R102, CR101 (with
    R-101's ASSUMED metal); the dryer's steam from cheme's dryer model. scripts/balance.py gives
    the feeds for 2000 t/a and the dissolver's duties (no property package of core covers this
    liquor, and core does not solve feeds for a product rate). The recipe's year-average rate of
    the product agrees with the flowsheet (no cheme.recipe-basis finding); it sizes R-101 (25 m3)
    and D-101 (8 m3) and checks R-101's chilled-water jacket (254 of 265 kW at the dosing's peak).
    Thermal screening (cheme process reactor-hazards): R101 dT_ad 35.2 K, accumulation 2.18 %,
    MTSR 313.6 K against an MTT of 373.15 K (water's boiling point, a lower bound of the mass's);
    k/10 8.2 % and 315.0 K, k/100 15.1 % and 317.1 K; no criticality class without a TD24. The
    heat of acetylation is ASSUMED from the acetanilide analogue (-100.9 kJ/mol). Preliminary
    gate-to-gate LCI with the activated carbon per batch; the acetic anhydride linked to
    acetic-anhydride-1, the 4-aminophenol a gap with a recorded proxy (nitrobenzene
    hydrogenation), the other backgrounds gaps. cheme maturity reaches no level (assumed feeds,
    kinetics and separations); the claim `maturity: concept` is the lowest value of the schema,
    not an evidenced level. Not reviewed. Needs cheme-as-code 1.12.0.
