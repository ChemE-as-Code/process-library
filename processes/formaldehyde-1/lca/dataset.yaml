    to atmospheric pressure, so there is little driving force for leaks (BREF s. 6.3.1.4). To be estimated
    with the equipment-leaks method at basic engineering'
  source: BREF LVOC 2017 s. 6.3.1.4
- key: emission-excluded:storage
  title: storage-tank emissions of the plant
  direction: output
  reason: methanol and formalin tanks are outside the boundary (D-001); BREF Table 6.9 gives 3 g/t after
    a scrubber for formalin storage and 0.4-10 g/t for handling, for the tank-farm dataset
  source: BREF LVOC 2017 Table 6.9
- key: emission-excluded:wastewater
  title: effluent emissions of the plant
  direction: output
  reason: no continuous aqueous effluent in normal operation (BREF s. 6.3.2); discontinuous rinse and
    condensate streams are reused to dilute the product (BAT 46 a); ion-exchange regeneration water is
    outside the boundary (D-001)
  source: BREF LVOC 2017 s. 6.3.2 and BAT 46
