# formaldehyde-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# There is no override. The exported MP steam (product:MPS) has none on purpose: a positive
# technosphere exchange is a consumption, so `use: steam-heat` would book the export as steam
# bought in. It stays a reported gap until its credit or allocation is decided (DESIGN.md D-010).
# The other gaps of this process in the Atlas build (methanol, the catalysts, oil and filters and
# their disposal) need shared entries of lci/mappings.yaml, not overrides here: see D-010.
schema: cheme-as-code/lci-process-mappings/v1
exchanges: {}
