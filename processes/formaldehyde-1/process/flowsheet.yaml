# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Formaldehyde by methanol oxidation over iron molybdate (Formox type), 20 t/h of 50 wt%
# formalin (D-001, D-002). Where the values come from:
# - boundary conditions, temperatures and pressures: design basis and decisions, ASSUMED;
# - the reactor R101 outlet: cheme (conversion reactor from the sourced per-pass conversion and
#   selectivities, D-004); the ECS R301 outlet: cheme (assumed conversions, D-008);
# - mixers, blower, exchanger sides and the recycle splitter: `cheme process propagate --fill`;
# - the absorber C201 outlets (off-gas, formalin), the process water, the air rate, the split
#   fraction, all temperatures that need a liquid enthalpy and every duty: the independent
#   balance scripts/formox_balance.py (D-006), given here as ASSUMED: no property method of core
#   covers aqueous formaldehyde (D-009).
schema: cheme/process/v1
kind: flowsheet
title: Formaldehyde (Formox, iron molybdate), 20 t/h formalin 50 wt%
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 20 t/h formalin 50 wt% HCHO (10 t/h HCHO), yield 93 %, off-gas recycle 71 % (D-002, D-004, D-005)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: AIR, title: Ambient air (humid), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: MEOH, title: "Methanol from storage (boundary feed; made by processes/methanol-1)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PW, title: Process water (demineralised) to the absorber, category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports: [{id: k101, direction: out, kind: energy}, {id: c201, direction: out, kind: energy}]
products:
  - {id: FORMALIN, title: Formalin 50 wt% to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: STACK, title: ECS outlet to stack (atmosphere), category: emission, ports: [{id: in, direction: in}]}
  - id: STEAM
    title: MP steam export 1500 kPa(a) (hot-oil steam generator and ECS steam generator)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1500, provenance: assumed, source: "design basis, D-007"}
      supply_temperature: {value: 471.4, provenance: assumed, source: "saturation at 1500 kPa(a), D-007"}
      min_approach: {value: 20, provenance: assumed, source: D-007}
    ports: [{id: r101, direction: in, kind: energy}, {id: r301, direction: in, kind: energy}]
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-007"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-007"}
      min_approach: {value: 5, provenance: assumed, source: D-007}
    ports: [{id: c201, direction: in, kind: energy}]

blocks:
  - id: FEED
    title: Gas circulation and methanol feed
    class: Mixing
    ports:
      - {id: air, direction: in}
      - {id: meoh, direction: in}
      - {id: rec, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy}
  - id: RXN
    title: Methanol vaporisation and oxidation
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: steam, direction: out, kind: energy}
  - id: ABS
    title: Formaldehyde absorption and off-gas recycle
    class: SeparatingByPhysicalProcess
    ports:
      - {id: gas, direction: in}
      - {id: water, direction: in}
      - {id: product, direction: out}
      - {id: rec, direction: out}
      - {id: vent, direction: out}
      - {id: cw, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: ECS
    title: Emission control system (catalytic oxidation)
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: steam, direction: out, kind: energy}

steps:
  - id: M101
    block: FEED
    title: Fresh air / recycle gas junction (blower suction)
    class: Mixing
    ports:
      - {id: air, direction: in, delegates: air}
      - {id: rec, direction: in, delegates: rec}
      - {id: out, direction: out}
  - id: K101
    block: FEED
    title: Process gas blower
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M102
    block: FEED
    title: Methanol injection into the process gas (vaporiser inlet)
    class: Mixing
    ports:
      - {id: gas, direction: in}
      - {id: meoh, direction: in, delegates: meoh}
      - {id: out, direction: out, delegates: out}
  # D-005: the methanol is vaporised and the feed preheated by the reaction gas (no steam).
  # One exchanger E-101 written as its two sides joined by the energy stream Q6, so that
  # propagate passes flow and composition through each side.
  - id: E101C
    block: RXN
    title: E-101 methanol vaporiser / feed preheater, process gas side
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy}
  - id: E101H
    block: RXN
    title: E-101 methanol vaporiser / feed preheater, reaction gas side
    class: Cooling
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
      - {id: heat, direction: out, kind: energy}
  # D-004: conversion reactor from the per-pass methanol conversion and the selectivities that
  # reproduce BREF LVOC Table 6.10 (yield 93 %) and section 6.2.3 (conversion > 99 %), not kinetics.
  - id: R101
    block: RXN
    title: Multitubular Fe-Mo oxide reactor (boiling hot-oil shell, steam generator)
    class: ReactingChemicals
    reactions: [FORMOX, HCHO_OX, DME_FORM]
    reactor: conversion
    selectivity:
      key: CH3OH
      conversion: 0.9878593
      products: {HCHO: 0.9372342, CO: 0.0571416, DME: 0.0028121}
      provenance: assumed
      source: "scripts/formox_balance.py: plant yield 0.93 (BREF LVOC 2017 Table 6.10: 91-94 %), plant conversion 0.993 (s. 6.2.3: > 99 mol%), DME 1.0 kmol/h ASSUMED (D-004)"
    catalyst: FEMO
    links: [{target: equipment, ref: R-101}, {target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: out, kind: energy, delegates: steam}
  - id: C201
    block: ABS
    title: Formaldehyde absorber (water, pump-around coolers)
    class: SeparatingByPhysicalProcess
    links: [{target: equipment, ref: C-201}, {target: equipment, ref: E-201}, {target: equipment, ref: P-201}]
    ports:
      - {id: gas, direction: in, delegates: gas}
      - {id: water, direction: in, delegates: water}
      - {id: top, direction: out}
      - {id: bot, direction: out, delegates: product}
      - {id: cw, direction: out, kind: energy, delegates: cw}
      - {id: power, direction: in, kind: energy, delegates: power}
  # D-005: the recycle fraction that gives 8.5 mol% methanol at the reactor inlet
  - id: SPL
    block: ABS
    title: Off-gas recycle / vent split
    class: SplittingMaterial
    split: {recycle: 0.712087}
    ports:
      - {id: in, direction: in}
      - {id: recycle, direction: out, delegates: rec}
      - {id: vent, direction: out, delegates: vent}
  # D-008: ECS: feed/effluent preheater, noble-metal catalytic oxidiser and steam generator
  # lumped in one step; heat to steam = combustion heat less the stack gas sensible heat.
  - id: R301
    block: ECS
    title: Catalytic oxidiser with steam generator (ECS)
    class: ReactingChemicals
    reactions: [CO_OX, HCHO_COMB, MEOH_COMB, DME_COMB]
    reactor: conversion
    catalyst: PT_ECS
    links: [{target: equipment, ref: R-301}, {target: equipment, ref: E-301}, {target: equipment, ref: E-302}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: out, direction: out, delegates: out}
      - {id: heat, direction: out, kind: energy, delegates: steam}

streams:
  - id: S1
    title: Fresh air
