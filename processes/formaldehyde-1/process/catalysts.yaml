schema: cheme/catalysts/v1
kind: catalysts
catalysts:
  - id: FEMO
    name: Iron molybdate (Formox)
    active_phase: Fe2(MoO4)3 with excess MoO3
    window:
      temperature: [543.15, 703.15]
      pressure: [100.0, 200.0]
      provenance: given
      source: "BREF LVOC 2017 section 6.2.3, p. 339: atmospheric pressure, 270-430 C; pressure upper bound ASSUMED (blower discharge, D-005)"
    poisons:
    - molybdenum loss (MoO3 sublimation at hot spots)
    - iron carbonyl
    sources:
    - "EU JRC (2017) BREF LVOC, EUR 28882 EN, section 6.2.3 (catalyst life 5-30 months) and 6.3.5 (spent catalyst 0.02-0.15 kg/t HCHO)"
  - id: PT_ECS
    name: Noble-metal oxidation catalyst (emission control system)
    active_phase: Pt (or Pd) on a ceramic carrier
    sources:
    - "EU JRC (2017) BREF LVOC, section 6.2.3, p. 339 and Table 6.11, p. 348"
