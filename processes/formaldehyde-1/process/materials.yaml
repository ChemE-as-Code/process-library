templates:
  # D-004: one gas template for air, the loop gas, the vent and the stack (CO2 only after the ECS)
  - {id: gas, title: Air and process gas, components: [N2, O2, AR, H2O, CH3OH, HCHO, CO, DME, CO2]}
  - {id: methanol, title: Methanol feed, components: [CH3OH]}
  - {id: water, title: Process water, components: [H2O]}
  # D-002: formalin as HCHO + CH3OH + H2O on the monomer basis; methylene glycol and oligomers
  # are not resolved (no property method for aqueous formaldehyde, D-009)
  - {id: formalin, title: Formalin (aqueous formaldehyde), components: [HCHO, CH3OH, H2O]}
# property_method is a placeholder until `cheme process props --fill` records the method: its
# benchmarked property package, package versions and application range. Packages:
# air-pr-chemsep (N2/O2/Ar, 77-315 K, vapour 100-3200 kPa(a), liquid and two-phase 100-600
# kPa(a)) and syngas-pr-vapor (H2/N2/Ar/CH4/CO/CO2 mixtures, NH3 pure or dilute with H2/N2/Ar/
# CH4, vapour only, in benchmarked temperature-pressure boxes). `cheme process props --coverage` shows which applies
# to each stream; `package: <id>` here chooses one.
property_method:
  adapter: thermo
  status: placeholder
