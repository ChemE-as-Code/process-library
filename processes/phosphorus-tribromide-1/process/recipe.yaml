# The batch recipe of phosphorus-tribromide-1 (schema cheme/recipe/v1, `cheme process recipe`,
# DESIGN.md D-003). One batch makes BATCH kg of distilled PBr3 (stream S8); the flowsheet's rates
# are the year averages. The dosing and the post-reaction take their times from R101's
# semi-batch model (from: R101); every other duration is ASSUMED (D-003). R101's vessel is sized
# from its model's content and its jacket checked against the model's peak cooling duty (core
# ADR 0052). `cheme process recipe --svg build/gantt.svg` draws one batch.
schema: cheme/recipe/v1
kind: recipe
title: PBr3 by semi-batch bromination of phosphorus
batch_size: {value: 1421.23, unit: kg, stream: S8, provenance: assumed, source: "one batch of distilled PBr3 (D-002, D-003)"}
hours_per_year: {value: 7920, provenance: assumed, source: "330 days of 24 h (D-002)"}
unit_procedures:
  - id: BROMINATE
    unit: R101
    title: Bromination in the PBr3 heel (R-101)
    vessel:
      fill_fraction: 0.8
      aspect_ratio: 1.2
      jacket: {u: 300, coolant_temperature: 333.15, provenance: assumed, source: "enamelled (glass-lined) steel vessel, tempered water at 333 K in the jacket (D-010)"}
      provenance: assumed
      source: "usual fill and proportions of a glass-lined stirred vessel (D-003)"
    operations:
      - {id: inert, kind: other, title: "Check the heel, nitrogen purge of the vapour space", duration: {value: 0.25, provenance: assumed, source: D-003}}
      - {id: dose, kind: dose, title: Dose bromine and molten phosphorus together, from: R101}
      - {id: react, kind: react, title: Post-reaction, from: R101}
      - {id: hold, kind: hold, title: "Sample the crude (colour, free bromine)", duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: transfer, kind: transfer, title: Crude to the still; the heel stays, duration: {value: 0.5, provenance: assumed, source: D-003}}
  - id: DISTIL
    unit: C101
    title: Red-phosphorus treatment and vacuum distillation (C-101)
    operations:
      - {id: receive, kind: charge, title: Receive the crude, duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: treat, kind: other, title: Stir with red phosphorus (T101), duration: {value: 1.0, provenance: assumed, source: "D-003, D-007"}}
      - {id: distil, kind: other, title: Evacuate and distil at 4 kPa(a) (C101), duration: {value: 4.0, provenance: assumed, source: "D-003, D-008"}}
      - {id: discharge, kind: transfer, title: Break the vacuum with nitrogen and drain the residue, duration: {value: 1.0, provenance: assumed, source: D-003}}
