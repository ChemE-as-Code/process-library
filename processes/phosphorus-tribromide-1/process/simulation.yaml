# Simulation specs of phosphorus-tribromide-1 (`cheme schema process-simulation`). The flowsheet
# is not solved in DWSIM: no property package covers PBr3 with bromine and phosphorus, and a
# semi-batch is not coupled to DWSIM (core ADR 0050). Only the heat boundary is declared: the
# red-phosphorus treatment T101 takes up a trace of free bromine; its heat, about 3 kJ per kg of
# product (about 0.1 kW year average, an adiabatic rise of about 5 K in the still pot), is not
# counted, and T101 has no utility energy port (adiabatic, DESIGN.md D-007).
schema: cheme/simulation/v1
kind: simulation
specs:
  T101: {mode: adiabatic}
