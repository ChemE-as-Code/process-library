# Equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes per batch from the recipe (D-003) and R101's model; design pressures, temperatures and
# materials are not set yet (basic engineering); the materials named are usual choices for dry
# bromine and PBr3, to be confirmed (open input). All values ASSUMED.
schema: cheme/equipment/v1
equipment:
  - {tag: R-101, type: StirredTankReactor, service: "Brominator: molten white phosphorus and bromine dosed together into a PBr3 heel at 398 K; the heel stays for the next batch",
     notes: "0.72 m3 of crude per batch at the end of the dosing; 1 m3 (R10 preferred size, 72 % full, D 1.02 m) as the recipe sizes it from R101's semi-batch model (core ADR 0052); enamelled (glass-lined) steel, as the patent's example vessel; jacket on tempered water at 333 K, U 300 W/(m2 K): it removes 30.0 kW at the charge against the peak 28.4 kW of the 10 h dosing; agitator 2 kW year average; reflux condenser and nitrogen blanket, vent to a caustic scrubber (not in the boundary); dosing interlocked with the cooling and the agitator (D-005, D-010, D-011)."}
  - {tag: C-101, type: ProcessColumn, service: "Batch vacuum still: red-phosphorus treatment of the crude and distillation of PBr3 at 4 kPa(a)",
     notes: "Still pot about 1 m3 with a short packed column (a few stages, reflux ratio 0.5), condenser and product cooler on cooling water, receiver, vacuum pump; reboiler on LP steam, 7.9 kW year average (about 22 kW over the 4 h distillation: 7.9 kW x 11.26 h / 4 h); 6.5 h per batch (recipe, D-003); glass-lined or nickel alloy (to be confirmed) (D-007, D-008)."}
