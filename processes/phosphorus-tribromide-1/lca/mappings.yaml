# phosphorus-tribromide-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR
# 0022). Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# The preliminary LCI leaves most backgrounds unmapped (DESIGN.md D-012): the build reports each
# as a gap (lci/gaps.json). Linked here: the bromine to bromine-1, the nitrogen consumable to
# asu-1's gaseous nitrogen, and the LP steam counted as heat delivered (kWh), as
# n-bromosuccinimide-1 does. The shared vocabulary has no entry yet for white or red phosphorus,
# PBr3 or hazardous-waste incineration of a phosphorus bromide residue.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:BR2": {dataset: {path: processes/bromine-1/lca/dataset.yaml, product: "product:BR2"}, source: "the Atlas producer bromine-1, dry bromine 99.96 wt-%"}
  "consumable:nitrogen": {dataset: {path: processes/asu-1/lca/dataset.yaml, product: "product:GANP"}, source: "the Atlas producer asu-1, gaseous nitrogen to the battery limit (99.97 mol% N2, 9 bar(a)); the purge needs only a few hundred kPa"}
  "feed:LPS": {use: steam-heat, source: "LP steam 350 kPa(a) to the still's reboiler (Q2), counted as heat delivered (kWh), D-009"}
