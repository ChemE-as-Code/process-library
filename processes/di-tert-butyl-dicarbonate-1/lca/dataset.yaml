id: di-tert-butyl-dicarbonate-by-semi-batch-carbonation-and-phosgenation-of-potassium-tert-butoxide-in-hexane
title: Di-tert-butyl dicarbonate by semi-batch carbonation and phosgenation of potassium tert-butoxide
  in hexane
description: Unallocated foreground LCI of Di-tert-butyl dicarbonate by semi-batch carbonation and phosgenation
  of potassium tert-butoxide in hexane, case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Batch plant: potassium tert-butoxide suspended in recovered hexane with DABCO at 278 K, CO2
  dosed (2 h) then phosgene gas (4 h) in one glass-lined semi-batch, CO2 and isobutene vented as they
  form, the slurry degassed; the hexane stripped at 15 and 1 kPa(a) and recycled; the Boc2O melt washed
  with warm water; vacuum distillation at 0.13 kPa(a) from a liquid-paraffin heel; the vents to a caustic
  scrubber and a thermal oxidiser; 655.71 kg per batch, 762.5 batches a year on a dedicated train'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:phosgene-fugitive
  title: equipment-leaks emissions of R-101, E-102
  direction: output
  reason: 'Fugitive phosgene from the evaporator, the dosing line and R-101 is not estimated: no P&ID
    yet; a phosgene unit is fully contained, in a monitored enclosure (D-011).'
- key: emission-excluded:tank-breathing
  title: storage-tank emissions of T-202, T-302
  direction: output
  reason: Breathing and filling losses of the recovered-hexane and waste-solvent tanks go through the
    nitrogen blanket to the thermal oxidiser with the vent; not estimated (no P&ID yet, D-006).
- key: emission-excluded:vacuum-exhausts
  title: storage-tank emissions of V-201, C-301
  direction: output
  reason: The non-condensables of the vacuum pumps' discharge condensers (nitrogen with hexane and water
    vapour at the chilled water's temperature) go to the vent header; core's still has a total condenser,
    so their hexane is in the condensates S15 and S24, not estimated (D-006, D-008).
- key: emission-excluded:product-storage
  title: storage-tank emissions of the plant
  direction: output
  reason: 'Boc2O gives off CO2 slowly in storage (Wikipedia SRC-5): the vented storage''s CO2 and Boc2O
    vapour are outside the plant gate and not estimated (D-011).'
