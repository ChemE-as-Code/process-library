    - {chemical: n-hexane, role: feedstock, inventory_key: "feed:HEXMU", note: "n-Hexane make-up (merchant), 0.113 kg/kg Boc2O, most of it lost with R-101's vent-condenser gas (the dosing's vent and the degassing's nitrogen sweep, saturated at 263 K); the strips recover the rest of the 7.94 kg/kg the charge holds"}
    - {chemical: triethylenediamine, role: feedstock, inventory_key: "feed:DABCO", note: "DABCO catalyst (merchant), 0.0138 kg/kg Boc2O, 1.2 mol% of the alkoxide (EP 0 256 559 A2, Example 1)"}
