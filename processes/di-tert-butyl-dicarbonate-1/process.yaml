  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, kinetics, heats of
# reaction, the side share, the wash split and Boc2O's vapour pressure are assumed (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept batch PFD with closed mass, component and element balances (cheme validate: 5 blocks,
    18 steps). The streams are calculated by cheme process propagate from the feeds: the
    semi-batch R101 from its ASSUMED rate laws with the CO2 and isobutene vented and both gas doses
    partly or wholly taken up (core ADR 0054), the degassing DG101 (a nitrogen sweep at 30 kPa(a))
    at ASSUMED constant volatilities, its gas carrying the hexane that saturates R-101's
    vent-condenser gas over the batch (core's vent carries no solvent), the strips ST101, ST102 and the vacuum still ST301 on Raoult's law with NIST
    Antoine constants and an ASSUMED line for Boc2O (core ADR 0055), the scrubber S101 a
    conversion step; the recovered hexane S30 and the paraffin heel S22 are tears converged by
    propagate (core ADR 0060). The wash DC201 and the vent split X401 are specified splits from
    scripts/balance.py (no liquid-liquid or gas-liquid separator in core's propagate), outside
    any recycle, as are the duties the models leave out (sensible heats, condensers, the
    evaporator, the scrubber; the CO2's absorption heat). The feeds are sized for 500 t/a (scaled
    to the product). The recipe takes the dosing, post-reaction, degassing, strip and
    distillation times from the models and the cool-down from the jacket (cheme process recipe,
    no cheme.recipe-basis finding). Thermal screening (cheme process reactor-hazards): R101 dT_ad
    33.8 K, accumulation 10.1 % (the deliberate CO2 excess; the phosgene's 2.7 % at the end of
    its dosing), MTSR 279.9 K against an MTT of 333.15 K (hazard.mtt, Boc2O's decomposition
    limit); the largest cooling-failure gas over the batch 23.0 m3/h of CO2 against an ASSUMED
    vent capacity of 50 m3/h; no criticality class without a TD24 (never estimated). The kinetics
    are assumed: at k/10 the MTSR is 283.7 K and the gas 25.5 m3/h, at k/100 294.6 K and 53.5
    m3/h, 1.07 times the vent, with 36.6 % of the phosgene accumulated and stripped into that
    gas at up to 7.3 kg/h (y = x p*(T)/P over the cooling profile; 0.11 kg/h at the design rate)
    (a design finding:
    dosing interlocks, the scrubber's caustic inventory, relief from calorimetry, DESIGN.md
    D-014). Preliminary gate-to-gate LCI with nitrogen as a per-batch consumable; phosgene,
    caustic soda and nitrogen linked to phosgene-1, chlor-alkali-1 and asu-1, potassium
    tert-butoxide, hexane, DABCO, CO2 and the paraffin gaps with the alkoxide's proxy recorded.
    Not reviewed. Needs cheme-as-code 1.9.0.
