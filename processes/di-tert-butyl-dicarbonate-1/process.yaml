    - {chemical: n-hexane, role: feedstock, inventory_key: "feed:HEXMU", note: "n-Hexane make-up (merchant), 0.113 kg/kg Boc2O, most of it lost with R-101's vent-condenser gases (the dosing's vent and the degassing's nitrogen sweep, saturated at 263 K); the strips recover the rest of the 7.94 kg/kg the charge holds"}
    - {chemical: triethylenediamine, role: feedstock, inventory_key: "feed:DABCO", note: "DABCO catalyst (merchant), 0.0138 kg/kg Boc2O, 1.2 mol% of the alkoxide (EP 0 256 559 A2, Example 1)"}
    - {chemical: white-mineral-oil, role: feedstock, inventory_key: "feed:PARAF", note: "Liquid paraffin make-up for the still's heel, 0.030 kg/kg Boc2O (the heel's 10 % purge)"}
    - {chemical: sodium-hydroxide, role: feedstock, inventory_key: "feed:NAOH", note: "Caustic soda 50 wt% (chlor-alkali-1) to the scrubber, 0.164 kg/kg Boc2O, counted by mass of the solution"}
    - {chemical: water, role: feedstock, inventory_key: "feed:PW", note: "Wash water and scrubber make-up, 4.18 kg/kg Boc2O"}
    - {chemical: nitrogen, role: feedstock, inventory_key: "consumable:nitrogen", note: "Nitrogen (asu-1) for inerting, the degassing's sweep, purging and breaking the vacuums, 157.5 kg per batch, 0.240 kg/kg Boc2O (ASSUMED)"}
  outputs:
    - {chemical: di-tert-butyl-dicarbonate, role: main-product, inventory_key: "product:BOC", note: "Distilled Boc2O melt to heated storage; modelled 99.98 wt%, an upper bound: di-tert-butyl carbonate, the tricarbonate and other by-products are not modelled"}
    - {chemical: wastewater, role: waste, inventory_key: "product:AQ", note: "Wash brine, 4.35 kg/kg Boc2O: about 17 wt% KCl with tert-butanol, DABCO and the unreacted carbonate, to wastewater treatment"}
    - {chemical: wastewater, role: waste, inventory_key: "product:WS", note: "Spent scrubber liquor, 0.836 kg/kg Boc2O, sodium carbonate with excess NaOH, to wastewater treatment"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "0.424 kWh/kg Boc2O: agitators of R-101, V-201 and C-301, the three vacuum pumps, the scrubber's pump and fan (ASSUMED)"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "1.209 kWh (4.35 MJ)/kg Boc2O of LP steam through hot-water circuits: the hexane strips (0.970 kWh with the charge's heat-up and V-201's sensible heat), the still (0.107 kWh), the wash water, the phosgene evaporator and the degassing"}
    - {chemical: chilled-water, role: utility, inventory_key: "product:CHW", note: "0.925 kWh/kg Boc2O removed by chilled water at 278 K: the strips' and the forerun's condensers"}
    - {chemical: chilled-water, role: utility, inventory_key: "product:BRINE", note: "0.524 kWh/kg Boc2O removed by brine at 258 K: R-101's charge cooling, the heats of carbonation and phosgenation with the gases' heats of solution, and R-101's vent condenser (R101's model) (the registry has chilled water, not brine: closest entry)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "0.123 kWh/kg Boc2O removed by cooling water: the main-cut condenser and product cooler, and the scrubber"}
