    - {chemical: water, role: feedstock, inventory_key: "feed:PW", note: "Wash water and scrubber make-up, 4.18 kg/kg Boc2O"}
    - {chemical: nitrogen, role: feedstock, inventory_key: "consumable:nitrogen", note: "Nitrogen (asu-1) for inerting, the degassing's sweep, purging and breaking the vacuums, 157.8 kg per batch, 0.240 kg/kg Boc2O (ASSUMED)"}
  outputs:
    - {chemical: di-tert-butyl-dicarbonate, role: main-product, inventory_key: "product:BOC", note: "Distilled Boc2O melt to heated storage; modelled 99.98 wt%, an upper bound: di-tert-butyl carbonate, the tricarbonate and other by-products are not modelled"}
    - {chemical: wastewater, role: waste, inventory_key: "product:AQ", note: "Wash brine, 4.35 kg/kg Boc2O: about 17 wt% KCl with tert-butanol, DABCO and the unreacted carbonate, to wastewater treatment"}
    - {chemical: wastewater, role: waste, inventory_key: "product:WS", note: "Spent scrubber liquor, 0.836 kg/kg Boc2O, sodium carbonate with excess NaOH, to wastewater treatment"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "0.415 kWh/kg Boc2O: agitators of R-101, V-201 and C-301, the three vacuum pumps, the scrubber's pump and fan (ASSUMED)"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "1.211 kWh (4.36 MJ)/kg Boc2O of LP steam through hot-water circuits: the hexane strips (0.970 kWh with V-201's sensible heat), the still (0.107 kWh), the wash water, the phosgene evaporator and the degassing"}
    - {chemical: chilled-water, role: utility, inventory_key: "product:CHW", note: "0.925 kWh/kg Boc2O removed by chilled water at 278 K: the strips' and the forerun's condensers"}
    - {chemical: chilled-water, role: utility, inventory_key: "product:BRINE", note: "0.525 kWh/kg Boc2O removed by brine at 258 K: R-101's charge cooling, the heats of carbonation and phosgenation (R101's model) and the CO2's absorption heat (the registry has chilled water, not brine: closest entry)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "0.125 kWh/kg Boc2O removed by cooling water: the main-cut condenser and product cooler, and the scrubber"}
