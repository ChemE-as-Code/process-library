# Equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes per batch from the recipe (D-003) and the models of R101 and the stills; design
# pressures, temperatures and materials are not set yet (basic engineering); the materials named
# are usual choices for phosgene, wet KCl brine and Boc2O, to be confirmed (open input). All
# values ASSUMED. The arithmetic is in DESIGN.md D-003 and D-009.
schema: cheme/equipment/v1
equipment:
  - {tag: R-101, type: StirredTankReactor, service: "Carbonation and phosgenation: the alkoxide suspended in hexane with DABCO at 278 K, CO2 and then phosgene gas dosed, CO2 and isobutene vented; degassed at 30 kPa(a) before transfer",
     notes: "8.81 m3 of slurry per batch at the end of the dosing; 12.5 m3 (preferred size, 70 % full, D 2.37 m) as the recipe sizes it from R101's model (core ADR 0052); glass-lined, jacket on brine 258/263 K (log-mean 260.77 K against the 278.15 K content, U 300 W/(m2 K)): 98.4 kW removable (18.9 m2 at the charge) against the model's 73.8 kW peak, the doses' heats of solution included (D-015); agitator 5.5 kW; a dip pipe for each gas; a vent condenser on brine (gas out at 263 K, the condensate back to R-101; 0.27 kW year average, R101's model, Q17) and the dry screw vacuum pump K-101 (about 300 m3/h at 30 kPa(a), 7.5 kW) for the degassing with a nitrogen sweep through the dip pipe (about 2.3 kmol a batch, D-006); phosgene dosing interlocked with the temperature, the agitator, the cooling and the vent flow (D-011, D-014); the vent line sized for 50 m3/h (hazard.vent_capacity, D-014); housed in a phosgene enclosure with gas detection and an emergency ammonia or steam curtain, as the site's phosgene unit (open input)."}
  - {tag: E-102, type: HeatExchanger, service: "Phosgene evaporator (tempered water), liquid phosgene from phosgene-1 to gas at 150 kPa(a)",
     notes: "31.36 kg/h year average, 327 kg over the 4 h dosing of a batch; 2.54 kW year average, about 6.6 kW while dosing; minimum hold-up, inside the phosgene enclosure (D-004, D-009)."}
  - {tag: V-201, type: StirredTankReactor, service: "Work-up vessel: hexane strips at 15 and 1 kPa(a) (ST101, ST102), then the water wash and phase split of the Boc2O melt (DC201)",
     notes: "Receives 6.41 t of degassed slurry: 12.5 m3 (preferred size, 70 % full: 8.73 m3, D 2.37 m) as the recipe sizes it from what its steps take in (core 1.10.0, D-015), glass-lined, with a forced-circulation reboiler E-204 (tubular, about 27 m2 at U 600 W/(m2 K): 104 kW at the first strip's end, 312.1 K against the water's mean 318.5 K, D-003) on hot water at 321 K (below the 323 K limit, D-008): it heats the slurry to its bubble point while V-201 receives it (about 124 kW, D-015), then boils up 100 kW for the first strip (4.7 h), 25 kW for the second (2.6 h); agitator 5.5 kW; the dry screw pump with roots booster K-201 (about 3000 m3/h) for the second strip, which falls from 15 to 1 kPa(a) at about 313 K (one pressure per still in core, L-5); the first strip's condenser E-202 and the pump's discharge condenser E-203 on chilled water 278/283 K (D-006, D-009); bottom outlet with a sight glass for the phase split."}
  - {tag: E-201, type: HeatExchanger, service: "Wash water heater (hot water)", notes: "223 kg/h year average heated from 298 to 318 K, 5.18 kW (D-007, D-009)."}
  - {tag: T-202, type: Tank, service: "Recovered hexane (both strips' condensate) for the next charge, 0.16 % purged", notes: "One batch's 5.19 t, about 7.8 m3 at 283 K: 10 m3 under nitrogen (D-006)."}
  - {tag: C-301, type: StirredTankReactor, service: "Vacuum still: forerun and main cut at 0.13 kPa(a) from a liquid-paraffin heel (ST301)",
     notes: "Receives 0.69 t of washed melt onto the 0.23 t heel: 1.6 m3 (preferred size, 64 % full: 1.02 m3, D 1.19 m) as the recipe sizes it from what its steps take in (core 1.10.0, D-015), stainless steel, with a forced-circulation reboiler E-303 (about 8 m2) on hot water at 368 K (below the 373 K limit, D-008), boil-up 30 kW; the pot ends at 357.9 K; the main-cut condenser E-301 on a tempered loop at 303 K (above Boc2O's 296 K melting point); the forerun passes the roots-screw pump K-301 (2000 m3/h at 0.13 kPa(a)) to its discharge condenser E-302 on chilled water (D-008, D-009); the product to a heated, vented storage at 303 K (Boc2O gives off CO2 slowly, D-011)."}
  - {tag: T-302, type: Tank, service: "Waste solvent (forerun and hexane purge) to incineration", notes: "3.40 kg/h year average, about 35 kg a batch: a 1 m3 drum station (D-010)."}
  - {tag: T-401, type: Column, service: "Caustic scrubber for R-101's vent and the degassing gas: phosgene destroyed, 10 % of the CO2 absorbed; the scrubbed vent to the thermal oxidiser",
     notes: "Sized for about 100 m3/h of gas, K-101's discharge during the degassing (the nitrogen sweep, the CO2 and hexane, D-006); R-101's vent line takes 50 m3/h (hazard.vent_capacity, 2.2 times the 22.2 m3/h normal peak, D-014); 10.35 kg/h of caustic 50 wt% year average, kept in excess so that a phosgene breakthrough is neutralised; design load for phosgene in normal operation about 0.1 kg/h, at the end of the phosgene dosing (stripped from the slurry into the vent gas: 0.085 kg a batch in R101's model, D-007, D-015); circulation pump and fan 3 kW; the caustic's level, strength and flow interlocked with R-101's phosgene dosing (D-011)."}
