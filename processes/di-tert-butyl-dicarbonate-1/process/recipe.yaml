# The batch recipe of di-tert-butyl-dicarbonate-1 (schema cheme/recipe/v1, `cheme process
# recipe`, DESIGN.md D-003). One batch makes BATCH kg of distilled Boc2O (stream S25); the
# flowsheet's rates are the year averages.
# - R-101 is one vessel over M101 (the charge), E101 (cooled to 278 K), R101 (the semi-batch: CO2
#   then phosgene dosed, CO2 and isobutene vented) and DG101 (the degassing): `units`, core ADR
#   0057. Dosing and post-reaction come from R101's model (from: R101), the degassing from
#   DG101's still (from: DG101), the cool-down from the jacket; the vessel is sized from R101's
#   model and its jacket checked against the model's peak duty (core ADR 0052).
# - V-201 holds the two hexane strips (ST101, ST102, their boil-up times from the stills) and the
#   wash (DC201); C-301 the vacuum distillation (ST301). Core sizes no vessel for a still (core
#   ADR 0055): both are sized by hand in the equipment list (D-003).
# Every other duration is ASSUMED (D-003). `cheme process recipe` also gives the vent's peak gas
# rate and what one batch sends to the scrubber (core ADR 0054).
schema: cheme/recipe/v1
kind: recipe
title: Boc2O by semi-batch carbonation and phosgenation, hexane strip, wash and vacuum distillation
batch_size: {value: 657.28, unit: kg, stream: S25, provenance: assumed, source: "one batch of distilled Boc2O: 500 t/a over the batches the 10.411 h cycle allows, 63.131 kg/h x 10.411 h (D-002, D-003)"}
hours_per_year: {value: 7920, provenance: assumed, source: "330 days of 24 h (D-002)"}
unit_procedures:
  - id: REACT
    units: [M101, E101, R101, DG101]
    title: Charge, cool, dose CO2 and phosgene, degas (R-101)
    vessel:
      fill_fraction: 0.8
      aspect_ratio: 1.2
      jacket: {u: 300, coolant_temperature: 260.77, provenance: assumed, source: "enamelled (glass-lined) steel vessel, chilled brine 258/263 K in the jacket: the log-mean of supply and return against the 278.15 K content, 278.15 - (20 - 15) / ln(20 / 15) = 260.77 K (D-003, D-009)"}
      provenance: assumed
      source: "usual fill and proportions of an enamelled stirred vessel (D-003)"
    operations:
      - {id: inert, kind: other, title: Nitrogen purge of the dry vessel, duration: {value: 0.25, provenance: assumed, source: D-003}}
      - {id: charge, kind: charge, title: "Charge the hexane, the alkoxide and DABCO", duration: {value: 1.0, provenance: assumed, source: D-003}}
      - {id: cool, kind: cool, title: Cool to 278 K (E101), temperatures: [284.43, 278.15]}
      - {id: dose, kind: dose, title: "Dose CO2 (2 h), then phosgene (4 h)", from: R101}
      - {id: react, kind: react, title: Post-reaction, from: R101}
      - {id: degas, kind: distil, title: Degas at 30 kPa(a) (DG101), from: DG101}
      - {id: transfer, kind: transfer, title: Slurry to V-201, duration: {value: 0.5, provenance: assumed, source: D-003}}
  - id: WORKUP
    units: [ST101, ST102, DC201]
    title: Strip the hexane, wash and split (V-201)
    operations:
      - {id: receive, kind: charge, title: Receive the slurry, duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: strip1, kind: distil, title: Strip at 15 kPa(a) (ST101), from: ST101}
      - {id: strip2, kind: distil, title: "Strip down to 1 kPa(a) (ST102)", from: ST102}
      - {id: wash, kind: other, title: "Break the vacuum with nitrogen, add the warm water, stir", duration: {value: 1.0, provenance: assumed, source: D-003}}
      - {id: settle, kind: other, title: Settle and split (DC201), duration: {value: 1.0, provenance: assumed, source: D-003}}
      - {id: transfer, kind: transfer, title: "Brine to the drain, melt to C-301", duration: {value: 0.5, provenance: assumed, source: D-003}}
  - id: DISTIL
    units: [M301, ST301]
    title: Vacuum distillation from the paraffin heel (C-301)
    operations:
      - {id: receive, kind: charge, title: "Receive the melt onto the heel, add the paraffin make-up", duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: evacuate, kind: other, title: Evacuate to 0.13 kPa(a), duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: forerun, kind: other, title: "Forerun held to the vacuum pump's capacity", duration: {value: 3.35, provenance: assumed, source: "D-008: the forerun's 0.339 kmol per batch of hexane, water and tert-butanol vapour (cheme process stills) do not condense at 0.13 kPa(a) on any coolant above 240 K and pass K-301 (2000 m3/h, 97.7 mol/h at 0.13 kPa(a) and 320 K): 3.47 h, less the 0.12 h of the still's boil-up (core's still has one boil-up for every cut, L-6)"}}
      - {id: distil, kind: distil, title: Forerun and main cut (ST301), from: ST301}
      - {id: purge, kind: transfer, title: "Break the vacuum with nitrogen, drain the heel's purge", duration: {value: 0.25, provenance: assumed, source: D-003}}
