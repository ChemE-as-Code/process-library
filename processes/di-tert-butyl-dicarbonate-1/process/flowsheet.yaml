# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Di-tert-butyl dicarbonate (Boc2O) by the one-pot phosgene route of EP 0 256 559 A2 (DESIGN.md
# D-001), a batch plant on a dedicated train: potassium tert-butoxide is suspended in recovered
# hexane with DABCO in the glass-lined R-101 and cooled to 278 K; CO2 and then phosgene gas are
# dosed (one semi-batch, reactor: semibatch), the CO2 that passes and the CO2 and isobutene that
# form leave by the vent (batch.vent, core ADR 0054); the slurry is degassed in R-101 (DG101, a
# still at a constant volatility) and the hexane stripped off it in V-201 at 15 and 1 kPa(a)
# (ST101, ST102, Rayleigh stills on Raoult's law, core ADR 0055); the hexane returns to the next
# charge (the recycle, a tear stream converged by propagate, core ADR 0060). The Boc2O melt left
# with the KCl is washed with warm water and split from the brine (DC201); it is distilled from a
# liquid-paraffin heel in C-301 at 0.13 kPa(a) (ST301: forerun and main cut), the heel returning
# to the next batch with a purge. The vents go to a caustic scrubber.
# The flows are the year averages of the batch recipe (process/recipe.yaml, `cheme process
# recipe`, D-003).
# Where the values come from:
# - feeds, temperatures, pressures, ratios: design basis and D-002..D-008, ASSUMED;
# - calculated by `cheme process propagate --fill`: R101 (cheme's semi-batch model, the ASSUMED
#   rate laws, D-005), DG101, ST101, ST102, ST301 (stills, D-006, D-008), the mixers M101, M201,
#   M301, M401, the splitter SP301, the pass-through steps E101, E102, E201 and the scrubber S101
#   (a conversion step); the recycles S30 and S22 are tear streams (core ADR 0060);
# - DC201 (the wash and phase split) and X401 (the scrubbed vent split from the liquor) are hand
#   splits: core has no liquid-liquid or gas-liquid component separator in propagate (L-4); their
#   outlets come from scripts/balance.py (the split in its parameters), and `cheme validate` checks that they
#   balance; neither lies in a recycle;
# - the duties: the models of R101, DG101, ST101, ST102 and ST301 write theirs at each step's
#   `energy_port` (core ADR 0059); what the models leave out is on its own ASSUMED stream with its
#   hand arithmetic (D-009).
schema: cheme/process/v1
kind: flowsheet
title: Di-tert-butyl dicarbonate by semi-batch carbonation and phosgenation of potassium tert-butoxide in hexane
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 500 t/a distilled Boc2O, year averages of the batches in 7920 h on a dedicated train (D-002, D-003)", default: true}
tolerance: {abs: 0.02, rel: 0.001}   # balances: |in - out| <= abs + rel * max(in, out), kg/h
# The recycles (D-006, D-008): the recovered hexane S30 (ST101 and ST102 back to the charge) and
# the paraffin heel S22 (C-301's residue back to the next charge). Both are torn and converged by
# propagate (Wegstein); the tolerance is far tighter than the balances' so that the six digits
# written are the fixed point's (as sodium-azide-1).
tears:
  - stream: S30
    initial: {flow: 497.0, unit: kg/h, basis: mass_fraction, composition: {HEX: 0.97, TBA: 0.03}}
  - stream: S22
    initial: {flow: 25.0, unit: kg/h, basis: mass_fraction, composition: {PARAF: 0.7, BOC2O: 0.28, DABCO: 0.02}}
convergence: {method: wegstein, max_iterations: 200, tolerance: {abs: 1.0e-6, rel: 1.0e-9}}

feeds:
  - {id: KOTBU, title: Potassium tert-butoxide (merchant solid), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: HEXMU, title: n-Hexane make-up (merchant), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: DABCO, title: DABCO catalyst (merchant), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: CO2, title: Carbon dioxide gas (merchant), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PHOS, title: Liquid phosgene (phosgene-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PARAF, title: Liquid paraffin make-up (merchant white oil), category: raw_material, ports: [{id: out, direction: out}]}
  - id: PW
    title: Process water (wash, scrubber make-up)
    category: raw_material
    ports:
      - {id: wash, direction: out}
      - {id: scrub, direction: out}
  - {id: NAOH, title: Caustic soda 50 wt% (chlor-alkali-1), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: v201, direction: out, kind: energy}
      - {id: c301, direction: out, kind: energy}
      - {id: s101, direction: out, kind: energy}
  - id: LPS
    title: LP steam 350 kPa(a) (the tempered and hot-water circuits)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 350, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 412.0, provenance: given, source: "saturation at 350 kPa(a): 412.007 K (CoolProp's IAPWS water, DESIGN.md SRC-11)"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: e102, direction: out, kind: energy}
      - {id: dg101, direction: out, kind: energy}
      - {id: st101, direction: out, kind: energy}
      - {id: st102, direction: out, kind: energy}
      - {id: v201, direction: out, kind: energy}
      - {id: e201, direction: out, kind: energy}
      - {id: st301, direction: out, kind: energy}
      - {id: c301, direction: out, kind: energy}
products:
  - {id: BOC, title: Boc2O melt to heated storage, category: product, ports: [{id: in, direction: in}]}
  - {id: AQ, title: "Wash brine (KCl) to wastewater treatment", category: wastewater, ports: [{id: in, direction: in}]}
  - {id: WSOLV, title: "Forerun (hexane, water, tert-butanol) to solvent incineration", category: solid_waste, ports: [{id: in, direction: in}]}
  - {id: RES, title: Paraffin heel purge to incineration, category: solid_waste, ports: [{id: in, direction: in}]}
  - {id: WS, title: Spent scrubber liquor to wastewater treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - {id: VENT, title: "Scrubbed vent (CO2, isobutene, hexane) to the thermal oxidiser", category: off_gas, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: st301, direction: in, kind: energy}
      - {id: s101, direction: in, kind: energy}
  - id: BRINE
    title: Chilled brine return (263 K)
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 258.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 263.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: e101, direction: in, kind: energy}
      - {id: r101, direction: in, kind: energy}
      - {id: r101abs, direction: in, kind: energy}
  - id: CHW
    title: Chilled water return (283 K)
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 278.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 283.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: st101, direction: in, kind: energy}
      - {id: st102, direction: in, kind: energy}
      - {id: st301, direction: in, kind: energy}

blocks:
  - id: PREP
    title: Charge and phosgene preparation
    class: ExchangingThermalEnergy
    ports:
      - {id: kotbu, direction: in}
      - {id: hex, direction: in}
      - {id: cat, direction: in}
      - {id: rec, direction: in}
      - {id: phos, direction: in}
      - {id: charge, direction: out}
      - {id: dose, direction: out}
      - {id: brine, direction: out, kind: energy}
      - {id: steam, direction: in, kind: energy}
  - id: REACT
    title: Carbonation, phosgenation and degassing (R-101)
    class: ReactingChemicals
    ports:
      - {id: charge, direction: in}
      - {id: phos, direction: in}
      - {id: co2, direction: in}
      - {id: crude, direction: out}
      - {id: vent, direction: out}
      - {id: degas, direction: out}
      - {id: brine, direction: out, kind: energy}
      - {id: brine_abs, direction: out, kind: energy}
      - {id: steam, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: WORKUP
    title: Hexane strip, wash and phase split (V-201)
    class: SeparatingByThermalProcess
    ports:
      - {id: crude, direction: in}
      - {id: water, direction: in}
      - {id: hexane, direction: out}
      - {id: purge, direction: out}
      - {id: melt, direction: out}
      - {id: brine_out, direction: out}
      - {id: steam1, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: steam3, direction: in, kind: energy}
      - {id: steam4, direction: in, kind: energy}
      - {id: q1, direction: out, kind: energy}
      - {id: q2, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: DISTIL
    title: Vacuum distillation from a paraffin heel (C-301)
    class: SeparatingByThermalProcess
    ports:
      - {id: melt, direction: in}
      - {id: oil, direction: in}
      - {id: hexpurge, direction: in}
      - {id: product, direction: out}
      - {id: fore, direction: out}
      - {id: purge, direction: out}
      - {id: steam1, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: q1, direction: out, kind: energy}
      - {id: q2, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: SCRUB
    title: Off-gas treatment (caustic scrubber)
    class: ReactingChemicals
    ports:
      - {id: vent, direction: in}
      - {id: degas, direction: in}
      - {id: naoh, direction: in}
      - {id: pw, direction: in}
      - {id: gas, direction: out}
      - {id: liquor, direction: out}
      - {id: cw, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}

steps:
  - id: M101
    block: PREP
    title: Charge of R-101 (alkoxide, DABCO, recovered and fresh hexane)
    class: Mixing
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: kotbu, direction: in, delegates: kotbu}
      - {id: hex, direction: in, delegates: hex}
      - {id: cat, direction: in, delegates: cat}
      - {id: rec, direction: in, delegates: rec}
      - {id: out, direction: out}
  - id: E101
    block: PREP
    title: Charge cooled to 278 K (R-101 jacket)
    class: Cooling
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: charge}
      - {id: q, direction: out, kind: energy, delegates: brine}
  - id: E102
    block: PREP
    title: Phosgene evaporator
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in, delegates: phos}
      - {id: out, direction: out, delegates: dose}
      - {id: q, direction: in, kind: energy, delegates: steam}
  - id: R101
    block: REACT
    title: Carbonation and phosgenation (CO2, then phosgene dosed into the suspension at 278 K; CO2 and isobutene vented)
    class: ReactingChemicals
    reactions: [CARB, PHOS, SIDE]
    reactor: semibatch
    batch:
      dosing: [{stream: S8, time: 7200, absorbed: 0.85}, {stream: S7, time: 14400, start: 7200, absorbed: 1.0}]
      target: {key: COCL2, conversion: 0.9999}
      heat: isothermal
      vent: {stream: S9, components: [CO2, IB]}
      provenance: assumed
      source: "CO2 dosed over 2 h at 278 K, 85 % of it taken up (the rest passes to the vent), then phosgene gas over 4 h, all of it taken up (EP 0 256 559 A2, Example 1: 3 h of CO2 and 4 h of phosgene at 5 C; US 5 151 542 A, Example 1: 2 h of CO2), the CO2 and isobutene that form leaving as they form, then the post-reaction to 0.9999 conversion of the phosgene (D-005)"
    hazard:
      mtt: 333.15
      vent_capacity: 50
      provenance: assumed
      source: "D-011, D-014: mtt is the technical limit of the mass, not a boiling point: Boc2O and its precursors decompose with vigorous gas evolution at 60-70 C (US 5 151 542 A, Comparative Examples 1 and 4: 11 % and 5 % yield, gas evolved), below hexane's 341.9 K that core's default takes; it is an observation of a reaction time, not a TD24 (none is estimated); vent_capacity: R-101's vent line and the scrubber T-401 sized for about 2.2 times the recipe's normal peak of 22.8 m3/h (CO2 at 278 K, cheme process recipe), ASSUMED: no vent sizing yet (no P&ID); against a cooling failure's gas release: none at core's worst moment (the end of the CO2 dosing, CARB forms no gas), 23.0 m3/h the largest over the batch (core's vent_gas_rate over the cooling profile, during the phosgene dosing), 0.46 of it; 53.5 m3/h at k/100, 1.07 of it (D-011, D-014)"
    energy_port: q
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: charge, direction: in, delegates: charge}
      - {id: phos, direction: in, delegates: phos}
      - {id: co2, direction: in, delegates: co2}
      - {id: out, direction: out}
      - {id: gas, direction: out, delegates: vent}
      - {id: q, direction: out, kind: energy, delegates: brine}
      - {id: q_abs, direction: out, kind: energy, delegates: brine_abs}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: DG101
    block: REACT
    title: Degassing of the slurry at 278 K and 30 kPa(a) (R-101, vent condenser on brine)
    class: Distilling
    energy_port: q
    still:
      pressure: 30
      volatility:
        model: constant
        alpha: {HEX: 1.0, CO2: 3000, COCL2: 150, TBA: 0.1}
        provenance: assumed
        source: "D-006: R-101's pot and its vent condenser on brine (gas out at 263 K) as two equilibrium stages, each component's vapour pressure over hexane's (chemicals 1.5.2, NIST WebBook): phosgene about 11 at 278 K times about 14 at 263 K, CO2 above 500 at each; tert-butanol about 0.17 times 0.6"
      nonvolatile: [KOTBU, KTBC, BOC2O, KCL, DABCO]
      boilup: {value: 1.0, unit: kmol/h, provenance: assumed, source: "D-006: gas drawn off through the vent condenser by the vacuum pump K-101, about 77 m3/h at 30 kPa(a) and 278 K"}
      end: {residue: {key: CO2, mole_fraction: 1.0e-5}}
      outlets: {distillate: gas, residue: crude}
      provenance: assumed
      source: "degassing of the dissolved CO2 (and any phosgene left) at the reaction temperature before the slurry leaves R-101, so neither reaches the recovered hexane (D-006)"
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out, delegates: degas}
      - {id: crude, direction: out, delegates: crude}
      - {id: q, direction: in, kind: energy, delegates: steam}
  - id: ST101
    block: WORKUP
    title: Hexane strip at 15 kPa(a) to 313 K (V-201)
    class: Distilling
    energy_port: steam
    still:
      pressure: 15.0
      volatility: {model: raoult, provenance: assumed, source: "ideal liquid, NIST WebBook Antoine constants (materials.yaml); Boc2O's ASSUMED line (D-008); the suspended salts counted in the liquid (core limit L-3, D-006)"}
      nonvolatile: [KOTBU, KTBC, KCL, DABCO]
      boilup: {value: 100, unit: kW, provenance: assumed, source: "V-201's forced-circulation reboiler E-204 (tubular, for the KCl slurry, about 25 m2 at U 600 W/(m2 K)) on hot water at 321/316 K: 97.5 kW at the end of the strip (312 K, 6.5 K below the water's mean 318.5 K), more before; the jacket alone wets too little as the pot empties (D-006, D-009)"}
      end: {residue: {key: HEX, mole_fraction: 0.41}}
      outlets: {distillate: top, residue: bottom}
      provenance: assumed
      source: "strip until the pot reaches 313 K: Boc2O is kept below 323 K wherever it is held for hours (D-008)"
    links: [{target: equipment, ref: V-201}]
    ports:
      - {id: in, direction: in, delegates: crude}
      - {id: top, direction: out}
      - {id: bottom, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam1}
      - {id: sens, direction: in, kind: energy, delegates: steam4}
      - {id: cond, direction: out, kind: energy, delegates: q1}
  - id: ST102
    block: WORKUP
    title: Hexane strip at 1 kPa(a) to 313 K (V-201)
    class: Distilling
    energy_port: steam
    still:
      pressure: 1.0
      volatility: {model: raoult, provenance: assumed, source: "as ST101 (D-006)"}
      nonvolatile: [KOTBU, KTBC, KCL, DABCO]
      boilup: {value: 25, unit: kW, provenance: assumed, source: "E-204 as ST101, held at 25 kW by the vacuum pump K-201's capacity (about 3000 m3/h) while the pressure falls to 1 kPa(a) (D-006, D-009)"}
      end: {residue: {key: HEX, mole_fraction: 0.019}}
      outlets: {distillate: top, residue: bottom}
      provenance: assumed
      source: "the rest of the hexane at 1 kPa(a), the pot held at 313 K while the pressure falls (one pressure per still in core, L-5; D-006)"
    links: [{target: equipment, ref: V-201}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out}
      - {id: bottom, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam2}
      - {id: cond, direction: out, kind: energy, delegates: q2}
  - id: M201
    block: WORKUP
    title: Recovered hexane (T-202)
    class: Mixing
    links: [{target: equipment, ref: T-202}]
    ports:
      - {id: st101, direction: in}
      - {id: st102, direction: in}
      - {id: out, direction: out}
  - id: SP201
    block: WORKUP
    title: Recovered hexane to the next charge, the rest purged
    class: SplittingMaterial
    links: [{target: equipment, ref: T-202}]
    ports:
      - {id: in, direction: in}
      - {id: rec, direction: out, delegates: hexane}
      - {id: purge, direction: out, delegates: purge}
  - id: E201
    block: WORKUP
    title: Wash water heated to 318 K
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in, delegates: water}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: steam3}
  - id: DC201
    block: WORKUP
    title: Water wash of the Boc2O melt and phase split (V-201)
    class: SeparatingMechanically
    links: [{target: equipment, ref: V-201}]
    ports:
      - {id: crude, direction: in}
      - {id: water, direction: in}
      - {id: org, direction: out, delegates: melt}
      - {id: aq, direction: out, delegates: brine_out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M301
    block: DISTIL
    title: Still charge (washed melt, paraffin heel, paraffin make-up)
    class: Mixing
    links: [{target: equipment, ref: C-301}]
    ports:
      - {id: melt, direction: in, delegates: melt}
      - {id: oil, direction: in, delegates: oil}
      - {id: heel, direction: in}
      - {id: out, direction: out}
  - id: ST301
    block: DISTIL
    title: Vacuum distillation at 0.13 kPa(a) from the paraffin heel (C-301, forerun and main cut)
    class: Distilling
    energy_port: steam
    still:
      pressure: 0.13
      volatility: {model: raoult, provenance: assumed, source: "ideal liquid, NIST WebBook Antoine constants for hexane, tert-butanol and water, Boc2O's ASSUMED line (materials.yaml, D-008)"}
      nonvolatile: [PARAF, DABCO, KOTBU, KTBC, KCL]
      boilup: {value: 30, unit: kW, provenance: assumed, source: "C-301's forced-circulation reboiler E-303 (about 8 m2 at U 600 W/(m2 K)) on hot water at 368/363 K: 36 kW at the end of the main cut (357.9 K, 7.6 K below the water's mean 365.5 K) (D-008, D-009)"}
      cuts:
        - {outlet: fore, end: {residue: {key: TBA, mole_fraction: 1.0e-4}}}
        - {outlet: main, end: {residue: {key: BOC2O, mole_fraction: 0.3}}}
      outlets: {residue: bottom}
      provenance: assumed
      source: "EP 0 256 559 A2: Boc2O distilled under reduced pressure from a liquid paraffin that stays in the bottoms (Examples 1, 8-10); a forerun until tert-butanol is 0.01 mol% of the pot, then the main cut until Boc2O is 30 mol% of the residue, the pot then at about 358 K (D-008)"
    links: [{target: equipment, ref: C-301}]
    ports:
      - {id: in, direction: in}
      - {id: fore, direction: out}
      - {id: main, direction: out, delegates: product}
      - {id: bottom, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam1}
      - {id: sens, direction: in, kind: energy, delegates: steam2}
      - {id: qf, direction: out, kind: energy, delegates: q1}
      - {id: qm, direction: out, kind: energy, delegates: q2}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: SP301
    block: DISTIL
    title: Paraffin heel kept for the next batch, a share purged
    class: SplittingMaterial
    split: {rec: 0.9}
    links: [{target: equipment, ref: C-301}]
    ports:
      - {id: in, direction: in}
      - {id: rec, direction: out}
      - {id: purge, direction: out, delegates: purge}
  - id: M302
    block: DISTIL
    title: Waste solvent (forerun and hexane purge) to T-302
    class: Mixing
    links: [{target: equipment, ref: T-302}]
    ports:
      - {id: fore, direction: in}
      - {id: purge, direction: in, delegates: hexpurge}
      - {id: out, direction: out, delegates: fore}
  - id: M401
    block: SCRUB
    title: Vent header (R-101's vent and the degassing)
    class: Mixing
    links: [{target: equipment, ref: T-401}]
    ports:
      - {id: r101, direction: in, delegates: vent}
      - {id: dg, direction: in, delegates: degas}
      - {id: out, direction: out}
  - id: S101
    block: SCRUB
    title: Caustic scrubber (phosgene destroyed, part of the CO2 absorbed)
    class: ReactingChemicals
    reactions: [NPH, NCO]
    reactor: conversion
    links: [{target: equipment, ref: T-401}]
    ports:
      - {id: gas, direction: in}
      - {id: naoh, direction: in, delegates: naoh}
      - {id: pw, direction: in, delegates: pw}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: cw}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: X401
    block: SCRUB
    title: Scrubbed vent split from the liquor (T-401's sump)
    class: SeparatingMechanically
    links: [{target: equipment, ref: T-401}]
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out, delegates: gas}
