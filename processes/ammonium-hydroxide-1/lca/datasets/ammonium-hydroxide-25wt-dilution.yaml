# Tier 0 form, a manifest-only entry without a flowsheet (as process-library#313). Every amount is the
# formula of its parameters; core's validator re-checks each. Facts from the sources in our own form.
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: ammonium-hydroxide-25wt-dilution
title: Aqueous ammonia, 25 wt% NH3, by continuous dilution of liquid ammonia in water
description: Tier 0 screening estimate per 1 t of 25 wt% aqueous ammonia (ammonium hydroxide), gate-to-gate.
  Feeds from the product's strength; heat rejected from evaluated heats of solution (NBS 1982) and the ammonia
  equation of state; pump electricity ASSUMED. No plant data.
basis: 1000 kg of aqueous ammonia, 25 wt% NH3
boundary: 'gate-to-gate: metering of liquid ammonia and water, single-stage mixing, cooling of the solution
  (evaporative cooler and feed-ammonia exchanger); storage and loading excluded'
technology: continuous single-stage dilution of anhydrous liquid ammonia with water and cooling of the solution
  below its boiling point (process of US 4,752,452); absorption of ammonia-plant purge or flash gas is not
  modelled
geography:
  description: 'Generic: thermochemical calculation, no site.'
classification:
  isic: '2012'
system_boundary:
  included:
  - anhydrous ammonia and demineralised water, from the product's strength
  - pump electricity (ASSUMED estimate)
  - net heat of solution to cooling water
  excluded:
  - 'TODO ammonia losses to air at the mixer relief valve, hose bleed and vapour return, and from storage breathing
    and loading: the source names these points but quantifies none'
  - 'TODO water and ammonia of start-up, flushing and cleaning: not quantified in the source'
  - TODO water treatment chemicals and the demineralisation step beyond the background water
  - 'no heat input: the dissolution releases heat, and the source process vaporises part of its feed with that
    heat'
  - storage and loading
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: GLO
year: 2026
valid_until: 2031
time:
  start: 2026
  description: A calculation of 2026 from thermochemical data (NBS 1982, ammonia equation of state 2020) and
    a process description of 1988; no plant data, so the year is that of the calculation and the temporal pedigree
    stays poor.
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation'
