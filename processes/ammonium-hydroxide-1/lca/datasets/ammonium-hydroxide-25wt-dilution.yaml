parameters:
- name: P
  value: 1000.0
  unit: kg
  description: Aqueous ammonia delivered, 25 wt% NH3 (the basis).
  source: basis
- name: M_NH3
  value: 17.031
  unit: g/mol
  description: Molar mass of ammonia.
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573), applied
    to the formula
- name: M_H2O
  value: 18.015
  unit: g/mol
  description: Molar mass of water.
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573), applied
    to the formula
- name: a_n
  value: 6.0
  unit: mol
  description: Moles of NH3 in the model formula (NH3)6(H2O)17 of the product.
  source: 'ASSUMED model choice: the element balance takes integer formulas, and 6 NH3 to 17 H2O gives 25.02
    wt% NH3, the 25 wt% grade within 0.02 percentage points. The strength is the midpoint of the 20 to 30 wt%
    that US Patent 4,752,452 (Harbolt and Murata, Union Oil Company of California, 1988) names for this process
    (Background of the Art); the midpoint is our choice. The patent''s example flows (about 91 US gal/min of
    liquid ammonia at 40 to 70 degF and 174 US gal/min of water, Description) also give 24.2 to 24.9 wt% NH3
    with densities from CoolProp 8.0.0 (our calculation)'
- name: a_w
  value: 17.0
  unit: mol
  description: Moles of H2O in the model formula (NH3)6(H2O)17 of the product.
  source: ASSUMED model choice, see a_n
- name: H_g
  value: -46.11
  unit: kJ/mol
  description: Standard enthalpy of formation of NH3, ideal gas, 298.15 K.
  source: Wagman, D.D. et al. (1982) The NBS tables of chemical thermodynamic properties, J. Phys. Chem. Ref.
    Data 11, Suppl. 2, Table 18:N (prepared 1964), p. 2-64, row NH3 g
- name: H_2
  value: -77.655
  unit: kJ/mol
  description: Enthalpy of formation of NH3 dissolved in 2.0 mol H2O, 298.15 K.
  source: Wagman, D.D. et al. (1982) The NBS tables of chemical thermodynamic properties, J. Phys. Chem. Ref.
    Data 11, Suppl. 2, Table 18:N (prepared 1964), p. 2-64, row NH3 in 2.0 H2O
- name: H_5
  value: -79.266
  unit: kJ/mol
  description: Enthalpy of formation of NH3 dissolved in 5.0 mol H2O, 298.15 K.
  source: Wagman, D.D. et al. (1982) The NBS tables of chemical thermodynamic properties, J. Phys. Chem. Ref.
    Data 11, Suppl. 2, Table 18:N (prepared 1964), p. 2-64, row NH3 in 5.0 H2O; linear interpolation between
    the 2.0 and 5.0 rows to the product's 17/6 = 2.83 mol H2O per mol NH3 is ASSUMED (the tabulated step is
    1.6 kJ/mol). The tabulated values are convex in the water ratio, so the chord gives a lower bound; a quadratic
    through the 1.0, 2.0 and 5.0 rows (-75.358, -77.655, -79.266 kJ/mol) gives 0.3 to 0.8 kJ/mol more heat of
    solution and 27 to 29 kWh/t rejected instead of 26 (our calculation)
- name: dh_lg
  value: 25.614
  unit: kJ/mol
  description: 'Enthalpy of NH3 as ideal gas at 25 degC less that of the saturated liquid at 101.325 kPa (-33.3
    degC): vaporisation 23.33 kJ/mol plus heating of the gas.'
  source: Gao, Wu, Bell and Lemmon (2020) equation of state for ammonia (J. Phys. Chem. Ref. Data), evaluated
    with CoolProp 8.0.0 (ideal-gas limit at 25 degC, the NBS standard state; at 1 bar real gas it is 25.511).
    That the feed arrives as refrigerated liquid at its normal boiling point, the state of ammonia-1's product,
    is ASSUMED; the patent's example feeds pressurised liquid at 40 to 70 degF
- name: rho_A
  value: 681.8
  unit: kg/m3
  description: Density of liquid ammonia at -33.35 degC, 1 atm.
  source: ATSDR (2004) Toxicological Profile for Ammonia, Table 4-2, p. 115 (printed as 0.6818 g/L, read as
    g/mL, the only physical reading); CoolProp 8.0.0 (Gao et al. 2020 equation of state) gives 681.6 kg/m3 for
    the saturated liquid at 101.325 kPa
- name: rho_W
  value: 997.05
  unit: kg/m3
  description: Density of water at 25 degC, 101.325 kPa.
  source: IAPWS-95 (Wagner and Pruss 2002) evaluated with CoolProp 8.0.0
- name: rho_P
  value: 898.01
  unit: kg/m3
  description: Density of the product solution.
  source: ATSDR (2004) Toxicological Profile for Ammonia, Table 4-2, p. 115, aqueous solution (28 %) at 20
    degC (printed as g/L, read as g/mL); taken for the 25 wt% product, ASSUMED (about 1 % low for a weaker
    solution)
- name: dp
  value: 500.0
  unit: kPa
  description: Pressure rise of each pumped liquid (ammonia feed, water feed, product to storage).
  source: 'ASSUMED: no open figure; a typical delivery head for a short in-plant transfer'
- name: eta
  value: 0.5
  unit: '1'
  description: Wire-to-fluid efficiency of the pumps.
  source: 'ASSUMED: typical of small centrifugal pumps; no open figure'
