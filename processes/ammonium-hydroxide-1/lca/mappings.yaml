# ammonium-hydroxide-1's own exchange overrides for the Atlas LCI build (ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Water, electricity and cooling water resolve by
# their registry slugs (water: deionised water background; cooling-water: utility-cooling-tower).
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:ammonia": {dataset: {path: processes/ammonia-1/lca/dataset.yaml, product: "product:NH3"}, source: "the Atlas producer ammonia-1, whose product is the refrigerated liquid this dataset assumes as its feed"}
