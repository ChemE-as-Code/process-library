# Equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes per batch from the recipe (D-003) and the models of R101, ST101, ST102 and ST103; design
# pressures, temperatures and materials are not set yet (basic engineering); the materials named
# are usual choices for wet HBr, bromine and hot benzyl bromide, to be confirmed (open input).
# All values ASSUMED. Peak duties are per batch from the year averages (kW x 7.027 h a batch,
# over the hours the item works), the arithmetic in DESIGN.md D-009.
schema: cheme/equipment/v1
equipment:
  - {tag: R-101, type: StirredTankReactor, service: "Photoreactor: toluene charge heated to 363 K, bromine dosed under the lamps, HBr vented as it forms",
     notes: "2.80 m3 of crude per batch at the end of the dosing; 4 m3 (R10 preferred size, 70 % full, D 1.62 m) as the recipe sizes it from R101's semi-batch model (core ADR 0052), glass-lined, with immersion lamp wells (LED about 420 nm, 20 kW electric, about 6 kW of light, ASSUMED; the wells cooled on cooling water, about 14 kW while lit, D-005); jacket: LP steam 450 kPa(a) for the 0.29 h heat-up, then a tempered-water loop on cooling water (mean 303 K, U 300 W/(m2 K)): 160.2 kW removable against the model's 10.2 kW peak plus the 6 kW of absorbed light; agitator 3 kW; bromine dosing interlocked with the lamps' power and light (no light: no reaction, bromine accumulates), the temperature, the agitator, the HBr off-gas flow and A-101's water flow (D-011); a nitrogen-padded seal pot or vacuum breaker against suck-back from A-101 (D-011); lamp wells: the lamp power tripped on a well-coolant fault (low flow, high temperature, leak by conductivity) and on a lamp over-temperature, the well coolant below the vessel's pressure or a non-aqueous coolant, nitrogen inerting with an O2 check before and an O2 trip during the lighting, lamps and wells rated for the zone (D-011 (d)); a relief device (rupture disc to a catch tank and the caustic scrubber) for the blocked off-gas line, open: the gas of a cooling failure would raise the 1.20 m3 head space by about 0.24 MPa (design case) to 2.3 MPa (k/10), D-014."}
  - {tag: E-102, type: HeatExchanger, service: "Reflux condenser on R-101's off-gas (cooling water): returns the toluene and bromine the HBr carries",
     notes: "R101's vent condenser in the model (core 1.10.0, ADR 0062): the HBr leaves R-101 saturated with the content's vapour, 0.87 mol per mol over the batch (1.07 at the start, 0.66 at the end, Raoult), condensed to the gas's saturation at 303.15 K (0.050 mol of toluene and 0.0054 of bromine per mol of HBr pass), the condensate back to R-101 by a liquid seal; its duty Q4, 8.78 kW year average (core's), about 11.8 kW over the 5.24 h of gas and about 14 kW at the off-gas peak (about 0.32 mol/s HBr near the start with about 1.0 mol of vapour per mol); the off-gas system is sized for 90 m3/h at R-101's pressure, the vapour with the gas included (1.2 x the largest release of a cooling failure over the batch, 72.8 m3/h 0.38 h into the dosing, rounded up; 59.6 m3/h at the worst-accumulation moment's MTSR; the normal peak at the vessel 68.9 m3/h; hazard.vent_capacity, D-014); open: in the k/10 case the release at the MTSR is 102 m3/h and E-102 would condense about 26 kW (D-014); glass or graphite (D-008, D-009)."}
  - {tag: E-103, type: HeatExchanger, service: "Vent condenser on the off-gas (brine, gas out at 268 K)",
     notes: "Condenses what passes E-102 at 303 K down to its saturation at 268.15 K: toluene from 0.050 to 0.0061 mol per mol of HBr, bromine from 0.0054 to 0.0034 (Raoult over the condensate, scripts/balance.py); 0.66 kW year average on brine 258/263 K; its condensate, 3.52 kg/h (24.8 kg a batch, 7 wt% bromine), drains to T-201 with the recovered toluene; bromine freezes at 266 K (CRC table in chemicals), so the gas outlet stays at 268 K (D-008)."}
  - {tag: A-101, type: Column, service: "HBr absorber: falling-film absorber with a water tail scrubber, 48 wt% hydrobromic acid",
     notes: "Takes the off-gas while R-101 doses and reacts: 463 kg of HBr a batch, at most 0.32 mol/s (cheme process recipe), with 0.0061 mol of toluene and 0.0034 of bromine per mol of HBr, which the model leaves in the acid (0.33 and 0.32 wt%: an upper bound on the acid's organics, the toluene separates as a film or passes to the tail scrubber; the bromine dissolves, D-008); sized with the off-gas system (D-014); 14.7 kW year average to cooling water, about 21 kW at the off-gas peak (0.32 mol/s x 65.2 kJ/mol: the heat of solution less the gas's and the water's warming, D-008); graphite (impregnated) with PTFE linings; a caustic guard scrubber after the water tail scrubber for HBr and bromine breakthrough (D-011); the absorber's vacuum on cooling is a suck-back path to R-101 (D-011)."}
  - {tag: C-101, type: StirredTankReactor, service: "Batch still: toluene strip at 15 kPa(a) (ST101), then forerun (ST102) and main cut (ST103) at 2 kPa(a) through the column K-101",
     notes: "Receives one batch of crude, 2698 kg, about 2.8 m3 at 363 K: 4 m3, glass-lined, jacket on LP steam 450 kPa(a) (421 K, above the pot's 321-377 K): boil-up 150 kW for 1.13 h (strip, K-101 bypassed), 80 kW for 0.44 h (forerun at reflux ratio 2) and 1.30 h (main cut at reflux ratio 0.5), cheme process stills; the jacket's wetted area falls as the pot empties: about 0.04 m3 (70.0 kg) is left at the end of ST103, inside the bottom head (about 0.42 m3), wetting about 0.95 m2 of jacket, about 12.7 kW at U 300 W/(m2 K), so the end of the main cut cannot run at the stated 80 kW; jacket-limited, the strip takes 1.37 h, the forerun 0.45 h and the main cut 2.34 h, 1.29 h a batch more than the model's constant boil-up, which C-101's slack in the 7.03 h cycle takes (scripts/still_jacket.py, D-007, core limit L-6); agitator 1.5 kW; dry vacuum pump 4 kW; condensers: the strip's on cooling water (about 177 kW over the strip, from the pot's temperature), K-101's on brine for the forerun (80 kW while it runs: at 2 kPa(a) the forerun condenses near 289 K) and on cooling water for the main cut (80 kW), the forerun's and the product's coolers after them (D-007, D-009)."}
  - {tag: K-101, type: Column, service: "Packed column on C-101 for the forerun and the main cut at 2 kPa(a)",
     notes: "About 4 theoretical stages of structured packing above the still (5 with it, ASSUMED: a short vacuum column of usual height on a glass-lined still, D-007); reflux ratio 2 for the forerun and 0.5 for the main cut (Diwekar's shortcut in cheme, core ADR 0061: 99.85 wt% benzyl bromide at 97.9 % recovery of what the pot holds after the forerun); bypassed for the strip at 15 kPa(a); its overhead condenser on cooling water with a brine after-condenser (the forerun's), a reflux divider; diameter, packing height and pressure drop not sized (the pot is taken at the top's 2 kPa(a), D-007)."}
  - {tag: T-201, type: Tank, service: "Recovered toluene (strip distillate, forerun and E-103's condensate): recycle to R-101, 2 % purged",
     notes: "Holds one batch's 1765 kg (about 2.0 m3) under nitrogen: 4 m3 (D-007)."}
