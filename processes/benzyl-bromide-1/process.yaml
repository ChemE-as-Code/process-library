# Process Atlas manifest of benzyl-bromide-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: benzyl-bromide-1
title: Benzyl bromide by light-driven semi-batch bromination of toluene, HBr absorption and batch distillation (1000 t/a)
summary: >-
  A batch plant: bromine is dosed over 5 h into excess toluene at 363 K under lamps; the HBr
  is absorbed to 48 wt% acid, and the crude is stripped of its toluene (recycled) and distilled
  under vacuum. Concept stage, 889.6 kg per batch every 7.05 h on a dedicated train, thermal
  screening with a rate-constant sensitivity, preliminary gate-to-gate LCI.
description: |
  Bromine is dosed at a constant rate over 5 h into toluene (4 mol per mol of bromine, the
  recycled toluene counted) at 363 K in a glass-lined photoreactor with immersion lamps, and the
  free-radical chain brominates the side chain: C7H8 + Br2 -> C7H7Br + HBr, and in series
  C7H7Br + Br2 -> C7H6Br2 + HBr (the route PubChem's HSDB names for benzyl bromide, bromine and
  toluene under light; US 3 528 899 A describes the dosing at the rate the bromine reacts). The
  HBr leaves the liquid as it forms, through a reflux condenser and a brine vent condenser that
  return the toluene it carries, and is absorbed in water to 48 wt% hydrobromic acid, 1.095 kg
  per kg of product (a co-product). The crude is stripped of most of its toluene at 15 kPa(a)
  and distilled at 2 kPa(a) in the same batch still: a forerun (toluene with benzyl bromide)
  that goes back with the stripped toluene to the next batch, 2 % of it purged, and the main
  cut, benzyl bromide with 1.6 wt% benzal bromide and 0.1 wt% toluene in the model (98.3 wt%, an
  upper bound: ring-brominated toluenes and condensation products are not modelled). The
  benzal bromide residue goes to incineration. Yields 88.5 % on the bromine and 86.9 % on the
  toluene make-up (US 3 528 899 A, Example I: about 90 % on toluene); both follow from an
  ASSUMED ratio of the two rate constants (80-94 % on the bromine for k2/k1 from 0.4 to 0.1).

  The batch is modelled with cheme-as-code's semi-batch reactor with a gas vent (reactor:
  semibatch, batch.vent, core ADRs 0050 and 0054), its batch still with cuts (still:, one
  Rayleigh stage, ADR 0055) and the batch recipe (process/recipe.yaml, ADRs 0051, 0052 and
  0057): the dosing, post-reaction and distillation times come from the models, the
  photoreactor is the bottleneck (cycle 7.05 h, 1124 batches a year), the recipe sizes it (4 m3)
  and checks its jacket, and the flowsheet's flows are the recipe's year averages; the toluene
  recycle is brought to its fixed point by scripts/balance.py and propagate in turn. The light-
  driven rate is an ASSUMED effective rate law (core has no photochemical rate): the bromine
  accumulates to 1.7 % at the end of the dosing and the cooling-failure temperature stays 20 K
  below the boiling point of toluene; a 100 times slower reaction (weak or failed lamps) would
  exceed it. See DESIGN.md for every assumption.
families: [chlorinated-organics]
keywords: [benzyl bromide, toluene, bromine, side-chain bromination, photobromination, free-radical bromination, benzal bromide, hydrobromic acid, semi-batch, batch, dosing, gas evolution, HBr off-gas, batch distillation, vacuum distillation, solvent recycle, thermal screening, lachrymator, fine chemicals]
facets:
  feedstock_basis: [fossil, mineral, electricity]
  product_classes: [chemicals]
  unit_operations: [reaction, absorption, distillation]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, kinetics, the quantum
# yield, the stills' ideal liquid and benzal bromide's vapour pressure are assumed (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept batch PFD with closed mass, component and element balances (cheme validate, cheme
    process streams: 3 blocks and 10 steps within tolerance). The semi-batch R101 with its HBr
    vent (from its ASSUMED effective rate laws), the stills ST101 and ST102 (one Rayleigh stage
    each on Raoult's law with NIST Antoine constants, the ideal liquid and benzal bromide's vapour
    pressure ASSUMED), the mixers and the splitter are calculated by cheme process propagate;
    scripts/balance.py gives the feeds for 1000 t/a, the toluene recycle at its fixed point
    (core does not tear a recycle), the absorber water, the mixing and bubble-point temperatures
    and every duty (no property package of core covers these liquids). The recipe's year-average
    rate of the product agrees with the flowsheet (no cheme.recipe-basis finding); the recipe
    sizes R-101 (4 m3), its jacket check passes, and the stills' times come from their boil-up.
    Thermal screening (cheme process reactor-hazards): dT_ad 42.2 K, accumulation 1.73 %, MTSR
    363.9 K against an MTT of 383.8 K (hazard.mtt: the boiling point of toluene); no
    criticality class without a TD24 (1 or 2 if the TD24 lies above the MTSR, 5 if below). With
    k/10 the MTSR is 370.5 K, with k/100 394.6 K, above the MTT (DESIGN.md D-011). The off-gas
    carries no organic vapour in the model (a core limit); the condensers' duties are hand
    values. Preliminary gate-to-gate LCI with the per-batch nitrogen; the bromine linked to
    bromine-1, the toluene to btx-1, the nitrogen to asu-1, the other backgrounds gaps; the
    hydrobromic acid a co-product by mass of its HBr (shares 0.6556/0.3444). cheme maturity
    reaches no level (assumed feeds, kinetics and separations); the claim `maturity: concept` is
    the lowest value of the schema, not an evidenced level. Not reviewed. Needs cheme-as-code
    1.8.0.
