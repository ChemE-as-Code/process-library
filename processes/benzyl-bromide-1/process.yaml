    - {chemical: toluene, role: feedstock, inventory_key: "feed:TOL", note: "Toluene make-up (btx-1), 0.609 kg/kg; 2.17 kg/kg of recovered toluene (82 wt% toluene, 17 wt% benzyl bromide) is recycled within the plant"}
    - {chemical: water, role: feedstock, inventory_key: "feed:PW", note: "Process water to the HBr absorber, 0.569 kg/kg"}
    - {chemical: nitrogen, role: feedstock, inventory_key: "consumable:nitrogen", note: "Nitrogen (asu-1) for inerting, breaking the vacuum and padding, 25 kg per batch, 28 g/kg (ASSUMED)"}
  outputs:
    - {chemical: benzyl-bromide, role: main-product, inventory_key: "product:BNBR", note: "Distilled benzyl bromide to storage under nitrogen; modelled 98.3 wt%, an upper bound (ring-brominated and condensation by-products not modelled, DESIGN.md D-007)"}
    - {chemical: hydrogen-bromide, role: co-product, inventory_key: "product:HBRACID", note: "Hydrobromic acid 48 wt%, 1.095 kg/kg (0.525 kg HBr), counted by mass of the acid; allocated by mass of its HBr, shares 0.6556/0.3444 (DESIGN.md D-012)"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "0.156 kWh/kg: the lamps of R-101 (0.118 kWh/kg), the agitators and the vacuum pump (ASSUMED)"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "0.335 kWh/kg of LP steam 450 kPa(a): R-101's heat-up and the still"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "0.618 kWh/kg removed: R-101's jacket and lamp wells, the reflux condenser, the absorber, the still's condensers and coolers"}
    - {chemical: chilled-water, role: utility, inventory_key: "product:BRINE", note: "0.039 kWh/kg removed by brine at 258 K: the vent condenser and the forerun condenser (the registry has chilled water, not brine: closest entry)"}
