# Process Atlas manifest of benzyl-bromide-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: benzyl-bromide-1
title: Benzyl bromide by light-driven semi-batch bromination of toluene, HBr absorption and batch distillation (1000 t/a)
summary: >-
  A batch plant: bromine is dosed over 5 h into excess toluene at 363 K under lamps; the HBr
  is absorbed to 48 wt% acid, and the crude is stripped of its toluene (recycled) and distilled
  under vacuum through a packed column. Concept stage, 887.3 kg per batch every 7.03 h on a
  dedicated train, thermal screening with a rate-constant sensitivity, preliminary gate-to-gate
  LCI.
description: |
  Bromine is dosed at a constant rate over 5 h into toluene (4 mol per mol of bromine, the
  recycled toluene counted) at 363 K in a glass-lined photoreactor with immersion lamps, and the
  free-radical chain brominates the side chain: C7H8 + Br2 -> C7H7Br + HBr, and in series
  C7H7Br + Br2 -> C7H6Br2 + HBr (the route PubChem's HSDB names for benzyl bromide, bromine and
  toluene under light; US 3 528 899 A describes the dosing at the rate the bromine reacts). The
  HBr leaves the liquid as it forms, saturated with the content's vapour (about 0.9 mol per mol,
  mostly toluene), through a reflux condenser that returns the vapour to the reactor and a brine
  vent condenser whose condensate is recycled, and is absorbed in water to 48 wt% hydrobromic
  acid, 1.094 kg per kg of product (a co-product). The crude is stripped of most of its toluene
  at 15 kPa(a), then distilled at 2 kPa(a) in the same batch still through a packed column of
  about 5 theoretical stages: a forerun (toluene with some benzyl bromide, reflux ratio 2) that
  goes back with the stripped toluene to the next batch, 2 % of it purged, and the main cut
  (reflux ratio 0.5), 99.85 wt% benzyl bromide with 0.11 wt% toluene and 0.04 wt% benzal
  bromide in the model (an upper bound: ring-brominated toluenes and condensation products are
  not modelled). The benzal bromide residue goes to incineration. Yields 90.2 % on the bromine
  and 87.7 % on the toluene make-up (US 3 528 899 A, Example I: about 90 % on toluene); both
  follow from an ASSUMED ratio of the two rate constants.

  The batch is modelled with cheme-as-code's semi-batch reactor with a gas vent that carries the
  liquid's vapour through a vent condenser (reactor: semibatch, batch.vent with vapour and
  condenser, core ADRs 0050, 0054 and 0062), its batch still (still:, one Rayleigh stage for the
  strip, ADR 0055) with a column for the forerun and the main cut (still.column, Diwekar's
  shortcut, ADR 0061) and the batch recipe (process/recipe.yaml, ADRs 0051, 0052 and 0057): the
  dosing, post-reaction and distillation times come from the models, the photoreactor is the
  bottleneck (cycle 7.03 h, 1127 batches a year), the recipe sizes it (4 m3) and checks its
  jacket, and the flowsheet's flows are the recipe's year averages; the toluene recycle is
  converged at its tear stream by cheme process propagate. The light-driven rate is an ASSUMED
  effective rate law (core has no photochemical rate): the bromine accumulates to 1.7 % at the
  end of the dosing and the cooling-failure temperature stays 20 K below the boiling point of
  toluene; a 100 times slower reaction (weak or failed lamps) would exceed it. See DESIGN.md for
  every assumption.
families: [chlorinated-organics]
keywords: [benzyl bromide, toluene, bromine, side-chain bromination, photobromination, free-radical bromination, benzal bromide, hydrobromic acid, semi-batch, batch, dosing, gas evolution, HBr off-gas, batch distillation, vacuum distillation, solvent recycle, thermal screening, lachrymator, fine chemicals]
facets:
  feedstock_basis: [fossil, mineral, electricity]
  product_classes: [chemicals]
  unit_operations: [reaction, absorption, distillation]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, kinetics, the quantum
# yield, the stills' ideal liquid and benzal bromide's vapour pressure are assumed (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept batch PFD with closed mass, component and element balances (cheme validate, cheme
    process streams: 3 blocks and 10 steps within tolerance). The semi-batch R101 with its HBr
    vent carrying the content's vapour through its vent condenser E-102 (from its ASSUMED
    effective rate laws, Raoult over an ideal liquid; core ADR 0062), the strip ST101 (one
    Rayleigh stage), the forerun ST102 and the main cut ST103 through the still's column (5
    theoretical stages, reflux 2 and 0.5, ASSUMED; Diwekar's shortcut, ADR 0061; all on Raoult's
    law with NIST Antoine constants, the ideal liquid and benzal bromide's vapour pressure
    ASSUMED), the mixers, the splitter and the toluene recycle (converged at its tear stream S2,
    ADR 0060) are calculated by cheme process propagate, which also writes the model duties:
    E-102's (Q4), the stills' reboilers (Q7, Q9, Q14) and the column's condensers (Q10, Q11; ADRs
    0059, 0061, 0062). scripts/balance.py gives the feeds for 1000 t/a, the brine vent condenser
    E-103 (a flash as core's vent condenser), the absorber water, the mixing and bubble-point
    temperatures and the other duties (no property package of core covers these liquids); the
    stills' charges' sensible heat, 2.84 kW less steam, is left out and recorded (DESIGN.md
    D-009). The recipe's year-average rate of the product agrees with the flowsheet (no
    cheme.recipe-basis finding); the recipe sizes R-101 (4 m3), its jacket check passes, and the
    stills' times come from their boil-up. Thermal screening (cheme process reactor-hazards):
    dT_ad 44.2 K, accumulation 1.66 %, MTSR 363.9 K against an MTT of 383.8 K (hazard.mtt: the
    boiling point of toluene); no criticality class without a TD24 (1 or 2 if the TD24 lies
    above the MTSR, 5 if below). With k/10 the MTSR is 370.3 K, with k/100 396.1 K, above the
    MTT, where the content boils (DESIGN.md D-011). At the MTSR the gas leaves with the content's
    vapour at 59.6 m3/h, and at most 72.8 m3/h for a cooling failure earlier in the dosing,
    within R-101's off-gas capacity of 90 m3/h (ASSUMED: 1.2 times the largest, rounded up to
    the next 5 m3/h); at k/10 102.3 m3/h exceeds it, and the blocked-vent case
    (about 0.24 MPa in the head space in the design case, 2.3 MPa at k/10) needs a relief device
    (open findings, DESIGN.md D-014). Preliminary gate-to-gate LCI with the per-batch nitrogen;
    the bromine linked to bromine-1, the toluene to btx-1, the nitrogen to asu-1, the other
    backgrounds gaps; the hydrobromic acid a co-product by mass of its HBr (shares
    0.6572/0.3428). cheme maturity reaches no level (assumed feeds, kinetics and separations);
    the claim `maturity: concept` is the lowest value of the schema, not an evidenced level. Not
    reviewed. Needs cheme-as-code 1.10.0.
