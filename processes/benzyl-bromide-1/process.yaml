    - {chemical: toluene, role: feedstock, inventory_key: "feed:TOL", note: "Toluene make-up (btx-1), 0.614 kg/kg; 1.95 kg/kg of recovered toluene (91 wt% toluene, 9 wt% benzyl bromide) is recycled within the plant"}
    - {chemical: water, role: feedstock, inventory_key: "feed:PW", note: "Process water to the HBr absorber, 0.565 kg/kg"}
    - {chemical: nitrogen, role: feedstock, inventory_key: "consumable:nitrogen", note: "Nitrogen (asu-1) for inerting, breaking the vacuum and padding, 25 kg per batch, 28 g/kg (ASSUMED)"}
  outputs:
    - {chemical: benzyl-bromide, role: main-product, inventory_key: "product:BNBR", note: "Distilled benzyl bromide to storage under nitrogen; modelled 99.85 wt%, an upper bound (ring-brominated and condensation by-products not modelled, DESIGN.md D-007)"}
    - {chemical: hydrogen-bromide, role: co-product, inventory_key: "product:HBRACID", note: "Hydrobromic acid 48 wt% (on HBr and water), 1.094 kg/kg (0.522 kg HBr), counted by mass of the acid; allocated by mass of its HBr, shares 0.6572/0.3428 (DESIGN.md D-012)"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "0.160 kWh/kg: the lamps of R-101 (0.118 kWh/kg), the agitators and the vacuum pump (ASSUMED)"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "0.431 kWh/kg of LP steam 450 kPa(a): R-101's heat-up and the still with its column (the reboilers from core's models, DESIGN.md D-009)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "0.666 kWh/kg removed: R-101's jacket and lamp wells, the reflux condenser, the absorber, the still's and the column's condensers and coolers"}
    - {chemical: chilled-water, role: utility, inventory_key: "product:BRINE", note: "0.046 kWh/kg removed by brine at 258 K: the vent condenser and the column's condenser and cooler during the forerun (the registry has chilled water, not brine: closest entry)"}
