    state:
      design:
        temperature: {value: 363.15, provenance: assumed, source: "heated in R-101 to the reaction temperature (D-005)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 350.314, provenance: calculated, source: 'cheme process propagate: pass-through E101 from S3', fingerprint: aa72831c18eb60fd}
        composition: {basis: mole_fraction, values: {TOL: 0.921061, BR2: 0.000225882, BNBR: 0.0785134, BALBR: 0.000200172, HBR: 0.0}, provenance: calculated, source: 'cheme process propagate: pass-through E101 from S3', fingerprint: aa72831c18eb60fd}
  - id: S5
