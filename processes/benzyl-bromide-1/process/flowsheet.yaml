    from: M101.out
    to: E101.in
    template: organics
    state:
      design:
        temperature: {value: 298.64, provenance: assumed, source: "scripts/balance.py: the adiabatic mix of S1 and S2 (D-009)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 350.314, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S2', fingerprint: f9c051ceed047324}
        composition: {basis: mole_fraction, values: {TOL: 0.921061, BR2: 0.000225882, BNBR: 0.0785134, BALBR: 0.000200172, HBR: 0.0}, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S2', fingerprint: 228912f98db07fab}
  - id: S4
