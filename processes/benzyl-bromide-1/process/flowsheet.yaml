# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Benzyl bromide by the light-driven side-chain bromination of toluene (DESIGN.md D-001), a
# batch plant: bromine is dosed into excess toluene at 363 K under lamps (a semi-batch,
# reactor: semibatch) and the HBr it forms leaves as gas (batch.vent) through a reflux
# condenser and a brine vent condenser to an absorber that makes 48 wt% hydrobromic acid; the
# crude is stripped of its toluene at 15 kPa(a) in a batch still and the benzyl bromide
# distilled off the benzal bromide at 2 kPa(a) in the same still, a forerun and a main cut; the
# toluene and the forerun are recycled to the next batch, less a purge.
# The flows are the year averages of the batch recipe (process/recipe.yaml, `cheme process
# recipe`, D-003).
# Where the values come from:
# - feeds, temperatures, pressures, ratios: design basis and D-002..D-009, ASSUMED unless a
#   source is named;
# - R101: cheme's semi-batch model with a vent (core ADRs 0050, 0054), from the ASSUMED
#   effective rate laws of BNBR and BALBR, to 0.999 conversion of the bromine (D-005);
# - ST101 and ST102: cheme's batch (Rayleigh) still, one stage each, Raoult's law with NIST
#   Antoine constants (core ADR 0055, D-007);
# - M101, A101, M201: mixers, SP201 a splitter (98 % to the recycle), E101..E103 pass-through
#   (`cheme process propagate --fill`);
# - the toluene recycle S2: the tear stream of `tears:`, converged by propagate with Wegstein's
#   method and written as calculated (core 1.9.0, ADR 0060; D-006);
# - the duties of R101 (its reactions' heat less the bromine's warming, on Q12 to the reflux
#   condenser, energy_port reflux) and of the stills' boil-up (Q7, Q9, energy_port steam):
#   written by propagate from the models (core 1.9.0, ADR 0059; D-009);
# - the feeds for 1000 t/a, the absorber water, the mixing and bubble-point temperatures and the
#   other duties: scripts/balance.py (D-006, D-009), as core propagates from the feeds and does
#   not solve them for a product rate, and has no property package for these liquids.
schema: cheme/process/v1
kind: flowsheet
title: Benzyl bromide by semi-batch light-driven side-chain bromination of toluene with HBr absorption and batch distillation (1000 t/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 1000 t/a distilled benzyl bromide, year averages of the batch recipe in 7920 h (D-002, D-003)", default: true}
tolerance: {abs: 0.05, rel: 0.002}   # balances: |in - out| <= abs + rel * max(in, out), kg/h
# The toluene recycle (D-006): S2 is torn and converged by propagate (core 1.9.0, ADR 0060);
# the guess is the fixed point the script and propagate reached by hand under core 1.8.0. The
# loop's gain is near 1 (98 % of the recovered toluene returns), so its tolerance is tighter
# than the balances'.
tears:
  - stream: S2
    initial: {flow: 273.4153, unit: kg/h, basis: mass_fraction, composition: {TOL: 0.823993812, BR2: 0.000470108, BNBR: 0.174884536, BALBR: 0.000651544}}
convergence: {method: wegstein, max_iterations: 300, tolerance: {abs: 1.0e-5, rel: 1.0e-8}}

feeds:
  - {id: TOL, title: Toluene make-up (btx-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: BR2, title: Bromine (bromine-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PW, title: Process water (HBr absorber), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: lamps, direction: out, kind: energy}
      - {id: r101, direction: out, kind: energy}
      - {id: st101, direction: out, kind: energy}
  - id: LPS
    title: LP steam 450 kPa(a) (R-101 heat-up, still C-101)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 421.0, provenance: given, source: "saturation at 450 kPa(a): 421.05 K (CoolProp's IAPWS water, DESIGN.md SRC-10)"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: e101, direction: out, kind: energy}
      - {id: st101, direction: out, kind: energy}
      - {id: st102, direction: out, kind: energy}
products:
  - {id: BNBR, title: Benzyl bromide to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: HBRACID, title: Hydrobromic acid 48 wt% (co-product), category: by_product, ports: [{id: in, direction: in}]}
  - {id: RES, title: Still residue (benzal bromide) to hazardous-waste incineration, category: by_product, ports: [{id: in, direction: in}]}
  - {id: PURGE, title: Toluene purge to hazardous-waste incineration, category: by_product, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: lamps, direction: in, kind: energy}
      - {id: e102, direction: in, kind: energy}
      - {id: a101, direction: in, kind: energy}
      - {id: st101, direction: in, kind: energy}
      - {id: st102, direction: in, kind: energy}
  - id: BRINE
    title: Chilled brine return (263 K)
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 258.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 263.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: e103, direction: in, kind: energy}
      - {id: st102, direction: in, kind: energy}

blocks:
  - id: REACT
    title: Charge, heat-up and light-driven semi-batch bromination
    class: ReactingChemicals
    ports:
      - {id: tol, direction: in}
      - {id: rec, direction: in}
      - {id: br2, direction: in}
      - {id: out, direction: out}
      - {id: vent, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: q, direction: out, kind: energy}
      - {id: lampq, direction: out, kind: energy}
      - {id: lamps, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: reflux, direction: out, kind: energy}
      - {id: reflux2, direction: out, kind: energy}
  - id: OFFGAS
    title: Off-gas condensers and HBr absorption to hydrobromic acid
    class: Mixing
    ports:
      - {id: gas, direction: in}
      - {id: water, direction: in}
      - {id: acid, direction: out}
      - {id: q1, direction: out, kind: energy}
      - {id: q2, direction: out, kind: energy}
      - {id: q3, direction: out, kind: energy}
      - {id: reflux, direction: in, kind: energy}
      - {id: reflux2, direction: in, kind: energy}
  - id: PURIFY
    title: Toluene strip and vacuum distillation, toluene recycle
    class: Distilling
    ports:
      - {id: in, direction: in}
      - {id: product, direction: out}
      - {id: residue, direction: out}
      - {id: recycle, direction: out}
      - {id: purge, direction: out}
      - {id: steam1, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: q1, direction: out, kind: energy}
      - {id: q2, direction: out, kind: energy}
      - {id: q3, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}

steps:
  - id: M101
    block: REACT
    title: Charge of R-101 (toluene make-up and the recycled toluene)
    class: Mixing
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: tol, direction: in, delegates: tol}
      - {id: rec, direction: in, delegates: rec}
      - {id: out, direction: out}
  - id: E101
    block: REACT
    title: Heat-up of the charge to 363 K in R-101 (jacket on LP steam)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
  - id: R101
    block: REACT
    title: Photoreactor (bromine dosed into the toluene at 363 K under lamps, HBr vented)
    class: ReactingChemicals
    reactions: [BNBR, BALBR]
    reactor: semibatch
    batch:
      dosing: [{stream: S5, time: 18000}]
      target: {key: BR2, conversion: 0.999}
      heat: isothermal
      vent: {stream: S7, components: [HBR]}
      provenance: assumed
      source: "bromine dosed at a constant rate over 5 h into the toluene charge at 363 K under the lamps (the lamps' photon budget, D-005), then the post-reaction to 0.999 conversion of the bromine, so that little bromine goes to the still; the HBr leaves as gas as it forms, none taken as dissolved (D-005)"
    # the model's duty (its reactions' heat less the bromine's warming, ADR 0059) leaves R-101
    # with the off-gas's toluene vapour to the reflux condenser (Q12); the jacket Q2 takes the
    # light and the agitator's heat less the vapour's heat beyond it (Q13), D-009
    energy_port: reflux
    hazard:
      mtt: 383.8
      vent_capacity: 45.0
      provenance: assumed
      source: "mtt: the normal boiling point of toluene (NIST WebBook, 383.8 +/- 0.2 K), the liquid's main component: R-101 runs at atmospheric pressure with its vent open to the condensers and the absorber; core 1.9's default is still bromine's 331.95 K, a dose above 5 % of the charge and doses that does not stay as such in the liquid (ADR 0058's known limitation; D-011, L-5). vent_capacity: ASSUMED design of R-101's off-gas system (the line to E-102, E-102, E-103 and A-101 with its tail scrubber, D-014): 1.2 x the largest gas release of a cooling failure, 35.10 m3/h of HBr at the MTSR of 363.9 K and 101.3 kPa(a) at the end of the dosing (cheme process reactor-hazards; the largest over the batch too), rounded up to 45 m3/h at R-101's 101.3 kPa(a); the normal peak, 34.32 m3/h at 363.15 K (cheme process recipe), and the k/10 and k/100 cases (41.13 and 38.18 m3/h, D-011) are within it. No TD24 (never estimated)"
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: charge, direction: in}
      - {id: br2, direction: in, delegates: br2}
      - {id: out, direction: out, delegates: out}
      - {id: vent, direction: out, delegates: vent}
      - {id: q, direction: out, kind: energy, delegates: q}
      - {id: lampq, direction: out, kind: energy, delegates: lampq}
      - {id: lamps, direction: in, kind: energy, delegates: lamps}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: reflux, direction: out, kind: energy, delegates: reflux}
      - {id: reflux2, direction: out, kind: energy, delegates: reflux2}
  - id: E102
    block: OFFGAS
    title: Reflux condenser on R-101 (cooling water; returns toluene and bromine)
    class: Cooling
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in, delegates: gas}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: q1}
      - {id: reflux, direction: in, kind: energy, delegates: reflux}
      - {id: reflux2, direction: in, kind: energy, delegates: reflux2}
  - id: E103
    block: OFFGAS
    title: Vent condenser (brine, to 268 K)
    class: Cooling
    links: [{target: equipment, ref: E-103}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: q2}
  - id: A101
    block: OFFGAS
    title: HBr absorber (falling film with water tail scrubber, to 48 wt% acid)
    class: Mixing
    links: [{target: equipment, ref: A-101}]
    ports:
      - {id: gas, direction: in}
      - {id: water, direction: in, delegates: water}
      - {id: acid, direction: out, delegates: acid}
      - {id: q, direction: out, kind: energy, delegates: q3}
  - id: ST101
    block: PURIFY
    title: Toluene strip at 15 kPa(a) in the still C-101 (one stage, Rayleigh)
    class: Distilling
    # the still's model duty (its boil-up's latent heat, ADR 0059) goes on the steam Q7; the
    # condenser Q8 stays the script's (D-009)
    energy_port: steam
    still:
      pressure: 15.0
      volatility: {model: raoult, provenance: assumed, source: "ideal liquid, NIST WebBook Antoine constants (materials.yaml); toluene with benzyl bromide is a pair of similar aromatics, not shown to be ideal by data: ASSUMED (D-007)"}
      boilup: {value: 150, unit: kW, provenance: assumed, source: "C-101's jacket on LP steam 450 kPa(a), about 12 m2 at U 400 W/(m2 K) and 30 K or more of driving force (D-007, D-009)"}
      end: {residue: {key: TOL, mole_fraction: 0.15}}
      outlets: {distillate: top, residue: bottom}
      provenance: assumed
      source: "strip the toluene until it is 15 mol% of the residue: one stage carries more benzyl bromide into the recycle the deeper it strips, so the rest of the toluene goes with the forerun of ST102 (D-007)"
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: top, direction: out}
      - {id: bottom, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam1}
      - {id: q, direction: out, kind: energy, delegates: q1}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: ST102
    block: PURIFY
    title: Vacuum distillation at 2 kPa(a) in the still C-101 (one stage, forerun and main cut)
    class: Distilling
    # the still's model duty (its two cuts' latent heat, ADR 0059) goes on the steam Q9; the
    # condensers Q10 and Q11 stay the script's (D-009)
    energy_port: steam
    still:
      pressure: 2.0
      volatility: {model: raoult, provenance: assumed, source: "ideal liquid, NIST WebBook Antoine constants for toluene, bromine and benzyl bromide, benzal bromide's ASSUMED (materials.yaml, D-007)"}
      boilup: {value: 80, unit: kW, provenance: assumed, source: "C-101's jacket on LP steam 450 kPa(a) (D-007, D-009)"}
      cuts:
        - {outlet: fore, end: {residue: {key: TOL, mole_fraction: 0.002}}}
        - {outlet: main, end: {residue: {key: BNBR, mole_fraction: 0.35}}}
      outlets: {residue: bottom}
      provenance: assumed
      source: "a forerun until toluene is 0.2 mol% of the pot, recycled with the toluene; the main cut until benzyl bromide is 35 mol% of the residue, so the residue stays a mobile liquid and the cut's benzal bromide stays low (D-007)"
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: in, direction: in}
      - {id: fore, direction: out}
      - {id: main, direction: out, delegates: product}
      - {id: bottom, direction: out, delegates: residue}
      - {id: steam, direction: in, kind: energy, delegates: steam2}
      - {id: q, direction: out, kind: energy, delegates: q2}
      - {id: qb, direction: out, kind: energy, delegates: q3}
  - id: M201
    block: PURIFY
    title: Recovered toluene (strip distillate and forerun) in T-201
    class: Mixing
    links: [{target: equipment, ref: T-201}]
    ports:
      - {id: tol, direction: in}
      - {id: fore, direction: in}
      - {id: out, direction: out}
  - id: SP201
    block: PURIFY
    title: Recycle and purge of the recovered toluene
    class: SplittingMaterial
    split: {rec: 0.98}   # 2 % of the recovered toluene purged to incineration, ASSUMED (D-007)
    links: [{target: equipment, ref: T-201}]
    ports:
      - {id: in, direction: in}
      - {id: rec, direction: out, delegates: recycle}
      - {id: purge, direction: out, delegates: purge}

streams:
  - id: S1
    title: Toluene make-up
    from: TOL.out
    to: M101.tol
    template: organics
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "design basis"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 76.8994, provenance: assumed, source: "scripts/balance.py: 4.0 mol of toluene in the charge per mol of bromine dosed, less the toluene of the recycle S2 (D-004)"}
        composition: {basis: mass_fraction, values: {TOL: 1.0}, provenance: assumed, source: "toluene, its impurities not modelled (D-004)"}
  - id: S2
    title: Recycled toluene (to the next batch)
    from: SP201.rec
    to: M101.rec
    template: organics
    state:
      design:
        temperature: {value: 298.79, provenance: assumed, source: "scripts/balance.py: as S17, the recovered toluene in T-201 (D-007)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 273.418, provenance: calculated, source: 'cheme process propagate: recycle SP201 from S17 (tear, wegstein)', fingerprint: 8468a7697e396b11}
        composition: {basis: mole_fraction, values: {TOL: 0.896895, BR2: 0.000295028, BNBR: 0.102548, BALBR: 0.000261444, HBR: 0.0}, provenance: calculated, source: 'cheme process propagate: recycle SP201 from S17 (tear, wegstein)', fingerprint: 8468a7697e396b11}
  - id: S3
    title: Charge (mixed)
    from: M101.out
    to: E101.in
    template: organics
    state:
      design:
        temperature: {value: 298.64, provenance: assumed, source: "scripts/balance.py: the adiabatic mix of S1 and S2 (D-009)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 350.317, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S2', fingerprint: 80ffff0ae65679f8}
        composition: {basis: mole_fraction, values: {TOL: 0.921061, BR2: 0.000225879, BNBR: 0.0785126, BALBR: 0.000200166, HBR: 0.0}, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S2', fingerprint: a8b5a8c214cd6e4c}
  - id: S4
    title: Charge at 363 K
    from: E101.out
    to: R101.charge
    template: organics
    state:
      design:
        temperature: {value: 363.15, provenance: assumed, source: "heated in R-101 to the reaction temperature (D-005)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 350.317, provenance: calculated, source: 'cheme process propagate: pass-through E101 from S3', fingerprint: d60a18726c07b188}
        composition: {basis: mole_fraction, values: {TOL: 0.921061, BR2: 0.000225879, BNBR: 0.0785126, BALBR: 0.000200166, HBR: 0.0}, provenance: calculated, source: 'cheme process propagate: pass-through E101 from S3', fingerprint: d60a18726c07b188}
  - id: S5
    title: Bromine (dosed)
    from: BR2.out
    to: R101.br2
    template: organics
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "from storage (D-004)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 131.029, provenance: assumed, source: "scripts/balance.py: the bromine that makes 1000 t/a of S15 (the balance is linear in the feeds; D-002)"}
        composition: {basis: mass_fraction, values: {BR2: 1.0}, provenance: assumed, source: "dry bromine, its chlorine and water not modelled (bromine-1 makes 99.96 wt%; D-004)"}
  - id: S6
    title: Crude benzyl bromide in toluene
    from: R101.out
    to: ST101.in
    template: organics
    state:
      design:
        composition: {basis: mole_fraction, values: {TOL: 0.701127, BR2: 0.000230488, BNBR: 0.288115, BALBR: 0.0105274, HBR: 0.0}, provenance: calculated, source: 'cheme process propagate: reactor R101 from S4 S5', fingerprint: 3ec8b5c596e7ac09}
        flow: {value: 415.006, provenance: calculated, source: 'cheme process propagate: reactor R101 from S4 S5', fingerprint: 3ec8b5c596e7ac09}
        temperature: {value: 363.15, provenance: calculated, source: 'cheme process propagate: reactor R101 from S4 S5', fingerprint: 3ec8b5c596e7ac09}
        pressure: {value: 101.325, provenance: calculated, source: 'cheme process propagate: reactor R101 from S4 S5', fingerprint: 3ec8b5c596e7ac09}
  - id: S7
    title: HBr off-gas (363 K)
    from: R101.vent
    to: E102.in
    template: acid
    state:
      design:
        composition: {basis: mole_fraction, values: {HBR: 1.0}, provenance: calculated, source: 'cheme process propagate: reactor R101 from S4 S5', fingerprint: 3ec8b5c596e7ac09}
        flow: {value: 66.3396, provenance: calculated, source: 'cheme process propagate: reactor R101 from S4 S5', fingerprint: 3ec8b5c596e7ac09}
        temperature: {value: 363.15, provenance: calculated, source: 'cheme process propagate: reactor R101 from S4 S5', fingerprint: 3ec8b5c596e7ac09}
        pressure: {value: 101.325, provenance: calculated, source: 'cheme process propagate: reactor R101 from S4 S5', fingerprint: 3ec8b5c596e7ac09}
  - id: S8
    title: HBr after the reflux condenser
    from: E102.out
    to: E103.in
    template: acid
    state:
      design:
        temperature: {value: 303.15, provenance: assumed, source: "reflux condenser outlet on cooling water (D-008)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 66.3396, provenance: calculated, source: 'cheme process propagate: pass-through E102 from S7', fingerprint: 0e2edb721a33be12}
        composition: {basis: mole_fraction, values: {HBR: 1.0}, provenance: calculated, source: 'cheme process propagate: pass-through E102 from S7', fingerprint: 0e2edb721a33be12}
  - id: S9
    title: HBr after the vent condenser
    from: E103.out
    to: A101.gas
    template: acid
    state:
      design:
        temperature: {value: 268.15, provenance: assumed, source: "vent condenser outlet on brine, 5 K above the brine's 263 K return (D-008)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 66.3396, provenance: calculated, source: 'cheme process propagate: pass-through E103 from S8', fingerprint: 8f85ef16a834faf8}
        composition: {basis: mole_fraction, values: {HBR: 1.0}, provenance: calculated, source: 'cheme process propagate: pass-through E103 from S8', fingerprint: 8f85ef16a834faf8}
  - id: S10
    title: Absorber water
    from: PW.out
    to: A101.water
    template: acid
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "design basis"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 71.8676, provenance: assumed, source: "scripts/balance.py: 52/48 kg per kg of HBr in S9, for 48 wt% acid (D-008)"}
        composition: {basis: mass_fraction, values: {H2O: 1.0}, provenance: given, source: "process water"}
  - id: S11
    title: Hydrobromic acid 48 wt%
    from: A101.acid
    to: HBRACID.in
    template: acid
    state:
      design:
        temperature: {value: 313.15, provenance: assumed, source: "absorber outlet on cooling water (D-008)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 138.207, provenance: calculated, source: 'cheme process propagate: mixer A101 from S9 S10', fingerprint: 4629bc38cde29c94}
        composition: {basis: mole_fraction, values: {HBR: 0.170485, H2O: 0.829515}, provenance: calculated, source: 'cheme process propagate: mixer A101 from S9 S10', fingerprint: 7767bded051110fc}
