title: Benzyl bromide by semi-batch light-driven side-chain bromination of toluene with HBr absorption
  and batch distillation (1000 t/a)
description: Unallocated foreground LCI of Benzyl bromide by semi-batch light-driven side-chain bromination
  of toluene with HBr absorption and batch distillation (1000 t/a), case design, derived from the flowsheet
  by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Batch plant: bromine dosed over 5 h into 4 mol of toluene per mol at 363 K under lamps (semi-batch),
  the HBr vented as it forms through a reflux and a brine vent condenser and absorbed to 48 wt% acid;
  the crude stripped of toluene at 15 kPa(a) and distilled at 2 kPa(a) in one batch still (forerun recycled
  with the toluene, 2 % purged); 889.6 kg per batch, 1124 batches a year on a dedicated train'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:vent-toluene
  title: storage-tank emissions of E-103, A-101
  direction: output
  reason: 'Core''s vent carries only HBr (core ADR 0054, L-3): the toluene the HBr still carries past
    the vent condenser at 268 K, 0.0064 mol per mol of HBr (its vapour pressure, D-008), 0.037 kmol or
    3.4 kg a batch (3.8 g per kg of product), goes to the absorber, where it separates on the acid or
    passes to the tail scrubber; the bromine vapour with it is not estimated. Neither is in the balance
    (open for basic engineering).'
- key: emission-excluded:absorber-tail-gas
  title: storage-tank emissions of R-101, A-101
  direction: output
  reason: 'No P&ID yet: R-101 vents only through the condensers and the absorber; its tail gas (the nitrogen
    of the purges with HBr, bromine and toluene traces) goes through a water tail scrubber and a caustic
    guard scrubber to air. The balance absorbs all HBr (D-008); not estimated.'
- key: emission-excluded:toluene-tank
  title: storage-tank emissions of T-201
  direction: output
  reason: 'No P&ID yet: T-201 (the recovered toluene with 17 wt% benzyl bromide, at about 299 K) is nitrogen-padded
    and breathes to the vent scrubber; its working and breathing losses are not estimated (open for basic
    engineering, D-007).'
- key: emission-excluded:vacuum-vent
  title: storage-tank emissions of C-101
  direction: output
  reason: 'The vacuum pump''s exhaust (air in-leakage with toluene at its vapour pressure over the condensates,
    the HBr the crude holds dissolved, benzyl bromide traces) to the vent scrubber is not estimated: the
    in-leakage rate is not known at the concept stage (D-007).'
