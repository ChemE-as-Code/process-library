# benzyl-bromide-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# The preliminary LCI leaves most backgrounds unmapped (DESIGN.md D-012): the build reports each
# as a gap (lci/gaps.json). Linked here: the bromine to bromine-1, the toluene make-up to btx-1's
# reformate extraction (the library entry whose dataset makes toluene, as
# p-toluenesulfonyl-chloride-1 links it), the nitrogen consumable to asu-1's gaseous nitrogen,
# and the LP steam counted as heat delivered (kWh), as n-bromosuccinimide-1 does. The shared
# vocabulary has no entry yet for hazardous-waste incineration of a brominated organic residue.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:BR2": {dataset: {path: processes/bromine-1/lca/dataset.yaml, product: "product:BR2"}, source: "the Atlas producer bromine-1, dry bromine 99.96 wt-%"}
  "feed:TOL": {dataset: {path: processes/btx-1/lca/datasets/btx-reformate-extraction.yaml, product: "product:toluene"}, source: "the Atlas producer btx-1, toluene from the solvent extraction of catalytic reformate, a co-product of that dataset (its mass allocation)"}
  "consumable:nitrogen": {dataset: {path: processes/asu-1/lca/dataset.yaml, product: "product:GANP"}, source: "the Atlas producer asu-1, gaseous nitrogen to the battery limit (99.97 mol% N2, 9 bar(a)); the purges need only a few hundred kPa"}
  "feed:LPS": {use: steam-heat, source: "LP steam 450 kPa(a) to R-101's heat-up (Q1) and the still C-101 (Q7, Q9), counted as heat delivered (kWh), D-009"}
