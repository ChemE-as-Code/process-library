# The equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes per batch from the recipe (D-003) and the models; design pressures, temperatures and
# materials are not set yet (basic engineering); materials named are usual choices for PCl5,
# POCl3, oxalyl chloride and wet HCl, to be confirmed (open input). All values ASSUMED.
schema: cheme/equipment/v1
equipment:
  - {tag: R-101, type: StirredTankReactor, service: "Reactor-still: PCl3 charged to the heel and chlorinated, the oxalic acid slurry dosed, the gases vented, the crude stripped off at 15 kPa(a)",
     notes: "12.5 m3 enamelled (glass-lined) steel (R10 preferred size, 73 % full with 9.17 m3 at the end of R102), as the recipe sizes it from R102 (core ADR 0052); jacket 15.3 m2 at R102's charge on cooling water (log-mean equivalent 303.43 K) removes 136.5 kW against R102's peak 23.2 kW (cheme process recipe); R101's peak, 16.36 kW/m3 x 6.46 m3 = 105.6 kW at the end of the 8 h chlorine dosing, against 133.1 kW at R101's charge (14.9 m2), checked by hand (core sizes the vessel from one semi-batch only, L-5); warmed and stripped on a hot-water loop at 353/348 K heated by LP steam, below R101's MTT 360.72 K and R102's 367.16 K; vent through E-102 to A-101, sized for 350 m3/h (hazard.vent_capacity, D-011); dry vacuum pump for the strip; chlorine and acid-slurry dosing interlocked with the temperature, the agitator, the jacket in cooling mode and the absorber's water flow; kept dry (no water rinse; PCl5, POCl3 and oxalyl chloride hydrolyse violently: jacket-leak detection or a non-aqueous heat-transfer fluid to be assessed, D-011)."}
  - {tag: V-102, type: Vessel, service: "Acid slurry tank: anhydrous oxalic acid suspended in recycled POCl3 and C-201's off-cut",
     notes: "About 4 m3 (one batch's 4.3 t of slurry, about 2.6 m3), agitated, enamelled, nitrogen-blanketed and vented to E-102; dry solids feed of the anhydrous acid from bags or a silo (D-004)."}
  - {tag: E-102, type: HeatExchanger, service: "Vent condenser on chilled water: oxalyl chloride, POCl3 and chlorine vapour in R-101's off-gas returned to R-101",
     notes: "Gas out at 283 K, 5 K above the chilled water's 278 K supply, which stays above the 274.33 K melting point of POCl3 (the condensate is mostly POCl3); 3.81 kW year average (Q4, core's vent condenser with the gases cooled, ADR 0062), about 17 kW over R102's 4.4 h; 7.4 % of the acid's oxalyl chloride passes it to the absorber (D-010)."}
  - {tag: E-103, type: HeatExchanger, service: "Strip condenser on chilled water: the crude distilled off R-101 at 15 kPa(a)",
     notes: "24.4 kW year average (Q6, core's still model), 80 kW while stripping; crude condensing near 309 K; the crude receiver under the same vacuum, broken with nitrogen; the vacuum pump's discharge to a cold trap and the absorber (lca.yaml emission exclusions, D-007)."}
  - {tag: T-201, type: Tank, service: "Crude receiver and oxalyl chloride storage under nitrogen",
     notes: "Crude receiver about 6.3 m3 (one batch's 7.9 t of crude); product storage for a few batches, about 3 m3, nitrogen-blanketed, vented to E-102; kept dry (D-008)."}
  - {tag: C-201, type: Vessel, service: "Batch still: the crude rectified at atmospheric pressure, the POCl3 cooled and drained",
     notes: "6.3 m3 (one batch's 7.9 t of crude, 5.0 m3, 80 % full; cheme process recipe), enamelled steel, jacket on LP steam (412 K) for a 150 kW reboiler duty (year average Q7 60.8 kW from the still's model with its column: the boil-up at reflux 6 and the charge's heat-up), then on cooling water for the POCl3 (Q10); not sized by core (its still has no vessel, L-4); D-008, D-009."}
  - {tag: K-201, type: Column, service: "Packed column on the still with a total condenser, reflux ratio 6, product cooler",
     notes: "About 15 theoretical stages at a reflux ratio of 6 (ASSUMED, D-008), condenser on cooling water for the boil-up's latent heat while distilling (Q8 55.4 kW year average from the still's model), oxalyl chloride condensing at 336.7 K, 29 to 39 K above the cooling water; product cooler E-201 to 303 K (Q9); product cut 99.50 wt% at 80.6 % of the crude's oxalyl chloride, the off-cut (27.0 wt% oxalyl chloride) back to V-102; vent to E-102."}
  - {tag: E-201, type: HeatExchanger, service: "Product cooler on cooling water",
     notes: "0.70 kW year average (Q9): the product cut from 336.7 to 303 K (D-009)."}
  - {tag: T-202, type: Tank, service: "POCl3 tank: the still's residue to the next acid slurry and to the co-product",
     notes: "About 10 m3 (two batches' 5.4 t), nitrogen-blanketed, vented to E-102; 36 % of the POCl3 returns to V-102, the rest is the co-product (D-008)."}
  - {tag: A-101, type: Column, service: "HCl absorber: falling-film absorber with a packed tail scrubber, water to 30 wt% hydrochloric acid",
     notes: "Per batch 1297 kg of vent from R-101 (26.0 kmol HCl, 1.95 kmol CO, 1.95 kmol CO2, 0.96 kmol oxalyl chloride, 0.49 kmol POCl3, 0.14 kmol chlorine; cheme process recipe), the oxalyl chloride and POCl3 hydrolysed; 24.6 kW to cooling water year average (Q11); peak 182 m3/h at the start of the acid dosing, sized with R-101's vent line for 350 m3/h (D-011); the tail gas (CO, CO2, chlorine traces) to the site's thermal oxidiser, never through activated carbon (it catalyses phosgene from CO and chlorine, D-011); anti-suck-back protection on the vent line from R-101 (a nitrogen-padded seal pot or a vacuum breaker on nitrogen): HCl absorption in water pulls a vacuum that could draw water back into R-101 (D-010, D-011)."}
