# The equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes per batch from the recipe (D-003) and the models; design pressures, temperatures and
# materials are not set yet (basic engineering); materials named are usual choices for PCl5,
# POCl3, oxalyl chloride and wet HCl, to be confirmed (open input). All values ASSUMED.
schema: cheme/equipment/v1
equipment:
  - {tag: R-101, type: StirredTankReactor, service: "Reactor-still: PCl3 charged to the heel and chlorinated, the oxalic acid slurry dosed, the gases vented, the crude stripped off at 15 kPa(a)",
     notes: "16 m3 enamelled (glass-lined) steel (R10 preferred size, 66 % full with 10.54 m3 at the end of R102), as the recipe sizes it from R102 (core ADR 0052); jacket 17.6 m2 at R102's charge on cooling water (log-mean equivalent 303.43 K) removes 157.1 kW against R102's peak 29.7 kW (cheme process recipe); R101's peak, 16.82 kW/m3 x 7.99 m3 = 134.4 kW at the end of the 8 h chlorine dosing, against 153.1 kW at R101's charge (17.2 m2), checked by hand (core sizes the vessel from one semi-batch only, L-5); warmed and stripped on a hot-water loop at 353/348 K heated by LP steam, below R101's MTT 358.78 K and R102's 367.00 K, its supply tripped at 356 K; the strip's 45 kW is what the loop gives at the strip's end (49.1 kW over 13.1 m2, D-007); metal about 13 t, 6500 kJ/K (ASSUMED, D-009); vent through E-102 to A-101, sized for 450 m3/h (hazard.vent_capacity, D-011); dry vacuum pump for the strip; chlorine and acid-slurry dosing interlocked with the temperature, the agitator, the jacket in cooling mode and the absorber's water flow, the chlorine also on the temperature rise and on chlorine at E-102's outlet (D-011); kept dry (no water rinse; PCl5, POCl3 and oxalyl chloride hydrolyse violently: jacket-leak detection or a non-aqueous heat-transfer fluid to be assessed, D-011)."}
  - {tag: V-102, type: Vessel, service: "Acid slurry tank: anhydrous oxalic acid suspended in recycled POCl3",
     notes: "About 4 m3 (one batch's 4.0 t of slurry, about 2.3 m3), agitated, enamelled, nitrogen-blanketed and vented to E-102; dry solids feed of the anhydrous acid from bags or a silo; no oxalyl chloride but the POCl3's trace (0.17 wt%) meets the acid (D-004, D-008)."}
  - {tag: E-102, type: HeatExchanger, service: "Vent condenser on chilled water: oxalyl chloride, POCl3 and chlorine vapour in R-101's off-gas returned to R-101",
     notes: "Gas out at 283 K, 5 K above the chilled water's 278 K supply, which stays above the 274.33 K melting point of POCl3 (the condensate is mostly POCl3); 3.53 kW year average (Q4, core's vent condenser with the gases cooled, ADR 0062), about 21 kW over R102's 4.4 h; 6.8 % of the acid's oxalyl chloride passes it to the absorber (D-010)."}
  - {tag: E-103, type: HeatExchanger, service: "Strip condenser on chilled water: the crude distilled off R-101 at 15 kPa(a)",
     notes: "20.8 kW year average (Q6, core's still model), 45 kW while stripping; crude condensing near 309 K; the crude receiver under the same vacuum, broken with nitrogen; the vacuum pump's discharge to a cold trap and the absorber (lca.yaml emission exclusions, D-007)."}
  - {tag: T-201, type: Tank, service: "Crude receiver and oxalyl chloride storage under nitrogen",
     notes: "Crude receiver about 8 m3 (one batch's 8.5 t of crude, 5.5 m3); product storage for a few batches, about 4 m3, nitrogen-blanketed, vented to E-102; kept dry (D-008)."}
  - {tag: C-201, type: Vessel, service: "Batch still: the crude rectified at atmospheric pressure with the last batch's off-cut, the POCl3 cooled and drained",
     notes: "10 m3 (one batch's 9.9 t of crude and off-cut, 6.38 m3, 64 % full, at most 75 % since it boils; cheme process recipe), enamelled steel, metal about 9 t, 4500 kJ/K (ASSUMED, D-009); jacket on LP steam (412 K) for a 95 kW boil-up, what it gives at the still's end (118.5 kW over 11.6 m2, checked by hand, D-008; year average Q7 64.0 kW from the still's model with its column: the boil-up at reflux 6, the charge's heat-up and the metal), then on cooling water: the POCl3 and the metal cooled to 313 K in 1.72 h (Q10, D-008, D-009)."}
  - {tag: K-201, type: Column, service: "Packed column on the still with a total condenser, reflux ratio 6, product cooler",
     notes: "About 15 theoretical stages at a reflux ratio of 6 (ASSUMED, D-008), condenser on cooling water for the boil-up's latent heat while distilling (Q8 55.4 kW year average from the still's model), oxalyl chloride condensing at 336.7 K, 29 to 39 K above the cooling water; product cooler E-201 to 303 K (Q9); product cut 99.50 wt% at 80.6 % of the charge's oxalyl chloride, the off-cut (27.0 wt% oxalyl chloride) to T-203 and the next still charge; vent to E-102."}
  - {tag: E-201, type: HeatExchanger, service: "Product cooler on cooling water",
     notes: "0.70 kW year average (Q9): the product cut from 336.7 to 303 K (D-009)."}
  - {tag: T-202, type: Tank, service: "POCl3 tank: the still's residue to the next acid slurry and to the co-product",
     notes: "About 10 m3 (two batches' 6.9 t, 4.3 m3 each), nitrogen-blanketed, vented to E-102; 36 % of the POCl3 returns to V-102, the rest is the co-product (D-008)."}
  - {tag: T-203, type: Tank, service: "Off-cut receiver: C-201's off-cut kept for the next still charge",
     notes: "About 1.6 m3 (one batch's 1.41 t at 27.0 wt% oxalyl chloride, 0.92 m3), nitrogen-blanketed, vented to E-102, kept dry; the off-cut cools to ambient in it over about one cycle (D-008, D-009)."}
  - {tag: A-101, type: Column, service: "HCl absorber: falling-film absorber with a packed tail scrubber, water to 30 wt% hydrochloric acid",
     notes: "Per batch 1641 kg of vent from R-101 (33.1 kmol HCl, 2.48 kmol CO, 2.48 kmol CO2, 1.13 kmol oxalyl chloride, 0.64 kmol POCl3, 0.19 kmol chlorine; cheme process recipe), the oxalyl chloride and POCl3 hydrolysed; 24.3 kW to cooling water year average (Q11); peak 231 m3/h at the start of the acid dosing, sized with R-101's vent line for 450 m3/h (D-011); the tail gas (CO, CO2, chlorine traces) to the site's thermal oxidiser, never through activated carbon (it catalyses phosgene from CO and chlorine, D-011); anti-suck-back protection on the vent line from R-101 (a nitrogen-padded seal pot or a vacuum breaker on nitrogen): HCl absorption in water pulls a vacuum that could draw water back into R-101 (D-010, D-011)."}
