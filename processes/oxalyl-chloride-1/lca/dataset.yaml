title: Oxalyl chloride from oxalic acid and phosphorus pentachloride made in situ, batch reaction with
  gas evolution and batch distillation (500 t/a)
description: Unallocated foreground LCI of Oxalyl chloride from oxalic acid and phosphorus pentachloride
  made in situ, batch reaction with gas evolution and batch distillation (500 t/a), case design, derived
  from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Batch plant on one reactor-still and one rectification still: PCl3 charged to the recycled
  heel (PCl5 in POCl3 with 2,4-dimethylpyridine) and chlorinated at 333 K over 8 h; anhydrous oxalic acid
  in recycled POCl3 dosed over 4 h at 333 K, HCl, CO and CO2 vented through a chilled-water condenser
  to a water absorber (30 wt% hydrochloric acid); the crude stripped off the heel at 15 kPa(a), 5 % of
  the heel purged; the crude rectified at atmospheric pressure (15 stages, reflux 6) to the product, an
  off-cut recycled and POCl3; 1286 kg per batch, 389 batches a year on a dedicated train'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:vent-nitrogen
  title: storage-tank emissions of R-101, E-102, A-101
  direction: output
  reason: 'No P&ID yet: the nitrogen of the vacuum break, which the next charge displaces through E-102
    and the absorber, leaves saturated with oxalyl chloride and POCl3 at 283 K, about 0.67 kmol a batch
    carrying about 0.02 kmol (3 kg) of oxalyl chloride, 0.2 % of the batch, which the absorber hydrolyses
    to HCl, CO and CO2; not in the balance (D-010).'
- key: emission-excluded:vacuum-pump
  title: storage-tank emissions of R-101, E-103
  direction: output
  reason: 'No P&ID yet: the strip''s vacuum pump discharges the air that leaks into R-101 at 15 kPa(a),
    saturated over the crude condensate at E-103''s 283 K outlet; at an ASSUMED leak of 1 kg/h (0.035
    kmol/h) of air, the gas carries about 0.4 mol of oxalyl chloride and POCl3 vapour per mol of air (4.4
    of 15 kPa), about 2 kg/h, some 13 kg a batch over the strip (1 % of the batch''s product), to be recovered
    in a cold trap after the pump and routed to the absorber; not in the balance (D-010).'
- key: emission-excluded:storage-breathing
  title: storage-tank emissions of T-201, T-202, V-102
  direction: output
  reason: The breathing of the oxalyl chloride, POCl3 and acid slurry tanks (nitrogen-blanketed, vented
    to E-102 and the absorber) is not estimated (D-010).
