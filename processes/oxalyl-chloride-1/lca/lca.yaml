# Goal and scope of the oxalyl-chloride-1 LCI. Schema: `cheme schema lca`. Outputs: `cheme
# assess lca --write` (lca/inventory.csv, gaps.csv, dataset.yaml, manifest.json, results); never
# edit those by hand.
#
# Preliminary gate-to-gate foreground inventory (DESIGN.md D-012): every exchange of the batch
# plant with its amount per kg of oxalyl chloride, from the flowsheet's year averages of the
# recipe (D-003). Per batch: multiply by 1642.1 kg. The backgrounds are left unmapped
# (`missing:` with the activity each should connect to), except where lca/mappings.yaml links a
# library producer or a shared entry: a gap, never zero, and no values from licensed databases.
# Phosphorus trichloride, anhydrous oxalic acid and 2,4-dimethylpyridine have no exported
# library producer: their gaps name the proxy each should connect to (D-012).
schema: cheme/lca/v1
kind: lca
goal: >-
  Preliminary gate-to-gate life cycle inventory of oxalyl chloride made by Bayer's one-pot
  route (phosphorus trichloride chlorinated to PCl5 in a recycled heel, anhydrous oxalic acid
  dosed in, the gases absorbed, the crude stripped off the heel and rectified) at the concept
  stage: which raw materials, utilities and wastes the batch plant exchanges per kg of oxalyl
  chloride, as the foreground for a later cradle-to-gate study. No impact results: most
  backgrounds are not mapped yet (D-012).
functional_unit: {product: OXCLP, amount: 1, unit: kg, source: "1 kg of the distilled product cut (modelled 99.50 wt% oxalyl chloride, 0.43 wt% POCl3, 0.07 wt% PCl3) at the plant gate to storage, stream S17 (D-002, D-008, D-012)"}
# The boundary key stays cradle-to-gate so that the purchased inputs remain open gaps instead of
# being mapped free (the schema's gate-to-gate maps every feed free), as acetyl-chloride-1 does.
boundary: cradle-to-gate
case: design
year: 2026
location: GLO
technology: "Batch plant on one reactor-still and one rectification still: PCl3 charged to the recycled heel (PCl5 in POCl3 with 2,4-dimethylpyridine) and chlorinated at 333 K over 8 h; anhydrous oxalic acid in recycled POCl3 dosed over 4 h at 333 K, HCl, CO and CO2 vented through a chilled-water condenser to a water absorber (30 wt% hydrochloric acid); the crude stripped off the heel at 15 kPa(a), 5 % of the heel purged; the crude rectified at atmospheric pressure with the last batch's off-cut (15 stages, reflux 6) to the product, an off-cut for the next still charge and POCl3; 1642.1 kg per batch, 304.5 batches a year on a dedicated train"
rights: "CC-BY-4.0: the ChemE-as-Code process library's own concept design (LICENSE-DATA)"
system_model: cutoff
allocation:
  # Economic allocation written as its shares (D-012): the products' values per hour at ASSUMED
  # relative prices per kg (oxalyl chloride 1, POCl3 0.25, 30 wt% hydrochloric acid 0.02).
  method: shares
  coproducts: [OXCLP, POCL3P, HCLAQ]
  # S17 63.131 x 1, S20 168.742 x 0.25 and S23 174.241 x 0.02 kg/h give 63.131, 42.186 and 3.485
  shares: {OXCLP: 0.580, POCL3P: 0.388, HCLAQ: 0.032}
  source: >-
    D-012 (agent proposal, for the LCA practitioner to confirm): the plant makes, per kg of
    oxalyl chloride, about 2.7 kg of POCl3 (a traded chemical, the product of
    processes/phosphorus-oxychloride-1) and 2.8 kg of 30 wt% hydrochloric acid, both of fixed
    stoichiometry. The library hierarchy (docs/system-model.md) has no physical relationship
    here (none is a fuel; no exergy, since no property package covers these liquids), so the
    WBCSD rule applies: the highest to the lowest price per kg (a fine acid chloride against
    merchant hydrochloric acid) is well above 5, so the rule gives economic allocation. No
    prices are sourced at the concept stage: the relative prices per kg 1 : 0.25 : 0.02 are
    ASSUMED (a fine chemical, a bulk phosphorus chloride, a by-product acid).
  deviation: >-
    The shares rest on ASSUMED relative prices, not sourced ones. The conservative bound is all
    burdens to the oxalyl chloride (share 1, the POCl3 and the acid free); mass allocation, which
    the rule would give only below a price ratio of 5, would leave the oxalyl chloride about
    16 % of the burdens. Sourced prices replace the ratios.
flows:
  # raw materials
  - key: feed:PCL3F
    missing: "not mapped yet (D-012); no library process exports phosphorus trichloride. Connect to: phosphorus trichloride from white phosphorus and chlorine in a PCl3 heel (P4 + 6 Cl2 -> 4 PCl3; 0.226 kg P and 0.774 kg Cl2 per kg, stoichiometric), whose main burdens are white phosphorus (no library producer) and chlorine (processes/chlor-alkali-1); processes/phosphorus-oxychloride-1 models that step as its internal block PCL3 and does not export it (recorded proxy, not linked)"
    source: "flowsheet stream S1 (D-004)"
  - key: feed:CL2F
    missing: "linked to processes/chlor-alkali-1 (lca/mappings.yaml): dry chlorine gas"
    source: "flowsheet stream S6 (D-004)"
  - key: feed:OXAF
    missing: "not mapped yet (D-012); no library process makes oxalic acid. Connect to: oxalic acid, anhydrous, by oxidation of carbohydrates (glucose) with nitric acid or with air over vanadium pentoxide, crystallised as the dihydrate and dried (Wikipedia, Oxalic acid; recorded proxy, not linked); its main burdens are the sugar, the nitric acid (processes/nitric-acid-1) and the drying"
    source: "flowsheet stream S8 (D-004)"
  - key: feed:LUTF
    missing: "not mapped yet (D-012); connect to: 2,4-dimethylpyridine (a pyridine base from coal tar or by synthesis), per kg; 3.1 g per kg of PCl3, below the cut-off's 1 % of the input mass but kept as a gap"
    source: "flowsheet stream S2 (D-004)"
  - key: feed:PW
    missing: "not mapped yet (D-012); connect to: process (demineralised) water from the site water treatment, for the HCl absorber"
    source: "flowsheet stream S21 (D-010)"
  # utilities
  - key: feed:POWER
    missing: "not mapped yet (D-012); connect to: electricity, medium voltage, grid mix of the (undecided) site country"
    source: "flowsheet energy streams P1 (R-101's agitator and the strip's vacuum pump), P2 (C-201's agitator, reflux and transfer pumps) and P3 (the absorber's pump and fan), D-009"
  - key: feed:LPS
    missing: "linked as heat from steam (lca/mappings.yaml); connect to: steam in the chemical industry, 350 kPa(a), from a natural-gas-fired site boiler (e.g. processes/utility-steam-ng-boiler), per kWh of condensing heat"
    source: "flowsheet energy streams Q1 (the charge warmed), Q5 (the strip, from core's still model) and Q7 (C-201's reboiler from core's still model with its column: the boil-up at reflux 6 and the charge's heat-up), D-009"
  - key: product:CW
    missing: "not mapped yet (D-012); connect to: heat rejected to a recirculating cooling-water system with cooling tower (processes/utility-cooling-tower), per kWh removed"
    source: "flowsheet energy streams Q2 (R101, from core's semi-batch model), Q3 (R102, from its model), Q8 (the column's condenser, from core's still model), Q9 (product cooler), Q10 (POCl3 cooling) and Q11 (the absorber), D-009, D-010"
  - key: product:CHW
    missing: "not mapped yet (D-012); connect to: refrigeration at 278 K (chilled water) from an electric vapour-compression unit (e.g. processes/utility-chiller), per kWh of heat removed: compressor electricity at its COP, condenser cooling water, refrigerant losses"
    source: "flowsheet energy streams Q4 (vent condenser E-102, from R102's model) and Q6 (the strip's condenser E-103, from ST101's model), D-009, D-010"
  # wastes
  - key: product:PURGE
    treatment: {kind: waste, route: "hazardous-waste incineration of the heel purge (PCl5, POCl3, the amine catalyst) with flue-gas scrubbing (HCl and P2O5 captured); not recovered in this concept (D-004)"}
    missing: "not mapped yet (D-012); connect to: incineration of hazardous liquid chlorinated and phosphorus-containing waste, per kg"
    source: "flowsheet stream S15 (D-004)"
  - key: product:TAIL
    treatment: {kind: waste, route: "thermal oxidation of the absorber's tail gas (CO to CO2, the chlorine traces to HCl, captured in the oxidiser's caustic scrubber) in the site's thermal oxidiser (D-010)"}
    missing: "not mapped yet (D-012); connect to: thermal oxidation of a CO-bearing process off-gas with caustic flue-gas scrubbing, per kg; the CO (0.064 kg per kg of product) leaves the oxidiser as 0.100 kg of CO2, beside the 0.100 kg of CO2 the tail gas carries itself"
    source: "flowsheet stream S24 (D-010)"
# What the batch plant uses per batch and the flowsheet does not carry (library ADR 0035, core
# ADR 0053): the nitrogen that breaks R-101's vacuum after the strip and blankets C-201, the
# receivers and the tanks, converted with the recipe's batches per year (process/recipe.yaml).
# There is no rinse between batches: the train is kept dry (PCl5, POCl3 and oxalyl chloride
# react violently with water).
consumables:
  - id: nitrogen
    title: Nitrogen for R-101's vacuum break and the blankets of C-201, the receivers and the tanks
    unit: kg
    per_batch: 21.3
    source: "17 Nm3 per batch x 1.2506 kg/Nm3, ASSUMED (D-012): R-101's 16 m3 broken from 15 kPa(a) over the 5.1 m3 heel (about 9 Nm3), the crude receiver's vacuum break (3 Nm3), C-201 and the tanks blanketed as they fill and empty (5 Nm3)"
    missing: "linked to processes/asu-1 (lca/mappings.yaml): gaseous nitrogen to the battery limit"
operation:
  hours_per_year: 7920
  life_years: 20
  source: "design basis operating_hours_per_year 7920 (ASSUMED, the recipe's hours); 20 a service life ASSUMED"
emission_exclusions:
  - {id: vent-nitrogen, method: storage-tank, equipment: [R-101, E-102, A-101], reason: "No P&ID yet: the nitrogen of the vacuum break, which the next charge displaces through E-102 and the absorber, leaves saturated with oxalyl chloride and POCl3 at 283 K, about 0.42 kmol a batch (9.3 Nm3) carrying about 0.013 kmol (1.6 kg) of oxalyl chloride, 0.1 % of the batch, which the absorber hydrolyses to HCl, CO and CO2; not in the balance (D-010)."}
  - {id: vacuum-pump, method: storage-tank, equipment: [R-101, E-103], reason: "No P&ID yet: the strip's vacuum pump discharges the air that leaks into R-101 at 15 kPa(a), saturated over the crude condensate at E-103's 283 K outlet; at an ASSUMED leak of 1 kg/h (0.035 kmol/h) of air, the gas carries about 0.4 mol of oxalyl chloride and POCl3 vapour per mol of air (4.4 of 15 kPa), about 2 kg/h, some 24 kg a batch over the 12 h strip (1.5 % of the batch's product), to be recovered in a cold trap after the pump and routed to the absorber; not in the balance (D-010)."}
  - {id: storage-breathing, method: storage-tank, equipment: [T-201, T-202, T-203, V-102], reason: "The breathing of the oxalyl chloride, POCl3, off-cut and acid slurry tanks (nitrogen-blanketed, vented to E-102 and the absorber) is not estimated (D-010)."}
dataset:
  version: 0.1.0
  classification: {isic: "2011"}   # ISIC Rev.4 2011 Manufacture of basic chemicals
  modelling: {principle: attributional}
  geography: {description: "Generic fine-chemicals site with a PCl3, chlorine and oxalic acid supply and a thermal oxidiser, not chosen (GLO); one design case"}
  system_model: cutoff
  technology_level: current
  review: {type: none}
  data_generator: "ChemE-as-Code agent session (Claude Opus 5.5) for issue #144, unreviewed"
