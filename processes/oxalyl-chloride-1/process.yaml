# Process Atlas manifest of oxalyl-chloride-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: oxalyl-chloride-1
title: Oxalyl chloride from oxalic acid and in-situ PCl5, batch reaction with gas evolution and batch distillation (500 t/a)
summary: >-
  A batch plant on Bayer's one-pot route: PCl3 chlorinated to PCl5 in a recycled heel, oxalic
  acid dosed in, HCl, CO and CO2 vented through a chilled-water condenser to an absorber, the
  crude stripped under vacuum and rectified. Concept stage, 1280.5 kg per batch every 20.27 h,
  thermal screening with a rate-constant sensitivity, preliminary gate-to-gate LCI.
description: |
  Phosphorus trichloride is charged to the heel kept from the last batch (PCl5 suspended in POCl3
  with 2,4-dimethylpyridine) and chlorinated at 333 K, chlorine dosed over 8 h; anhydrous oxalic
  acid suspended in recycled POCl3 and the last batch's off-cut is then dosed over 4 h:
  (COOH)2 + 2 PCl5 -> (COCl)2 + 2 POCl3 + 2 HCl, while 15 % of the acid decomposes to CO, CO2
  and HCl (the route of US 4 341 720 A, Bayer, Examples 19 and 20). The gases leave through a
  vent condenser on chilled water, whose POCl3-rich condensate returns, to a water absorber
  (30 wt% hydrochloric acid); the tail gas, about half CO, goes to the site's thermal oxidiser.
  The crude (20.4 wt% oxalyl chloride in POCl3, the source's 21.9 wt%) is stripped off the heel
  at 15 kPa(a) in the same vessel, 5 % of the heel purged, and rectified at atmospheric pressure
  in a still with a 15-stage column at reflux 6: a product cut of 99.50 wt% oxalyl chloride, an
  off-cut back to the acid slurry, and POCl3, 36 % of it back to the acid slurry, the rest a
  co-product (2.68 kg per kg). Yield 77.2 % of theory on the oxalic acid: a model result below
  the source's 84.2 % isolated, because 7.4 % of the acid's worth of oxalyl chloride passes the
  vent condenser, which cannot run colder without freezing POCl3.

  The batch is modelled with cheme-as-code's semi-batches with a gas vent, the liquid's vapour and
  a partial vent condenser (reactor: semibatch, batch.vent, core ADRs 0050, 0054, 0062), the
  chlorine dosed with its heat of solution (ADR 0063), a batch still for the strip and a batch
  still with its rectifying column (ADRs 0055, 0061), the heel and POCl3 recycles converged at
  two tear streams (ADR 0060), and the batch recipe (ADRs 0051, 0052, 0057): R-101 is the
  bottleneck (cycle 20.27 h, 390.7 batches a year), the recipe sizes it (12.5 m3) and checks its
  jacket, the flowsheet's flows are the recipe's year averages, and every model writes its own
  duty (ADR 0059). The kinetics are ASSUMED and the selectivity calibrated to the source's crude.
  The screening gives MTSRs of 335.1 K (chlorination) and 334.0 K (reaction) against MTTs of
  360.7 and 367.2 K, the boiling points of the vented mass; a cooling failure releases 283 m3/h
  of gas and vapour, 0.81 of the vent's 350 m3/h, but 1.35 times it if the reaction were 100
  times slower: a design finding. See DESIGN.md for every assumption.
families: [chlorinated-organics]
keywords: [oxalyl chloride, oxalic acid, phosphorus pentachloride, PCl5, phosphorus trichloride, chlorine, phosphoryl chloride, POCl3, acid chloride, semi-batch, batch, dosing, gas evolution, HCl vent, CO, vent condenser, HCl absorption, vacuum stripping, batch distillation, batch rectification, recycle, thermal screening, fine chemicals]
facets:
  feedstock_basis: [fossil, mineral, electricity]
  product_classes: [chemicals]
  unit_operations: [reaction, separation, distillation, absorption]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, kinetics, the
# selectivity's calibration, the stills' ideal liquid and the column's stages and reflux are
# assumed; ratios and conditions from the patent's examples (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept batch PFD with closed mass, component and element balances (cheme validate, cheme
    process streams: 3 blocks and 13 steps within tolerance; the heel and POCl3 recycles
    converged at the tears S3 and S13). The semi-batches R101 and R102 with R102's vent, the
    liquid's vapour and the vent condenser E-102 (from their ASSUMED rate laws), the strip ST101
    at 15 kPa(a), the rectification ST201 (15 theoretical stages at reflux 6, Diwekar's shortcut
    on Raoult's law with NIST Antoine constants and an ASSUMED Clausius-Clapeyron line for
    oxalyl chloride, the ideal liquid ASSUMED; 99.50 wt% at 80.6 % recovery of the crude's oxalyl
    chloride per batch) and the absorber's hydrolysis are calculated by cheme process propagate,
    which writes every model's duty (Q2 to Q8); scripts/balance.py gives the feeds for 500 t/a,
    the absorber's water and split, the mixed and bubble-point temperatures, the duties Q1, Q9,
    Q10 and Q11 (no property package of core covers these liquids or HCl in water) and the MTTs.
    The selectivity (0.85) is calibrated to the crude of US 4 341 720 A, Examples 19 and 20. The
    recipe's year-average rate of the product agrees with the flowsheet (no cheme.recipe-basis
    finding); it sizes R-101 (12.5 m3) from R102 and checks R102's jacket against the log-mean
    cooling-water temperature; R101's jacket, which sets the 8 h chlorine dosing, is checked by
    hand (105.6 of 133.1 kW; core sizes a vessel from one semi-batch only). Thermal screening
    (cheme process reactor-hazards): R101 dT_ad 293.0 K, accumulation 0.96 %, MTSR 335.11 K
    against an MTT of 360.72 K; R102 dT_ad 28.18 K, accumulation 2.93 %, MTSR 333.98 K against
    367.16 K (hazard.mtt: the bubble points of the vented mass); no criticality class without a
    TD24 (1 or 2 if the TD24 lies above the MTSR, 5 if below). At the MTSR a cooling failure
    releases 282.8 m3/h with the liquid's vapour, 0.81 of R-101's vent capacity of 350 m3/h
    (ASSUMED); with k/10 0.97, with k/100 1.35 (above it, a design finding for the relief study,
    DESIGN.md D-011); water ingress, chlorine and CO cases reasoned. Preliminary gate-to-gate LCI
    with the per-batch nitrogen, economic allocation at ASSUMED relative prices between the
    product, POCl3 and hydrochloric acid; the chlorine linked to chlor-alkali-1 and the nitrogen
    to asu-1, PCl3 and oxalic acid gaps with recorded proxies, the other backgrounds gaps. cheme
    maturity reaches no level (assumed feeds, kinetics and separations); the claim `maturity:
    concept` is the lowest value of the schema, not an evidenced level. Not reviewed. Needs
    cheme-as-code 1.11.0.
