    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "2.017 kWh/kg removed by cooling water: R-101's jacket (core's semi-batch models), the column's condenser (core's still model), the coolers, the absorber"}
    - {chemical: chilled-water, role: utility, inventory_key: "product:CHW", note: "0.447 kWh/kg removed by chilled water at 278 K: the vent condenser E-102 (core's vent condenser) and the strip's condenser E-103 (core's still model)"}
