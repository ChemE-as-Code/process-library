# Components and templates of oxalyl-chloride-1. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol (IUPAC 2021
# conventional atomic weights applied to the formula), normal_boiling_point in K at 101.325 kPa.
#
# Property sources (DESIGN.md source register SRC-5, SRC-6):
# - normal boiling points, densities, heat capacities and heats of vaporization from the CRC
#   Handbook tables as packaged in the `chemicals` 1.5.2 package (CRC_organic_data,
#   CRC_inorganic_data, CRC_standard_data, Hvap_data_CRC), not the printed handbook: single
#   facts with the package named (library ADR 0037);
# - Antoine constants from the NIST Chemistry WebBook, SRD 69, log10(P/bar) = A - B/(T/K + C),
#   each fitted by NIST (phosphorus trichloride and phosphoryl chloride to Stull 1947, water to
#   Stull 1947);
# - oxalyl chloride: no Antoine fit was found openly (NIST WebBook C79378 gives none). Its line
#   is a Clausius-Clapeyron line (C = 0) through the normal boiling point 336.65 K (CRC via
#   chemicals 1.5.2) with NIST's heat of vaporization of 32 +/- 4 kJ/mol (Walker and Prophet,
#   1967) taken as constant: B = 32000 / (8.314 ln 10) = 1671.6 K, A = log10(1.01325) + B /
#   336.65 = 4.9711, ASSUMED (it gives 18.6 kPa at 293 K); DESIGN.md D-007;
# - chlorine: Antoine constants fitted by us (least squares, 240 to 345 K, within 0.2 %) to the
#   DIPPR-form vapour-pressure equation of Perry's Chemical Engineers' Handbook, 8th ed., as
#   packaged in chemicals 1.5.2 (Psat_data_Perrys2_8, C1 71.334, C2 -3855.0, C3 -8.5171, C4
#   0.012378, C5 1): a single fact with that source (Perry's not read here), ASSUMED
#   (D-007). Chlorine is only a trace in the liquids (D-005).
# The liquid data the semi-batches R101 and R102 need (D-005):
# - liquid_molar_volume, m3/kmol, at 333.15 K: the molar mass over the CRC density near 298 K
#   (phosphorus trichloride 1574, phosphoryl chloride 1645, oxalyl chloride 1478.5 at 293 K,
#   2,4-lutidine 930.9 kg/m3), raised by 3.5 % for the 35 K above it (ASSUMED, a thermal
#   expansion of about 0.1 %/K usual for these liquids); the suspended solids (phosphorus
#   pentachloride 2100, anhydrous oxalic acid 1900 kg/m3, CRC) at their solid density, their
#   volume in the slurry; dissolved chlorine at its liquid molar volume near its boiling point,
#   0.0453 m3/kmol (1565 kg/m3, ASSUMED). Ideal mixing.
# - liquid_heat_capacity, kJ/(kmol K): phosphoryl chloride 138.8, 2,4-lutidine 184.8 (CRC);
#   oxalic acid (solid) 91.0 (CRC); phosphorus trichloride 120, phosphorus pentachloride (solid)
#   150, oxalyl chloride 150 and dissolved chlorine 67, ASSUMED (no open measured value found;
#   oxalyl chloride as two -COCl groups, each about acetyl chloride's 117 less its methyl group).
# - phosphorus pentachloride and oxalic acid are solids in the slurry (phase: solid): non-volatile
#   in the stills, and in the semi-batches carried as part of the reacting suspension, their rates
#   pseudo-homogeneous (DESIGN.md D-005, L-1).
# - HCl, CO and CO2 leave as they form (batch.vent, core ADR 0054) and are never charged or
#   dosed; their liquid data below are placeholders core asks for (L-3).
