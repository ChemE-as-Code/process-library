# The batch recipe of oxalyl-chloride-1 (schema cheme/recipe/v1, `cheme process recipe`,
# DESIGN.md D-003). One batch makes 1642.1 kg of the distilled product cut (stream S17); the
# flowsheet's rates are the year averages.
# - R-101 is one vessel over M101 (the fresh PCl3 charged to the heel kept from the last
#   batch), E101 (the charge warmed), the chlorination R101, the reaction R102 (the acid slurry
#   dosed, the gases vented through E-102), the strip ST101 (the crude distilled off the heel at
#   15 kPa(a)) and SP101 (the heel's purge): `units`, core ADR 0057. The vessel is sized, its
#   jacket checked and its vent reported from R102, which holds the most and vents: a unit over
#   two semi-batch steps is refused (core ADR 0057), so R101 is not in `units`, its dosing and
#   post-reaction take their times from its model (from: R101) and its jacket is checked by hand
#   (D-003, L-5). The warming takes its time from the jacket (temperatures), the strip from
#   ST101's boil-up.
# - C-201, the still with its column K-201, is one vessel over M201 (the crude received with
#   the last batch's off-cut), ST201 (the rectification with its product cut and off-cut, core
#   ADR 0061), E202 (the POCl3 cooled) and SP201 (the POCl3 drained to the next acid slurry and
#   to the co-product tank). The product cooler E201 on
#   K-201's condensate runs while the still distils and is no batch unit.
# - The acid slurry tank V-102 (M102), the vent condenser E-102 and the absorber A-101 run
#   while R-101 doses and are no batch units.
# Every other duration is ASSUMED (D-003). `cheme process recipe --svg build/gantt.svg` draws one
# batch.
schema: cheme/recipe/v1
kind: recipe
title: Oxalyl chloride by the one-pot PCl5 route with batch distillation
batch_size: {value: 1642.1, unit: kg, stream: S17, provenance: assumed, source: "one batch of the distilled product cut: 500 t/a over the batches the cycle allows, 63.131 kg/h x the cycle (D-002, D-003; the fixed point of batch size = rate x cycle, since the strip's time grows with the batch)"}
hours_per_year: {value: 7920, provenance: assumed, source: "330 days of 24 h (D-002)"}
unit_procedures:
  - id: REACT
    units: [M101, E101, R102, ST101, SP101]
    title: Charge PCl3 to the heel, chlorinate, dose the acid slurry, strip the crude at 15 kPa(a) (R-101)
    vessel:
      fill_fraction: 0.8
      aspect_ratio: 1.2
      jacket: {u: 300, coolant_temperature: 303.43, heating_temperature: 350.65, provenance: assumed, source: "enamelled (glass-lined) steel vessel, U 300 W/(m2 K) ASSUMED; cooling water enters the jacket at 298.15 K and leaves at 308.15 K (design basis, D-009), so the reaction mass at 333.15 K sees a log-mean driving force of (35 - 25) / ln(35/25) = 29.72 K: core takes the coolant temperature as constant, so the equivalent 333.15 - 29.72 = 303.43 K is entered, not the supply temperature; warming and the strip on R-101's hot-water loop at 353/348 K (mean 350.65 K), heated by LP steam, below R101's MTT 358.78 K and R102's 367.00 K (D-009, D-011)"}
      metal_heat_capacity: 6500
      provenance: assumed
      source: "usual fill and proportions of an enamelled stirred vessel (D-003); its metal, about 13 t of glass-lined steel with the jacket, agitator and nozzles for a 16 m3 vessel, at 0.5 kJ/(kg K) = 6500 kJ/K, ASSUMED (no vessel mass sourced, D-009): in the warming's time and heat (Q1, scripts/balance.py) and in the strip's duty Q5 (core ADR 0063)"
    operations:
      - {id: charge, kind: charge, title: Charge the fresh PCl3 and the catalyst's make-up to the heel (M101), duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: heat, kind: heat, title: Warm to 333 K (E101), temperatures: [329.38, 333.15]}
      - {id: dose_cl2, kind: dose, title: Dose the chlorine (R101), from: R101}
      - {id: react_cl2, kind: react, title: Post-chlorination to 0.999 of the PCl3 (R101), from: R101}
      - {id: sample, kind: hold, title: Sample the PCl5 slurry (PCl3 and chlorine left), duration: {value: 0.25, provenance: assumed, source: D-003}}
      - {id: dose_acid, kind: dose, title: Dose the oxalic acid slurry from V-102 (R102), from: R102}
      - {id: react_acid, kind: react, title: Post-reaction to 0.999 of the acid (R102), from: R102}
      - {id: strip, kind: distil, title: Strip the crude off the heel at 15 kPa(a) to the receiver (ST101), from: ST101}
      - {id: purge, kind: other, title: "Break the vacuum with nitrogen, drain 5 % of the heel to the waste drum (SP101)", duration: {value: 0.5, provenance: assumed, source: D-003}}
  - id: DISTIL
    units: [M201, ST201, E202, SP201]
    title: Rectify the crude at atmospheric pressure in the still with its column (C-201, K-201)
    vessel:
      fill_fraction: 0.75
      aspect_ratio: 1.2
      metal_heat_capacity: 4500
      provenance: assumed
      source: "an enamelled still pot with a jacket on LP steam and on cooling water, sized from the crude and off-cut it receives, filled to at most 75 % since the pot boils and needs freeboard above the boiling liquid (D-003, D-008); its metal, about 9 t of glass-lined steel with the jacket for a 10 m3 pot, at 0.5 kJ/(kg K) = 4500 kJ/K, ASSUMED (no vessel mass sourced, D-009): heated with the charge in the still's duty Q7 (core ADR 0063) and cooled with the POCl3 in Q10 (scripts/balance.py); core checks no jacket of a still's pot, so the boil-up and the cooling time are checked by hand (D-008)"
    operations:
      - {id: receive, kind: charge, title: "Receive the crude from R-101's receiver and the last batch's off-cut (M201)", duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: distil, kind: distil, title: "Distil the product cut, then the off-cut (ST201)", from: ST201}
      - {id: cool, kind: cool, title: Cool the POCl3 and the still to 313 K on cooling water (E202), duration: {value: 1.72, provenance: calculated, source: "scripts/balance.py: t = (C + C_m) / (U A) ln((T0 - Tw) / (T1 - Tw)), the POCl3 and C-201's metal from 378.1 to 313.15 K, the jacket's water at its mean 303.15 K, U 300 W/(m2 K) over the area the POCl3 wets (core's wetted_area at C-201's diameter) (D-008, D-009)"}}
      - {id: drain, kind: transfer, title: Drain the POCl3 to the acid slurry tank and the co-product tank (SP201), duration: {value: 0.5, provenance: assumed, source: D-003}}
