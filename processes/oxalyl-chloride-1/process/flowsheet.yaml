# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Oxalyl chloride by Bayer's one-pot route (US 4 341 720 A, Examples 19 and 20; DESIGN.md D-001),
# a batch plant on one reactor-still R-101 and one rectification still C-201:
# - R-101 holds the previous batch's residue (the heel: excess PCl5 suspended in POCl3 with the
#   amine catalyst); fresh PCl3 and the catalyst's make-up are charged to it (M101) and warmed to
#   333 K (E101), chlorine is dosed and chlorinates the PCl3 to PCl5 (R101, a semi-batch);
# - anhydrous oxalic acid, suspended in recycled POCl3 (V-102, M102; no oxalyl chloride meets the
#   acid there, D-008), is dosed into the slurry
#   (R102, a semi-batch): oxalyl chloride, POCl3 and HCl form, part of the acid is lost to CO and
#   CO2; the gases leave by the vent through the vent condenser E-102 (on chilled water, its
#   condensate back to R-101) to the HCl absorber;
# - R-101 is put under 15 kPa(a) and the crude (oxalyl chloride with POCl3) is distilled off the
#   heel (ST101, a batch still); 5 % of the heel is purged (SP101), the rest stays for the next
#   batch (the tear S3);
# - the crude, with the last batch's off-cut (M201), is rectified at atmospheric pressure in
#   C-201 with its column K-201 (ST201): the oxalyl chloride overhead, then an off-cut kept for
#   the next still charge (S25), the POCl3 in the still; part of the POCl3 suspends the next
#   acid charge (SP201), the rest is a co-product (the tears S3 and S26);
# - the off-gas is absorbed in water (A101, D101) to about 30 wt% hydrochloric acid; CO, CO2 and
#   the chlorine traces go to the site's thermal oxidiser.
# The flows are the year averages of the batch recipe (process/recipe.yaml, `cheme process
# recipe`, D-003).
# Where the values come from:
# - feeds, temperatures, ratios: design basis and D-002..D-004, ASSUMED or from US 4 341 720 A;
# - R101, R102: cheme's semi-batch model (core ADRs 0050, 0054, 0062, 0063) from the ASSUMED rate
#   laws (D-005); R102's vent carries the liquid's vapour through the vent condenser E-102;
# - ST101, ST201: cheme's batch still on Raoult's law (ADR 0055), ST201 with its column (ADR
#   0061) (D-007, D-008);
# - M101, M102, M201 (mixers), SP101, SP201 (splitters), E101, E201, E202 (pass-through) and
#   A101 (a conversion step): `cheme process propagate --fill`, the recycles converged at the
#   tears S3 and S26 (ADR 0060);
# - the duties of R101 (Q2), R102 (Q3), its vent condenser (Q4), the stills' reboilers (Q5, Q7)
#   and condensers (Q6, Q8) are written by `cheme process propagate --fill` from the models
#   (ADRs 0059, 0061, 0062); E101's warming Q1, the coolers' Q9 and Q10 and the absorber's Q11
#   come from scripts/balance.py (no property package of core covers these liquids or HCl in
#   water; D-009, D-010);
# - the feeds for 500 t/a, the absorber's water and its split D101, and the temperatures core
#   does not derive: scripts/balance.py (D-004, D-009, D-010).
schema: cheme/process/v1
kind: flowsheet
title: Oxalyl chloride from oxalic acid and phosphorus pentachloride made in situ, batch reaction with gas evolution and batch distillation (500 t/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 500 t/a distilled oxalyl chloride, year averages of the batch recipe in 7920 h (D-002, D-003)", default: true}
tolerance: {abs: 0.05, rel: 0.002}   # balances: |in - out| <= abs + rel * max(in, out), kg/h
# Three recycles (core ADR 0060), torn at two streams: the heel S3 (R-101's residue kept for
# the next batch; its gain 0.95, the purge) and C-201's charge S26, which cuts both loops through
# C-201: the POCl3 S9 that suspends the next acid charge, and the off-cut S25 that goes into the
# next still charge (D-008). Their tolerance is far tighter than the balances'.
tears:
  - stream: S3
    initial: {flow: 340.0, unit: kg/h, basis: mass_fraction, composition: {PCL5: 0.43, POCL3: 0.54, LUT: 0.03}}
  - stream: S26
    initial: {flow: 440.0, unit: kg/h, basis: mass_fraction, composition: {OXCL: 0.22, POCL3: 0.78}}
convergence: {method: wegstein, max_iterations: 500, tolerance: {abs: 1.0e-6, rel: 1.0e-8}}

feeds:
  - {id: PCL3F, title: Phosphorus trichloride (no library process), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: LUTF, title: "2,4-Dimethylpyridine (catalyst make-up; no library process)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: CL2F, title: Chlorine (chlor-alkali-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: OXAF, title: "Oxalic acid, anhydrous (no library process)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PW, title: Process water (HCl absorber), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: st201, direction: out, kind: energy}
      - {id: a101, direction: out, kind: energy}
  - id: LPS
    title: LP steam 350 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 350, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 412.0, provenance: given, source: "saturation at 350 kPa(a), IAPWS-IF97 (411.5 K)"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: e101, direction: out, kind: energy}
      - {id: st101, direction: out, kind: energy}
      - {id: st201, direction: out, kind: energy}
products:
  - {id: OXCLP, title: Oxalyl chloride to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: POCL3P, title: Phosphoryl chloride (co-product), category: by_product, ports: [{id: in, direction: in}]}
  - {id: HCLAQ, title: Hydrochloric acid about 30 wt% (by-product), category: by_product, ports: [{id: in, direction: in}]}
  - {id: PURGE, title: "Heel purge (PCl5, POCl3, catalyst) to hazardous-waste incineration", category: by_product, ports: [{id: in, direction: in}]}
  - {id: TAIL, title: "Absorber tail gas (CO, CO2, chlorine traces) to the site's thermal oxidiser", category: by_product, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: r102, direction: in, kind: energy}
      - {id: k201, direction: in, kind: energy}
      - {id: e201, direction: in, kind: energy}
      - {id: e202, direction: in, kind: energy}
      - {id: a101, direction: in, kind: energy}
  - id: CHW
    title: Chilled water return (283 K)
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 278.15, provenance: assumed, source: "design basis (D-009): above the 274.33 K melting point of POCl3 (CRC via chemicals 1.5.2), which condenses on E-102 and on R-101's distillate condenser E-103; oxalyl chloride melts at 257.15 K"}
      return_temperature: {value: 283.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: e102, direction: in, kind: energy}
      - {id: e103, direction: in, kind: energy}

blocks:
  - id: REACT
    title: Chlorination, reaction and stripping in the reactor-still (R-101)
    class: ReactingChemicals
    ports:
      - {id: pcl3, direction: in}
      - {id: lut, direction: in}
      - {id: cl2, direction: in}
      - {id: oxa, direction: in}
      - {id: carrier, direction: in}
      - {id: crude, direction: out}
      - {id: vent, direction: out}
      - {id: purge, direction: out}
      - {id: steam_heat, direction: in, kind: energy}
      - {id: steam_strip, direction: in, kind: energy}
      - {id: q1, direction: out, kind: energy}
      - {id: q2, direction: out, kind: energy}
      - {id: q_vent, direction: out, kind: energy}
      - {id: q_cond, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: PURIFY
    title: Batch rectification at atmospheric pressure (C-201, K-201)
    class: Distilling
    ports:
      - {id: in, direction: in}
      - {id: product, direction: out}
      - {id: carrier, direction: out}
      - {id: pocl3, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: q, direction: out, kind: energy}
      - {id: qprod, direction: out, kind: energy}
      - {id: qres, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: ABSORB
    title: HCl absorption to hydrochloric acid
    class: Absorbing
    ports:
      - {id: gas, direction: in}
      - {id: water, direction: in}
      - {id: acid, direction: out}
      - {id: tail, direction: out}
      - {id: q, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}

steps:
  - id: M101
    block: REACT
    title: Charge of R-101 (the heel kept, fresh PCl3 and the catalyst's make-up)
    class: Mixing
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: pcl3, direction: in, delegates: pcl3}
      - {id: lut, direction: in, delegates: lut}
      - {id: heel, direction: in}
      - {id: out, direction: out}
  - id: E101
    block: REACT
    title: Charge warmed to 333 K (R-101 jacket, hot-water loop)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: steam_heat}
  - id: R101
    block: REACT
    title: Chlorination (chlorine dosed into PCl3 and the heel at 333 K)
    class: ReactingChemicals
    reactions: [CHL]
    reactor: semibatch
    energy_port: q
    batch:
      dosing:
        - stream: S6
          time: 28800
          absorbed: 1.0
          heat_of_solution: {values: {CL2: -20410}, provenance: assumed, source: "the chlorine's heat of solution in the PCl3/POCl3 liquid taken as minus its heat of vaporization at its normal boiling point (20.41 kJ/mol, CRC via chemicals 1.5.2), an ideal solution: no open solubility or heat of solution of chlorine in POCl3 was found; CHL's heat is on the dissolved basis (reactions.yaml, D-005)"}
      target: {key: PCL3, conversion: 0.999}
      heat: isothermal
      provenance: assumed
      source: "chlorine dosed at a constant rate over 8 h into the charge at 333 K and taken up entirely (US 4 341 720 A: 930 g of chlorine in 6 h at 85 C in Example 19, 570 g in 3 h in Example 20; the plant's temperature ASSUMED, the 8 h set by R-101's jacket on cooling water, D-003, D-005), then held to 0.999 conversion of the PCl3; 1.005 mol of chlorine per mol of PCl3 charged, so a little dissolved chlorine is left (D-004)"
    hazard:
      mtt: 358.78
      provenance: assumed
      source: "the bubble point of R101's charge S5 at 101.325 kPa(a) (Raoult's law over the liquid, the suspended PCl5 and the catalyst, which has no vapour pressure, left out of its mole fractions; scripts/balance.py), the lowest over the step without dissolved chlorine, since the PCl3 turns into solid PCl5; R-101 is vented, so it boils there. Valid only while little chlorine accumulates: at the design's 0.95 % accumulation the liquid at the end of the dosing, with the accumulated chlorine, boils at 362.92 K (above this MTT), at k/10's 2.54 % at 344.35 K, at k/100's 7.65 % at 313.49 K, below the process temperature (D-011). No vent_capacity: R101 forms no gas in its model (the chlorine is taken up, absorbed 1.0); the chlorine that accumulates and degasses is D-011's second design finding and case (c)"
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: charge, direction: in}
      - {id: dose, direction: in, delegates: cl2}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: q1}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M102
    block: REACT
    title: Acid slurry tank (oxalic acid suspended in recycled POCl3)
    class: Mixing
    links: [{target: equipment, ref: V-102}]
    ports:
      - {id: oxa, direction: in, delegates: oxa}
      - {id: carrier, direction: in, delegates: carrier}
      - {id: out, direction: out}
  - id: R102
    block: REACT
    title: Reaction (acid slurry dosed into the PCl5 slurry at 333 K, gases vented)
    class: ReactingChemicals
    reactions: [OXC, DEC]
    reactor: semibatch
    energy_port: q
    batch:
      dosing: [{stream: S10, time: 14400}]
      target: {key: OXA, conversion: 0.999}
      heat: isothermal
      vent:
        stream: S12
        components: [HCL, CO, CO2]
        vapour: {components: [OXCL, POCL3, CL2], source: "the gas leaves saturated with the liquid's volatile components at 333 K and 101.3 kPa(a): Raoult's law, an ideal liquid ASSUMED, the Antoine lines of materials.yaml; the suspended PCl5 and the catalyst stay; the PCl3 left after R101 (under 0.03 mol% of the liquid) is left out, its vapour about 0.02 kg/h (D-010)"}
        condenser:
          temperature: 283.15
          returns: vessel
          energy_port: q_vent
          provenance: assumed
          source: "E-102, the vent condenser on chilled water in R-101's off-gas line, its gas outlet 5 K above the chilled water's 278.15 K supply (the design basis' minimum approach, D-009), the condensate back to R-101 (D-010)"
      provenance: assumed
      source: "the acid slurry dosed at a constant rate over 4 h into the PCl5 slurry at 333 K (US 4 341 720 A, Examples 19 and 20: 4 h at 60 C), then held to 0.999 conversion of the acid (the examples' 0.5 h at 70 C); HCl, CO and CO2 leave as gas as they form, none taken as dissolved (no solubility data for a Henry split, D-005); at 101.3 kPa(a), not the examples' 250 mbar, at which the mass boils and the oxalyl chloride distils off as it forms (D-001, L-1)"
    hazard:
      mtt: 367.0
      vent_capacity: 450.0
      provenance: assumed
      source: "MTT: the bubble point of R102's final liquid S11 at 101.325 kPa(a) (Raoult's law over the liquid, the suspended PCl5 and the catalyst, which has no vapour pressure, left out of its mole fractions; scripts/balance.py), the lowest over the step, since the oxalyl chloride it forms is its most volatile component; R-101 is vented, so it boils there. Vent capacity: R-101's one vent line through E-102 to the absorber A-101, sized for 450 m3/h of gas at 101.3 kPa(a): the release at a cooling failure at the MTSR with the liquid's vapour, 356 m3/h (cheme process reactor-hazards), plus about 20 %, rounded up; the normal peak is 231 m3/h past E-102 (cheme process recipe) (D-011)"
    links: [{target: equipment, ref: R-101}, {target: equipment, ref: E-102}]
    ports:
      - {id: charge, direction: in}
      - {id: dose, direction: in}
      - {id: out, direction: out}
      - {id: gas, direction: out, delegates: vent}
      - {id: q, direction: out, kind: energy, delegates: q2}
      - {id: q_vent, direction: out, kind: energy, delegates: q_vent}
  - id: ST101
    block: REACT
    title: Crude distilled off the heel at 15 kPa(a) (R-101 with its condenser E-103)
    class: Distilling
    energy_port: steam
    still:
      pressure: 15.0
      volatility: {model: raoult, provenance: assumed, source: "ideal liquid, the Antoine lines of materials.yaml; oxalyl chloride, POCl3 and PCl3 are not shown to form an ideal liquid: ASSUMED (D-007)"}
      # the catalyst (as its hydrochloride) stays; HCl, CO and CO2 are listed because R102 writes
      # them into its liquid outlet at 0 and a still asks a vapour pressure of every component
      # its inlet lists (L-3); PCl5 is a solid and stays
      nonvolatile: [LUT, HCL, CO, CO2]
      boilup: {value: 45, unit: kW, provenance: assumed, source: "the heat input of R-101's hot-water loop at 353/348 K (mean 350.65 K, below both MTTs, D-009), held at what the jacket gives at the strip's end, where the heel wets the least area and the still is hottest: U 300 W/(m2 K) x the wetted area under the heel (core's wetted_area at R-101's diameter) x (350.65 - 338.2) K (scripts/balance.py prints it; D-007, D-009)"}
      heat_up: true
      condenser_port: condenser
      end: {residue: {key: OXCL, mole_fraction: 0.005}}
      outlets: {distillate: top, residue: bottom}
      provenance: assumed
      source: "distil at 15 kPa(a) until oxalyl chloride is 0.5 mol% of the residue (D-007): US 4 341 720 A, Examples 19 and 20, distil the crude off at 250 mbar while the acid reacts; at 25 kPa(a) the still would end near 353 K, above R-101's hot-water loop (350.65 K mean), so the strip is set lower; core counts the suspended PCl5 in the still's liquid (L-1)"
    links: [{target: equipment, ref: R-101}, {target: equipment, ref: E-103}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out, delegates: crude}
      - {id: bottom, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam_strip}
      - {id: condenser, direction: out, kind: energy, delegates: q_cond}
  - id: SP101
    block: REACT
    title: The heel kept in R-101 and its purge
    class: SplittingMaterial
    split: {recycle: 0.95}
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: recycle, direction: out}
      - {id: purge, direction: out, delegates: purge}
  - id: M201
    block: PURIFY
    title: C-201's charge (the crude and the last batch's off-cut)
    class: Mixing
    links: [{target: equipment, ref: C-201}]
    ports:
      - {id: crude, direction: in, delegates: in}
      - {id: offcut, direction: in}
      - {id: out, direction: out}
  - id: ST201
    block: PURIFY
    title: Batch still C-201 at 101 kPa(a) with its column K-201
    class: Distilling
    energy_port: steam
    still:
      pressure: 101.325
      volatility: {model: raoult, provenance: assumed, source: "ideal liquid, the Antoine lines of materials.yaml (D-008)"}
      nonvolatile: [LUT, HCL, CO, CO2]
      boilup: {value: 95, unit: kW, provenance: assumed, source: "the reboiler's heat input, LP steam (412 K) on C-201's jacket, held at what the jacket gives at the still's end, where its wetted area is smallest and the still hottest: U 300 W/(m2 K) x the wetted area under the POCl3 left (core's wetted_area at C-201's diameter) x (412 - 378.1) K = 118.5 kW, so 95 kW holds over the whole cut (scripts/balance.py prints it, D-008, D-009)"}
      heat_up: true
      condenser_port: condenser
      column:
        stages: 15
        reflux: constant
        ratio: 6
        provenance: assumed
        source: "15 theoretical stages at a constant reflux ratio of 6, ASSUMED (D-008): US 4 341 720 A rectifies the crude without stating a column; oxalyl chloride (bp 336.7 K) and POCl3 (378.7 K) are about 3 to 4 apart in volatility on the Antoine lines; a reflux held for 99.8 mol% overhead up to a ratio of 6 stayed at 6 throughout (D-008)"
      cuts:
        - {outlet: top, end: {purity: {key: OXCL, fraction: 0.995}, basis: mass}}
        - {outlet: offcut, end: {residue: {key: OXCL, mole_fraction: 0.002}}}
      outlets: {residue: bottom}
      provenance: assumed
      source: "the crude rectified at atmospheric pressure: a product cut collected while its mean is at least 99.5 wt% oxalyl chloride (the specification, D-002), then an off-cut until 0.2 mol% oxalyl chloride is left in the POCl3; the off-cut is kept in its receiver T-203 and charged with the next batch's crude (M201, D-008)"
    links: [{target: equipment, ref: C-201}, {target: equipment, ref: K-201}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out}
      - {id: offcut, direction: out}
      - {id: bottom, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: condenser, direction: out, kind: energy, delegates: q}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E201
    block: PURIFY
    title: Product cooler (on K-201's condensate)
    class: Cooling
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: product}
      - {id: q, direction: out, kind: energy, delegates: qprod}
  - id: E202
    block: PURIFY
    title: POCl3 cooled in the still (C-201 jacket)
    class: Cooling
    links: [{target: equipment, ref: C-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: qres}
  - id: SP201
    block: PURIFY
    title: POCl3 to the next acid slurry and to the co-product tank
    class: SplittingMaterial
    split: {carrier: 0.36}
    links: [{target: equipment, ref: T-202}]
    ports:
      - {id: in, direction: in}
      - {id: carrier, direction: out, delegates: carrier}
      - {id: product, direction: out, delegates: pocl3}
  - id: A101
    block: ABSORB
    title: HCl absorber (falling film with tail scrubber; the vapours hydrolysed)
    class: ReactingChemicals
    reactions: [OXH, POH]
    reactor: conversion
    links: [{target: equipment, ref: A-101}]
    ports:
      - {id: gas, direction: in, delegates: gas}
      - {id: water, direction: in, delegates: water}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: D101
    block: ABSORB
    title: Acid and tail gas leaving the absorber (specified split)
    class: SeparatingByGravity
    links: [{target: equipment, ref: A-101}]
    ports:
      - {id: in, direction: in}
      - {id: acid, direction: out, delegates: acid}
      - {id: tail, direction: out, delegates: tail}
      - {id: q, direction: out, kind: energy, delegates: q}

streams:
  - id: S1
    title: Phosphorus trichloride
    from: PCL3F.out
    to: M101.pcl3
    template: chlorination
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "from storage (design basis)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 167.4022, provenance: assumed, source: "scripts/balance.py: 1.915 mol per mol of the oxalic acid S8 (D-004)"}
        composition: {basis: mass_fraction, values: {PCL3: 1.0}, provenance: assumed, source: "phosphorus trichloride 100 % (D-004)"}
  - id: S2
    title: 2,4-Dimethylpyridine (make-up)
    from: LUTF.out
    to: M101.lut
    template: chlorination
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "from drums (design basis)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 0.5251, provenance: assumed, source: "scripts/balance.py: the heel purge's catalyst made up, 3.137 g per kg of PCl3 (D-004)"}
        composition: {basis: mass_fraction, values: {LUT: 1.0}, provenance: assumed, source: "2,4-dimethylpyridine 100 % (D-004)"}
  - id: S3
    title: The heel kept for the next batch (recycle)
    from: SP101.recycle
    to: M101.heel
    template: chlorination
