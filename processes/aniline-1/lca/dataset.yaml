  - MPSX
  properties:
    ANILINE:
      exergy: 36931.3
      source: 'scripts/allocation_exergy.py: standard chemical exergy of liquid aniline, 3439.3 kJ/mol,
        from the ideal-gas formation data of process/materials.yaml (CRC) and Szargut''s standard element
        exergies (Szargut, Morris and Steward 1988), less the Gibbs energy of condensation at 298.15 K;
        physical exergy at 313 K / 300 kPa neglected'
    MPSX:
      exergy: 1278.9
      source: 'scripts/allocation_exergy.py: exergy added per kWh of heat raised in E-103, saturated steam
        at 1500 kPa(a) from boiler feed water at 378.15 K (ASSUMED), dead state 298.15 K, 101.325 kPa,
        IAPWS-95 (thermo)'
  shares:
    ANILINE: 1.0
    MPSX: 0.0
  compare:
  - none
  - shares
  source: 'D-013: the exported MP steam (Q7, net of the reboilers) is a co-product of aniline. The library
    allocates exported steam by energy or exergy, never by credit (docs/system-model.md section 2); exergy
    is chosen because it weighs the steam by its work potential: about 1.8 % of the burdens go to the
    steam. Shares 1/0 (everything on aniline) and the unallocated result are kept in the comparison.'
  deviation: Aniline and the steam are not products of one separation, so neither curated physical rule
    of the hierarchy fits exactly, and the WBCSD price ratio does not apply (the steam is counted in kWh,
    and no sourced prices exist at concept). Exergy is chosen because the library allocates exported steam
    by energy or exergy; energy (LHV) would charge the steam's enthalpy at the value of fuel, exergy charges
    its work potential (DESIGN.md D-013).
