    US 2008/0234518 A1) emits CO2 and possibly NOx; amount and frequency are not known at concept stage.
    Open gap for basic engineering, not negligible by evidence.
- key: emission-excluded:start-up-and-flaring
  title: flare emissions of the plant
  direction: output
  reason: Start-up, shutdown and relief to a flare are not part of the steady design case; no flare is
    designed at concept stage. Open gap.
