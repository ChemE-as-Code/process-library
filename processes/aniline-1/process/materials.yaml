# Components and templates of the process. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
# ideal_gas and critical data: `cheme chemistry thermo NAME` (chemicals 1.5.2 / thermo 0.6.1,
# offline), copied unchanged with the method named in each source. Normal boiling points:
# thermo 0.6.1 Chemical(...).Tb. Nitrobenzene and diphenylamine have Joback heat capacities
# fitted from 327 K and 330 K only: streams below that hold them as liquids (D-006).
