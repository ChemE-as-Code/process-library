# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Aniline by adiabatic gas-phase hydrogenation of nitrobenzene (DESIGN.md D-001). Where the
# values come from:
# - feeds S1 and S2 and every temperature and pressure are design choices (design basis,
#   D-002..D-009), ASSUMED; S1 and S2 flows follow from the 25 t/h product (scripts/aniline_balance.py);
# - the reactor outlet S7 is calculated by cheme (selectivity reactor, D-004);
# - flows and compositions through the pump, circulator, exchangers, mixers and the purge
#   splitter are calculated by `cheme process propagate --fill`;
# - the separator, decanter and column outlets and all duties come from the independent balance
#   scripts/aniline_balance.py (D-006), given here as ASSUMED: core cannot yet qualify the
#   vapour-liquid-liquid equilibrium of aniline, water and hydrogen or their liquid enthalpies
#   (core #315, polar/activity-coefficient benchmark).
schema: cheme/process/v1
kind: flowsheet
title: Aniline by gas-phase hydrogenation of nitrobenzene (25 t/h)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 25 t/h aniline (99.95 wt%), adiabatic Pd/alumina reactor, H2/NB 60 mol/mol at the inlet (D-002, D-005)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: NBF, title: Nitrobenzene from the nitration plant, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: H2F, title: Hydrogen from the hydrogen plant (hydrogen-1), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: k101, direction: out, kind: energy}
      - {id: p101, direction: out, kind: energy}
      - {id: pumps, direction: out, kind: energy}
products:
  - {id: ANILINE, title: Aniline to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: FUELGAS, title: Loop purge to the fuel gas header, category: off_gas, ports: [{id: in, direction: in}]}
  - id: RESIDUE
    title: Low boilers and distillation residue to incineration
    category: by_product
    ports: [{id: lights, direction: in}, {id: heavies, direction: in}]
  - {id: WW, title: Stripped process water to wastewater treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - id: MPSX
    title: MP steam export (1500 kPa(a)), net of the reboilers
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1500, provenance: assumed, source: "design basis, D-009"}
      supply_temperature: {value: 471.4, provenance: assumed, source: "saturation at 1500 kPa(a), D-009"}
      min_approach: {value: 10, provenance: assumed, source: D-009}
    ports: [{id: e103, direction: in, kind: energy}]
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-009"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-009"}
      min_approach: {value: 5, provenance: assumed, source: D-009}
    ports:
      - {id: e104, direction: in, kind: energy}
      - {id: c201, direction: in, kind: energy}
      - {id: c202, direction: in, kind: energy}
      - {id: c102, direction: in, kind: energy}

blocks:
  - id: RXN
    title: Nitrobenzene hydrogenation loop
    class: ReactingChemicals
    ports:
      - {id: nb, direction: in}
      - {id: h2, direction: in}
      - {id: purge, direction: out}
      - {id: crude, direction: out}
      - {id: power_k, direction: in, kind: energy}
      - {id: power_p, direction: in, kind: energy}
      - {id: steam201, direction: out, kind: energy}
      - {id: steam202, direction: out, kind: energy}
      - {id: steam102, direction: out, kind: energy}
      - {id: steamx, direction: out, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: PUR
    title: Aniline recovery and purification
    class: Distilling
    ports:
      - {id: crude, direction: in}
      - {id: product, direction: out}
      - {id: lights, direction: out}
      - {id: heavies, direction: out}
      - {id: water, direction: out}
      - {id: steam201, direction: in, kind: energy}
      - {id: steam202, direction: in, kind: energy}
      - {id: steam102, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: cw201, direction: out, kind: energy}
      - {id: cw202, direction: out, kind: energy}
      - {id: cw102, direction: out, kind: energy}

steps:
  - id: P101
    block: RXN
    title: Nitrobenzene feed pump
    # TransportingFluids, not Pumping: cheme 0.8.0 process build fails on Pumping (its method
    # annotation is a Union in pyDEXPI 2.1.0, step_method cannot list it); core issue to raise.
    class: TransportingFluids
    links: [{target: equipment, ref: P-101}]
    ports:
      - {id: in, direction: in, delegates: nb}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power_p}
  - id: M101
    block: RXN
    title: Make-up hydrogen / recycle gas junction
    class: Mixing
    ports:
      - {id: h2, direction: in, delegates: h2}
      - {id: rec, direction: in}
      - {id: out, direction: out}
  - id: K101
    block: RXN
    title: Recycle gas circulator
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power_k}
  - id: E102
    block: RXN
    title: Feed/effluent exchanger
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: cold_in, direction: in}
      - {id: cold_out, direction: out}
      - {id: hot_in, direction: in}
      - {id: hot_out, direction: out}
  # D-005: liquid nitrobenzene is sprayed into the preheated recycle gas and evaporates in it;
  # the gas is preheated in E-102 just enough to reach the reactor inlet temperature.
  - id: M102
    block: RXN
    title: Nitrobenzene evaporator (into the recycle gas)
    class: Mixing
    links: [{target: equipment, ref: V-102}]
    ports:
      - {id: gas, direction: in}
      - {id: nb, direction: in}
      - {id: out, direction: out}
  # D-003, D-004: adiabatic fixed bed, complete conversion, selectivities of D-004.
  - id: R101
    block: RXN
    title: Adiabatic hydrogenation reactor (Pd/alumina fixed bed)
    class: ReactingChemicals
    reactions: [NB_HYD, BZ_FORM, DPA_FORM]
    reactor: conversion
    selectivity:
      key: NB
      conversion: 1.0
      products: {ANL: 0.997, C6H6: 0.002, DPA: 0.0005}
      provenance: assumed
      source: >-
        D-004: aniline 0.997 is the average selectivity of US 2008/0234518 A1 example 3;
        complete conversion is the nitrobenzene-free crude of its examples before breakthrough;
        the split of the remaining 0.3 % between benzene (0.002) and diphenylamine (0.0005
        kmol/kmol, 0.001 of the NB) is ASSUMED
    catalyst: PD_AL2O3
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: E103
    block: RXN
    title: Reactor effluent steam generator (MP steam)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-103}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: s201, direction: out, kind: energy, delegates: steam201}
      - {id: s202, direction: out, kind: energy, delegates: steam202}
      - {id: s102, direction: out, kind: energy, delegates: steam102}
      - {id: exp, direction: out, kind: energy, delegates: steamx}
  - id: E104
    block: RXN
    title: Effluent condenser
    class: Cooling
    links: [{target: equipment, ref: E-104}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: V101
    block: RXN
    title: Three-phase separator (gas / crude condensate)
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: in, direction: in}
      - {id: vap, direction: out}
      - {id: liq, direction: out, delegates: crude}
  # D-005: the purge fraction that holds N2 at 5 mol% in the loop gas (scripts/aniline_balance.py).
  - id: SPL101
    block: RXN
    title: Purge take-off
    class: SplittingMaterial
    split: {purge: 0.00096614}
    ports:
      - {id: in, direction: in}
      - {id: purge, direction: out, delegates: purge}
      - {id: recycle, direction: out}
  - id: D101
    block: PUR
    title: Crude aniline decanter
    class: SeparatingByPhaseSeparation
    links: [{target: equipment, ref: D-101}]
    ports:
      - {id: crude, direction: in, delegates: crude}
      - {id: dehyd, direction: in}
      - {id: strip, direction: in}
      - {id: org, direction: out}
      - {id: aq, direction: out}
  - id: C201
    block: PUR
    title: Dehydration column (heteroazeotrope overhead, low-boiler draw)
    class: Distilling
    links: [{target: equipment, ref: C-201}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out}
      - {id: lights, direction: out, delegates: lights}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: steam201}
      - {id: cond, direction: out, kind: energy, delegates: cw201}
  - id: C202
    block: PUR
    title: Aniline column (vacuum)
    class: Distilling
    links: [{target: equipment, ref: C-202}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out, delegates: product}
      - {id: bot, direction: out, delegates: heavies}
      - {id: reb, direction: in, kind: energy, delegates: steam202}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: cond, direction: out, kind: energy, delegates: cw202}
  - id: C102
    block: PUR
    title: Process water stripper
    class: Distilling
    links: [{target: equipment, ref: C-102}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out}
      - {id: bot, direction: out, delegates: water}
      - {id: reb, direction: in, kind: energy, delegates: steam102}
      - {id: cond, direction: out, kind: energy, delegates: cw102}

