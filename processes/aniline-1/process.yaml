# Process Atlas manifest of aniline-1. Schema: schemas/process.schema.json (cheme-as-code/process/v1).
# plant.yaml stays the engineering manifest; sheets and results are derived from the
# ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: aniline-1
title: Aniline by adiabatic gas-phase hydrogenation of nitrobenzene (25 t/h)
summary: >-
  Nitrobenzene is evaporated into a large hydrogen recycle and hydrogenated to aniline over a
  palladium/alumina fixed bed; the reaction heat raises MP steam, the condensate is decanted,
  the process water stripped and the crude aniline dried and distilled. Concept stage,
  assumed basis, preliminary gate-to-gate inventory.
description: |
  Liquid nitrobenzene is sprayed into the preheated hydrogen recycle gas (60 mol H2 per mol
  nitrobenzene at the reactor inlet) and converted completely in one adiabatic Pd-V-Pb/alpha-
  alumina bed (513 to 729 K, 5 bar) at a selectivity of 99.7 % to aniline; benzene and
  diphenylamine stand for the low- and high-boiling by-products, with ammonia. The effluent
  raises MP steam, preheats the recycle gas and is condensed; the gas is recycled with a small
  purge, the condensate splits into a wet crude aniline and an aniline-saturated water. A
  dehydration column, a vacuum aniline column and a process water stripper give aniline at
  99.95 wt% and a process water with 50 ppm aniline.

  All values are concept estimates. The reactor conditions and selectivity follow open Bayer
  (now Covestro) patents; the separator, decanter and columns come from an independent script
  whose activity approximation is not qualified by ChemE-as-Code (core #315); see DESIGN.md of
  the engineering files for every assumption and gated step.
families: [nitrogen-organics]
keywords: [aniline, nitrobenzene, hydrogenation, gas phase, adiabatic reactor, palladium catalyst, hydrogen recycle, heteroazeotrope, decanter, distillation, MDI precursor]
facets:
  feedstock_basis: [fossil]
  product_classes: [chemicals]
  unit_operations: [reaction, compression, heat-exchange, phase-separation, distillation, stripping]
  region: generic
# Honest claim: concept is the lowest level of the manifest; cheme maturity reports the level
# the evidence supports (see validation.notes and DESIGN.md D-006, D-012).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD with closed mass, component and element balances (cheme validate, cheme process
    streams). The reactor outlet is calculated by cheme from a sourced selectivity (US
    2008/0234518 A1, example 3) and its adiabatic duty checks to within 1 kW; the capacity,
    feed state, by-product split, separator, decanter and column values are ASSUMED or come
    from scripts/aniline_balance.py, whose vapour-liquid-liquid model of aniline and water is
    not qualified (core #315). Energy closure of the separations is not evaluable in core. Not
    reviewed. The chemicals registry has no aniline, nitrobenzene, benzene, diphenylamine or
    ammonia entry yet, so the main product and the feedstock are not listed under chemistry
    (open library item).
chemistry:
  inputs:
    - {chemical: hydrogen, role: feedstock, inventory_key: "feed:H2F", note: "Make-up hydrogen from hydrogen-1 (99.9 mol%, 2850 kPa(a)). The other feedstock, nitrobenzene (feed:NBF), has no registry entry yet"}
  outputs:
    - {chemical: wastewater, role: waste, inventory_key: "product:WW", note: "Stripped process water, 50 ppm(wt) aniline and about 0.1 wt% ammonia (ASSUMED). The main product, aniline (product:ANILINE), has no registry entry yet"}
    # No inventory_key: the export (product:MPSX, 1500 kPa(a) saturated) is not offered as an
    # Atlas steam producer; with the slug it ranked first among steam producers and was refused
    # for other processes' HP steam, displacing their link (DESIGN.md D-013).
    - {chemical: steam, role: co-product, note: "MP steam 1500 kPa(a) raised from the reaction heat, net of the reboilers (product:MPSX)"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "Circulator K-101, pumps and vacuum pump (ASSUMED electric drives)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "25/35 C (ASSUMED)"}
basis:
  capacity: "25 t/h aniline, 210 kt/a (ASSUMED)"
  operating_hours_per_year: 8400
  location: generic (not chosen)
references:
  - {title: "Kahl, T. et al. Aniline. Ullmann's Encyclopedia of Industrial Chemistry (Wiley-VCH); route reference lead, not audited in this run", doi: 10.1002/14356007.a02_303.pub2}
