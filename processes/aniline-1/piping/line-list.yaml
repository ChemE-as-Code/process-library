# Line list. Schema: `cheme schema lines`.
# Concept stage: one line per material stream of the PFD (stream id in the notes), no P&ID yet.
# DN: first-pass size from velocity (D-010, ASSUMED): gas 20 m/s below 1000 kPa(a), 15 m/s
# above, two-phase 15 m/s on the gas, liquid 1.5 m/s; ideal-gas density, liquid density
# ASSUMED 1000-1200 kg/m3; inside diameter taken as the DN, minimum DN25. The loop lines are
# large because of the H2/NB ratio of 60 at 4-5 bar (D-005). Pressure classes come with the
# pipe specs.
