# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# p-Toluenesulfonyl chloride by the salt-modified chlorosulfonation of toluene (DESIGN.md D-001,
# after DE 1 912 956 A1, Example 1), a batch plant: chlorosulfonic acid is charged to the
# enamelled R-101 and heated to 338 K, ammonium chloride and then toluene are dosed (a
# semi-batch, reactor: semibatch) while the HCl leaves by the vent as it forms (batch.vent, core
# ADR 0054); the mass is cooled to 308 K and a second acid portion turns the sulfonic acids into
# the sulfonyl chlorides (R102); the mass is dosed into a water heel at 288 K in Q-101 (the
# drown-out quench, a second vented semi-batch), where p-TsCl precipitates (CR101); it is
# filtered in the Nutsche F-101, reslurry-washed twice with ice water and vacuum-dried in the
# paddle dryer DR-101. The vents go to a caustic scrubber; the liquors to neutralisation.
# The flows are the year averages of the batch recipe (process/recipe.yaml, `cheme process
# recipe`, D-003): a batch of 1748.95 kg of dried p-TsCl every 13.85 h, 571.8 batches and 1000 t
# in 7920 h.
# Where the values come from:
# - feeds, temperatures, pressures, ratios: design basis and D-002..D-008, ASSUMED; the feeds are
#   the patent's ratios scaled by hand to 126.263 kg/h of S24 (every outlet scales with them);
# - R101, Q101: cheme's semi-batch model with its vent (the ASSUMED rate laws, D-005); R102,
#   S101: conversion steps; CR101, W101, W102: core's crystallizer with the liquor's other solutes
#   as spectators (core ADR 0056, D-007); F101..F103: specified filters with a Ruth filtration
#   time; D101: core's dryer to a residual moisture (core ADR 0057, D-008); E101, E102:
#   pass-through; M201, M202: mixers (all calculated by `cheme process propagate --fill`);
# - the dryer's heat Q6: core's dryer model (`cheme process crystallizers`);
# - the other duties: hand arithmetic from cheme's reports (`cheme process reactors`) and the
#   stream table, given as ASSUMED with the arithmetic in the source (D-009): no property package
#   of core covers chlorosulfonic acid or the acid liquor, and the dilution heat in the quench is
#   not in the semi-batch model (lesson L-2).
schema: cheme/process/v1
kind: flowsheet
title: p-Toluenesulfonyl chloride by semi-batch chlorosulfonation of toluene with a drown-out quench (1000 t/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 1000 t/a dried p-TsCl, year averages of the batches in 7920 h on a dedicated train (D-002, D-003)", default: true}
tolerance: {abs: 0.05, rel: 0.002}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - id: CSA
    title: Chlorosulfonic acid (merchant)
    category: raw_material
    ports:
      - {id: r101, direction: out}
      - {id: r102, direction: out}
  - {id: NH4CL, title: Ammonium chloride (merchant), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: TOL, title: Toluene (btx-1), category: raw_material, ports: [{id: out, direction: out}]}
  - id: PW
    title: Process water (quench heel, scrubber make-up)
    category: raw_material
    ports:
      - {id: q101, direction: out}
      - {id: s101, direction: out}
  - id: WASHW
    title: Ice-cold process water (cake washes)
    category: raw_material
    ports:
      - {id: w101, direction: out}
      - {id: w102, direction: out}
  - {id: NAOH, title: Caustic soda 50 wt% (chlor-alkali-1), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: q101, direction: out, kind: energy}
      - {id: d101, direction: out, kind: energy}
      - {id: s101, direction: out, kind: energy}
  - id: LPS
    title: LP steam 350 kPa(a) (R-101 heating, the dryer's hot-water circuit)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 350, provenance: assumed, source: "design basis (D-009)"}
      supply_temperature: {value: 412.0, provenance: given, source: "saturation at 350 kPa(a), IAPWS-IF97"}
      min_approach: {value: 10, provenance: assumed, source: "D-009"}
    ports:
      - {id: e101, direction: out, kind: energy}
      - {id: d101, direction: out, kind: energy}
products:
  - {id: TSCL, title: p-Toluenesulfonyl chloride crystals to packing, category: product, ports: [{id: in, direction: in}]}
  - {id: WA, title: "Waste acid (mother liquor, wash filtrates, dryer condensate) to neutralisation", category: wastewater, ports: [{id: in, direction: in}]}
  - {id: WS, title: Spent scrubber liquor to wastewater treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: r102, direction: in, kind: energy}
      - {id: s101, direction: in, kind: energy}
  - id: BRINE
    title: Chilled brine return (263 K)
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 258.15, provenance: assumed, source: "design basis (D-009)"}
      return_temperature: {value: 263.15, provenance: assumed, source: "design basis (D-009)"}
      min_approach: {value: 5, provenance: assumed, source: "D-009"}
    ports:
      - {id: e102, direction: in, kind: energy}
      - {id: q101, direction: in, kind: energy}

blocks:
  - id: CHLS
    title: Chlorosulfonation (R-101)
    class: ReactingChemicals
    ports:
      - {id: csa1, direction: in}
      - {id: csa2, direction: in}
      - {id: salt, direction: in}
      - {id: tol, direction: in}
      - {id: mass, direction: out}
      - {id: vent, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: QUENCH
    title: Drown-out quench and precipitation (Q-101)
    class: ReactingChemicals
    ports:
      - {id: mass, direction: in}
      - {id: water, direction: in}
      - {id: slurry, direction: out}
      - {id: vent, direction: out}
      - {id: chw_heel, direction: out, kind: energy}
      - {id: chw, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: ISOL
    title: Filtration, washing (F-101) and drying (DR-101)
    class: SeparatingMechanically
    ports:
      - {id: in, direction: in}
      - {id: wash1, direction: in}
      - {id: wash2, direction: in}
      - {id: product, direction: out}
      - {id: wa, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: SCRUB
    title: HCl off-gas scrubbing (caustic scrubber)
    class: ReactingChemicals
    ports:
      - {id: vent1, direction: in}
      - {id: vent2, direction: in}
      - {id: naoh, direction: in}
      - {id: pw, direction: in}
      - {id: liquor, direction: out}
      - {id: cw, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}

steps:
  - id: E101
    block: CHLS
    title: Acid charge heated to 338 K (R-101 jacket)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in, delegates: csa1}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: steam}
  - id: R101
    block: CHLS
    title: Chlorosulfonator (salt, then toluene dosed into the acid at 338 K, HCl vented)
    class: ReactingChemicals
    reactions: [SALT, SULP, SULO]
    reactor: semibatch
    batch:
      dosing: [{stream: S3, time: 3600}, {stream: S4, time: 21600, start: 3600}]
      target: {key: TOL, conversion: 0.99}
      heat: isothermal
      vent: {stream: S5, components: [HCL]}
      provenance: assumed
      source: "the salt added in portions over 1 h (its HCl peak sets the scrubber, D-003), then toluene dosed over 6 h at 338 K (the laboratory's 2-3 h at 60-70 C, DE 1 912 956 A1, Example 1, lengthened for R-101's jacket, D-003), the HCl leaving as it forms, then the post-reaction to 0.99 conversion of the toluene (D-005)"
    hazard: {mtt: 383.75, provenance: given, source: "the normal boiling point of toluene (chemicals 1.5.2), the lowest of what stays in the liquid: the dosed toluene; the HCl leaves by the vent (D-011); no TD24 (never estimated)"}
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: charge, direction: in}
      - {id: salt, direction: in, delegates: salt}
      - {id: tol, direction: in, delegates: tol}
      - {id: out, direction: out}
      - {id: gas, direction: out, delegates: vent}
      - {id: q, direction: out, kind: energy, delegates: cw}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: R102
    block: CHLS
    title: Second acid portion at 308 K (sulfonic acids to sulfonyl chlorides)
    class: ReactingChemicals
    reactions: [CHLP, CHLO]
    reactor: conversion
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: csa, direction: in, delegates: csa2}
      - {id: out, direction: out, delegates: mass}
      - {id: q, direction: out, kind: energy, delegates: cw2}
  - id: E102
    block: QUENCH
    title: Water heel cooled to 288 K (Q-101 jacket)
    class: Cooling
    links: [{target: equipment, ref: Q-101}]
    ports:
      - {id: in, direction: in, delegates: water}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: chw_heel}
  - id: Q101
    block: QUENCH
    title: Drown-out quench (reaction mass dosed into the water heel at 288 K)
    class: ReactingChemicals
    reactions: [HYD, AMH, TSHP, TSHO]
    reactor: semibatch
    batch:
      dosing: [{stream: S8, time: 14400}]
      target: {key: CSA, conversion: 0.9999}
      heat: isothermal
      vent: {stream: S11, components: [HCL], fraction: {HCL: 0.1}}
      provenance: assumed
      source: "the reaction mass dosed over 4 h (set by Q-101's jacket with the dilution heat the model leaves out, D-003, D-009) into the cooled water heel at 288 K, then the post-reaction to 0.9999 conversion of the chlorosulfonic acid; 10 % of the HCl formed leaves, the rest stays dissolved in the dilute acid (D-005, D-006)"
    hazard: {mtt: 373.12, provenance: given, source: "the normal boiling point of water, the heel (D-011); the dissolved HCl degasses before, which the screening does not assess; no TD24 (never estimated)"}
    links: [{target: equipment, ref: Q-101}]
    ports:
      - {id: charge, direction: in}
      - {id: dose, direction: in, delegates: mass}
      - {id: out, direction: out}
      - {id: gas, direction: out, delegates: vent}
      - {id: q, direction: out, kind: energy, delegates: chw}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: CR101
    block: QUENCH
    title: Precipitation hold (p-TsCl crystallises from the acid liquor)
    class: Crystallizing
    crystallizer:
      solute: PTSCL
      solvent: H2O
      crystal: PTSCL_S
      basis: solubility
      temperature: 288.15
      solubility:
        unit: kg/kg_solvent
        value: 0.0005
        measured_in: pure_solvent
        provenance: assumed
        source: "ASSUMED 0.5 g per kg water at 288 K (D-007): p-TsCl is insoluble in water and reacts with it (PubChem CID 7397, HSDB); no measured value found"
        salting_out:
          coefficients: {H2SO4: 0.0, HCL: 0.0, AMBS: 0.0, PTSA: 0.0, OTSA: 0.0, OTSCL: 0.0, TOL: 0.0, CSA: 0.0, AMCS: 0.0, NH4CL: 0.0}
          provenance: assumed
          source: "no open salting-out data of p-TsCl in an H2SO4/HCl liquor; no correction taken (D-007)"
      spectators: [H2SO4, HCL, AMBS, PTSA, OTSA, OTSCL, TOL, CSA, AMCS, NH4CL]
      outlets: {slurry: out}
    links: [{target: equipment, ref: Q-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: slurry}
  - id: F101
    block: ISOL
    title: Filtration of the mother liquor (Nutsche filter)
    class: Filtering
    solid_separation:
      solid_recovery: 0.998
      cake_liquid: {value: 0.3, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "agitated Nutsche filter, cake 0.3 kg liquor per kg p-TsCl (D-007)"
      filtration:
        specific_cake_resistance: 1.0e+10
        medium_resistance: 1.0e+10
        pressure_difference: 200
        viscosity: 1.6
        filtrate_density: 1100
        provenance: assumed
        source: "ASSUMED (D-007): a free-filtering crystalline cake, a cloth medium, 200 kPa of nitrogen on the cake; the acid liquor at 288 K estimated from water's with about 12 wt% H2SO4"
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out}
  - id: W101
    block: ISOL
    title: First reslurry wash with ice water
    class: Crystallizing
    crystallizer:
      solute: PTSCL
      solvent: H2O
      crystal: PTSCL_S
      basis: solubility
      temperature: 283.15
      solubility:
        unit: kg/kg_solvent
        value: 0.0005
        measured_in: pure_solvent
        provenance: assumed
        source: "as CR101 (D-007)"
        salting_out:
          coefficients: {H2SO4: 0.0, HCL: 0.0, AMBS: 0.0, PTSA: 0.0, OTSA: 0.0, OTSCL: 0.0, TOL: 0.0, CSA: 0.0, AMCS: 0.0, NH4CL: 0.0}
          provenance: assumed
          source: "as CR101 (D-007)"
      spectators: [H2SO4, HCL, AMBS, PTSA, OTSA, OTSCL, TOL, CSA, AMCS, NH4CL]
      outlets: {slurry: out}
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: cake, direction: in}
      - {id: wash, direction: in, delegates: wash1}
      - {id: out, direction: out}
  - id: F102
    block: ISOL
    title: Filtration of the first wash
    class: Filtering
    solid_separation:
      solid_recovery: 0.998
      cake_liquid: {value: 0.3, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "as F101 (D-007)"
      filtration:
        specific_cake_resistance: 1.0e+10
        medium_resistance: 1.0e+10
        pressure_difference: 200
        viscosity: 1.4
        filtrate_density: 1010
        provenance: assumed
        source: "as F101, the wash filtrate nearly water at 283 K (D-007)"
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out}
  - id: W102
    block: ISOL
    title: Second reslurry wash with ice water
    class: Crystallizing
    crystallizer:
      solute: PTSCL
      solvent: H2O
      crystal: PTSCL_S
      basis: solubility
      temperature: 283.15
      solubility:
        unit: kg/kg_solvent
        value: 0.0005
        measured_in: pure_solvent
        provenance: assumed
        source: "as CR101 (D-007)"
        salting_out:
          coefficients: {H2SO4: 0.0, HCL: 0.0, AMBS: 0.0, PTSA: 0.0, OTSA: 0.0, OTSCL: 0.0, TOL: 0.0, CSA: 0.0, AMCS: 0.0, NH4CL: 0.0}
          provenance: assumed
          source: "as CR101 (D-007)"
      spectators: [H2SO4, HCL, AMBS, PTSA, OTSA, OTSCL, TOL, CSA, AMCS, NH4CL]
      outlets: {slurry: out}
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: cake, direction: in}
      - {id: wash, direction: in, delegates: wash2}
      - {id: out, direction: out}
  - id: F103
    block: ISOL
    title: Filtration of the second wash
    class: Filtering
    solid_separation:
      solid_recovery: 0.998
      cake_liquid: {value: 0.3, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "as F101 (D-007)"
      filtration:
        specific_cake_resistance: 1.0e+10
        medium_resistance: 1.0e+10
        pressure_difference: 200
        viscosity: 1.35
        filtrate_density: 1000
        provenance: assumed
        source: "as F102 (D-007)"
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out}
  - id: D101
    block: ISOL
    title: Vacuum drying at 308 K (paddle dryer)
    class: Drying
    dryer:
      volatiles: [H2O, HCL, TOL]
      residual_moisture: {value: 0.002, basis: mass_fraction, provenance: assumed, source: "0.2 wt% volatiles in the dried product (D-008)"}
      temperature: 308.15
      energy:
        heat_capacity: 1.5
        latent_heat: {H2O: 2418.0, HCL: 443.0, TOL: 412.0}
        vessel_heat_capacity: 2500
        efficiency: 0.7
        port: steam
        provenance: assumed
        source: "wet cake 1.5 kJ/(kg K), 70 % efficiency (D-009); latent heats: water at 308 K (steam tables), HCl 16.15 kJ/mol at its boiling point and toluene 38.0 kJ/mol at 298 K (NIST WebBook); the paddle dryer's metal with its heated shaft, about 5 t of steel at 0.5 kJ/(kg K), heated from 283 K each batch, ASSUMED (D-008)"
      drying_rate: {value: 3.0, provenance: assumed, source: "ASSUMED mean rate of a jacketed vacuum paddle dryer at 308 K with hot water at 318 K, below NBS's 5 kg/(m2 h) at 333 K for the smaller approach (D-008)"}
      cake_density: {value: 1100, provenance: assumed, source: "ASSUMED bulk density of the wet cake: p-TsCl 1.33 g/cm3 (PubChem) with 0.3 kg of liquor per kg and gas in the voids (D-008)"}
      outlets: {product: product, vapour: vapour}
    links: [{target: equipment, ref: DR-101}]
    ports:
      - {id: in, direction: in}
      - {id: product, direction: out, delegates: product}
      - {id: vapour, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: M201
    block: ISOL
    title: Liquor collection to neutralisation
    class: Mixing
    ports:
      - {id: ml, direction: in}
      - {id: wf1, direction: in}
      - {id: wf2, direction: in}
      - {id: cond, direction: in}
      - {id: out, direction: out, delegates: wa}
  - id: M202
    block: SCRUB
    title: Vent header (R-101 and Q-101)
    class: Mixing
    ports:
      - {id: r101, direction: in, delegates: vent1}
      - {id: q101, direction: in, delegates: vent2}
      - {id: out, direction: out}
  - id: S101
    block: SCRUB
    title: Caustic scrubber (HCl neutralised)
    class: ReactingChemicals
    reactions: [NEUT]
    reactor: conversion
    links: [{target: equipment, ref: T-201}]
    ports:
      - {id: gas, direction: in}
      - {id: naoh, direction: in, delegates: naoh}
      - {id: pw, direction: in, delegates: pw}
      - {id: out, direction: out, delegates: liquor}
      - {id: q, direction: out, kind: energy, delegates: cw}
      - {id: power, direction: in, kind: energy, delegates: power}

streams:
  - id: S1
    title: Chlorosulfonic acid, first portion (charge)
    from: CSA.r101
    to: E101.in
    template: mass
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "acid storage (D-004)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 146.5529, provenance: assumed, source: "1.5 kmol per kmol toluene, 1.5 x 0.838499 kmol/h x 116.52 kg/kmol (DE 1 912 956 A1, Example 1; D-004)"}
        composition: {basis: mass_fraction, values: {CSA: 1.0}, provenance: assumed, source: "technical chlorosulfonic acid, impurities (free SO3, H2SO4, HCl) not modelled (D-004)"}
  - id: S2
    title: Acid charge at 338 K
    from: E101.out
    to: R101.charge
    template: mass
    state:
      design:
        temperature: {value: 338.15, provenance: assumed, source: "heated in R-101 to the dosing temperature (D-005)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 146.5529, provenance: calculated, source: 'cheme process propagate: pass-through E101 from S1', fingerprint: fb672256b0d52b67}
        composition: {basis: mass_fraction, values: {CSA: 1.0}, provenance: calculated, source: 'cheme process propagate: pass-through E101 from S1', fingerprint: fb672256b0d52b67}
  - id: S3
    title: Ammonium chloride (added in portions)
    from: NH4CL.out
    to: R101.salt
    template: mass
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "design basis"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 20.1835, provenance: assumed, source: "0.45 kmol per kmol toluene, 0.45 x 0.838499 kmol/h x 53.491 kg/kmol (DE 1 912 956 A1, Example 1; D-004)"}
        composition: {basis: mass_fraction, values: {NH4CL: 1.0}, provenance: assumed, source: "technical ammonium chloride, dry (D-004)"}
  - id: S4
    title: Toluene (dosed)
    from: TOL.out
    to: R101.tol
    template: mass
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "design basis"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 77.2601, provenance: assumed, source: "0.838499 kmol/h, the toluene that makes 126.263 kg/h of S24 (1000 t/a in 7920 h) at the model's yield (D-002, D-004)"}
        composition: {basis: mass_fraction, values: {TOL: 1.0}, provenance: assumed, source: "dry toluene, impurities not modelled (D-004)"}
  - id: S5
    title: R-101 vent (HCl)
    from: R101.gas
    to: M202.r101
    template: scrub
    state:
      design:
        composition: {basis: mole_fraction, values: {HCL: 1.0}, provenance: calculated, source: 'cheme process propagate: reactor R101 from S2 S3 S4', fingerprint: e4dca044b01c481f}
        flow: {value: 44.0208, provenance: calculated, source: 'cheme process propagate: reactor R101 from S2 S3 S4', fingerprint: e4dca044b01c481f}
        temperature: {value: 338.15, provenance: calculated, source: 'cheme process propagate: reactor R101 from S2 S3 S4', fingerprint: e4dca044b01c481f}
        pressure: {value: 101.325, provenance: calculated, source: 'cheme process propagate: reactor R101 from S2 S3 S4', fingerprint: e4dca044b01c481f}
  - id: S6
    title: Sulfonation mass
    from: R101.out
    to: R102.in
