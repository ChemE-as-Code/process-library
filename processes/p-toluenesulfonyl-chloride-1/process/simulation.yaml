# Simulation specs of p-toluenesulfonyl-chloride-1 (`cheme schema process-simulation`). The
# flowsheet is not solved in DWSIM: no property package covers chlorosulfonic acid or the
# aqueous H2SO4/HCl liquor, and a semi-batch with a vent is not coupled to DWSIM (core ADRs 0050,
# 0054). Only the heat boundary is declared: the precipitation hold CR101 (inside Q-101, on its
# brine jacket) and the reslurry washes W101 and W102 are core crystallizers (DESIGN.md D-007)
# without an energy: block: the heat of crystallisation of p-TsCl is small and not known openly,
# so they have no utility energy port (adiabatic, DESIGN.md D-009).
schema: cheme/simulation/v1
kind: simulation
specs:
  CR101: {mode: adiabatic}
  W101: {mode: adiabatic}
  W102: {mode: adiabatic}
