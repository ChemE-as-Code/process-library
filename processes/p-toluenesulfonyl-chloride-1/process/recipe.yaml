# The batch recipe of p-toluenesulfonyl-chloride-1 (schema cheme/recipe/v1, `cheme process
# recipe`, DESIGN.md D-003). One batch makes BATCH kg of dried p-TsCl (stream S24); the
# flowsheet's rates are the year averages.
# - R-101 is one vessel over E101 (the acid heated), R101 (the semi-batch: salt and toluene
#   dosed, HCl vented) and R102 (the second acid portion after the cool-down): `units`, core ADR
#   0057. Dosing and post-reaction come from R101's model (from: R101), the heat-up and the
#   cool-down from the jacket (temperatures); the vessel is sized from R101's model and its
#   jacket checked against the model's peak duty (core ADR 0052). R-101 is emptied by the
#   quench's dosing: its transfer lasts as long as Q101's dosing (4 h).
# - Q-101 is one vessel over E102 (the heel cooled), Q101 (the drown-out quench, a semi-batch)
#   and CR101 (the precipitation hold); it starts with R-101's transfer, its heel cooled before.
# - F-101, an agitated Nutsche filter, is one vessel over F101, W101, F102, W102 and F103: its
#   filtrations take Ruth's time from the filters' filtration data (core ADR 0057).
# - DR-101, a vacuum paddle dryer, takes the washed cake: its drying time from D101's drying
#   rate on its heated area (core ADR 0057).
# Every other duration is ASSUMED (D-003). `cheme process recipe` also gives the vents' peak
# gas rate and what one batch sends to the scrubber (core ADR 0054). `cheme process recipe
# --svg build/gantt.svg` draws one batch.
schema: cheme/recipe/v1
kind: recipe
title: p-TsCl by semi-batch chlorosulfonation and drown-out quench
batch_size: {value: 1748.95, unit: kg, stream: S24, provenance: assumed, source: "one batch of dried p-TsCl: 1000 t/a over 571.8 batches, 126.263 kg/h x the 13.85 h cycle (D-002, D-003)"}
hours_per_year: {value: 7920, provenance: assumed, source: "330 days of 24 h (D-002)"}
unit_procedures:
  - id: CHLOROSULFONATE
    units: [E101, R101, R102]
    title: Charge and heat the acid, dose salt and toluene, cool, second acid portion (R-101)
    vessel:
      fill_fraction: 0.8
      aspect_ratio: 1.2
      volume: 4.0
      jacket: {u: 300, coolant_temperature: 298.15, heating_temperature: 412.0, provenance: assumed, source: "enamelled (glass-lined) steel vessel, cooling water at 298 K and LP steam at 412 K in the jacket (D-003, D-009)"}
      provenance: assumed
      source: "usual fill and proportions of an enamelled stirred vessel; 4 m3 given, not sized: core sizes the vessel from R101's model alone, while R102's second acid portion (1.16 m3 a batch) follows in the same vessel: 3.11 m3 of reaction mass (S8) a batch, 78 % of 4 m3 (D-003, lesson L-3)"
    operations:
      - {id: inert, kind: other, title: Nitrogen purge of the dry vessel, duration: {value: 0.25, provenance: assumed, source: D-003}}
      - {id: charge, kind: charge, title: Charge the first acid portion, duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: heat, kind: heat, title: Heat to 338 K (E101), temperatures: [298.15, 338.15]}
      - {id: dose, kind: dose, title: "Dose the salt (1 h), then the toluene (6 h)", from: R101}
      - {id: react, kind: react, title: Post-reaction, from: R101}
      - {id: cool, kind: cool, title: Cool to 308 K, temperatures: [338.15, 308.15]}
      - {id: charge2, kind: charge, title: Add the second acid portion (R102), duration: {value: 0.17, provenance: assumed, source: "DE 1 912 956 A1, Example 1: 5-10 min (D-003)"}}
      - {id: hold, kind: hold, title: Hold 1 h at 308 K (R102), duration: {value: 1.0, provenance: assumed, source: "DE 1 912 956 A1, Example 1: about 1 h at 35 C (D-003)"}}
      - {id: transfer, kind: transfer, title: Dose the mass into Q-101 (the quench's dosing), duration: {value: 4.0, provenance: assumed, source: "as Q101's dosing time, 4 h (D-003, D-006)"}}
  - id: QUENCH
    units: [E102, Q101, CR101]
    title: Water heel, drown-out quench and precipitation (Q-101)
    vessel:
      fill_fraction: 0.8
      aspect_ratio: 1.2
      jacket: {u: 300, coolant_temperature: 258.15, provenance: assumed, source: "enamelled (glass-lined) steel vessel, chilled brine at 258 K in the jacket (D-003, D-009)"}
      provenance: assumed
      source: "usual fill and proportions of an enamelled stirred vessel (D-003)"
    operations:
      - {id: dose, kind: dose, title: Dose the reaction mass into the heel, from: Q101}
      - {id: react, kind: react, title: Post-reaction, from: Q101}
      - {id: hold, kind: hold, title: Precipitation hold at 288 K (CR101), duration: {value: 1.0, provenance: assumed, source: D-003}}
      - {id: transfer, kind: transfer, title: Slurry to the Nutsche filter, duration: {value: 1.0, provenance: assumed, source: D-003}}
      - {id: clean, kind: clean, title: Rinse, duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: charge, kind: charge, title: Charge the next heel, duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: cool, kind: cool, title: Cool the heel to 288 K (E102), temperatures: [298.15, 288.15]}
  - id: FILTER
    units: [F101, W101, F102, W102, F103]
    title: Filtration and two reslurry washes in the agitated Nutsche filter (F-101)
    vessel: {fill_fraction: 0.8, aspect_ratio: 1.0, provenance: assumed, source: "a squat agitated Nutsche filter, its filter plate the bottom (D-007)"}
    operations:
      - {id: filter, kind: filter, title: Filter the mother liquor (F101), from: F101}
      - {id: wash1, kind: other, title: Reslurry the cake in ice water (W101), duration: {value: 0.5, provenance: assumed, source: D-007}}
      - {id: refilter1, kind: filter, title: Filter the first wash (F102), from: F102}
      - {id: wash2, kind: other, title: Reslurry the cake in ice water (W102), duration: {value: 0.5, provenance: assumed, source: D-007}}
      - {id: refilter2, kind: filter, title: Filter the second wash (F103), from: F103}
      - {id: transfer, kind: transfer, title: Discharge the wet cake to the dryer, duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: clean, kind: clean, title: Rinse, duration: {value: 0.5, provenance: assumed, source: D-003}}
  - id: DRY
    unit: D101
    title: Vacuum drying at 308 K (DR-101, paddle dryer)
    vessel: {fill_fraction: 0.6, aspect_ratio: 2.0, heated_area: 15, provenance: assumed, source: "a horizontal vacuum paddle dryer, its jacket and heated shaft about 15 m2 for the 4 m3 size (D-008)"}
    operations:
      - {id: charge, kind: charge, title: Receive the wet cake, duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: dry, kind: dry, title: Vacuum drying at 308 K (D101), from: D101}
      - {id: discharge, kind: transfer, title: "Cool, break the vacuum with nitrogen and discharge to packing", duration: {value: 0.5, provenance: assumed, source: D-003}}
