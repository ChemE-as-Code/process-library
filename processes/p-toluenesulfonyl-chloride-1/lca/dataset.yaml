id: p-toluenesulfonyl-chloride-by-semi-batch-chlorosulfonation-of-toluene-with-a-drown-out-quench-1000-t-a
title: p-Toluenesulfonyl chloride by semi-batch chlorosulfonation of toluene with a drown-out quench (1000
  t/a)
description: Unallocated foreground LCI of p-Toluenesulfonyl chloride by semi-batch chlorosulfonation
  of toluene with a drown-out quench (1000 t/a), case design, derived from the flowsheet by cheme assess
  lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Batch plant: ammonium chloride and then toluene dosed into chlorosulfonic acid at 338 K (semi-batch,
  HCl vented as it forms), a second acid portion at 308 K, the mass dosed into a water heel at 288 K (drown-out
  quench, semi-batch), p-TsCl precipitated, filtered, reslurry-washed twice with ice water and vacuum-dried
  at 308 K; the HCl neutralised in a caustic scrubber; 1748.95 kg per batch, 571.8 batches a year on a
  dedicated train'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:vessel-vents
  title: storage-tank emissions of R-101, Q-101
  direction: output
  reason: 'No P&ID yet: R-101''s and Q-101''s vents, the HCl they give off included (S5, S11), go to the
    caustic scrubber T-201 and are in the balance; the nitrogen and air displaced while charging and dosing,
    with toluene and water vapour, go the same way and are not estimated (open for basic engineering,
    D-007, D-011).'
- key: emission-excluded:scrubber-vent
  title: storage-tank emissions of T-201
  direction: output
  reason: 'The scrubbed vent (nitrogen of the purges, 0.1 % of the HCl and the toluene vapour the HCl
    strips from R-101) is not split from the liquor in the balance: core''s conversion step has one outlet
    and its vent carries no solvent vapour (core ADR 0054); not estimated (open for basic engineering,
    D-007, D-011).'
- key: emission-excluded:dryer-vent
  title: equipment-leaks emissions of DR-101
  direction: output
  reason: p-TsCl dust and HCl traces in the paddle dryer's vacuum vent are not estimated (D-008, D-011).
