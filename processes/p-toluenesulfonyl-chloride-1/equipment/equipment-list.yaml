# Equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes per batch from the recipe (D-003) and the semi-batch models; design pressures,
# temperatures and materials are not set yet (basic engineering); materials named are usual
# choices for chlorosulfonic acid and wet HCl/H2SO4 liquors, to be confirmed (open input). All
# values ASSUMED.
schema: cheme/equipment/v1
equipment:
  - {tag: R-101, type: StirredTankReactor, service: "Chlorosulfonator: ammonium chloride and toluene dosed into chlorosulfonic acid at 338 K, HCl vented; second acid portion at 308 K",
     notes: "4 m3 enamelled (glass-lined) steel, given: core sizes it from R101's model alone (2.04 m3 at the end of the dosing), while the second acid portion of R102 follows in the same vessel (3.11 m3 of reaction mass a batch, 78 % of 4 m3; D-003, L-3); jacket on cooling water at 298 K and LP steam, 4.92 m2 wetted at the charge, removes 59.0 kW against R101's peak 50.3 kW (cheme process recipe); toluene dosing over 6 h interlocked with the cooling, the agitator and the vent; vent to the scrubber, peak 145 m3/h of HCl while the salt is added; kept dry (no rinse; D-003, D-005, D-011)."}
  - {tag: Q-101, type: StirredTankReactor, service: "Drown-out quench: the reaction mass dosed into a water heel at 288 K, p-TsCl precipitating",
     notes: "20 m3 enamelled steel (R10 preferred size, 75 % full with 14.95 m3 of slurry), as the recipe sizes it from Q101's model (core ADR 0052); jacket on brine at 258 K, 23.4 m2 at the charge, removes 210 kW against the model's peak 135 kW plus about 54 kW of dilution heat the model leaves out (D-009); agitator 11 kW; dosing over 4 h interlocked with the temperature and the agitator; vent to the scrubber (D-006, D-011)."}
  - {tag: F-101, type: Filter, service: "Agitated Nutsche filter: filtration of the mother liquor, two reslurry washes with ice water and their filtrations",
     notes: "20 m3 (R10 preferred size, 75 % full with one batch's slurry, D 2.94 m) as the recipe sizes it (core ADR 0057); filtrations 5.59, 1.29 and 1.26 h by Ruth with ASSUMED cake data, under 200 kPa of nitrogen; 10.13 h per batch; enamelled or Hastelloy (acid chloride liquor) (D-007)."}
  - {tag: DR-101, type: Dryer, service: "Vacuum paddle dryer: the washed cake dried at 308 K",
     notes: "4 m3 (R10 preferred size, 51 % full with 2.06 m3 of wet cake), heated jacket and shaft 15 m2 (ASSUMED), hot water at 318 K from LP steam; drying 11.5 h at an ASSUMED 3 kg/(m2 h), 40.1 kW year average (core's dryer model, the vessel's heat included); vacuum pump and condenser; Hastelloy (wet HCl) (D-008)."}
  - {tag: T-201, type: Column, service: "Caustic scrubber for the HCl of R-101 and Q-101",
     notes: "Packed column with a circulating caustic liquor, 50 wt% caustic dosed at 1.05 mol per mol HCl; per batch 657 kg of HCl (609 kg from R-101, 48 kg from Q-101), peak 145 m3/h while the salt is added to R-101 (cheme process recipe); cooler on cooling water, 43.9 kW year average (D-007, D-009)."}
