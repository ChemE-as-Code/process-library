# Equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes per batch from the recipe (D-003) and the semi-batch models; design pressures,
# temperatures and materials are not set yet (basic engineering); materials named are usual
# choices for chlorosulfonic acid and wet HCl/H2SO4 liquors, to be confirmed (open input). All
# values ASSUMED.
schema: cheme/equipment/v1
equipment:
  - {tag: R-101, type: StirredTankReactor, service: "Chlorosulfonator: ammonium chloride and toluene dosed into chlorosulfonic acid at 338 K, HCl vented; second acid portion at 308 K",
     notes: "4 m3 enamelled (glass-lined) steel, given: core sizes it from R101's model alone (2.04 m3 at the end of the dosing), while the second acid portion of R102 follows in the same vessel (3.11 m3 of reaction mass a batch, 78 % of 4 m3; D-003, L-3); jacket on cooling water at 298 K and LP steam, 4.92 m2 wetted at the charge, removes 59.0 kW against R101's peak 50.3 kW (cheme process recipe); toluene dosing over 6 h interlocked with the cooling, the agitator and the vent; vent to the scrubber, peak 145 m3/h of HCl while the salt is added, the vent line and scrubber for 150 m3/h (ASSUMED); a cooling failure releases up to 145.5 m3/h at the end of the salt addition, 0.97 of it, about 3 % margin (60.3 m3/h at the MTSR of the toluene dosing), 150 m3/h at a ten times slower rate, so the salt addition is interlocked as well (stop on a loss of cooling or a high vent flow; D-011, D-014); kept dry (no rinse; D-003, D-005, D-011, D-014)."}
  - {tag: Q-101, type: StirredTankReactor, service: "Drown-out quench: the reaction mass dosed into a water heel at 288 K, p-TsCl precipitating",
     notes: "20 m3 enamelled steel (R10 preferred size, 75 % full with 14.95 m3 of slurry), as the recipe sizes it from Q101's model (core ADR 0052); jacket on brine at 258 K, 23.4 m2 at the charge, removes 210 kW against the model's peak 135 kW plus about 55.5 kW of dilution heat the model leaves out, about 190.5 kW in all (D-003, D-009); agitator 11 kW; dosing over 4 h interlocked with the temperature and the agitator; vent to the scrubber through the 150 m3/h header; a cooling failure at the end of the dosing releases 14.1 m3/h of HCl, the ASSUMED 10 % vented share, up to about 141 m3/h (0.94 of the header) if all the HCl formed leaves, so the header takes one vessel's gas at a time (D-006, D-011, D-014)."}
  - {tag: F-101, type: Filter, service: "Agitated Nutsche filter: filtration of the mother liquor, two reslurry washes with ice water and their filtrations",
     notes: "20 m3 (R10 preferred size, 75 % full with one batch's slurry, D 2.94 m) as the recipe sizes it (core ADR 0057); filtrations 5.59, 1.34 and 1.39 h by Ruth with ASSUMED cake data, under 200 kPa of nitrogen; 10.33 h per batch; enamelled or Hastelloy (acid chloride liquor) (D-007)."}
  - {tag: T-101, type: Tank, service: "Wash water tank: process water chilled to 278 K for F-101's two reslurry washes",
     notes: "About 8 m3 (one batch's 7.0 t of wash water, 2 x 3.5 t, with margin; ASSUMED), stainless steel, brine coil or jacket at 258 K: 11.8 kW year average (Q9; D-007, D-009)."}
  - {tag: DR-101, type: Dryer, service: "Vacuum paddle dryer: the washed cake dried at 308 K",
     notes: "4 m3 (R10 preferred size, 52 % full with 2.06 m3 of wet cake), heated jacket and shaft 15 m2 (ASSUMED), hot water at 318 K from LP steam; drying 11.5 h at an ASSUMED 3 kg/(m2 h), 40.8 kW year average (core's dryer model, the vessel's heat included); vacuum pump and a vacuum condenser on brine, 25.5 kW year average (Q8); Hastelloy (wet HCl) (D-008)."}
  - {tag: T-201, type: Column, service: "Caustic scrubber for the HCl of R-101 and Q-101",
     notes: "Packed column with a circulating caustic liquor, 50 wt% caustic dosed at 1.05 mol per mol HCl; per batch 657 kg of HCl (609 kg from R-101, 48 kg from Q-101), peak 145 m3/h while the salt is added to R-101 (cheme process recipe), gas inlet for 150 m3/h (ASSUMED, the vents' hazard.vent_capacity), 0.97 of it in a cooling failure at the end of R-101's salt addition (145.5 m3/h), all of it at a ten times slower rate (D-011, D-014); cooler on cooling water, 49.9 kW year average with the caustic's ASSUMED dilution heat (D-007, D-009)."}
