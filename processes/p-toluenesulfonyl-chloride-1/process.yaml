schema: cheme-as-code/process/v1
id: p-toluenesulfonyl-chloride-1
title: p-Toluenesulfonyl chloride by semi-batch chlorosulfonation of toluene with a drown-out quench (1000 t/a)
summary: >-
  A batch plant: toluene is dosed into chlorosulfonic acid with ammonium chloride (HCl vented to
  a scrubber), a second acid portion gives the sulfonyl chlorides, and the mass is drowned in
  cold water, where p-TsCl precipitates, is filtered, washed and vacuum-dried. Concept stage,
  1749 kg per batch every 13.85 h on a dedicated train, preliminary gate-to-gate LCI.
description: |
  The route is the salt-modified chlorosulfonation of DE 1 912 956 A1 (Hoechst, 1969, Example 1):
  per mol of toluene 1.5 mol of chlorosulfonic acid and 0.45 mol of ammonium chloride are charged,
  the salt is added in portions (HCl escapes), toluene is dosed at 338 K, the mass is cooled to
  308 K, a second 1.5 mol of acid is added and held for 1 h, and the mass is drowned in water.
  The salt raises the para share of the sulfonation to 90 % (the patent's p-content). The
  sulfonic acids go 90 % to the sulfonyl chlorides (ASSUMED); the rest stays in the waste acid.
  In the quench the excess acid and the ammonium chlorosulfate hydrolyse, p-TsCl precipitates
  (assumed solubility 0.5 g per kg water), and the ortho isomer, an oil above 10 C, stays with
  the liquor. Two reslurry washes with ice water and vacuum drying at 308 K give the product.
  The modelled assay is 99.7 wt% p-TsCl, an upper bound: the cake's o-TsCl retention is not
  modelled (DESIGN.md L-4), and the source's crude has 90 % para. The modelled yield is 78.8 % on
  toluene. That is above the patent's 77 % of theory as para compound in its crude (an ASSUMED
  better in-mass conversion, DESIGN.md D-005); calibrated to the patent, it would be about 76 %.
  The HCl of both vents (0.38 kg
  per kg product) is neutralised in a caustic scrubber; 12.6 kg of dilute waste acid (8 wt%
  H2SO4, 2 wt% HCl) per kg product goes to neutralisation.

  The batch is modelled with cheme-as-code 1.10.0: the chlorosulfonator R101 and the quench Q101
  are semi-batches (reactor: semibatch) with an HCl vent (batch.vent, core ADR 0054); the
  precipitation and the two reslurry washes are crystallizers with the liquor's other solutes
  as spectators (core ADR 0056); the Nutsche filter is one recipe vessel over five steps with
  Ruth filtration times and the paddle dryer core's dryer to a residual moisture (core ADR 0057).
  The recipe gives the cycle (13.85 h, R-101 the bottleneck, 571.8 batches a year), sizes the
  vessels, checks the jackets and reports the scrubber load per batch (657 kg HCl). The heats of
  R101, R102 and Q101 come from their models (core ADR 0059), the quench's with the dilution heat
  of the dosed acids (a dose's heat of solution, core ADR 0063). Kinetics and heats of reaction are ASSUMED (no
  open data): the sulfonation accumulates 1.7 % of the toluene and its cooling-failure
  temperature reaches 343.6 K against an MTT of 383.75 K (toluene's boiling point), with 60 m3/h
  of HCl released against a vent of 150 m3/h (core ADR 0058); a 100 times slower rate would
  exceed both the MTT and the vent. See DESIGN.md for every assumption.
families: [chlorinated-organics]
keywords: [p-toluenesulfonyl chloride, tosyl chloride, TsCl, chlorosulfonic acid, toluene, chlorosulfonation, ammonium chloride, semi-batch, batch, dosing, HCl vent, quench, drown-out, precipitation, Nutsche filter, vacuum dryer, caustic scrubber, fine chemicals]
facets:
  feedstock_basis: [fossil, mineral, electricity]
  product_classes: [chemicals]
  unit_operations: [reaction, crystallization, filtration, drying, absorption]
  region: generic
# Honest claim: concept is the lowest level of the manifest. Capacity, kinetics, heats of
# reaction, solubility, filtration and drying are assumed (DESIGN.md).
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept batch PFD with closed mass, component and element balances (cheme validate: 4 blocks,
    17 steps). Every material stream is calculated by cheme process propagate from the feeds: the
    semi-batches R101 and Q101 from their ASSUMED rate laws with the HCl vented (core ADR 0054),
    R102 and the scrubber as conversion steps, the precipitation CR101 and the washes W101, W102
    as crystallizers with spectators on an ASSUMED solubility with no salting-out correction, the
    filters as specified splits, the dryer D101 to an ASSUMED residual moisture with its heat from
    cheme's dryer model. The feeds are sized by hand for 1000 t/a (the outlets scale with them);
    the duties of R101, R102 and Q101 are written by the models (core ADR 0059), Q101's with the
    ASSUMED heat of solution of the dosed acids (core ADR 0063), and the other duties are hand
    arithmetic from the stream table. The recipe takes the
    dosing, post-reaction, heating, cooling, filtration and drying times from the models (cheme
    process recipe, no cheme.recipe-basis or cheme.recipe-jacket finding). Thermal screening
    (cheme process reactor-hazards): R101 dT_ad 238 K, accumulation 1.7 %, MTSR 343.6 K against
    an MTT of 383.75 K; a cooling failure's HCl up to 145.5 m3/h at the end of the salt addition
    (60.3 m3/h at the MTSR) against an ASSUMED vent capacity of 150 m3/h, about 3 % margin;
    Q101 dT_ad 39.1 K (14.2 K of it the dosed acids' heat of solution), MTSR 298.2 K against 373.1 K, 14.1 m3/h of HCl at the end of the dosing
    (the ASSUMED 10 % vented share; all of it about 141 m3/h); no criticality class without a
    TD24 from calorimetry (never estimated). The kinetics are assumed: at k/10 R101's release
    reaches the vent's capacity (150 m3/h), at k/100 its MTSR is 420 K and its HCl 1302 m3/h, 8.7
    times the vent (a design finding: dosing and salt-addition interlocks, emergency relief from
    calorimetry, DESIGN.md D-014). Preliminary gate-to-gate LCI with nitrogen and rinses as per-batch
    consumables; toluene, caustic soda and nitrogen linked to btx-1, chlor-alkali-1 and asu-1,
    chlorosulfonic acid through the library's estimate proxy (SO3 from the background, HCl from
    hydrogen-chloride-1, library ADR 0039, D-016), ammonium chloride a gap. Not reviewed. Needs
    cheme-as-code 1.9.0.
