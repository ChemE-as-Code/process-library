    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "0.340 kWh (1.22 MJ)/kg p-TsCl of LP steam: R-101's heat-up and the dryer's hot-water circuit (cheme's dryer model, the vessel's heat each batch included)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "0.610 kWh/kg p-TsCl removed by cooling water: the heat of sulfonation, the cool-down to 308 K and the scrubber (the caustic's ASSUMED dilution heat included)"}
    - {chemical: chilled-water, role: utility, inventory_key: "product:BRINE", note: "0.811 kWh/kg p-TsCl removed by brine at 258 K: the heel cooled, the quench heat with the dosed acids' dilution heat (Q101's model, 0.435 kWh, of it 0.127 kWh the dilution), the dryer's vacuum condenser (0.202 kWh) and the wash water chilled to 278 K (0.094 kWh) (the registry has chilled water, not brine: closest entry)"}
