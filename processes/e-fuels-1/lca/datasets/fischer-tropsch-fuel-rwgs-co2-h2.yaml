# Tier 1 form, a manifest-only entry without a flowsheet (as process-library#317). Every amount is the formula
# of its parameters; core's validator re-checks each. Written from König et al. 2015 (facts in our own form).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: fischer-tropsch-fuel-rwgs-co2-h2
title: Fischer-Tropsch liquid fuel from CO2 and H2 by reverse water-gas shift and cobalt low-temperature FT
description: 'Per 1 t of FT liquid fuel (mainly C5+ after wax hydrocracking, cuts not split), gate-to-gate, from H2 and
  captured CO2 delivered at the gate. A sourced conceptual inventory: flows from one open process simulation (König
  et al. 2015), burner CO2 and water from the element balance. No operating plant behind it.'
basis: 1000 kg of Fischer-Tropsch liquid fuel
boundary: 'gate-to-gate: CO2 compression, RWGS reformer fired with the plant''s own fuel gas, cobalt FT synthesis,
  product recovery, wax hydrocracking; H2 and CO2 from outside, electrolysis and capture excluded'
technology: reverse water-gas shift at 900 degC and 2.5 MPa with internal and external recycle, low-temperature
  FT on cobalt at 225 degC, hydrocracking at 6 MPa; methanol-to-fuels and co-electrolysis are not modelled
geography:
  description: A generic concept (DLR, Germany); no site.
classification:
  isic: '1920'
system_boundary:
  included:
  - H2 and CO2 feeds
  - utility electricity (CO2 and recycle compression, cooling-water pumping, refrigeration)
  - RWGS burner flue gas (CO2 and water vapour) from the plant's own fuel gas
  - reaction water to treatment
  - 'no external heat: the source''s pinch analysis meets the heating demand from the process (section 4.2)'
  excluded:
  - 'TODO excess steam, 25.7 MW in the source (FT steam beyond the 3.8 MW used in the plant, LP and MP steam): not
    counted as exported; if exported it is a co-product to allocate (docs/system-model.md section 2), never a credit'
  - 'TODO cooling water: 44.9 MW cooling load in the source; its pumping is in the electricity, its make-up is not
    counted'
  - 'TODO catalysts: nickel RWGS, cobalt FT (a critical metal: never cut, docs/system-model.md section 4) and the
    hydrocracking catalyst; the source gives no charge or life'
  - TODO CO, CH4, NOx and unburnt hydrocarbons in the flue gas; oxygenates in the FT water (the source models n-alkanes
    only)
  - TODO fractionation of the product into gasoline, kerosene and diesel, and their split
  - hydrogen compression (the source delivers H2 at plant pressure) and CO2 capture and purification
  - start-up, flaring, storage losses
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: GLO
year: 2015
valid_until: 2020
time:
  start: 2015
  description: a simulation published in 2015 of a future plant; valid_until is the reference year + 5 (system-model
    section 6), so it has already lapsed
modelling:
  principle: attributional
  multifunctionality: 'single output: the blended liquid fuel. The cuts are not split (see README), and the excess
    steam is not counted as exported (system_boundary.excluded), so nothing is allocated'
