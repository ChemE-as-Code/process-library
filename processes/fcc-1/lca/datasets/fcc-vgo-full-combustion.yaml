# Tier 1 form, process-library#313 pilot without a flowsheet. Every amount is the formula of its parameters;
# core's validator re-checks each. Written from the REF BREF, a worked example of published FCC yield
# correlations, PRELIM's hydrogen contents and IPCC defaults (facts in our own form).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: fcc-vgo-full-combustion
title: Fluid catalytic cracking of vacuum gas oil, full-combustion regenerator
description: 'Per 1 t of fresh feed, gate-to-gate: riser reactor, regenerator, main fractionator and gas plant.
  Unallocated multi-output dataset: gasoline, C3/C4 cut, dry gas, light and heavy cycle oil. Yields from a worked
  example of published correlations, utilities and regenerator emissions from REF BREF ranges, CO2 from the coke''s
  carbon, CH4 and N2O from IPCC defaults.'
basis: 1000 kg of fresh feed (vacuum gas oil) cracked
boundary: 'gate-to-gate: feed preheat, riser reactor, catalyst stripper, regenerator with waste heat or CO boiler,
  main fractionator, wet gas compressor and gas plant; steam, power and fuel from outside; flue-gas abatement of
  the regenerator included only as far as the BREF''s emission data include it'
technology: fluid catalytic cracking on zeolite catalyst, single-stage regenerator in full combustion (typical for
  vacuum distillate feeds, BREF section 2.5); residue cracking (RCC), partial combustion and propylene-maximising
  variants are not modelled
geography:
  description: 'Mixed: utilities and regenerator emissions from EU units of the REF BREF data collection, yields
    from a US textbook correlation example; no single site.'
classification:
  isic: '1920'
system_boundary:
  included:
  - vacuum gas oil feed
  - gasoline, C3/C4 cut, dry gas, light and heavy cycle oil (co-products, unallocated in the inventory)
  - 'coke burn in the regenerator: CO2, CO, CH4, N2O, water vapour, combustion oxygen'
  - NOx, SOx and particulates of the regenerator
  - electricity, fuel, gross steam, cooling water
  - catalyst make-up, spent catalyst and fines
  - sour water
  excluded:
  - 'TODO steam raised in the waste heat or CO boiler (40 to 60 kg/t, BREF Table 3.33): an exported co-product under
    the system model, not inventoried, so the hydrocarbon products carry its share'
  - 'TODO power from a flue-gas expander: not credited and not inventoried'
  - 'TODO H2S and sulfur of the products: the feed''s sulfur and nitrogen are not in the element balance; H2S stays
    in the dry gas'
  - 'TODO hydrocarbons, aldehydes and NH3 from the regenerator: negligible with a CO boiler and ESP in AP-42 (as
    listed by US DOE 2007, Table 2-8), not quantified for full combustion'
  - TODO metals in the particulates (Ni, V, Sb) and dioxins and PAH (BREF Tables 3.38 and 3.39 give examples, no
    rate per t)
  - TODO organics, phenols, cyanides and sulfides in the sour water (BREF Table 3.40, concentrations only)
  - TODO fugitive hydrocarbons and storage
  - feed hydrotreating and product treating (separate units)
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: included
  non_routine: excluded
location: GLO
year: 2010
valid_until: 2015
time:
  start: 1997
  description: REF BREF data collection (sources 1997 to 2010, TWG update 2010; BREF published 2015); yield correlations
    of Gary et al. (2007) in course notes of 2019. valid_until is the reference year + 5 (system-model section 6),
    so it has already lapsed.
modelling:
  principle: attributional
  multifunctionality: 'unallocated multi-output dataset; default allocation energy: the five co-products are fuels
    and fuel blendstocks, so burdens are shared by lower heating value (hierarchy step 2, the curated rule in lci/mappings.yaml),
    with IPCC default NCVs (see allocation)'
allocation:
  method: energy
  coproducts:
  - gasoline
  - lpg
  - dry-gas
  - light-cycle-oil
  - heavy-cycle-oil
  properties:
    gasoline:
      energy: 44300.0
    lpg:
      energy: 47300.0
    dry-gas:
      energy: 49500.0
    light-cycle-oil:
      energy: 43000.0
    heavy-cycle-oil:
      energy: 40400.0
  source: 'lci/mappings.yaml allocation.fcc-1 (rule physical-energy): the five co-products are fuels and fuel blendstocks,
    so energy content (LHV) is the physical relationship, docs/system-model.md section 2, step 2. Lower heating
    values in kJ/kg (the MJ/kg defaults times 1000), IPCC 2006 Vol. 2, ch. 1, Table 1.2, p. 1.18 defaults: motor
    gasoline 44.3 (gasoline), LPG 47.3 (C3/C4 cut), refinery gas 49.5 (dry gas), gas/diesel oil 43.0 (LCO), residual
    fuel oil 40.4 (heavy cycle oil and slurry); the matching of FCC streams to IPCC fuel types is ASSUMED. The LHVs
    differ by under 20 %, so energy and mass allocation give similar shares.'
