# Simulation settings. Schema: `cheme schema process-simulation`.
# Not run: no property package of the DWSIM route is qualified for SO2/SO3 gas or aqueous
# sulfuric acid (cheme process methods; core #315, #364: electrolytes other than NaCl refused).
# This file only records the energy mode of the reactors (D-006): the furnace and the four
# beds are adiabatic (refractory-lined, heat losses neglected), and the two absorption towers
# release their heat into the circulating acid, which the acid cooler E-301 rejects.
schema: cheme/simulation/v1
kind: simulation
specs:
  R101: {mode: adiabatic}
  R201: {mode: adiabatic}
  R202: {mode: adiabatic}
  R203: {mode: adiabatic}
  R204: {mode: adiabatic}
  T301: {mode: adiabatic}
  T302: {mode: adiabatic}
