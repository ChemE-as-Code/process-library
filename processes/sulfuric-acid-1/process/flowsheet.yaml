        pressure: {value: 145.0, provenance: assumed, source: "pressure profile (D-010)"}
        temperature: {value: 713.15, provenance: assumed, source: "bed 2 inlet (D-005)"}
        phase: {value: vapor, provenance: assumed, source: "gas"}
        flow: {value: 120971.0, provenance: calculated, source: 'cheme process propagate: pass-through E201H from S7', fingerprint: e07c25aa86de9ce3}
        composition: {basis: mole_fraction, values: {N2: 0.810563, O2: 0.0604655, AR: 0.00964955, SO2: 0.0441493, SO3: 0.0751731, H2O: 0.0, S: 0.0}, provenance: calculated, source: 'cheme process propagate: pass-through E201H from S7', fingerprint: e07c25aa86de9ce3}
  - id: S9
