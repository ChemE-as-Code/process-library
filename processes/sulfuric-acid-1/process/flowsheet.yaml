    template: gas
    state:
      design:
        pressure: {value: 152.0, provenance: assumed, source: "pressure profile (D-010)"}
        temperature: {value: 688.15, provenance: assumed, source: "bed 1 inlet (D-005)"}
        phase: {value: vapor, provenance: assumed, source: "gas"}
        flow: {value: 120971.0, provenance: calculated, source: 'cheme process propagate: pass-through E101 from S5', fingerprint: fdef9b7c883c35bd}
        composition: {basis: mole_fraction, values: {N2: 0.7812, O2: 0.0945001, AR: 0.0093, H2O: 0.0, S: 0.0, SO2: 0.115}, provenance: calculated, source: 'cheme process propagate: pass-through E101 from S5', fingerprint: fdef9b7c883c35bd}
  - id: S7
