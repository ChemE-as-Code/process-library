    template: gas
    state:
      design:
        pressure: {value: 148.0, provenance: assumed, source: "pressure profile (D-010)"}
        temperature: {value: 898.86, provenance: assumed, source: "scripts/balance.py: adiabatic bed (D-006)"}
        phase: {value: vapor, provenance: assumed, source: "gas"}
        flow: {value: 120971.0, provenance: calculated, source: 'cheme process propagate: reactor R201 from S6', fingerprint: 222c40aa1967512b}
        composition: {basis: mole_fraction, values: {N2: 0.810563, O2: 0.0604655, AR: 0.00964955, SO2: 0.0441493, SO3: 0.0751731, H2O: 0.0, S: 0.0}, provenance: calculated, source: 'cheme process propagate: reactor R201 from S6', fingerprint: 23b63a55403f3400}
  - id: S8
    title: Gas to bed 2
    from: E201H.out
