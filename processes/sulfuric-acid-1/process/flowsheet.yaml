# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Sulfuric acid from molten sulfur, double contact / double absorption, 3+1 converter (D-001).
# Where the values come from:
# - feeds, temperatures and pressures: design basis and decisions D-002..D-010, ASSUMED;
# - the furnace and the four beds are conversion reactors (D-005): their outlets, and the flows
#   and compositions through exchangers, the pump tank and the acid splitter, are calculated by
#   `cheme process propagate --fill`;
# - tower outlets (drying, intermediate and final absorption), reactor outlet temperatures,
#   duties and power come from the independent balance scripts/balance.py (D-006), given here as
#   ASSUMED: core has no property package for SO2/SO3 gas or aqueous sulfuric acid (core #315,
#   #364), so it can neither flash the towers nor close the energy balance itself.
schema: cheme/process/v1
kind: flowsheet
title: Sulfuric acid, sulfur burning, double contact / double absorption (1000 t/d H2SO4)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 1000 t/d H2SO4 as 98.5 wt% acid, 11.5 mol% SO2 burner gas, 99.7 % overall conversion (D-002, D-004, D-005)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: SULFUR, title: Molten sulfur, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AIR, title: Atmospheric air, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PW, title: Process (dilution) water, category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports: [{id: k101, direction: out, kind: energy}, {id: p301, direction: out, kind: energy}]
products:
  - {id: ACID, title: Sulfuric acid 98.5 wt% to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: STACK, title: Tail gas to stack, category: off_gas, ports: [{id: in, direction: in}]}
  - id: HPS
    title: HP steam export 4100 kPa(a), 673 K (heat above boiler feed water)
    category: utility
    utility:
      kind: steam
      level: HP
      pressure: {value: 4100, provenance: assumed, source: "design basis, D-008"}
      supply_temperature: {value: 673.15, provenance: assumed, source: "design basis, D-008"}
      min_approach: {value: 20, provenance: assumed, source: D-008}
    ports:
      - {id: whb, direction: in, kind: energy}
      - {id: sh, direction: in, kind: energy}
      - {id: eco1, direction: in, kind: energy}
      - {id: eco2, direction: in, kind: energy}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis"}
      min_approach: {value: 5, provenance: assumed, source: "design basis"}
    ports: [{id: acid, direction: in, kind: energy}, {id: prod, direction: in, kind: energy}]

blocks:
  - id: DRY
    title: Air drying and main blower
    class: Absorbing
    ports:
      - {id: air, direction: in}
      - {id: acid_in, direction: in}
      - {id: acid_out, direction: out}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy}
  - id: BURN
    title: Sulfur combustion and waste heat boiler
    class: ReactingChemicals
    ports:
      - {id: air, direction: in}
      - {id: sulfur, direction: in}
      - {id: out, direction: out}
      - {id: steam, direction: out, kind: energy}
  - id: CONV
    title: SO2 conversion (four beds, 3+1)
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: to_ipa, direction: out}
      - {id: from_ipa, direction: in}
      - {id: to_fat, direction: out}
      - {id: steam_sh, direction: out, kind: energy}
      - {id: steam_eco1, direction: out, kind: energy}
      - {id: steam_eco2, direction: out, kind: energy}
  - id: ABS
    title: SO3 absorption and acid system
    class: Absorbing
    ports:
      - {id: ipa_in, direction: in}
      - {id: ipa_out, direction: out}
      - {id: fat_in, direction: in}
      - {id: stack, direction: out}
      - {id: acid_dt, direction: out}
      - {id: acid_dt_ret, direction: in}
      - {id: water, direction: in}
      - {id: product, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: cw_acid, direction: out, kind: energy}
      - {id: cw_prod, direction: out, kind: energy}

steps:
  # --- DRY ---------------------------------------------------------------------------------
  - id: T101
    block: DRY
    title: Air drying tower (98.5 wt% acid)
    class: Absorbing
    links: [{target: equipment, ref: T-101}]
    ports:
      - {id: gas_in, direction: in, delegates: air}
      - {id: acid_in, direction: in, delegates: acid_in}
      - {id: gas_out, direction: out}
      - {id: acid_out, direction: out, delegates: acid_out}
  - id: K101
    block: DRY
    title: Main air blower
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  # --- BURN --------------------------------------------------------------------------------
  - id: R101
    block: BURN
    title: Sulfur furnace
    class: ReactingChemicals
    reactions: [S_COMB]
    reactor: conversion
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: air, direction: in, delegates: air}
      - {id: sulfur, direction: in, delegates: sulfur}
      - {id: out, direction: out}
  - id: E101
    block: BURN
    title: Waste heat boiler
    class: Cooling
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
      - {id: steam, direction: out, kind: energy, delegates: steam}
  # --- CONV (D-005: cumulative conversion 63 / 87 / 95 / 99.7 %; per-bed fractions of the
  # bed inlet SO2 below) ---------------------------------------------------------------------
  - id: R201
    block: CONV
    title: Converter bed 1
    class: ReactingChemicals
    reactions: [SO2_OX]
    reactor: conversion
    conversion: {SO2_OX: 0.63}
    catalyst: V2O5
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: out, direction: out}
  # Each gas/gas exchanger is two steps, its hot and its cold side, joined by an energy stream
  # (QE201, QE203): one exchanger (one equipment tag) whose sides propagate can pass through.
  - id: E201H
    block: CONV
    title: Hot interpass exchanger, bed 1 gas side
    class: Cooling
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy}
  - id: E201C
    block: CONV
    title: Hot interpass exchanger, reheat side
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy}
  - id: R202
    block: CONV
    title: Converter bed 2
    class: ReactingChemicals
    reactions: [SO2_OX]
    reactor: conversion
    conversion: {SO2_OX: 0.648649}
    catalyst: V2O5
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: E202
    block: CONV
    title: Steam superheater
    class: Cooling
    links: [{target: equipment, ref: E-202}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: steam, direction: out, kind: energy, delegates: steam_sh}
  - id: R203
    block: CONV
    title: Converter bed 3
    class: ReactingChemicals
    reactions: [SO2_OX]
    reactor: conversion
    conversion: {SO2_OX: 0.615385}
    catalyst: V2O5
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: E203H
    block: CONV
    title: Cold interpass exchanger, bed 3 gas side
    class: Cooling
    links: [{target: equipment, ref: E-203}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy}
  - id: E203C
    block: CONV
    title: Cold interpass exchanger, reheat side
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-203}]
    ports:
      - {id: in, direction: in, delegates: from_ipa}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy}
  - id: E204
    block: CONV
    title: Economiser 1 (gas to intermediate tower)
    class: Cooling
    links: [{target: equipment, ref: E-204}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: to_ipa}
      - {id: steam, direction: out, kind: energy, delegates: steam_eco1}
  - id: R204
    block: CONV
    title: Converter bed 4
    class: ReactingChemicals
    reactions: [SO2_OX]
    reactor: conversion
    conversion: {SO2_OX: 0.94}
    catalyst: V2O5
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: E205
    block: CONV
    title: Economiser 2 (gas to final tower)
    class: Cooling
    links: [{target: equipment, ref: E-205}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: to_fat}
      - {id: steam, direction: out, kind: energy, delegates: steam_eco2}
  # --- ABS (D-007: one acid header at 343 K serves the three towers) -----------------------
  - id: T301
    block: ABS
    title: Intermediate absorption tower
    class: Absorbing
    reactions: [SO3_ABS]
    links: [{target: equipment, ref: T-301}]
    ports:
      - {id: gas_in, direction: in, delegates: ipa_in}
      - {id: acid_in, direction: in}
      - {id: gas_out, direction: out, delegates: ipa_out}
      - {id: acid_out, direction: out}
  - id: T302
    block: ABS
    title: Final absorption tower
    class: Absorbing
    reactions: [SO3_ABS]
    links: [{target: equipment, ref: T-302}]
    ports:
      - {id: gas_in, direction: in, delegates: fat_in}
      - {id: acid_in, direction: in}
      - {id: gas_out, direction: out, delegates: stack}
      - {id: acid_out, direction: out}
  - id: T303
    block: ABS
    title: Acid pump tank (dilution water added)
    class: Mixing
    links: [{target: equipment, ref: T-303}]
    ports:
      - {id: dt, direction: in, delegates: acid_dt_ret}
      - {id: ipa, direction: in}
      - {id: fat, direction: in}
      - {id: water, direction: in, delegates: water}
      - {id: out, direction: out}
  - id: P301
    block: ABS
    title: Acid circulation pump
    # GeneratingFlow, the parent of Pumping: cheme 0.8.0 process build fails on a Pumping step
    # (its method field is an optional union in pyDEXPI 2.1.0); back to Pumping when core fixes it.
    class: GeneratingFlow
    links: [{target: equipment, ref: P-301}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E301
    block: ABS
    title: Acid cooler
    class: Cooling
    links: [{target: equipment, ref: E-301}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw_acid}
  # Fractions of the circulating acid from scripts/balance.py (D-007): each tower's circulation
  # from its energy balance, the product draw from the production rate.
  - id: SPL301
    block: ABS
    title: Acid distribution and product draw
    class: SplittingMaterial
    split: {dt: 0.17702623, ipa: 0.58880211, fat: 0.21111552, prod: 0.02305614}
    ports:
      - {id: in, direction: in}
      - {id: dt, direction: out, delegates: acid_dt}
      - {id: ipa, direction: out}
      - {id: fat, direction: out}
      - {id: prod, direction: out}
  - id: E302
    block: ABS
    title: Product acid cooler
    class: Cooling
    links: [{target: equipment, ref: E-302}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: product}
      - {id: cw, direction: out, kind: energy, delegates: cw_prod}

streams:
  # --- air and drying --------------------------------------------------------------------------
  - id: S1
    title: Atmospheric air
    from: AIR.out
    to: T101.gas_in
    template: air
    state:
      design:
        pressure: {value: 101.325, provenance: assumed, source: "design basis (D-004)"}
        temperature: {value: 298.15, provenance: assumed, source: "design basis (D-004)"}
        phase: {value: vapor, provenance: assumed, source: "ambient air"}
        flow: {value: 108584.4, basis: mass, provenance: assumed, source: "scripts/balance.py (D-004, D-006): dry air for 11.5 mol% SO2"}
        composition: {basis: mole_fraction, values: {N2: 0.766536203, O2: 0.205567504, AR: 0.00912543098, H2O: 0.0187708621}, provenance: assumed, source: "dry air (CO2 lumped into N2) at 298 K, 60 % RH (D-004)"}
  - id: S2
    title: Dried air
    from: T101.gas_out
    to: K101.in
    template: air
    state:
      design:
        pressure: {value: 98.0, provenance: assumed, source: "blower suction (D-010)"}
        temperature: {value: 348.15, provenance: assumed, source: "gas leaving the towers (D-007)"}
        phase: {value: vapor, provenance: assumed, source: "dry gas"}
        flow: {value: 107307.4, basis: mass, provenance: assumed, source: "scripts/balance.py (D-006): moisture absorbed completely (D-007)"}
        composition: {basis: mole_fraction, values: {N2: 0.7812, O2: 0.2095, AR: 0.0093, H2O: 0.0}, provenance: assumed, source: "scripts/balance.py (D-006)"}
  - id: S3
    title: Combustion air
    from: K101.out
    to: R101.air
    template: air
    state:
      design:
        pressure: {value: 160.0, provenance: assumed, source: "blower discharge (D-010)"}
        temperature: {value: 413.26, provenance: assumed, source: "scripts/balance.py: isentropic efficiency 0.80 (D-010)"}
        phase: {value: vapor, provenance: assumed, source: "dry gas"}
        flow: {value: 107307.4, basis: mass, provenance: calculated, source: 'cheme process propagate: pass-through K101 from S2', fingerprint: 505144e68955192e}
        composition: {basis: mole_fraction, values: {N2: 0.7812, O2: 0.2095, AR: 0.0093, H2O: 0.0}, provenance: calculated, source: 'cheme process propagate: pass-through K101 from S2', fingerprint: 505144e68955192e}
  - id: S4
    title: Molten sulfur
    from: SULFUR.out
    to: R101.sulfur
    template: sulfur
    state:
      design:
        pressure: {value: 600.0, provenance: assumed, source: "sulfur pump discharge to the burner guns (D-003)"}
        temperature: {value: 413.15, provenance: assumed, source: "design basis (D-003)"}
        phase: {value: liquid, provenance: assumed, source: "molten sulfur"}
        flow: {value: 13663.88, basis: mass, provenance: assumed, source: "scripts/balance.py (D-006): 1000 t/d H2SO4 at 99.7 % conversion and 99.9 % absorption"}
        composition: {basis: mole_fraction, values: {S: 1.0}, provenance: assumed, source: "pure sulfur (D-003)"}
  # --- burner gas and converter --------------------------------------------------------------
  - id: S5
    title: Burner gas
    from: R101.out
    to: E101.in
    template: gas
    state:
      design:
        pressure: {value: 156.0, provenance: assumed, source: "pressure profile (D-010)"}
        temperature: {value: 1401.96, provenance: assumed, source: "scripts/balance.py: adiabatic furnace, Cp/R extrapolated above 1000 K (D-006)"}
        phase: {value: vapor, provenance: assumed, source: "gas"}
        flow: {value: 120971.0, provenance: calculated, source: 'cheme process propagate: reactor R101 from S3 S4', fingerprint: a567af369d48b303}
        composition: {basis: mole_fraction, values: {N2: 0.7812, O2: 0.0945001, AR: 0.0093, H2O: 0.0, S: 0.0, SO2: 0.115}, provenance: calculated, source: 'cheme process propagate: reactor R101 from S3 S4', fingerprint: 8042c4fd73b223bd}
  - id: S6
