        composition: {basis: mole_fraction, values: {N2: 0.826339, O2: 0.0421792, AR: 0.00983736, SO2: 0.00608222, SO3: 0.115562, H2O: 0.0, S: 0.0}, provenance: calculated, source: 'cheme process propagate: pass-through E204 from S12', fingerprint: c1c89e169934180a}
  - id: S14
    title: Gas from intermediate absorption
    from: T301.gas_out
    to: E203C.in
    template: gas
