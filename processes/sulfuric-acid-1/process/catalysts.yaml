# Catalysts of the converter beds. Schema: `cheme schema catalysts`. The window is the reaction
# library's (cheme chemistry library sulfuric_acid), a typical range, not vendor data.
schema: cheme/catalysts/v1
kind: catalysts
catalysts:
  - id: V2O5
    name: Vanadium pentoxide on silica (alkali-promoted)
    active_phase: V2O5
    promoters: [K2SO4]
    window:
      temperature: [663.15, 903.15]
      pressure: [100.0, 250.0]
      provenance: assumed
      source: "cheme chemistry library sulfuric_acid (Ullmann's, Sulfuric Acid and Sulfur Trioxide); confirm with the catalyst vendor (D-005)"
    sources:
      - "Ullmann's Encyclopedia of Industrial Chemistry, Sulfuric Acid and Sulfur Trioxide, doi:10.1002/14356007.a25_635"
