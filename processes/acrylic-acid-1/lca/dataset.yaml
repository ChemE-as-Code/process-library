id: acrylic-acid-by-two-stage-propylene-oxidation-12.5-t-h-glacial-acrylic-acid
title: Acrylic acid by two-stage propylene oxidation (12.5 t/h glacial acrylic acid)
description: Unallocated foreground LCI of Acrylic acid by two-stage propylene oxidation (12.5 t/h glacial
  acrylic acid), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Continuous plant: propylene oxidised with air and steam in two multitubular fixed-bed reactors
  (Mo-Bi oxide at 583 K to acrolein, Mo-V oxide at 538 K to acrylic acid), the reaction heat raising HP
  steam through molten salt; the gas quenched and absorbed in water to 55 wt% acrylic acid; the off-gas
  burnt in a catalytic oxidiser; the water removed by azeotropic distillation with toluene at 24 kPa(a),
  acetic acid and toluene in a second vacuum column, glacial acrylic acid distilled at 8 kPa(a) with hydroquinone
  in the columns and 200 ppm MEHQ in the product; 100 kt/a in 8000 h'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: cutoff:pumps-power
  title: Pumps, the absorber's pump-around and the vacuum systems' power
  amount: 500.0
  unit: kWh
  reason: about 500 kW x 8000 h/a (ASSUMED order of magnitude, not sized; D-010); not in the flowsheet's
    power feed
  source: D-010
- key: emission-excluded:fugitive-leaks
  title: equipment-leaks emissions of the plant
  direction: output
  reason: 'fugitive propylene, acrolein, acrylic acid and toluene from flanges, seals and valves are not
    estimated, not claimed negligible: an equipment-leak estimate needs the P&ID component counts, which
    do not exist at the concept stage (D-012)'
- key: emission-excluded:vacuum-vents
  title: effluent emissions of C-401, C-402, C-404
  direction: output
  reason: the vacuum systems of the three columns vent the inhibitor air and leaked air with traces of
    toluene and acids; not quantified (no vacuum system designed); to the oxidiser X-401 in a real plant
    (D-012)
- key: emission-excluded:storage-tanks
  title: storage-tank emissions of the plant
  direction: output
  reason: 'acrylic acid, toluene and crude storage are outside the battery limit or not designed: their
    breathing losses are not estimated (D-012)'
- key: emission-excluded:oxidiser-nox-co
  title: combustion emissions of X-401
  direction: output
  reason: the CO and NOx a catalytic oxidiser forms at 480 to 600 K are not estimated (no open emission
    factor read for it); the flowsheet carries its CO2, water and the 1 % of the organics it does not
    burn (D-011)
- key: emission-excluded:catalyst-change
  title: non-routine emissions of R-101, R-201, X-401
  direction: output
  reason: the Mo-Bi and Mo-V catalysts and the oxidiser's catalyst are replaced every few years; no open
    charge or life figure was read for this design (D-012)
