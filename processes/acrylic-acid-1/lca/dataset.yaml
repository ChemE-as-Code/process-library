      source: 'scripts/allocation_exergy.py: standard chemical exergy of liquid S27 (acrylic acid with
        0.057 wt% acetic acid) from the ideal-gas formation data of process/materials.yaml and Szargut''s
        element exergies (Szargut, Morris and Steward 1988), less the Gibbs energy of condensation at
        298.15 K; MEHQ counted at acrylic acid''s value; physical exergy neglected'
    STMX:
      exergy: 1373.4
      source: 'scripts/allocation_exergy.py: exergy added per kWh of heat raised in the reactors'' salt
        coolers, saturated steam at 2500 kPa(a) from boiler feed water at 378.15 K (ASSUMED), dead state
        298.15 K, 101.325 kPa, IAPWS-95 (thermo)'
  compare:
  - none
  source: 'D-012 (agent proposal, for the LCA practitioner to confirm): the HP steam the reactors raise
    and export is a co-product of acrylic acid. The library allocates exported steam by energy or exergy,
    never by credit (docs/system-model.md section 2); exergy weighs the steam by its work potential and
    the acid by its chemical exergy on one basis, as cumene-1 and methanol-1 do. Acrylic acid carries
    about 84 % of the burdens and the steam about 16 %. The unallocated result is kept in the comparison.'
  deviation: The steam is raised by the reactors' heat, not separated from a joint product; the WBCSD
    price-ratio rule is not applied, as no prices are sourced at the concept stage and the steam is counted
    in kWh. Exergy is the library's rule for exported steam (D-012).
