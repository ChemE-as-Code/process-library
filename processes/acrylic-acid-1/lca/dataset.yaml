modelling:
  principle: attributional
  multifunctionality: 'unallocated multi-output dataset; default allocation exergy: D-012 (agent proposal,
    for the LCA practitioner to confirm): the HP steam the reactors raise and export is a co-product of
    acrylic acid. The library allocates exported steam by energy or exergy, never by credit (docs/system-model.md
    section 2); exergy weighs the steam by its work potential and the acid by its chemical exergy on one
    basis, as cumene-1 and methanol-1 do. Acrylic acid carries about 84 % of the burdens and the steam
    about 16 %. The unallocated result is kept in the comparison.'
