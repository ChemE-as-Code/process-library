# Components and templates of acrylic-acid-1. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
#
# Ideal-gas data printed by `cheme chemistry thermo NAME --fit 298.15,1000` (chemicals 1.5.2 and
# thermo 0.6.1, the method of each value named in its source; single values with their source,
# not open data, library ADR 0037). The reactors' duties (cheme process propagate) use them.
# 4-Methoxyphenol (MEHQ) has no ideal-gas heat capacity in thermo over 298-1000 K: it is dosed
# into the cold product only, where no energy balance needs it. Air is dry air with its argon
# and CO2 lumped into N2 (DESIGN.md D-004). Normal boiling points from the same packages
# (acrylic acid also Arkema's data sheet: 141 C), melting points where they matter.
schema: cheme/process/v1
kind: materials
