# reactors are conversion steps with the key's conversion and selectivities from US 4 873 368 A
# (flowsheet.yaml, DESIGN.md D-005): a conversion model, not kinetics. The by-products are lumped:
# CO, acetaldehyde, formaldehyde, propionic acid and the like are not modelled (D-005, L-1).
