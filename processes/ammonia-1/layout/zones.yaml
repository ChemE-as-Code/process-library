# Zones of the basic 3D layout (D-031). Schema: `cheme schema zones`.
# Screening only: the volumes from sources are sized by cheme-as-code's indicative radius
# table (ASSUMED), not by an area classification. The site's classification (IEC 60079-10-1
# or EI 15 for the flammable gases; a vent study for the CO2 vent) must replace them, made or
# reviewed by a competent person. Crane pads, laydown areas and their reach are ASSUMED
# choices of this design for the lifting study (a 40 m working radius stands for a large
# crawler crane; no crane has been selected, no load chart is given).
schema: cheme/zones/v1
zones:
  # ---- hazardous areas (flammable gas), secondary grade sources: zone 2
  - id: Z-HAZ-K501
    title: "Synthesis gas compressor K-501 and circulator K-502 seals (hydrogen-rich gas)"
    kind: hazardous
    zone: 2
    sources:
      - {item: K-501, release_grade: secondary, substance: hydrogen, source_kind: compressor_seal}
      - {item: K-502, release_grade: secondary, substance: hydrogen, source_kind: compressor_seal}
    basis: "Dry gas or oil seals of hydrogen-rich synthesis gas compressors leak only on failure (secondary grade); D-031."
  - id: Z-HAZ-K701
    title: "Ammonia refrigeration compressor K-701 seals"
    kind: hazardous
    zone: 2
    sources:
      - {item: K-701, release_grade: secondary, substance: ammonia, source_kind: compressor_seal, substance_class: flammable_gas}
    basis: "Ammonia is flammable (narrow range, high ignition energy) and toxic; whether the site's standard classifies an ammonia compressor area is the competent person's decision; drawn as zone 2 here so that the layout keeps ignition sources away until then (D-031)."
  - id: Z-HAZ-NG
    title: "Natural gas desulfuriser V-101 and prereformer R-100 flanges"
    kind: hazardous
    zone: 2
    sources:
      - {item: V-101/N1, release_grade: secondary, substance: natural gas, source_kind: flange}
      - {item: V-101/N2, release_grade: secondary, substance: natural gas, source_kind: flange}
      - {item: R-100/N1, release_grade: secondary, substance: natural gas, source_kind: flange}
    basis: "Flanged connections of hydrogenated natural gas, secondary grade (D-031)."
  # S5r fix (review 2026-10-29-layout#4): the flanged and valved items of the hydrogen-rich
  # synthesis loop, the purge gas recovery and the ammonia product and refrigeration systems
  - id: Z-HAZ-LOOP
    title: "Synthesis loop at about 15 MPa: converter, loop exchangers, separator and let-down vessel"
    kind: hazardous
    zone: 2
    sources:
      - {item: R-501, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: E-501, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: E-502, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: E-503, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: E-504, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: E-505, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: V-501, release_grade: secondary, substance: hydrogen, source_kind: flange}
      - {item: V-502, release_grade: secondary, substance: hydrogen, source_kind: valve}
    basis: "Flanges and valves of hydrogen-rich loop gas (about 63 mol% H2) leak only on failure, secondary grade; V-502 at its let-down valve LV-1907; screening radius of the package table, ASSUMED (D-031)."
  - id: Z-HAZ-PGR
    title: "Purge gas recovery X-601 (NH3 wash, cold box, hydrogen recycle)"
    kind: hazardous
    zone: 2
    sources:
      - {item: X-601, release_grade: secondary, substance: hydrogen, source_kind: flange}
    basis: "Flanged and valved connections of the package handling purge gas and recovered hydrogen, secondary grade, ASSUMED (D-031)."
  - id: Z-HAZ-NH3
    title: "Ammonia product flash drum V-701 and refrigerant condenser E-701"
    kind: hazardous
    zone: 2
    sources:
      - {item: V-701, release_grade: secondary, substance: ammonia, source_kind: flange, substance_class: flammable_gas}
      - {item: E-701, release_grade: secondary, substance: ammonia, source_kind: flange, substance_class: flammable_gas}
    basis: "Ammonia drawn as flammable gas as for Z-HAZ-K701 until the competent person decides; flanges secondary grade (D-031)."
  - id: Z-HAZ-FUEL
    title: "Reformer H-101 fuel natural gas FG-1002 and tail gas FG-1010"
    kind: hazardous
    zone: 2
    sources:
      - {item: H-101/B2, release_grade: secondary, substance: natural gas, source_kind: valve}
      - {item: H-101/B1, release_grade: secondary, substance: hydrogen, source_kind: valve}
    basis: "Flanges and valves of the fuel natural gas FG-1002 (PV-1101, XV-1102) and of the hydrogen- and methane-bearing PGR tail gas FG-1010 (XV-1105) at the burner inlet nozzles B2 and B1, secondary grade; a line source needs an open end, so the nozzles stand for the valve trains until the burner-management package places them; screening radius of the package table, ASSUMED (D-031)."
  # ---- oxygen-deficient zone: the CO2 vent of the regenerator overhead
  - id: Z-O2D-CO2
    title: "CO2 vent (regenerator overhead to atmosphere, CO2-1068) and the CO2 relief outlet (CO2-1076)"
    kind: oxygen_deficient
    sources:
      - {item: CO2-1068, release_grade: continuous, substance: carbon dioxide, source_kind: vent}
      - {item: CO2-1076, release_grade: secondary, substance: carbon dioxide, source_kind: psv_outlet}
    basis: "The CO2 of the aMDEA regenerator is vented (D-009); CO2 is heavier than air and asphyxiant: the vent discharges above the C-302 top platform; the radius is the table's inert-gas value (D-031)."
  # ---- crane pads (where the mobile crane stands) and laydown areas
  - {id: CP-101, title: "Crane pad A-100 south (reactor row)", kind: crane_pad, shape: box, box: [85, 115, 0, 95, 125, 0.3], reach_m: 40, basis: "ASSUMED pad between PR-1 and the reactor row (D-031)."}
  - {id: CP-102, title: "Crane pad A-100 north-west (furnace, R-101)", kind: crane_pad, shape: box, box: [60, 171, 0, 72, 177.5, 0.3], reach_m: 40, basis: "ASSUMED pad north of the radiant box (D-031)."}
  - {id: CP-103, title: "Crane pad A-100 north-east (convection banks, fans, K-101)", kind: crane_pad, shape: box, box: [98, 174, 0, 110, 184, 0.3], reach_m: 40, basis: "ASSUMED pad north of the convection section (D-031)."}
  - {id: CP-201, title: "Crane pad A-200 south (shift row)", kind: crane_pad, shape: box, box: [190, 115, 0, 200, 125, 0.3], reach_m: 40, basis: "ASSUMED pad between PR-1 and the shift row (D-031)."}
  - {id: CP-202, title: "Crane pad A-200 north (columns, solvent loop, X-401)", kind: crane_pad, shape: box, box: [182, 193, 0, 194, 200, 0.3], reach_m: 40, basis: "ASSUMED pad north of the columns, from the north road (D-031)."}
  - {id: CP-501, title: "Crane pad A-500 (compressors)", kind: crane_pad, shape: box, box: [185, 22, 0, 197, 32, 0.3], reach_m: 40, basis: "ASSUMED pad south of K-501 and K-502, from the south road (D-031)."}
  - {id: CP-502, title: "Crane pad A-500 (converter and loop)", kind: crane_pad, shape: box, box: [200, 85, 0, 212, 95, 0.3], reach_m: 40, basis: "ASSUMED pad north of the loop exchangers (D-031)."}
