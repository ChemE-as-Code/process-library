  - {id: CP-503, title: "Crane pad A-500 east (separators, chiller, cold exchangers)", kind: crane_pad, shape: box, box: [253, 74, 0, 260, 84, 0.3], reach_m: 40, basis: "ASSUMED pad on the east edge of A-500, from R-6 (D-031)."}
  - {id: CP-702, title: "Crane pad A-700 north (E-701, V-701)", kind: crane_pad, shape: box, box: [300, 78, 0, 310, 88, 0.3], reach_m: 40, basis: "ASSUMED pad north of E-701 (D-031)."}
  - {id: CP-601, title: "Crane pad A-600 (cold box)", kind: crane_pad, shape: box, box: [95, 70, 0, 107, 80, 0.3], reach_m: 40, basis: "ASSUMED pad north-west of X-601 (D-031)."}
