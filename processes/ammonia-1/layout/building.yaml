# Buildings of the 3D layout. Schema: `cheme schema building`.
# S9 (D-039): the electrical and control building in the reserved area A-900 (D-022); its size,
# position, height and louvres are ASSUMED until the electrical and control room layouts.
schema: cheme/building/v1
buildings:
  - id: ECB-1
    title: Electrical and control building (MV switchgear, MCC, rack room, control room)
    use: substation
    origin: [40, 82]
    width: 36
    depth: 18
    levels:
      - {id: L0, title: Ground floor, elevation: 0.0, height: 5.0}
    walls: all
    openings:
      # outdoor air for the air handling unit AHU-1 (plant room, east end) and its exhaust
      # (sized for the unit's 15,800 m3/h within the package louvre face velocity)
      - {id: LV-IN, kind: louvre, side: east, offset: 7.75, width: 2.5, height: 1.5, sill: 2.5}
      - {id: LV-EX, kind: louvre, side: south, offset: 32.5, width: 2.5, height: 1.5, sill: 2.5}
      # AHU-2 of the switchgear room (west end)
      - {id: LV-IN2, kind: louvre, side: west, offset: 7.75, width: 1.5, height: 1.2, sill: 2.5}
      - {id: LV-EX2, kind: louvre, side: south, offset: 1.0, width: 1.5, height: 1.2, sill: 2.5}
notes: >-
  ASSUMED (D-039): one single-storey building 36 x 18 x 5 m for the 10 kV switchgear, the
  400 V motor control centre, the instrument rack room and the control room, 6 m south of the
  PR-1 strip, so that the room trays reach the rack within one tray span;
  a cable cellar, blast rating and the control room's position relative to the process are for
  the occupied building assessment (API RP 752 type) not done here.
