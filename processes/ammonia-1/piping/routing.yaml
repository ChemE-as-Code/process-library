# Pipe routing intent of the basic 3D layout (D-036). Schema: `cheme schema routing`.
# Router defaults apply where nothing is said here (local_max_m 15, pipe-way 3.5 m, spacing
# 0.1 m, road headroom 6 m: each ASSUMED package value). Battery limit points are ASSUMED
# (D-036): the import lines enter at the west end of PR-1, exports, the flare header and the
# product leave at its east end (the flare, storage and utilities are outside the boundary,
# D-001), the furnace stack and the CO2 vent stack stand next to their sources.
schema: cheme/routing/v1
rules:
  # the CO2 vent and the CO2 relief outlet discharge above every platform near them: their
  # outlets rise until the zone sphere (Z-O2D-CO2) clears the walking levels (D-036)
  vents:
    - {lines: [CO2-1068, CO2-1076], max_rise_m: 20}
  battery_limits:
    - {id: BL-west-imports, lines: [NG-1001, DW-1073, DW-1137], rack: PR-1, rack_end: start}
    - {id: BL-east-exports, lines: [AL-1128, SM-1140, BD-1141], rack: PR-1, rack_end: end}
    - {id: BL-flare, lines: ["FLR-*"], rack: PR-1, rack_end: end}
    - {id: CO2-vent-stack, lines: [CO2-1142], point: [213, 197, 3]}
    # cooling water (S9, D-038): the P-114 headers are a reverse return, supply from the K-101
    # end (west), return leaving past K-701 (east); the cooling water plant is outside the
    # boundary (D-001), its mains meet the headers at the PR-1 ends (ASSUMED)
    - {id: BL-cw-supply, lines: [CWS-1144], rack: PR-1, rack_end: start}
    - {id: BL-cw-return, lines: [CWR-1145], rack: PR-1, rack_end: end}
lines:
