# Line list. Schema: `cheme schema lines`.
# Front end (S3a, sheets P-101 to P-104, D-027). Line number <fluid code>-<serial>; DN from a
# first-pass velocity on the design-case stream (ideal-gas density): process gas and air
# 20 m/s, MP steam 30 m/s, low-pressure air and flue gas ducts 15 m/s, liquids 1.5 m/s
# (ASSUMED velocities, D-027). Ducts above DN 1600 carry an equivalent diameter (no DEXPI DN
# standard). A line drawn on two sheets keeps its number on both (off-page connectors).
schema: cheme/lines/v1
