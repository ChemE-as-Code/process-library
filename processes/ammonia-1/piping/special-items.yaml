# Special piping items: relief devices, silencers. Schema: `cheme schema piping_items`.
# Relief cases from the preliminary relief study safety/relief/relief-study.md (S8, D-033):
# set pressure = design pressure of the protected item (D-032), ASSUMED until the MAWP is known;
# relief_case = the case claimed to govern and its required capacity (design case, kg/h).
# Orifices, inlet and tail pipes are not sized (core v1.0.0 has no relief sizing).
schema: cheme/piping_items/v1
piping_items:
  # Front end (S3a, D-027)
  - {tag: PSV-1212, type: SpringLoadedGlobeSafetyValve, line: PA-1054, sheet: P-103, set_pressure_barg: 38.5,
     relief_case: "Blocked discharge of K-101 (XV-1204 closed, FV-1202 blow-off failed): 67,184 kg/h process air (S13)",
     notes: "Set ASSUMED = K-101 / E-104 design pressure. Falls away if the vendor's maximum discharge pressure stays below 38.5 barg (A12)."}
  - {tag: PSV-1310, type: SpringLoadedGlobeSafetyValve, line: PG-1055, sheet: P-104, set_pressure_barg: 33,
     relief_case: "Blocked outlet of the front end (XV-1604 closed by I-106, or K-501 stopped) with feed, steam and air running: 139,409 kg/h raw synthesis gas (S24)",
     notes: "Set ASSUMED = V-201 design pressure. Fire 6,361 kg/h. Does not protect R-401, E-402, V-401, X-401 (31-32 barg) on a K-501 stop (relief study finding R-1)."}
  # Mid section (S3b, D-028)
  - {tag: PSV-1513, type: SpringLoadedGlobeSafetyValve, line: CO2-1076, sheet: P-106, set_pressure_barg: 2.5,
     relief_case: "Gas blow-by from C-301 through a fully open LV-1405: 355 kg/h per Kv, indicative 127,000 kg/h; not established until LV-1405 is sized (blocked vent 74,528 kg/h as the lower bound)",
     notes: "Set ASSUMED = C-302 design pressure. Also E-202 tube rupture 5,181 kg/h, fire 8,549 kg/h. Hydrogen-rich discharge to atmosphere in the governing case (finding R-2)."}
  - {tag: PSV-1704, type: SpringLoadedGlobeSafetyValve, line: PG-1090, sheet: P-108, set_pressure_barg: 159.5,
     relief_case: "Blocked loop with full make-up (K-502 stopped, dead converter, loop cooling lost): 65,958 kg/h make-up gas (S38)",
     notes: "Set ASSUMED = K-501 design pressure, below every loop item, so it also takes the loop's make-up case."}
  # Loop and utilities (S3c, D-029)
  - {tag: PSV-1911, type: SpringLoadedGlobeSafetyValve, line: PG-1119, sheet: P-110, set_pressure_barg: 161,
     relief_case: "External fire on V-501 (1.35/2.21 MW drained/undrained); rate not established: relieving pressure above the ammonia critical pressure, transient method needed",
     notes: "Set ASSUMED = V-501 design pressure. The make-up case is relieved by PSV-1704 (lower set, no block valve between)."}
  - {tag: PSV-1912, type: SpringLoadedGlobeSafetyValve, line: PG-1120, sheet: P-110, set_pressure_barg: 26.5,
     relief_case: "Gas blow-by from V-501 through a fully open LV-1903: 1,566 kg/h per Kv, indicative 16,000 kg/h; not established until LV-1903 is sized",
     notes: "Set ASSUMED = V-502 design pressure. PV-1906 closed 997 kg/h, fire 8,697 kg/h."}
  - {tag: PSV-2010, type: SpringLoadedGlobeSafetyValve, line: AG-1134, sheet: P-111, set_pressure_barg: 26.5,
     relief_case: "External fire on V-701: 10,014 kg/h ammonia vapour (undrained; 6,101 kg/h drained)",
     notes: "Set ASSUMED = V-701 design pressure. Blow-by through LV-1907 and blocked flash gas removed by rating (source V-502 at 23.7 barg), to be confirmed (A30)."}
  - {tag: PSV-2210, type: SpringLoadedGlobeSafetyValve, line: SM-1143, sheet: P-113, set_pressure_barg: 49.5,
     relief_case: "Process steam blocked (FV-1006 closed) at full steam raising: 92,834 kg/h MP steam (S6)",
     notes: "Set ASSUMED = U-801 design pressure. Export blocked 60,099 kg/h. E-502 tube rupture (17,725 kg/h loop gas) is not a case for this atmospheric valve (finding R-4)."}
