# Simulation specs. Schema: `cheme schema process-simulation`.
# Not a simulation model yet (no simulator, no property package: core #315, D-006). It only
# records which reactors are adiabatic, so the LCA's boundary check knows that they exchange
# no heat with a utility (their duty is zero by design; scripts/plant_balance.py solves their
# outlet temperatures adiabatically). The primary reformer R101 is fired (energy stream Q9).
schema: cheme/simulation/v1
kind: simulation
specs:
  R100: {mode: adiabatic}
  R102A: {mode: adiabatic}
  R102B: {mode: adiabatic}
  R201: {mode: adiabatic}
  R202: {mode: adiabatic}
  R401: {mode: adiabatic}
  R501: {mode: adiabatic}
