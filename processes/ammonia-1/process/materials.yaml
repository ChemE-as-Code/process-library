templates:
  # One component set for every process stream, from the natural gas to the product (D-006):
  # sulfur compounds are a trace removed by the desulfuriser and not balanced (D-004).
  - {id: process, title: "Natural gas, synthesis gas, flue gas and ammonia", components: [CH4, C2H6, C3H8, CO2, N2, H2, CO, H2O, O2, AR, NH3]}
  - {id: water, title: Water and steam, components: [H2O]}
# property_method is a placeholder until `cheme process props --fill` records the method: its
# benchmarked property package, package versions and application range. Packages:
# air-pr-chemsep (N2/O2/Ar, 77-315 K, vapour 100-3200 kPa(a), liquid and two-phase 100-600
# kPa(a)) and syngas-pr-vapor (H2/N2/Ar/CH4/CO/CO2 mixtures and pure NH3, vapour only, in
# benchmarked temperature-pressure boxes). `cheme process props --coverage` shows which applies
# to each stream; `package: <id>` here chooses one.
property_method:
  adapter: thermo
  status: placeholder
