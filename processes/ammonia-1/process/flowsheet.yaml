# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Natural-gas ammonia plant, 1500 t/d NH3 (D-001, D-002). Where the values come from:
# - feeds, temperatures, pressures, split and purge fractions: design choices of DESIGN.md,
#   ASSUMED, with the values solved by scripts/plant_balance.py (D-006);
# - reactor outlets (prereformer, reformers, shifts, methanator, converter, furnace) are
#   calculated by cheme (`cheme process propagate --fill`) from the reactions and the outlet
#   temperatures, and so are the flows and compositions through pass-through steps, mixers
#   and splitters;
# - separator, CO2 removal, purge recovery and steam-system outlets, the outlets of the
#   two-stream exchangers and every duty come from scripts/plant_balance.py, given here as
#   ASSUMED: core cannot yet qualify flashes, enthalpies or absorption for syngas with ammonia
#   and water (core #315).
schema: cheme/process/v1
kind: flowsheet
title: Ammonia from natural gas, 1500 t/d (steam reforming, air-fed secondary reformer, Haber-Bosch loop)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 1500 t/d contained NH3 as refrigerated liquid, ASSUMED benchmark natural gas (D-004)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: NG, title: Natural gas (feed and fuel), category: raw_material, ports: [{id: out, direction: out}]}
  - id: AIR
    title: Ambient air (process air and combustion air)
    category: raw_material
    ports: [{id: proc, direction: out}, {id: comb, direction: out}]
  - id: DMW
    title: Demineralised water make-up
    category: raw_material
    ports: [{id: stm, direction: out}, {id: co2r, direction: out}]
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: k101, direction: out, kind: energy}
      - {id: k102, direction: out, kind: energy}
      - {id: k103, direction: out, kind: energy}
      - {id: c301, direction: out, kind: energy}
      - {id: k501, direction: out, kind: energy}
      - {id: k502, direction: out, kind: energy}
      - {id: k701, direction: out, kind: energy}
      - {id: p801, direction: out, kind: energy}
products:
  - {id: NH3, title: "Liquid ammonia product (refrigerated, to the battery limit)", category: product, ports: [{id: in, direction: in}]}
  - {id: CO2V, title: "Process CO2 from the regenerator, vented", category: emission, ports: [{id: in, direction: in}]}
  - {id: STACK, title: Reformer furnace flue gas to stack, category: emission, ports: [{id: in, direction: in}]}
  - {id: STEAM, title: "MP steam export (4600 kPa(a), 673 K)", category: by_product, ports: [{id: in, direction: in}]}
  - {id: BD, title: Boiler blowdown, category: wastewater, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-012"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-012"}
      min_approach: {value: 5, provenance: assumed, source: D-012}
    ports:
      - {id: k101, direction: in, kind: energy}
      - {id: e203, direction: in, kind: energy}
      - {id: c301, direction: in, kind: energy}
      - {id: e402, direction: in, kind: energy}
      - {id: k501, direction: in, kind: energy}
      - {id: e503, direction: in, kind: energy}
      - {id: k701, direction: in, kind: energy}

blocks:
  - id: REF
    title: Desulfurisation, reforming and reformer furnace
    class: ReactingChemicals
    ports:
      - {id: ng, direction: in}
      - {id: air_p, direction: in}
      - {id: air_c, direction: in}
      - {id: steam, direction: in}
      - {id: tail, direction: in}
      - {id: gas, direction: out}
      - {id: flue, direction: out}
      - {id: power1, direction: in, kind: energy}
      - {id: power2, direction: in, kind: energy}
      - {id: power3, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: stm1, direction: out, kind: energy}
      - {id: stm2, direction: out, kind: energy}
  - id: SHF
    title: CO shift and process gas cooling
    class: ReactingChemicals
    ports:
      - {id: gas_in, direction: in}
      - {id: gas, direction: out}
      - {id: cond, direction: out}
      - {id: stm, direction: out, kind: energy}
      - {id: met, direction: out, kind: energy}
      - {id: regen, direction: out, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: CO2R
    title: CO2 removal (activated MDEA)
    class: Absorbing
    ports:
      - {id: gas_in, direction: in}
      - {id: water, direction: in}
      - {id: gas, direction: out}
      - {id: co2, direction: out}
      - {id: heat, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: MET
    title: Methanation and drying
    class: ReactingChemicals
    ports:
      - {id: gas_in, direction: in}
      - {id: gas, direction: out}
      - {id: cond, direction: out}
      - {id: water, direction: out}
      - {id: heat, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: SYN
    title: Compression, ammonia synthesis loop, product flash and refrigeration
    class: ReactingChemicals
    ports:
      - {id: mu, direction: in}
      - {id: h2, direction: in}
      - {id: nh3rec, direction: in}
      - {id: product, direction: out}
      - {id: purge, direction: out}
      - {id: ldgas, direction: out}
      - {id: vent, direction: out}
      - {id: power1, direction: in, kind: energy}
      - {id: power2, direction: in, kind: energy}
      - {id: power3, direction: in, kind: energy}
      - {id: ref, direction: in, kind: energy}
      - {id: stm, direction: out, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: cw3, direction: out, kind: energy}
  - id: PGR
    title: Purge gas recovery (NH3 wash, cryogenic hydrogen recovery)
    class: SeparatingByPhysicalProcess
    ports:
      - {id: purge, direction: in}
      - {id: ldgas, direction: in}
      - {id: vent, direction: in}
      - {id: h2, direction: out}
      - {id: nh3, direction: out}
      - {id: tail, direction: out}
      - {id: lp, direction: in, kind: energy}
      - {id: ref, direction: out, kind: energy}
  - id: STM
    title: Steam system (boiler feed water, steam drums, superheating, let-down)
    class: ProcessStep
    ports:
      - {id: dmw, direction: in}
      - {id: cond1, direction: in}
      - {id: cond2, direction: in}
      - {id: cond3, direction: in}
      - {id: steam, direction: out}
      - {id: export, direction: out}
      - {id: bd, direction: out}
      - {id: h1, direction: in, kind: energy}
      - {id: h2, direction: in, kind: energy}
      - {id: h3, direction: in, kind: energy}
      - {id: h4, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: lp, direction: out, kind: energy}

steps:
  # ---- REF: natural gas, desulfurisation, reforming (D-004, D-005, D-007)
  - {id: SPL101, block: REF, title: Feed / fuel gas split, class: SplittingMaterial, split: {fuel: 0.2175884},
     ports: [{id: in, direction: in, delegates: ng}, {id: proc, direction: out}, {id: fuel, direction: out}]}
  - {id: E101, block: REF, title: Natural gas preheat coil (convection), class: ExchangingThermalEnergy, links: [{target: equipment, ref: E-101}],
     ports: [{id: in, direction: in}, {id: out, direction: out}, {id: heat, direction: in, kind: energy}]}
  - {id: D101, block: REF, title: Desulfuriser (hydrogenation and ZnO), class: Adsorbing, links: [{target: equipment, ref: D-101}],
     ports: [{id: in, direction: in}, {id: out, direction: out}]}
  - {id: M101, block: REF, title: Process steam addition, class: Mixing,
     ports: [{id: ng, direction: in}, {id: steam, direction: in, delegates: steam}, {id: out, direction: out}]}
  - {id: E102, block: REF, title: Mixed feed preheat coil (convection), class: ExchangingThermalEnergy, links: [{target: equipment, ref: E-102}],
     ports: [{id: in, direction: in}, {id: out, direction: out}, {id: heat, direction: in, kind: energy}]}
  - {id: R100, block: REF, title: Adiabatic prereformer, class: ReactingChemicals, reactions: [C2H6_REF, C3H8_REF], reactor: conversion,
     links: [{target: equipment, ref: R-100}], ports: [{id: in, direction: in}, {id: out, direction: out}]}
  - {id: E103, block: REF, title: Prereformed gas reheat coil (convection), class: ExchangingThermalEnergy, links: [{target: equipment, ref: E-103}],
     ports: [{id: in, direction: in}, {id: out, direction: out}, {id: heat, direction: in, kind: energy}]}
  # D-005: tube outlet at SMR and WGS equilibrium evaluated 10 K colder (approach -10, ASSUMED)
  - {id: R101, block: REF, title: Primary reformer (catalyst tubes), class: ReactingChemicals, reactions: [SMR, WGS], reactor: equilibrium,
     approach: -10, links: [{target: equipment, ref: R-101}],
     ports: [{id: in, direction: in}, {id: out, direction: out}, {id: heat, direction: in, kind: energy}]}
  - {id: K101, block: REF, title: "Process air compressor (4 stages, intercooled)", class: Compressing, method: CentrifugalMotion,
     links: [{target: equipment, ref: K-101}],
     ports: [{id: in, direction: in, delegates: air_p}, {id: out, direction: out}, {id: power, direction: in, kind: energy, delegates: power1},
             {id: cw, direction: out, kind: energy, delegates: cw}]}
  - {id: E104, block: REF, title: Process air preheat coil (convection), class: ExchangingThermalEnergy, links: [{target: equipment, ref: E-104}],
     ports: [{id: in, direction: in}, {id: out, direction: out}, {id: heat, direction: in, kind: energy}]}
  - {id: M103, block: REF, title: Secondary reformer burner (gas and air mixing), class: Mixing, links: [{target: equipment, ref: R-102}],
     ports: [{id: ref, direction: in}, {id: air, direction: in}, {id: out, direction: out}]}
  - {id: R102A, block: REF, title: Secondary reformer combustion zone, class: ReactingChemicals, reactions: [H2_OX], reactor: conversion,
     links: [{target: equipment, ref: R-102}], ports: [{id: in, direction: in}, {id: out, direction: out}]}
  - {id: R102B, block: REF, title: Secondary reformer catalyst bed, class: ReactingChemicals, reactions: [SMR, WGS], reactor: equilibrium,
     approach: -10, links: [{target: equipment, ref: R-102}], ports: [{id: in, direction: in}, {id: out, direction: out}]}
  - {id: E105, block: REF, title: Secondary reformer waste heat boiler, class: Cooling, links: [{target: equipment, ref: E-105}],
     ports: [{id: in, direction: in}, {id: out, direction: out, delegates: gas}, {id: stm, direction: out, kind: energy, delegates: stm2}]}
  # ---- REF: reformer furnace (D-014)
  - {id: K102, block: REF, title: Combustion air FD fan, class: Compressing, links: [{target: equipment, ref: K-102}],
     ports: [{id: in, direction: in, delegates: air_c}, {id: out, direction: out}, {id: power, direction: in, kind: energy, delegates: power2}]}
  - {id: E106, block: REF, title: Combustion air preheater (flue gas), class: ExchangingThermalEnergy, links: [{target: equipment, ref: E-106}],
     ports: [{id: in, direction: in}, {id: out, direction: out}, {id: heat, direction: in, kind: energy}]}
  - {id: M102, block: REF, title: Burner fuel and air, class: Mixing,
     ports: [{id: ng, direction: in}, {id: tail, direction: in, delegates: tail}, {id: air, direction: in}, {id: out, direction: out}]}
  - {id: H101, block: REF, title: Reformer furnace radiant section (combustion), class: ReactingChemicals,
     reactions: [CH4_COMB, C2H6_COMB, C3H8_COMB, H2_COMB, NH3_COMB], reactor: conversion, links: [{target: equipment, ref: H-101}],
     ports: [{id: in, direction: in}, {id: out, direction: out}, {id: rad, direction: out, kind: energy}]}
  - id: H102
    block: REF
    title: Reformer furnace convection section
    class: Cooling
    links: [{target: equipment, ref: H-101}, {target: equipment, ref: E-107}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: e101, direction: out, kind: energy}
      - {id: e102, direction: out, kind: energy}
      - {id: e103, direction: out, kind: energy}
      - {id: e104, direction: out, kind: energy}
      - {id: e106, direction: out, kind: energy}
      - {id: stm, direction: out, kind: energy, delegates: stm1}
  - {id: K103, block: REF, title: Flue gas ID fan, class: Compressing, links: [{target: equipment, ref: K-103}],
     ports: [{id: in, direction: in}, {id: out, direction: out, delegates: flue}, {id: power, direction: in, kind: energy, delegates: power3}]}

  # ---- SHF: shift and gas cooling (D-008, D-009)
  - {id: R201, block: SHF, title: High-temperature shift converter, class: ReactingChemicals, reactions: [WGS], reactor: equilibrium, approach: 10,
     links: [{target: equipment, ref: R-201}], ports: [{id: in, direction: in, delegates: gas_in}, {id: out, direction: out}]}
  - {id: E201, block: SHF, title: HTS effluent cooler (steam / methanator feed heat), class: Cooling, links: [{target: equipment, ref: E-201}],
     ports: [{id: in, direction: in}, {id: out, direction: out}, {id: stm, direction: out, kind: energy, delegates: stm},
             {id: met, direction: out, kind: energy, delegates: met}]}
  - {id: R202, block: SHF, title: Low-temperature shift converter, class: ReactingChemicals, reactions: [WGS], reactor: equilibrium, approach: 10,
     links: [{target: equipment, ref: R-202}], ports: [{id: in, direction: in}, {id: out, direction: out}]}
  - {id: E202, block: SHF, title: CO2 regenerator process-gas reboiler, class: Cooling, links: [{target: equipment, ref: E-202}],
     ports: [{id: in, direction: in}, {id: out, direction: out}, {id: regen, direction: out, kind: energy, delegates: regen}]}
  - {id: E203, block: SHF, title: Process gas final cooler, class: Cooling, links: [{target: equipment, ref: E-203}],
     ports: [{id: in, direction: in}, {id: out, direction: out}, {id: cw, direction: out, kind: energy, delegates: cw}]}
  - {id: V201, block: SHF, title: Process condensate separator, class: SeparatingByFlash, links: [{target: equipment, ref: V-201}],
     ports: [{id: in, direction: in}, {id: gas, direction: out, delegates: gas}, {id: liq, direction: out, delegates: cond}]}

  # ---- CO2R (D-009)
  - id: C301
    block: CO2R
    title: CO2 absorber and regenerator (aMDEA)
    class: Absorbing
    links: [{target: equipment, ref: C-301}, {target: equipment, ref: C-302}]
    ports:
      - {id: gas_in, direction: in, delegates: gas_in}
      - {id: water, direction: in, delegates: water}
      - {id: gas, direction: out, delegates: gas}
      - {id: co2, direction: out, delegates: co2}
      - {id: heat, direction: in, kind: energy, delegates: heat}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: cw, direction: out, kind: energy, delegates: cw}

  # ---- MET (D-010)
  - {id: E401, block: MET, title: Methanator feed heater, class: ExchangingThermalEnergy, links: [{target: equipment, ref: E-401}],
     ports: [{id: in, direction: in, delegates: gas_in}, {id: out, direction: out}, {id: heat, direction: in, kind: energy, delegates: heat}]}
  - {id: R401, block: MET, title: Methanator, class: ReactingChemicals, reactions: [METH_CO, METH_CO2], reactor: conversion,
     links: [{target: equipment, ref: R-401}], ports: [{id: in, direction: in}, {id: out, direction: out}]}
  - {id: E402, block: MET, title: Methanator effluent cooler, class: Cooling, links: [{target: equipment, ref: E-402}],
     ports: [{id: in, direction: in}, {id: out, direction: out}, {id: cw, direction: out, kind: energy, delegates: cw}]}
  - {id: V401, block: MET, title: Synthesis gas knock-out drum, class: SeparatingByFlash, links: [{target: equipment, ref: V-401}],
     ports: [{id: in, direction: in}, {id: gas, direction: out}, {id: liq, direction: out, delegates: cond}]}
  - {id: X401, block: MET, title: Molecular sieve dryer, class: Adsorbing, links: [{target: equipment, ref: X-401}],
     ports: [{id: in, direction: in}, {id: gas, direction: out, delegates: gas}, {id: water, direction: out, delegates: water}]}

  # ---- SYN (D-011, D-017)
  - {id: M501, block: SYN, title: Make-up gas / recovered hydrogen junction, class: Mixing,
     ports: [{id: mu, direction: in, delegates: mu}, {id: h2, direction: in, delegates: h2}, {id: out, direction: out}]}
  - {id: K501, block: SYN, title: "Synthesis gas compressor (3 stages, intercooled)", class: Compressing, method: CentrifugalMotion,
     links: [{target: equipment, ref: K-501}],
     ports: [{id: in, direction: in}, {id: out, direction: out}, {id: power, direction: in, kind: energy, delegates: power1},
             {id: cw, direction: out, kind: energy, delegates: cw1}]}
  - {id: M502, block: SYN, title: Make-up / recycle junction, class: Mixing,
     ports: [{id: mu, direction: in}, {id: rec, direction: in}, {id: out, direction: out}]}
  - {id: K502, block: SYN, title: Recycle circulator, class: Compressing, method: CentrifugalMotion, links: [{target: equipment, ref: K-502}],
     ports: [{id: in, direction: in}, {id: out, direction: out}, {id: power, direction: in, kind: energy, delegates: power2}]}
  - {id: E501, block: SYN, title: Converter feed/effluent exchanger, class: ExchangingThermalEnergy, links: [{target: equipment, ref: E-501}],
     ports: [{id: cold_in, direction: in}, {id: cold_out, direction: out}, {id: hot_in, direction: in}, {id: hot_out, direction: out}]}
  # D-011: outlet of the last bed at NH3 equilibrium 15 K hotter (approach, ASSUMED), Peng-Robinson fugacity
  - {id: R501, block: SYN, title: "Ammonia converter (three adiabatic beds, interbed exchange)", class: ReactingChemicals, reactions: [NH3_SYN],
     reactor: equilibrium, approach: 15, fugacity: peng_robinson, links: [{target: equipment, ref: R-501}],
     ports: [{id: in, direction: in}, {id: out, direction: out}]}
  - {id: E502, block: SYN, title: Converter effluent waste heat boiler, class: Cooling, links: [{target: equipment, ref: E-502}],
     ports: [{id: in, direction: in}, {id: out, direction: out}, {id: stm, direction: out, kind: energy, delegates: stm}]}
  - {id: E503, block: SYN, title: Loop water cooler, class: Cooling, links: [{target: equipment, ref: E-503}],
     ports: [{id: in, direction: in}, {id: out, direction: out}, {id: cw, direction: out, kind: energy, delegates: cw2}]}
  - {id: E505, block: SYN, title: Cold exchanger (recycle gas / chiller feed), class: ExchangingThermalEnergy, links: [{target: equipment, ref: E-505}],
     ports: [{id: cold_in, direction: in}, {id: cold_out, direction: out}, {id: hot_in, direction: in}, {id: hot_out, direction: out}]}
  - {id: E504, block: SYN, title: Ammonia chiller, class: Cooling, links: [{target: equipment, ref: E-504}],
     ports: [{id: in, direction: in}, {id: out, direction: out}, {id: ref, direction: out, kind: energy}]}
  - {id: V501, block: SYN, title: Ammonia separator, class: SeparatingByFlash, links: [{target: equipment, ref: V-501}],
     ports: [{id: in, direction: in}, {id: vap, direction: out}, {id: liq, direction: out}]}
  - {id: SPL501, block: SYN, title: Purge take-off, class: SplittingMaterial, split: {purge: 0.00736974},
     ports: [{id: in, direction: in}, {id: purge, direction: out, delegates: purge}, {id: rec, direction: out}]}
  - {id: V502, block: SYN, title: Let-down vessel, class: SeparatingByFlash, links: [{target: equipment, ref: V-502}],
     ports: [{id: in, direction: in}, {id: gas, direction: out, delegates: ldgas}, {id: liq, direction: out}]}
  - {id: V701, block: SYN, title: Product flash drum and refrigeration inert vent, class: SeparatingByFlash, links: [{target: equipment, ref: V-701}],
     ports: [{id: in, direction: in}, {id: liq, direction: out}, {id: vent, direction: out, delegates: vent},
             {id: ref, direction: out, kind: energy}]}
  - {id: M701, block: SYN, title: Product junction, class: Mixing,
     ports: [{id: main, direction: in}, {id: rec, direction: in, delegates: nh3rec}, {id: out, direction: out, delegates: product}]}
  - id: K701
    block: SYN
    title: Ammonia refrigeration compressor and condenser
    class: Compressing
    links: [{target: equipment, ref: K-701}, {target: equipment, ref: E-701}]
    ports:
      - {id: chiller, direction: in, kind: energy}
      - {id: product, direction: in, kind: energy}
      - {id: hru, direction: in, kind: energy, delegates: ref}
      - {id: power, direction: in, kind: energy, delegates: power3}
      - {id: cw, direction: out, kind: energy, delegates: cw3}

  # ---- PGR (D-013)
  - {id: M601, block: PGR, title: "Purge, let-down gas and vent collection", class: Mixing,
     ports: [{id: purge, direction: in, delegates: purge}, {id: ld, direction: in, delegates: ldgas}, {id: vent, direction: in, delegates: vent},
             {id: out, direction: out}]}
  - id: X601
    block: PGR
    title: Purge gas recovery unit (NH3 wash and distillation, cryogenic H2 recovery)
    class: SeparatingByPhysicalProcess
    links: [{target: equipment, ref: X-601}]
    ports:
      - {id: in, direction: in}
      - {id: h2, direction: out, delegates: h2}
      - {id: nh3, direction: out, delegates: nh3}
      - {id: tail, direction: out, delegates: tail}
      - {id: lp, direction: in, kind: energy, delegates: lp}
      - {id: ref, direction: out, kind: energy, delegates: ref}

  # ---- STM (D-015)
  - id: U801
    block: STM
    title: Steam system (BFW pumps, deaerator, steam drums, superheater, let-down)
    class: ProcessStep
    links: [{target: equipment, ref: U-801}, {target: equipment, ref: P-801}]
    ports:
      - {id: dmw, direction: in, delegates: dmw}
      - {id: cond1, direction: in, delegates: cond1}
      - {id: cond2, direction: in, delegates: cond2}
      - {id: cond3, direction: in, delegates: cond3}
      - {id: steam, direction: out, delegates: steam}
      - {id: export, direction: out, delegates: export}
      - {id: bd, direction: out, delegates: bd}
      - {id: h1, direction: in, kind: energy, delegates: h1}
      - {id: h2, direction: in, kind: energy, delegates: h2}
      - {id: h3, direction: in, kind: energy, delegates: h3}
      - {id: h4, direction: in, kind: energy, delegates: h4}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: lp, direction: out, kind: energy, delegates: lp}

streams:
  # ---- REF
  - id: S1
    title: Natural gas from the battery limit
    from: NG.out
    to: SPL101.in
    template: process
    state:
      design:
        pressure: {value: 4500, provenance: assumed, source: "design basis, D-004"}
