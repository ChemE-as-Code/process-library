# Process Atlas manifest of ammonia-1. Schema: schemas/process.schema.json (cheme-as-code/process/v1).
# plant.yaml stays the engineering manifest; sheets and results are derived from the
# ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: ammonia-1
title: Ammonia from natural gas (1500 t/d, steam reforming with air-fed secondary reformer, Haber-Bosch loop)
summary: >-
  Conventional natural-gas ammonia plant: desulfurisation, prereforming, fired primary and
  air-blown secondary reforming, HT/LT shift, aMDEA CO2 removal (CO2 vented), methanation,
  drying, a 150 bar synthesis loop with refrigeration and purge recovery, to refrigerated
  liquid ammonia. Concept stage, assumed basis, preliminary gate-to-gate LCI.
description: |
  Natural gas (an assumed benchmark lean gas) is desulfurised, mixed with steam (steam to
  carbon 3.0) and reformed in a prereformer, a fired primary reformer and an air-blown
  secondary reformer whose process air brings the nitrogen for a 3:1 H2/N2 synthesis gas.
  High- and low-temperature shift convert the CO; the CO2 is absorbed in activated MDEA and
  vented; methanation removes the last carbon oxides and molecular sieves dry the gas. The
  synthesis gas is compressed to about 150 bar and converted on promoted iron in a three-bed
  converter; ammonia condenses against cooling water and refrigeration, the purge and flash
  gases pass an NH3 wash and cryogenic hydrogen recovery, and the tail gas fuels the reformer.
  Waste heat raises MP steam for the process and for export; all machines are electric.

  The reactors are equilibrium (reformers, shifts, converter with Peng-Robinson fugacity) or
  complete-conversion models calculated by cheme; separators, CO2 removal, purge recovery,
  steam system and duties come from an independent balance script whose property methods are
  not qualified by ChemE-as-Code for these mixtures. All values are concept
  estimates; see DESIGN.md of the engineering files.
families: [ammonia]
keywords: [ammonia, Haber-Bosch, steam methane reforming, secondary reformer, water-gas shift, aMDEA, CO2 removal, methanation, synthesis loop, purge gas recovery, refrigeration, natural gas]
facets:
  feedstock_basis: [fossil, atmospheric, water]
  product_classes: [fertilizers, chemicals]
  unit_operations: [reaction, compression, heat-exchange, absorption, adsorption, flash, refrigeration]
  region: EU
# Honest claim: concept. The feed composition is assumed (no sourced or owner-given feed), and
# the separators, CO2 removal, purge recovery and the steam system are specified values from
# an unqualified script; see validation.notes and DESIGN.md D-006.
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD with closed mass, component and element balances on every block and step
    (cheme validate, cheme process streams). Reactor outlets are calculated by cheme
    (equilibrium and conversion models from its reaction library); the separators, CO2
    removal, purge recovery, steam system and all duties are specified values from
    scripts/plant_balance.py (ideal-gas enthalpies, thermo Peng-Robinson flash with ChemSep
    kij, IAPWS-IF97 steam) that core cannot qualify for syngas/ammonia/water mixtures.
    Energy closure is not evaluable in core. The feeds are a representative
    specification approved by the owner for this paper case study (S5c, I-006, D-040): a
    published typical pipeline gas (Enbridge), NASA dry air, IAPWS make-up water. Not reviewed. The chemicals
    registry has no natural-gas, ethane or propane entry yet, so the feed is listed through its
    nearest registry entries (open library item).
    `cheme maturity` reaches calculation maturity balanced (S5c, D-040; predictive fails on the
    excluded steps, specified splits and the property claim); concept is the lowest manifest
    value (DESIGN.md D-019). The LCA result is gate-to-gate direct fossil CO2
    only, not a carbon footprint: every background is still a gap (D-020).
chemistry:
  inputs:
    - {chemical: methane, role: feedstock, inventory_key: "feed:NG", note: "Natural gas (94.7 mol% CH4, plus ethane, propane, CO2, N2; representative pipeline gas, D-040), feed and furnace fuel. The registry has no natural-gas entry yet"}
    - {chemical: air, role: feedstock, inventory_key: "feed:AIR", note: "Process air (nitrogen source, secondary reformer) and combustion air"}
    - {chemical: water, role: feedstock, inventory_key: "feed:DMW", note: "Demineralised water make-up to the steam system and the CO2 removal"}
  outputs:
    - {chemical: ammonia, role: main-product, note: "Liquid ammonia, refrigerated, to the battery limit (product:NH3)"}
    - {chemical: carbon-dioxide, role: emission, inventory_key: "product:CO2V", note: "Process CO2 from the aMDEA regenerator, vented (no CCS, no urea)"}
    - {chemical: carbon-dioxide, role: emission, inventory_key: "product:STACK", note: "Combustion CO2 in the reformer furnace flue gas"}
    - {chemical: steam, role: co-product, inventory_key: "product:STEAM", note: "MP steam export 4600 kPa(a), 673 K"}
    - {chemical: wastewater, role: waste, inventory_key: "product:BD", note: "Boiler blowdown"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "All compressors, fans and pumps (ASSUMED electric drives)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "25/35 C (ASSUMED)"}
basis:
