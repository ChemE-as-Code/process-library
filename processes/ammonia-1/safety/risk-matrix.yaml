# Project risk matrix of ammonia-1 (S5c, DESIGN.md D-042): an ASSUMED 5x5 matrix for this paper
# case study, written in our own words. It is not a company's risk criteria.
# Schema: cheme schema risk-matrix. Bands: lowest risk first (that list is the band order).
#
# Form: the industry practice of a 5x5 risk assessment matrix with consequence categories for
# people, assets, environment and reputation and five likelihood levels A to E, each band with
# its management action (e.g. Sakhalin Energy, Managing Risk Standard, document
# 0000-S-90-04-O-0006-00-E Appendix 5 Revision 07, Risk Assessment Matrix Specification, p. 1
# (purpose and axes) and p. 8 (likelihood scale and the meaning of the bands)).
# Quantification (ASSUMED, ours): the likelihood levels are order-of-magnitude frequencies per
# year of the scenario at this plant, so that one credited independent protection layer with a
# probability of failure on demand of 0.1 or lower (the upper edge of SIL 1, IEC 61511-1:2016,
# Table 4) lowers a scenario by exactly one level, the credit rule of the HAZOP's
# assessment_basis. The codes A-D and 1-4 keep the meaning the example matrix gave them, so the
# HAZOP's proposed ratings stay valid; E and 5 are added at the top.
schema: cheme/risk-matrix/v1
kind: risk-matrix
id: ammonia-1-5x5
title: Project risk matrix ammonia-1, 5x5 (ASSUMED for the paper case study)
example: false
status: accepted
accepted_by: "owner (I-006, 2026-10-30), assumed for the paper case"
source: >-
  ASSUMED project matrix (D-042) following the published industry practice of a 5x5 risk
  assessment matrix with people, asset, environment and reputation categories and likelihood
  levels A-E (Sakhalin Energy, Managing Risk Standard 0000-S-90-04-O-0006-00-E Appendix 5 Rev 07,
  pp. 1 and 8); order-of-magnitude frequency levels so that one IPL of PFD <= 0.1 (IEC 61511-1:2016
  Table 4, SIL 1) lowers one level
bands:
  - {id: low, title: Low, description: "Acceptable: manage for continuous improvement; no further action needed"}
  - {id: medium, title: Medium, description: "Tolerable: reduce as low as reasonably practicable (ALARP) with the existing safeguards; review when the design changes"}
  - {id: high, title: High, description: "Not tolerable without action: add or upgrade safeguards and document the ALARP demonstration (bow-tie or LOPA)", requires_action: true}
  - {id: very_high, title: Very high, description: "Intolerable: redesign or add independent safeguards before operation; the design may not proceed with the scenario in this band", requires_action: true}
likelihood:  # least likely first; frequency of the scenario per year at this plant (ASSUMED)
  - {code: A, title: Remote, description: "Below 1e-3 per year: not expected in the life of the plant (25 years)"}
  - {code: B, title: Unlikely, description: "1e-3 to 1e-2 per year: could happen in the industry, unlikely in the life of the plant"}
  - {code: C, title: Possible, description: "1e-2 to 1e-1 per year: could happen once or a few times in the life of the plant (e.g. the failure of a single control loop)"}
  - {code: D, title: Likely, description: "1e-1 to 1 per year: expected several times in the life of the plant"}
  - {code: E, title: Frequent, description: "1 per year or more often"}
severity:  # least severe first
  - code: "1"
    title: Minor
    descriptions: {people: "First aid case", environment: "Release contained on site, no lasting effect", asset: "Damage repaired within a shift, production loss under one day", reputation: "No public awareness"}
  - code: "2"
    title: Moderate
    descriptions: {people: "Medical treatment or restricted work case", environment: "Minor release off site or a reportable exceedance, no lasting effect", asset: "Plant down for days", reputation: "Local public concern or local media"}
  - code: "3"
    title: Serious
    descriptions: {people: "Lost-time injury", environment: "Reportable release off site with short-term effects", asset: "Plant down for weeks", reputation: "Regional or national media attention"}
  - code: "4"
    title: Major
    descriptions: {people: "Permanent injury or a single fatality", environment: "Lasting damage off site needing remediation", asset: "Loss of a unit, plant down for months", reputation: "National media, regulator action"}
  - code: "5"
    title: Catastrophic
    descriptions: {people: "Multiple fatalities, or a fatality off site", environment: "Major lasting damage off site", asset: "Loss of the plant", reputation: "International media, licence to operate at stake"}
categories:
  - {id: people, title: People}
  - {id: environment, title: Environment}
  - id: asset
    title: Asset
    cells:  # the asset category's own cells (one level more lenient at the top)
      "1": {A: low, B: low, C: low, D: low, E: medium}
      "2": {A: low, B: low, C: low, D: medium, E: medium}
      "3": {A: low, B: low, C: medium, D: high, E: high}
      "4": {A: low, B: medium, C: high, D: high, E: very_high}
      "5": {A: medium, B: high, C: high, D: very_high, E: very_high}
  - id: reputation
    title: Reputation
    cells:  # as the asset category
      "1": {A: low, B: low, C: low, D: low, E: medium}
      "2": {A: low, B: low, C: low, D: medium, E: medium}
      "3": {A: low, B: low, C: medium, D: high, E: high}
      "4": {A: low, B: medium, C: high, D: high, E: very_high}
      "5": {A: medium, B: high, C: high, D: very_high, E: very_high}
cells:  # severity -> likelihood -> band, for people and environment
  "1": {A: low, B: low, C: low, D: medium, E: medium}
  "2": {A: low, B: low, C: medium, D: medium, E: high}
  "3": {A: low, B: medium, C: high, D: high, E: very_high}
  "4": {A: medium, B: high, C: very_high, D: very_high, E: very_high}
  "5": {A: high, B: very_high, C: very_high, D: very_high, E: very_high}
notes: >-
  Replaces the package example example-4x4 (S5c, owner's decision I-006). Compared with the
  example, the bands of the codes the HAZOP uses stay the same except two cells that are now
  stricter: people/environment 4 at C (high -> very high) and 4 at D. The criteria are ASSUMED for
  the paper case study; a real project replaces them with the owner's procedure.
