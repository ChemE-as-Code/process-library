actions:
  - {id: A2, text: "Determine the required integrity (SIL by LOPA or risk graph) of I-101 to I-107 and of every trip added by these actions, and confirm the independence of their logic solver from the BPCS. Carried: SIL determination needs failure data and the project's tolerable risk, which are not in the repository; C&E sil fields stay empty until then.", owner: functional safety engineer (by detail engineering in S9), status: proposed, by: agent}
  - {id: A3, text: "Consider a low steam to carbon ratio trip (FZ-1007 against an independent gas flow measurement) in addition to the absolute low-low steam trip I-101, or a high gas flow trip. Carried: the control valves are not sized, so the capacity margin of FV-1006 is not known.", owner: process / control engineer (next P&ID revision), status: proposed, by: agent}
  - {id: A4, text: "Protect the MP steam header against back flow of natural gas through SM-1005: confirm whether the single check valve CV1005 is enough, or add a trip valve on SM-1005 closing on low steam to process differential pressure, together with XV-1001. Carried: a P&ID change for the team to decide.", owner: process engineer (next P&ID revision), status: proposed, by: agent}
  - {id: A5, text: "Give AI-1005 a high sulphur alarm and consider a lead-lag arrangement of the ZnO beds (two vessels) so that a saturated bed can be changed on line. Carried: the feed sulphur is not sourced (R-03), the bed life cannot be estimated yet.", owner: process engineer (next P&ID revision), status: proposed, by: agent}
  - {id: A6, text: "Specify the burner management system of H-101 (flame detection, purge, low fuel pressure, low combustion air and high fuel pressure trips, fuel/air cross-limiting) and show its trips in the C&E. Carried: furnace package scope, open in D-030; needs the burner vendor.", owner: furnace vendor / control engineer (by detail engineering in S9), status: proposed, by: agent}
  - {id: A7, text: "Add R-101 tube skin temperature measurement and an independent high-high reformer outlet temperature trip on the firing, separate from TIC-1103. Carried: open in D-030; needs the tube design temperature from the furnace vendor.", owner: furnace vendor / process engineer (next P&ID revision), status: proposed, by: agent}
  - {id: A8, text: "Decide the trip philosophy between firing and process flow: trip (or reduce) the firing on loss of process flow through R-101 (S6, S11), and whether I-102 also trips the feed (S9, C&E note on I-102). Carried: a C&E change for the team.", owner: process engineer (next C&E revision), status: proposed, by: agent}
  - {id: A9, text: "Add a steam drum low-low level trip (independent transmitter) and decide its effects (front-end shutdown, firing trip), and a spare P-801 with auto-start. Carried: open in D-029 and D-030; changes the equipment list and P-113.", owner: process engineer (next P&ID revision), status: proposed, by: agent}
  - {id: A10, text: "Close XV-1204 (and stop the air admission) on a K-101 trip or a process air low-low flow, independently of FIC-1201, to stop back flow of process gas into the air line; consider a vent between two valves. Carried: a C&E and P&ID change for the team.", owner: control engineer (next C&E revision), status: proposed, by: agent}
  - {id: A11, text: "S8 relief study: PSV-1212 for K-101 against a closed XV-1204 (I-103) with the anti-surge blow-off failed; set pressure against the design pressure of PA-1022. Carried to S8 (relief), where the relief cases are calculated.", owner: relief study (S8), status: proposed, by: agent}
  - {id: A12, text: "Ask the K-101 vendor for the machine protection (surge detection and trip, vibration, axial position) inside the package and add its trips to the C&E. Carried: vendor scope, not drawn.", owner: machinery engineer / K-101 vendor (by detail engineering in S9), status: proposed, by: agent}
  - {id: A13, text: "Consider shell skin temperature monitoring of R-102 (refractory failure) and confirm the integrity required of I-103 (with A2). Carried: needs the vessel design.", owner: process engineer (by detail engineering in S9), status: proposed, by: agent}
  - {id: A14, text: "Protect the U-801 condensate stripper against gas blow-by from V-201 (PC-1048) and V-401 (PC-1083): an independent low-low level trip on V-201 closing a separate valve, and a relief case on the receiving side for a fully open LV-1307 / LV-1609. Carried: U-801 internals are not drawn; changes the C&E and P-104.", owner: process engineer / relief study (S8) (next C&E revision and S8), status: proposed, by: agent}
  - {id: A15, text: "Decide whether I-104 (V-201 high-high) must trip the feed or remain an alarm (C&E note); give LZ-1308 an operator response in control/loops.yaml. Carried: the C&E leaves it to the HAZOP team.", owner: process engineer (next C&E revision), status: proposed, by: agent}
  - {id: A16, text: "Define the front-end response to I-106 and to a K-501 trip: a front-end vent to flare with pressure control (not drawn, D-030), whether I-106 also trips the feed, the air and K-501, and the depressuring of the methanator. Carried: needs the front-end vent drawn and sized (S8).", owner: process engineer (next P&ID revision and S8), status: proposed, by: agent}
  - {id: A17, text: "Set the front-end design pressure against the natural gas supply pressure (about 4500 kPa(a), D-027) and the K-101 shut-off pressure; where it is lower, the blocked-outlet relief case of PSV-1310 (or more devices) governs. Carried to S8; design pressures are not set yet.", owner: process engineer / relief study (S8), status: proposed, by: agent}
  - {id: A18, text: "S8 relief study: PSV-1513 on C-302 for gas blow-by through a fully open LV-1405 and for a blocked CO2 vent (PV-1505 closed); confirm the fail position of PV-1505. Carried to S8.", owner: relief study (S8), status: proposed, by: agent}
  - {id: A19, text: "Write the start-up procedure for the timed bypasses of I-105 and I-107 (who authorises, how LV-1405 / LV-1903 are kept closed until a level is made) and show the bypass status in the control room. Carried: procedures are written for commissioning.", owner: operations (before commissioning), status: proposed, by: agent}
  - {id: A20, text: "Add a high level alarm to LIC-1405 (C-301 sump). Carried: a control/loops.yaml change.", owner: control engineer (next control revision), status: proposed, by: agent}
  - {id: A21, text: "Auto-start of the spare lean solvent pump P-301B on a trip of P-301A, and a CO2 slip high alarm on AI-1403. Carried: a control change for the team.", owner: control engineer (next control revision), status: proposed, by: agent}
  - {id: A22, text: "Dispersion study of the CO2 vents CO2-1068 and CO2-1076 (outlet height, location, worst-case composition with gas blow-by); confirm the zones of layout/zones.yaml. Carried: needs the vent outlet design and a dispersion tool not in this repository.", owner: process safety engineer (by detail engineering in S9), status: proposed, by: agent}
  - {id: A23, text: "Add minimum-flow protection of the reflux pumps P-302A/B (minimum-flow line or low-low level trip of the pumps). Carried: open in control/loops.yaml.", owner: process engineer (next P&ID revision), status: proposed, by: agent}
  - {id: A24, text: "Ask the X-401 package vendor for the regeneration protection (moisture high alarm and switching interlocks) and add a moisture high alarm on AI-1610. Carried: package scope.", owner: X-401 vendor / control engineer (by detail engineering in S9), status: proposed, by: agent}
  - {id: A25, text: "Protect the K-501 suction side against back flow from the loop: a second, different non-return device or a discharge trip valve closing on a K-501 trip, and confirm the suction-side design pressure (settle-out pressure). Carried: a P&ID and C&E change for the team; design pressures not set.", owner: process engineer / machinery engineer (next P&ID revision), status: proposed, by: agent}
  - {id: A26, text: "Define the loop pressure protection: a high loop pressure alarm and trip of the make-up (K-501) on K-502 trip or a dead converter, and the S8 relief cases of PSV-1911 and PSV-1704 (blocked loop with full make-up). Carried: no loop pressure control (D-030); relief cases to S8.", owner: process engineer / relief study (S8) (next C&E revision and S8), status: proposed, by: agent}
  - {id: A27, text: "Add a converter high-high bed temperature trip on independent thermocouples (tripping the make-up and opening TV-1803) and decide the operating limit of the R-501 shell against hydrogen attack. Carried: left to the HAZOP in D-029; needs the converter vendor.", owner: process engineer / converter vendor (next C&E revision), status: proposed, by: agent}
  - {id: A28, text: "S8 relief study: PSV-1912 on V-502 for gas blow-by from V-501 through a fully open LV-1903 (C&E note on I-107) and for PV-1906 closed. Carried to S8.", owner: relief study (S8), status: proposed, by: agent}
  - {id: A29, text: "Add a V-501 high-high level protection of K-502 (independent sensor tripping the circulator or opening the let-down). Carried: a C&E change for the team.", owner: control engineer (next C&E revision), status: proposed, by: agent}
  - {id: A30, text: "Protect V-701 against gas blow-by from V-502: a V-502 low-low level trip on an independent sensor closing a separate valve in AL-1114, and the S8 relief case of PSV-2010 for a fully open LV-1907. Carried: C&E change and S8.", owner: process engineer / relief study (S8) (next C&E revision and S8), status: proposed, by: agent}
  - {id: A31, text: "Tube rupture of E-504: relief on the refrigerant side of E-504 (or a design pressure of the refrigerant side that makes it unnecessary) and the S8 relief case. Carried to S8; nothing is drawn on the refrigerant side.", owner: relief study (S8), status: proposed, by: agent}
  - {id: A32, text: "Ask the K-701 package vendor for the refrigeration-side relief devices and high discharge pressure trip, and add them to the C&E and special-items list. Carried: package scope.", owner: K-701 vendor / machinery engineer (by detail engineering in S9), status: proposed, by: agent}
  - {id: A33, text: "Agree the product temperature and pressure limits at the storage interface; give TI-2002 a high alarm. Carried: storage is outside the battery limit.", owner: process engineer / storage owner (by detail engineering in S9), status: proposed, by: agent}
  - {id: A34, text: "Flare system study: whether the ammonia reliefs (PSV-2010, PSV-1912) need a separate cold or ammonia flare header, the minimum design temperature of FLR-1146, and the header back pressure in the governing common-cause case (power and cooling water failure). Carried to S8.", owner: relief study (S8), status: proposed, by: agent}
  - {id: A35, text: "Replace the single-element steam drum level control by a three-element control (steam and feed water flows) and add a high-high level protection of the superheater and process steam. Carried: open in D-029 and D-030.", owner: control engineer (next control revision), status: proposed, by: agent}
  - {id: A36, text: "S8 relief study: PSV-2210 for the full MP steam raising with the export blocked, and the steam drum relief inside U-801. Carried to S8.", owner: relief study (S8), status: proposed, by: agent}
  - {id: A37, text: "Give PI-2302 a low cooling water pressure alarm and define the automatic plant response to a cooling water failure (which machines trip). Carried: control/philosophy.md F-CW relies on the operator.", owner: control engineer (next control revision), status: proposed, by: agent}
  - {id: A39, text: "Confirm the design pressure of the lean solvent suction side (AM-1058, E-301 lean side) against the C-301 pressure, or protect it against back flow through a stopped P-301A/B by more than one swing check valve (a second non-return device or a discharge valve closing on the pump stop). Carried: design pressures are not set yet.", owner: process engineer (next P&ID revision), status: proposed, by: agent}
  - {id: A40, text: "Check the fail positions of control/loops.yaml as one set for a plant-wide instrument air failure (which relief devices are demanded together, which machines must trip on low instrument air pressure) and state the air receiver hold-up time. Carried: the instrument air system is not drawn.", owner: control engineer (next control revision), status: proposed, by: agent}
  - {id: A41, text: "Thermal relief of the cooling water side of the coolers that can be blocked in (or a rule that the cooling water control valves sit on the inlet and the isolation is locked open), as a relief case for S8. Carried to S8; block valves are not drawn yet.", owner: relief study (S8), status: proposed, by: agent}
  - {id: A38, text: "Detect process leaks into the cooling water return (ammonia or conductivity analyser on CWR-1145, or on the returns of E-503 and E-701). Carried: a P&ID change for the team.", owner: process engineer (next P&ID revision), status: proposed, by: agent}
  - {id: A42, text: "Tube rupture of E-202 (S65): set the design pressure of the E-202 aMDEA side, AM-1050, AM-1051 and C-302 against the process gas side (about 3200 kPa(a)), or add the E-202 tube rupture as a relief case of PSV-1513 (or a relief device on the E-202 shell) and size it. Carried to S8; design pressures are not set yet.", owner: relief study (S8), status: proposed, by: agent}
  - {id: A43, text: "Tube rupture of E-203 (S66): state the cooling water design and operating pressure, then decide whether the E-203 water side and CWR-1053 are designed for the process gas side (about 3150 kPa(a)) or need a relief device and a tube-rupture relief case. Carried to S8; the cooling water pressure is not stated in the repository.", owner: relief study (S8), status: proposed, by: agent}
  - {id: A44, text: "Tube rupture of E-402 (S67): as A43 for the E-402 water side and CWR-1086 against the methanator effluent (about 2950 kPa(a), hydrogen-rich). Carried to S8.", owner: relief study (S8), status: proposed, by: agent}
  - {id: A45, text: "Tube rupture of E-502 (S68): a tube-rupture relief case for the steam side (E-502 shell, BW-1100, SM-1101, the U-801 steam drum) against loop gas at about 15,100 kPa(a), with a relief device that does not discharge hydrogen and ammonia to atmosphere at a steam outlet, or a design pressure of the steam side that makes it unnecessary; and detection of loop gas in the steam (e.g. a conductivity or ammonia analyser on the drum blowdown) so that the boiler is isolated before the steam goes to the process and the export. Carried to S8 and the next P&ID revision.", owner: relief study (S8) / process engineer (next P&ID revision), status: proposed, by: agent}
  - {id: A46, text: "Tube rupture of E-503 (S69): a tube-rupture relief case and relief device on the E-503 cooling water side against loop gas at about 14,900 kPa(a) (a design pressure covering the loop pressure is unlikely for a cooling water circuit, but S8 decides), with its discharge routed away from the cooling water return. Carried to S8; the cooling water pressure is not stated.", owner: relief study (S8), status: proposed, by: agent}
  - {id: A47, text: "Tube rupture of E-701 (S70): as A43 for the E-701 water side and CWR-1131 against condensing ammonia (about 1555 kPa(a)); include the refrigerant inventory that can drain into the cooling water. Carried to S8.", owner: relief study (S8), status: proposed, by: agent}
