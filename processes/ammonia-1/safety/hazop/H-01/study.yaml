# HAZOP study H-01: a DRAFT until the team has accepted every entry and a
# human review record covers it (cheme safety hazop check). Schema: cheme schema
# hazop-study; workflow: safety/README.md and the skill hazop-study.
# Everything below was drafted by an agent (S6 of runs/plan.md, D-031) from the P&IDs, the C&E,
# the control loops and the special-items list as analysed: every node, scenario, rating,
# safeguard and action is a PROPOSAL (status: proposed, by: agent) for a HAZOP team to take,
# change or reject. No team has met; nothing here is a team finding.
schema: cheme/hazop-study/v1
kind: hazop-study
id: H-01
title: Ammonia plant, basic engineering HAZOP of P-101 to P-114
scope: >-
  The whole battery limit as drawn on the basic-engineering P&IDs P-101 to P-114 (natural gas
  feed and desulphurisation, prereforming, primary reformer furnace and convection section,
  process air compressor, secondary reformer, waste heat boilers, HT and LT shift, process
  condensate separator, aMDEA CO2 removal, methanation and drying, synthesis gas compressor,
  synthesis loop, refrigeration and product flash, purge gas recovery package, steam system,
  cooling water and flare headers), with the trips of control/cause-effect.yaml (I-101 to
  I-107), the alarms and fail positions of control/loops.yaml and the relief devices of
  piping/special-items.yaml. Not covered: the inside of the vendor packages drawn as one symbol
  (K-101, K-501, K-502 and K-701 machine protection, seal and lube oil; X-401 regeneration;
  X-601 internals; U-801 deaerator, condensate stripper and steam drum internals; H-101 burner
  management), which need their own package HAZOPs; the items the P&IDs do not draw yet (D-027
  to D-030: start-up nitrogen, catalyst reduction, converter start-up heater, front-end vent to
  flare, vents, drains, sample points, block and bypass valves); the ammonia storage, the
  cooling tower, the flare and everything else beyond the battery limit; external hazards,
  occupied buildings, and the relief loads and set pressures (S8). Design pressures and
  temperatures are not set yet, so every overpressure consequence is judged against the
  operating pressures of the flowsheet, not against a design rating.
modes:
  - {id: normal, title: Normal operation, description: The design case of process/flowsheet.yaml at full load.}
  - {id: startup, title: Start-up, description: "SEQ-START-REF, SEQ-START-CO2R and SEQ-START-SYN of control/sequences.yaml, including the timed bypasses of I-105 and I-107."}
  - {id: shutdown, title: Shutdown and trip, description: "SEQ-SD-PLANT and SEQ-TRIP-FE, and the plant after a trip of I-101 to I-107 or a machine."}
