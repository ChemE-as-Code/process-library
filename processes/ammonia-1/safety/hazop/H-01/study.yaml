risk_matrix: safety/risk-matrix.yaml
assessment_basis: >-
  Rated against safety/risk-matrix.yaml, the project matrix ammonia-1-5x5 (S5c, D-042): an
  ASSUMED 5x5 matrix accepted by the owner for the paper case study (I-006, 2026-10-30), not a
  company's risk criteria. Its codes A-D and 1-4 keep the meaning of the example-4x4 the codes
  were first proposed against; its likelihood levels are order-of-magnitude frequencies per year,
  so the credit rule below lowers a scenario by one decade per credited trip. Each scenario is rated per category (people, environment, asset) before its
  safeguards (initial): severity is the credible worst outcome of the consequence in the words
  of the matrix's severity descriptions; likelihood is a qualitative judgement of how often the
  cause occurs, in the words of the matrix's likelihood descriptions (a single control loop or
  control valve failing: C, several times in the life of the plant; a single machine trip or a
  utility interruption: C or D; a tube rupture or a mechanical failure of a check valve: B).
  No frequency, failure rate or probability of failure on demand was calculated or taken from a
  source. A residual rating is proposed only where a safeguard is independent of the cause over
  its whole chain as far as the P&ID shows (its own sensor and its own final element: the trips
  I-101, I-102, I-103, I-105, I-106 and I-107 against a failure of the regulatory loop they back up),
  and its basis names it; alarms acting through the operator, the control loop whose failure is
  the cause, check valves and relief devices without a relief case (S8) are listed as
  safeguards but not credited in a residual rating. Credit rule, applied to every residual row:
  one credited independent trip lowers the likelihood by one code and never more, the severity
  is kept, until A2 has set an integrity level for each trip and the team decides the credit a
  trip of that level earns. Logic-solver independence and the integrity level of every trip are
  open (action A2). All codes are agent proposals for the team.
team: []            # no team has met: the study is an agent draft (D-031)
notes: >-
  Open for the whole study, not for one scenario (carried, owner: project HSE lead, before the
  HAZOP sessions): (1) done in S5c: the example matrix is replaced by the owner-accepted, ASSUMED
  project matrix ammonia-1-5x5 (D-042) and the bands re-rated (cheme safety hazop rate H-01
  --write); a real project replaces it with the owner's procedure. (2) Convene
  the HAZOP team (facilitator, process, control, machinery, operations, process safety), record
  it under team: and take or change every proposal; the agent draft is a preparation, not the
  study. (3) Hold package HAZOPs for K-101, K-501, K-502, K-701, X-401, X-601, U-801 and the
  H-101 burner management (outside this scope).
nodes:
  # ------------------------------------------------------------------ P-101
  - id: N1
    title: Natural gas feed, desulphuriser V-101, process steam addition and prereformer R-100 (P-101)
    design_intent: >-
      Take natural gas from the battery limit (NG-1001) at the plant load set by FIC-1002
      (29,508 kg/h process gas in the design case), desulphurise it in V-101 at about 643 K and
      4400 kPa(a) (total sulphur after V-101 on AI-1005), mix it with MP steam from SM-1005 at
      the steam to carbon ratio of FIC-1006 (3.146 kg steam per kg gas) and prereform it in
      R-100 (inlet about 773 K) to the reheat coil E-103; a branch FG-1002 takes fuel gas to the
      burners of H-101.
    members: [NG-1001, NG-1004, SM-1005, FG-1002, PG-1007, V-101, R-100, XV-1001, FV-1002, FV-1006, FIC-1002, FIC-1006, FZ-1007, US-1001, AI-1005, PDI-1004, PDI-1009, TI-1003, TI-1008, TI-1010, PI-1001]
    modes: [normal, startup, shutdown]
    status: proposed
    by: agent
    deviations:
      - id: N1-LS
        guide_word: less
        parameter: flow (process steam)
        scenarios:
          - id: S1
            cause: "FIC-1006 fails low or FV-1006 sticks closed (it fails open on air or signal loss), or the MP header pressure PIC-2203 falls; the steam to carbon ratio drops while the gas flow continues."
            consequence: Carbon forms on the prereformer R-100 and primary reformer R-101 catalysts; R-101 tubes develop hot bands and can fail by overheating; catalyst replacement.
            refs: [FIC-1006, FV-1006, SM-1005, R-100, R-101, PIC-2203]
            safeguards: [SG1, SG2, SG5]
            modes: [normal, startup]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "3", likelihood: C, basis: "A tube failing in the firebox releases hot process gas that burns inside H-101; a lost-time injury to a person at the peepholes is credible (matrix 3). A single loop failure: C.", status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: ammonia-1-5x5 (safety/risk-matrix.yaml)', fingerprint: 42163393695fd8bf, inputs: {matrix: a0967b2b314ebc90, category: people, severity: '3', likelihood: C}}}
                - {category: asset, severity: "4", likelihood: C, basis: "Carbon on both reforming catalysts and failed R-101 tubes: loss of the reforming section for a long period (matrix 4, loss of the unit). C as above.", status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: ammonia-1-5x5 (safety/risk-matrix.yaml)', fingerprint: 4d22c28d4d99d68b, inputs: {matrix: a0967b2b314ebc90, category: asset, severity: '4', likelihood: C}}}
              residual:
                - {category: people, severity: "3", likelihood: B, basis: "Credits I-101 (SG1): FZ-1007 is its own flow measurement, not FIC-1006, and it closes XV-1001, which is not the control valve FV-1002. Not credited: the FAL alarm of FIC-1006 (same loop). Likelihood one code lower for one independent trip (the credit rule of assessment_basis, an agent proposal; no team has met); integrity not set (A2).", status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: ammonia-1-5x5 (safety/risk-matrix.yaml)', fingerprint: 657604de62b02b3d, inputs: {matrix: a0967b2b314ebc90, category: people, severity: '3', likelihood: B}}}
                - {category: asset, severity: "4", likelihood: B, basis: "As for people: I-101 credited, alarms not. With one trip of unknown integrity the asset band stays medium.", status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: ammonia-1-5x5 (safety/risk-matrix.yaml)', fingerprint: 352eccc1f67a7f72, inputs: {matrix: a0967b2b314ebc90, category: asset, severity: '4', likelihood: B}}}
          - id: S2
            cause: "The gas flow rises above the steam the ratio can deliver: FIC-1002 fails high or FV-1002 sticks open, and FV-1006 reaches its full opening; the steam flow stays above the I-101 low-low point."
            consequence: The steam to carbon ratio falls below its design value without any trip, because I-101 acts on the absolute steam flow and not on the ratio; carbon formation on R-100 and R-101 as in S1, and overload of the front end.
            refs: [FIC-1002, FV-1002, FIC-1006, FZ-1007]
            safeguards: [SG2, SG3]
            actions: [A3]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "4", likelihood: C, basis: "As S1: loss of the reforming catalysts and tubes (matrix 4); control loop failure C.", status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: ammonia-1-5x5 (safety/risk-matrix.yaml)', fingerprint: 4d22c28d4d99d68b, inputs: {matrix: a0967b2b314ebc90, category: asset, severity: '4', likelihood: C}}}
            notes: "Whether FV-1006 has enough capacity margin to follow the ratio up to the full opening of FV-1002 is not known (control valves not sized)."
      - id: N1-RS
        guide_word: reverse
        parameter: flow (process steam)
        scenarios:
          - id: S3
            cause: "The MP steam header pressure falls below the process pressure at the mixing point (PIC-2203 or PV-2203 failure, P-801 trip, loss of steam raising) while natural gas is still fed."
            consequence: Natural gas flows back through SM-1005 into the MP steam header and on to the export and the LP users; flammable gas in steam lines and at the PSV-2210 outlet to atmosphere; fire or explosion at a release point.
            refs: [SM-1005, PIC-2203, SM-1140, PSV-2210]
            safeguards: [SG4, SG5, SG1]
            actions: [A4]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "4", likelihood: B, basis: "Flammable gas leaving at an atmospheric steam outlet where no gas is expected: fatality credible (matrix 4). Needs the header to fall below the gas pressure: B.", status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: ammonia-1-5x5 (safety/risk-matrix.yaml)', fingerprint: 19a559886278ba93, inputs: {matrix: a0967b2b314ebc90, category: people, severity: '4', likelihood: B}}}
            notes: "A single swing check valve (CV1005) is the only barrier drawn; its credit against a reverse flow of flammable gas is for the team. I-101 also acts, but only once the steam flow is already low-low."
      - id: N1-OC
        guide_word: other-than
        parameter: composition (sulphur after V-101)
        scenarios:
          - id: S4
            cause: "The ZnO bed of V-101 is saturated, or the feed sulphur rises above the design (feed gas composition not sourced, R-03 of the 2026-10-27 review)."
            consequence: Sulphur reaches the prereformer, reformer and LT shift nickel and copper catalysts and poisons them; methane slip rises; early catalyst replacement.
            refs: [V-101, AI-1005, R-100, R-101, R-202]
            safeguards: [SG6]
            actions: [A5]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: C, basis: "Catalyst replacement of R-100 and partial loss of R-101 activity: weeks down (matrix 3). Bed saturation is expected several times in the plant life: C.", status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: ammonia-1-5x5 (safety/risk-matrix.yaml)', fingerprint: 8578250e11610887, inputs: {matrix: a0967b2b314ebc90, category: asset, severity: '3', likelihood: C}}}
      - id: N1-MP
        guide_word: more
        parameter: pressure
        notes: "Covered in N6 (S21): the front end is one pressure system from XV-1001 to XV-1604, fed at the natural gas supply pressure; a blocked outlet there is its governing overpressure cause."
  # ------------------------------------------------------------------ P-102 firing
  - id: N2
    title: Reformer furnace H-101 firing, combustion air and flue gas (P-102)
    design_intent: >-
      Fire the radiant box of H-101 with natural gas (FG-1002 through XV-1102 and PV-1101) and
      tail gas from X-601 (FG-1010 through XV-1105) at the fuel pressure PIC-1101, reset by the
      reformer outlet temperature TIC-1103 (1083 K), with combustion air from K-102 through E-106
      on FIC-1110 trimmed to 1.69 mol% O2 by AIC-1109, and a balanced draft of about -25 Pa(g) at
      the arch held by PIC-1107 on the ID fan K-103.
    members: [H-101, R-101, K-102, K-103, E-106, FG-1002, FG-1010, CA-1013, FL-1021, XV-1102, XV-1105, PV-1101, FV-1108, PIC-1101, TIC-1103, PZ-1108, US-1102, US-1105, PIC-1107, AIC-1109, FIC-1110, FI-1104, TI-1106, TI-1111, TI-1112]
    modes: [normal, startup, shutdown]
    status: proposed
    by: agent
    deviations:
      - id: N2-MT
        guide_word: more
        parameter: temperature (R-101 tubes)
        scenarios:
          - id: S5
            cause: "TIC-1103 fails low or its thermocouple reads low (or PIC-1101 fails, PV-1101 sticks open); the fuel pressure rises and H-101 is over-fired."
            consequence: R-101 tube walls exceed their design temperature; creep damage and rupture of several tubes; process gas burns in the firebox.
            refs: [TIC-1103, PIC-1101, PV-1101, R-101, H-101]
            safeguards: [SG7, SG8]
            actions: [A6, A7]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "3", likelihood: C, basis: "Tube rupture inside the firebox: flames and hot gas at peepholes and the arch; lost-time injury credible (matrix 3); cascade loop failure: C.", status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: ammonia-1-5x5 (safety/risk-matrix.yaml)', fingerprint: 42163393695fd8bf, inputs: {matrix: a0967b2b314ebc90, category: people, severity: '3', likelihood: C}}}
                - {category: asset, severity: "4", likelihood: C, basis: "Over-firing damages many tubes at once: loss of the reformer for months (matrix 4).", status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: ammonia-1-5x5 (safety/risk-matrix.yaml)', fingerprint: 4d22c28d4d99d68b, inputs: {matrix: a0967b2b314ebc90, category: asset, severity: '4', likelihood: C}}}
            notes: "TIC-1103 TAH is part of the loop that causes the deviation and is not credited. No tube skin temperature measurement and no independent high-temperature trip are drawn (D-030 open)."
          - id: S6
            cause: "XV-1001 closes (I-101, or spuriously) or the process flow through R-101 is lost otherwise, while the burners stay lit; I-101 keeps the steam on, but a loss of both feed and steam (S1 with FV-1006 closed and the header down) leaves the tubes without flow."
            consequence: R-101 tubes without process flow are heated by the full firing; overheating and rupture within minutes.
            refs: [XV-1001, FV-1006, R-101, H-101, XV-1102, XV-1105]
            safeguards: [SG1]
            actions: [A8]
            modes: [normal, shutdown]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "4", likelihood: B, basis: "Loss of many tubes (matrix 4); requires the loss of steam as well as feed: B.", status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: ammonia-1-5x5 (safety/risk-matrix.yaml)', fingerprint: 352eccc1f67a7f72, inputs: {matrix: a0967b2b314ebc90, category: asset, severity: '4', likelihood: B}}}
            notes: "I-101 does not reduce the firing and I-102 does not act on process flow (C&E). The C&E note on I-102 asks whether a loss of firing must also trip the feed; this scenario asks the converse."
      - id: N2-LF
        guide_word: less
        parameter: flow (combustion air) / draft
        scenarios:
          - id: S7
            cause: "The ID fan K-103 trips or its inlet damper closes; PIC-1107 holds the last speed (fail position) and the furnace goes to positive pressure."
            consequence: Hot flue gas and flames leave the furnace at peepholes and openings; burns to people on the burner platforms; incomplete combustion.
            refs: [K-103, PIC-1107, PZ-1108, H-101]
            safeguards: [SG9, SG10]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "3", likelihood: C, basis: "Burns at the peepholes (matrix 3, lost-time injury); fan trips several times in the plant life: C.", status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: ammonia-1-5x5 (safety/risk-matrix.yaml)', fingerprint: 42163393695fd8bf, inputs: {matrix: a0967b2b314ebc90, category: people, severity: '3', likelihood: C}}}
              residual:
                - {category: people, severity: "3", likelihood: B, basis: "Credits I-102 (SG10): PZ-1108 is its own pressure transmitter, not PIC-1107, and it closes XV-1102 and XV-1105, not the control valve PV-1101. The PAH alarm (SG9) is not credited.", status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: ammonia-1-5x5 (safety/risk-matrix.yaml)', fingerprint: 657604de62b02b3d, inputs: {matrix: a0967b2b314ebc90, category: people, severity: '3', likelihood: B}}}
          - id: S8
            cause: "The FD fan K-102 trips or the damper FV-1108 closes (it fails open), or the burners lose their flame on low fuel pressure, while fuel still flows."
            consequence: Unburnt fuel accumulates in the firebox and in the convection section; an explosion when air returns or on relighting.
            refs: [K-102, FV-1108, FIC-1110, AIC-1109, PIC-1101, H-101]
            safeguards: [SG11, SG10]
            actions: [A6]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: people, severity: "4", likelihood: C, basis: "Firebox explosion with people on the platforms: fatality credible (matrix 4); fan trip or flame loss: C.", status: proposed, by: agent, band: {value: very_high, provenance: calculated, source: 'cheme safety hazop rate: ammonia-1-5x5 (safety/risk-matrix.yaml)', fingerprint: e7250ddce0704f4e, inputs: {matrix: a0967b2b314ebc90, category: people, severity: '4', likelihood: C}}}
                - {category: asset, severity: "4", likelihood: C, basis: "Furnace explosion: loss of the unit (matrix 4).", status: proposed, by: agent, band: {value: high, provenance: calculated, source: 'cheme safety hazop rate: ammonia-1-5x5 (safety/risk-matrix.yaml)', fingerprint: 4d22c28d4d99d68b, inputs: {matrix: a0967b2b314ebc90, category: asset, severity: '4', likelihood: C}}}
            notes: "I-102 acts only if the furnace pressure rises; a loss of combustion air with the ID fan running lowers it. Flame detection, low-air and low-fuel-pressure trips belong to the burner management system, which is not drawn (D-030)."
      - id: N2-LT
        guide_word: less
        parameter: temperature (reformer outlet)
        scenarios:
          - id: S9
            cause: "I-102 trips the firing (XV-1102, XV-1105) while the feed gas, steam and process air continue."
            consequence: R-101 outlet cools quickly, methane slip rises; R-102 receives more methane with the same air and its outlet temperature rises (I-103); more inerts reach the loop.
            refs: [XV-1102, XV-1105, R-101, R-102, TZ-1205, AI-1208]
            safeguards: [SG12]
            actions: [A8]
            modes: [shutdown]
            status: proposed
            by: agent
            risk:
              initial:
                - {category: asset, severity: "3", likelihood: C, basis: "Secondary reformer over-temperature and catalyst damage: weeks down (matrix 3); every I-102 trip: C.", status: proposed, by: agent, band: {value: medium, provenance: calculated, source: 'cheme safety hazop rate: ammonia-1-5x5 (safety/risk-matrix.yaml)', fingerprint: 8578250e11610887, inputs: {matrix: a0967b2b314ebc90, category: asset, severity: '3', likelihood: C}}}
              residual:
                - {category: asset, severity: "3", likelihood: B, basis: "Credits I-103 (SG12) on R-102 over-temperature: TZ-1205 and XV-1204 are separate from the air flow loop FIC-1201.", status: proposed, by: agent, band: {value: low, provenance: calculated, source: 'cheme safety hazop rate: ammonia-1-5x5 (safety/risk-matrix.yaml)', fingerprint: 762e0abb725a8fe0, inputs: {matrix: a0967b2b314ebc90, category: asset, severity: '3', likelihood: B}}}
            notes: "This is the open question of the C&E note on I-102 (does a firing trip also trip the feed)."
  # ------------------------------------------------------------------ P-102 convection
  - id: N3
    title: Convection section coils E-101, E-102, E-103, E-104 and the steam coil E-107 (P-102)
    design_intent: >-
      Recover flue gas heat to the natural gas (E-101, 288 to 643 K), the mixed feed (E-102, to
      773 K), the prereformed gas (E-103, to 893 K), the process air (E-104, to 773 K) and boiler
      feed water (E-107, BW-1024 / BW-1025 from and to U-801).
    members: [E-101, E-102, E-103, E-104, E-107, BW-1024, BW-1025, PA-1023, NG-1003, PG-1006, PG-1008, TI-1112, TI-1113]
    status: proposed
    by: agent
    deviations:
      - id: N3-NF
        guide_word: "no"
        parameter: flow (boiler feed water in E-107)
