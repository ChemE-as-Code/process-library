    targets:
      - {kind: setpoint, value: 1700, unit: kPa(a), provenance: assumed, source: "process/flowsheet.yaml design case (S55 ASSUMED, D-017)",
         cases: [design], stream: S55, property: pressure}
    modes: [manual, auto]
    normal_mode: auto
    rationale: Back-pressure valve on the vent; fails closed (the refrigerant stays in the package; PSV-2010 relieves V-701).
  # ---------------------------------------------------------------- PGR: purge gas recovery
  - id: PIC-2104
    title: Tail gas pressure from the purge gas recovery
    purpose: Hold the X-601 tail gas outlet pressure and send the tail gas to the reformer burners.
    section: PGR
    cases: [design]
    variable: pressure
    measurement: [{tag: PIC-2104}]
    controller: PIC-2104
    action: direct
    final_elements:
      - {tag: PV-2104, kind: valve, actuator: pneumatic, fail: closed}
    targets:
      - {kind: setpoint, value: 400, unit: kPa(a), provenance: assumed, source: "process/flowsheet.yaml design case (S59 ASSUMED, D-013)",
         cases: [design], stream: S59, property: pressure}
    modes: [manual, auto]
    normal_mode: auto
    rationale: The sensor is upstream of PV-2104 on FG-1010 (back pressure on the package). Fails closed as a fuel valve; the package then holds its pressure against its own relief (inside X-601, open).
  - id: FIC-2106
    title: LP steam to the ammonia distillation
    purpose: Heat the NH3 wash distillation of X-601.
    section: PGR
    cases: [design]
    variable: flow
    measurement: [{tag: FIC-2106}]
    controller: FIC-2106
    action: reverse
    final_elements:
      - {tag: FV-2106, kind: valve, actuator: pneumatic, fail: closed}
    targets:
      - {kind: setpoint, value: 657, unit: kg/h, provenance: assumed, source: "D-030: Q29 386.8 kW (ASSUMED 3 MJ/kg recovered NH3, D-013) over the heat of vaporisation of water at 450 kPa(a), 2120 kJ/kg at 421 K (thermo's pure-water correlations in cheme's interpreter)"}
    modes: [manual, auto]
    normal_mode: auto
    rationale: Flow-controlled heating; the package vendor may replace it by a temperature cascade inside X-601. Fails closed.
  # -------------------------------------------------------------------- STM: steam and BFW
  - id: LIC-2201
    title: Steam drum level
    purpose: Keep the steam drum level so that the waste heat boilers never run dry and no water is carried into the superheater.
    section: STM
    cases: [design]
    variable: level
    measurement: [{tag: LIC-2201}]
    controller: LIC-2201
    action: reverse
    final_elements:
      - {tag: LV-2201, kind: valve, actuator: pneumatic, fail: open}
    targets:
      - {kind: setpoint, value: 50, unit: "%", provenance: assumed, source: D-030 (ASSUMED)}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: LIC-2201, condition: LAL, response: Check P-801 and LV-2201; a dry waste heat boiler is damaged within minutes. A low-low trip is open (D-030).}
      - {tag: LIC-2201, condition: LAH, response: Water carry-over to the superheater and the process steam; check LV-2201.}
    rationale: Single-element level control on the BFW valve, as drawn. A three-element control (steam and feed water flows) is usual for a drum of this size and is open (D-029, D-030). LV-2201 fails open so that the boilers keep their water.
  - id: LIC-2202
    title: Deaerator level
    purpose: Keep the BFW inventory for P-801 by admitting demineralised make-up water.
    section: STM
    cases: [design]
    variable: level
    measurement: [{tag: LIC-2202}]
    controller: LIC-2202
    action: reverse
    final_elements:
      - {tag: LV-2202, kind: valve, actuator: pneumatic, fail: open}
    targets:
      - {kind: setpoint, value: 50, unit: "%", provenance: assumed, source: D-030 (ASSUMED)}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: LIC-2202, condition: LAL, response: Check the make-up supply and LV-2202; P-801 loses suction.}
    rationale: Inlet valve on the make-up (level falls, valve opens); fails open so that the BFW pump keeps its suction (overflow of the deaerator is the lesser consequence).
  - id: PIC-2203
    title: MP steam header pressure
    purpose: Hold the MP steam header pressure by exporting the surplus steam.
    section: STM
    cases: [design]
    variable: pressure
    measurement: [{tag: PIC-2203}]
    controller: PIC-2203
    action: direct
    final_elements:
      - {tag: PV-2203, kind: valve, actuator: pneumatic, fail: closed}
    targets:
      - {kind: setpoint, value: 4600, unit: kPa(a), provenance: assumed, source: "process/flowsheet.yaml design case (S68 ASSUMED, D-015)",
         cases: [design], stream: S68, property: pressure}
    modes: [manual, auto]
    normal_mode: auto
    alarms:
      - {tag: PIC-2203, condition: PAL, response: The process steam FIC-1006 may fall short; reduce the load before the low-low trip I-101.}
      - {tag: PIC-2203, condition: PAH, response: Check PV-2203 and the export consumer; PSV-2210 lifts at its set pressure.}
    interlocks: [I-101]
    rationale: The plant raises more steam than it uses (D-015), so the header floats on the export. Fails closed so that the process steam keeps priority over the export; PSV-2210 is the relief for a blocked export.
  - id: PIC-2206
    title: LP steam pressure
    purpose: Let MP steam down to the LP level for the purge gas recovery.
    section: STM
    cases: [design]
    variable: pressure
    measurement: [{tag: PIC-2206}]
    controller: PIC-2206
    action: reverse
    final_elements:
      - {tag: PV-2206, kind: valve, actuator: pneumatic, fail: closed}
    targets:
      - {kind: setpoint, value: 450, unit: kPa(a), provenance: assumed, source: "D-029: LP steam level, ASSUMED"}
    modes: [manual, auto]
    normal_mode: auto
    rationale: Let-down valve with the sensor downstream; fails closed so that the LP system is not exposed to MP pressure (an LP relief device is open, D-029).
