  - {tag: FI-1104, sheet: P-102, service: Tail gas flow to the burners (FG-1010)}
  - {tag: US-1105, sheet: P-102, service: "Tail gas trip logic, closes XV-1105 (C&E I-102)"}
  - {tag: TI-1106, sheet: P-102, service: Primary reformer inlet temperature (PG-1008)}
  - {tag: PIC-1107, sheet: P-102, service: "Furnace draft (H-101 arch pressure), acts on the K-103 speed"}
  - {tag: PZ-1108, sheet: P-102, service: "Furnace pressure, high-high trip of the firing (C&E I-102)"}
  - {tag: AIC-1109, sheet: P-102, service: "O2 in the flue gas after the convection section, resets FIC-1110"}
