  - {tag: UIC-1202, sheet: P-103, service: "K-101 anti-surge control, blow-off valve FV-1202"}
  - {tag: PI-1203, sheet: P-103, service: K-101 discharge pressure}
  - {tag: US-1204, sheet: P-103, service: "Process air trip logic, closes XV-1204 (C&E I-103)"}
  - {tag: TZ-1205, sheet: P-103, service: "Secondary reformer outlet temperature, high-high trip of the process air (C&E I-103)"}
  - {tag: TI-1206, sheet: P-103, service: Secondary reformer R-102 bed temperature}
  - {tag: TIC-1207, sheet: P-103, service: "HT shift inlet temperature, E-105 hot bypass TV-1207"}
