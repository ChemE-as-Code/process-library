  - {tag: PDI-1303, sheet: P-104, service: LT shift converter R-202 bed differential pressure}
  - {tag: AI-1304, sheet: P-104, service: CO slip after the LT shift (PG-1044)}
  - {tag: TI-1305, sheet: P-104, service: Process gas temperature after E-202 (PG-1045)}
