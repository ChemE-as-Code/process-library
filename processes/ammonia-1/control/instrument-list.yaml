# Instrument list. Schema: `cheme schema instruments`.
# Front end (S3a, sheets P-101 to P-104, D-027): tags as printed. Loops, setpoints, alarms and
# fail positions belong in control/loops.yaml; trips in control/cause-effect.yaml (S4).
schema: cheme/instruments/v1
instruments:
  # ---- P-101 feed gas, desulphurisation, prereforming
  - {tag: PI-1001, sheet: P-101, service: Natural gas pressure at the battery limit (NG-1001)}
  - {tag: US-1001, sheet: P-101, service: "Feed gas trip logic, closes XV-1001 (C&E I-101)"}
  - {tag: FIC-1002, sheet: P-101, service: "Process natural gas flow (plant load), FV-1002"}
  - {tag: TI-1003, sheet: P-101, service: Desulphuriser V-101 inlet temperature}
  - {tag: PDI-1004, sheet: P-101, service: Desulphuriser V-101 bed differential pressure}
  - {tag: AI-1005, sheet: P-101, service: Total sulphur after V-101 (NG-1004)}
  - {tag: FIC-1006, sheet: P-101, service: "Process steam flow, ratio to FIC-1002 (steam to carbon), FV-1006"}
  - {tag: FZ-1007, sheet: P-101, service: "Process steam flow, low-low trip of the feed gas (C&E I-101)"}
  - {tag: TI-1008, sheet: P-101, service: Prereformer R-100 inlet temperature}
  - {tag: PDI-1009, sheet: P-101, service: Prereformer R-100 bed differential pressure}
  - {tag: TI-1010, sheet: P-101, service: Prereformer R-100 outlet temperature}
