# Cause and effect list: interlocks and trips. Schema: `cheme schema interlocks`.
# On a sheet, refer to an interlock ("see C&E I-01") instead of spelling out what it trips.
schema: cheme/interlocks/v1
# PROPOSED, not approved for implementation. The trips drawn on P-101 to P-110 (S3, D-027 to
# D-029). S4 (D-030) adds the trip delays, latching, reset and bypass, all ASSUMED as usual
# practice for a first issue; the trip setpoints themselves are not set (no design pressures and
# temperatures yet). SIL screening is the HAZOP's (S6): sil stays empty until then.
interlocks:
  - id: I-101
    title: Process steam low-low flow (carbon formation on the reforming catalysts)
    cause: {tag: FZ-1007, condition: LL}
    effects:
      - {tag: XV-1001, action: close}
      - {tag: XV-1204, action: close}
    sheet: P-101
    delay: {value: 2, unit: s}
    latching: true
    reset: manual   # from the control room once the steam flow is back above the trip point and FIC-1002 and FIC-1201 are in manual with their valves closed
    bypass: None in operation. At start-up the trip is healthy before feed gas is admitted, because steam is established first (SEQ-START-REF).
    notes: D-027, D-030. Feed gas and then process air stop when the steam to carbon ratio cannot be held; the steam itself stays on to purge the catalysts.
  - id: I-102
    title: Reformer furnace pressure high-high (loss of draft)
    cause: {tag: PZ-1108, condition: HH}
    effects:
      - {tag: XV-1102, action: close}
      - {tag: XV-1105, action: close}
    sheet: P-102
    delay: {value: 3, unit: s}
    latching: true
    reset: manual   # once the furnace pressure is back below the trip point; relighting follows the burner management purge (SEQ-START-REF)
    bypass: None.
    notes: D-027, D-030. Burner management (flame failure, purge) is part of the furnace package, not drawn yet. Losing the firing with feed still on cools the tubes; whether I-102 must also trip the feed (I-101 effects) is for the HAZOP (S6).
  - id: I-103
    title: Secondary reformer outlet temperature high-high
    cause: {tag: TZ-1205, condition: HH}
    effects:
      - {tag: XV-1204, action: close}
    sheet: P-103
    delay: {value: 2, unit: s}
    latching: true
    reset: manual   # once the outlet temperature is below the trip point and FIC-1201 is in manual with FV-1201 closed
    bypass: None.
    notes: D-027, D-030. Process air is cut first; the check valve on PA-1023 stops back-flow of gas into the air line. With the air cut the make-up gas loses its nitrogen and about a third of its flow; the anti-surge loop UIC-1703 holds K-501, and the plant is brought down by SEQ-TRIP-FE.
  - id: I-104
    title: Process condensate separator level high-high (liquid carry-over to the CO2 absorber)
    cause: {tag: LZ-1308, condition: HH}
    effects:
      - {tag: LZ-1308, action: alarm}
    sheet: P-104
    delay: {value: 5, unit: s}
    latching: false
    reset: automatic   # the alarm clears when the level falls below the high-high point
    bypass: None.
    notes: D-027, D-030. An alarm only for the operator to act on LIC-1307. The S3a draft also opened LV-1307, the control valve of LIC-1307; a trip acting on the loop's own valve is not independent of the loop it backs up, so S4 removed that effect (D-030). Whether a trip of the feed is needed is left for the HAZOP (S6).
  - id: I-105
    title: CO2 absorber sump level low-low (gas blow-by to the regenerator)
    cause: {tag: LZ-1406, condition: LL}
    effects:
      - {tag: LZ-1406, action: alarm}
      - {tag: XV-1406, action: close}
    sheet: P-105
    delay: {value: 2, unit: s}
    latching: true
    reset: manual   # once the sump level is above the trip point and LIC-1405 is in manual
    bypass: A timed start-up bypass with operator permission while the sump is first filled with solvent (SEQ-START-CO2R); removed automatically when the level has been above the trip point for 60 s or after 30 min.
    notes: D-028, D-030. PSV-1513 on C-302 is the relief layer behind it (relief case open, S8). Confirmation by the HAZOP (S6).
  - id: I-106
    title: Methanator bed temperature high-high (CO / CO2 breakthrough)
    cause: {tag: TZ-1605, condition: HH}
    effects:
      - {tag: TZ-1605, action: alarm}
      - {tag: XV-1604, action: close}
    sheet: P-107
    delay: {value: 2, unit: s}
    latching: true
    reset: manual   # once the bed temperature is below the trip point and the CO and CO2 slip (AI-1604) is back within specification
    bypass: None.
    notes: D-028, D-030. Proposed; with the methanator feed cut K-501 loses its suction flow and the anti-surge loop UIC-1703 opens the recycle. Whether K-501 trips and the methanator is depressured as well is left for the HAZOP (S6); the front end then needs a vent to flare that is not drawn (D-030).
  - id: I-107
    title: Ammonia separator level low-low (gas blow-by into the let-down vessel)
    cause: {tag: LZ-1904, condition: LL}
    effects:
      - {tag: LZ-1904, action: alarm}
      - {tag: XV-1904, action: close}
    sheet: P-110
    delay: {value: 2, unit: s}
    latching: true
    reset: manual   # once the separator level is above the trip point and LIC-1903 is in manual
    bypass: A timed start-up bypass with operator permission until the separator has first made a level (SEQ-START-SYN); removed automatically when the level has been above the trip point for 60 s or after 60 min.
    notes: D-029, D-030. Proposed; V-501 at 14,700 kPa(a) above V-502 at 2500 kPa(a); whether PSV-1912 must take the full blow-by is for S8 and the HAZOP (S6).
