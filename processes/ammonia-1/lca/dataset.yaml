allocation:
  method: exergy
  coproducts:
  - NH3
  - STEAM
  properties:
    NH3:
      exergy: 20190.0
      source: 'kJ per kg, ASSUMED calculation (D-021): standard chemical exergy of NH3 337.9 kJ/mol (Szargut,
        Morris and Steward 1988, standard reference environment) = 19840 kJ/kg, plus 350 kJ/kg physical
        exergy of the liquid at 240.15 K and 110 kPa(a) (S60) from thermo with Peng-Robinson; dead state
        298.15 K, 101.325 kPa'
    STEAM:
      exergy: 1262.0
      source: 'kJ per kg, ASSUMED calculation (D-021): physical exergy of steam at 4600 kPa(a), 673.15
        K (S68) against liquid water at 298.15 K, 101.325 kPa from IAPWS-IF97 (h 3203.7, s 6.6947; h0
        104.93, s0 0.3672 kJ/kg, kJ/kg K) = 1212 kJ/kg, plus the standard chemical exergy of liquid water
        0.9 kJ/mol (Szargut et al. 1988) = 50 kJ/kg'
  substitution:
    STEAM:
      source: D-021
      missing: 'not linked yet: MP steam (4600 kPa(a), 673 K) from a natural-gas-fired industrial boiler
        at the site (NL), the steam the export displaces'
  compare:
  - exergy
  - substitution
  source: 'D-021 (revised): the exported MP steam is a co-product. The dataset''s default is exergy allocation:
    the library''s per-co-product export needs a proportional method, and the two products leave in very
    different states, so exergy charges each for the work it holds (steam about 5 % of the burdens). Substitution
    (system expansion, crediting the steam the site would otherwise raise) is kept as the comparison;
    its avoided product is declared missing until a background exists.'
  deviation: 'D-021: no co-product price is recorded, so the WBCSD price ratio is unknown, and mass allocation
    would charge 0.88 kg of steam per kg NH3 with 47 % of the gas, feed and emissions of an ammonia plant.
    Exergy is the physical relationship between the products.'
