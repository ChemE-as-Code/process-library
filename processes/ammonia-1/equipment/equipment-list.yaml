# Equipment list. Schema: `cheme schema equipment`.
# Concept stage: the items the PFD (process/flowsheet.yaml) links to, no P&ID yet (no sheet).
# Duties and conditions from scripts/plant_balance.py (D-006); design pressure, temperature
# and materials are not set yet (basic engineering, datasheets).
# dimensions: overall sizes for the concept plot plan, ASSUMED engineering estimates for a
# 1500 t/d plant, not sized from the balance (D-022); the datasheets replace them.
# weight / lift_weight (t): screening empty weights for the lifting study, ASSUMED, from
# scripts/estimate_weights.py (shell formula or envelope density, D-031); the datasheets (S7)
# and the vendors replace them. Where the notes give no pressure the shell is taken at
# 1000 kPa(a), which understates the shift and loop exchangers.
schema: cheme/equipment/v1
