# Datasheet drafted by `cheme datasheets draft`, sized by `cheme datasheets fill` and completed by
# scripts/complete_datasheets.py (DESIGN.md D-032). Preliminary process datasheet: every value
# says where it comes from; assumed: true marks an assumption; `supplier` names what a vendor,
# licensor or study still has to give. Checked by the authoring agent, not yet by an engineer.
tag: K-103
type: Fan
service: Flue gas ID fan
operating:
  outlet_pressure:
    value: 105.0
    unit: kPa(a)
    source: 'process/flowsheet.yaml stream S67 (case design), assumed: D-014'
    assumed: true
  outlet_temperature:
    value: 403.5
    unit: K
    source: 'process/flowsheet.yaml stream S67 (case design), calculated: cheme process simulate: DWSIM
      9.0.5.0, Peng-Robinson (PR)'
    origin: simulated
  outlet_flow:
    value: 176411.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S67 (case design), calculated: cheme process simulate: DWSIM
      9.0.5.0, Peng-Robinson (PR)'
    origin: simulated
  case: design
design:
  pressure_barg:
    value: supplier
    unit: barg
    source: fan casing design pressure (shut-off) by the fan vendor
    reason: fan casing design pressure (shut-off) by the fan vendor
  temperature_degc:
    value: 180.0
    unit: degC
    source: 'design temperature = maximum operating temperature + 28 K (50 degF of Towler and Sinnott,
      Chemical Engineering Design, 2nd ed., 2013 / UOP and of Walas 1988, as summarised by the Northwestern
      University Process Design wiki, ''Pressure Vessels''; at least Turton''s 25 degC), rounded up to
      5 degC, D-032; maximum operating 423.15 K: stream S66 (assumed: D-014: stack temperature)'
    assumed: true
materials:
  main:
    value: carbon steel (grade by the materials review)
    material_class: carbon_steel
    assumed: true
    source: 'DESIGN.md D-032: preliminary material class by service (flue gas at 130-150 degC); the materials
      selection review is open'
dimensions:
  overall_length:
    value: 4.0
    unit: m
    source: equipment/equipment-list.yaml dimensions.length
  overall_width:
    value: 3.0
    unit: m
    source: equipment/equipment-list.yaml dimensions.width
  overall_height:
    value: 3.0
    unit: m
    source: equipment/equipment-list.yaml dimensions.height
  axis_deg:
    value: 0.0
    unit: deg
    source: layout/plant-model.yaml K-103 rotation_deg (layout/equipment-placement.yaml)
  baseplate:
    length:
      value: supplier
      reason: the vendor's general arrangement drawing (baseplate and shaft centre height)
      source: DESIGN.md D-043
    width:
      value: supplier
      reason: the vendor's general arrangement drawing (baseplate and shaft centre height)
      source: DESIGN.md D-043
  shaft_height:
    value: supplier
    reason: the vendor's general arrangement drawing (baseplate and shaft centre height)
    source: DESIGN.md D-043
weights:
  empty:
    value: 10.8
    unit: t
    source: 'equipment/equipment-list.yaml dimensions.weight (empty): screening weight of scripts/estimate_weights.py
      (D-036), ASSUMED'
    assumed: true
nozzles:
- name: N1
  dn: 2400
  lines:
  - FL-1020
  source: pid/P-102.xml
- name: N2
  dn: 2200
  lines:
  - FL-1021
  source: pid/P-102.xml
type_specific:
  height_m:
    value: 3.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  length_m:
    value: 4.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  width_m:
    value: 3.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  gas_flow_m3_s:
    value: 61.76
    unit: m3/s
    source: 'inlet stream S66: m / rho, ideal gas rho = P M / (R T) = 0.7935 kg/m3 (M 27.92 kg/kmol from
      the composition and process/materials.yaml); DESIGN.md D-032'
    assumed: true
  shaft_power_kw:
    value: supplier
    unit: kW
    source: 'machine vendor''s shaft power: the fluid power on this sheet over the mechanical efficiency
      (bearings, seals, gear), which no source in DESIGN.md gives'
    reason: 'machine vendor''s shaft power: the fluid power on this sheet over the mechanical efficiency
      (bearings, seals, gear), which no source in DESIGN.md gives'
  process_streams:
  - stream: S66
    direction: in
    title: Flue gas leaving the convection section
    source: process/flowsheet.yaml (case design)
  - stream: S67
    direction: out
    title: Flue gas to stack
    source: process/flowsheet.yaml (case design)
  - stream: Q12
    direction: in
    title: K-103 ID fan power
    source: process/flowsheet.yaml (case design)
  fluid_power_kw:
    value: 402.9
    unit: kW
    source: Q12, process/simulation-run.json (case design, cheme process simulate, DWSIM 9.0.5, Peng-Robinson,
      D-026) unit K103, efficiency 0.70 (D-014)
    assumed: true
  rating:
    value: supplier
    unit: ''
    source: vendor's thermal, hydraulic or machine rating on these process conditions (not calculated
      by cheme-as-code, docs/framework/sizing.md)
    reason: vendor's thermal, hydraulic or machine rating on these process conditions (not calculated
      by cheme-as-code, docs/framework/sizing.md)
  mechanical_design:
    value: supplier
    unit: ''
    source: vendor's mechanical design to the code on the design conditions of this sheet (wall thickness,
      MAWP, nozzle loads)
    reason: vendor's mechanical design to the code on the design conditions of this sheet (wall thickness,
      MAWP, nozzle loads)
  corrosion_allowance_mm:
    value: supplier
    unit: mm
    source: corrosion allowance from the materials and corrosion review with the vendor; the material
      class on this sheet is preliminary (D-032)
    reason: corrosion allowance from the materials and corrosion review with the vendor; the material
      class on this sheet is preliminary (D-032)
  relief_protection:
    value: supplier
    unit: ''
    source: 'relief study, section S8 (skill relief-scenarios): governing case, device and set pressure;
      the devices drawn are listed in piping/special-items.yaml'
    reason: 'relief study, section S8 (skill relief-scenarios): governing case, device and set pressure;
      the devices drawn are listed in piping/special-items.yaml'
sizing_basis:
- parameter: sizing_scope
  value: preliminary
  reference: 'cheme datasheets fill: the values it writes are preliminary process sizing (short-cut methods,
    declared or typical parameters), not a rating or a design to a code; not calculated: process sizing,
    rating, mechanical code, materials corrosion, relief, dynamics controls (docs/framework/sizing.md)'
- parameter: design conditions
  value: rule of D-032 on the item's operating streams
  reference: DESIGN.md D-032
notes: 5 kPa, 0.44 MW (D-014). ASSUMED. Dimensions ASSUMED (D-022).
