  width_m:
    value: 1.2
    unit: m
    source: equipment/equipment-list.yaml dimensions
  flow_m3_h:
    value: 157.7
    unit: m3/h
    source: 'm / rho = 156457.8 / 992.2; by scripts/complete_datasheets.py: cheme datasheets fill sizes
      a pump only from a linked node with one inlet and one outlet or from end points in the layout model;
      P-801 is linked to the lumped steam system U801; pressures at the pump, no static head or line loss
      counted (ASSUMED); DESIGN.md D-032'
    assumed: true
  differential_head_m:
    value: 565.1
    unit: m
    source: 'H = (p_out - p_in) / (rho g) = (5600 - 101.325) kPa / (992.2 x 9.80665); by scripts/complete_datasheets.py:
      cheme datasheets fill sizes a pump only from a linked node with one inlet and one outlet or from
      end points in the layout model; P-801 is linked to the lumped steam system U801; pressures at the
      pump, no static head or line loss counted (ASSUMED); DESIGN.md D-032'
    assumed: true
  npsh_available_m:
    value: 9.7
    unit: m
    source: 'NPSHa = (p_in - p_vap) / (rho g) = (101.325 - 7.38) kPa / (992.2 x 9.80665), no static head
      counted; a deaerator at saturation would leave only its static head: by scripts/complete_datasheets.py:
      cheme datasheets fill sizes a pump only from a linked node with one inlet and one outlet or from
      end points in the layout model; P-801 is linked to the lumped steam system U801; pressures at the
      pump, no static head or line loss counted (ASSUMED); DESIGN.md D-032'
    assumed: true
  shaft_power_kw:
    value: 344.1
    unit: kW
    source: 'P = m g H / eta = 156457.8 kg/h x 9.80665 x 565.1 m / 0.7; by scripts/complete_datasheets.py:
      cheme datasheets fill sizes a pump only from a linked node with one inlet and one outlet or from
      end points in the layout model; P-801 is linked to the lumped steam system U801; pressures at the
      pump, no static head or line loss counted (ASSUMED); DESIGN.md D-032'
    assumed: true
