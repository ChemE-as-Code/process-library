  tangent_length:
    value: 8.3
    unit: m
    source: 'layout/plant-model.yaml part E-502/shell: the generated shell between the heads (the 3D model''s
      proportions, not a vessel design)'
    assumed: true
  axis_deg:
    value: 0.0
    unit: deg
    source: layout/plant-model.yaml E-502 rotation_deg (layout/equipment-placement.yaml)
weights:
