    unit: m2
    source: 'cheme datasheets fill: A = Q / (U F LMTD) (1 + margin) = 4.322e+04 kW / (65 x 1 x 30.77 K)
      x 1; U 65 W/(m2 K) ASSUMED as design typical (middle of 30-100), Sinnott, Coulson & Richardson''s
      Chemical Engineering Vol. 6, 4th ed. (2005), Table 12.1, p. 637: heater, flue gases / steam; no
      margin (none declared); Q given type_specific.duty_kw 43216.3 (process/simulation-run.json (case
      design, cheme process simulate, DWSIM 9.0.5, Peng-Robinson, D-026) unit E502 (= Q23))'
    assumed: true
    fingerprint: 5cd3769de436bd34
    inputs:
    - table:overall-coefficients/heater/flue-gases-steam
    - datasheet:type_specific.duty_kw
    - param:utility_inlet_temperature_degc
    - param:utility_outlet_temperature_degc
    - param:arrangement
    - param:overall_u_w_m2k
    - param:u_service
