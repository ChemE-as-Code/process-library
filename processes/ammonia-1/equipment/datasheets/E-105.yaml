  overall_length:
    value: 12.0
    unit: m
    source: equipment/equipment-list.yaml dimensions.length
  tangent_length:
    value: 9.935
    unit: m
    source: 'layout/plant-model.yaml part E-105/shell: the generated shell between the heads (the 3D model''s
      proportions, not a vessel design)'
    assumed: true
  axis_deg:
    value: 0.0
    unit: deg
    source: layout/plant-model.yaml E-105 rotation_deg (layout/equipment-placement.yaml)
nozzles:
- name: T1
  dn: 900
  lines:
