# Datasheet drafted by `cheme datasheets draft`, sized by `cheme datasheets fill` and completed by
# scripts/complete_datasheets.py (DESIGN.md D-032). Preliminary process datasheet: every value
# says where it comes from; assumed: true marks an assumption; `supplier` names what a vendor,
# licensor or study still has to give. Checked by the authoring agent, not yet by an engineer.
tag: K-101
type: CentrifugalCompressor
service: Process air compressor
operating:
  S12_in_pressure:
    value: 101.325
    unit: kPa(a)
    source: 'process/flowsheet.yaml stream S12 (case design), assumed: design basis, site'
    assumed: true
  S12_in_temperature:
    value: 288.15
    unit: K
    source: 'process/flowsheet.yaml stream S12 (case design), assumed: design basis, site'
    assumed: true
  S12_in_flow:
    value: 67184.1
    unit: kg/h
    source: 'process/flowsheet.yaml stream S12 (case design), assumed: D-026: retuned on the simulated
      loop for H2/N2 = 3.0 at the converter inlet (D-007); concept balance 67281.64'
    assumed: true
  S13_out_pressure:
    value: 3600
    unit: kPa(a)
    source: 'process/flowsheet.yaml stream S13 (case design), assumed: D-007'
    assumed: true
  S13_out_temperature:
    value: 429.231
    unit: K
    source: 'process/flowsheet.yaml stream S13 (case design), calculated: cheme process simulate: DWSIM
      9.0.5.0, Peng-Robinson (PR)'
