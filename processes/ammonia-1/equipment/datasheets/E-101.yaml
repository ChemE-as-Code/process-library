    value: 7976.4
    unit: kW
    source: process/simulation-run.json (case design, cheme process simulate, DWSIM 9.0.5, Peng-Robinson,
      D-026) unit E101
  area_m2:
    value: 682.0
    unit: m2
    source: 'A = Q / (U LMTD) = 7976.4 kW / (65 x 180.06 K), no margin, by scripts/complete_datasheets.py:
      cheme datasheets fill (core v1.0.x) sizes an exchanger only from a linked node with one material
      inlet and one outlet; this item is one two-stream exchanger node of the flowsheet, so the same method
      (counter-current LMTD, Table 12.1 middle U, no margin) is applied here; DESIGN.md D-032'
    assumed: true
  process_streams:
  - stream: S3
    direction: in
    title: Process natural gas
    source: process/flowsheet.yaml (case design)
  - stream: S4
    direction: out
    title: Preheated natural gas
    source: process/flowsheet.yaml (case design)
  - stream: S82
    direction: in
    title: Flue gas after the process air coil
    source: process/flowsheet.yaml (case design)
  - stream: S83
    direction: out
    title: Flue gas after the natural gas coil
    source: process/flowsheet.yaml (case design)
  u_service: heater/flue-gases-hydrocarbon-vapours
  arrangement: counter-current
  lmtd_k:
    value: 180.06
    unit: K
    source: LMTD counter-current, hot 735.67 -> 598.71 K (S82 -> S83), cold 288.15 -> 643.15 K (S3 ->
      S4); DESIGN.md D-032
    assumed: true
  overall_u_w_m2k:
    value: 65.0
    unit: W/(m2 K)
    source: 'design typical, middle of 30-100: Sinnott, Coulson & Richardson''s Chemical Engineering Vol.
      6, 4th ed. (2005), Table 12.1, heater/flue-gases-hydrocarbon-vapours (the row table of cheme datasheets
      fill --list); DESIGN.md D-032'
    assumed: true
