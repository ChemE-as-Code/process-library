# Datasheet drafted by `cheme datasheets draft`, sized by `cheme datasheets fill` and completed by
# scripts/complete_datasheets.py (DESIGN.md D-032). Preliminary process datasheet: every value
# says where it comes from; assumed: true marks an assumption; `supplier` names what a vendor,
# licensor or study still has to give. Checked by the authoring agent, not yet by an engineer.
tag: V-101
type: Vessel
service: Desulfuriser (hydrogenation catalyst and ZnO beds)
operating:
  inlet_pressure:
    value: 4450.0
    unit: kPa(a)
    source: 'process/flowsheet.yaml stream S4 (case design), assumed: D-007'
    assumed: true
  inlet_temperature:
    value: 643.15
    unit: K
    source: 'process/flowsheet.yaml stream S4 (case design), assumed: D-007'
    assumed: true
  inlet_flow:
    value: 29508.3
    unit: kg/h
    source: 'process/flowsheet.yaml stream S4 (case design), calculated: cheme process simulate: DWSIM
      9.0.5.0, Peng-Robinson (PR)'
    origin: simulated
  outlet_pressure:
    value: 4400.0
    unit: kPa(a)
    source: 'process/flowsheet.yaml stream S5 (case design), assumed: D-007'
    assumed: true
  outlet_temperature:
    value: 643.15
    unit: K
    source: 'process/flowsheet.yaml stream S5 (case design), assumed: D-007'
    assumed: true
  outlet_flow:
    value: 29508.3
    unit: kg/h
    source: 'process/flowsheet.yaml stream S5 (case design), calculated: cheme process simulate: DWSIM
      9.0.5.0, Peng-Robinson (PR)'
    origin: simulated
  case: design
design:
  pressure_barg:
    value: 48.0
    unit: barg
    source: 'design pressure = max(1.10 x, +1.7 bar over) the maximum operating gauge pressure, rounded
      up to 0.5 bar (heuristic ''10 % or 10-25 psi, whichever is greater'' of Walas, Chemical Process
      Equipment, 1988, Rules of Thumb, and Turton et al., 4th ed., 2012, as summarised by the Northwestern
      University Process Design wiki, ''Pressure Vessels''; the books were not read; the upper end 1.7
      bar taken), D-032; maximum operating 4450 kPa(a): stream S4 (assumed: D-007)'
    assumed: true
  temperature_degc:
    value: 400.0
    unit: degC
    source: 'design temperature = maximum operating temperature + 28 K (50 degF of Towler and Sinnott,
      Chemical Engineering Design, 2nd ed., 2013 / UOP and of Walas 1988, as summarised by the Northwestern
      University Process Design wiki, ''Pressure Vessels''; at least Turton''s 25 degC), rounded up to
      5 degC, D-032; maximum operating 643.15 K: stream S4 (assumed: D-007)'
    assumed: true
  note: above 345 degC the D-032 margin is a process allowance; the metal temperature (refractory, tube
    wall, flue-gas side) is the vendor's
materials:
  main:
    value: low-alloy Cr-Mo steel (grade by the materials review)
    material_class: low_alloy_steel
    assumed: true
    source: 'DESIGN.md D-032: preliminary material class by service (hydrogen-bearing gas above the carbon-steel
      range of API RP 941 (Nelson curves): hydrogenation feed at 370 degC); the materials selection review
      is open'
dimensions:
  orientation: vertical
  outside_diameter:
    value: 4.0
    unit: m
    source: equipment/equipment-list.yaml dimensions.diameter
  overall_height:
    value: 12.0
    unit: m
    source: equipment/equipment-list.yaml dimensions.height
  tangent_length:
    value: 8.56
    unit: m
    source: 'layout/plant-model.yaml part V-101/shell: the generated shell between the heads (the 3D model''s
      proportions, not a vessel design)'
    assumed: true
  support:
    height:
      value: 2.44
      unit: m
      source: 'layout/plant-model.yaml parts V-101/shell, V-101/skirt: the bottom tangent line above the
        base (the 3D model''s proportions, not a design)'
      assumed: true
    type:
      value: skirt
      unit: ''
      source: vertical vessel on a skirt (ASSUMED); DESIGN.md D-043
      assumed: true
  head:
    value: ellipsoidal_2_1
    unit: ''
    source: 2:1 ellipsoidal heads, the usual head of a pressure vessel (ASSUMED); DESIGN.md D-043
    assumed: true
weights:
  empty:
    value: 119.5
    unit: t
    source: 'equipment/equipment-list.yaml dimensions.weight (empty): screening weight of scripts/estimate_weights.py
      (D-036), ASSUMED'
    assumed: true
nozzles:
- name: N1
  dn: 200
  lines:
  - NG-1003
  source: pid/P-101.xml
- name: N2
  dn: 200
  lines:
  - NG-1004
  source: pid/P-101.xml
- name: N3
  dn: 25
  lines: []
  source: pid/P-101.xml
type_specific:
  diameter_m:
    value: 4.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  height_m:
    value: 12.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  volume_m3:
    value: 107.6
    unit: m3
    source: 'cheme datasheets fill: pi/4 D^2 L, D 4 m (dimensions.outside_diameter), L 8.56 m (dimensions.tangent_length);
      the cylindrical shell between the tangent lines, heads not included; over the outside diameter:
      an upper bound of the shell'
    assumed: true
    fingerprint: 4dde5b7da7bda56a
    inputs:
    - datasheet:dimensions.orientation
    - datasheet:dimensions.inside_diameter
    - datasheet:dimensions.outside_diameter
    - datasheet:dimensions.tangent_length
    - datasheet:dimensions.overall_length
    - datasheet:dimensions.overall_height
    - datasheet:type_specific.diameter_m
    - datasheet:type_specific.length_m
    - datasheet:type_specific.height_m
  process_streams:
  - stream: S4
    direction: in
    title: Preheated natural gas
    source: process/flowsheet.yaml (case design)
  - stream: S5
    direction: out
    title: Desulfurised natural gas
    source: process/flowsheet.yaml (case design)
  rating:
    value: supplier
    unit: ''
    source: vendor's thermal, hydraulic or machine rating on these process conditions (not calculated
      by cheme-as-code, docs/framework/sizing.md)
    reason: vendor's thermal, hydraulic or machine rating on these process conditions (not calculated
      by cheme-as-code, docs/framework/sizing.md)
  mechanical_design:
    value: supplier
    unit: ''
    source: vendor's mechanical design to the code on the design conditions of this sheet (wall thickness,
      MAWP, nozzle loads)
    reason: vendor's mechanical design to the code on the design conditions of this sheet (wall thickness,
      MAWP, nozzle loads)
  corrosion_allowance_mm:
    value: supplier
    unit: mm
    source: corrosion allowance from the materials and corrosion review with the vendor; the material
      class on this sheet is preliminary (D-032)
    reason: corrosion allowance from the materials and corrosion review with the vendor; the material
      class on this sheet is preliminary (D-032)
  relief_protection:
    value: supplier
    unit: ''
    source: 'relief study, section S8 (skill relief-scenarios): governing case, device and set pressure;
      the devices drawn are listed in piping/special-items.yaml'
    reason: 'relief study, section S8 (skill relief-scenarios): governing case, device and set pressure;
      the devices drawn are listed in piping/special-items.yaml'
sizing_basis:
- parameter: sizing_scope
  value: preliminary
  reference: 'cheme datasheets fill: the values it writes are preliminary process sizing (short-cut methods,
    declared or typical parameters), not a rating or a design to a code; not calculated: rating, mechanical
    code, materials corrosion, relief, dynamics controls (docs/framework/sizing.md)'
- parameter: design conditions
  value: rule of D-032 on the item's operating streams
  reference: DESIGN.md D-032
notes: 643 K, 4400 kPa(a). Hydrogen recycle for the hydrogenation not modelled (D-004). ASSUMED. Dimensions
  ASSUMED (D-022).
