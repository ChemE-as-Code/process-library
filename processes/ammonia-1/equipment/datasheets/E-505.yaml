design:
  pressure_barg:
    value: 162.0
    unit: barg
    source: 'design pressure = max(1.10 x, +1.7 bar over) the maximum operating gauge pressure, rounded
      up to 0.5 bar (heuristic ''10 % or 10-25 psi, whichever is greater'' of Walas, Chemical Process
      Equipment, 1988, Rules of Thumb, and Turton et al., 4th ed., 2012, as summarised by the Northwestern
      University Process Design wiki, ''Pressure Vessels''; the books were not read; the upper end 1.7
      bar taken), D-032; governing side hot_chiller_feed: 14800 kPa(a) from stream S46, stream S47'
    assumed: true
  hot_chiller_feed_pressure_barg:
    value: 162.0
    unit: barg
    source: design pressure = max(1.10 x, +1.7 bar over) the maximum operating gauge pressure, rounded
      up to 0.5 bar (heuristic '10 % or 10-25 psi, whichever is greater' of Walas, Chemical Process Equipment,
      1988, Rules of Thumb, and Turton et al., 4th ed., 2012, as summarised by the Northwestern University
      Process Design wiki, 'Pressure Vessels'; the books were not read; the upper end 1.7 bar taken),
      D-032; 14800 kPa(a) from stream S46, stream S47
    assumed: true
  cold_recycle_gas_pressure_barg:
    value: 161.0
    unit: barg
    source: design pressure = max(1.10 x, +1.7 bar over) the maximum operating gauge pressure, rounded
      up to 0.5 bar (heuristic '10 % or 10-25 psi, whichever is greater' of Walas, Chemical Process Equipment,
      1988, Rules of Thumb, and Turton et al., 4th ed., 2012, as summarised by the Northwestern University
      Process Design wiki, 'Pressure Vessels'; the books were not read; the upper end 1.7 bar taken),
      D-032; 14700 kPa(a) from stream S51, stream S39
    assumed: true
  temperature_degc:
    value: 70.0
    unit: degC
    source: 'design temperature = maximum operating temperature + 28 K (50 degF of Towler and Sinnott,
      Chemical Engineering Design, 2nd ed., 2013 / UOP and of Walas 1988, as summarised by the Northwestern
      University Process Design wiki, ''Pressure Vessels''; at least Turton''s 25 degC), rounded up to
      5 degC, D-032; maximum operating 313.15 K: stream S46 (assumed: D-012)'
    assumed: true
  minimum_design_metal_temperature_degc:
    value: -25.0
    unit: degC
    source: 'minimum design metal temperature = minimum operating temperature - 14 K (25 degF, Towler
      and Sinnott 2013 as summarised by the Northwestern Process Design wiki, Pressure Vessels), rounded
      down to 5 degC, D-032; minimum operating 263.15 K: stream S51 (assumed: D-011)'
    assumed: true
materials:
