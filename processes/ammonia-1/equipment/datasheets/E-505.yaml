    value: low-temperature carbon steel, impact tested (grade by the materials review)
    material_class: low_temperature_carbon_steel
    assumed: true
    source: 'DESIGN.md D-032: preliminary material class by service (below -29 degC minimum metal temperature:
      impact-tested steel (recycle gas from -10 degC)); the materials selection review is open'
