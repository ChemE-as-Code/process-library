    value: 1.8
    unit: m
    source: equipment/equipment-list.yaml dimensions
  length_m:
    value: 12.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  duty_kw:
    value: 46588.7
    unit: kW
    source: process/simulation-run.json (case design, cheme process simulate, DWSIM 9.0.5, Peng-Robinson,
      D-026) unit E501
  area_m2:
    value: 44544.0
    unit: m2
    source: 'A = Q / (U LMTD) = 46588.7 kW / (30 x 34.86 K), no margin, by scripts/complete_datasheets.py:
      cheme datasheets fill (core v1.0.x) sizes an exchanger only from a linked node with one material
      inlet and one outlet; this item is one two-stream exchanger node of the flowsheet, so the same method
      (counter-current LMTD, Table 12.1 middle U, no margin) is applied here; DESIGN.md D-032'
    assumed: true
  process_streams:
  - stream: S41
    direction: in
    title: Circulator discharge
    source: process/flowsheet.yaml (case design)
  - stream: S42
    direction: out
    title: Converter feed
    source: process/flowsheet.yaml (case design)
  - stream: S44
    direction: in
    title: Effluent after waste heat boiler
    source: process/flowsheet.yaml (case design)
  - stream: S45
    direction: out
    title: Effluent after feed/effluent exchanger
    source: process/flowsheet.yaml (case design)
  u_service: exchanger/gases-gases
  arrangement: counter-current
  lmtd_k:
    value: 34.86
    unit: K
    source: LMTD counter-current, hot 532.60 -> 343.15 K (S44 -> S45), cold 311.91 -> 493.84 K (S41 ->
      S42); DESIGN.md D-032
    assumed: true
  overall_u_w_m2k:
    value: 30.0
    unit: W/(m2 K)
    source: 'design typical, middle of 10-50: Sinnott, Coulson & Richardson''s Chemical Engineering Vol.
      6, 4th ed. (2005), Table 12.1, exchanger/gases-gases (the row table of cheme datasheets fill --list);
      DESIGN.md D-032'
    assumed: true
  rating:
    value: supplier
    unit: ''
    source: vendor's thermal, hydraulic or machine rating on these process conditions (not calculated
      by cheme-as-code, docs/framework/sizing.md)
    reason: vendor's thermal, hydraulic or machine rating on these process conditions (not calculated
      by cheme-as-code, docs/framework/sizing.md)
  mechanical_design:
    value: supplier
    unit: ''
    source: vendor's mechanical design to the code on the design conditions of this sheet (wall thickness,
      MAWP, nozzle loads)
    reason: vendor's mechanical design to the code on the design conditions of this sheet (wall thickness,
      MAWP, nozzle loads)
  corrosion_allowance_mm:
    value: supplier
    unit: mm
    source: corrosion allowance from the materials and corrosion review with the vendor; the material
      class on this sheet is preliminary (D-032)
    reason: corrosion allowance from the materials and corrosion review with the vendor; the material
      class on this sheet is preliminary (D-032)
  relief_protection:
    value: supplier
    unit: ''
    source: 'relief study, section S8 (skill relief-scenarios): governing case, device and set pressure;
      the devices drawn are listed in piping/special-items.yaml'
    reason: 'relief study, section S8 (skill relief-scenarios): governing case, device and set pressure;
      the devices drawn are listed in piping/special-items.yaml'
sizing_basis:
- parameter: sizing_scope
  value: preliminary
  reference: 'cheme datasheets fill: the values it writes are preliminary process sizing (short-cut methods,
    declared or typical parameters), not a rating or a design to a code; not calculated: rating, mechanical
    code, materials corrosion, relief, dynamics controls (docs/framework/sizing.md)'
- parameter: design conditions
  value: rule of D-032 on the item's operating streams
  reference: DESIGN.md D-032
- parameter: typical overall coefficient
  value: exchanger/gases-gases
  reference: DESIGN.md D-032 (Sinnott, C&R Vol. 6, 4th ed., Table 12.1)
notes: 'Feed 312 -> 503 K, effluent 547 -> 343 K, 48.4 MW (D-011). Dimensions ASSUMED (D-022). Area: the
  typical-U row for gases (Sinnott Table 12.1) is for gases near atmospheric pressure; at this design
  pressure the gas film coefficients are higher, so the area is an upper bound until the vendor''s rating
  (D-032).'
