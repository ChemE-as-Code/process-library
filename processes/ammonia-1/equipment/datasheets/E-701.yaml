# Datasheet drafted by `cheme datasheets draft`, sized by `cheme datasheets fill` and completed by
# scripts/complete_datasheets.py (DESIGN.md D-032). Preliminary process datasheet: every value
# says where it comes from; assumed: true marks an assumption; `supplier` names what a vendor,
# licensor or study still has to give. Checked by the authoring agent, not yet by an engineer.
tag: E-701
type: TubularHeatExchanger
service: Refrigerant condenser
operating:
  S88_in_pressure:
    value: 110
    unit: kPa(a)
    source: 'process/flowsheet.yaml stream S88 (case design), assumed: design basis, D-002'
    assumed: true
  S88_in_temperature:
    value: 238.7
    unit: K
    source: 'process/flowsheet.yaml stream S88 (case design), calculated: cheme process simulate: DWSIM
      9.0.5.0, Peng-Robinson (PR)'
  S88_in_flow:
    value: 7274.49
    unit: kg/h
    source: 'process/flowsheet.yaml stream S88 (case design), calculated: cheme process simulate: DWSIM
      9.0.5.0, Peng-Robinson (PR)'
  S89_out_pressure:
    value: 1700
    unit: kPa(a)
    source: 'process/flowsheet.yaml stream S89 (case design), assumed: D-017'
    assumed: true
  S89_out_temperature:
    value: 313.15
    unit: K
    source: 'process/flowsheet.yaml stream S89 (case design), assumed: D-017: condensing at 313 K'
    assumed: true
  S89_out_flow:
    value: 7274.52
    unit: kg/h
    source: 'process/flowsheet.yaml stream S89 (case design), calculated: cheme process simulate: DWSIM
      9.0.5.0, Peng-Robinson (PR)'
  case: design
design:
  pressure_barg:
    value: 18.0
    unit: barg
    source: 'design pressure = max(1.10 x, +1.7 bar over) the maximum operating gauge pressure, rounded
      up to 0.5 bar (heuristic ''10 % or 10-25 psi, whichever is greater'' of Walas, Chemical Process
      Equipment, 1988, Rules of Thumb, and Turton et al., 4th ed., 2012, as summarised by the Northwestern
      University Process Design wiki, ''Pressure Vessels''; the books were not read; the upper end 1.7
      bar taken), D-032; governing side refrigerant: 1700 kPa(a) from flash-gas stages discharge 1700
      kPa(a) condensing here (Q33, D-017), above the refrigerant''s settle-out 1554.5 kPa(a) at 313.15
      K'
    assumed: true
  refrigerant_pressure_barg:
    value: 18.0
    unit: barg
    source: design pressure = max(1.10 x, +1.7 bar over) the maximum operating gauge pressure, rounded
      up to 0.5 bar (heuristic '10 % or 10-25 psi, whichever is greater' of Walas, Chemical Process Equipment,
      1988, Rules of Thumb, and Turton et al., 4th ed., 2012, as summarised by the Northwestern University
      Process Design wiki, 'Pressure Vessels'; the books were not read; the upper end 1.7 bar taken),
      D-032; 1700 kPa(a) from flash-gas stages discharge 1700 kPa(a) condensing here (Q33, D-017), above
      the refrigerant's settle-out 1554.5 kPa(a) at 313.15 K
    assumed: true
  cooling_water_pressure_barg:
    value: supplier
    unit: barg
    source: 'cooling-water side design pressure: the site cooling-water system''s design pressure (owner''s
      utility specification; the design basis gives temperatures only, D-012)'
    reason: 'cooling-water side design pressure: the site cooling-water system''s design pressure (owner''s
      utility specification; the design basis gives temperatures only, D-012)'
  temperature_degc:
    value: 70.0
    unit: degC
    source: 'design temperature = maximum operating temperature + 28 K (50 degF of Towler and Sinnott,
      Chemical Engineering Design, 2nd ed., 2013 / UOP and of Walas 1988, as summarised by the Northwestern
      University Process Design wiki, ''Pressure Vessels''; at least Turton''s 25 degC), rounded up to
      5 degC, D-032; maximum operating 313.15 K: condensing 313.15 K (D-017)'
    assumed: true
  minimum_design_metal_temperature_degc:
    value: -50.0
    unit: degC
    source: 'minimum design metal temperature = minimum operating temperature - 14 K (25 degF, Towler
      and Sinnott 2013 as summarised by the Northwestern Process Design wiki, Pressure Vessels), rounded
      down to 5 degC, D-032; minimum operating 238.70 K: flash gas S88 238.7 K (calculated)'
    assumed: true
materials:
  main:
    value: carbon steel (grade by the materials review)
    material_class: carbon_steel
    assumed: true
    source: 'DESIGN.md D-032: preliminary material class by service (ammonia refrigerant condensing at
      40 degC); the materials selection review is open'
dimensions:
  orientation: horizontal
  outside_diameter:
    value: 2.0
    unit: m
    source: equipment/equipment-list.yaml dimensions.diameter
  overall_length:
    value: 10.0
    unit: m
    source: equipment/equipment-list.yaml dimensions.length
  tangent_length:
    value: 8.3
    unit: m
    source: 'layout/plant-model.yaml part E-701/shell: the generated shell between the heads (the 3D model''s
      proportions, not a vessel design)'
    assumed: true
  axis_deg:
    value: 0.0
    unit: deg
    source: layout/plant-model.yaml E-701 rotation_deg (layout/equipment-placement.yaml)
