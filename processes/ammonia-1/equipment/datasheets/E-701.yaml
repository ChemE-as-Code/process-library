- name: T1
  dn: 700
  lines:
  - CWR-1131
  source: pid/P-111.xml
- name: T2
  dn: 700
  lines:
  - CWS-1130
  source: pid/P-111.xml
- name: S1
  dn: 450
  lines:
  - AG-1122
  source: pid/P-111.xml
- name: S2
  dn: 200
  lines:
  - AL-1123
  source: pid/P-111.xml
type_specific:
  diameter_m:
    value: 2.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  length_m:
    value: 10.0
    unit: m
    source: equipment/equipment-list.yaml dimensions
  duty_kw:
    value: 35807.1
    unit: kW
    source: Q28 refrigerant condenser (assumed, scripts/packages_on_simulated_duties.py, D-026) + Q33
      flash-gas intercooler and condenser (calculated, process/simulation-run.json (case design, cheme
      process simulate, DWSIM 9.0.5, Peng-Robinson, D-026) unit K702 cooling_kW)
    assumed: true
  area_m2:
    value: 4628.0
    unit: m2
    source: 'A = Q / (U LMTD) = 35807.1 kW / (850 x 9.10 K), no margin, by scripts/complete_datasheets.py:
      the linked flowsheet nodes (K702, K701) are the flash-gas compressor''s, so cheme datasheets fill
      would take the wrong sides; same method applied here; DESIGN.md D-032'
    assumed: true
  process_streams:
  - stream: S88
    direction: in
    title: Product flash gas
    source: process/flowsheet.yaml (case design)
  - stream: S89
    direction: out
    title: Compressed and condensed flash gas (two-phase)
    source: process/flowsheet.yaml (case design)
  - stream: Q25
    direction: in
    title: E-504 chiller duty
    source: process/flowsheet.yaml (case design)
  - stream: Q26
    direction: in
    title: V-701 product chilling duty
    source: process/flowsheet.yaml (case design)
  - stream: Q32
    direction: in
    title: K-701 flash gas stages, shaft power
    source: process/flowsheet.yaml (case design)
  - stream: Q33
    direction: out
    title: K-701 flash gas intercooler and condenser (E-701)
    source: process/flowsheet.yaml (case design)
  - stream: Q34
    direction: in
    title: Receiver vent chiller duty
    source: process/flowsheet.yaml (case design)
  - stream: Q27
    direction: in
    title: K-701 refrigeration compressor power
    source: process/flowsheet.yaml (case design)
  - stream: Q28
    direction: out
    title: E-701 refrigerant condenser duty
    source: process/flowsheet.yaml (case design)
  - stream: Q30
    direction: in
    title: Recovered NH3 chilling duty
    source: process/flowsheet.yaml (case design)
  lmtd_k:
    value: 9.1
    unit: K
    source: LMTD counter-current, hot 313.15 -> 313.15 K (ammonia condensing, D-017), cold 298.15 -> 308.15
      K (cooling water, D-012); DESIGN.md D-032
    assumed: true
  overall_u_w_m2k:
    value: 850.0
    unit: W/(m2 K)
    source: 'design typical, middle of 700-1000: Sinnott, Coulson & Richardson''s Chemical Engineering
      Vol. 6, 4th ed. (2005), Table 12.1, condenser/organic-vapours-water (the row table of cheme datasheets
      fill --list); DESIGN.md D-032'
    assumed: true
  rating:
    value: supplier
    unit: ''
    source: vendor's thermal, hydraulic or machine rating on these process conditions (not calculated
      by cheme-as-code, docs/framework/sizing.md)
    reason: vendor's thermal, hydraulic or machine rating on these process conditions (not calculated
      by cheme-as-code, docs/framework/sizing.md)
  mechanical_design:
    value: supplier
    unit: ''
    source: vendor's mechanical design to the code on the design conditions of this sheet (wall thickness,
      MAWP, nozzle loads)
    reason: vendor's mechanical design to the code on the design conditions of this sheet (wall thickness,
      MAWP, nozzle loads)
  corrosion_allowance_mm:
    value: supplier
    unit: mm
    source: corrosion allowance from the materials and corrosion review with the vendor; the material
      class on this sheet is preliminary (D-032)
    reason: corrosion allowance from the materials and corrosion review with the vendor; the material
      class on this sheet is preliminary (D-032)
  relief_protection:
    value: supplier
    unit: ''
    source: 'relief study, section S8 (skill relief-scenarios): governing case, device and set pressure;
      the devices drawn are listed in piping/special-items.yaml'
    reason: 'relief study, section S8 (skill relief-scenarios): governing case, device and set pressure;
      the devices drawn are listed in piping/special-items.yaml'
sizing_basis:
- parameter: sizing_scope
  value: preliminary
  reference: 'cheme datasheets fill: the values it writes are preliminary process sizing (short-cut methods,
