# Datasheet drafted by `cheme datasheets draft`, sized by `cheme datasheets fill` and completed by
# scripts/complete_datasheets.py (DESIGN.md D-032). Preliminary process datasheet: every value
# says where it comes from; assumed: true marks an assumption; `supplier` names what a vendor,
# licensor or study still has to give. Checked by the authoring agent, not yet by an engineer.
tag: R-102
type: Vessel
service: Secondary (air-blown) reformer
operating:
  S11_ref_pressure:
    value: 3500
    unit: kPa(a)
    source: 'process/flowsheet.yaml stream S11 (case design), assumed: D-007'
    assumed: true
  S11_ref_temperature:
    value: 1083.15
    unit: K
    source: 'process/flowsheet.yaml stream S11 (case design), assumed: D-007'
    assumed: true
  S11_ref_flow:
    value: 122342.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S11 (case design), calculated: cheme process simulate: DWSIM
      9.0.5.0, Peng-Robinson (PR)'
  S14_air_pressure:
    value: 3550
    unit: kPa(a)
    source: 'process/flowsheet.yaml stream S14 (case design), assumed: D-007'
    assumed: true
  S14_air_temperature:
    value: 773.15
    unit: K
    source: 'process/flowsheet.yaml stream S14 (case design), assumed: D-007'
    assumed: true
  S14_air_flow:
    value: 67184.1
    unit: kg/h
    source: 'process/flowsheet.yaml stream S14 (case design), calculated: cheme process simulate: DWSIM
      9.0.5.0, Peng-Robinson (PR)'
  S17_out_pressure:
    value: 3400
    unit: kPa(a)
    source: 'process/flowsheet.yaml stream S17 (case design), assumed: D-007'
    assumed: true
  S17_out_temperature:
    value: 1264.97
    unit: K
    source: 'process/flowsheet.yaml stream S17 (case design), calculated: cheme process simulate: DWSIM
      9.0.5.0, Peng-Robinson (PR)'
  S17_out_flow:
    value: 189526.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S17 (case design), calculated: cheme process simulate: DWSIM
      9.0.5.0, Peng-Robinson (PR)'
  case: design
design:
  pressure_barg:
    value: 38.0
    unit: barg
    source: 'design pressure = max(1.10 x, +1.7 bar over) the maximum operating gauge pressure, rounded
      up to 0.5 bar (heuristic ''10 % or 10-25 psi, whichever is greater'' of Walas, Chemical Process
      Equipment, 1988, Rules of Thumb, and Turton et al., 4th ed., 2012, as summarised by the Northwestern
      University Process Design wiki, ''Pressure Vessels''; the books were not read; the upper end 1.7
      bar taken), D-032; maximum operating 3550 kPa(a): stream S14 (assumed: D-007)'
    assumed: true
  temperature_degc:
    value: 1315.0
    unit: degC
    source: 'design temperature = maximum operating temperature + 28 K (50 degF of Towler and Sinnott,
      Chemical Engineering Design, 2nd ed., 2013 / UOP and of Walas 1988, as summarised by the Northwestern
      University Process Design wiki, ''Pressure Vessels''; at least Turton''s 25 degC), rounded up to
      5 degC, D-032; maximum operating 1560.07 K: stream S16 (calculated: cheme process simulate: DWSIM
      9.0.5.0, Peng-Robinson (PR))'
    assumed: true
  note: above 345 degC the D-032 margin is a process allowance; the metal temperature (refractory, tube
    wall, flue-gas side) is the vendor's
materials:
  main:
    value: steel shell with internal refractory lining (by the vendor)
    material_class: lined_steel
    assumed: true
    source: 'DESIGN.md D-032: preliminary material class by service (burner zone at about 1290 degC: refractory-lined
      shell); the materials selection review is open'
dimensions:
