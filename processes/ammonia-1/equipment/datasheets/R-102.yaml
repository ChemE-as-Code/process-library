    value: 10.7
    unit: m
    source: 'layout/plant-model.yaml part R-102/shell: the generated shell between the heads (the 3D model''s
      proportions, not a vessel design)'
    assumed: true
  support:
    height:
      value: 3.05
      unit: m
      source: 'layout/plant-model.yaml parts R-102/shell, R-102/skirt: the bottom tangent line above the
        base (the 3D model''s proportions, not a design)'
      assumed: true
