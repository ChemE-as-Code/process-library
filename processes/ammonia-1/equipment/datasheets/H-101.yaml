sizing_basis:
- parameter: sizing_scope
  value: preliminary
  reference: 'cheme datasheets fill: the values it writes are preliminary process sizing (short-cut methods,
    declared or typical parameters), not a rating or a design to a code; not calculated: rating, mechanical
    code, materials corrosion, relief, dynamics controls (docs/framework/sizing.md)'
- parameter: design conditions
  value: rule of D-032 on the item's operating streams
  reference: DESIGN.md D-032
notes: 'Fired with natural gas and HRU tail gas, 10 % excess O2, bridgewall 1323 K, stack 423 K; radiant
  duty 68.4 MW (D-014). ASSUMED. Dimensions: the radiant box; the convection coils are listed and placed
  as their own banks (D-022), ASSUMED.'
