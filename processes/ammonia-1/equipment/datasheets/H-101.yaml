# Datasheet drafted by `cheme datasheets draft`, sized by `cheme datasheets fill` and completed by
# scripts/complete_datasheets.py (DESIGN.md D-032). Preliminary process datasheet: every value
# says where it comes from; assumed: true marks an assumption; `supplier` names what a vendor,
# licensor or study still has to give. Checked by the authoring agent, not yet by an engineer.
tag: H-101
type: Furnace
service: Primary reformer furnace (radiant and convection sections)
operating:
  inlet_pressure:
    value: 104.0
    unit: kPa(a)
    source: 'process/flowsheet.yaml stream S64 (case design), assumed: D-014'
    assumed: true
  inlet_temperature:
    value: 491.168
    unit: K
    source: 'process/flowsheet.yaml stream S64 (case design), calculated: cheme process simulate: DWSIM
      9.0.5.0, Peng-Robinson (PR)'
    origin: simulated
  inlet_flow:
    value: 176411.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S64 (case design), calculated: cheme process simulate: DWSIM
      9.0.5.0, Peng-Robinson (PR)'
    origin: simulated
  case: design
design:
  pressure_barg:
    value: supplier
    unit: barg
    source: firebox casing design pressure (draft, fan shut-off) by the furnace vendor
    reason: firebox casing design pressure (draft, fan shut-off) by the furnace vendor
  temperature_degc:
    value: 1080.0
    unit: degC
    source: 'design temperature = maximum operating temperature + 28 K (50 degF of Towler and Sinnott,
      Chemical Engineering Design, 2nd ed., 2013 / UOP and of Walas 1988, as summarised by the Northwestern
      University Process Design wiki, ''Pressure Vessels''; at least Turton''s 25 degC), rounded up to
      5 degC, D-032; maximum operating 1323.15 K: stream S65 (assumed: D-014: bridgewall temperature)'
    assumed: true
  note: above 345 degC the D-032 margin is a process allowance; the metal temperature (refractory, tube
    wall, flue-gas side) is the vendor's
materials:
  main:
    value: steel shell with internal refractory lining (by the vendor)
    material_class: lined_steel
    assumed: true
    source: 'DESIGN.md D-032: preliminary material class by service (fired box: refractory-lined casing);
      the materials selection review is open'
dimensions:
