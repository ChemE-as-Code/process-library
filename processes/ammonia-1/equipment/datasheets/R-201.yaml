  outlet_pressure:
    value: 3300.0
    unit: kPa(a)
    source: 'process/flowsheet.yaml stream S19 (case design), assumed: D-008'
    assumed: true
  outlet_temperature:
    value: 716.9
    unit: K
    source: 'process/flowsheet.yaml stream S19 (case design), calculated: cheme process simulate: DWSIM
      9.0.5.0, Peng-Robinson (PR)'
    origin: simulated
  outlet_flow:
    value: 189526.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S19 (case design), calculated: cheme process simulate: DWSIM
      9.0.5.0, Peng-Robinson (PR)'
    origin: simulated
design:
  pressure_barg:
    value: 36.0
    unit: barg
    source: 'design pressure = max(1.10 x, +1.7 bar over) the maximum operating gauge pressure, rounded
      up to 0.5 bar (heuristic ''10 % or 10-25 psi, whichever is greater'' of Walas, Chemical Process
      Equipment, 1988, Rules of Thumb, and Turton et al., 4th ed., 2012, as summarised by the Northwestern
      University Process Design wiki, ''Pressure Vessels''; the books were not read; the upper end 1.7
      bar taken), D-032; maximum operating 3350 kPa(a): stream S18 (assumed: D-008)'
    assumed: true
  temperature_degc:
    value: 475.0
    unit: degC
    source: 'design temperature = maximum operating temperature + 28 K (50 degF of Towler and Sinnott,
      Chemical Engineering Design, 2nd ed., 2013 / UOP and of Walas 1988, as summarised by the Northwestern
      University Process Design wiki, ''Pressure Vessels''; at least Turton''s 25 degC), rounded up to
      5 degC, D-032; maximum operating 716.90 K: stream S19 (calculated: cheme process simulate: DWSIM
      9.0.5.0, Peng-Robinson (PR))'
    assumed: true
  note: above 345 degC the D-032 margin is a process allowance; the metal temperature (refractory, tube
    wall, flue-gas side) is the vendor's
materials:
  main:
    value: low-alloy Cr-Mo steel (grade by the materials review)
    material_class: low_alloy_steel
    assumed: true
    source: 'DESIGN.md D-032: preliminary material class by service (hydrogen-bearing gas above the carbon-steel
      range of API RP 941 (Nelson curves)); the materials selection review is open'
