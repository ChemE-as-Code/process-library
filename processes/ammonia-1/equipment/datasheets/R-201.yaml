    source: 'process/flowsheet.yaml stream S18 (case design), assumed: D-008'
    assumed: true
  inlet_temperature:
    value: 643.15
    unit: K
    source: 'process/flowsheet.yaml stream S18 (case design), assumed: D-008'
    assumed: true
  inlet_flow:
    value: 189526.0
    unit: kg/h
    source: 'process/flowsheet.yaml stream S18 (case design), calculated: cheme process simulate: DWSIM
      9.0.5.0, Peng-Robinson (PR)'
