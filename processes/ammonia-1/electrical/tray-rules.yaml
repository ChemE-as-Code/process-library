# Cable tray rules (skill electrical-cabling). Schema: `cheme schema trays`. Every value not
# given here is the package default (ASSUMED, see `cheme schema trays`).
schema: cheme/trays/v1
rules:
  # S11 (D-048, core v1.2.0 power_trays): the racks whose single 900 mm power tray was over its
  # 30 % fill (gate electrical) carry their power cables in trays of one voltage class each,
  # side by side on the rack's tray tier: 10 kV (hv) and 400 V (lv) apart. PR-1 carries nine
  # 10 kV feeders from SWG-1 (53-54 % of one tray) and the two 400 V reflux pump feeders from
  # MCC-1; PR-10 and PR-7 the three 10 kV feeders of K-501, K-502 and K-701 (31 %)
  power_trays:
    - {rack: PR-1, trays: [hv, hv, lv]}
    - {rack: PR-10, trays: [hv, hv]}
    - {rack: PR-7, trays: [hv, hv]}
notes: >-
  S11 (D-048): HV and LV power cables in separate trays on PR-1, two HV trays on PR-10 and PR-7,
  sized by the build against the default fill (30 % power, ASSUMED). Tray widths, depth, fill
  and separation are the package defaults (ASSUMED) until the project's electrical standard
  gives them.
