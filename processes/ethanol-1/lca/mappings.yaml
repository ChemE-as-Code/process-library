# ethanol-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# Preliminary inventory (DESIGN.md D-013): every other exchange (ethylene, water, power, cooling
# water, off-gas and wastewater treatment, consumables) stays unmapped on purpose and is
# reported as a gap of this process, never linked to a guess.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  # The steam is counted as the heat it delivers (kWh) by cheme; the registry slug `steam` is
  # counted by mass, so the shared entry for heat from steam is named instead (as hda-1,
  # nitric-acid-1, chlor-alkali-1, soda-ash-1). The background does not distinguish the level.
  "feed:HPS": {use: steam-heat, source: "HP steam 4200 kPa(a) to the reactor feed superheater E-102, counted as heat delivered (kWh), stream Q4"}
  "feed:LPS": {use: steam-heat, source: "LP steam 450 kPa(a) to the column reboilers C-201 and C-202, counted as heat delivered (kWh), streams Q7, Q9"}
  # Mapping step of 2026-11-01 (ADR 0026): each entry below uses a reference the library already
  # holds. Notes above that call these exchanges unmapped describe the state before it. What is
  # still unmapped is a gap (lci/gaps.json), and this process is marked preliminary.
  "feed:ETHYLENE": {dataset: {path: processes/ethylene-1/lca/dataset.yaml, product: "product:ETHYLENE"}, source: "the Atlas producer ethylene-1, polymer-grade ethylene, from a steam cracker as this feed says"}
  "consumable:molecular-sieve": {use: adsorbent, source: "molecular sieve 3A; the shared entry is zeolite powder as the proxy"}
  "disposal:consumable.molecular-sieve": {use: inert-waste-landfill, source: "spent zeolite to landfill, inert as the dataset says"}
  "disposal:consumable.hydration-catalyst": {use: inert-waste-landfill, source: "ASSUMED inert mineral solid: the dataset sends it to landfill (spent silica after neutralisation)"}
