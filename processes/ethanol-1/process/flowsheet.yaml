    from: C101.gas_out
    to: SPL1.in
    template: mixture
    state:
      design:
        pressure: {value: 6800, provenance: assumed, source: D-005}
        temperature: {value: 313.15, provenance: assumed, source: D-005}
        flow: {value: 165827.85, basis: mass, provenance: assumed, source: "scripts/balance.py, specified recoveries (D-005)"}
