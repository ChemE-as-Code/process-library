        flow: {value: 210432.53, basis: mass, provenance: assumed, source: "scripts/balance.py (D-006): S3 through the feed side of E-101"}
        composition: {basis: mole_fraction, values: {C2H4: 0.70035843, C2H6: 0.02725568, CH4: 0.00706770, H2O: 0.24512545, ETOH: 0.00018846, DEE: 0.00021818, C4H8: 0.01978610}, provenance: assumed, source: "scripts/balance.py (D-006)"}
  - id: S5
