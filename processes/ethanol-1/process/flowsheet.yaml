  - id: S9
    title: HP separator gas
    from: V101.vap
    to: C101.gas_in
    template: mixture
    state:
      design:
        pressure: {value: 6850, provenance: assumed, source: D-005}
        temperature: {value: 313.15, provenance: assumed, source: D-005}
