# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Ethanol by vapour-phase direct hydration of ethylene (D-001). Where the values come from:
# - S1 (fresh ethylene), S28 (make-up water) and the temperatures and pressures are design
#   choices (design basis, D-002, D-003), ASSUMED;
# - the reactor outlet S6 is calculated by cheme (conversion and selectivity, D-004);
# - flows and compositions through mixers, splitters, pumps, compressors, heaters and coolers
#   are calculated by `cheme process propagate --fill`;
# - separator, scrubber, column, sieve and exchanger outlets and all duties come from the
#   independent balance scripts/balance.py (D-005, D-006), given here as ASSUMED: core cannot
#   qualify flashes, enthalpies or distillation of ethylene / water / ethanol yet (core #315).
schema: cheme/process/v1
kind: flowsheet
title: Ethanol by direct hydration of ethylene (100 000 t/a anhydrous)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 12 500 kg/h anhydrous ethanol, 5 % ethylene conversion per pass, water/ethylene 0.35 (D-003, D-004)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: ETHYLENE, title: Polymer-grade ethylene from a steam cracker, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: WATER, title: Demineralised make-up water, category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: k101, direction: out, kind: energy}
      - {id: k102, direction: out, kind: energy}
      - {id: p101, direction: out, kind: energy}
      - {id: v301, direction: out, kind: energy}
  - id: HPS
    title: HP steam 4200 kPa(a)
    category: utility
    utility:
      kind: steam
      level: HP
      pressure: {value: 4200, provenance: assumed, source: "design basis, D-008"}
      supply_temperature: {value: 526.4, provenance: assumed, source: "saturation at 4200 kPa(a), D-008"}
      min_approach: {value: 10, provenance: assumed, source: D-008}
    ports: [{id: e102, direction: out, kind: energy}]
  - id: LPS
    title: LP steam 450 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis, D-008"}
      supply_temperature: {value: 420.8, provenance: assumed, source: "saturation at 450 kPa(a), D-008"}
      min_approach: {value: 10, provenance: assumed, source: D-008}
    ports: [{id: c201, direction: out, kind: energy}, {id: c202, direction: out, kind: energy}]
products:
  - {id: ETOH, title: Anhydrous ethanol to storage, category: product, ports: [{id: in, direction: in}]}
  - id: FUELGAS
    title: Loop purge and light-ends off-gas to the fuel-gas header
    category: off_gas
    ports: [{id: purge, direction: in}, {id: lights, direction: in}]
  - {id: WW, title: Water-loop blowdown to wastewater treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-008"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-008"}
      min_approach: {value: 5, provenance: assumed, source: D-008}
    ports:
      - {id: e103, direction: in, kind: energy}
      - {id: k102, direction: in, kind: energy}
      - {id: c201, direction: in, kind: energy}
      - {id: c202, direction: in, kind: energy}
      - {id: v301, direction: in, kind: energy}

blocks:
  - id: REA
    title: Hydration reaction loop
    class: ReactingChemicals
    ports:
      - {id: eth, direction: in}
      - {id: water, direction: in}
      - {id: wash, direction: in}
      - {id: flashgas, direction: in}
      - {id: purge, direction: out}
      - {id: crude, direction: out}
      - {id: scrub, direction: out}
      - {id: power1, direction: in, kind: energy}
      - {id: power2, direction: in, kind: energy}
      - {id: steam, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
  - id: PUR
    title: Crude ethanol recovery and distillation
    class: Distilling
    ports:
      - {id: crude, direction: in}
      - {id: scrub, direction: in}
      - {id: regen, direction: in}
      - {id: makeup, direction: in}
      - {id: flashgas, direction: out}
      - {id: lights, direction: out}
      - {id: hydrous, direction: out}
      - {id: ww, direction: out}
      - {id: wash, direction: out}
      - {id: water, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: steam1, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
  - id: DEH
    title: Ethanol dehydration (molecular sieve)
    class: Adsorbing
    ports:
      - {id: hydrous, direction: in}
      - {id: product, direction: out}
      - {id: regen, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}

steps:
  - id: M101
    block: REA
    title: Fresh ethylene / recycle gas junction
    class: Mixing
    ports:
      - {id: fresh, direction: in, delegates: eth}
      - {id: rec, direction: in}
      - {id: flash, direction: in}
      - {id: out, direction: out}
  - id: M102
    block: REA
    title: Process water injection
    class: Mixing
    ports:
      - {id: gas, direction: in}
      - {id: water, direction: in, delegates: water}
      - {id: out, direction: out}
  - id: E101
    block: REA
    title: Reactor feed/effluent exchanger (water evaporation / condensation)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: cold_in, direction: in}
      - {id: cold_out, direction: out}
      - {id: hot_in, direction: in}
      - {id: hot_out, direction: out}
  - id: E102
    block: REA
    title: Reactor feed superheater (HP steam)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
  # D-003, D-004: adiabatic fixed bed; 5 % of the inlet ethylene converted (US 4003952),
  # selectivities ASSUMED; no kinetics.
  - id: R101
    block: REA
    title: Hydration reactor (H3PO4 on silica, adiabatic)
    class: ReactingChemicals
    reactions: [HYD, ETHER, OLIGO]
    reactor: conversion
    selectivity:
      key: C2H4
      conversion: 0.05
      products: {ETOH: 0.97, DEE: 0.01, C4H8: 0.005}
      provenance: assumed
      source: "conversion: US 4003952, Background (4-5 % of the ethylene per pass); selectivities ASSUMED within the patent's by-product range (D-004)"
    catalyst: H3PO4_SIO2
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: E103
    block: REA
    title: Reactor effluent cooler / condenser
    class: Cooling
    links: [{target: equipment, ref: E-103}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: V101
    block: REA
    title: HP separator
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: in, direction: in}
      - {id: vap, direction: out}
      - {id: liq, direction: out, delegates: crude}
  - id: C101
    block: REA
    title: Recycle gas water scrubber
    class: Absorbing
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: gas_in, direction: in}
      - {id: wash, direction: in, delegates: wash}
      - {id: gas_out, direction: out}
      - {id: bot, direction: out, delegates: scrub}
  # D-005: purge fraction ASSUMED (loop inerts ~7 mol%, ethylene loss ~1.9 % of the fresh feed)
  - id: SPL1
    block: REA
    title: Loop purge take-off
    class: SplittingMaterial
    split: {purge: 0.001}
    ports:
      - {id: in, direction: in}
      - {id: purge, direction: out, delegates: purge}
      - {id: recycle, direction: out}
  - id: K101
    block: REA
    title: Recycle gas compressor
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power1}
  - id: K102
    block: REA
    title: Flash gas compressor (three stages, intercooled)
    class: Compressing
    links: [{target: equipment, ref: K-102}]
    ports:
      - {id: in, direction: in, delegates: flashgas}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power2}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  - id: V102
    block: PUR
    title: Crude ethanol let-down flash drum
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-102}]
    ports:
      - {id: in1, direction: in, delegates: crude}
      - {id: in2, direction: in, delegates: scrub}
      - {id: gas, direction: out, delegates: flashgas}
      - {id: liq, direction: out}
  - id: E201
    block: PUR
    title: Crude / column bottoms interchanger
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: cold_in, direction: in}
      - {id: cold_out, direction: out}
      - {id: hot_in, direction: in}
      - {id: hot_out, direction: out}
  - id: C201
    block: PUR
    title: Light-ends column (ether, butenes, dissolved gas)
    class: Distilling
    links: [{target: equipment, ref: C-201}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out, delegates: lights}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: steam1}
      - {id: cond, direction: out, kind: energy, delegates: cw1}
  - id: C202
    block: PUR
    title: Ethanol concentrating column
    class: Distilling
    links: [{target: equipment, ref: C-202}]
    ports:
      - {id: feed, direction: in}
      - {id: regen, direction: in, delegates: regen}
      - {id: top, direction: out, delegates: hydrous}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: steam2}
      - {id: cond, direction: out, kind: energy, delegates: cw2}
  # D-005: blowdown fraction ASSUMED (dissolved sodium phosphate and heavies leave here)
  - id: SPL2
    block: PUR
    title: Water-loop blowdown
    class: SplittingMaterial
    split: {ww: 0.1}
    ports:
      - {id: in, direction: in}
      - {id: ww, direction: out, delegates: ww}
      - {id: rec, direction: out}
  - id: M104
    block: PUR
    title: Make-up water junction
    class: Mixing
    ports:
      - {id: rec, direction: in}
      - {id: mu, direction: in, delegates: makeup}
      - {id: out, direction: out}
  - id: P101
    block: PUR
    title: Process water pump
    # TransportingFluids, not Pumping: cheme process build stops on a Pumping step (its DEXPI
    # method field is a Union the builder cannot enumerate; core bug, DESIGN.md D-011)
    class: TransportingFluids
    links: [{target: equipment, ref: P-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  # D-005: 3600 kg/h wash water to C-101 (ASSUMED), the rest to the reactor feed
  - id: SPL3
    block: PUR
    title: Wash water / reactor water split
    class: SplittingMaterial
    split: {wash: 0.09211096}
    ports:
      - {id: in, direction: in}
      - {id: wash, direction: out, delegates: wash}
      - {id: rx, direction: out, delegates: water}
  - id: V301
    block: DEH
    title: Molecular sieve dehydration (vapour phase, vacuum regeneration)
    class: Adsorbing
    links: [{target: equipment, ref: V-301}]
    ports:
      - {id: in, direction: in, delegates: hydrous}
      - {id: product, direction: out, delegates: product}
      - {id: regen, direction: out, delegates: regen}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: cw, direction: out, kind: energy, delegates: cw}

streams:
  - id: S1
    title: Fresh ethylene
    from: ETHYLENE.out
    to: M101.fresh
    template: mixture
    state:
      design:
        pressure: {value: 7300, provenance: assumed, source: "design basis, D-002"}
        temperature: {value: 303.15, provenance: assumed, source: "design basis, D-002"}
        flow: {value: 8076.49, basis: mass, provenance: assumed, source: "scripts/balance.py: the fresh ethylene that gives 12 475 kg/h ethanol in the product (D-002, D-006)"}
        composition: {basis: mole_fraction, values: {C2H4: 0.999, C2H6: 0.0008, CH4: 0.0002}, provenance: assumed, source: "design basis, polymer-grade ethylene (D-002)"}
  - id: S2
    title: Cycle gas
    from: M101.out
    to: M102.gas
    template: mixture
    state:
      design:
        pressure: {value: 7300, provenance: assumed, source: D-003}
        temperature: {value: 318.15, provenance: assumed, source: "scripts/balance.py (D-006)"}
