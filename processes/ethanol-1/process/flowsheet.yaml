        flow: {value: 210432.53, basis: mass, provenance: calculated, source: 'cheme process propagate: pass-through E102 from S4', fingerprint: 53c4bb46b62598d2}
        composition: {basis: mole_fraction, values: {C2H4: 0.70035843, C2H6: 0.02725568, CH4: 0.0070677, H2O: 0.24512545, ETOH: 0.00018846, DEE: 0.00021818, C4H8: 0.0197861}, provenance: calculated, source: 'cheme process propagate: pass-through E102 from S4', fingerprint: 53c4bb46b62598d2}
