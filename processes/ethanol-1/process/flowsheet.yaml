        composition: {basis: mole_fraction, values: {C2H4: 0.700358, C2H6: 0.0272556, CH4: 0.0070677, H2O: 0.245126, ETOH: 0.000188461, DEE: 0.000218185, C4H8: 0.0197861}, provenance: calculated, source: 'cheme process propagate: mixer M102 from S2 S31', fingerprint: 03ef703f7bd3c876}
