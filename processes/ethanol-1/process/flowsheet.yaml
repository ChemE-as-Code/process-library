        composition: {basis: mole_fraction, values: {C2H4: 0.92586294, C2H6: 0.03792798, CH4: 0.00984796, H2O: 0.00058823, ETOH: 1.43e-05, DEE: 9.516e-05, C4H8: 0.02566343}, provenance: calculated, source: 'cheme process propagate: splitter SPL1 from S11', fingerprint: b0a08cbb8a484de1}
