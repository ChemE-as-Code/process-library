    from: E101.hot_out
    to: E103.in
    template: mixture
    state:
      design:
        pressure: {value: 6900, provenance: assumed, source: D-003}
        temperature: {value: 355.46, provenance: assumed, source: "scripts/balance.py, E-101 energy balance (D-006)"}
        flow: {value: 210432.53, basis: mass, provenance: assumed, source: "scripts/balance.py (D-006): S6 through the effluent side of E-101"}
        composition: {basis: mole_fraction, values: {C2H4: 0.68935975, C2H6: 0.02823963, CH4: 0.00732285, H2O: 0.21841819, ETOH: 0.03538889, DEE: 0.00058888, C4H8: 0.02068181}, provenance: assumed, source: "scripts/balance.py (D-006); must equal cheme's S6"}
