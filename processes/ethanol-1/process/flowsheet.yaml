        composition: {basis: mole_fraction, values: {C2H4: 0.927129, C2H6: 0.0360808, CH4: 0.00935617, H2O: 0.000713249, ETOH: 0.000239568, DEE: 0.000288832, C4H8: 0.0261927}, provenance: calculated, source: 'cheme process propagate: mixer M101 from S1 S15 S34', fingerprint: b49a5b24f026327c}
