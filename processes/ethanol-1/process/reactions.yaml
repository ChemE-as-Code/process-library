    equation: C2H4 + H2O <=> C2H5OH
    stoichiometry: {C2H4: -1, H2O: -1, ETOH: 1}
    reversible: true
    heat_of_reaction: {value: -45308.0, provenance: calculated, source: "ideal-gas formation enthalpies of materials.yaml (ATcT), 298.15 K"}
