    sources: ["US 4003952 (Background: phosphoric acid on celite, 4-5 % of the ethylene converted per pass)", "US 5349096 (phosphoric acid on silica, 225-280 C, 3-10 MPa, water/ethylene 0.15-0.50 mol)"]
  - id: ETHER
    equation: 2 C2H4 + H2O <=> (C2H5)2O
    stoichiometry: {C2H4: -2, H2O: -1, DEE: 1}
    reversible: true
    heat_of_reaction: {value: -115398.0, provenance: calculated, source: "ideal-gas formation enthalpies of materials.yaml, 298.15 K"}
    catalyst: H3PO4_SIO2
    sources: ["US 4003952 (Background: diethyl ether the principal by-product, 1-10 % of the ethanol made)"]
