# Reactions of the ethylene hydration reactor R-101. Schema: `cheme schema process-reactions`.
# The reactor model is a sourced conversion with ASSUMED selectivities (DESIGN.md D-004), set
# on the step R101 of process/flowsheet.yaml; no kinetics are used or claimed. Heats of
# reaction: ideal gas at 298.15 K from the formation enthalpies of process/materials.yaml.
schema: cheme/reactions/v1
kind: reactions
reactions:
