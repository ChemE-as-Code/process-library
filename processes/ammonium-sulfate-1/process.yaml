# Process Atlas manifest. Schema: schemas/process.schema.json. A manifest-only process: its LCI
# dataset is lca/datasets/*.yaml, Tier 0 form, so maturity stays at concept
# (core's cheme.lci-tier-maturity). See README.md.
schema: cheme-as-code/process/v1
id: ammonium-sulfate-1
title: Ammonium sulfate by direct neutralisation of ammonia with sulfuric acid
summary: >-
  Tier 0 screening per tonne of crystalline ammonium sulfate from a continuous saturator-crystallizer:
  stoichiometry with US EPA dryer dust, no crystallizer heat (the heat of reaction evaporates the water),
  an estimated dryer steam, electricity from core's default. No flowsheet; not reviewed.
families: [fertilizers]
keywords: [ammonium sulfate, ammonium sulphate, neutralisation, reaction crystallization, saturator, fertilizer, ammonia, sulfuric acid]
facets: {feedstock_basis: [fossil, mineral], product_classes: [fertilizers], unit_operations: [reaction, crystallization, centrifugation, drying], region: generic}
maturity: concept
validation: {status: unreviewed}
chemistry:
  inputs:
    - {chemical: ammonia, role: feedstock, inventory_key: "feed:ammonia"}
    - {chemical: sulfuric-acid, role: feedstock, inventory_key: "feed:sulfuric-acid", note: "counted as 100 % H2SO4; delivered as 98.5 wt% acid"}
  outputs:
    - {chemical: ammonium-sulfate, role: main-product, inventory_key: "product:ammonium-sulfate"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:electricity", note: "core's Tier 0 default (ASSUMED, dated)"}
    - {chemical: steam, role: utility, inventory_key: "feed:steam", note: "dryer only, counted as heat delivered; our estimate with an ASSUMED dryer efficiency"}
basis: {capacity: "per tonne of ammonium sulfate (the dataset's basis); no plant size"}
publication: {status: public, license: CC-BY-4.0}
references:
  - {title: "US EPA (1993, reformatted 1995) AP-42, Compilation of Air Pollutant Emission Factors, 5th ed., Vol. I, section 8.4 Ammonium Sulfate", url: "https://gaftp.epa.gov/ap42/ch08/s04/final/c08s04_1995.pdf"}
  - {title: "Pacific Environmental Services for US EPA (1996) Background report, AP-42 section 6.18 (now 8.4), Ammonium Sulfate", url: "https://epa.gov/sites/production/files/2020-09/documents/final_background_document_for_ammonium_sulfate_section_8.4.pdf"}
  - {title: "UNIDO, fertilizer manual chapter VIII, Ammonium Salts, Nitric Acid, and Nitrates (UNIDO Open Archive document 19836, undated, literature to 1992)", url: "https://downloads.unido.org/ot/48/19/4819811/15001-20000_19836.pdf"}
  - {title: "GEA Messo PT (2010) Ammonium Sulfate, Fertilizer Industry, brochure 03/2010 (manufacturer literature)", url: "https://www.gea.com/assets/170152"}
  - {title: "US EPA (1980) Standards of Performance for New Stationary Sources; Ammonium Sulfate Manufacture, 45 Fed. Reg. 74846 (40 CFR 60 subpart PP)", url: "https://19january2021snapshot.epa.gov/sites/static/files/2015-07/documents/45fedreg74851.pdf"}
repository: {url: "https://github.com/ChemE-as-Code/process-library", path: processes/ammonium-sulfate-1, access: public}
