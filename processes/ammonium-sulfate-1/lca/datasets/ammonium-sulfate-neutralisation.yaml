# Tier 0 form, process-library#313 pilot without a flowsheet. Every amount is the formula of its parameters;
# core's validator re-checks each. Written from US EPA AP-42 section 8.4, a UNIDO fertilizer manual chapter
# and a crystallizer supplier's brochure (facts in our own form); electricity is core's Tier 0 default.
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: ammonium-sulfate-neutralisation
title: Ammonium sulfate by direct neutralisation of ammonia with sulfuric acid
description: Tier 0 screening estimate per 1 t of crystalline ammonium sulfate, gate-to-gate. Anhydrous
  ammonia and strong sulfuric acid react in a continuous saturator-crystallizer whose heat of reaction
  evaporates the water, so the crystallizer takes no external heat; the crystals are centrifuged, dried
  in a steam-heated rotary dryer and screened. Feeds from stoichiometry with the sourced dryer dust; the
  dryer heat is our estimate from the sourced cake moisture; electricity from core's Tier 0 default.
basis: 1000 kg of ammonium sulfate
boundary: 'gate-to-gate: saturator-crystallizer, centrifuge, dryer with wet scrubber, screening; steam
  and power from outside; storage and bagging outside'
technology: synthetic (on-purpose) ammonium sulfate by reaction crystallization; the caprolactam, coke-oven
  and other by-product routes are not modelled
geography:
  description: 'Mixed: US dryer emission tests (1978 to 1990), a UNIDO manual chapter and a European
    supplier''s brochure (2010); no single site.'
classification:
  isic: '2012'
system_boundary:
  included:
  - ammonia and sulfuric acid (100 % H2SO4 basis)
  - electricity (default) and dryer steam (estimate)
  - ammonium sulfate dust from the dryer scrubber stack
  excluded:
  - 'TODO the water balance: water of the 98.5 wt% acid and make-up water evaporated by the heat of reaction
    (about 0.75 to 0.9 t per t of product, liquid or gaseous ammonia feed, by our heat balance from
    the UNIDO heat of reaction, not a sourced figure), its condensation in the vacuum system, the condensate fate and the cooling water'
  - 'TODO ammonia to air from the crystallizer vent and the dryer: no open figure (AP-42 background report
    section 4.3 found no ammonia data); the source says ammonia losses arise when the liquor is not kept
    acid'
  - 'TODO motive steam of vacuum ejectors, if the vacuum is made by ejectors: not stated in the sources
    read'
  - 'TODO wash water and weak ammonia of the centrifuge wash (UNIDO chapter VIII), mother-liquor purge
    and scrubber liquor: recycled to the crystallizer in the sources read, not quantified'
  - fugitive dust of screening and handling (enclosed; AP-42 8.4.3 calls these not significant)
  - crystal modifiers and corrosion inhibitors (trace additives named by UNIDO chapter VIII, not quantified)
  - infrastructure
  cutoff: anti-caking agent cut by the library's 1 % mass rule (cutoff); the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
cutoff:
- key: input:anti-caking-agent
  title: Anti-caking agent (a heavy organic) added after drying
  direction: input
  amount: 0.5
  unit: kg
  reason: 'about 0.05 % of the product at synthetic plants (AP-42 8.4.2); its identity is not stated
    (a high molecular weight organic), so it cannot be linked or balanced; 0.05 % of the input mass,
    below the 1 % rule'
  source: US EPA AP-42, 5th ed., section 8.4 (7/93, reformatted 1/95), 8.4.2
location: GLO
year: 2010
valid_until: 2015
time:
  start: 1978
  description: 'Dryer emission tests of 1978 to 1990 (AP-42 section 8.4, 1993/1995), a UNIDO manual chapter
    citing literature to 1992, a supplier''s brochure of 2010. valid_until is the reference year + 5
    (system-model section 6), so it has already lapsed.'
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation. The by-product routes (caprolactam, coke oven) are
    co-products of other processes and are not represented here.'
