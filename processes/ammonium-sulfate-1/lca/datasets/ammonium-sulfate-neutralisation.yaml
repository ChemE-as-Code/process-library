- key: feed:steam
  title: Steam to the rotary dryer's air heater, as heat delivered
  type: input
  amount: 20.9167444303365
  unit: kWh
  formula: as_ * (w_cake / (1 - w_cake) - w_prod / (1 - w_prod)) * h_evap / eta_dry
  provenance: assumed
  origin: estimate
  source: 'our estimate: the water removed from the centrifuge cake (AP-42 8.4.2 moisture to the UNIDO
    product specification) times its latent heat, over an ASSUMED dryer efficiency. The crystallizer
    takes no steam: the heat of reaction of reasonably concentrated reactants evaporates the water without
    an external energy source (GEA Messo PT brochure 2010, PDF p. 4 and p. 6; UNIDO chapter VIII, Production
    Details); a plant with dilute or spent acid would need evaporator steam, which is not counted (GEA
    PDF p. 4: most ammonium sulfate crystallizers run in the steam-heated evaporative mode). AP-42 8.4.2
    names steam-heated and oil- or gas-fired dryers; steam heating is ASSUMED'
  pedigree:
