  source: 'ASSUMED analogue: EU JRC (2007) LVIC-AAF BREF (Best Available Techniques for the Manufacture of
    Large Volume Inorganic Chemicals - Ammonia, Acids and Fertilisers), Table 9.3, p. 370 (solid AN, new AN
    facility, EFMA 2000); the midpoint is our choice. A solid AN plant runs the same kind of machines (a
    neutraliser, liquor pumps, a particle-forming step, product drying or cooling with fans, and scrubbers);
