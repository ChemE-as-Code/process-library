parameters:
- name: as_
  value: 1000.0
  unit: kg
  description: Ammonium sulfate delivered (the basis), as dry (NH4)2SO4.
  source: basis
- name: M_NH3
  value: 17.031
  unit: g/mol
  description: Molar mass of ammonia.
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573),
    applied to the formula
- name: M_H2SO4
  value: 98.072
  unit: g/mol
  description: Molar mass of sulfuric acid.
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573),
    applied to the formula
- name: M_AS
  value: 132.134
  unit: g/mol
  description: Molar mass of ammonium sulfate, (NH4)2SO4.
  source: IUPAC 2021 abridged standard atomic weights (Prohaska et al. 2022, Pure Appl. Chem. 94:573),
    applied to the formula
- name: pm
  value: 0.02
  unit: kg
  description: 'Filterable particulate (ammonium sulfate dust) per t of product from a rotary dryer with
    a wet scrubber. The older controlled rotary-dryer tests of the background report (1978/79, cyclonic
    and venturi scrubbers) gave 0.08 and 0.16 kg/t, and AP-42 gives 0.14 kg/t for a fluidized-bed dryer
    with a wet scrubber; 0.16 kg/t is used as the upper end of the uncertainty.'
  source: 'US EPA AP-42, 5th ed., section 8.4 (7/93, reformatted 1/95), Table 8.4-1: rotary dryer with
    wet scrubber, emission factor rating A (one compliance test of 1990, AP-42 background report for
    section 8.4, section 4.1 Reference 8 and Table 4.2-2; the test did not record the production rate,
    so the background report divided by a rate estimated from TVA capacity data). The 0.08 and 0.16
    kg/t are the controlled factors of References 6 and 7 in section 4.1 of the same report. Taking the
    rotary dryer is ASSUMED: the UNIDO chapter VIII describes rotary driers for synthetic plants'
- name: w_cake
  value: 0.0175
  unit: kg/kg
  description: 'Moisture of the centrifuge cake fed to the dryer: midpoint of 1 to 2.5 wt%.'
  source: US EPA AP-42, 5th ed., section 8.4 (7/93, reformatted 1/95), 8.4.2 (range); the midpoint is
    our choice
- name: w_prod
  value: 0.002
  unit: kg/kg
  description: Free moisture of the dried product.
  source: 'UNIDO fertilizer manual, chapter VIII ''Ammonium Salts, Nitric Acid, and Nitrates'' (UNIDO
    Open Archive document 19836), Chemical and Physical Specifications (PDF p. 6): 0.2 % free H2O as a
    typical specification figure'
- name: h_evap
  value: 0.6616
  unit: kWh/kg
  description: 'Latent heat of water at 50 degC (2381.9 kJ/kg), the assumed evaporation temperature in
    the dryer.'
  source: 'IAPWS-95 (Wagner and Pruss 2002) evaluated with CoolProp 8.0.0; the 50 degC evaporation (wet-bulb)
    temperature is ASSUMED'
- name: eta_dry
  value: 0.5
  unit: kg/kg
  description: 'Thermal efficiency of the steam-heated rotary dryer: latent heat of the water removed over
    the heat supplied.'
  source: 'ASSUMED: no open figure read; it stands for the sensible heat of crystals and air and the exhaust
    loss. TODO a sourced dryer heat'
- name: elec
  value: 333.3
  unit: kWh
  description: 'Electricity per t of ammonium sulfate: core''s Tier 0 default, 0.3333 kWh/kg.'
  source: 'ASSUMED: cheme tier-defaults 1.0.0: electricity [ASSUMED]: 1.2 MJ (0.333 kWh) per kg of product,
    attributed to the Gendorf (2000) site average that the ecoinvent v2-era chemicals proxies used. ASSUMED,
    not read in either source: Hischier et al. 2005 (p. 61) names the Gendorf (2000) average as the default
    but prints no value, and the number could not be confirmed in an open copy of Althaus et al. 2007
    (ecoinvent report No. 8). A site average of organic chemistry, not specific to a salt crystallization
    plant (pumps, centrifuges, dryer and scrubber fans). No open ammonium sulfate figure was read. TODO
    source'
