# Equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps.
# Sizes per batch from the recipe (D-003) and the models; design pressures, temperatures and
# materials are first choices, not set (basic engineering). All values ASSUMED unless the recipe
# or a model gives them. The raw-material stores (salicylic acid silo or big-bag station, the
# acetic anhydride and sulfuric acid day tanks) are at the battery limit and not listed (D-004).
schema: cheme/equipment/v1
equipment:
  - {tag: R-101, type: StirredTankReactor, service: "Acetylation reactor and crystalliser: salicylic acid and catalyst charged into the recycled mother liquor, acetic anhydride dosed at 358 K, cooled to 293 K to crystallise the aspirin",
     notes: "5 m3 glass-lined vessel (R10 preferred size) as the recipe sizes it from R101's model, 3.29 m3 of batch, 66 % full, D 1.74 m (core ADR 0052); jacket on tempered chilled water 283/288 K and hot water at 368 K from LP steam, 7.75 m2 at the charge, removes 168.5 kW against R101's peak 159.5 kW (cheme process recipe, at the start of the dosing when the recycled anhydride reacts); its metal about 4000 kJ/K (ASSUMED) in the heat and cool times; 4 kW agitator; reflux condenser and vent to the scrubber; anhydride dosing over 1.5 h interlocked with the temperature, the agitator and the catalyst charge (D-011); atmospheric, design 3.5 bar g and full vacuum (ASSUMED) (D-003, D-005, D-011)."}
  - {tag: F-101, type: Filter, service: "Agitated filter-dryer: filtration of the mother liquor, a reslurry wash with recovered acetic acid, its filtration and vacuum drying at 333 K",
     notes: "5 m3 (R10 preferred size, 66 % full with one batch's slurry, D 1.85 m) as the recipe sizes it (core ADR 0057), stainless steel 316L or Hastelloy (acetic acid with sulfuric acid, ASSUMED); filtrations 1.82 h and 0.70 h by Ruth with ASSUMED cake data under 200 kPa of nitrogen; jacket, heated bottom and heated agitator 16 m2 (ASSUMED) on hot water at 353 K from LP steam; drying 7.05 h at an ASSUMED 4 kg/(m2 h) and 10 kPa(a), 15.60 kW year average (core's dryer model, the vessel's heat included); 5.5 kW agitator; the bottleneck, 11.57 h per batch (D-003, D-008)."}
  - {tag: E-201, type: HeatExchanger, service: "F-101's vacuum condenser on cooling water: the acetic acid and anhydride of the dryer vapour condensed to the still",
     notes: "4.96 kW year average on cooling water at 298/308 K (Q5), the condensate at 303 K; dry vacuum pump 4 kW, about 10 kPa(a), its exhaust to the scrubber (D-008, D-010)."}
  - {tag: T-201, type: Tank, service: "Mother liquor tank: the mother liquor and the wash filtrate collected, 60 % to the next charge, 40 % to the still",
     notes: "About 4 m3 (one batch's 2.46 t of liquor, ASSUMED), stainless steel 316L, nitrogen-blanketed and vented to the scrubber (D-006, D-009)."}
  - {tag: C-301, type: Column, service: "Vacuum batch still: acetic acid and the excess anhydride distilled at 15 kPa(a) from the liquor purge and the dryer condensate, the residue (aspirin, salicylic acid, catalyst) drained to the waste tank",
     notes: "Stirred still pot 2 m3 as the recipe sizes it (1.35 m3 of liquor a batch, 67 % full, D 1.29 m; core ADR 0063) with jacket and coil on LP steam (300 kW boil-up), total condenser and distillate cooler on cooling water to 303 K (15.10 kW year average); 0.24 h of heat-up to the bubble point and 0.48 h of boil-up a batch (cheme process stills, cheme process recipe), 339.2 -> 355.3 K at 15 kPa(a); one stage, no reflux (core ADR 0055); its steel about 2500 kJ/K, ASSUMED, in the still's duty; 3 kW vacuum pump (D-009, D-010)."}
  - {tag: T-301, type: Tank, service: "Recovered acetic acid tank: the cake wash and the acid to the acetic anhydride plant",
     notes: "About 2 m3 (one batch's 1.29 t, ASSUMED), stainless steel 316L, nitrogen-blanketed and vented to the scrubber (D-009)."}
