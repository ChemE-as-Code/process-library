  - {title: "Stoesser, W. C.; Surine, W. R. (Dow Chemical, 1961) US 2 987 539 A: Process for the production of aspirin (salicylic acid with excess acetic anhydride in acetic acid at 70-100 C, 85 C for 1.5 h; crystallised by cooling to 15 C; washed with acetic acid, then water; 30-70 % of the combined mother liquor and acid washes recycled; Step 5: the rest distilled to 154 C pot at 35 mm Hg, distillate 96.5 % acetic acid and 3.5 % anhydride; salicylic acid recovered from the residue)", url: "https://patents.google.com/patent/US2987539A/en"}
  - {title: "Handal-Vega, E.; Loupy, A.; Collazo Garcia, J. M. (2001) US 6 278 014 B1: Synthetic procedure for the manufacture of aspirin (background: the industrial method, salicylic acid with excess acetic anhydride at 98 C for 2-3 h, cooled to crystallise, centrifuged and washed, about 90 % yield; a solvent-free CaO/ZnO route, rejected here)", url: "https://patents.google.com/patent/US6278014B1/en"}
  - {title: "NIST Chemistry WebBook, SRD 69: acetic acid, acetic anhydride, salicylic acid, aspirin, water (formation enthalpies, aspirin's heat of hydrolysis (Nelander 1964), heat capacities, Antoine parameters, boiling and melting points, heats of vaporization)", url: "https://webbook.nist.gov/chemistry/"}
