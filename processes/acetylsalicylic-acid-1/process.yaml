    - {chemical: acetic-anhydride, role: feedstock, inventory_key: "feed:AC2OF", note: "Acetic anhydride (acetic-anhydride-1), 0.627 kg/kg, 1.05 mol per mol of salicylic acid fresh"}
    - {chemical: sulfuric-acid, role: feedstock, inventory_key: "feed:CATF", note: "Sulfuric acid catalyst make-up (sulfuric-acid-1), 0.88 g/kg"}
    - {chemical: nitrogen, role: feedstock, inventory_key: "consumable:nitrogen", note: "Nitrogen (asu-1) for inerting, pressing the filter-dryer, vacuum breaks and blankets, 68.8 kg per batch, 40.2 g/kg (ASSUMED)"}
  outputs:
    - {chemical: acetylsalicylic-acid, role: main-product, inventory_key: "product:PROD", note: "Dried aspirin, modelled 99.85 wt% with 0.037 wt% salicylic acid, 0.018 wt% sulfuric acid and 0.10 wt% acetic acid and anhydride, to packing; a model result, not a pharmacopoeia release"}
    - {chemical: acetic-acid, role: co-product, inventory_key: "product:ACID", note: "Recovered acetic acid, 94.1 wt% with 5.9 wt% acetic anhydride, 0.351 kg/kg, to the acetic anhydride plant; economic allocation at ASSUMED relative prices, 3.4 % of the burdens (DESIGN.md D-012)"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "0.071 kWh/kg: agitators of R-101, F-101 and C-301, the dosing pump, the vacuum pumps, transfer pumps (ASSUMED)"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "0.322 kWh/kg of LP steam 350 kPa(a): R-101's heat-up with its metal, the dryer (core's dryer model) and the vacuum still (core's still model with the heat-up)"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "0.172 kWh/kg removed by cooling water: the dryer's vacuum condenser, the still's condenser and distillate cooler, the product and filter-dryer cool-down"}
    - {chemical: chilled-water, role: utility, inventory_key: "product:CHW", note: "0.138 kWh/kg removed by tempered chilled water at 283/288 K: R-101's jacket, the heat of acetylation and the crystallisation cool-down (core's semi-batch and crystallizer models)"}
basis:
  capacity: "1171 t/a dried aspirin: 684.8 batches/a of 1710.65 kg in 7920 h on a dedicated train (147.91 kg/h year average), ASSUMED (DESIGN.md D-002, D-003)"
  operating_hours_per_year: 7920
  location: generic fine-chemicals site with acetic anhydride supply, a scrubber and a hazardous-waste incinerator (not chosen)
