# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Acetylsalicylic acid (aspirin) by the acetylation of salicylic acid with acetic anhydride in
# acetic acid with a sulfuric acid catalyst (DESIGN.md D-001), a batch plant on a dedicated
# train (D-002): salicylic acid and the catalyst make-up are charged into the recycled mother
# liquor in the glass-lined R-101 and heated to 358 K; acetic anhydride is dosed (a semi-batch,
# reactor: semibatch, D-005); the batch is pre-cooled to 303 K on cooling water (E102) and cooled
# to 293 K on tempered chilled water, and aspirin crystallises (CR101, core's crystallizer with
# the dissolved acetic anhydride, salicylic acid and sulfuric acid as spectators, core ADR 0056);
# the slurry is filtered, reslurry-washed with recovered acetic acid and vacuum-dried in one of
# two agitated filter-dryers F-101 (one recipe vessel over four steps, core ADR 0057), the
# dryer's vapour condensed on cooling water (E-201). The mother liquor and the wash filtrate are
# collected in T-201 and divided: 60 % back to the next charge (inside US 2 987 539 A's 30 to
# 70 %), 40 % with the dryer's condensate straight to the vacuum batch still C-301 (core ADR
# 0055; the patent first reacts that part with more salicylic acid, D-006), which distils the
# acetic acid with the excess anhydride; part of it is the next wash, the rest the recovered
# acetic acid co-product to the acetic anhydride plant; the residue (aspirin, unreacted
# salicylic acid, the catalyst in acetic acid) is drained hot into drums and incinerated (D-009).
# The flows are the year averages of the batch recipe (process/recipe.yaml, `cheme process
# recipe`, D-003).
# Where the values come from:
# - feeds, temperatures, pressures, ratios: design basis and D-002..D-010, ASSUMED unless a
#   source is named;
# - calculated by `cheme process propagate --fill`: R101 (cheme's semi-batch model, the ASSUMED
#   rate law, D-005), CR101 and W101 (crystallizers with spectators at the solubility derived from
#   US 2 731 492 A, D-007), F101 and F102 (specified filters with a Ruth filtration time), D101
#   (dryer to a residual moisture, D-008), ST101 (Rayleigh still on Raoult's law, D-009), the
#   mixers M101, M201, M202 and the splitters X201 (the recycle fraction) and X301; E101, E102
#   and E201 (pass-through);
# - the recycles: S3, the mother liquor back to the charge, and S11, the recovered acid to the
#   cake wash, are the tear streams of `tears:` (core ADR 0060), S11's flow the ASSUMED wash ratio
#   held fixed and its composition iterated, S3 X201's 60 % share (D-006);
# - the duties (D-010): R101's Q2, CR101's Q3 and ST101's Q6 are written by `cheme process
#   propagate --fill` from the models at each step's `energy_port` (core ADR 0059, 0063); the
#   dryer's heat Q4 is core's dryer model (`cheme.process-dryer-duty` compares it); Q1, Q5, Q7,
#   Q8 and Q9 are hand arithmetic from the stream table (tests/test_acetylsalicylic_acid_1.py
#   recomputes them).
schema: cheme/process/v1
kind: flowsheet
title: Acetylsalicylic acid by semi-batch acetylation of salicylic acid with acetic anhydride in acetic acid
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: dried acetylsalicylic acid, year averages of the batches in 7920 h on a dedicated train (D-002, D-003)", default: true}
tolerance: {abs: 0.02, rel: 0.001}   # balances: |in - out| <= abs + rel * max(in, out), kg/h
# The two recycles (D-006): the mother liquor S3 (X201 -> M101 -> R101 -> CR101 -> F101 -> M201
# -> X201) and the recovered acid to the cake wash S11 (X301 -> W101 -> F102 -> M201 -> X201 ->
# M202 -> ST101 -> X301). S11's flow is the ASSUMED wash ratio and stays fixed; S3's flow and both
# compositions are iterated from the first guesses (rounded hand values).
tears:
  - stream: S3
    initial: {flow: 125.0, unit: kg/h, basis: mass_fraction, composition: {ACOH: 0.84, AC2O: 0.06, SA: 0.003, ASA: 0.096, H2SO4: 0.001}}
  - stream: S11
    initial: {flow: 60.3135, unit: kg/h, basis: mass_fraction, composition: {ACOH: 0.95, AC2O: 0.05}}
convergence: {method: wegstein, max_iterations: 200, tolerance: {abs: 1.0e-6, rel: 1.0e-9}}

feeds:
  - {id: SAF, title: "Salicylic acid (merchant, Kolbe-Schmitt)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AC2OF, title: Acetic anhydride (acetic-anhydride-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: CATF, title: Sulfuric acid make-up (catalyst), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: r101, direction: out, kind: energy}
      - {id: f101, direction: out, kind: energy}
      - {id: c301, direction: out, kind: energy}
  - id: LPS
    title: LP steam 350 kPa(a) (R-101 heat-up, the dryer's hot-water circuit, the still)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 350, provenance: assumed, source: "design basis (D-010)"}
      supply_temperature: {value: 412.0, provenance: assumed, source: "saturation at 350 kPa(a), about 412 K (D-010)"}
      min_approach: {value: 10, provenance: assumed, source: "D-010"}
    ports:
      - {id: e101, direction: out, kind: energy}
      - {id: d101, direction: out, kind: energy}
      - {id: st101, direction: out, kind: energy}
products:
  - {id: PROD, title: Acetylsalicylic acid crystals to packing, category: product, ports: [{id: in, direction: in}]}
  - {id: ACID, title: Recovered acetic acid to the acetic anhydride plant, category: product, ports: [{id: in, direction: in}]}
  - {id: RESID, title: "Still residue (aspirin, salicylic acid, catalyst in acetic acid), drummed, to incineration", category: solid_waste, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis (D-010)"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis (D-010)"}
      min_approach: {value: 5, provenance: assumed, source: "D-010"}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: e201, direction: in, kind: energy}
      - {id: d101, direction: in, kind: energy}
      - {id: st101, direction: in, kind: energy}
  - id: CHW
    title: Tempered chilled water return (R-101 jacket)
    category: utility
    utility:
      kind: refrigerant
      supply_temperature: {value: 283.15, provenance: assumed, source: "design basis (D-010): a tempered loop, above the freezing point of the liquor"}
      return_temperature: {value: 288.15, provenance: assumed, source: "design basis (D-010)"}
      min_approach: {value: 5, provenance: assumed, source: "D-010"}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: cr101, direction: in, kind: energy}

blocks:
  - id: REACT
    title: Acetylation and crystallisation (R-101)
    class: ReactingChemicals
    ports:
      - {id: sa, direction: in}
      - {id: cat, direction: in}
      - {id: rec, direction: in}
      - {id: ac2o, direction: in}
      - {id: slurry, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: chw, direction: out, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: chw2, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: ISOL
    title: Filtration, acetic acid wash and vacuum drying (F-101, filter-dryer)
    class: SeparatingMechanically
    ports:
      - {id: slurry, direction: in}
      - {id: wash, direction: in}
      - {id: product, direction: out}
      - {id: ml, direction: out}
      - {id: wf, direction: out}
      - {id: cond, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
  - id: RECOV
    title: Mother liquor recycle and acetic acid recovery (T-201, C-301)
    class: Distilling
    ports:
      - {id: ml, direction: in}
      - {id: wf, direction: in}
      - {id: cond, direction: in}
      - {id: rec, direction: out}
      - {id: wash, direction: out}
      - {id: acid, direction: out}
      - {id: residue, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}

steps:
  - id: M101
    block: REACT
    title: Salicylic acid and catalyst charged into the recycled mother liquor (R-101)
    class: Mixing
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: sa, direction: in, delegates: sa}
      - {id: cat, direction: in, delegates: cat}
      - {id: rec, direction: in, delegates: rec}
      - {id: out, direction: out}
  - id: E101
    block: REACT
    title: Charge heated to 358 K (R-101 jacket)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: steam}
  - id: R101
    block: REACT
    title: Acetylation (acetic anhydride dosed into the salicylic acid in the liquor at 358 K)
    class: ReactingChemicals
    reactions: [ACET]
    reactor: semibatch
    # the semi-batch's duty (ACET's heat less the dose warmed, ADR 0059) goes on Q2 (D-010)
    energy_port: q
    batch:
      dosing: [{stream: S6, time: 5400}]
      target: {key: SA, conversion: 0.995}
      heat: isothermal
      provenance: assumed
      source: "acetic anhydride dosed over 1.5 h at 358 K into the salicylic acid in the recycled liquor (US 2 987 539 A: 85 C, held 1.5 h; dosing instead of the patent's all-in heat-up, D-005, D-011), then the post-reaction to 0.995 conversion of the salicylic acid (ASSUMED); R-101 open to its reflux condenser, no gas forms"
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: charge, direction: in}
      - {id: ac2o, direction: in, delegates: ac2o}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: chw}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E102
    block: REACT
    title: Reaction mass pre-cooled to 303 K on cooling water (R-101 jacket)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: q, direction: out, kind: energy, delegates: cw}
  - id: CR101
    block: REACT
    title: Cooling to 293 K on tempered chilled water and crystallisation hold (aspirin crystallises from the liquor)
    class: Crystallizing
    crystallizer:
      solute: ASA
      solvent: ACOH
      crystal: ASA_S
      basis: solubility
      temperature: 293.15
      solubility:
        unit: kg/kg_liquor
        value: 0.0998
        measured_in: mother_liquor
        provenance: assumed
        source: "derived from US 2 731 492 A, Example I (D-007): after cooling to 15-25 C the filtrate holds 180 to 451 kg aspirin with 1800 kg acetic acid and 4.0 kg sulfuric acid; the lower end, 180 kg in 1804 kg of liquor = 0.0998 kg per kg of solute-free liquor, taken at 293 K for this liquor, which also holds acetic anhydride and salicylic acid (ASSUMED the same)"
      spectators: [AC2O, SA, H2SO4]
      energy: {heat_capacity: 1.588, heat_of_crystallization: 0.0, provenance: assumed, source: "the reaction mass S7 (= S24)'s heat capacity from the components' heat capacities of process/materials.yaml: 595.41 kJ/(K h) over 374.903 kg/h = 1.588 kJ/(kg K) (D-010); the heat of crystallisation left out: ACET's heat of reaction is taken for the dissolved acids on the ASSUMED equal heats of solution of salicylic acid and aspirin, so the salicylic acid's dissolution in R-101 and the aspirin's crystallisation here cancel over the batch and neither is in a step's duty (D-005, L-1: the shift between Q1 and Q3 is not modelled)"}
      outlets: {slurry: out}
    # the crystallizer's lumped duty (the slurry's cool-down) and R-101's metal cooled with it (the
    # REACT vessel's metal_heat_capacity, core ADR 0063) go on Q3 (D-010)
    energy_port: q
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: slurry}
      - {id: q, direction: out, kind: energy, delegates: chw2}
  - id: F101
    block: ISOL
    title: Filtration of the mother liquor (filter-dryer)
    class: Filtering
    solid_separation:
      solid_recovery: 1.0
      cake_liquid: {value: 0.3, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "agitated filter-dryer, cake 0.3 kg of liquor per kg of crystals; the fines through the cloth not modelled, they dissolve in the next charge (D-008)"
      filtration:
        specific_cake_resistance: 5.0e+9
        medium_resistance: 1.0e+10
        pressure_difference: 200
        viscosity: 1.4
        filtrate_density: 1080
        provenance: assumed
        source: "ASSUMED (D-008): needle-like aspirin crystals, a cloth medium, 200 kPa of nitrogen on the cake; the liquor acetic acid at 293 K with about 10 % aspirin dissolved, 1.4 mPa s and 1080 kg/m3 ASSUMED (no open data read)"
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in, delegates: slurry}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out, delegates: ml}
  - id: W101
    block: ISOL
    title: Reslurry wash with recovered acetic acid
    class: Crystallizing
    crystallizer:
      solute: ASA
      solvent: ACOH
      crystal: ASA_S
      basis: solubility
      temperature: 296.35
      solubility:
        unit: kg/kg_liquor
        value: 0.0998
        measured_in: mother_liquor
        provenance: assumed
        source: "as CR101 (D-007), taken as the same at the wash's temperature inside US 2 731 492 A's 15-25 C"
      spectators: [AC2O, SA, H2SO4]
      outlets: {slurry: out}
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: cake, direction: in}
      - {id: wash, direction: in, delegates: wash}
      - {id: out, direction: out}
  - id: F102
    block: ISOL
    title: Filtration of the wash (filter-dryer)
    class: Filtering
    solid_separation:
      solid_recovery: 1.0
      cake_liquid: {value: 0.3, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate}
      provenance: assumed
      source: "as F101 (D-008)"
      filtration:
        specific_cake_resistance: 5.0e+9
        medium_resistance: 1.0e+10
        pressure_difference: 200
        viscosity: 1.2
        filtrate_density: 1060
        provenance: assumed
        source: "as F101; the wash liquor at 298 K, ASSUMED (D-008)"
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: cake, direction: out}
      - {id: filtrate, direction: out, delegates: wf}
  - id: D101
    block: ISOL
    title: Vacuum drying at 333 K (filter-dryer)
    class: Drying
    dryer:
      volatiles: [ACOH, AC2O]
      residual_moisture: {value: 0.001, basis: mass_fraction, provenance: assumed, source: "0.1 wt% acetic acid in the dried product (D-008)"}
      temperature: 333.15
      energy:
        heat_capacity: 1.329
        latent_heat: {ACOH: 394.7, AC2O: 433.0}
        vessel_heat_capacity: 5000
        efficiency: 0.7
        port: steam
        provenance: assumed
        source: "the wet cake S13, aspirin (1.143 kJ/(kg K)) with 0.3 kg of liquor (mostly acetic acid, 2.05 kJ/(kg K)) per kg: 273.74 kJ/(K h) over 206.022 kg/h = 1.329 kJ/(kg K) from the components' heat capacities of process/materials.yaml (D-008); latent heats from process/materials.yaml: acetic acid 23.7 kJ/mol (NIST WebBook, calorimetric, associated vapour) = 394.7 kJ/kg, acetic anhydride 44.2 kJ/mol = 433.0 kJ/kg (SRC-5); the filter-dryer's steel, about 10 t at 0.5 kJ/(kg K), heated each batch from the cake's temperature as core's dryer model takes it (it is cooled only to about 313 K on cooling water, Q8, so the metal term overstates Q4 a little, D-008); 70 % of the heat to the cake (D-008)"
      drying_rate: {value: 4.0, provenance: assumed, source: "ASSUMED mean rate of an agitated vacuum filter-dryer drying acetic acid at 333 K and 10 kPa(a) with hot water at 353 K, on the heated area the recipe derives from the vessel: the shell and plate the wet cake wets, 7.88 m2 (a heated agitator not counted) (D-008)"}
      cake_density: {value: 900, provenance: assumed, source: "ASSUMED bulk density of the acid-wet needle cake (D-008)"}
      outlets: {product: product, vapour: vapour}
    links: [{target: equipment, ref: F-101}]
    ports:
      - {id: in, direction: in}
      - {id: product, direction: out, delegates: product}
      - {id: vapour, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: cool, direction: out, kind: energy, delegates: cw2}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E201
    block: ISOL
    title: F-101 vacuum condenser on cooling water (acetic acid and anhydride condensed)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: cond}
      - {id: q, direction: out, kind: energy, delegates: cw}
  - id: M201
    block: RECOV
    title: Mother liquor and wash filtrate collected in T-201
    class: Mixing
    links: [{target: equipment, ref: T-201}]
    ports:
      - {id: ml, direction: in, delegates: ml}
      - {id: wf, direction: in, delegates: wf}
      - {id: out, direction: out}
  - id: X201
    block: RECOV
    title: Liquor divided between the next charge and the still (the recycled share inside US 2 987 539 A's 30-70 %)
    class: SplittingMaterial
    split: {rec: 0.6}
    links: [{target: equipment, ref: T-201}]
    ports:
      - {id: in, direction: in}
      - {id: rec, direction: out, delegates: rec}
      - {id: purge, direction: out}
  - id: M202
    block: RECOV
    title: Liquor purge and dryer condensate to the still
    class: Mixing
    links: [{target: equipment, ref: C-301}]
    ports:
      - {id: purge, direction: in}
      - {id: cond, direction: in, delegates: cond}
      - {id: out, direction: out}
  - id: ST101
    block: RECOV
    title: Vacuum batch still at 15 kPa(a) (acetic acid and anhydride distilled together)
    class: Distilling
    still:
      pressure: 15.0
      volatility: {model: raoult, provenance: assumed, source: "an ideal liquid of acetic acid and acetic anhydride, ASSUMED without activity coefficients or the acid's vapour association (D-009, L-4); their NIST vapour pressures in process/materials.yaml"}
      nonvolatile: [SA, ASA, ASA_S, H2SO4]
      boilup: {value: 300.0, unit: kW, provenance: assumed, source: "LP steam to C-301's jacket and coil (D-009, D-010)"}
      end: {distilled: 0.80, basis: mass}
      heat_up: true
      outlets: {distillate: main, residue: residue}
      provenance: assumed
      source: "the acetic acid distilled with the anhydride under vacuum (US 2 987 539 A, Step 5: the second mother liquor distilled to 154 C at 35 mm Hg, 85.7 % of it over, 96.5 % acetic acid and 3.5 % anhydride); here, at a pot far below the patent's 154 C and aspirin's 405 K melting point, until 80 % of the charge's mass is over (ASSUMED), so that the residue, 0.45 kg of aspirin per kg of liquor at its 343.4 K end, stays a solution: SRC-2's Step 1 mass began to crystallise at about 77 C with about 1.12 kg per kg, and a log-linear interpolation to SRC-1's 0.0998 kg per kg at 293 K (ASSUMED) puts the residue's saturation near 329 K (D-009)"
    # the still's duty goes on Q6: its boil-up's latent heat, the charge heated to its bubble point
    # (`heat_up`) and C-301's metal (the RECOVER vessel's metal_heat_capacity), core ADRs 0059,
    # 0063; the condenser Q7 stays hand arithmetic (D-010)
    energy_port: steam
    links: [{target: equipment, ref: C-301}]
    ports:
      - {id: in, direction: in}
      - {id: main, direction: out}
      - {id: residue, direction: out, delegates: residue}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: cw, direction: out, kind: energy, delegates: cw}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: X301
    block: RECOV
    title: Recovered acetic acid to the cake wash and to the anhydride plant
    class: SplittingMaterial
    links: [{target: equipment, ref: T-301}]
    ports:
      - {id: in, direction: in}
      - {id: wash, direction: out, delegates: wash}
      - {id: acid, direction: out, delegates: acid}

streams:
  - id: S1
    title: Salicylic acid (solid, charged)
    from: SAF.out
    to: M101.sa
    template: mass
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "design basis"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 131.645, provenance: assumed, source: "10.0 kmol salicylic acid per batch x 138.122 kg/kmol over the 10.492 h cycle (D-003, D-004)"}
        composition: {basis: mass_fraction, values: {SA: 1.0}, provenance: assumed, source: "technical salicylic acid, its phenol and 4-hydroxybenzoic acid not modelled (D-004)"}
  - id: S2
    title: Sulfuric acid make-up
    from: CATF.out
    to: M101.cat
    template: mass
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "design basis"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 0.142967, provenance: assumed, source: "1.5 kg H2SO4 per batch over the 10.492 h cycle, the catalyst purged with the liquor to the still made up (D-004)"}
        composition: {basis: mass_fraction, values: {H2SO4: 1.0}, provenance: assumed, source: "concentrated sulfuric acid taken as 100 % (D-004)"}
  - id: S3
    title: Recycled mother liquor to the charge
    from: X201.rec
    to: M101.rec
    template: mass
    state:
      design:
        temperature: {value: 294.17, provenance: assumed, source: "as S18, from T-201 (D-006)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        flow: {value: 140.948, provenance: calculated, source: 'cheme process propagate: recycle X201 from S18 (tear, wegstein)', fingerprint: adc6d45eff1b27e1}
        composition: {basis: mole_fraction, values: {ACOH: 0.926451, AC2O: 0.0383919, SA: 0.00121499, ASA: 0.0331278, ASA_S: 0.0, H2SO4: 0.000814414}, provenance: calculated, source: 'cheme process propagate: recycle X201 from S18 (tear, wegstein)', fingerprint: adc6d45eff1b27e1}
  - id: S4
    title: Charge (salicylic acid and catalyst in the liquor)
    from: M101.out
    to: E101.in
    template: mass
    state:
      design:
        temperature: {value: 295.60, provenance: assumed, source: "M101 mixed adiabatically (D-010): S1 (139.12 kJ/(K h) at 298.15 K), S2 (0.18 at 298.15 K) and S3 (247.84 at 294.17 K); the salicylic acid's heat of solution left out, lumped in ACET's heat of reaction (D-005)"}
