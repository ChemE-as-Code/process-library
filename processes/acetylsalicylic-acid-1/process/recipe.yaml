# The batch recipe of acetylsalicylic-acid-1 (schema cheme/recipe/v1, `cheme process recipe`,
# DESIGN.md D-003). One batch makes BATCH kg of dried aspirin (stream S15); the flowsheet's rates
# are the year averages.
# - R-101, a glass-lined stirred vessel, is one vessel over M101 (salicylic acid and the catalyst
#   charged into the recycled liquor), E101 (the charge heated), R101 (the semi-batch: acetic
#   anhydride dosed at 358 K), E102 (the pre-cool to 303 K on cooling water) and CR101 (cooling
#   to 293 K on tempered chilled water and the crystallisation hold): `units`, core ADR 0057.
#   Dosing and post-reaction come from R101's model (from: R101), the heat-up and the cool-down
#   from the jacket (temperatures), the pre-cool on cooling water by hand (one coolant per jacket
#   in core, L-6); the vessel is sized from R101's model and its jacket checked against the
#   model's peak duty (core ADR 0052).
# - F-101, two identical agitated filter-dryers taking alternate batches (`parallel: 2`), each one
#   vessel over F101, W101, F102 and D101: its filtrations take Ruth's time from the filters'
#   filtration data, its drying the time D101's drying rate gives on its heated area, core's
#   default from the vessel: the shell and plate the wet cake wets (core ADR 0057, D-008).
# - C-301, the vacuum batch still, is one vessel over ST101 and X301: the boil-up time from
#   ST101's model (core ADR 0055).
# Every other duration is ASSUMED (D-003). `cheme process recipe --svg build/gantt.svg` draws one
# batch.
schema: cheme/recipe/v1
kind: recipe
title: Acetylsalicylic acid by semi-batch acetylation in acetic acid
batch_size: {value: 1710.65, unit: kg, stream: S15, provenance: assumed, source: "one batch of dried aspirin from 10.0 kmol salicylic acid (D-002, D-003)"}
hours_per_year: {value: 7920, provenance: assumed, source: "330 days of 24 h (D-002)"}
unit_procedures:
  - id: REACT
    units: [M101, E101, R101, E102, CR101]
    title: Charge, heat, dose acetic anhydride, react, cool and crystallise (R-101)
    vessel:
      fill_fraction: 0.8
      aspect_ratio: 1.2
      jacket: {u: 300, coolant_temperature: 285.65, heating_temperature: 368.15, provenance: assumed, source: "glass-lined steel, U 300 W/(m2 K) ASSUMED; tempered chilled water at 283.15/288.15 K (design basis, D-010) during the dosing (the start peak, D-005) and the final cool from 303 to 293 K, its mean 285.65 K taken as the coolant temperature (core takes one, constant); the pre-cool from 358 to 303 K on cooling water (the precool operation, by hand); heating with hot water at 368.15 K from LP steam, 10 K above the reaction temperature, below the boiling point of the liquor (D-003, D-010)"}
      metal_heat_capacity: 4000
      provenance: assumed
      source: "usual fill and proportions of a glass-lined stirred vessel (D-003); its metal, about 8 t of glass-lined steel at 0.5 kJ/(kg K) = 4000 kJ/K, ASSUMED (D-010), heated and cooled with the content: in the heat and cool times, in CR101's duty Q3 (core ADR 0063) and, by hand, in the pre-cool's Q9 (D-010)"
    operations:
      - {id: charge, kind: charge, title: Receive the recycled mother liquor from T-201, duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: charge2, kind: charge, title: "Charge the salicylic acid (solid, closed charging station) and the sulfuric acid", duration: {value: 0.75, provenance: assumed, source: D-003}}
      - {id: heat, kind: heat, title: Heat to 358 K (E101), temperatures: [295.60, 358.15]}
      - {id: dose, kind: dose, title: Dose the acetic anhydride, from: R101}
      - {id: react, kind: react, title: Post-reaction, from: R101}
      - {id: precool, kind: cool, title: Pre-cool to 303 K on cooling water (E102), duration: {value: 2.37, provenance: assumed, source: "hand arithmetic (D-007, D-010) with the formula core uses for the cool operation below and its UA: t = C / (U A) ln((T0 - Tc) / (T1 - Tc)); the recipe's cool from 303.15 to 293.15 K on the tempered water's 285.65 K takes 0.810 h, so C / (U A) = 0.810 / ln(17.5 / 7.5) = 0.955 h (the content at the end, 6247 kJ/K, with the metal's 4000 kJ/K); on cooling water taken at its 298.15 K supply, 358.15 to 303.15 K: 0.955 x ln(60 / 5) = 2.37 h. Core takes one coolant temperature per jacket (L-6), so the pre-cool's time is given"}}
      - {id: cool, kind: cool, title: Cool to 293 K on tempered chilled water (CR101), temperatures: [303.15, 293.15]}
      - {id: hold, kind: hold, title: Crystallisation hold at 293 K (CR101), duration: {value: 1.0, provenance: assumed, source: "D-003, D-007"}}
      - {id: transfer, kind: transfer, title: Transfer the slurry to F-101, duration: {value: 0.5, provenance: assumed, source: D-003}}
  - id: ISOLATE
    units: [F101, W101, F102, D101]
    title: Filtration, reslurry wash and vacuum drying in the agitated filter-dryer (F-101)
    parallel: 2
    vessel: {fill_fraction: 0.8, aspect_ratio: 1.0, provenance: assumed, source: "a squat agitated filter-dryer, its filter plate the bottom; its heated area core's default, the shell and the plate the wet cake wets (D-008)"}
    operations:
      - {id: receive, kind: charge, title: Receive the slurry, duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: filter, kind: filter, title: Filter off the mother liquor (F101), from: F101}
      - {id: wash, kind: other, title: Reslurry the cake in recovered acetic acid (W101), duration: {value: 0.5, provenance: assumed, source: D-008}}
      - {id: refilter, kind: filter, title: Filter off the wash (F102), from: F102}
      - {id: dry, kind: dry, title: Vacuum drying at 333 K (D101), from: D101}
      - {id: discharge, kind: transfer, title: "Cool, break the vacuum with nitrogen, discharge to packing", duration: {value: 1.0, provenance: assumed, source: D-003}}
  - id: RECOVER
    units: [ST101, X301]
    title: Acetic acid recovery in the vacuum batch still (C-301)
    vessel: {fill_fraction: 0.8, aspect_ratio: 1.2, metal_heat_capacity: 2500, provenance: assumed, source: "C-301, a jacketed stirred still pot, sized from the liquor a batch it takes in (core ADR 0063); fill and proportions as R-101's, ASSUMED; its metal about 5 t of steel at 0.5 kJ/(kg K) = 2500 kJ/K, ASSUMED (D-010), heated with the charge to the still's end temperature in ST101's duty Q6"}
    operations:
      - {id: receive, kind: charge, title: Receive the liquor purge and the dryer condensate, duration: {value: 0.5, provenance: assumed, source: D-003}}
      - {id: heat, kind: heat, title: "Heat the liquor and C-301 to the bubble point (ST101's heat-up)", duration: {value: 0.218, provenance: assumed, source: "hand arithmetic (D-009): the heat-up ST101's duty holds (cheme process stills: charge 3.15011 and metal 3.06916 kW year average x 10.492 h = 65.25 kWh a batch) at the still's 300 kW = 0.218 h; the distil operation's time from ST101 is the boil-up alone"}}
      - {id: distil, kind: distil, title: "Distil the acetic acid with the anhydride (ST101)", from: ST101}
      - {id: drain, kind: transfer, title: "Drain the residue hot, as a solution, into closed drums (D-009)", duration: {value: 0.5, provenance: assumed, source: D-003}}
