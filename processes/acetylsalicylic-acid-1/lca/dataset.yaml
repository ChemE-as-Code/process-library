    for the LCA practitioner to confirm): the plant makes, per kg of aspirin, 0.351 kg of recovered acetic
    acid (94.1 wt% acetic acid, 5.9 wt% acetic anhydride), the acetic acid the acetylation forms, which
    goes back to the acetic anhydride plant (processes/acetic-anhydride-1 takes acetic acid as its feed).
    The library hierarchy (docs/system-model.md) has no physical relationship between a pharmaceutical
    active and a by-product acid (none is a fuel; no exergy without a property package), so the WBCSD
    rule applies: the price ratio of a fine-chemical active to a recovered bulk acid is well above 5,
    so the rule gives economic allocation. No prices are sourced at the concept stage: the relative prices
    per kg 1 : 0.1 are ASSUMED.'
