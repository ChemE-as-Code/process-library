id: acetylsalicylic-acid-by-semi-batch-acetylation-of-salicylic-acid-with-acetic-anhydride-in-acetic-acid
title: Acetylsalicylic acid by semi-batch acetylation of salicylic acid with acetic anhydride in acetic
  acid
description: Unallocated foreground LCI of Acetylsalicylic acid by semi-batch acetylation of salicylic
  acid with acetic anhydride in acetic acid, case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Batch plant: salicylic acid and a sulfuric acid make-up charged into 60 % of the last batch''s
  mother liquor and wash filtrate in a glass-lined vessel, heated to 358 K, acetic anhydride (1.05 mol
  per mol fresh) dosed over 1.5 h, post-reaction to 0.995 conversion, cooled to 293 K to crystallise;
  filtered, reslurry-washed with recovered acetic acid and vacuum-dried at 333 K in an agitated filter-dryer;
  40 % of the liquor and the dryer''s condensate distilled at 15 kPa(a), the distillate the next wash
  and a recovered acetic acid co-product; 1710.65 kg per batch, 684.8 batches a year on a dedicated train'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:tank-breathing
  title: storage-tank emissions of T-201, T-301
  direction: output
  reason: Breathing and filling losses of the mother liquor and recovered-acid tanks (acetic acid with
    acetic anhydride), vented through the nitrogen blanket to the scrubber; not estimated (no P&ID yet,
    D-009).
- key: emission-excluded:r101-vent
  title: storage-tank emissions of R-101
  direction: output
  reason: Acetic acid and anhydride vapour that R-101 vents through its reflux condenser to the scrubber
    while it is charged, heated and nitrogen-purged; not estimated (the condenser is total in the balance,
    no P&ID yet, D-005).
- key: emission-excluded:vacuum-exhaust
  title: equipment-leaks emissions of F-101, C-301
  direction: output
  reason: Acetic acid that the vacuum pumps of the filter-dryer and the still carry past their condensers
    to the scrubber; not estimated (the condensers are total in the balance, D-008, D-009).
- key: emission-excluded:dryer-dust
  title: equipment-leaks emissions of F-101
  direction: output
  reason: Aspirin dust in the vacuum pump's exhaust (behind the filter-dryer's dust filter) is not estimated
    (D-008).
