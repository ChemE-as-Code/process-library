# acetylsalicylic-acid-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR
# 0022). Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# The preliminary LCI leaves the salicylic acid and most utilities unmapped (DESIGN.md D-012):
# the build reports each as a gap (lci/gaps.json). Linked here: the acetic anhydride to
# acetic-anhydride-1 (the route's own library producer), the sulfuric acid make-up to
# sulfuric-acid-1, the nitrogen consumable to asu-1's gaseous nitrogen, and the LP steam counted
# as heat delivered (kWh), as the other batch entries do. Salicylic acid stays a gap: no library
# process makes it; its stoichiometric Kolbe-Schmitt proxy is recorded in lca.yaml and DESIGN.md
# D-012, not linked (CONTRIBUTING, "Gaps").
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:AC2OF": {dataset: {path: processes/acetic-anhydride-1/lca/dataset.yaml, product: "product:AC2O"}, source: "the Atlas producer acetic-anhydride-1, acetic anhydride 99.5 wt% by the ketene route, the grade this feed takes; kg for kg (D-004)"}
  "feed:CATF": {dataset: {path: processes/sulfuric-acid-1/lca/dataset.yaml, product: "product:ACID"}, source: "the Atlas producer sulfuric-acid-1, sulfuric acid 98.5 wt%, the concentrated acid this make-up takes, counted kg for kg (the balance takes it as 100 %, D-004)"}
  "consumable:nitrogen": {dataset: {path: processes/asu-1/lca/dataset.yaml, product: "product:GANP"}, source: "the Atlas producer asu-1, gaseous nitrogen to the battery limit (99.97 mol% N2, 9 bar(a)); the purges, the pressing and the vacuum breaks need only a few hundred kPa"}
  "feed:LPS": {use: steam-heat, source: "LP steam 350 kPa(a) to R-101's hot-water jacket (Q1), the dryer's hot-water circuit (Q4) and the still C-301 (Q6), counted as heat delivered (kWh), D-010"}
