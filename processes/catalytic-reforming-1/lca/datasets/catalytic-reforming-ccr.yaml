# Tier 1 form, without a flowsheet (as process-library#317). Every amount is the formula of its parameters;
# core's validator re-checks each. Written from the REF BREF and the other open sources named in the
# parameters (facts in our own form). Pseudo-components: naphtha C7H14, reformate C10H14, LPG C7H18
# (C3H8 + C4H10), fuel gas C3H10 (CH4 + C2H6), all ASSUMED lumps for the element balance.
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: catalytic-reforming-ccr
title: Catalytic reforming of naphtha with continuous catalyst regeneration (CCR)
description: Per 1 t of C5+ reformate, gate-to-gate. Hydrogen, LPG and fuel gas are co-products. Utilities from
  the ranges of the EU REF BREF, hydrogen from its CCR figure, fuel gas from a patent's standard-CCR case; the feed
  and the LPG close the mass and hydrogen balances over pseudo-components.
basis: 1000 kg of C5+ reformate
boundary: 'gate-to-gate: charge heater and interheaters, three to four moving-bed reactors, continuous regenerator,
  separators, recontacting and debutaniser; naphtha hydrotreating upstream is not included; fuel and power from
  outside'
technology: low-pressure (3.5 to 10 bar) moving-bed reforming over Pt-Sn/alumina with continuous catalyst regeneration;
  semi-regenerative and cyclic units are not modelled
geography:
  description: EU refineries of the BREF data collection for the utilities and hydrogen; one US patent example for
    the fuel gas; no single site.
classification:
  isic: '1920'
system_boundary:
  included:
  - naphtha feed; reformate, hydrogen, LPG and fuel gas
  - electricity, fired heat, cooling water
  - coke burn-off CO2 and its oxygen
  - scrubber water and waste water
  - Pt catalyst make-up and spent catalyst
  excluded:
  - 'TODO HP steam generated in the convection section (50 to 90 kg/t in REF BREF Table 3.42): an exported co-product
    in the cut-off model, not yet an exchange, so the other products carry its burden'
  - 'TODO organic chloride promoter (tri- or perchloroethylene) dosed to the regenerator: not quantified in the
    source'
  - 'TODO regeneration vent traces: HCl, Cl2, CO, SO2 and PCDD/F (REF BREF Table 3.43: 1172 ng TEQ/t for CCR in
    a US EPA study; vent concentrations of below 0.01 to 6.7 ng TEQ/Nm3 measured at four Belgian refineries); the
    shipped biosphere list has no TEQ flow'
  - 'TODO fugitive hydrocarbons from valves and leaks: not quantified in the source'
  - TODO chloride guard and dryer adsorbents (discontinuous solid waste)
  - 'TODO net-gas purity: its light hydrocarbons are counted in the fuel gas'
  - naphtha hydrotreating, which is a separate unit
  - 'combustion emissions of the heaters: inside the fired-heat background activity'
  - storage emissions
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: included
  non_routine: excluded
location: RER
year: 2010
valid_until: 2015
time:
  start: 1997
  description: 'REF BREF: Table 3.42 rests on sources of 1997 to 2000, the hydrogen figure and the emission data
    on the 2010 data collection (REF TWG 2010); the patent example is of 2014. valid_until is the reference year
    + 5 (system-model section 6), so it has already lapsed.'
modelling:
  principle: attributional
  multifunctionality: energy (LHV) allocation between reformate, hydrogen, LPG and fuel gas (see allocation); the
    inventory itself is unallocated
allocation:
  method: energy
  coproducts:
  - reformate
  - hydrogen
  - lpg
  - fuel-gas
  properties:
    reformate:
      energy: 44300.0
      source: IPCC (2006) Vol. 2, ch. 1, Table 1.2, motor gasoline 44.3 TJ/Gg (reformate as gasoline, ASSUMED)
    hydrogen:
      energy: 119950.0
      source: chemicals/chemicals.yaml hydrogen lhv, 119.95 MJ/kg
    lpg:
      energy: 47300.0
      source: IPCC (2006) Vol. 2, ch. 1, Table 1.2, liquefied petroleum gases 47.3 TJ/Gg
    fuel-gas:
      energy: 49500.0
      source: IPCC (2006) Vol. 2, ch. 1, Table 1.2, refinery gas 49.5 TJ/Gg
  deviation: All four products are fuels or hydrogen, so docs/system-model.md section 2 step 2 (energy content,
    physical-energy) applies; no curated rule for this process is in lci/mappings.yaml yet, so the choice is stated
    here. No sourced prices, so the WBCSD price ratio cannot be computed either.
