        composition: {basis: mass_fraction, values: {MEOH: 0.032901, HCL: 0.205324, MECL: 0.010931, DME: 0.000613, H2O: 0.750231}, provenance: assumed, source: "D-006: water of reaction, excess HCl, unconverted methanol; 0.5 % of the CH3Cl and 5 % of the DME dissolved (ASSUMED)"}
  - id: S09
    title: Stripper overhead, condensed (methanol recycle)
    from: C202.top
    to: M100.rec
    template: aqhcl
    state:
      design:
        pressure: {value: 400, provenance: assumed, source: D-007}
        temperature: {value: 313.15, provenance: assumed, source: D-007}
        flow: {value: 390.29, basis: mass, provenance: assumed, source: "scripts/balance.py (D-007)"}
        composition: {basis: mass_fraction, values: {MEOH: 0.4989, HCL: 0.074835, MECL: 0.167428, DME: 0.009386, H2O: 0.249451}, provenance: assumed, source: "D-007: 99 % of the methanol, all dissolved CH3Cl and DME; 0.5 kg water and 0.15 kg HCl per kg methanol (ASSUMED)"}
  - id: S10
    title: Dilute hydrochloric acid
    from: C202.bot
    to: DHCL.in
    template: aqhcl
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: D-007}
        temperature: {value: 313.15, provenance: assumed, source: "D-007: after a product cooler, lumped into C202"}
        flow: {value: 5587.76, basis: mass, provenance: assumed, source: "scripts/balance.py (D-007)"}
        composition: {basis: mass_fraction, values: {MEOH: 0.000352, HCL: 0.214438, H2O: 0.78521}, provenance: assumed, source: "D-007: by difference"}
  # ---- DRY
  - id: S12
    title: Spent sulfuric acid
    from: T301.spent
    to: SPENT.in
    template: acid
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: D-008}
        temperature: {value: 313.15, provenance: assumed, source: D-008}
        flow: {value: 861.37, basis: mass, provenance: assumed, source: "scripts/balance.py (D-008)"}
        composition: {basis: mass_fraction, values: {MEOH: 0.002011, MECL: 0.015097, DME: 0.08, H2O: 0.176363, H2SO4: 0.726529}, provenance: assumed, source: "D-008: DME 8 wt% (limit 5-10 %, US 4,794,204); strength 80.5 % follows (about 80 % in the patent)"}
  - id: S13
