# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
# Chloromethane (methyl chloride) by gas-phase hydrochlorination of methanol over alumina,
# concept stage, issue ChemE-as-Code/process-library#151. Assumed stream values come from
# scripts/balance.py (D-002 to D-009); mixer, heater, reactor, compressor and splitter outlets
# are calculated by `cheme process propagate --fill`. Utility duties are hand estimates of
# scripts/balance.py (D-010), not a rigorous energy balance (no qualified property package, D-011).
schema: cheme/process/v1
kind: flowsheet
title: Chloromethane from methanol and hydrogen chloride (gas-phase hydrochlorination)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 100 kt/a methyl chloride, 8000 h/a (D-002)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: MEOH, title: Methanol (methanol-1 product grade), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: HCLG, title: Anhydrous hydrogen chloride gas, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: ACID, title: Sulfuric acid 96 wt% (drying), category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: k401, direction: out, kind: energy}
      - {id: pumps, direction: out, kind: energy}
  - id: LPS
    title: LP steam 500 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 500, provenance: assumed, source: "D-010: lowest common site level that serves the methanol vaporiser (about 385 K) and the stripper reboiler (about 383 K)"}
      supply_temperature: {value: 424.98, provenance: given, source: "saturation at 500 kPa(a), IAPWS-IF97"}
      min_approach: {value: 10, provenance: assumed, source: D-010}
    ports:
      - {id: e101, direction: out, kind: energy}
      - {id: c202, direction: out, kind: energy}
      - {id: c401, direction: out, kind: energy}

products:
  - {id: MECL, title: "Methyl chloride product (liquid, to storage)", category: product, ports: [{id: in, direction: in}]}
  - {id: DHCL, title: Dilute hydrochloric acid (about 21 wt%) to HCl recovery or neutralisation, category: by_product, ports: [{id: in, direction: in}]}
  - {id: SPENT, title: Spent sulfuric acid (about 80 %) to acid regeneration, category: by_product, ports: [{id: in, direction: in}]}
  - {id: PURGE, title: Inert purge to the site thermal oxidiser, category: off_gas, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis"}
      min_approach: {value: 5, provenance: assumed, source: "design basis"}
    ports:
      - {id: q201, direction: in, kind: energy}
      - {id: c202, direction: in, kind: energy}
      - {id: t301, direction: in, kind: energy}
      - {id: k401, direction: in, kind: energy}
      - {id: e401, direction: in, kind: energy}
      - {id: c401, direction: in, kind: energy}

blocks:
  - id: RXN
    title: Feed vaporisation and hydrochlorination
    class: ReactingChemicals
    ports:
      - {id: meoh, direction: in}
      - {id: hcl, direction: in}
      - {id: rec_strip, direction: in}
      - {id: rec_col, direction: in}
      - {id: effluent, direction: out}
      - {id: steam, direction: in, kind: energy}
  - id: QCH
    title: Quench, acid condensation and methanol stripping
    class: SeparatingByPhysicalProcess
    ports:
      - {id: effluent, direction: in}
      - {id: crude, direction: out}
      - {id: dhcl, direction: out}
      - {id: rec, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: cw_q, direction: out, kind: energy}
      - {id: cw_s, direction: out, kind: energy}
  - id: DRY
    title: Sulfuric acid drying
    class: Absorbing
    ports:
      - {id: crude, direction: in}
      - {id: acid, direction: in}
      - {id: dry, direction: out}
      - {id: spent, direction: out}
      - {id: cw, direction: out, kind: energy}
  - id: PUR
    title: Compression and distillation
    class: Distilling
    ports:
      - {id: dry, direction: in}
      - {id: product, direction: out}
      - {id: purge, direction: out}
      - {id: rec, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: steam, direction: in, kind: energy}
      - {id: cw_k, direction: out, kind: energy}
      - {id: cw_e, direction: out, kind: energy}
      - {id: cw_c, direction: out, kind: energy}

steps:
  # ---- RXN (D-004, D-005, D-010)
  - id: M100
    block: RXN
    title: Methanol junction (fresh and stripper recycle)
    class: Mixing
    ports:
      - {id: fresh, direction: in, delegates: meoh}
      - {id: rec, direction: in, delegates: rec_strip}
      - {id: out, direction: out}
  - id: E101
    block: RXN
    title: Methanol vaporiser
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: heat, direction: in, kind: energy}
  - id: M101
    block: RXN
    title: Reactor feed junction (methanol vapour, HCl, HCl column recycle)
    class: Mixing
    ports:
      - {id: meoh, direction: in}
      - {id: hcl, direction: in, delegates: hcl}
      - {id: rec, direction: in, delegates: rec_col}
      - {id: out, direction: out}
  - id: E102
    block: RXN
    title: Feed superheater (heated by the reactor coolant loop)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy}
  # D-004: multitubular fixed bed of gamma-alumina; sourced conversion/selectivity, not kinetics
  - id: R101
    block: RXN
    title: Hydrochlorination reactor (multitubular, gamma-alumina)
    class: ReactingChemicals
    reactions: [HYDROCHLORINATION, DME_FORMATION]
    reactor: conversion
    selectivity: {key: MEOH, conversion: 0.976, products: {MECL: 0.988, DME: 0.006}, provenance: assumed, source: "D-004: best result of Schmidt et al. 2014 (doi:10.1515/gps-2014-0039, abstract) at 340 C, 97.6 % conversion and 98.8 % selectivity, reported close to equilibrium; the rest of the converted methanol to DME (2 mol MeOH per mol DME)"}
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: effluent}
      - {id: hx1, direction: out, kind: energy}
      - {id: hx2, direction: out, kind: energy}
  # ---- QCH (D-006, D-007)
  - id: Q201
    block: QCH
    title: Quench column and graphite acid cooler
    class: SeparatingByContact
    links: [{target: equipment, ref: T-201}, {target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in, delegates: effluent}
      - {id: gas, direction: out, delegates: crude}
      - {id: liq, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: cw, direction: out, kind: energy, delegates: cw_q}
  - id: C202
    block: QCH
    title: Methanol stripper
    class: Distilling
    links: [{target: equipment, ref: C-202}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out, delegates: rec}
      - {id: bot, direction: out, delegates: dhcl}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: cw, direction: out, kind: energy, delegates: cw_s}
  # ---- DRY (D-008)
  - id: T301
    block: DRY
    title: Sulfuric acid drying tower
    class: Absorbing
    links: [{target: equipment, ref: T-301}]
    ports:
      - {id: gas, direction: in, delegates: crude}
      - {id: acid, direction: in, delegates: acid}
      - {id: dry, direction: out, delegates: dry}
      - {id: spent, direction: out, delegates: spent}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  # ---- PUR (D-009)
  - id: K401
    block: PUR
    title: Methyl chloride compressor (two stages, intercooled)
    class: Compressing
    method: CentrifugalMotion
    links: [{target: equipment, ref: K-401}]
    ports:
      - {id: in, direction: in, delegates: dry}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
      - {id: cw, direction: out, kind: energy, delegates: cw_k}
  - id: E401
    block: PUR
    title: Aftercooler and condenser
    class: Cooling
    links: [{target: equipment, ref: E-401}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw_e}
  - id: C401
    block: PUR
    title: HCl (light ends) column with partial condenser
    class: Distilling
    links: [{target: equipment, ref: C-401}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out}
      - {id: bot, direction: out, delegates: product}
      - {id: steam, direction: in, kind: energy, delegates: steam}
      - {id: cw, direction: out, kind: energy, delegates: cw_c}
  - id: S401
    block: PUR
    title: Purge take-off
    class: SplittingMaterial
    split: {purge: 0.10}
    ports:
      - {id: in, direction: in}
      - {id: purge, direction: out, delegates: purge}
      - {id: rec, direction: out, delegates: rec}

streams:
  # ---- feeds
  - id: S01
    title: Fresh methanol
    from: MEOH.out
    to: M100.fresh
    template: methanol
    state:
      design:
        pressure: {value: 300, provenance: given, source: "methanol-1 product delivery (its design basis)"}
        temperature: {value: 313.15, provenance: given, source: "methanol-1 product delivery (its design basis)"}
        flow: {value: 8076.64, basis: mass, provenance: assumed, source: "scripts/balance.py: set by the product rate (D-002)"}
        composition: {basis: mass_fraction, values: {MEOH: 0.9995, H2O: 0.0005}, provenance: given, source: "methanol-1 product design target, water 0.05 wt% (US Fed. Spec. O-M-232 Grade AA <= 0.10 wt%), D-003"}
  - id: S03
    title: Anhydrous HCl
    from: HCLG.out
    to: M101.hcl
    template: hcl
    state:
      design:
        pressure: {value: 450, provenance: assumed, source: "design basis battery limit"}
        temperature: {value: 303.15, provenance: assumed, source: "design basis battery limit"}
        flow: {value: 10282.59, basis: mass, provenance: assumed, source: "scripts/balance.py: tops the reactor inlet up to HCl/MeOH 1.10 (D-004)"}
        composition: {basis: mass_fraction, values: {HCL: 0.999231, N2: 0.000769}, provenance: assumed, source: "D-003: 99.9 mol% HCl, inerts 0.1 mol% lumped as N2"}
  - id: S11
    title: Sulfuric acid 96 wt%
    from: ACID.out
    to: T301.acid
    template: acid
    state:
      design:
        pressure: {value: 400, provenance: assumed, source: design basis}
        temperature: {value: 303.15, provenance: assumed, source: design basis}
        flow: {value: 651.89, basis: mass, provenance: assumed, source: "scripts/balance.py: rate set by 8 wt% DME in the spent acid (D-008)"}
        composition: {basis: mass_fraction, values: {H2SO4: 0.96, H2O: 0.04}, provenance: assumed, source: "D-008: 96 wt% (95 % most used, US 4,794,204)"}
  # ---- RXN
  - id: S02a
    title: Methanol feed to the vaporiser
    from: M100.out
    to: E101.in
    template: process
    state:
      design:
        composition: {basis: mole_fraction, values: {MEOH: 0.970644, H2O: 0.0211741, HCL: 0.00301355, MECL: 0.00486903, DME: 0.000299146}, provenance: calculated, source: 'cheme process propagate: mixer M100 from S01 S09', fingerprint: 27adf63f0f9e6aba}
        flow: {value: 8466.93, provenance: calculated, source: 'cheme process propagate: mixer M100 from S01 S09', fingerprint: 2a4a994225f48075}
  - id: S02
    title: Methanol vapour
    from: E101.out
    to: M101.meoh
    template: process
    state:
      design:
        pressure: {value: 400, provenance: assumed, source: D-005}
        temperature: {value: 385.0, provenance: assumed, source: "D-005: saturation of methanol at 400 kPa(a) (about 385 K)"}
        flow: {value: 8466.93, provenance: calculated, source: 'cheme process propagate: pass-through E101 from S02a', fingerprint: fa6cfd964c426dbc}
        composition: {basis: mole_fraction, values: {MEOH: 0.970644, H2O: 0.0211741, HCL: 0.00301355, MECL: 0.00486903, DME: 0.000299146}, provenance: calculated, source: 'cheme process propagate: pass-through E101 from S02a', fingerprint: fa6cfd964c426dbc}
  - id: S04
    title: Mixed reactor feed
    from: M101.out
    to: E102.in
    template: process
    state:
      design:
        pressure: {value: 380, provenance: assumed, source: D-005}
        temperature: {value: 375.0, provenance: assumed, source: "D-010: mixing estimate, not calculated"}
        flow: {value: 19307.3, provenance: calculated, source: 'cheme process propagate: mixer M101 from S03 S02 S19', fingerprint: 0b7999eacdf57fcb}
        composition: {basis: mole_fraction, values: {HCL: 0.506439, N2: 0.00503377, MEOH: 0.460399, MECL: 0.0179438, DME: 0.000141892, H2O: 0.0100434}, provenance: calculated, source: 'cheme process propagate: mixer M101 from S03 S02 S19', fingerprint: bf260ab2252b45dc}
  - id: S05
    title: Superheated reactor feed
    from: E102.out
    to: R101.in
    template: process
    state:
      design:
        pressure: {value: 350, provenance: assumed, source: "D-005: inside 1-10 bar(a) of WO 2000/076658 claim 12"}
        temperature: {value: 523.15, provenance: assumed, source: "D-005: 250 C, the low end of the 250-300 C typical inlet (WO 2000/076658)"}
        flow: {value: 19307.3, provenance: calculated, source: 'cheme process propagate: pass-through E102 from S04', fingerprint: cd432ef072d299ae}
        composition: {basis: mole_fraction, values: {HCL: 0.506439, N2: 0.00503377, MEOH: 0.460399, MECL: 0.0179438, DME: 0.000141892, H2O: 0.0100434}, provenance: calculated, source: 'cheme process propagate: pass-through E102 from S04', fingerprint: cd432ef072d299ae}
  - id: S06
    title: Reactor effluent
    from: R101.out
    to: Q201.in
    template: process
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: D-005}
        temperature: {value: 613.15, provenance: assumed, source: "D-005: 340 C, the temperature of the sourced conversion (Schmidt et al. 2014)"}
        flow: {value: 19307.3, provenance: calculated, source: 'cheme process propagate: reactor R101 from S05', fingerprint: ff1127489d2f81c7}
        composition: {basis: mole_fraction, values: {MEOH: 0.0110496, HCL: 0.0624817, MECL: 0.461901, DME: 0.00283799, H2O: 0.456696, N2: 0.00503377}, provenance: calculated, source: 'cheme process propagate: reactor R101 from S05', fingerprint: 4c9ec86d49ed460a}
  # ---- QCH
  - id: S07
    title: Crude methyl chloride gas
    from: Q201.gas
    to: T301.gas
    template: process
    state:
      design:
        pressure: {value: 200, provenance: assumed, source: D-006}
        temperature: {value: 313.15, provenance: assumed, source: "D-006: 40-45 C after the graphite cooler (US 4,794,204, plant embodiment)"}
        flow: {value: 13329.29, basis: mass, provenance: assumed, source: "scripts/balance.py (D-006)"}
        composition: {basis: mass_fraction, values: {MEOH: 0.00013, HCL: 0.003697, MECL: 0.975582, DME: 0.005222, H2O: 0.009441, N2: 0.005928}, provenance: assumed, source: "D-006: HCl 0.5 mol%, methanol 0.02 mol%, water 2.6 mol% (water activity 0.7 over the acid at 313 K)"}
  - id: S08
