# Process Atlas manifest of chloromethane-1. Schema: schemas/process.schema.json
# (cheme-as-code/process/v1). plant.yaml stays the engineering manifest; sheets and results are
# derived from the ChemE-as-Code files by the catalog builder and not repeated here.
schema: cheme-as-code/process/v1
id: chloromethane-1
title: Chloromethane from methanol and hydrogen chloride (gas-phase hydrochlorination, 100 kt/a)
summary: >-
  Methanol and anhydrous hydrogen chloride react over alumina to methyl chloride and water; the
  gas is quenched, dried with sulfuric acid (which also takes up the dimethyl ether by-product),
  compressed, condensed and freed of HCl in a light-ends column. Concept stage, assumed basis,
  preliminary gate-to-gate LCI per kg methyl chloride (foreground only).
description: |
  Fresh methanol and the methanol recovered from the quench acid are vaporised and mixed with
  anhydrous HCl (HCl/MeOH 1.10 at the inlet) and the recycle from the HCl column. The feed is
  superheated by the reactor coolant loop and reacts in a multitubular fixed bed of
  gamma-alumina (523 K in, 613 K out, about 300 kPa(a)); 97.6 % of the methanol is converted
  per pass, 98.8 % of it to methyl chloride and the rest to dimethyl ether (DME). A
  hydrochloric acid quench and a graphite cooler condense the water of reaction with the
  excess HCl as about 21 wt% acid; a stripper returns the dissolved methanol, and the dilute
  acid leaves the plant. Sulfuric acid (96 wt%) dries the crude gas and absorbs the DME, since
  DME and methyl chloride boil only 1 K apart. A two-stage compressor and a water-cooled
  condenser liquefy the methyl chloride at about 1 MPa, and an HCl column strips the dissolved
  HCl and inerts overhead; the overhead returns to the reactor with a 10 % purge.

  All values are concept estimates: the conversion and selectivity are one open literature data
  point (near equilibrium, checked with cheme process reactors), the separator splits are
  ASSUMED and checked against the crude-gas, quench-acid and spent-acid ranges of US 4,794,204;
  the utilities are hand estimates. See DESIGN.md for every assumption and gated step.
families: [chlorinated-organics]
keywords: [chloromethane, methyl chloride, methanol, hydrogen chloride, hydrochlorination, alumina, dimethyl ether, sulfuric acid drying, compression, distillation, silicones]
facets:
  feedstock_basis: [fossil]
  product_classes: [chemicals]
  unit_operations: [reaction, absorption, distillation, compression]
  region: generic
repository:
  url: https://github.com/ChemE-as-Code/process-library
  path: processes/chloromethane-1
  access: public
publication:
  status: public
  license: CC-BY-4.0
# Honest claim: concept is the lowest level of the manifest; cheme maturity reaches no level
# (capacity, separator splits and HCl feed spec are assumed, not sourced), see validation.notes.
maturity: concept
validation:
  status: unreviewed
  notes: >-
    Concept PFD (4 blocks, 12 steps, 19 material and 13 energy streams, two recycles and an
    inert purge) with closed mass, component and element balances (cheme validate, cheme process
    streams: every block and step within tolerance). The reactor outlet is calculated by cheme
    from a sourced conversion and selectivity (Schmidt et al. 2014); its hydrochlorination
    quotient is 0.91 of the equilibrium constant (cheme process reactors), consistent with the
    source's near-equilibrium statement. Crude gas DME 0.56 mol%, quench acid 20.5 wt% HCl and
    spent acid 80.5 % fall inside the ranges of US 4,794,204. Fresh methanol 0.646 kg and HCl
    0.823 kg per kg methyl chloride (stoichiometric 0.635 and 0.722). No rigorous energy
    balance: no property package covers HCl-water-methanol (electrolyte); duties are hand
    estimates; the reactor duty agrees with cheme's ideal-gas duty within 1.5 %. cheme maturity
    reaches no level. The LCI is foreground only, every background a gap (9 gaps): no impact
    result (lca.source none). Not reviewed. Main products and feeds are listed under chemistry
    with their chemicals registry entries (issue #251).
chemistry:
  inputs:
    - {chemical: methanol, role: feedstock, note: "feed:MEOH: methanol (e.g. methanol-1 product grade), 0.646 kg/kg"}
    - {chemical: hydrogen-chloride, role: feedstock, note: "feed:HCLG: anhydrous hydrogen chloride gas, 0.823 kg/kg"}
    - {chemical: sulfuric-acid, role: feedstock, note: "feed:ACID: sulfuric acid 96 wt% for drying"}
    # No inventory_key: an impurity of feed:HCLG, not the exchange (as dmf-1 does)
    - {chemical: nitrogen, role: feedstock, note: "Inerts of the anhydrous HCl feed (0.1 mol%, ASSUMED)"}
  outputs:
    - {chemical: chloromethane, role: main-product, inventory_key: "product:MECL", note: "Methyl chloride, liquid, to storage"}
    - {chemical: nitrogen, role: emission, note: "Inerts in the purge (product:PURGE, 5.0 g/kg, to the site thermal oxidiser, a waste exchange). The dilute hydrochloric acid (product:DHCL, 0.447 kg/kg) and the spent sulfuric acid (product:SPENT, 69 g/kg) are not listed under chemistry yet"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "0.044 kWh/kg: methyl chloride compressor and pumps (hand estimate)"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "LP steam 500 kPa(a), 0.263 kWh/kg: methanol vaporiser (net of reactor heat), stripper and HCl column reboilers"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "0.649 kWh/kg, 25/35 C (ASSUMED); the quench is 69 % of it"}
