  source: 'D-013 (revised after review 2026-10-27-pfd-lci-review#1): the export steam (S33, 4.3 MPa, 673
    K) is a co-product of hydrogen. The burdens are shared by exergy (H2 about 90 %, steam about 10 %),
    the library''s rule for exported steam in the cut-off build (docs/system-model.md section 2: exported
    steam and heat are allocated by energy or exergy, never credited). Energy (LHV) cannot be used: the
    steam has no heating value. System expansion by steam from a natural-gas boiler stays the comparison
    for a substitution variant; the unallocated result is kept in the comparison (none).'
  deviation: Hydrogen and steam are not products of one separation, so neither curated physical rule of
    the hierarchy fits exactly, and the WBCSD price ratio is not available (no sourced prices at concept).
    Exergy is chosen because the library allocates exported steam by energy or exergy and steam has no
    heating value; it weighs the steam by its work potential rather than by its enthalpy (DESIGN.md D-013).
