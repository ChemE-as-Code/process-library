      source: 'scripts/allocation_exergy.py: S33 at 673.15 K, 4.3 MPa against liquid water at the dead
        state; physical 1206.6 kJ/kg (CoolProp, IAPWS-95) + chemical 50.0 kJ/kg (Szargut et al. 1988,
