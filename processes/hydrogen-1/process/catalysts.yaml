# Catalysts of hydrogen-1. Schema: `cheme schema process-catalysts`. From the core reaction
# library (`cheme chemistry library steam_reforming`, `ht_shift`): typical windows, ASSUMED until
# a licensor or vendor confirms them (DESIGN.md D-003, D-007).
schema: cheme/catalysts/v1
kind: catalysts
catalysts:
  - id: NI_REF
    name: Nickel reforming catalyst
    active_phase: Ni
    window:
      temperature: [723.15, 1223.15]
      pressure: [1500.0, 4000.0]
      provenance: assumed
      source: "typical industrial range of the core reaction library entry steam_reforming; confirm with the vendor"
    poisons: [sulfur compounds, chlorides]
    sources: ["Twigg (ed.), Catalyst Handbook, 2nd ed., Manson (1989), via cheme chemistry library steam_reforming"]
  - id: FE_CR
    name: Iron-chromium oxide high-temperature shift catalyst
    active_phase: Fe3O4
    promoters: [Cr2O3]
    window:
      temperature: [583.15, 773.15]
      pressure: [100.0, 8000.0]
      provenance: assumed
      source: "typical industrial range of the core reaction library entry ht_shift; confirm with the vendor"
    poisons: [sulfur compounds, chlorides]
    sources: ["Twigg (ed.), Catalyst Handbook, 2nd ed., Manson (1989), via cheme chemistry library ht_shift"]
