# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Hydrogen by steam methane reforming, 100 000 Nm3/h (D-001, D-002). Where the values come from:
# - temperatures, pressures, steam-to-carbon ratio, approaches, PSA split, excess air, flue gas
#   temperatures and the product rate are design choices of the design basis, ASSUMED;
# - the reformer outlet (S9), the HT shift outlet composition (S11) and the flue gas (S24) are
#   calculated by cheme (equilibrium and conversion reactors, `cheme process propagate --fill`),
#   as are all flows through mixers, splitters, heaters, coolers and machines;
# - the boundary feed rates and the steam drum outlets come from the independent balance
#   scripts/h2_balance.py (D-006), given here as ASSUMED;
# - since D-016 (2026-11-01) the process side (FPT, REF, SFT, PSA, the fuel mixer M301 and the
#   fans) is simulated in DWSIM (`cheme process simulate`, Peng-Robinson, not qualified for this
#   mixture): its temperatures, flows, compositions and duties are `calculated` with
#   `origin: simulated`; the excluded furnace (H301, E305) and steam system (STM) keep the
#   concept balance's values, propagated where cheme can.
schema: cheme/process/v1
kind: flowsheet
title: Hydrogen by steam methane reforming (100 000 Nm3/h, PSA, steam export)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  normal_conditions: {temperature: 273.15, pressure: 101.325, basis: ideal_gas}
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 100 000 Nm3/h hydrogen 99.9 mol% from the D-004 natural gas, S/C 3.0, reformer outlet 1143 K, HT shift, PSA, steam export (D-002, D-007)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: NG, title: Natural gas feedstock, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NGF, title: Natural gas trim fuel, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AIR, title: Combustion air, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: DMW, title: Demineralised make-up water, category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: k101, direction: out, kind: energy}
      - {id: k301, direction: out, kind: energy}
      - {id: k302, direction: out, kind: energy}
      - {id: p401, direction: out, kind: energy}
products:
  - {id: H2, title: Hydrogen product 99.9 mol% to battery limit, category: product, ports: [{id: in, direction: in}]}
  - {id: STEAMX, title: Export steam 4300 kPa(a) 673 K, category: by_product, ports: [{id: in, direction: in}]}
  - {id: FLUE, title: Reformer flue gas to stack, category: emission, ports: [{id: in, direction: in}]}
  - {id: BD, title: Boiler blowdown, category: wastewater, ports: [{id: in, direction: in}]}
  - {id: DAV, title: "Deaerator vent: gases dissolved in the process condensate", category: emission, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-010"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-010"}
      min_approach: {value: 5, provenance: assumed, source: D-010}
    ports: [{id: e202, direction: in, kind: energy}]

blocks:
  - id: FPT
    title: Feed pretreatment (hydrodesulfurisation)
    class: ReactingChemicals
    ports:
      - {id: ng, direction: in}
      - {id: rec, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy}
  - id: REF
    title: Steam reforming
    class: ReactingChemicals
    ports:
      - {id: feed, direction: in}
      - {id: steam, direction: in}
      - {id: out, direction: out}
      - {id: preheat, direction: in, kind: energy}
      - {id: rad, direction: in, kind: energy}
      - {id: whb, direction: out, kind: energy}
  - id: SFT
    title: HT shift and gas cooling
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: gas, direction: out}
      - {id: cond, direction: out}
      - {id: bfw, direction: out, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: PSA
    title: Pressure swing adsorption
    class: Adsorbing
    ports:
      - {id: feed, direction: in}
      - {id: product, direction: out}
      - {id: tail, direction: out}
      - {id: rec, direction: out}
      - {id: power, direction: in, kind: energy}
  - id: FUR
    title: Reformer furnace and convection section
    class: ReactingChemicals
    ports:
      - {id: tail, direction: in}
      - {id: fuel, direction: in}
      - {id: air, direction: in}
      - {id: flue, direction: out}
      - {id: rad, direction: out, kind: energy}
      - {id: e101, direction: out, kind: energy}
      - {id: e102, direction: out, kind: energy}
      - {id: coil, direction: out, kind: energy}
      - {id: eco, direction: out, kind: energy}
      - {id: pfd, direction: in, kind: energy}
      - {id: pid, direction: in, kind: energy}
  - id: STM
    title: Steam system
    class: Evaporating
    ports:
      - {id: cond, direction: in}
      - {id: mu, direction: in}
      - {id: ps, direction: out}
      - {id: ex, direction: out}
      - {id: bd, direction: out}
      - {id: vent, direction: out}
      - {id: whb, direction: in, kind: energy}
      - {id: coil, direction: in, kind: energy}
      - {id: eco, direction: in, kind: energy}
      - {id: bfw, direction: in, kind: energy}
      - {id: power, direction: in, kind: energy}

steps:
  # --- feed pretreatment (D-005)
  - id: M101
    block: FPT
    title: Feed / recycle hydrogen junction
    class: Mixing
    ports:
      - {id: ng, direction: in, delegates: ng}
      - {id: rec, direction: in, delegates: rec}
      - {id: out, direction: out}
  - id: E101
    block: FPT
    title: Feed preheat coil (convection section)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: heat}
  - id: R101
    block: FPT
    title: Hydrogenator and ZnO guard beds
    class: Adsorbing
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
  # --- reforming (D-007)
  - id: M102
    block: REF
    title: Process steam mixing
    class: Mixing
    ports:
      - {id: feed, direction: in, delegates: feed}
      - {id: steam, direction: in, delegates: steam}
      - {id: out, direction: out}
  - id: E102
    block: REF
    title: Mixed feed preheat coil (convection section)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: preheat}
  # D-003, D-007: outlet at ideal-gas equilibrium, K 10 K colder than the outlet (approach -10).
  - id: R102
    block: REF
    title: Primary reformer tubes (Ni catalyst)
    class: ReactingChemicals
    reactions: [SMR, WGS, ETH_REF, PRO_REF]
    reactor: equilibrium
    approach: -10
    catalyst: NI_REF
    links: [{target: equipment, ref: H-301}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: rad}
  - id: E104
    block: REF
    title: Process gas waste heat boiler
    class: Cooling
    links: [{target: equipment, ref: E-104}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
      - {id: steam, direction: out, kind: energy, delegates: whb}
  # --- HT shift and cooling (D-007)
  - id: R201
    block: SFT
    title: HT shift converter (adiabatic, Fe-Cr)
    class: ReactingChemicals
    reactions: [WGS]
    reactor: equilibrium
    approach: 10
    catalyst: FE_CR
    links: [{target: equipment, ref: R-201}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: out, direction: out}
  - id: E201
    block: SFT
    title: Shifted gas / boiler feed water exchanger
    class: Cooling
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: bfw, direction: out, kind: energy, delegates: bfw}
  - id: E202
    block: SFT
    title: Shifted gas trim cooler
    class: Cooling
    links: [{target: equipment, ref: E-202}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: V201
    block: SFT
    title: Process condensate separator
    class: SeparatingByFlash
    links: [{target: equipment, ref: V-201}]
    ports:
      - {id: in, direction: in}
      - {id: vap, direction: out, delegates: gas}
      - {id: liq, direction: out, delegates: cond}
  # --- PSA (D-008)
  - id: U301
    block: PSA
    title: Hydrogen PSA unit
    class: Adsorbing
    links: [{target: equipment, ref: U-301}]
    ports:
      - {id: feed, direction: in, delegates: feed}
      - {id: prod, direction: out}
      - {id: tail, direction: out, delegates: tail}
  - id: SPL301
    block: PSA
    title: Recycle hydrogen take-off
    class: SplittingMaterial
    split: {recycle: 0.0112787}
    ports:
      - {id: in, direction: in}
      - {id: product, direction: out, delegates: product}
      - {id: recycle, direction: out}
  - id: K101
    block: PSA
    title: Recycle hydrogen compressor
    class: Compressing
    links: [{target: equipment, ref: K-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: rec}
      - {id: power, direction: in, kind: energy, delegates: power}
  # --- furnace (D-009)
  - id: M301
    block: FUR
    title: Fuel mixing (PSA tail gas + trim natural gas)
    class: Mixing
    ports:
      - {id: tail, direction: in, delegates: tail}
      - {id: ng, direction: in, delegates: fuel}
      - {id: out, direction: out}
  - id: K301
    block: FUR
    title: Forced draft fan
    class: Compressing
    links: [{target: equipment, ref: K-301}]
    ports:
      - {id: in, direction: in, delegates: air}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: pfd}
  - id: H301
    block: FUR
    title: Reformer furnace radiant section (burners)
    class: ReactingChemicals
    reactions: [COMB_CH4, COMB_C2H6, COMB_C3H8, COMB_H2, COMB_CO]
    reactor: conversion
    links: [{target: equipment, ref: H-301}]
    ports:
      - {id: fuel, direction: in}
      - {id: air, direction: in}
      - {id: out, direction: out}
      - {id: rad, direction: out, kind: energy, delegates: rad}
  - id: E305
    block: FUR
    title: Convection section (flue gas side)
    class: Cooling
    links: [{target: equipment, ref: H-301}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: e101, direction: out, kind: energy, delegates: e101}
      - {id: e102, direction: out, kind: energy, delegates: e102}
      - {id: coil, direction: out, kind: energy, delegates: coil}
      - {id: eco, direction: out, kind: energy, delegates: eco}
  - id: K302
    block: FUR
    title: Induced draft fan
    class: Compressing
    links: [{target: equipment, ref: K-302}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: flue}
      - {id: power, direction: in, kind: energy, delegates: pid}
  # --- steam system (D-010)
  - id: M401
    block: STM
    title: Make-up water / process condensate junction (deaerator)
    class: Mixing
    links: [{target: equipment, ref: V-402}]
    ports:
      - {id: cond, direction: in, delegates: cond}
      - {id: mu, direction: in, delegates: mu}
      - {id: out, direction: out}
      - {id: vent, direction: out, delegates: vent}
  - id: P401
    block: STM
    title: Boiler feed water pump
    # GeneratingFlow, not Pumping: cheme 0.8.0 process build fails on the Pumping and
    # GeneratingSteam classes (their method field is a Union in pyDEXPI 2.1.0; DESIGN.md D-011)
    class: GeneratingFlow
    links: [{target: equipment, ref: P-401}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E402
    block: STM
    title: Boiler feed water economizer coil (convection section)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-402}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: eco}
  - id: E401
    block: STM
    title: Boiler feed water heating in E-201 (water side)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: bfw}
  - id: D401
    block: STM
    title: Steam drum, boiler and superheater coils
    class: Evaporating
    links: [{target: equipment, ref: V-401}]
    ports:
      - {id: in, direction: in}
      - {id: steam, direction: out}
      - {id: bd, direction: out, delegates: bd}
      - {id: whb, direction: in, kind: energy, delegates: whb}
      - {id: coil, direction: in, kind: energy, delegates: coil}
  - id: SPL401
    block: STM
    title: Process steam / export steam split
    class: SplittingMaterial
    split: {ps: 0.4934832}
    ports:
      - {id: in, direction: in}
      - {id: ps, direction: out, delegates: ps}
      - {id: ex, direction: out, delegates: ex}

streams:
  # --- feed pretreatment
  - id: S1
    title: Natural gas feedstock
    from: NG.out
    to: M101.ng
    template: process_gas
    state:
      design:
        pressure: {value: 4000, provenance: assumed, source: "design basis, D-004"}
        temperature: {value: 288.15, provenance: assumed, source: "design basis, D-004"}
        flow: {value: 29303.44, basis: mass, provenance: assumed, source: "scripts/h2_balance.py: the feedstock that gives 100 000 Nm3/h product (D-002, D-006)"}
        composition: {basis: mole_fraction, values: {CH4: 0.930, C2H6: 0.035, C3H8: 0.007, CO2: 0.013, N2: 0.015}, provenance: assumed, source: "design basis, D-004"}
  - id: S2
    title: Recycle hydrogen to feed
    from: K101.out
    to: M101.rec
    template: process_gas
    state:
      design:
        pressure: {value: 4100, provenance: assumed, source: D-005}
        composition: {basis: mole_fraction, values: {CH4: 0.0, C2H6: 0.0, C3H8: 0.0, H2: 0.998996, CO: 0.0, CO2: 0.0, H2O: 0.0, N2: 0.00100356}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: edc9c1ea3ff404e0, origin: simulated}
        flow: {value: 103.552, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: edc9c1ea3ff404e0, origin: simulated}
        temperature: {value: 354.746, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: edc9c1ea3ff404e0, origin: simulated}
  - id: S3
    title: Feed with recycle hydrogen
    from: M101.out
    to: E101.in
    template: process_gas
    state:
      design:
        pressure: {value: 4000, provenance: assumed, source: D-005}
        composition: {basis: mole_fraction, values: {CH4: 0.903007, C2H6: 0.0339841, C3H8: 0.00679683, H2: 0.0289956, CO: 0.0, CO2: 0.0126227, H2O: 0.0, N2: 0.0145938}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: edc9c1ea3ff404e0, origin: simulated}
        flow: {value: 29407.0, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: edc9c1ea3ff404e0, origin: simulated}
        temperature: {value: 289.084, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: edc9c1ea3ff404e0, origin: simulated}
  - id: S4
    title: Preheated feed to hydrogenator
    from: E101.out
    to: R101.in
    template: process_gas
    state:
      design:
        pressure: {value: 3900, provenance: assumed, source: D-005}
        temperature: {value: 643.15, provenance: assumed, source: "design basis, D-005"}
        composition: {basis: mole_fraction, values: {CH4: 0.903007, C2H6: 0.0339841, C3H8: 0.00679683, H2: 0.0289956, CO: 0.0, CO2: 0.0126227, H2O: 0.0, N2: 0.0145938}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: edc9c1ea3ff404e0, origin: simulated}
        flow: {value: 29407.0, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: edc9c1ea3ff404e0, origin: simulated}
  - id: S5
    title: Desulfurised feed
    from: R101.out
    to: M102.feed
    template: process_gas
    state:
      design:
        pressure: {value: 3850, provenance: assumed, source: D-005}
        temperature: {value: 643.15, provenance: assumed, source: "D-005: sulfur species not modelled, no heat of reaction"}
        composition: {basis: mole_fraction, values: {CH4: 0.903007, C2H6: 0.0339841, C3H8: 0.00679683, H2: 0.0289956, CO: 0.0, CO2: 0.0126227, H2O: 0.0, N2: 0.0145938}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: edc9c1ea3ff404e0, origin: simulated}
        flow: {value: 29407.0, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: edc9c1ea3ff404e0, origin: simulated}
  # --- reforming
  - id: S6
    title: Process steam
    from: SPL401.ps
    to: M102.steam
    template: water
    state:
      design:
        pressure: {value: 4300, provenance: assumed, source: "design basis, D-010"}
        temperature: {value: 673.15, provenance: assumed, source: "design basis, D-010"}
        flow: {value: 93616.6, basis: mass, provenance: calculated, source: 'cheme process propagate: splitter SPL401 from S32', fingerprint: 3a6d0c06c8dc4c77}
        composition: {basis: mole_fraction, values: {H2O: 1.0}, provenance: calculated, source: 'cheme process propagate: splitter SPL401 from S32', fingerprint: 5ccb5a02793cf0b5}
  - id: S7
    title: Mixed feed
    from: M102.out
    to: E102.in
    template: process_gas
    state:
      design:
        pressure: {value: 3800, provenance: assumed, source: D-007}
        composition: {basis: mole_fraction, values: {CH4: 0.227219, C2H6: 0.00855124, C3H8: 0.00171025, H2: 0.007296, CO: 0.0, CO2: 0.00317618, H2O: 0.748375, N2: 0.00367215}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: edc9c1ea3ff404e0, origin: simulated}
        flow: {value: 123024.0, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: edc9c1ea3ff404e0, origin: simulated}
        temperature: {value: 656.747, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: edc9c1ea3ff404e0, origin: simulated}
  - id: S8
    title: Reformer feed
    from: E102.out
    to: R102.in
    template: process_gas
    state:
      design:
        pressure: {value: 3500, provenance: assumed, source: "design basis, D-007"}
        temperature: {value: 893.15, provenance: assumed, source: "design basis, D-007"}
        composition: {basis: mole_fraction, values: {CH4: 0.227219, C2H6: 0.00855124, C3H8: 0.00171025, H2: 0.007296, CO: 0.0, CO2: 0.00317618, H2O: 0.748375, N2: 0.00367215}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: edc9c1ea3ff404e0, origin: simulated}
        flow: {value: 123024.0, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: edc9c1ea3ff404e0, origin: simulated}
  - id: S9
    title: Reformed gas
    from: R102.out
    to: E104.in
    template: process_gas
    state:
      design:
        pressure: {value: 3200, provenance: assumed, source: "design basis, D-007"}
        temperature: {value: 1143.15, provenance: assumed, source: "design basis, D-007"}
        composition: {basis: mole_fraction, values: {CH4: 0.0406766, C2H6: 1.85768e-06, C3H8: 0.0, H2: 0.468157, CO: 0.0856029, CO2: 0.0559714, H2O: 0.346941, N2: 0.00264921}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: edc9c1ea3ff404e0, origin: simulated}
        flow: {value: 123024.0, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: edc9c1ea3ff404e0, origin: simulated}
  - id: S10
    title: HT shift feed
    from: E104.out
    to: R201.in
    template: process_gas
    state:
      design:
        pressure: {value: 3150, provenance: assumed, source: D-007}
        temperature: {value: 623.15, provenance: assumed, source: "design basis, D-007"}
        composition: {basis: mole_fraction, values: {CH4: 0.0406766, C2H6: 1.85768e-06, C3H8: 0.0, H2: 0.468157, CO: 0.0856029, CO2: 0.0559714, H2O: 0.346941, N2: 0.00264921}, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: edc9c1ea3ff404e0, origin: simulated}
        flow: {value: 123024.0, provenance: calculated, source: 'cheme process simulate: DWSIM 9.0.5.0, Peng-Robinson (PR)', fingerprint: edc9c1ea3ff404e0, origin: simulated}
  # --- HT shift and cooling
  - id: S11
    title: Shifted gas
    from: R201.out
    to: E201.in
    template: process_gas
    state:
