templates:
  # Process gas: natural gas, reformed gas, shifted gas, hydrogen, PSA tail gas.
  - {id: process_gas, title: Natural gas / synthesis gas / hydrogen, components: [CH4, C2H6, C3H8, H2, CO, CO2, H2O, N2]}
  # Furnace side: fuel (tail gas + trim natural gas), air, flue gas.
  - {id: furnace_gas, title: Fuel / combustion air / flue gas, components: [CH4, C2H6, C3H8, H2, CO, CO2, H2O, N2, O2, AR]}
  # Water and steam (boiler feed water, process condensate, steam, blowdown).
  - {id: water, title: Water / steam, components: [H2O]}
# property_method is a placeholder until `cheme process props --fill` records the method: its
# benchmarked property package, package versions and application range. Packages:
# air-pr-chemsep (N2/O2/Ar, 77-315 K, vapour 100-3200 kPa(a), liquid and two-phase 100-600
# kPa(a)) and syngas-pr-vapor (H2/N2/Ar/CH4/CO/CO2 mixtures and pure NH3, vapour only, in
# benchmarked temperature-pressure boxes). `cheme process props --coverage` shows which applies
# to each stream; `package: <id>` here chooses one.
property_method:
  adapter: thermo
  status: placeholder
