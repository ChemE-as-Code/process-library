# Components and templates of the process. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
#
# Ideal-gas data printed by `cheme chemistry thermo <names> --fit 280,1500` (the heat
# capacities fitted over 280-1500 K so that the reformer outlet at 1143 K and the radiant flue
# gas at 1273 K are inside the range, and ambient air and natural gas at 288 K too). Sulfur
# species of the natural gas are not components (DESIGN.md D-004): their mass is negligible
# in the balance and the ZnO guard bed is a consumable of the LCI.
schema: cheme/process/v1
kind: materials
