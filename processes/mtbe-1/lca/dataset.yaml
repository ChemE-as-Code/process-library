  amount: 0.4
  reason: '6400 kg of resin in the column (Murat et al. 2003, section 3.1), replaced every 2 years (ASSUMED:
    no open source read here gives its life); 6.4 ppm of the input mass, its manufacture and the spent
    resin''s disposal cut off with the amount'
  source: D-010; SRC-1 for the charge, the life ASSUMED
- key: emission-excluded:fugitive-losses
