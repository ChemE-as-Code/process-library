id: methyl-tert-butyl-ether-by-catalytic-distillation-of-a-c4-raffinate-with-methanol-500-kt-a
title: Methyl tert-butyl ether by catalytic distillation of a C4 raffinate with methanol (500 kt/a)
description: Unallocated foreground LCI of Methyl tert-butyl ether by catalytic distillation of a C4 raffinate
  with methanol (500 kt/a), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: Catalytic (reactive) distillation of a C4 raffinate (0.356 isobutene, the rest inert C4 as
  1-butene) with methanol at 11 bar over an acidic ion-exchange resin (6400 kg, 4.9 equiv H+/kg) on 8
  of 17 stages, reflux ratio 7, 99.5 % of the isobutene converted, MTBE 98.6 mol% as bottoms (Murat et
  al. 2003); the C4 distillate washed with water (0.15 kg/kg), the methanol recovered in a low-pressure
  column and recycled; raffinate-2 back to the C4 supplier; about 500 kt/a in 8000 h; no heat integration
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
