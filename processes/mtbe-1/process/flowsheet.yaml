# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# MTBE from the isobutene of a C4 raffinate and methanol by catalytic (reactive) distillation
# over an acidic ion-exchange resin, about 500 kt/a (D-001, D-002). Where the values come from:
# - the column's feeds, pressure, conversion, bottoms composition and its two duties are the
#   ones of Murat, Mohamed and Bhatia (2003, Tables 1 and 2; SRC-1): methanol 206 mol/s liquid
#   at 320 K and butenes 549 mol/s (0.356 isobutene, 0.644 1-butene) vapour at 350 K, 11 bar,
#   99.5 % of the isobutene converted, bottoms 98.6 mol% MTBE with 1.4 mol% C4, condenser
#   49.7 MW, reboiler 39.3 MW;
# - the raffinate is booked as two feed terminals, its isobutene (IBC) and its inert C4 (C4I),
#   joined in M100 at the battery limit: one stream physically, two exchanges for the LCI
#   (D-010);
# - the column is two steps: its reactive zone R101 (a conversion step, D-004) and its
#   separation C101 (a component split, `recovery:`, D-005), because core has no reactive-
#   distillation model (L-1);
# - the water wash of the distillate and the methanol column, which the column sources do not
#   model, follow US 4 918 243 A and US 5 336 841 A (SRC-3, SRC-4) with ASSUMED splits (D-006);
# - the methanol recycle S16 and the wash-water recycle S20 are torn (core ADR 0060) and solved
#   with two design specifications (core ADR 0070): the fresh methanol S5 for the column's
#   206 mol/s of methanol, the make-up water S21 for 0.15 kg of wash water per kg of distillate;
#   `cheme process propagate --fill` writes every flow and composition but the feeds';
# - the duties other than the column's, the pumps, the mixer M101's outlet temperature and the
#   temperature of C-202's condensate come from scripts/balance.py (D-008).
schema: cheme/process/v1
kind: flowsheet
title: Methyl tert-butyl ether by catalytic distillation of a C4 raffinate with methanol (500 kt/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - id: design
    description: "Design case: the column of Murat et al. (2003), 197 mol/s of bottoms, about 500 kt/a of MTBE in 8000 h (D-002)"
    default: true
    capacity: 62.3 t/h MTBE product
    provenance: given
    source: "Murat, Mohamed and Bhatia (2003), section 3.1: 197 mol/s of MTBE, 500 000 t/a (SRC-1, D-002)"
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h
tears:
  - stream: S16
    initial: {flow: 1345, unit: kg/h, basis: mass_fraction, composition: {MEOH: 0.988, B1: 0.01, IB: 0.001, H2O: 0.001}}
  - stream: S20
    initial: {flow: 10600, unit: kg/h, basis: mass_fraction, composition: {H2O: 0.9999, MEOH: 0.0001}}
convergence: {method: wegstein, max_iterations: 200}
specs:
  - id: methanol
    vary: {stream: S5, initial: 22400}
    target: {stream: S7, component: MEOH, quantity: flow, value: 23762.35, unit: kg/h}
    provenance: given
    source: "Murat et al. (2003) Table 1 (SRC-1): 206 mol/s of methanol to stage 10 (741.6 kmol/h, 23 762.35 kg/h), fresh and recycled together (D-003)"
  - id: wash
    vary: {stream: S21, initial: 300}
    target: {stream: S13, quantity: ratio, basis: mass, per: {stream: S12}, value: 0.15}
    provenance: assumed
    source: "D-006: 0.15 kg of wash water per kg of distillate, ASSUMED inside the 0.1-0.4 of US 4 918 243 A (SRC-3)"

feeds:
  - {id: IBC, title: "Isobutene of the C4 raffinate (raffinate-1)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: C4I, title: "Inert C4 of the C4 raffinate (1-butene for the n-butenes and butanes), returned as raffinate-2", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: MEOH, title: "Methanol (Grade AA, methanol-1)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: DMW, title: "Demineralised make-up water of the wash loop", category: raw_material, ports: [{id: out, direction: out}]}
  - id: LPS
    title: LP steam 450 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis, D-008"}
      supply_temperature: {value: 421.05, provenance: assumed, source: "saturation at 450 kPa(a) (thermo 0.6.1, IAPWS), D-008"}
    ports:
      - {id: e104, direction: out, kind: energy}
      - {id: e103, direction: out, kind: energy}
      - {id: c202, direction: out, kind: energy}
  - id: MPS
    title: MP steam 1500 kPa(a)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1500, provenance: assumed, source: "design basis, D-008"}
      supply_temperature: {value: 471.44, provenance: assumed, source: "saturation at 1500 kPa(a) (thermo 0.6.1, IAPWS), D-008"}
    ports:
      - {id: c101, direction: out, kind: energy}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: rxd, direction: out, kind: energy}
      - {id: mrc, direction: out, kind: energy}
products:
  - {id: MTBEP, title: MTBE to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: RAF2, title: "Raffinate-2 (washed C4) back to the C4 supplier", category: product, ports: [{id: in, direction: in}]}
  - {id: WW, title: Wash-water purge to biological treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-008"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-008"}
    ports:
      - {id: c101, direction: in, kind: energy}
      - {id: e101, direction: in, kind: energy}
      - {id: e102, direction: in, kind: energy}
      - {id: c202, direction: in, kind: energy}
      - {id: e201, direction: in, kind: energy}

blocks:
  - id: FEED
    title: Feed preparation (raffinate vaporiser, methanol feed heater)
    class: ExchangingThermalEnergy
    ports:
      - {id: ibc, direction: in}
      - {id: c4i, direction: in}
      - {id: meoh, direction: in}
      - {id: rec, direction: in}
      - {id: c4, direction: out}
      - {id: me, direction: out}
      - {id: stm1, direction: in, kind: energy}
      - {id: stm2, direction: in, kind: energy}
  - id: RXD
    title: Catalytic distillation column (reactive zone with ion-exchange resin) and product cooler
    class: ReactingChemicals
    ports:
      - {id: c4, direction: in}
      - {id: me, direction: in}
      - {id: top, direction: out}
      - {id: mtbe, direction: out}
      - {id: stm, direction: in, kind: energy}
      - {id: pw, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
  - id: MRC
    title: Methanol recovery (raffinate water wash, methanol column, wash-water loop)
    class: SeparatingByContact
    ports:
      - {id: top, direction: in}
      - {id: dmw, direction: in}
      - {id: raf, direction: out}
      - {id: rec, direction: out}
      - {id: ww, direction: out}
      - {id: stm, direction: in, kind: energy}
      - {id: pw, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: cw3, direction: out, kind: energy}

steps:
  # ---------------------------------------------------------------- feeds (D-003)
  - id: M100
    block: FEED
    title: Raffinate-1 at the battery limit (its isobutene and its inert C4, one stream)
    class: Mixing
    ports:
      - {id: ibc, direction: in, delegates: ibc}
      - {id: c4i, direction: in, delegates: c4i}
      - {id: out, direction: out}
  - id: E104
    block: FEED
    title: Raffinate vaporiser (LP steam)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-104}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: c4}
      - {id: stm, direction: in, kind: energy, delegates: stm1}
  - id: M101
    block: FEED
    title: Fresh and recycle methanol
    class: Mixing
    ports:
      - {id: fresh, direction: in, delegates: meoh}
      - {id: rec, direction: in, delegates: rec}
      - {id: out, direction: out}
  - id: E103
    block: FEED
    title: Methanol feed heater (LP steam)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-103}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: me}
      - {id: stm, direction: in, kind: energy, delegates: stm2}
  # ---------------------------------------------------------------- catalytic distillation (D-004, D-005)
  - id: R101
    block: RXD
    title: Reactive zone of C-101 (stages 3 to 10, ion-exchange resin)
    class: ReactingChemicals
    reactions: [ETH]
    reactor: conversion
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: c4, direction: in, delegates: c4}
      - {id: me, direction: in, delegates: me}
      - {id: out, direction: out}
  - id: C101
    block: RXD
    title: Separation of C-101 (C4 and excess methanol overhead, MTBE at the bottom)
    class: Distilling
    recovery:
      outlets:
        bot: {MTBE: 1.0, B1: 0.00781, H2O: 1.0}
      provenance: given
      source: "Murat et al. (2003) Table 2 (SRC-1): the bottoms 98.6 mol% MTBE and 1.4 mol% C4 without methanol or isobutene, the distillate the rest; the share of 1-butene to the bottoms follows (9.94 of 1272.8 kmol/h); the trace water of the recycle methanol with the MTBE (ASSUMED, D-005)"
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out, delegates: top}
      - {id: bot, direction: out}
      - {id: stm, direction: in, kind: energy, delegates: stm}
      - {id: pw, direction: in, kind: energy, delegates: pw}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: E101
    block: RXD
    title: MTBE product cooler
    class: Cooling
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: mtbe}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  # ---------------------------------------------------------------- methanol recovery (D-006, D-007)
  - id: E102
    block: MRC
    title: Distillate cooler ahead of the water wash
    class: Cooling
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in, delegates: top}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw1}
  - id: C201
    block: MRC
    title: Raffinate water wash (countercurrent extraction column)
    class: SeparatingByContact
    recovery:
      outlets:
        ext: {MEOH: 0.9995, H2O: 0.99737, IB: 0.0002, B1: 0.0002}
      provenance: assumed
      source: "D-006: ASSUMED split; the washed raffinate keeps about 10 ppm(wt) methanol and 400 ppm(wt) water, as the washed C4 feed of US 5 336 841 A (SRC-4, the figure's stream 27); C4 dissolved in the extract 0.02 % of the C4 (ASSUMED)"
    links: [{target: equipment, ref: C-201}]
    ports:
      - {id: in, direction: in}
      - {id: wat, direction: in}
      - {id: raf, direction: out, delegates: raf}
      - {id: ext, direction: out}
  - id: C202
    block: MRC
    title: Methanol column (methanol recycle overhead, water at the bottom)
    class: Distilling
    recovery:
      outlets:
        top: {MEOH: 0.999, IB: 1.0, B1: 1.0, H2O: 0.000123}
      provenance: assumed
      source: "D-007: ASSUMED split; methanol of 99.9 wt% on a C4-free basis overhead (US 4 918 243 A: 99.9+ wt%, SRC-3), 0.1 % of the methanol left in the water; the dissolved C4 overhead and back to C-101 with the methanol"
    links: [{target: equipment, ref: C-202}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out, delegates: rec}
      - {id: bot, direction: out}
      - {id: stm, direction: in, kind: energy, delegates: stm}
      - {id: pw, direction: in, kind: energy, delegates: pw}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  - id: E201
    block: MRC
    title: Wash-water cooler
    class: Cooling
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw3}
  - id: X201
    block: MRC
    title: Wash-water purge
    class: SplittingMaterial
    split: {purge: 0.02}
    ports:
      - {id: in, direction: in}
      - {id: purge, direction: out, delegates: ww}
      - {id: rec, direction: out}
  - id: M201
    block: MRC
    title: Make-up water into the wash loop
    class: Mixing
    ports:
      - {id: rec, direction: in}
      - {id: dmw, direction: in, delegates: dmw}
      - {id: out, direction: out}

streams:
  - id: S1
    title: Isobutene of the raffinate-1
    from: IBC.out
    to: M100.ibc
    template: mixture
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "D-003: liquid from storage"}
        pressure: {value: 1300, provenance: assumed, source: "D-003: pumped above the column"}
        phase: {value: liquid, provenance: assumed, source: "D-003"}
        composition: {basis: mole_fraction, values: {IB: 1.0}, provenance: given, source: "Murat et al. (2003) Table 1 (SRC-1): 0.356 of the butenes feed"}
        flow: {value: 39476.09, provenance: given, source: "Murat et al. (2003) Table 1 (SRC-1): 549 mol/s x 0.356 = 703.598 kmol/h"}
  - id: S2
    title: Inert C4 of the raffinate-1
    from: C4I.out
    to: M100.c4i
    template: mixture
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "D-003: liquid from storage"}
        pressure: {value: 1300, provenance: assumed, source: "D-003: pumped above the column"}
        phase: {value: liquid, provenance: assumed, source: "D-003"}
        composition: {basis: mole_fraction, values: {B1: 1.0}, provenance: given, source: "Murat et al. (2003) Table 1 and section 3.2 (SRC-1): 0.644 of the butenes feed, 1-butene for every inert C4"}
        flow: {value: 71411.81, provenance: given, source: "Murat et al. (2003) Table 1 (SRC-1): 549 mol/s x 0.644 = 1272.802 kmol/h"}
  - id: S3
    title: Raffinate-1 to the vaporiser
    from: M100.out
    to: E104.in
    template: mixture
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "D-003"}
        pressure: {value: 1300, provenance: assumed, source: "D-003"}
        phase: {value: liquid, provenance: assumed, source: "D-003"}
        flow: {value: 110888.0, provenance: calculated, source: 'cheme process propagate: mixer M100 from S1 S2', fingerprint: 01526e3d4f02da99}
        composition: {basis: mole_fraction, values: {IB: 0.356, B1: 0.644, MEOH: 0.0, MTBE: 0.0, H2O: 0.0}, provenance: calculated, source: 'cheme process propagate: mixer M100 from S1 S2', fingerprint: f57544a57e71484c}
  - id: S4
    title: Butenes feed to C-101 (vapour, stage 10)
    from: E104.out
    to: R101.c4
    template: mixture
    state:
      design:
        temperature: {value: 350.0, provenance: given, source: "Murat et al. (2003) Table 1 (SRC-1): vapour at 350 K"}
        pressure: {value: 1100, provenance: given, source: "Murat et al. (2003) Table 1 (SRC-1): 11 bar"}
        phase: {value: vapor, provenance: given, source: "Murat et al. (2003) Table 1 (SRC-1)"}
        flow: {value: 110888.0, provenance: calculated, source: 'cheme process propagate: pass-through E104 from S3', fingerprint: a806935296922080}
        composition: {basis: mole_fraction, values: {IB: 0.356, B1: 0.644, MEOH: 0.0, MTBE: 0.0, H2O: 0.0}, provenance: calculated, source: 'cheme process propagate: pass-through E104 from S3', fingerprint: a806935296922080}
  - id: S5
    title: Fresh methanol
    from: MEOH.out
    to: M101.fresh
    template: mixture
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "D-003"}
        pressure: {value: 1300, provenance: assumed, source: "D-003: pumped"}
        phase: {value: liquid, provenance: assumed, source: "D-003"}
        composition: {basis: mole_fraction, values: {MEOH: 1.0}, provenance: assumed, source: "D-003: methanol-1's Grade AA product taken as pure methanol (its 500 ppm water not modelled)"}
        flow: {value: 22432.7, provenance: calculated, source: 'cheme process propagate: spec methanol (S7 MEOH flow kg/h 23762.3)', fingerprint: dc5b8fad8586ff52}
  - id: S6
    title: Methanol to the feed heater
    from: M101.out
    to: E103.in
    template: mixture
    state:
      design:
        temperature: {value: 300.43, provenance: assumed, source: "scripts/balance.py: S5 and S16 mixed adiabatically (D-008)"}
        pressure: {value: 1300, provenance: assumed, source: "D-003"}
        phase: {value: liquid, provenance: assumed, source: "D-003"}
        flow: {value: 23777.9, provenance: calculated, source: 'cheme process propagate: mixer M101 from S5 S16', fingerprint: e75b1056da081ac1}
        composition: {basis: mole_fraction, values: {IB: 9.48337e-07, B1: 0.000340493, MEOH: 0.999559, MTBE: 0.0, H2O: 9.96592e-05}, provenance: calculated, source: 'cheme process propagate: mixer M101 from S5 S16', fingerprint: 40c4a5c44de28e48}
  - id: S7
    title: Methanol feed to C-101 (liquid, stage 10)
    from: E103.out
    to: R101.me
    template: mixture
    state:
      design:
        temperature: {value: 320.0, provenance: given, source: "Murat et al. (2003) Table 1 (SRC-1): liquid at 320 K"}
        pressure: {value: 1100, provenance: given, source: "Murat et al. (2003) Table 1 (SRC-1): 11 bar"}
        phase: {value: liquid, provenance: given, source: "Murat et al. (2003) Table 1 (SRC-1)"}
        flow: {value: 23777.9, provenance: calculated, source: 'cheme process propagate: pass-through E103 from S6', fingerprint: 35fcbd0a5a664c88}
        composition: {basis: mole_fraction, values: {IB: 9.48337e-07, B1: 0.000340493, MEOH: 0.999559, MTBE: 0.0, H2O: 9.96592e-05}, provenance: calculated, source: 'cheme process propagate: pass-through E103 from S6', fingerprint: 35fcbd0a5a664c88}
  - id: S8
