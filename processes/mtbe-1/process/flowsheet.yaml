        flow: {value: 62270.0, provenance: calculated, source: 'cheme process propagate: separator C101 from S8', fingerprint: 095dc5821b2fafc9}
        composition: {basis: mole_fraction, values: {IB: 0.0, B1: 0.0140017, MEOH: 0.0, MTBE: 0.985894, H2O: 0.000104126}, provenance: calculated, source: 'cheme process propagate: separator C101 from S8', fingerprint: 095dc5821b2fafc9}
  - id: S11
    title: MTBE product to storage
    from: E101.out
    to: MTBEP.in
    template: mixture
    state:
      design:
        temperature: {value: 313.15, provenance: assumed, source: "D-002"}
        pressure: {value: 800, provenance: assumed, source: "D-002"}
        phase: {value: liquid, provenance: assumed, source: "D-002"}
        flow: {value: 62270.0, provenance: calculated, source: 'cheme process propagate: pass-through E101 from S10', fingerprint: 52091d35abd27ced}
        composition: {basis: mole_fraction, values: {IB: 0.0, B1: 0.0140017, MEOH: 0.0, MTBE: 0.985894, H2O: 0.000104126}, provenance: calculated, source: 'cheme process propagate: pass-through E101 from S10', fingerprint: 52091d35abd27ced}
  - id: S12
    title: Cooled distillate to the water wash
    from: E102.out
    to: C201.in
    template: mixture
    state:
      design:
        temperature: {value: 313.15, provenance: assumed, source: "D-006: ASSUMED, a cooling-water cooler's outlet; no source read here gives the temperature of the wash feed"}
        pressure: {value: 1050, provenance: assumed, source: "D-006"}
        phase: {value: liquid, provenance: assumed, source: "D-006"}
        flow: {value: 72396.0, provenance: calculated, source: 'cheme process propagate: pass-through E102 from S9', fingerprint: 70641da58adb4b08}
        composition: {basis: mole_fraction, values: {IB: 0.0026893, B1: 0.965572, MEOH: 0.0317384, MTBE: 0.0, H2O: 0.0}, provenance: calculated, source: 'cheme process propagate: pass-through E102 from S9', fingerprint: 70641da58adb4b08}
  - id: S13
    title: Wash water to C-201
