      design:
        temperature: {value: 370.0, provenance: assumed, source: "D-005: inside the reactive zone's profile of SRC-1 (348-424 K); an internal stream of C-101, set here, not R101's calculated adiabatic outlet: the duty `cheme process reactors` reports for R101 from it (about -11.1 MW) is the reaction heat, which boils liquid in the column and leaves in C-101's condenser Q4 (D-008)"}
        pressure: {value: 1100, provenance: given, source: "Murat et al. (2003): 11 bar"}
        phase: {value: liquid, provenance: assumed, source: "D-005"}
        flow: {value: 134666.0, provenance: calculated, source: 'cheme process propagate: reactor R101 from S4 S7', fingerprint: d0d192749b8370ef}
        composition: {basis: mole_fraction, values: {IB: 0.0017431, B1: 0.630773, MEOH: 0.0205716, MTBE: 0.346876, H2O: 3.66357e-05}, provenance: calculated, source: 'cheme process propagate: reactor R101 from S4 S7', fingerprint: b2e789bac4fdb2fa}
  - id: S9
    title: C-101 distillate (C4 with the excess methanol)
    from: C101.top
    to: E102.in
    template: mixture
    state:
      design:
        temperature: {value: 348.8, provenance: given, source: "Murat et al. (2003) Table 2 (SRC-1): top 348.8 K, total condenser"}
        pressure: {value: 1100, provenance: given, source: "Murat et al. (2003): 11 bar"}
        phase: {value: liquid, provenance: given, source: "Murat et al. (2003): total condenser"}
