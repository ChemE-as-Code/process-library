# Step specifications for core's energy checks. Schema: `cheme schema process-simulation`.
# Only the energy mode of R101, the reactive zone of the catalytic distillation column C-101, is
# declared: its heat of reaction stays inside the column, where it boils up liquid, and the
# column's reboiler and condenser duties (Q3, Q4) are the source's for the whole column with its
# reaction (Murat et al. 2003, Table 2; DESIGN.md D-008). No simulator is run for this flowsheet:
# no property package of core covers methanol, C4, MTBE and water (L-2), and core has no
# reactive-distillation model (L-1).
schema: cheme/simulation/v1
kind: simulation
specs:
  R101: {mode: adiabatic}
