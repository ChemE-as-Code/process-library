  - {title: "Smith, L.A.; Jones, E.M.; Hearn, D. (Chemical Research and Licensing, priority 1988) US 4 918 243 A: Heat integration process (water wash of the C4 raffinate at 0.1-0.4 kg/kg, methanol/water column, 99.9+ wt% methanol overhead, the usual low-pressure column)", url: "https://patents.google.com/patent/US4918243A/en"}
