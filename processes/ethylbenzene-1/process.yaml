# Process Atlas manifest. Schema: schemas/process.schema.json. A manifest-only process: its LCI
# dataset is lca/datasets/*.yaml, Tier 1 form, so maturity stays at concept
# (core's cheme.lci-tier-maturity). See README.md.
schema: cheme-as-code/process/v1
id: ethylbenzene-1
title: Ethylbenzene by liquid-phase zeolite alkylation of benzene with ethylene
summary: >-
  Sourced conceptual inventory per tonne of ethylbenzene: feeds from stoichiometry with the sourced
  tar, utilities as midpoints of EU LVOC BREF ranges. No flowsheet; not reviewed.
families: [styrenics]
keywords: [ethylbenzene, alkylation, transalkylation, zeolite, benzene, ethylene]
facets: {feedstock_basis: [fossil], product_classes: [chemicals], unit_operations: [reaction, distillation], region: EU}
maturity: concept
validation: {status: unreviewed}
chemistry:
  inputs:
    - {chemical: benzene, role: feedstock, inventory_key: "feed:benzene"}
    - {chemical: ethylene, role: feedstock, inventory_key: "feed:ethylene"}
    - {chemical: water, role: feedstock, inventory_key: "feed:water", note: "ASSUMED equal to the net effluent"}
  outputs:
    - {chemical: ethylbenzene, role: main-product, inventory_key: "product:ethylbenzene"}
    - {chemical: wastewater, role: waste, inventory_key: "output:wastewater"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:electricity"}
    - {chemical: steam, role: utility, inventory_key: "feed:steam", note: "counted as heat delivered, gross of heat recovery"}
basis: {capacity: "per tonne of ethylbenzene (the dataset's basis); no plant size"}
publication: {status: public, license: CC-BY-4.0}
references:
  - {title: "Falcke, H. et al. (2017) Best Available Techniques (BAT) Reference Document for the Production of Large Volume Organic Chemicals. JRC Science for Policy Report EUR 28882 EN (JRC109279), chapter 5", doi: 10.2760/77304}
repository: {url: "https://github.com/ChemE-as-Code/process-library", path: processes/ethylbenzene-1, access: public}
