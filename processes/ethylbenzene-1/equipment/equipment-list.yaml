# Equipment list. Schema: `cheme schema equipment`.
# Concept stage: the items the PFD (process/flowsheet.yaml) needs, no P&ID yet (no sheet).
# Design pressure and temperature are ASSUMED concept values (D-012): the highest operating
# value of the simulation + 10 % (at least + 2 bar) and + 25 K; one design pressure for the
# reactor section (43 barg). Duties and temperatures from the DWSIM run (D-014). Sizes,
# dimensions and weights come at basic engineering (datasheets); no plot plan at this stage.
schema: cheme/equipment/v1
equipment:
