  - {tag: V-101, type: Vessel, service: Benzene feed drum (fresh + recycle benzene),
     design_pressure_barg: 6, design_temperature_degc: 155, material: CS,
     notes: "450 kPa(a), 403 K, 148.8 t/h (S3). ASSUMED."}
  - {tag: P-101, type: CentrifugalPump, service: Alkylator feed pump,
     design_pressure_barg: 43, design_temperature_degc: 160, material: CS,
