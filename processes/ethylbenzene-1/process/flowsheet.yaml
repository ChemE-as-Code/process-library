# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Liquid-phase zeolite alkylation of benzene with ethylene and transalkylation of the
# polyethylbenzenes (D-001). Where the values come from:
# - the feeds' compositions and all temperatures and pressures are design choices (design
#   basis, D-003, D-004, D-008), ASSUMED;
# - the feed flows S1 and S6 come from the independent balance scripts/eb_balance.py (D-006),
#   ASSUMED; the product flow S22 is the design basis (D-002);
# - the other stream values and the duties are calculated by `cheme process propagate --fill`
#   and `cheme process simulate --fill` (DWSIM, Peng-Robinson, D-014). Peng-Robinson is not
#   qualified by core for these aromatics: the simulated values are a second implementation's
#   check of the script, not validated data.
#
# Boundary terminal ids are lower case on purpose: they give the inventory keys feed:benzene,
# feed:ethylene, feed:electricity, feed:steam and product:ethylbenzene of the earlier Tier 1
# dataset, so styrene-1's link and the styrenics benchmarks keep their keys (D-013).
schema: cheme/process/v1
kind: flowsheet
title: Ethylbenzene by liquid-phase zeolite alkylation (400 kt/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: 50 t/h EB, benzene/ethylene 4.0 at the alkylator, complete ethylene conversion, flux oil 4.3 kg/t (D-002, D-004, D-005)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: benzene, title: Fresh benzene, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: ethylene, title: Fresh ethylene (polymer grade), category: raw_material, ports: [{id: out, direction: out}]}
  - id: electricity
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports: [{id: p101, direction: out, kind: energy}, {id: p102, direction: out, kind: energy}, {id: p103, direction: out, kind: energy}]
  - id: steam
    title: HP steam 4200 kPa(a)
    category: utility
    utility:
      kind: steam
      level: HP
      pressure: {value: 4200, provenance: assumed, source: "design basis, D-010"}
      supply_temperature: {value: 526.4, provenance: assumed, source: "saturation at 4200 kPa(a), D-010"}
      min_approach: {value: 10, provenance: assumed, source: D-010}
    ports:
      - {id: e102, direction: out, kind: energy}
      - {id: c201, direction: out, kind: energy}
      - {id: c202, direction: out, kind: energy}
      - {id: c203, direction: out, kind: energy}
products:
  - {id: ethylbenzene, title: Ethylbenzene to storage or the styrene unit, category: product, ports: [{id: in, direction: in}]}
  - {id: flux_oil, title: Flux oil (tar) to a styrene plant or fuel, category: by_product, ports: [{id: in, direction: in}]}
  - id: steam_export
    title: Steam raised 200 kPa(a), exported (heat delivered)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 200, provenance: assumed, source: "design basis, D-009: 2 bar steam as the BREF describes for the benzene column condenser"}
      supply_temperature: {value: 393.4, provenance: assumed, source: "saturation at 200 kPa(a), D-009"}
      min_approach: {value: 10, provenance: assumed, source: D-010}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: c201, direction: in, kind: energy}
      - {id: c202, direction: in, kind: energy}
  - id: cw
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-010"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-010"}
      min_approach: {value: 5, provenance: assumed, source: D-010}
    ports:
      - {id: c203, direction: in, kind: energy}
      - {id: e207, direction: in, kind: energy}

blocks:
  - id: RXN
    title: Alkylation and transalkylation
    class: ReactingChemicals
    ports:
      - {id: bz, direction: in}
      - {id: ety, direction: in}
      - {id: bzrec, direction: in}
      - {id: pebrec, direction: in}
      - {id: out, direction: out}
      - {id: power1, direction: in, kind: energy}
      - {id: power2, direction: in, kind: energy}
      - {id: steam, direction: in, kind: energy}
      - {id: heat, direction: out, kind: energy}
  - id: SEP
    title: Benzene, ethylbenzene and polyethylbenzene columns
    class: Distilling
    ports:
      - {id: feed, direction: in}
      - {id: bzrec, direction: out}
      - {id: pebrec, direction: out}
      - {id: eb, direction: out}
      - {id: tar, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: steam1, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: steam3, direction: in, kind: energy}
      - {id: heat1, direction: out, kind: energy}
      - {id: heat2, direction: out, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}

steps:
  - id: SPL1
    block: RXN
    title: Recycle benzene split (alkylator / transalkylator)
    class: SplittingMaterial
    # D-004: the share of the recycle benzene that holds benzene/ethylene 4.0 at the alkylator
    # while the transalkylator gets benzene/DEB 3.0 (scripts/eb_balance.py split_to_alkylator)
    split: {alk: 0.9268496}
    ports:
      - {id: in, direction: in, delegates: bzrec}
      - {id: alk, direction: out}
      - {id: trans, direction: out}
  - id: M101
    block: RXN
    title: Benzene feed drum (fresh + recycle)
    class: Mixing
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: fresh, direction: in, delegates: bz}
      - {id: rec, direction: in}
      - {id: out, direction: out}
  - id: P101
    block: RXN
    title: Alkylator feed pump
    class: Pumping
    links: [{target: equipment, ref: P-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power1}
  - id: E101
    block: RXN
    title: Alkylator feed / effluent exchanger
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: cold_in, direction: in}
      - {id: cold_out, direction: out}
      - {id: hot_in, direction: in}
      - {id: hot_out, direction: out}
  - id: M102
    block: RXN
    title: Ethylene injection (distributed over the beds in R-101)
    class: Mixing
    ports:
      - {id: bz, direction: in}
      - {id: ety, direction: in, delegates: ety}
      - {id: out, direction: out}
  # D-004, D-005: multi-bed liquid-phase alkylator with interbed steam generators, modelled as one
  # conversion reactor held at its outlet temperature; the heat removed raises 200 kPa(a) steam.
  # The vapour outlet S9 carries nothing at design (the effluent is liquid; DWSIM's conversion
  # reactor needs it).
  - id: R101
    block: RXN
    title: Alkylator (fixed zeolite beds, interbed steam generators)
    class: ReactingChemicals
    reactions: [ALK, DIALK, PENTA]
    reactor: conversion
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: vap, direction: out}
      - {id: liq, direction: out}
      - {id: heat, direction: out, kind: energy, delegates: heat}
  - id: M103
    block: RXN
    title: Transalkylator feed (benzene + PEB recycle)
    class: Mixing
    ports:
      - {id: bz, direction: in}
      - {id: peb, direction: in, delegates: pebrec}
      - {id: out, direction: out}
  - id: P102
    block: RXN
    title: Transalkylator feed pump
    class: Pumping
    links: [{target: equipment, ref: P-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power2}
  - id: E102
    block: RXN
    title: Transalkylator feed heater (HP steam)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy, delegates: steam}
  - id: R102
    block: RXN
    title: Transalkylator (fixed zeolite bed, adiabatic)
    class: ReactingChemicals
    reactions: [TRANS]
    reactor: conversion
    links: [{target: equipment, ref: R-102}]
    ports:
      - {id: in, direction: in}
      - {id: vap, direction: out}
      - {id: liq, direction: out}
  - id: M104
    block: RXN
    title: Reactor effluents to the benzene column
    class: Mixing
    ports:
      - {id: alk, direction: in}
      - {id: alkvap, direction: in}
      - {id: trans, direction: in}
      - {id: transvap, direction: in}
      - {id: out, direction: out, delegates: out}
  - id: C201
    block: SEP
    title: Benzene column (overhead condenser raises 200 kPa(a) steam)
    class: Distilling
    links: [{target: equipment, ref: C-201}, {target: equipment, ref: E-201}, {target: equipment, ref: E-202}]
    ports:
      - {id: feed, direction: in, delegates: feed}
      - {id: top, direction: out, delegates: bzrec}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: steam1}
      - {id: cond, direction: out, kind: energy, delegates: heat1}
  - id: C202
    block: SEP
    title: Ethylbenzene column (overhead condenser raises 200 kPa(a) steam)
    class: Distilling
    links: [{target: equipment, ref: C-202}, {target: equipment, ref: E-203}, {target: equipment, ref: E-204}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: steam2}
      - {id: cond, direction: out, kind: energy, delegates: heat2}
  - id: E207
    block: SEP
    title: Ethylbenzene product cooler
    class: Cooling
    links: [{target: equipment, ref: E-207}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: eb}
      - {id: cw, direction: out, kind: energy, delegates: cw2}
  - id: C203
    block: SEP
    title: Polyethylbenzene column (vacuum)
    class: Distilling
    links: [{target: equipment, ref: C-203}, {target: equipment, ref: E-205}, {target: equipment, ref: E-206}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out}
      - {id: bot, direction: out, delegates: tar}
      - {id: reb, direction: in, kind: energy, delegates: steam3}
      - {id: cond, direction: out, kind: energy, delegates: cw1}
  - id: P103
    block: SEP
    title: PEB recycle pump
    class: Pumping
    links: [{target: equipment, ref: P-103}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: pebrec}
      - {id: power, direction: in, kind: energy, delegates: power}

