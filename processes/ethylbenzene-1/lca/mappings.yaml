# ethylbenzene-1's own exchange overrides for the Atlas LCI build (ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Benzene and ethylene stay reported gaps: the
# shared vocabulary has no entry, and the Atlas producers of the slugs are not chosen here.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  "feed:steam": {use: steam-heat, source: "steam counted as heat delivered (kWh), as hda-1 does"}
  "feed:benzene":
    atlas: false
    source: "The supplier is not decided: hda-1 is one route, styrene-1's by-product benzene another and btx-1's reformate extraction a third. Link one explicitly once chosen."
  "feed:ethylene":
    atlas: false
    source: "The supplier is not decided; ethylene-1 is a candidate (ethanol-1 links it with a dataset override), and bio-ethylene-1 (biogenic, from bio-ethanol) another. Link one explicitly once chosen."
