- key: cutoff:c203-vacuum-power
  title: C-203 vacuum system power
  amount: 20.0
  unit: kWh
  reason: dry vacuum pump on the C-203 overhead, about 20 kW x 8000 h/a (ASSUMED order of magnitude, not
    sized; D-008, D-013)
  source: D-008
- key: cutoff:zeolite-catalyst
  title: Zeolite catalyst of R-101 and R-102, make-up and spent
  amount: 0.375
  reason: 'LVOC BREF 5.3.4.2 and 5.3.6.1.1: 0.003 to 0.012 kg spent per t EB; midpoint 0.0075 kg/t x 400
    000 t/a (the midpoint is our choice, as in the Tier 1 dataset). Should connect to zeolite (MCM-22
    or beta) catalyst manufacture and the treatment of the spent catalyst once a background exists (D-013)'
  catalyst: true
  contains:
  - Si
  - Al
  - O
  source: LVOC BREF 5.3.4.2, 5.3.6.1.1
- key: emission-excluded:fugitive-leaks
  title: equipment-leaks emissions of the plant
  direction: output
  reason: 'fugitive benzene, ethylbenzene and ethylene from flanges, seals and valves are not estimated,
    not claimed negligible: an equipment-leak estimate needs the P&ID component counts. The LVOC BREF
    bounds them at up to 10 g benzene and 50 g VOC per t EB, storage excluded (5.3.1.6, p. 273); to become
    an emission_estimates entry with the P&IDs (D-013)'
  source: D-013
- key: emission-excluded:storage-tanks
  title: storage-tank emissions of the plant
  direction: output
  reason: 'benzene, ethylbenzene and flux oil tanks are outside the battery limit (design basis): their
    breathing losses belong to the storage (D-013)'
  source: design basis
- key: emission-excluded:no-process-effluent
  title: effluent emissions of the plant
  direction: output
  reason: 'no process wastewater in the model: the feeds are taken as dry (D-003) and the benzene drying
    column, which makes the plant''s effluent, is outside the boundary; the BREF reports 0.117 to 0.144
    m3/t EB for a zeolite plant (5.3.3.1, Table 5.5). The C-203 vacuum is taken as a dry vacuum pump (ASSUMED);
    steam ejectors would add an aromatic condensate (D-013)'
  source: D-003, D-013
- key: emission-excluded:no-combustion
  title: combustion emissions of the plant
  direction: output
  reason: 'no fired equipment inside the boundary: every heat duty is HP steam whose boiler emissions
    belong to the feed:steam background'
  source: D-010
- key: emission-excluded:catalyst-regeneration
  title: non-routine emissions of the plant
  direction: output
  reason: 'in-situ regeneration of the zeolite beds every 18 to 24 months (BREF 5.3.4.2) burns coke to
    CO2 in a nitrogen/air stream: not quantified, no coke amount sourced (D-013)'
  source: D-013
