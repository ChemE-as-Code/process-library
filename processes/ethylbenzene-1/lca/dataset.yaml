  - flux_oil
  - steam_export
  shares:
    ethylbenzene: 1.0
    flux_oil: 0.0
    steam_export: 0.0
  substitution:
    steam_export:
      source: steam raised in R-101 and the C-201 and C-202 condensers, Q4, Q7, Q9 (D-009)
      missing: 'no background chosen yet: heat from low-pressure steam (200 kPa(a)) of the site steam
        system it displaces, e.g. a natural-gas boiler, per kWh of heat'
    flux_oil:
      source: PEB column bottoms S25 (D-009)
      missing: 'no background chosen yet: heavy fuel oil burned instead, per MJ LHV, or the flux oil it
        replaces in a styrene plant'
  source: 'D-013 (agent proposal, for the LCA practitioner to confirm): all burdens to the ethylbenzene;
    the flux oil (4.3 kg/t, 0.4 % of the product mass) and the exported 200 kPa(a) steam leave without
    a burden and without a credit. The same choice as the Tier 1 dataset of the pilot, which credited
    no heat recovery, and as nitric-acid-1 and sulfuric-acid-1 for exported steam.'
  deviation: The library hierarchy allocates exported steam by energy or exergy (docs/system-model.md).
    Energy allocation would give the steam a share against the LHV of the EB although low-pressure steam
    is worth far less than its enthalpy says, and the exergy of the flux oil cannot be calculated with
    a qualified property package (D-006). Shares 1/0/0 are the conservative choice for the ethylbenzene;
    the credit the exported steam would earn by substitution is shown for comparison once its background
    is chosen (D-013).
