# Tier 1 form, process-library#313 pilot without a flowsheet. Every amount is the formula of its parameters;
# core's validator re-checks each. Written from the LVOC BREF (facts in our own form).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: ethylbenzene-zeolite-liquid-phase
title: Ethylbenzene by liquid-phase zeolite alkylation of benzene with ethylene
description: Per 1 t of ethylbenzene, gate-to-gate, EU plants of the LVOC BREF data collection. High-purity
  feeds. Feeds from stoichiometry with the sourced tar; utilities as midpoints of sourced ranges.
basis: 1000 kg of ethylbenzene
boundary: 'gate-to-gate: feed pretreatment, alkylation, transalkylation, fractionation; steam and power
  from outside'
technology: liquid-phase alkylation and transalkylation on fixed-bed zeolite, with distillation; the AlCl3
  route is not modelled
geography:
  description: EU plants of the BREF data collection; no single site.
classification:
  isic: '2011'
system_boundary:
  included:
  - feeds, tar, off-gas of the model tar reaction
  - electricity and gross steam
  - fugitive VOC
  - effluent
  - zeolite catalyst
  excluded:
  - 'TODO heat recovered as steam (700 to 2600 kWh/t in the source): no credit in the cut-off model, so
    the gross steam is an upper view of an integrated plant'
  - 'TODO combustion of off-gases at the shared abatement unit: not quantified in the source for a stand-alone
    EB plant'
  - TODO benzene and other organics in the effluent; guard-bed adsorbents
  - storage emissions
  - feed impurities (the source reports feeds above 99.5 % purity)
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: included
  non_routine: excluded
location: RER
year: 2012
valid_until: 2017
time:
  start: 2007
  description: 'BREF data collection: Table 5.9 gives 2007-2011 averages, 2011 and 2012 for the EB plants.
    valid_until is the reference year + 5 (system-model section 6), so it has already lapsed.'
modelling:
  principle: attributional
  multifunctionality: 'single output: no allocation'
