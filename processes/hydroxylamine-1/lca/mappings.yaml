# hydroxylamine-1's own exchange overrides for the Atlas LCI build (build_lci.py, ADR 0022).
# Schema: schemas/lci-process-mappings.schema.json. Keys are the dataset's exchange keys
# (<kind>:<id>); each entry `use`s a technosphere entry of the shared lci/mappings.yaml, gives the
# exchange's `chemical` slug, `atlas: false`, or a `properties_reason`.
#
# Every other exchange of this process stays unmapped (a reported gap, ADR 0022): NH3,
# GOX, sulfuric acid, demineralised water, cooling water and the three catalysts. The background
# each should connect to is described in lca/lca.yaml (`missing:`), DESIGN.md D-011.
schema: cheme-as-code/lci-process-mappings/v1
exchanges:
  # The indirect LP steam is an energy exchange (kWh of heat delivered to the ammonia vaporiser
  # E-100); the registry slug `steam` is counted in kg, so the build refuses it without this unit
  # entry. The direct dilution steam feed:STEAMD (S04) is counted in kg and keeps the slug.
  "feed:LPS": {use: steam-heat, source: "LP steam 500 kPa(a) to the ammonia vaporiser, counted as heat delivered (kWh), as nitric-acid-1 does"}
  # The supplier is not decided (DESIGN.md D-001, D-011): the build would otherwise pick one of
  # several Atlas producers by itself (chlor-alkali-1 for hydrogen, ammonia-1 for steam). Until a
  # person chooses, no Atlas link; then this override goes and lca/lca.yaml links the dataset.
  "feed:H2":
    atlas: false
    source: "hydrogen supplier undecided between processes/hydrogen-1 and chlor-alkali-1 by-product H2 (D-001, D-003)"
  "feed:STEAMD":
    atlas: false
    source: "direct LP steam supplier undecided (site boiler, processes/utility-steam-ng-boiler, or a site network) (D-003, D-008)"
  # Mapping step of 2026-11-01 (ADR 0026): each entry below uses a reference the library already
  # holds. Notes above that call these exchanges unmapped describe the state before it. What is
  # still unmapped is a gap (lci/gaps.json), and this process is marked preliminary.
  "feed:ACID": {dataset: {path: processes/sulfuric-acid-1/lca/dataset.yaml, product: "product:ACID"}, source: "the Atlas producer sulfuric-acid-1, sulfuric acid 98.5 wt%, the grade and route this feed names"}
  "feed:GOX": {dataset: {path: processes/asu-1/lca/dataset.yaml, product: "product:GOXP"}, source: "the Atlas producer asu-1, GOX (99.7 mol% O2); its 31 bar(a) is not reduced to this feed's pressure; the feed is 99.5 mol%"}
  "feed:NH3": {use: ammonia, source: "anhydrous liquid ammonia, the shared background entry; the design names no plant, so no Atlas producer is chosen"}
  "consumable:pt-catalyst-loss": {use: platinum, source: "platinum lost, counted as the metal"}
  "consumable:pt-rh-gauze-loss": {use: pt-rh-gauze, source: "Pt/Rh gauze metal lost, as nitric-acid-1 counts it"}
