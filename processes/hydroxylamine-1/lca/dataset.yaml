    given to the hydroxylammonium sulfate solution; the steam leaves without a burden and without a credit
    (conservative for the product), as nitric-acid-1 does.'
  deviation: 'The library hierarchy allocates exported steam by energy or exergy. Neither is available:
    no property package covers the salt solution (D-006), so its exergy cannot be calculated, and energy
    allocation would load the steam with the burdens of a non-fuel product. Shares 1/0 until the exergy
    of both products is available (D-011).'
