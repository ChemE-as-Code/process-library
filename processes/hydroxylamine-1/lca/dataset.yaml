schema: cheme/lci_dataset/v2
kind: lci_dataset
id: hydroxylammonium-sulfate-solution-by-no-hydrogenation-30-kt-a-nh2oh
title: Hydroxylammonium sulfate solution by NO hydrogenation (30 kt/a NH2OH)
description: Unallocated foreground LCI of Hydroxylammonium sulfate solution by NO hydrogenation (30 kt/a
  NH2OH), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: NH3 oxidation with O2 and steam on Pt/Rh (about 130 kPa(a)), O2 removal by hydrogenation,
  condensation, NO hydrogenation in about 20 wt% H2SO4 on suspended Pt/graphite in a stirred-tank cascade
  (313 K, 200 kPa(a)) with off-gas recycle and purge to a thermal oxidiser; 30 kt/a NH2OH
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: cutoff:gauze-fabrication-refining
  title: Gauze fabrication and refining of spent gauze (service)
  reason: campaign length and gauze charge not sourced (O-3, O-5); only the metal loss is counted
- key: cutoff:hydrogenation-catalyst-preparation
  title: Pt/graphite catalyst preparation (graphite, hexachloroplatinic acid, sulfur modifier, formic
    acid) and regeneration
  reason: make-up rate of support and chemicals not sourced (O-3); the platinum it carries is counted
    in consumable pt-catalyst-loss
  catalyst: true
  contains:
  - C
  - S
  - Cl
- key: emission-excluded:leaks
  title: equipment-leaks emissions of the plant
  direction: output
  reason: 'not estimated at concept stage: no P&ID component count yet; NH3, NO and H2 fugitives to be
    estimated at basic engineering (D-011)'
  source: DESIGN.md D-011
- key: emission-excluded:tanks
  title: storage-tank emissions of T-201
  direction: output
  reason: 'the acid make-up tank holds about 20 wt% H2SO4 with 0.3 % HNO3 at 313 K: no volatile organic
    or NOx source counted; ammonia, acid and product storage are outside the boundary (D-001)'
  source: DESIGN.md D-001, D-011
- key: emission-excluded:combustion
  title: combustion emissions of X-301
  direction: output
  reason: the thermal oxidiser fires only the purge hydrogen, whose products are in stream S30; thermal
    NOx formed in the flame is not estimated (and would be small against the 126 kg/h NO passed through,
    D-009)
  source: DESIGN.md D-009
