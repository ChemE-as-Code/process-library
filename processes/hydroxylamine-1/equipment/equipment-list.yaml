# Equipment list. Schema: `cheme schema equipment`.
# Concept stage: the items the PFD (process/flowsheet.yaml) needs, no P&ID yet (no sheet).
# Design pressure and temperature are ASSUMED concept values (D-010): the highest operating
# value of the balance (scripts/has_balance.py) + 10 % (at least + 2 bar) and + 25 K. Sizes,
# dimensions and weights come at basic engineering (datasheets). Materials are first choices
# (D-010), open input.
schema: cheme/equipment/v1
equipment:
  # ---- NO generation (block NOX)
  - {tag: E-100, type: TubularHeatExchanger, service: Ammonia vaporiser, design_pressure_barg: 13, design_temperature_degc: 175, material: CS,
     notes: "2.3 t/h NH3, ~0.74 MW LP steam (D-008). ASSUMED."}
  - {tag: M-101, type: Mixer, service: "Burner feed mixer (NH3, O2, dilution steam)", design_pressure_barg: 2, design_temperature_degc: 175, material: SS,
     notes: "Static mixer; NH3:O2:steam 14:18.6:67.4 by volume (US 3,110,563); the mixture stays below the ammonia-oxygen flammability limit only through the steam dilution (D-003, safety open input O-7). ASSUMED."}
