# Components and templates of the process. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol (from the
# formula with IUPAC atomic masses, as scripts/has_balance.py uses them), normal_boiling_point
# in K at 101.325 kPa. Identities: PubChem.
#
# The product solution is represented by molecular salts, not ions (DESIGN.md D-004):
# hydroxylammonium sulfate (NH3OH)2SO4 and ammonium sulfate (NH4)2SO4 dissolved in water with
# free H2SO4 and a little HNO3. No speciation (HSO4-/SO4--, NH3OH+) is modelled: core has no
# weak-electrolyte or speciation method (issue #182 comment of 27 Oct 2026).
# "NO" is always quoted: unquoted YAML reads it as false.
schema: cheme/process/v1
kind: materials
components:
  - {id: NH3, name: Ammonia, formula: NH3, cas: 7664-41-7, molar_mass: 17.0305, normal_boiling_point: 239.82}
  - {id: O2, name: Oxygen, formula: O2, cas: 7782-44-7, molar_mass: 31.9988, normal_boiling_point: 90.19}
  - {id: N2, name: Nitrogen, formula: N2, cas: 7727-37-9, molar_mass: 28.0134, normal_boiling_point: 77.36}
  - {id: AR, name: Argon, formula: Ar, cas: 7440-37-1, molar_mass: 39.948, normal_boiling_point: 87.30}
  - {id: H2O, name: Water, formula: H2O, cas: 7732-18-5, molar_mass: 18.01528, normal_boiling_point: 373.12}
  - {id: "NO", name: Nitric oxide, formula: "NO", cas: 10102-43-9, molar_mass: 30.0061, normal_boiling_point: 121.4}
  - {id: N2O, name: Nitrous oxide, formula: N2O, cas: 10024-97-2, molar_mass: 44.0128, normal_boiling_point: 184.67}
  - {id: H2, name: Hydrogen, formula: H2, cas: 1333-74-0, molar_mass: 2.01588, normal_boiling_point: 20.37}
  - {id: HNO3, name: Nitric acid, formula: HNO3, cas: 7697-37-2, molar_mass: 63.0128, normal_boiling_point: 356.15}
  - {id: H2SO4, name: Sulfuric acid, formula: H2SO4, cas: 7664-93-9, molar_mass: 98.0785}
  # Hydroxylamine sulfate (2:1), PubChem CID 24914; dissolved in the product. 1 kmol carries
  # 2 kmol NH2OH (33.0299 kg/kmol).
  - {id: HAS, name: Hydroxylammonium sulfate, formula: H8N2O6S, cas: 10039-54-0, molar_mass: 164.1383}
  - {id: AS, name: Ammonium sulfate, formula: H8N2O4S, cas: 7783-20-2, molar_mass: 132.1395}
templates:
  - {id: ammonia, title: Ammonia, components: [NH3]}
  - {id: oxygen, title: Gaseous oxygen (GOX), components: [O2, AR]}
  - {id: hydrogen, title: Hydrogen, components: [H2]}
  - {id: water, title: Water and steam, components: [H2O]}
  - {id: air, title: Dry air, components: [N2, O2, AR]}
  - {id: nitrous_gas, title: Burner feed and nitrous gas, components: [NH3, O2, AR, N2, H2O, "NO", N2O, H2, HNO3]}
  - {id: no_gas, title: "NO gas, cascade gas and off-gas", components: ["NO", N2O, N2, AR, H2, H2O, O2]}
  - {id: condensate, title: Process condensate, components: [H2O, HNO3]}
  - {id: acid, title: Sulfuric acid and acid make-up, components: [H2SO4, H2O, HNO3]}
  - {id: has_slurry, title: Cascade effluent (solution and gas), components: [HAS, AS, H2SO4, HNO3, H2O, "NO", N2O, N2, AR, H2, O2]}
  - {id: has_solution, title: Hydroxylammonium sulfate solution, components: [HAS, AS, H2SO4, HNO3, H2O]}
  - {id: flue_gas, title: Oxidiser flue gas, components: [N2, O2, AR, H2O, "NO", N2O, H2]}
# property_method is a placeholder: no benchmarked package of cheme covers the aqueous salt
# solution or nitrous gas with steam (cheme process props --coverage, DESIGN.md D-006).
property_method:
  adapter: thermo
  status: placeholder
