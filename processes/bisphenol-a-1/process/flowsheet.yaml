# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Bisphenol A from phenol and acetone over a promoted sulfonated resin in staged fixed beds, the
# reactor effluent crystallised without a distillation (vacuum-evaporative cooling with added
# water) as the 1:1 adduct with phenol, the adduct filtered and washed with polished phenol,
# melted and stripped of phenol under vacuum; the mother liquor isomerised and recycled with a
# purge to a phenol-recovery still (DESIGN.md D-001). Where the values come from:
# - feeds, temperatures, pressures, conversions, recoveries and splits: design basis and
#   decisions D-002 to D-010, ASSUMED, inside the ranges of the open sources of the register;
# - mixers, splitters, component separators (`recovery:`), the reactors (conversion models),
#   the crystallizer (`crystallizer:`, imposed yield, with its energy balance) and the filter
#   (`solid_separation:` with a displacement wash) are solved by `cheme process propagate
#   --fill`, with two tears and three design specifications (D-010);
# - R101's and X201's duties are core's models (conversion step, crystallizer energy); the other
#   duties and powers are the hand calculations of DESIGN.md D-011, given as ASSUMED with their
#   arithmetic: no property package of core covers bisphenol A or the adduct (L-1, L-3).
schema: cheme/process/v1
kind: flowsheet
title: Bisphenol A from phenol and acetone over a promoted sulfonated resin (8.75 t/h, 70 kt/a)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: "Design case: 70 kt/a of bisphenol A in 8000 h, phenol to acetone 10 mol/mol at the reactor inlet (D-002, D-005)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

tears:
  - stream: S7
    initial: {flow: 75000, unit: kg/h, basis: mass_fraction, composition: {PHENOL: 0.80, ACETONE: 0.045, H2O: 0.008, BPA: 0.08, OPBPA: 0.035, DIANIN: 0.032}}
  - stream: S5
    initial: {flow: 8000, unit: kg/h, basis: mass_fraction, composition: {PHENOL: 0.998, ACETONE: 0.001, H2O: 0.001, BPA: 0.0, OPBPA: 0.0, DIANIN: 0.0}}
convergence: {max_iterations: 200, tolerance: {abs: 0.001, rel: 1.0e-7}}
specs:
  - id: rate
    vary: {stream: S2, initial: 2400}
    target: {stream: S26, quantity: annual, value: 70000, unit: t, hours: 8000}
    provenance: assumed
    source: "D-002: 70 000 t/a of bisphenol A, the design basis of US 6 960 697 B2's simulated plant, in 8000 h (ASSUMED)"
  - id: ratio
    vary: {stream: S1, initial: 2100}
    target: {stream: S8, component: PHENOL, quantity: ratio, per: {stream: S8, component: ACETONE}, basis: mole, value: 10.0}
    provenance: assumed
    source: "D-005: phenol to acetone 10 mol/mol at the reactor inlet, inside US 5 723 688 A's preferred 4:1-14:1 and near US 4 391 997 A's 10.7 (ASSUMED); the fresh phenol is the make-up that holds it"
  - id: wash
    vary: {node: SP101, port: wash, initial: 0.4}
    target: {stream: S5, quantity: ratio, per: {stream: S15, component: ADDUCT}, basis: mass, value: 0.6}
    provenance: assumed
    source: "D-007: 0.6 kg of polished phenol per kg of adduct, US 5 723 688 A, example 1 (adduct to phenol 1:0.6)"

feeds:
  - {id: PH, title: "Phenol (fresh, from a cumene-phenol plant)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AC, title: "Acetone (fresh, from a cumene-phenol plant)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: DW, title: Demineralised water to the crystallizer, category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: x201, direction: out, kind: energy}
      - {id: f201, direction: out, kind: energy}
      - {id: c301, direction: out, kind: energy}
  - id: LPS
    title: LP steam (450 kPa(a), saturated)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis, D-011"}
      supply_temperature: {value: 421.1, provenance: assumed, source: "saturation at 450 kPa(a) (IAPWS-97)"}
      min_approach: {value: 10, provenance: assumed, source: "D-011"}
    ports: [{id: e101, direction: out, kind: energy}, {id: c401, direction: out, kind: energy}]
  - id: HPS
    title: HP steam (4000 kPa(a), saturated)
    category: utility
    utility:
      kind: steam
      level: HP
      pressure: {value: 4000, provenance: assumed, source: "design basis, D-011: hot enough for the stripper's 493 K bottoms"}
      supply_temperature: {value: 523.5, provenance: assumed, source: "saturation at 4000 kPa(a) (IAPWS-97)"}
      min_approach: {value: 20, provenance: assumed, source: "D-011"}
    ports: [{id: m301, direction: out, kind: energy}, {id: c301, direction: out, kind: energy}, {id: c302, direction: out, kind: energy}]
products:
  - {id: BPAP, title: Bisphenol A melt to prilling or flaking, category: product, ports: [{id: in, direction: in}]}
  - {id: TAR, title: Cracking-still residue (tar) to incineration, category: by_product, ports: [{id: in, direction: in}]}
  - {id: WW, title: Phenolic wastewater to treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis"}
      min_approach: {value: 5, provenance: assumed, source: "design basis"}
    ports:
      - {id: r101, direction: in, kind: energy}
      - {id: x201, direction: in, kind: energy}
      - {id: c301, direction: in, kind: energy}
      - {id: c302, direction: in, kind: energy}
      - {id: c401, direction: in, kind: energy}

blocks:
  - id: FEED
    title: Phenol polishing and reactor feed
    class: ProcessStep
    ports:
      - {id: ph, direction: in}
      - {id: ac, direction: in}
      - {id: strip, direction: in}
      - {id: crack, direction: in}
      - {id: acr, direction: in}
      - {id: ml, direction: in}
      - {id: wash, direction: out}
      - {id: out, direction: out}
      - {id: steam, direction: in, kind: energy}
  - id: REACT
    title: Condensation (staged fixed beds of promoted sulfonated resin)
    class: ReactingChemicals
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cw, direction: out, kind: energy}
  - id: CRYST
    title: Adduct crystallization, filtration and phenol wash
    class: Crystallizing
    ports:
      - {id: in, direction: in}
      - {id: water, direction: in}
      - {id: wash, direction: in}
      - {id: cond, direction: out}
      - {id: cake, direction: out}
      - {id: ml, direction: out}
      - {id: cw, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: power_f, direction: in, kind: energy}
  - id: RECOV
    title: Mother-liquor isomerisation, purge cracking still and condensate recovery
    class: Distilling
    ports:
      - {id: ml, direction: in}
      - {id: cond, direction: in}
      - {id: recycle, direction: out}
      - {id: crack, direction: out}
      - {id: acr, direction: out}
      - {id: tar, direction: out}
      - {id: ww, direction: out}
      - {id: hps, direction: in, kind: energy}
      - {id: lps, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
  - id: FINISH
    title: Adduct melting and phenol stripping
    class: Distilling
    ports:
      - {id: cake, direction: in}
      - {id: product, direction: out}
      - {id: phenol, direction: out}
      - {id: hps, direction: in, kind: energy}
      - {id: hps_m, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}

steps:
  # --- FEED -------------------------------------------------------------------------------------
  - id: M102
    block: FEED
    title: Phenol collection (fresh, stripped and recovered)
    class: Mixing
    links: [{target: equipment, ref: T-101}]
    ports:
      - {id: fresh, direction: in, delegates: ph}
      - {id: strip, direction: in, delegates: strip}
      - {id: crack, direction: in, delegates: crack}
      - {id: out, direction: out}
  - id: IX101
    block: FEED
    title: Phenol polishing beds (strong-acid cation and strong-base anion resins)
    class: Filtering
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: SP101
    block: FEED
    title: Polished phenol to the adduct wash and to the reactor
    class: SplittingMaterial
    ports:
      - {id: in, direction: in}
      - {id: wash, direction: out, delegates: wash}
      - {id: rx, direction: out}
  - id: M101
    block: FEED
    title: Reactor feed mixer
    class: Mixing
    ports:
      - {id: ph, direction: in}
      - {id: ac, direction: in, delegates: ac}
      - {id: acr, direction: in, delegates: acr}
      - {id: ml, direction: in, delegates: ml}
      - {id: out, direction: out}
  - id: E101
    block: FEED
    title: Reactor feed heater (LP steam)
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
      - {id: q, direction: in, kind: energy, delegates: steam}
  # --- REACT ------------------------------------------------------------------------------------
  - id: R101
    block: REACT
    title: Condensation reactors (three fixed beds in series, 333 to 353 K, interstage coolers)
    class: ReactingChemicals
    reactions: [BPA_FORM, OPBPA_FORM, DIANIN_FORM]
    reactor: conversion
    energy_port: q
    links: [{target: equipment, ref: R-101}, {target: equipment, ref: E-102}]
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: out, direction: out, delegates: out}
      - {id: q, direction: out, kind: energy, delegates: cw}
  # --- CRYST ------------------------------------------------------------------------------------
  - id: M201
    block: CRYST
    title: Water dosing to the crystallizer feed
    class: Mixing
    ports:
      - {id: eff, direction: in, delegates: in}
      - {id: water, direction: in, delegates: water}
      - {id: out, direction: out}
  - id: FL201
    block: CRYST
    title: Crystallizer vapour space and vacuum condenser (water, acetone and some phenol evaporated)
    class: SeparatingByFlash
    links: [{target: equipment, ref: X-201}, {target: equipment, ref: E-201}]
    recovery:
      outlets: {vap: {H2O: 0.85, ACETONE: 0.95, PHENOL: 0.01}}
      provenance: assumed
      source: >-
        D-007: at about 5 kPa(a) and 318 K (US 5 723 688 A, example 1: about 50 mbar and 40 C;
        US 4 950 806 A: 50 mmHg, 50 C) 85 % of the water and 95 % of the acetone evaporate and 1 % of
        the phenol goes with them, ASSUMED; the vapour is condensed on cooling water (the
        crystallizer's duty, Q4)
    ports:
      - {id: in, direction: in}
      - {id: vap, direction: out, delegates: cond}
      - {id: liq, direction: out}
  - id: X201
    block: CRYST
    title: Adduct crystallizer (vacuum-evaporative cooling, 318 K)
    class: Crystallizing
    energy_port: cool
    links: [{target: equipment, ref: X-201}]
    crystallizer:
      solute: BPA
      solvent: PHENOL
      crystal: ADDUCT
      basis: yield
      temperature: 318.15
      yield: {value: 0.75, provenance: assumed, source: "D-007: 75 % of the bisphenol A fed crystallises as the adduct, so that the mother liquor carries about 8 to 10 wt% bisphenol A, inside US 4 391 997 A's 5-15 wt%; US 6 960 697 B2 reaches about 95 % in a larger crystallizer with acetone in the liquor; no open solubility of the adduct in phenol read (L-1)"}
      spectators: [ACETONE, H2O, OPBPA, DIANIN]
      energy:
        heat_capacity: 2.07
        heat_of_crystallization: -110.46
        feed_temperature: 350.99
        provenance: assumed
        source: >-
          D-007: liquor heat capacity 2.07 kJ/(kg K), the mass-weighted Rowlinson-Bondi values of
          phenol (2.05) and bisphenol A (2.16) of materials.yaml, ASSUMED; heat of crystallization
          -110.46 kJ per kg of adduct from US 6 960 697 B2, example 1 (0.4 million kcal/h heat of
          fusion for 15 161 kg/h); the feed at 350.99 K, the mixed temperature of the reactor
          effluent and the dosed water (hand calculation, D-007). The water and acetone
          evaporated in FL201 take the duty as their latent heat (Q4)
      outlets: {slurry: out}
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: cool, direction: out, kind: energy, delegates: cw}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: F201
    block: CRYST
    title: Rotary vacuum filter with phenol displacement wash
    class: Filtering
    links: [{target: equipment, ref: F-201}]
    solid_separation:
      solid_recovery: 1.0
      cake_liquid: {value: 0.25, basis: per_kg_solid}
      outlets: {cake: cake, filtrate: filtrate, wash_filtrate: washings}
      provenance: assumed
      source: "D-007: every crystal to the cake (fines passing the cloth would dissolve again in the recycled liquor, not modelled), the cake holding 0.25 kg of liquid per kg of crystals, ASSUMED (no filtration data read)"
      wash: {port: wash, efficiency: 0.8, provenance: assumed, source: "D-007: displacement wash efficiency 0.8 per unit wash ratio, ASSUMED; the wash ratio is the design spec wash (0.6 kg of phenol per kg of adduct, US 5 723 688 A)"}
    ports:
      - {id: in, direction: in}
      - {id: wash, direction: in, delegates: wash}
      - {id: cake, direction: out, delegates: cake}
      - {id: filtrate, direction: out}
      - {id: washings, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power_f}
  - id: M202
    block: CRYST
    title: Mother liquor and washings collection
    class: Mixing
    links: [{target: equipment, ref: T-201}]
    ports:
      - {id: ml, direction: in}
      - {id: wash, direction: in}
      - {id: out, direction: out, delegates: ml}
  # --- RECOV ------------------------------------------------------------------------------------
  - id: SP201
    block: RECOV
    title: Purge to the cracking still
    class: SplittingMaterial
    split: {purge: 0.05}
    ports:
      - {id: in, direction: in, delegates: ml}
      - {id: recycle, direction: out}
      - {id: purge, direction: out}
  - id: R301
    block: RECOV
    title: Mother-liquor isomerisation bed (resin)
    class: ReactingChemicals
    reactions: [ISOM]
    reactor: conversion
    links: [{target: equipment, ref: R-301}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: recycle}
  - id: C302
    block: RECOV
    title: Cracking still (phenol recovered from the purge)
    class: Distilling
    links: [{target: equipment, ref: C-302}]
    recovery:
      outlets: {top: {PHENOL: 0.95, ACETONE: 1.0, H2O: 1.0}}
      provenance: assumed
      source: "D-008: 95 % of the purge's phenol recovered overhead, the bisphenols and by-products left in the residue; the cracking back to phenol that US 4 391 997 A describes (150-300 C, aluminium alkoxide) is not modelled (L-4), ASSUMED"
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out, delegates: crack}
      - {id: bot, direction: out, delegates: tar}
      - {id: reb, direction: in, kind: energy, delegates: hps}
      - {id: cond, direction: out, kind: energy, delegates: cw}
  - id: C401
    block: RECOV
    title: Condensate column (acetone and phenol to the reactor, water to treatment)
    class: Distilling
    links: [{target: equipment, ref: C-401}]
    recovery:
      outlets: {top: {ACETONE: 0.995, PHENOL: 0.98, H2O: 0.03}}
      provenance: assumed
      source: "D-008: 99.5 % of the acetone and 98 % of the phenol back to the reactor with 3 % of the water (a column and a phenol-water decanter, lumped), the rest of the water with 2 % of the phenol to treatment, ASSUMED"
    ports:
      - {id: feed, direction: in, delegates: cond}
      - {id: top, direction: out, delegates: acr}
      - {id: bot, direction: out, delegates: ww}
      - {id: reb, direction: in, kind: energy, delegates: lps}
      - {id: cond, direction: out, kind: energy, delegates: cw2}
  # --- FINISH -----------------------------------------------------------------------------------
  - id: M301
    block: FINISH
    title: Adduct melter
    class: ReactingChemicals
    reactions: [ADDUCT_MELT]
    reactor: conversion
    energy_port: q
    links: [{target: equipment, ref: E-301}]
    ports:
      - {id: in, direction: in, delegates: cake}
      - {id: out, direction: out}
      - {id: q, direction: in, kind: energy, delegates: hps_m}
  - id: C301
    block: FINISH
    title: Phenol stripper (vacuum, 493 K bottoms)
    class: Distilling
    links: [{target: equipment, ref: C-301}]
    recovery:
      outlets: {top: {PHENOL: 0.99995, ACETONE: 1.0, H2O: 1.0}}
      provenance: assumed
      source: "D-009: phenol stripped from the melt at 473-493 K and 2-5 kPa(a) (US 5 723 688 A: 150-230 C, 5-180 mbar) to about 35 wt-ppm in the product, ASSUMED"
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out, delegates: phenol}
      - {id: bot, direction: out, delegates: product}
      - {id: reb, direction: in, kind: energy, delegates: hps}
      - {id: cond, direction: out, kind: energy, delegates: cw}
      - {id: power, direction: in, kind: energy, delegates: power}

streams:
  # --- feeds ------------------------------------------------------------------------------------
  - id: S1
    title: Fresh phenol (molten)
    from: PH.out
    to: M102.fresh
    template: liquor
    state:
      design:
        pressure: {value: 300.0, provenance: assumed, source: "feed pump"}
        temperature: {value: 333.15, provenance: assumed, source: "D-003: molten phenol from heated storage (melting point 314 K)"}
        phase: {value: liquid, provenance: assumed, source: "melt"}
        composition: {basis: mass_fraction, values: {PHENOL: 1.0, ACETONE: 0.0, H2O: 0.0, BPA: 0.0, OPBPA: 0.0, DIANIN: 0.0}, provenance: assumed, source: "D-003: taken as pure; the specification of the phenol bought is an open input"}
        flow: {value: 7552.29, provenance: calculated, source: 'cheme process propagate: spec ratio (S8 PHENOL per S8 ACETONE (mole) 10)', fingerprint: 84c923820bccdac0}
  - id: S2
    title: Fresh acetone
    from: AC.out
    to: M101.ac
    template: liquor
    state:
      design:
        pressure: {value: 500.0, provenance: assumed, source: "feed pump"}
        temperature: {value: 298.15, provenance: assumed, source: "storage"}
        phase: {value: liquid, provenance: assumed, source: "liquid"}
        composition: {basis: mass_fraction, values: {ACETONE: 1.0, PHENOL: 0.0, H2O: 0.0, BPA: 0.0, OPBPA: 0.0, DIANIN: 0.0}, provenance: assumed, source: "D-003: taken as pure"}
        flow: {value: 2311.68, provenance: calculated, source: 'cheme process propagate: spec rate (S26 t/a 70000)', fingerprint: 84c923820bccdac0}
  - id: S10
    title: Demineralised water dosed to the crystallizer feed
    from: DW.out
    to: M201.water
    template: liquor
    state:
      design:
        pressure: {value: 400.0, provenance: assumed, source: "header"}
        temperature: {value: 298.15, provenance: assumed, source: "ambient"}
        phase: {value: liquid, provenance: assumed, source: "liquid"}
        flow: {value: 1300.0, provenance: assumed, source: "D-007: water enough that the latent heat of the water, acetone and phenol evaporated in FL201 matches the crystallizer's duty Q4 (hand check in D-007); the crystallizer feed then holds about 3.6 wt% water, inside US 5 723 688 A's 2-12 wt%; ASSUMED"}
        composition: {basis: mass_fraction, values: {H2O: 1.0, PHENOL: 0.0, ACETONE: 0.0, BPA: 0.0, OPBPA: 0.0, DIANIN: 0.0}, provenance: assumed, source: "demineralised water"}
  # --- feed preparation -------------------------------------------------------------------------
  - id: S3
    title: Phenol to the polishing beds
    from: M102.out
    to: IX101.in
    template: slurry
    state:
      design:
        pressure: {value: 400.0, provenance: assumed, source: "phenol pump"}
        temperature: {value: 338.15, provenance: assumed, source: "D-004: the stripped and recovered phenol subcooled in their condensers so that the beds run at 338 K, inside US 5 723 688 A's 45-70 C for the polishing resins"}
        phase: {value: liquid, provenance: assumed, source: "liquid"}
        flow: {value: 16489.2, provenance: calculated, source: 'cheme process propagate: mixer M102 from S1 S22 S25', fingerprint: b1f576a145b09005}
        composition: {basis: mole_fraction, values: {PHENOL: 0.992309, ACETONE: 0.000322986, H2O: 0.00736838, BPA: 0.0, OPBPA: 0.0, DIANIN: 0.0, ADDUCT: 0.0}, provenance: calculated, source: 'cheme process propagate: mixer M102 from S1 S22 S25', fingerprint: c9dab9702c07ae8a}
  - id: S4
    title: Polished phenol
    from: IX101.out
    to: SP101.in
    template: slurry
    state:
      design:
        pressure: {value: 350.0, provenance: assumed, source: "pressure profile"}
        temperature: {value: 338.15, provenance: assumed, source: "D-004"}
        phase: {value: liquid, provenance: assumed, source: "liquid"}
        flow: {value: 16489.2, provenance: calculated, source: 'cheme process propagate: pass-through IX101 from S3', fingerprint: c624c1ec408228e2}
        composition: {basis: mole_fraction, values: {PHENOL: 0.992309, ACETONE: 0.000322986, H2O: 0.00736838, BPA: 0.0, OPBPA: 0.0, DIANIN: 0.0, ADDUCT: 0.0}, provenance: calculated, source: 'cheme process propagate: pass-through IX101 from S3', fingerprint: c624c1ec408228e2}
  - id: S5
    title: Polished phenol to the adduct wash
    from: SP101.wash
    to: F201.wash
    template: slurry
    state:
      design:
        pressure: {value: 350.0, provenance: assumed, source: "pressure profile"}
        temperature: {value: 338.15, provenance: assumed, source: "D-004, D-007: inside US 5 723 688 A's 35-75 C for the wash"}
        phase: {value: liquid, provenance: assumed, source: "liquid"}
        flow: {value: 7407.97, provenance: calculated, source: 'cheme process propagate: recycle SP101 from S4 (tear, broyden)', fingerprint: 47edea4f158ff491}
        composition: {basis: mole_fraction, values: {PHENOL: 0.992309, ACETONE: 0.000322986, H2O: 0.00736837, BPA: 0.0, OPBPA: 0.0, DIANIN: 0.0, ADDUCT: 0.0}, provenance: calculated, source: 'cheme process propagate: recycle SP101 from S4 (tear, broyden)', fingerprint: 47edea4f158ff491}
  - id: S6
    title: Polished phenol to the reactor feed
    from: SP101.rx
    to: M101.ph
    template: slurry
    state:
      design:
        pressure: {value: 350.0, provenance: assumed, source: "pressure profile"}
        temperature: {value: 338.15, provenance: assumed, source: "D-004"}
        phase: {value: liquid, provenance: assumed, source: "liquid"}
        flow: {value: 9081.21, provenance: calculated, source: 'cheme process propagate: splitter SP101 from S4 S5', fingerprint: d17e81ceeac63213}
        composition: {basis: mole_fraction, values: {PHENOL: 0.992309, ACETONE: 0.000322986, H2O: 0.00736838, BPA: 0.0, OPBPA: 0.0, DIANIN: 0.0, ADDUCT: 0.0}, provenance: calculated, source: 'cheme process propagate: splitter SP101 from S4', fingerprint: e1109dabd127bca0}
  - id: S7
    title: Mixed reactor feed
