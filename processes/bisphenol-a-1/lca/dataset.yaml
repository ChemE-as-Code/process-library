id: bisphenol-a-from-phenol-and-acetone-over-a-promoted-sulfonated-resin-8.75-t-h-70-kt-a
title: Bisphenol A from phenol and acetone over a promoted sulfonated resin (8.75 t/h, 70 kt/a)
description: Unallocated foreground LCI of Bisphenol A from phenol and acetone over a promoted sulfonated
  resin (8.75 t/h, 70 kt/a), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: phenol and acetone (10 mol/mol at the inlet) over a 2-mercaptoethylamine-promoted sulfonated
  polystyrene-divinylbenzene resin in three adiabatic fixed beds (333 to 353 K, 69 % acetone conversion
  per pass); the effluent crystallised without distillation as the 1:1 adduct with phenol by vacuum-evaporative
  cooling with added water (318 K, 0.85 kPa(a), the vapour boosted to 12 kPa(a) and condensed on cooling
  water); rotary vacuum filter with a polished-phenol wash; adduct melted and stripped of phenol under
  vacuum with a steam-stripping section; mother liquor isomerised and recycled, 5 % purged to a phenol-recovery
  still; 8.75 t/h, 70 kt/a
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: emission-excluded:vacuum-vents
  title: storage-tank emissions of X-201, C-301, C-302, T-101, T-201
  direction: output
  reason: The vacuum-pump discharges of the crystallizer and the columns and the tank breathing (phenol,
    acetone, nitrogen) go to a vent treatment that is not designed here; their flows are not in the balance
    (no P&ID yet, D-014). The EU risk assessment's site data (SRC-6, Table 3.2) give bisphenol A releases
    to air of 0.06 to 575 kg/a per site, about 0.86 g/t in all over the Western European production (D-014).
- key: emission-excluded:site-effluent
  title: effluent emissions of C-401
  direction: output
  reason: 'The bisphenol A in the treated site effluent is not an exchange of this foreground: the phenolic
    water goes to treatment (product:WW). SRC-6, Table 3.2 gives 6.8 to 113 kg/a per site after treatment,
    about 0.2 g/t in all (D-014).'
- key: emission-excluded:resin-make-up
  title: non-routine emissions of R-101, R-301, V-101
  direction: output
  reason: 'Resin and promoter make-up and the spent resin''s disposal are not counted: no open resin life
    read (D-013).'
