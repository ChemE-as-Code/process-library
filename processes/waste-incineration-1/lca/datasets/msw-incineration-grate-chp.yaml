exchanges:
- key: product:electricity
  title: Electricity, net export (generation less own use)
  type: product
  amount: 262.29687499999994
  unit: kWh
  formula: (msw / 1000 * lhv * 1000 / 3.6) * eta_h * p_we / (p_we + p_qhe) - msw / 1000 * e_own
  provenance: calculated
  carrier:
    kind: electricity
    source: generator output less the plant's own use, to the grid
  properties:
    exergy: 3600.0
    source: 'electricity is pure work: 3600 kJ of exergy per kWh'
  source: LHV input x gross energy efficiency x electricity share of the example CHP plant, less own use (EU JRC
    (2019) WI BREF, EUR 29971 EN, doi:10.2760/761437, Tables 2.10, 5.2, 8.4, 3.37)
- key: product:heat
  title: Heat, net export to district heating (gross heat less own use)
  type: product
  amount: 1163.2031249999998
  unit: kWh
  formula: (msw / 1000 * lhv * 1000 / 3.6) * eta_h * p_qhe / (p_we + p_qhe) - msw / 1000 * q_own
  provenance: calculated
