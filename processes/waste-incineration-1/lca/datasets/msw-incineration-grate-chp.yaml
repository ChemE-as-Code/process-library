# Tier 1 form, a manifest-only library entry (process-library #317 pattern). Every amount is the formula of its
# parameters; core's validator re-checks each. Written from the WI BREF (2019) and IPCC 2006 Vol. 5 (facts in our own form).
schema: cheme/lci_dataset/v2
kind: lci_dataset
id: msw-incineration-grate-chp
title: Incineration of mixed municipal solid waste on a grate, with heat-oriented combined heat and power
description: Per 1 t of mixed municipal solid waste (wet) burnt on a moving grate in an EU plant at BAT, with a
  heat recovery boiler, a back-pressure turbine and district-heating export, semi-wet lime FGC, SNCR and activated
  carbon. Net electricity and net heat are the products; the waste arrives burden-free. Waste composition, energy,
  reagents, residues and air emissions from the WI BREF (2019) ranges; N2O and CH4 from IPCC 2006.
basis: 1000 kg of mixed municipal solid waste (wet) incinerated
boundary: 'gate-to-gate: waste bunker, grate furnace and boiler, turbine and district-heating exchanger, flue-gas
  cleaning; up to the residues leaving the site and the energy at the plant fence'
technology: moving grate (about 90 % of European MSW installations), 40 bar steam, back-pressure CHP, semi-wet FGC
  with quicklime, SNCR with ammonia water, activated carbon injection, bag filter
geography:
  description: EU plants of the WI BREF data collection; the waste composition is German (UBA 2001).
classification:
  isic: '3821'
system_boundary:
  included:
  - the waste, by its ultimate analysis (free)
  - combustion oxygen (free)
  - support fuel, quicklime, ammonia, activated carbon
  - net electricity and net heat (products)
  - CO2 fossil and biogenic, N2O, CH4, NOx, CO, VOC, SO2, HCl, HF, NH3, Hg, PCDD/F, dust
  - bottom ash, boiler ash, FGC residue
  excluded:
  - 'TODO metals of the flue gas (Cd+Tl, Sb+As+Pb+Cr+Co+Cu+Mn+Ni+V): the BAT-AELs are sums, not single flows'
  - TODO process water (boiler make-up, lime slurry under 300 l/t, bottom-ash quench), the dilution water of the
    ammonia, boiler blowdown and other waste water
  - TODO grid electricity in outages and shutdowns (the source's own use is taken as met from own generation)
  - TODO ferrous and non-ferrous scrap recovered from the bottom ash (a recyclable, burden-free under cut-off) and
    the unburnt carbon of the bottom ash
  - 'TODO the treatment of the residues (no background mapped yet: reported gaps)'
  - TODO diffuse emissions of the bunker and of bottom-ash handling; emissions of other than normal operation
  - transport of the waste to the plant; waste collection and pre-treatment
  - infrastructure
  cutoff: none applied; the excluded flows are not quantified
  infrastructure: excluded
  catalysts: excluded
  non_routine: excluded
location: RER
year: 2014
valid_until: 2019
time:
  start: 2001
  description: The energy, residue and reagent data are of the 2016 data collection for the WI BREF (operating year
    2014); the waste composition is from UBA 2001. valid_until is the reference year + 5 (system-model section 6),
    so it has already lapsed.
modelling:
  principle: attributional
  multifunctionality: 'two co-products, net electricity and net heat, unallocated in the dataset (no allocation
    block). The database allocates them by exergy (lci/mappings.yaml allocation.waste-incineration-1, docs/system-model.md
    section 2: exported heat is allocated by energy or exergy, never credited). The waste is an input without burden:
    under the library''s cut-off the user of the recovered energy carries the treatment (system-model section 3).'
uuid: 4fd62852-b8bd-52c1-8cd0-75fef52aea97
version: 0.1.0
methodology_version: 1.1.0
system_model: cutoff
technology_level: current
review: unreviewed
rights: CC-BY-4.0
data_generator: ChemE-as-Code process library
