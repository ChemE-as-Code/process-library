    separation train; the product slate is set by recycling MMA and TMA, so no product can be singled
    out as the cause of a utility. The amines are close in molar heating value per kg and are sold at
    similar prices per kg (no open price source checked), so mass is the simple, transparent physical
    basis; economic allocation is to be compared once prices are sourced.'
  deviation: The library hierarchy asks for the WBCSD price ratio to decide between physical and economic
    allocation. No open, dated prices of anhydrous MMA, DMA and TMA were sourced in this run (open input
    O-8), so the ratio is unknown; mass is used as the physical basis for three chemically similar co-products
    of one reactor and train, and is to be checked against economic allocation once prices are sourced
    (DESIGN.md D-014).
