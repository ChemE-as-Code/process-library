location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: vapour-phase amination of methanol over amorphous silica-alumina (adiabatic, 625-713 K, 2.2
  MPa), N/C 2.0, recycle of NH3, TMA, MMA and methanol; NH3 column, TMA extractive distillation with water,
  dehydration, MMA/DMA and methanol columns; 8 t/h amines (25/55/20 wt% MMA/DMA/TMA)
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
cutoff:
- key: cutoff:silica-alumina-catalyst
  title: Amorphous silica-alumina converter catalyst (R-101)
  reason: silica gel with about 10-15 wt% alumina, no precious or critical metal (US 3,387,032 A; the
    patent's optional silver, rhenium, molybdenum or cobalt promoters are not assumed); catalyst volume,
    space velocity and life not sourced (O-4); should connect to its manufacture and to the treatment
    of the spent catalyst
  catalyst: true
  contains:
  - Si
  - Al
- key: cutoff:caustic-dosing
  title: Sodium hydroxide dosed against corrosion in the amine columns
  reason: practice reported (US 7,309,403 B2) but no amount sourced (O-6); should connect to sodium hydroxide
    (50 % solution) and leaves with the wastewater
- key: cutoff:higher-amine-purge
  title: Higher-amine impurity purge (decanted organic phase)
  reason: by-product formation not modelled (D-005); US 4,283,254 A reports the purge stream; should connect
    to hazardous-waste incineration
- key: emission-excluded:leaks
  title: equipment-leaks emissions of the plant
  direction: output
  reason: 'not estimated at concept stage: no P&ID component count yet; ammonia, methanol and amine fugitives
    to be estimated at basic engineering (D-014)'
  source: DESIGN.md D-014
- key: emission-excluded:tanks
  title: storage-tank emissions of the plant
  direction: output
  reason: 'no storage tank inside the boundary: methanol, ammonia and product storage are outside (D-001)'
  source: DESIGN.md D-001
- key: emission-excluded:combustion
  title: combustion emissions of the plant
  direction: output
  reason: 'no fired unit: the feed is vaporised with MP steam and the converter is adiabatic; catalyst
    regeneration by burn-off (US 7,435,855 B2) is periodic and not modelled (D-014)'
  source: DESIGN.md D-014
- key: emission-excluded:vents
  title: non-routine emissions of the plant
  direction: output
  reason: 'no vent or purge in the model: the feeds carry no inerts and no decomposition gases (CO, H2,
    CH4) are modelled (D-005); a column vent to a flare or scrubber is expected at basic engineering'
  source: DESIGN.md D-005
