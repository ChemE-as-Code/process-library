    slate is set by recycling MMA and TMA, so no product can be singled out as the cause of a utility.
    The amines are close in molar heating value per kg and are sold at similar prices per kg (no open
    price source checked), so mass is the simple, transparent physical basis; economic allocation is to
    be compared once prices are sourced.'
