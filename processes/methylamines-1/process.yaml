  - {title: "US 3,387,032 A (1968) Process for the manufacture of methylamines (silica-alumina catalyst, 350-450 C, 150-300 psig)", url: "https://patents.google.com/patent/US3387032A/en"}
  - {title: "US 7,435,855 B2 (2008) Process for the continuous synthesis of methylamines (conditions, conversion, coke regeneration)", url: "https://patents.google.com/patent/US7435855"}
  - {title: "US 7,309,403 B2 (2007) Method for avoiding corrosion (ammonia column, TMA extractive distillation with water, MMA/DMA columns)", url: "https://patents.justia.com/patent/7309403"}
