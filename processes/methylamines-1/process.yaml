# Process Atlas manifest. Schema: schemas/process.schema.json (cheme-as-code/process/v1).
schema: cheme-as-code/process/v1
id: methylamines-1
title: Methylamines (MMA, DMA, TMA) from methanol and ammonia
summary: >-
  Methanol and ammonia react over amorphous silica-alumina at 350-440 C to an equilibrium mix of
  mono-, di- and trimethylamine; ammonia, TMA, surplus MMA and methanol are recycled, and a
  five-column train (ammonia, TMA extractive distillation with water, dehydration, MMA/DMA,
  methanol recovery) gives 8 t/h of anhydrous amines (concept design, gate-to-gate LCI).
description: |
  Concept design covering issues #171 (methylamine) and #166 (dimethylamine) as one
  co-production plant. Methanol (methanol-1) and ammonia (ammonia-1) are boundary feeds. The
  converter is modelled as an ideal-gas chemical equilibrium (no kinetics); separations are
  sharp splits; duties are concept estimates. Preliminary gate-to-gate LCI with unmapped
  background datasets. See DESIGN.md.
families: [nitrogen-organics]
keywords: [methylamine, monomethylamine, dimethylamine, trimethylamine, methanol amination, silica-alumina, extractive distillation]
facets:
  feedstock_basis: [fossil]
  product_classes: [chemicals]
  unit_operations: [reaction, distillation, extractive-distillation]
  region: generic
maturity: concept
validation:
  status: unreviewed
# PENDING REGISTRY: methanol, ammonia, methylamine, dimethylamine and trimethylamine have no
# entry in chemicals/chemicals.yaml yet; they are to be added in the consolidated registry PR
# (DESIGN.md D-013). Until then the library's registry check reports these five slugs.
chemistry:
  inputs:
    - {chemical: methanol, role: feedstock, inventory_key: "feed:MEOH", note: "Boundary feed, made by methanol-1; pure in the model"}
    - {chemical: ammonia, role: feedstock, inventory_key: "feed:NH3F", note: "Anhydrous liquid ammonia, boundary feed made by ammonia-1"}
  outputs:
    - {chemical: dimethylamine, role: main-product, inventory_key: "product:DMAP", note: "Anhydrous, 4.4 t/h (ASSUMED slate)"}
    - {chemical: methylamine, role: co-product, inventory_key: "product:MMAP", note: "Anhydrous monomethylamine, 2.0 t/h"}
    - {chemical: trimethylamine, role: co-product, inventory_key: "product:TMAP", note: "Anhydrous, 1.6 t/h"}
    - {chemical: wastewater, role: waste, inventory_key: "product:WW", note: "Reaction water to biological treatment, 100 ppm(wt) methanol (ASSUMED)"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER", note: "Feed and recycle pumps (ASSUMED electric drives)"}
    - {chemical: steam, role: utility, inventory_key: "feed:MPS", note: "MP steam 1500 kPa(a): feed vaporiser, C-101 and C-103 reboilers"}
    - {chemical: steam, role: utility, inventory_key: "feed:LPS", note: "LP steam 450 kPa(a): C-102, C-104, C-105 reboilers"}
    - {chemical: cooling-water, role: utility, inventory_key: "product:CW", note: "25/35 C (ASSUMED)"}
basis: {capacity: "8 t/h anhydrous methylamines (2.0 MMA + 4.4 DMA + 1.6 TMA), ASSUMED", operating_hours_per_year: 8000}
lca: {source: auto}
