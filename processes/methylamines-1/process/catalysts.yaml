schema: cheme/catalysts/v1
kind: catalysts
catalysts:
  - id: SIAL
    name: Amorphous silica-alumina dehydration catalyst
    active_phase: acidic silica-alumina
    support: silica gel with about 10-15 wt% alumina (US 3,387,032 A, Example 1)
    window:
      temperature: [623.15, 723.15]
      pressure: [1135.0, 2515.0]
      provenance: given
      source: "350-450 C and 150-300 psig preferred (US 3,387,032 A, description of the reactor; US 4,283,254 A, background: 350-450 C, 200-350 psig); pressures converted to kPa(a)"
    poisons: [formaldehyde and other aldehydes in the feed (coke)]
    sources:
      - "US 3,387,032 A (Leonard), steam-deactivated silica-alumina"
      - "US 7,435,855 B2 (BASF): coke deactivation, regeneration by controlled burn-off at 350-650 C (description)"
