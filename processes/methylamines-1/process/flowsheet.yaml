# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Methylamines (MMA, DMA, TMA) from methanol and ammonia over amorphous silica-alumina, with
# recycle of ammonia, TMA, MMA and methanol and the separation train ammonia column, TMA
# extractive distillation with water, dehydration, MMA/DMA column, methanol recovery (D-001..D-008).
# Where the values come from:
# - the net product slate, the feed states, temperatures and pressures are design choices
#   (design basis), ASSUMED;
# - the converter outlet S7 is calculated by cheme (ideal-gas equilibrium reactor, D-005);
# - flows and compositions through the mixer, pump, condenser and the two splitters are
#   calculated by `cheme process propagate --fill`;
# - column outlets, recycle flows and all duties come from the independent balance
#   scripts/mass_balance.py (D-006), given here as ASSUMED: core cannot yet qualify vapour-liquid
#   equilibria or enthalpies of this polar amine-water-methanol system; the columns
#   are sharp splits (D-008).
schema: cheme/process/v1
kind: flowsheet
title: Methylamines from methanol and ammonia (8 t/h MMA + DMA + TMA)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
  enthalpy_reference: {state: ideal_gas, temperature: 298.15}
cases:
  - {id: design, description: "Design case: net 2.0 t/h MMA, 4.4 t/h DMA, 1.6 t/h TMA (D-002), converter feed N/C 2.0, outlet 713 K (D-004)", default: true}
tolerance: {abs: 1.0, rel: 0.005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h

feeds:
  - {id: MEOH, title: "Methanol (boundary feed; made by methanol-1)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NH3F, title: "Liquid ammonia (boundary feed; made by ammonia-1)", category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power
    category: utility
    utility: {kind: electricity}
    ports: [{id: p101, direction: out, kind: energy}]
  - id: MPS
    title: MP steam 1500 kPa(a)
    category: utility
    utility:
      kind: steam
      level: MP
      pressure: {value: 1500, provenance: assumed, source: "design basis, D-009"}
      supply_temperature: {value: 471.4, provenance: assumed, source: "saturation at 1500 kPa(a), D-009"}
      min_approach: {value: 10, provenance: assumed, source: D-009}
    ports:
      - {id: e101, direction: out, kind: energy}
      - {id: c101, direction: out, kind: energy}
      - {id: c103, direction: out, kind: energy}
  - id: LPS
    title: LP steam 450 kPa(a)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis, D-009"}
      supply_temperature: {value: 420.8, provenance: assumed, source: "saturation at 450 kPa(a), D-009"}
      min_approach: {value: 10, provenance: assumed, source: D-009}
    ports:
      - {id: c102, direction: out, kind: energy}
      - {id: c104, direction: out, kind: energy}
      - {id: c105, direction: out, kind: energy}
products:
  - {id: MMAP, title: Anhydrous monomethylamine to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: DMAP, title: Anhydrous dimethylamine to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: TMAP, title: Anhydrous trimethylamine to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: WW, title: Process wastewater to biological treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-009"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-009"}
      min_approach: {value: 5, provenance: assumed, source: D-009}
    ports:
      - {id: e103, direction: in, kind: energy}
      - {id: c101, direction: in, kind: energy}
      - {id: c102, direction: in, kind: energy}
      - {id: c103, direction: in, kind: energy}
      - {id: c104, direction: in, kind: energy}
      - {id: c105, direction: in, kind: energy}

blocks:
  - id: RXN
    title: Feed preparation and methylamines synthesis
    class: ReactingChemicals
    ports:
      - {id: meoh, direction: in}
      - {id: nh3, direction: in}
      - {id: rec_nh3, direction: in}
      - {id: rec_mma, direction: in}
      - {id: rec_meoh, direction: in}
      - {id: effluent, direction: out}
      - {id: power, direction: in, kind: energy}
      - {id: steam, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: NHR
    title: Ammonia recovery (with the TMA recycle)
    class: Distilling
    ports:
      - {id: feed, direction: in}
      - {id: recycle, direction: out}
      - {id: amines, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: AMS
    title: Amine separation (TMA extractive distillation, dehydration, MMA/DMA column)
    class: Distilling
    ports:
      - {id: feed, direction: in}
      - {id: solvent, direction: in}
      - {id: tma, direction: out}
      - {id: mma, direction: out}
      - {id: mma_rec, direction: out}
      - {id: dma, direction: out}
      - {id: water, direction: out}
      - {id: steam1, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: steam3, direction: in, kind: energy}
      - {id: cw1, direction: out, kind: energy}
      - {id: cw2, direction: out, kind: energy}
      - {id: cw3, direction: out, kind: energy}
  - id: MRW
    title: Methanol recovery and process water
    class: Distilling
    ports:
      - {id: feed, direction: in}
      - {id: meoh_rec, direction: out}
      - {id: solvent, direction: out}
      - {id: ww, direction: out}
      - {id: steam, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}

steps:
  - id: M101
    block: RXN
    title: Feed and recycle junction (feed drum)
    class: Mixing
    links: [{target: equipment, ref: V-101}]
    ports:
      - {id: meoh, direction: in, delegates: meoh}
      - {id: nh3, direction: in, delegates: nh3}
      - {id: rec_nh3, direction: in, delegates: rec_nh3}
      - {id: rec_mma, direction: in, delegates: rec_mma}
      - {id: rec_meoh, direction: in, delegates: rec_meoh}
      - {id: out, direction: out}
  - id: P101
    block: RXN
    title: Converter feed pump
    # Pumping is the right DEXPI class, but cheme process build fails on it (its method field is
    # a union type in pyDEXPI; to report to core, D-011): generic ProcessStep until fixed.
    class: ProcessStep
    links: [{target: equipment, ref: P-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  - id: E101
    block: RXN
    title: Feed vaporiser
    # Evaporating (total vaporisation of the feed); SupplyingThermalEnergy fails in cheme
    # process build like Pumping (D-011).
    class: Evaporating
    links: [{target: equipment, ref: E-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: steam, direction: in, kind: energy, delegates: steam}
  - id: E102
    block: RXN
    title: Converter feed/effluent exchanger
    class: ExchangingThermalEnergy
    links: [{target: equipment, ref: E-102}]
    ports:
      - {id: cold_in, direction: in}
      - {id: cold_out, direction: out}
      - {id: hot_in, direction: in}
      - {id: hot_out, direction: out}
  # D-005: adiabatic fixed bed; outlet at the ideal-gas equilibrium of the three methylations at
  # its outlet temperature (the reactions conserve moles: pressure has no effect).
  - id: R101
    block: RXN
    title: Methylamines converter (adiabatic, silica-alumina)
    class: ReactingChemicals
    reactions: [MMA_SYN, DMA_SYN, TMA_SYN]
    reactor: equilibrium
    catalyst: SIAL
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
  - id: E103
    block: RXN
    title: Effluent condenser
    class: Cooling
    links: [{target: equipment, ref: E-103}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: effluent}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: C101
    block: NHR
    title: Ammonia column
    class: Distilling
    links: [{target: equipment, ref: C-101}]
    ports:
      - {id: feed, direction: in, delegates: feed}
      - {id: top, direction: out, delegates: recycle}
      - {id: bot, direction: out, delegates: amines}
      - {id: reb, direction: in, kind: energy, delegates: steam}
      - {id: cond, direction: out, kind: energy, delegates: cw}
  - id: C102
    block: AMS
    title: TMA extractive distillation column (water)
    class: Distilling
    links: [{target: equipment, ref: C-102}]
    ports:
      - {id: feed, direction: in, delegates: feed}
      - {id: solvent, direction: in, delegates: solvent}
      - {id: top, direction: out, delegates: tma}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: steam1}
      - {id: cond, direction: out, kind: energy, delegates: cw1}
  - id: C103
    block: AMS
    title: Dehydration column
    class: Distilling
    links: [{target: equipment, ref: C-103}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out}
      - {id: bot, direction: out, delegates: water}
      - {id: reb, direction: in, kind: energy, delegates: steam2}
      - {id: cond, direction: out, kind: energy, delegates: cw2}
  - id: C104
    block: AMS
    title: MMA / DMA column
    class: Distilling
    links: [{target: equipment, ref: C-104}]
    ports:
      - {id: feed, direction: in}
      - {id: top, direction: out}
      - {id: bot, direction: out, delegates: dma}
      - {id: reb, direction: in, kind: energy, delegates: steam3}
      - {id: cond, direction: out, kind: energy, delegates: cw3}
  # D-002, D-007: the MMA made beyond the product rate returns to the converter.
  - id: SPM
    block: AMS
    title: MMA product / recycle split
    class: SplittingMaterial
    split: {product: 0.404593537}
    ports:
      - {id: in, direction: in}
      - {id: product, direction: out, delegates: mma}
      - {id: recycle, direction: out, delegates: mma_rec}
  - id: C105
    block: MRW
    title: Methanol recovery column
    class: Distilling
    links: [{target: equipment, ref: C-105}]
    ports:
      - {id: feed, direction: in, delegates: feed}
      - {id: top, direction: out, delegates: meoh_rec}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: steam}
      - {id: cond, direction: out, kind: energy, delegates: cw}
  # D-008: the extraction water of C-102 is C-105 bottoms; the net reaction water leaves.
  - id: SPW
    block: MRW
    title: Extraction water / wastewater split
    class: SplittingMaterial
    split: {solvent: 0.737053592}
    ports:
      - {id: in, direction: in}
      - {id: solvent, direction: out, delegates: solvent}
      - {id: waste, direction: out, delegates: ww}

# Values from scripts/mass_balance.py (D-006) unless calculated by cheme. Temperatures of column
# products are ideal (Raoult) bubble points at the column pressure (D-008): rough estimates.
streams:
  - id: S1
    title: Fresh methanol
    from: MEOH.out
    to: M101.meoh
    template: mixture
    state:
      design:
        pressure: {value: 300, provenance: assumed, source: "design basis (D-003)"}
        temperature: {value: 303.15, provenance: assumed, source: "design basis (D-003)"}
        flow: {value: 10920.3, basis: mass, provenance: given, source: "design specification of this study: capacity and slate of process/design-basis.yaml (D-002, itself ASSUMED), stoichiometric, one methanol per methyl group plus the wastewater loss (scripts/mass_balance.py, D-006)"}
        composition: {basis: mole_fraction, values: {CH3OH: 1.0}, provenance: given, source: "design specification of this study: pure methanol feed of process/design-basis.yaml (D-003, ASSUMED; Grade AA water and impurities not modelled)"}
  - id: S2
