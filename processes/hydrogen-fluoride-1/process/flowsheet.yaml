# The flowsheet: the source of the BFD and PFD (`cheme process build` writes process/*.xml;
# never edit those). Schema cheme/process/v1 (`cheme schema process-flowsheet`).
#
# Anhydrous hydrogen fluoride from acid-grade fluorspar and sulfuric acid in an indirectly fired
# rotary kiln with three heating zones, gas purification, refrigerated condensation and two
# distillations; anhydrite and fluorosilicic acid as co-products; 4800 kg/h of fluorspar, the feed
# of US 6 699 455 B2 Example 4 (DESIGN.md D-001, D-002).
# Where the values come from:
# - cheme process propagate solves every stream: the kiln, the oleum hydration, the anhydrite
#   neutraliser and the two tail-gas absorbers are conversion reactors (process/reactions.yaml),
#   the kiln discharge, the scrubbers, the condenser and the columns component separators with
#   ASSUMED splits (L-2), the rest mixers; the acid loop (kiln gas -> pre-purification scrubber ->
#   feed acid -> kiln) is torn at the feed acid S3, and two design specifications set the fresh
#   acid for 1.0 wt% free acid in the kiln solids and the oleum for 3.0 wt% water in the feed
#   acid (D-006, D-007);
# - the duties are hand balances on the propagated streams (D-009), every one marked ASSUMED;
# - small auxiliaries (coagulants, the effluent lime) are not streams (L-3).
schema: cheme/process/v1
kind: flowsheet
title: Anhydrous hydrogen fluoride from fluorspar and sulfuric acid in a rotary kiln (4800 kg/h fluorspar)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - id: design
    description: "Design case: 4800 kg/h acid-grade fluorspar to one rotary kiln, about 2.3 t/h anhydrous HF (D-002)"
    default: true
    capacity: 4800 kg/h fluorspar
    provenance: given
    source: "SRC-2, US 6 699 455 B2, Example 4: 80 kg/min of fluorspar to a 20 m x 2.5 m rotary kiln with nine burners in three zones"
tolerance: {abs: 0.05, rel: 0.0005}   # balances: |in - out| <= abs + rel * max(in, out), kg/h
tears:
  - stream: S3
    initial:
      flow: 6400
      basis: mass_fraction
      composition: {H2SO4: 0.95, H2O: 0.03, HF: 0.02}
  - stream: S21
    initial:
      flow: 5400
      basis: mass_fraction
      composition: {H2SO4: 0.976, H2O: 0.015, HF: 0.009}
convergence: {method: wegstein, max_iterations: 200, tolerance: {abs: 0.0001, rel: 1.0e-9}}
specs:
  - id: acid
    vary: {stream: S20, initial: 5350}
    target: {stream: S7, component: H2SO4, quantity: fraction, basis: mass, value: 0.010}
    provenance: assumed
    source: "D-006: 1.0 wt% free sulfuric acid in the kiln solids, inside the 0.5-1.7 wt% of SRC-2 (US 6 699 455 B2, Examples 3 and 4)"
  - id: oleum
    vary: {stream: S31, initial: 640}
    target: {stream: S3, component: H2O, quantity: fraction, basis: mass, value: 0.030}
    provenance: assumed
    source: "D-007: feed acid with 3.0 wt% water, i.e. about 95 % H2SO4 with the dissolved HF, the upper end of the 90-95 % of SRC-1 (6.2.3)"

feeds:
  - {id: SPAR, title: "Acid-grade fluorspar, dried", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: ACID, title: Sulfuric acid 98.5 wt% (sulfuric-acid-1), category: raw_material, ports: [{id: out, direction: out}]}
  - {id: OLEUM, title: "Oleum (as its free SO3)", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: LIME, title: Quicklime for the anhydrite, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: PW, title: Process water to the SiF4 absorber, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: NAOH, title: Caustic soda 50 wt% to the tail-gas scrubber, category: raw_material, ports: [{id: out, direction: out}]}
  - {id: FUEL, title: "Natural gas (as methane) to the burners of the spar preheater and the kiln's nine combustion chambers", category: raw_material, ports: [{id: out, direction: out}]}
  - {id: AIR, title: Combustion air for the burners, category: raw_material, ports: [{id: out, direction: out}]}
  - id: POWER
    title: Electric power (grid)
    category: utility
    utility: {kind: electricity}
    ports:
      - {id: aux, direction: out, kind: energy}
  - id: LPS
    title: LP steam 450 kPa(a) (column reboilers; condensate returned)
    category: utility
    utility:
      kind: steam
      level: LP
      pressure: {value: 450, provenance: assumed, source: "design basis, D-009"}
      supply_temperature: {value: 421.0, provenance: assumed, source: "saturation at 450 kPa(a), D-009"}
      min_approach: {value: 10, provenance: assumed, source: D-009}
    ports:
      - {id: c301, direction: out, kind: energy}
      - {id: c302, direction: out, kind: energy}
products:
  - {id: AHF, title: Anhydrous hydrogen fluoride to storage, category: product, ports: [{id: in, direction: in}]}
  - {id: ANH, title: Neutralised anhydrite (co-product or landfill), category: by_product, ports: [{id: in, direction: in}]}
  - {id: FSA, title: Fluorosilicic acid solution (with its precipitated silica), category: by_product, ports: [{id: in, direction: in}]}
  - {id: EFF, title: Alkaline scrubber effluent to waste-water treatment, category: wastewater, ports: [{id: in, direction: in}]}
  - {id: STACK, title: Tail gas to atmosphere, category: off_gas, ports: [{id: in, direction: in}]}
  - {id: FLUE, title: Flue gas of the spar preheater and the kiln's combustion chambers to atmosphere, category: off_gas, ports: [{id: in, direction: in}]}
  - id: LOSS
    title: Heat lost with the flue gas and through the shells of the fired spar preheater and kiln
    category: utility
    utility: {kind: other}
    ports: [{id: b101, direction: in, kind: energy}]
  - id: REF
    title: Refrigeration (brine at 258 K)
    category: utility
    utility:
      kind: refrigerant
      level: brine -15 C
      supply_temperature: {value: 258.15, provenance: assumed, source: "design basis, D-009: chilled water or brine on the HF condensers (SRC-1, 6.2.4)"}
      return_temperature: {value: 263.15, provenance: assumed, source: "design basis, D-009"}
      min_approach: {value: 5, provenance: assumed, source: D-009}
    ports:
      - {id: e201, direction: in, kind: energy}
      - {id: c301, direction: in, kind: energy}
      - {id: c302, direction: in, kind: energy}
  - id: CW
    title: Cooling water return
    category: utility
    utility:
      kind: cooling_water
      supply_temperature: {value: 298.15, provenance: assumed, source: "design basis, D-009"}
      return_temperature: {value: 308.15, provenance: assumed, source: "design basis, D-009"}
      min_approach: {value: 5, provenance: assumed, source: D-009}
    ports:
      - {id: t201, direction: in, kind: energy}
      - {id: r501, direction: in, kind: energy}

blocks:
  - id: KLN
    title: Spar preheating, rotary kiln and anhydrite
    class: ReactingChemicals
    ports:
      - {id: spar, direction: in}
      - {id: acid, direction: in}
      - {id: lime, direction: in}
      - {id: gas, direction: out}
      - {id: anh, direction: out}
      - {id: fuel, direction: in}
      - {id: air, direction: in}
      - {id: flue, direction: out}
      - {id: loss, direction: out, kind: energy}
      - {id: power, direction: in, kind: energy}
      - {id: cw, direction: out, kind: energy}
  - id: GAS
    title: Gas purification, HF condensation and the acid loop
    class: SeparatingByPhaseSeparation
    ports:
      - {id: gas, direction: in}
      - {id: acid, direction: in}
      - {id: oleum, direction: in}
      - {id: hb, direction: in}
      - {id: feedacid, direction: out}
      - {id: crude, direction: out}
      - {id: lb, direction: in}
      - {id: tail, direction: out}
      - {id: cw, direction: out, kind: energy}
      - {id: ref, direction: out, kind: energy}
  - id: DST
    title: HF distillation (low and high boilers)
    class: Distilling
    ports:
      - {id: crude, direction: in}
      - {id: lb, direction: out}
      - {id: ahf, direction: out}
      - {id: hb, direction: out}
      - {id: steam1, direction: in, kind: energy}
      - {id: steam2, direction: in, kind: energy}
      - {id: ref1, direction: out, kind: energy}
      - {id: ref2, direction: out, kind: energy}
  - id: TGT
    title: SiF4 absorption and alkaline tail-gas scrubbing
    class: Absorbing
    ports:
      - {id: gas, direction: in}
      - {id: water, direction: in}
      - {id: naoh, direction: in}
      - {id: fsa, direction: out}
      - {id: eff, direction: out}
      - {id: stack, direction: out}

steps:
  # D-009: natural gas burnt with air in the combustion chambers that heat the spar preheater and
  # the kiln indirectly; the heat the charges absorb goes to H101 and R101, the rest is lost
  - id: B101
    block: KLN
    title: Burners and combustion chambers of the spar preheater and the kiln (natural gas)
    class: ReactingChemicals
    reactions: [COMB]
    reactor: conversion
    links: [{target: equipment, ref: H-101}, {target: equipment, ref: R-101}]
    ports:
      - {id: fuel, direction: in, delegates: fuel}
      - {id: air, direction: in, delegates: air}
      - {id: flue, direction: out, delegates: flue}
      - {id: heat1, direction: out, kind: energy}
      - {id: heat2, direction: out, kind: energy}
      - {id: loss, direction: out, kind: energy, delegates: loss}
  # D-004: the dried acid spar is preheated indirectly to about 400 C (SRC-2: 350-450 C)
  - id: H101
    block: KLN
    title: Fluorspar preheater (indirectly fired)
    class: HeatingInFurnace
    links: [{target: equipment, ref: H-101}]
    ports:
      - {id: in, direction: in, delegates: spar}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy}
  - id: P101
    block: KLN
    title: Feed acid pumps (with the plant's auxiliary power, lumped)
    class: Pumping
    links: [{target: equipment, ref: P-101}]
    ports:
      - {id: in, direction: in, delegates: acid}
      - {id: out, direction: out}
      - {id: power, direction: in, kind: energy, delegates: power}
  # D-006: two thirds of the acid premixed with the hot spar in a screw mixer, one third straight
  # into zone 1 (SRC-2); one mixing point in the model
  - id: M101
    block: KLN
    title: Screw mixer (spar and feed acid)
    class: Mixing
    links: [{target: equipment, ref: M-101}]
    ports:
      - {id: spar, direction: in}
      - {id: acid, direction: in}
      - {id: out, direction: out}
  - id: R101
    block: KLN
    title: Rotary kiln, indirectly fired in three zones
    class: ReactingChemicals
    reactions: [R1, R2, R3, R4, R5]
    reactor: conversion
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out}
      - {id: heat, direction: in, kind: energy}
  - id: V101
    block: KLN
    title: Kiln discharge (process gas off the solids)
    class: SeparatingByPhaseSeparation
    recovery:
      outlets: {sol: {CaF2: 1.0, SiO2: 1.0, CaCO3: 1.0, Fe2O3: 1.0, C18H36O2: 1.0, CaSO4: 1.0, Fe2SO43: 1.0, H2SO4: 1.0, H2O: 0.0, HF: 0.0, SiF4: 0.0, CO2: 0.0, SO2: 0.0, SO3: 0.0}}
      provenance: assumed
      source: "D-006: the solids keep the free acid; the gases and vapours leave the kiln completely; the dust carried with the gas is left out (L-3)"
    links: [{target: equipment, ref: R-101}]
    ports:
      - {id: in, direction: in}
      - {id: sol, direction: out}
      - {id: gas, direction: out, delegates: gas}
  # D-008: the free acid of the anhydrite neutralised with quicklime, the anhydrite cooled (D-009)
  - id: R501
    block: KLN
    title: Anhydrite neutraliser (lime mixer) and anhydrite cooler
    class: ReactingChemicals
    reactions: [NEU]
    reactor: conversion
    links: [{target: equipment, ref: M-501}]
    ports:
      - {id: in, direction: in}
      - {id: lime, direction: in, delegates: lime}
      - {id: out, direction: out, delegates: anh}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  # D-007: pre-purification column with the cold acid from the final scrubber: water, the acid
  # vapour and the dust out of the gas, the gas cooled below 100 C (SRC-1, 6.2.4)
  - id: T201
    block: GAS
    title: Pre-purification scrubber (sulfuric acid)
    class: Absorbing
    recovery:
      outlets: {liq: {H2SO4: 1.0, SO3: 1.0, H2O: 0.98, HF: 0.03, SiF4: 0.0, CO2: 0.0, SO2: 0.0}}
      provenance: assumed
      source: "D-007: all acid and 98 % of the water to the liquid, 3 % of the HF dissolved in the hot acid back to the kiln; no open absorption data read (L-2)"
    links: [{target: equipment, ref: T-201}]
    ports:
      - {id: gas, direction: in, delegates: gas}
      - {id: acid, direction: in}
      - {id: gasout, direction: out}
      - {id: liq, direction: out}
      - {id: cw, direction: out, kind: energy, delegates: cw}
  - id: M102
    block: GAS
    title: Feed acid mixer (scrubber acid, high boilers, oleum)
    class: Mixing
    links: [{target: equipment, ref: V-102}]
    ports:
      - {id: scr, direction: in}
      - {id: hb, direction: in, delegates: hb}
      - {id: so3, direction: in, delegates: oleum}
      - {id: out, direction: out}
  - id: R102
    block: GAS
    title: Feed acid tank (oleum's SO3 binds the water)
    class: ReactingChemicals
    reactions: [HYD]
    reactor: conversion
    links: [{target: equipment, ref: V-102}]
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: feedacid}
  # D-007: refrigerated condensation of the crude HF (SRC-1, 6.2.4: chilled water or brine)
  - id: E201
    block: GAS
    title: HF condensers (brine)
    class: SeparatingByThermalProcess
    recovery:
      outlets: {liq: {HF: 0.985, H2O: 1.0, H2SO4: 1.0, SO2: 0.5, SiF4: 0.05, CO2: 0.02}}
      provenance: assumed
      source: "D-007: 98.5 % of the HF condensed with the water and the acid traces, half of the SO2, some SiF4 and CO2 dissolved; no open vapour-liquid data of the mixture read (L-2)"
    links: [{target: equipment, ref: E-201}]
    ports:
      - {id: in, direction: in}
      - {id: liq, direction: out, delegates: crude}
      - {id: gas, direction: out}
      - {id: ref, direction: out, kind: energy, delegates: ref}
  - id: M301
    block: GAS
    title: Condenser vent and low boilers to the final scrubber
    class: Mixing
    ports:
      - {id: cond, direction: in}
      - {id: lb, direction: in, delegates: lb}
      - {id: out, direction: out}
  # D-007: fresh acid takes the HF out of the residual gas and carries it to the pre-purification
  # column (SRC-1, 6.2.4)
  - id: T301
    block: GAS
    title: Final sulfuric acid scrubber (fresh acid)
    class: Absorbing
    recovery:
      outlets: {liq: {H2SO4: 1.0, SO3: 1.0, H2O: 1.0, HF: 0.99, SiF4: 0.0, CO2: 0.0, SO2: 0.0}}
      provenance: assumed
      source: "D-007: 99 % of the HF to the cold acid (SRC-1, 6.2.4: most of the HF is recovered); no open absorption data read (L-2)"
    links: [{target: equipment, ref: T-301}]
    ports:
      - {id: gas, direction: in}
      - {id: acid, direction: in, delegates: acid}
      - {id: liq, direction: out}
      - {id: gas_out, direction: out, delegates: tail}
  # D-007: low boilers (SO2, SiF4, CO2) off the crude HF
  - id: C301
    block: DST
    title: Low-boiler column
    class: Distilling
    recovery:
      outlets: {top: {HF: 0.02, SO2: 1.0, SiF4: 1.0, CO2: 1.0, H2O: 0.0, H2SO4: 0.0}}
      provenance: assumed
      source: "D-007: SO2, SiF4 and CO2 to the top with 2 % of the HF (SRC-1, 6.2.4: the low boilers, mainly SO2 and SiF4); a split, no column model (L-2)"
    links: [{target: equipment, ref: C-301}]
    ports:
      - {id: in, direction: in, delegates: crude}
      - {id: top, direction: out, delegates: lb}
      - {id: bot, direction: out}
      - {id: reb, direction: in, kind: energy, delegates: steam1}
      - {id: cond, direction: out, kind: energy, delegates: ref1}
  # D-007: high boilers (water, acid) off the HF; the product is the top (SRC-1, 6.2.4)
  - id: C302
    block: DST
    title: High-boiler column (anhydrous HF at the top)
    class: Distilling
    recovery:
      outlets: {top: {HF: 0.97, H2O: 0.01, H2SO4: 0.0, SO2: 1.0, SiF4: 1.0, CO2: 1.0}}
      provenance: assumed
      source: "D-007: 97 % of the HF and 1 % of the water to the top; the bottoms (3 % of the HF, the water and the acid) back to the feed acid; a split, no column model (L-2)"
    links: [{target: equipment, ref: C-302}]
    ports:
      - {id: in, direction: in}
      - {id: top, direction: out, delegates: ahf}
      - {id: bot, direction: out, delegates: hb}
      - {id: reb, direction: in, kind: energy, delegates: steam2}
      - {id: cond, direction: out, kind: energy, delegates: ref2}
  # D-008: SiF4 absorbed in water to fluorosilicic acid (SRC-1, 6.2.4, 6.4.4)
  - id: R401
    block: TGT
    title: SiF4 absorber (water)
    class: ReactingChemicals
    reactions: [SIF]
    reactor: conversion
    links: [{target: equipment, ref: T-401}]
    ports:
      - {id: gas, direction: in, delegates: gas}
      - {id: water, direction: in, delegates: water}
      - {id: out, direction: out}
  - id: V401
    block: TGT
    title: SiF4 absorber liquid outlet
    class: SeparatingByPhaseSeparation
    recovery:
      outlets: {liq: {H2SiF6: 1.0, SiO2: 1.0, H2O: 1.0, HF: 1.0, SiF4: 0.0, CO2: 0.0, SO2: 0.0}}
      provenance: assumed
      source: "D-008: the acid, the silica and the HF slip to the liquid; the water vapour in the tail gas left out (L-3)"
    links: [{target: equipment, ref: T-401}]
    ports:
      - {id: in, direction: in}
      - {id: liq, direction: out, delegates: fsa}
      - {id: gas, direction: out}
  # D-008: alkaline scrubbing of SO2 (SRC-1, 6.2.5, 6.4.7)
  - id: R402
    block: TGT
    title: Alkaline tail-gas scrubber
    class: ReactingChemicals
    reactions: [SOX]
    reactor: conversion
    links: [{target: equipment, ref: T-402}]
    ports:
      - {id: gas, direction: in}
      - {id: naoh, direction: in, delegates: naoh}
      - {id: out, direction: out}
  - id: V402
    block: TGT
    title: Alkaline scrubber liquid outlet
    class: SeparatingByPhaseSeparation
    recovery:
      outlets: {liq: {NaOH: 1.0, Na2SO3: 1.0, H2O: 1.0, SiF4: 1.0, SO2: 0.0, CO2: 0.0}}
      provenance: assumed
      source: "D-008: the caustic liquor keeps the sulfite, the excess caustic and the SiF4 traces; the CO2 is not absorbed below pH 8 (SRC-1, 6.4.7) and leaves with the SO2 slip"
    links: [{target: equipment, ref: T-402}]
    ports:
      - {id: in, direction: in}
      - {id: liq, direction: out, delegates: eff}
      - {id: gas, direction: out, delegates: stack}

streams:
  - id: S1
    title: Fluorspar (dried acid spar)
    from: SPAR.out
    to: H101.in
    template: spar
    state:
      design:
        temperature: {value: 298.15, provenance: assumed, source: "from the spar silo (design basis)"}
        pressure: {value: 101.325, provenance: assumed, source: "design basis"}
        composition: {basis: mass_fraction, values: {CaF2: 0.975, SiO2: 0.010, CaCO3: 0.010, Fe2O3: 0.004, C18H36O2: 0.001}, provenance: assumed, source: "D-004: inside the acid-spar limits of SRC-1, Table 6.2 (CaF2 above 97 %, SiO2, CaCO3 and the Fe and Al oxides below 2 % each, flotation chemicals below 0.3 %); dried, MgCO3, BaSO4, sulfides and phosphates left out (L-3)"}
        flow: {value: 4800, provenance: given, source: "SRC-2, US 6 699 455 B2, Example 4: 80 kg/min"}
  - id: S2
    title: Preheated fluorspar
    from: H101.out
    to: M101.spar
    template: spar
    state:
      design:
        temperature: {value: 673.15, provenance: given, source: "SRC-2, Example 4: fluorspar at about 400 C"}
        flow: {value: 4800.0, provenance: calculated, source: 'cheme process propagate: pass-through H101 from S1', fingerprint: 5d752cb8b485c074}
        composition: {basis: mass_fraction, values: {CaF2: 0.975, SiO2: 0.01, CaCO3: 0.01, Fe2O3: 0.004, C18H36O2: 0.001}, provenance: calculated, source: 'cheme process propagate: pass-through H101 from S1', fingerprint: 5d752cb8b485c074}
  - id: S3
    title: Feed acid
    from: R102.out
    to: P101.in
    template: process
    state:
      design:
        temperature: {value: 393.15, provenance: given, source: "SRC-2, Example 4: sulfuric acid at about 120 C (D-006)"}
        flow: {value: 6382.71, provenance: calculated, source: 'cheme process propagate: recycle R102 from S32 (tear, broyden)', fingerprint: 78f3b6059224aafe}
        composition: {basis: mole_fraction, values: {CaF2: 0.0, SiO2: 0.0, CaCO3: 0.0, Fe2O3: 0.0, C18H36O2: 0.0, CaSO4: 0.0, Fe2SO43: 0.0, CaO: 0.0, H2SO4: 0.773971, SO3: 0.0, H2O: 0.13349, HF: 0.0925386, SiF4: 0.0, CO2: 0.0, SO2: 0.0, H2SiF6: 0.0, NaOH: 0.0, Na2SO3: 0.0}, provenance: calculated, source: 'cheme process propagate: recycle R102 from S32 (tear, broyden)', fingerprint: 78f3b6059224aafe}
  - id: S4
    title: Feed acid to the kiln
    from: P101.out
    to: M101.acid
    template: process
    state:
      design:
        temperature: {value: 393.15, provenance: given, source: "SRC-2, Example 4: sulfuric acid at about 120 C"}
        pressure: {value: 400, provenance: assumed, source: "design basis"}
        flow: {value: 6382.71, provenance: calculated, source: 'cheme process propagate: pass-through P101 from S3', fingerprint: b351b254f6816a4e}
        composition: {basis: mole_fraction, values: {CaF2: 0.0, SiO2: 0.0, CaCO3: 0.0, Fe2O3: 0.0, C18H36O2: 0.0, CaSO4: 0.0, Fe2SO43: 0.0, CaO: 0.0, H2SO4: 0.773971, SO3: 0.0, H2O: 0.13349, HF: 0.0925386, SiF4: 0.0, CO2: 0.0, SO2: 0.0, H2SiF6: 0.0, NaOH: 0.0, Na2SO3: 0.0}, provenance: calculated, source: 'cheme process propagate: pass-through P101 from S3', fingerprint: b351b254f6816a4e}
  - id: S5
    title: Kiln charge
    from: M101.out
    to: R101.in
    template: process
