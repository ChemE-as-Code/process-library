    S30 carries none); the top of SRC-1's 0.005-0.015 kg/t (Table 6.6) x 18 439 t/a
  cas: 7664-39-3
  source: D-011
- key: emission-excluded:feed-acid-tank
  title: storage-tank emissions of V-102
  direction: output
  reason: the feed acid tank V-102 (oleum, scrubber acid and the high boilers, with dissolved HF) breathes
    into the kiln gas system, which the whole plant holds under suction (SRC-1, 6.2.3), so its vapours
    end in the scrubbers the flowsheet carries (ASSUMED); no tank loss leaves the plant apart from the
    tail gas S30
  source: DESIGN.md D-011
