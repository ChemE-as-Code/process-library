allocation:
  method: none
  source: 'D-011 (agent proposal, for the LCA practitioner to confirm): all burdens to the anhydrous HF.
    The anhydrite is sent to landfill, as the BREF says most excess anhydrite is (SRC-1, 6.4.3), and the
    fluorosilicic acid leaves burden-free under the cut-off as a by-product others may use (SRC-1, 6.4.4).
    No prices are sourced, and a mass allocation would give the anhydrite (3.6 kg per kg of HF) most of
    the burden, which no source supports.'
  deviation: Where the anhydrite is sold (to cement or floor screed), an economic allocation would move
    a small share of the burden to it and the landfill would drop out; this dataset is the conservative
    bound for the HF.
