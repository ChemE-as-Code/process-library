id: anhydrous-hydrogen-fluoride-from-fluorspar-and-sulfuric-acid-in-a-rotary-kiln-4800-kg-h-fluorspar
title: Anhydrous hydrogen fluoride from fluorspar and sulfuric acid in a rotary kiln (4800 kg/h fluorspar)
description: Unallocated foreground LCI of Anhydrous hydrogen fluoride from fluorspar and sulfuric acid
  in a rotary kiln (4800 kg/h fluorspar), case design, derived from the flowsheet by cheme assess lca.
scope: foreground
basis: 1 h of operation
location: GLO
year: 2026
boundary: gate-to-gate foreground of the plant
technology: 'Continuous plant: dried acid spar (97.5 wt% CaF2) preheated indirectly to 400 C, mixed in
  a screw mixer with feed acid at 120 C and reacted in a 20 m x 2.5 m rotary kiln heated by nine natural-gas
  combustion chambers in three zones (walls 370 C falling to 210 C); kiln gas scrubbed with sulfuric acid
  (acid loop, oleum binds the water), HF condensed against brine, low- and high-boiler columns; final
  sulfuric acid scrubber, SiF4 absorbed in water to fluorosilicic acid, SO2 scrubbed with caustic soda;
  the anhydrite''s free acid neutralised with lime (BREF LVIC-AAF 2007 chapter 6; US 6 699 455 B2)'
rights: 'CC-BY-4.0: the ChemE-as-Code process library''s own concept design (LICENSE-DATA)'
