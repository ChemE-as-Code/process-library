# Goal and scope of the hydrogen-fluoride-1 LCI. Schema: `cheme schema lca`. Outputs: `cheme
# assess lca --write` (lca/inventory.csv, gaps.csv, dataset.yaml, manifest.json, results); never
# edit those by hand.
#
# Preliminary gate-to-gate foreground inventory (DESIGN.md D-011): every exchange of the plant per
# kg of anhydrous HF, from the flowsheet's design case. The backgrounds are left unmapped
# (`missing:` with the activity each should connect to), except where lca/mappings.yaml links a
# library producer or a shared entry: a gap, never zero, and no values from licensed databases.
schema: cheme/lca/v1
kind: lca
goal: >-
  Preliminary gate-to-gate life cycle inventory of anhydrous hydrogen fluoride made from
  acid-grade fluorspar and sulfuric acid in an indirectly fired rotary kiln, at the concept stage:
  which raw materials, fuel, utilities, co-products and emissions the plant exchanges per kg of
  AHF, as the foreground for a later cradle-to-gate study and for the fluorochemicals the library
  buys (aluminium-1's aluminium fluoride).
functional_unit: {product: AHF, amount: 1, unit: kg, source: "1 kg of anhydrous HF, stream S17 (modelled 99.997 wt% HF, 29 ppm water) at the plant gate to storage (D-002, D-011)"}
# The boundary key stays cradle-to-gate so that the purchased inputs remain open gaps instead of
# being mapped free (the schema's gate-to-gate maps every feed free), as other entries do.
boundary: cradle-to-gate
case: design
year: 2026
location: GLO
technology: "Continuous plant: dried acid spar (97.5 wt% CaF2) preheated indirectly to 400 C, mixed in a screw mixer with feed acid at 120 C and reacted in a 20 m x 2.5 m rotary kiln heated by nine natural-gas combustion chambers in three zones (walls 370 C falling to 210 C); kiln gas scrubbed with sulfuric acid (acid loop, oleum binds the water), HF condensed against brine, low- and high-boiler columns; final sulfuric acid scrubber, SiF4 absorbed in water to fluorosilicic acid, SO2 scrubbed with caustic soda; the anhydrite's free acid neutralised with lime (BREF LVIC-AAF 2007 chapter 6; US 6 699 455 B2)"
rights: "CC-BY-4.0: the ChemE-as-Code process library's own concept design (LICENSE-DATA)"
system_model: cutoff
allocation:
  method: none
  source: >-
    D-011 (agent proposal, for the LCA practitioner to confirm): all burdens to the anhydrous HF.
    The anhydrite is sent to landfill, as the BREF says most excess anhydrite is (SRC-1, 6.4.3),
    and the fluorosilicic acid leaves burden-free under the cut-off as a by-product others may
    use (SRC-1, 6.4.4). No prices are sourced, and a mass allocation would give the anhydrite
    (3.6 kg per kg of HF) most of the burden, which no source supports.
  deviation: >-
    Where the anhydrite is sold (to cement or floor screed), an economic allocation would move a
    small share of the burden to it and the landfill would drop out; this dataset is the
    conservative bound for the HF.
flows:
  # raw materials
  - key: feed:SPAR
    missing: "not mapped yet (D-011): no library producer and no shared entry for acid-grade fluorspar. Connect to: fluorspar, acid grade (97 % CaF2), from mining, flotation and drying, per kg as delivered"
    source: "flowsheet stream S1, 4800 kg/h (SRC-2, Example 4), D-004"
  - key: feed:ACID
    missing: "linked to processes/sulfuric-acid-1 (lca/mappings.yaml): sulfuric acid 98.5 wt%"
    source: "flowsheet stream S20, set by the design specification for 1.0 wt% free acid in the kiln solids (D-006)"
  - key: feed:OLEUM
    missing: "linked to the shared sulfur-trioxide entry (lca/mappings.yaml): the oleum's free SO3; sulfuric-acid-1 makes no oleum"
    source: "flowsheet stream S31, set by the design specification for 3.0 wt% water in the feed acid (D-007)"
  - key: feed:LIME
    missing: "linked to processes/lime-1 (lca/mappings.yaml): quicklime"
    source: "flowsheet stream S8 (D-008)"
  - key: feed:PW
    missing: "linked to the shared water entry (lca/mappings.yaml): process water"
    source: "flowsheet stream S23 (D-008)"
  - key: feed:NAOH
    missing: "linked to processes/chlor-alkali-1 (lca/mappings.yaml): caustic soda 50 wt%"
    source: "flowsheet stream S27 (D-008)"
  # utilities
  - key: feed:FUEL
    missing: "linked to the shared natural-gas entry (lca/mappings.yaml): natural gas, high pressure, by mass taken as methane"
    source: "flowsheet stream S33: the natural gas fired in the spar preheater and the kiln, 2879.3 kW (LHV), the absorbed duties Q1 and Q2 at the furnace efficiency of 0.478 that SRC-2's 189 m3/h gives (D-009)"
  - {key: feed:AIR, free: true, source: "combustion air for the burners (S34): a resource taken from nature without burden; its N2 and excess O2 leave in the flue gas S35"}
  - key: feed:POWER
    missing: "not mapped yet in this folder (D-011; the Atlas build links it through the shared lci/mappings.yaml electricity entry): electricity, medium voltage, grid mix of the (undecided) site country"
    source: "flowsheet energy stream P1, 225 kWh/t (SRC-1, Table 6.4), D-009"
  - key: feed:LPS
    missing: "linked as heat from steam (lca/mappings.yaml), per kWh of condensing heat"
    source: "flowsheet energy streams Q5 and Q7, the column reboilers, D-009"
  - key: product:CW
    missing: "heat rejected to a recirculating cooling-water system (prefer_atlas: processes/utility-cooling-tower), per kWh removed"
    source: "flowsheet energy streams Q3 (pre-purification scrubber cooler) and Q9 (anhydrite cooler with the neutralisation heat), D-009"
  - key: product:REF
    missing: "not mapped yet (D-011): no library producer or shared entry for refrigeration. Connect to: brine at 258 K from a compression refrigeration plant, per kWh of cold"
    source: "flowsheet energy streams Q4, Q6 and Q8 (HF condensers and the column condensers), D-009"
  # co-products, wastes and emissions
  - key: product:ANH
    treatment: {kind: waste, route: "neutralised anhydrite to landfill, as the excess anhydrite of most plants (SRC-1, 6.4.3)"}
    missing: "linked to the shared inert-waste-landfill entry (lca/mappings.yaml)"
    source: "flowsheet stream S9 (D-008, D-011)"
  - key: product:FSA
    free: true
    source: "flowsheet stream S25, 25 wt% fluorosilicic acid with its precipitated silica, a by-product that leaves burden-free under the cut-off (SRC-1, 6.4.4) (D-011)"
  - key: product:EFF
    treatment: {kind: waste, route: "alkaline scrubber effluent (sulfite, excess caustic) to the site's waste-water treatment, neutralised with lime (SRC-1, 6.4.9)"}
    missing: "linked to the shared wastewater entry (lca/mappings.yaml), per kg"
    source: "flowsheet stream S29 (D-008)"
  - key: product:STACK
    emission: true
    source: "flowsheet stream S30: the tail gas after the alkaline scrubber (D-008)"
  - key: product:FLUE
    emission: true
    source: "flowsheet stream S35: the flue gas of the combustion chambers of the spar preheater and the kiln, to air (D-009)"
  - {key: product:LOSS, free: true, source: "Q10: the heat lost with the flue gas and through the shells of the fired preheater and kiln (D-009); warm gas and air leave without a burden of their own"}
  - key: emission:CO2
    elementary: {compartment: air, subcompartment: unspecified}
    source: "CO2 of the natural gas burnt in the combustion chambers (flue gas S35, 246.6 g per kg of HF) and of the spar's carbonate (R3) and flotation fatty acids (R5) in the tail gas S30 (15.0 g per kg); the fatty acids are vegetable (SRC-1, 6.2.2) but lumped with the carbonate as fossil (L-3)"
  - key: emission:SO2
    elementary: {compartment: air, subcompartment: unspecified}
    source: "SO2 slip of the alkaline scrubber, 0.0049 g per kg of HF, inside SRC-1's 0.001-0.01 kg/t with alkaline scrubbing (Table 6.6, which gives 0.065 kg/t as the maximum) and the BAT-AEL of 0.001-0.01 kg/t (Table 6.15), D-008"
  - {key: emission:SiF4, missing: "not a flow: 0 kg in S30 (the caustic scrubber keeps the SiF4 traces, D-008)", source: "flowsheet stream S30"}
  - {key: emission:H2O, free: true, source: "water vapour of the flue gas S35 (the tail gas's vapour is left out, D-008)"}
  - {key: emission:O2, free: true, source: "the excess oxygen of the combustion air in the flue gas S35"}
  - {key: emission:N2, free: true, source: "the nitrogen of the combustion air in the flue gas S35"}
  - {key: emission:CH4, missing: "not a flow: 0 kg in S35 (complete combustion, D-009); unburnt methane is not estimated", source: "flowsheet stream S35"}
  # The tail gas S30 shares the process template (materials.yaml), so every other component is
  # listed with 0 kg: none of them leaves to air in the model (D-008, D-011).
  - {key: emission:HF, missing: "not a flow: 0 kg in S30; the HF slip of the final scrubber is absorbed in the fluorosilicic acid (D-008); the fluoride traces of real plants are excluded (emission_exclusions)", source: "flowsheet stream S30"}
  - {key: emission:C18H36O2, missing: "not a flow: 0 kg in S30 (process template)", source: "flowsheet stream S30"}
  - {key: emission:CaCO3, missing: "not a flow: 0 kg in S30 (process template)", source: "flowsheet stream S30"}
  - {key: emission:CaF2, missing: "not a flow: 0 kg in S30 (process template); spar dust is excluded (emission_exclusions)", source: "flowsheet stream S30"}
  - {key: emission:CaO, missing: "not a flow: 0 kg in S30 (process template)", source: "flowsheet stream S30"}
  - {key: emission:CaSO4, missing: "not a flow: 0 kg in S30 (process template); anhydrite dust is excluded (emission_exclusions)", source: "flowsheet stream S30"}
  - {key: emission:Fe2O3, missing: "not a flow: 0 kg in S30 (process template)", source: "flowsheet stream S30"}
  - {key: emission:Fe2SO43, missing: "not a flow: 0 kg in S30 (process template)", source: "flowsheet stream S30"}
  - {key: emission:H2SO4, missing: "not a flow: 0 kg in S30 (process template)", source: "flowsheet stream S30"}
  - {key: emission:H2SiF6, missing: "not a flow: 0 kg in S30 (process template)", source: "flowsheet stream S30"}
  - {key: emission:Na2SO3, missing: "not a flow: 0 kg in S30 (process template)", source: "flowsheet stream S30"}
  - {key: emission:NaOH, missing: "not a flow: 0 kg in S30 (process template)", source: "flowsheet stream S30"}
  - {key: emission:SO3, missing: "not a flow: 0 kg in S30 (process template)", source: "flowsheet stream S30"}
  - {key: emission:SiO2, missing: "not a flow: 0 kg in S30 (process template)", source: "flowsheet stream S30"}
operation:
  hours_per_year: 8000
  life_years: 25
  source: "design basis operating_hours_per_year 8000 (ASSUMED); 25 a service life ASSUMED; no construction inventory at this stage (no take-off)"
emission_estimates:
  - id: kiln-flue-gas
    title: NO, NO2 and CO in the flue gas of the indirectly fired kiln (H-101, R-101)
    method: combustion
    equipment: [H-101, R-101]
    activity: {value: 2.30483, unit: t, source: "the AHF S17, 2304.83 kg/h (D-002)"}
    factors:
      "NO": {value: 0.325, unit: kg/t, source: "SRC-1, Table 6.6: the yearly figures of one German HF plant with alkaline scrubbing (German UBA 2000), per t of HF; ASSUMED to be the kiln's flue gas and to apply to this plant (D-011)"}
      NO2: {value: 0.056, unit: kg/t, source: "SRC-1, Table 6.6, the same plant; ASSUMED as for NO (D-011)"}
      CO: {value: 0.054, unit: kg/t, source: "SRC-1, Table 6.6, the same plant; ASSUMED as for NO (D-011)"}
    cas: {"NO": 10102-43-9, NO2: 10102-44-0, CO: 630-08-0}
    elementary: {compartment: air, subcompartment: unspecified}
    source: "D-011: the only plant figures the sources give for these gases; the CO2 of the combustion is in the flue gas S35, SO2 and the fluorides of the same table in the tail gas S30 and the cut-off"
emission_exclusions:
  - id: feed-acid-tank
    method: storage-tank
    equipment: [V-102]
    reason: "the feed acid tank V-102 (oleum, scrubber acid and the high boilers, with dissolved HF) breathes into the kiln gas system, which the whole plant holds under suction (SRC-1, 6.2.3), so its vapours end in the scrubbers the flowsheet carries (ASSUMED); no tank loss leaves the plant apart from the tail gas S30"
    source: "DESIGN.md D-011"
cutoff:
  - {id: spar-dust, title: "Fluorspar dust (CaF2) from conveying and storage of the dried spar", direction: output, unit: kg, per_year: 922, cas: 7789-75-5, reason: "not estimated: no dust filter is modelled at the concept stage; the top of SRC-1's 0.01-0.05 kg/t of a plant without a drying section (Table 6.5) x 18 439 t/a (L-3)", source: "D-011"}
  - {id: anhydrite-dust, title: "Anhydrite dust (CaSO4) from the neutralisation and handling", direction: output, unit: kg, per_year: 1844, cas: 7778-18-9, reason: "not estimated: no anhydrite treatment is modelled; the top of SRC-1's 0.05-0.1 kg/t (Table 6.5) x 18 439 t/a; the lime dust (below 0.001 kg/t) is smaller still (L-3)", source: "D-011"}
  - {id: fluorides, title: "Fluorides to air (as HF) of the tail gas and the anhydrite handling", direction: output, unit: kg, per_year: 277, cas: 7664-39-3, reason: "the flowsheet's fluorine leaves only in the product, the anhydrite and the acids (the tail gas S30 carries none); the top of SRC-1's 0.005-0.015 kg/t (Table 6.6) x 18 439 t/a", source: "D-011"}
dataset:
  version: 0.1.0
  classification: {isic: "2011"}   # ISIC Rev.4 2011 Manufacture of basic chemicals
  modelling: {principle: attributional}
  geography: {description: "Generic chemicals site with fluorspar supply, natural gas and a sulfuric acid plant nearby, not chosen (GLO); one design case"}
  system_model: cutoff
  technology_level: current
  review: {type: none}
  data_generator: "ChemE-as-Code agent session (Claude Opus 5.5) for issue #513, unreviewed"
