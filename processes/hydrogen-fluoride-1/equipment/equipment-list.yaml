# The equipment list. Schema: `cheme schema equipment`.
# As far as the PFD requires (concept stage): tags, types and services of the flowsheet steps,
# with the sizes the sources and hand balances give (DESIGN.md D-004 to D-009). Design pressures,
# temperatures and materials are not set yet (basic engineering); the materials named are those
# the sources name, to be confirmed. All values ASSUMED unless a source is named.
schema: cheme/equipment/v1
equipment:
  - {tag: H-101, type: Furnace, service: "Fluorspar preheater, indirectly fired with natural gas",
     notes: "4800 kg/h of dried spar from 25 to 400 C (US 6 699 455 B2: 350-450 C), 478 kW absorbed (D-009)."}
  - {tag: P-101, type: CentrifugalPump, service: "Feed acid pumps (the plant's auxiliary power booked here)",
     notes: "6.38 t/h of feed acid at 120 C (95 % H2SO4, 2.3 % HF); P1 519 kW lumps every drive (D-009)."}
  - {tag: M-101, type: Mixer, service: "Screw mixer: hot spar with two thirds of the feed acid",
     notes: "The other third goes straight into zone 1 (US 6 699 455 B2, Examples 3 and 4); one mixing point in the model (D-006)."}
  - {tag: R-101, type: RotaryKiln, service: "Rotary kiln, indirectly heated by nine natural-gas combustion chambers in three zones",
     notes: "20 m long, 2.5 m diameter (US 6 699 455 B2, Example 4); walls about 370 C at the feed end falling to 210 C; HF gas out at 205 C, solids at 204 C; 899 kW absorbed (D-006, D-009). About 160 m2 of shell for 55 t/d of HF, 2.9 m2 per t/d (BREF LVIC-AAF 2007, 6.2.3: 5-10 m2 without a pre-reactor, 2.5-3 with spar calcination)."}
  - {tag: M-501, type: Mixer, service: "Anhydrite neutraliser (quicklime mixer) and anhydrite cooler",
     notes: "8.31 t/h of kiln solids with 1.0 wt% free acid, 49.9 kg/h CaO (D-008)."}
  - {tag: T-201, type: Column, service: "Pre-purification scrubber with sulfuric acid (dust, water and acid vapour out of the kiln gas)",
     notes: "2.87 t/h of kiln gas cooled to below 100 C with the cold acid of T-301 (BREF 6.2.4); 204 kW to cooling water (D-007, D-009)."}
  - {tag: V-102, type: Tank, service: "Feed acid tank: scrubber acid, high boilers and oleum",
     notes: "The oleum's SO3 binds the loop's water to 3.0 wt% (BREF 6.2.1, reaction (9)); 191.5 kW of hydration heat warms the acid (D-007)."}
  - {tag: E-201, type: HeatExchanger, service: "HF condensers against brine",
     notes: "2.42 t/h of crude HF condensed at 268 K, 383.6 kW of refrigeration (D-007, D-009)."}
  - {tag: C-301, type: Column, service: "Low-boiler column (SO2, SiF4, CO2 off the crude HF)",
     notes: "Split column (L-2); reboiler and condenser 25.7 kW each, ASSUMED (D-009)."}
  - {tag: C-302, type: Column, service: "High-boiler column: anhydrous HF at the top, water and acid to the feed acid",
     notes: "2.30 t/h of AHF; reboiler 384.1 kW (0.6 GJ/t, BREF 6.2.4), reflux ratio 0.60 (D-009)."}
  - {tag: T-301, type: Column, service: "Final sulfuric acid scrubber with the fresh acid",
     notes: "Recovers 99 % of the HF of the condenser vent and the low boilers into 5.35 t/h of fresh acid (D-007)."}
  - {tag: T-401, type: Column, service: "SiF4 absorber with water (fluorosilicic acid)",
     notes: "276 kg/h of 25 wt% H2SiF6 with 14.4 kg/h of precipitated silica (D-008)."}
  - {tag: T-402, type: Column, service: "Alkaline tail-gas scrubber (caustic soda)",
     notes: "Removes 99.9 % of the 56.2 kg/h SO2 with 154.4 kg/h of 50 wt% caustic (D-008)."}
