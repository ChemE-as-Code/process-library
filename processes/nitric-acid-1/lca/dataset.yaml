        the site steam system it displaces (e.g. a natural-gas-fired boiler), per kWh of heat'
  source: 'D-014: the exported HP steam is the only co-product. All burdens are given to the acid; the
    steam leaves without a burden and without a credit (conservative for the acid).'
  deviation: 'The library hierarchy allocates exported steam by energy or exergy (docs/system-model.md).
    Neither applies here: the acid has no energy content, so energy allocation would put every burden
    on the steam, and no property package covers HNO3-water (D-012), so the acid''s exergy cannot be calculated;
    the steam is counted in kWh, so the WBCSD price ratio does not apply either. Shares 1/0 are the conservative
    choice for the acid until the exergy of both products is available (DESIGN.md D-014).'
