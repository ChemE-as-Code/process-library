# Cause and effect list: interlocks and trips. Schema: `cheme schema interlocks`.
# On a sheet, refer to an interlock ("see C&E I-01") instead of spelling out what it trips.
# PROPOSED, not approved for implementation (D-019). The trips the first P&IDs draw (P-01 to
# P-06). Trip setpoints are not set here: they need the design limits, the flammability data of
# the ammonia-air mixture at burner conditions and the HAZOP; delays, latching and reset are
# ASSUMED usual practice for a first issue. Sensor voting and the SIL are the HAZOP / LOPA's:
# sil stays empty until then. No trip acts on a control valve of control/loops.yaml: every
# effect is a trip valve (XV) or a machine stop, so the trips stay independent of the loops.
schema: cheme/interlocks/v1
interlocks:
  - id: I-101
    title: E-101 level high-high (liquid ammonia carry-over to the burner)
    cause: {tag: LZ-103, condition: LAHH}
    effects:
      - {tag: XV-101, action: close}
    sheet: P-01
    sil: null
    delay: {value: 2, unit: s}
    latching: true
    reset: manual   # from the control room once the level is back below the trip point
    notes: "D-019. Liquid NH3 entrained into the ammonia-air mixture would shift the ratio unseen and flash at the gauze. The burner trips I-201 to I-204 follow on the ratio if the level keeps rising."
  - id: I-201
    title: NH3/air ratio high-high at the mixer (flammable mixture)
    cause: {tag: FFZ-205, condition: FFAHH}
    logic:
      any:
        - {all: [{tag: FFZ-205, state: "NH3 flow above its cutoff"}, {tag: FFZ-205, state: FFAHH}]}
        - {all: [{tag: FFZ-205, state: "NH3 flow above its cutoff"}, {tag: FZ-206, state: "below its measuring range or bad quality"}]}
        - {tag: FFZ-205, state: "NH3 flow input below its measuring range or bad quality (at any flow)"}
    effects:
      - {tag: XV-203, action: close}
      - {tag: XV-204, action: close}
      - {tag: XV-101, action: close}
    sheet: P-02
    sil: null
    delay: {value: 0, unit: s}
    latching: true
    reset: manual   # after the cause is cleared and the burner start sequence permissives are met (SEQ-START-BURNER)
    notes: "D-019, D-023. The safety function of the ammonia-air mixture: the ratio from flow transmitters independent of the FFIC-201 loop (FFZ-205 on its own NH3 flow element, FZ-206 on its own air flow element). Low flows (D-023): the ratio is evaluated only with the NH3 flow above a cutoff of 2 % of the design NH3 flow S03 (ASSUMED, O-9); below it there is no ammonia to burn and FFZ-205 reads 0 (not tripped), so with XV-203/XV-204 closed and no air (SEQ-START-BURNER S1-S2) I-201 is defined and reset. Above the cutoff a low or failed air signal never makes the ratio look lean: air below the measuring range of FZ-206 or a bad-quality signal reads as ratio high-high (tripped). The cutoff is only taken from a healthy NH3 signal (D-024): an NH3 input of FFZ-205 below its measuring range or of bad quality (wire break, transmitter fault; NAMUR NE 43 levels, ASSUMED) trips I-201 at any flow, so a failed NH3 signal never reads as 'no ammonia'. A healthy transmitter with no flow reads inside its range (zero), so S1-S4 are not tripped by it. An NH3 signal failed low inside its range is not detected by the trip: the deviation alarm of FFZ-205 against FFIC-201 (control/loops.yaml), the gauze temperature high-high I-204 (a different measurement) and the analyser AI-210 cover it; voting is the HAZOP / LOPA's (O-9). The trip point lies below the lower flammability limit of NH3 in air at burner conditions with margin; the limit at 520 kPa(a) and 462 K is an open input (O-7), so no setpoint is stated."
  - id: I-202
    title: Primary air flow low-low (loss of air, ratio rising)
    cause: {tag: FZ-206, condition: FALL}
    logic:
      any:
        - {tag: FZ-206, state: FALL}
        - {tag: FZ-206, state: "below its measuring range or bad quality"}
    effects:
      - {tag: XV-203, action: close}
      - {tag: XV-204, action: close}
      - {tag: XV-101, action: close}
    sheet: P-02
    sil: null
    delay: {value: 1, unit: s}
    latching: true
    reset: manual
    bypass: "Start-up only, SEQ-START-BURNER only (not in SEQ-RESTART-BURNER, where the air flows from the start): bypassed automatically when the sequence starts (the air path opens only in its step S2); removed automatically once FZ-206 is above the trip point at the end of S2, 11 min after the sequence start (the S1 and S2 timeouts, ASSUMED) or when the sequence aborts, whichever comes first; never bypassed while XV-203 or XV-204 is open (D-022). The bypass masks the cause at the input of the I-202 latch only (D-024): while it is on, the latch cannot be set and can be reset although FZ-206 is still low-low, so the operator resets a latch left by an earlier trip (or by the dead air path before the start) in S1, and 'I-202 reset' there proves the latch is reset; a latch that is set is not hidden by the bypass. The bypass does not act on FZ-206 or its low-low state, which I-201 and I-401 keep using unbypassed. When the bypass is removed the trip acts on its cause only."
    notes: "D-019, D-022, D-023, D-024. Covers a K-101 trip or blow-off before the ratio trip sees it; FZ-206 above the trip point is the S2 -> S3 transition of SEQ-START-BURNER. Not a reset condition of SEQ-START-BURNER: it is reset under its bypass in S1 and enters the sequence abort once its bypass is removed; a start permissive of SEQ-RESTART-BURNER. FZ-206 failure (D-024): below its measuring range or bad quality reads low-low, the safe direction for I-202, I-401 (no forward flow, the timer runs) and I-201 (ratio high-high); a FZ-206 stuck high inside its range would defeat I-202 and the FZ-206 leg of I-401 together, so its deviation from FI-202 (own flow element on the same line) is alarmed (control/loops.yaml, FFIC-201) and the XV-610 leg of I-401 (ZSC-610) does not depend on it; voting is the HAZOP / LOPA's (O-9)."
  - id: I-203
    title: R-101 gauze temperature low-low (loss of ignition, unburnt NH3 downstream)
    cause: {tag: TZ-207, condition: TALL}
    effects:
      - {tag: XV-203, action: close}
      - {tag: XV-204, action: close}
      - {tag: XV-101, action: close}
    sheet: P-02
    sil: null
    delay: {value: 5, unit: s}
    latching: true
    reset: manual
    bypass: "Start-up and relight only: bypassed automatically when SEQ-START-BURNER or SEQ-RESTART-BURNER starts (the gauze is cold until the ignition step S4 / R2 lights it and the ammonia of step S5 / R3 brings it to temperature); removed automatically once TZ-207 is above the trip point at the end of S5 / R3, 5 min after that step opens XV-203/XV-204 (ASSUMED, burner vendor), or when the sequence aborts or ends, whichever comes first (D-024). Every step of both sequences has a timeout that aborts, so the bypass never outlasts the sequence (at most the sum of the step timeouts up to S5 / R3, 51 / 50 min); it is never applied outside these two sequences. Like I-202 (D-024), the bypass masks the cause at the input of the I-203 latch only: the latch cannot be set and can be reset on a cold gauze while it is on, so the operator resets a latch left by an earlier trip in S1 / R1; a latch that is set is not hidden. When the bypass is removed the trip acts on its cause only."
    notes: "D-019, D-023, D-024. Treated in both burner sequences like I-202 in SEQ-START-BURNER: not a reset condition of the sequence, in the abort once its bypass is removed. Unreacted ammonia downstream of an extinguished gauze forms ammonium nitrate and nitrite with NOx in the cold end (E-105, V-101, K-102), a known hazard of nitric acid plants (skill tech-heavy-chem-nitric-acid-and-fertilizers)."
  - id: I-204
    title: R-101 gauze temperature high-high (excess ammonia or gauze damage)
    cause: {tag: TZ-207, condition: TAHH}
    effects:
      - {tag: XV-203, action: close}
      - {tag: XV-204, action: close}
      - {tag: XV-101, action: close}
    sheet: P-02
    sil: null
    delay: {value: 2, unit: s}
    latching: true
    reset: manual
    notes: "D-019. A rising gauze temperature at constant air means a rising NH3 fraction; it backs up I-201 with a different measurement."
  - id: I-301
    title: V-101 level low-low (pump dry running, gas into the absorber feed)
    cause: {tag: LZ-306, condition: LALL}
    effects:
      - {tag: P-101A, action: stop}
      - {tag: P-101B, action: stop}
    sheet: P-03
    sil: null
    delay: {value: 3, unit: s}
    latching: true
    reset: manual   # the operator restarts the pump once the level is back; no automatic restart
    notes: "D-019; latching with manual reset like every other trip (D-021)."
  - id: I-401
    title: K-102 on full hot recycle too long (train running with no forward flow)
    cause: {tag: K-102, condition: "accumulated time on full hot recycle through UV-401 above its limit (train running with XV-610 closed or FZ-206 below its low-low trip point)"}
    logic:
      all:
        - {tag: K-101, state: running}
        - {any: [{tag: ZSC-610, state: "XV-610 closed"}, {tag: FZ-206, state: "below the low-low trip point, below its measuring range or bad quality"}]}
    effects:
      - {tag: K-101, action: trip}
    sheet: P-06
    sil: null
    delay: {value: 15, unit: min}   # ASSUMED, train vendor's (O-9); a retentive timer, not an on-delay (notes, D-024)
    latching: true
    reset: manual
    notes: "D-023, D-024. The hot anti-surge recycle UV-401 (taken before E-106, D-018) is for short duty: with no forward flow K-102 circulates its own heated gas. The only forward path is through PV-611 and X-101 (no expander bypass, D-021), so the train has no forward flow while XV-610 is closed, and none after it opens until the gas passes PV-611, which FZ-206 above its trip point proves (end of SEQ-START-BURNER S2). Timer (D-024): retentive, it accumulates the time the logic holds and trips at 15 min. A short return of forward flow (the LP fill in S2, FZ-206 flickering about its trip point) only pauses it; it is reset to zero only when forward flow (XV-610 open and FZ-206 above its low-low point) has held without a break for 10 min (ASSUMED: K-102 back at its forward-flow temperature, train vendor's, O-9) or when the train has stayed stopped for 60 min (ASSUMED: K-102 cooled down, the train vendor's restart rules, O-9; D-025). A train stop alone does not reset it: a shorter stop keeps the accumulated time, so a train restarted hot carries it on and this trip stops it when it reaches 15 min. The limit is therefore the time on full recycle since K-102 last ran at its forward-flow temperature or cooled down stopped: at a train start against a closed XV-610 after forward-flow operation or a cool-down it is the time since train start; after a loss of forward flow in operation (F-AIR closes XV-610, PV-611 or the expander path blocked) it is the time since that loss, a stop and restart included. A burner relight with the train on forward flow keeps XV-610 open (SEQ-RESTART-BURNER) and so never restarts the timer; a train that has lost forward flow restarts the burner only after a train stop and a new train start (SEQ-START-BURNER permissives: the I-401 permissive, accumulated time below 4 min, blocks the burner start of a train restarted hot, D-025). It does not block the train start itself (D-026): a train restarted within the 60 min carries its time, cannot clear the permissive while it runs (the time only grows against the closed XV-610, and the forward flow that would reset it needs S2 of the blocked sequence) and ends in this trip after the rest of its 15 min. The operator therefore keeps a train that has run on full recycle stopped for the cool-down before a new train start; a train-start inhibit of a hot train is the train vendor's (O-9). This trip stops it if the operator does not. The effect is a train trip: the train trip logic US-612 stops the train and I-602 follows with its effects (XV-610, ammonia trip valves, SCR ammonia). Inputs, both into US-612 (P-06): the closed-position switch ZSC-610 of XV-610 (P-06) and FZ-206 (P-02, signal to US-612 given by the sheet notes; shared with I-201 and I-202: sensor independence for the HAZOP / LOPA, O-9). Either input alone sees a closed XV-610; FZ-206 alone sees the S2 window (XV-610 open, PV-611 not yet passing). A failed FZ-206 (bad quality, below range) reads no forward flow, the safe direction; a broken ZSC-610 wire reads not closed, covered by the FZ-206 leg. The TI-402 high alarm (control/loops.yaml, UIC-401) warns the operator before the trip."
  - id: I-501
    title: C-101 sump level low-low (gas blow-by from 1130 to 500 kPa(a) into C-102)
    cause: {tag: LZ-507, condition: LALL}
    effects:
      - {tag: XV-507, action: close}
    sheet: P-05
    sil: null
    delay: {value: 2, unit: s}
    latching: true
    reset: manual
    notes: "D-019. Blow-by would overpressure C-102 (6 barg design) and load PSV-316 (P-03) through the bleacher gas line and the K-102 suction; the blow-by load is for the relief study (D-021)."
  - id: I-601
    title: R-102 inlet temperature low-low (SCR ammonia below its operating window)
    cause: {tag: TZ-605, condition: TALL}
    effects:
      - {tag: XV-602, action: close}
    sheet: P-06
    sil: null
    delay: {value: 10, unit: s}
    latching: true
    reset: manual   # once TZ-605 is back above the trip point
    notes: "D-019. Below the catalyst window NH3 slips and ammonium nitrate deposits downstream (X-101, stack); the window comes with the catalyst (open input O-4)."
  - id: I-602
    title: Machine train trip (K-101, K-102, X-101 and motor)
    cause: {tag: K-101, condition: "train trip (package machine protection, I-401 or I-603)"}
    effects:
      - {tag: XV-610, action: close}
      - {tag: XV-203, action: close}
      - {tag: XV-204, action: close}
      - {tag: XV-101, action: close}
      - {tag: XV-602, action: close}
    sheet: P-06
    sil: null
    latching: true
    reset: manual
    notes: "D-018, D-019. The machine protection (overspeed, vibration, axial position, lube oil, seals) is the train package's; it reaches the plant as one trip signal to US-612 (P-06) and US-209 (P-02). The K-102 full-recycle time trip I-401 stops the train through US-612 and so also ends in I-602 (D-023, D-024): a second, plant-side cause of the one train trip; the XV-610 uncommanded-closure trip I-603 is the third (D-025). XV-610 isolates the expander so it cannot overspeed on the expanding tail gas; the absorber then stays pressurised and settles out. While I-602 is latched the XV-610 solenoid stays de-energised, so XV-610 stays closed when instrument air returns and opens again only by the operator in SEQ-START-BURNER S2 after a new train start."
  - id: I-603
    title: XV-610 closed without a close command (loss of instrument air, solenoid or valve fault)
    cause: {tag: ZSC-610, condition: "XV-610 closed while the train logic US-612 commands it open, train running"}
    logic:
      all:
        - {tag: K-101, state: running}
        - {tag: US-612, state: "commands XV-610 open"}
        - any:
            - {tag: ZSC-610, state: "XV-610 closed again after it has left its closed seat since the open command"}
            - {tag: ZSC-610, state: "XV-610 not left its closed seat since the open command", delay: {value: 30, unit: s}}   # ASSUMED: longer than the XV-610 opening stroke takes to leave the seat, valve vendor's (O-9)
    effects:
      - {tag: K-101, action: trip}
    sheet: P-06
    sil: null
    delay: {value: 0, unit: s}   # once XV-610 has left its seat, a return to closed trips at once (D-026); the 30 s is only for the opening stroke (logic)
    latching: true
    reset: manual
    notes: "D-025, D-026. On loss of instrument air (F-AIR) XV-610 fails closed while its solenoid stays energised, so without this trip it would reopen by itself when the air returns, with PIC-611 possibly wound up and PV-611 open, against the S2 rule that XV-610 opens only with PIC-611 in control. Two branches (D-026): once ZSC-610 has shown XV-610 off its closed seat after the open command, XV-610 back on its seat trips at once, with no delay, so an air dip or a solenoid drop-out of any length that closes XV-610 trips the train before the valve can reopen; the 30 s delay applies only to the opening stroke in SEQ-START-BURNER S2 (XV-610 not off its seat 30 s after the open command: a valve that fails to open); an air dip inside that window only delays the opening the operator has commanded with PIC-611 in auto (S1 complete). An air dip too short to close XV-610 onto its seat is not seen by ZSC-610 (a closed-position switch only); XV-610 then only moves part of its stroke while PV-611 swings open, for the HAZOP (O-9). I-603 enforces the stop and restart that F-AIR and D-024 item 2 prescribe: it trips the train through US-612, I-602 follows and holds XV-610 closed (solenoid de-energised) until it is reset, and the restart is a new train start and SEQ-START-BURNER. It also ends the full hot recycle of K-102 at once instead of after the I-401 limit. Input: ZSC-610 into US-612 (P-06), shared with I-401 (sensor independence for the HAZOP / LOPA, O-9); a broken ZSC-610 wire reads not closed and defeats this trip, and I-401 (its FZ-206 leg) remains behind it."
