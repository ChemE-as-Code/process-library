# Instrument list. Schema: `cheme schema instruments`.
# Tags as printed on the P&IDs (D-017); numbers n01 and up on sheet P-0n. Loops, setpoints and
# alarms are in control/loops.yaml, trips in control/cause-effect.yaml (D-019). The notes give
# the fail position of every actuated valve the function drives, as drawn on the P&IDs
# (FailAction of the actuator, F.C./F.O. label); the reasons are D-019.
schema: cheme/instruments/v1
instruments:
  # ---- P-01 ammonia and air supply
  - {tag: LIC-102, sheet: P-01, service: "E-101 shell level, liquid ammonia feed LV-102 (NL-101)", notes: "LV-102 fails closed (F.C.)"}
  - {tag: LZ-103, sheet: P-01, service: "E-101 shell level high-high (liquid carry-over to the burner), closes XV-101 (C&E I-101)", notes: "XV-101 fails closed (F.C.); separate tapping from LIC-102"}
  - {tag: PIC-104, sheet: P-01, service: "E-101 evaporating pressure (NV-102), chilled-water valve PV-104 (CHR-112, the warm return from the C-101 coils)", notes: "PV-104 fails closed (F.C.): no heat input, the evaporator pressure falls"}
  - {tag: TI-106, sheet: P-01, service: "NH3 vapour to the burner (NV-102)"}
  - {tag: FIC-107, sheet: P-01, service: "K-101 air flow (PA-104), inlet guide vanes FV-107; sets the plant load", notes: "FV-107 fails open (F.O.): full air, the NH3/air ratio falls (D-019)"}
  - {tag: UIC-110, sheet: P-01, service: "K-101 anti-surge control, blow-off valve UV-110 (PA-107)", notes: "UV-110 fails open (F.O.); surge line and inputs (suction flow, discharge pressure) in the train package (D-018)"}
  - {tag: TI-112, sheet: P-01, service: "K-101 discharge temperature (PA-105)"}
  - {tag: PI-113, sheet: P-01, service: "K-101 discharge pressure, local (PA-105)"}
  # ---- P-02 burner and steam raising
  - {tag: FFIC-201, sheet: P-02, service: "NH3/air ratio at the mixer: NH3 vapour flow (NV-102) ratioed to the primary air FI-202, valve FV-201", notes: "FV-201 fails closed (F.C.)"}
  - {tag: FI-202, sheet: P-02, service: "Primary air flow to M-101 (PA-105), the wild flow of FFIC-201"}
  - {tag: FFZ-205, sheet: P-02, service: "NH3/air ratio high-high from the NH3 flow (NV-102) and the independent air flow FZ-206, burner trip through US-209 (C&E I-201)", notes: "Ratio evaluated only above an NH3 flow cutoff (2 % of the design flow, ASSUMED); above it a low or bad air signal reads high-high (D-023); a NH3 input below its range or of bad quality trips at any flow; deviation alarm against FFIC-201 in control/loops.yaml (D-024)"}
  - {tag: FZ-206, sheet: P-02, service: "Primary air flow low-low (PA-105), independent of FI-202, burner trip through US-209 (C&E I-202); also the air input of FFZ-205 and of the K-102 full-recycle time trip in US-612 on P-06 (C&E I-401; the signal to P-06 is given by the sheet notes)", notes: "Below its range or bad quality reads low-low for I-202 and I-401 and ratio high-high for I-201; deviation alarm against FI-202 in control/loops.yaml (D-024)"}
  - {tag: TZ-207, sheet: P-02, service: "R-101 gauze temperature low-low (loss of ignition, NH3 slip) and high-high, closes XV-204 (C&E I-203, I-204)", notes: "XV-204 fails closed (F.C.)"}
  - {tag: TI-208, sheet: P-02, service: "R-101 gauze temperatures (multipoint), indication"}
  - {tag: US-209, sheet: P-02, service: "Burner trip logic: closes the NH3 trip valve XV-203 (C&E I-201 to I-204, I-602)", notes: "XV-203 fails closed (F.C.)"}
  - {tag: AI-210, sheet: P-02, service: "NH3 in the ammonia-air mixture (AM-201), indication and high alarm; not part of a trip (D-019)"}
  - {tag: PI-211, sheet: P-02, service: "Burner inlet pressure, local (AM-201)"}
  - {tag: TI-212, sheet: P-02, service: "E-102 process gas outlet (NX-203)"}
  - {tag: PI-213, sheet: P-02, service: "HP steam pressure, local (HS-204)"}
  - {tag: TI-214, sheet: P-02, service: "HP steam temperature (HS-204)"}
  # ---- P-03 heat recovery, condenser
  - {tag: TIC-301, sheet: P-03, service: "R-102 inlet temperature (TG-310), E-103 tail-gas bypass TV-301 (TG-311)", notes: "TV-301 fails closed (F.C.): all tail gas through E-103, R-102 at its hottest design inlet (D-019)"}
  - {tag: TI-302, sheet: P-03, service: "E-103 process gas outlet (NX-301)"}
  - {tag: TI-303, sheet: P-03, service: "E-104 process gas outlet (NX-302)"}
  - {tag: TI-304, sheet: P-03, service: "E-105 outlet / V-101 inlet (NX-303)"}
  - {tag: LIC-305, sheet: P-03, service: "V-101 level, weak acid valve LV-305 (WA-306)", notes: "LV-305 fails closed (F.C.)"}
  - {tag: LZ-306, sheet: P-03, service: "V-101 level low-low, stops P-101A/B (C&E I-301)"}
  - {tag: PI-307, sheet: P-03, service: "P-101A/B discharge pressure, local (WA-306)"}
  # ---- P-04 NOx gas compression
  - {tag: UIC-401, sheet: P-04, service: "K-102 anti-surge control, recycle valve UV-401 (NX-404)", notes: "UV-401 fails open (F.O.); surge line and inputs in the train package (D-018)"}
  - {tag: TI-402, sheet: P-04, service: "K-102 discharge temperature (NX-401), indication and high alarm TAH (warns of a long hot recycle before the trip I-401; not part of a trip; alarm and response in control/loops.yaml, UIC-401)", notes: "Alarm setting the train vendor's, not stated yet (O-9, D-023, D-024)"}
  - {tag: PI-403, sheet: P-04, service: "Nitrous gas to the absorber, local (NX-403)"}
  - {tag: TI-405, sheet: P-04, service: "E-106 NOx gas outlet (NX-402)"}
  - {tag: TI-406, sheet: P-04, service: "E-107 outlet, nitrous gas to C-101 (NX-403)"}
  - {tag: TI-407, sheet: P-04, service: "E-106 tail gas outlet (TG-402)"}
  # ---- P-05 absorption and bleaching
  - {tag: PI-503, sheet: P-05, service: "C-101 top pressure (absorber pressure, held by PIC-611 on P-06)"}
  - {tag: FIC-505, sheet: P-05, service: "Process water to C-101 (PW-505), FV-505; sets the acid strength", notes: "FV-505 fails open (F.O.): absorption kept, the acid gets weaker (D-019)"}
  - {tag: LIC-506, sheet: P-05, service: "C-101 sump level, raw acid valve LV-506 (AC-502)", notes: "LV-506 fails closed (F.C.): no gas blow-by into C-102"}
  - {tag: LZ-507, sheet: P-05, service: "C-101 sump level low-low, closes XV-507 against gas blow-by into C-102 (C&E I-501)", notes: "XV-507 fails closed (F.C.); separate tapping from LIC-506"}
  - {tag: TI-508, sheet: P-05, service: "C-101 tray temperature (cooling-coil section)"}
  - {tag: FIC-509, sheet: P-05, service: "Secondary air to C-102 (PA-106), FV-509; holds the tail-gas O2 (AI-512)", notes: "FV-509 fails open (F.O.): bleaching and the absorber O2 kept (D-019)"}
  - {tag: LIC-510, sheet: P-05, service: "C-102 sump level, product acid valve LV-510 (AC-504)", notes: "LV-510 fails closed (F.C.)"}
  - {tag: AI-511, sheet: P-05, service: "NOx in the absorber tail gas (TG-501), indication and high alarm"}
  - {tag: AI-512, sheet: P-05, service: "O2 in the absorber tail gas (TG-501), indication; the operator sets FIC-509 from it (D-019)"}
  - {tag: TI-513, sheet: P-05, service: "Absorber tail gas temperature (TG-501)"}
  - {tag: AI-514, sheet: P-05, service: "Product acid strength (density), AC-504; the operator sets FIC-505 from it (D-019)"}
  - {tag: FI-515, sheet: P-05, service: "Product acid flow to storage (AC-504)"}
  # ---- P-06 tail gas and expander
  - {tag: FIC-603, sheet: P-06, service: "SCR ammonia flow (NV-601), FV-603; set from the NOx (AI-614) by the operator", notes: "FV-603 fails closed (F.C.): no NH3 slip"}
  - {tag: TIC-604, sheet: P-06, service: "E-108 ammonia vapour temperature (NV-601), LP steam valve TV-604 (LS-604)", notes: "TV-604 fails closed (F.C.)"}
  - {tag: TZ-605, sheet: P-06, service: "R-102 inlet temperature low-low (TG-310), closes the SCR ammonia XV-602 (C&E I-601)", notes: "XV-602 fails closed (F.C.); independent of TIC-301 (P-03)"}
  - {tag: TI-608, sheet: P-06, service: "R-102 catalyst bed / outlet temperature"}
  - {tag: PIC-611, sheet: P-06, service: "Absorber pressure held at the X-101 inlet (TG-606), PV-611", notes: "PV-611 fails open (F.O.): no overpressure of the HP system against PSV-404 (D-019)"}
  - {tag: ZSC-610, sheet: P-06, service: "XV-610 closed position switch, input of the K-102 full-recycle time trip in US-612 (C&E I-401)", notes: "A broken wire reads not closed; the FZ-206 leg of I-401 still sees a closed XV-610 (D-024)"}
  - {tag: US-612, sheet: P-06, service: "Machine train trip logic: closes the X-101 inlet trip valve XV-610 (C&E I-602); trips the train on the K-102 full-recycle time (C&E I-401, retentive timer, inputs ZSC-610 and FZ-206 from P-02); train-start time for SEQ-START-BURNER", notes: "XV-610 fails closed (F.C.)"}
  - {tag: TI-613, sheet: P-06, service: "X-101 outlet / stack temperature (TG-607)"}
  - {tag: AI-614, sheet: P-06, service: "NOx in the stack gas (TG-607), emission monitoring"}
  - {tag: AI-615, sheet: P-06, service: "N2O in the stack gas (TG-607), emission monitoring"}
