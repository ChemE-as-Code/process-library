# Simulation specs. Schema: `cheme schema process-simulation`.
# Not a simulation model yet: no property package of cheme or DWSIM is qualified for nitrous gas
# with water and aqueous nitric acid, and the absorber needs a reactive-absorption model
# (DESIGN.md D-012). This file only declares the two adiabatic reactors, so that the
# boundary check knows they exchange no heat with a utility.
schema: cheme/simulation/v1
kind: simulation
specs:
  R101: {mode: adiabatic}   # D-005: adiabatic gauze; its heat leaves with the burner gas to E-102
  R102: {mode: adiabatic}   # D-009: adiabatic tertiary reactor
