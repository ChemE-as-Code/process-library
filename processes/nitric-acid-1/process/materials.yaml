# Components and templates of the process. Schema cheme/process/v1 (`cheme schema
# process-materials`). Every component has a stable id; molar_mass in kg/kmol,
# normal_boiling_point in K at 101.325 kPa.
# Identities: CAS numbers; molar masses summed from the IUPAC conventional atomic weights (H
# 1.008, N 14.007, O 15.999, Ar 39.948), so that reactions balance in mass exactly; normal boiling
# points rounded from the NIST Chemistry WebBook (NO2: the N2O4/NO2 equilibrium liquid boils at
# about 294 K; HNO3 pure acid about 356 K). "NO" is always quoted in the YAML files (unquoted it reads as false). N2O4 is not a separate component: it is lumped into
# NO2 (DESIGN.md D-006).
schema: cheme/process/v1
kind: materials
components:
  - {id: NH3, name: Ammonia, formula: NH3, cas: 7664-41-7, molar_mass: 17.031, normal_boiling_point: 239.82}
  - {id: O2, name: Oxygen, formula: O2, cas: 7782-44-7, molar_mass: 31.998, normal_boiling_point: 90.19}
  - {id: N2, name: Nitrogen, formula: N2, cas: 7727-37-9, molar_mass: 28.014, normal_boiling_point: 77.36}
  - {id: AR, name: Argon, formula: Ar, cas: 7440-37-1, molar_mass: 39.948, normal_boiling_point: 87.30}
  - {id: H2O, name: Water, formula: H2O, cas: 7732-18-5, molar_mass: 18.015, normal_boiling_point: 373.12}
  - {id: "NO", name: Nitric oxide, formula: "NO", cas: 10102-43-9, molar_mass: 30.006, normal_boiling_point: 121.4}
  - {id: NO2, name: Nitrogen dioxide (incl. N2O4 as NO2), formula: NO2, cas: 10102-44-0, molar_mass: 46.005, normal_boiling_point: 294.3}
  - {id: N2O, name: Nitrous oxide, formula: N2O, cas: 10024-97-2, molar_mass: 44.013, normal_boiling_point: 184.67}
  - {id: HNO3, name: Nitric acid, formula: HNO3, cas: 7697-37-2, molar_mass: 63.012, normal_boiling_point: 356.15}
templates:
  - {id: ammonia, title: Ammonia, components: [NH3]}
  - {id: air, title: Humid air, components: [N2, O2, AR, H2O]}
  - {id: water, title: Process water, components: [H2O]}
  - {id: nitrous_gas, title: "Ammonia-air mixture, nitrous gas and tail gas", components: [NH3, N2, O2, AR, H2O, "NO", NO2, N2O, HNO3]}
  - {id: acid, title: Aqueous nitric acid (with dissolved NOx as NO2), components: [HNO3, H2O, NO2]}
# property_method is a placeholder: no benchmarked package of cheme covers this process
# (nitrous gas with water, aqueous nitric acid; DESIGN.md D-012).
property_method:
  adapter: thermo
  status: placeholder
