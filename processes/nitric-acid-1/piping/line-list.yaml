# Line list. Schema: `cheme schema lines`.
# First P&IDs (D-017): every line drawn on P-01 to P-06, each with the sheet it starts on; a
# line on two sheets is listed once and its notes say where it continues. A PFD stream's line
# names the stream id in the notes.
# Numbers: <fluid code>-<n><nn>, n the sheet it starts on. Fluid codes: NL liquid ammonia,
# NV ammonia vapour, PA air, AM ammonia-air mixture, NX nitrous gas, WA weak acid, AC nitric
# acid, BG bleacher gas, TG tail gas, PW process water, BW boiler feed water, HS HP steam,
# LS LP steam, CD condensate, CWS/CWR cooling water, CHS/CHR chilled water, RL relief, DR drain.
# DN: first-pass size from velocity (scripts/line_sizing.py, D-017, ASSUMED): gas 20 m/s below
# 1000 kPa(a) and 15 m/s above (ideal-gas density of the design case), the burner gas 30 m/s,
# liquids 1.5 m/s (1.0 m/s on letdown and gravity legs) at round ASSUMED densities, inside
# diameter taken as the DN. Utilities: cooling water 2.5 m/s, chilled water 2 m/s at an
# ASSUMED 8 K range, steam 30 m/s. Relief, blow-off and vent lines are placeholders until the
# relief study sizes them. Pressure classes and materials come with the pipe specs.
schema: cheme/lines/v1
lines:
