# Equipment list. Schema: `cheme schema equipment`.
# Concept stage: the items the PFD (process/flowsheet.yaml) needs; since the first P&IDs (D-017)
# each item names its sheet, and the weak-acid pump is spared (P-101A/B, D-018).
# Design pressure and temperature are ASSUMED concept values (D-013): the highest operating
# value of the balance (scripts/hno3_balance.py) + 10 % (at least + 2 bar) and + 25 K.
# Materials are first indications for nitric-acid service (austenitic stainless below the
# 68 % azeotrope, D-013), to be confirmed by a materials engineer; sizes, dimensions and
# weights come at basic engineering (datasheets).
schema: cheme/equipment/v1
equipment:
  # ---- ammonia evaporation and air compression (block PREP)
  - {tag: E-101, type: TubularHeatExchanger, service: Ammonia evaporator, sheet: P-01,
     design_pressure_barg: 17, design_temperature_degc: 50, material: "CS (low-temperature carbon steel, ammonia service)",
     notes: "Kettle type (D-017): liquid NH3 on the shell side, chilled water from the C-101 coils in the tubes. Evaporates 11.85 t/h NH3 at 600 kPa(a) (saturation ~282 K), ~4.0 MW from the absorber chilled-water loop (D-011, ASSUMED)."}
  - {tag: E-108, type: TubularHeatExchanger, service: SCR ammonia vaporiser, sheet: P-06,
     design_pressure_barg: 17, design_temperature_degc: 75, material: CS,
     notes: "46 kg/h NH3 to 1300 kPa(a), 323 K on LP steam, ~16 kW (D-009, ASSUMED). Drawn on P-06 with the SCR dosing it feeds (D-017)."}
  - {tag: K-101, type: CentrifugalCompressor, service: Air compressor (process and secondary air), sheet: P-01,
     design_pressure_barg: 6.5, design_temperature_degc: 240, material: CS,
     notes: "101 -> 520 kPa(a), 213.3 t/h humid air; ~12.1 MW shaft at isentropic efficiency 0.85, no intercooling (D-011, ASSUMED). One train with K-102, X-101 and an electric motor (D-011); inlet guide vanes FV-107 and anti-surge blow-off UV-110 (D-018). The air intake filter is upstream of the P-01 battery limit (open input O-6)."}
  - {tag: M-101, type: StaticMixer, service: Ammonia-air mixer, sheet: P-02,
     design_pressure_barg: 6.5, design_temperature_degc: 240, material: "SS 304L",
     notes: "10.0 mol% NH3 in air, 463 K (D-005). The mixture's flammability limits make this a controlled ratio (FFIC-201) with an independent ratio trip (FFZ-205, C&E I-201), D-019."}
  # ---- ammonia oxidation and heat recovery (block OX)
  - {tag: R-101, type: Vessel, service: "Ammonia burner (Pt/Rh gauze pack)", sheet: P-02,
     design_pressure_barg: 6, design_temperature_degc: 900, material: "heat-resistant alloy, open input",
     notes: "Adiabatic gauze, outlet 1144 K at 490 kPa(a) (D-005). Gauze area, number of sheets and Pt loss not sized (no vendor data). In practice integrated with E-102 in one vessel."}
  - {tag: E-102, type: TubularHeatExchanger, service: Waste-heat boiler and superheater, sheet: P-02,
     design_pressure_barg: 44, design_temperature_degc: 900, material: "process side heat-resistant alloy; steam side per boiler code, open input",
     notes: "Burner gas 1144 -> 793 K, ~23.6 MW to HP steam 4000 kPa(a) / 673 K (D-011). Design pressure is the steam side; process side 6 barg. Steam drum, circulation and BFW level control in the boiler package (D-020)."}
  - {tag: E-103, type: TubularHeatExchanger, service: Tail-gas heater, sheet: P-03,
     design_pressure_barg: 12, design_temperature_degc: 545, material: "SS 321/347 (hot nitrous gas), open input",
     notes: "Process gas 793 -> 551 K, tail gas 398 -> 703 K, ~15.2 MW (D-010). Tail-gas bypass TV-301 for the R-102 inlet temperature (D-019)."}
  - {tag: E-104, type: TubularHeatExchanger, service: Economiser (boiler feed water preheat), sheet: P-03,
     design_pressure_barg: 44, design_temperature_degc: 305, material: "SS 304L process side",
     notes: "Process gas 551 -> 453 K, ~5.9 MW to boiler feed water (D-010). Design pressure is the BFW side."}
  - {tag: E-105, type: TubularHeatExchanger, service: Cooler-condenser, sheet: P-03,
     design_pressure_barg: 6, design_temperature_degc: 205, material: "SS 304L (acid condensate)",
     notes: "Process gas 453 -> 313 K, ~32.7 MW to cooling water; condenses 29.7 t/h weak acid (42 wt%, D-007)."}
  - {tag: V-101, type: Vessel, service: Weak-acid separator, sheet: P-03,
     design_pressure_barg: 6, design_temperature_degc: 65, material: "SS 304L"}
  # ---- NOx compression, absorption and bleaching (block ABS)
  - {tag: P-101A, type: CentrifugalPump, service: Weak-acid pump, sheet: P-03,
     design_pressure_barg: 12.5, design_temperature_degc: 65, material: "SS 304L",
     notes: "29.7 t/h, 465 -> 1130 kPa(a), ~7 kW hydraulic/0.65 (D-011, ASSUMED). Duty pump of the PFD step P101; P-101B is the installed spare (D-018)."}
  - {tag: P-101B, type: CentrifugalPump, service: Weak-acid pump (spare), sheet: P-03,
     design_pressure_barg: 12.5, design_temperature_degc: 65, material: "SS 304L",
     notes: "Installed spare of P-101A, same duty (D-018, ASSUMED)."}
  - {tag: K-102, type: CentrifugalCompressor, service: NOx compressor, sheet: P-04,
     design_pressure_barg: 13, design_temperature_degc: 180, material: "SS (wet nitrous gas)",
     notes: "460 -> 1150 kPa(a), 195.8 t/h; ~6.4 MW shaft at isentropic efficiency 0.80 (D-011, ASSUMED); driven by X-101 (2.2 MW) and the train motor (4.2 MW). Anti-surge recycle UV-401 (D-018)."}
  - {tag: E-106, type: TubularHeatExchanger, service: NOx gas / tail gas exchanger, sheet: P-04,
     design_pressure_barg: 13, design_temperature_degc: 180, material: "SS 304L",
     notes: "NOx gas 428 -> 345 K, tail gas 303 -> 398 K, ~4.6 MW (D-010)."}
  - {tag: E-107, type: TubularHeatExchanger, service: NOx gas cooler, sheet: P-04,
     design_pressure_barg: 13, design_temperature_degc: 100, material: "SS 304L",
     notes: "345 -> 313 K, ~1.8 MW to cooling water (D-010)."}
  - {tag: C-101, type: ProcessColumn, service: Absorption column (sieve trays with cooling coils), sheet: P-05,
     design_pressure_barg: 12.5, design_temperature_degc: 65, material: "SS 304L",
     notes: "Specification model (D-008): 60 wt% raw acid, tail gas 500 ppmv NOx; ~14.6 MW absorption heat to cooling water and the chilled-water loop. Trays, height and residence time not sized: no reactive-absorption model. Coil connections as drawn on P-05 (CW lower, chilled water upper trays) are ASSUMED (D-020)."}
  - {tag: C-102, type: ProcessColumn, service: Bleacher (secondary-air stripping), sheet: P-05,
     design_pressure_barg: 6, design_temperature_degc: 240, material: "SS 304L",
     notes: "Strips 0.5 wt% dissolved NOx (as NO2) with 32.7 t/h secondary air (D-008); ~1.6 MW acid cooling (its exchanger is not drawn yet, D-020)."}
  # ---- tail-gas treatment and power recovery (block TGT)
  - {tag: R-102, type: Vessel, service: Tertiary N2O decomposition and SCR reactor, sheet: P-06,
     design_pressure_barg: 12, design_temperature_degc: 465, material: "SS 321",
     notes: "Adiabatic, 703 -> 711 K (D-009). Catalyst type and volume not chosen (no vendor data)."}
  - {tag: X-101, type: Turbine, service: Tail-gas expander, sheet: P-06,
     design_pressure_barg: 12, design_temperature_degc: 465, material: "alloy, open input",
     notes: "1040 -> 105 kPa(a), 711 -> 426 K; ~14.3 MW at isentropic efficiency 0.85 (D-011, ASSUMED); on the K-101/K-102 shaft. Inlet trip valve XV-610 and absorber pressure valve PV-611 (D-018, D-019)."}
