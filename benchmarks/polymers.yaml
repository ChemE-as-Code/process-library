# Benchmarks of polymers: for now PET. Schema: schemas/benchmarks.schema.json; rules:
# docs/benchmarks.md. Ranges are facts from the cited source, in our own form.
#
# How independent these are:
# - The diacid feed is stoichiometry plus the BREF's polymer waste, so it would sit near the range
#   whatever the plants reported. Its 0.873 t/t is above the range: see out_of_range_reason.
# - The glycol feed adds the BREF's effluent COD and air emissions to the stoichiometry, so it shares
#   a source with its range. It is inside, as is NAPCOR's 0.345 t/t.
# A total energy KPI is not bound: the natural gas is in kg, and an expression cannot add kg to kWh
# (docs/benchmarks.md). By hand, the dataset's 230 kWh/t of electricity (828 MJ) and 42.0 kg/t of
# natural gas at an LHV of 50.01 MJ/kg (2100 MJ) give about 2930 MJ/t for melt phase and SSP together.
# The POL BREF gives 2087 to 4500 MJ/t for the continuous TPA melt phase (Table 10.4) and 903 to
# 949 MJ/t for continuous SSP (Table 10.5). The dataset sits inside the melt-phase range alone, and
# slightly below the sum of the two lowest values (about 2990 MJ/t). The BREF does not say how it adds
# fuel and power. NAPCOR's plants include MTR, which has no separate SSP step. The BREF's footnoted
# single value for the TPA process making high-viscosity PET for food packaging, the grade closest to
# this bottle resin, is 18500 MJ/t, about six times the dataset; the BREF gives no reason for it.
schema: cheme-as-code/benchmarks/v1
family: polymers

kpis:
  pet-specific-diacid:
    title: Terephthalic (and isophthalic) acid per t of PET
    unit: t/t
    references:
      - id: bref-pol-pet-tpa-diacid
        range: [0.825, 0.87]
        basis: unallocated
        note: The source labels the row DMT/TPA and does not say whether comonomer acids are counted. Its lower end is below the 0.8645 t/t that the homopolymer's stoichiometry needs, which suggests comonomers or a different product mix; that reading is ours.
        conditions: {technology: "continuous polycondensation based on TPA (fibre and other grades); the food-packaging grade has its own energy figure only", region: EU}
        source: &bref-pol
          citation: "European Commission JRC (2007) Reference Document on Best Available Techniques in the Production of Polymers (POL BREF), August 2007"
          url: https://eippcb.jrc.ec.europa.eu/sites/default/files/2019-11/pol_bref_0807.pdf
          locator: Table 10.4, p. 170
          kind: bref
          accessed: "2026-11-05"
  pet-specific-ethylene-glycol:
    title: Ethylene glycol per t of PET
    unit: t/t
    references:
      - id: bref-pol-pet-tpa-eg
        range: [0.32, 0.355]
        basis: unallocated
        conditions: {technology: continuous polycondensation based on TPA, region: EU}
        source: *bref-pol
  pet-specific-electricity:
    title: Electricity per t of PET
    unit: kWh/t
    no_open_reference: >-
      No open source with a PET electricity range independent of the dataset found (2026-11-05). Read:
      POL BREF chapter 10 (total energy only, no split into power and heat), the ACC/Franklin 2011
      nine-resins report (PET only aggregated with PTA, no gate-to-gate table), the NAPCOR 2020 report
      (the dataset's own source, 230 kWh/t), the DOE plastics and rubber bandwidth study 2017
      (converting, not resin making). The dataset's value is NAPCOR's.

datasets:
  - process: pet-1
    dataset: pet-pta-continuous-ssp
    conditions: {technology: "continuous PTA esterification and melt polycondensation with SSP; homopolymer repeat unit with 2.6 % isophthalic acid of the diacids", basis: conceptual inventory}
    kpis:
      pet-specific-diacid:
        expression: (feed:terephthalic-acid + feed:isophthalic-acid) / product:pet
        per: product:pet
        reference: bref-pol-pet-tpa-diacid
        out_of_range_reason: "The diacids are the homopolymer stoichiometry (0.8645 t/t) plus the BREF's polymer waste at the midpoint of its very wide range (9.7 kg/t), so they come out at 0.873 t/t, just above the range's top. NAPCOR 2020 (Table 36) reports 0.860 t/t, below the homopolymer stoichiometry, probably because its bottle grades contain diethylene glycol units (our reading; NAPCOR p. 90 says its glycol feed is MEG and DEG together), which the model leaves out (dataset system_boundary.excluded)."
      pet-specific-ethylene-glycol: {expression: feed:ethylene-glycol / product:pet, per: product:pet, reference: bref-pol-pet-tpa-eg}
      pet-specific-electricity: {expression: feed:electricity / product:pet, per: product:pet}
