# Benchmarks of polymers: PET, general-purpose polystyrene (GPPS), suspension PVC and batch polyamide 66. Schema: schemas/benchmarks.schema.json; rules:
# docs/benchmarks.md. Ranges are facts from the cited source, in our own form.
#
# How independent these are:
# - The diacid feed is stoichiometry plus the BREF's polymer waste, so it would sit near the range
#   whatever the plants reported. Its 0.873 t/t is above the range: see out_of_range_reason.
# - The glycol feed adds the BREF's effluent COD and air emissions to the stoichiometry, so it shares
#   a source with its range. It is inside, as is NAPCOR's 0.345 t/t.
# - The GPPS styrene (polystyrene-1) follows from the flowsheet's purge (set by an ASSUMED 7 wt%
#   ethylbenzene in the reactor feed) and devolatilisation recoveries, not from the BREF; only the
#   vent's 86 g/t is set to the BREF's VOC level, a 0.01 % effect. Its process water and nitrogen
#   are the BREF's figures by construction and so are not bound.
# - The PA66 monomers (polyamide-66-1) are the salt's stoichiometry with the assumed conversion and
#   the diamine stripped with the steam, which is set from the same BREF table's COD; the salt per t
#   is not fitted to the range and falls 0.6 % below it (out_of_range_reason). The PA66 energy is
#   the flowsheet's evaporation and heating duties with ASSUMED powers, independent of the range.
# A PET total energy KPI is not bound: the natural gas is in kg, and an expression cannot add kg to kWh
# (docs/benchmarks.md). By hand, the dataset's 230 kWh/t of electricity (828 MJ) and 42.0 kg/t of
# natural gas at an LHV of 50.01 MJ/kg (2100 MJ) give about 2930 MJ/t for melt phase and SSP together.
# The POL BREF gives 2087 to 4500 MJ/t for the continuous TPA melt phase (Table 10.4) and 903 to
# 949 MJ/t for continuous SSP (Table 10.5). The dataset sits inside the melt-phase range alone, and
# slightly below the sum of the two lowest values (about 2990 MJ/t). The BREF does not say how it adds
# fuel and power. NAPCOR's plants include MTR, which has no separate SSP step. The BREF's footnoted
# single value for the TPA process making high-viscosity PET for food packaging, the grade closest to
# this bottle resin, is 18500 MJ/t, about six times the dataset; the BREF gives no reason for it.
# The IEA paper (Saygin et al. 2009) gives PET 4.1 GJ/t of fuel at best practice (Table 1, after
# Boustead 2008) and 4.9 GJ/t as the Western European average (Table 13), twice the dataset's 2.1 GJ/t
# of natural gas: the dataset's heat is at about half of the best-practice fuel, recorded here and in
# the README, not bound (kg against GJ). The PET electricity is bound to the same paper.
schema: cheme-as-code/benchmarks/v1
family: polymers

kpis:
  pet-specific-diacid:
    title: Terephthalic (and isophthalic) acid per t of PET
    unit: t/t
    references:
      - id: bref-pol-pet-tpa-diacid
        range: [0.825, 0.87]
        basis: unallocated
        note: The source labels the row DMT/TPA and does not say whether comonomer acids are counted. Its lower end is below the 0.8645 t/t that the homopolymer's stoichiometry needs, which suggests comonomers or a different product mix; that reading is ours.
        conditions: {technology: "continuous polycondensation based on TPA (fibre and other grades); the food-packaging grade has its own energy figure only", region: EU}
        source: &bref-pol
          citation: "European Commission JRC (2007) Reference Document on Best Available Techniques in the Production of Polymers (POL BREF), August 2007"
          url: https://eippcb.jrc.ec.europa.eu/sites/default/files/2019-11/pol_bref_0807.pdf
          locator: Table 10.4, p. 170
          kind: bref
          accessed: "2026-11-05"
  pet-specific-ethylene-glycol:
    title: Ethylene glycol per t of PET
    unit: t/t
    references:
      - id: bref-pol-pet-tpa-eg
        range: [0.32, 0.355]
        basis: unallocated
        conditions: {technology: continuous polycondensation based on TPA, region: EU}
        source: *bref-pol
  pet-specific-electricity:
    title: Electricity per t of PET
    unit: kWh/t
    references:
      - id: iea-2009-pet-electricity
        range: [194.4, 222.2]
        basis: unallocated
        note: From the best-practice value (0.7 GJ/t, Table 1, after Boustead 2008) to the estimated current Western European average (0.8 GJ/t, Table 13), in final energy terms, converted at 3.6 MJ/kWh. Table 13 names no source for PET, so by its footnote 1 the average is the best-practice value plus 20 %, not a survey. The same rows give 4.1 GJ/t (best practice) and 4.9 GJ/t (average) of fuel. Independent of the dataset, which takes NAPCOR's US figure.
        conditions: {technology: "PET production, process and grade not named", region: Western Europe, year: 2009}
        source:
          citation: "Saygin, D., Patel, M.K., Tam, C., Gielen, D.J. (2009) Chemical and Petrochemical Sector: Potential of best practice technology and other measures for improving energy efficiency. IEA Information Paper, OECD/IEA, Paris"
          url: https://iea.blob.core.windows.net/assets/c2d071e4-4142-44f1-8a41-88ece29be439/ChemicalandPetrochemicalSector.pdf
          locator: Table 1, p. 16, and Table 13, p. 52
          kind: iea
          accessed: "2026-11-05"
  gpps-specific-styrene:
    title: Styrene per t of general-purpose polystyrene
    unit: t/t
    references:
      - id: bref-pol-gpps-styrene
        range: [0.985, 1.02]
        basis: unallocated
        note: "Table 4.10 gives two values for styrene, 0.985 and 1.020 t/t, in the columns 'average top 50 %', 'European average' and 'maximum value' without saying which two (our reading: the top-50 % average and the maximum, since Table 13.6 gives 0.985 t/t as the BAT-associated level). The source's GPPS carries mineral oil (0.02 t/t, up to 0.06) and additives (0.005 t/t) in its product mass; a product without them needs about 2 % more styrene per t."
        conditions: {technology: "GPPS plants in Europe, the variety of continuous technologies used (APME data, 2002)", region: EU, year: 2002}
        source: &bref-pol-gpps
          citation: "European Commission JRC (2007) Reference Document on Best Available Techniques in the Production of Polymers (POL BREF), August 2007"
          url: https://eippcb.jrc.ec.europa.eu/sites/default/files/2019-11/pol_bref_0807.pdf
          locator: "Table 4.10, p. 84 (section 4.3.1), and Table 13.6, p. 263"
          kind: bref
          accessed: "2026-11-19"
  gpps-specific-energy:
    title: Total energy (fuel and power) per t of general-purpose polystyrene
    unit: GJ/t
    references:
      - id: bref-pol-gpps-energy
        range: [1.08, 1.8]
        basis: unallocated
        note: "Table 4.10's two values for total energy (1.08 and 1.80 GJ/t), read like its styrene row as the top-50 % average and the maximum; Table 13.6 gives 1.08 GJ/t as the BAT-associated level. The source does not say how it adds fuel and electricity (final or primary energy)."
        conditions: {technology: "GPPS plants in Europe, the variety of continuous technologies used (APME data, 2002)", region: EU, year: 2002}
        source: *bref-pol-gpps

  pvc-specific-electricity:
    title: Electricity per t of suspension PVC
    unit: kWh/t
    references:
      - id: bref-pol-spvc-electricity
        range: [194.4, 305.6]
        basis: unallocated
        note: "Typical electrical energy of S-PVC processes, 0.7 to 1.1 GJ/t (1999 data), converted at 3.6 MJ/kWh. The next section, 5.3.4 (Table 5.10, on the same page), gives one example S-PVC plant at 139 kWh/t for 2003, without off-site and utilities, below the range."
        conditions: {technology: "suspension PVC, batch polymerisation, stripping and drying", region: EU, year: 1999}
        source:
          citation: "European Commission JRC (2007) Reference Document on Best Available Techniques in the Production of Polymers (POL BREF), August 2007"
          url: https://eippcb.jrc.ec.europa.eu/sites/default/files/2019-11/pol_bref_0807.pdf
          locator: section 5.3.3, Table 5.9, p. 103
          kind: bref
          accessed: "2026-11-19"
  pvc-specific-wastewater:
    title: Process wastewater per t of suspension PVC
    unit: t/t
    references:
      - id: bref-pol-spvc-wastewater
        range: [1.0, 4.0]
        basis: unallocated
        note: "Wastewater of German S-PVC plants, 1 to 4 m3/t, as Germany reported it, taken at 1 t/m3. Not independent of the dataset's water, which takes the charge's ratio from a patent and the cake's moisture as ASSUMED."
        conditions: {technology: "suspension PVC", region: DE}
        source:
          citation: "European Commission JRC (2007) Reference Document on Best Available Techniques in the Production of Polymers (POL BREF), August 2007"
          url: https://eippcb.jrc.ec.europa.eu/sites/default/files/2019-11/pol_bref_0807.pdf
          locator: section 5.3.2.1, p. 102
          kind: bref
          accessed: "2026-11-19"

  pa66-specific-monomers:
    title: Adipic acid and hexamethylenediamine (as AH salt) per t of batch polyamide 66
    unit: t/t
    references:
      - id: bref-pol-pa66-batch-ah-salt
        range: [1.165, 1.167]
        basis: unallocated
        note: "Table 9.3's AH salt consumption of the batch PA66 process (Italian data, 2004); the stoichiometric salt per t of polymer is 1.159 t/t. Table 9.8 (APME, batch PA66) gives 1.16 to 1.18 t/t. The source's salt is the dry salt in its 52 to 53 % solution."
        conditions: {technology: "batch autoclave polycondensation of AH salt solution", region: EU, year: 2004}
        source: &bref-pol-2006-pa
          citation: "European Commission JRC/EIPPCB (2006) Reference Document on Best Available Techniques in the Production of Polymers (POL BREF), October 2006 (INERIS AIDA mirror)"
          url: https://aida.ineris.fr/sites/aida/files/documents-bref/pol_bref_1006.pdf
          locator: "chapter 9, Table 9.3, p. 154, and Table 9.8, p. 157"
          kind: bref
          accessed: "2026-11-19"
  pa66-specific-energy:
    title: Total energy per t of batch polyamide 66
    unit: GJ/t
    references:
      - id: bref-pol-pa66-batch-energy
        range: [3.3, 7.7]
        basis: unallocated
        note: "Table 9.8's total energy of the batch PA66 process (APME data), 3300 to 7700 MJ/t, the range due to speciality products and reactors; Table 9.3 gives 5050 to 7250 MJ/t for the batch process. The source does not say how it adds fuel and power."
        conditions: {technology: "batch autoclave polycondensation of AH salt solution", region: EU, year: 2004}
        source: *bref-pol-2006-pa

datasets:
  - process: pet-1
    dataset: pet-pta-continuous-ssp
    conditions: {technology: "continuous PTA esterification and melt polycondensation with SSP; homopolymer repeat unit with 2.6 % isophthalic acid of the diacids", basis: conceptual inventory}
    kpis:
      pet-specific-diacid:
        expression: (feed:terephthalic-acid + feed:isophthalic-acid) / product:pet
        per: product:pet
        reference: bref-pol-pet-tpa-diacid
        out_of_range_reason: "The diacids are the homopolymer stoichiometry (0.8645 t/t) plus the BREF's polymer waste at the midpoint of its very wide range (9.7 kg/t), so they come out at 0.873 t/t, just above the range's top. NAPCOR 2020 (Table 36) reports 0.860 t/t, below the homopolymer stoichiometry, probably because its bottle grades contain diethylene glycol units (our reading; NAPCOR p. 90 says its glycol feed is MEG and DEG together), which the model leaves out (dataset system_boundary.excluded)."
      pet-specific-ethylene-glycol: {expression: feed:ethylene-glycol / product:pet, per: product:pet, reference: bref-pol-pet-tpa-eg}
      pet-specific-electricity:
        expression: feed:electricity / product:pet
        per: product:pet
        reference: iea-2009-pet-electricity
        out_of_range_reason: "The dataset's 230 kWh/t is NAPCOR's figure for US bottle-grade plants of 2015 (melt phase with SSP, some MTR), 4 % above the IEA's Western European average, which is itself the best-practice value plus 20 % (Table 13, footnote 1) rather than plant data."
  - process: polyamide-66-1
    dataset: polyamide-66-by-batch-autoclave-polycondensation-of-ah-salt-8000-t-a
    conditions: {technology: "AH salt made on site, batch autoclave: concentration to 70 wt%, polycondensation to 548 K with the steam bled at 1750 kPa(a), depressurisation, finishing, strand pelletising; no additives", basis: "concept flowsheet (core propagate with a balance script for the evaporation heats), ASSUMED conversion, cycle and powers (DESIGN.md D-003 to D-009)"}
    kpis:
      pa66-specific-monomers:
        expression: (feed:AAF + feed:HMDAF) / product:PA66
        per: product:PA66
        reference: bref-pol-pa66-batch-ah-salt
        out_of_range_reason: "D-004 in processes/polyamide-66-1/DESIGN.md: the dataset's 1.159 t/t is the stoichiometric salt for 99.2 wt% polymer with 0.58 wt% unlinked ends and 0.2 wt% water, plus the diamine stripped with the steam (2.69 kg/t, from the BREF's COD); it leaves out the plants' yield losses (off-grade, start-ups, polymer waste of 0 to 0.2 kg/t and purges), which the BREF's 1.165 to 1.167 t/t carries, so it sits 0.6 % below the range."
      pa66-specific-energy:
        expression: (feed:POWER + feed:HOTOIL + feed:LPS) / product:PA66
        per: product:PA66
        reference: bref-pol-pa66-batch-energy
  - process: polystyrene-1
    dataset: general-purpose-polystyrene-by-continuous-bulk-polymerisation-100-kt-a-concept
    conditions: {technology: "continuous bulk polymerisation initiated by heat (stirred prepolymeriser and tower reactors), two-stage vacuum devolatilisation, underwater pelletising; no mineral oil or additives in the product", basis: concept flowsheet (core propagate with an independent balance script)}
    kpis:
      gpps-specific-styrene: {expression: feed:SM / product:PELLETS, per: product:PELLETS, reference: bref-pol-gpps-styrene}
      gpps-specific-energy:
        expression: (feed:POWER + feed:HOTOIL) / product:PELLETS
        per: product:PELLETS
        reference: bref-pol-gpps-energy
        out_of_range_reason: "D-012 in processes/polystyrene-1/DESIGN.md: the dataset counts the process line's electricity (660 kW) and the heat the hot oil delivers to E-101 (1044 kW), 0.49 GJ/t, below the BREF's lowest total of 1.08 GJ/t. Not counted: the hot-oil heater's losses (in its background), the cooling-water and chilled-water pumps and fans (in the cooling-water utility's background), the reactors' heat at start-up, tank, silo and line tracing, HVAC, nitrogen and buildings, and the BREF does not say how it adds fuel and power; the concept's powers are ASSUMED (D-009)."
  - process: pvc-1
    dataset: polyvinyl-chloride-by-batch-suspension-polymerisation-of-vinyl-chloride-with-vcm-recovery-steam-stripping-centrifuge-and-fluid-bed-drying
    conditions: {technology: "suspension polymerisation in four 130 m3 batch autoclaves at 330 K to 90 % conversion, VCM recovery, continuous steam stripping, decanter centrifuge, fluid-bed dryer on LP steam", basis: "concept balance, the charge of US 6 825 288 B2, Example 1, ASSUMED rate, splits, cake moisture and dryer efficiency (DESIGN.md D-004 to D-009)"}
    kpis:
      pvc-specific-electricity:
        expression: feed:POWER / product:PVCP
        per: product:PVCP
        reference: bref-pol-spvc-electricity
        out_of_range_reason: "The dataset's 139 kWh/t is the BREF's own example plant (Table 5.10), which leaves out off-site and utilities; the refrigeration of the chilled water (0.44 kWh of heat per kg) is a separate exchange, product:CHW, whose electricity a chiller at a COP of 4 to 5 would add (about 90 to 110 kWh/t), bringing the total into the range (D-008)."
      pvc-specific-wastewater: {expression: product:WW / product:PVCP, per: product:PVCP, reference: bref-pol-spvc-wastewater}
