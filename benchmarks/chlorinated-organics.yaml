# Benchmarks of halogenated organics (family chlorinated-organics). Schema:
# schemas/benchmarks.schema.json; rules: docs/benchmarks.md. Ranges are facts from the cited
# source, in our own form.
#
# Carbon tetrabromide (carbon-tetrabromide-1, #152): no open source gives a plant's specific
# consumptions. The stoichiometric floor of the bromine on the haloform route is 1.928 kg/kg CBr4
# (C3H6O + 4 Br2 + 5 NaOH -> CBr4 + CH3COONa + 4 NaBr + 4 H2O); it is a limit, not a range of
# real plants, so it is not recorded as one (docs/benchmarks.md: never invent a range). The
# route's one open source, CN 101 885 665 A, gives charges but no yield.
schema: cheme-as-code/benchmarks/v1
family: chlorinated-organics

kpis:
  cbr4-specific-bromine:
    title: Bromine consumption per kg of carbon tetrabromide
    unit: kg/kg
    no_open_reference: "No open source with a plant's or a pilot's bromine use per kg CBr4 found (searched 2026-11-05: Google Patents CN 101 885 665 A read, charges only and no yield; Wikipedia, Carbon tetrabromide, which names the CCl4 + AlBr3 exchange and methane bromination without figures; web search for CBr4 production yields, which gave only market-report pages). Only the stoichiometric floor, 1.928 kg/kg, is known."
  cbr4-specific-wastewater:
    title: Wastewater (mother liquor, wash and condensate) per kg of carbon tetrabromide
    unit: kg/kg
    no_open_reference: "No open source with the effluent of CBr4 production found (searched 2026-11-05 as for cbr4-specific-bromine); CN 101 885 665 A separates the solid from the liquor but states no liquor amount or washing."

datasets:
  - process: carbon-tetrabromide-1
    dataset: carbon-tetrabromide-by-semi-batch-haloform-bromination-of-acetone-in-aqueous-hypobromite-325-t-a
    conditions: {technology: "aqueous haloform route: hypobromite from bromine and caustic, acetone dosed at 278 K with a phase-transfer catalyst, CBr4 precipitated, filtered, washed and vacuum-dried", basis: "concept balance, ratios after the patent's examples and ASSUMED (DESIGN.md D-004, D-005)"}
    kpis:
      cbr4-specific-bromine: {expression: feed:BR2 / product:CBR4P, per: product:CBR4P}
      cbr4-specific-wastewater: {expression: product:WW / product:CBR4P, per: product:CBR4P}
