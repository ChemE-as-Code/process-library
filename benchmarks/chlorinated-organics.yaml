# Benchmarks of chlorinated organics: VCM by the balanced EDC process, and benzyl chloroformate.
# Schema: schemas/benchmarks.schema.json; rules: docs/benchmarks.md. Ranges are facts from the
# cited source, in our own form.
#
# vcm-1:
# Independence: the oxygen and residue KPIs come from the dataset's own document (LVOC BREF 2017),
# but neither value is transcribed: both are calculated from the chlorine and ethylene figures by
# stoichiometry, so they test the model's closure, not new plant data. The ethylene and CO2 KPIs are
# bound to IPCC 2006 defaults, which average the plant data of the earlier (2003) LVOC BREF: a
# different data collection, though not a fully independent one. The EU ETS benchmark is the most
# independent figure (verified 2016-2017 emissions of EU installations), but it is the mean of the
# 10 % best plants, not a range, so it is recorded and not bound.
#
# Benzyl chloroformate (benzyl-chloroformate-1, #153): no open source gives a plant's specific
# consumptions. The stoichiometric floors are 0.634 kg benzyl alcohol and 0.580 kg phosgene per
# kg (one of each per chloroformate); they are limits, not ranges of real plants, so they are not
# recorded as ones (docs/benchmarks.md: never invent a range). The open yields are laboratory
# examples of one patent (US 6 696 590 B2 Ex. 3 and 4: 81 % at 500 mbar and 75 % at 250 mbar,
# isolated, on 2 mol of alcohol), single values at different conditions, and Ex. 3 is the
# dataset's own basis of conditions (DESIGN.md D-001, D-005); they are discussed in D-008, not
# bound here.
#
# Carbon tetrabromide (carbon-tetrabromide-1, #152; the family also takes the brominated
# organics): no open source gives a plant's specific consumptions. The stoichiometric floor of
# the bromine on the haloform route is 1.928 kg/kg CBr4 (C3H6O + 4 Br2 + 5 NaOH -> CBr4 +
# CH3COONa + 4 NaBr + 4 H2O); it is a limit, not a range of real plants, so it is not recorded as
# one (docs/benchmarks.md: never invent a range). The route's one open source, CN 101 885 665 A,
# gives charges but no yield.
#
# Benzyl bromide (benzyl-bromide-1, #139; a brominated organic in this family, as CBr4): no open
# source gives a plant's specific consumptions. The stoichiometric floors are 0.934 kg bromine
# and 0.539 kg toluene per kg (C7H8 + Br2 -> C7H7Br + HBr); they are limits, not ranges. The one
# open yield, US 3 528 899 A Example I (about 90 % on toluene, X-ray initiated, bromine in
# excess), is a single laboratory value at other conditions; it is discussed in DESIGN.md D-010,
# not bound here.
#
# Benzoyl chloride (benzoyl-chloride-1, #156): the one open source with yields is US 4 276 231 A,
# whose description states 96-98 % of theory for its process (batch and continuous, with and
# without the bottoms recycle). Converted to the benzotrichloride per kg of benzoyl chloride (two
# per mol in the benzoic acid variant) it is a range. It is not independent of the dataset: the
# dataset takes its feed ratios and conditions from the same patent's Example 1, but its yield
# comes from its own still and column (DESIGN.md D-007, D-008), so the range checks that result.
# The stoichiometric floor of the benzotrichloride, 0.695 kg/kg, is a limit, not a range.
#
# p-Toluenesulfonyl chloride (p-toluenesulfonyl-chloride-1, #162): no open source gives a plant's
# specific consumptions. The stoichiometric floors are 0.483 kg toluene and 1.222 kg
# chlorosulfonic acid per kg p-TsCl (C7H8 + 2 HSO3Cl -> TsCl + H2SO4 + HCl); they are limits, not
# ranges of real plants, so they are not recorded as references (docs/benchmarks.md: never invent
# a range). The open yields (DE 1 912 956 A1: 77 % of theory as the para compound; PL 73685 B2:
# above 80 %; CN 105503671 A from purchased TsOH: 81-88 %) are laboratory examples, one of them
# the dataset's own basis (DESIGN.md D-001, D-005), so binding them would only check the
# transcription.
#
# Methyltriphenylphosphonium bromide (methyltriphenylphosphonium-bromide-1, #133; with the
# halogenated organics, as carbon tetrabromide: the taxonomy has no organophosphorus family): no
# open source gives a plant's specific consumptions. The stoichiometric floors are 0.734 kg PPh3
# and 0.266 kg methyl bromide per kg of salt (Ph3P + CH3Br -> [Ph3PCH3]Br); they are limits, not
# ranges of real plants, so they are not recorded as references (docs/benchmarks.md: never
# invent a range). The open sources read (US 3 334 144 A, Wikipedia) give no yield of the
# methyl bromide route; Org. Synth. 40, 66 (1960) could not be read.
#
# Acetyl chloride (acetyl-chloride-1, #142): no open source states a yield or a specific
# consumption for the PCl3 route. The stoichiometric floors are 0.765 kg acetic acid and 0.583 kg
# PCl3 per kg (3 CH3COOH + PCl3 -> 3 CH3COCl + H3PO3); they are limits, not ranges. CS 272 248 B2,
# Example 1, the dataset's own basis, gives the lower phase (96 g per mol PCl3) but no acetyl
# chloride yield; the dataset's phase split is calibrated to it, so binding it would only check
# the calibration.
#
# Iodomethane (iodomethane-1, #163; in this family as the halogenated organics, as benzyl
# bromide: the taxonomy has no iodine family): CN 114195616 B, the dataset's basis, states yields
# of 95-96 % but not on which feed, so no specific consumption follows from it. The
# stoichiometric floors are 0.894 kg iodine and 0.226 kg methanol per kg (6 CH3OH + 2 P + 3 I2 ->
# 6 CH3I + 2 H3PO3); they are limits, not ranges.
#
# Oxalyl chloride (oxalyl-chloride-1, #144): US 4 341 720 A, the dataset's basis, states yields
# of 62 to 91 % of theory on the acid as oxalyl chloride in the crude distillate of its
# laboratory Examples 1 to 17, which bound the acid's use; the dataset's selectivity is calibrated to the crude of its Examples 19 and 20,
# so the reference is not independent. No open source gives a PCl3 use per kg beyond one
# laboratory charge; the stoichiometric floor is 2.164 kg/kg.
schema: cheme-as-code/benchmarks/v1
family: chlorinated-organics

kpis:
  vcm-specific-ethylene:
    title: Ethylene consumption per t of VCM
    unit: kg/kg
    references:
      - id: ipcc-2006-vcm-balanced-ethylene
        range: [0.47, 0.47]
        basis: unallocated
        note: One Tier 1 default for the balanced process, recorded as a zero-width range and not widened. IPCC took it from the 2003 LVOC BREF.
        conditions: {technology: "balanced EDC process with integrated VCM plant; plant data of the 2003 LVOC BREF", region: EU}
        source:
          citation: "IPCC (2006) 2006 IPCC Guidelines for National Greenhouse Gas Inventories, Vol. 3 Industrial Processes and Product Use, ch. 3 Chemical Industry Emissions"
          url: https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/3_Volume3/V3_3_Ch3_Chemical_Industry.pdf
          locator: Section 3.9.2.2, Table 3.18, p. 3.77
          kind: government
          accessed: "2026-11-05"
      - id: bref-lvoc-vcm-ethylene
        range: [0.46, 0.47]
        basis: unallocated
        note: The dataset's own source for its ethylene (it takes the midpoint), so binding it would be transcription only.
        conditions: {technology: "balanced EDC/VCM unit (the table is headed for air-based oxychlorination but gives both air and oxygen figures)", region: EU}
        source: &bref-vcm
          citation: "Falcke, H. et al. (2017) Best Available Techniques (BAT) Reference Document for the Production of Large Volume Organic Chemicals. JRC Science for Policy Report EUR 28882 EN, doi:10.2760/77304"
          url: https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/JRC109279_LVOC_Bref.pdf
          locator: Section 11.3.3, Table 11.12, p. 506
          kind: bref
          accessed: "2026-11-05"
  vcm-specific-oxygen:
    title: Oxygen consumption per t of VCM (oxygen-based oxychlorination)
    unit: kg/kg
    references:
      - id: bref-lvoc-vcm-oxygen
        range: [0.13, 0.14]
        basis: unallocated
        note: Our reading is that the oxygen figure belongs to oxygen-based oxychlorination and the 0.73 kg/kg air figure of the same table to air-based units; the source does not say so explicitly.
        conditions: {technology: balanced EDC/VCM unit, region: EU}
        source: *bref-vcm
  vcm-specific-residues:
    title: Light and heavy residues of EDC/VCM purification per t of VCM
    unit: kg/t
    references:
      - id: bref-lvoc-vcm-residues
        range: [20, 62]
        basis: unallocated
        note: Questionnaire values of the BREF review; the source says most plants are below 30 kg/t.
        conditions: {technology: balanced EDC/VCM unit, region: EU}
        source:
          citation: "Falcke, H. et al. (2017) Best Available Techniques (BAT) Reference Document for the Production of Large Volume Organic Chemicals. JRC Science for Policy Report EUR 28882 EN, doi:10.2760/77304"
          url: https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/JRC109279_LVOC_Bref.pdf
          locator: Section 11.3.6, p. 508
          kind: bref
          accessed: "2026-11-05"
  vcm-direct-co2:
    title: Direct CO2 (furnaces, vent treatment, process vent) per t of VCM
    unit: t/t
    references:
      - id: ipcc-2006-vcm-balanced-co2
        range: [0.294, 0.294]
        basis: unallocated
        note: Tier 1 default for the balanced process, 0.0083 non-combustion vent plus 0.286 combustion (furnace fuel and the incineration of process waste gas with support fuel; flares excluded). One value, recorded as a zero-width range and not widened.
        conditions: {technology: "balanced EDC process with integrated VCM plant; plant data of the 2003 LVOC BREF", region: EU}
        source:
          citation: "IPCC (2006) 2006 IPCC Guidelines for National Greenhouse Gas Inventories, Vol. 3 Industrial Processes and Product Use, ch. 3 Chemical Industry Emissions"
          url: https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/3_Volume3/V3_3_Ch3_Chemical_Industry.pdf
          locator: Section 3.9.2.2, Table 3.17, p. 3.77
          kind: government
          accessed: "2026-11-05"
      - id: eu-ets-vcm-benchmark-2016-2017
        range: [0.171, 0.171]
        basis: unallocated
        note: >-
          Average of the 10 % most efficient EU installations in 2016 and 2017, in t CO2e per t VCM
          (the benchmark value for 2021-2025 is 0.155 allowances/t). Its boundary covers all processes
          linked to direct chlorination, oxychlorination, EDC cracking and the incineration of vent
          gases, and leaves out the production of oxygen. Our reading of Article 20 of Delegated
          Regulation 2019/331 is that the benchmark also counts the emissions of imported heat (steam)
          and of hydrogen burnt as fuel (valued at the heat benchmark), so it is wider than the dataset's
          direct CO2. A best-plant mean, not a typical value, so not bound. The text
          was read through the eurlexa.com mirror of EUR-Lex (EUR-Lex itself refused the download).
        conditions: {technology: "EDC/VCM installations under the EU ETS, 2016 and 2017", region: EU, year: 2017}
        source:
          citation: "Commission Implementing Regulation (EU) 2021/447 of 12 March 2021 determining revised benchmark values for free allocation of emission allowances for 2021 to 2025, Annex; definition in Commission Delegated Regulation (EU) 2019/331, Annex I"
          url: https://eur-lex.europa.eu/eli/reg_impl/2021/447/oj
          locator: Annex, point 1 (Vinyl chloride monomer (VCM))
          kind: government
          accessed: "2026-11-05"

  bcf-specific-benzyl-alcohol:
    title: Benzyl alcohol consumption per kg of benzyl chloroformate
    unit: kg/kg
    no_open_reference: "No open source with a plant's or a pilot's benzyl alcohol use per kg of benzyl chloroformate found (searched 2026-11-05: Google Patents US 6 696 590 B2 and US 3 966 786 A read, laboratory and continuous examples only; web search for benzyl chloroformate production yields and consumption). US 6 696 590 B2 Ex. 3 implies 0.79 kg/kg (217 g of alcohol for 275 g of product, an 81 % isolated laboratory yield), a single value and the dataset's own basis of conditions; the stoichiometric floor is 0.634 kg/kg."
  bcf-specific-phosgene:
    title: Phosgene consumption per kg of benzyl chloroformate
    unit: kg/kg
    no_open_reference: "No open source with a plant's phosgene use per kg of benzyl chloroformate found (searched 2026-11-05 as for bcf-specific-benzyl-alcohol); US 6 696 590 B2 states a preferred excess of 1.5 to 2.5 mol per mol of alcohol and uses 1.27 in Ex. 3 (the dataset's ratio), no plant figure; the stoichiometric floor is 0.580 kg/kg."
  cbr4-specific-bromine:
    title: Bromine consumption per kg of carbon tetrabromide
    unit: kg/kg
    no_open_reference: "No open source with a plant's or a pilot's bromine use per kg CBr4 found (searched 2026-11-05: Google Patents CN 101 885 665 A read, charges only and no yield; Wikipedia, Carbon tetrabromide, which names the CCl4 + AlBr3 exchange and methane bromination without figures; web search for CBr4 production yields, which gave only market-report pages). Only the stoichiometric floor, 1.928 kg/kg, is known."
  cbr4-specific-wastewater:
    title: Wastewater (mother liquor, wash and condensate) per kg of carbon tetrabromide
    unit: kg/kg
    no_open_reference: "No open source with the effluent of CBr4 production found (searched 2026-11-05 as for cbr4-specific-bromine); CN 101 885 665 A separates the solid from the liquor but states no liquor amount or washing."
  bzcl-specific-benzotrichloride:
    title: Benzotrichloride consumption per kg of benzoyl chloride (benzoic acid variant)
    unit: kg/kg
    references:
      - id: us4276231-yield-btc
        range: [0.7095, 0.7243]
        basis: unallocated
        note: "The patent's 96-98 % of theory converted at 2 mol of benzoyl chloride per mol of benzotrichloride (C7H5Cl3 + C7H6O2 -> 2 C7H5ClO + HCl): 195.467 / (2 x 140.566) = 0.6953 kg/kg at 100 %, divided by 0.98 and 0.96. The patent's yields include its water variant and runs with the bottoms re-reacted; its batch Example 1 without the recycle gives 96.7 % (0.719 kg/kg). Not independent of benzoyl-chloride-1, which takes its feed ratios from the same patent."
        conditions: {technology: "benzotrichloride partly hydrolysed with benzoic acid and/or water over a Lewis-acid or protic catalyst, 120-160 C, vacuum distillation; batch and continuous", region: DE, year: 1981}
        source:
          citation: "Bockmann, W.; Lipper, K.-A.; Bruhne, F. (Bayer AG) (1981) Process for preparing optionally substituted benzoyl chloride. US Patent 4,276,231 A"
          url: https://patents.google.com/patent/US4276231A/en
          locator: "Description (yields and purity of the process) and Example 1"
          kind: other
          accessed: "2026-11-05"
  bzcl-specific-residue:
    title: Distillation residue per kg of benzoyl chloride
    unit: kg/kg
    no_open_reference: "No open source with the residue of a benzoyl chloride distillation on the benzoic acid route without recycle found (searched 2026-11-05: Google Patents US 4 276 231 A read; its Example 1 gives no bottoms mass, its Example 2, the water variant, 210 g of bottoms on 3255 g of product before they are re-reacted, one value on other conditions; NIST WebBook and PubChem have no plant data)."
  bnbr-specific-bromine:
    title: Bromine consumption per kg of benzyl bromide
    unit: kg/kg
    no_open_reference: "No open source with a plant's or a pilot's bromine use per kg of benzyl bromide found (searched 2026-11-06: Google Patents US 3 528 899 A read, a laboratory example with X-ray initiation at 1.2 mol of bromine per mol of toluene, about 90 % on toluene, no yield on bromine; PubChem CID 7498 (HSDB) names the route without figures; NIST WebBook has no plant data). Only the stoichiometric floor, 0.934 kg/kg, is known."
  bnbr-specific-toluene:
    title: Toluene consumption per kg of benzyl bromide
    unit: kg/kg
    no_open_reference: "No open source with a plant's toluene use per kg of benzyl bromide found (searched 2026-11-06 as for bnbr-specific-bromine). US 3 528 899 A, Example I implies about 0.60 kg/kg (about 90 % of theory on toluene), one laboratory value under other initiation and excess bromine, not a range; the stoichiometric floor is 0.539 kg/kg."
  tscl-specific-toluene:
    title: Toluene consumption per kg of p-toluenesulfonyl chloride
    unit: kg/kg
    no_open_reference: "No open source with a plant's or a pilot's toluene use per kg p-TsCl found independent of the dataset (searched 2026-11-05: Google Patents DE 1 912 956 A1, the dataset's basis, PL 73685 B2 and CN 105503671 A, all laboratory examples; web search for p-toluenesulfonyl chloride production consumption figures, which gave only encyclopaedia summaries, not read where licensed). Only the stoichiometric floor, 0.483 kg/kg, is known."
  tscl-specific-chlorosulfonic-acid:
    title: Chlorosulfonic acid consumption per kg of p-toluenesulfonyl chloride
    unit: kg/kg
    no_open_reference: "No open source with a plant's chlorosulfonic acid use per kg p-TsCl found (searched 2026-11-05 as for tscl-specific-toluene); the patents give laboratory ratios of about 3 (DE 1 912 956 A1) to 4 (PL 73685 B2) mol per mol toluene. Only the stoichiometric floor, 1.222 kg/kg, is known."
  mtppb-specific-triphenylphosphine:
    title: Triphenylphosphine consumption per kg of methyltriphenylphosphonium bromide
    unit: kg/kg
    no_open_reference: "No open source with a plant's or a pilot's PPh3 use per kg of methyltriphenylphosphonium bromide found (searched 2026-11-06: Google Patents US 3 334 144 A read, its own dibromomethane route with 30 % conversion and no yield of the methyl bromide route; Wikipedia, Methyltriphenylphosphonium bromide, the route only; web search for the salt's production, which gave supplier pages and one laboratory patent example on another route, CN 107840792 A, not read; Org. Synth. 40, 66 (1960) blocked by a browser check, not read). Only the stoichiometric floor, 0.734 kg/kg, is known."
  mtppb-specific-methyl-bromide:
    title: Methyl bromide consumption per kg of methyltriphenylphosphonium bromide
    unit: kg/kg
    no_open_reference: "No open source with a plant's methyl bromide use per kg of the salt found (searched 2026-11-06 as for mtppb-specific-triphenylphosphine); US 3 334 144 A states only that the route needs a pressure vessel. Only the stoichiometric floor, 0.266 kg/kg, is known."

  accl-specific-pcl3:
    title: Phosphorus trichloride consumption per kg of acetyl chloride (acetic acid route)
    unit: kg/kg
    no_open_reference: "No open source with a plant's or a pilot's PCl3 use per kg of acetyl chloride found (searched 2026-11-06: Google Patents CS 272 248 B2, the dataset's basis, gives charges and the lower phase but no acetyl chloride yield; US 4 209 460 A purifies a crude from another process; US 4 060 546 A names the 1:3 ratio as prior art without a yield; Ullmann's chapters not read, licensed). Only the stoichiometric floor, 0.583 kg/kg, is known."
  accl-specific-crude-phosphorous-acid:
    title: Crude phosphorous acid (lower phase) per kg of acetyl chloride
    unit: kg/kg
    no_open_reference: "No open source independent of the dataset found (searched 2026-11-06 as for accl-specific-pcl3): CS 272 248 B2, Example 1, gives 96 g of lower phase per 1.0 mol PCl3 but no acetyl chloride mass, and the dataset's phase split is calibrated to that example, so it is not an independent reference."
  mei-specific-iodine:
    title: Iodine consumption per kg of iodomethane (red phosphorus route)
    unit: kg/kg
    no_open_reference: "No open source with a plant's iodine use per kg of iodomethane found (searched 2026-11-05/06: Google Patents CN 114195616 B, the dataset's basis, gives charges and yields of 95-96 % without stating their basis; PubChem HSDB names the route without consumptions; Ullmann's chapters not read, licensed). Only the stoichiometric floor, 0.894 kg/kg, is known."
  mei-specific-methanol:
    title: Methanol consumption per kg of iodomethane (red phosphorus route)
    unit: kg/kg
    no_open_reference: "No open source with a plant's methanol use per kg of iodomethane found (searched as for mei-specific-iodine): CN 114195616 B gives the charges of its examples, which the dataset takes as its ratio, so they are no independent reference. Only the stoichiometric floor, 0.226 kg/kg, is known."
  oxcl-specific-oxalic-acid:
    title: Oxalic acid (anhydrous) consumption per kg of oxalyl chloride (PCl5 route)
    unit: kg/kg
    references:
      - id: us4341720-yields-oxa
        range: [0.7795, 1.1442]
        basis: unallocated
        note: "The oxalyl chloride in the crude distillate (mixed with mostly POCl3) of the patent's Examples 1 to 17, 62 to 91 % of theory on the acid, with PCl5 in POCl3 and an amine or amide catalyst ((COOH)2 -> (COCl)2, 90.034 / 126.92 = 0.7094 kg/kg at 100 %, divided by 0.91 and 0.62); the 2,4-dimethylpyridine Examples 8 and 9 give 85 and 91 %. Examples 19 and 20 (PCl5 made in situ, the residue re-used) give 85.0 % in the crude (2052 g at 21.9 wt%) and 84.2 % isolated (445 g from 375 g of acid, 0.843 kg/kg). Laboratory examples; not independent of oxalyl-chloride-1, which takes its ratios and its selectivity from the same patent."
        conditions: {technology: "oxalic acid with PCl5 in POCl3 and a tertiary amine, pyridine or carboxamide catalyst, 40-80 C at 0.15-0.5 bar, the product distilled off and rectified; laboratory batch and one continuous example", region: DE, year: 1982}
        source:
          citation: "Vogel, A.; Steffan, G.; Mannes, K.; Trescher, V. (Bayer AG) (1982) Process for the preparation of oxalyl chloride. US Patent 4,341,720 A"
          url: https://patents.google.com/patent/US4341720A/en
          locator: "Description (yields of Examples 1 to 17) and Examples 19 and 20"
          kind: other
          accessed: "2026-11-12"
  oxcl-specific-pcl3:
    title: Phosphorus trichloride consumption per kg of oxalyl chloride (PCl5 made in situ)
    unit: kg/kg
    no_open_reference: "No open source with a plant's PCl3 use per kg of oxalyl chloride found (searched 2026-11-12: Google Patents US 4 341 720 A read, whose Example 20 adds 1025 g of PCl3 to the previous batch's residue for 445 g of product, 2.30 kg/kg, one laboratory value with the heel not at steady state; US 4 390 708 A and US 2 816 141 A use other routes). Only the stoichiometric floor, 2.164 kg/kg at 2 mol per mol, is known."
datasets:
  - process: vcm-1
    dataset: vcm-balanced-oxygen
    conditions: {technology: "balanced process, oxygen-based oxychlorination, thermal EDC cracking", basis: conceptual inventory}
    kpis:
      vcm-specific-ethylene:
        expression: feed:ethylene / product:vinyl-chloride
        per: product:vinyl-chloride
        reference: ipcc-2006-vcm-balanced-ethylene
        out_of_range_reason: "The dataset takes the midpoint of the 2017 BREF's 0.46 to 0.47 kg/kg (newer EU plants, two thirds with oxygen-based oxychlorination, which the BREF says raises the yield); the IPCC default rests on the 2003 BREF data."
      vcm-specific-oxygen: {expression: feed:oxygen / product:vinyl-chloride, per: product:vinyl-chloride, reference: bref-lvoc-vcm-oxygen}
      vcm-specific-residues: {expression: output:residues / product:vinyl-chloride, per: product:vinyl-chloride, reference: bref-lvoc-vcm-residues}
      vcm-direct-co2:
        expression: emission:CO2 / product:vinyl-chloride
        per: product:vinyl-chloride
        reference: ipcc-2006-vcm-balanced-co2
        out_of_range_reason: "The dataset burns the 2017 BREF's fuel midpoint (3.8 GJ/t) and only the ethylene left unconverted; the IPCC default averages older plants (2003 BREF data) and includes support fuel of the waste-gas incinerators, which is not counted separately here (see the dataset's parameter fuel). Nor is the CO2 of incinerating the dataset's 28.5 kg/t of residues (about 19 kg/t as 1,1,2-trichloroethane, 0.214 kmol x 2 x 44.009): the residues are an output to treatment that no Atlas entry takes yet (a mapping gap), so that CO2 belongs to the unlinked treatment. The value lies between it and the EU ETS mean of the 10 % best plants (0.171 t/t, which also counts steam and hydrogen fuel), recorded beside it."
  - process: benzyl-chloroformate-1
    dataset: benzyl-chloroformate-by-semi-batch-phosgenation-of-benzyl-alcohol-1000-t-a
    conditions: {technology: "phosgenation of neat benzyl alcohol with phosgene gas at 278 K and 50 kPa(a), semi-batch, degassed, not distilled, caustic off-gas scrubber", basis: "concept balance, ratios from the patent's Ex. 3 and ASSUMED kinetics (DESIGN.md D-004, D-005)"}
    kpis:
      bcf-specific-benzyl-alcohol: {expression: feed:BNOH / product:BCF, per: product:BCF}
      bcf-specific-phosgene: {expression: feed:PHOS / product:BCF, per: product:BCF}
  - process: benzyl-bromide-1
    dataset: benzyl-bromide-by-semi-batch-light-driven-side-chain-bromination-of-toluene-with-hbr-absorption-and-batch-distillation-1000-t-a
    conditions: {technology: "bromine dosed into 4 mol of toluene per mol at 363 K under lamps (semi-batch), HBr vent through a reflux condenser to 48 wt% acid, toluene strip at 15 kPa(a), forerun and main cut at 2 kPa(a) through a packed column on the still, toluene and forerun recycled", basis: "concept balance, ASSUMED effective rate laws, ratio, still ends, column stages and reflux ratios (DESIGN.md D-004, D-005, D-007, D-015)"}
    kpis:
      bnbr-specific-bromine: {expression: feed:BR2 / product:BNBR, per: product:BNBR}
      bnbr-specific-toluene: {expression: feed:TOL / product:BNBR, per: product:BNBR}
  - process: carbon-tetrabromide-1
    dataset: carbon-tetrabromide-by-semi-batch-haloform-bromination-of-acetone-in-aqueous-hypobromite-314-t-a
    conditions: {technology: "aqueous haloform route: hypobromite from bromine and caustic, acetone dosed at 278 K with a phase-transfer catalyst, CBr4 precipitated, filtered, washed and vacuum-dried", basis: "concept balance, ratios after the patent's examples and ASSUMED (DESIGN.md D-004, D-005)"}
    kpis:
      cbr4-specific-bromine: {expression: feed:BR2 / product:CBR4P, per: product:CBR4P}
      cbr4-specific-wastewater: {expression: product:WW / product:CBR4P, per: product:CBR4P}
