# Benchmarks of CO2 capture and conditioning: for now the conditioning of a high-purity source.
# Schema: schemas/benchmarks.schema.json; rules: docs/benchmarks.md. Ranges are facts from the cited
# source, in our own form.
#
# Only the electricity KPI has a reference independent of the dataset: the McCollum and Ogden model.
# The NETL electricity range comes from the dataset's own source (its ammonia case is the dataset); it
# is kept beside it, unbound, to show the spread between its cases. The water KPI has no independent
# open reference and records no_open_reference.
schema: cheme-as-code/benchmarks/v1
family: carbon-capture

kpis:
  co2-conditioning-specific-electricity:
    title: Electricity per t of CO2 compressed (and dried) to pipeline pressure
    unit: kWh/t
    references:
      - id: mccollum-ogden-2006-compression-model
        range: [104.8, 104.8]
        basis: unallocated
        note: >-
          Evaluated by us from the report's compressor and pump power equations with the parameter
          values it states (five compressor stages from 0.1 to 7.38 MPa with their Z and k, inlet
          40 degC, isentropic efficiency 0.75; pump from 7.38 to 15 MPa, 630 kg/m3, efficiency 0.75):
          100.4 kWh/t compression plus 4.5 kWh/t pumping. The report prints the equations and a figure
          of power against flow, no per-tonne value. A single model value, recorded as a zero-width
          range and not widened. No cooling-water power and no drying.
        conditions: {product: "pure CO2, from 0.1 MPa and 40 degC", pressure: "15 MPa delivered", technology: multistage compression and pump, year: 2006}
        source:
          citation: "McCollum, D.L., Ogden, J.M. (2006) Techno-economic models for carbon dioxide compression, transport, and storage & correlations for estimating carbon dioxide density and viscosity. Institute of Transportation Studies, University of California, Davis, Research Report UCD-ITS-RR-06-14"
          url: https://itspubs.ucdavis.edu/publication_detail.php?id=1047
          locator: "Section 'Calculation of Compressor & Pump Power Requirements', report pp. 2-4"
          kind: other
          accessed: "2026-11-05"
      - id: netl-2023-high-purity-reciprocating
        range: [105.6, 112.7]
        basis: unallocated
        note: >-
          Total auxiliary load over the product flow of NETL's two high-purity cases with reciprocating
          compression to 15.3 MPa: ammonia stripper vent (5,860 kW, 55,488 kg/h, TEG drying) and ethanol
          fermentation off-gas (1,840 kW, 16,329 kg/h, no dryer). Divided by us. The same source as the
          dataset, so not an independent check.
        conditions: {product: "CO2 from an ammonia stripper vent (0.16 MPa) or fermentation off-gas (0.12 MPa)", pressure: "15.3 MPa and 30 degC delivered", technology: reciprocating compression with stand-alone cooling tower, region: US, year: 2023}
        source:
          citation: "Hughes, S., Zoelle, A. (2023) Cost of Capturing CO2 from Industrial Sources. National Energy Technology Laboratory, DOE/NETL-2023/3907"
          url: https://www.osti.gov/servlets/purl/2007619
          locator: Section 5.1.5, Exhibits 5-3 and 5-4 (ammonia); section 5.3.5, Exhibits 5-22 and 5-23 (ethanol)
          kind: government
          accessed: "2026-11-05"
  co2-conditioning-cooling-water-makeup:
    title: Cooling-water make-up per t of CO2 conditioned
    unit: kg/t
    no_open_reference: >-
      No open source independent of the dataset found (2026-11-05). The only figures read are NETL
      (2023), DOE/NETL-2023/3907, Exhibits 5-7 and 5-26: water consumable of the ammonia case (46,000
      gal/d, 130.8 kg/t, the dataset itself) and the ethanol case (17,000 gal/d, 164.2 kg/t). They are
      the dataset's own source, so they are kept only as its uncertainty spread and not as a check.
      Read without a per-tonne make-up figure: McCollum and Ogden (2006) UCD-ITS-RR-06-14 (no cooling
      water), IPCC SRCCS (2005) ch. 3; a web search for open make-up water figures of CO2 compression
      intercooling found none stated per t of CO2.

datasets:
  - process: carbon-capture-1
    dataset: co2-conditioning-ammonia-stripper-vent
    conditions: {feed: "ammonia stripper vent, 97.09 mol% CO2, 0.16 MPa, 21 degC", delivery: "15.3 MPa, 30 degC, 99.95 mol% CO2", basis: conceptual inventory}
    kpis:
      co2-conditioning-specific-electricity:
        expression: feed:electricity / product:CO2
        per: product:CO2
        reference: mccollum-ogden-2006-compression-model
        out_of_range_reason: "0.8 % above the model value because the dataset adds the circulating-water pumps and cooling-tower fans (1.6 kWh/t), which the model leaves out. NETL's compressor alone (104.0 kWh/t, 0.16 to 15.3 MPa, TEG dryer within the train, vendor quote) is 0.8 % below the model's 0.1 to 15 MPa."
      co2-conditioning-cooling-water-makeup: {expression: resource:water / product:CO2, per: product:CO2}
