# Benchmarks of oxygenated intermediates: purified terephthalic acid, adipic acid and propylene
# oxide. Schema: schemas/benchmarks.schema.json; rules: docs/benchmarks.md. Ranges are facts
# from the cited source, in our own form.
#
# terephthalic-acid-1:
# The bound references are independent of the dataset's numbers (the dataset takes its feeds from
# patent CN105001073A, its electricity from the MIDDEN report's Table 3 and its steam from the IEA
# paper's best-practice value), but all three values sit outside their range, each with a reason.
# Read them as a statement of how far the open sources disagree, not as a validation. The IEA's PTA
# figures are recorded beside the energy KPI and not bound, because the dataset's steam is one of them.
#
# adipic-acid-1:
# Independence: the two N2O KPIs are bound to sources the datasets do not use (AP-42 for the
# generation, the EU ETS benchmark study for the abated emission). The energy KPIs record
# no_open_reference: the only open figures found are the IEA paper's, which the datasets use, and a
# check against a dataset's own source would pass by construction (as bref-lvoc-vcm-ethylene in
# chlorinated-organics.yaml). No open source with a cyclohexane or nitric acid consumption per t was
# found.
#
# propylene-oxide-1:
# Independence: the chlorine and propylene references (ANL 1980) and the calcium chloride references
# are not used by the dataset, which takes the feeds and the salt from stoichiometry with the patent's
# DCP. The effluent is bound to the patent's 43 t, not to the BREF's 40 t that the dataset uses. The
# DCP and steam KPIs record no_open_reference: their only open figures are the dataset's own sources
# (the patent's DCP range, the IEA paper's PO steam). The electricity reference (ANL 1980) is not used
# by the dataset, which takes the IEA paper's Western European PO average.
#
# Di-tert-butyl dicarbonate (di-tert-butyl-dicarbonate-1, #160; an organic dicarbonate, an
# oxygenate): no open source gives a plant's specific consumptions. The stoichiometric floors are
# 1.028 kg potassium tert-butoxide and 0.453 kg phosgene per kg (2 alkoxide + 2 CO2 + phosgene ->
# Boc2O + CO2 + 2 KCl); they are limits, not ranges of real plants, so they are not recorded as
# ones (docs/benchmarks.md: never invent a range). The one open figure, EP 0 256 559 A2 Example 1
# (149 g from 168 g of the alkoxide and 223 g of phosgene, its purity not stated in the text), is a
# single laboratory value with a phosgene excess the dataset does not use; it is discussed in
# DESIGN.md D-005, not bound here.
# benzyl-alcohol-1:
# The yield references are independent of the dataset (other patents, other applicants), but they
# are patent examples too, and neither is the dataset's technology exactly.
#
# tert-butanol-1:
# The selectivity reference is a patent (Sumitomo Chemical) that the dataset does not use: the dataset's
# by-product rate is from another applicant's patent (Nippon Oil, US 4,180,688, Example 4). The selectivity
# examples are laboratory tests, not plant data. No energy KPI has an open reference.
schema: cheme-as-code/benchmarks/v1
family: oxygenates

kpis:
  pta-px-yield:
    title: Terephthalic acid per p-xylene fed, as a share of the stoichiometric maximum
    unit: "%"
    description: >-
      Moles of terephthalic acid per mole of p-xylene, computed from the masses (166.132 and
      106.168 g/mol). A low value means p-xylene lost to residues and burnt to CO2.
    references:
      - id: midden-pta-yield
        range: [98.3, 98.9]
        basis: unallocated
        note: >-
          The report gives 98.3 % after oxidation and 98.9 % after post-oxidation, citing Zein et
          al. (2010, a Cairo University student report). It calls the first a conversion factor and
          does not say whether either is molar; the molar reading is ours. It is a yield of the
          reaction steps, not a plant's unit consumption. The same report supplies the dataset's
          electricity and steam, but not its p-xylene, so this reference is independent of the
          value it checks but not of the dataset as a whole.
        conditions: {technology: "air oxidation of p-xylene in acetic acid (Eastman-based, GPT equipment), with post-oxidation", region: EU, year: 2016}
        source:
          citation: "Tran, A. and West, K.J. (2021) Decarbonisation options for the Dutch bottle-grade PET industry. PBL Netherlands Environmental Assessment Agency and TNO (MIDDEN), PBL publication 4617"
          url: https://pbl.nl/downloads/pbl-2021-decarbonisation-options-for-the-dutch-bottle-grade-pet-industry-4617pdf
          locator: Section 2.3, pp. 13-14
          kind: government
          accessed: "2026-11-05"
  pta-specific-acetic-acid:
    title: Acetic acid consumption per t of purified terephthalic acid
    unit: t/t
    references:
      - id: lbnl-pta-acetic-acid
        range: [0.04, 0.09]
        basis: unallocated
        note: The report's literature range (its references 86 to 88, among them AP-42 6.11 and Xu and Zhu 2008); it assumes 0.05 t/t itself.
        conditions: {technology: p-xylene oxidation in acetic acid, region: global}
        source:
          citation: "Karali, N., Khanna, N., Shah, N. (2024) Climate Impact of Primary Plastic Production. Lawrence Berkeley National Laboratory, LBNL-2001585"
          url: https://eta-publications.lbl.gov/sites/default/files/climate_and_plastic_report_final.pdf
          locator: Section 2.3, p. 23
          kind: government
          accessed: "2026-11-05"
  pta-specific-energy:
    title: Electricity and steam per t of purified terephthalic acid
    unit: GJ/t
    references:
      - id: lbnl-pta-energy
        range: [5.3, 9.7]
        basis: unallocated
        note: >-
          The report's estimate of the energy intensity of PTA plants from its references 51, 82 and
          83 (IEA 2013, Azarpour et al. 2022, Marczak 2022); it assumes 7.4 GJ/t itself. It does not
          say whether the range is final or primary energy, gross or net of recovered heat, or
          whether fuel is included, so it is a loose comparison for electricity plus steam.
        conditions: {technology: PTA plants, region: global}
        source:
          citation: "Karali, N., Khanna, N., Shah, N. (2024) Climate Impact of Primary Plastic Production. Lawrence Berkeley National Laboratory, LBNL-2001585"
          url: https://eta-publications.lbl.gov/sites/default/files/climate_and_plastic_report_final.pdf
          locator: Section 2.3, p. 23
          kind: government
          accessed: "2026-11-05"
      - id: iea-2009-pta-energy
        range: [2.9, 3.4]
        basis: unallocated
        note: >-
          Electricity plus steam in final energy terms, from the best-practice value (0.3 + 2.6 GJ/t,
          Table 1, p. 15, after Meyers 2005) to the estimated current Western European average (1.7 +
          1.7 GJ/t, Table 13, p. 51, after Boustead 2002), which also has 1.6 GJ/t of fuel that this KPI
          does not count. The paper's footnote 1 to Table 1 converts final to primary energy at 90 %
          for steam and 40 % for power; in primary terms with the fuel, the average is 7.6 GJ/t. The
          route is not named. Not bound: the dataset's steam is the best-practice value.
        conditions: {technology: "PTA production, route not named", region: Western Europe, year: 2009}
        source:
          citation: "Saygin, D., Patel, M.K., Tam, C., Gielen, D.J. (2009) Chemical and Petrochemical Sector: Potential of best practice technology and other measures for improving energy efficiency. IEA Information Paper, OECD/IEA, Paris"
          url: https://iea.blob.core.windows.net/assets/c2d071e4-4142-44f1-8a41-88ece29be439/ChemicalandPetrochemicalSector.pdf
          locator: Table 1, p. 15, and Table 13, p. 51
          kind: iea
          accessed: "2026-11-05"
  aa-n2o-generation:
    title: N2O generated per t of adipic acid, before abatement
    unit: kg/t
    references:
      - id: ipcc-2006-aa-n2o-generation
        range: [270, 330]
        basis: unallocated
        note: The default of 300 kg/t with its stated +/- 10 %, which covers feeds from pure ketone to pure alcohol. The datasets take the 300 kg/t from this source, so it is not an independent check.
        conditions: {technology: "nitric acid oxidation of cyclohexanone and cyclohexanol; generation factor, before any abatement", region: global, year: 2006}
        source:
          citation: "IPCC (2006) 2006 IPCC Guidelines for National Greenhouse Gas Inventories, Volume 3 Industrial Processes and Product Use, Chapter 3 Chemical Industry Emissions"
          url: https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/3_Volume3/V3_3_Ch3_Chemical_Industry.pdf
          locator: Section 3.4.2.2, Table 3.4, p. 3.30
          kind: government
          accessed: "2026-11-05"
      - id: ap42-aa-n2o-uncontrolled
        range: [291.3, 291.3]
        basis: unallocated
        note: The sum of two uncontrolled factors, the oxidation reactor (290 kg/t, from gas analyses at two plants, rating D) and the nitric acid tank fume sweep (1.3 kg/t, one stack test, rating E). A single value, recorded as a zero-width range and not widened.
        conditions: {technology: "nitric acid oxidation of KA; uncontrolled", region: US, year: 1995}
        source:
          citation: "US EPA (1995) Compilation of Air Pollutant Emission Factors (AP-42), Fifth Edition, Volume I, Chapter 6 Organic Chemical Process Industry, Section 6.2 Adipic Acid, final section January 1995"
          url: https://19january2021snapshot.epa.gov/sites/static/files/2020-10/documents/c06s02.pdf
          locator: Table 6.2-2, p. 6.2-5
          kind: government
          accessed: "2026-11-05"
  aa-n2o-emission-abated:
    title: N2O emitted per t of adipic acid by a plant with N2O abatement
    unit: kg/t
    references:
      - id: ecofys-2009-de-aa-co2eq
        range: [18.1, 41.0]
        basis: unallocated
        note: >-
          The source gives 5.6 to 12.7 t CO2-eq per t adipic acid for the German adipic acid
          production of 2001 to 2007, with abatement (national emissions over national output).
          The text calls it one plant, but its Table 8 lists three German sites. Converted with the GWP of 310 for N2O that the same chapter uses, reading all of
          the CO2-eq as N2O, so the range is an upper bound of the N2O. The same chapter gives an
          EU-27 weighted average of 10.27 t CO2-eq/t for 2007/08 without steam and electricity
          (Table 9), about 33 kg N2O/t on the same reading.
        conditions: {technology: "KA oil oxidation with nitric acid, N2O abatement installed; yearly values 2001 to 2007", region: DE, year: 2007}
        source:
          citation: "Ecofys, Fraunhofer ISI, Öko-Institut (2009) Methodology for the free allocation of emission allowances in the EU ETS post 2012: Sector report for the chemical industry, by order of the European Commission (study contract 07.0307/2008/515770/ETU/C2)"
          url: https://climate.ec.europa.eu/document/download/b5e9cb5a-ff10-4a89-a083-e69663b708d3_en
          locator: Chapter 6, section 6.3.2, Table 10, p. 46 (GWP 310 on p. 47)
          kind: government
          accessed: "2026-11-05"
  aa-specific-steam:
    title: Steam (as heat) per t of adipic acid
    unit: kWh/t
    no_open_reference: >-
      No open source with an adipic acid steam figure independent of the datasets found (2026-11-05).
      The IEA information paper (Saygin et al. 2009) gives 18.5 GJ/t at best practice (Table 1, p. 14,
      estimated, footnote 2) and 25.7 GJ/t as the estimated current Western European average (Table 13,
      p. 50), both after Chauvel and Lefebvre (1989), that is 5139 to 7139 kWh/t; the datasets take the
      average, so binding it would be transcription only. Also read: LVOC BREF 2017 section 2.1.2.3.3, the
      EU ETS benchmark study of 2009 chapter 6 (CO2 of the steam only), EPA-450/3-91-026 and AP-42 6.2 (no
      energy figures).
  aa-specific-electricity:
    title: Electricity per t of adipic acid
    unit: kWh/t
    no_open_reference: >-
      No open source with an adipic acid electricity figure independent of the datasets found
      (2026-11-05), in the same documents as aa-specific-steam. The IEA paper gives 0.5 GJ/t at best
      practice and 1.4 GJ/t as the Western European average (139 to 389 kWh/t); the datasets take the
      average.
  aa-specific-cyclohexane:
    title: Cyclohexane consumption per t of adipic acid
    unit: kg/t
    no_open_reference: >-
      No open source with a cyclohexane or KA consumption per t of adipic acid found (2026-11-05).
      Read: LVOC BREF 2017 section 2.1.2.3.3 (no consumption data), US EPA EPA-450/3-91-026
      section 3.2.2 (yield ranges only, which the datasets use), AP-42 section 6.2 (emission factors
      only), the EU ETS benchmark study of 2009 chapter 6 (emissions only), the IEA information
      paper of 2009 (energy only). Kirk-Othmer and Ullmann's are not open access and were not read.
  aa-specific-nitric-acid:
    title: Nitric acid (100 % HNO3) consumption per t of adipic acid
    unit: kg/t
    no_open_reference: >-
      No open source with a nitric acid consumption per t of adipic acid found (2026-11-05), in the
      same documents as aa-specific-cyclohexane. The datasets' make-up is the nitrogen of the N2O
      and NOx only, a lower bound.
  po-chlorohydrin-specific-chlorine:
    title: Chlorine consumption per t of propylene oxide, chlorohydrin process
    unit: t/t
    references:
      - id: anl-1980-po-chlorohydrin-chlorine
        range: [1.59, 1.59]
        basis: unallocated
        note: One value, 1.59 lb per lb of PO, recorded as a zero-width range and not widened. The report takes it from Brownstein (1976).
        conditions: {technology: "chlorohydrin process with lime", region: US, year: 1976}
        source: &anl
          citation: "Gaines, L.L. and Shen, S.Y. (1980) Energy and Materials Flows in the Production of Olefins and Their Derivatives. Argonne National Laboratory, ANL/CNSV-9, for the US Department of Energy"
          url: https://www.osti.gov/servlets/purl/7013430
          locator: Section 4.3.2.2, Fig. 4.58, p. 154
          kind: government
          accessed: "2026-11-05"
  po-chlorohydrin-specific-propylene:
    title: Propylene consumption per t of propylene oxide, chlorohydrin process
    unit: t/t
    references:
      - id: anl-1980-po-chlorohydrin-propylene
        range: [0.94, 0.94]
        basis: unallocated
        note: One value, 0.94 lb per lb of PO, recorded as a zero-width range and not widened. The report takes it from Brownstein (1976).
        conditions: {technology: "chlorohydrin process with lime", region: US, year: 1976}
        source: *anl
  po-chlorohydrin-calcium-chloride:
    title: Calcium chloride in the effluent per t of propylene oxide
    unit: t/t
    references:
      - id: us4560451-po-cacl2
        range: [2.0, 2.0]
        basis: unallocated
        note: "'Typically 2 tons' per ton of PO, a rounded value, recorded as a zero-width range."
        conditions: {technology: "conventional chlorohydrin process with lime slurry", region: US, year: 1983}
        source: &patent
          citation: "Nielsen, K.A. (Union Carbide Corp.) Electrolytic process for the production of alkene oxides. US patent 4,560,451, granted 1985-12-24"
          url: https://patents.google.com/patent/US4560451A/en
          locator: Description of the prior art
          kind: other
          accessed: "2026-11-05"
      - id: bref-lvoc-po-chloride-salts
        range: [2.0, 2.0]
        basis: unallocated
        note: "'Approximately 2 tonnes of chloride salts' per tonne of PO; the salt is not named, CaCl2 is our reading for the lime process."
        conditions: {technology: chlorohydrin process, region: EU}
        source: &bref
          citation: "Falcke, H. et al. (2017) Best Available Techniques (BAT) Reference Document for the Production of Large Volume Organic Chemicals. JRC Science for Policy Report EUR 28882 EN, doi:10.2760/77304"
          url: https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/JRC109279_LVOC_Bref.pdf
          locator: Section 2.1.2.8, p. 29
          kind: bref
          accessed: "2026-11-05"
  po-chlorohydrin-wastewater:
    title: Waste water per t of propylene oxide, chlorohydrin process
    unit: t/t
    references:
      - id: us4560451-po-wastewater
        range: [43, 43]
        basis: unallocated
        note: "'Typically' 43 tons per ton of PO, carrying the 2 t of calcium chloride; a single value."
        conditions: {technology: "conventional chlorohydrin process with lime slurry", region: US, year: 1983}
        source: *patent
      - id: bref-lvoc-po-wastewater
        range: [40, 40]
        basis: unallocated
        note: "'Approximately 40 tonnes', the dataset's own source, so not an independent check. Table 2.5 (p. 67) puts the 2011 installations in the class above 10 m3/t."
        conditions: {technology: chlorohydrin process, region: EU}
        source: *bref
  po-chlorohydrin-dcp:
    title: 1,2-Dichloropropane by-product per t of propylene oxide
    unit: t/t
    no_open_reference: >-
      No open source with a DCP figure independent of the dataset found (2026-11-05). US 4,560,451
      (description of the prior art) gives 0.1 to 0.2 t per t for the conventional lime process, the
      dataset's own source, whose midpoint it takes. ANL/CNSV-9 (1980, Fig. 4.58) states no by-product;
      its chlorine and propylene figures imply about 0.58 t of by-products per t (README), which is a
      reading, not a stated value. The LVOC BREF 2017 section 2.1.2.8 gives no DCP figure.
  po-chlorohydrin-specific-steam:
    title: Steam (as heat) per t of propylene oxide, chlorohydrin process
    unit: kWh/t
    no_open_reference: >-
      No open source with a steam figure for the chlorohydrin process independent of the dataset found
      (2026-11-05). The IEA information paper (Saygin et al. 2009) gives 18.0 GJ/t as the Western European
      average for propylene oxide (Table 13, p. 51, route not named) and 14.2 GJ/t at best practice (Table
      1, p. 15, estimated as 20 % below), that is 3944 to 5000 kWh/t; the dataset takes the average, so
      binding it would be transcription only. ANL/CNSV-9 (1980, Fig. 4.58) shows no steam input (see
      po-chlorohydrin-specific-electricity). The sensible heat of the brine, about 2322 kWh/t, is a lower
      bound by first principles, not a reference. Also read: LVOC BREF 2017 section 2.1.2.8 and US 4,560,451
      (no energy figures).
  po-chlorohydrin-specific-electricity:
    title: Electricity per t of propylene oxide, chlorohydrin process
    unit: kWh/t
    references:
      - id: anl-1980-po-chlorohydrin-energy
        range: [3990, 3990]
        basis: unallocated
        note: "One value, 18,700 Btu per lb of PO, the figure's only process-energy input, labelled electricity, in primary terms at the report's 33 % generating efficiency (section 4.1, p. 71). Converted to delivered electricity: 18,700 x 0.33 Btu/lb x 2.326 kJ/kg per Btu/lb / 3.6 MJ/kWh = about 3,990 kWh/t, rounded. The figure shows no separate steam input although the process is steam-heated and steam-stripped (p. 151), so it may cover all utilities. The report takes it from Brownstein (1976)."
        conditions: {technology: "chlorohydrin process with lime", region: US, year: 1976}
        source: *anl
  boc2o-specific-potassium-tert-butoxide:
    title: Potassium tert-butoxide consumption per kg of di-tert-butyl dicarbonate
    unit: kg/kg
    no_open_reference: "No open source with a plant's or a pilot's alkoxide use per kg of Boc2O found (searched 2026-11-06: Google Patents EP 0 256 559 A2 and US 5 151 542 A read, laboratory examples only; Wikipedia, Di-tert-butyl dicarbonate, routes without figures; web search for Boc2O production consumption figures, none found). EP 0 256 559 A2 Example 1 implies 1.13 kg/kg (168 g for 149 g, its purity not stated), US 5 151 542 A Example 1 about 1.18 kg/kg on its methanesulfonyl chloride route (3 mol for 285.8 g at 87 %), single values; the stoichiometric floor is 1.028 kg/kg."
  boc2o-specific-phosgene:
    title: Phosgene consumption per kg of di-tert-butyl dicarbonate
    unit: kg/kg
    no_open_reference: "No open source with a plant's phosgene use per kg of Boc2O found (searched 2026-11-06 as for boc2o-specific-potassium-tert-butoxide); EP 0 256 559 A2 uses 0.54 to 1.5 mol per mol of the alkoxide in its examples (1.5 in Example 1, 1.50 kg/kg on its 149 g), laboratory ratios. Only the stoichiometric floor, 0.453 kg/kg, is known."
  benzyl-alcohol-yield:
    title: Benzyl alcohol yield on benzyl chloride, fraction of theory
    unit: kg/kg
    references:
      - id: cs216044-continuous-soda-cascade
        range: [0.950, 0.955]
        basis: unallocated
        note: >-
          The total yields of the patent's two soda examples (95.5 % at 95 to 98 degC, atmospheric;
          95.0 % at 112 to 115 degC and 0.15 to 0.16 MPa), recorded as the span of the two stated values, not widened. Read
          in the machine translation of Google Patents.
        conditions: {technology: "continuous cascade of two stirred, jacketed vessels, 9.75 wt% soda solution, no inert solvent", capacity: "pilot, two 20 l vessels", region: CZ, year: 1982}
        source:
          citation: "Czechoslovak patent CS 216044 B1 (filed 1979-10-22, published 1982-10-29), Method of continuous preparation of benzyl alcohol"
          url: https://patents.google.com/patent/CS216044B1/en
          locator: Examples 1 and 2
          kind: other
          accessed: "2026-11-05"
      - id: us5750801-continuous-water-hydrolysis
        range: [0.94, 0.96]
        basis: unallocated
        note: The patent's stated yield of its worked example, without and with recovery of the alcohol in the residue. A different route (water only, no base, HCl as by-product).
        conditions: {technology: "continuous hydrolysis with water only, 5-tank cascade, 130 degC, 10 bar, 60 % conversion with benzyl chloride recycle", capacity: "not stated (parts per hour)", year: 1998}
        source:
          citation: "Buysch, H.-J. et al. (Bayer AG) (1998) Process for the continuous preparation of benzyl alcohol. US patent 5,750,801"
          url: https://patents.google.com/patent/US5750801A/en
          locator: Example
          kind: other
          accessed: "2026-11-05"
  benzyl-alcohol-specific-heat:
    title: Heat (steam) per t of benzyl alcohol
    unit: kWh/t
    no_open_reference: >-
      No open source independent of the dataset's with a benzyl alcohol heat or steam figure was found
      (2026-11-05). Read: US 5,750,801 and CS 216044 B1 (no energy figures), IPCC 2006 Vol. 3 ch. 2
      (process CO2 only), the EU LVOC BREF 2017 (doi:10.2760/77304; no benzyl alcohol section). Not
      read: Ullmann's chapter on benzyl alcohol (licensed). The dataset's value is EP 0 064 486 A1,
      Table 3, a pilot figure.
  tba-isobutene-selectivity:
    title: Selectivity of the isobutene converted to tert-butanol (molar)
    unit: "%"
    references:
      - id: us4307257-tba-selectivity
        range: [97.3, 99.8]
        basis: unallocated
        note: >-
          The lowest and highest of the four examples according to the invention (Examples 1 to 4);
          the comparative examples are left out. The patent does not say whether the selectivity is
          molar; molar is our reading. A single-reactor test with a C4 raffinate feed.
        conditions: {technology: "fixed bed of sulfonic-acid cation-exchange resin (Duolite ES-26), 70 degC, 16 kg/cm2, homogeneous TBA/water/C4 feed", product: tert-butanol, year: 1981}
        source:
          citation: "US 4,307,257 A (1981) Process for production of tertiary butyl alcohol. Sumitomo Chemical Co Ltd (Sada, M., Kato, M., Mori, Y., Sano, M.)"
          url: https://patents.google.com/patent/US4307257A/en
          locator: Examples 1 to 4, Table 2
          kind: other
          accessed: "2026-11-05"
  tba-specific-electricity:
    title: Electricity per t of tert-butanol
    unit: kWh/t
    no_open_reference: >-
      No usable open source with a tert-butanol electricity figure found (2026-11-05). Read: LVOC BREF 2017
      section 2.1.2.1.8 (routes only, "endothermic process", no figure); patents US 7,179,948 B2,
      US 7,002,050 B2, US 7,115,787 B2, US 7,709,690 B2, US 4,180,688 A and US 4,307,257 A (no utility
      figures). Web searches for open simulation studies with reboiler duties found only abstracts
      and theses that could not be read. One abstract was read and not used: a student preliminary design
      (Universitas Muhammadiyah Surakarta, eprints.ums.ac.id/47175, 80 kt/a, bubble reactor) states 321.62 kW
      of electricity, about 32 kWh/t at 330 d/a; its isobutylene use is below stoichiometry and the route
      differs, so it is not a reference. The dataset's value is core's Tier 0 default, ASSUMED.
  tba-specific-heat:
    title: Heat per t of tert-butanol
    unit: kWh/t
    no_open_reference: >-
      No usable open source with a tert-butanol heat or steam figure found (2026-11-05); the same sources as
      for electricity were read. The student design named under electricity states 9388 kg/h of steam,
      about 0.93 t per t TBA at 330 d/a; it is not used, for the reasons given there. The dataset's value
      is core's Tier 0 default heat from fossil fuel, ASSUMED.

datasets:
  - process: terephthalic-acid-1
    dataset: pta-px-air-oxidation
    conditions: {technology: "air oxidation in acetic acid with hydropurification", basis: conceptual inventory}
    kpis:
      pta-px-yield:
        expression: product:terephthalic-acid / feed:p-xylene * 106.168 / 166.132
        reference: midden-pta-yield
