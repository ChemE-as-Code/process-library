# Benchmarks of oxygenated intermediates: purified terephthalic acid, adipic acid and propylene
# oxide, and vinyl acetate (vinyl-acetate-1: the ethylene KPI is bound to the reactor
# selectivity of the patent the dataset takes its own selectivity from, so it tests the plant's
# losses beside the reactor, not new data; the acetic acid KPI has no open reference), and MTBE
# (mtbe-1: the isobutene KPI is bound to the industrial and Nijhuis et al.'s conversions that
# the dataset's source reports beside its own model's; the methanol KPI has no open reference). Schema: schemas/benchmarks.schema.json; rules: docs/benchmarks.md. Ranges are facts
# from the cited source, in our own form.
#
# terephthalic-acid-1:
# The bound references are independent of the dataset's numbers (the dataset takes its feeds from
# patent CN105001073A, its electricity from the MIDDEN report's Table 3 and its steam from the IEA
# paper's best-practice value), but all three values sit outside their range, each with a reason.
# Read them as a statement of how far the open sources disagree, not as a validation. The IEA's PTA
# figures are recorded beside the energy KPI and not bound, because the dataset's steam is one of them.
#
# adipic-acid-1:
# Independence: the two N2O KPIs are bound to sources the datasets do not use (AP-42 for the
# generation, the EU ETS benchmark study for the abated emission). The energy KPIs record
# no_open_reference: the only open figures found are the IEA paper's, which the datasets use, and a
# check against a dataset's own source would pass by construction (as bref-lvoc-vcm-ethylene in
# chlorinated-organics.yaml). No open source with a cyclohexane or nitric acid consumption per t was
# found.
#
# propylene-oxide-1:
# Independence: the chlorine and propylene references (ANL 1980) and the calcium chloride references
# are not used by the dataset, which takes the feeds and the salt from stoichiometry with the patent's
# DCP. The effluent is bound to the patent's 43 t, not to the BREF's 40 t that the dataset uses. The
# DCP and steam KPIs record no_open_reference: their only open figures are the dataset's own sources
# (the patent's DCP range, the IEA paper's PO steam). The electricity reference (ANL 1980) is not used
# by the dataset, which takes the IEA paper's Western European PO average.
#
# Di-tert-butyl dicarbonate (di-tert-butyl-dicarbonate-1, #160; an organic dicarbonate, an
# oxygenate): no open source gives a plant's specific consumptions. The stoichiometric floors are
# 1.028 kg potassium tert-butoxide and 0.453 kg phosgene per kg (2 alkoxide + 2 CO2 + phosgene ->
# Boc2O + CO2 + 2 KCl); they are limits, not ranges of real plants, so they are not recorded as
# ones (docs/benchmarks.md: never invent a range). The one open figure, EP 0 256 559 A2 Example 1
# (149 g from 168 g of the alkoxide and 223 g of phosgene, its purity not stated in the text), is a
# single laboratory value with a phosgene excess the dataset does not use; it is discussed in
# DESIGN.md D-005, not bound here.
# benzyl-alcohol-1:
# The yield references are independent of the dataset (other patents, other applicants), but they
# are patent examples too, and neither is the dataset's technology exactly.
#
# potassium-tert-butoxide-1 (#418; an alkoxide, filed with its alcohol among the oxygenates): no
# open source gives a plant's specific consumptions; the stoichiometric floors (0.3484 kg
# potassium and 0.6606 kg tert-butanol per kg) are limits, not ranges, and are not recorded as
# references (docs/benchmarks.md).
#
# acetylsalicylic-acid-1 (#476; aspirin, an acetylated aromatic acid, filed among the
# oxygenates): the salicylic acid reference is the patent example the dataset takes its charge and
# solubility from, so it is not independent; the Dow yields are another applicant's, counted as
# tablet-grade crystals only. The anhydride records no_open_reference.
#
# tert-butanol-1:
# The selectivity reference is a patent (Sumitomo Chemical) that the dataset does not use: the dataset's
# by-product rate is from another applicant's patent (Nippon Oil, US 4,180,688, Example 4). The selectivity
# examples are laboratory tests, not plant data. No energy KPI has an open reference.
#
# acrylic-acid-1 (#475): the propylene reference is the reactors' yield in two Mitsubishi patents'
# examples. It is not independent of the dataset, which takes its yields from US 4 873 368 A's
# Example 5, and it leaves out the losses of the separation (the dataset's whole-plant figure sits
# inside it). The steam KPIs record no_open_reference (searched 2026-11-19, DESIGN.md source
# register and D-012).
#
# salicylic-acid-1 (#507; a hydroxy acid, filed among the oxygenates): benchmarks must be
# independent of the dataset (docs/benchmarks.md). The dataset takes its charge, CO2 dose and
# conversion from US 4 376 867 A, Example I, and its water from the same patent's background (8 to
# 10 t per t of sodium salicylate), so neither binds it; the suspension route of Mohammad et al.
# (Molecules 2024) gives a laboratory molar yield for another variant (92.68 %), not a plant's
# consumption. The stoichiometric floor of the phenol, 0.681 kg/kg, is a limit, not a range.
schema: cheme-as-code/benchmarks/v1
family: oxygenates

kpis:
  pta-px-yield:
    title: Terephthalic acid per p-xylene fed, as a share of the stoichiometric maximum
    unit: "%"
    description: >-
      Moles of terephthalic acid per mole of p-xylene, computed from the masses (166.132 and
      106.168 g/mol). A low value means p-xylene lost to residues and burnt to CO2.
    references:
      - id: midden-pta-yield
        range: [98.3, 98.9]
        basis: unallocated
        note: >-
          The report gives 98.3 % after oxidation and 98.9 % after post-oxidation, citing Zein et
          al. (2010, a Cairo University student report). It calls the first a conversion factor and
          does not say whether either is molar; the molar reading is ours. It is a yield of the
          reaction steps, not a plant's unit consumption. The same report supplies the dataset's
          electricity and steam, but not its p-xylene, so this reference is independent of the
          value it checks but not of the dataset as a whole.
        conditions: {technology: "air oxidation of p-xylene in acetic acid (Eastman-based, GPT equipment), with post-oxidation", region: EU, year: 2016}
        source:
          citation: "Tran, A. and West, K.J. (2021) Decarbonisation options for the Dutch bottle-grade PET industry. PBL Netherlands Environmental Assessment Agency and TNO (MIDDEN), PBL publication 4617"
          url: https://pbl.nl/downloads/pbl-2021-decarbonisation-options-for-the-dutch-bottle-grade-pet-industry-4617pdf
          locator: Section 2.3, pp. 13-14
          kind: government
          accessed: "2026-11-05"
  pta-specific-acetic-acid:
    title: Acetic acid consumption per t of purified terephthalic acid
    unit: t/t
    references:
      - id: lbnl-pta-acetic-acid
        range: [0.04, 0.09]
        basis: unallocated
        note: The report's literature range (its references 86 to 88, among them AP-42 6.11 and Xu and Zhu 2008); it assumes 0.05 t/t itself.
        conditions: {technology: p-xylene oxidation in acetic acid, region: global}
        source:
          citation: "Karali, N., Khanna, N., Shah, N. (2024) Climate Impact of Primary Plastic Production. Lawrence Berkeley National Laboratory, LBNL-2001585"
          url: https://eta-publications.lbl.gov/sites/default/files/climate_and_plastic_report_final.pdf
          locator: Section 2.3, p. 23
          kind: government
          accessed: "2026-11-05"
  pta-specific-energy:
    title: Electricity and steam per t of purified terephthalic acid
    unit: GJ/t
    references:
      - id: lbnl-pta-energy
        range: [5.3, 9.7]
        basis: unallocated
        note: >-
          The report's estimate of the energy intensity of PTA plants from its references 51, 82 and
          83 (IEA 2013, Azarpour et al. 2022, Marczak 2022); it assumes 7.4 GJ/t itself. It does not
          say whether the range is final or primary energy, gross or net of recovered heat, or
          whether fuel is included, so it is a loose comparison for electricity plus steam.
        conditions: {technology: PTA plants, region: global}
        source:
          citation: "Karali, N., Khanna, N., Shah, N. (2024) Climate Impact of Primary Plastic Production. Lawrence Berkeley National Laboratory, LBNL-2001585"
          url: https://eta-publications.lbl.gov/sites/default/files/climate_and_plastic_report_final.pdf
          locator: Section 2.3, p. 23
          kind: government
          accessed: "2026-11-05"
      - id: iea-2009-pta-energy
        range: [2.9, 3.4]
        basis: unallocated
        note: >-
          Electricity plus steam in final energy terms, from the best-practice value (0.3 + 2.6 GJ/t,
          Table 1, p. 15, after Meyers 2005) to the estimated current Western European average (1.7 +
          1.7 GJ/t, Table 13, p. 51, after Boustead 2002), which also has 1.6 GJ/t of fuel that this KPI
          does not count. The paper's footnote 1 to Table 1 converts final to primary energy at 90 %
          for steam and 40 % for power; in primary terms with the fuel, the average is 7.6 GJ/t. The
          route is not named. Not bound: the dataset's steam is the best-practice value.
        conditions: {technology: "PTA production, route not named", region: Western Europe, year: 2009}
        source:
          citation: "Saygin, D., Patel, M.K., Tam, C., Gielen, D.J. (2009) Chemical and Petrochemical Sector: Potential of best practice technology and other measures for improving energy efficiency. IEA Information Paper, OECD/IEA, Paris"
          url: https://iea.blob.core.windows.net/assets/c2d071e4-4142-44f1-8a41-88ece29be439/ChemicalandPetrochemicalSector.pdf
          locator: Table 1, p. 15, and Table 13, p. 51
          kind: iea
          accessed: "2026-11-05"
  aa-n2o-generation:
    title: N2O generated per t of adipic acid, before abatement
    unit: kg/t
    references:
      - id: ipcc-2006-aa-n2o-generation
        range: [270, 330]
        basis: unallocated
        note: The default of 300 kg/t with its stated +/- 10 %, which covers feeds from pure ketone to pure alcohol. The datasets take the 300 kg/t from this source, so it is not an independent check.
        conditions: {technology: "nitric acid oxidation of cyclohexanone and cyclohexanol; generation factor, before any abatement", region: global, year: 2006}
        source:
          citation: "IPCC (2006) 2006 IPCC Guidelines for National Greenhouse Gas Inventories, Volume 3 Industrial Processes and Product Use, Chapter 3 Chemical Industry Emissions"
          url: https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/3_Volume3/V3_3_Ch3_Chemical_Industry.pdf
          locator: Section 3.4.2.2, Table 3.4, p. 3.30
          kind: government
          accessed: "2026-11-05"
      - id: ap42-aa-n2o-uncontrolled
        range: [291.3, 291.3]
        basis: unallocated
        note: The sum of two uncontrolled factors, the oxidation reactor (290 kg/t, from gas analyses at two plants, rating D) and the nitric acid tank fume sweep (1.3 kg/t, one stack test, rating E). A single value, recorded as a zero-width range and not widened.
        conditions: {technology: "nitric acid oxidation of KA; uncontrolled", region: US, year: 1995}
        source:
          citation: "US EPA (1995) Compilation of Air Pollutant Emission Factors (AP-42), Fifth Edition, Volume I, Chapter 6 Organic Chemical Process Industry, Section 6.2 Adipic Acid, final section January 1995"
          url: https://19january2021snapshot.epa.gov/sites/static/files/2020-10/documents/c06s02.pdf
          locator: Table 6.2-2, p. 6.2-5
          kind: government
          accessed: "2026-11-05"
  aa-n2o-emission-abated:
    title: N2O emitted per t of adipic acid by a plant with N2O abatement
    unit: kg/t
    references:
      - id: ecofys-2009-de-aa-co2eq
        range: [18.1, 41.0]
        basis: unallocated
        note: >-
          The source gives 5.6 to 12.7 t CO2-eq per t adipic acid for the German adipic acid
          production of 2001 to 2007, with abatement (national emissions over national output).
          The text calls it one plant, but its Table 8 lists three German sites. Converted with the GWP of 310 for N2O that the same chapter uses, reading all of
          the CO2-eq as N2O, so the range is an upper bound of the N2O. The same chapter gives an
          EU-27 weighted average of 10.27 t CO2-eq/t for 2007/08 without steam and electricity
          (Table 9), about 33 kg N2O/t on the same reading.
        conditions: {technology: "KA oil oxidation with nitric acid, N2O abatement installed; yearly values 2001 to 2007", region: DE, year: 2007}
        source:
          citation: "Ecofys, Fraunhofer ISI, Öko-Institut (2009) Methodology for the free allocation of emission allowances in the EU ETS post 2012: Sector report for the chemical industry, by order of the European Commission (study contract 07.0307/2008/515770/ETU/C2)"
          url: https://climate.ec.europa.eu/document/download/b5e9cb5a-ff10-4a89-a083-e69663b708d3_en
          locator: Chapter 6, section 6.3.2, Table 10, p. 46 (GWP 310 on p. 47)
          kind: government
          accessed: "2026-11-05"
  aa-specific-steam:
    title: Steam (as heat) per t of adipic acid
    unit: kWh/t
    no_open_reference: >-
      No open source with an adipic acid steam figure independent of the datasets found (2026-11-05).
      The IEA information paper (Saygin et al. 2009) gives 18.5 GJ/t at best practice (Table 1, p. 14,
      estimated, footnote 2) and 25.7 GJ/t as the estimated current Western European average (Table 13,
      p. 50), both after Chauvel and Lefebvre (1989), that is 5139 to 7139 kWh/t; the datasets take the
      average, so binding it would be transcription only. Also read: LVOC BREF 2017 section 2.1.2.3.3, the
      EU ETS benchmark study of 2009 chapter 6 (CO2 of the steam only), EPA-450/3-91-026 and AP-42 6.2 (no
      energy figures).
  aa-specific-electricity:
    title: Electricity per t of adipic acid
    unit: kWh/t
    no_open_reference: >-
      No open source with an adipic acid electricity figure independent of the datasets found
      (2026-11-05), in the same documents as aa-specific-steam. The IEA paper gives 0.5 GJ/t at best
      practice and 1.4 GJ/t as the Western European average (139 to 389 kWh/t); the datasets take the
      average.
  aa-specific-cyclohexane:
    title: Cyclohexane consumption per t of adipic acid
    unit: kg/t
    no_open_reference: >-
      No open source with a cyclohexane or KA consumption per t of adipic acid found (2026-11-05).
      Read: LVOC BREF 2017 section 2.1.2.3.3 (no consumption data), US EPA EPA-450/3-91-026
      section 3.2.2 (yield ranges only, which the datasets use), AP-42 section 6.2 (emission factors
      only), the EU ETS benchmark study of 2009 chapter 6 (emissions only), the IEA information
      paper of 2009 (energy only). Kirk-Othmer and Ullmann's are not open access and were not read.
  aa-specific-nitric-acid:
    title: Nitric acid (100 % HNO3) consumption per t of adipic acid
    unit: kg/t
    no_open_reference: >-
      No open source with a nitric acid consumption per t of adipic acid found (2026-11-05), in the
      same documents as aa-specific-cyclohexane. The datasets' make-up is the nitrogen of the N2O
      and NOx only, a lower bound.
  po-chlorohydrin-specific-chlorine:
    title: Chlorine consumption per t of propylene oxide, chlorohydrin process
    unit: t/t
    references:
      - id: anl-1980-po-chlorohydrin-chlorine
        range: [1.59, 1.59]
        basis: unallocated
        note: One value, 1.59 lb per lb of PO, recorded as a zero-width range and not widened. The report takes it from Brownstein (1976).
        conditions: {technology: "chlorohydrin process with lime", region: US, year: 1976}
        source: &anl
          citation: "Gaines, L.L. and Shen, S.Y. (1980) Energy and Materials Flows in the Production of Olefins and Their Derivatives. Argonne National Laboratory, ANL/CNSV-9, for the US Department of Energy"
          url: https://www.osti.gov/servlets/purl/7013430
          locator: Section 4.3.2.2, Fig. 4.58, p. 154
          kind: government
          accessed: "2026-11-05"
  po-chlorohydrin-specific-propylene:
    title: Propylene consumption per t of propylene oxide, chlorohydrin process
    unit: t/t
    references:
      - id: anl-1980-po-chlorohydrin-propylene
        range: [0.94, 0.94]
        basis: unallocated
        note: One value, 0.94 lb per lb of PO, recorded as a zero-width range and not widened. The report takes it from Brownstein (1976).
        conditions: {technology: "chlorohydrin process with lime", region: US, year: 1976}
        source: *anl
  po-chlorohydrin-calcium-chloride:
    title: Calcium chloride in the effluent per t of propylene oxide
    unit: t/t
    references:
      - id: us4560451-po-cacl2
        range: [2.0, 2.0]
        basis: unallocated
        note: "'Typically 2 tons' per ton of PO, a rounded value, recorded as a zero-width range."
        conditions: {technology: "conventional chlorohydrin process with lime slurry", region: US, year: 1983}
        source: &patent
          citation: "Nielsen, K.A. (Union Carbide Corp.) Electrolytic process for the production of alkene oxides. US patent 4,560,451, granted 1985-12-24"
          url: https://patents.google.com/patent/US4560451A/en
          locator: Description of the prior art
          kind: other
          accessed: "2026-11-05"
      - id: bref-lvoc-po-chloride-salts
        range: [2.0, 2.0]
        basis: unallocated
        note: "'Approximately 2 tonnes of chloride salts' per tonne of PO; the salt is not named, CaCl2 is our reading for the lime process."
        conditions: {technology: chlorohydrin process, region: EU}
        source: &bref
          citation: "Falcke, H. et al. (2017) Best Available Techniques (BAT) Reference Document for the Production of Large Volume Organic Chemicals. JRC Science for Policy Report EUR 28882 EN, doi:10.2760/77304"
          url: https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/JRC109279_LVOC_Bref.pdf
          locator: Section 2.1.2.8, p. 29
          kind: bref
          accessed: "2026-11-05"
  po-chlorohydrin-wastewater:
    title: Waste water per t of propylene oxide, chlorohydrin process
    unit: t/t
    references:
      - id: us4560451-po-wastewater
        range: [43, 43]
        basis: unallocated
        note: "'Typically' 43 tons per ton of PO, carrying the 2 t of calcium chloride; a single value."
        conditions: {technology: "conventional chlorohydrin process with lime slurry", region: US, year: 1983}
        source: *patent
      - id: bref-lvoc-po-wastewater
        range: [40, 40]
        basis: unallocated
        note: "'Approximately 40 tonnes', the dataset's own source, so not an independent check. Table 2.5 (p. 67) puts the 2011 installations in the class above 10 m3/t."
        conditions: {technology: chlorohydrin process, region: EU}
        source: *bref
  po-chlorohydrin-dcp:
    title: 1,2-Dichloropropane by-product per t of propylene oxide
    unit: t/t
    no_open_reference: >-
      No open source with a DCP figure independent of the dataset found (2026-11-05). US 4,560,451
      (description of the prior art) gives 0.1 to 0.2 t per t for the conventional lime process, the
      dataset's own source, whose midpoint it takes. ANL/CNSV-9 (1980, Fig. 4.58) states no by-product;
      its chlorine and propylene figures imply about 0.58 t of by-products per t (README), which is a
      reading, not a stated value. The LVOC BREF 2017 section 2.1.2.8 gives no DCP figure.
  po-chlorohydrin-specific-steam:
    title: Steam (as heat) per t of propylene oxide, chlorohydrin process
    unit: kWh/t
    no_open_reference: >-
      No open source with a steam figure for the chlorohydrin process independent of the dataset found
      (2026-11-05). The IEA information paper (Saygin et al. 2009) gives 18.0 GJ/t as the Western European
      average for propylene oxide (Table 13, p. 51, route not named) and 14.2 GJ/t at best practice (Table
      1, p. 15, estimated as 20 % below), that is 3944 to 5000 kWh/t; the dataset takes the average, so
      binding it would be transcription only. ANL/CNSV-9 (1980, Fig. 4.58) shows no steam input (see
      po-chlorohydrin-specific-electricity). The sensible heat of the brine, about 2322 kWh/t, is a lower
      bound by first principles, not a reference. Also read: LVOC BREF 2017 section 2.1.2.8 and US 4,560,451
      (no energy figures).
  po-chlorohydrin-specific-electricity:
    title: Electricity per t of propylene oxide, chlorohydrin process
    unit: kWh/t
    references:
      - id: anl-1980-po-chlorohydrin-energy
        range: [3990, 3990]
        basis: unallocated
        note: "One value, 18,700 Btu per lb of PO, the figure's only process-energy input, labelled electricity, in primary terms at the report's 33 % generating efficiency (section 4.1, p. 71). Converted to delivered electricity: 18,700 x 0.33 Btu/lb x 2.326 kJ/kg per Btu/lb / 3.6 MJ/kWh = about 3,990 kWh/t, rounded. The figure shows no separate steam input although the process is steam-heated and steam-stripped (p. 151), so it may cover all utilities. The report takes it from Brownstein (1976)."
        conditions: {technology: "chlorohydrin process with lime", region: US, year: 1976}
        source: *anl
  boc2o-specific-potassium-tert-butoxide:
    title: Potassium tert-butoxide consumption per kg of di-tert-butyl dicarbonate
    unit: kg/kg
    no_open_reference: "No open source with a plant's or a pilot's alkoxide use per kg of Boc2O found (searched 2026-11-06: Google Patents EP 0 256 559 A2 and US 5 151 542 A read, laboratory examples only; Wikipedia, Di-tert-butyl dicarbonate, routes without figures; web search for Boc2O production consumption figures, none found). EP 0 256 559 A2 Example 1 implies 1.13 kg/kg (168 g for 149 g, its purity not stated), US 5 151 542 A Example 1 about 1.18 kg/kg on its methanesulfonyl chloride route (3 mol for 285.8 g at 87 %), single values; the stoichiometric floor is 1.028 kg/kg."
  boc2o-specific-phosgene:
    title: Phosgene consumption per kg of di-tert-butyl dicarbonate
    unit: kg/kg
    no_open_reference: "No open source with a plant's phosgene use per kg of Boc2O found (searched 2026-11-06 as for boc2o-specific-potassium-tert-butoxide); EP 0 256 559 A2 uses 0.54 to 1.5 mol per mol of the alkoxide in its examples (1.5 in Example 1, 1.50 kg/kg on its 149 g), laboratory ratios. Only the stoichiometric floor, 0.453 kg/kg, is known."
  benzyl-alcohol-yield:
    title: Benzyl alcohol yield on benzyl chloride, fraction of theory
    unit: kg/kg
    references:
      - id: cs216044-continuous-soda-cascade
        range: [0.950, 0.955]
        basis: unallocated
        note: >-
          The total yields of the patent's two soda examples (95.5 % at 95 to 98 degC, atmospheric;
          95.0 % at 112 to 115 degC and 0.15 to 0.16 MPa), recorded as the span of the two stated values, not widened. Read
          in the machine translation of Google Patents.
        conditions: {technology: "continuous cascade of two stirred, jacketed vessels, 9.75 wt% soda solution, no inert solvent", capacity: "pilot, two 20 l vessels", region: CZ, year: 1982}
        source:
          citation: "Czechoslovak patent CS 216044 B1 (filed 1979-10-22, published 1982-10-29), Method of continuous preparation of benzyl alcohol"
          url: https://patents.google.com/patent/CS216044B1/en
          locator: Examples 1 and 2
          kind: other
          accessed: "2026-11-05"
      - id: us5750801-continuous-water-hydrolysis
        range: [0.94, 0.96]
        basis: unallocated
        note: The patent's stated yield of its worked example, without and with recovery of the alcohol in the residue. A different route (water only, no base, HCl as by-product).
        conditions: {technology: "continuous hydrolysis with water only, 5-tank cascade, 130 degC, 10 bar, 60 % conversion with benzyl chloride recycle", capacity: "not stated (parts per hour)", year: 1998}
        source:
          citation: "Buysch, H.-J. et al. (Bayer AG) (1998) Process for the continuous preparation of benzyl alcohol. US patent 5,750,801"
          url: https://patents.google.com/patent/US5750801A/en
          locator: Example
          kind: other
          accessed: "2026-11-05"
  benzyl-alcohol-specific-heat:
    title: Heat (steam) per t of benzyl alcohol
    unit: kWh/t
    no_open_reference: >-
      No open source independent of the dataset's with a benzyl alcohol heat or steam figure was found
      (2026-11-05). Read: US 5,750,801 and CS 216044 B1 (no energy figures), IPCC 2006 Vol. 3 ch. 2
      (process CO2 only), the EU LVOC BREF 2017 (doi:10.2760/77304; no benzyl alcohol section). Not
      read: Ullmann's chapter on benzyl alcohol (licensed). The dataset's value is EP 0 064 486 A1,
      Table 3, a pilot figure.
  tba-isobutene-selectivity:
    title: Selectivity of the isobutene converted to tert-butanol (molar)
    unit: "%"
    references:
      - id: us4307257-tba-selectivity
        range: [97.3, 99.8]
        basis: unallocated
        note: >-
          The lowest and highest of the four examples according to the invention (Examples 1 to 4);
          the comparative examples are left out. The patent does not say whether the selectivity is
          molar; molar is our reading. A single-reactor test with a C4 raffinate feed.
        conditions: {technology: "fixed bed of sulfonic-acid cation-exchange resin (Duolite ES-26), 70 degC, 16 kg/cm2, homogeneous TBA/water/C4 feed", product: tert-butanol, year: 1981}
        source:
          citation: "US 4,307,257 A (1981) Process for production of tertiary butyl alcohol. Sumitomo Chemical Co Ltd (Sada, M., Kato, M., Mori, Y., Sano, M.)"
          url: https://patents.google.com/patent/US4307257A/en
          locator: Examples 1 to 4, Table 2
          kind: other
          accessed: "2026-11-05"
  tba-specific-electricity:
    title: Electricity per t of tert-butanol
    unit: kWh/t
    no_open_reference: >-
      No usable open source with a tert-butanol electricity figure found (2026-11-05). Read: LVOC BREF 2017
      section 2.1.2.1.8 (routes only, "endothermic process", no figure); patents US 7,179,948 B2,
      US 7,002,050 B2, US 7,115,787 B2, US 7,709,690 B2, US 4,180,688 A and US 4,307,257 A (no utility
      figures). Web searches for open simulation studies with reboiler duties found only abstracts
      and theses that could not be read. One abstract was read and not used: a student preliminary design
      (Universitas Muhammadiyah Surakarta, eprints.ums.ac.id/47175, 80 kt/a, bubble reactor) states 321.62 kW
      of electricity, about 32 kWh/t at 330 d/a; its isobutylene use is below stoichiometry and the route
      differs, so it is not a reference. The dataset's value is core's Tier 0 default, ASSUMED.
  tba-specific-heat:
    title: Heat per t of tert-butanol
    unit: kWh/t
    no_open_reference: >-
      No usable open source with a tert-butanol heat or steam figure found (2026-11-05); the same sources as
      for electricity were read. The student design named under electricity states 9388 kg/h of steam,
      about 0.93 t per t TBA at 330 d/a; it is not used, for the reasons given there. The dataset's value
      is core's Tier 0 default heat from fossil fuel, ASSUMED.
  kotbu-specific-potassium:
    title: Potassium metal consumption per kg of potassium tert-butoxide
    unit: kg/kg
    no_open_reference: "No open source with a plant's potassium use per kg of potassium tert-butoxide found (searched 2026-11-06: Google Patents US 4 577 045 A, US 5 053 560 A and US 6 150 569 A read, the KOH and amalgam routes, the metal route only as prior art without figures; Organic Syntheses Coll. Vol. 4, 132 and Coll. Vol. 5, 1060 read, laboratory preparations used in situ without a yield of the isolated alkoxide; Wikipedia, Potassium tert-butoxide, the route without figures). The stoichiometric floor is 0.3484 kg/kg (K + tert-butanol -> KOtBu + 1/2 H2), a limit, not a range of real plants."
  kotbu-specific-tert-butanol:
    title: tert-Butanol consumption per kg of potassium tert-butoxide
    unit: kg/kg
    no_open_reference: "No open source with a plant's tert-butanol use per kg of potassium tert-butoxide found (searched 2026-11-06, the sources named under kotbu-specific-potassium; US 4 577 045 A says the alcohol is recycled almost completely, without a figure). The stoichiometric floor is 0.6606 kg/kg; the losses to the vent, the purge and the sieve's regeneration are this design's ASSUMED values (potassium-tert-butoxide-1, DESIGN.md D-006, D-007)."
  ma-specific-butane:
    title: n-Butane consumption per kg of maleic anhydride (fixed bed, VPO)
    unit: kg/kg
    references:
      - id: us5688970-butane
        range: [0.970, 1.061]
        basis: unallocated
        note: >-
          The butane fed per kg of MA in US 5 688 970 A's two examples of the same fixed-bed plant
          with dibutyl phthalate recovery: 3289 kg/h for 3100 kg/h once through (Example 2, 86.5 %
          conversion, 65 % selectivity) and 3008 kg/h with the off-gas recycled (Example 1); our
          division. The 3100 kg/h is the MA recovered from the solvent (line 30), after the
          absorber and the stripping (about 99.4 % of the about 3120 kg/h its conversion and
          selectivity give in the reactor gas, our arithmetic) and before any refining; the
          summary tables call it the MA produced.
        conditions: {technology: "n-butane oxidation in air over VPO, fixed bed, molten-salt cooled, dibutyl phthalate absorption; once through and with off-gas recycle", capacity: "3100 kg/h of MA", year: 1997}
        source:
          citation: "Ruggieri, R.; Cassarino, S. (Italiana Serie Acetica Sintetica) (1997) Process to recycle exhaust gases from n-butane conversion into maleic anhydride. US patent 5,688,970 A"
          url: https://patents.google.com/patent/US5688970A/en
          locator: Examples 1 and 2
          kind: other
          accessed: "2026-11-19"
  ma-specific-electricity:
    title: Electricity per kg of maleic anhydride (fixed bed, VPO)
    unit: kWh/kg
    references:
      - id: us5688970-compression
        range: [0.730, 1.059]
        basis: unallocated
        note: >-
          The compression power per kg of MA of US 5 688 970 A's examples: 3283 kW once through
          (Example 2, air to 3.55 bar in two stages) and 2264 kW with the off-gas recycled
          (Example 1), each for 3100 kg/h; our division. Compression only: the pumps, vacuum pumps
          and fans are not in the figures.
        conditions: {technology: "n-butane oxidation in air over VPO, fixed bed, dibutyl phthalate absorption; once through and with off-gas recycle", capacity: "3100 kg/h of MA", year: 1997}
        source:
          citation: "Ruggieri, R.; Cassarino, S. (Italiana Serie Acetica Sintetica) (1997) Process to recycle exhaust gases from n-butane conversion into maleic anhydride. US patent 5,688,970 A"
          url: https://patents.google.com/patent/US5688970A/en
          locator: Examples 1 and 2
          kind: other
          accessed: "2026-11-19"
  salicylic-acid-specific-phenol:
    title: Fresh phenol consumption per kg of salicylic acid
    unit: kg/kg
    no_open_reference: "No open source independent of the dataset with a plant's phenol use per kg of salicylic acid found (searched 2026-11-19: US 4 376 867 A read, the dataset's own source; Mohammad, Onwudili and Yuan, Molecules 29 (2024) 2527, laboratory yields only; Wikipedia, Salicylic acid). The stoichiometric floor is 0.681 kg/kg."
  salicylic-acid-specific-wastewater:
    title: Wastewater (mother liquor after phenol recovery, wash filtrate, condensates) per kg of salicylic acid
    unit: kg/kg
    no_open_reference: "No open source with the liquor volume of salicylic acid manufacture independent of the dataset found (searched 2026-11-19 as for salicylic-acid-specific-phenol); US 4 376 867 A's 8 to 10 t of water per t of sodium salicylate is the dataset's own source."
  eh-specific-propylene:
    title: Propylene consumption per kg of 2-ethylhexanol (oxo route, aqueous Rh hydroformylation)
    unit: kg/kg
    no_open_reference: "No open source independent of the dataset with a plant's propylene use per kg of 2-ethylhexanol found (searched 2026-11-19: US 4 684 750 A, the dataset's own source, gives the crude's composition and the yield on n-butanal, not on propylene; US 4 523 036 A and US 4 148 830 A read, no consumption per product). The stoichiometric floor at the crude's 95 % n-selectivity is 0.680 kg/kg (2 x 42.081 / 130.231 / 0.95)."
  eh-specific-hydrogen:
    title: Hydrogen consumption (hydrogenation) per kg of 2-ethylhexanol
    unit: kg/kg
    no_open_reference: "No open source with a plant's hydrogen use per kg of 2-ethylhexanol found (searched 2026-11-19 as for eh-specific-propylene; US 4 684 750 A gives the hydrogenation's conditions and LHSV, not its hydrogen per product). The stoichiometric floor is 0.0310 kg/kg (2 x 2.016 / 130.231)."

  vam-specific-ethylene:
    title: Ethylene consumption per kg of vinyl acetate (gas-phase acetoxylation)
    unit: kg/kg
    references:
      - id: us8765995-ethylene-selectivity
        range: [0.3489, 0.3585]
        basis: unallocated
        note: "The ethylene selectivity to vinyl acetate of Wacker's pilot tubes, 90.9 to 93.4 % over 300 to 1500 h (Tables 1 to 4, the comparative 33 mm and the 27 mm tubes), as ethylene per kg of vinyl acetate (28.054 / 86.090 = 0.3259 kg/kg at 100 %, divided by 0.934 and 0.909). A reactor's selectivity, not a plant's consumption: it leaves out the ethylene lost in the purge and the CO2 vent. Not independent of vinyl-acetate-1, which takes its selectivity (91.0 %) from the same Table 2."
        conditions: {technology: "multitubular fixed bed, Pd/Au catalyst, 65 mol% ethylene, 150-155 C, pilot reactor with 4 and 7 tubes of 6.3 m", region: DE, year: 2014}
        source:
          citation: "Dafinger, W.; Holl, P.; Rudolf, G.; Schoenleben, M. (Wacker Chemie AG) (2014) Process and apparatus for preparing vinyl acetate monomer. US Patent 8,765,995 B2"
          url: https://patents.google.com/patent/US8765995B2/en
          locator: "Examples, Tables 1 to 4 (ethylene selectivity)"
          kind: other
          accessed: "2026-11-19"
  vam-specific-acetic-acid:
    title: Acetic acid consumption per kg of vinyl acetate
    unit: kg/kg
    no_open_reference: "No open source with a plant's acetic acid use per kg of vinyl acetate found (searched 2026-11-19: Google Patents US 8 765 995 B2, US 8 410 307 B2, US 6 420 595 B1 and US 5 550 281 A read, which give conversions, selectivities on ethylene and oxygen and compositions but no acetic acid consumption; Wikipedia, Vinyl acetate, the routes without figures). Only the stoichiometric floor, 0.6976 kg/kg (60.052 / 86.090), is known."

  pa-specific-o-xylene:
    title: o-Xylene consumption per kg of phthalic anhydride (fixed-bed gas-phase oxidation)
    unit: kg/kg
    references:
      - id: ap42-pa-feed-utilisation
        range: [1.0, 1.0]
        basis: unallocated
        note: >-
          AP-42 states a feed utilisation of about 1.0 lb of PA per lb of o-xylene for the plants of
          its time (1970s, US), one rounded figure, kept as a point (the source gives no spread).
          The dataset's 0.9495 kg/kg (1.053 kg PA per kg) is a newer catalyst's yield. Independent of phthalic-anhydride-1, whose selectivities come
          from patents and a flowsheet paper; the dataset's CO share and condenser recovery are
          calibrated to AP-42's emission factors, not to this utilisation.
        conditions: {technology: "o-xylene or naphthalene oxidation over vanadium pentoxide, fixed bed (o-xylene) or fluid bed (naphthalene), switch condensers, vacuum distillation", region: US, year: 1983}
        source:
          citation: "US EPA (1983, reformatted 1995) AP-42, Compilation of Air Pollutant Emission Factors, 5th ed., Vol. I, section 6.5 Phthalic anhydride"
          url: https://www.epa.gov/sites/default/files/2020-10/documents/c06s05.pdf
          locator: "6.5.1 General, first paragraph"
          kind: government
          accessed: "2026-11-19"
  pa-specific-electricity:
    title: Electricity per kg of phthalic anhydride
    unit: kWh/kg
    no_open_reference: "No open source with a plant's electricity use per kg of phthalic anhydride found (searched 2026-11-19: US EPA AP-42 section 6.5, Google Patents US 8 859 459 B2, US 7 592 293 B2, EP 0 574 855 A2, US 5 730 844 A, US 4 036 783 A and the ESCAPE-15 paper of Jara et al. 2005 read; none states a utility consumption). The dataset's value is its air blower (hand calculation) and ASSUMED pump and vacuum allowances (phthalic-anhydride-1, DESIGN.md D-010)."
  mma-acetone-yield:
    title: Methyl methacrylate per acetone fed (ACH-sulfo route), as a share of the stoichiometric maximum
    unit: "%"
    description: >-
      Moles of MMA per mole of acetone, computed from the masses (100.1158 and 58.0791 g/mol). With
      HCN equimolar it is the yield on ACH times the ACH unit's yield.
    no_open_reference: >-
      No open source independent of the dataset's was read (2026-11-19). The only open figures
      found are the dataset's own source, US 2023/0416184 A1 (Table 4: 90.1 to 91.6 % MMA on ACH
      in Examples A1 to A3, Table 7: 91.1 % in B1), which a check would pass by construction.
      Read: US 9,890,105 B2 (routes, no ACH-route yield); the abstract of Darabi Mahboub et al.,
      Chem. Soc. Rev. 47 (2018) 7703 (no figure); the full text and Ullmann's chapter were not
      read.
  mma-specific-natural-gas:
    title: Natural gas (as methane) per kg of methyl methacrylate, spent acid regenerated on site
    unit: kg/kg
    no_open_reference: >-
      No open source with the fuel of a spent-acid regeneration plant per kg of MMA or per kg of
      spent acid was found (2026-11-19). Read: US 2023/0416184 A1 (thermal regeneration above
      900 C, no fuel figure). The dataset's value comes from an adiabatic energy balance on
      package formation enthalpies (methyl-methacrylate-1 DESIGN.md D-008), an approximation: the
      heat loss it leaves out and the uncredited sensible heat of the 393 K spent acid act in
      opposite directions.

  acrylic-acid-specific-propylene:
    title: Propylene consumption per kg of acrylic acid (two-stage propylene oxidation)
    unit: kg/kg
    references:
      - id: mitsubishi-patents-aa-yield
        range: [0.665, 0.699]
        basis: unallocated
        note: "Propylene fed per kg of acrylic acid formed in the reactors, from the acrylic acid yields on propylene of the two patents' examples: 87.8 % (US 4 873 368 A, Example 5) and 83.5 to 85.5 % (US 4 365 087 A, Example 8, day 1 and day 60, with off-gas recycle); 42.080 / 72.063 kg/kmol divided by the yield. Laboratory multitubular reactors with four tubes; the yields of the reaction only, no losses in absorption or distillation. Not independent of acrylic-acid-1, which takes its yields from US 4 873 368 A, Example 5."
        conditions: {technology: "two-stage vapour-phase oxidation of propylene with air and steam over Mo-Bi and Mo-V (or Sb-Ni-Mo-V) oxides, 1.0 kg/cm2 gauge, 265 to 310 C; laboratory tubes", region: JP, year: 1989}
        source:
          citation: "Kadowaki, K.; Sarumaru, K.; Shibano, T. (Mitsubishi Petrochemical) (1989) Process for producing acrylic acid. US Patent 4,873,368 A; and (1982) Production of acrylic acid. US Patent 4,365,087 A"
          url: https://patents.google.com/patent/US4873368A/en
          locator: "US 4 873 368 A, Table 2 (Example 5); US 4 365 087 A, Example 8, Table 8"
          kind: other
          accessed: "2026-11-19"
  acrylic-acid-specific-lp-steam:
    title: Steam heat to the purification columns per kg of acrylic acid
    unit: kWh/kg
    no_open_reference: "No open source with a plant's steam use per kg of acrylic acid found (searched 2026-11-19: Google Patents US 4 873 368 A, US 4 365 087 A and US 5 910 607 A read, which give laboratory column rates but no plant steam; the Arkema data sheet; Wikipedia; the EU LVOC BREF 2017 has no acrylic acid chapter; no IEA or open LCA report with an acrylic acid steam figure found). The dataset's value is scripts/aa_balance.py's reboiler duties (DESIGN.md D-008 to D-010)."
  acrylic-acid-specific-hp-steam-export:
    title: HP steam heat exported per kg of acrylic acid
    unit: kWh/kg
    no_open_reference: "No open source with the steam an acrylic acid plant exports per kg found (searched 2026-11-19, as for acrylic-acid-specific-lp-steam; the patents read cool the reactors with a molten nitrate salt and give no steam figure). The dataset's value is the two reactors' heat of reaction from the ideal-gas formation data (DESIGN.md D-005, D-006)."

  asa-specific-salicylic-acid:
    title: Salicylic acid consumption per kg of acetylsalicylic acid (acetylation with acetic anhydride)
    unit: kg/kg
    references:
      - id: us2731492-example1-sa
        range: [0.7678, 1.0229]
        basis: unallocated
        note: "Example I of the patent: 1382 kg salicylic acid per batch with acetic anhydride in acetic acid and sulfuric acid at 90-92 C, the mother liquor recycled; the first batch gives 1351 to 1621 kg of aspirin (1382 / 1621 = 0.853 and 1382 / 1351 = 1.023 kg/kg), the recycled batches 1790 to 1800 kg (0.768 to 0.772 kg/kg); the range spans both. The dataset takes its batch size, catalyst and solubility from this example but its yield from its own balance, so the reference is not independent."
        conditions: {technology: "salicylic acid with acetic anhydride in glacial acetic acid with sulfuric acid, 90-92 C, cooled to 15-25 C, mother liquor recycled after ketene treatment; a 6000 L enamelled reactor", region: US, year: 1956}
        source:
          citation: "Kamlet, J. (1956) Process for the manufacture of acetylsalicylic acid. US Patent 2,731,492 A"
          url: https://patents.google.com/patent/US2731492A/en
          locator: "Example I"
          kind: other
          accessed: "2026-11-19"
      - id: us2987539-yield-sa
        range: [0.8244, 0.8712]
        basis: unallocated
        note: "The patent's overall yields of tablet-grade aspirin on the salicylic acid, 88 % without and 93 % with the salicylic acid recovered from the still residue (138.122 / 180.159 = 0.7667 kg/kg at 100 %, divided by 0.93 and 0.88); uncatalysed, at 85 C, with 30 to 70 % of the mother liquor recycled. Only the tablet-grade crystals are counted, so the range lies above a balance that counts all the aspirin."
        conditions: {technology: "salicylic acid with excess acetic anhydride in acetic acid at 85 C, crystallised at 15 C, acetic acid and water washes, 30 to 70 % of the mother liquor recycled, the rest reacted with more salicylic acid in a second reactor for a second crop, and only the second mother liquor distilled; laboratory example of a plant process", region: US, year: 1961}
        source:
          citation: "Stoesser, W. C.; Surine, W. R. (The Dow Chemical Company) (1961) Process for the production of aspirin. US Patent 2,987,539 A"
          url: https://patents.google.com/patent/US2987539A/en
          locator: "Example, Steps 1 to 5"
          kind: other
          accessed: "2026-11-19"
  asa-specific-acetic-anhydride:
    title: Acetic anhydride consumption per kg of acetylsalicylic acid
    unit: kg/kg
    no_open_reference: "No open source with a plant's acetic anhydride use per kg of aspirin found (searched 2026-11-19: US 2 731 492 A read, which regenerates the anhydride from the liquor's acetic acid with ketene, so its anhydride use is not a consumption; US 2 987 539 A read, laboratory charges with the excess recycled in the liquor; US 6 278 014 B1 read, a solvent-free route). The stoichiometric floor is 0.5667 kg/kg (102.089 / 180.159), a limit, not a range of real plants."
  mtbe-specific-isobutene:
    title: Isobutene consumed per kg of MTBE (catalytic distillation of a C4 raffinate)
    unit: kg/kg
    references:
      - id: bao-2002-isobutene-conversion
        range: [0.6389, 0.6462]
        basis: unallocated
        note: "Our conversion of the isobutene conversions an open study reports for MTBE catalytic distillation columns into isobutene per kg of MTBE (56.106 / 88.148 = 0.6365 kg/kg at full conversion, divided by the conversion): 99.62 % in Bao et al.'s industrial column (0.6389), 98.5 % in Nijhuis et al.'s simulation (0.6462), both as Murat et al. (2003) report them (Tables 2 and 4). The isobutene not converted leaves with the raffinate-2."
        conditions: {technology: "catalytic distillation of a C4 raffinate with methanol over acidic ion-exchange resin, with or without a pre-reactor", region: generic, year: 2003}
        source: &murat-2003
          citation: "Murat, M.N.; Mohamed, A.R.; Bhatia, S. (2003) Modeling of a reactive distillation column: methyl tertiary butyl ether (MTBE) simulation studies. IIUM Engineering Journal 4(2), 13-30"
          url: https://journals.iium.edu.my/ejournal/index.php/iiumej/article/download/371/319/1573
          locator: "Table 2 (Nijhuis et al.'s column), Tables 3 and 4 (Bao et al.'s industrial column)"
          kind: peer-reviewed
          accessed: "2026-11-19"
  mtbe-specific-methanol:
    title: Methanol consumed per kg of MTBE
    unit: kg/kg
    no_open_reference: "No open source with a plant's methanol use per kg of MTBE found (searched 2026-11-19: Murat et al. 2003 and Svandova et al. 2007 read, which model the column with its methanol feed but not the recovery; US 4 918 243 A and US 5 336 841 A read, which recover the excess methanol and give no consumption). The stoichiometric floor is 0.3635 kg/kg (32.042 / 88.148), a limit, not a range of real plants."
  bpa-specific-phenol:
    title: Fresh phenol consumption per kg of bisphenol A (resin route, adduct crystallization)
    unit: kg/kg
    no_open_reference: "No open source with a plant's phenol use per kg of bisphenol A found (searched 2026-11-19: US 4 391 997 A, US 5 723 688 A, US 6 960 697 B2, US 4 950 806 A and US 4 950 804 A read on Google Patents, and the EU risk assessment of bisphenol A, EUR 24588 EN; none states a consumption). The stoichiometric floor is 0.8245 kg/kg (2 x 94.111 / 228.286); the dataset's excess is the cracking-still residue and the wastewater of bisphenol-a-1 (DESIGN.md D-008, D-014)."
  bpa-specific-acetone:
    title: Fresh acetone consumption per kg of bisphenol A (resin route, adduct crystallization)
    unit: kg/kg
    no_open_reference: "No open source with a plant's acetone use per kg of bisphenol A found (searched 2026-11-19, the sources named under bpa-specific-phenol). The stoichiometric floor is 0.2544 kg/kg (58.079 / 228.286); bisphenol-a-1's excess is the acetone bound in the bisphenol A, the isomer and the by-products left in the cracking-still residue (the bisphenol A itself the largest share), the acetone in the wastewater and the impurities in the product (DESIGN.md D-005, D-008)."

datasets:
  - process: terephthalic-acid-1
    dataset: pta-px-air-oxidation
    conditions: {technology: "air oxidation in acetic acid with hydropurification", basis: conceptual inventory}
    kpis:
      pta-px-yield:
        expression: product:terephthalic-acid / feed:p-xylene * 106.168 / 166.132
        reference: midden-pta-yield
        out_of_range_reason: "The dataset's p-xylene is a whole plant's unit consumption (655 to 657 kg/t, patent CN105001073A), which includes the losses to the oxidation residue, pond solids and mother liquor and the p-xylene burnt to CO2. The reference is the yield of the reaction steps only."
      pta-specific-acetic-acid:
        expression: feed:acetic-acid / product:terephthalic-acid
        per: product:terephthalic-acid
        reference: lbnl-pta-acetic-acid
        out_of_range_reason: "The dataset takes 38 to 40 kg/t from patent CN105001073A, stated for a conventional 1.2 Mt/a plant of about 2015. That is at or just below the low end of the older literature range."
      pta-specific-energy:
        expression: (feed:electricity + feed:steam) / product:terephthalic-acid
        per: product:terephthalic-acid
        reference: lbnl-pta-energy
        out_of_range_reason: "The dataset's 2.95 GJ/t is final energy: one EU plant's electricity (MIDDEN report Table 3) and the IEA's best-practice steam for PTA (2.6 GJ/t; the IEA figures are recorded beside the range as iea-2009-pta-energy). LBNL does not state its basis. The IEA's Western European average in primary energy with its 1.6 GJ/t of fuel, 7.6 GJ/t, lies inside the range, so most of the gap is the primary basis and the fuel, which the dataset does not count (a plant that fires its hydropurification heaters would need it). The steam remains the main energy uncertainty of the dataset (README)."
  - process: adipic-acid-1
    dataset: adipic-acid-ka-nitric-catalytic-n2o-abatement
    conditions: {technology: "cobalt-catalysed cyclohexane oxidation, nitric acid oxidation, catalytic N2O decomposition at IPCC defaults", basis: conceptual inventory}
    kpis:
      aa-n2o-generation:
        expression: (emission:N2O + emission:N2 * 1.57111) / product:adipic-acid
        per: product:adipic-acid
        reference: ap42-aa-n2o-uncontrolled
        out_of_range_reason: "The datasets take the IPCC default of 300 kg/t; AP-42's 291 kg/t from two US plants is 3 % lower and inside the IPCC's +/- 10 %. The N2O destroyed is counted back from the N2 of its decomposition (44.013 / 28.014)."
      aa-n2o-emission-abated:
        expression: emission:N2O / product:adipic-acid
        per: product:adipic-acid
        reference: ecofys-2009-de-aa-co2eq
        out_of_range_reason: "The dataset applies the IPCC defaults for catalytic destruction, 92.5 % destruction at 89 % utilisation, an overall 82 % removal; the German production of 2001 to 2007 removed about 86 to 94 % on the reading of the reference. Thermal destruction (IPCC 98.5 % at 97 %) or a higher utilisation would fall inside."
      aa-specific-steam: {expression: feed:steam / product:adipic-acid, per: product:adipic-acid}
      aa-specific-electricity: {expression: feed:electricity / product:adipic-acid, per: product:adipic-acid}
      aa-specific-cyclohexane: {expression: feed:cyclohexane / product:adipic-acid, per: product:adipic-acid}
      aa-specific-nitric-acid: {expression: feed:nitric-acid * 0.59985 / product:adipic-acid, per: product:adipic-acid}
  - process: adipic-acid-1
    dataset: adipic-acid-ka-nitric-unabated
    conditions: {technology: "cobalt-catalysed cyclohexane oxidation, nitric acid oxidation, no N2O abatement", basis: conceptual inventory}
    kpis:
      aa-n2o-generation:
        expression: emission:N2O / product:adipic-acid
        per: product:adipic-acid
        reference: ap42-aa-n2o-uncontrolled
        out_of_range_reason: "The datasets take the IPCC default of 300 kg/t; AP-42's 291 kg/t from two US plants is 3 % lower and inside the IPCC's +/- 10 %."
      aa-specific-steam: {expression: feed:steam / product:adipic-acid, per: product:adipic-acid}
      aa-specific-electricity: {expression: feed:electricity / product:adipic-acid, per: product:adipic-acid}
      aa-specific-cyclohexane: {expression: feed:cyclohexane / product:adipic-acid, per: product:adipic-acid}
      aa-specific-nitric-acid: {expression: feed:nitric-acid * 0.59985 / product:adipic-acid, per: product:adipic-acid}
  - process: propylene-oxide-1
    dataset: propylene-oxide-chlorohydrin-lime
    conditions: {technology: chlorohydrin with lime, basis: Tier 0 screening}
    kpis:
      po-chlorohydrin-specific-chlorine:
        expression: feed:chlorine / product:propylene-oxide
        per: product:propylene-oxide
        reference: anl-1980-po-chlorohydrin-chlorine
        out_of_range_reason: "The dataset takes the by-product from US 4,560,451 (0.1 to 0.2 t DCP per t), newer than ANL's 1976 figures, which imply about 0.58 t of by-product per t PO (README)."
      po-chlorohydrin-specific-propylene:
        expression: feed:propylene / product:propylene-oxide
        per: product:propylene-oxide
        reference: anl-1980-po-chlorohydrin-propylene
        out_of_range_reason: "As for chlorine: the dataset's DCP of 0.15 t/t is the patent's, ANL's 1976 feeds imply about four times as much by-product."
      po-chlorohydrin-calcium-chloride:
        expression: emission:CaCl2 / product:propylene-oxide
        per: product:propylene-oxide
