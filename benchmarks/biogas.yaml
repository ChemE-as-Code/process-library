# Benchmarks of biogas and biomethane: for now anaerobic digestion with upgrading to biomethane.
# Schema: schemas/benchmarks.schema.json; rules: docs/benchmarks.md. Ranges are facts from the
# cited source, in our own form.
#
# How independent they are:
# - The methane slip range is SGC Rapport 2013:270's span over the commercial upgrading
#   technologies (amine 0.1 % to PSA 2 %), the document biogas-1 takes its membrane split from
#   (design iii, about 0.5 %): the dataset's value is the source's membrane figure by
#   construction, so "inside" checks the arithmetic of the inventory, not the design.
# - No open source read gives the whole plant's electricity per t of biomethane; SGC gives the
#   upgrading alone per Nm3 of raw biogas, which needs the plant's own methane content to convert.
schema: cheme-as-code/benchmarks/v1
family: biogas

kpis:
  biomethane-methane-slip:
    title: Methane slip of the upgrading, share of the methane fed to it
    unit: "%"
    references:
      - id: sgc-2013-270-methane-slip
        range: [0.1, 2.0]
        basis: unallocated
        note: "The span over the mature upgrading technologies: amine scrubbing 0.1 % (guaranteed), membranes about 0.5 % with three stages (design iii), water scrubbers about 1 %, PSA 1.8-2 % (mean and median of reported plants). Without post-oxidation of the off-gas."
        conditions: {technology: "commercial biogas upgrading: amine, membrane, water scrubbing, PSA", region: "Europe", year: 2013}
        source:
          citation: "Bauer, F., Hulteberg, C., Persson, T., Tamm, D. (2013) Biogas upgrading - Review of commercial technologies. SGC Rapport 2013:270, Svenskt Gastekniskt Center AB, Malmoe"
          url: https://lup.lub.lu.se/search/files/5465492/4580054.pdf
          locator: Section 3.3, p. 52
          kind: other
          accessed: "2026-11-19"
  biomethane-electricity:
    title: Electricity per t of biomethane (digestion and upgrading)
    unit: kWh/t
    no_open_reference: "No open source read on 2026-11-19 gives a whole biomethane plant's electricity per t of product: SGC Rapport 2013:270 (section 3.2) gives the upgrading alone, 0.20-0.30 kWh per Nm3 of raw biogas for membranes, and the FNR Guide to Biogas (2010) installed agitator power per m3 of digester (Table 8.4), not a consumption per product."

datasets:
  - process: biogas-1
    dataset: biogas-from-cattle-slurry-and-biowastes-with-membrane-upgrading-to-biomethane-217-nm3-h-raw-biogas
    conditions: {technology: "three-stage membranes (design iii), 98 mol% CH4, off-gas vented; mesophilic wet co-digestion of cattle slurry and hygienised biowastes (FNR model plant VII)", basis: "concept design, 216.9 Nm3/h raw biogas"}
    kpis:
      biomethane-methane-slip:
        # the product's methane (the build converts kg/kg to %): 0.98 mol CH4 with 0.02 mol CO2, 0.94698 kg CH4 per kg
        expression: emission:CH4 / (emission:CH4 + 0.94698 * product:BIOMETHANE)
        reference: sgc-2013-270-methane-slip
      biomethane-electricity:
        expression: feed:POWER / product:BIOMETHANE
