# Benchmarks of fertilisers: ammonium nitrate (AN) and calcium ammonium nitrate (CAN), NPK by the
# nitrophosphate route, and ammonium sulfate. Schema: schemas/benchmarks.schema.json; rules:
# docs/benchmarks.md. Ranges are facts from the cited source, in our own form.
#
# ammonium-nitrate-1, how independent they are:
# - The AN feed KPIs check only that the stoichiometry is applied (a formula and transcription
#   check): the reference's 213 and 789 kg/t are themselves within 0.2 % of the stoichiometric
#   212.8 and 787.2 kg/t, so any dataset that applies NH3 + HNO3 -> NH4NO3 matches them, whatever
#   its losses. The datasets do not take the numbers from the reference. The reference is one
#   licensor's expected figures for new plants, quoted in the same BREF.
# - Solid AN electricity and steam record no_open_reference: the only open figures are the EFMA
#   ranges the dataset takes its midpoints from, and a range made of them would only check the
#   transcription (the rule of npk-np-specific-electricity; review 2026-11-06).
# - CAN electricity and steam are bound to the one plant figure of the same table (AMI Linz),
#   which the dataset does not use, so they are independent of it; both are explained.
# - A total energy KPI for solid AN (0.09 to 0.22 GJ/t for modern plants, infoMil 2001 in BREF
#   Table 9.3) is not bound: the steam is in kg and an expression cannot add kg to kWh
#   (docs/benchmarks.md). By hand, 42.5 kWh and 25 kg of steam at about 2 MJ/kg give about
#   0.2 GJ/t, inside it but near its top. The bounds 0.09 and 0.22 GJ/t are also exactly the
#   electricity range of 25 to 60 kWh/t in GJ; the source does not say whether its total includes
#   steam, so this hand check is weak.
#
# npk-fertilizers-1:
# What is and is not independent of npk-fertilizers-1's dataset:
# - Electricity has no reference: the BREF's two nitrophosphate figures are the dataset's own inputs
#   (it takes their midpoint), so they are not recorded as a range (review 2026-11-05).
# - The CaCO3 and CO2 per t P2O5 come from the same EFMA booklet whose NP-solution composition sets
#   the dataset's CNTH, so they check the stoichiometry against the booklet's own totals, not
#   against plant data.
# - The rock per t P2O5 is the only check of a feed that does not share its number with the
#   dataset (the dataset's rock grade is from the BREF's Table 5.2, the booklet's from its plant).
#
# ammonium-sulfate-1:
# The dust reference is a US emission limit, not plant data: any compliant dryer is inside it. The
# dataset's dust factor (AP-42 Table 8.4-1) comes from a 1990 compliance test against this limit, so
# the two are separate documents but not independent measurements of one plant population.
schema: cheme-as-code/benchmarks/v1
family: fertilizers

kpis:
  an-specific-ammonia:
    title: Ammonia consumption per t of ammonium nitrate
    unit: t/t
    references:
      - id: bref-lvic-aaf-an-ammonia-new-plants
        range: [0.213, 0.213]
        basis: unallocated
        note: >-
          One value for all three neutraliser types of the table (vacuum, 2 bar and 4 bar), recorded
          as a zero-width range and not widened. Given in whole kg per t. The table is for an AN
          solution of 96 wt%; per t of contained AN is our reading, since 213 kg lies just above the
          stoichiometric 212.8 kg per t of NH4NO3.
        conditions: {technology: "expected consumption of new plants, vacuum or pressure neutralisation of 60 wt% nitric acid (Uhde 2003)", product: 96 wt% AN solution, region: EU}
        source: &bref-t98
          citation: "European Commission, JRC/EIPPCB (2007) Reference Document on Best Available Techniques for the Manufacture of Large Volume Inorganic Chemicals - Ammonia, Acids and Fertilisers (LVIC-AAF BREF), August 2007"
          url: https://eippcb.jrc.ec.europa.eu/sites/default/files/2019-11/lvic_aaf.pdf
          locator: Section 9.4.3, Table 9.8, p. 378
          kind: bref
          accessed: "2026-11-05"
  an-specific-nitric-acid:
    title: Nitric acid (as 100 % HNO3) consumption per t of ammonium nitrate
    unit: t/t
    references:
      - id: bref-lvic-aaf-an-nitric-acid-new-plants
        range: [0.789, 0.789]
        basis: unallocated
        note: >-
          As the ammonia reference: one value, zero-width, in whole kg per t. Stated as nitric acid;
          the 100 % basis is our reading (787.2 kg per t of NH4NO3 is the stoichiometric figure).
        conditions: {technology: "expected consumption of new plants, vacuum or pressure neutralisation of 60 wt% nitric acid (Uhde 2003)", product: 96 wt% AN solution, region: EU}
        source: *bref-t98
  an-specific-electricity:
    title: Electricity per t of solid ammonium nitrate
    unit: kWh/t
    no_open_reference: >-
      No open source independent of the dataset found (2026-11-06). The open figure for solid AN
      is the EFMA (2000) range for a new AN facility, 25 to 60 kWh/t, in LVIC-AAF BREF Table 9.3,
      p. 370, and the dataset takes its midpoint, so a range made of it would only check the
      transcription. Table 9.8 (p. 378) gives electricity for the AN solution section only, not
      for solid AN. US EPA AP-42 section 8.3 and its background report give emissions only.
  an-specific-steam:
    title: Steam imported per t of solid ammonium nitrate
    unit: kg/t
    no_open_reference: >-
      No open source independent of the dataset found (2026-11-06). The open figure for solid AN
      is the EFMA (2000) range of 0 to 50 kg/t in LVIC-AAF BREF Table 9.3, p. 370, and the dataset
      takes its midpoint, so a range made of it would only check the transcription. Table 9.8
      (p. 378) gives the steam balances of the neutraliser types, not the import of a solid AN
      plant.
  can-specific-electricity:
    title: Electricity per t of calcium ammonium nitrate
    unit: kWh/t
    references:
      - id: bref-lvic-aaf-can-electricity-ami-linz
        range: [13.2, 13.2]
        basis: unallocated
        note: >-
          One plant's reported figure, recorded as a zero-width range and not widened. The dataset
          does not use it: it takes the midpoint of the EFMA/infoMil range of 10 to 50 kWh/t in the
          same table.
        conditions: {technology: "CAN plant, AMI Linz (663000 t CAN in 2000)", product: CAN, region: AT, year: 2000}
        source: &bref-t93
          citation: "European Commission, JRC/EIPPCB (2007) Reference Document on Best Available Techniques for the Manufacture of Large Volume Inorganic Chemicals - Ammonia, Acids and Fertilisers (LVIC-AAF BREF), August 2007"
          url: https://eippcb.jrc.ec.europa.eu/sites/default/files/2019-11/lvic_aaf.pdf
          locator: Section 9.3, Table 9.3, p. 370
          kind: bref
          accessed: "2026-11-06"
  can-specific-steam:
    title: Steam per t of calcium ammonium nitrate
    unit: kg/t
    references:
      - id: bref-lvic-aaf-can-steam-ami-linz
        range: [13, 13]
        basis: unallocated
        note: >-
          One plant's reported figure, recorded as a zero-width range and not widened. The dataset
          does not use it: it takes the midpoint of the EFMA/infoMil range of 150 to 200 kg/t in the
          same table. The source does not say why AMI Linz is so far below that range (autothermal
          granulation, section 9.4.5, is one reading).
        conditions: {technology: "CAN plant, AMI Linz (663000 t CAN in 2000)", product: CAN, region: AT, year: 2000}
        source: *bref-t93
  npk-np-specific-electricity:
    title: Electricity per t of NPK, nitrophosphate route
    unit: kWh/t
    no_open_reference: >-
      No open source independent of the dataset found (2026-11-05). The only open figures for the
      nitrophosphate route are the two of LVIC-AAF BREF Table 7.3, p. 290 (AMI Linz 109 kWh/t,
      infoMil 2001 50 kWh/t), and the dataset takes its value as their midpoint, so a range made of
      them would only check the transcription. Read: EFMA (2000) BAT booklet No. 7 (no energy
      figures); UNIDO (1985) comparison of the Odda NPK process (downloads.unido.org, costs only).
      Not found as open text: Davis and Haglund (1999) SIK report 654. ecoinvent NPK datasets are
      licensed and not used.
  npk-np-calcium-carbonate:
    title: Calcium carbonate from the CNTH conversion per t of P2O5 in the NPK
    unit: t/t
    references:
      - id: efma-2000-npk-np-caco3
        range: [2.2, 2.2]
        basis: unallocated
        note: The source says around 2.2 t, depending on the rock and the cooling temperature. A single value, recorded as a zero-width range and not widened.
        conditions: {technology: "nitrophosphate route with CNTH conversion to CaCO3 and AN", product: NPK 15-15-15, capacity: "200 t/d P2O5"}
        source:
          citation: "EFMA (2000) Best Available Techniques for Pollution Prevention and Control in the European Fertilizer Industry, Booklet No. 7 of 8: Production of NPK fertilizers by the nitrophosphate route, 2000 edition (Fertilizers Europe)"
          url: https://www.fertilizerseurope.com/wp-content/uploads/2019/08/Booklet_7_final.pdf
          locator: Section 2.1, p. 8
          kind: other
          accessed: "2026-11-05"
  npk-np-co2-conversion:
    title: CO2 used by the CNTH conversion per t of P2O5 in the NPK
    unit: t/t
    references:
      - id: efma-2000-npk-np-co2
        range: [1.0, 1.0]
        basis: unallocated
        note: The source says around 1.0 t of CO2 per t of P2O5 (sections 2.2.4.1 and 4). A single value, recorded as a zero-width range and not widened.
        conditions: {technology: "nitrophosphate route with CNTH conversion to CaCO3 and AN", product: NPK 15-15-15, capacity: "200 t/d P2O5"}
        source:
          citation: "EFMA (2000) Best Available Techniques for Pollution Prevention and Control in the European Fertilizer Industry, Booklet No. 7 of 8: Production of NPK fertilizers by the nitrophosphate route, 2000 edition (Fertilizers Europe)"
          url: https://www.fertilizerseurope.com/wp-content/uploads/2019/08/Booklet_7_final.pdf
          locator: Section 2.2.4.1, p. 13, and section 4, p. 20
          kind: other
          accessed: "2026-11-05"
  npk-np-phosphate-rock:
    title: Phosphate rock per t of P2O5 in the NPK
    unit: t/t
    references:
      - id: efma-2000-npk-np-rock
        range: [3.5, 3.5]
        basis: unallocated
        note: "Our conversion of the source's reference plant: 200 t/d of P2O5 equivalent to about 700 t/d of rock, depending on the rock (so about 28.6 % P2O5 in the rock). A single value, recorded as a zero-width range."
        conditions: {technology: nitrophosphate route, product: NPK 15-15-15, capacity: "200 t/d P2O5"}
        source:
          citation: "EFMA (2000) Best Available Techniques for Pollution Prevention and Control in the European Fertilizer Industry, Booklet No. 7 of 8: Production of NPK fertilizers by the nitrophosphate route, 2000 edition (Fertilizers Europe)"
          url: https://www.fertilizerseurope.com/wp-content/uploads/2019/08/Booklet_7_final.pdf
          locator: Section 1, p. 7
          kind: other
          accessed: "2026-11-05"
  as-dryer-dust:
    title: Particulate to air from the ammonium sulfate dryer per t of product
    unit: kg/t
    references:
      - id: us-nsps-1980-as-dryer
        range: [0, 0.15]
        basis: unallocated
        note: An upper limit (new, modified or reconstructed dryers), recorded as 0 to the limit; it is not a range of measured plants. 0.15 kg per Mg of ammonium sulfate produced.
        conditions: {technology: "ammonium sulfate dryers of caprolactam by-product, synthetic and coke-oven by-product plants", region: US, year: 1980}
        source:
          citation: "US EPA (1980) Standards of Performance for New Stationary Sources; Ammonium Sulfate Manufacture. Federal Register 45 (220): 74846, 12 November 1980; 40 CFR 60 subpart PP"
          url: https://19january2021snapshot.epa.gov/sites/static/files/2015-07/documents/45fedreg74851.pdf
          locator: "Section 60.422, Standards for particulate matter"
          kind: government
          accessed: "2026-11-05"
  as-specific-electricity:
    title: Electricity per t of ammonium sulfate
    unit: kWh/t
    no_open_reference: >-
      No open source with an electricity figure for ammonium sulfate found (2026-11-05). Read: US EPA
      AP-42 section 8.4 and its background report (emissions only), the 1980 NSPS (control equipment
      energy only as a share of plant energy, no plant figure), the GEA Messo PT brochure (2010; pump power
      only as a ratio between crystallizer types), the UNIDO fertilizer manual chapter VIII (no utility
      figures), the LVIC-AAF BREF 2007 (no ammonium sulfate chapter). Not readable: Crystallization of
      Ammonium Sulphate, State of the Art and New Developments (ResearchGate, HTTP 403); CRU/BC Insight
      articles (paywalled). A web search (2026-11-05) found only university plant-design theses that
      state an installed electrical load in kVA. That is not consumption, so they were not used. The
      dataset's value is an ASSUMED analogue, the midpoint of the solid AN range of LVIC-AAF BREF Table 9.3
      (25 to 60 kWh/t), not a check.
  as-specific-steam-heat:
    title: Steam, as heat delivered, per t of ammonium sulfate
    unit: kWh/t
    no_open_reference: >-
      No open figure for the heat of an ammonium sulfate plant found (2026-11-05), in the sources listed
      under as-specific-electricity. GEA (2010, PDF p. 4) and UNIDO chapter VIII state qualitatively that
      a reaction crystallizer with concentrated reactants needs no external heat for evaporation; the
      dataset's value is the dryer only, our estimate with an ASSUMED efficiency. An evaporative (by-product)
      crystallizer is heated with steam and its energy is the main running cost (GEA 2010, PDF p. 6), so a
      figure for that route would not apply here.

datasets:
  - process: ammonium-nitrate-1
    dataset: ammonium-nitrate-pressure-neutralisation-solid
    conditions: {technology: pressure neutralisation with prilling or granulation, feed: 60 wt% nitric acid, product: solid AN as NH4NO3, basis: conceptual inventory}
    kpis:
      an-specific-ammonia:
        expression: feed:ammonia / product:ammonium-nitrate
        per: product:ammonium-nitrate
        reference: bref-lvic-aaf-an-ammonia-new-plants
        out_of_range_reason: "The dataset's 0.2128 t/t is stoichiometry plus its sourced ammonia and dust losses; the reference rounds to whole kg per t and is for a 96 wt% solution plant. The difference, 0.1 %, is within the reference's rounding."
      an-specific-nitric-acid:
        expression: feed:nitric-acid * 189.036 / 315.141 / product:ammonium-nitrate
        per: product:ammonium-nitrate
        reference: bref-lvic-aaf-an-nitric-acid-new-plants
        out_of_range_reason: "The dataset's 0.7873 t/t is stoichiometry plus the dust loss. The reference's 0.789 implies about 0.2 % more acid, which the dataset does not have because nitric acid losses to air and water are not quantified per t in the source (a TODO exclusion of the dataset)."
      an-specific-electricity: {expression: feed:electricity / product:ammonium-nitrate, per: product:ammonium-nitrate}
      an-specific-steam: {expression: feed:steam / product:ammonium-nitrate, per: product:ammonium-nitrate}
  - process: ammonium-nitrate-1
    dataset: calcium-ammonium-nitrate-granulation
    conditions: {technology: neutralisation and granulation with limestone filler, feed: 60 wt% nitric acid, product: CAN about 27 % N, basis: conceptual inventory}
    kpis:
      can-specific-electricity:
        expression: feed:electricity / product:calcium-ammonium-nitrate
        per: product:calcium-ammonium-nitrate
        reference: bref-lvic-aaf-can-electricity-ami-linz
        out_of_range_reason: "30 kWh/t, the midpoint of the EFMA/infoMil range of 10 to 50 kWh/t (BREF Table 9.3) for CAN plants with filler grinding; AMI Linz, one plant of the same table, is near the low end of that range. The dataset represents the range, not one plant."
      can-specific-steam:
        expression: feed:steam / product:calcium-ammonium-nitrate
        per: product:calcium-ammonium-nitrate
        reference: bref-lvic-aaf-can-steam-ami-linz
        out_of_range_reason: "175 kg/t, the midpoint of the EFMA/infoMil range of 150 to 200 kg/t (BREF Table 9.3); AMI Linz reports 13 kg/t, more than ten times less, without a stated reason (autothermal granulation, BREF 9.4.5, is one reading). The dataset represents the range, not one plant, so it may overstate the steam of a plant like AMI Linz."
  - process: npk-fertilizers-1
    dataset: npk-nitrophosphate-odda
    conditions: {technology: "nitrophosphate route with CNTH conversion, model rock 33.6 % P2O5 (Khouribga, as phosphoric-acid-1)", product: NPK 15-15-15, basis: stoichiometric screening}
    kpis:
      npk-np-specific-electricity: {expression: feed:electricity / product:npk, per: product:npk}
      npk-np-calcium-carbonate:
        expression: product:calcium-carbonate / ( product:npk * 0.15 )
        reference: efma-2000-npk-np-caco3
        out_of_range_reason: "2.30 t/t, 4 % above the source's rounded 'around 2.2': the dataset takes the typical CaO/P2O5 of 0.25 in the NP solution and the Khouribga model rock (51.6 % CaO); the source's value depends on the rock and the cooling temperature."
      npk-np-co2-conversion:
        expression: feed:carbon-dioxide / ( product:npk * 0.15 )
        reference: efma-2000-npk-np-co2
        out_of_range_reason: "1.01 t/t, 1 % above the source's rounded 'around 1.0': one CO2 per CaCO3 by stoichiometry (see npk-np-calcium-carbonate); the source does not state the CO2 purity or losses."
      npk-np-phosphate-rock:
        expression: feed:phosphate-rock / ( product:npk * 0.15 )
        reference: efma-2000-npk-np-rock
        out_of_range_reason: "2.98 t/t against about 3.5: the dataset's model rock is the Khouribga rock of BREF Table 5.2 (33.6 % P2O5 as modelled, 33.4 % in the analysis, which would give 2.99 t/t), while the source's plant takes a leaner rock (about 28.6 % P2O5). The rock grade differs, not the stoichiometry (dataset parameter M_R)."
  - process: ammonium-sulfate-1
    dataset: ammonium-sulfate-neutralisation
    conditions: {technology: "synthetic, saturator-crystallizer with rotary dryer and wet scrubber", basis: conceptual inventory}
    kpis:
      as-dryer-dust: {expression: emission:PM / product:ammonium-sulfate, per: product:ammonium-sulfate, reference: us-nsps-1980-as-dryer}
      as-specific-electricity: {expression: feed:electricity / product:ammonium-sulfate, per: product:ammonium-sulfate}
      as-specific-steam-heat: {expression: feed:steam / product:ammonium-sulfate, per: product:ammonium-sulfate}
