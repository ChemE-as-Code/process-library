# Benchmarks of bio-based chemicals: bio-ethylene by ethanol dehydration and biodiesel by transesterification. Schema:
# schemas/benchmarks.schema.json; rules: docs/benchmarks.md. Ranges are facts from the cited
# source, in our own form.
#
# The references are independent of the dataset: bio-ethylene-1 takes its numbers from Arvidsson
# and Lundin (2011), these from Haro et al. (2013), another process model of the same technology
# (Aspen Plus, reactor yields from a commercial design). Both are models, not plant data; no open
# plant figure per tonne was found. The ranges are our ratios of Haro et al.'s Table 10, whose
# flows are rounded to 0.1 t/h and to whole MW, so the electricity and fuel ranges carry up to
# about +/- 8 % of rounding. Case study 1 of that table is not used: its ethanol and ethylene
# columns do not fit together (53.2 t/h of ethanol for 38.9 t/h of ethylene is above the
# stoichiometric yield).
#
# Cases 3 and 4 are integrated biomass-to-ethylene plants: the ethanol synthesis is inside their
# system boundary (Haro et al., section 2.1, p. 3, and section 4.1, p. 17), and the table's footnote
# "ethanol production is not included" is attached only to the electricity and natural gas of cases
# 1 and 2. So the 3 and 6 MW of electricity and the 6 and 11 MW of natural gas of cases 3 and 4 may
# be the net imports of the whole integrated plant, not of the dehydration alone. The
# dehydration-only case 2 gives similar ratios (our arithmetic: 8/20.5 and 26/68.2 MW per t/h, 381 to
# 390 kWh/t of electricity; 15/20.5 and 49/68.2, 718 to 732 kWh/t of natural gas), but it is not
# bound either: its ethylene per ethanol (20.5/33.8 = 0.607 kg/kg) is near the stoichiometric 0.609
# and above what Table 4's 96.5 % carbon selectivity allows. The ethanol ratio of cases 3 and 4 is
# the dehydration plant's own feed and is not affected.
schema: cheme-as-code/benchmarks/v1
family: bio-based-chemicals

kpis:
  bioethylene-specific-ethanol:
    title: Ethanol (counted as ethanol) per t of bio-ethylene
    unit: t/t
    references:
      - id: haro-2013-ethanol
        range: [1.706, 1.715]
        basis: unallocated
        note: "Our ratios of Table 10, case studies 3 and 4 (14.5 t/h for 8.5 t/h and 25.9 t/h for 15.1 t/h). The feed is commercial fuel-grade or anhydrous ethanol (section 2.1), with full conversion and 96.5 % carbon selectivity to ethylene (Table 4)."
        conditions: {technology: "ethanol dehydration, fixed bed at 613 K and 0.48 MPa, design based on a commercial technology", region: generic, year: 2013}
        source: &haro
          citation: "Haro, P., Ollero, P., Trippe, F. (2013) Technoeconomic assessment of potential processes for bio-ethylene production. Fuel Processing Technology 114:35-48, doi:10.1016/j.fuproc.2013.03.024 (accepted manuscript)"
          url: https://idus.us.es/xmlui/bitstream/11441/34971/1/Technoeconomic%20assessment%20of%20potential%20processes%20for%20bio-Ethylene%20production.pdf
          locator: Table 10, p. 18 of the manuscript; Table 4, p. 10
          kind: peer-reviewed
          accessed: "2026-11-05"
      - id: irena-etsap-2013-ethanol
        range: [1.74, 1.74]
        basis: unallocated
        note: "One value, recorded as a zero-width range and not widened: 1.74 t of hydrated bio-ethanol per t (the brief cites Kochar et al. 1981). The water content of the hydrated ethanol is not stated, so it is not on this KPI's ethanol basis and is not bound; it would be at least about 94 wt% ethanol to stay above the stoichiometric 1.642 t/t."
        conditions: {technology: "ethanol dehydration over alumina or silica-alumina", region: generic}
        source:
          citation: "IEA-ETSAP and IRENA (2013) Production of Bio-ethylene. Technology Brief I13, January 2013"
          url: https://www.irena.org/-/media/Files/IRENA/Agency/Publication/2013/IRENA-ETSAP-Tech-Brief-I13-Production_of_Bio-ethylene.pdf
          locator: Process and technology status, p. 6 (PDF p. 8)
          kind: iea
          accessed: "2026-11-05"
  bioethylene-specific-electricity:
    title: Electricity per t of bio-ethylene
    unit: kWh/t
    references:
      - id: haro-2013-electricity
        range: [353, 397]
        basis: unallocated
        note: "Our ratios of Table 10, case studies 3 and 4 (3 MW for 8.5 t/h and 6 MW for 15.1 t/h); the MW are rounded to whole numbers. The model has a cryogenic system for the ethylene recovery (Table 6). Cases 3 and 4 are integrated plants with the ethanol synthesis inside their boundary, so the figure may include more than the dehydration; the dehydration-only case 2 gives 381 to 390 kWh/t (see the file header)."
        conditions: {technology: "ethanol dehydration with cryogenic ethylene recovery", region: generic, year: 2013}
        source: *haro
  bioethylene-external-fuel:
    title: External natural gas fired per t of bio-ethylene (fuel energy)
    unit: kWh/t
    references:
      - id: haro-2013-natural-gas
        range: [706, 728]
        basis: unallocated
        note: "Our ratios of Table 10, case studies 3 and 4 (6 MW for 8.5 t/h and 11 MW for 15.1 t/h, HHV); the recovered hydrocarbons are fired in the plant first (section 2.1.5), as in the dataset. Cases 3 and 4 are integrated plants with the ethanol synthesis inside their boundary, so the figure may include more than the dehydration; the dehydration-only case 2 gives 718 to 732 kWh/t (see the file header)."
        conditions: {technology: "ethanol dehydration, by-products fired in a gas combustor", region: generic, year: 2013}
        source: *haro

  biodiesel-specific-methanol:
    title: Methanol consumed per kg of biodiesel (fresh and in the catalyst solution)
    unit: kg/kg
    references:
      - id: nrel-2004-methanol-stoichiometric
        range: [0.1080, 0.1080]
        basis: unallocated
        note: "Our ratio of the source's mass balance of triolein with methanol at full conversion: (21.71 - 10.86) lb of methanol consumed for 100.45 lb of methyl esters. A stoichiometric value, recorded as a zero-width range; it is the dataset's own basis, so it checks the balance, not the design."
        conditions: {technology: "transesterification of triolein with methanol, full conversion, no losses", region: generic, year: 2004}
        source: &nrel-2004
          citation: "Van Gerpen, J.; Shanks, B.; Pruszko, R.; Clements, D.; Knothe, G. (2004) Biodiesel Production Technology, August 2002-January 2004. NREL/SR-510-36244, National Renewable Energy Laboratory"
          url: https://fischer-tropsch.org/DOE/DOE_reports/510/510-36244/510-36244%207-01-04.pdf
          locator: p. 4 (the mass balance of the basics chapter)
          kind: government
          accessed: "2026-11-19"
  biodiesel-specific-electricity:
    title: Electricity per kg of biodiesel (conversion plant)
    unit: kWh/kg
    references:
      - id: pradhan-2009-electricity
        range: [0.0389, 0.0389]
        basis: unallocated
        note: "Our conversion of the USDA-ARS plant model's 439 Btu of electricity per gallon of biodiesel (before the fossil-share and generation adjustments of the table's second column) at 0.8739 kg/L (methyl oleate, NREL/SR-510-36244 p. 4): 0.0389 kWh/kg. One modelled plant (9.8 Mgal/a, crushing and conversion together, conversion counted apart), recorded as a zero-width range; it covers the conversion, methanol recovery and glycerin treatment."
        conditions: {technology: "base-catalysed transesterification of soybean oil in large reactors, centrifuges, acid water wash, drying, methanol distillation; the Haas et al. (2006) process model", region: US, year: 2009}
        source: &pradhan-2009
          citation: "Pradhan, A.; Shrestha, D. (2009) Life Cycle Analysis of Soybean Biodiesel Production. ASABE Annual International Meeting, Reno, Paper No. 096669 (meeting paper)"
          url: https://biodieseleducation.org/Literature/Journal/2009_Anup_Life_Cycle_Analysis_.pdf
          locator: "p. 10, Table 4 (biodiesel conversion inputs); p. 9 (the plant model)"
          kind: other
          accessed: "2026-11-19"
  biodiesel-specific-fuel:
    title: Natural gas for steam per kg of biodiesel (fuel energy, conversion plant)
    unit: kWh/kg
    references:
      - id: pradhan-2009-natural-gas
        range: [0.3145, 0.3145]
        basis: unallocated
        note: "Our conversion of the plant model's 3,550 Btu of natural gas and steam per gallon of biodiesel (unadjusted column; the model raises its steam in an 80 % efficient boiler, p. 9) at 0.8739 kg/L: 0.3145 kWh/kg of fuel energy, 0.252 kWh/kg as steam heat. One modelled plant, recorded as a zero-width range."
        conditions: {technology: "as pradhan-2009-electricity; heat for the reaction, methanol recovery and drying", region: US, year: 2009}
        source: *pradhan-2009
  biodiesel-crude-glycerol:
    title: Crude glycerol per kg of biodiesel
    unit: kg/kg
    references:
      - id: pradhan-2009-crude-glycerin
        range: [0.1226, 0.1351]
        basis: unallocated
        note: "Our ratio of the plant model's 4,380 tons of crude glycerin to its 9.8 million gallons of biodiesel a year (32 420 t at 0.8739 kg/L): 0.1226 kg/kg if the tons are short tons, 0.1351 if metric; the crude is about 80 % glycerol (p. 7)."
        conditions: {technology: "as pradhan-2009-electricity; crude glycerin of about 80 % purity", region: US, year: 2009}
        source: *pradhan-2009

datasets:
  - process: bio-ethylene-1
    dataset: bio-ethylene-ethanol-dehydration
    conditions: {technology: "four adiabatic beds at 450 degC and 11.4 bar, steam-diluted, after Arvidsson and Lundin (2011)", basis: conceptual inventory}
    kpis:
      bioethylene-specific-ethanol:
        expression: feed:ethanol / product:ethylene
        per: product:ethylene
        reference: haro-2013-ethanol
        out_of_range_reason: "The dataset takes its source's simulated ethanol and ethylene flows (Arvidsson and Lundin 2011, Tables 4.2 and 4.4: 0.57 kg ethylene per kg ethanol), 1.743 t/t, 1.6 to 2.1 % above Haro et al. The source's overall carbon yield is about 94 %, below Haro et al.'s 96.5 % carbon selectivity at full conversion, although its reaction table (98.8 % selectivity, 99.5 % conversion, 99.1 % recovery) alone would need only 1.686 t/t; the source does not explain the difference. The 1.74 t/t of hydrated ethanol that the IEA-ETSAP and IRENA brief cites is close to the dataset's value."
      bioethylene-specific-electricity:
        expression: feed:electricity / product:ethylene
        per: product:ethylene
        reference: haro-2013-electricity
        out_of_range_reason: "The dataset's 4.4 MW (Arvidsson and Lundin 2011) covers the simulated process units (3.4 MW) and the cooling-water supply (1.0 MW), but not the refrigeration of the -25 degC C2-splitter condenser: the source assumes a refrigeration medium is available. That duty (363 kWh of cold per t) is a separate, still unlinked exchange (feed:refrigeration). At an ASSUMED coefficient of performance of 1.7 to 2.5 (Carnot about 4.1 between -25 and +35 degC) its machine power is 145 to 214 kWh/t, which brings the total to 333 to 401 kWh/t, against 353 to 397 (our arithmetic): the difference is that omission, not the two models. The power is not added to feed:electricity because the cold has its own exchange, a reported gap until a -25 degC refrigeration background exists."
      bioethylene-external-fuel:
        expression: feed:fired-heat / 0.8 / product:ethylene
        per: product:ethylene
        reference: haro-2013-natural-gas
        out_of_range_reason: "The dataset counts fired heat absorbed; the expression divides by its source's 80 % furnace efficiency to compare fuel energy. 679 kWh/t is a pinch target with feed-effluent heat exchange (Arvidsson and Lundin 2011, section 4.2.2), 4 to 7 % below Haro et al.; the two models also differ in reactor temperature, pressure and steam dilution. Both are on an HHV basis (Arvidsson and Lundin's 15.9 MW is the 18.7 MW furnace duty at 80 % less the 7.5 MW HHV of the fired by-products)."
  - process: biodiesel-1
    dataset: biodiesel-fame-from-soybean-oil-by-base-catalysed-transesterification-32-420-t-a
    conditions: {technology: "two CSTRs at 333 K with glycerol decanters, 6:1 methanol, sodium methoxide 0.25 wt% of the oil, ester methanol flash (one stage), one acid water wash, vacuum dryer, glycerol neutraliser and vacuum methanol column on MP steam, no heat integration", basis: "concept balance on Van Gerpen et al. (2004) ratios and conditions, ASSUMED conversions and separator recoveries, hand duties for the separations (DESIGN.md D-005 to D-009)"}
    kpis:
      biodiesel-specific-methanol:
        expression: (feed:MEOHF + 0.75 * feed:CATF) / product:BD
        per: product:BD
        reference: nrel-2004-methanol-stoichiometric
        out_of_range_reason: "0.1118 against the stoichiometric 0.1080 kg/kg, 3.5 % above it: the dataset converts 99.7 % of the oil (0.1088 consumed per kg of product, whose 0.30 wt% unreacted glycerides count as product mass), gets 0.0015 back from the neutralised methoxide and loses 0.0046, mostly the methanol that one flash stage leaves in the esters and the wash sends to the wastewater (DESIGN.md D-005, D-007, L-7); the reference assumes full conversion and no losses."
      biodiesel-specific-electricity:
        expression: feed:POWER / product:BD
        per: product:BD
        reference: pradhan-2009-electricity
        out_of_range_reason: "The dataset's 0.018 kWh/kg is an ASSUMED estimate of agitators, pumps and vacuum pumps (D-009), less than half the plant model's figure, which also counts centrifuges for the phase separation (the dataset decants by gravity), lighting and buildings; an estimate to be replaced by a motor list."
      biodiesel-specific-fuel:
        expression: (feed:LPS + feed:MPS) / 0.8 / product:BD
        per: product:BD
        reference: pradhan-2009-natural-gas
        out_of_range_reason: "The dataset counts LP and MP steam heat delivered (the wash water warmed from 298 K included); the expression divides by the plant model's 80 % boiler efficiency to compare fuel energy. 0.195 kWh/kg is about 62 % of the model's 0.3145: the dataset's separation duties are hand estimates at reflux 1 and without heat losses (D-009, L-4), and it heats no oil storage or tracing. Whether the model plant recovers heat is not stated in the source read (Pradhan and Shrestha 2009 describe its inputs, pp. 9-10); the dataset recovers none apart from the hot esters warming the wash water (L-6)."
      biodiesel-crude-glycerol:
        expression: product:CGLY / product:BD
        per: product:BD
        reference: pradhan-2009-crude-glycerin
        out_of_range_reason: "The dataset's crude glycerol, 0.120 kg/kg, holds 86.8 wt% glycerol and its methanol stripped (D-008), against the model's crude of about 80 %: on the glycerol it carries, 0.104 kg/kg, it equals the model's 0.098 to 0.108 at 80 %, and the stoichiometric 0.104 of NREL/SR-510-36244 p. 4."
