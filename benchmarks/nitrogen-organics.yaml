# Benchmarks of nitrogen-containing organics. Schema: schemas/benchmarks.schema.json; rules:
# docs/benchmarks.md. Ranges are facts from the cited source, in our own form.
#
# N-Bromosuccinimide (n-bromosuccinimide-1, #140): no open source gives a plant's specific
# consumptions for the caustic route. The stoichiometric floor of the bromine is 0.898 kg/kg NBS
# (one Br2 per NBS, the other bromine atom to NaBr: US 2 971 960, background); it is a limit,
# not a range of real plants, so it is not recorded as one (docs/benchmarks.md: never invent a
# range). US 2 971 960's yields (66-76 % of theory) are for its own acid route with chlorine or
# hypochlorite, other conditions, and are not bound either.
#
# Phthalimide (phthalimide-1, #161): benchmarks must be independent of the dataset
# (docs/benchmarks.md). phthalimide-1 takes its yield and ammonia ratio from US 4,419,519, so the
# patent's anhydride range is recorded but not bound, and the ammonia KPI has no independent open
# reference. The anhydride KPI is bound to the only other open figure found (Chemcess, a secondary
# summary of Ullmann's): a single yield for another variant, the co-current tube with excess
# ammonia, so the dataset sits outside it with a reason.
#
# Caprolactam (caprolactam-1, #464): the one open plant-scale figure is the ammonium sulfate per t
# of caprolactam of US 3,852,273 (background): 1.7 to 1.9 t from the rearrangement in oleum and
# 4.2 to 4.6 t in all with Raschig hydroxylamine. The total is bound; the dataset uses the
# NO-reduction hydroxylamine of hydroxylamine-1, which forms far less salt in the oximation, so it
# sits below the range with a reason. Its rearrangement share (1.82 t/t formed) is inside 1.7 to
# 1.9 (tests/test_caprolactam_1.py), which no exchange expression can isolate. No open source
# gives a plant's cyclohexanone use; the stoichiometric floor (98.145 / 113.160 = 0.867 kg/kg) is
# a limit, not a range.
#
# MDI (mdi-1, #465): the LVOC BREF (2017) Table 10.11 gives one MDI plant's phosgene (0.78 kg/kg)
# and chlorine (0.56 kg/kg) use, an example plant, not a range of plants; it is recorded as a
# zero-width range and bound, independent of the dataset (whose phosgene ratio comes from
# US 10 364 214 B1). No open source gives a plant's aniline use per kg of MDI; the stoichiometric
# floor depends on the oligomer content of the MDA and is not a range.
#
# Paracetamol (paracetamol-1, #481): benchmarks must be independent of the dataset
# (docs/benchmarks.md). The dataset takes its ratios and yields from US 3 917 695 A's examples
# (110 to 140 g of product from 109 g of 4-aminophenol, 0.78 to 0.99 kg aminophenol per kg), so
# they are not bound; no other open figure for a plant's aminophenol use or liquor volume was
# found. The stoichiometric floor of the aminophenol, 0.722 kg/kg, is a limit, not a range.
#
# 4-Aminophenol (4-aminophenol-1, #506): benchmarks must be independent of the dataset
# (docs/benchmarks.md). The dataset takes its ratios and selectivity from US 3 383 416 A's and
# US 4 307 249 A's examples, so they are not bound. US 3 953 509 A's yields (about 78 % crude
# 4-aminophenol) are for another route (sulfided catalysts at 132 to 155 C and 1.4 to 3.4 MPa)
# and are not bound either. The stoichiometric floor of the nitrobenzene, 1.128 kg/kg, is a
# limit, not a range.
schema: cheme-as-code/benchmarks/v1
family: nitrogen-organics

kpis:
  mdi-specific-phosgene:
    title: Phosgene consumption per kg of MDI (crude, monomeric and polymeric together)
    unit: kg/kg
    references:
      - id: lvoc-bref-mdi-phosgene
        range: [0.78, 0.78]
        basis: unallocated
        note: "One MDI plant's raw-material use as the BREF gives it: 0.78 kg phosgene per kg of MDI (with 0.56 kg chlorine); a single example, a zero-width range, not widened. Which MDI products the kg counts is not stated; the dataset's KPI counts the crude (monomeric plus polymeric MDI)."
        conditions: {technology: "MDA by HCl-catalysed condensation, liquid-phase phosgenation; Table 10.11 names no plant, location or year (the EU region is the BREF's scope)", region: EU}
        source:
          citation: "European Commission JRC (2017) Best Available Techniques Reference Document for the Production of Large Volume Organic Chemicals, EUR 28882 EN"
          url: https://eippcb.jrc.ec.europa.eu/sites/default/files/2019-11/JRC109279_LVOC_Bref.pdf
          locator: "Section 10.3.3, Table 10.11"
          kind: other
          accessed: "2026-11-19"
  mdi-specific-aniline:
    title: Aniline consumption per kg of MDI (crude, monomeric and polymeric together)
    unit: kg/kg
    no_open_reference: "No open source with a plant's aniline use per kg of MDI found (searched 2026-11-19: the LVOC BREF Chapter 10 gives phosgene and chlorine only; US 10 640 455 B1 and US 7 186 857 B2 give feed rates with recycled aniline, not a net use; the ISOPA 2021 and ACC 2022 eco-profiles give no foreground inventory). The stoichiometric use depends on the MDA's oligomer content (0.744 kg/kg for the two-ring MDA alone)."
  paracetamol-specific-aminophenol:
    title: 4-Aminophenol consumption per kg of paracetamol
    unit: kg/kg
    no_open_reference: "No open source independent of the dataset with a plant's 4-aminophenol use per kg of paracetamol found (searched 2026-11-19: Google Patents for the preparation of N-acetyl-p-aminophenol, US 3 917 695 A, US 4 565 890 A and US 4 524 217 A read; web search for paracetamol production yields and LCI). US 3 917 695 A's examples are the dataset's own source; the stoichiometric floor is 0.722 kg/kg."
  paracetamol-specific-wastewater:
    title: Wastewater (mother liquor purge, wash and condensate) per kg of paracetamol
    unit: kg/kg
    no_open_reference: "No open source with the liquor volume of paracetamol manufacture found (searched 2026-11-19 as for paracetamol-specific-aminophenol); US 4 565 890 A says the mother liquor is saturated with the product and holds much acetic acid, no amount per kg."
  nbs-specific-bromine:
    title: Bromine consumption per kg of N-bromosuccinimide
    unit: kg/kg
    no_open_reference: "No open source with a plant's or a pilot's bromine use per kg NBS found (searched 2026-11-05: Google Patents for the preparation of N-bromosuccinimide from succinimide, bromine and NaOH, US 2 971 960 read; PubChem CID 67184; web search for NBS production yields). Only the stoichiometric floor, 0.898 kg/kg, is known."
  nbs-specific-wastewater:
    title: Wastewater (mother liquor, wash and condensate) per kg of N-bromosuccinimide
    unit: kg/kg
    no_open_reference: "No open source with the liquor volume of NBS manufacture found (searched 2026-11-05 as for nbs-specific-bromine); US 2 971 960 says only that the caustic route needs much water to wash the bromide out of the product, no amount."
  phthalimide-specific-anhydride:
    title: Phthalic anhydride consumption per t of phthalimide
    unit: t/t
    references:
      - id: us4419519-pa-per-phthalimide
        range: [1.0085, 1.0127]
        basis: unallocated
        note: >-
          Anhydride fed over phthalimide obtained (melt plus the part recovered from the off-gas) in the
          patent's two examples, 715/709 and 400/395, rounded to four digits; the product counts as obtained,
          99.6 to 99.8 wt% phthalimide. Pilot-scale tubes of 25 and 100 mm.
        conditions: {technology: "continuous ejector mixing and tube reaction, about 1 mol NH3 per mol anhydride, 260 to 265 degC, pure molten anhydride", pressure: 3.5 to 5 bar, capacity: pilot tubes of 25 and 100 mm, year: 1983}
        source:
          citation: "BASF AG (1983) Continuous preparation of phthalimide. US Patent 4,419,519"
          url: https://patents.google.com/patent/US4419519A/en
          locator: Examples 1 and 2
          kind: other
          accessed: "2026-11-05"
      - id: chemcess-tube-yield
        range: [1.0272, 1.0272]
        basis: unallocated
        note: >-
          A single yield of 98 % for the co-current vertical tube with excess ammonia and a sublimation
          chamber, converted by us to anhydride per phthalimide with the molar masses (148.117 / 147.133 /
          0.98); a zero-width range, not widened. A secondary web summary whose only reference is
          Ullmann's chapter Phthalic Acid and Derivatives in the edition doi:10.1002/14356007.a20_181.pub2,
          so the 98 % is that edition's figure as Chemcess gives it; the chapter was not read (nor the
          later edition, .pub3).
        conditions: {technology: "co-current packed tube, excess ammonia, 250 to 280 degC, product by sublimation", purity: 99 %}
        source:
          citation: "Chemcess (n.d.) Phthalimide: properties, reactions, production and uses, section 3.1. Primary source as Chemcess gives it: Ullmann's Encyclopedia of Industrial Chemistry, Phthalic Acid and Derivatives, doi:10.1002/14356007.a20_181.pub2 (via Chemcess, not read)"
          url: https://chemcess.com/?p=28683
          locator: Section 3.1
          kind: other
          accessed: "2026-11-05"
  phthalimide-specific-ammonia:
    title: Ammonia consumption per t of phthalimide
    unit: t/t
    no_open_reference: >-
      No open source independent of the dataset gives an ammonia consumption for phthalimide (2026-11-05).
      The only figures found are the dataset's own source, US 4,419,519 Examples 1 and 2 (82.5/709 and
      46/395, 0.1164 to 0.1165 t/t at 1.000 and 1.003 mol NH3 per mol anhydride), so they are not bound
      here. US 4,001,273 (Example 1, a countercurrent column at 1 mol NH3 per mol anhydride) has a single
      run whose phthalimide leaves partly as flakes and partly in a washed off-gas sent on to anthranilic
      acid, so its ammonia per t depends on how the off-gas share is counted (about 0.12 to 0.15 t/t);
      not bound. The Chemcess summary says excess ammonia for the co-current tube, without a figure. Ullmann's chapter (later edition
      doi:10.1002/14356007.a20_181.pub3; Chemcess cites the earlier .pub2) is licensed and was not read.
  phthalimide-specific-electricity:
    title: Electricity per t of phthalimide
    unit: kWh/t
    no_open_reference: >-
      No open source with an electricity figure for phthalimide found (2026-11-05). Read: US 4,419,519
      and US 4,001,273 (full text, no utility data), the Chemcess summary (no energy figures). Searched
      the web for phthalimide energy or steam per tonne: only phthalic anhydride figures came up. Ullmann's
      chapter (later edition doi:10.1002/14356007.a20_181.pub3; Chemcess cites the earlier .pub2) is
      licensed and was not read. The dataset's value is
      core's Tier 0 default, ASSUMED.
  phthalimide-specific-heat:
    title: Heat per t of phthalimide
    unit: kWh/t
    no_open_reference: >-
      No open source with a heat or steam figure for phthalimide found (2026-11-05); same search as the
      electricity KPI. The patents only state that the reaction is exothermic and that the feeds and the
      tube are heated. The dataset's value is core's Tier 0 default, ASSUMED.
  acn-specific-propylene:
    title: Propylene consumption per t of acrylonitrile (SOHIO ammoxidation)
    unit: t/t
    references:
      - id: ipcc-2006-acn-propylene
        range: [1.09, 1.09]
        basis: unallocated
        note: >-
          The IPCC default feedstock consumption, a single value (zero-width range, not widened),
          from process-specific yield and consumption data of the EU LVOC BREF of 2003, about 70 %
          primary product yield on propylene (IPCC gives no plant age for it).
        conditions: {technology: "SOHIO direct ammoxidation of propylene, fluid bed", year: 2003}
        source:
          citation: "IPCC (2006) 2006 IPCC Guidelines for National Greenhouse Gas Inventories, Vol. 3 Industrial Processes and Product Use, chapter 3 Chemical Industry Emissions, section 3.9, text under Table 3.22"
          url: https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/3_Volume3/V3_3_Ch3_Chemical_Industry.pdf
          locator: p. 3.79, text under Table 3.22
          kind: other
          accessed: "2026-11-19"
  acn-direct-co2:
    title: Process CO2 per t of acrylonitrile, secondary products recovered
    unit: t/t
    references:
      - id: ipcc-2006-acn-co2-recovered
        range: [0.79, 0.79]
        basis: unallocated
        note: >-
          IPCC Table 3.22 factor for the configuration in which acetonitrile and HCN are recovered as
          products, from the 2003 LVOC BREF; excludes the CO2 of auxiliary fuel.
          A single value (zero-width range).
        conditions: {technology: "SOHIO direct ammoxidation of propylene, acetonitrile and HCN recovered", year: 2003}
        source:
          citation: "IPCC (2006) 2006 IPCC Guidelines for National Greenhouse Gas Inventories, Vol. 3, chapter 3, Table 3.22"
          url: https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/3_Volume3/V3_3_Ch3_Chemical_Industry.pdf
          locator: p. 3.79, Table 3.22
          kind: other
          accessed: "2026-11-19"

  caprolactam-specific-ammonium-sulfate:
    title: Ammonium sulfate co-product per kg of caprolactam
    unit: kg/kg
    references:
      - id: us3852273-raschig-total
        range: [4.2, 4.6]
        basis: unallocated
        note: >-
          The total ammonium sulfate of the conventional process with Raschig hydroxylamine (reduction of
          ammonium nitrite with SO2): 2.5 to 2.7 t from the oximation and 1.7 to 1.9 t from the rearrangement
          in oleum, per t of caprolactam, as the patent's background states them.
        conditions: {technology: "hydroxylammonium sulfate by the Raschig synthesis, oximation neutralised with ammonia, Beckmann rearrangement in oleum neutralised with ammonia", year: 1971}
        source:
          citation: "De Rooij, A. H. (Stamicarbon) (1974) Process for preparing and recovering lactams. US Patent 3,852,273"
          url: https://patents.google.com/patent/US3852273A/en
          locator: Background of the invention
          kind: other
          accessed: "2026-11-19"
  caprolactam-specific-cyclohexanone:
    title: Cyclohexanone consumption per kg of caprolactam
    unit: kg/kg
    no_open_reference: "No open source with a plant's cyclohexanone use per kg of caprolactam found (searched 2026-11-19: Google Patents for oximation and Beckmann rearrangement, US 4,031,139, US 4,804,754, US 7,339,056 B2 read; the LVOC BREF 2017 section 2.1.4.7.1; Wikipedia). Only the stoichiometric floor, 0.867 kg/kg, is known."

  pap-specific-nitrobenzene:
    title: Nitrobenzene consumption per kg of 4-aminophenol
    unit: kg/kg
    no_open_reference: "No open source independent of the dataset with a plant's nitrobenzene use per kg of 4-aminophenol found (searched 2026-11-19: Google Patents US 3 383 416 A, US 4 307 249 A and US 3 953 509 A read; PubChem CID 403). US 3 383 416 A's examples are the dataset's own source (Example 1(A): 73 % isolated on the nitrobenzene reacted, 79 % with the 6 % found in the filtrate by analysis; Examples 3 and 4: 73 to 78 % isolated on new nitrobenzene charged); US 3 953 509 A is another route; the stoichiometric floor is 1.128 kg/kg."
  pap-specific-wastewater:
    title: Ammonium sulfate liquor (mother liquor, wash and condensate) per kg of 4-aminophenol
    unit: kg/kg
    no_open_reference: "No open source with the liquor volume of 4-aminophenol manufacture found (searched 2026-11-19 as for pap-specific-nitrobenzene); the patents give laboratory charges (1700 g of water on 271 g of nitrobenzene, about 6.3 g per g, in US 3 383 416 A Example 1(A)), no plant figure."

datasets:
  - process: caprolactam-1
    dataset: caprolactam-from-cyclohexanone-oxime-by-beckmann-rearrangement-in-oleum-100-kt-a
    conditions: {technology: "oximation with hydroxylammonium sulfate from NO reduction and ammonia, Beckmann rearrangement in oleum, neutralisation with ammonia, benzene extraction, vacuum distillation", basis: "concept balance, DESIGN.md D-004 to D-010"}
    kpis:
      caprolactam-specific-ammonium-sulfate:
        expression: product:ASP / product:PROD
        per: product:PROD
        reference: us3852273-raschig-total
        out_of_range_reason: "Another hydroxylamine: the reference's total is for Raschig hydroxylamine, whose oximation forms 2.5 to 2.7 t/t; the dataset takes hydroxylamine-1's NO-reduction solution, whose oximation forms 0.71 kg/kg with its free acid, so the total is 2.48 kg/kg. Its rearrangement share, 1.82 kg/kg formed, lies in the reference's 1.7 to 1.9."
      caprolactam-specific-cyclohexanone: {expression: feed:CHNF / product:PROD, per: product:PROD}
  - process: n-bromosuccinimide-1
    dataset: n-bromosuccinimide-by-semi-batch-bromination-of-succinimide-in-aqueous-naoh-500-t-a
    conditions: {technology: "caustic bromination of succinimide, semi-batch at 278 K, reslurry wash, vacuum drying", basis: "concept balance, ASSUMED ratios (DESIGN.md D-004, D-007)"}
    kpis:
      nbs-specific-bromine: {expression: feed:BR2 / product:NBS, per: product:NBS}
      nbs-specific-wastewater: {expression: product:WW / product:NBS, per: product:NBS}
  - process: phthalimide-1
    dataset: phthalimide-pa-ammonia-continuous
    conditions: {technology: continuous ejector and tube reactor, basis: Tier 0 screening on a patent's examples}
    kpis:
      phthalimide-specific-anhydride:
        expression: feed:phthalic-anhydride / product:phthalimide
        per: product:phthalimide
        reference: chemcess-tube-yield
        out_of_range_reason: "Another variant: the reference's 98 % yield is for the older co-current tube with excess ammonia and a sublimation chamber, whereas the dataset takes the ejector and tube process's 99.6 % (US 4,419,519, Examples 1 and 2; the patent's own range, 1.0085 to 1.0127 t/t, is recorded as a reference but not bound, as it is the dataset's source). So the dataset uses about 1.6 % less anhydride."
      phthalimide-specific-ammonia: {expression: feed:ammonia / product:phthalimide, per: product:phthalimide}
      phthalimide-specific-electricity: {expression: feed:electricity / product:phthalimide, per: product:phthalimide}
      phthalimide-specific-heat: {expression: feed:heat / product:phthalimide, per: product:phthalimide}
  - process: acrylonitrile-1
    dataset: acrylonitrile-sohio-propylene-ammoxidation-15-t-h
    conditions: {technology: "fluid-bed propylene ammoxidation over a Bi-Mo catalyst (US 6 596 897 B1 product slate), acid quench, absorption, recovery and purification, HCN and acetonitrile recovered, off-gas thermal oxidiser", basis: "concept balance, sourced selectivities and ASSUMED separator splits (DESIGN.md D-004 to D-008)"}
    kpis:
      acn-specific-propylene:
        expression: feed:C3 / product:ACNP
        per: product:ACNP
        reference: ipcc-2006-acn-propylene
        out_of_range_reason: "Another catalyst generation: the reference is the 2003 BREF's plant average at about 70 % yield, the dataset uses a 1997 patent catalyst at 79.7 % single-pass acrylonitrile yield (US 6 596 897 B1), so it needs about 8 % less propylene (DESIGN.md D-004)."
      acn-direct-co2:
        expression: emission:CO2 / product:ACNP
        per: product:ACNP
        reference: ipcc-2006-acn-co2-recovered
        out_of_range_reason: "Fewer carbon oxides: the dataset's catalyst sends 11.2 % of the propylene carbon to CO and CO2 (US 6 596 897 B1), the reference rests on the 2003 BREF plants at about 70 % acrylonitrile yield; the dataset's figure also includes the support fuel's CO2 (0.014 t/t), which the reference excludes (DESIGN.md D-004, D-008)."
  - process: mdi-1
    dataset: mdi-and-polymeric-mdi-by-aniline-formaldehyde-condensation-and-liquid-phase-phosgenation-178-kt-a-crude-mdi
    conditions: {technology: "aniline and formalin condensed over HCl in a cascade, neutralised with caustic soda; the MDA phosgenated as a 27.1 % solution in MCB with a 35 % phosgene solution through a mixing nozzle and tower at 384 K and 160 kPa(a); monomeric MDI distilled off the polymeric MDI", basis: "concept balance on the nameplate ratios of US 10 640 455 B1 and US 10 364 214 B1, ASSUMED separator splits and duties (DESIGN.md D-003 to D-009)"}
    kpis:
      mdi-specific-phosgene:
        expression: feed:PHOSF / (product:MDIP + product:PMDIP)
        per: product:MDIP
        reference: lvoc-bref-mdi-phosgene
        out_of_range_reason: "Rounding: the reference is given to two digits (0.78) and the dataset's 0.7844 kg/kg rounds to it; a zero-width range from one example plant cannot hold a value to four digits. The dataset's ratio is the independent one of US 10 364 214 B1 (2.0588 kg phosgene per kg MDA), not fitted to the BREF."
      mdi-specific-aniline: {expression: feed:ANLF / (product:MDIP + product:PMDIP), per: product:MDIP}
  - process: paracetamol-1
    dataset: paracetamol-by-semi-batch-acetylation-of-4-aminophenol-in-aqueous-acetic-acid-2000-t-a
    conditions: {technology: "acetylation of 4-aminophenol in aqueous acetic acid, semi-batch at 313 K, cooling crystallisation, centrifuge, vacuum drying, half the mother liquor recycled", basis: "concept balance, ratios from US 3 917 695 A and ASSUMED (DESIGN.md D-004, D-007)"}
    kpis:
      paracetamol-specific-aminophenol: {expression: feed:PAPF / product:APAP, per: product:APAP}
      paracetamol-specific-wastewater: {expression: product:WW / product:APAP, per: product:APAP}
  - process: 4-aminophenol-1
    dataset: 4-aminophenol-by-batch-hydrogenation-of-nitrobenzene-in-dilute-sulfuric-acid-bamberger-route
    conditions: {technology: "Pt/C hydrogenation of nitrobenzene in dilute sulfuric acid with the Bamberger rearrangement, semi-batch at 358 K stopped at 0.88 conversion on a recycled heel, ammonia neutralisation, aniline distillation with water fed at constant level, one crop crystallised", basis: "concept balance, ratios from US 3 383 416 A and ASSUMED (DESIGN.md D-004, D-008)"}
    kpis:
      pap-specific-nitrobenzene: {expression: feed:NBF / product:PAPP, per: product:PAPP}
      pap-specific-wastewater: {expression: product:WW / product:PAPP, per: product:PAPP}
