# Benchmarks of nitrogen-containing organics. Schema: schemas/benchmarks.schema.json; rules:
# docs/benchmarks.md. Ranges are facts from the cited source, in our own form.
#
# N-Bromosuccinimide (n-bromosuccinimide-1, #140): no open source gives a plant's specific
# consumptions for the caustic route. The stoichiometric floor of the bromine is 0.898 kg/kg NBS
# (one Br2 per NBS, the other bromine atom to NaBr: US 2 971 960, background); it is a limit,
# not a range of real plants, so it is not recorded as one (docs/benchmarks.md: never invent a
# range). US 2 971 960's yields (66-76 % of theory) are for its own acid route with chlorine or
# hypochlorite, other conditions, and are not bound either.
#
# Phthalimide (phthalimide-1, #161): benchmarks must be independent of the dataset
# (docs/benchmarks.md). phthalimide-1 takes its yield and ammonia ratio from US 4,419,519, so the
# patent's anhydride range is recorded but not bound, and the ammonia KPI has no independent open
# reference. The anhydride KPI is bound to the only other open figure found (Chemcess, a secondary
# summary of Ullmann's): a single yield for another variant, the co-current tube with excess
# ammonia, so the dataset sits outside it with a reason.
schema: cheme-as-code/benchmarks/v1
family: nitrogen-organics

kpis:
  nbs-specific-bromine:
    title: Bromine consumption per kg of N-bromosuccinimide
    unit: kg/kg
    no_open_reference: "No open source with a plant's or a pilot's bromine use per kg NBS found (searched 2026-11-05: Google Patents for the preparation of N-bromosuccinimide from succinimide, bromine and NaOH, US 2 971 960 read; PubChem CID 67184; web search for NBS production yields). Only the stoichiometric floor, 0.898 kg/kg, is known."
  nbs-specific-wastewater:
    title: Wastewater (mother liquor, wash and condensate) per kg of N-bromosuccinimide
    unit: kg/kg
    no_open_reference: "No open source with the liquor volume of NBS manufacture found (searched 2026-11-05 as for nbs-specific-bromine); US 2 971 960 says only that the caustic route needs much water to wash the bromide out of the product, no amount."
  phthalimide-specific-anhydride:
    title: Phthalic anhydride consumption per t of phthalimide
    unit: t/t
    references:
      - id: us4419519-pa-per-phthalimide
        range: [1.0085, 1.0127]
        basis: unallocated
        note: >-
          Anhydride fed over phthalimide obtained (melt plus the part recovered from the off-gas) in the
          patent's two examples, 715/709 and 400/395, rounded to four digits; the product counts as obtained,
          99.6 to 99.8 wt% phthalimide. Pilot-scale tubes of 25 and 100 mm.
        conditions: {technology: "continuous ejector mixing and tube reaction, about 1 mol NH3 per mol anhydride, 260 to 265 degC, pure molten anhydride", pressure: 3.5 to 5 bar, capacity: pilot tubes of 25 and 100 mm, year: 1983}
        source:
          citation: "BASF AG (1983) Continuous preparation of phthalimide. US Patent 4,419,519"
          url: https://patents.google.com/patent/US4419519A/en
          locator: Examples 1 and 2
          kind: other
          accessed: "2026-11-05"
      - id: chemcess-tube-yield
        range: [1.0272, 1.0272]
        basis: unallocated
        note: >-
          A single yield of 98 % for the co-current vertical tube with excess ammonia and a sublimation
          chamber, converted by us to anhydride per phthalimide with the molar masses (148.117 / 147.133 /
          0.98); a zero-width range, not widened. A secondary web summary whose only reference is
          Ullmann's chapter Phthalic Acid and Derivatives in the edition doi:10.1002/14356007.a20_181.pub2,
          so the 98 % is that edition's figure as Chemcess gives it; the chapter was not read (nor the
          later edition, .pub3).
        conditions: {technology: "co-current packed tube, excess ammonia, 250 to 280 degC, product by sublimation", purity: 99 %}
        source:
          citation: "Chemcess (n.d.) Phthalimide: properties, reactions, production and uses, section 3.1. Primary source as Chemcess gives it: Ullmann's Encyclopedia of Industrial Chemistry, Phthalic Acid and Derivatives, doi:10.1002/14356007.a20_181.pub2 (via Chemcess, not read)"
          url: https://chemcess.com/?p=28683
          locator: Section 3.1
          kind: other
          accessed: "2026-11-05"
  phthalimide-specific-ammonia:
    title: Ammonia consumption per t of phthalimide
    unit: t/t
    no_open_reference: >-
      No open source independent of the dataset gives an ammonia consumption for phthalimide (2026-11-05).
      The only figures found are the dataset's own source, US 4,419,519 Examples 1 and 2 (82.5/709 and
      46/395, 0.1164 to 0.1165 t/t at 1.000 and 1.003 mol NH3 per mol anhydride), so they are not bound
      here. US 4,001,273 (Example 1, a countercurrent column at 1 mol NH3 per mol anhydride) has a single
      run whose phthalimide leaves partly as flakes and partly in a washed off-gas sent on to anthranilic
      acid, so its ammonia per t depends on how the off-gas share is counted (about 0.12 to 0.15 t/t);
      not bound. The Chemcess summary says excess ammonia for the co-current tube, without a figure. Ullmann's chapter (later edition
      doi:10.1002/14356007.a20_181.pub3; Chemcess cites the earlier .pub2) is licensed and was not read.
  phthalimide-specific-electricity:
    title: Electricity per t of phthalimide
    unit: kWh/t
    no_open_reference: >-
      No open source with an electricity figure for phthalimide found (2026-11-05). Read: US 4,419,519
      and US 4,001,273 (full text, no utility data), the Chemcess summary (no energy figures). Searched
      the web for phthalimide energy or steam per tonne: only phthalic anhydride figures came up. Ullmann's
      chapter (later edition doi:10.1002/14356007.a20_181.pub3; Chemcess cites the earlier .pub2) is
      licensed and was not read. The dataset's value is
      core's Tier 0 default, ASSUMED.
  phthalimide-specific-heat:
    title: Heat per t of phthalimide
    unit: kWh/t
    no_open_reference: >-
      No open source with a heat or steam figure for phthalimide found (2026-11-05); same search as the
      electricity KPI. The patents only state that the reaction is exothermic and that the feeds and the
      tube are heated. The dataset's value is core's Tier 0 default, ASSUMED.

datasets:
  - process: n-bromosuccinimide-1
    dataset: n-bromosuccinimide-by-semi-batch-bromination-of-succinimide-in-aqueous-naoh-500-t-a
    conditions: {technology: "caustic bromination of succinimide, semi-batch at 278 K, reslurry wash, vacuum drying", basis: "concept balance, ASSUMED ratios (DESIGN.md D-004, D-007)"}
    kpis:
      nbs-specific-bromine: {expression: feed:BR2 / product:NBS, per: product:NBS}
      nbs-specific-wastewater: {expression: product:WW / product:NBS, per: product:NBS}
  - process: phthalimide-1
    dataset: phthalimide-pa-ammonia-continuous
    conditions: {technology: continuous ejector and tube reactor, basis: Tier 0 screening on a patent's examples}
    kpis:
      phthalimide-specific-anhydride:
        expression: feed:phthalic-anhydride / product:phthalimide
        per: product:phthalimide
        reference: chemcess-tube-yield
        out_of_range_reason: "Another variant: the reference's 98 % yield is for the older co-current tube with excess ammonia and a sublimation chamber, whereas the dataset takes the ejector and tube process's 99.6 % (US 4,419,519, Examples 1 and 2; the patent's own range, 1.0085 to 1.0127 t/t, is recorded as a reference but not bound, as it is the dataset's source). So the dataset uses about 1.6 % less anhydride."
      phthalimide-specific-ammonia: {expression: feed:ammonia / product:phthalimide, per: product:phthalimide}
      phthalimide-specific-electricity: {expression: feed:electricity / product:phthalimide, per: product:phthalimide}
      phthalimide-specific-heat: {expression: feed:heat / product:phthalimide, per: product:phthalimide}
