# Benchmarks of iron and steel: for now the integrated BF-BOF route. Schema:
# schemas/benchmarks.schema.json; rules: docs/benchmarks.md. Ranges are facts from the cited
# source, in our own form.
#
# Independence: the CO2 reference (IPCC 2006 Tier 1) rests on world data of 2003 (IISI) and expert
# consensus, not on the BREF data collection the dataset is built from, but the dataset's CO2 uses
# the same IPCC volume's Tier 2 carbon contents. The scrap reference is the BREF range whose
# midpoint the dataset takes: transcription only, not a check.
schema: cheme-as-code/benchmarks/v1
family: iron-steel

kpis:
  bf-bof-direct-co2:
    title: Direct fossil CO2 per t of crude steel, integrated BF-BOF route
    unit: kg/t
    references:
      - id: ipcc-2006-tier1-bof
        range: [1460, 1460]
        basis: unallocated
        note: >-
          The IPCC Tier 1 default for BOF steelmaking, recorded as a zero-width range and not
          widened. It includes the blast furnace iron making (Table 4.1 footnote). It does not
          include the coke ovens and the sinter plant: the Tier 1 method adds sinter (Equation 4.7,
          0.20 t CO2/t sinter) and coke (Equation 4.1, 0.56 t CO2/t coke, reported in the Energy
          sector) as separate terms (sections 4.2.2.1 and 4.2.2.2, p. 4.17 and 4.19). Based on 2003 world data and
          expert consensus.
        conditions: {technology: "basic oxygen furnace with blast furnace iron making", region: world, year: 2003}
        source:
          citation: "IPCC (2006) 2006 IPCC Guidelines for National Greenhouse Gas Inventories, Vol. 3 Industrial Processes and Product Use, ch. 4 Metal Industry Emissions"
          url: https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/3_Volume3/V3_4_Ch4_Metal_Industry.pdf
          locator: Section 4.2.2.3, Table 4.1 and its footnotes, p. 4.25; Equations 4.1 and 4.4 to 4.8, sections 4.2.2.1-4.2.2.2
          kind: other
          accessed: "2026-11-05"
  bf-bof-scrap-charge:
    title: Scrap charged to the converter per t of liquid steel
    unit: kg/t
    references:
      - id: bref-is-bof-scrap
        range: [101, 340]
        basis: unallocated
        note: Not independent of the dataset, which takes the midpoint of this range.
        conditions: {technology: basic oxygen steelmaking, region: EU, year: 2004}
        source:
          citation: "Remus, R. et al. (2013) Best Available Techniques (BAT) Reference Document for Iron and Steel Production. JRC Reference Report EUR 25521 EN, doi:10.2791/97469"
          url: https://eippcb.jrc.ec.europa.eu/sites/default/files/2019-11/IS_Adopted_03_2012.pdf
          locator: Section 7.2.1, Table 7.3, p. 369
          kind: bref
          accessed: "2026-11-05"
  bf-bof-purchased-electricity:
    title: Purchased electricity per t of crude steel, integrated BF-BOF route
    unit: kWh/t
    no_open_reference: >-
      No open source with a site-level electricity figure per t of crude steel for integrated
      works found (2026-11-05). Read: the Iron and Steel BREF (EUR 25521 EN) gives electricity per
      plant only (Tables 3.2, 5.2, 6.1, 7.3), which the dataset sums, and its section 7.2.2.4
      estimate for the converter alone; Pardo, Moya and Vatopoulos (2012), JRC EUR 25543 EN,
      Table 2, gives direct and primary energy per plant, not electricity; IPCC 2006 Vol. 3 ch. 4
      gives none. The dataset's value is gross: the works' own generation from process gases is
      not credited.

datasets:
  - process: iron-steel-1
    dataset: iron-steel-bf-bof-integrated
    conditions: {technology: "coke ovens, sinter, blast furnace, BOF; every process gas burnt at the works", basis: conceptual inventory, region: EU, year: 2004}
    kpis:
      bf-bof-direct-co2:
        expression: emission:CO2 / product:steel
        per: product:steel
        reference: ipcc-2006-tier1-bof
        out_of_range_reason: >-
          The dataset's boundary is wider than the reference: it counts the CO2 of the coke ovens
          and the sinter plant as well as the blast furnace and converter (every process gas burnt
          at the works), by an IPCC Tier 2 carbon balance on EU data of 2004, while the Tier 1 BOF
          factor (a world value of 2003) leaves coke and sinter to factors of their own. Adding the
          IPCC Tier 1 sinter (0.20 t/t) and coke (0.56 t/t) factors at this dataset's 935 kg sinter
          and 351 kg coke per t gives about 1840 kg/t; the per-plant direct CO2 of Pardo, Moya and
          Vatopoulos (2012, JRC EUR 25543 EN, Table 2, p. 13) at the same ratios gives about 1690
          kg/t. The dataset's 1645 kg/t is 3 % below the second and 11 % below the first (our
          arithmetic, not ranges from the sources).
      bf-bof-scrap-charge: {expression: feed:scrap / product:steel, per: product:steel, reference: bref-is-bof-scrap}
      bf-bof-purchased-electricity: {expression: feed:electricity / product:steel, per: product:steel}
