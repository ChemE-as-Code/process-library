# Reference record for the CAU-10-H water harvester case (#334, tracker #333; ADR 0030, ADR 0031).
# Facts (conditions, numbers) taken from the pinned sources, restated in our own form with
# locators. No table, figure or text of the sources is copied here. The isotherm data are not
# committed: run.py downloads them at runtime and checks the sha256 below.
# Corrected after the freeze (descriptive fields only: version, point counts, one locator, the
# digitiser reference and the occluded-marker uncertainty; no reference value, pixel centre or
# calibration changed). comparison.md lists each change; the frozen text is in commit d25eee1.
# Corrected again after the freeze, 2026-11-04, when the repository owner obtained the
# Supporting Information (SI): paper.supporting_information, the descriptor definitions,
# sample_mapping.other_cau10_h and reference_figure.identification_of_sample_8 (each marked
# "corrected after the freeze"). No reference value, pixel centre or calibration changed. The
# SI values compared by run.py are frozen in tolerances-si.yaml (commit ac79bdf6).

paper:
  doi: 10.1002/adma.202210050
  version: >-
    early-view version of record (Adv. Mater. 2023, 2210050, pages 1 to 13 of 13; online
    2023-01-18; later assigned to Adv. Mater. 36(12), e2210050), pinned by the sha256 below. Page
    locators in this file refer to that early-view pagination
  title: "Confined water cluster formation in water harvesting by metal-organic frameworks: CAU-10-H versus CAU-10-CH3"
  authors: van der Veen, Canossa, Wahiduzzaman, Nenert, Fröhlich, Rega, Reinsch, Shupletsov, Markey, De Vos, Bonn, Stock, Maurin, Backus
  open_copy:
    url: https://repository.tudelft.nl/file/File_825f422e-2945-4ff4-81b3-a714e1df4776
    note: TU Delft repository copy of the early-view version of record (14 pages, cover page added, so PDF page = printed page + 1)
    sha256: 5c8796e53beaaedcf6f3c296d6638ab895225cb4c2615a7a6dcda8edcdf03fee
  licence:
    name: CC BY-NC 4.0 (stated on page 1 of the article)
    note: >-
      Only facts and numbers are restated here, with attribution, and our own figures are drawn
      from the dataset, not from the article. Nothing of the article is redistributed.
  supporting_information:
    # corrected after the freeze (frozen text: status "not obtained"; Table S7 and Section 7
    # "not available to this case")
    status: obtained by the repository owner on 2026-11-04
    files:
      - name: adma202210050-sup-0001-SuppMat.pdf
        pages: 37
        sha256: e906a0672c76ed9b03c9ac6d7c7ecd83c6cb7a81b31ddb71e581657b2fe7b59b
        used: Section 7 (p. 30) and Table S7 (p. 31), as facts below and in tolerances-si.yaml
      - name: adma202210050-sup-0003-SuppMat.zip
        sha256: 6d880ac47f053409c43ea47e79a591deaffc9f9dc6390dc10aa4741bac9fa800   # as recorded in tolerances-si.yaml
        used: not used (seven CIF crystal structures and one CheckCIF report; no isotherm data)
    committed: false
    note: >-
      Hosted only by the publisher. Scripted and WebFetch requests returned HTTP 403
      (2026-11-04) and no open copy was found (OpenAlex, Europe PMC, HAL, KU Leuven Lirias,
      TU Delft repository hold the article only); the owner obtained the files and handed them
      to this case. They are not committed or redistributed (publisher files; no licence is
      stated in them). Only facts and numbers are restated here, in our own form, with locators.
      SI locators are its printed page numbers (PDF page = printed page + 1).
    section_7:  # p. 30, restated
      descriptors: >-
        total capacity, alpha, delta_p_75_25 and K_H were computed by the authors from the
        isotherms of their dataset and of Reinsch et al.
      interpolation: the first three from a linear interpolation of each isotherm traced with 10 000 points
      total_capacity: read at p/p0 0.85, because most of the isotherms end there
      zero_delta_p: one CAU-10-H series of Reinsch et al. gave a negative delta_p_75_25 (measurement error) and was set to 0
      henry_constant: >-
        K_H is the ratio of the adsorbed amount to the bulk gas density, the density taken from the
        ideal-gas law; hence C = (K_H p0 / (R T)) (p/p0), C in mmol/g, R = 8.314 J/(mol K), T in K,
        p0 the saturation pressure of water in Pa. The relation is taken to hold below p/p0 0.1;
        each isotherm was fitted linearly on 0 to 0.1 if at least 3 points lie there (extended to
        0.11 for CAU-23; a lower sub-range for MIL-100(Cr), MIL-160 and Mg-CUK-1, which show two
        linear parts). The table gives the slope K_H p0 / (R T) and the R2 of the fit
      not_stated: whether the fit had an intercept; whether R2 is centred; the source of p0 (row 8 implies 7377 Pa, 0.7 % above IF97 at 313.000 K); for series that end below p/p0 0.85, where total capacity was read
      table_name: the text calls the table "Table S7.1"; its caption is "Table S7"
    table_s7_row_8:  # p. 31, row 8 of 28; decimal commas written as points
      source: https://doi.org/10.4121/22009211
      mof: CAU-10-H
      temperature_K: 313
      total_capacity: {value: 0.92, unit_as_stated: g/g}
      alpha: 0.197
      delta_p_75_25: 0.007
      henry_slope_mmol_per_g: 6.14
      r2: 0.9562
      K_H_cm3_per_g: 2166
  accessed: "2026-11-04"
  kind: peer-reviewed article (materials study; reports derived isotherm descriptors, no device sizing)

