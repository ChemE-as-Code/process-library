publication:
  title: A Water-Free In Situ HF Treatment for Ultrabright InP Quantum Dots
  authors: R. F. Ubbink, G. Almeida, H. Iziyi, I. du Fossé, R. Verkleij, S. Ganapathy, E. R. H. van Eck, A. J. Houtepen
  journal: Chemistry of Materials 2022, 34 (22), 10093-10103
  doi: 10.1021/acs.chemmater.2c02800
  open_access: PMC9686131 (Europe PMC full text XML), publisher version
  licence: CC BY 4.0 (article); we use facts and numbers only, restated
  supporting_information: cm2c02800_si_001.pdf (Europe PMC supplementary files of PMC9686131)
  accessed: "2026-11-04"
  kind: peer-reviewed article reporting the measurements of the dataset

# Methods facts used by the analysis (Methods, "Optical Characterization" and treatment sections).
method_facts:
  plqy_method: relative method following the IUPAC technical report (Brouwer 2011) against coumarin 102 in ethanol
  excitation_wavelength: {value: 387, unit: nm}
  sample_od_at_excitation: {value: 0.1, unit: "-", qualifier: "approximately, for all samples"}
  reference_qy_used: {value: 0.95, unit: "-", note: literature value; the authors measured 0.99 in their sphere}
  detector_correction: integrated emission corrected with a detector calibration curve
  qd_stock_concentration: {value: 1.37, unit: mM, qualifier: approximately}
  extinction_coefficient_330nm: {value: 0.45, unit: cm-1 uM-1, basis: Maxwell-Garnett model, per QD}
  qd_diameter: {value: 2.6, unit: nm}
  standard_batch: {qd_stock: 30 uL, qd_amount: 41 nmol, mesitylene: 820 uL, octylamine: "90 uL of 0.64 M (58 umol)", benzoyl_fluoride: "90 uL of 0.45 M (41 umol)", temperature: 150 C, duration: "2 min open then 58 min closed"}
  treatment_200C: {solvent: hexadecane, amine: didodecylamine, reagent_volumes: 130 uL each}
  treatment_ZnCl2: {zncl2: "10 uL of 0.64 M (6.4 umol)", reagent_volumes: 150 uL each, duration: 5 min}
  treatment_InF3: {inf3: "50 mg (0.29 mmol)", mesitylene: 1 mL, qd_amount: 41 nmol, temperature: 150 C, duration: 1 h}
  lifetime_method: biexponential fit, intensity-weighted average tau = (A1 t1^2 + A2 t2^2)/(A1 t1 + A2 t2); 400 nm pulsed laser; emission at 540 nm
  locator: Methods, sections "In Situ HF Treatment", "ZnCl2 Addition", "Pure InF3 Treatment", "Optical Characterization"

# Reported optical results restated as facts. type: value | upper_bound | lower_bound | qualitative.
reported_results:
  abs_peak_before:      {value: 476, unit: nm, type: value, applies_to: F1-150-00, locator: "Results, paragraph on Figure 1C: first absorption peak 'from 476 to 463 nm'; also Figure 1C inset annotation"}
  abs_peak_initial:     {value: 463, unit: nm, type: value, applies_to: F1-150-05, locator: "Results, same sentence ('initially found slightly blue-shifted')", note: "'initially' read as the first aliquot (5 min)"}
  abs_redshift_later:   {type: qualitative, statement: first absorption peak red-shifts over time as the treatment continues, applies_to: "F1-150-05 to F1-150-60", locator: Results, same sentence}
  abs_peak_inset_after: {value: 469, unit: nm, type: value, applies_to: unassigned, locator: Figure 1C inset annotation, note: "which spectrum (60 min or washed) is not stated; not judged"}
  plqy_150C_early:      {value: 40, unit: "%", type: value, qualifier: "ca.", applies_to: F1-150-05, locator: "Results, Figure 1E paragraph: 'a quick rise in PLQY to ca. 40%' over the first few minutes"}
  plqy_150C_60min:      {value: 55, unit: "%", type: value, applies_to: F1-150-60, locator: "Results, Figure 1D/E paragraph: 150 C for up to 1 h increases the PLQY to 55%"}
  plqy_150C_washed:     {value: 64, unit: "%", type: value, applies_to: F1-150-60W, locator: "Results, same paragraph: purification increases the PLQY to 64%"}
  plqy_RT_max:          {value: 5, unit: "%", type: upper_bound, applies_to: "F1-RT-*", locator: "Results: at RT and 90 C PLQYs never exceeded 5% regardless of treatment time"}
  plqy_90C_max:         {value: 5, unit: "%", type: upper_bound, applies_to: "F1-090-*", locator: same sentence}
  plqy_200C_high:       {value: 70, unit: "%", type: lower_bound, applies_to: "max over F1-200-*", locator: "Results: at 200 C even higher quantum yields (>70%)", note: which aliquot is not stated}
  plqy_200C_60min_fig1F: {value: 67, unit: "%", type: value, applies_to: F1-200-60, locator: "Figure 1F annotation 'QY = 67%' on the 200 C decay", note: "the decay file carries a different date from the PLQY session"}
  plqy_ZnCl2:           {value: 85, unit: "%", type: value, applies_to: F1-200Z, locator: "Results and Abstract: up to 85% with ZnCl2; Figure 1F annotation 'QY = 85%'"}
  plqy_as_synthesized:  {value: 0.2, unit: "%", type: upper_bound, applies_to: F1-AS, locator: "Figure 1F annotation 'QY < 0.2%' (legend 'RT', file Sample0_InP_as_synthesized)", note: "Conclusion states <0.1%; Figure 1A states <1%"}
  pl_fwhm_nm:           {value: 70, unit: nm, type: value, qualifier: "~", applies_to: F1-150-60, locator: "Results, Figure 1D/E paragraph: FWHM after the in situ HF treatment ~70 nm (300 meV)", note: the statement covers treated samples in general; judged on the 60 min aliquot}
  pl_fwhm_meV:          {value: 300, unit: meV, type: value, qualifier: "~", applies_to: F1-150-60, locator: same sentence}
  tau_as_synthesized:   {value: 29, unit: ns, type: value, applies_to: D-AS, locator: "Results, Figure 1F paragraph: average lifetimes 29 ns untreated"}
  tau_200C:             {value: 107, unit: ns, type: value, applies_to: D-200-60, locator: same sentence (107 ns after in situ HF)}
  tau_ZnCl2:            {value: 138, unit: ns, type: value, applies_to: D-200Z, locator: same sentence (138 ns with ZnCl2)}
  plqy_sphere:          {value: 84, unit: "%", type: value, applies_to: SPH-ZNCL, locator: "Methods and SI Figure S19 caption: integrating sphere PLQY 84%"}
  plqy_fig4_heatup_HF:  {value: 55, unit: "%", type: value, applies_to: F4-HU-HF, locator: "Figure 4B annotation 'QY = 55%' (heat-up, in situ HF)"}
  plqy_fig4_heatup_InF3: {value: 45, unit: "%", type: value, applies_to: F4-HU-InF3, locator: "Figure 4B annotation 'QY = 45%'; Results: 'up to 45%'"}
  plqy_fig4_hotinj_HF:  {value: 54, unit: "%", type: value, applies_to: F4-HI-HF, locator: "Figure 4B annotation 'QY = 54%' (hot injection, in situ HF)", note: "same archived files as F1-150-60W, for which the text gives 64%"}
  plqy_fig4_hotinj_InF3: {value: 26, unit: "%", type: value, applies_to: F4-HI-InF3, locator: "Figure 4B annotation 'QY = 26%'; Results: '<28%'"}
  plqy_InF3_S9_max:     {value: 28, unit: "%", type: value, qualifier: "up to", applies_to: "max over S9-InF3-*", locator: "Results: pure InF3 treatment increases the PLQY up to 28% (Figure S9)"}
  # Qualitative statements used only as diagnostics (not judged):
  diag_octylamine:      {type: qualitative, statement: octylamine alone barely affects the QDs, applies_to: S5-AMINE-180, locator: Results; SI Figure S5}
  diag_hcl_hbr:         {type: qualitative, statement: neither HCl nor HBr increases the PLQY, applies_to: "S7-HCL700-180, S7-HBR700-180", locator: Results; SI Figure S7}
  diag_organic_acids:   {type: qualitative, statement: organic Bronsted acids give only small PLQY increases of 1-2%, applies_to: "S8-*", locator: Results; SI Figure S8}
  diag_et3n:            {type: qualitative, statement: triethylamine reduces the absorption drop while reaching the same PLQY increase, applies_to: "S16-HF1400-ET3N-60 vs S16-HF1400-60", locator: SI Figure S16 caption}
  diag_dose:            {type: qualitative, statement: higher benzoyl fluoride dose gives a larger absorption drop and stronger blue shift; highest PLQYs at 850-1000 equivalents, applies_to: "S4-*", locator: SI Figure S4 caption}
