    S4_lowest_in_all_chosen_categories: true

component:
  id: somoza-tornos-2020-pe-pyrolysis
  title: >-
    Realizing the Potential High Benefits of Circular Economy in the Chemical Industry:
    Ethylene Monomer Recovery via Polyethylene Pyrolysis
  authors: [Ana Somoza-Tornos, Andres Gonzalez-Garay, Carlos Pozo, Moises Graells, Antonio Espuna, Gonzalo Guillen-Gosalbez]
  journal: ACS Sustainable Chemistry & Engineering 8 (2020) 3561-3572
  doi: 10.1021/acssuschemeng.9b04835
  version: published version of record (2020-02-04); read via the accepted manuscript below
  licence:
    published_version: CC BY 4.0 (Crossref licence record and OpenAlex, 2026-11-04)
    accepted_manuscript: CC BY-NC-ND (UPCommons record)
    reuse: >-
      Only facts (stoichiometry, recoveries, inventory numbers, prices) are restated, with
      attribution. No table, figure or text is copied, and the PDF is not committed.
  files:
    - url: https://upcommons.upc.edu/bitstreams/ce26c0ff-8b5f-4918-880c-25cc1380d321/download
      record: http://hdl.handle.net/2117/336839
      name: accepted manuscript (PDF, 45 pages, 1,312,042 bytes)
      sha256: b476880d050306966388261604b758c1aad209c3fd06ac2360f33186224cf233
      use: >-
        source of every fact below. run.py downloads it into the cache and checks the hash
        (provenance check only: it does not parse the file).
    - url: https://pubs.acs.org/doi/pdf/10.1021/acssuschemeng.9b04835
      name: published version (PDF)
      status: HTTP 403 to a scripted client on 2026-11-04; not retrieved
  kind: process model (Aspen Plus simulation at 18,900 kg/h waste PE), not plant data
  model_facts:
    locator: section Process description and Eq. 1 (manuscript pp. 7-9, lines 130-161)
    feed: 450 t/d purified waste PE (18,900 kg/h)
    furnace: 1000 degC, 1 bar, 27.8 MW, fired with a process stream (no natural gas)
    global_reaction: >-
      PE -> 4.62 C2H4 + 1.17 C3H6 + 0.07 C3H4 + 0.09 C4H8 + 0.59 C4H6 + 0.45 C6H6 + 1.66 CH4,
      coefficients fitted to the yields of Kannan et al. (the source's ref. 23)
    separations:
      T1: {top: methane, recovery: 0.99, purity_wt: 0.995}
      T2: {top: ethylene, recovery: 0.999, purity_wt: 0.995}
      T3: {top: propylene, recovery: 0.99, purity_wt: 0.995}
      T4: {bottom: benzene, recovery: 0.99, purity_wt: 0.995, top: "propylene, propyne, 1-butene, 1,3-butadiene and benzene, used as the furnace fuel"}
    direct_emissions: only the CO2 of burning the T4 top stream is counted (manuscript p. 13)
    prices_eur_per_kg:
      locator: Table 1 (manuscript pp. 13-14)
      ethylene: 1.075
      propylene: 0.875
      benzene: 0.994
      methane: 0.334
      waste_PE_sorted: 0.315
  reported_results:
    locator: Table 2, net flows per kg of ethylene, no allocation (manuscript pp. 15-16)
    per_kg_ethylene:
      waste_PE_feed: {value: 2.17, unit: kg}
      methane: {value: 0.204, unit: kg}
      propylene: {value: 0.378, unit: kg}
      benzene: {value: 0.287, unit: kg}
      direct_CO2_fuel_combustion: {value: 0.986, unit: kg}
      net_electricity: {value: 0.454, unit: kWh, note: "reported as kW per kg/h of ethylene"}
    not_used: >-
      The characterised results (ReCiPe endpoints and midpoints, and the incineration and
      landfill comparison) rest on ecoinvent 3.4 and are neither restated nor used (CLAUDE.md).

