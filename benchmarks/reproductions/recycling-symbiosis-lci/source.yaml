# Reference record for the linked LDPE and polypropylene recycling inventories (#339, tracker
# #333; protocol ADR 0030, case layout ADR 0031). Facts and numbers are restated in our own form
# with locators. No text, tables or figures of the sources are copied here.
#
# Two sources play different roles:
#   target     - the scenario study the issue names. A conference abstract: it states the
#                question and qualitative findings, but no inventory inputs (sufficiency.md).
#   component  - an open, peer-reviewed process model by two of the same authors (Somoza-Tornos,
#                Pozo) for the step that creates the exchangeable stream: pyrolysis of waste
#                polyethylene to monomers. Its inventory table is the numerical reproduction
#                target of this case.
accessed: "2026-11-04"

