  scenario_facts:
    locator: abstract 5.10.P-We469, the whole text
    polymers: [low-density polyethylene (LDPE), polypropylene (PP)]
    software: SimaPro
    inventory_source: input-output data from the literature (not listed)
    boundary: each supply chain from monomer production to end of life
    scenarios:
      S1: mechanical recycling with incineration
