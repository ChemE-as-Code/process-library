# The selected system: TMA half-reaction (the first of the two ALD half-reactions) on
# Evonik/Degussa P-25 TiO2 nanoparticle agglomerates in a bubbling fluidised bed, 500 K.
system:
  precursor: trimethylaluminium (TMA), diluted in N2 (carrier and fluidising gas)
  powder: Degussa P-25 TiO2 nanoparticles (fluidised as multi-level agglomerates)
  temperature: 500 K
  pressures: [1.013 bar, 1 mbar]
  locator: thesis section 7.1 (last paragraphs) and Table 7.5

# Model as published (thesis chapter 7), summarised in our own words:
model_summary:
  reactor_scale: >-
    Two-phase bubbling bed (Table 7.1): solids-free bubbles in plug flow with average size d_b
    and rise velocity u_b; emulsion at minimum fluidisation, totally back-mixed; isothermal;
    lumped bubble-emulsion exchange coefficient K_be (Sit and Grace); emulsion gas to
    agglomerate film coefficient K_ga with Sh = 2. Two-phase theory flow split.
  agglomerate_scale: >-
    At 1.013 bar a spherical complex agglomerate (300 um) treated as a mono-dispersed porous
    medium with Fickian effective diffusivity of the complex level; at 1 mbar a bi-dispersed
    particle-pellet model (Table 7.2). Diffusivities from Eqs. 7.12-7.15, tortuosity 1/eps.
  kinetics: >-
    Surface-coverage dynamics after Travis et al. (absolute reaction rate theory; Table 7.3).
    The rate expressions nu_1..nu_3 and their parameters are not given in the chapter (it refers
    to Travis et al.), and neither is the TMA inlet concentration of the dynamic simulations.
  quasi_steady_reduction: >-
    For the quasi-steady period with emulsion concentration near zero, the precursor
    utilisation is eta = 1 - (u_b delta / u) exp(-H K_be / u_b) (Eq. 7.51), and the bed height
    for a target eta* is H* = (u_b/K_be) ln[u_b delta / (u_0 (1 - eta*))] (Eq. 7.52). Minimum
    saturation time (complete uptake) tau_sat_min = rho_b S_BET n_max H0 / (u_0 C_in) (Eq. 7.24).

