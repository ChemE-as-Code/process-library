        flow: {value: 3.33238, provenance: calculated, source: "0.30 mol/s H2 x 2.016 g/mol + 0.02 mol/s CH4 x 16.043 g/mol (materials.yaml) (IDAES examples-pse b9606ee)"}
        composition: {basis: mole_fraction, values: {TOL: 0.0, H2: 0.9375, BZ: 0.0, CH4: 0.0625}, provenance: calculated, source: "0.30/0.32 and 0.02/0.32 (IDAES examples-pse b9606ee); 1e-5 mol/s traces omitted"}
