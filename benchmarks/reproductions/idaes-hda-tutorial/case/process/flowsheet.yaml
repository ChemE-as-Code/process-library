# Restatement of the baseline IDAES HDA tutorial case (benchmarks/reproductions/idaes-hda-tutorial,
# source.yaml) for the cheme IDAES backend (core#104). Topology and specifications are the
# reference's, restated in cheme form; see ../comparison.md for the equivalence notes
# (F101 = cooler E1 + flash F1; isothermal C101 at pressure ratio 1 omitted; 1e-5 mol/s trace
# feed components omitted). Started from core's examples/process-hda-idaes (AGPL-3.0-or-later, same copyright holder).
schema: cheme/process/v1
kind: flowsheet
title: IDAES HDA tutorial case (reference reproduction)
units:
  pressure: kPa(a)
  temperature: K
  flow: kg/h
  duty: kW
  enthalpy: kJ/kmol
cases:
  - {id: design, description: Design case, default: true}
tolerance: {abs: 0.01, rel: 0.005}

feeds:
  - id: TOLF
    title: Fresh toluene
    ports: [{id: out, direction: out}]
  - id: H2F
    title: Make-up hydrogen
    ports: [{id: out, direction: out}]
  - id: FUEL
    title: Fuel (fired heater duty)
    ports: [{id: q, direction: out, kind: energy}]
products:
  - id: BZP
    title: Benzene-rich vapour product (F102 vapour)
    ports: [{id: in, direction: in}]
  - id: BOT
    title: Toluene-rich liquid (F102 liquid)
    ports: [{id: in, direction: in}]
  - id: PURGE
    title: Purge gas
    ports: [{id: in, direction: in}]
  - id: CW
    title: Cooling water
    ports: [{id: q, direction: in, kind: energy}]

blocks:
  - id: RXN
    title: Reaction
    class: ReactingChemicals
    ports:
      - {id: tol, direction: in}
      - {id: h2, direction: in}
      - {id: recycle, direction: in}
      - {id: fuel, direction: in, kind: energy}
      - {id: out, direction: out}
  - id: SEP
    title: Separation and recycle
    class: SeparatingByFlash
    ports:
      - {id: in, direction: in}
      - {id: cw, direction: out, kind: energy}
      - {id: product, direction: out}
      - {id: bottoms, direction: out}
      - {id: purge, direction: out}
      - {id: recycle, direction: out}

steps:
  - id: M1
    block: RXN
    title: Feed mixer
    class: Mixing
    ports:
      - {id: tol, direction: in, delegates: tol}
      - {id: h2, direction: in, delegates: h2}
      - {id: recycle, direction: in, delegates: recycle}
      - {id: out, direction: out}
  - id: H1
    block: RXN
    title: Reactor feed heater
    class: ExchangingThermalEnergy
    ports:
      - {id: in, direction: in}
      - {id: fuel, direction: in, kind: energy, delegates: fuel}
      - {id: out, direction: out}
  - id: R1
    block: RXN
    title: HDA reactor (adiabatic)
    class: ReactingChemicals
    reactions: [HDA]
    reactor: conversion
    ports:
      - {id: in, direction: in}
      - {id: out, direction: out, delegates: out}
  - id: E1
    block: SEP
    title: Reactor effluent cooler
    class: Cooling
    ports:
      - {id: in, direction: in, delegates: in}
      - {id: cw, direction: out, kind: energy, delegates: cw}
      - {id: out, direction: out}
  - id: F1
    block: SEP
    title: Flash drum
    class: SeparatingByFlash
    ports:
      - {id: in, direction: in}
      - {id: vapor, direction: out}
      - {id: liquid, direction: out}
  - id: F2
    block: SEP
    title: Second flash (F102)
    class: SeparatingByFlash
    ports:
      - {id: in, direction: in}
      - {id: vapor, direction: out, delegates: product}
      - {id: liquid, direction: out, delegates: bottoms}
  - id: X1
    block: SEP
    title: Purge split
    class: SplittingMaterial
    split: {purge: 0.2}
    ports:
      - {id: in, direction: in}
      - {id: purge, direction: out, delegates: purge}
      - {id: recycle, direction: out, delegates: recycle}

streams:
  - id: S1
    title: Fresh toluene
    from: TOLF.out
    to: M1.tol
    template: hda
    state:
      design:
        temperature: {value: 303.2, provenance: given, source: "IDAES examples-pse b9606ee, HDA tutorial, toluene feed"}
        pressure: {value: 350, provenance: given, source: "IDAES examples-pse b9606ee, HDA tutorial, toluene feed"}
        flow: {value: 99.5117, provenance: calculated, source: "0.30 mol/s toluene (IDAES examples-pse b9606ee) x 92.1405 g/mol (materials.yaml)"}
        composition: {basis: mole_fraction, values: {TOL: 1.0, H2: 0.0, BZ: 0.0, CH4: 0.0}, provenance: given, source: "IDAES examples-pse b9606ee; 1e-5 mol/s traces omitted"}
