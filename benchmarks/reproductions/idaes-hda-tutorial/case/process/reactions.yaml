# Toluene hydrodealkylation (schema cheme/reactions/v1), as in the IDAES HDA tutorial: one
# vapour-phase reaction in a stoichiometric (conversion) reactor, no rate law.
schema: cheme/reactions/v1
kind: reactions
reactions:
  - id: HDA
    title: Toluene hydrodealkylation
    equation: C7H8 + H2 -> C6H6 + CH4
    stoichiometry: {TOL: -1, H2: -1, BZ: 1, CH4: 1}
    phase: vapor
    reversible: false
    conversion: {key: TOL, value: 0.75, provenance: given, source: "IDAES examples-pse b9606ee, R101 conversion 0.75 of vapour toluene at reactor inlet"}
    sources: ["Douglas, J.M. (1988) Conceptual Design of Chemical Processes, McGraw-Hill (HDA case study)"]
