# Acceptance tolerances for the microfluidic T-junction reproduction (#338; ADR 0030, ADR 0031).
# FROZEN 2026-11-04, committed with source.yaml and inputs.yaml before any run that compares
# computed values with reported ones. Do not edit: a revision is a new file with its reason, and
# comparison.md names the file it used.
#
# Disclosure: while inspecting the data before this freeze, the digitised coordinates and line
# end points were printed (source.yaml), and the squeezing coefficient of two geometries was
# estimated by hand to check the reading of the equations. No model-versus-data deviation was
# computed before the freeze.
frozen: "2026-11-04"
reference: source.yaml reported_results and reference_figure.digitised
checks:
  model_internal:
    fill_closed_vs_geometry:
      rel: 1.0e-12
      reason: >-
        the closed-form filling volume must equal the geometric construction (tip area times
        depth less two corner gutters) for r <= 1 and r > 1; a pure implementation check of the
        restated equation and its bracketing
    digitisation_rerun:
      abs_q: 0.002
      abs_v: 0.002
      reason: run.py repeats the vector extraction from the pinned PDF; it must give the source.yaml values to their rounding (3 decimals)
  model_alpha_independent:
    case_a: {abs: 0.05, reason: "reported to 2 digits (1.8): half a unit of the last digit"}
    case_b: {abs: 0.005, reason: "reported to 3 digits (1.15): half a unit of the last digit"}
  model_lines:
    intercept:
      abs: 0.15
      reason: >-
        the dashed lines are a third-party drawing of the model; how they were evaluated (h/w
        rounding, eps, reading off a chart) is not stated. 0.15 is about 13 % of v_fill (about 1.1)
        and three times the digitisation resolution
    slope:
      rel: 0.10
      reason: >-
        same basis; 10 % still separates eps = 0 from eps = 0.1 w (alpha changes by about a factor
        2 for w_in/w = 0.33), so a pass confirms the corner-roundness reading
  model_vs_experiment:
    per_series_mean_abs_rel:
      max: 0.15
      reason: >-
        the original claims fit-free agreement but states no error band in any open source; 15 %
        is the band Nekouei & Vanapalli draw around parity for droplet-size models (their Fig. 10)
        and covers the digitisation resolution (below 4 % at v >= 1.2)
    per_point_abs_rel:
      max: 0.30
      reason: >-
        single points at small q (v near v_fill) carry the largest relative scatter, and the
        replot's fidelity to the original is unquantified; a point beyond 30 % is a real disagreement
  design_forward_check:
    rel: 1.0e-9
    reason: every inverted design is put back through the forward model; it must return the target volume
pass_rule: >-
  pass: every check in model_internal, model_alpha_independent, model_lines and model_vs_experiment
  is within tolerance. partial: every model_internal, model_alpha_independent and model_lines check
  passes but at least one model_vs_experiment check fails (the model is reproduced, the published
  agreement is not). fail: any model_internal, model_alpha_independent or model_lines check fails.
  A check that cannot be evaluated is reported as a gap, not a pass. design_forward_check belongs
  to the design extension and does not enter the reproduction verdict; if it fails the run exits
  non-zero.
