    authorship_verified: >-
      Authors, title, journal, volume and pages confirmed from OpenAlex and the PubMed record
      (PMID 20617259). The abstract (PubMed) states a closed-form, fit-free expression for the
      size of bubbles and droplets in T-junctions, built on continuity, geometry and the pinch-off
      mechanism, and validated with gas bubbles and liquid droplets in T-junctions of many shapes.
    availability: >-
      Closed access. OpenAlex reports oa_status closed and no repository full text; the publisher
