# The model as restated (our notation). Dimensionless volume v = V/(h w^2), flow-rate ratio q = q_d/q_c,
# r = w_in/w, eta = h/w. w: main channel width, w_in: side (dispersed-phase) inlet width,
# h: channel depth (all channels the same depth), eps: corner roundness of the junction.
model:
  locator: model_restatement article/content.tex, section "van Steijn et al. model overview", equations 1-6
  total: v = v_fill + alpha q
  fill_r_le_1: v_fill = 3 pi/8 - (pi/2)(1 - pi/4) eta
  fill_r_gt_1: >-
    v_fill = (pi/4 - asin(1 - 1/r)/2) r^2 - (r - 1) sqrt(2 r - 1)/2 + pi/8
             - (1/2)(1 - pi/4) [ (pi/2 - asin(1 - 1/r)) r + pi/2 ] eta
  fill_geometry: >-
    V_fill = h A_tip - 2 A_gutter l_gutter, with A_gutter = (1 - pi/4) h^2/4 (corner gutter of
    radius h/2), A_tip the plan area of the tip when it touches the far wall (3 pi w^2/8 for
    r <= 1) and l_gutter its perimeter (pi w for r <= 1)
  alpha: >-
    alpha = (1 - pi/4) (1 - q_gutter/q_c)^-1 [ (R_pinch/w)^2 - (R_fill/w)^2 + (pi/4)(R_pinch/w - R_fill/w) eta ]
  R_fill: max(w, w_in)
  R_pinch: >-
    w + w_in - d + sqrt(2 (w_in - d)(w - d)), with d = h w/(h + w) - eps (the neck width at pinch-off,
    2 r_pinch = h w/(h + w), less the corner roundness)
  q_gutter_over_q_c: 0.1   # stated by the original as determined experimentally (per the restatement)
  corner_roundness: {bubbles: 0.1 w, liquid_droplets: 0.01 w}   # original Fig. 3 series, per make_figures.py
  regime: squeezing (low capillary number); dispersed phase non-wetting; all channels the same depth

# Reference figure: the original Fig. 3 (dimensionless volume versus flow-rate ratio, model lines and
# measured bubbles for several junction shapes) is closed. Its experimental points for three shapes
# are replotted, with the model lines, in Nekouei & Vanapalli Fig. 5. That replot is our reference.
reference_figure:
  original: van Steijn 2010 Fig. 3 (not accessed)
  used: nekouei-vanapalli-2017, arXiv:1703.00937v1 page 11, Fig. 5 (vector graphics, Form XObject /Meta61)
  axes: {x: "q_d/q_c (0 to 10)", y: "V/(h w^2) (0 to 35)"}
  series_geometry:
    note: >-
      The Fig. 5 legend gives (w_in/w, h/w) = (0.33, 0.33) circles, (0.67, 0.11) triangles,
      (1.33, 0.17) diamonds; the replication's reading of the original Fig. 3 gives the same
      pairs. The Nekouei body text (page 10-11) lists (0.67, 0.17) and (1.33, 0.11) instead; we
      take the legend, which two sources agree on. Recorded as reconstructed in inputs.yaml.
    open_symbols: experiments of van Steijn 2010 (gas bubbles, per the original Fig. 3 description in the restatement)
    filled_symbols: VOF simulations of Nekouei & Vanapalli (viscosity ratio 0.1, Ca ~ 1e-3); informational only
    dashed_lines: the van Steijn 2010 model, drawn by Nekouei & Vanapalli from the original's equations (their caption)
  digitisation:
    method: >-
      Exact extraction of vector paths from the PDF content stream (pypdf), no image tracing.
      Markers are identified by path shape (circle: four Bezier curves; triangle: three
      segments; diamond: four segments) and paint (stroked = open, filled = closed); the marker
      centre is the centre of its bounding box. Axis calibration from the axis tick marks:
      x = 0 at 54.379 pt and x = 10 at 288.98 pt; y = 0 at 50.647 pt and y = 35 at 285.25 pt
      (form coordinates). run.py repeats this extraction and checks it against the values below.
    uncertainty: >-
      Coordinates lie on a 0.6 pt grid (EMF origin), so the extraction resolution is +-0.3 pt:
      +-0.013 in q and +-0.045 in V/(h w^2). The fidelity of the replot to the original Fig. 3 is
      not stated by Nekouei & Vanapalli and cannot be checked (original closed): an unquantified
      uncertainty on top, assumed small against the 15 % tolerance.
  digitised:   # (q_d/q_c, V/(h w^2)), DIGITISED
    experiment:
      r0.33_h0.33: [[1.630, 1.701], [3.241, 3.043], [9.431, 6.624]]
      r0.67_h0.11: [[0.339, 1.208], [0.569, 1.298], [0.978, 1.925], [1.387, 3.804], [2.947, 6.490], [4.098, 7.117], [5.223, 9.176], [7.269, 12.129]]
      r1.33_h0.17: [[0.543, 3.088], [0.748, 3.715], [1.822, 6.758], [3.126, 9.802], [6.170, 18.037]]
    vof_simulation:
      r0.33_h0.33: [[0.991, 1.432], [1.988, 2.059], [2.986, 2.954], [3.983, 3.670], [4.980, 4.386], [5.978, 5.281]]
      r0.67_h0.11: [[0.978, 3.267], [1.975, 4.610], [2.973, 5.774], [3.996, 8.459], [4.993, 9.534], [5.991, 11.413]]
      r1.33_h0.17: [[0.479, 3.043], [0.991, 5.013], [1.988, 6.893], [2.986, 11.637]]
    model_lines:   # end points (q, v) of each dashed line; the start lies 0.3 pt left of the axis (line cap)
      r0.33_h0.33: [[-0.013, 1.029], [9.987, 6.579]]
      r0.67_h0.11: [[-0.013, 1.208], [9.987, 17.142]]
      r1.33_h0.17: [[-0.013, 1.298], [9.987, 32.091]]
    line_assignment: >-
      Each dashed line is assigned to the series whose experimental points it passes through:
      slope 0.56 with the circles, 1.59 with the triangles, 3.08 with the diamonds.

reported_results:
  alpha_independent:   # squeezing coefficient evaluated with the van Steijn 2010 model by Nekouei & Vanapalli
    locator: nekouei-vanapalli-2017 arXiv v1 page 18, first paragraph (comparison with their fitted beta)
    w_in_over_w_1_h_over_w_0.33: {value: 1.8, digits: 2}
    w_in_over_w_1_h_over_w_1: {value: 1.15, digits: 3}
    note: corner roundness not stated; q_gutter/q_c = 0.1 implied by the model
  claimed_agreement:
    locator: van-steijn-2010 abstract (PubMed)
    statement: model validated experimentally with bubbles and droplets in many junction shapes, without fitting; no numerical error band is stated in the open sources
  squeezing_regime_lower_bound:
    locator: korczyk-2019 page 4-5, Eq. (3) and Fig. 3 caption
    statement: >-
      gutter leakage makes the size depend on Ca at low q Ca; leakage is below 10 % of the necking
      flow for q Ca > 10 beta, with beta = 7.4e-5 +- 0.3e-5 fitted for square channels
      (W = H = 360 um, FC-40 in hexadecane); beta depends on the aspect ratio
  fluid_properties:
    locator: korczyk-2019 Methods, "Experiments"
    hexadecane_viscosity: {value: 3.6, unit: mPa s, kind: measured}
    fc40_viscosity: {value: 4.1, unit: mPa s, kind: measured}
    interfacial_tension: {value: 7.3, unit: mN/m, kind: measured (pendant drop)}
  experimental_range:
    locator: nekouei-vanapalli-2017 Table 1 (row for van Steijn et al.)
    statement: >-
      Ca < 0.01, 0.1 < q < 10, 0.01 < mu_d/mu_c < 0.1 and 0.33 < w_in/w < 3 for the van Steijn
      experiments; Nekouei & Vanapalli (page 4) note that the experimental studies were limited
      to viscosity ratios below 1
  squeezing_regime_upper_bound:
    locator: korczyk-2019 pages 6-7 and Fig. 5b
    statement: >-
      the shape number S = Ca (1 + q)^2 predicts the upper boundary of the squeezing regime; the
      transition to jetting occurs at S_crit of about 0.017 for all q tested (square channels,
      W = H = 360 um)
  squeezing_to_dripping_trend:
    locator: nekouei-vanapalli-2017 arXiv v1, discussion of their Fig. 3 (regime map, W = H, compared with Tice et al.)
    statement: in their VOF simulations and the Tice et al. experiments the squeezing-to-dripping transition occurs at a lower Ca as q rises, so a single Ca limit is not a regime boundary
