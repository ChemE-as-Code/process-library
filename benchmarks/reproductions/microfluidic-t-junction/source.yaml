# Reference record for the microfluidic T-junction case (#338, tracker #333; ADR 0030, ADR 0031).
# Facts (equations, geometries, numbers) restated in our own form with locators. No text, code,
# figures or tables of any source are copied here. Digitised values are marked as digitised.
accessed: "2026-11-04"

