    CS2: {plus20_F: {MeOH: 0.001212, water: 0.009474}, minus20_F: {MeOH: 0.003157, water: 0.000275}, plus20_MeOH: {MeOH: 0.011353, water: 0.001962}, minus20_MeOH: {MeOH: 0.003038, water: 0.000435}}
  qualitative_conclusions:
    - "CS1 holds stage 35 within about 2 h but leaves a distillate purity offset after a feed composition step (section 3.2)."
    - "CS2 returns the distillate to 0.99 by moving the reflux ratio, 0.303 at +20 % and 0.721 at -20 % methanol (section 3.3)."
    - "At +20 % methanol CS2 needs 283 kW of compressor power against 442 kW for CS1 (section 3.3)."
    - "CS2 is slower: methanol settling 9.5 h against 1.8 h at +20 % methanol (Table 1)."

