    CS2_minus20_F: {x_D: 0.99000, RR: 0.63797, W_total_kW: 234.42, FVC_kmolh: 3.39}
    locator: "SI sheets 'CS1 ...' and 'CS2 ...', last row; text sections 3.2 and 3.3"
  text_values_that_differ_from_the_SI:
    - "Section 3.2 gives 99.76 mol% (+20 % methanol) and 97.75 mol% (-20 %) for CS1; the SI series end at 0.99799 and 0.97836. We compare with the SI."
    - "Section 3.3 gives the CS2 throughput reflux ratios as 0.656 and 0.638 (SI 0.65590, 0.63797): consistent."
