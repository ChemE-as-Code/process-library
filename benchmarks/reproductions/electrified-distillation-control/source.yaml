# Reference record for the electrified-distillation control case (#335, tracker #333, ADR 0030).
# Facts (specifications, numbers) are taken from the pinned sources and restated in our own form
# with locators. No text, tables or figures of the source are copied into the library. The
# supporting-information workbook is downloaded by run.py at runtime and is not committed.
reference:
  id: cui-2025-fvc-control
  title: Control of fully electrified heat pump assisted distillation process by flash vapor circulation
  authors: [Chengtian Cui, Xiaodong Zhang, Meng Qi, Anton A. Kiss]
  journal: Chemical Engineering Research and Design, 220 (2025) 450-460
  doi: 10.1016/j.cherd.2025.07.023
  version: final published version (version of record), available online 2025-07-14
  licence:
    name: CC BY 4.0 (open access; licence statement on the first page of the article and in the Crossref record)
    url: http://creativecommons.org/licenses/by/4.0/
    note: >-
      CC BY 4.0 would allow redistribution with attribution, but the library rule (CLAUDE.md) is
      to restate facts in our own form and draw every figure ourselves. We do so. The supporting
      information is published with the article (Appendix A); we take it to be under the same
      licence but do not redistribute it: run.py downloads it.
  accessed: "2026-11-04"
  kind: model reference (Aspen Plus V14 steady state and Aspen Dynamics V14 simulations; no plant or experimental data)
  files:
    - name: article PDF (final published version, TU Delft repository copy with a cover page)
      url: https://repository.tudelft.nl/file/File_9b20976a-b549-436f-bb39-f5627edc5a6c
      record: https://repository.tudelft.nl/record/uuid:f56aa208-9035-4420-bbd8-22f8077e367b
      sha256: 22a846f3b8d2aabc2b2117844863346530abc0a80d4334bf942fbd2a8377f555
      bytes: 10976865
      pages: 12 (1 cover + 11 article pages)
      use: text facts below; not used by run.py
      access_note: >-
        The publisher page (sciencedirect.com) and the Abo Akademi repository copy refused
        automated downloads (HTTP 403) on 2026-11-04; the TU Delft repository copy was open.
    - name: supporting information workbook (Appendix A, mmc1)
      url: https://ars.els-cdn.com/content/image/1-s2.0-S0263876225003818-mmc1.xlsx
      sha256: 4f57888ecfb2cb91918c437e4ecae7c235e65c391c55ab33a6ddeffc4d37a575
      bytes: 527045
      use: >-
        downloaded and hash-checked by run.py; read for the nominal stream table, the column
        profile and the eight dynamic responses
      sheets:
        "Stream data": steady-state stream table of the Aspen Plus flowsheet (streams 1-28, FEED, MEOH, WATER)
        "Column data": stage table of the column block (38 stages), liquid and vapour compositions, hydraulic table
        time series CS1: "sheets 'CS1 +20% F', 'CS1 -20% F', 'CS1 +20% MeOH', 'CS1 -20% MeOH' (Aspen Dynamics)"
        time series CS2: "sheets 'CS2 +20% F', 'CS2 -20% F', 'CS2 +20% MeOH', 'CS2 -20% MeOH' (Aspen Dynamics)"
      series_variables: >-
        time (h, step 0.01 h, 0-10 h); distillate and bottoms molar flows (kmol/h); flash vapour
        circulation, stream 11 (kmol/h); distillate methanol and bottoms water mole fractions;
        power of COMP1, COMP2, COMP3 (kW); block stage 35 temperature (C); reflux ratio (the
        multiplier's second input, mass basis)
  related:
    - id: cui-2024-fvc
      title: Fully electrified heat pump assisted distillation process by flash vapour circulation
      doi: 10.1016/j.cherd.2024.05.011
      use: origin of the FVC-2 configuration (steady state); not used for numbers here
      url: https://repository.tudelft.nl/file/File_dee61d3b-fb81-43ff-b664-dcbf92a98657
      sha256: 094a7a9f9bfe0b956edb19d5b047fcd46ba1b2b43fcd2d7d24ab71263c338247

# The reference case, restated. Numbering: block stages of the Aspen column block (1 = top,
# 38 = bottom), as the SI variable names use them (BLOCKS("COLUMN").Stage(35).T). The paper counts
# the drum as stage 1, so its "feed stage 30" is block stage 29 and its 40 stages are 38 column
# stages plus the drum (FLASH-D) and the reboiler flash (FLASH-R).
case:
  system: methanol / water, binary
  feed: {flow: 100 kmol/h, methanol: 0.80, water: 0.20, temperature: 30 C, pressure: 5 bar, after_valve_V1: 1.203 bar, phase: liquid,
         locator: "article section 2; SI Stream data, FEED and stream 1"}
  products:
    distillate: {methanol: 0.99, flow: 80.806 kmol/h, locator: "section 2; SI stream MEOH"}
    bottoms: {water: 0.9999, flow: 19.194 kmol/h, locator: "section 2; SI stream WATER"}
  column:
    stages: "38 in the column block; plus FLASH-D (drum) and FLASH-R (reboiler flash): 40 equilibrium stages"
    feed_stage: 29 (block numbering; liquid feed, SI Column data 'Liquid feed' column)
    top_pressure: 1.007 bar (block stage 1)
    stage_pressure_drop: 0.7 kPa
    bottom_pressure: 1.266 bar (block stage 38)
    FLASH_R_pressure: 1.276 bar
    FLASH_D_pressure: 1.007 bar
    locator: "section 2; SI Column data"
  heat_pump:
    description: >-
      Overhead vapour (stream 2) plus the flash vapour circulation (stream 11/12) is compressed
      in three stages COMP1-COMP3 with intercoolers HEX1 and HEX2 and the main exchanger HEX3;
      all three heat the column bottoms withdrawal (streams 19-24) on its way to FLASH-R. A trim
      condenser COND follows HEX3. Valve V2 throttles the condensate to 1.007 bar into FLASH-D,
      whose vapour returns to COMP1 (the FVC) and whose liquid is split into reflux and
      distillate (SP1). No steam.
    isentropic_efficiency: 0.75
    discharge: {pressure: 6.258 bar, temperature: 150 C}
    suction: {pressure: 1.007 bar, temperature: 64.76 C}
    locator: "section 2; Fig. 1; SI Stream data streams 2-13"
  control_basis:
    software: Aspen Dynamics V14
    drum_and_sump_holdup: 5 min at 50 % level, nominal
    valves: 3 bar nominal pressure drop at about 50 % open; bottoms valve V8 raised to 12 bar
    level_controllers: {type: P-only, Kc: 2, tau_I: 9999 min}
    flow_controllers: {Kc: 0.5, tau_I: 0.3 min}
    pressure_controllers: {Kc: 20, tau_I: 12 min}
    temperature_and_composition: Tyreus-Luyben tuning (values not reported)
    deadtimes: {temperature: 1 min, composition: 3 min}
    disturbances: ±20 % steps in feed flow and in feed methanol fraction (0.80 to 0.96 and 0.64), at 0.5 h, run to 10 h
    locator: "section 3.1 and 3.2"
  control_structures:
    CS1:
      loops:
        FC1: feed flow by valve V1
        LC1: reflux drum (FLASH-D) level by distillate flow
        LC2: column sump level by the withdrawal stream 19
        LC3: FLASH-R level by the bottoms flow (valve V8)
        RR: reflux ratio fixed (reflux = RR x distillate mass flow, by a multiplier)
        PC1: column top pressure by the trim-condenser duty (COND)
        PC2: compressor discharge pressure by valve V2 (after COND, before the drum)
        TC: block stage 35 temperature by the total compressor power; COMP2 and COMP3 powers in fixed ratio to COMP1
      locator: "section 3.2 list of loops; Fig. 3"
    CS2:
      change: "as CS1, plus a composition controller on the distillate methanol fraction that sets the reflux ratio"
      locator: "section 3.3; Fig. 6"
  reference_figures_and_tables:
    - {locator: "Fig. 1", what: steady-state flowsheet and Aspen Plus layout}
    - {locator: "Fig. 2", what: steady-state temperature and composition profiles}
    - {locator: "Fig. 3 / Fig. 6", what: control structures CS1 / CS2}
    - {locator: "Fig. 5", what: CS1 responses to the ±20 % feed composition steps}
    - {locator: "Fig. 8", what: CS2 responses to the ±20 % feed composition steps}
    - {locator: "Table 1", what: settling times}
    - {locator: "Table 2", what: integral absolute errors}
    - {locator: "SI workbook", what: the numbers behind Fig. 1, 2, 4, 5, 7, 8}

