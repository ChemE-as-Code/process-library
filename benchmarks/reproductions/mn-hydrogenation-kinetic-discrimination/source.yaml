# Reference record for the Mn-CNP hydrogenation kinetic-model case (#341, tracker #333, ADR 0030).
# Facts (conditions, fitted coefficients, statistics) are restated in our own form with locators.
# No table, figure or text of the source is copied here. The raw run table (SI Table S1/S2) is
# not committed: run.py downloads the pinned SI file at runtime and verifies its sha256.
reference:
  id: van-schendel-2021-mn-cnp-doe-kinetics
  title: >-
    Utilizing Design of Experiments Approach to Assess Kinetic Parameters for a Mn Homogeneous
    Hydrogenation Catalyst
  authors: [Robin K. A. van Schendel, Wenjun Yang, Evgeny A. Uslamin, Evgeny A. Pidko]
  journal: ChemCatChem 2021, 13(23), 4886-4896
  doi: 10.1002/cctc.202101140
  version: version of record (published 2021-09-14 online; issue 2021-12-07); PMC9291086 version 1
  licence:
    name: CC BY 4.0
    evidence: >-
      Article licence statement (open access under CC BY 4.0); PMC open-access metadata for
      PMC9291086.1 gives license_code "CC BY" for the article record that lists the SI file.
      The SI PDF itself carries no separate licence line.
    reuse: >-
      CC BY 4.0 would allow redistribution with attribution. We still do not commit the SI file
      or its tables; run.py downloads it at runtime. Numbers restated below are facts with
      locators, in our own form.
  accessed: "2026-11-04"
  kind: >-
    published experimental dataset (30 batch runs, design of experiments) and the authors'
    regression models fitted to it; plus separate conventional initial-rate kinetic runs
  files:
    - name: CCTC-13-4886-s001.pdf
      what: Supporting Information (30 pages); raw run table, regression outputs, kinetic runs
      url: https://pmc-oa-opendata.s3.amazonaws.com/PMC9291086.1/CCTC-13-4886-s001.pdf
      md5: 3a2fb2371d0eec722865b28e31b933c8     # as published in the PMC open-data index
      sha256: 6f87234815fe263a747e4663ddaebad1cba818a8175e3fa992e4d924c08b652f
      bytes: 583049
      use: downloaded by run.py; text of pages 4-5 (Tables S1, S2) and 9, 14, 20, 25, 28-29 parsed
    - name: PMC9291086.1.pdf
      what: article PDF (version of record, PMC copy)
      url: https://pmc-oa-opendata.s3.amazonaws.com/PMC9291086.1/PMC9291086.1.pdf
      md5: 2bb17f6759f682fec1ca3ff099da13ed
      sha256: e92d74b3ff9941bfb632d67fd658053065d7ef0acbf4cceba030d25ec2285877
      use: read for model definitions, Table 2, Table 3 and Figure 7; not downloaded by run.py
    - name: index
      url: https://pmc-oa-opendata.s3.amazonaws.com/PMC9291086.1/PMC9291086.1.json
      use: open-data index of the record (licence code, file list, md5)
  other_locations:
    - https://doi.org/10.1002/cctc.202101140 (publisher; scripted download refused, HTTP 403)
    - https://pmc.ncbi.nlm.nih.gov/articles/PMC9291086/ (browser challenge for files)
    - http://resolver.tudelft.nl/uuid:edd1bc98-1df5-4c44-b122-7854d6cc6843 (TU Delft repository, article only, no SI)
  no_dataset: >-
    No separate data deposit (4TU.ResearchData, Zenodo) was found. The SI tables are the only
    machine-readable record of the runs.

# The experiment, restated.
system:
  reaction: acetophenone + H2 -> 1-phenylethanol (the conclusion names benzophenone; the experimental section and SI name acetophenone)
  catalyst: Mn(I) CNP pincer complex (NHC-phosphine-amine), activated by KOtBu
  solvent: 1,4-dioxane, dodecane internal standard
  reactor: home-built parallel autoclaves, 4 mL glass vials, magnetic stirring; six vials heated together at one temperature
  substrate: 5 mmol per vial, about 1.27 mol/L (reconstructed, inputs.yaml)
  measurements: H2 uptake by pressure transducers (ideal gas law); final yield by GC-FID; mass balance 90-110 %
  locator: article Experimental Section; SI sections 2 and 2.1

design_of_experiments:
  kind: central composite face-centred design, four factors at three levels, factors not coded
  runs: 30 (cube, axial and centre points with replicates; temperature not randomised)
  factors:
    temperature: {levels: [30, 65, 100], unit: degC}
    pressure_H2: {levels: [10, 30, 50], unit: bar}
    catalyst: {levels: [0.06, 0.16, 0.25], unit: mmol/L}
    base_KOtBu: {levels: [0.06, 6.28, 12.50], unit: mmol/L}
  response: y = ln(alcohol formed / reaction time), alcohol in mol/L, time in h (average rate, not initial rate)
  regressors: {x1: 1/T in 1/K, x2: p in bar, x3: ln(catalyst, mol/L), x4: ln(base, mol/L)}
  run_times: 1.67 h to 27.78 h, set per run
  locator: article "Design of Experiment", Table 1; SI Table S1 (raw), Table S2 (transformed)

# Competing models of the source (article Eqs. 8, 9/18, 10/19, 17/20; SI section 4).
models:
  I:   {form: full quadratic in x1..x4 (15 terms), fit: MATLAB fitlm, n: 30}
  II:  {form: "b0 + b1 x1 + b2 x2 + b3 x3 + b4 x4 + b5 x1 x3 + b6 x2 x4 + b7 x4^2", fit: stepwiselm (SSE criterion), outliers_removed: [14, 20, 22, 30], n: 26}
  III: {form: "b0 + b1 x1 + b2 x2 + b3 x3 + b4 x4 + b5 x4^2", fit: fitlm, outliers_removed_text: [7, 16, 20, 22, 28, 30], n: 24}
  IV:  {form: "y = b0 - b1 x1/0.008314 + b2 x2 + b3 x3 + b4 x4 + x5 + b6 x6, x5 = ln(substrate at end, mol/L), x6 = reaction time in s", fit: fitnlm with bisquare robust weights, outliers_removed: [7, 10, 22, 25, 28, 30], n: 24}
  outlier_rule: standardised residual outside +/-1.25 after a first fit, then refit
  inconsistency: >-
    Model III: the SI text lists runs 7, 16, 20, 22, 28 and 30 as removed (24 observations, as
    reported), but SI Table S16 lists 25 runs including run 28. Recorded as a source
    inconsistency; tolerances.yaml fixes which list is primary.
  locator: SI pages 6, 11, 18, 24

