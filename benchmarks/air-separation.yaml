# Benchmarks of air separation: KPIs, reference ranges and the datasets they are evaluated on.
# Schema: schemas/benchmarks.schema.json; rules: docs/benchmarks.md.
#
# Ranges are facts from cited open sources, recorded in our own form in the KPI's unit, with the
# conditions the source states. Never invent a range: a KPI without an open source records
# no_open_reference (what was searched, and when). An out-of-range value needs an
# out_of_range_reason here, which may name the DESIGN.md decision that explains it.
schema: cheme-as-code/benchmarks/v1
family: air-separation

kpis:
  specific-power-gox:
    title: Specific electric power per t of gaseous oxygen product
    unit: kWh/t
    description: >-
      All electricity the plant takes (air compression, product compression, front-end
      regeneration, auxiliaries) per t of gaseous oxygen delivered at the product pressure and
      purity, unallocated: co-products (nitrogen, liquids) carry no share, as specific power is
      reported in the literature. Compare only with a reference at the same product pressure and
      purity: compression to 30 barg alone adds of the order of 100 kWh/t (ASU-1's GOX
      compressor K-4101 draws 2.26 MW for 20.86 t/h, about 108 kWh/t: processes/asu-1/DESIGN.md,
      utilities table; an estimate for this plant, not a literature value).
    references:
      - id: air-liquide-yango-2017
        range: [400, 600]
        basis: unallocated
        conditions:
          technology: cryogenic, packaged standard ASU, internal compression of the products
          product: gaseous oxygen, with GAN, LOX, LIN and argon as optional co-products
          purity: 99.5 to 99.8 % O2
          pressure: up to 42 barg
          capacity: 330 to 770 t/d oxygen
          year: 2017
        source:
          citation: "Air Liquide Engineering & Construction (2017) Standard Plants: fully-packaged modular solutions, brochure, September 2017 (Yango standard air separation unit, specifications)"
          url: https://engineering-technologies.airliquide.com/sites/engineering/files/2022-09/air-liquide-e-c-standard-plants-september-2017.pdf
          locator: p. 8, Yango specifications (specific energy)
          kind: manufacturer
          accessed: "2026-10-25"
        note: >-
          A manufacturer's published specification, not peer reviewed; it is independent of this
          library's datasets and the only open source found that states a range for high-purity
          oxygen at pipeline pressure. Per t of oxygen as the brochure states it ("Specific
          energy: 400 to 600 kWh/t"). The brochure does not say whether this is the whole plant's
          power or how co-product liquids and nitrogen compression count: basis unallocated is our
          interpretation, not a statement of the source. Replace or add a
          BREF, IEA or peer-reviewed range for these conditions when one is found. Rechecked
          2026-10-30: the URL serves the brochure, and PDF page 8 states the range, purity,
          pressure and capacity recorded here. Open
          peer-reviewed figures for near-atmospheric delivery (e.g. about 0.25 kWh per kg O2 at
          99.5 % in Pfaff and Kather 2009, Energy Procedia 1:495-502) do not apply to 30 barg
          and are single values, not ranges.

  o2-recovery:
    title: Oxygen recovery (O2 in the products per O2 in the air feed)
    unit: "%"
    description: >-
      The share of the oxygen entering with the air that leaves in the products (the rest leaves
      with the waste nitrogen). Molar and mass ratios are the same for one species. A low recovery
      means more air compressed per t of oxygen, so it explains a high specific power.
    references:
      - id: pfaff-kather-2009
        range: [97.85, 97.85]
        basis: unallocated
        conditions:
          technology: cryogenic double column, typical state of the art
          product: gaseous oxygen
          purity: 99.5 vol% O2
          pressure: approximately atmospheric
          year: 2009
        source:
          citation: "Pfaff, I., Kather, A. (2009) Comparative thermodynamic analysis and integration issues of CCS steam power plants based on oxy-combustion with cryogenic or membrane based air separation. Energy Procedia 1:495-502, doi:10.1016/j.egypro.2009.01.066"
          url: https://doi.org/10.1016/j.egypro.2009.01.066
          locator: p. 496, section 2.1
          kind: peer-reviewed
          accessed: "2026-10-25"
        note: >-
          A single typical value (the paper cites it from its reference 6), recorded as a
          zero-width range: no open source found states a range, so every value differs from it
          and needs an out_of_range_reason. The paper defines recovery as the molar flow of O2 in
          the oxygen product per O2 entering with the air. The paper's conditions (near-atmospheric
          delivery; whether an argon column is present is not recorded here) differ from ASU-1's
          (30 barg GOX, no argon column).
          A second search on 2026-10-30 for an open source that states a recovery range (web
          search of open-access journals, OSTI and NETL reports, the Smith and Klosek 2001 review
          as hosted by NETL, which gives no number, and EIGA and manufacturer literature) found
          none whose text could be read and checked. Two leads, not adopted because the stated
          range was seen only in search-engine summaries, not in the text: Luberti, Capocelli and
          Santori (2026) On the energetics of oxygen separation from air, Chem. Eng. Sci. 320,
          122660, doi:10.1016/j.ces.2025.122660 (open access, CC BY; the summary gives 83 to 99 %
          recovery at 95 to 99.6 % purity for cryogenic distillation; the full text could not be
          retrieved here), and Singla and Chowdhury (2021) Chem. Eng. Process. 162, 108354,
          doi:10.1016/j.cep.2021.108354 (not open access; the summary gives 90 to 95 % at above
          99.5 % O2 without argon extraction, citing an earlier source). Check the Luberti et al.
          text and add it as a reference with its locator if it states the range (docs/benchmarks.md,
          ASU-1).

  cooling-duty-gox:
    title: Cooling-water duty (heat rejected) per t of gaseous oxygen product
    unit: GJ/t
    description: >-
      Heat rejected to the site cooling water (compressor inter- and aftercoolers, precooling)
      per t of gaseous oxygen product, unallocated.
    no_open_reference: >-
      No open source found that states the cooling-water duty of a cryogenic air separation
      unit per t of oxygen product with its conditions: a web search of EU BREFs, IEA reports,
      open-access peer-reviewed papers and manufacturer literature on 2026-10-25 found
      compressor powers but no heat-rejection range. Most of the heat rejected is the
      compressors' shaft work (an energy balance, not a benchmark), so the KPI is reported
      without a range until a source is found. A second web search on 2026-10-30 (cooling-water
      consumption or heat rejection per t O2 of cryogenic ASUs) found none either.

datasets:
  - process: asu-1
    dataset: asu-1-500-t-d-gox
    conditions:
      technology: cryogenic double column, external GOX compression (DESIGN.md), TSA front end
      product: GOX to pipeline, with GAN, LOX and LIN co-products
      purity: ">= 99.5 mol% O2"
      pressure: 30 barg
      capacity: 500 t/d GOX
    kpis:
      specific-power-gox:
        expression: feed:POWER / product:GOXP
        per: product:GOXP
        reference: air-liquide-yango-2017
      o2-recovery:
        # O2 in the air: the dry air (feed minus its water, all of which leaves as emission:H2O)
        # times 0.2314, the O2 mass fraction of dry air (20.946 mol% O2, M = 28.964 g/mol, ISO
        # 2533:1975 standard atmosphere). O2 not recovered: emission:O2 (the waste N2 vent); the
        # O2 in GAN and LIN is below 1 ppm and neglected.
        expression: 1 - emission:O2 / ((feed:AIR - emission:H2O) * 0.2314)
        reference: pfaff-kather-2009
        out_of_range_reason: >-
          ASU-1 has no argon column and its simulated double column reaches 99.5 % GOX only with
          more air, at about 83 % recovery (D-066 in processes/asu-1/DESIGN.md, which revised the
          concept's 94 % of D-018). The design keeps this recovery and re-rates the main air
          compressor for the larger air flow (D-066); no argon column (D-001).
      cooling-duty-gox:
        expression: product:CW / product:GOXP
        per: product:GOXP
