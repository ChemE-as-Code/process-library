# Benchmarks of other inorganic chemicals. Schema: schemas/benchmarks.schema.json; rules:
# docs/benchmarks.md. Ranges are facts from the cited source, in our own form.
#
# Phosphorus tribromide (phosphorus-tribromide-1, #134): no open source gives a plant's specific
# consumptions. The stoichiometric floor of the bromine is 0.886 kg/kg PBr3 (P4 + 6 Br2 -> 4
# PBr3); it is a limit, not a range of real plants, so it is not recorded as one
# (docs/benchmarks.md: never invent a range). The one open yield, the 95.0 % on phosphorus of the
# example of DE 1 281 414 / US 3 409 401, is the dataset's own basis (DESIGN.md D-008), so binding
# it would only check the transcription.
#
# Methylmagnesium bromide (methylmagnesium-bromide-1, #157; the taxonomy has no organometallics
# family, inorganic-chemicals is the nearest): no open source gives a plant's specific
# consumptions. The stoichiometric floors per kg of 35 wt% solution are 0.279 kg methyl bromide
# and 0.071 kg magnesium (Mg + CH3Br -> CH3MgBr); they are limits, not ranges of real plants, so
# they are not recorded as ranges (docs/benchmarks.md: never invent a range).
#
# Sodium azide (sodium-azide-1, #167): the one open plant-like figure is the hydrazine use of
# US 5 208 002 Example 2 (11 recycled batches); the off-gas has no open reference.
#
# Copper(I) chloride (copper-i-chloride-1, #143): no open source gives a plant's specific
# consumptions or a yield of the wet brine route. The stoichiometric floors are 0.642 kg copper and
# 0.358 kg chlorine per kg CuCl (2 Cu + Cl2 -> 2 CuCl); they are limits, not ranges of real plants,
# so they are not recorded as references (docs/benchmarks.md: never invent a range). The open
# sources read (US 3 030 178 A, US 3 121 609 A, US 4 582 579 A, CN 1 696 062 A) give no yield on
# copper; US 4 582 579 A's example (about 120 g CuCl from 48.2 g CuO and 38.3 g Cu in HCl) is a
# different, evaporative route.
# Hydrogen iodide (hydrogen-iodide-1, #149): the dataset's efficiency is from US 8 268 284 B2, so
# that patent's figure is recorded but not bound; the KPI is bound to the per-pass conversions of
# another applicant's patent (US 11 554 956 B2). Electricity and heat have no open reference.
# tert-Butyldimethylsilyl chloride (tert-butyldimethylsilyl-chloride-1, #147; the taxonomy has no
# organosilicon family, inorganic-chemicals is the nearest): no open source gives a plant's
# specific consumptions. The one open yield, 78 % isolated on the halide of US 5 068 386 A,
# Example 3, bounds the dataset's yield from above (DESIGN.md D-002) and is a laboratory figure,
# so it is not bound as a range. The stoichiometric floors are 0.614 kg tert-butyl chloride and
# 0.856 kg dichlorodimethylsilane per kg TBSCl; they are limits, not ranges of real plants.
schema: cheme-as-code/benchmarks/v1
family: inorganic-chemicals

kpis:
  pbr3-specific-bromine:
    title: Bromine consumption per kg of phosphorus tribromide
    unit: kg/kg
    no_open_reference: "No open source with a plant's or a pilot's bromine use per kg PBr3 found independent of the dataset (searched 2026-11-05: Google Patents DE 1 281 414 B / US 3 409 401 A read, the dataset's own basis; web search for PBr3 production consumption and yields, which gave only laboratory preparations and encyclopaedia summaries without plant figures). Only the stoichiometric floor, 0.886 kg/kg, is known."
  pbr3-specific-residue:
    title: Still residue to incineration per kg of phosphorus tribromide
    unit: kg/kg
    no_open_reference: "No open source with the residue of PBr3 distillation found (searched 2026-11-05 as for pbr3-specific-bromine); US 3 409 401 names the red-phosphorus addition before the vacuum distillation but no residue amount."
  memgbr-specific-methyl-bromide:
    title: Methyl bromide consumption per kg of methylmagnesium bromide solution (35 wt%)
    unit: kg/kg
    no_open_reference: "No open source with a plant's or a pilot's methyl bromide use per kg of MeMgBr solution found (searched 2026-11-05: the Albemarle TDS 10000303 gives the product, not the process; the Fraunhofer IMM flyer on continuous Grignard formation (2020) names no MeMgBr figures; am Ende et al., OPRD 1999, 3, 319 seen as an abstract only). Only the stoichiometric floor, 0.279 kg/kg, is known."
  memgbr-specific-magnesium:
    title: Magnesium consumption per kg of methylmagnesium bromide solution (35 wt%)
    unit: kg/kg
    no_open_reference: "No open source with a plant's magnesium excess or use per kg of MeMgBr solution found (searched 2026-11-05 as for memgbr-specific-methyl-bromide). Only the stoichiometric floor, 0.071 kg/kg, is known."

  nan3-specific-hydrazine-hydrate:
    title: Hydrazine hydrate (64 wt% N2H4) per kg of sodium azide
    unit: kg/kg
    description: >-
      Hydrazine hydrate counted as 64 wt% N2H4 per kg of dried sodium azide product, with the mother
      liquor recycled from batch to batch.
    references:
      - id: us5208002-example2
        range: [0.807, 0.852]
        basis: unallocated
        conditions:
          technology: methyl nitrite absorbed into aqueous hydrazine and caustic soda at 30 C, NaN3 crystallised from the concentrated liquor, filtrate recycled (11 batches)
          product: dried sodium azide, 99.5 wt%
          region: laboratory to pilot scale (20 L)
          year: 1993
        source:
          citation: "Sasaki, M. et al. (Nippon Carbide Industries, 1993) US 5 208 002 A, Method of producing alkali metal azides (family EP 0 514 143 B1; priority 1991-05-17)"
          url: https://patents.google.com/patent/US5208002A/en
          locator: "Example 2 and Table 2: the steady cycles 4-11 (43.2 mol hydrazine added for 41.0 mol NaN3) give the low end, the 11 cycles together (493.8 mol hydrazine, 444.2 mol NaN3 at 99.5 %, 90.0 % yield) the high end; converted by us to kg of 64 wt% hydrate per kg of product"
          kind: other
          accessed: "2026-11-05"
        note: >-
          A patent example, not a plant: the dataset takes its charge ratios from the same patent's
          Example 1 (DESIGN.md D-004), but its yield on hydrazine (92 %) follows from its own
          recycle, purge and losses, so the range checks the balance, not a transcription.
  nan3-specific-offgas:
    title: Azide reactor off-gas to treatment per kg of sodium azide
    unit: kg/kg
    no_open_reference: "No open source with the off-gas (unabsorbed methyl nitrite, N2O, NH3) of a sodium azide plant found (searched 2026-11-05: Google Patents US 5 208 002 A and US 5 098 597 A read, which name the nitrogen of side reactions but give no off-gas amounts; J. Studley, Scientific Update 2023, a secondary summary without figures). The dataset's off-gas follows from the methyl nitrite not absorbed in the patent's Example 1 balance and its ASSUMED side reaction (DESIGN.md D-004, D-005)."
  cucl-specific-copper:
    title: Copper consumption per kg of copper(I) chloride
    unit: kg/kg
    no_open_reference: "No open source with a plant's or a pilot's copper use per kg CuCl by the wet brine route found independent of the dataset (searched 2026-11-06: Google Patents US 3 030 178 A, US 3 121 609 A, US 4 582 579 A, CN 1 696 062 A and US 4 308 239 A read, none with a yield on copper of the dilution route; web search for cuprous chloride production consumption figures, which gave only encyclopaedia summaries, not read where licensed). Only the stoichiometric floor, 0.642 kg/kg, is known; the dataset's 0.826 kg/kg carries its ASSUMED dilution loss (DESIGN.md D-006)."
  cucl-specific-chlorine:
    title: Chlorine consumption per kg of copper(I) chloride
    unit: kg/kg
    no_open_reference: "No open source with a plant's chlorine use per kg CuCl found (searched 2026-11-06 as for cucl-specific-copper; US 3 030 178 A, Example 1, gives a chlorine feed rate and an outflow concentration but no product isolated). Only the stoichiometric floor, 0.358 kg/kg, is known."
  hydrogen-iodide-iodine-efficiency:
    title: HI made per iodine fed, as a fraction of the stoichiometric HI
    unit: kg/kg
    references:
      - id: us11554956-ni-alumina-per-pass
        range: [0.895, 0.958]
        basis: unallocated
        note: >-
          Per-pass iodine conversion of the runs with 20 and 21 wt% Ni on alumina at 320 to 380
          degC (runs 3 to 10 of Table 1, contact time 7.3 to 8.6 s, H2/I2 2.4 to 2.9 mol/mol);
          the runs at 280 and 300 degC and the 5 wt% Ni run are lower and not included. A
          laboratory fixed bed, single pass, with the unconverted iodine collected, not an
          overall plant efficiency with recycle.
        conditions: {technology: "gas-phase H2 + I2 over Ni on alumina, single pass, laboratory", pressure: "0 to 5 psig", region: US, year: 2019}
        source:
          citation: "Yang, T. et al. (Honeywell International) US 11 554 956 B2 (2023), Integrated process and catalysts for manufacturing hydrogen iodide from hydrogen and iodine"
          url: https://patents.google.com/patent/US11554956B2/en
          locator: Example 1, Table 1
          kind: other
          accessed: "2026-11-05"
      - id: us8268284-pt-alumina-continuous
        range: [0.979, 0.980]
        basis: unallocated
        note: >-
          98.0 % at the start and 97.9 % after 100 hours of continuous operation (iodine conversion
          and HI yield are stated equal). The dataset's efficiency comes from this source, so a
          comparison with it is not an independent check.
        conditions: {technology: "gas-phase H2 + I2 (450 and 75 ml/min) over 1 g/L Pt on alumina at 350 degC, laboratory, continuous 100 h", region: JP, year: 2008}
        source:
          citation: "Kanbe, S., Hosono, K., Wada, M. (Nippoh Chemicals) US 8 268 284 B2 (2012), System and method for producing iodine compound"
          url: https://patents.google.com/patent/US8268284B2/en
          locator: Example 1, catalytic reduction reaction
          kind: other
          accessed: "2026-11-05"
  hydrogen-iodide-specific-electricity:
    title: Electricity per t of hydrogen iodide
    unit: kWh/t
    no_open_reference: >-
      No open source with an electricity figure for HI production found (2026-11-05). Read:
      US 8 268 284 B2 and US 11 554 956 B2 (process descriptions and examples, no utility data).
      Not read: Ullmann's chapter Iodine and Iodine Compounds (doi:10.1002/14356007.a14_381.pub2,
      licensed). No EU BREF was checked for HI. The dataset's value is core's Tier 0 default,
      ASSUMED.
  hydrogen-iodide-specific-heat:
    title: Heat per t of hydrogen iodide
    unit: kWh/t
    no_open_reference: >-
      No open source with a heat figure for HI production found (2026-11-05); the same sources
      were read as for electricity and give operating temperatures (iodine melted at about 120
      degC, vaporised at 150 to 170 degC, reactor at 300 to 350 degC) but no duty. The dataset's
      value is core's Tier 0 default, ASSUMED.
  tbscl-specific-tert-butyl-chloride:
    title: tert-Butyl chloride consumption per kg of tert-butyldimethylsilyl chloride
    unit: kg/kg
    no_open_reference: "No open source with a plant's tert-butyl chloride use per kg of TBSCl found (2026-11-12: the open patents US 5 068 386 A and US 5 872 274 A read, laboratory examples only; no plant figure found in the sources read). Only the stoichiometric floor, 0.614 kg/kg, and the laboratory yield of 78 % (0.787 kg/kg) are known."
  tbscl-specific-dichlorodimethylsilane:
    title: Dichlorodimethylsilane consumption per kg of tert-butyldimethylsilyl chloride
    unit: kg/kg
    no_open_reference: "No open source with a plant's silane use per kg of TBSCl found (searched 2026-11-12 as for tbscl-specific-tert-butyl-chloride). Only the stoichiometric floor, 0.856 kg/kg, is known."

datasets:
  - process: phosphorus-tribromide-1
    dataset: phosphorus-tribromide-by-semi-batch-bromination-of-white-phosphorus-in-a-pbr3-heel-1000-t-a
    conditions: {technology: "bromination of white phosphorus in a PBr3 heel at 398 K, red-phosphorus treatment, batch vacuum distillation", basis: "concept balance, ratios from the patent's example and ASSUMED (DESIGN.md D-004, D-008)"}
    kpis:
      pbr3-specific-bromine: {expression: feed:BR2 / product:PBR3, per: product:PBR3}
      pbr3-specific-residue: {expression: product:RES / product:PBR3, per: product:PBR3}
  - process: methylmagnesium-bromide-1
    dataset: methylmagnesium-bromide-in-2-methf-by-semi-batch-grignard-reaction-with-methyl-bromide-gas-dosing
    conditions: {technology: "semi-batch Grignard reaction of magnesium turnings with methyl bromide gas in 2-MeTHF at 318 K, filtration of the excess magnesium", basis: "concept balance, ratios ASSUMED (DESIGN.md D-004, D-005)"}
    kpis:
      memgbr-specific-methyl-bromide: {expression: feed:MEBR / product:PROD, per: product:PROD}
      memgbr-specific-magnesium: {expression: feed:MG / product:PROD, per: product:PROD}
  - process: sodium-azide-1
    dataset: sodium-azide-by-the-hydrazine-methyl-nitrite-route-batch-with-precipitation-from-the-reaction-liquor
    conditions: {technology: "methyl nitrite from NaNO2, methanol and H2SO4 absorbed into hydrazine hydrate and caustic soda at 313 K, methanol strip and vacuum concentration, NaN3 precipitated at 303 K, filter-dryer, mother liquor recycled with a 5 % purge", basis: "concept balance, charge ratios from US 5 208 002 Example 1, ASSUMED kinetics and purge (DESIGN.md D-004, D-005, D-016)"}
    kpis:
      nan3-specific-hydrazine-hydrate: {expression: feed:HH / product:NAN3P, per: product:NAN3P, reference: us5208002-example2}
      nan3-specific-offgas: {expression: product:OFFGAS / product:NAN3P, per: product:NAN3P}
  - process: copper-i-chloride-1
    dataset: copper-i-chloride-by-semi-batch-chlorination-of-copper-in-brine-dilution-precipitation-and-filter-drying-300-t-a
    conditions: {technology: "chlorine dosed below the surface of a 300 g/L NaCl brine over excess copper at 353 K (semi-batch, copper heel recycled), dilution with about 7 volumes of water, CuCl precipitated, acid and ethanol washes, vacuum filter-dryer; a tenth of the mother liquor recycled, the rest to copper recovery outside the boundary", basis: "concept balance, the patents' ratios, ASSUMED kinetics, solubility and work-up (DESIGN.md D-004 to D-008)"}
    kpis:
      cucl-specific-copper: {expression: feed:CU / product:CUCL, per: product:CUCL}
      cucl-specific-chlorine: {expression: feed:CL2 / product:CUCL, per: product:CUCL}
  - process: hydrogen-iodide-1
    dataset: hydrogen-iodide-catalytic-gas-phase
    conditions: {technology: "gas-phase H2 + I2 over a supported metal catalyst", basis: "Tier 0 screening, once-through efficiency"}
    kpis:
      hydrogen-iodide-iodine-efficiency:
        expression: product:hydrogen-iodide * 253.8 / ( 2 * 127.908 ) / feed:iodine
        reference: us11554956-ni-alumina-per-pass
        out_of_range_reason: "The dataset's efficiency is the platinum-catalyst result of US 8 268 284 B2 (97.9 % after 100 h), which is above the per-pass conversions of the nickel catalysts in US 11 554 956 B2; both are single-pass laboratory figures, and neither includes the iodine recycle of a plant."
      hydrogen-iodide-specific-electricity: {expression: feed:electricity / product:hydrogen-iodide, per: product:hydrogen-iodide}
      hydrogen-iodide-specific-heat: {expression: feed:heat / product:hydrogen-iodide, per: product:hydrogen-iodide}
  - process: tert-butyldimethylsilyl-chloride-1
    dataset: tert-butyldimethylsilyl-chloride-by-a-batch-grignard-route-with-filtration-solvent-recovery-and-batch-rectification
    conditions: {technology: "tert-butylmagnesium chloride from magnesium and tert-butyl chloride in THF/n-hexane (semi-batch, C4 gases vented), dosed into dichlorodimethylsilane with sodium thiocyanate, filter-dryer, batch rectification with the solvent and excess silane recycled, flaking", basis: "concept balance, the catalyst and charge ratios of US 5 068 386 A, ASSUMED kinetics and selectivity (DESIGN.md D-004, D-005)"}
    kpis:
      tbscl-specific-tert-butyl-chloride: {expression: feed:TBUCLF / product:TBSCLP, per: product:TBSCLP}
      tbscl-specific-dichlorodimethylsilane: {expression: feed:SILF / product:TBSCLP, per: product:TBSCLP}
