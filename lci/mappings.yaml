# Free emissions that are atmospheric pass-through: components taken in with the ambient air and
# returned to the atmosphere unchanged. DECISION: they are NOT exported as biosphere exchanges,
# and the air intake (feed:AIR, free) is not exported as a resource either. Exporting one side
# only would be wrong, and exporting both (resource "in air" + emission to air) is a net zero
# that LCIA methods do not all treat as zero: e.g. returned CO2 written as "Carbon dioxide,
# fossil" would count as a fossil emission (59.6 kg/h at ASU-1 — about 2 kg CO2-eq/t GOX if it
# were), and methods that credit "Carbon dioxide, in air" but count only fossil CO2 at emission
# would show a spurious credit. Core's study treats them as free in the same way, so the export
# and plantcode agree. The `flow` given is the biosphere3 flow one would use to report them;
# it is documentation, not exported. Each activity's comment lists what was left out.
pass_through:
  N2:
    flow: {name: Nitrogen, categories: [air]}
    decision: Atmospheric nitrogen returned to the atmosphere; no burden, not exported.
  O2:
    flow: {name: Oxygen, categories: [air]}
    decision: Atmospheric oxygen returned to the atmosphere (the waste nitrogen's O2); no burden, not exported.
  AR:
    flow: {name: Argon-40, categories: [air]}
    decision: Atmospheric argon, not recovered (no argon column), returned; no burden, not exported.
  H2O:
    flow: {name: Water, categories: [air]}
    decision: >-
      Intake air humidity removed (ASU-1: in the TSA; utility-instrument-air: in the dryer, with
      its purge) and returned; no burden, not exported (biosphere3 counts water to air in m3, the
      dataset in kg: another reason not to export it unconverted).
  CO2:
    flow: {name: "Carbon dioxide, in air", categories: [natural resource, in air]}
    decision: >-
      Atmospheric CO2 removed from the intake air by the TSA and returned unchanged. It is not
      fossil and not a biogenic uptake: no net emission, not exported (never as "Carbon dioxide,
      fossil").
  # Declared zeros: components a dataset lists as free emissions at 0 kg to close its component
  # balance (chlor-alkali-1's effluent and vent). Nothing is released, so nothing is exported. The
  # entry is no licence for a release: a non-zero amount must be an emission with its flow.
  H2:
    flow: {name: Hydrogen, categories: [air]}
    decision: "Declared zero (chlor-alkali-1: not in the vent S18); a hydrogen release is an emission (biosphere H2), not free."
  Cl2:
    decision: "Declared zero (chlor-alkali-1: the brine is fully dechlorinated in R402); not exported. A chlorine release is an emission with its flow, not free."
  HCl:
    decision: "Declared zero (chlor-alkali-1: effluents neutralised); not exported. A release is an emission with its flow, not free."
  NaOH:
    decision: "Declared zero (chlor-alkali-1: effluents neutralised in R402 and X201); not exported. A release is an emission with its flow, not free."
  Na2CO3:
    decision: "Declared zero (chlor-alkali-1: neutralised in R202); not exported. A release is an emission with its flow, not free."
  Na2SO3:
    decision: "Declared zero (chlor-alkali-1: consumed in R402); not exported. A release is an emission with its flow, not free."
  CaSO4:
    decision: "Declared zero (chlor-alkali-1: converted in R101); not exported. A release is an emission with its flow, not free."
  MgCl2:
    decision: "Declared zero (chlor-alkali-1: converted in R101); not exported. A release is an emission with its flow, not free."
  CaCO3:
    decision: "Declared zero (chlor-alkali-1: solids leave with the filter cake S10, a waste to landfill); not exported."
  MgOH2:
    decision: "Declared zero (chlor-alkali-1: solids leave with the filter cake S10, a waste to landfill); not exported."
  SiO2:
    decision: "Declared zero (chlor-alkali-1: solids leave with the filter cake S10, a waste to landfill); not exported."
  S:
    decision: "Declared zero (sulfuric-acid-1: the sulfur burns completely; the gas template lists S in the tail gas at 0); not exported. A release is an emission with its flow, not free."
  BIURET:
    decision: "Declared zero (urea-1: no emission stream carries biuret, the prilling dust is modelled as urea); not exported. A release is an emission with its flow, not free."
