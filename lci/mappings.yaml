# How the Atlas LCI export links each dataset exchange to a Brightway background.
# Schema: schemas/lci-mappings.schema.json (cheme-as-code/lci-mappings/v1). Read by build_lci.py.
#
# Background activities are referenced by NAME ONLY (name, reference product, unit, location):
# no ecoinvent data is shipped (licence). The database is chosen at install time
# (cheme_as_code_lci.install(background=...)), not here. A location written as `site` is an
# install-time parameter: install(location="FR") replaces it; without one, `default_site_location`
# is used and the install report says so.
#
# The names follow ecoinvent 3.11 (cut-off) conventions. A curator with a licence checks them
# with scripts/check_mappings.py in a Brightway project that holds the background, which records
# the check in lci/mapping-checks/ (database, version, date, who, every unmatched name); the build
# states the latest check in datapackage.json (brightway.background_check: verified, failed,
# stale or unchecked). Until a record exists they are NOT checked against a licensed copy:
# install() reports any that do not link, and a curator fixes them here.
#
# This file is the shared vocabulary. A process's own overrides by exchange key are in
# processes/<id>/lca/mappings.yaml (schemas/lci-process-mappings.schema.json, ADR 0022).
#
# Lookup order for one exchange of a dataset (build_lci.py):
#   1. a curated override: the process's lca/mappings.yaml `exchanges:` ("<key>"), else
#      `exchanges:` here ("<process-id>/<key>" or "<key>"; none today). One exchange in both
#      files is an error. It `use`s an entry or names an Atlas `dataset` (path, product);
#   2. the exchange's own `link` when it names a Brightway activity, a biosphere flow or another
#      Atlas dataset (core's lca_dataset `link.activity` / `link.biosphere` / `link.dataset`);
#   3. the chemical slug of the exchange (process.yaml `inventory_key`, or the key's id when it
#      is a registry slug) in `technosphere:`;
#   4. the exchange's `link.factor` id (a lca/factors.yaml id) in `technosphere:`.
# Emissions and resources (emission:<component>, resource:<component>) are linked to the
# biosphere by, in this order: the biosphere3 UUID of the exchange's `flow:` identity (core's
# elementary-flow crosswalk; an entry of `biosphere:` keyed by that UUID may correct the name and
# categories), `link.biosphere`, the component in `biosphere:` (<component>/<origin>, else
# <component>). The installer links by UUID first and falls back to name, categories and unit.
# Free emissions must be listed in `pass_through:` with the decision. An exchange with no mapping
# or biosphere identity is a gap, in a public process too: exported unlinked, listed in
# lci/gaps.json, and its process is marked preliminary (ADR 0022, ADR 0026). An id
# found in `cutoff_exclusions:` instead of `technosphere:` is left out of a cut-off build with its
# decision (docs/system-model.md).
schema: cheme-as-code/lci-mappings/v1

# The system model of the default build (docs/system-model.md): attributional, cut-off. Avoided-
# burden credits live only in `substitution:` below and are written only into a build made with
# --system-model substitution, a separate database with its own name. build_lci.py refuses a
# negative (avoided) technosphere exchange in a cut-off build.
system_model: cutoff

# ecoinvent has "market for electricity, medium/high voltage" per country, not for RER (that is a
# "market group"). DE is only the default for an unstated site: pass install(location=...).
default_site_location: DE

technosphere:
  # --- utilities -----------------------------------------------------------------------------
  electricity:
    activity: {name: "market for electricity, medium voltage", reference_product: "electricity, medium voltage", unit: kilowatt hour, location: site}
    source: >-
      The library default for industrial power whose supply voltage the design does not state:
      grid supply at medium voltage (ecoinvent: 1 to 24 kV; coordinator decision, process-library#52).
      The country is the site's.
  electricity-high-voltage:
    activity: {name: "market for electricity, high voltage", reference_product: "electricity, high voltage", unit: kilowatt hour, location: site}
    source: >-
      Grid supply at high voltage (ecoinvent: above 24 kV), for a design that states a supply above
      24 kV (an exchanges override names it). The reference product is the crosswalk name of the
      registry grade electricity/high-voltage. The country is the site's.
  cooling-water:
    proxy: cooling-water
    source: >-
      Datasets count cooling water as heat rejected (kWh). ecoinvent has no activity per kWh of
      heat rejected, so a screening proxy (below) expresses it as the electricity of pumps and fans.
      This is the background alternative: with install(prefer_atlas=True) (the default) a
      consumer links the Atlas utility processes/utility-cooling-tower instead (make-up water,
      evaporation, blowdown), unless an `exchanges:` override says `atlas: false` (asu-1, below).

  # --- library utilities (processes/utility-*, #45) ------------------------------------------
  # Each utility product carries a registry slug (steam, wastewater, cooling-water, ...). A
  # consumer's input of it, or its output of a utility service (heat to cooling water,
  # wastewater, gas to flare), links to the Atlas utility by default (prefer_atlas) and to the
  # entry here when the installer is told prefer_atlas=False. Provider profiles that select a
  # background per study do not exist yet; until then this is the only alternative.
  # Utilities without an entry here (instrument-air, chilled-water, flare-gas) have no curated
  # background name yet: a consumer of one is a gap until it is added (TODO).
  steam:
    proxy: steam-mp
    source: >-
      Steam counted by mass (kg) at 11 bar(a) saturated (registry steam/mp-11bara). The background
      counts heat from steam in MJ: the unit proxy below converts by the steam's enthalpy.
  heat-from-steam:
    activity: {name: "market for heat, from steam, in chemical industry", reference_product: "heat, from steam, in chemical industry", unit: megajoule, location: RER}
    source: The background's steam heat for the chemical industry; used by the steam-mp proxy only.
  water:
    activity: {name: "market for water, deionised", reference_product: "water, deionised", unit: kilogram, location: RoW}
    source: >-
      Demineralised water (boiler feedwater of utility-steam-ng-boiler). The library has no
      demineralised water dataset yet (#45), so this background link is the only one.
  natural-gas:
    proxy: natural-gas-kg
    source: >-
      Natural gas counted by mass (kg, taken as methane) with its LHV as carrier; the background
      counts it by volume: the unit proxy below converts it.
  natural-gas-m3:
    activity: {name: "market for natural gas, high pressure", reference_product: "natural gas, high pressure", unit: cubic meter, location: site}
    source: Natural gas from the site's high-pressure grid; used by the natural-gas-kg proxy only.
  wastewater:
    proxy: wastewater-kg
    source: >-
      Wastewater to treatment counted by mass (kg, 1 m3 = 1000 kg); the background counts it per
      m3. With prefer_atlas a consumer links processes/utility-wwtp instead.
  wastewater-treatment:
    activity: {name: "treatment of wastewater, average, wastewater treatment", reference_product: "wastewater, average", unit: cubic meter, location: RoW}
    source: >-
      Average municipal-type wastewater treatment (a treatment activity, production -1); used by
      the wastewater-kg proxy only.
  nitrogen:
    activity: {name: "market for nitrogen, liquid", reference_product: "nitrogen, liquid", unit: kilogram, location: RER}
    source: >-
      The nitrogen utility. With prefer_atlas a consumer's nitrogen links ASU-1 (its GANP or LIN,
      by the grade the consumer names); this background alternative is merchant liquid nitrogen,
      the registry crosswalk name of nitrogen/lin (a conservative proxy for pipeline gas).
  steam-heat:
    proxy: steam-heat-kwh
    source: >-
      Steam counted as the heat it delivers (kWh), as hda-1, nitric-acid-1, chlor-alkali-1 and
      soda-ash-1 count their reboiler, heater and calciner steam; the slug `steam` is counted by mass (kg). An
      `exchanges:` override names this entry; the unit proxy below converts kWh to the
      background's MJ of heat from steam. The background does not distinguish pressure levels.
  heat-natural-gas:
    proxy: heat-natural-gas-kwh
    source: >-
      Fired heat from natural gas counted as the heat absorbed (kWh), as hda-1 counts its feed
      heater; the unit proxy below converts it to the background's MJ.
  heat-natural-gas-furnace:
    activity: {name: "market for heat, district or industrial, natural gas", reference_product: "heat, district or industrial, natural gas", unit: megajoule, location: "Europe without Switzerland"}
    source: >-
      Heat from natural gas in an industrial furnace, combustion emissions included in the
      background activity; used by the heat-natural-gas-kwh proxy only.

  # --- feedstocks and process chemicals ------------------------------------------------------
  # Inputs whose chemical has no registry entry yet (chlorine, caustic soda, toluene, ammonia ...
  # are not in chemicals/chemicals.yaml): an `exchanges:` override names the entry. The id is the
  # slug the substance would get, so that it also serves an inventory_key once it has one.
  hydrogen:
    activity: {name: "market for hydrogen, gaseous, low pressure", reference_product: "hydrogen, gaseous, low pressure", unit: kilogram, location: RER}
    source: >-
      Merchant or refinery hydrogen, by mass of H2. With prefer_atlas a consumer's hydrogen links
      the Atlas producer (hydrogen-1) instead. TODO check the name (the background's pressure
      classes) in a recorded check.
  hydrogen-methane-makeup:
    proxy: hydrogen-methane-makeup
    source: >-
      hda-1's make-up gas, PSA grade, 99.9 mol% H2 with 0.1 mol% CH4 (hda-1 D-020), counted by mass
      of the mixture: the proxy splits it into hydrogen and natural gas by mass fraction.
  toluene:
    activity: {name: "market for toluene, liquid", reference_product: "toluene, liquid", unit: kilogram, location: GLO}
    source: Fresh toluene, liquid (hda-1 feed:TOLF).
  ammonia:
    activity: {name: "market for ammonia, anhydrous, liquid", reference_product: "ammonia, anhydrous, liquid", unit: kilogram, location: RER}
    source: >-
      Anhydrous liquid ammonia (nitric-acid-1 feed:NH3). ammonia-1 makes it, but neither flow
      has a registry slug yet, so no Atlas link is offered; add one when `ammonia` is in the
      registry.
  sodium-chloride:
    activity: {name: "market for sodium chloride, powder", reference_product: "sodium chloride, powder", unit: kilogram, location: GLO}
    source: >-
      Rock salt to brine saturation (chlor-alkali-1 feed:SALT, about 98.8 wt-% NaCl), counted
      1:1 as sodium chloride.
  sodium-carbonate:
    activity: {name: "market for soda ash, dense", reference_product: "soda ash, dense", unit: kilogram, location: GLO}
    source: Soda ash, dense, for brine treatment (chlor-alkali-1 feed:NA2CO3).
  hydrochloric-acid:
    activity: {name: "market for hydrochloric acid, without water, in 30% solution state", reference_product: "hydrochloric acid, without water, in 30% solution state", unit: kilogram, location: RER}
    source: >-
      Hydrochloric acid counted as HCl without water, the background's basis; used by the
      hydrochloric-acid-32 proxy (a dataset counting the solution) and by a dataset counting HCl.
  hydrochloric-acid-30:
    proxy: hydrochloric-acid-30
    source: Hydrochloric acid 30 wt-% counted by mass of the solution (acetaldehyde-1 feed:HCLA).
  hydrochloric-acid-32:
    proxy: hydrochloric-acid-32
    source: Hydrochloric acid 32 wt-% counted by mass of the solution (chlor-alkali-1 feed:HCL).
  sodium-sulfite:
    activity: {name: "market for sodium sulfite", reference_product: "sodium sulfite", unit: kilogram, location: GLO}
    source: Sodium sulfite for brine dechlorination (chlor-alkali-1 feed:NA2SO3).
  # co2-electrolysis-bpm-1 (#331): the KOH anolyte and the merchant CO2 of the pilot skids. The
  # names follow ecoinvent 3.11 and are not checked: no ecoinvent licence (ADR 0017); install()
  # reports one that does not link.
  potassium-hydroxide:
    activity: {name: "market for potassium hydroxide", reference_product: "potassium hydroxide", unit: kilogram, location: GLO}
    source: >-
      Potassium hydroxide counted as KOH 100 % (the background's basis); used by the
      potassium-hydroxide-1m and -5m proxies, which count the solutions.
    notes: "not checked: no ecoinvent licence (scripts/check_mappings.py has not run against a licensed copy)"
  potassium-hydroxide-1m:
    proxy: potassium-hydroxide-1m
    source: 1 M KOH solution counted by mass (co2-electrolysis-bpm-1 feed:KOH-FILL).
    notes: "not checked: no ecoinvent licence"
  potassium-hydroxide-5m:
    proxy: potassium-hydroxide-5m
    source: 5 M KOH solution counted by mass (co2-electrolysis-bpm-1 feed:KOH-DOSE).
    notes: "not checked: no ecoinvent licence"
  carbon-dioxide-liquid:
    activity: {name: "market for carbon dioxide, liquid", reference_product: "carbon dioxide, liquid", unit: kilogram, location: RER}
    source: >-
      Merchant liquefied CO2 (co2-electrolysis-bpm-1 feed:CO2, a fossil industrial by-product,
      ASSUMED in its DESIGN.md D-016). ASSUMED that the background's CO2 includes the capture,
      purification and liquefaction but not the delivery to the site.
    notes: "not checked: no ecoinvent licence"
  sulfuric-acid:
    activity: {name: "market for sulfuric acid", reference_product: "sulfuric acid", unit: kilogram, location: RER}
    source: >-
      Sulfuric acid, contact process (chlor-alkali-1 feed:H2SO4, 98 wt-%, counted 1:1). ASSUMED
      that the background counts the acid as sold; TODO check its basis (100 % H2SO4 or not).
  sulfur:
    activity: {name: "market for sulfur", reference_product: "sulfur", unit: kilogram, location: GLO}
    source: >-
      Elemental sulfur, by mass of S (sulfuric-acid-1 feed:SULFUR, molten, from Claus sulfur
      recovery). ASSUMED that the background's sulfur includes no melting or transport to the
      plant; TODO check the name and location in a recorded check.
  limestone:
    activity: {name: "market for limestone, crushed, washed", reference_product: "limestone, crushed, washed", unit: kilogram, location: RoW}
    source: >-
      Crushed and screened kiln-grade limestone, counted 1:1 by mass as charged (soda-ash-1
      feed:LST, 96 wt-% CaCO3, 1 % moisture). TODO check the name (crushed, washed vs. for mill)
      in a recorded check.
  coke:
    proxy: coke-kg
    source: >-
      Metallurgical coke counted by mass as fired (soda-ash-1 feed:COKE); the background counts
      coke by energy: the unit proxy below converts it.
  coke-mj:
    activity: {name: "market for coke", reference_product: "coke", unit: megajoule, location: GLO}
    source: Coke from a coke oven plant, counted in MJ; used by the coke-kg proxy only.
  sodium-chloride-brine:
    activity: {name: "market for sodium chloride, brine solution", reference_product: "sodium chloride, brine solution", unit: kilogram, location: GLO}
    source: >-
      Sodium chloride as a brine from solution mining; used by the sodium-chloride-brine-26 proxy
      only. ASSUMED that the background counts the NaCl, not the solution; TODO check its basis.
  sodium-chloride-brine-26:
    proxy: sodium-chloride-brine-26
    source: Saturated brine, 26 wt-% NaCl, counted by mass of the solution (soda-ash-1 feed:BRINE).

  # --- construction materials, in the units the datasets use ------------------------------------
  steel-sections:
    activity: {name: "market for steel, low-alloyed, hot rolled", reference_product: "steel, low-alloyed, hot rolled", unit: kilogram, location: GLO}
    source: Structural steel, carbon-steel shells and casings (ASU-1 construction:steel, equipment-cs).
  stainless-steel:
    activity: {name: "market for steel, chromium steel 18/8, hot rolled", reference_product: "steel, chromium steel 18/8, hot rolled", unit: kilogram, location: GLO}
    source: Stainless equipment (material SS*).
  aluminium:
    activity: {name: "market for aluminium, primary, ingot", reference_product: "aluminium, primary, ingot", unit: kilogram, location: "IAI Area, EU27 & EFTA"}
    source: Brazed aluminium exchangers and cold box internals; primary ingot (forming not counted, screening).
  concrete:
    activity: {name: "market for concrete, normal strength", reference_product: "concrete, normal strength", unit: cubic meter, location: RoW}
    source: Plinths, foundations and ring walls (m3).
  pipe:
    proxy: pipe
    source: Datasets count pipe in m of an average DN; ecoinvent has no per-m process pipe.
  fitting:
    proxy: fitting
    source: Valves, flanges, gaskets, elbows, tees, reducers, in-line items are counted per piece.
  grating:
    proxy: grating
    source: Platform grating is counted in m2.
  insulation:
    proxy: insulation
    source: Pipe insulation is counted in m2 of pipe surface.

  # --- consumables, transport, end of life ---------------------------------------------------
  adsorbent:
    activity: {name: "market for zeolite, powder", reference_product: "zeolite, powder", unit: kilogram, location: GLO}
    source: Molecular sieve 13X and activated alumina of the TSA beds; zeolite powder as the proxy.
  lube-oil:
    activity: {name: "market for lubricating oil", reference_product: "lubricating oil", unit: kilogram, location: RER}
    source: Machine lubricating oil top-up.
  lorry:
    activity: {name: "market for transport, freight, lorry, unspecified", reference_product: "transport, freight, lorry, unspecified", unit: ton kilometer, location: RER}
    source: Road transport of construction materials, spares and consumables.
  platinum:
    activity: {name: "market for platinum", reference_product: "platinum", unit: kilogram, location: GLO}
    source: Platinum; used by the pt-rh-gauze proxy only.
  rhodium:
    activity: {name: "market for rhodium", reference_product: "rhodium", unit: kilogram, location: GLO}
    source: Rhodium; used by the pt-rh-gauze proxy only.
  pt-rh-gauze:
    proxy: pt-rh-gauze
    source: >-
      Precious-metal catalyst gauze lost in ammonia oxidation (nitric-acid-1 consumable:pt-rh-gauze-loss),
      counted by mass of the alloy. Precious metal catalysts are never cut (docs/system-model.md).
  inert-waste-landfill:
    activity: {name: "market for inert waste, for final disposal", reference_product: "inert waste, for final disposal", unit: kilogram, location: RoW}
    source: >-
      Landfill of a mineral, non-hazardous solid waste (a treatment activity, production -1):
      chlor-alkali-1's brine filtration sludge (CaCO3, Mg(OH)2, insolubles, entrained brine).
      ASSUMED inert; a sludge with leachable brine may need a residual-material landfill instead.
# Library-level screening proxies, written into the Atlas database itself as ordinary activities
# (code proxy:<id>) whose inputs link to the background like any other exchange. They exist where
# a dataset counts a flow in a unit ecoinvent has no activity for. Every amount is ASSUMED and
# screening level: replace with a take-off by material when the data exists.
#
# The steel and aluminium masses were chosen to be plausible AND consistent with the ASU's example
# factors (steel 2 kg CO2-eq/kg, aluminium 10 kg CO2-eq/kg), so that the export reproduces the
# plantcode study when the background carries those example scores (the CI round trip). They are
# not derived from an independent source; treat them as placeholders like the factors. A test
# reproduction does not define the published database (docs/system-model.md).
proxies:
  cooling-water:
    name: "cooling water service, per kWh heat rejected (Atlas screening proxy)"
    reference_product: "heat rejected to cooling water"
    unit: kilowatt hour
    location: GLO
    inputs:
      - {use: electricity, amount: 0.01, source: "~10 kWh of pump and fan electricity per MWh rejected (ASU-1 factors.yaml cooling-water)"}
    source: Pumping and fans only; make-up water and treatment chemicals are not counted.
  pipe:
    name: "process pipe, average DN, per m (Atlas screening proxy)"
    reference_product: "process pipe, installed"
    unit: meter
    location: GLO
    inputs:
      - {use: steel-sections, amount: 20.0, source: "ASSUMED 20 kg/m (DN100 sch. 40 ~16 kg/m, DN150 ~28 kg/m)"}
    source: Pipe steel only; supports, welding and coating are not counted.
  fitting:
    name: "pipe fitting, flange or valve, average size, per piece (Atlas screening proxy)"
    reference_product: "pipe fitting, installed"
    unit: unit
    location: GLO
    inputs:
      - {use: steel-sections, amount: 15.0, source: "ASSUMED 15 kg per piece, carbon steel (an average DN and type)"}
    source: Valves of stainless or cast bodies are counted as carbon steel (screening).
  grating:
    name: "steel grating, per m2 (Atlas screening proxy)"
    reference_product: "steel grating"
    unit: square meter
    location: GLO
    inputs:
      - {use: steel-sections, amount: 30.0, source: "ASSUMED 30 kg/m2 pressure-locked grating"}
    source: Galvanising is not counted.
  insulation:
    name: "pipe insulation with aluminium cladding, per m2 (Atlas screening proxy)"
    reference_product: "pipe insulation, installed"
    unit: square meter
    location: GLO
    inputs:
      - {use: aluminium, amount: 2.0, source: "ASSUMED 2 kg/m2 aluminium cladding (~0.7 mm sheet)"}
    source: >-
      Cladding only: the insulant itself (stone wool or PIR, ~5 kg/m2) is NOT counted yet; add it
      when a background activity for it is curated.

  # --- unit proxies of the library utilities (#45): a unit conversion, no new burden ----------
  steam-mp:
    name: "steam, saturated, 11 bar(a), per kg, as heat from steam (Atlas unit proxy)"
    reference_product: "steam, saturated, 11 bar(a)"
    unit: kilogram
    location: GLO
    inputs:
      - {use: heat-from-steam, amount: 2.717571, source: "h of saturated vapour at 11 bar(a) 2780.648 kJ/kg minus h of liquid water at 15 degC 63.077 kJ/kg (IAPWS-95 via CoolProp 8.0.0): the heat the steam carries above make-up water. ASSUMED that the background's MJ counts heat on that basis; TODO check its definition"}
    source: Converts the library's steam (kg, MP) to the background's heat from steam (MJ); background alternative of processes/utility-steam-ng-boiler.
  natural-gas-kg:
    name: "natural gas, per kg, as methane (Atlas unit proxy)"
    reference_product: "natural gas, by mass"
    unit: kilogram
    location: GLO
    inputs:
      - {use: natural-gas-m3, amount: 1.393728, source: "1 / 0.7175 kg/m3, the density of methane at 0 degC and 1.01325 bar (chemicals/chemicals.yaml, NIST SRD 69). ASSUMED pure methane and that the background's m3 is at 0 degC; at 15 degC the volume is 288.15/273.15 = 5.5 % larger. TODO check both"}
    source: Converts a fuel counted by mass to the background's volume.
  wastewater-kg:
    name: "wastewater to treatment, per kg (Atlas unit proxy)"
    reference_product: "wastewater, by mass"
    unit: kilogram
    location: GLO
    inputs:
      - {use: wastewater-treatment, amount: 0.001, source: "1 m3 = 1000 kg, the LCI convention for water (core's elementary-flow crosswalk uses the same)"}
    source: Converts wastewater counted by mass to the background's m3; background alternative of processes/utility-wwtp.
  steam-heat-kwh:
    name: "heat from steam, per kWh (Atlas unit proxy)"
    reference_product: "heat from steam, by energy"
    unit: kilowatt hour
    location: GLO
    inputs:
      - {use: heat-from-steam, amount: 3.6, source: "1 kWh = 3.6 MJ. ASSUMED that the background's MJ counts the heat the steam delivers, as the datasets count it (condensing duty); TODO check its definition (steam-mp)"}
    source: Converts steam counted as heat delivered (kWh) to the background's heat from steam (MJ).
  heat-natural-gas-kwh:
    name: "heat from natural gas, industrial furnace, per kWh (Atlas unit proxy)"
    reference_product: "heat from natural gas, by energy"
    unit: kilowatt hour
    location: GLO
    inputs:
      - {use: heat-natural-gas-furnace, amount: 3.6, source: "1 kWh = 3.6 MJ. ASSUMED that the dataset's absorbed duty is the background's heat delivered (the furnace efficiency is in the background activity)"}
    source: Converts fired heat counted in kWh (hda-1 feed:FUEL, the feed heater's absorbed duty) to the background's MJ.
  hydrogen-methane-makeup:
    name: "hydrogen make-up gas, 99.9 mol% H2, 0.1 mol% CH4, per kg (Atlas unit proxy)"
    reference_product: "hydrogen make-up gas, 99.9 mol% H2"
    unit: kilogram
    location: GLO
    inputs:
      - {use: hydrogen, amount: 0.992097, source: "mass fraction of H2: 0.999 x 2.016 / (0.999 x 2.016 + 0.001 x 16.043), molar masses of chemicals/chemicals.yaml (hda-1 D-020)"}
      - {use: natural-gas-m3, amount: 0.011014, source: "mass fraction of CH4 0.007903 x 1.393728 m3/kg (natural-gas-kg proxy: methane at 0 degC, 1.01325 bar)"}
    source: >-
      Splits a two-component make-up gas by mass. ASSUMED that its methane is supplied as natural
      gas; mixing and compression are not counted.
  hydrochloric-acid-32:
    name: "hydrochloric acid, 32 wt-% in water, per kg of solution (Atlas unit proxy)"
    reference_product: "hydrochloric acid, 32 wt-%"
    unit: kilogram
    location: GLO
    inputs:
      - {use: hydrochloric-acid, amount: 0.32, source: "HCl mass fraction of the solution (chlor-alkali-1 dataset composition of feed:HCL)"}
    source: >-
      Converts the solution's mass to the background's HCl without water; the dilution water is
      not counted (screening).
  hydrochloric-acid-30:
    name: "hydrochloric acid, 30 wt-% in water, per kg of solution (Atlas unit proxy)"
    reference_product: "hydrochloric acid, 30 wt-%"
    unit: kilogram
    location: GLO
    inputs:
      - {use: hydrochloric-acid, amount: 0.30, source: "HCl mass fraction of the solution (the 30 wt% acetaldehyde-1 feed:HCLA states)"}
    source: >-
      Converts the solution's mass to the background's HCl without water; the dilution water is
      not counted (screening).
  pt-rh-gauze:
    name: "platinum-rhodium gauze 90/10, per kg (Atlas screening proxy)"
    reference_product: "platinum-rhodium gauze"
    unit: kilogram
    location: GLO
    inputs:
      - {use: platinum, amount: 0.9, source: "ASSUMED Pt/Rh 90/10 by mass (nitric-acid-1 dataset, O-3)"}
      - {use: rhodium, amount: 0.1, source: "ASSUMED Pt/Rh 90/10 by mass (nitric-acid-1 dataset, O-3)"}
    source: >-
      The alloy as its metals; weaving and refining are not counted, and no recovered metal is
      credited (cut-off: the recovery belongs to the refiner).
  coke-kg:
    name: "coke, per kg as fired, as energy (Atlas unit proxy)"
    reference_product: "coke, by mass"
    unit: kilogram
    location: GLO
    inputs:
      - {use: coke-mj, amount: 29.11, source: "LHV 29.11 MJ/kg of the coke as fired, 89 wt-% C, 2 % moisture (soda-ash-1 process/furnaces.yaml, D-005, ASSUMED). ASSUMED that the background's MJ counts the coke by its lower heating value; TODO check its definition"}
    source: Converts coke counted by mass to the background's energy; the conversion uses soda-ash-1's coke analysis.
  sodium-chloride-brine-26:
    name: "sodium chloride brine, 26 wt-% NaCl, per kg of solution (Atlas unit proxy)"
    reference_product: "sodium chloride brine, 26 wt-%"
    unit: kilogram
    location: GLO
    inputs:
      - {use: sodium-chloride-brine, amount: 0.26, source: "NaCl mass fraction of the brine (soda-ash-1 dataset composition of feed:BRINE)"}
    source: >-
      Converts the brine's mass to the background's NaCl; the brine water and the brine
      purification (Ca/Mg removal, soda-ash-1 D-003) are not counted (screening).
  potassium-hydroxide-1m:
    name: "potassium hydroxide, 1 M in water, per kg of solution (Atlas unit proxy)"
    reference_product: "potassium hydroxide, 1 M solution"
    unit: kilogram
    location: GLO
    inputs:
      - {use: potassium-hydroxide, amount: 0.053433333, source: "KOH mass fraction of the 1 M fill, 56.105 g/mol / 1.05 kg/L (co2-electrolysis-bpm-1 dataset composition of feed:KOH-FILL; the density ASSUMED there)"}
      - {use: water, amount: 0.946566667, source: "the dilution water, the rest of the fill's mass (co2-electrolysis-bpm-1 dataset composition of feed:KOH-FILL)"}
    source: >-
      Converts the solution's mass to the background's KOH 100 % and its dilution water
      (deionised). tests/test_lci_case_datasets.py checks both amounts against the dataset's
      composition.
  potassium-hydroxide-5m:
    name: "potassium hydroxide, 5 M in water, per kg of solution (Atlas unit proxy)"
    reference_product: "potassium hydroxide, 5 M solution"
    unit: kilogram
    location: GLO
    inputs:
      - {use: potassium-hydroxide, amount: 0.229938525, source: "KOH mass fraction of the 5 M dose, 5 x 56.105 g/mol / 1.22 kg/L (co2-electrolysis-bpm-1 skid-b dataset composition of feed:KOH-DOSE; the density ASSUMED there)"}
      - {use: water, amount: 0.770061475, source: "the dilution water, the rest of the dose's mass (co2-electrolysis-bpm-1 skid-b dataset composition of feed:KOH-DOSE)"}
    source: >-
      Converts the solution's mass to the background's KOH 100 % and its dilution water
      (deionised). tests/test_lci_case_datasets.py checks both amounts against the dataset's
      composition.

# Flows the cut-off model leaves out of the producer's system (docs/system-model.md, "Wastes and
# recyclables"): material sent to recycling leaves burden-free, the recycler carries the
# recycling, and the producer gets no credit. An exchange that resolves to one of these ids is
# not exported in a cut-off build; the decision is written into the activity comment and
# datapackage.json (system_model.excluded). In a substitution build it is linked through
# `substitution.technosphere`.
cutoff_exclusions:
  steel-recycling:
    decision: >-
      End-of-life steel scrap sent to recycling. Cut-off: the scrap leaves burden-free, the
      recycling belongs to the secondary steel that uses it, and no avoided-primary credit is
      given. ASU-1's dataset (end-of-life:steel-recycling) keeps the credit for the study's own
      question; the database leaves it out (database decision, process-library#52).
  aluminium-recycling:
    decision: >-
      End-of-life aluminium scrap sent to recycling. Cut-off, as steel-recycling: no credit in
      the default build (process-library#52).
  spent-sulfuric-acid:
    decision: >-
      Spent sulfuric acid (chlor-alkali-1, about 75 wt-% from chlorine drying) sent off site for
      re-use or reconcentration. Cut-off at the point of recycling: it leaves burden-free, the
      user or reconcentrator carries the treatment, and no avoided-acid credit is given.

# The substitution variant (--system-model substitution): a separate database,
# cheme-as-code-atlas-<version>-substitution, never mixed into the default build. It adds the
# avoided-burden credits of end-of-life recycling as the ASU study models them. Multi-
# functionality is still handled by the allocation hierarchy (`allocation:` below): bw2io's
# Excel format has one activity per co-product, so system expansion of co-products is not
# exported.
substitution:
  technosphere:
    steel-recycling:
      proxy: steel-scrap-credit
      source: >-
        The ASU study gives end-of-life steel a recycling credit (avoided burden). Substitution
        variant only.
    aluminium-recycling:
      proxy: aluminium-scrap-credit
      source: As steel-recycling, for aluminium. Substitution variant only.
    spent-sulfuric-acid:
      proxy: spent-sulfuric-acid-credit
      source: Spent acid re-used off site, credited as avoided sulfuric acid. Substitution variant only.
  proxies:
    steel-scrap-credit:
      name: "steel scrap to recycling, avoided primary steel credit (Atlas screening proxy)"
      reference_product: "steel scrap, for recycling"
      unit: kilogram
      location: GLO
      inputs:
        - {use: steel-sections, amount: -0.5, source: "ASSUMED net credit of 0.5 kg primary steel per kg scrap (avoided primary minus remelting)"}
      source: End-of-life credit (avoided burden), as in the ASU study; substitution variant only.
    aluminium-scrap-credit:
      name: "aluminium scrap to recycling, avoided primary aluminium credit (Atlas screening proxy)"
      reference_product: "aluminium scrap, for recycling"
      unit: kilogram
      location: GLO
      inputs:
        - {use: aluminium, amount: -0.7, source: "ASSUMED net credit of 0.7 kg primary aluminium per kg scrap"}
      source: End-of-life credit (avoided burden), as in the ASU study; substitution variant only.
    spent-sulfuric-acid-credit:
      name: "spent sulfuric acid to re-use, avoided sulfuric acid credit (Atlas screening proxy)"
      reference_product: "spent sulfuric acid, for re-use"
      unit: kilogram
      location: GLO
      inputs:
        - {use: sulfuric-acid, amount: -0.753537, source: "the H2SO4 mass fraction of the spent acid (chlor-alkali-1 dataset composition of product:SPENT); ASSUMED 1:1 displacement of fresh acid, reconcentration not counted (an upper bound of the credit)"}
      source: Avoided burden of the re-used acid; substitution variant only.

# Multi-functionality in the database (docs/system-model.md, "Multi-functionality"), by
# "<process-id>" or "<process-id>/<dataset-id>". The study keeps its own choice for its own
# question; the export uses the method recorded here. `rule` names the step of the hierarchy
# that justifies it: physical-exergy, physical-energy, economic, mass, co2-cutoff (method shares,
# `product:` names the CO2 co-product, whose share must be 0), pcr, or deviation (any
# proportional method, with the reason). A study or dataset states a deviation itself with
# `allocation.deviation` (core allows it in lca.yaml and in the dataset); an entry here wins
# over it and is needed only when the library overrides the study.
# `shares:` may give the shares for method shares. Without an entry, the build applies the WBCSD
# price-ratio rule when prices per kg are known and reports a finding otherwise.
allocation:
  asu-1:
    method: exergy
    rule: physical-exergy
    reason: >-
      One cryogenic separation of air; GOX, GAN, LOX and LIN leave it in different thermodynamic
      states (compressed gas, gas at 9 bara, cold liquids), so exergy is the underlying physical
      relationship (hierarchy step 2a). Same method as the study (asu-1 DESIGN.md D-056), so the
      database and the study agree. Economic allocation would need prices (#46).
  refinery-distillation-1:
    method: energy
    rule: physical-energy
    reason: >-
      The cuts of the crude and vacuum units are co-produced fuels and refinery feedstocks, so
      energy content (LHV) is the physical relationship (hierarchy step 2). The LHVs are IPCC 2006
      category defaults per cut, given in each dataset (not measured values of these cuts).
  catalytic-reforming-1:
    method: energy
    rule: physical-energy
    reason: >-
      Reformate, hydrogen, LPG and fuel gas are fuels and hydrogen, so energy content (LHV) is the
      physical relationship (hierarchy step 2). LHVs as the dataset gives them: IPCC 2006 defaults,
      the registry's for hydrogen.
  fcc-1:
    method: energy
    rule: physical-energy
    reason: >-
      Gasoline, LPG, dry gas, light and heavy cycle oil are fuels and fuel blendstocks, so energy
      content (LHV) is the physical relationship (hierarchy step 2). LHVs are IPCC 2006 defaults of
      the matching fuel categories (ASSUMED match), given in the dataset.
  hydrocracking-1:
    method: energy
    rule: physical-energy
    reason: >-
      The hydrocracked products, the C1-C2 gas and the unconverted-oil bleed are fuels and fuel
      blendstocks, so energy content (LHV) is the physical relationship (hierarchy step 2). LHVs are
      IPCC 2006 defaults per cut, the unsplit product's ASSUMED (jet kerosene), given in the dataset.
  plastic-pyrolysis-1:
    method: energy
    rule: physical-energy
    reason: >-
      The raw pyrolysis oil and the exported pyrolysis gas are co-produced fuels (the oil also a
      steam-cracker feed after upgrading), so energy content (LHV) is the physical relationship
      (hierarchy step 2). LHVs are IPCC 2006 category defaults, naphtha for the oil and ethane for
      the gas (ASSUMED match), given in the dataset; the char is a residue, not a co-product.
  waste-incineration-1:
    method: exergy
    rule: deviation
    reason: >-
      Net electricity and net heat of one CHP steam cycle, not the products of one separation, so
      hierarchy step 2a (physical-exergy) does not name this case. docs/system-model.md section 2
      allocates exported heat as a co-product by energy or exergy, documented per process, never
      credited. Exergy is chosen because the two leave in different thermodynamic qualities (work,
      and heat as condensing 1.7 bar(a) steam at 115 degC to the district-heating exchanger, the
      boundary), which energy content would treat as equal. The products are in kWh, so the WBCSD
      price-ratio rule (per kg) does not apply. Exergy per kWh is in the dataset's product
      properties (electricity 3600 kJ; heat the Carnot factor at the boundary temperature).

