# The root of this plant repository. Schema: `plantcode schema plant`.
name: "ASU-1 (500 t/d GOX)"
description: >-
  Cryogenic air separation unit, double-column process without argon column.
  500 t/d GOX 99.5 mol% at 30 barg (GOX compressor), 10,000 Nm3/h GAN <= 10 ppm O2 at 8 barg,
  LOX/LIN backup storage with cryogenic pumps and ambient-air vaporizers.
units: SI
stage: concept
stages:
  - {id: concept, title: Concept and feasibility}
  - {id: basic, title: Basic engineering}
  - {id: detail, title: Detail engineering}
# P&ID sheets, DEXPI 2.0.1 XML. The files are drafted in stage basic (D-011).
sheets:
  - {id: P-01, file: pid/P-01.xml, title: Main air compressor and precooling}
  - {id: P-02, file: pid/P-02.xml, title: Front-end purification (TSA)}
  - {id: P-03, file: pid/P-03.xml, title: Cold box}
  - {id: P-04, file: pid/P-04.xml, title: "Products, storage and backup supply"}
