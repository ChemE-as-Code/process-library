# Equipment list. Schema: `plantcode schema equipment`.
# Tags per DESIGN.md D-007. Design P/T are concept values (ASSUMED) unless stated otherwise.
# Silencers and safety valves are DEXPI piping components: listed in DESIGN.md D-020 / section 4.
# Cryogenic items list the minimum design temperature; the maximum is in the notes.
# dimensions: overall sizes in m (vertical: bottom of skirt/legs to top of head; horizontal: over
# both heads or channels, height = top of shell on its saddles; box: length x width x height),
# all ASSUMED at basic engineering, basis in DESIGN.md D-028 (vendor data in detail engineering).
# weight: empty weight in t of the items lifted whole in maintenance (machines, exchangers,
# heater, vaporizers), ASSUMED from typical sizes of the duty; columns, adsorbers, tanks, the
# filter house and the MAC train are erected once before the piping and carry none (D-034).
# variant: the machine shape (cryogenic pumps).
