notes: 'Streams: air, booster air, GOX, GAN, waste N2. Max design temperature 65 C. O2 service (D-009).
  Bank of 4 cores ~1.2 x 1.2 x 7.3 m side by side with headers, standing vertical (warm end up). ASSUMED.
  Open (DESIGN.md D-053): the duty (5,211 kW, warm side) is calculated; the area of a multi-stream brazed
  plate-fin exchanger follows from its composite curves and fin geometry in the supplier''s design (one LMTD
  with a shell-and-tube U does not apply), and the cold inlet temperatures depend on the subcooler E-3102,
  which the flowsheet does not carry. Check: from saturated vapour the cold streams would take 5,866 kW, 655
  kW more than the warm side gives; that is the warming of GAN and waste N2 in E-3102 plus the heat leak.'
