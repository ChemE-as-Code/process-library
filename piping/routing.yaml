# Routing rules and intent for the 3D pipe routes. Schema: `plantcode schema routing`.
# Skill pipe-routing. Basis in DESIGN.md D-029; every rule ASSUMED at basic engineering.
rules:
  tiers:
    # PR1 (5 / 7 / 9 m): water utilities low, large warm process gas in the middle, oxygen and
    # cryogenic lines on the top tier at the rack edge, away from everything else (D-026 (2))
    - {rack: PR1, elevation: 5, fluids: [Cooling water, Cooling water return, Chilled water]}
    - {rack: PR1, elevation: 7, fluids: [Air, Dry air, Waste nitrogen]}
    - {rack: PR1, elevation: 9, fluids: [Oxygen, Liquid oxygen, Nitrogen, Liquid nitrogen, Rich liquid]}
    # PR2 (6.5 / 8.5 m over the central road): oxygen top, nitrogen below
    - {rack: PR2, elevation: 8.5, fluids: [Oxygen, Liquid oxygen]}
    - {rack: PR2, elevation: 6.5, fluids: [Nitrogen, Liquid nitrogen, Waste nitrogen, Air]}
  battery_limits:
    # cooling water from and to the cooling water plant west of the plot (ASSUMED, D-029)
    - {id: CW-plant, lines: ["CW-*", "CWR-*"], rack: PR1, rack_end: start}
    # GOX and GAN product pipelines: battery limit beside PR1 near its east end, 11 m from the east
    # road R5 so the BL bleeds' zones stay off the road; the customer pipelines continue along
    # the rack from there (ASSUMED tie-ins, D-029, review 2026-10-21-layout#6)
    # x = 171: the BL bleed outlets 16 m from the east road edge (O2 vent outlets >= 15 m from
    # roads, D-025, D-033 (3))
    - {id: GOX-pipeline, lines: [GOX-4002], point: [171.0, 63.2, 9.5]}
    - {id: GAN-pipeline, lines: [GAN-4002], point: [171.0, 62.2, 9.5]}
    # road tanker couplings at the edge of the truck fill bay Z-TRUCK on the north road (the
    # hose reaches across the bay; D-017, D-026 (4))
    - {id: LOX-tanker, lines: [LOX-4004], point: [128, 132.4, 1.0]}
    - {id: LIN-tanker, lines: [LIN-4004], point: [153, 132.4, 1.0]}
  # vent and relief outlets: each riser rises until its zone sphere (layout/zones.yaml, the
  # line as source) clears every walking level up to the walkway headroom (D-011, D-033 (1),
  # (3), (5)); the criterion is the ASSUMED screening radius until the vent study gives it
  vents:
    # PSV-3114 / PSV-3116 tailpipes from the relief valve platform RV on the cold box roof
    - {lines: [VNT-3002, VNT-3003], max_rise_m: 8}
    # GOX / GAN battery limit bleeds: above the PR1 top tier (9 m) and clear of grade
    - {lines: [VNT-4007], rise_m: 9, max_rise_m: 12}
    # the drain vaporizer vent, the evaporative cooler top vent (above its top platform)
    - {lines: [VNT-3001, WN-1002], max_rise_m: 10}
    # the LOX / LIN tank boil-off vents, vacuum breakers and relief tailpipes on the west side
    # of the tank roofs: risers clear of the stair, landing and roof platform (D-038 (2))
    - {lines: [VNT-4001, VNT-4005], max_rise_m: 8}
    - {lines: [VNT-4006], rise_m: 5, max_rise_m: 10}
lines:
  # internals of the stacked double column: E-3103 sits in the C-3102 sump on top of C-3101
  - {line: GAN-3002, skip: "internal of the double column: HP top vapour rises straight into the condenser E-3103 in the C-3102 sump (D-028)"}
  - {line: LN-3002, skip: "internal of the double column: condensate from E-3103 runs back down into the C-3101 top (D-028)"}
  - {line: VNT-3004, skip: "casing breather PSV-3123 sits on the cold box casing roof and discharges there; no process nozzle (zone Z-N2-CASING)"}
  # pinned and moved south of the compander skid (y 33.6 instead of 35.06 over KT-3101), clear
  # of the rotor lift (review 2026-10-21-layout-rereview#6, D-033 (5))
