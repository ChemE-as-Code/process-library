      lhv: {value: 49.5, unit: MJ/kg, range: [47.5, 50.6], source: "IPCC (2006) Guidelines, Vol. 2 Energy, ch. 1, Table 1.2, p. 1.18: default net calorific value of the fuel category 'Refinery Gas' (95 % interval as range); a category default, not a measured value of the stream"}

  - slug: reformate
    name: Reformate
    kind: mixture
    note: "Liquid C5+ product of a catalytic naphtha reformer: aromatics (benzene, toluene, xylenes, C9+) with paraffins and naphthenes; a gasoline blend component and the main feed of aromatics plants. Above 70 % v/v aromatics for CCR reformers (REF BREF 2015, section 2.6). The composition is one typical reformate slate of the source, not a specification: the source calls it '% yield' and states no basis, and reading it as wt% is ASSUMED; C9+ aromatics and non-aromatics are by difference. catalytic-reforming-1 uses an ASSUMED pseudo-formula of its own, not this composition."
    composition:
      basis: mass
      of: debutanised reformate, one typical slate
      components:
        - {chemical: benzene, value: 8.5, unit: wt%}
        - {chemical: toluene, value: 26.3, unit: wt%}
        - {chemical: xylenes, value: 26.1, unit: wt%}
        - {chemical: heavy-aromatics, value: 13.4, unit: wt%, note: "total aromatics 74.3 less benzene, toluene and xylenes (by difference)"}
        - {component: non-aromatics, value: 25.7, unit: wt%, note: "100 less total aromatics (by difference)"}
      source: "US DOE Office of Industrial Technologies (2000) Energy and Environmental Profile of the U.S. Chemical Industry, Table 4-1, p. 108"
    properties:
      lhv: {value: 44.3, unit: MJ/kg, range: [42.5, 44.8], source: "IPCC (2006) Guidelines, Vol. 2 Energy, ch. 1, Table 1.2, p. 1.18: default net calorific value of the fuel category 'Motor Gasoline' (95 % interval as range); a category default, not a measured value of the stream"}

