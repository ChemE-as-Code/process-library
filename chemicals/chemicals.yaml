        - {chemical: argon, value: 0.934, unit: mol%}
        - {chemical: carbon-dioxide, value: 0.0419, unit: mol%, note: "about 419 ppm, the 2023 global mean; it rises about 2 ppm a year"}
      source: >-
        N2, O2, Ar: U.S. Standard Atmosphere 1976 (NOAA, NASA, USAF), sea-level composition of dry
        air. CO2: NOAA Global Monitoring Laboratory, global annual mean 2023 (about 419 ppm).
