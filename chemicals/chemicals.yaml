# Chemicals and products registry of the process library. Schema: schemas/chemicals.schema.json
# (cheme-as-code/chemicals/v2); rules and sources: docs/registry.md.
#
# One entry per substance, mixture or utility that a process.yaml names. Processes refer to an
# entry by slug, which joins them in the Atlas graph (one "oxygen" node, whoever makes or uses
# it). A product in a defined state and purity (GOX at 30 barg, LOX) is a grade of its
# substance, `<slug>/<grade>`: the graph stays at the substance, the LCI export names the grade
# as the reference product. A flow names its grade in process.yaml (`chemical: oxygen/lox`) or,
# while its process.yaml cannot change, through `flow_grades` at the end of this file.
#
# Every property value has a source; a derived value says how it was derived. No value from a
# licensed database. Crosswalk names (ecoinvent, EF) are names only, not checked against a
# licensed copy; install() reports any that do not link.
#
# Prices: none recorded yet. Only an open source may be used (e.g. Eurostat PRODCOM or UN
# Comtrade unit values), with year, currency and region; scripts/fetch_prices.py prints one
# from UN Comtrade for review. Without a registry price, a study
# that allocates economically gives its own price with a source; otherwise the WBCSD rule falls
# back to mass (docs/registry.md, "Missing prices").
schema: cheme-as-code/chemicals/v2

