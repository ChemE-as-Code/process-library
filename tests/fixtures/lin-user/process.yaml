# Test fixture (synthetic): a downstream manifest-only process that consumes liquid nitrogen, for
# the market tests (issue #49): its LIN must link to the Atlas market, not to ASU-1's tank.
schema: cheme-as-code/process/v1
id: fixture-lin-user
title: "Fixture: tank inerting with liquid nitrogen"
summary: Synthetic downstream process that takes merchant liquid nitrogen; not engineering data.
families: [air-separation]
maturity: screening
validation: {status: unreviewed}
chemistry:
  inputs:
    - {chemical: nitrogen/lin, role: utility, inventory_key: "feed:LIN"}
  outputs:
    - {chemical: nitrogen, role: main-product, note: "inerting gas; no inventory_key, so the build does not offer it as a nitrogen producer"}
  utilities:
    - {chemical: electricity, role: utility, inventory_key: "feed:POWER"}
references:
  - {title: Fixture reference, doi: 10.0000/fixture.2}
