# TEST FIXTURE: copied unchanged (below this header) from ChemE-as-Code/example-asu lca/factors.yaml at commit 6b080cd03f9dd7f500075cc8986ec615ef59008e
# (PR #11, LCA exergy allocation; in review, numbers may still change). Used by the Brightway round trip.
# EXAMPLE FACTORS - THEY CHARACTERISE NOTHING. Schema: `cheme schema lca_factors`.
# Round placeholders to show the shape; replace each with a dataset value (status PUBLISHED or
# EPD, its source, reference year and licence) and remove `example: true`. With an ecoinvent
# licence, the values come from its market activities for the site's country.
schema: cheme/lca/v1
kind: lca_factors
example: true
categories:
  # elementary: the plant's own emissions mapped elementary are characterised by IPCC 2021 GWP100
  - {id: climate-change, title: Climate change, unit: kg CO2-eq, method: IPCC 2021 GWP100, elementary: ipcc2021-gwp100}
factors:
  - {id: electricity, title: "EXAMPLE grid electricity, medium voltage", unit: kWh, values: {climate-change: 0.4}, status: ASSUMED, source: "EXAMPLE placeholder of a European grid mix", year: 2026}
  - {id: cooling-water, title: "EXAMPLE cooling water system, per heat rejected", unit: MWh, values: {climate-change: 4.0}, status: ASSUMED, source: "EXAMPLE placeholder: ~10 kWh electricity per MWh rejected (pumps, fans) x 0.4", year: 2026}
  - {id: electricity-2040, title: "EXAMPLE grid electricity in 2040", unit: kWh, values: {climate-change: 0.1}, status: ASSUMED, source: "EXAMPLE placeholder of a decarbonised grid", year: 2040}
  # construction materials
  - {id: steel-sections, title: "EXAMPLE steel, sections and plate", unit: t, values: {climate-change: 2000}, status: ASSUMED, source: "EXAMPLE placeholder", year: 2026}
  - {id: stainless-steel, title: "EXAMPLE stainless steel", unit: t, values: {climate-change: 5000}, status: ASSUMED, source: "EXAMPLE placeholder", year: 2026}
  - {id: aluminium, title: "EXAMPLE aluminium, primary", unit: t, values: {climate-change: 10000}, status: ASSUMED, source: "EXAMPLE placeholder", year: 2026}
  - {id: pipe, title: "EXAMPLE installed pipe, per m", unit: m, values: {climate-change: 40}, status: ASSUMED, source: "EXAMPLE placeholder (an average DN)", year: 2026}
  - {id: concrete, title: "EXAMPLE reinforced concrete", unit: m3, values: {climate-change: 350}, status: ASSUMED, source: "EXAMPLE placeholder", year: 2026}
  - {id: grating, title: "EXAMPLE galvanised grating", unit: m2, values: {climate-change: 60}, status: ASSUMED, source: "EXAMPLE placeholder", year: 2026}
  - {id: insulation, title: "EXAMPLE pipe insulation with cladding", unit: m2, values: {climate-change: 20}, status: ASSUMED, source: "EXAMPLE placeholder", year: 2026}
  - {id: fitting, title: "EXAMPLE fitting, flange or valve, per piece", unit: ea, values: {climate-change: 30}, status: ASSUMED, source: "EXAMPLE placeholder (an average size)", year: 2026}
  # consumables, transport, end of life
  - {id: adsorbent, title: "EXAMPLE zeolite / alumina adsorbent", unit: kg, values: {climate-change: 3.0}, status: ASSUMED, source: "EXAMPLE placeholder", year: 2026}
  - {id: lube-oil, title: "EXAMPLE lubricating oil", unit: kg, values: {climate-change: 1.5}, status: ASSUMED, source: "EXAMPLE placeholder", year: 2026}
  - {id: lorry, title: "EXAMPLE lorry transport", unit: tkm, values: {climate-change: 0.1}, status: ASSUMED, source: "EXAMPLE placeholder", year: 2026}
  - {id: steel-recycling, title: "EXAMPLE steel scrap to recycling (credit)", unit: kg, values: {climate-change: -1.0}, status: ASSUMED, source: "EXAMPLE placeholder: avoided primary steel", year: 2026}
  - {id: aluminium-recycling, title: "EXAMPLE aluminium scrap to recycling (credit)", unit: kg, values: {climate-change: -7.0}, status: ASSUMED, source: "EXAMPLE placeholder: avoided primary aluminium", year: 2026}
  # substitutes of the co-products (system expansion)
  - {id: nitrogen-gas, title: "EXAMPLE nitrogen, gaseous, from a stand-alone plant", unit: kg, values: {climate-change: 0.15}, status: ASSUMED, source: "EXAMPLE placeholder", year: 2026}
  - {id: oxygen-liquid, title: "EXAMPLE oxygen, liquid, merchant", unit: kg, values: {climate-change: 0.45}, status: ASSUMED, source: "EXAMPLE placeholder", year: 2026}
  - {id: nitrogen-liquid, title: "EXAMPLE nitrogen, liquid, merchant", unit: kg, values: {climate-change: 0.4}, status: ASSUMED, source: "EXAMPLE placeholder", year: 2026}
