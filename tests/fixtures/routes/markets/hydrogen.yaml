# TEST FIXTURE (synthetic): a market of the fixture hydrogen, in the shape of
# process-library#76 (markets/<substance>.yaml); the route groups list its code and region.
schema: cheme-as-code/markets/v1
markets:
  - product: hydrogen/gaseous-30bar
    region: GLO
    layer: production-mix
    title: "Fixture: hydrogen, gaseous, 30 bar, production mix"
    consumption: {equals_production: true, reason: "fixture: no trade data"}
    suppliers:
      - process: route-electrolysis
        production_volume: {value: 350, unit: t/a, status: assumed, source: "fixture: synthetic volume"}
      - process: route-smr
        production_volume: {value: 350, unit: t/a, status: assumed, source: "fixture: synthetic volume"}
