# TEST FIXTURE: library-level LCI mappings of the fixture library (synthetic; the names imitate
# ecoinvent's but are only checked against the stub background of the tests).
schema: cheme-as-code/lci-mappings/v1
default_site_location: DE
technosphere:
  electricity:
    activity: {name: "market for electricity, medium voltage", reference_product: "electricity, medium voltage", unit: kilowatt hour, location: site}
    source: fixture
  water:
    activity: {name: "market for water, deionised", reference_product: "water, deionised", unit: kilogram, location: RoW}
    source: fixture
  hydrogen:
    activity: {name: "market for hydrogen, gaseous", reference_product: "hydrogen, gaseous", unit: kilogram, location: GLO}
    source: fixture background hydrogen, used when prefer_atlas is off
  nitrogen:
    activity: {name: "market for nitrogen, liquid", reference_product: "nitrogen, liquid", unit: kilogram, location: RER}
    source: fixture
  steel-sections:
    activity: {name: "market for steel, low-alloyed, hot rolled", reference_product: "steel, low-alloyed, hot rolled", unit: kilogram, location: GLO}
    source: fixture
  wastewater:
    activity: {name: "treatment of wastewater, average, wastewater treatment", reference_product: "wastewater, average", unit: cubic meter, location: RoW}
    source: fixture; a treatment activity (production -1 in ecoinvent)
biosphere:
  H2:
    flow: {name: Hydrogen, categories: [air]}
    source: fixture
pass_through:
  H2O:
    decision: fixture - feed water evaporated, not exported
exchanges: {}
