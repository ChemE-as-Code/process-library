        composition: {basis: mole_fraction, values: {N2: 0.7788, O2: 0.209, AR: 0.0093, H2O: 0.0025, CO2: 0.0004}, provenance: calculated, source: 'plantcode process propagate: pass-through K1101 from S1', fingerprint: 6d7d3d4c0a1de581}
