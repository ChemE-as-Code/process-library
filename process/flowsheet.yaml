    links: [{target: line, ref: AIR-1001, sheet: P-01}, {target: instrument, ref: FIC-1101, sheet: P-01}]
    from: AIR.out
    to: K1101.in
    template: air
    state:
      design:
        flow: {value: 98270, provenance: assumed, source: "DESIGN.md 3, stream 1 (76,000 Nm3/h)"}
        pressure: {value: 1.01, provenance: assumed, source: "DESIGN.md 3, stream 1"}
        temperature: {value: 30, provenance: given, source: "DESIGN.md 3 basis: 30 C ambient"}
        composition: {basis: mole_fraction, values: {N2: 0.7788, O2: 0.2090, AR: 0.0093, H2O: 0.0025, CO2: 0.0004}, provenance: assumed, source: "ASSUMED (D-027): standard dry air with H2O 0.25 mol% = saturation at 12 C / 5.7 bara (stream 3 'saturated'), ~59 % RH at 30 C; site humidity not stated"}
