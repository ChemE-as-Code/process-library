[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cheme-as-code-lci"
version = "0.1.0"
description = "Install the ChemE-as-Code Process Atlas LCI database into a Brightway 2.5 project, linked to your own background databases."
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "ChemE-as-Code" }]
dependencies = ["bw2io>=0.9", "bw2data>=4.0", "openpyxl>=3.1"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Private :: Do Not Upload",
]

[project.optional-dependencies]
calc = ["bw2calc>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["cheme_as_code_lci"]
