# Markets of oxygen: what a consumer of "oxygen, liquid" or of pipeline oxygen links to in the
# Atlas LCI database (code market:<product>:<region>). Schema: schemas/markets.schema.json;
# rules: docs/markets.md.
#
# Every share, volume, distance and loss has a status (cited, calculated, assumed) and a source.
# ASSUMED values are screening placeholders: no open source with the value was found. Replace
# each with a cited value when one is found, and change its status.
#
# ASU-1 is the only Atlas producer, so each production mix has one supplier. The market stands
# for the Atlas's own technology, not for the region's actual production; production equals
# consumption, as no trade data is packaged.
schema: cheme-as-code/markets/v1

markets:
  - product: oxygen/lox
    region: RER
    layer: production-mix
    title: Liquid oxygen delivered by cryogenic road tanker
    consumption:
      equals_production: true
      reason: >-
        No trade data is packaged (UN Comtrade and CEPII BACI report HS 2804.40 oxygen without
        telling liquid from gas, and their terms are not yet checked for redistribution), so the
        consumption mix is taken equal to the production mix.
    suppliers:
      - process: asu-1
        technology: cryogenic
        production_volume:
          value: 3948
          unit: t/a
          status: calculated
          source: >-
            ASU-1 LCI dataset (processes/asu-1/lca/dataset.yaml): product:LOX 470 kg per hour of
            operation, times 8400 h/a (process.yaml basis.operating_hours_per_year).
    distribution:
      - mode: cryogenic-trailer
        use: lorry
        distance:
          value: 100
          unit: km
          status: assumed
          source: >-
            ASSUMED one-way distance from the air separation plant to the customer by cryogenic
            road tanker, a round screening placeholder: no open source with the delivery distance
            of merchant liquid oxygen or nitrogen in Europe was found. TODO: check whether the
            standard transport distances of ecoinvent v2 (Frischknecht et al. 2007, ecoinvent
            report No. 1) give 100 km by road for chemicals (unverified, not a citation), or
            replace the value with a cited distance.
        note: >-
          A generic lorry: the background has no cryogenic tanker activity. Its ton kilometres
          carry the background's average load factor, which covers the empty return.
    losses:
      - kind: boil-off
        fraction: 0.005
        released_as: O2
        status: assumed
        source: >-
          ASSUMED 0.5 % of the load lost as boil-off on the road and while the tanker waits:
          vacuum-insulated tankers vent the heat leak as vapour. No open source with a value per
          delivery was found.
      - kind: transfer
        fraction: 0.01
        released_as: O2
        status: assumed
        source: >-
          ASSUMED 1 % of the load lost on transfer to the customer's tank (cool-down of the
          transfer hose and pump, flash on filling). No open source with a value was found.
    excluded:
      - "The customer's storage tank, its boil-off and the vaporiser: the consumer's own system."
      - "The producer's liquid storage: ASU-1's LOX leaves the plant dataset at the tank (stream S10), whose boil-off is not counted."

  - product: oxygen/gox-30barg-99.5
    region: RER
    layer: production-mix
    title: Gaseous oxygen at 30 barg by pipeline
    consumption:
      equals_production: true
      reason: >-
        Pipeline oxygen is used next to the plant that makes it and is not traded across borders
        in the packaged data, so consumption equals production.
    suppliers:
      - process: asu-1
        technology: cryogenic
        production_volume:
          value: 175224
          unit: t/a
          status: calculated
          source: >-
            ASU-1 LCI dataset: product:GOXP 20860 kg per hour of operation, times 8400 h/a
            (process.yaml basis.operating_hours_per_year).
    distribution:
      - mode: pipeline
        distance:
          value: 5
          unit: km
          status: assumed
          source: >-
            ASSUMED over-the-fence pipeline to a consumer on a neighbouring site, reached at the
            plant's delivery pressure (30 barg) without recompression; the compression is in the
            plant dataset (GOX compressor).
    losses:
      - kind: pipeline-leakage
        fraction: 0
        released_as: O2
        status: assumed
        source: >-
          ASSUMED no leakage from a welded industrial-gas pipeline: no open source with a leakage
          rate was found, so none is counted until one is cited.
    excluded:
      - "Pipeline infrastructure (construction of the line): not counted, as no background activity for it is curated."
