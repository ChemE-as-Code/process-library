# Markets of argon. Schema: schemas/markets.schema.json; rules: docs/markets.md.
#
# Planned, not exported: no Atlas process recovers argon. ASU-1 has no argon column, and its
# argon leaves with the waste nitrogen (coverage.yaml, air-separation). A market is exported once
# a process with an argon product exists; it then gets its suppliers, transport and losses with
# their sources, as the oxygen and nitrogen markets have.
schema: cheme-as-code/markets/v1

markets:
  - product: argon/lar
    region: RER
    layer: production-mix
    title: Liquid argon delivered by cryogenic road tanker
    consumption:
      equals_production: true
      reason: No trade data is packaged; the consumption mix is taken equal to the production mix.
    suppliers: []
    planned: >-
      No Atlas process makes liquid argon: ASU-1 has no argon column, so its argon leaves with the
      waste nitrogen vent. Add the first argon-recovering air separation process as the supplier.

  - product: argon/gar
    region: RER
    layer: production-mix
    title: Gaseous argon
    consumption:
      equals_production: true
      reason: No trade data is packaged; the consumption mix is taken equal to the production mix.
    suppliers: []
    planned: >-
      No Atlas process makes gaseous argon (ASU-1 has no argon column). Gaseous argon is mostly
      vaporised liquid or cylinder gas: model it from the liquid market once that exists.
