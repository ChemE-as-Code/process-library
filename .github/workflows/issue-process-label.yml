# Labels an issue opened from the "Process work item" form with process:<id>, from its Process
# field, so issues can be filtered by process (label:process:asu-1). The label is created on
# first use. Issues written by hand get the label by hand.
name: issue-process-label
on:
  issues:
    types: [opened, edited]
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const match = body.match(/### Process\s*\n+\s*([A-Za-z0-9._-]+)/);
            if (!match) return;
            const name = `process:${match[1]}`;
            const { owner, repo } = context.repo;
            try {
              await github.rest.issues.getLabel({ owner, repo, name });
            } catch {
              await github.rest.issues.createLabel({ owner, repo, name, color: "0e8a16",
                description: `Work on processes/${match[1]}/` });
            }
            await github.rest.issues.addLabels({ owner, repo,
              issue_number: context.payload.issue.number, labels: [name] });
