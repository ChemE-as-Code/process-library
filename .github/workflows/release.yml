name: release (draft)
# Drafts an Atlas LCI release: the tests, the public LCI database (cut-off) and its substitution
# variant, the change report against the previous release, and the archive metadata
# (.zenodo.json, CITATION.cff with version and date). The result is a workflow artifact for the
# owner to check.
#
# It publishes NOTHING: no tag, no GitHub release, no Zenodo deposit, no DOI, no deploy. Whether
# and when a release is made is the owner's decision (docs/governance.md, "Releases and DOIs");
# the owner then tags, deposits and adds the DOI by hand. Started by hand only.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "database version (semantic, MAJOR.MINOR.PATCH, see docs/governance.md)"
        required: true
      previous_ref:
        description: "tag or commit of the previous release, for the change report (empty: no report)"
        required: false
        default: ""
      previous_version:
        description: "version of the previous release (with previous_ref)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
      PREVIOUS_REF: ${{ inputs.previous_ref }}
      PREVIOUS_VERSION: ${{ inputs.previous_version }}
      # benchmarks convert units through core's foundation.units (validate.yml, docs/benchmarks.md)
      # core v1.9.0 314642c (batch screening, energy streams, recycles: core#178/#180/#181), pinned with validate.yml (same commit; tests/test_workflows.py)
      CORE: "cheme-as-code[units] @ git+https://github.com/ChemE-as-Code/core.git@314642c7fb1f7ba8c69bfb7d4595597b26a42153"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the previous release is built from its own commit
      - run: |
          git config --global url."https://x-access-token:${PLANTCODE_READ_TOKEN}@github.com/ChemE-as-Code/core".insteadOf "https://github.com/ChemE-as-Code/core"
        env:
          PLANTCODE_READ_TOKEN: ${{ secrets.PLANTCODE_READ_TOKEN }}
      - uses: astral-sh/setup-uv@v6
      - name: version is semantic
        run: |
          echo "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' \
            || { echo "version '$VERSION' is not MAJOR.MINOR.PATCH"; exit 1; }
          if [ -n "$PREVIOUS_REF" ] && [ -z "$PREVIOUS_VERSION" ]; then echo "previous_ref needs previous_version"; exit 1; fi
      - name: tooling tests
        run: uv run --python 3.12 --with pytest --with pyyaml --with jsonschema --with openpyxl --with ./python --with bw2calc --with olca-schema==2.6.2 --with multifunctional==1.1.2 --with chemicals==1.5.2 --with "$CORE" pytest -q tests -m "not engineering"
        env:
          ATLAS_REQUIRE_BRIGHTWAY: "1"
          ATLAS_REQUIRE_CORE: "1"
      # the previous release, built by its own builder from its own commit (public processes only)
      - name: previous release
        if: inputs.previous_ref != ''
        run: |
          git worktree add "$RUNNER_TEMP/previous" "$PREVIOUS_REF"
          uv run --with "$CORE" "$RUNNER_TEMP/previous/scripts/build_lci.py" --library "$RUNNER_TEMP/previous" \
            --out "$RUNNER_TEMP/previous-build" --version "$PREVIOUS_VERSION" --public
      # only published processes leave the runner (publication.status: public), as in validate.yml
      - name: LCI database (cut-off, public, strict)
        run: |
          previous=()
          if [ -n "$PREVIOUS_REF" ]; then previous=(--previous "$RUNNER_TEMP/previous-build"); fi
          uv run --with "$CORE" scripts/build_lci.py --library . --out release --version "$VERSION" --public --strict "${previous[@]}"
      - name: LCI database (substitution variant, public)
        run: uv run --with "$CORE" scripts/build_lci.py --library . --out release/substitution --version "$VERSION" --public --system-model substitution
      - name: archive metadata (draft)
        run: uv run scripts/release_metadata.py --version "$VERSION" --out release
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-lci-release-draft-${{ inputs.version }}
          path: release/
          include-hidden-files: true  # archive/.zenodo.json
          retention-days: 30
