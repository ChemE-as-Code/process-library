name: validate
on: [pull_request, push]

permissions:
  contents: read

# core is pinned to a commit (bd6cef7: core v1.7.0, 2026-11-05, batch and semi-batch processes,
# core#158: reactor semibatch, process/recipe.yaml, batch vessels, per-batch LCA). An unpinned
# install turned validate red when core changed its generated LCA records (#91). Bump the pin
# deliberately, in every URL of validate.yml and release.yml at once, together with the records
# that core regenerates (cheme assess lca-scenarios --write); tests/test_workflows.py checks that
# every core install carries the same commit.
jobs:
  # Every process folder with a plant.yaml is a plantcode project, validated on its own.
  discover:
    runs-on: ubuntu-latest
    outputs:
      plants: ${{ steps.find.outputs.plants }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1  # the files only, no history (see "Repository size" in README.md)
      - id: find
        run: echo "plants=$(ls processes/*/plant.yaml | xargs -n1 dirname | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  validate:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        plant: ${{ fromJson(needs.discover.outputs.plants) }}
    defaults:
      run:
        working-directory: ${{ matrix.plant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1  # the files only, no history (see "Repository size" in README.md)
      # cheme-as-code is read with the fine-grained token in the secret PLANTCODE_READ_TOKEN
      # (contents: read on ChemE-as-Code/core); pyDEXPI comes from PyPI.
      - run: |
          git config --global url."https://x-access-token:${PLANTCODE_READ_TOKEN}@github.com/ChemE-as-Code/core".insteadOf "https://github.com/ChemE-as-Code/core"
        env:
          PLANTCODE_READ_TOKEN: ${{ secrets.PLANTCODE_READ_TOKEN }}
      - uses: astral-sh/setup-uv@v6
      # core v1.7.0 bd6cef7 (batch: core#158) (pinned by commit, tests/test_workflows.py)
      - run: uv tool install "git+https://github.com/ChemE-as-Code/core.git@bd6cef703d4fe34d3c4f2f58bffd17bdb18877ab"
      - run: cheme fmt --check
      - run: cheme validate
      # core's per-scenario LCA records (lca/scenarios/<id>.json) must be current
      - name: LCA scenario records current
        run: if [ -d lca/scenarios ]; then cheme assess lca-scenarios --check; fi
      # Stage gates report progress (e.g. no design review recorded yet); they do not fail the build.
      - name: Engineering-step gates (informational)
        run: cheme check --no-write
        continue-on-error: true

  # The library contract: manifests, chemical registry, catalog and LCI database build strictly;
  # the tooling's tests, including the Brightway round trip.
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # core v1.7.0 bd6cef7 (batch: core#158)
      CORE: "cheme-as-code[units] @ git+https://github.com/ChemE-as-Code/core.git@bd6cef703d4fe34d3c4f2f58bffd17bdb18877ab"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # Full history here only: the catalog records each process folder's last commit
        # (git log -1 -- processes/<id>) and whether previews and snapshots are behind it. A
        # shallow clone would report HEAD for every folder. The other jobs need no history.
        with:
          fetch-depth: 0
      # The benchmarks (benchmarks/, docs/benchmarks.md) convert units through core's
      # foundation.units: core is read with the token of the validate job.
      - run: |
          git config --global url."https://x-access-token:${PLANTCODE_READ_TOKEN}@github.com/ChemE-as-Code/core".insteadOf "https://github.com/ChemE-as-Code/core"
        env:
          PLANTCODE_READ_TOKEN: ${{ secrets.PLANTCODE_READ_TOKEN }}
      - uses: astral-sh/setup-uv@v6
      - name: tooling tests
        run: uv run --python 3.12 --with pytest --with pyyaml --with jsonschema --with openpyxl --with ./python --with bw2calc --with olca-schema==2.6.2 --with multifunctional==1.1.2 --with chemicals==1.5.2 --with "$CORE" pytest -q tests -m "not engineering"
        env:
          ATLAS_REQUIRE_BRIGHTWAY: "1"
          ATLAS_REQUIRE_CORE: "1"
      # errors fail; warnings (e.g. previews, which the Atlas build renders with cheme) are listed
      - name: catalog
        run: uv run --with "$CORE" scripts/build_catalog.py --library . --out dist
      # the public build: only processes with publication.status public (all of them today)
      - name: catalog (public)
        run: uv run --with "$CORE" scripts/build_catalog.py --library . --out dist-public --public
      - name: LCI database (strict)
        run: uv run --with "$CORE" scripts/build_lci.py --library . --out dist --version "ci-${GITHUB_SHA::7}" --strict
      - name: LCI database (public)
        run: uv run --with "$CORE" scripts/build_lci.py --library . --out dist-public --version "ci-${GITHUB_SHA::7}" --public
      # only what may be published leaves the runner: the public catalog (footprints withheld by
      # each LCA's publication policy) and the public foreground LCI (published processes only,
      # no characterisation factors); the preview builds stay in the job
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: dist-public/
          retention-days: 14

  # Tests that regenerate a whole process design (pytest marker engineering, ADR 0033): the #330
  # pilot skids regenerated at 1000 h and 10000 h and asserted against their frozen hand
  # expectations. They need core's props (datasheet fill) and png (rendered views) extras and take
  # minutes, so they run here and not in the library job.
  engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # core v1.7.0 bd6cef7 (batch: core#158) (the same commit as every job, tests/test_workflows.py)
      CORE: "cheme-as-code[units,props,png] @ git+https://github.com/ChemE-as-Code/core.git@bd6cef703d4fe34d3c4f2f58bffd17bdb18877ab"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1  # the files only, no history (see "Repository size" in README.md)
      - run: |
          git config --global url."https://x-access-token:${PLANTCODE_READ_TOKEN}@github.com/ChemE-as-Code/core".insteadOf "https://github.com/ChemE-as-Code/core"
        env:
          PLANTCODE_READ_TOKEN: ${{ secrets.PLANTCODE_READ_TOKEN }}
      - uses: astral-sh/setup-uv@v6
      - name: engineering regeneration tests
        # the library job's test dependencies too: pytest collects every module of tests/
        run: uv run --python 3.12 --with pytest --with pyyaml --with jsonschema --with openpyxl --with ./python --with bw2calc --with olca-schema==2.6.2 --with multifunctional==1.1.2 --with chemicals==1.5.2 --with "$CORE" pytest -q tests -m engineering
        env:
          ATLAS_REQUIRE_CORE: "1"

  # Balance scripts reproduce the flowsheet values that cite them (ADR 0027): every process
  # script that follows the balance-output contract is re-run with the pinned cheme and its
  # output compared with process/flowsheet.yaml; --strict: every cited script follows the contract.
  balance-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1  # the files only, no history (see "Repository size" in README.md)
      - run: |
          git config --global url."https://x-access-token:${PLANTCODE_READ_TOKEN}@github.com/ChemE-as-Code/core".insteadOf "https://github.com/ChemE-as-Code/core"
        env:
          PLANTCODE_READ_TOKEN: ${{ secrets.PLANTCODE_READ_TOKEN }}
      - uses: astral-sh/setup-uv@v6
      # core v1.7.0 bd6cef7 (batch: core#158) with the property extras the balance scripts import (thermo,
      # CoolProp, scipy through thermo, Cantera); the same commit as the validate job
      - run: uv tool install --python 3.12 "cheme-as-code[props,units,cantera] @ git+https://github.com/ChemE-as-Code/core.git@bd6cef703d4fe34d3c4f2f58bffd17bdb18877ab"
      - name: balance scripts reproduce the flowsheet
        run: |
          uv run --python 3.12 scripts/check_balance_scripts.py --library . --strict --jobs 4 \
            --markdown balance-check.md --json balance-check.json
      - name: summary
        if: always()
        run: if [ -f balance-check.md ]; then cat balance-check.md >> "$GITHUB_STEP_SUMMARY"; fi
