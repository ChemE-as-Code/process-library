name: validate
on: [pull_request, push]

permissions:
  contents: read

# core is pinned to a commit (bfb5215: core main 2026-10-25, core#310; core has no tags
# yet). An unpinned install turned validate red when core changed its generated LCA records
# (#91). Bump the pin deliberately, in every URL of validate.yml and release.yml at once, together
# with the records that core regenerates (cheme assess lca-scenarios --write);
# tests/test_workflows.py checks that every core install carries the same commit.
jobs:
  # Every process folder with a plant.yaml is a plantcode project, validated on its own.
  discover:
    runs-on: ubuntu-latest
    outputs:
      plants: ${{ steps.find.outputs.plants }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1  # the files only, no history (see "Repository size" in README.md)
      - id: find
        run: echo "plants=$(ls processes/*/plant.yaml | xargs -n1 dirname | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  validate:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        plant: ${{ fromJson(needs.discover.outputs.plants) }}
    defaults:
      run:
        working-directory: ${{ matrix.plant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1  # the files only, no history (see "Repository size" in README.md)
      # cheme-as-code and pyDEXPI are private while in development. cheme-as-code is read with the
      # fine-grained token in the secret PLANTCODE_READ_TOKEN (contents: read on
      # ChemE-as-Code/core), pyDEXPI with a read-only deploy key, private half in the
      # secret DEPLOY_KEY_PYDEXPI.
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555  # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY_PYDEXPI }}
      - run: |
          git config --global url."git@github.com:process-intelligence-research/".insteadOf "https://github.com/process-intelligence-research/"
          git config --global url."https://x-access-token:${PLANTCODE_READ_TOKEN}@github.com/ChemE-as-Code/core".insteadOf "https://github.com/ChemE-as-Code/core"
        env:
          PLANTCODE_READ_TOKEN: ${{ secrets.PLANTCODE_READ_TOKEN }}
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install "git+https://github.com/ChemE-as-Code/core.git@753e3577f8c63222c97dadd423c437f54d8d2c32"
      - run: cheme fmt --check
      - run: cheme validate
      # core's per-scenario LCA records (lca/scenarios/<id>.json, core#172) must be current
      - name: LCA scenario records current
        run: if [ -d lca/scenarios ]; then cheme assess lca-scenarios --check; fi
      # Stage gates report progress (e.g. no design review recorded yet); they do not fail the build.
      - name: Engineering-step gates (informational)
        run: cheme check --no-write
        continue-on-error: true

  # The library contract: manifests, chemical registry, catalog and LCI database build strictly;
  # the tooling's tests, including the Brightway round trip.
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORE: "cheme-as-code[units] @ git+https://github.com/ChemE-as-Code/core.git@753e3577f8c63222c97dadd423c437f54d8d2c32"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # Full history here only: the catalog records each process folder's last commit
        # (git log -1 -- processes/<id>) and whether previews and snapshots are behind it. A
        # shallow clone would report HEAD for every folder. The other jobs need no history.
        with:
          fetch-depth: 0
      # The benchmarks (benchmarks/, docs/benchmarks.md) convert units through core's
      # foundation.units: core is read with the token of the validate job, pyDEXPI (its
      # dependency) with the deploy key.
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555  # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY_PYDEXPI }}
      - run: |
          git config --global url."git@github.com:process-intelligence-research/".insteadOf "https://github.com/process-intelligence-research/"
          git config --global url."https://x-access-token:${PLANTCODE_READ_TOKEN}@github.com/ChemE-as-Code/core".insteadOf "https://github.com/ChemE-as-Code/core"
        env:
          PLANTCODE_READ_TOKEN: ${{ secrets.PLANTCODE_READ_TOKEN }}
      - uses: astral-sh/setup-uv@v6
      - name: tooling tests
        run: uv run --python 3.12 --with pytest --with pyyaml --with jsonschema --with openpyxl --with ./python --with bw2calc --with olca-schema==2.6.2 --with multifunctional==1.1.2 --with "$CORE" pytest -q tests
        env:
          ATLAS_REQUIRE_BRIGHTWAY: "1"
          ATLAS_REQUIRE_CORE: "1"
      # errors fail; warnings (e.g. previews, which the Atlas build renders with cheme) are listed
      - name: catalog
        run: uv run --with "$CORE" scripts/build_catalog.py --library . --out dist
      # the public build: only processes with publication.status public (none may be today)
      - name: catalog (public)
        run: uv run --with "$CORE" scripts/build_catalog.py --library . --out dist-public --public
      - name: LCI database (strict)
        run: uv run --with "$CORE" scripts/build_lci.py --library . --out dist --version "ci-${GITHUB_SHA::7}" --strict
      - name: LCI database (public)
        run: uv run --with "$CORE" scripts/build_lci.py --library . --out dist-public --version "ci-${GITHUB_SHA::7}" --public
      # only what may be published leaves the runner: the public catalog (footprints withheld by
      # each LCA's publication policy) and the public foreground LCI (published processes only,
      # no characterisation factors); the preview builds stay in the job
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: dist-public/
          retention-days: 14
