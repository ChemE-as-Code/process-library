name: Library work item
description: Work on the library itself (schemas, catalog builder, LCI database, Atlas data), not on one process.
labels: ["scope:library"]
body:
  - type: textarea
    id: what
    attributes:
      label: What
    validations:
      required: true
  - type: textarea
    id: when
    attributes:
      label: When to do it, and when not
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
    validations:
      required: true
