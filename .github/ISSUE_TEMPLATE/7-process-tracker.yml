{
  "name": "Process development tracker",
  "description": "Coordinate a batch/value chain; link individual process issues.",
  "title": "Tracker: ",
  "labels": [
    "scope:library",
    "type:tracker"
  ],
  "body": [
    {
      "type": "textarea",
      "id": "purpose",
      "attributes": {
        "label": "Purpose and coverage",
        "description": "Link #114 and coverage.yaml; explain this batch and avoid duplicate trackers."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "issues",
      "attributes": {
        "label": "Process issues",
        "description": "Task list of canonical process issues; route children only where independently developed."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "sources",
      "attributes": {
        "label": "Candidate sources",
        "description": "Citations and exact locations, names/types only where requested; distinguish suggestions from evidence."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "delivery",
      "attributes": {
        "label": "Delivery and dependencies",
        "description": "Owners, priorities, blockers, Project/view link and scoped completion criteria. Keep workflow status, tier, calculation maturity and review separate."
      },
      "validations": {
        "required": true
      }
    }
  ]
}
