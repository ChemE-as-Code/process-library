{
  "name": "Process development",
  "description": "Propose, develop or improve one chemical/process and accumulate sources and evidence.",
  "title": "[process-id] Process development: ",
  "labels": [
    "type:process",
    "discipline:process"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Search existing issues first. Link tracker #306. Candidate names from Text-to-flowsheet (#115) and CRYSTAL (#116) are suggestions only; develop our own entries with independent sources. Workflow status never establishes scientific maturity."
      }
    },
    {
      "type": "textarea",
      "id": "identity",
      "attributes": {
        "label": "Identity and scope",
        "description": "Coverage/registry ID, proposed process ID, chemical/CAS where known, route, capacity, product grade/state and boundary. Mark unknowns."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "baseline",
      "attributes": {
        "label": "Existing entry and related work",
        "description": "Existing folder/dataset, issues and PRs; confirm this is not a duplicate. Link #306 and any route parent."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "target",
      "attributes": {
        "label": "Scoped deliverable and target",
        "description": "Choose a bounded target: references, defined brief, BFD, sourced inventory, balanced PFD, preliminary/basic engineering or optional detail/3D. State tier, applicable calculation maturity and acceptance checks separately. Stopping at BFD/PFD is valid."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "planning",
      "attributes": {
        "label": "Planning priority and next milestone",
        "description": "Propose P1 next batch / P2 later / P3 candidate and explain why. Name the next task (references, brief, BFD, sourced inventory, PFD/balances, preliminary, basic, optional detail/3D, verification). Update matching Project fields and priority label after triage."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "evidence",
      "attributes": {
        "label": "Current evidence",
        "description": "Current maturity report or Not assessed; core/backend version, evidence commit/link, review status and limitations. An existing dataset is not a validated plant."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "references",
      "attributes": {
        "label": "References and example processes",
        "description": "For each: citation/URL, exact section/table, purpose, access/read status, boundary and reuse limits. Keep benchmark answers outside design-agent access."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "dependencies",
      "attributes": {
        "label": "Dependencies and next action",
        "description": "Required inputs/core gaps/utility links, owner if known, and next concrete action."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "acceptance",
      "attributes": {
        "label": "Acceptance checklist",
        "description": "Tailor to the scoped deliverable.",
        "value": "- [ ] Scope and sourced design basis frozen\n- [ ] Sources audited and comparisons defined\n- [ ] Dataset/design implemented with explicit assumptions and limits\n- [ ] Applicable balances and strict checks recorded at a pinned commit\n- [ ] Independent review and limitations recorded\n- [ ] PR/evidence linked and coverage updated; publication: public, CC-BY-4.0 (internal only with its reason)"
      },
      "validations": {
        "required": true
      }
    }
  ]
}
