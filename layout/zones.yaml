    basis: "Kept clear of pipes up to the walkway headroom; the caged ladders LD0..LD4 at the west end of the north platforms are the second way (D-030 (1), D-038 (1), review 2026-10-21-layout#11, ASSUMED)"
  # ---- transformer yard west of B2 (D-038 (7)): oil-filled ONAN transformers in bunded bays,
  # a fire wall FW-TR between them (layout/structures.yaml), B2's west wall REI 90 behind them,
  # access and transformer exchange from the west road R4 (all ASSUMED, electrical engineer)
