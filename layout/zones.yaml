    kind: keep_clear
    shape: box
    box: [13.0, 50.5, 0, 19.0, 56.2, 4.5]
    basis: "Transformer ~4.5 x 3.5 m, 4 m high, plus a 0.75 m bund all round; 1 m from the R4 road edge for the low-loader; IEC 61936-1 practice (fire wall to the neighbour transformer, fire-rated building wall within 5 m), ASSUMED (D-038 (7))"
