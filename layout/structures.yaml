# Steel structures and walls. Schema: `plantcode schema structures`. Coordinates m, site frame;
# levels, extents, ladders in the frame's own coordinates from its origin (south-west corner).
# All sizes ASSUMED at basic engineering (structural design in detail engineering); member
# sections are plantcode's defaults by span. Basis in DESIGN.md D-026 and D-030.
structures:
  - id: CB-1
    title: "Cold box: steel frame with casing around C-3101/C-3102, E-3101 and E-3102"
    origin: [126, 38]
    spans_x: [6, 5, 4]          # west bay: column stack; middle bay: E-3101; east bay: E-3102, ladders
    spans_y: [9]
    levels:
      # access platforms cantilevered OUTSIDE the north casing face (wall 0.2 m, frame y 9.0 ..
      # 9.2), 1.5 m wide, where the lines, valves and instruments leave the casing; nobody
      # stands inside the perlite-filled, purged casing (D-038 (1), review4#1)
      - {id: P10, title: "Access platform 10 m outside the north casing face", elevation: 10, kind: platform, extent: [0, 9.2, 15, 10.7]}
      # E-3102 support deck inside the casing: steel only, no walking level (accepted, D-038 (1))
      - {id: E20, title: "E-3102 support deck inside the casing (no access in operation)", elevation: 20, kind: platform, extent: [11, 2, 15, 7.2]}
      - {id: P20, title: "Access platform 20 m outside the north casing face", elevation: 20, kind: platform, extent: [0, 9.2, 15, 10.7]}
      - {id: P30, title: "Access platform 30 m outside the north casing face", elevation: 30, kind: platform, extent: [0, 9.2, 15, 10.7]}
      - {id: P40, title: "Access platform 40 m outside the north casing face", elevation: 40, kind: platform, extent: [0, 9.2, 15, 10.7]}
      - {id: RF, title: "Roof walkway on the casing roof (D-026: ~50 m columns + ~3 m above)", elevation: 53, kind: platform, extent: [0, 7.2, 15, 9]}
      # relief valve platform south of the walkway, off the way to the ladders (D-033 (1))
      - {id: RV, title: "Relief valve platform PSV-3114 / PSV-3116 on the casing roof, joins RF", elevation: 53, kind: platform, extent: [0.5, 3.5, 6.5, 7.2]}
      # access strip from the east end of RF along the east roof edge to the casing breather
      # PSV-3123 at the south-east corner (frame [14, 1]): inspection, test and replacement of
      # the breather, entered only under the purge isolation and permit of D-031 (no N2
      # outflow at the breather), with a personal O2 monitor; it ends 0.6 m from the breather
      # inside its 5 m zone Z-N2-CASING by necessity, and is no way down (D-044 (6),
      # review6#9)
      - {id: RB, title: "Breather access strip on the casing roof, joins RF (entered under purge isolation only)", elevation: 53, kind: platform, extent: [13.8, 1.6, 15, 7.2]}
      - {id: RF-out, title: "Landing outside the casing at 53 m (north side, joins RF, RV)", elevation: 53, kind: platform, extent: [0, 9.2, 15, 10.7]}
    # east and south faces braced; west and north faces carry the pipe penetrations and rely on
    # the stiffened casing panels (ASSUMED, structural design to confirm)
    bracing: {east: x, south: x, west: none, north: none}
    # stair tower outside the north platforms (east end, x 134.7 .. 140.5), standing out
    # 1.7 m from the casing side (the wall 0.2 m plus the platform 1.5 m), so its flights rise
    # beside the platforms, not on them: the platform in front of the hatch H1 and the walk
    # from one flight to the next stay clear (D-039 (1), review5#3, #7); originally pinned
    # from the build's proposals: from grade to every platform and to the roof landing
    # RF-out, which joins the roof walkway RF over the casing wall top; the floors at 20 m and
    # above are entered for valves, analysers and the relief valves, with tools, and the
    # oxygen-deficient roof needs a quick way down (D-033 (6), D-038 (1))
    stairs:
      - {id: ST1, from: grade, to: P10, side: north, offset: 0.5, width: 0.9, out: 1.7}
      - {id: ST2, from: P10, to: P20, side: north, offset: 0.5, width: 0.9, out: 1.7}
      - {id: ST3, from: P20, to: P30, side: north, offset: 0.5, width: 0.9, out: 1.7}
      - {id: ST4, from: P30, to: P40, side: north, offset: 0.5, width: 0.9, out: 1.7}
      - {id: ST5, from: P40, to: RF-out, side: north, offset: 0.5, width: 0.9, out: 1.7}
    # caged ladders at the west end of the north platforms, 13 m from the stair: the second way
    # down from every platform and the roof, offset 1 m between flights (D-030 (1), D-038 (1))
    ladders:
      - {id: LD0, from: grade, to: P10, at: [0.5, 10.2], facing: north}
      - {id: LD1, from: P10, to: P20, at: [1.5, 10.2], facing: north}
      - {id: LD2, from: P20, to: P30, at: [0.5, 10.2], facing: north}
      - {id: LD3, from: P30, to: P40, at: [1.5, 10.2], facing: north}
      - {id: LD4, from: P40, to: RF-out, at: [0.5, 10.2], facing: north}
    enclosure:
      walls: all
      height: 53
      material: casing
      openings:
        # access hatch for the JT valves LV-3101 / FV-3106 (extended bonnets, actuators at the
        # hatch), 0.4 m inside the north wall above P20 (D-038 (3), review4#3)
        - {id: H1, side: north, offset: 2.1, width: 1.2, height: 1.2, sill: 20.3, kind: hatch}
        # the casing penetration schedule: one sleeve per line leaving the casing, from the
        # build's penetrations (plantcode layout pin CB-1/<line>), sizes the pipe plus
        # clearance (review3#6, D-039 (9)); the sleeve and bellows details are the cold box
        # vendor's
        - {id: AIR-3002, side: south, offset: 10, width: 0.4, height: 0.4, sill: 8.8, kind: opening}
        - {id: AIR-3003, side: south, offset: 8.35, width: 0.3, height: 0.3, sill: 1.35, kind: opening}
        - {id: AIR-3004, side: south, offset: 2.25, width: 0.5, height: 0.5, sill: 1.25, kind: opening}
        - {id: GAN-4001, side: north, offset: 7.7, width: 0.4, height: 0.4, sill: 12.2, kind: opening}
        - {id: GOX-4001, side: north, offset: 6.55, width: 0.7, height: 0.7, sill: 12.3, kind: opening}
        - {id: LIN-3001, side: east, offset: 7.65, width: 0.3, height: 0.25, sill: 5.3, kind: opening}
        - {id: LOX-3001, side: north, offset: 11.85, width: 0.3, height: 0.3, sill: 12.15, kind: opening}
        - {id: UN-3001, side: north, offset: 9.8, width: 0.2, height: 0.25, sill: 8.9, kind: opening}
        - {id: WN-3002, side: north, offset: 6.45, width: 1.1, height: 1.05, sill: 5, kind: opening}
        - {id: AIR-2002, side: north, offset: 7.75, width: 0.65, height: 0.65, sill: 7.95, kind: opening}
    notes: >-
      Casing 15 x 9 m, 53 m high (C-3101 20 m + C-3102 30 m stacked and the top nozzle piping
      inside, D-026), perlite filled and N2 purged (PV-3113, breather PSV-3123 / VNT-3004). The
      relief valves PSV-3114 / PSV-3116 stand on the relief valve platform RV south of the roof
      walkway, their tailpipes rising above the walkway headroom plus their zone radius
      (piping/routing.yaml vents, D-033). Nobody stands inside the casing: the access
      platforms P10..P40 are cantilevered outside the north face, where the lines leave the
      casing, with a stacked stair ST1..ST5 at their east end up to the roof landing RF-out
      and caged ladders LD0..LD4 at their west end (two ways down from every platform and the
      roof; O2-deficient vents near the roof, D-011, D-038 (1)). Toppling radius 53 m, the casing height, kept
      clear of B1 (site-plan separations, D-033 (2)).
  - id: FW-TR
    title: "Fire wall between the transformers TR-1 and TR-2 in the yard west of B2"
    origin: [13, 56.2]
    spans_x: [6]
    spans_y: [0.6]
    levels: []
    enclosure:
      walls: [north]
      height: 5
      material: fire_wall
      thickness: 0.3
    notes: >-
      Reinforced concrete wall 0.3 m (REI 120), 5 m high (above the TR-1 conservator), from the
      B2 west wall to the R4 side of the bays, between the TR-1 and TR-2 oil bunds (IEC 61936-1
      practice, ASSUMED; D-038 (7)).
  - id: FW-4101
    title: "GOX compressor fire / blast wall around K-4101, open to the east"
    origin: [160.5, 24]
    spans_x: [12]
    spans_y: [10]
    levels: []
    enclosure:
      walls: [west, south, north]
      height: 7
      material: fire_wall
      thickness: 0.3
      # fire-rated wall sleeves for the interstage loop to the intercooler package E-4101
      # north of the wall, from the build's penetrations (D-033 (4)); the GOX suction GOX-4001
      # comes over the wall onto the top nozzle and needs none
      openings:
        - {id: SL1, side: north, offset: 8.25, width: 0.5, height: 0.45, sill: 3.45, kind: opening}  # GOX-4005 to E-4101
        - {id: SL2, side: north, offset: 4.35, width: 0.45, height: 0.45, sill: 3.45, kind: opening} # GOX-4005 back from E-4101
    notes: >-
      Reinforced concrete wall 0.3 m, 7 m high (K-4101 5 m), on three sides; the open east side
      faces away from the cold box, the rack and the road R1 (EIGA Doc 27 practice for oxygen
      compressors, ASSUMED; D-012, D-026).
  # ---- valve access platforms (D-047): from the build's proposals (VP-n), adapted so that
  # nothing stands in them: a floor at most 1.8 m below the handwheel and within 0.6 m of it in
  # plan; below 6 m a caged ladder, from 6 m a stair whose top landing meets the platform; the
  # stair side chosen so no pipe runs through the flights or less than 2.1 m over a landing;
  # the platform shifted or cut so no pipe passes through a column. Every size ASSUMED (the
  # structural and piping detail design confirms them). The routes of the valves' lines are
  # pinned in piping/routing.yaml, so the valves stay where the platforms reach them.
  # waste N2 vent valve PV-3110B on WN-3003 at the cold box: floor 5.6 m (handwheel 7.4 m),
  # extended west so its ladder stands 1.2 m clear of the CW-3001 riser
  - {id: VP-1, title: "valve access platform for PV-3110B", origin: [131.0, 60.3], spans_x: [1.95], spans_y: [2.0], levels: [{id: P1, elevation: 5.6, kind: platform, use: occasional}], ladders: [{id: ladder-to-P1, from: grade, to: P1, at: [0.4, 0.4], facing: north}], serves: [P-03/PV3110B]}
  # GOX vent valve PV-4101B on the PR1 south edge: cut to 1.6 m so its columns stay south of the
  # UN-3001 lane
  - {id: VP-2, title: "valve access platform for PV-4101B", origin: [155.42, 63.77], spans_x: [1.2], spans_y: [1.6], levels: [{id: P1, elevation: 10.16, kind: platform, use: occasional}], stairs: [{id: stair-to-P1, from: grade, to: P1, side: east, offset: -4.236}], serves: [P-04/PV4101B]}
  # GOX compressor suction ESD valve XV-4117 on the drop to K-4101
  - {id: VP-3, title: "valve access platform for XV-4117", origin: [160.45, 46.95], spans_x: [1.2], spans_y: [2.0], levels: [{id: P1, elevation: 9.95, kind: platform, use: occasional}], stairs: [{id: stair-to-P1, from: grade, to: P1, side: west, offset: -4.853}], serves: [P-04/XV4117]}
  # GOX product riser: the GOX vent ESD valve XV-4116 and the bypass valve HV-4129 share one
  # 7.2 m walkway west of the GOX-4002 run at 8.65 m (two proposals, one stair)
  - {id: VP-4, title: "valve access platform for XV-4116 and HV-4129", origin: [178.92, 52.01], spans_x: [1.2], spans_y: [7.19], levels: [{id: P1, elevation: 8.65, kind: platform, use: occasional}], stairs: [{id: stair-to-P1, from: grade, to: P1, side: west, offset: 0}], serves: [P-04/XV4116, P-04/HV4129]}
  # GOX battery limit: the DBB bypass valve HV-4130
  - {id: VP-5, title: "valve access platform for HV-4130", origin: [172.39, 62.34], spans_x: [2.0], spans_y: [1.2], levels: [{id: P1, elevation: 8.35, kind: platform, use: occasional}], stairs: [{id: stair-to-P1, from: grade, to: P1, side: east, offset: -4.217}], serves: [P-04/HV4130]}
  # GAN battery limit: the ESD valve XV-4134 and the bleed valve XV-4135 on the risers, floor
  # 5.9 m (handwheels 7.4 / 7.5 m) with a caged ladder (was proposed at 6.33 m with a stair)
  - {id: VP-6, title: "valve access platform for XV-4134, XV-4135", origin: [170.22, 61.15], spans_x: [1.26], spans_y: [1.5], levels: [{id: P1, elevation: 5.9, kind: platform, use: occasional}], ladders: [{id: ladder-to-P1, from: grade, to: P1, at: [0.4, 0.4], facing: south}], serves: [P-04/XV4134, P-04/XV4135]}
  # GOX compressor anti-surge valve UV-4103 on the recycle GOX-4003
  - {id: VP-7, title: "valve access platform for UV-4103", origin: [182.37, 35.12], spans_x: [2.0], spans_y: [1.2], levels: [{id: P1, elevation: 9.51, kind: platform, use: occasional}], stairs: [{id: stair-to-P1, from: grade, to: P1, side: east, offset: -4.678}], serves: [P-04/UV4103]}
  # PR3 backup GOX / GAN pressure valves PV-4111 / PV-4112, west of the rack (shifted 0.3 m west
  # and 0.6 m south of the proposals, clear of the VNT-4003 lane); floor 8.6 m, above the PR3
  # 8.5 m edge stringers (D-048), the handwheels 0.5 m above the grating
  - {id: VP-8, title: "valve access platform for PV-4111", origin: [179.7, 76.62], spans_x: [1.2], spans_y: [2.0], levels: [{id: P1, elevation: 8.6, kind: platform, use: occasional}], stairs: [{id: stair-to-P1, from: grade, to: P1, side: west, offset: -4.316}], serves: [P-04/PV4111]}
  - {id: VP-9, title: "valve access platform for PV-4112", origin: [179.91, 84.54], spans_x: [1.2], spans_y: [2.0], levels: [{id: P1, elevation: 8.6, kind: platform, use: occasional}], stairs: [{id: stair-to-P1, from: grade, to: P1, side: west, offset: -4.316}], serves: [P-04/PV4112]}
